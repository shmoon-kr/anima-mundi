# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 120.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:120:room:12000":
  name: Rome Zone Description Room
  description:
    preformatted: |2
         Builder   : Onivel of JediMUD
      Zone         : 120 Rome
      Began        : ?
      Player Level : 4-34
      Rooms        : 68
      Mobs         : 39
      Objects      : 37
      Shops        : 6
      Triggers     : 4
      Theme        : Ancient Rome
      Zone 120 is linked to the following zones:
       50 Great Eastern Desert           at 12068 (east ) --->  5028
  sector: inside

"tba:120:room:12001":
  name: The Judging Booth
  description: >
    You stand in the midst of a small room with windows on the east and south walls.  These windows
    provide a complete view of the competition fields. There are several scorecards, pencils and other items
    that are used by the judges sitting on a table.  The only exit is a trapdoor leading down.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:120:room:12002
      look: There is a rickety ladder leading down.
      door:
        keywords: [trapdoor]
        kind: door
        key: tba:120:obj:12033
        reset: locked
  extras:
  - keywords: [pencils, pencil]
    text: >
      An ordinary #2 lead pencil.  Judging by the teeth marks on the shaft, the user should see a dentist
      very soon!
  - keywords: [scorecards]
    text: >
      The cards all have been filled in with the judges evaluations of today's combatants.  It seems that
      Sparticus is having a good day.

"tba:120:room:12002":
  name: Caesar's Private Box
  description: >
    This is the best view in the house!  You can see gladiators fighting or the chariot races with an
    unobstructed view.  The seats are upholstered in red velvet and are in top-notch condition.  There is
    a rickety ladder leading up and a marble staircase leading down.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    up:
      to: tba:120:room:12001
      look: You see a rickety ladder with a trapdoor leading up.
      door:
        keywords: [trapdoor]
        kind: door
        key: tba:120:obj:12033
        reset: locked
    down:
      to: tba:120:room:12003
      look: There is a marble staircase leading down.

"tba:120:room:12003":
  name: The West Side Of The Commoner's Seating Area
  description: >
    This is the western side commoner's seating area.  There are row upon row of rough wooden benches
    bolted to the floor.  There is stadium garbage everywhere and the smell makes you want to puke. 
    Stairs lead up to Caesar's private box, a small ramp leads down to the playing field and a hallway leads
    south.
  sector: city
  exits:
    south:
      to: tba:120:room:12004
      look: You see a small hallway that leads to a larger area.
    up:
      to: tba:120:room:12002
      look: Watch your step!
    down:
      to: tba:120:room:12010
      look: Watch your step!
  extras:
  - keywords: [seats, benches]
    text: >
      The benches are made of rough cut lumber that has dried and split over time. You would probably get
      splinters if sat on them.  The words 'BURT WAS HERE' have been carved into one of the benches with
      exquisite care.

"tba:120:room:12004":
  name: The Southern Commoner's Seats
  description: >
    This is the southeastern part of the common seating areas.  The benches here are made of stone and
    are probably centuries old.  A few scratches on one of the benches catch your eye.  An acrid smell is
    coming from the east and a tunnel leads off to the north.
  sector: city
  exits:
    north:
      to: tba:120:room:12003
      look: The tunnel looks like it leads to another seating area.
    east:
      to: tba:120:room:12011
      look: There is an acrid smell coming from that direction.
  extras:
  - keywords: [marks, scratches]
    text: They look like they form the words "Onivel Cinemod Semaj" But you could be mistaken.

"tba:120:room:12005":
  name: The Abandoned Gate
  description: >
    This used to be a gateway to and from western Rome.  There is an iron gate blocking your way and
    judging by the amount of rust and foliage growing on the bars, it hasn't been open for years.  Looking
    through the gate at the barren landscape that lies beyond, you can see why.  A dirt road leads off to
    the east, and a store is directly south.
  sector: city
  exits:
    east:
      to: tba:120:room:12012
      look: Through the clouds of dust, you can make out a passable road.
    south:
      to: tba:120:room:12006
      look: You can barely make out a storefront through the foliage.
    west:
      look: >
        The gate has been permanently rusted shut and is further secured by a large chain and padlock. 
        Don't even bother THINKING about trying to open it.
      door:
        keywords: [gate]
        kind: pickproof
        reset: locked
  extras:
  - keywords: [gate]
    text: >
      The gate has been permanently rusted shut and is further secured by a large chain and padlock. 
      Don't even bother THINKING about trying to open it.

"tba:120:room:12006":
  name: Swords 'R  Us
  description: >
    Welcome to the weaponshop of Titus Andronicus!!  Rare halberds, whips, swords and other instruments
    of death are proudly displayed on the walls and in gleaming glass cases.  More common weapons are
    stacked like wood on the floor.  To the north you can barely make out a gate.  There is a very secure
    looking door to the south.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    north:
      to: tba:120:room:12005
      look: You can see a city gate to the north.
    south:
      to: tba:120:room:12007
      look: There is a very secure looking door blocking your progress.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:120:obj:12034
        reset: locked
  extras:
  - keywords: [swords, weapons, armor, halberds, whips]
    text: >
      Titus has enough hardware in here to outfit a large army.  Maybe that's why he has a lucrative
      contract to sell weapons to the Emperor's armies for outrageous prices.

"tba:120:room:12007":
  name: The Back Room
  description: >
    If you thought that there were a lot of weapons in the front of the store, you haven't seen
    anything yet!!  There is barely enough room to walk amongst the crates of armor and swords.  No wonder Rome
    will stand for a thousand years.  The only exit is through a door to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:120:room:12006
      look: Through the piles of weapons, you can see a door leading north to the rest of the store.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:120:obj:12034
        reset: locked
  extras:
  - keywords: [weapons, swords, crates, armor, weapon, sword, crate]
    text: There are literally thousands of each.  Take your pick.

"tba:120:room:12008":
  name: Peanut Heaven
  description: >
    You are now so high up that you begin to feel lightheaded and your nose feels like it is going to
    start bleeding.  There aren't even benches to sit on here; just bare dirty stone.  The view of the
    surrounding country is spectacular.  Unfortunately you can barely see the playing field.  There is a set
    of steps here, leading down.
  sector: city
  exits:
    down:
      to: tba:120:room:12015
      look: Watch your step!
  extras:
  - keywords: [landscape, country]
    text: >
      You can see the entire city of Rome from here.  The buildings housing the Roman government are to
      the east.  To the south east, off in the distance, is the massive aqueduct and further in that
      direction lies the Mountain of the Gods.

"tba:120:room:12009":
  name: The Practice And Warm-up Area
  description: >
    There are many gladiators, chariot drivers and their coaches here, warming up in preparation for
    the games.  The dust rising from the parched earth makes you want to sneeze.  A short tunnel leads east
    and the thunder of pounding hooves and the clash of weapons can be heard coming from the south.
  sector: field
  exits:
    east:
      to: tba:120:room:12016
      look: There is a large oval dirt-track in that direction.
    south:
      to: tba:120:room:12010
      look: You can hear the clash of weapons and the thunder of hooves in that direction.
  extras:
  - keywords: [coach, trainer]
    text: The coach tell you "Stop bothering my athletes and get lost!  "
  - keywords: [chariot]
    text: >
      You see a two wheeled open cart which is obviously meant to be pulled by horses.  The flaming
      paint-job and the large '01' stenciled on the side identify the chariot as belonging to Drucilis
      'Lightning-whip' Octavious, a favorite driver of the masses.
  - keywords: [driver]
    text: The driver is too busy changing a wheel on his chariot to notice you.
  - keywords: [gladiator]
    text: >
      He is a big muscular man with lots of armor.  He sizes you up and decides that you aren't worth his
      time or trouble.

"tba:120:room:12010":
  name: The Jousting Arena
  description: >
    This is a wide open grassy plane... LOOK OUT!!!!  You are almost skewered by a gladiator's lance as
    he makes his charge.  A practicing area is due north.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:120:room:12009
      look: Through a small tunnel you can see athletes stretching and warming up for the games.
    up:
      to: tba:120:room:12003
      look: You see a set of steps leading up into the spectator stands.
  extras:
  - keywords: [gladiator]
    text: >
      He is in the final stages of a charge against his opponent...  THUD!  CLANG! CRASH!!!!...  Judging
      from the blood and the amount of distance that now separates the gladiators head from the rest of his
      body, you can safely assume that this was the final combat of his life.

"tba:120:room:12011":
  name: The First-Aid Station
  description: >
    This is the place to come to if one is overcome by the heat and gore. (Or if a lion gets loose) 
    You see a jar of live leeches and other barbaric medical apparati lying about here.  From the west
    comes the roar of the crowd, and a hall leads east.  The healer will be with you shortly.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:120:room:12018
      look: You see hundreds, perhaps thousands of people.
    west:
      to: tba:120:room:12004
      look: Rows of stone bleachers lie to the west.
  extras:
  - keywords: [leech, leeches]
    text: >
      DISGUSTING!  Each is about the size of matchbox and very slimy.  You are VERY glad that you have
      access to a cleric!

"tba:120:room:12012":
  name: A Dirt Road
  description: >
    You are on a parched and dusty rural road which runs east and west.  There is a structure lying to
    the south.
  sector: field
  exits:
    east:
      to: tba:120:room:12019
      look: Through the dust, you see a paved road.
    south:
      to: tba:120:room:12013
      look: It is difficult to see through the haze and dust.
    west:
      to: tba:120:room:12005
      look: It is difficult to see through the haze and dust.

"tba:120:room:12013":
  name: The Commoner's House
  description: >
    You are standing in the main living quarters of a common Roman citizen. The furnishings are sparse
    and it is warm here.  A putrid odor is coming from the east and passages lead north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12012
      look: A dusty road lies to the north.
    east:
      to: tba:120:room:12020
      look: What is that smell??!!!  It is enough to make a yak gag!!!
    south:
      to: tba:120:room:12014
      look: You hazard a guess that a bedroom lies in that direction.
  extras:
  - keywords: [furnishings, furniture]
    text: >
      The furniture that you see is very simple and plain.  It is made of rough hewn wood and fastened
      together with nails.  It looks very uncomfortable.

"tba:120:room:12014":
  name: The Bedchamber
  description: >
    This is the bedroom.  There is a hard and lumpy bed in the far corner. It looks like the commoner's
    wife has been shirking her duties lately, as there is a big pile of soiled laundry here.  The only
    way out is from where you came.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:120:room:12013
      look: You see the living quarters to the north.
  extras:
  - keywords: [laundry, wash, clothing]
    text: It smells of sweat and is covered with mud.

"tba:120:room:12015":
  name: The Noblemans' Box
  description: >
    These are the 'better' seats used primarily by the upper class of Rome. There is a large seating
    area to the east and a staircase leading up here.  The view of the chariot track is pretty good.
  sector: inside
  exits:
    east:
      to: tba:120:room:12022
      look: Rows upon rows of bleachers lie to the east.
    up:
      to: tba:120:room:12008
      look: The stairs look safe enough.

"tba:120:room:12016":
  name: The Race Track
  description: >
    This is a hard dirt track about a quarter of a mile long.  There are hoof prints everywhere, and
    you see a large cloud of dust approaching.  You had better move before you get run over.  A small
    tunnel leads west, you can see the crowd to the east.  You can hear loud snarls and roars coming from
    below.
  sector: field
  exits:
    west:
      to: tba:120:room:12009
      look: You see athletes warming up and stretching.
    up:
      to: tba:120:room:12023
    down:
      to: tba:120:room:12017
      look: Do you like lots of live lions that haven't been fed for a few days?

"tba:120:room:12017":
  name: The Lion Pit
  description:
  - >
    As you land at the bottom of this dirt-walled pit, the realization that a pit full of lions is NOT
    a good thing to be hanging around in.  Several of the gladiators gather around the edge of the pit to
    watch your demise.  You look around you, and all you see is tawny fur and gaping jaws... it is too
    late to run, too late to hide.
  - >
    Twelve lions rip you and your belongings into a gory mass of bloodied leather, bronze, and bone.
  - What's that old saying?
  - Cats killed the curious?  Something like that, I'm sure...
  sector: inside
  flags: [no_mob, indoors]
  triggers: [tba:120:trg:12000]

"tba:120:room:12018":
  name: The South Entrance To The Coliseum
  description: >
    You are standing at the south entrance to the Coliseum.  There are citizens of Rome everywhere,
    apparently in a mad rush to get in.  A statue of Caligula the Mad Emperor overlooks the area.  There are
    long lines standing to the east, and an acrid smell is coming from the west. A busy road lies to the
    south.
  sector: city
  flags: [no_mob]
  exits:
    east:
      to: tba:120:room:12025
      look: The lines are very long and people look impatient.
    south:
      to: tba:120:room:12019
      look: A road lies in that direction.
    west:
      to: tba:120:room:12011
      look: An acrid, almost medicinal smell is coming from that direction.
  extras:
  - keywords: [statue, caligula]
    text: >
      A larger than life stone statue of Caligula, the Mad Emperor, looks at you. It looks like it is
      holding a phallus.  He has got a grin on his face that seems to say 'My horse would like you, I bet...  '

"tba:120:room:12019":
  name: The Main Highway
  description: >
    This is a well built and heavily traveled road running from east to west and there is a large
    structure built entirely of stone to the north.
  sector: city
  exits:
    north:
      to: tba:120:room:12018
      look: You can hear the roar of a large crowd of people coming from that direction.
    east:
      to: tba:120:room:12026
      look: The highway continues to the east.
    west:
      to: tba:120:room:12012
      look: The highway continues to the west.

"tba:120:room:12020":
  name: The Outhouse
  description: >
    PEEEEEEEEEEEEEEEE-YEEEEEWWWWWWWW!!!!!  Boy does it stink in here!!!  You taste bile in your mouth
    and your eyes begin to water.  As you wipe away your tears, you see that this is a small room, in the
    far corner of which a hole is dug.  The odor intensifies as you move closer and there is a roll of
    toilet paper sitting on the ground.  The only exit is to the west and your nose and stomach are
    strongly suggesting that you use it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:120:room:12013
      look: >
        The living quarters lie in that direction.  Why don't you stop pussyfooting around and go that
        way??!!  Please?
  extras:
  - keywords: [roll, paper]
    text: >
      Hey!!  This is first-class stuff!!  - White Cloud brand with lotion.  The roll is about half-used.
  - keywords: [hole, toilet]
    text: >
      You walk over to the hole and see that there is a large turd floating in a pool black water about 2
      feet below the surface of the ground.  As you lean closer to get a better look, your nose catches a
      concentrated dose of the fragrant aroma wafting upwards.  Your stomach decides that it has had enough
      of this shoddy treatment and you puke until it is empty.

"tba:120:room:12021":
  name: The Slave Quarters
  description: >
    This is where the slaves sleep.  There are hard boards set out for use as beds and not much else. 
    The only exit is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12027
      look: To the east, a well manicured path winds through the nobleman's estate.

"tba:120:room:12022":
  name: The Common Seating
  description: >
    This is where many of the common Roman citizens are seated during the games.  These are the
    cheapest seats in the house, as glare from the sun is usually a problem during the afternoon.  Like the
    other common seating areas, this place could stand extensive renovation and a thorough cleaning. This
    area extends to the south and a much more elegant seating area can be seen to the west.
  sector: city
  exits:
    south:
      to: tba:120:room:12023
      look: The common seating area continues.
    west:
      to: tba:120:room:12015
      look: The seating gets much fancier and elegant in that direction.

"tba:120:room:12023":
  name: The Common Seating
  description: >
    This is where many of the common Roman citizens are seated during the games.  Like the other
    commoners' areas in the coliseum, it could use extensive renovation and cleaning.  This area extends to the
    north and lots of noise can be heard coming from the south.
  sector: city
  exits:
    north:
      to: tba:120:room:12022
      look: The common seating area continues.
    south:
      to: tba:120:room:12024
      look: You see hundreds, perhaps thousands of people.

"tba:120:room:12024":
  name: The East Entrance To The Coliseum
  description: >
    You are standing at the east entrance to the Coliseum.  There are people everywhere, apparently in
    a mad rush to get in.  A statue of Tiberius, an Emperor of a time long since passed, stands here
    looking out over the crowd. There is a passage to the north, the ticket booth is to the south and a gate
    opening to the city lies to the east.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:120:room:12023
      look: You see rows upon rows of dilapidated wooden bleachers.
    east:
      to: tba:120:room:12031
      look: Nero Drive lies in that direction.
    south:
      to: tba:120:room:12025
      look: There are VERY long lines standing outside the ticket booth.
  extras:
  - keywords: [statue, tiberius]
    text: The statue of Tiberius, made of iron, stands here.

"tba:120:room:12025":
  name: The Ticket Booth
  description: >
    Long lines are standing here, waiting to buy tickets.  There are three vendors working furiously. 
    Ticket stubs litter the ground and you can see that the people are getting very impatient.  There is
    a large, open cashbox here.  Main entrances to the Coliseum are to the north and west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12024
      look: You see hundreds, if not thousands of people.
    west:
      to: tba:120:room:12018
      look: You see hundreds, if not thousands of people.
  extras:
  - keywords: [cashbox]
    text: >
      It is a shame that the exchange rate for Roman money is so low.  What amounts to a fortune in Rome
      isn't even worth one gold coin.  The contents of the box add up to about...  Well forget it.  It
      isn't worth your time or trouble to carry it around.

"tba:120:room:12026":
  name: A Paved Road
  description: >
    You are on a paved road that runs east to west.  You can see an elaborate looking estate to the
    south and to the north-west, off in the distance, you can see a very large stone structure.
  sector: city
  exits:
    east:
      to: tba:120:room:12033
      look: The road leads off to the east.
    south:
      to: tba:120:room:12027
      look: It looks like a Nobleman's estate.  We are talking RICH nobleman's estate.
    west:
      to: tba:120:room:12019
      look: The road leads west towards the highway.
  extras:
  - keywords: [structure]
    text: That would probably be the Coliseum.  There are a few good matches scheduled for today.

"tba:120:room:12027":
  name: A Noble Estate
  description: >
    You are on the grounds of a nobleman's estate which is hundreds of times the size and splendor of
    anything that a common citizen of Rome would ever hope to own.  Everything is lush and green.  The
    grass is perfectly manicured and the trees are all bearing fruit.  Ornamental plants are in perfectly
    situated to enhance and adorn the three statues of dedicated to gods Jupiter, Venus and Neptune.  A
    tranquil path leads east and west, there is a paved road to the north and an extravagant house lies to
    the south.
  sector: field
  exits:
    north:
      to: tba:120:room:12026
      look: You see a paved road in the distance.
    east:
      to: tba:120:room:12034
      look: The path leads east through the estate.
    south:
      to: tba:120:room:12028
      look: You see an incredible house off in the distance.
    west:
      to: tba:120:room:12021
      look: Off through the trees, you see a small, plain hut.
  extras:
  - keywords: [trees, tree, shrubs, shrub, plants, plant]
    text: >
      All of the plants, trees and shrubs are perfectly trimmed, without so much as a dead leaf anywhere
      to be seen.  You welcome the shade that they give from the harsh sun above.
  - keywords: [Neptune]
    text: >
      The statue of Neptune is made of pure jade and is holding a crystal trident. It is sitting in the
      center of a small pond which has hundreds of beautiful fish swimming in it.
  - keywords: [Jupiter]
    text: >
      A statue made of pure gold depicts Jupiter sitting on his throne.  The throne looks like it is made
      of silver.
  - keywords: [Venus]
    text: Venus, the Roman goddess of beauty and knowledge is displayed in a all of her splendor.

"tba:120:room:12028":
  name: An Opulent House
  description: >
    You stand in a house, the size and splendor of which almost defies the imagination.  The floor is
    done with hand crafted marble tile with silver and jeweled inlays.  The light coming through the
    exquisitely crafted stained glass windows bathes the room in splendor and the furniture looks as though it
    was made by master craftsmen from all over the empire.  A path through the estate is north of here.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:120:room:12027
      look: You see a well manicured path that winds through the estate.
  extras:
  - keywords: [furniture]
    text: >
      You hope to eventually be able to own a piece of furniture just like these someday.  These are only
      dreams, of course.
  - keywords: [windows]
    text: They are intricate and the scenes that they depict cast honor on several of the gods.
  - keywords: [floor, tile]
    text: >
      Very expensive!  A lot of master craftsmen labored long and hard to produce such a work of art.

"tba:120:room:12029":
  name: The Great North Gate
  description: >
    This is the northern gateway to the city of Rome.  The huge gate appears to be closed and locked
    against intrusion.  A large road muddy road runs through the gate and into the countryside.  Nero Drive
    runs south from here.
  sector: city
  exits:
    north:
      look: The gate is made of solid iron and is well maintained.
      door:
        keywords: [gate]
        kind: pickproof
        reset: locked
    south:
      to: tba:120:room:12030
      look: Nero Drive continues in that direction.
  extras:
  - keywords: [road]
    text: The road is wide and very muddy.
  - keywords: [gate]
    text: The gate is made of solid iron and is well maintained.

"tba:120:room:12030":
  name: Nero Drive
  description: >
    You are walking on a paved road that runs south through the city of Rome. A great gate is directly
    north of here.  The Roman citizens are very friendly and tip their hats or say hello as you pass.
  sector: city
  exits:
    north:
      to: tba:120:room:12029
      look: To the north, you can see a gate leading out of the city.
    south:
      to: tba:120:room:12031
      look: Nero Drive continues in that direction.
    west:
      to: tba:120:room:12062
      look: You see the bakery of Rome.

"tba:120:room:12031":
  name: Nero Drive
  description: >
    You are walking on a great paved road that runs north and south through the city.  People are
    hurrying from one place to another, but always stop to say hello.  Most of the people are either coming
    from or going to the town square.  Nero Drive continues to the north, and you can see a large open area
    to the south.
  sector: city
  exits:
    north:
      to: tba:120:room:12030
      look: Nero drive continues in that direction.
    south:
      to: tba:120:room:12032
      look: It looks like the town square.
    west:
      to: tba:120:room:12024
      look: You see the an opulent estate.

"tba:120:room:12032":
  name: The Town Square
  description: >
    You are standing in the middle of a large open area which is the common area of Rome.  During the
    day, this place is alive with the hustle and bustle of all of the citizens of Rome and everyone in the
    city is sure to stop by at some time or another.  There are several street vendors peddling their
    wares and the overall atmosphere is carnival-like in nature.  To the southeast, off in the distance,
    you can see the aqueduct and the buildings of the Roman government lie to the northwest.  Nero Drive
    leads north and south from here and Clay Avenue runs east.
  sector: city
  exits:
    north:
      to: tba:120:room:12031
      look: Nero Drive heads in the direction of the northern gate.
    east:
      to: tba:120:room:12039
      look: Nero Drive heads in the direction of the south gate.
    south:
      to: tba:120:room:12033
      look: >
        A street made of hard packed clay runs in that direction towards the aqueduct and buildings of the
        Roman government.
  extras:
  - keywords: [aqueduct]
    text: >
      To the southeast, off in the distance, stands a large stone structure that is used to channel water
      into the city.
  - keywords: [vendor, vendors]
    text: >
      There are several sidewalk vendors here, selling fresh fruits and vegetables, home baked goods,
      fine jewelry and other items.  Most of the items for sale are of very high quality.

"tba:120:room:12033":
  name: Nero Drive
  description: >
    You are walking on a paved road that runs north and south through the city of Rome.  There are many
    people here, as polite as always.  Most of them are either coming from or going to the town square
    which lies to the north.  Nero Drive continues to the south.  There is an observation area overlooking
    the aqueduct to the east and a paved road leads west.
  sector: city
  exits:
    north:
      to: tba:120:room:12032
      look: The town square lies in that direction.
    east:
      to: tba:120:room:12040
      look: The aqueduct and mountain of the gods are in that direction.
    south:
      to: tba:120:room:12034
      look: Nero Drive continues toward the South Gate.
    west:
      to: tba:120:room:12026
      look: A paved road runs west through the city.

"tba:120:room:12034":
  name: Nero Drive
  description: >
    This is a busy paved road that runs north through the city.  The people of Rome are very friendly
    and say hello as you pass.  A gate leading out of the city lies to the south and a small path goes
    west towards a nobleman's estate.  To the east, off in the distance, lies the great mountain.  It is
    rumored that the Gods watch over and protect the empire from there.
  sector: city
  exits:
    north:
      to: tba:120:room:12033
      look: Nero Drive leads in that direction.
    south:
      to: tba:120:room:12035
      look: >
        You see many people entering and leaving the city through a large gate in the walls protecting the
        city.
    west:
      to: tba:120:room:12027
      look: It looks like a nobleman's estate.  We are talking RICH nobleman's estate.

"tba:120:room:12035":
  name: The South Gate
  description: >
    This is the southern gateway to the city of Rome.  The bronze gate is closed and locked.  Looking
    through the bars, you see a heavily traveled road leading out of the city.  Nero Drive starts here and
    runs north and a wizard's shop lies to the east.
  sector: city
  exits:
    north:
      to: tba:120:room:12034
      look: Nero Drive leads towards the center of town.
    east:
      to: tba:120:room:12042
      look: >
        A small store, from which an occasional detonation can be heard, lies off in that direction.  It
        appears to be surrounded by a rolling pink mist.
    south:
      look: The gate appears to be closed and locked against intruders.
      door:
        keywords: [gate]
        kind: pickproof
        reset: locked
  extras:
  - keywords: [gate]
    text: The gate appears to be closed and locked against intruders.

"tba:120:room:12036":
  name: The Emperor's Private Office
  description: >
    You are standing in the Emperor's private office.  The room is richly furnished with the finest of
    the loot brought back from conquests of far away lands.  There is a massive, intricately carved desk
    here, upon which are important documents, decrees and other paperwork involved in running the
    empire.  On the far wall, there is a marble bookcase that is well stocked with the works of Homer, Plato,
    Socrates and other wise men. Further, it seems that the current Emperor likes flowers as there are many
    potted and cut specimens throughout the room.  There is a french door leading to the waiting room
    and a wooden door to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12043
      look: Through the door, you see a waiting room.
      door:
        keywords: [doors, french]
        kind: pickproof
        key: tba:120:obj:12035
        reset: locked
    south:
      to: tba:120:room:12037
      look: The south door leads directly to the senate chambers.
      door:
        keywords: [door, wooden]
        kind: pickproof
        key: tba:120:obj:12035
        reset: locked
  extras:
  - keywords: [flowers, plants, flower, plant]
    text: The plants contribute to a very relaxing atmosphere.
  - keywords: [bookcase, books]
    text: >
      The books are very old and contain the wisdom of wise men from throughout the entire Roman empire. 
      They appear to be collecting dust.
  - keywords: [documents, decrees, paperwork, document, decree, papers, paper]
    text: >
      The documents are all written on reed scrolls made in Egypt and have been sealed with wax.
  - keywords: [desk]
    text: >
      The desk is made of solid walnut and gold inlay.  It is exquisitely carved with superior
      craftsmanship, the likes of which has rarely been seen.  It was probably brought to Rome from Gaul.

"tba:120:room:12037":
  name: The Senate Chambers
  description: >
    This is the working room where elected senators from all over the empire gather to advise the
    Emperor.  An official seal of the Emperor is hanging on the far wall.  There is a wooden door to the north
    and a bronze door to the east and doublehung door to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12036
      look: The door is made of thick walnut.
      door:
        keywords: [door, wooden]
        kind: pickproof
        key: tba:120:obj:12035
        reset: locked
    east:
      to: tba:120:room:12044
      look: The door leads to the foyer.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:120:obj:12036
        reset: locked
    south:
      to: tba:120:room:12038
      door:
        keywords: [door, doublehung]
        kind: door
        key: tba:120:obj:12037
        reset: locked

"tba:120:room:12038":
  name: The House Of Commons
  description: >
    This is the lower house of the advising body to the Emperor.  Common men from all parts of Rome
    work here to further assist the senators in advising the Emperor on critical matters of state.  The seal
    of the Emperor is painted on the far wall.  The only exit is to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12037
      look: You see that the doublehung door leads to the senate chambers.
      door:
        keywords: [door, doublehung]
        kind: door
        reset: locked

"tba:120:room:12039":
  name: Clay Avenue
  description: >
    You are on a wide well traveled road running east and west through the heart of Rome.  There are
    large crowds of people to the west and the road continues to the east.  The aqueduct is directly south
    of here.
  sector: city
  exits:
    east:
      to: tba:120:room:12046
      look: Clay Avenue continues in that direction.
    south:
      to: tba:120:room:12041
      look: You see an entrance to the aqueduct.
    west:
      to: tba:120:room:12032
      look: There are large crowds of people in that direction.
  extras:
  - keywords: [crowds, people]
    text: >
      It looks like some kind of bizarre or festival is occurring to the west. There are hundreds of
      people of all classes shopping, talking or eating.

"tba:120:room:12040":
  name: The Observation Lookout
  description: >
    You are on a platform overlooking a massive aqueduct.  There is a telescope mounted to the railing
    that surrounds the area and you can hear the gurgle of water as it is channeled into the city.  Off
    in the distance, you can see the Mountain of the Gods. There is a sign mounted to the railing and a
    ramp leads west.
  sector: city
  exits:
    west:
      to: tba:120:room:12033
      look: You can see a busy street in that direction.
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           ********************************************
           *                                          *
           *      The Roman Aquarian and Mountain     *
           *            Observation Platform          *
           *                                          *
           *      Designed and built by the Froboz    *
           *           Magic Platform Company         *
           *                                          *
           ********************************************
  - keywords: [aqueduct]
    text: >
      The aqueduct is a massive stone structure that channels water into Rome from the Mountain of the
      Gods.  During the rainy season, it is filled to the top. However, due to recent drought, the water
      level appears to be very low.
  - keywords: [telescope]
    text: >
      If it were operational, it would offer a spectacular view of the Mountain of the Gods. 
      Unfortunately, it appears to have been vandalized.

"tba:120:room:12041":
  name: The Aqueduct
  description: >
    You are in a massive stone structure that has been designed to channel water into the city of
    Rome.  Due to the recent drought, the water level is low, allowing passage without a boat.  The walls and
    floor are covered with algae and slime producing treacherous footing conditions.  There are exits to
    the north, south and east.
  sector: water_swim
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:120:room:12039
      look: You can see a wide street to the north.
    east:
      to: tba:120:room:12048
      look: You see more aqueduct.
    south:
      to: tba:120:room:12041
      look: You see more aqueduct.
    west:
      to: tba:120:room:12054
      look: You see more aqueduct.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:120:room:12042":
  name: The Mage's Shop
  description: >
    You are standing in the mage's shop.  Magical ointments, charms and potions are sitting on shelves
    and behind a glass counter.  There is a dense neon blue fog hugging the floor here, making it
    impossible to see below your knees.  You suddenly hear mutterings coming from the back room, possibly
    from... KKKKKAAAAAABBBBOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOMMMMMMMMMMMMMMMM!!!!!! You are deafened by the
    noise from a tremendous explosion and the concussion from the blast staggers you!  The shopkeeper seems
    to pay no heed to this. The door to the back room opens and an older man, wearing a pointed hat, whose
    face is smudged with soot sticks his head out.  'Is everyone alright?  Sorry about that.  I was
    testing a new spell.  I'll try to give advance notice next time.', he says.  The door then closes.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12049
      look: >
        The door is reinforced with steel and looks VERY sturdy.  Considering the 'test' that you just
        witnessed, you are glad that it stands between you and whatever is going on in the back room.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:120:obj:12038
        reset: locked
    west:
      to: tba:120:room:12035
      look: You see the south gate through the door.
  extras:
  - keywords: [fog, mist]
    text: >
      This is some really strange stuff!  You have never seen anything this color before.  Your legs are
      totally obscured from the knee down.

"tba:120:room:12043":
  name: The Waiting Room
  description: >
    You are standing in a very large room with a high ceiling and there are a few people waiting here
    to see the Emperor on urgent matters.  The master scheduler tells you to have a seat and sends a page
    to inform the his highness of your arrival.  There are large doors to the east and west and an exit
    leads south to the foyer.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12050
      look: "There is a sign on the door that says:  MUNICIPAL COURT OF ROME.  It appears to be open."
    south:
      to: tba:120:room:12044
      look: The foyer is directly to the south.
    west:
      to: tba:120:room:12036
      look: There is a large door to the west.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:120:obj:12035
        reset: locked

"tba:120:room:12044":
  name: The Entrance Foyer
  description: >
    You have just entered the main government building of the Roman Empire and are standing in a
    massive room with an elaborately decorated domed roof. There are many people here; messengers and senators
    being the most numerous. There is a large, ornate door to the west, a hallway leads north and marble
    stairs that lead out of the building are to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12043
      look: You see a hallway leading north to what looks like a waiting room.
    west:
      to: tba:120:room:12037
      look: There is a large door to the west that blocks your path.
      door:
        keywords: [door]
        kind: door
        key: tba:120:obj:12036
        reset: locked
    down:
      to: tba:120:room:12045
      look: You see a stairway leading out of the building.

"tba:120:room:12045":
  name: Outside The Capitol Building
  description: >
    You stand on white marble steps that lead up and into the Capitol Building.  There are several
    statues, none of any real significance, at the entrance to the building.  The main entrance to the
    building is at the top of the steps.
  sector: city
  exits:
    up:
      to: tba:120:room:12044
      look: The steps lead into the Capitol Building.
    down:
      to: tba:120:room:12046
      look: The steps terminate onto Clay Avenue.
  extras:
  - keywords: [statue, statues]
    text: There is really nothing noteworthy about them.
  - keywords: [stairs, stairway, steps]
    text: The stairs are immaculately polished and made of white marble.

"tba:120:room:12046":
  name: Clay Avenue
  description: >
    You are standing on a wide, heavily traveled road that runs east and west through the heart of the
    city.  There are marble steps leading up.  To the south, off in the distance, you can see a large
    stone structure and a mountain that is partially obscured by the haze.  There is a general store to the
    north.
  sector: city
  exits:
    north:
      to: tba:120:room:12063
      look: The general store lies in that direction.
    east:
      to: tba:120:room:12051
      look: There is what appears to be a large gate in that direction.
    west:
      to: tba:120:room:12039
      look: Clay Avenue continues.
    up:
      to: tba:120:room:12045
      look: There are some white marble steps leading up.
  extras:
  - keywords: [mountain]
    text: >
      Off to the southwest, you can see a huge mountain that is partially obscured by the haze.  It is
      rumored that the gods reside there and protect the city.
  - keywords: [stone, structure, aqueduct]
    text: >
      You see a massive stone structure, built several centuries ago, that is used to channel water into
      the city.

"tba:120:room:12047":
  name: The Summit Of The Mountain Of The Gods
  description: >
    You are at the summit of a very high mountain and are standing above the clouds.  The sun is
    shining brilliantly here and the clouds below look like balls of cotton.  The path that you have been
    walking on is damp and the scent of lilac is in the air.
  sector: mountains
  exits:
    down:
      to: tba:120:room:12052
      look: You see a damp path leading back down the mountain.

"tba:120:room:12048":
  name: The Aqueduct
  description: >
    You are in a massive stone structure that has been designed to channel water into the city of
    Rome.  Due to the recent drought, the water level is low, allowing passage without a boat.  The walls and
    floor are covered with algae and slime, producing treacherous footing conditions.  There are exits in
    all four cardinal directions.
  sector: water_swim
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12057
      look: The aqueduct continues.
    east:
      to: tba:120:room:12041
      look: The aqueduct continues.
    south:
      to: tba:120:room:12041
      look: The aqueduct continues.
    west:
      to: tba:120:room:12048
      look: The aqueduct continues.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:120:room:12049":
  name: Froboz's Workshop
  description: >
    You are standing in the workshop of Froboz the Great, the most powerful and famous mage that Rome
    has ever known.  Workbenches line the walls and are covered with various test tubes, beakers, petri
    dishes and crucibles and there is an odor in here that can best be described as a combination of old
    sweat socks and burning tires.  The only exit is back through the door through which you came.  In the
    middle of the room, you see a pile of ashes that looks like it once was a body and Froboz is is busy
    making adjustments on a new type of magic wand...  Possibly the one responsible for the explosion a
    few minutes ago.  He removes a jeweler's loupe from his eye as he turns around.  'How in the name of
    Merlin did you get in here??!!  ' he asks.  'Oh, nevermind!  Since you are here, you can serve as
    witnesses to the final test of the new mages' spell: "ectowatt".  ' With this he makes a magical gesture
    and a paladin appears. Crossing his fingers, Froboz waves the wand his direction and what happens
    next is incredible!  The Paladin is enveloped in what appears to be a small, well contained,
    thermonuclear explosion.  When the smoke clears you can see that the paladin and all of equipment has been
    reduced to a large pile of flaming cinders.  Froboz throws his head back and cackles with insane glee. 
    'Now, my young friends, what can I do for you?  ', he asks.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:120:room:12042
      look: There is a door, reinforced with steel, in that direction.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:120:obj:12038
        reset: locked
  extras:
  - keywords: [cinders, ashes, pile]
    text: >
      The ashes are a very fine grayish white powder that seems to be the only worldly remains of
      Froboz's "test specimens".
  - keywords: [workbench, workbenches, tubes, beakers, crucibles, dishes]
    text: >
      These are all tools of great power.  You cannot even begin to understand what any of this stuff
      does.

"tba:120:room:12050":
  name: The Courtroom
  description: >
    You stand inside of a large courtroom in which common civil disputes and criminal matters are
    decided.  There is a judge's bench and a witness stand on the far side of the room and a jury's box along
    side.  The Emperor's seal is prominently displayed on the wall behind the judge's stand, reminding
    all who enter that he is an extension of his highness.  There is a door, possibly leading to the
    judge's chambers, to the east and the waiting room is to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12055
      look: The door might lead into the judge's private chambers.
      door:
        keywords: [door]
        kind: door
        key: tba:120:obj:12039
        reset: locked
    south:
      to: tba:120:room:12060
      look: The holding cells lie in that direction.
    west:
      to: tba:120:room:12043
      look: The waiting room lies in that direction.
  extras:
  - keywords: [seal]
    text: The seal of the Emperor is mounted above the judge's stand.
  - keywords: [bench, stand, box, jury]
    text: >
      You see large wooden structures that are designed to separate the judge, jury and witnesses from
      the rest of the courtroom.  They are made of polished oak and are strictly functional.

"tba:120:room:12051":
  name: The East Gate Of Rome
  description: >
    You are standing inside of the eastern gate of Rome.  There are two tall spires built into the city
    wall, from which the guards can see the whole eastern side of the city.  The gate is currently open
    and to the east, there is a heavily used road, made of packed clay, that leads out of Rome. Another
    road leads westward into the city.
  sector: city
  exits:
    east:
      to: tba:120:room:12064
      look: The clay road heads eastwards.
      door:
        keywords: [gate]
        kind: door
        reset: closed
    west:
      to: tba:120:room:12046
      look: The clay street leads into the city.
  extras:
  - keywords: [gate]
    text: The gate is fabricated from iron and has been designed to keep intruders out of the city.
  - keywords: [spires, towers]
    text: >
      There are two tall spires on either side of the gate and are constantly manned by the city guards. 
      They are made of stone and stand about 40 feet tall.

"tba:120:room:12052":
  name: A Mountain Path
  description: >
    You stand on a small trail that leads up and down.  It has recently been raining and there are
    small puddles everywhere.  You are just below the clouds and the view of the surrounding countryside is
    breathtaking.
  sector: mountains
  exits:
    up:
      to: tba:120:room:12047
      look: The trail leads up and enters the clouds.
    down:
      to: tba:120:room:12056
      look: The trail leads down.
  extras:
  - keywords: [trail]
    text: The mountain trail is a little muddy, due to the recent rains.

"tba:120:room:12054":
  name: The Aqueduct
  description: >
    You are in a massive stone structure that has been designed to channel water into the city of
    Rome.  Due to the recent drought, the water level is low, allowing passage without a boat.  The walls and
    floor are covered with algae and slime, producing treacherous footing conditions.  There are exits in
    all four cardinal directions.
  sector: water_swim
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12041
      look: The aqueduct continues.
    east:
      to: tba:120:room:12054
      look: The aqueduct continues.
    south:
      to: tba:120:room:12057
      look: The aqueduct continues.
    west:
      to: tba:120:room:12048
      look: The aqueduct continues.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered the
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:120:room:12055":
  name: The Judge's Chambers
  description: >
    You are in a small room that is filled with legal tombs.  There is a small desk here, literally
    buried under legal documents.  There is also a small window overlooking the northern part of the city.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:120:room:12050
      look: The courtroom lies in that direction.
      door:
        keywords: [door]
        kind: door
        key: tba:120:obj:12039
        reset: locked
  extras:
  - keywords: [papers, documents]
    text: >
      There are hundreds of pages of petitions, lawsuits and court orders sitting on the desk.  One
      particularly interesting case involves a nobleman, a slave and a roll of toilet paper.
  - keywords: [tombs, books]
    text: The books are very large and filled with Roman legal precedent.

"tba:120:room:12056":
  name: A Mountain Path
  description: >
    You are standing on a small trail that leads through a grove of trees. Every thing is lush and
    green here and it appears to have been raining recently.  'This would be an ideal place for a picnic.' ,
    you think to yourself.
  sector: mountains
  exits:
    up:
      to: tba:120:room:12052
      look: You see a small trail leading further up the mountain.
    down:
      to: tba:120:room:12059
      look: You see a small trail, leading down.
  extras:
  - keywords: [trail, path]
    text: The path is a little muddy, possibly due to a recent thundershower.
  - keywords: [tree, trees, vegetation]
    text: >
      All of the vegetation is lush, green and in full bloom.  You wish that you could take the time to
      stop and enjoy it properly.

"tba:120:room:12057":
  name: The Aqueduct
  description: >
    You are in a massive stone structure that has been designed to channel water into the city of
    Rome.  Due to a recent drought, the water level is low, allowing passage without a boat.  The walls and
    floor are covered with algae and slime, producing treacherous footing conditions.  A valley lies to the
    south and the other cardinal directions lead further into the aqueduct.
  sector: water_swim
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12054
      look: The aqueduct continues.
    east:
      to: tba:120:room:12054
      look: The aqueduct continues.
    south:
      to: tba:120:room:12058
      look: You see a gorgeous valley.
    west:
      to: tba:120:room:12041
      look: The aqueduct continues....
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:120:room:12058":
  name: The Valley Of The Gods
  description: >
    You stand in a tranquil valley at the base of a large mountain.  A quiet stream, with fruit trees
    growing along its banks, winds its way peacefully through the valley and enters a large stone
    structure that lies to the west. There are birds singing and every now and then a ripple breaks the surface
    of the stream.  You can see a path leading through the trees to the up.
  sector: hills
  exits:
    north:
      to: tba:120:room:12057
      look: A small path winds its way through the trees.
    up:
      to: tba:120:room:12059
      look: You see a path leading up the mountain.
  extras:
  - keywords: [trees, fruit]
    text: >
      The fruit trees, nourished by the fertile ground at the edge of the stream and sustained by the
      brilliant sunshine, line the banks of the stream and are laden with fruit.
  - keywords: [fish]
    text: A variety of species swims peacefully in the cool, clear water.
  - keywords: [stream, brook]
    text: >
      A stream of the clearest, cleanest water that you have ever seen winds its way through the valley.

"tba:120:room:12059":
  name: A Mountain Path
  description: >
    You are standing on a path that leads up through a stand of large trees. Everything is green and it
    seems like eternal spring - this is Mother Nature at her finest.  It is possible to descend into a
    tranquil valley from here.
  sector: mountains
  exits:
    up:
      to: tba:120:room:12056
      look: The path leads further up the mountain.
    down:
      to: tba:120:room:12058
      look: The path widens out into a tranquil valley.
  extras:
  - keywords: [trees]
    text: >
      The trees are old and tower hundreds of feet above the ground.  If you stand still and listen
      carefully, you can hear the birds singing.

"tba:120:room:12060":
  name: The Holding Cells
  description: >
    You are standing in the holding cell area, just off of the cortroom.  Those who are recently
    convicted of serious crimes are brought here, pending torture and execution.  The courtroom lies to the
    north and another exit goes east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:120:room:12050
      look: The courtroom lies to the north.
    east:
      to: tba:120:room:12061
  extras:
  - keywords: [cells, cell]
    text: >
      You can see small and very cramped cells which are filthy.  You shiver and vow to never do anything
      that would cause you to become a resident.

"tba:120:room:12061":
  name: The Torture Chamber
  description: >
    You are standing in a very small room in which there are many tools designed specifically for
    inflicting pain and suffering.  Some of them are familiar, such as the rack and the iron maidens.  Others,
    you have never seen before and they make you wonder about the kind of sadistic mind that dreamt them
    up.  The only exit is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:120:room:12060
      look: The holding cells lie in that direction.

"tba:120:room:12062":
  name: The Roman Bakery
  description: >
    You are standing in the bakery of Rome and your mouth waters at the delicious aromas wafting from
    the kitchen.  The only exit is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12030

"tba:120:room:12063":
  name: The General Store
  description: >
    You are standing in the only general store of Rome.  The walls and shelves are covered with all of
    the various items required by Roman citizens and stalwart adventurers.  Clay Avenue lies to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:120:room:12046
      look: Clay Avenue lies in that direction.

"tba:120:room:12064":
  name: Before Rome
  description: >
    You travel upon an East-West road wide enough for 30 men to march abreast.  It is packed hard
    through heavy use.  To the west stands the Gates of Rome inviting you to enter and partake of all the
    glory and splendor that is Rome.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12065
    west:
      to: tba:120:room:12051
      door:
        keywords: [gate]
        kind: door
        reset: closed

"tba:120:room:12065":
  name: Clay Road
  description: >
    You travel upon an East-West road wide enough for 30 men to march abreast.  It is packed hard
    through heavy use.  To the west, your eyes catch the splendors of a mighty city.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12066
    west:
      to: tba:120:room:12064

"tba:120:room:12066":
  name: Clay Road
  description: You travel upon an East-West road wide enough for 30 men to march abreast.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12067
    west:
      to: tba:120:room:12065

"tba:120:room:12067":
  name: The End Of The Clay Road
  description: >
    The mighty clay road turns into lesser, but still well traveled roads here.  You feel a surge run
    through your body as you look East into the lands that Rome turned into its mighty empire.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:120:room:12068
      look: A dirt trail leads towards the desert to the east.
    west:
      to: tba:120:room:12066
      look: The mighty clay road leads off in this direction.

"tba:120:room:12068":
  name: A Small Dirt Trail
  description:
  - >
    This small dirt path seems to be a joint between a large clay road located a short distance to the
    west and the expanse of sand which opens up before you to the east.  The clay road appears to lead
    through the foothills towards the snowcapped mountain chain to the west.  Perhaps there is a city or
    settlement in that direction.
  - >
    You cannot see any breaks in the horizon of the sand which fills your vision as you look to the
    east, it seems to stretch forever.
  sector: city
  flags: [no_mob]
  exits:
    east:
      to: tba:50:room:5028
      look: The expanse of the Great Eastern Desert opens up before you.
    west:
      to: tba:120:room:12067
      look: A large clay road begins a short distance to the west.
