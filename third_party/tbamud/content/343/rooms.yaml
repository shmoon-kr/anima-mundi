"tba:343:room:34301":
  name: Garden Path
  description: >
    The path is a norh-south path which narrows here as it crosses a small foot bridge on its way to
    the main garden to the north and an alcove to the south. It is quite pleasant here, as a refreshing
    breeze whips through the trees and the plants that are placed here.  The path itself is gravel and has a
    brick border. An empty Pagoda office is to the east.
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:343:room:34383
    east:
      to: tba:343:room:34393
      look: >
        Teak and rice paper doors with brush paintings upon its surface make up the door.  Gold Fixtures
        hold it in place and there are golden handles.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:343:room:34381

