"tba:343:room:34361":
  name: Rumbles Office
  description: >
    Inside Rumble's Office. It is a sealed pagoda, which is setup as an office than a shrine.  It has a
    desk in the center of the room with several filing cabinets along the wall on one side.  A fold out
    ship's bunk is here to sleep on setup along the wall.  It is done in a typical 14th Century Oriental
    design in the way of plush fineries.  The only way out is a sliding door leading to the south.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:343:room:34383
      look: >
        Teak and rice paper doors with brush paintings upon its surface make up the door.  Gold Fixtures
        hold it in place and there are golden handles.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:343:room:34362":
  name: Opie's Office
  description: >
    You are standing on an immense, gray stone floor that stretches as far as you can see in all
    directions.  Rough winds plunging from the dark, starless sky tear savagely at your fragile body.  The
    stone floor is the same shade of gray the sky and is completely plain and unscratched.  It is probably
    too hard for anything to leave as much as a scratch on it.  Cold winds plunge ceaselessly at you from
    the dark, cloudless sky.  An icy chill fills your blood, as you hear an echoing guttural laugh.  "In
    the darkness there is light...  It's just hiding...  Let me show you...  It is the mind that is
    erotic, the heart that gives it life, the soul that makes it whole.", a voice whispers.  You jump back with
    a shriek.  Nothing more but the beating of your heart.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:343:room:34386
      look: >
        Teak and rice paper doors with brush paintings upon its surface make up the door.  Gold Fixtures
        hold it in place and there are golden handles.
      door:
        keywords: [door]
        kind: door
        reset: closed

