"tba:343:room:34305":
  name: Narrow Gravel Path
  description: >
    The path goes north and south and it is the same gravel type as the others. This path leads through
    a thicker part of the garden, however, to what appears o be a Pagoda that is set back a ways from
    the others and the main part of the garden.  Thick growth of planets, trees and bushes surround the
    building and this path, The path itself is lined with bricks marking it easily to find your way and
    lanterns hang from hooks every so many feet to light the way.
  sector: city
  exits:
    north:
      to: tba:343:room:34397
      look: >
        The door is made of Teak, rice paper and silver fixtures.  And it slides to the side as in
        traditional design of any pagoda of 14th century.  On the rice paper there is the design of a dragon with its
        wings spread
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:343:room:34384

"tba:343:room:34306":
  name: The Social Gathering Room
  description: >
    This is the Main Social Gathering Room of the Immortals.  It is circular in design, and it connects
    four foyers in all directions to the north, south, east, and west.  The room is quite plush with
    many fountains, couches, and carpeted areas, also with a few planters filled with thick green bushes and
    trees.  The fountain seems to be glowing.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:343:room:34307
    east:
      to: tba:343:room:34308
    south:
      to: tba:343:room:34309
    west:
      to: tba:343:room:34310
    down:
      to: tba:30:room:3000

