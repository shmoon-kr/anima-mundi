# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 63.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:63:room:6300":
  name: Arachnos Zone Description Room
  description: You are in an unfinished room.
  sector: inside

"tba:63:room:6301":
  name: The Webbed Entrance
  description: >
    Sticky, sticky, sticky!  The ground is cluttered with leaves, decayed remains of webbed crickets,
    beetle, rats, dogs, and even humans.  You begin to wonder about what lies ahead.  The air is damp
    here, and even the little light that shines through the canopy seems to be absorbed into the webbing.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:63:room:6302
    south:
      to: tba:61:room:6132

"tba:63:room:6302":
  name: The Webby Passage
  description: >
    You find that footing here is very good, almost too good.  The limbs are coated with cobwebs and
    seem unusually strong for tree branches.  Paths lead in four directions.  The eastward path goes down a
    bit.
  sector: field
  exits:
    north:
      to: tba:63:room:6304
    east:
      to: tba:63:room:6305
    south:
      to: tba:63:room:6301
    west:
      to: tba:63:room:6303

"tba:63:room:6303":
  name: The Wasp Hive
  description: >
    Drones scuttle about in this room.  The cells on the walls are honeycomb in shape and many of the
    maggots and wasps you see have fang-marks on their bodies.  You sense some order in their markings.
  sector: field
  exits:
    east:
      to: tba:63:room:6302

"tba:63:room:6304":
  name: The Webby Passage
  description: >
    Another webby passage, all sticky and wet.  Tiny ballooning spiders fill the air.  It seems that
    these young ones are newborns.
  sector: field
  exits:
    east:
      to: tba:63:room:6305
    south:
      to: tba:63:room:6302

"tba:63:room:6305":
  name: Beneath The Busy Path
  description: >
    You here the sounds of crawling arachnids above.  The rhythms of the footsteps suggest a primitive
    order in there movement.  The light seems brighter upwards.
  sector: field
  exits:
    west:
      to: tba:63:room:6304
    up:
      to: tba:63:room:6306

"tba:63:room:6306":
  name: On The Busy Path
  description: >
    Spiders, spiders, everywhere!  It is almost ant-like in efficiency with one big difference.  The
    spiders here are carrying ant-corpses, as well as rats, wolves, and humans.
  sector: field
  exits:
    south:
      to: tba:63:room:6307
    down:
      to: tba:63:room:6305

"tba:63:room:6307":
  name: On The Busy Path
  description: >
    Spiders, spiders, everywhere!  It is almost ant-like in efficiency with one big difference.  The
    spiders here are carrying ant-corpses, as well as cats, wolves, and humans.
  sector: field
  exits:
    north:
      to: tba:63:room:6306
    east:
      to: tba:63:room:6308

"tba:63:room:6308":
  name: On The Busy Path
  description: >
    Spiders, spiders, everywhere!  It is almost ant-like in efficiency with one big difference.  The
    spiders here are carrying ant-corpses, as well as cats, dogs, and humans.
  sector: field
  exits:
    north:
      to: tba:63:room:6307
    east:
      to: tba:63:room:6306
    south:
      to: tba:63:room:6305
    west:
      to: tba:63:room:6309

"tba:63:room:6309":
  name: A Split In The Path
  description: >
    As always, there is a split in the road.  One road is strewn with cricket feelers.  The other is
    well-kept and suitable for smooth travelling.  The webbing that was prevalent in earlier rooms is
    almost non-existant now.
  sector: field
  exits:
    north:
      to: tba:63:room:6310
    east:
      to: tba:63:room:6308
    south:
      to: tba:63:room:6320

"tba:63:room:6310":
  name: A Fuzzy Tree Limb
  description: >
    You are on a 'fuzzy' tree limb.  Interesting, since the branches seem to have 'hairs' sprouting
    from its bark.  As you look closer you see millions of aphids covering each limb.
  sector: field
  exits:
    south:
      to: tba:63:room:6309
    west:
      to: tba:63:room:6311

"tba:63:room:6311":
  name: The Tree Trunk
  description: >
    You feel that you can rest here safely.  There is evidence of webbing here, but it is of a finer
    quality.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:63:room:6310
    south:
      to: tba:63:room:6312

"tba:63:room:6312":
  name: The Tree Lair Entrance
  description: >
    It seems the inhabitant of this place does not web her victims, as evidenced by the remains before
    you.  The area is cluttered with desiccated corpses, apparently bitten but unwebbed, and drained of
    their life juices.
  sector: field
  exits:
    north:
      to: tba:63:room:6311
    west:
      to: tba:63:room:6313

"tba:63:room:6313":
  name: The Wolf Spider Lair
  description: >
    Very dark, as all lairs of spiders are.  Not much of furnishings save an exit.  The wolf spider
    keeps no corpses here, but rather throws them out at her leisure.
  sector: field
  exits:
    east:
      to: tba:63:room:6312

"tba:63:room:6320":
  name: The Webless Path
  description: >
    Strange.  No webbing here.  In fact, no sounds whatsoever. The path continues northward, where you
    find that you may have to tightrope your way across a ravine.
  sector: field
  exits:
    north:
      to: tba:63:room:6309
    west:
      to: tba:63:room:6321

"tba:63:room:6321":
  name: Above The Ravine
  description: >
    Stranger still.  Your feet get a real firm grip on the spiderline. You are above a deep ravine. 
    This line connects you between two trees. Below you can see a prismatic web with lots of animal bones
    caught in it: some bear and small deer bones in fact.  No human skeletons are visible (yet).
  sector: field
  exits:
    east:
      to: tba:63:room:6320
    south:
      to: tba:63:room:6323
    down:
      to: tba:63:room:6322

"tba:63:room:6322":
  name: The Rainbow Web
  description: >
    This is the rainbow web -- each strand, each link, a hue of violently sharp colors and contrasts. 
    The resident here seems to have a command of light as well.
  sector: field
  exits:
    up:
      to: tba:63:room:6321

"tba:63:room:6323":
  name: The Web Forest
  description: >
    The trees here take on a different appearance -- they are not trees anymore, but disjointed
    make-shift silken made shafts, sticky to the touch, and webby in texture.  This is another world it would
    appear.
  sector: field
  exits:
    north:
      to: tba:63:room:6321
    down:
      to: tba:63:room:6324

"tba:63:room:6324":
  name: The Slave Pit
  description: >
    You have entered the slave pit.  A voice blares in the distance, 'Get back to work, maggots!' 
    Rails upon rails of mined gold and silver clutter the trail beneath you.
  sector: field
  exits:
    north:
      to: tba:63:room:6325
    up:
      to: tba:63:room:6323

"tba:63:room:6325":
  name: The Tether Path
  description: >
    Another tether path just like the rest of them.  Surprisingly well-lit by the golden orbs that hang
    from the sides, you can see the paths become finer and finer in quality.
  sector: field
  exits:
    east:
      to: tba:63:room:6326
    west:
      to: tba:63:room:6324

"tba:63:room:6326":
  name: A Road Crossing
  description: Another shifty little strand of webs, almost ethereal in nature.
  sector: field
  exits:
    west:
      to: tba:63:room:6325
    up:
      to: tba:63:room:6327

"tba:63:room:6327":
  name: A Leader Strand
  description: >
    This strand is weightier, more sturdy.  It shimmers as you step on it.  You are definitely not in
    the Midgaardian realms anymore.  Just where you are you can't tell.  It feels like you're moving
    through ether.  You can still get back down to more surer lands.
  sector: field
  exits:
    north:
      to: tba:63:room:6328
    down:
      to: tba:63:room:6326

"tba:63:room:6328":
  name: The Entrance Of The Ethereal Web
  description: >
    You are at the entrance to ethereal web.  Flickering in and out, in and out, each strand reveals a
    different hue from black to green to blue.
  sector: field
  exits:
    south:
      to: tba:63:room:6331

"tba:63:room:6330":
  name: The Young Wyrmkin's Crib
  description: >
    A playpen of sorts, with maggots of wasps and other baby vermin lying about.  You feel that humans
    have been played with here too, and eaten later.  You sense that the maker of this place has an
    appetite for dragon meat, and uses this room as a breeding area.
  sector: field
  exits:
    up:
      to: tba:63:room:6331

"tba:63:room:6331":
  name: The Base Of The Web
  description: >
    Large strands connect at this point.  The node shimmers and flickers within the ether.  You see
    many flying creatures -- insects, pegasi, and dragon wyrmkins -- navigate the dangerous passages of the
    web.  Exits go in many directions.
  sector: field
  exits:
    north:
      to: tba:63:room:6330
    east:
      to: tba:63:room:6332
    south:
      to: tba:63:room:6333
    west:
      to: tba:63:room:6334

"tba:63:room:6332":
  name: Through The Trees
  description: >
    This part of the web intersects through the branches of some trees.  Various leaves and other
    debris that the many drones have not picked up yet lie here.
  sector: field
  exits:
    east:
      to: tba:63:room:6331
    south:
      to: tba:63:room:6335
    west:
      to: tba:63:room:6333

"tba:63:room:6333":
  name: Above The Clouds
  description: >
    You can see all of Midgaard in this ethereal web.  Many of the larger dragons that do wish to fly
    seem to fly away from the sticky strands of the web.
  sector: field
  exits:
    east:
      to: tba:63:room:6331
    south:
      to: tba:63:room:6334
    west:
      to: tba:63:room:6335

"tba:63:room:6334":
  name: On A Cloud
  description: >
    This cloud is rather thick in consistency.  You suddenly realize this is not a typical cloud, but
    it might be the nest of an aerial creature.
  sector: field
  exits:
    down:
      to: tba:63:room:6331

"tba:63:room:6335":
  name: A Link In The Ethereal Web
  description: >
    This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by
    its sticky strands.
  sector: field
  exits:
    east:
      to: tba:63:room:6336
    west:
      to: tba:63:room:6331

"tba:63:room:6336":
  name: The Tenuous Strand
  description: >
    Very windy here since it goes up into the sky somewhat.  Still, it is safe enough to move around.
  sector: field
  exits:
    south:
      to: tba:63:room:6340
    west:
      to: tba:63:room:6341
    down:
      to: tba:63:room:6331

"tba:63:room:6340":
  name: The Elder Wyrmkin's Room
  description: >
    A more mature wyrmkin it seems resides here.  Various tomes of arcane lore clutter the area, along
    with shards of armor and weaponry.
  sector: field
  exits:
    down:
      to: tba:63:room:6331

"tba:63:room:6341":
  name: Another Tree Limb
  description: >
    Once again the web crosses another tree limb.  To the side you see the possible entrance to another
    creature's lair.
  sector: field
  exits:
    east:
      to: tba:63:room:6342
    south:
      to: tba:63:room:6334
    west:
      to: tba:63:room:6345

"tba:63:room:6342":
  name: The Bird Spider's Lair
  description: >
    This is a big game hunter among most spiders.  Crushed jewels and weapons suggest the inhabitant
    must have powerful jaws.  Beware!
  sector: field
  exits:
    down:
      to: tba:63:room:6331

"tba:63:room:6345":
  name: A Link In The Ethereal Web
  description: >
    This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by
    its sticky strands.
  sector: field
  exits:
    south:
      to: tba:63:room:6350
    west:
      to: tba:63:room:6346
    up:
      to: tba:63:room:6345

"tba:63:room:6346":
  name: The Quiet Tree Top
  description: >
    This is a quiet tree top.  Downwards you can see a familiar path that may lead back to Midgaard.
  sector: field
  exits:
    east:
      to: tba:63:room:6345
    west:
      to: tba:63:room:6347
    down:
      to: tba:61:room:6132

"tba:63:room:6347":
  name: On The Web
  description: >
    RRRRRRRRRRROOOOOOOOOOOOOAAAAAAAAAAAAAARR!  You hear the roar of a powerful beast.  Dragon, you
    think.  You shiver in your boots as you tiptoe along this section of the web.
  sector: field
  exits:
    east:
      to: tba:63:room:6346
    south:
      to: tba:63:room:6355
    down:
      to: tba:63:room:6331

"tba:63:room:6350":
  name: The Ki-Rin Chamber
  description: >
    A wise ki-rin was entrapped here many years ago.  It is from her that the ruler of this realm draws
    magical strength.
  sector: field
  exits:
    north:
      to: tba:63:room:6347

"tba:63:room:6355":
  name: A Link In The Ethereal Web
  description: >
    This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by
    its sticky strands.  To the north you sense the heavy breathing of a fiery animal.
  sector: field
  exits:
    north:
      to: tba:63:room:6360
    south:
      to: tba:63:room:6365

"tba:63:room:6360":
  name: Yevaud's Lair
  description: >
    Yevaud, the Usurper of Midgaard, resides here.  A voice cries out, 'BEWARE, the Usurper of Midgaard
    lives here!  FLEE while you can!' But even Yevaud has his master... or so you deduce.
  sector: field
  exits:
    south:
      to: tba:63:room:6355

"tba:63:room:6365":
  name: A Link In The Ethereal Web
  description: >
    This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by
    its sticky strands.  A single spider line lies to the north, while ghastly seemings are due
    southward.  The grim entrance of Arachnos' Lair is downward.
  sector: field
  exits:
    north:
      to: tba:63:room:6371
    east:
      to: tba:63:room:6331
    south:
      to: tba:63:room:6366
    down:
      to: tba:63:room:6390

"tba:63:room:6366":
  name: The Entrance To The Donjonkeep
  description: >
    A dark path at the end of the web strand, you see ahead a torch lit chamber where the souls of
    unavenged adventurers come and gnash their teeth.  The howls and screams of many echo through the hall
    ways.  You see one definite path ahead.
  sector: field
  exits:
    north:
      to: tba:63:room:6367

"tba:63:room:6367":
  name: The Guardian's Room
  description: >
    A chair sits here for a tireless guardian who ensures that no soul escapes.  Other than that, the
    room is undecorated.
  sector: field
  exits:
    north:
      to: tba:63:room:6368
  extras:
  - keywords: [chair]
    text: An ordinary chair, well used, glued to the ground by spiderweb.

"tba:63:room:6368":
  name: The Realm Of The Hopeless
  description: >
    Here you see many misguided souls who think they still live. They search for those who killed them
    without warrant, and seek the free souls of living beings to inhabit and perhaps adventure once more.
  sector: field
  exits:
    north:
      to: tba:63:room:6369

"tba:63:room:6369":
  name: The Realm Of The Hopeless
  description: >
    Here you see many misguided souls who think they still live. They search for those who killed them
    without warrant, and seek the free souls of living beings to inhabit and perhaps adventure once more.
  sector: field
  exits:
    north:
      to: tba:63:room:6368
    south:
      to: tba:63:room:6370

"tba:63:room:6370":
  name: The Donjonkeep
  description: >
    No souls have ever lived in this place.  The wails of slaves and the howls of wolves are the only
    way you can describe the sounds you hear.  The walls are thin and wispy.  The only light you receive
    is the shimmering from the strand of the ethereal web you used to get here.
  sector: field
  exits:
    east:
      to: tba:63:room:6371

"tba:63:room:6371":
  name: The Single Spider Line
  description: >
    A single spider line supports you once more.  As you look across the ether you seen a single shack
    up ahead with a light in the window. You sense a great evil coming from the north and feel inclined
    to go back on the ethereal web and take your chances there.
  sector: field
  exits:
    north:
      to: tba:63:room:6331
    south:
      to: tba:63:room:6372

"tba:63:room:6372":
  name: The Single Spider Line
  description: >
    A single spider line supports you once more.  The shack comes closer into view and you are even
    more inclined to go back now.
  sector: field
  exits:
    north:
      to: tba:63:room:6371
    south:
      to: tba:63:room:6373

"tba:63:room:6373":
  name: The Hermit's Corner
  description: >
    Here you see evidence of a vagrant's abode.  The shack is to the north, if you dare enter it.  You
    get the sneaking feeling you should go back now.  The skies above you darken and roar with the
    laughter of thunder.
  sector: field
  exits:
    north:
      to: tba:63:room:6372
    south:
      to: tba:63:room:6380

"tba:63:room:6380":
  name: Mahatma's Inescapable Trap
  description: >
    The room is dark and filled with shadows.  A trap has been carefully crafted to catch unwary
    travellers.  There seems to be no way out.  A few looted corpses are piled in one corner.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:63:room:6380
    west:
      to: tba:63:room:6380

"tba:63:room:6390":
  name: The Entrance To The Arachnos' Lair
  description: All strands inevitably lead here, the center of the web, the entrance to Arachnos' Lair.
  sector: field
  exits:
    east:
      to: tba:63:room:6391

"tba:63:room:6391":
  name: The Sticky Chamber
  description: >
    You can still bail out since your knees are shaking from the anticipation (or is it fear?).  The
    sky is clear on this strand of web, surprisingly unsticky.  The strand does not vibrate like the
    others.  A few ballooning spiders pass by, cackling 'You're gonna die, you're gonna fry.  Good bye!'
  sector: field
  exits:
    east:
      to: tba:63:room:6392
    down:
      to: tba:63:room:6331

"tba:63:room:6392":
  name: The Great Door
  description: >
    Before you you see a large, web-like door.  Various designs of ancient runes and names of Midgaard
    heroes are etched into the webwork.  Perhaps lists of victims?  You can't tell.
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:63:room:6399
      door:
        keywords: [door]
        kind: pickproof
        key: tba:63:obj:6300
        reset: locked
    west:
      to: tba:63:room:6391

"tba:63:room:6399":
  name: The Lair Of Arachnos
  description: >
    This is the lair of the Empress Spider, Arachnos.  You can see a lavishly adorned rainbow web, her
    lair allows her to move to any universe she wishes by using her magical strands to the Prime Material
    Plane.  Coffers upon coffers of gold, magical jewels and gems await.  Unfortunately Arachnos is a
    baggy spider too, and webs all her treasures to her beautiful silken body.
  sector: field
  flags: [no_track]
  exits:
    south:
      to: tba:63:room:6392
      door:
        keywords: [door]
        kind: pickproof
        key: tba:63:obj:6300
        reset: locked
