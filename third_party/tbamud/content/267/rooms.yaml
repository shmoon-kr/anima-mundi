      supportable.  You don't need to fear being on it at all.

"tba:267:room:26790":
  name: Port by the Forest
  description: >
    You are at an extremely weird dock.  It's raised high on stilts on one side-- apparently keeping
    you from falling off of a cliff.  Netting starts out to your south, keeping you from falling through
    the trees.  You can see a large tar pit to your south--good thing there's that netting to keep you from
    falling into it.
  sector: city
  exits:
    south:
      to: tba:267:room:26789
      look: The netting begins to your south.

"tba:267:room:26791":
  name: Hall of Wax
  description: >
    Gory statues line this hall--statues of all kinds of torture, from the most mundane iron-maiden
    experience to the more imaginative things one can do with a cat-of-nine tails and razors.  The thing
    that makes these statues most uncomfortable to look at is the fact that they are made from wax--and look
    so lifelike you can almost see them screaming in terror.  Do you see one move? No, it must be your
    mind playing tricks on you.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:267:room:26793
      look: You can see a horrid hall to your north.

"tba:267:room:26792":
  name: Entrance to the Office of the High Priest of Terror
  description: >
    This is certainly not your average office--certain telltale signs lead you to this fact.  Perhaps
    it's the skulls lined up on spikes around the room. Or, perhaps the fact that it looks to be several
    rooms.  You really don't want to be here.  You can go south or north...  Neither way looks too
    comforting.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26738
      look: You see the strange trail.
      door:
        keywords: [Trail, of, terror]
        kind: door
        key: tba:267:obj:26727
        reset: locked
    south:
      to: tba:267:room:26791
      look: You can see a hall of wax statues.

"tba:267:room:26793":
  name: Hall of Torture
  description: >
    This certainly isn't the entrance to the office...  How does one get back? You feel somewhat turned
    around.  As you look around you, you are overcome with nausea as you realize immediately that you
    shouldn't have.  Many items of torture lie around here, some that you'd never imagined could have been
    invent- ed.  Certainly not by a sane person.  You can go to your east(oh, so that's how you get back
    to the entrance), or to the south, into another chambre.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:267:room:26792
      look: You see the entrance to the Office of the High Priest of Terror, of course.
    south:
      to: tba:267:room:26794
      look: You see a hall with lots of dead bodies around.

"tba:267:room:26794":
  name: Hall of Death
  description: >
    Dead bodies lie strewn about here.  They appear to have been killed from the devices in the Hall of
    Torture.  You certainly don't want to think too long about it, as they are so mangled you can't tell
    what they were--whether they were human or other.  You can get out of here by going back to the Hall
    of Torture, to the Temple of Terror to your east, or to the Office of the High Priest to your south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26793
      look: You can see the hall of torture.
    east:
      to: tba:267:room:26797
      look: You can see the entrance to the Temple of Terror.
    south:
      to: tba:267:room:26795
      look: You can see the entrance to the office of the High Priest of Terror.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26734
        reset: locked

"tba:267:room:26795":
  name: Office of the High Priest of Terror
  description: >
    This is probably the most beautiful part of the entire island you have seen. Amazingly enough,
    there are no signs of the carnage and disgusting methods of torture that can be seen throughout the rest
    of the buildings you've viewed. In fact, this place looks downright natural.  A nice desk made of
    redwood is the frontpiece of the room, and a high-backed chair is behind it.  A plush sofa is in front
    of it, and plaques and other credentials line the walls.  An insignia--the cat o' nine tails--is
    frosted into the only window in the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26792
      look: You, amazingly enough, end right back up at the entrance.
  extras:
  - keywords: [insignia, window]
    text: >
      The cat o' nine tails, a whip with multiple straps, apparently is the ultimate symbol for the Reign
      of Terror.  It's the most painful--sometimes even fatal--whip known.
  - keywords: [plaques]
    text: >
      These aren't awards--they're decrees and petitions outlining the law of Vice Island.  Each one is
      more severe than the last.  What you basically glean from the rules of the land is that while this
      once was a prosperous island, several people began to experiment with dark magic, and began to mu268le
      in affairs they had no business in.  Eventually, the island became nothing more than a place for
      several delvers to take up shop--and build a religion based mostly on the most horrible feelings in
      life--Despair, Hopelessness, Fear, and the crowning emotion, in which all these culminate--Terror.  Not a
      pretty picture.
  - keywords: [sofa]
    text: This sofa looks so comfortable, you want to just sink right into it.
  - keywords: [chair]
    text: The chair is made of redwood, and looks very comfortable.  It also looks VERY heavy.

"tba:267:room:26797":
  name: Entrance to the Temple of Terror
  description: >
    The entrance to this temple is blinding--that's probably the most noteworthy point of note. 
    Flashes of light emenate from a globe in the center of the room, causing strange effects in the room.  The
    room is made from a metal that reflects the light like a mirror--but brighter.  You can go to the
    strange trail to your north, or on into the temple to your east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26738
      look: You can see the strange trail.
      door:
        keywords: [trail]
        kind: door
        key: tba:267:obj:26728
        reset: locked
    east:
      to: tba:267:room:26798
      look: You see a blindingly lit hallway.
    west:
      to: tba:268:room:26804
  extras:
  - keywords: [globe, ball, light]
    text: >
      All the light seems to emenate from this globe.  It's made from material that looks to come from
      the sun itself--yet it's cold--very cold.

"tba:267:room:26798":
  name: Blindingly lit hallway
  description: >
    This east-west hallway is so brightly lit that you can barely see anything. You have to shield your
    eyes just to see in front of you.  It appears to be made from the same metal as the entrance to the
    building does.  A small room opens to your north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26799
      look: You see a small shrine to your north.
    east:
      to: tba:268:room:26800
      look: The hallway continues on.
    west:
      to: tba:267:room:26797
      look: The entrance to the temple is to your direct west.

"tba:267:room:26799":
  name: Shrine to Vice
  description: >
    This small shrine contains nothing other than an alter and a small book with the inscription, "You
    cannot take that which is not yours--but you can have as much of it as you want.  "...  You think you
    hear maniacal cackling somewhere around you, but when you turn, you see nothing.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26798
      look: You see the blindingly lit hallway.
  extras:
  - keywords: [alter, altar]
    text: >
      This small alter looks as if you could bow and pray with relative comfort. But you somehow get the
      feeling you shouldn't bend over.
