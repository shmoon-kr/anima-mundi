# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 267.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:267:room:26700":
  name: Vice Island Zone Description Room
  description:
    preformatted: |2
         Vice Island is an evil-only area. It's rather large for a medium-sized MUD
      and is intended to be used in concurrence with Oceania.
      This area is intended to be part 1 of 4 subareas I have in mind for Oceania.
      It has mainly evil mobs, and almost all of the equipment in it is evil only.
      ---------------------------------------------------------------------------
      I make no legal claim on Vice Island save this: You MUST give me credit for
      its design SOMEPLACE in your mud. You can hide it if you want, but I want
      some credit somewhere for it. :) I spent 6 months making Oceania and Vice
      Island, and I feel some need to have it known that my work is appreciated.
      ---------------------------------------------------------------------------
      Builder      : Questor
      Zone         : 267 Vice Island
      Player Level : 20-25
      Rooms        : 98
      Mobs         : 20
      Objects      : 41
      Triggers     : 9
      Links        :
      Zone 267 is linked to the following zones:
      268 Vice Island II                 at 26797 (west ) ---> 26804
      268 Vice Island II                 at 26798 (east ) ---> 26800
  sector: inside

"tba:267:room:26701":
  name: Port Harem
  description: >
    You stand on a blindingly white beach; it stretches to your north and south as far as you can see. 
    Hundred of beautifuly garbed women of all shades languish on the shore; they have stony-dull eyes
    that stare right past you. Something looks not-quite-so-right in this pristine place.
  sector: field
  exits:
    east:
      to: tba:267:room:26702
      look: To your east you can see a huge mound of dirt.
  extras:
  - keywords: [women, woman]
    text: >
      Each woman is spectacularly beautiful--except for their glazed eyes and expressions of utter
      stupor.  What on earth could be wrong with them?
  - keywords: [sand, beach]
    text: >
      Close examination of the beach shows that the sand is not only white--each and every grain is a
      single crystal; it reflects the light of the sun into a blinding display of bright white.  While each
      one exhibits a different color, they all blend into this pristine color.

"tba:267:room:26702":
  name: Beachside Harem
  description: >
    Now THIS is weird.  Frightened women scamper out from a hole in a huge mound and you can hear
    screaming from down in the depths.  A large forest lies to your east, and a trail can be vaguely seen.
  sector: hills
  flags: [dark]
  exits:
    east:
      to: tba:267:room:26703
      look: To your east you can see a beach road that leads into the forest.
    west:
      to: tba:267:room:26701
      look: You can see the blindingly bright white beach to your east.
    down:
      to: tba:267:room:26704
      look: Downwards you can see what looks to be a lush harem.

"tba:267:room:26703":
  name: Beach Road
  description: >
    This path is extremely well-kept.  Small stones line the outer path, and the sand from the beach
    has been lain to make a path--though the crystal seems to have been melted down to make the floor
    harder.  The palm trees here completely fill every part of the area outside the path.  Strange noises and
    utterly blood-chilling screams fill the air.  It is very dark here.  The path leads on to your west,
    and a strange mound lies to your east.
  sector: field
  flags: [dark]
  exits:
    east:
      to: tba:267:room:26705
      look: The beach road continues on.
    west:
      to: tba:267:room:26702
      look: To your west you can see a huge mound.

"tba:267:room:26704":
  name: Harem
  description: >
    This place is full of imported beauty--lavish Persian rugs, assorted priceless vases, and piles of
    money and jewelry everywhere.  Beautiful, silent women dance before you, twirling in silk gowns that
    barely hide their beauty. A sound can be heard over all the racket, shouting, "Keep working!  "
  sector: city
  flags: [dark, indoors, private]
  exits:
    up:
      to: tba:267:room:26702
      look: >
        You can just see from the hole in the ground that you are right by a path that leads into the woods.

"tba:267:room:26705":
  name: Beach Road
  description: >
    This path is extremely well-kept.  Small stones line the outer path, and the sand from the beach
    has been lain to make a path--though the crystal seems to have been melted down to make the floor
    harder.  The palm trees here completely fill every part of the area outside the path.  Strange noises and
    utterly blood-chilling screams fill the air.  It is very dark here.  A large hill rises to your east,
    and the beach road lies to your west.
  sector: field
  flags: [dark, no_mob]
  exits:
    east:
      to: tba:267:room:26739
      look: A large hill rises to your east.
    west:
      to: tba:267:room:26703
      look: You see a well-kept trail.

"tba:267:room:26706":
  name: Creepy Road
  description: >
    You're not quite sure why, but this road sends shivers down your very spine. Perhaps it's the total
    and complete silence.  Or perhaps it's the skeletons strown haphazardly about.  You just don't know.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:267:room:26707
      look: The creepy road continues east.
    west:
      to: tba:267:room:26739
      look: The huge Vice Hill lies to your west.
  extras:
  - keywords: [skeletons]
    text: They're quite real, and quite frightening.  We weren't lying to you.

