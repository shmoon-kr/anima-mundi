"tba:267:room:26711":
  name: Tarry Tunnel
  description: >
    The walls of this tunnel are covered and dripping with wet, gooey tar. Your shoes half-squish,
    half-sink, half-stick in the disgusting substance as you slowly slog your way through the gunk.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:267:room:26713
      look: The tarry tunnel continues to your north.
    east:
      to: tba:267:room:26723
      look: The tarry tunnel ascends onto a hill to your east.
  extras:
  - keywords: [goo, tar]
    text: The tar looks disgusting, but not too dangerous.

