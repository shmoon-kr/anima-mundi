"tba:267:room:26723":
  name: Vice Hill
  description: >
    You stand at the bottom of a tall hill.  The forestry around you keeps you from seeing too much,
    but you can make out a tarry road to your north, and the dark openings of two tunnels to your east and
    west.  Of course, you could always go south up to the relative safety of the hill.  A huge tree here
    looks climbable, and you can vaguely see a net at the top.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:267:room:26724
      look: You can see a dangerous-looking tarry road to your north.
    east:
      to: tba:267:room:26712
      look: You can see a dark, tarry tunnel opening to your east.
    south:
      to: tba:267:room:26710
      look: You see the relative safety of Vice Hill.
    west:
      to: tba:267:room:26711
      look: You can see a dark, tarry tunnel opening to your west.
    up:
      to: tba:267:room:26784
      look: You can see a path through the huge trees of the forest.

"tba:267:room:26724":
  name: Tarry Road
  description: >
    The tarry gunk of the road sticks firmly to your feet here, and it gets thicker and thicker as you
    venture north.  If you go south, you'll probably be able to turn back before it's too late.
  sector: field
  flags: [dark, no_mob, private]
  exits:
    north:
      to: tba:267:room:26725
      look: It looks very dangerous and squishy that way, but you could probably survive it.
    south:
      to: tba:267:room:26723
      look: It's much safer to your south. Perhaps you should go back.

"tba:267:room:26725":
  name: Tarry Road
  description: >
    The tarry gunk of the road sticks firmly to your feet here, and it gets thicker and thicker as you
    venture south.  If you go north, you'll probably be able to turn back before it's too late.  There is
    a sign on the side of the road here.
  sector: field
  flags: [dark, no_mob, private]
  exits:
    north:
      to: tba:267:room:26726
      look: The tar looks even more dangerous that way, but survivable.
    south:
      to: tba:267:room:26724
      look: The tar thins out a bit in that direction--better go that way.
  extras:
  - keywords: [sign, note, writings, writing, inscription, inscriptions, rune, runes]
    text:
    - TAR PIT
    - DO NOT ENTER ! ! !
    - THIS IS THE POINT OF NO RETURN!

"tba:267:room:26726":
  name: Tarry Road
  description: >
    The tar here is so bad that you can't turn around.  There is no natural way of escape--either go
    forward, or don't move at all.  Right ahead of you is a bubbling, boiling tar pit--it looks quite
    disgusting.  PANIC!
  sector: field
  flags: [dark, no_mob, private]
  exits:
    north:
      to: tba:267:room:26727
      look: Looks like that would be a VERY bad idea. I don't think you could escape that one.
  extras:
  - keywords: [tar, pit, tarpit]
    text: >
      It's big, black, boiling, sticky, and gooey.  What more incintive do you need to stay away from it?

"tba:267:room:26727":
  name: Boiling Tar Pit
  description: >
    As you sink one foot into the goo, it sticks.  You try to pull it out, but lose your balance, and
    the other foot gets stuck in the pit.  Try and try as you might, you can't get them out!  Each sinks
    lower and lower until your entire legs are encased in the pit.  You scream for help, but no one can
    hear you.
  sector: field
  flags: [no_mob, soundproof, private]

"tba:267:room:26728":
  name: Vice Hill
  description: >
    You stand at the bottom of a large hill.  It is eerily beautiful here, but it still looks quite
    sinister.  You notice a rocky road to your south, and you can ascend the hill to take a look around
    you.  A road hangs a bit above you to your left by no supports!  Hmm...  A beautifuly made road is to
    your west.
  sector: hills
  exits:
    north:
      to: tba:267:room:26709
      look: You can see the beautiful Vice Hill.
    east:
      to: tba:267:room:26730
      look: You can see a very strange road to your east. Worth exploring? Probably.
    south:
      to: tba:267:room:26740
      look: You see a slippery-looking rocky road to your south.
    west:
      to: tba:267:room:26729
      look: A beautifuly made, well-kept path is to your west.
    up:
      to: tba:267:room:26730
      look: Of course, you should ascend a hill, right?

"tba:267:room:26729":
  name: High Path
  description: >
    This road is amazingly built--some sort of black onyxlike substance, shined to a mirror-like gleam
    forms the main of the path.  Bricks of the same substance line the path--it doesn't look as if a
    piece of paper could be inserted between them.  The trees have been trimmed back to allow easy passage.
    Even among all this beauty, you sense a sinister presence.
  sector: city
  flags: [dark, no_mob]
  exits:
    east:
      to: tba:267:room:26728
      look: To your east you can see the bottom of Vice Hill.
    south:
      to: tba:267:room:26731
      look: The high path continues on.

"tba:267:room:26730":
  name: Trail of Terror
  description: >
    This trail is covered by the skeletal ribs of a huge creature in some sort of diabolocal canopy. 
    You can hear--drums?  --some sort of pulsing beat in the distance.  A soft chanting can be heard in
    the far distance, but you can see no sign of life.  Lonliness sends you into a panicky state.
  sector: city
  exits:
    south:
      to: tba:267:room:26732
      look: The strange trail continues on.
    west:
      to: tba:267:room:26728
      look: The bottom of Vice Hill starts to your west.
  extras:
  - keywords: [ribs, skeleton]
    text: >
      This must have been a HUGE monster!  Whoever slayed it--no, you'd rather just not have to find
      out.  Each rib seems to be razer-sharp at the edges, and the bones have been cleaned to a perfect white.

