      to: tba:267:room:26733
      look: The high path continues on.
    south:
      to: tba:267:room:26737
      look: The high path continues on.

"tba:267:room:26736":
  name: Trail of Terror
  description: >
    This trail is covered by the skeletal ribs of a huge creature in some sort of diabolocal canopy. 
    You can hear--drums?  --some sort of pulsing beat in the distance.  A soft chanting can be heard in
    the far distance, but you can see no sign of life.  Lonliness sends you into a panicky state.
  sector: city
  exits:
    north:
      to: tba:267:room:26734
      look: The strange trail continues on.
    south:
      to: tba:267:room:26738
      look: The strange trail continues on.
  extras:
  - keywords: [ribs, skeleton]
    text: >
      This must have been a HUGE monster!  Whoever slayed it--no, you'd rather just not have to find
      out.  Each rib seems to be razer-sharp at the edges, and the bones have been cleaned to a perfect white.

"tba:267:room:26737":
  name: High Path
  description: >
    This road is amazingly built--some sort of blax onyxlike substance, shined to a mirror-like gleam
    forms the main of the path.  Bricks of the same substance line the path--it doesn't look as if a piece
    of paper could be inserted between them.  The trees have been trimmed back to allow easy passage.
    Even among all this beauty, you sense a sinister presence.
  sector: city
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:267:room:26735
      look: The high path continues on.
    south:
      to: tba:267:room:26791
      look: A building of exquisite craftsmanship is to your south.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26727

"tba:267:room:26738":
  name: Trail of Terror
  description: >
    This trail is covered by the skeletal ribs of a huge creature in some sort of diabolocal canopy. 
    You can hear--drums?  --some sort of pulsing beat in the distance.  A soft chanting can be heard in
    the far distance, but you can see no sign of life.  Lonliness sends you into a panicky state.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:267:room:26736
      look: The strange trail continues on.
    south:
      to: tba:267:room:26797
      look: A building made of a strange, purely black substance is to your south.
      door:
        keywords: [Temple, of, terror]
        kind: door
        key: tba:267:obj:26728
        reset: locked
  extras:
  - keywords: [ribs, skeleton]
    text: >
      This must have been a HUGE monster!  Whoever slayed it--no, you'd rather just not have to find
      out.  Each rib seems to be razer-sharp at the edges, and the bones have been cleaned to a perfect white.

"tba:267:room:26739":
  name: Vice Hill
  description: >
    You stand at the zenith of a tall hill overlooking the entire island.  The view here would be
    breathtaking, were it not so sinister.  You can see a gooey, tarry brine to your north, and to all other
    directions a sinister, black forest is eerily silent.  If you look very carefully, you can see the
    harbours to your north and east.  The exits descend in all directions.
  sector: hills
  exits:
    north:
      to: tba:267:room:26709
      look: The hill descends down into a tarry road, filled with the gooey stuff.
    east:
      to: tba:267:room:26706
      look: You can see the creepy road.
    south:
      to: tba:267:room:26710
      look: The road is much more rocky in this direction.
    west:
      to: tba:267:room:26705
      look: You see the strange beach road.
  extras:
  - keywords: [brine, tar, goo, sinister, black, forest, harbour, see, view]
    text: >
      Nothing describes this island with more clarity than "horror".  All around you, you can sense evil,
      but you can't pinpoint why.  The entire island is quite silent--not a chirp can be heard.

"tba:267:room:26740":
  name: Cliff Road
  description: >
    The road is quite slippery here, and you can see to your far south what looks like a dropoff into
    absolute nothingness.  Rocks skitter as you slide around the road.  It really looks quite
    dangerous--the hill would be a much safer way to look at the view.
  sector: mountains
  exits:
    north:
      to: tba:267:room:26728
      look: You can see the bottom of Vice Hill to your north. It looks comparatively safe.
    south:
      to: tba:267:room:26741
      look: The cliff road continues on, though I suggest you don't take it.
  extras:
  - keywords: [cliff]
    text: You can't quite see it yet--all you can see is a line that extends across the horizon.

"tba:267:room:26741":
  name: Cliff Road
  description: >
    The road is even more slippery here, and you can see to your south what looks like a dropoff into
    absolute nothingness.  Rocks skitter as you slide around the road.  It really looks quite
    dangerous--you'd be much better going back--now.
  sector: mountains
  exits:
    north:
      to: tba:267:room:26740
      look: You can still go back--it's a better idea to anyways.
    south:
      to: tba:267:room:26742
      look: You ARE one for taking risks, aren't you?
  extras:
  - keywords: [cliff]
    text: You can now see a little of it.  It looks quite unstable.

"tba:267:room:26742":
  name: Cliff Road
  description: >
    The road is quite slippery here, and you can see to your south what looks like a dropoff into
    absolute nothingness.  Rocks skitter as you slide around the road.  It really looks quite dangerous--you'd
    be much better going back--now.
  sector: mountains
  exits:
    north:
      to: tba:267:room:26741
      look: You can still go back--it's a better idea to anyways.
    south:
      to: tba:267:room:26743
      look: Don't say we didn't warn you. It's a cliff allright. A big and unsteady one.
  extras:
  - keywords: [cliff]
    text: You can see it.  It looks quite close.  It looks very dangerous.

"tba:267:room:26743":
  name: Cliff Road
  description: >
    What a view!  If you weren't having such trouble staying up, you could see it much better.  Each
    step brings you closer to the edge--it looks very danger- ous, and the cliff's edge is quite close
    now.  The ground is beginning to shake under your weight.
  sector: mountains
  exits:
    north:
      to: tba:267:room:26742
      look: You can still go back--it's a better idea to anyways.
    south:
      to: tba:267:room:26744
      look: It's the cliff's edge. The ground looks quite unsteady there.
  extras:
  - keywords: [cliff]
    text: Umm...  We've warned you quite enough.  Either go back, or face the consequences.

"tba:267:room:26744":
  name: Cliff's Edge
  description: >
    The view is never better when you're seeing it from mid-air.  But you've only got a few seconds to
    see it, as you're squashed down below.  Too bad shrieks don't make you fly.
  sector: mountains
  flags: [no_mob, private]

"tba:267:room:26745":
  name: Entrance to the Building of Fear
  description: >
    Low moans seem to come from the walls as you stand before the fallen entrance to a huge building. 
    The walls appear to be made of some kind of gray stone-- that, or they have turned gray with age.  A
    passageway opens to your east, but you can't see anything in the room, because of the darkness.
    Shadows cast weird angles everywhere.  A faded plaque has hangs from a nail in a far corner of the room.
  sector: inside
  exits:
    east:
      to: tba:267:room:26746
      look: You can vaguly see some kind of picture or something on one of the walls...
    west:
      to: tba:267:room:26708
      look: The creepy road continues in that direction.
  extras:
  - keywords: [sign, note, plaque]
    text:
    - Building of Fear
    - HIGH PRIESTS OF TERROR ALLOWED SAFE PASSAGE ONLY
    - You have been forewarned.

"tba:267:room:26746":
  name: The Tapestry Room
  description: >
    Strange tapestries fill all the walls here.  Each one seems to depict a horrendous torture at the
    hands of some foul monster.  If you look closely enough, the pictures are so realistic, so clear, so
    true-to-life, that they look real.  Even closer examaniation reveals that they`re moving!  You
    probably don't want to stay here long.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:267:room:26748
      look: You see a room filled with trophies.
    west:
      to: tba:267:room:26745
      look: You can see the entrance to the Building of Fear.

"tba:267:room:26747":
  name: Gargoyle Room
  description: >
    The gargoyle looks quite stony--that is, until you reach out to touch it. Suddenly, it seems to
    come to life and move slightly or was that just a shadow.
  sector: inside
  flags: [no_mob, private]
  extras:
  - keywords: [gargoyle, statue]
    text: >
      It's a gargoyle, with a large gaping mouth.  Since you shouldn't be able to wee it, we're not going
      to tell you anything else.

"tba:267:room:26748":
  name: Trophy Room
  description: >
    There are literally hundereds of pedestals here, each with the skulls of a different animal.  Some
    are large, some quite small--some look like nothing you have ever seen before.  You can see a large
    ritual altar on one side of the room, and a strange room encased in seamless glass on the other half. 
    Behind the altar, a little uneavenness in the wall can be seen, as if someone cut perforations
    through the wall.
  sector: inside
  flags: [indoors, private]
  exits:
    north:
      to: tba:267:room:26747
      look: >
        There's something very strange up ahead. It looks like a huge statue--but you can clearly see a
        gaping maw...no human would ever make something so grotesque. It's quite frightening...it's probably not
        good that you go in there.
      door:
        keywords: [glass, glassdoor, door]
        kind: pickproof
        key: tba:267:obj:26729
        reset: locked
    east:
      to: tba:267:room:26750
      look: You see what looks to be a comfortable(?) waiting room.
    south:
      to: tba:267:room:26749
      look: You see nothing but a slight unevenness in the wall.
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26730
    west:
      to: tba:267:room:26746
      look: You can see a room filled with strange and horrifying tapestries.
  extras:
  - keywords: [pedestal, skull]
    text: >
      Each pedestal is about the size of your waist; each skull--well, it just depends.  None look
      benevolent...  Whoever caught them must have been a very skilled hunter.

"tba:267:room:26749":
  name: Dressing Room
  description: >
    This room looks to be more the kind of room where a person dresses than a butcher shop--meat racks,
    knives of all various and sundry sizes, and other assorted meat-preparing items lie strewn around
    the room.  There is, of course, the paltry coatrack, with what look to be strange robes in it.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:267:room:26748
      look: >
        You see the strange trophy room(which now begins to seem more a sacrificial chamber, as you look at
        it from this point of view...).
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26730

"tba:267:room:26750":
  name: Wailing Tower
  description: >
    The howls you heard at the entrance are much louder here.  It appears to be coming from above
    you--indeed, you can see a spiral staircase ascending into the building.  Should you go up?  You decide.
  sector: inside
  flags: [dark, no_mob, indoors, private]
  exits:
    west:
      to: tba:267:room:26748
      look: You can see the trophy room.
    up:
      to: tba:267:room:26751
      look: The spiral staircase ascends up farther than the eye can see.
  extras:
  - keywords: [stair, spiral, staircase]
    text: This staircase appears to go up to infinity.  You can't see where it ends.

"tba:267:room:26751":
  name: On the staircase
  description: >
    The wailing surrounds you entirely here.  You feel you might go mad if you don't leave this
    stairwell.  Over and over and over the sounds shriek over you. Perhaps you should go up--and quickly.
  sector: inside
  flags: [dark, no_mob, indoors, private]
  exits:
    up:
      to: tba:267:room:26753
      look: You see a very weirdly shaped hallway.
    down:
      to: tba:267:room:26750
      look: You see the bottom of the staircase.

"tba:267:room:26752":
  name: Cell
  description: >
    The stench of refuse is particularly strong here.  The cell can't be more than 3-by-2 meters.  A
    small cot is bolted to the floor, and a small drainage hole with no covering is in the mi268le of the
    room.  The floors slant down to the hole, and you can see streaks of rust where the iron bolts have
    oxidized. Manacles hang from the wall in the back of the cell, and you can see two skeletal hands, all
    that is left of what once must have been a human being.
  sector: inside
  flags: [dark, no_mob, indoors, private]
  exits:
    north:
      to: tba:267:room:26753
      look: You can see the strangely shaped hallway.
      door:
        keywords: [bars, cell, door]
        kind: door
        key: tba:267:obj:26713
        reset: locked
  extras:
  - keywords: [manacles, legirons, irons, hands, skeletal]
    text: >
      Two small hands are all that remain of what must have once been a small child, or a very small
      human.  You can see teeth marks where it looks like someone was trying to bite their way out.
  - keywords: [hole, drainage]
    text: >
      The hole is about the size of your fist, and from the smell, it doesn't take a whole lot of
      imagination to figure out what is supposed to go down in that one.
  - keywords: [cot, bed]
    text: >
      The cot is made of black.  A mattress made of straw lies on top of it--very thin, and certainly not
      comfortable.  Rats scuttle underneath the bed as you walk near it.

"tba:267:room:26753":
  name: Strangely shaped hallway.
  description: >
    This hallway appears to be nothing more than an extension around the stairs. Made from the same
    gray material as the rest of the building, this room seems to have something strange about it.  Perhaps
    it's the strange black tiling at certain points around the room.  There are doors leading in almost
    all directions, and the stairs continue on upward.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26754
      look: You see what looks to be the smoldered remains of a bonfire.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:267:room:26755
      look: You see what look to be crates and crates of supplies.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:267:obj:26731
        reset: locked
    south:
      to: tba:267:room:26752
      look: You see the bars of what is obviously a prison cell.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26713
        reset: locked
    up:
      to: tba:267:room:26757
      look: The stairs ascend upwards.
    down:
      to: tba:267:room:26751
      look: The stairs ascend downwards.

"tba:267:room:26754":
  name: Open Hearth
  description: >
    The damp remains of what was probably once a huge bonfire are strewn about the room.  The coals are
    mushy here, and they're everywhere.  They creep through the soles of your boots and get caught
    between your toes.  What a disgusting place.  You can exit this gross room to your south.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:267:room:26753
      look: You can see the strangely-shaped hallway.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [coals, fire, coal]
    text: >
      They're wet, and mushy.  As you pick one up, it crumbles into a disgusting mass of mud in your hand.

"tba:267:room:26755":
  name: Supply Room
  description: >
    Old, rotten crates are piled up everywhere here.  They appear to have been looted a long time ago. 
    Some have been shattered to pieces.  You have an exit to your west.
  sector: inside
  flags: [dark, no_mob, indoors, private]
  exits:
    west:
      to: tba:267:room:26753
      look: You can see the strangely-shaped hallway.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:267:obj:26731
        reset: locked
  extras:
  - keywords: [crates]
    text: >
      The crates are old, rotting, and totally empty--except for one, snuck in the corner.  It looks to
      have an o268 device of some kind in it.

"tba:267:room:26756":
  name: Deserted Bedroom
  description: >
    This lush chamber looks as if it hasn't been used for centuries.  A bed, once beautiful, has
    cobwebs hanging from its huge canopy.  The room is so dark that you can only view certain things even WITH
    a light.  A dresser is at the very back of the room.  You can exit to your north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:267:room:26757
      look: You see the creepy hallway.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [bed]
    text: >
      The bed has a pink/tapia canopy hanging over it, with cobwebs covering its entire surface.  The
      spiders seemed to have a heyday over this one.

"tba:267:room:26757":
  name: Creepy Hallway
  description: >
    You can hear strange music floating throughout the corridor.  The hallway is lit by some unknown
    source in an eerie green light.  The walls are painted a bright scarlet red.  Whoever painted this
    hallway didn't have kindness or bunnies and light in mind.  Exits lead in every direction but up.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26759
      look: You can see the creepy hallway.
    east:
      to: tba:267:room:26758
      look: You can see a door.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26732
        reset: locked
    south:
      to: tba:267:room:26756
      look: You can see a door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:267:room:26761
      look: You can see the creepy hallway.
    down:
      to: tba:267:room:26753
      look: The stairs descend downwards into nothingness.

"tba:267:room:26758":
  name: Office of the High Priest of Fear
  description: >
    This office is hardly the regular office.  The High Priest of Fear is obviously into the torture
    thing, as manacles, iron maidens, and racks line the walls.  A boiling cauldron of oil is in the very
    center of the room.  A door is to your west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:267:room:26757
      look: You can see the creepy hallway.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26732
        reset: locked
  extras:
  - keywords: [cauldron, boiling, oil]
    text: The thing bubbles.  It curdles the brain and sends chills down your spine.
  - keywords: [iron, maidens, maiden]
    text: >
      This coffin-like object is lined with huge spikes.  If closed, it looks like it would be an
      unpleasant experience.
  - keywords: [manacles, manacle, chain]
    text: The manacles are small, and have spikes on the insides of them.  They look very painful.

"tba:267:room:26759":
  name: Creepy Hallway
  description: >
    You can hear strange music floating throughout the corridor.  The hallway is lit by some unknown
    source in an eerie green light.  The walls are painted a bright scarlet red.  Whoever painted this
    hallway didn't have kindness or bunnies and light in mind.  You can go to your north or south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26760
      look: You can't see much in that direction.
      door:
        keywords: [closet]
        kind: door
        reset: closed
    south:
      to: tba:267:room:26757
      look: You see the creepy hallway.

"tba:267:room:26760":
  name: Closet
  description: >
    This closet has strange clothes strewn everywhere.  It probably wouldn't be a good idea to try them
    on.  A stale musty smell has infested everything in this small space.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:267:room:26759
      look: You see the creepy hallway.
      door:
        keywords: [Creepy, Hallway]
        kind: door
        reset: closed

"tba:267:room:26761":
  name: Creepy Hallway
  description: >
    You can hear strange music floating throughout the corridor.  The hallway is lit by some unknown
    source in an eerie green light.  The walls are painted a bright scarlet red.  Whoever painted this
    hallway didn't have kindness or bunnies and light in mind.  You can go to your north or east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26762
      look: You see the creepy hallway.
    east:
      to: tba:267:room:26757
      look: You see the creepy hallway.

"tba:267:room:26762":
  name: Creepy Hallway
  description: >
    You can hear strange music floating throughout the corridor.  The hallway is lit by some unknown
    source in an eerie green light.  The walls are painted a bright scarlet red.  Whoever painted this
    hallway didn't have kindness or bunnies and light in mind.  You can go to your north or south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26763
      look: You see the creepy hallway.
    south:
      to: tba:267:room:26761
      look: You see the creepy hallway.

"tba:267:room:26763":
  name: Creepy Hallway
  description: >
    You can hear strange music floating throughout the corridor.  The hallway is lit by some unknown
    source in an eerie green light.  The walls are painted a bright scarlet red.  Whoever painted this
    hallway didn't have kindness or bunnies and light in mind.  You can go to your south or west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26762
      look: You see the creepy hallway.
    west:
      to: tba:267:room:26764
      look: The end of the hallways opens up into the outside. It looks to be a balcony.

"tba:267:room:26764":
  name: Balcony
  description: >
    From here, you can see the entire island.  The vantange is breathtaking, and still looks to be
    sinister.  To your far south, you can see what looks like the ribs of a huge animal.  To your far east,
    you can see a pristine white beach. Most of the island is covered in forest, and extends around a huge
    hill.  The far, far north shows some absolutely huge trees, and a rather large, black pool of what
    can only be tar.  You can go back into the building by going east.
  sector: city
  exits:
    east:
      to: tba:267:room:26763
      look: You see the creepy hallway.

"tba:267:room:26765":
  name: Torture Chambre
  description: >
    This room is stacked high with torture instruments of all kinds, ranging from the mild shackle to
    spiked manacles, to several different whips, to some rather sinister-looking magical instruments, to a
    yoke that is obviously fitted to the human body.  This isn't a pleasant place.  An interrogation
    room lies to your east, and a teleporting zone is to your north.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    north:
      to: tba:267:room:26778
      look: You can see a teleportation square.
    south:
      to: tba:267:room:26766
      look: You see the screening room.
      door:
        keywords: [door]
        kind: door

"tba:267:room:26766":
  name: Screening Room
  description: >
    This is the room where all prisoners are interrogated.  Should they be found lacking in the
    information the interrogators need, they are taken to the torture chamber to your west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26767
      look: You see the outlay.
      door:
        keywords: [door]
        kind: door
        key: tba:267:obj:26733
    west:
      to: tba:267:room:26765
      look: You see the torture chambre.
      door:
        keywords: [door]
        kind: door

"tba:267:room:26767":
  name: Outlay
  description: >
    This room is an outlying area of the square hallway in the House of Despair. Strange pictures line
    the walls, and shrieks can be heard all around you.  You see no visible exits.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26766
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26733

"tba:267:room:26768":
  name: Outlay
  description: >
    This room is an outlying area of the square hallway in the House of Despair. Strange pictures line
    the walls, and shrieks can be heard all around you.  You see no visible exits.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26769
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26733

"tba:267:room:26769":
  name: Waiting Room
  description: >
    This room has nothing but two chair in it, lined with straps.  The walls are painted a sterile
    white, and the air has a hint of fog in it.  There is an interrogation center to your west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:267:room:26770
      look: You can see the interrogation room.

"tba:267:room:26770":
  name: Interrogation Center
  description: >
    A long, circular desk forms the central piece of furniture in this room.  A huge, stark chair is at
    the head, while smaller chairs line the rest.  An opening in the desk allows a person to be placed
    in the iron chair with straps in the center.  For what purpose, you shu268er to guess.  You can go
    back into the waiting room, or can go south through a teleportation device to the square room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:267:room:26769
      look: You see the waiting room.
    south:
      to: tba:267:room:26778
      look: You see a teleportation square.

"tba:267:room:26771":
  name: Office of the Priest of Despair
  description: >
    This plush office is full of every item that could ever please any child. From cute little cu268ly
    kittens to darling, stuffed dolls, they line the walls--just out of your reach.  A beautiful chair
    sits in the mi268le of the room, but it's bolted to the ground, and there's a huge spike in the center.
    What sicko would make a room up like this?  You can leave this place through a transporter to your
    east or go back to the waiting room to your west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:267:room:26778
      look: You see a transportation platform.
    west:
      to: tba:267:room:26772
      look: You see a waiting room.

"tba:267:room:26772":
  name: Waiting Room
  description: >
    This room has nothing but two chair in it, lined with straps.  The walls are painted a sterile
    white, and the air has a hint of fog in it.  There is an office to your east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:267:room:26770
      look: You can see the office of the Priest of Despair.

"tba:267:room:26773":
  name: Outlay
  description: >
    This room is an outlying area of the square hallway in the House of Despair. Strange pictures line
    the walls, and shrieks can be heard all around you.  You see no visible exits.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26772
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26733

"tba:267:room:26775":
  name: Alcove
  description: >
    This small alcove has no real interesting quality, save the fact that it has a large opening to a
    tar pit of boggling dimensions.  You can(and should) go back to your west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26727
      look: DON'T GO THAT WAY! It's a tar pit, STUPID! DORK!
    west:
      to: tba:267:room:26776
      look: You can see the sitting room.

"tba:267:room:26776":
  name: Sitting Room
  description: >
    Here the Priest of Despair could sit and watch as his prisoners (and hapless adventurers were
    thrown(or stupidly walked into) the tar pit.  Looks as though they were thrown in not far from here, as
    you can see telltale signs of scuffling around you.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:267:room:26775
      look: That's probably as close as you'd want to get to the tar pit.

"tba:267:room:26777":
  name: Outlay
  description: >
    This room is an outlying area of the square hallway in the House of Despair. Strange pictures line
    the walls, and shrieks can be heard all around you.  You see no visible exits.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:267:room:26776
      door:
        keywords: [door, secret]
        kind: door
        key: tba:267:obj:26733

"tba:267:room:26778":
  name: Square
  description: >
    Here, there are exits in all directions.  These, however, are no ordinary exits.  They're
    transporter platforms, each designed to be a room to step in to go to the designated areas.  A small sign is
    on a wall at the corner of the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26767
      look: You see a transporter platform.
    east:
      to: tba:267:room:26779
      look: You see a transporter platform.
    south:
      to: tba:267:room:26768
      look: You see a transporter platform.
    up:
      to: tba:267:room:26773
      look: You can see a transporter platform.
    down:
      to: tba:267:room:26777
      look: You see a transporter platform.
  extras:
  - keywords: [sign, note, plaque]
    text:
    - YOU HAVE ENTERED THE HALL OF DESPAIR
    - AUTHORIZED PERSONNEL AND PRISONERS ONLY!!!

"tba:267:room:26779":
  name: Entrance to the Hall of Hopelessness
  description: >
    You stand on a dusty floor in a fallen-down hut.  Just to the east, you can see the remains of a
    deserted corridor.  The entire chamber is empty and devoid of anything of any real interest.  You can
    see an transporter platform to your north.  All around you are depictions of people in inescapable
    situations.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26778
      look: You can see a transporter platform.
    east:
      to: tba:267:room:26781
      look: You can see the deserted corridor.
    south:
      to: tba:267:room:26722
      look: You can see a tarry tunnel.

"tba:267:room:26780":
  name: Deserted Corridor
  description: >
    A damp, musty hall leads north.  You detect no sounds--in fact, all sounds seem to be muted in this
    strange place.  The air seem thicker and heavier than usual.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26781
      look: You see a deserted corridor.
    east:
      to: tba:267:room:26783
      look: You see nothing.
      door:
        keywords: [door, secret]
        kind: door
    west:
      to: tba:267:room:26779
      look: You can see the entrance to the Hall of Hopelessness.

"tba:267:room:26781":
  name: Deserted Corridor
  description: >
    A damp, musty hall leads north and south.  You detect no sounds--in fact, all sounds seem to me
    muted in this strange place.  The air seem thicker and heavier than usual.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:267:room:26782
      look: You see a deserted corridor.
    east:
      to: tba:267:room:26783
      look: You see nothing.
      door:
