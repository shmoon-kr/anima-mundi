      look: You can see the entrance to the Hall of Hopelessness.

"tba:267:room:26783":
  name: Dark Room
  description: >
    The walls are totally painted black in this strange room.  You can detect nothing short of your
    hand in front of your face.  The air seem thicker and heavier than usual.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:267:room:26781
      look: You can see the deserted corridor.
      door:
        keywords: [door, secret]
        kind: door

"tba:267:room:26784":
  name: Through the Trees
  description: >
    Someone has most convieniently placed netting through the trees here, so you may walk along it
    without fear of falling.  This is probably best, as you are extremely high up from the ground.  You hear
    birds chirping right by you, and feel very peaceful here--that is, as long as you are in the trees. 
    You may go north or down.
  sector: forest
  exits:
    north:
      to: tba:267:room:26785
      look: The netting continues through the trees here.
    down:
      to: tba:267:room:26723
      look: You can see the bottom of Vice Hill from here.
  extras:
  - keywords: [netting]
    text: >
      The netting is firm, and made from some extremely tough substance--it looks quite strong, and
      supportable.  You don't need to fear being on it at all.

