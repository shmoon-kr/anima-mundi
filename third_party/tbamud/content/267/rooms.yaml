"tba:267:room:26709":
  name: Vice Hill
  description: >
    You are on a tall hill overlooking the entire island.  You can see the zenith to your far north;
    the hill blocks all the view to the north and on. To your south, you can see the beginnings of a
    rock-strewn-path...  Continuing further down, you can see the end of the hill.  The forest covers up most
    of the view from here.
  sector: hills
  exits:
    up:
      to: tba:267:room:26739
      look: Looking up, you can see the zenith of Vice Hill.
    down:
      to: tba:267:room:26723
      look: Looking down, you can see the end of the hill.

"tba:267:room:26710":
  name: Vice Hill
  description: >
    You are on a tall hill overlooking the entire island.  You can see the zenith to your far south;
    the hill blocks all the view to south and on.  To your south, you can see the beginnings of a
    rock-strewn path...  Continuing further down, you can see the end of the hill.  The forest covers up most of
    the view from here.
  sector: hills
  exits:
