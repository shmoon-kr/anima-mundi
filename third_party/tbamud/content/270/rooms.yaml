# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:270:room:27000":
  name: AsA's Zone Description Room
  description:
    preformatted: |2
         I hereby present the wasteland area, availiable to those concerned.  I have,
      deliberately, written short long_descriptions.  Because I consider them more
      useful that way, since most DIKU's are not inclined towards questing.
         Builder      : AsA
         Zone         : 270 Wasteland
         Player Level : 12-15
         Rooms        : 58
         Mobiles      : 13
         Objects      : 12
         Links        :
  sector: inside

