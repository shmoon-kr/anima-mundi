"tba:56:room:5639":
  name: A Split In The River
  description: >
    The waters of the river crash down upon a rock and split into two bodies of water.  The river you
    are on continues its southern course and the new river heads off to the east.  To your west you notice
    that the rocks have split and crumbled as if torn asunder by some massive force.  It looks
    impossible to traverse.  The River of Lost Souls also continues to the north.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5638
    east:
      to: tba:56:room:5620
    south:
      to: tba:56:room:5640

