"tba:56:room:5624":
  name: River Ishtar
  description: >
    The river flows out from the city down a long winding gully towards the Sea of Dragons.  To the
    south of you lies the Great Eastern Desert and north a wide open expanse of grass.  You can just barely
    make out a road that seems to be traveling along side the river but the banks are to steep for you to
    see very far.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5625
    west:
      to: tba:54:room:5483

"tba:56:room:5625":
  name: River Ishtar
  description: >
    The river continues its descent down the lowlands flowing ever so gently south.  It is hard to
    believe this is the same river that came cascading down the mountainside.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5626
    west:
      to: tba:56:room:5624

"tba:56:room:5626":
  name: River Ishtar
  description: >
    Small animals and herd animals can be heard in the distance, though you don't actually see any near
    the river.  Perhaps the steep slopes pervent them from using the river.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5684
    west:
      to: tba:56:room:5625

"tba:56:room:5627":
  name: The Edge Of The Ravine
  description: >
    You stand at the edge of a really long drop down.  A small rope bridge has conviently been placed
    here to allow you access to the other side of the bridge.  Unfortunately the wind seems to be kicking
    up making the bridge sway slightly.  The path leads off through the mountains to the east.
  sector: mountains
  exits:
    east:
      to: tba:56:room:5628
    west:
      to: tba:56:room:5609

