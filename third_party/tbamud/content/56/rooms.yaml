"tba:56:room:5605":
  name: A Hall
  description: >
    You stand in a large cedar wood hall leading east and west.  On the floor lies a thin and narrow
    purple rug.  The hall leads west inside the Palace and east to the Grand Entrance.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5550
    west:
      to: tba:55:room:5573

"tba:56:room:5606":
  name: A Path Through The Mountains
  description: The narrow path turns here heading south and west.
  sector: mountains
  exits:
    south:
      to: tba:56:room:5607
    west:
      to: tba:56:room:5611

"tba:56:room:5607":
  name: A Path Through The Mountains
  description: >
    Travel is hard and slow as you almost have to climb around large boulders strewn about the path.
  sector: mountains
  exits:
    north:
      to: tba:56:room:5606
    east:
      to: tba:56:room:5608

"tba:56:room:5608":
  name: The Edge Of The Ravine
  description: >
    The ground drops off below down to a rushing river.  A small rope bridge sways to and fro in the
    wind giving you access to the other side.
  sector: mountains
  exits:
    east:
      to: tba:56:room:5609
    west:
      to: tba:56:room:5607

"tba:56:room:5609":
