"tba:56:room:5665":
  name: On The Dark River
  description: >
    The river, following a low spot in the foothills, bends and twists. Tall mountains can be seen off
    to the south and east.
  sector: water_noswim
  flags: [dark]
  exits:
    north:
      to: tba:56:room:5664
    south:
      to: tba:56:room:5666

"tba:56:room:5666":
  name: On The Dark River
  description: The river makes a wide sweeping turn here into the mountain.
  sector: water_noswim
  flags: [dark]
  exits:
    north:
      to: tba:56:room:5665
    west:
      to: tba:56:room:5667

"tba:56:room:5667":
  name: On The Dark River
  description: >
    The river flows west from here into the heart of the mountain and east towards the foothills once
    more.
  sector: water_noswim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:56:room:5666
    west:
      to: tba:56:room:5668

"tba:56:room:5668":
  name: On The Dark River
  description: >
    You can barely make out what is ahead of you as the river flows quietly through the passageway.
  sector: water_noswim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:56:room:5667
    south:
      to: tba:56:room:5669

"tba:56:room:5669":
  name: On The Dark River
  description: >
    The river slowly flows west towards the heart of the mountain.  There are small cracks in the
    passage wall to the north where you might be able to get up out of the water.
  sector: water_noswim
  flags: [dark, indoors]
  exits:
    north:
      to: tba:56:room:5672
    east:
      to: tba:56:room:5668
    west:
      to: tba:56:room:5670

"tba:56:room:5670":
  name: On The Dark River
  description: >
    The river continues east and west from here flowing south of a dark ledge high above the water
    level.
  sector: water_noswim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:56:room:5669
    west:
      to: tba:56:room:5671

"tba:56:room:5671":
  name: On The Dark River
  description: >
    The river flows south through a narrowing part of the passage as it progresses deeper into the
    mountain.
  sector: water_noswim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:56:room:5670
    south:
      to: tba:50:room:5005

"tba:56:room:5672":
  name: On A Small Ledge
  description: >
    You clamber out of the water up onto this narrow ledge to see if it leads deeper into the
    mountain.  Unfortunately, the ledge is only wide enough to rest upon for a while and there does not appear to
    be any other exits other than rejoining the underground river.
  sector: field
  flags: [dark, indoors]
  exits:
    south:
      to: tba:56:room:5669

"tba:56:room:5681":
  name: On The Plains
  description: >
    You stand on an open expanse of grass extending in all directions. To the south of you stand the
    might northern gates of New Thalos.  East and west of you the grassy fields continue and north, in the
    distance, you see a line of trees.
  sector: field
  exits:
    north:
      to: tba:56:room:5682
    east:
      to: tba:56:room:5681
    south:
      to: tba:55:room:5567
    west:
      to: tba:56:room:5681

"tba:56:room:5682":
  name: On The Plains
  description: >
    You stand on an open field of grass.  The forest to the north is closer but still a good distance
    away.  To the south a small dirt path has been trodden into the ground heading towards New Thalos.
  sector: field
  exits:
    north:
      to: tba:56:room:5683
    east:
      to: tba:56:room:5682
    south:
      to: tba:56:room:5681
    west:
      to: tba:56:room:5682

"tba:56:room:5683":
  name: The Edge Of The Forest
  description: >
    You stand at the edge of a huge forest.  The line of trees continues as far as the eye can see to
    the east and west.  A large expanse of grass spreads out to the south.
  sector: field
  exits:
    east:
      to: tba:56:room:5683
    south:
      to: tba:56:room:5682
    west:
      to: tba:56:room:5683

"tba:56:room:5684":
  name: River Ishtar
  description: >
    The river broadens even more here and the waters become murky. The smell of saltwater has reached
    you from the east.  The Dragon Sea cannot be far away.  To the east you can see the faint outline of a
    city and to the north you see a large expanse of grass.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5685
    west:
      to: tba:56:room:5626

"tba:56:room:5685":
  name: The River Delta
  description: >
    This is where the river empties out into the Dragon Sea.  The backrush of water has kicked up a lot
    of sand and the blue sea is stained where the river empties.  Looking west all you can see is
    water... all the way to the horizon.  North of here is a small dock you think you should be able to reach
    with out too much trouble.  The river stretches off to the west back towards New Thalos.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5686
    west:
      to: tba:56:room:5684

"tba:56:room:5686":
  name: The Dragon Sea
  description: >
    You are on the clear blue seas of the Dragon Sea.  Water extends in all directions as far as the
    eye can see.  Off in the distance you think you might see a small dock to the north.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5687
    east:
      to: tba:56:room:5686
    south:
      to: tba:56:room:5686
    west:
      to: tba:56:room:5685

"tba:56:room:5687":
  name: The Dragon Sea
  description: >
    The Dragon Sea comes up along the shore here.  The deep blue waters rolling in and crashing against
    the beach.  To the north you see a small dock jutting out into the surf.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5695
    east:
      to: tba:56:room:5696
    south:
      to: tba:56:room:5686

"tba:56:room:5688":
  name: The Dragon Sea
  description: >
    You are on the clear blue seas of the Dragon Sea.  Water extends in all directions as far as the
    eye can see.  Off in the distance you think you might see a small dock to the west.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5688
    east:
      to: tba:56:room:5697
    south:
      to: tba:56:room:5695

"tba:56:room:5689":
  name: The Dragon Sea
  description: >
    You are on the clear blue seas of the Dragon Sea.  Water extends in all directions as far as the
    eye can see.  Off in the distance you think you might see a small dock to the west.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5697
    east:
      to: tba:56:room:5689
    south:
      to: tba:56:room:5696
    west:
      to: tba:56:room:5695
    down:
      to: tba:56:room:5698

"tba:56:room:5690":
  name: On A Road
  description: >
    The people of New Thalos take great pride in the services their city may provide.  One of these
    services is the construction crews the go to great lengths to keep all the roads in order.  Although the
    taxes in New Thalos are higher then other cities in the realm most of the money is used for the good
    of the people.
  sector: field
  exits:
    east:
      to: tba:56:room:5691
    west:
      to: tba:55:room:5568

"tba:56:room:5691":
  name: On A Road
  description: >
    You walk along a well used road with beautiful scenery.  To the north tall pine trees form a wall
    that goes on for miles.  Between the road and the trees lies a great expanse of grassy plains.  South
    of here, beyond the river, lies the Great Eastern Desert.  The road continues east and west.
  sector: field
  exits:
    east:
      to: tba:56:room:5692
    west:
      to: tba:56:room:5690

"tba:56:room:5692":
  name: On A Road
  description: >
    The Dragon Sea can be seen to the east now spreading out to unknown lands.  The road continues east
    and west.  To the south you hear the sounds of boats traveling the River Ishtar delivering goods.
  sector: field
  exits:
    east:
      to: tba:56:room:5693
    west:
      to: tba:56:room:5691

"tba:56:room:5693":
  name: On A Road
  description: >
    This is the man land route through the land.  Merchants can bring their goods to the coastline and
    have them ferried onto ships for export.  Travel by foot west will take you through New Thalos up and
    over the Eastern Mountains and down into Midgaard.
  sector: field
  exits:
    east:
      to: tba:56:room:5694
    west:
      to: tba:56:room:5692

"tba:56:room:5694":
  name: Near The Shore
  description: >
    The road ends here turning into a small dirt path leading down the beach and onto a dock.  To the
    north and south you see the coastline stretching out before you.  West of here the lowlands roll up
    into huge snow capped mountains.
  sector: field
  exits:
    east:
      to: tba:56:room:5695
    west:
      to: tba:56:room:5693

"tba:56:room:5695":
  name: On A Dock
  description: >
    You stand on a simple wooden dock that acts as an extension of the road to the west.  The dock
    seems to have been here for quite a long time but is still sturdy.  A small ladder has been built on the
    eastern end to allow easy access to and from ships.
  sector: city
  exits:
    north:
      to: tba:56:room:5688
    east:
      to: tba:56:room:5689
    south:
      to: tba:56:room:5687
    west:
      to: tba:56:room:5694

"tba:56:room:5696":
  name: The Dragon Sea
  description: >
    You are on the clear blue seas of the Dragon Sea.  Water extends in all directions as far as the
    eye can see.  Off in the distance you think you might see a small dock to the west.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5689
    east:
      to: tba:56:room:5696
    west:
      to: tba:56:room:5687

"tba:56:room:5697":
  name: The Dragon Sea
  description: >
    The ocean spreads out in all directions rolling gently.  In the distance you can see an island on
    the horizon.  To the west you see the mainland.
  sector: water_noswim
  exits:
    north:
      to: tba:56:room:5697
    east:
      to: tba:56:room:5697
    south:
      to: tba:56:room:5689
    west:
      to: tba:56:room:5688

"tba:56:room:5698":
  name: Under The dock
  description: >
    You are swiming underneath the dock.  You can see the four wooden pylons that support the
    structure.  The murky water clouds you vision as you gaze westward, but you think you can make out an iron
    grating in that direction.
  sector: water_noswim
  flags: [dark]
  exits:
    west:
      to: tba:56:room:5699
      door:
        keywords: [grate]
        kind: door
        reset: closed
    up:
      to: tba:56:room:5697

"tba:56:room:5699":
  name: The Lair Of The Ixitxachitl
  description: >
    Blood swirls around in the water as the Ixitxachitl devours the last of its meal.  Swirling around
    quickly as you intrude upon his meal the large sting ray attacks!
  sector: water_noswim
  flags: [dark]
  exits:
    east:
      to: tba:56:room:5698
      door:
        keywords: [grate]
        kind: door
        reset: closed
