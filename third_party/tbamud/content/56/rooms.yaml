  description: The small rope bridge shudders under your weight as you make your way across the valley.
  sector: field
  exits:
    east:
      to: tba:56:room:5627
    west:
      to: tba:56:room:5608

"tba:56:room:5610":
  name: The Ledge Around The Valley
  description: >
    You are walking around a small ledge overlooking a large valley deep within the eastern mountains. 
    The ledge turns north following the shape of the valley and a steep trail continues to the east.
  sector: mountains
  exits:
    east:
      to: tba:56:room:5611

"tba:56:room:5611":
  name: A Path Through The Mountains
  description: >
    You are walking through a rock strewn path deep within the mountains east of Midgaard.  The going
    is rough and you constantly twist your ankle on the small stones lying about.
  sector: mountains
  exits:
    east:
      to: tba:56:room:5606
    west:
      to: tba:56:room:5610

"tba:56:room:5612":
  name: On The Eastern Edge Of The Mountains
  description: >
    You stand on the eastern edge of the eastern mountains.  The high peaks lie to the west and rolling
    hills and plains open up to your east.
  sector: mountains
  exits:
    south:
      to: tba:56:room:5613
    west:
      to: tba:56:room:5629

"tba:56:room:5613":
