"tba:56:room:5618":
  name: On A Road
  description: >
    You stand on a well maintained road leading east towards New Thalos and west towards the Eastern
    Mountains.  To the north you can see wide plains stretching out as far as the eye can see.  South of
    you begins a dark green forest.
  sector: field
  exits:
    east:
      to: tba:55:room:5569
    west:
      to: tba:56:room:5617

"tba:56:room:5619":
  name: The Headwaters Of The River Of Lost Souls
  description: >
    You are at the headwaters of what is oft called the darkest river in the land.  Looking at the
    swampy water pooling in this rocky valley, you can see why the water downstream is so dark.  The rock
    walls reach up around you blocking all exits except that to the north up onto the banks, and to the
    south where the river flows.
  sector: water_noswim
  exits:
    north:
      to: tba:15:room:1500
      look: There is a small path leading away from the bank just to the north.
    south:
      to: tba:56:room:5634
      look: The waters of this swampy pool are flowing slowly towards the south.

"tba:56:room:5620":
  name: River Ishtar
  description: >
    The river calms a bit after being thrashed in the interior of the mountain.  Although still deep
    within the rocks you can see faint traces of green to the east.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5621
    west:
      to: tba:56:room:5639

