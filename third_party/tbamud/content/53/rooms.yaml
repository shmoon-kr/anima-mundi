  exits:
    north:
      to: tba:53:room:5355
      look: You see only a wall of whirling, blowing, dry sand.
    east:
      to: tba:53:room:5356
      look: You see only a wall of whirling, blowing, dry sand.
    south:
      to: tba:53:room:5357
      look: You see only a wall of whirling, blowing, dry sand.
    west:
      to: tba:53:room:5356
      look: You see only a wall of whirling, blowing, dry sand.
  extras:
  - keywords: [sand]
    text: >
      Sand is about all you CAN see right now.  Unfortunately, it isn't very interesting sand, only
      white, dry, and blowing all over the place.

"tba:53:room:5357":
  name: A Swirling Sandstorm
  description: >
    You are caught in the midst of a massive sandstorm.  Howling winds buffet you from all sides, and
    the sand tears at your skin, blinding you and choking you.  You have lost all sense of direction.
  sector: field
  exits:
    north:
      to: tba:53:room:5356
      look: You see only a wall of whirling, blowing, dry sand.
    east:
      to: tba:53:room:5357
      look: You see only a wall of whirling, blowing, dry sand.
    south:
      to: tba:53:room:5358
      look: You see only a wall of whirling, blowing, dry sand.
    west:
      to: tba:53:room:5357
      look: You see only a wall of whirling, blowing, dry sand.
