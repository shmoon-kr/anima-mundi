  - keywords: [sand]
    text: >
      Sand is about all you CAN see right now.  Unfortunately, it isn't very interesting sand, only
      white, dry, and blowing all over the place.

"tba:53:room:5358":
  name: A Massive Sand Dune
  description: >
    Somehow you managed to make your way through the howling winds of the sandstorm, and clamber up on
    this sand dune.  You can see the storm to the north of you, and presumably the pyramid is somewhere
    beyond it.  Nothing but flat, featureless, open dunes of sand lie in every other direction.
  sector: field
  exits:
    north:
      to: tba:53:room:5357
      look: You see only a wall of whirling, blowing, dry sand.
    south:
      to: tba:53:room:5359
      look: >
        On the southern side of the sand dune is a small hole in the sand. For some reason you seem unable
        to get to it.
      door:
        keywords: [riddle]
        kind: pickproof
        key: tba:53:obj:5317
        reset: locked
  extras:
  - keywords: [hieroglyphics, symbols]
    text: >
      Like most of the ancient hieroglyphics of this land, the symbols are totally incomprehensible to
      you.  Perhaps the Sphinx has the answer to this ancient riddle.
  - keywords: [riddle]
    text: A vision forms before your eyes, in glowing hieroglyphic symbols.
  - keywords: [sand, dune]
    text: The sand is very white, and very sandy.  There sure is a lot of it.

"tba:53:room:5359":
  name: Through The Hole In The Sand
  description: >
    You squeeze through the small hole in the sand and land in a small white chamber.  Above you is a
    small hole, reachable by climbing up the small sandy slope down which you slid.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:53:room:5358
      look: You see a sand dune.
