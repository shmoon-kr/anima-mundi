# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 16.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:16:room:1600":
  name: A Wide Dirt Path
  description: >
    This path is several yards in width and the dirt is packed solid.  Hundreds of people must have
    marched along this trail.  It almost looks like an army was marched through here.  A lake shrouded in
    fog is to the west and the city wall is to the east.
  sector: inside
  exits:
    north:
      to: tba:16:room:1625
    south:
      to: tba:7:room:775
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 16 Camelot II
        Related Zones: 7 Camelot, 17 Camelot III
        Began        : 1997, one of my first zones.
        Player Level : 20-30
        Rooms        : 100
        Mobs         : 36
        Objects      : 21
        Shops        : 1
        Triggers     : 1
        Theme        : Medieval
        Plot         : The zone is based off the theme of Camelot. Based off the theme
                       of Camelot, king arthur, the knights, the round table merlin,
                       etc. Only reachable by teleport. Originally started with zone 16
                       and 17, ran out of room so also used a few rooms in zone 7. zone
                       7 is now used for extra rooms where needed.
        Zone 16 is linked to the following zones:
          7 Camelot                        at  1600 (south) --->   775
          7 Camelot                        at  1602 (south) --->   777
          7 Camelot                        at  1603 (south) --->   778
          7 Camelot                        at  1604 (south) --->   779
          7 Camelot                        at  1605 (south) --->   780
          7 Camelot                        at  1609 (south) --->   784
          7 Camelot                        at  1611 (south) --->   786
          7 Camelot                        at  1612 (south) --->   787
          7 Camelot                        at  1614 (south) --->   789
          7 Camelot                        at  1615 (south) --->   790
         17 Camelot III                    at  1623 (south) --->  1727
          7 Camelot                        at  1624 (south) --->   799
          7 Camelot                        at  1644 (south) --->   795
          7 Camelot                        at  1648 (south) --->   785
         17 Camelot III                    at  1671 (west ) --->  1796

"tba:16:room:1601":
  name: East Lane
  description: >
    Another tower rises above the battlements to the south.  This one is positioned over the main
    gate.  More guards and lookouts are keeping watch above you.  They must be awaiting an attack, but who or
    what could make it across that lake?
  sector: inside
  exits:
    north:
      to: tba:16:room:1626
    west:
      to: tba:16:room:1602

"tba:16:room:1602":
  name: Courtyard
  description: >
    You hear a loud clashing of metals from the north where an open door leads into a smoke filled
    room.  The courtyard extends to the south and west while to the east a path runs along the castle wall.
  sector: inside
  exits:
    north:
      to: tba:16:room:1627
    east:
      to: tba:16:room:1601
    south:
      to: tba:7:room:777
    west:
      to: tba:16:room:1603

"tba:16:room:1603":
  name: Courtyard
  description: >
    Two guards are escorting a raving lunatic out of the courtyard.  The lunatic is screaming about the
    walking undead.  The guards look around nervously then club him in the head with the hilt of their
    swords, knocking him out.
  sector: inside
  exits:
    east:
      to: tba:16:room:1602
    south:
      to: tba:7:room:778
    west:
      to: tba:16:room:1604

"tba:16:room:1604":
  name: Courtyard
  description: >
    You have reached the northwest corner of the courtyard.  A beggar is sitting here asking for
    money.  You ignore him but then you look at his eyes.  He motions you over and you obey, but not of your
    own will.  He hands you a note and tells you to read it which you do without any questions.
  sector: inside
  exits:
    east:
      to: tba:16:room:1603
    south:
      to: tba:7:room:779
  extras:
  - keywords: [note]
    text: >
      The note reads: The king hides the truth from his followers.  He fears that if they knew the truth
      they would all leave him and Camelot would be defenseless.  The threat comes from a time portal to
      the northwest where the dead have returned and seek to gain possession of Camelot.  Very few know the
      truth.....  The note suddenly dissolves in your hands.

"tba:16:room:1605":
  name: Main Hall
  description: >
    The hall continues north and south.  You hear a commotion of whining voices to the north.  To the
    south it looks like another hall intersects this one.  A noblewoman storms by you in a rage.  What is
    wrong with these people?
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1630
    south:
      to: tba:7:room:780
    west:
      to: tba:16:room:1606

"tba:16:room:1606":
  name: Meeting Room
  description: >
    This is where the nobles meet to discuss their stately matters and try to feel important.  The room
    is empty right now and doesn't look like it has been used in quite some time.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1605

"tba:16:room:1607":
  name: Scullery
  description: >
    A miserable looking servant who is scrubbing pots and pans splashes you with some soapy, brown
    water.  He smirks as you try to rub out the brown stains on your clothes, then he continues scrubbing at
    the dirty pans.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1632
    west:
      to: tba:16:room:1608

"tba:16:room:1608":
  name: Kitchen
  description: >
    A servant suddenly appears out of the wall to the south, a hidden door closing behind him.  This
    must be how they carry the food to the different parts of the castle since servants aren't allowed to
    pass through the main halls of the castle.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1633
    east:
      to: tba:16:room:1607
    south:
      to: tba:16:room:1621
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:16:room:1609":
  name: Center Lane
  description: >
    Tall stone walls rise above you to the east and west.  Guards are patrolling the battlements above
    you.  This area seems to be deserted.  The guards look down at you distrustfully.  You get the
    feeling that they don't want you here.
  sector: inside
  exits:
    north:
      to: tba:16:room:1634
    south:
      to: tba:7:room:784

"tba:16:room:1610":
  name: Noble's Bedroom
  description: >
    These chambers seem to have been vacated long ago.  Layers of dust cover everything and the air has
    a stale uncirculated stench.  A closet and several bureaus are overflowing with discarded clothes
    that went out of style long ago.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1611

"tba:16:room:1611":
  name: Nobles' Quarters
  description: >
    You are trespassing in the Nobles' Quarters.  They negligently forgot to lock all the doors,
    relying upon the honor of all within Camelot to protect their possessions.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1636
    east:
      to: tba:16:room:1610
    south:
      to: tba:7:room:786

"tba:16:room:1612":
  name: Knights' Quarters
  description: >
    You have entered the knights' barracks.  Cots and armor stands fill the room. Some knights are here
    sleeping and healing from their war wounds.  A simple wash stand is at the end of the quarters and
    the windows are shaded to darken the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1637
    south:
      to: tba:7:room:787
    west:
      to: tba:16:room:1613

"tba:16:room:1613":
  name: Meeting Room
  description: >
    Several knights sit around a rickety table on unstable chairs that look like they will shatter to
    pieces at any minute from the weight of the knights and their armor.  They are quietly discussing the
    last battle they were in.  You catch a few words about the walking dead and some invincible foe.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1612

"tba:16:room:1614":
  name: Squires' Quarters
  description: >
    Activity swirls around the long wooden benches and tables where at present people are eating. 
    There is a rudimentary camp kitchen, with a roster of the day.  Bunks line the walls and an ad hoc table
    has been setup for quick meals between chores for the ever busy squires.  To the south is a quick
    exit to the outside of the city for the squires longer errands.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1639
    south:
      to: tba:7:room:789

"tba:16:room:1615":
  name: Knights Way
  description: >
    You stand on Knights Way.  Knights' pennons are stuck in the ground on both sides of the road, with
    their coats of arms flapping in the breeze.  There are available slots for other coats of arms.  A
    small alley to the west leads into darkness.
  sector: inside
  exits:
    north:
      to: tba:16:room:1640
    south:
      to: tba:7:room:790
    west:
      to: tba:16:room:1616

"tba:16:room:1616":
  name: Dark Alley
  description: >
    You walk in the shadows of the alley, looking around cautiously.  No matter how honorable the
    people in this castle must be, you're sure there are thieves among them.  You stop in surprise as you see
    a tower appear to the west where a second before you hadn't seen anything.
  sector: inside
  exits:
    east:
      to: tba:16:room:1615
    west:
      to: tba:16:room:1617

"tba:16:room:1617":
  name: Merlin's Tower
  description: >
    You have found Merlin's tower.  It is a jumbled mess of books, scrolls, wands and staves.  There
    are rickety worn out tables and chairs upon which a variety of curiosities rest.  You take a glimpse
    out the open window of Merlin's tower and see the tournament yard below.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1616
    up:
      to: tba:16:room:1618

"tba:16:room:1618":
  name: Merlin's Tower
  description: >
    Merlin has specimens of this and that in crocks on wooden shelves.  Several animals are around the
    room.  A cat purrs softly, a crow cocks its head sideways while staring up at you and a toad croaks
    from inside one of the jars.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:16:room:1619
    down:
      to: tba:16:room:1617

"tba:16:room:1619":
  name: Merlin's Tower
  description: >
    You sift through the books, scrolls, wands, and staves that line the walls and clutter the floor. 
    All are inscribed in a strange runic language which you can't even begin to fathom.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:16:room:1620
    down:
      to: tba:16:room:1618

"tba:16:room:1620":
  name: Merlin's Tower
  description: >
    Crocks line the shelves, giving off strange odors.  You fumble through Merlins crockery but all you
    accomplish is getting a black itchy substance all over your fingers and clothing.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:16:room:1645
    down:
      to: tba:16:room:1619

"tba:16:room:1621":
  name: Hidden Passage
  description: >
    This passage is dark and narrow.  Cobwebs hang from the ceiling and dust covers the floor. 
    Hopefully you won't meet anybody.  There isn't even enough room for two people to walk abreast.  Torches are
    spaced too far apart to really help.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1608
      door:
        keywords: [door]
        kind: door
    west:
      to: tba:16:room:1622

"tba:16:room:1622":
  name: Hidden Passage
  description: >
    The narrow passage continues.  You've lost all sense of direction since the walls seem to be
    slightly curved and you can't see more than a dozen feet ahead. You hear people talking through the thin
    walls, but you can't quite understand what they are saying.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1621
    west:
      to: tba:16:room:1623

"tba:16:room:1623":
  name: Hidden Passage
  description: >
    Another hidden door is barely visible to the west.  You brush the cobwebs out of your hair and the
    dust off your armor.  You hear more voices through to the west.  It sounds like an argument is going
    on.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1622
    south:
      to: tba:17:room:1727
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:16:room:1624":
  name: Open Field
  description: >
    More farmers are cultivating the fields for planting.  They are looking around nervously and don't
    seem to be enjoying their work very much.  You wonder whose land this really is.  The castle sits on
    an island to the east but you don't see any means to reach it.  The path continues north and south.
  sector: inside
  exits:
    north:
      to: tba:16:room:1649
    south:
      to: tba:7:room:799

"tba:16:room:1625":
  name: A Wide Dirt Path
  description: >
    The path continues.  In some of the softer spots in the road you can see footprints that sink deep
    into the mud.  Whoever went through here was either wearing a lot of armor or carrying a lot of
    weight.  The lake and the city wall are still forcing you north or south along the trail.
  sector: inside
  exits:
    north:
      to: tba:16:room:1650
    south:
      to: tba:16:room:1600

"tba:16:room:1626":
  name: East Lane
  description: >
    A beggar lies on the side of the road in a gutter.  He motions to you to come over.  You
    reluctantly kneel down to hear what he has to say.  He immediately starts rambling on crazily about his dead
    friends that are coming back to kill him to get back the money he owes them.  You walk away in disgust.
  sector: inside
  exits:
    north:
      to: tba:16:room:1651
    south:
      to: tba:16:room:1601

"tba:16:room:1627":
  name: Blacksmith
  description: >
    The blacksmith looks up hoping to make another sale but when he sees your clothes he immediately
    dismisses you.  You continue into the room but he ignores you.  He negligently points to a sign on the
    wall and tells you to get out.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1602
  extras:
  - keywords: [sign]
    text: Blacksmith closed, by order of the King.

"tba:16:room:1628":
  name: Armory
  description: >
    You stand in the Armory of Camelot.  The master blacksmith and his three apprentices are busy
    constructing a suit of armor for a knight.  Various pieces of armor are here in varying states of repair. 
    There is a large weapons rack on the eastern wall.  To the west is Knight's Way.  The smith looks at
    you and says, 'Can't you read?  I'm closed.  All my work is done for the king's army now.'
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1653

"tba:16:room:1629":
  name: Waiting Room
  description: >
    More nobles are here pacing back and forth or shuffling their feet in irritation.  One of them
    paces by muttering about having to pay the king more of his hard earned taxes.  This room has only a
    couple chairs and looks to be more like a servants quarters than a waiting room for nobles.  Something
    big must be happening to bring in all these nobles at once.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1630

"tba:16:room:1630":
  name: Main Hall
  description: >
    Doors to the east and west are open and you see people waiting patiently inside.  The hall
    continues north and south.  A noble walks from one room to the other muttering about not being told the truth
    and being treated like a commoner.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1655
    east:
      to: tba:16:room:1629
    south:
      to: tba:16:room:1605
    west:
      to: tba:16:room:1631

"tba:16:room:1631":
  name: The Temple of Camelot
  description: >
    The walls of the room are a bright white and polished to a shine.  A magnificent altar fills the
    far side of the room with short pews on each side of the main aisle.  Candles line both walls and a
    peaceful quiet fills the room.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:16:room:1630

"tba:16:room:1632":
  name: Kitchen
  description: >
    Rows of pots, pans and utensils line the walls.  The cooks and servants push you out of their way
    and look at you as if you were last week's meatloaf.  This kitchen is humongous and continues to the
    south and west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1607
    west:
      to: tba:16:room:1633

"tba:16:room:1633":
  name: Kitchen
  description: >
    The pleasant aromas hit you with a blast of heat as you walk by the ovens and a large pot over a
    fire.  Cooks and servants run around preparing meals and adding spices.  One extremely fat cook is
    walking around with a large spoon, sampling the various soups with it, then hitting anyone who isn't
    moving fast enough for her liking.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1632
    south:
      to: tba:16:room:1608
    west:
      to: tba:16:room:1634

"tba:16:room:1634":
  name: Center Lane
  description: >
    A tall stone wall rises above you to the west.  Guards patrolling the battlements above you stare
    down distrustfully.  An open doorway to the east carries the delicious smell of baking bread and
    roasted meat.
  sector: inside
  exits:
    north:
      to: tba:16:room:1659
    east:
      to: tba:16:room:1633
    south:
      to: tba:16:room:1609

"tba:16:room:1635":
  name: Noble's Quarters
  description: >
    You are standing in vacated chambers.  Perhaps you will stay a while since the bed looks extremely
    comfortable.  It looks like a down mattress with a fleece blanket spread over it.  A closet and
    several bureaus are overflowing with colorful clothes that you wouldn't be caught dead in.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1636

"tba:16:room:1636":
  name: Common Room
  description: >
    This room is where the nobles gather to discuss all of their "important matters".  Servants stand
    around waiting to fetch some wine or carry a message for their masters.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1661
    east:
      to: tba:16:room:1635
    south:
      to: tba:16:room:1611

"tba:16:room:1637":
  name: Knights' Quarters
  description: >
    The knights' barracks continues to the north and south.  More cots and suits of armor fill the
    room.  Several knights are healing from their war wounds. The only conversation is in hushed tones.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1662
    south:
      to: tba:16:room:1612
    west:
      to: tba:16:room:1638

"tba:16:room:1638":
  name: Barracks
  description: >
    Uncomfortable looking cots line the walls.  These knights have given up all creature comforts to
    serve the kingdom and its king.  The room smells of leather, sweat and metal.  Many knights are lying
    wounded in the cots.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1637

"tba:16:room:1639":
  name: Squires' Barracks
  description: >
    You stand in the squires' barracks.  It is here that all of the lackeys of the knights of the round
    table reside while their lords are in court.  The place is a jumble of beds, lockers and tables.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1664
    south:
      to: tba:16:room:1614

"tba:16:room:1640":
  name: Knights Way
  description: >
    More pennons are stuck in the ground on the sides of the road, flapping in the breeze.  You look at
    the coats of arms.  You recognize a few of the devices as belonging Gawaine, Tristram and, of
    course, Lancelot.
  sector: inside
  exits:
    north:
      to: tba:16:room:1665
    south:
      to: tba:16:room:1615
    west:
      to: tba:16:room:1641

"tba:16:room:1641":
  name: Feast Hall
  description: >
    You have arrived in the feast hall of Camelot.  You are in luck.  A feast is in progress.  There
    are many open bench-type tables with servants scurrying to and fro.  The smell is intoxicating and you
    are drawn towards the huge table running through the center of the room, laden with food.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1640
    west:
      to: tba:16:room:1642

"tba:16:room:1642":
  name: Feast Hall
  description: >
    Some tables hold knights while others have ladies.  A bard's song adds to the festive air of
    celebration.  A huge fire rages in a great stone hearth, over which a whole boar is being slowly cooked to
    perfection.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1641
    west:
      to: tba:16:room:1643

"tba:16:room:1643":
  name: Feast Hall
  description: >
    At the head of the table is another throne which stands empty.  Everyone is trying to celebrate but
    they all look severely depressed.  The assorted foods and drinks make your mouth water but a servant
    shoos you away as soon as you approach the table.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1642

"tba:16:room:1644":
  name: West Lane
  description: >
    This lane travels north and south along the western wall of Camelot.  Two towers rise above you to
    the east.  You see no entrance on this side.  A few knights are out on the streets but otherwise it
    seems deserted.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1695
    south:
      to: tba:7:room:795

"tba:16:room:1645":
  name: Merlin's Tower
  description: >
    You notice a large pulsating pentagram in the northern part of the room which throbs and hums in
    time to your heartbeat.  There is also a SIGN here with unearthly glowing red lettering which blink
    over and over as if to say LOOK AT ME!  Your inner voice, which has always served you well so far,
    screams at you to LEAVE IT ALONE!
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:16:room:1670
    down:
      to: tba:16:room:1620
  extras:
  - keywords: [sign]
    text: >
      At first the sign is indecipherable, but then the lettering adjusts to a language you understand. 
      It says: BEWARE OF DEMON!  I have imprisoned a FOUL, NASTY, EXTREMELY POWERFUL demon in this
      pentagram.  THERE IS NOTHING OF WORTH IN THE PENTAGRAM.  - Merlin

"tba:16:room:1646":
  name: Northeast Tower
  description: >
    Across the lake you see the city of Bellau Woods.  It looks so peaceful from here and you wonder
    how these guards can stand up here for hours on end without falling asleep.  A guard whispers something
    to one of the lookouts, you catch a couple words, something about putting you to work in the army.
  sector: inside
  exits:
    down:
      to: tba:16:room:1651

"tba:16:room:1647":
  name: North Tower
  description: >
    Guards stare across the lake, ignoring you.  You try to figure out what they are staring at, but
    all you see are open fields and a decrepit stone tower.  Nothing threatening.  You try to strike up a
    conversation with the guards, but they ignore you.
  sector: inside
  exits:
    down:
      to: tba:16:room:1659

"tba:16:room:1648":
  name: Hidden Room
  description: >
    Dust covers the floor, except for a few footprints that lead to the center of the room and
    disappear.  The rest of the room is empty, the walls are bare.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:7:room:785
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:16:room:1691
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:16:room:1649":
  name: Open Field
  description: >
    Only a few peasants and farmers are working the fields here.  They all stop occasionally and look
    to the north in fear as if they expect the devil himself to suddenly appear.  The fields are neglected
    and it seems they are just now starting to prepare it for planting.
  sector: inside
  exits:
    north:
      to: tba:16:room:1674
    south:
      to: tba:16:room:1624

"tba:16:room:1650":
  name: A Wide Dirt Path
  description: >
    You start to see bits and pieces of discarded equipment.  A couple of empty supply wagons sit by
    the side of the trail.  This army must have been moving fast to leave all this stuff behind.  The
    tracks look to be only a couple of hours old.  The city wall and the lake still force you north or south.
  sector: inside
  exits:
    north:
      to: tba:16:room:1675
    south:
      to: tba:16:room:1625

"tba:16:room:1651":
  name: North Lane
  description: >
    You've reached the northeast corner of the castle, another tower with lookouts.  They are standing
    a vigilant watch looking outwards, as if expecting an army to try to swim across the lake to attack
    the castle.  Everyone in this castle seems crazy.
  sector: inside
  exits:
    south:
      to: tba:16:room:1626
    west:
      to: tba:16:room:1652
    up:
      to: tba:16:room:1646

"tba:16:room:1652":
  name: North Lane
  description: >
    The lane continues between the walls to the north and south.  Two guards walk by, one telling the
    other some outrageous story about the undead.  Then you realize he didn't seem to be joking.
  sector: inside
  exits:
    east:
      to: tba:16:room:1651
    west:
      to: tba:16:room:1653

"tba:16:room:1653":
  name: North Lane
  description: >
    Two guards are whispering softly.  You try to sneak up on them to hear what they are saying.  You
    just catch a couple of words.  "We cannot keep this up. We will all be dead soon."  Then they see you
    and order you to move on.
  sector: inside
  exits:
    east:
      to: tba:16:room:1652
    west:
      to: tba:16:room:1654

"tba:16:room:1654":
  name: North Lane
  description: >
    More people walk by with hopeless looks on their faces.  What is wrong with this castle and these
    people?  You try to ask someone but they look at you as if you're the stupidest person alive.
  sector: inside
  exits:
    east:
      to: tba:16:room:1653
    west:
      to: tba:16:room:1655

"tba:16:room:1655":
  name: North Lane
  description: >
    Everyone looks at you in disgust.  Now that you think about it, you haven't seen anyone smiling or
    any children running around playing.  This castle seems to be under a siege of some sort, but not
    physically.
  sector: inside
  exits:
    east:
      to: tba:16:room:1654
    south:
      to: tba:16:room:1630
    west:
      to: tba:16:room:1656

"tba:16:room:1656":
  name: North Lane
  description: >
    The stone walls to the north and south are expertly crafted and are almost seamless.  It would
    almost seem that this castle was built with the help of some very powerful magic.
  sector: inside
  exits:
    east:
      to: tba:16:room:1655
    west:
      to: tba:16:room:1657

"tba:16:room:1657":
  name: North Lane
  description: >
    The wall north towers above you while a smaller wall to the south just looks like a small stone
    building.  Very few people are out traveling this road.  You only see a few patrolman and peasants.
  sector: inside
  exits:
    east:
      to: tba:16:room:1656
    west:
      to: tba:16:room:1658

"tba:16:room:1658":
  name: North Lane
  description: >
    The dirt lane is once again blocked on both sides by stone walls.  A chimney juts out of the
    southern wall and heat waves make the rocks around it shimmer as if alive.
  sector: inside
  exits:
    east:
      to: tba:16:room:1657
    west:
      to: tba:16:room:1659

"tba:16:room:1659":
  name: North Lane
  description: >
    The wall turns to the east, forcing you to follow.  At the intersection of the north and west walls
    a small tower sits above you on the battlements. Several figures are keeping a sharp look out.  You
    wonder for what?
  sector: inside
  exits:
    east:
      to: tba:16:room:1658
    south:
      to: tba:16:room:1634
    up:
      to: tba:16:room:1647

"tba:16:room:1660":
  name: Noble's Quarters
  description: >
    You are trespassing in a Noble's chamber.  This noble shut his door, anticipating intrusion from
    scum like you.  The chambers consist of a large bed, several shelves and a closet stuffed with
    clothes.  These nobles live a life of luxury.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1661

"tba:16:room:1661":
  name: Garden
  description: >
    This must be where the nobles come to seek release from their "stressful" jobs, from their never
    ending battle of fighting for the rights of the common folk.  The various flowers and plants are very
    well tended and the scent of spring flowers is refreshing.
  sector: inside
  exits:
    north:
      to: tba:16:room:1686
    east:
      to: tba:16:room:1660
    south:
      to: tba:16:room:1636

"tba:16:room:1662":
  name: Knights' Quarters
  description: >
    You walk deeper into the knights' barracks.  Cots and armor stands fill the room.  Some knights are
    here sleeping and healing from their war wounds.  A simple wash stand is at the end of the quarters.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1687
    south:
      to: tba:16:room:1637
    west:
      to: tba:16:room:1663

"tba:16:room:1663":
  name: Barracks
  description: >
    More cots line the walls, filled with the wounded.  A major battle must have recently taken place
    and it looks like they lost miserably.  Servants are running back and forth with bandages and fresh
    water, trying to tend to the knights, some of whom are dying.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1662

"tba:16:room:1664":
  name: Squires' Barracks
  description: >
    A couple of squires are here testing their skills on each other by wrestling. They throw each other
    across the room with little regard to life or limb.  You back out of the way.  If the squires are
    this tough, you'd hate to fight one of the knights.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1689
    south:
      to: tba:16:room:1639

"tba:16:room:1665":
  name: Knights Way
  description: >
    Squires bustle up and down the road on various errands for their lords.  A large building to the
    north has its ornate double doors open wide, inviting you to enter.  A tower rises above you to the
    west.
  sector: inside
  exits:
    north:
      to: tba:16:room:1690
    south:
      to: tba:16:room:1640
    west:
      to: tba:16:room:1666

"tba:16:room:1666":
  name: Tower of Valor
  description: >
    A tower rises up from here by a winding staircase.  Knights Way is to the east.  There is an
    inscription above the archway to the tower.  You look at the inscription.  It reads: HONOR SEPARATES THE
    KNIGHT FROM THE CRIMINAL.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1665
    up:
      to: tba:16:room:1667

"tba:16:room:1667":
  name: Tower of Valor
  description: >
    You stand in the Tower of Valor.  The walls bear murals of battle scenes, of knights fighting
    knights and various unearthly beasts.  There is a hollow in one of the walls in which a fire takes the
    edge off the cold of the room.  The smoke puts you in a strange daze in which the MURALS seem to come to
    life.  Stairs lead down to the street below.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:16:room:1668
    down:
      to: tba:16:room:1666
  extras:
  - keywords: [murals]
    text: >
      You look at a mural of Saint George and the Dragon.  George's armor gleams in the sun, and from his
      lance flies his standard.  George signals the dragon and charges across the verdant green.  The
      dragon raises its serpentine head and inhales a mighty breath.  George and mount thunder though the tall
      grass.  The dragon- You snap out of your vision

"tba:16:room:1668":
  name: Tower of Valor
  description: >
    You stand in the Tower of Honor.  MURALS cover the walls and domed ceiling. Smoke rolls out in an
    eerie caress from the fire hollow in the walls.  A strange tingling sensation rushes through your
    body.  Stairs lead to the street below.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:16:room:1667
  extras:
  - keywords: [murals]
    text: >
      You look at the mural of Lancelot, Guinevere and Arthur on a picnic.  A page arrives and hands
      Arthur a scroll.  Arthur reads the scroll and mounts his charger, racing back along the road.  Lancelot
      turns to mount his charger, but a feminine hand restrains him, beckoning to the cool shade under the
      oaks. Lancelot turns to face Guinevere- You snap out of your vision.

"tba:16:room:1669":
  name: West Lane
  description: >
    The inner western wall of Camelot rises above you with a tower at its peak. Few people are walking
    the streets and even fewer are even acknowledging you. Why is everyone so reclusive?
  sector: inside
  exits:
    south:
      to: tba:16:room:1695
    up:
      to: tba:16:room:1694

"tba:16:room:1670":
  name: Inside the Pentagram
  description: >
    As you step into the pentagram a blast of hellish heat and cackling assails you from all sides. 
    Your entire body is wracked in pain, and you hear yourself screaming in an endless cry of horror.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1645

"tba:16:room:1671":
  name: Beautiful Hall
  description: >
    The hall turns sharply to the north.  The room is lit by windows on the eastern wall which look
    down onto the courtyard of the castle towards the main gate.  A servant walks by you, the padding of his
    feet being muffled by the expensive woven rugs.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1672
    west:
      to: tba:17:room:1796

"tba:16:room:1672":
  name: Neglected Hallway
  description: >
    More of nothing lines this barren hall.  Someone has taken the time to keep the place free from
    dust, but that's about it.  The hall continues north and south, without any sign of changing.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1696
    south:
      to: tba:16:room:1671

"tba:16:room:1673":
  name: Bedroom
  description: >
    You have to turn sideways to enter this bedroom.  Bookshelves cover every spare inch of the room,
    except where a small cot sits against the wall beside a desk.  Several scrolls are rolled up and
    placed neatly on the desk.  You look around; no one would see you if you just took a quick peek.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1697

"tba:16:room:1674":
  name: Open Field
  description: >
    The fields are deserted in this area.  A wind from the north carries an awful stench with it and
    you see vultures circling.  The lake is to the east and the path continues north and south.  Further to
    the north you see a tower and in the middle of the lake to the east sits a massive castle on an
    island.
  sector: inside
  exits:
    north:
      to: tba:16:room:1699
    south:
      to: tba:16:room:1649

"tba:16:room:1675":
  name: A Wide Dirt Path
  description: >
    The path makes a sharp turn along the lake shore towards the west.  The tracks follow the trail. 
    To the north you see some foothills with mountains in the distance.  The city wall is to the east.
  sector: inside
  flags: [no_mob]
  exits:
    south:
      to: tba:16:room:1650
    west:
      to: tba:16:room:1676

"tba:16:room:1676":
  name: A Wide Dirt Path
  description: >
    The path continues east and west.  You suddenly realize all these tracks only go in one direction. 
    This army has never come back through here.  The foothills to the north look treacherous.  To the
    south, small waves lap against the shore of the lake.  Through the fog blanketing the lake you think
    you see an island.
  sector: inside
  exits:
    east:
      to: tba:16:room:1675
    west:
      to: tba:16:room:1677

"tba:16:room:1677":
  name: A Wide Dirt Path
  description: >
    The trail still follows the lake shore, the trees are starting to thin out and opens into a field
    to the west.  The foothills to the north still look impassable.  You hear something to the west but
    you can't identify it from this far away.
  sector: inside
  exits:
    east:
      to: tba:16:room:1676
    west:
      to: tba:16:room:1678

"tba:16:room:1678":
  name: A Wide Dirt Path
  description: >
    The path branches to the north and you hear some loud growling.  More noises are coming from the
    west.  It almost sounds like a battle is being fought. Through the fog to the south you finally can see
    the island and what appears to be a castle built on it.
  sector: inside
  exits:
    east:
      to: tba:16:room:1677
    west:
      to: tba:16:room:1679

"tba:16:room:1679":
  name: Battle Field
  description: >
    You stare in horror at the carnage lying before you.  Hundreds of dead soldiers lie across the path
    and you see even more to the west.  These soldiers were routed.  You start to notice that some of
    the corpses, about one of every ten, are in an advanced state of decomposition, while most of them are
    just now beginning to bloat from the sun.
  sector: inside
  exits:
    east:
      to: tba:16:room:1678
    west:
      to: tba:16:room:1680

"tba:16:room:1680":
  name: Battle Field
  description: >
    More mutilated bodies are scattered across the field and vultures are starting to gather.  Strange,
    the decayed corpses seem to be untouched by the vultures, rats and other scavengers that feast on
    the fresher fare on this battlefield.
  sector: inside
  exits:
    east:
      to: tba:16:room:1679
    west:
      to: tba:16:room:1681

"tba:16:room:1681":
  name: Battle Field
  description: >
    You notice that all of the bloated bodies seem to have the same crest on their uniforms while the
    decayed corpses wear clothes and armor that looks ancient and is practically falling off them.  Also
    the decayed corpses seem to be mutilated, most of them with their heads actually lopped off.
  sector: inside
  exits:
    east:
      to: tba:16:room:1680
    west:
      to: tba:16:room:1682

"tba:16:room:1682":
  name: Battle Field
  description: >
    More bodies clutter the path and you carefully pick your way around them.  Blood mixed with the
    dirt from the path covers your boots and the stench is beginning to overwhelm you.  The path continues
    east and west. The lake to the south has a slight tinge of red too it.
  sector: inside
  exits:
    east:
      to: tba:16:room:1681
    west:
      to: tba:16:room:1683

"tba:16:room:1683":
  name: Battle Field
  description: >
    More bodies.  These look to be from an earlier fight.  The stench of decay is overpowering you and
    you think about turning back.  You hear the clash of steel and screams of pain to the west.  A new
    battle must have just started.
  sector: inside
  exits:
    east:
      to: tba:16:room:1682
    west:
      to: tba:16:room:1684

"tba:16:room:1684":
  name: Battle Field
  description: >
    The battle before you has almost reached its conclusion.  Walking corpses are slaughtering what's
    left of the army.  The zombies decimate the last of the infantry, turn around, and leave to the west. 
    Silence once again claims the battle field.
  sector: inside
  exits:
    east:
      to: tba:16:room:1683
    west:
      to: tba:16:room:1699

"tba:16:room:1685":
  name: Foothills
  description: >
    You work your way through the foothills towards the tower to the north. Bodies are everywhere, most
    of them from the army.  Hard to believe the number of casualties those zombies inflicted.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:22:room:2200
    south:
      to: tba:16:room:1699

"tba:16:room:1686":
  name: Sitting Room
  description: >
    Another room for the nobles to hang out and relax.  It would seem that's all they do.  Several
    plump chairs line the walls and a few tables are loaded with papers.  Some of those papers have elaborate
    writing on them.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1661

"tba:16:room:1687":
  name: Knights' Quarters
  description: >
    The knights' barracks continues to the south and west.  Weapons and suits of armor fill the room. 
    Several knights are having a conversation in hushed tones. They look at you reprovingly as you try to
    listen in.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1662
    west:
      to: tba:16:room:1688

"tba:16:room:1688":
  name: Barracks
  description: >
    Uncomfortable looking cots line the walls.  These knights have given up all creature comforts to
    serve the kingdom and its king.  The room smells of leather, sweat and metal.  A lot of the knights are
    lying wounded in the cots.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1687

"tba:16:room:1689":
  name: Squires' Study
  description: >
    This room is supposed to be a place of learning for the knights in training and a few books are
    laid out on the table.  But most of the desks and bookshelves have been pushed aside so the squires
    could have room for some swordplay.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1664

"tba:16:room:1690":
  name: The Round Table
  description: >
    You have entered the chamber of the Round Table, where war council is held between Arthur and his
    companions.  The Round Table is 30 feet in diameter, and made of polished cherry.  Around it are 50
    chairs.  The room which houses the table is also round and, far above, you see the domed ceiling. 
    Light streams down in long rays to hit the gold and crystal candelabra where it is broken into a
    brilliant prismatic spray.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:16:room:1665

"tba:16:room:1691":
  name: Study
  description: >
    This room is secluded from the rest of the castle and the thick walls keep all sound from reaching
    this part of the castle.  Shelves line both walls and a desk, lamp and chair are to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:16:room:1692
    up:
      to: tba:16:room:1648
      door:
        keywords: [door]
        kind: door

"tba:16:room:1692":
  name: Study
  description: >
    The room is dark except for the lamp, starting to flicker out, that is sitting on the desk.  You
    are deep into the heart of the castle and the tons of stone above you make you nervous.  The desk and
    chair are made of solid oak.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1691
    down:
      to: tba:16:room:1693
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:16:room:1693":
  name: Torture Room
  description: >
    This secluded room has shackles and chains hanging from the walls.  You stare at some tools that
    must be used in torturing the helpless prisoners.  Who could be so cruel?  Certainly not King Arthur.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:16:room:1692
      door:
        keywords: [door]
        kind: door

"tba:16:room:1694":
  name: Northwest Tower
  description: >
    Guards are keeping a sharp lookout to the northwest, towards a decrepit looking tower.  Fields
    stretch towards the south where the farmers, peasants and serfs cultivate the fertile fields.
  sector: inside
  exits:
    down:
      to: tba:16:room:1669

"tba:16:room:1695":
  name: West Lane
  description: >
    The lane continues north towards some towers or south to the western gate. You sense strange powers
    radiating from the towers to the northeast, as if they were alive.  The dirt lane turns into
    cobblestone to the south.
  sector: inside
  exits:
    north:
      to: tba:16:room:1669
    south:
      to: tba:16:room:1644

"tba:16:room:1696":
  name: Neglected Hallway
  description: >
    All of the embellishments from the hall to the south are gone.  Bare stone line the walls and no
    pleasantries of any kind clutter this hall.  It doesn't seem like many people use this area.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:16:room:1697
    south:
      to: tba:16:room:1672

"tba:16:room:1697":
  name: Neglected Hallway
  description: >
    The hall ends to the north and small doorways are open to the east and west. You suddenly get the
    feeling of no longer being alone, of being watched.  It almost feels like someone is waiting for you.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1673
    south:
      to: tba:16:room:1696
    west:
      to: tba:16:room:1698

"tba:16:room:1698":
  name: Bedroom
  description: >
    This small room is overcrowded with a small decrepit looking bed, a small desk and various
    bookshelves that teeter from the weight of countless books. The room looks more like a study than a bedroom. 
    The desk is covered with papers and notes that someone hastily scribbled down.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:16:room:1697

"tba:16:room:1699":
  name: Battle Field
  description: >
    You see the zombies leave to the north towards a massive tower that rises above the foothills. 
    Bodies lie everywhere right up to the base of the tower. There must be over a thousand dead.
  sector: inside
  exits:
    north:
      to: tba:16:room:1685
    east:
      to: tba:16:room:1684
    south:
      to: tba:16:room:1674
