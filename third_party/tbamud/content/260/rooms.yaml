"tba:260:room:26090":
  name: Obscure Path
  description: >
    As it turns out, the path leads downhill, although from your vantage point west of here, you could
    not tell that.  It seems that the continuing brush you thought was a large field is actually tree
    tops!  The path continues east, becoming more and more enclosed as you move in that direction.  To the
    west the path heads uphill into a huge grassy field.
  sector: forest
  exits:
    east:
      to: tba:260:room:26091
    west:
      to: tba:260:room:26021

"tba:260:room:26091":
  name: Obscure Path
  description: >
    The path continues downhill at a steep angle to the east, uphill to the west. Just east of you, you
    think you may see some sort of break in the trees, as the forest you entered into seems to have come
    upon you quite suddenly.
  sector: forest
  exits:
    west:
      to: tba:260:room:26090
