# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 260.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:260:room:26000":
  name: Grasslands
  description: >
    Tall, brown grass grows all around you.  These grasslands must respresent the largest open area in
    all of Dibrova.  You can the propellor of a windmill high above the grass off to the northwest.
  sector: field
  flags: [no_track]
  exits:
    north:
      to: tba:260:room:26064
    east:
      to: tba:260:room:26010
      look: The narrow trail leads east to a somewhat lighter part of the forest.
    south:
      to: tba:260:room:26030
    west:
      to: tba:260:room:26022
  extras:
  - keywords: [credits, info]
    text:
    - >
      *Rahn Grasslands - by Kaan for Dibrova This is an area designed for exp gain geared toward the low
      to mid-level player.  The mobs are all aggro and sneak, as they are plainsmen and live in the high
      grasses in this zone.  The zone is basically a large square of connected rooms with a space in the
      center for a road to cut through, running north to south - that road is in the Light Forest if you desire
      to use the Light Forest zone as well.  There is a windmill in the northwest quadrant of this zone,
      also a zone available to download. No objs are included with this zone as it is strictly meant as a
      filler zone made for good exp.
    - Replace XXXX with a town name of your choosing.
    - "Links: 91w"

