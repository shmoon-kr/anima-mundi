"tba:38:room:3899":
  name: An Eternal Airplane to Nowhere
  description: >
    Time is of no essence as you sit in the leather seat of the cabin.  Looking out from the window
    seat, you see the great tufts of clouds flow by below you, and the thin wisps of clouds above you.  The
    great arch of solid nothing creates a funnel to heaven as you look deep into the shaded light. 
    Lightning, quiet and small twinkles far below, along with your responsibilities and cares. All you hear is
    the gentle hum of the airline, and the draining of your thoughts.  Clear and precise you can think
    about what inspires.  Think
  sector: inside
  flags: [indoors, peaceful, soundproof, tunnel]
