# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 38.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:38:room:3800":
  name: Gareth's Zone Description Room
  description:
    preformatted: |
      Zone 38 will be used to expand the sewer system started in zone 37.
      Builder: Gareth
      Zone: 38
      Name: Sewer Catacombs
      Theme: Deep, dark catacombs.
      Plot: Players navigate the catacombs to find items, riches, and other suprises...
      Size: No more than 50. Probably 40 or 30.
      Align: Evil with neutral.
      Level: 15-35
      See room 3700 for more detail.
      Zone 38 is linked to the following zones:
      37 Capital Sewer System           at  3801 (up   ) --->  3717
  sector: inside
  flags: [private]

"tba:38:room:3801":
  name: In the Northern Drainhole
  description: >
    You are in the bottom of the northern drainhole.  The slimy walls around you make it almost
    impossible to climb the ladder that leads out of the hole.  A steady waterfall of sewage flows into the
    drain and down into a large circular grate that seems to make the majority of the bottom of the
    draninhole.  The drainhole is only about 20' deep, but you still wouldn't be able to climb out easily without
    the ladder.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:37:room:3717
      look: >
        As you glance upward you see a cateract of slime flowing in from the northern pipe of the capital
        sewer system above.
    down:
      to: tba:38:room:3802
      look: >
        Below a large grate, you see that there is a big pipe, just enough that a small group could easily
        travel in it.  Sewage is constantsly flowing down into it.
      door:
        keywords: [grate, down]
        kind: door
        key: tba:38:obj:3804
        reset: locked
  extras:
  - keywords: [red, grate]
    text: >
      It is a large, circular grate.  It seems to be made out of iron, but it is too icky to tell.  It
      also seems that it was once painted red, but the paint eroded away with the sewage that constantly
      barrages it.
  - keywords: [ladder]
    text: >
      The ladder is simply some iron bars the bend out towards the center of the drainhole.  They are
      dripping with ooze and sewage.  You feel reluctant to touch them, but you eventually build up the
      courage.  The bars are slick in some parts and sticky in others.  Gross!

"tba:38:room:3802":
  name: A Big Pipe
  description: >
    You are in a big pipe where all the sewage from many parts of the sewers joins together to flow
    into wherever it goes.  Sewage is flowing down from above.  The slime is so deep here that you are being
    soaked up to your knees. What seems like a tunnel is at the end of this pipe to the north.  The
    sewage nearly makes you slip as it flows continually towards the tunnel.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:38:room:3803
      look: You see the big pipe continuing towards a large tunnel.
    up:
      to: tba:38:room:3801
      look: You see the northern drainhold beyond a red grate.
      door:
        keywords: [grate, up]
        kind: door
        key: tba:38:obj:3804
        reset: locked
  extras:
  - keywords: [red, grate]
    text: It appears to be a red grate, but the color is very faded.

"tba:38:room:3803":
  name: A Big Pipe
  description: >
    The big pipe continues to the north and to the south.  The sewage, which is already knee-deep, is
    constantly being added upon by pipes to the east and to the west.  The walls of the pipe seem to be
    very unkept, probably because no dignified person would ever spend more time then he needed to down
    here.  To the north there is a tunnel with a river of sewage, what could be down there?
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:38:room:3804
      look: You see where the big pipe ends.  It is a giant opening.
    south:
      to: tba:38:room:3802
      look: You see that the pipe continues to the south.
  extras:
  - keywords: [pipes]
    text: >
      There are small pipes to the east and west of you.  Sewage is flowing out of them and flows with
      the rest of the slime to the north.  The pipe is too small to climb in, not that you would want to.

"tba:38:room:3804":
  name: The Opening in the Big Pipe
  description: >
    You are at the great opening of a big pipe.  The horrid smell of a hundreds of cities' crap fills
    the place to the point where no man could stand for long without severe brain damage.  The sewage
    finishes its journey to the main tunnel of the sewers, only to make another one to who knows where?  The
    iron walls have been reduced to rust and rubbage from centuries of constant siege of refuse.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:38:room:3807
    south:
      to: tba:38:room:3803
      look: You see the big pipe continuing to the south.
    up:
      to: tba:38:room:3805
      look: >
        It is the top of the pipe.  There is an arch supporting the opening of the pipe.  You see what
        appears to be a crack in the roof...
      door:
        keywords: [secret, up]
        kind: door
        reset: locked
  extras:
  - keywords: [Sewage]
    text: The disgusting sewage flows on its smelly way.
  - keywords: [sign]
    text: "It is a big, silver sign that says \"Poisonous Sewage: KEEP OUT!  \""

"tba:38:room:3805":
  name: A Secret Passage
  description: >
    You seem to be in a secret passage that connects to the pipe below via a trap door.  The walls seem
    to have been crudely dug away by animal hands.  You fell cluastophobic in this tiny passage.  YOu
    should either move up towards the light or down to the pipe.
  sector: inside
  flags: [no_mob, indoors, tunnel]
  exits:
    up:
      to: tba:38:room:3806
      look: You see a secret chamber.
    down:
      to: tba:38:room:3804
      look: You see that the passage continues down to a big pipe.
      door:
        keywords: [secret, passage, down]
        kind: door
        reset: locked

"tba:38:room:3806":
  name: The Lair of Slaive
  description: >
    This is the ancient hideout of Slaive, the legendary thief master.  This hidout was where he evaded
    the city guards for most of his life.  The chamber is somewhat spacious and comfortable.  The walls
    are not covered, nevertheless, they are carved away well.  There must be a light somewhere, but you
    can't seem to find it.  There is clutter trashed about.  For a thief, there doesn't seem to be that
    many riches around.  There must be gold somewhere...
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:38:room:3805
      look: The chamber passage is below.
  extras:
  - keywords: [metal, box, secret, safe]
    text: >
      It's a secret safe!  It seems to be encased in black diamond, the strongest of all diamonds.  Its
      metal knob seems to have rusted off, rendering the safe useless.  That means the contents could still
      be inside...
  - keywords: [clutter, trash]
    text: >
      You see much trash strewn about, covering the floor in filth.  You see rusted helmets, bones,
      rotting backpacks, and other unusable items.  It seems to reflect the last fight of some unfortunate
      people.  You see what appears to be a metal box in the ins

