"tba:38:mob:3800":
  keywords: [black, rat]
  short: the black rat
  long: A large, scrabby-looking black rat is clawing the ground around here.
  description: >
    It is an oversized black rat.  It is different than the rats of the capital sewers.  It has shaggy
    black fur that seems to be slicked down from the sewage that it lives in.  Its long, gray tail flicks
    about as it claws the ground with its large, ugly talons.  It stops clawing just enough to see you
    and bare its hideous teeth in a screeching hiss.
  level: 10
  sex: neutral
  alignment: 0
  flags: [sentinel, scavenger]
  combat:
    thac0: 17
    armor: 4
    hit_points: 2d2+100
    damage: 1d2+1
    bare_hand_attack: whip
  gold: 100
  exp: 10000
  position:
    load: standing
    default: standing

