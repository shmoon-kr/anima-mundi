    text: >
      This is the legendary Backstabber.  It is the ultimate symbol of all that thieves believe in.  The
      bronze blade is of Roman design and is reinforced with iron and what appears to be gold.  Legend has
      it that it was the same dagger that commited the first backstabbing, done on Julius Ceasar.  It has
      black runes on it, the ancient code of the thieves.  Just holding makes you feel like you feel not
      just like a million dollars, but that you could steal a million dollars.

