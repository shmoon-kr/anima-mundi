      look: Sand as far as the eye can see.

"tba:50:room:5056":
  name: A Nomad Camp
  description: >
    This small group of desert nomads has stopped for the day to rest and refresh themselves beside
    this beautiful oasis.  Three tents and some camels make up the party.  From within two of the tents you
    hear muffled voices, obviously surprised at your visit.
  sector: field
  flags: [no_track]
  exits:
    north:
      to: tba:50:room:5058
      look: Some camels are tied up to a mass of stakes plugged into the ground.
    east:
      to: tba:50:room:5057
      look: You see inside one of the tents a huddled mass of people, probably slaves.
    south:
      to: tba:50:room:5030
      look: Sand as far as the eye can see.
    west:
      to: tba:50:room:5025
      look: Sand as far as the eye can see.

"tba:50:room:5057":
  name: Inside A Small Tent
  description: >
    This is a small and simple tent with few possessions in sight.  Lying here and there are
    young-looking men and women, possibly slaves to the leader of this band.
  sector: field
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:50:room:5056
      look: You see the center of the nomad camp.

"tba:50:room:5058":
  name: Beside The Camels
  description: >
    Here stand about ten camels, all hitched to some stakes plugged into the ground.  To the east you
    see a small tent while to the north you see a larger, fancier tent.
  sector: field
  flags: [no_track]
  exits:
    north:
      to: tba:50:room:5060
      look: >
        This tent seems to be the temporary abode of the nomad leader.  You make a mental note to visit it
        before you leave.
    east:
      to: tba:50:room:5059
      look: In this tent there are very large men, all carrying weapons.
    south:
      to: tba:50:room:5056
      look: You see the center of the nomad camp.
    west:
      to: tba:50:room:5024
      look: Sand as far as the eye can see.

"tba:50:room:5059":
  name: The Warriors' Tent
  description: >
    This tent has a few furnishings, but mainly it holds the band's protectors.  They all stare at you
    coldly as you enter.
  sector: field
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:50:room:5058
      look: Outside you see some peaceful camels.

"tba:50:room:5060":
  name: The Main Tent
  description: >
    This tent is as lavishly decorated on the inside as it is on the outside.  A fancy carpet lies on
    the sand and numerous baskets line the walls.
  sector: field
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:50:room:5061
    south:
      to: tba:50:room:5058
      look: You see some peaceful camels.

"tba:50:room:5061":
  name: The Main Tent
  description: >
    This is where the leader of this band of nomads resides.  He is definitely rich as you inspect the
    tapestries, baskets, and a few paintings as well.
  sector: field
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:50:room:5060
      look: You see the entrance to this tent.

"tba:50:room:5062":
  name: The Rickety Rope Bridge
  description:
  - >
    You carefully begin to walk across the bridge, but suddenly the rope breaks and you fall...
  - "... and fall"
  - and fall
  - and fall
  - "... to your death on the rocks below."
  sector: mountains
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:50:room:5053

"tba:50:room:5063":
  name: The Wind-Swept Ledge
  description: >
    Being very careful not to lose your balance, you look around and find that this canyon is about a
    half a kilometer deep.  To the west is a dark cave leading under the desert sands and above you a rope
    bridge spans the gap.
  sector: mountains
  exits:
    west:
      to: tba:50:room:5064
    up:
      to: tba:50:room:5052
      look: The desert sands blow down in your face.

"tba:50:room:5064":
  name: The Cave Mouth
  description: >
    The air in here is MUCH cooler than outside.  From the west you hear strange sounds, but can see
    nothing.  The cave slopes down into the darkness.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:50:room:5063
      look: Outside is lighter and very windy.
    west:
      to: tba:50:room:5065

"tba:50:room:5065":
  name: The Mysterious Lair
  description: >
    You have stumbled upon the home of something.  From the treasure haphazardly strewn about and the
    rotting carcasses, you would guess that this is a dragon's lair.  As to what type, you can't really
    say. The cave narrows out into a tunnel to the west.
  sector: mountains
  flags: [dark, indoors, no_track, no_magic]
  exits:
    east:
      to: tba:50:room:5064
    west:
      to: tba:50:room:5066

"tba:50:room:5066":
  name: A Wide Tunnel
  description: >
    This tunnel seems to go on forever into the darkness.  You carefully feel your way along the walls.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:50:room:5065
    west:
      to: tba:50:room:5067

"tba:50:room:5067":
  name: A Narrower Tunnel
  description: >
    The tunnel becomes very narrow and you fight to squeeze your way through. The floor seems to level
    off a little.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:50:room:5066
    south:
      to: tba:50:room:5068

"tba:50:room:5068":
  name: A Narrow Crack
  description: This part of the tunnel is the hardest to move through as the walls move in to meet you.
  sector: mountains
  flags: [dark, indoors, tunnel]
  exits:
    north:
      to: tba:50:room:5067
    west:
      to: tba:50:room:5069

"tba:50:room:5069":
  name: A Small Cavern
  description: >
    It is dark and damp and bats hang from the ceiling.  A narrow crack is in the east wall.  The floor
    now slopes upwards.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:50:room:5068
    west:
      to: tba:50:room:5070

"tba:50:room:5070":
  name: A Small Shaft
  description: >
    From within this shaft you can see a narrow hole in the roof just large enough for one person. 
    Back east is the cavern.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:50:room:5069
    up:
      to: tba:50:room:5009
