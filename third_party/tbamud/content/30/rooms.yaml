  description: >
    You are in a small, undecorated room just off of the main temple.  There are a couple of small
    wooden benches here where people occasionally sit while they wait for items to appear.  The temple is to
    the west.
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    west:
      to: tba:30:room:3001
      look: The busy temple is back west.

