"tba:30:room:3054":
  name: By The Temple Altar
  description: >
    You are by the temple altar in the northern end of the Temple of Midgaard. A huge altar made from
    white polished marble dominates this part of the temple. Towering behind the altar is a ten foot tall
    sitting statue of Odin, the King of the Gods. To the north, steps lead out the back of the temple
    towards the countryside.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:30:room:3059
      look: You see the vast Midgaard countryside.
    south:
      to: tba:30:room:3001
      look: You see the southern end of the temple.
  extras:
  - keywords: [altar]
    text: >
      Even though the altar is more than ten feet long it appears to be made from a single block of white
      virgin marble.
  - keywords: [statue, odin, king, god]
    text: >
      The statue represents the one-eyed Odin sitting on a his throne.  He has long, gray hair and beard
      and a strict look on his face.  On top of the throne, just above his shoulders, his two ravens Hugin
      and Munin are sitting and at his feet are his wolves Gere and Freke.

