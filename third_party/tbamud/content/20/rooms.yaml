"tba:20:room:2048":
  name: Thieves Arena
  description: >
    This room was made especially for gladiatorial bouts between thieves. Pillars of black marble and
    widely spaced torches cause shadows to dance wildly around the room.  A thief could easily practice
    his skills in hiding and backstabbing in such a room.  Life size drawings of famous thieves cover the
    walls, which one of them isn't a drawing?  Are you ready to Rumble?
  sector: inside
  exits:
    north:
      to: tba:20:room:2045
    east:
      to: tba:20:room:2049
    south:
      to: tba:20:room:2051
    west:
      to: tba:20:room:2047

