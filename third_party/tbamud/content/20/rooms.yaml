"tba:20:room:2071":
  name: Main Arena
  description: >
    The arena continues east and south.  The walls are too steep and sloped inward to climb to the
    north or west.  The crowd above starts yelling at you to begin fighting soon or they would send in some
    real gladiators.
  sector: inside
  exits:
    east:
      to: tba:20:room:2074
    south:
      to: tba:20:room:2072

"tba:20:room:2072":
  name: Main Arena
  description: >
    The floor of the arena is covered with a fine sand.  The crowd cheers in anticipation of the
    fighting and bloodshed.  The sound is deafening and definitely distracting.
  sector: inside
  exits:
    north:
      to: tba:20:room:2071
    east:
      to: tba:20:room:2075
    south:
      to: tba:20:room:2073
    down:
      to: tba:20:room:2002

"tba:20:room:2073":
  name: Main Arena
  description: >
    The crowd is deafening and the heat stifling.  The sand is baking underneath your feet.  This is
    where the gladiators fight to the death for the pleasure of the citizens of Rome.
  sector: inside
  exits:
    north:
      to: tba:20:room:2072
    east:
      to: tba:20:room:2076

"tba:20:room:2074":
  name: Main Arena
  description: >
    The arena floor is slick with blood and other bodily fluids that make your stomach turn.  Above you
    is the Imperial Box where Emperor Titus commands the fights of the arena.
  sector: inside
  exits:
    east:
      to: tba:20:room:2077
    south:
      to: tba:20:room:2075
    west:
      to: tba:20:room:2071

"tba:20:room:2075":
  name: Main Arena
  description: >
    You stand in the center of the arena.  The crowd starts to calm down and silence blankets the arena
    as everyone waits in anticipation.  Are you ready to Rumble?
  sector: inside
  exits:
    north:
      to: tba:20:room:2074
    east:
      to: tba:20:room:2078
    south:
      to: tba:20:room:2076
    west:
      to: tba:20:room:2072

"tba:20:room:2076":
  name: Main Arena
  description: >
    Thousands of battles and even more deaths have colored the sand on the arena floor a sickly brown. 
    Slaves are dumping fresh sand over the stains, but it doesn't seem to be helping.
  sector: inside
  exits:
    north:
      to: tba:20:room:2075
      look: Nothing.
    east:
      to: tba:20:room:2079
    west:
      to: tba:20:room:2073

"tba:20:room:2077":
  name: Main Arena
  description: >
    The crowd is going wild and you start to wonder if some of them may come down into the arena after
    you.  In the crowd above you sits the prestigious magistrates, senators, augurs and priests of Rome.
  sector: inside
  exits:
    south:
      to: tba:20:room:2078
    west:
      to: tba:20:room:2074

"tba:20:room:2078":
  name: Main Arena
  description: >
    The walls slope inwards above you making them impossible to scale. The heat and noise of the crowd
    is very aggravating.  Your foot sinks into a puddle of blood from the last person who came into this
    arena.
  sector: inside
  exits:
    north:
      to: tba:20:room:2077
    south:
      to: tba:20:room:2079
    west:
      to: tba:20:room:2075

"tba:20:room:2079":
  name: Main Arena
  description: >
    Prisoners can fight for their freedom here to become gladiators and make some good money or, even
    better, become a famous gladiator and be held in awe by all the citizens of Rome.
  sector: inside
  exits:
    north:
      to: tba:20:room:2078
    west:
      to: tba:20:room:2076

"tba:20:room:2080":
  name: Roman Ampitheater
  description: >
    The arena below you is empty right now, but from the shouting of the crowd you expect the games are
    about to begin.  The crowd that seems to be more of a mob than anything else is growing impatient.
  sector: inside
  exits:
    east:
      to: tba:20:room:2081
    south:
      to: tba:20:room:2095

"tba:20:room:2081":
  name: Roman Ampitheater
  description: >
    The amphitheater is a microcosm of Roman society.  The seating arrangements reflect the
    stratification of Roman society.  The emperor has a special box for himself and his family.  Senators and
    knights sit in their own special section.  Soldiers are separated from civilians, married men, from
    bachelors.  Boys and their tutors sit together.  Women, except for the Vestal Virgins who sit in the best
    seats with religious officials, sit with the poorest men in the top tier.
  sector: inside
  exits:
    east:
      to: tba:20:room:2082
    west:
      to: tba:20:room:2080

"tba:20:room:2082":
  name: Imperial Box
  description: >
    The emperor sits on his lavish throne, watching the bouts that he has provided for his people so
    they will look upon him with favor.  The Vestal Virgins sit to both sides of the emperor fanning
    themselves from the oppressive heat.
  sector: inside
  exits:
    east:
      to: tba:20:room:2083
    west:
      to: tba:20:room:2081

"tba:20:room:2083":
  name: Roman Amphitheater
  description: >
    Certain criminals are executed here by being given to the wild beasts or are forced to fight to the
    death as gladiators.  It also represents the domination of Rome over its enemies: prisoners of war
    are either executed or forced to fight each other as gladiators.  But for the professional gladiator
    it is also a place of redemption, in which one can overcome death by victory or by stoically accepting
    it.
  sector: inside
  exits:
    east:
      to: tba:20:room:2084
    west:
      to: tba:20:room:2082

"tba:20:room:2084":
  name: Roman Amphitheater
  description: >
    Several slaves walk into the arena with barrows of sand to cover over the blood stains and prepare
    for the next bout.  The populace is once again getting restless.
  sector: inside
  exits:
    south:
      to: tba:20:room:2085
    west:
      to: tba:20:room:2083

"tba:20:room:2085":
  name: Roman Amphitheater
  description: >
    Slaves, that had been forced to exhaust themselves helping to finish building the very amphitheater
    in which they are to die, are pushed into the arena.  As the mob screams, howls and roars, barred
    doors are lifted, releasing man-eating lions and tigers who have not been fed for quite a time.
  sector: inside
  exits:
    north:
      to: tba:20:room:2084
    south:
      to: tba:20:room:2086

"tba:20:room:2086":
  name: Roman Amphitheater
  description: >
    At last this fighting seems to have gone on long enough to satisfy, momentarily, the mob.  The few
    survivors retire to get their laurel crowns, their bags of gold and to anticipate the adulation of
    Rome.  Squads of little men run into the arena with ropes and metal hooks to drag the bodies of the
    dead and wounded to a mortuary cell where valuable weapons and armor are retrieved and sorted out.  The
    gasping, bleeding, groaning and wounded are finished off.  The bodies are then piled into carts to be
    taken and flung into a nameless common grave.
  sector: inside
  exits:
    north:
      to: tba:20:room:2085
    south:
      to: tba:20:room:2087

"tba:20:room:2087":
  name: Roman Amphitheater
  description: >
    Flashing swords, the clash of steel, and the first wounds arouse the passions, the hatred and the
    desperate fury of the gladiators and inflame the blood-lust of the mob.  The shouts and yells and
    screams of the onlookers grow to a huge, roaring crescendo of sound as one Samnite after another go down
    with their stomachs gashed open or their necks spouting blood and one Thracian after another crumbles
    with a Samnite sword through his chest.  Reinforcements are rushed in to restore the balance and to
    add to the pile of bleeding, writhing bodies on the sand-strewn floor.
  sector: inside
  exits:
    north:
      to: tba:20:room:2086
    south:
      to: tba:20:room:2088

"tba:20:room:2088":
  name: Roman Amphitheater
  description: >
    Another fanfare of trumpets announces the entry of two teams of 24 gladiators in charge of two
    renowned trainers, themselves former gladiators who, scarred and maimed, have somehow survived with their
    glory from many a combat.  According to tradition, 24 men heavily armed as the ancient Samnites,
    Rome's oldest enemies, face 24 lightly clad and lightly armed 'Thracians,' each with exposed chests. 
    Both teams march smartly up to face the Emperor in his resplendent Imperial Box to shout as one man:
    'Hail, Caesar.  Those about to die salute you.'
  sector: inside
  exits:
    north:
      to: tba:20:room:2087
    west:
      to: tba:20:room:2089

"tba:20:room:2089":
  name: Roman Amphitheater
  description: >
    A tremendous fanfare of trumpets follows the entrance of the Emperor. The Games begin.  It is the
    turn of the gladiators, men trained for battle, sworn to the gladiators' oath to suffer death by fire,
    in chains, under the lash or by the sword as their master might decide and to obey as a true
    gladiator should.
  sector: inside
  exits:
    east:
      to: tba:20:room:2088
    west:
      to: tba:20:room:2090

"tba:20:room:2090":
  name: Roman Amphitheater
  description: >
    You walk under a spread of canvas which sailors of the fleet have slung as a partial roof from
    masts all around the amphitheater's rim, to serve as a shield against the sun.  It makes a hothouse of
    the upper seats. After the solemn, long procession of civic dignitaries, priests and performers,
    together with images of the gods, the entry of the Emperor Titus across the floor of the arena is the
    signal for renewed frenzied applause from the restive crowd.
  sector: inside
  exits:
    east:
      to: tba:20:room:2089
    west:
      to: tba:20:room:2091

"tba:20:room:2091":
  name: Roman Amphitheater
  description: >
    The first rows are filled with senators, priests, augurs, magistrates, and other officials of
    distinction.  Up to the first 17 rows are crammed with the worthy citizens of wealth and standing.  Above
    them and entirely filling the second and third rows up to the very top is the mob making up the great
    mass of the inhabitants of the Imperial City.
  sector: inside
  exits:
    east:
      to: tba:20:room:2090
    west:
      to: tba:20:room:2092

"tba:20:room:2092":
  name: Roman Amphitheater
  description: >
    The whole amphitheater and the lavish shows held in it are arranged to keep the populace of this
    city amused.  Excitable and noisy, the crowds near-animal instincts and passions, unrestrained by
    education, good manners or breeding, are squashed promiscuously together, men, women and children, crying,
    shouting and sweating in a deafening crescendo of noise.
  sector: inside
  exits:
    north:
      to: tba:20:room:2093
    east:
      to: tba:20:room:2091

"tba:20:room:2093":
  name: Roman Amphitheater
  description: >
    It is here the Romans hold their gladiatorial games, with man against man or man against beast. 
    Trap doors in the floor allow famous gladiators to make grand entrances, or to allow the Caesar to
    spring animals into the arena.  The Colosseum looks like it could hold about 50,000 spectators.
  sector: inside
  exits:
    north:
      to: tba:20:room:2094
    south:
      to: tba:20:room:2092

"tba:20:room:2094":
  name: Roman Amphitheater
  description: >
    You have entered a great oval amphitheater, also known as the Colosseum. Crowds of people pour in
    through the entrance, pushing, shoving and scrambling to fill the top half of the immense number of
    seats looking down on the huge arena.  It looks like the whole of Rome is here.
  sector: inside
  exits:
    north:
      to: tba:20:room:2095
    south:
      to: tba:20:room:2093
    down:
      to: tba:20:room:2001

"tba:20:room:2095":
  name: Roman Amphitheater
  description: >
    Thousands of people are crowded together, pushing, shoving, trying to find the best view of the
    arena below.  A bout must be getting started soon. Gladiators fight for money or in order to compensate
    for crimes they have committed.  The money is good and the adoration of the people of Rome is even
    better.
  sector: inside
  exits:
    north:
      to: tba:20:room:2080
    south:
      to: tba:20:room:2094

"tba:20:room:2096":
  name: Mortuary Cell
  description: >
    The losers of various bouts in the arena are piled high while slaves sort through the corpses,
    retrieving the weapons and armor for a future battle. Flies are everywhere and you gag at the stench.
  sector: inside
  exits:
    west:
      to: tba:20:room:2033

"tba:20:room:2097":
  name: Outside the Amphitheater
  description: >
    The amphitheater towers above you to the south and you stare at the impressive Roman architecture. 
    The smell of death hangs heavy in the air.  So many gladiators have fought and died in this place.
  sector: inside
  exits:
    north:
      to: tba:20:room:2098
    south:
      to: tba:20:room:2033

"tba:20:room:2098":
  name: Common Grave
  description: >
    A massive hole has been dug here to dump all the corpses from the arena fights.  A few beggars
    scrounge through the corpses looking for valuables.  The stench is overpowering.
  sector: inside
  exits:
    south:
      to: tba:20:room:2097

"tba:20:room:2099":
  name: Trophy Room
  description: >
    Trophies line the walls of all the famous gladiators.  You notice five medals hanging inside a
    glass case.  Four of them are for the strongest gladiators of each class; Mage, Thief, Warrior and
    Cleric.  The fifth is for the strongest gladiator alive, no matter what class.  Do you think you could
    compete for and win one of them?  A sign listing the rules of the arena is posted here.
  sector: inside
  exits:
    east:
      to: tba:20:room:2000
  extras:
  - keywords: [godsign, sign]
    text: >
      This arena is not meant for random player killing of anyone within, but was instead made for
      players to challenge and fight against each other to see who is the strongest.  Players can challenge each
      other in any of the arenas.  The strongest of each class will be awarded a medal, or if he/she is the
      strongest of all classes he/she will also receive the gladiators medal.  There will only be one
      medal for each class and the gladiators medal.  Who ever holds a medal MUST meet all challenges, within
      one day of the challenge, or forfeit their right to keep it.  Do not make the gods interfere.  If you
      can't meet a challenge for whatever reason, simply give up the medal and win it back at another
      time.  If you are going to be gone for more than a week, junk the medal and inform the gods so other
      players can compete for it.  Player looting and Player stealing is NOT allowed. Matches can be played to
      the death or the first to flee. Either way the loser, if he has the medal, must give it to the winner.
      The gods will give out the medals to the first champions. After that we expect the players to handle
      it. Again, don't make the gods interfere! Rumble
