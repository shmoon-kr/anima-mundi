"tba:20:room:2053":
  name: Clerics Arena
  description: >
    This arena was made specifically for gladiatorial matches between clerics. The room is well-lit by
    some unseen source from high above.  Though clerics are usually thought of as healers they can also
    be deadly opponents.  Murals of clerics from the past hang on all the walls.
  sector: inside
  exits:
    east:
      to: tba:20:room:2054
    south:
      to: tba:20:room:2056

