# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 20.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:20:room:2000":
  name: Entrance
  description: >
    The lighted passageway continues to the north where you can hear loud cheering and the sounds of
    battle.  The walls are covered with posters announcing future bouts in the arena with some of the
    famous gladiators. One poster catches your eye as it is written in blood red ink.
  sector: inside
  exits:
    north:
      to: tba:20:room:2001
      look: Nothing.
    west:
      to: tba:20:room:2099
  extras:
  - keywords: [poster, credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 20 Arena
        Began        : 1998
        Player Level : 10-20
        Rooms        : 100
        Mobs         : 23
        Objects      : 15
        Shops        : 0
        Triggers     : 0
        Theme        : Gladiator Arena
        Plot         : Modeled after a Roman amphitheater.
        Links        : 00es

"tba:20:room:2001":
  name: Spectators Entrance
  description: >
    A sign points spectators towards the stairs leading up into the balconies while another points down
    towards the gladiators cells.  Yet another sign points north towards the Gladiators Entrance.  The
    cheering is even louder here.  You can barely hear the clash of weapons and screams of pain over it
    all.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:20:room:2002
    south:
      to: tba:20:room:2000
    up:
      to: tba:20:room:2094
    down:
      to: tba:20:room:2003
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           _____________________________
          |      Up - Balconies         |
          |   Down - Gladiators Cells   |
          |North - Entrance to the Arena|
          |_____________________________|

"tba:20:room:2002":
  name: Gladiators Entrance
  description: >
    Five separate arenas are accessible here, one for each class and a fifth which can be used by any. 
    To the north is the Mages Arena, down is the Warriors Arena.  East is the Thieves Arena and west is
    the Clerics arena.  Stairs leading up take you into the Main arena in the center of the Amphitheater.
  sector: inside
  exits:
    north:
      to: tba:20:room:2042
    east:
      to: tba:20:room:2047
    south:
      to: tba:20:room:2001
    west:
      to: tba:20:room:2058
    up:
      to: tba:20:room:2072
    down:
      to: tba:20:room:2067
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           _______________________
          | North - Mages Arena   |
          | East - Thieves Arena  |
          | West - Clerics Arena  |
          | Down - Warriors Arena |
          | Up - Main Arena       |
          |_______________________|

"tba:20:room:2003":
  name: Gladiators Cells
  description: >
    There is noise everywhere produced by the equipment of death, here a sword is being sharpened,
    there someone is heating metal plates to be used on fallen gladiators, to see if they are dead, here rods
    are produced, there whips to encourage unwilling participants.
  sector: inside
  exits:
    north:
      to: tba:20:room:2006
    east:
      to: tba:20:room:2004
    west:
      to: tba:20:room:2005
    up:
      to: tba:20:room:2001

"tba:20:room:2004":
  name: Training Room
  description: >
    These rooms are set aside by the Lanistas to train the gladiators.  The various moves and attacks
    seem to be more for looks than anything else. Gladiators always have to play to the crowd.
  sector: inside
  exits:
    west:
      to: tba:20:room:2003

"tba:20:room:2005":
  name: Training Room
  description: >
    More gladiators spar and tussle back and forth across the room.  Sawdust and dirt covers the
    floor.  Everything in the room is spartan and dull.  The only thing extravagant is a few bits of the
    gladiators weaponry and armor.
  sector: inside
  exits:
    east:
      to: tba:20:room:2003

"tba:20:room:2006":
  name: Gladiators Cells
  description: >
    As unattractive as being a Gladiator may sound, a gladiator's life takes on new meaning.  First,
    his status is now voluntary rather than involuntary.  He also becomes a member of a cohesive group that
    is known for its courage, good morale, and absolute fidelity to their master to the point of death.
  sector: inside
  exits:
    north:
      to: tba:20:room:2009
    east:
      to: tba:20:room:2007
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:20:room:2003
    west:
      to: tba:20:room:2008
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:20:room:2007":
  name: Training Room
  description: >
    The Lanistas are hard at work preparing their gladiators for the big show. Many are scarred
    gladiator veterans themselves and know very well how to please the crowd.
  sector: inside
  exits:
    west:
      to: tba:20:room:2006
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:20:room:2008":
  name: Training Room
  description: >
    A Lanistas demonstrates a few moves to a gladiator who is just learning the ropes.  The motivation
    to learn is high since failing at this usually costs someone their life or limbs.
  sector: inside
  exits:
    east:
      to: tba:20:room:2006
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:20:room:2009":
  name: Gladiators Cell
  description: >
    Gladiators are usually criminals, slaves, captured fugitives or prisoners of war.  It would seem
    that for men of these categories it was a matter of going from the frying pan into the fire, but that
    is a misunderstanding.  Becoming a gladiator is obviously better fate than being put to death by being
    set upon by wild animals or being tortured in the amphitheater.
  sector: inside
  exits:
    north:
      to: tba:20:room:2012
    east:
      to: tba:20:room:2010
    south:
      to: tba:20:room:2006
    west:
      to: tba:20:room:2011

"tba:20:room:2010":
  name: Training Room
  description: >
    A lone gladiator here is on the verge of a breakdown.  He is faced with either fighting to the
    death in the arena or being hung for not fighting. Either way death is assured with time.
  sector: inside
  exits:
    west:
      to: tba:20:room:2009

"tba:20:room:2011":
  name: Gladiators Room
  description: >
    A Gladiator devotes himself body and soul to the owner of his troupe or lanista by swearing an oath
    "to endure branding, chains, flogging or death by the sword" and to do whatever the master ordered.
  sector: inside
  exits:
    east:
      to: tba:20:room:2009

"tba:20:room:2012":
  name: Gladiators Cells
  description: >
    No doubt it was thought too dangerous to allow private citizens to own and train gladiators who
    could be easily turned into a private army for revolutionary purposes.  Therefore, with very few
    exceptions, gladiators are under the control and ownership of the emperor.
  sector: inside
  exits:
    north:
      to: tba:20:room:2015
    east:
      to: tba:20:room:2013
