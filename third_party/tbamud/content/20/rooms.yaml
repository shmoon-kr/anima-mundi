"tba:20:room:2016":
  name: Murmillones Cell
  description: >
    This room is set aside for the murmillones, so called from the fish ornament on their helmets. 
    Each murmillo is armed with a short, thick sword, an oblong shield and leg and arm shields of metal.  A
    smelly pot sits in the corner.
  sector: inside
