"tba:20:room:2062":
  name: Warriors Arena
  description: >
    This large dome-ceiling room has been set aside for gladiatorial fights between warriors of great
    strength and weapon-skills.  The room has a slight smoky haze from the torches sputtering in brackets
    lining the walls. Paintings of famous battles and past gladiators cover the room floor to ceiling.
  sector: inside
  exits:
    east:
      to: tba:20:room:2063
    south:
      to: tba:20:room:2065

