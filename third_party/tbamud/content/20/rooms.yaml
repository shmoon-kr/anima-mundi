"tba:20:room:2035":
  name: Mages Arena
  description: >
    This arena was built solely for gladiatorial duels between mages.  The air in this room seems to be
    charged and you can feel the powerful residue of forces that have been unleashed during previous
    battles.  The walls glow with a faint phosphorescent light, making the paintings of various mages locked
    in battle along the walls seem alive.
  sector: inside
  exits:
    east:
      to: tba:20:room:2036
    south:
      to: tba:20:room:2038

