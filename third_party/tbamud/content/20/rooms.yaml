"tba:20:room:2014":
  name: Retiarii Cell
  description: >
    This room is set aside for the retiarii who fight with a net, a spiked trident and a dagger.  The
    floor is lined with straw and a smelly pot sits in the corner.  How could anyone live in these
    conditions?
  sector: inside
  exits:
