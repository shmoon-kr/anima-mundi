# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 42.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:42:room:4200":
  name: Entrance to a Chasm
  description: >
    The rubble from the landslide to the west has thinned out, leaving a clear path for you to walk
    down.  The granite walls of the chasm soar up above you, showing you only a small swath of the sky.  To
    the east, you can smell the odor of brimstone.  You fail to surpress a shudder when you remember the
    tales you have heard of this place.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:42:room:4201
  extras:
  - keywords: [credits]
    text: Guldane

"tba:42:room:4201":
  name: Deeper into the Chasm
  description: >
    The rubble from the landslide to the west has completely vanished, leaving a rough surface of
    granite for you to walk upon.  Here and there, though, are some deep furrows in the rock, always in groups
    of three.  You suddenly realize that these cuts are claw marks, probably territory marks of some
    sort...  To the east, the chasm gets yet deeper.
  sector: inside
  exits:
    east:
      to: tba:42:room:4202
    west:
      to: tba:42:room:4200

"tba:42:room:4202":
  name: Deeper into the Chasm
  description: >
    The chasm walls soar up so high that you can see almost nothing of the sky. The enterance to this
    hell-cursed chasm is to the west.  When you look to the est, you realize that the end of this ordeal
    is in sight-you can see the bottom.  The smell of sulfur is very strong here, and it seems to be
    wafting on the air currents from the east.
  sector: inside
  exits:
    east:
      to: tba:42:room:4203
    west:
      to: tba:42:room:4201

"tba:42:room:4203":
  name: The Bottom of the Chasm
  description: >
    You are at the bottom of an extremely deep granite chasm.  The only way you can see even a small
    portion of the sky is by trying to look straight up. There are multiple groups of three deep claw
    furrows all over the ground and covering a good portion of the walls.  There is a cave in the north wall,
    almost big enough for a large giant to walk into without ducking.
  sector: inside
  exits:
    north:
      to: tba:42:room:4207
    east:
      to: tba:42:room:4204
    west:
      to: tba:42:room:4202

"tba:42:room:4204":
  name: East side of the Chasm
  description: >
    To the west of here is the bottom of the chasm.  To the east, the path continues rising, taking you
    away from the oppressive might of the towering granite walls.  As it is, you can only see a small
    piece of the sky.  There are numerous claw marks here, each several inches deep.  The smell of sulfur
    is omnipresent, but it seems worse to the west.
  sector: inside
  exits:
    east:
      to: tba:42:room:4205
    west:
      to: tba:42:room:4203

"tba:42:room:4205":
  name: Entrance to a Cave
  description: >
    The path up is supposed to continue to the north-east here, but the way is blocked by a large mass
    of rubble.  There's no way you can get out that way. To the east, however, is a large cave.  Maybe
    you can go spelunking.
  sector: inside
  exits:
    east:
      to: tba:42:room:4206
      look: Nothing.
    west:
      to: tba:42:room:4204

"tba:42:room:4206":
  name: A Cave
  description: >
    You are in a cave, not so large as caves go, but still, its pretty big compared to you.  It doesn't
    go back too far, you can almost see all the way to the back of it.  There is a small glow towards
    the back of the cave.  To the west is the exit.
  sector: inside
  flags: [dark, no_mob]
  exits:
    east:
      to: tba:42:room:4297
    west:
      to: tba:42:room:4205

"tba:42:room:4207":
  name: Entrance to a Cave
  description: >
    You have entered a large cave.  There are multiple stone spears coming from the ceiling and the
    floor, giving you the unsettling impression that you are walking into a giant mouth.  The thing that
    bothers you the most, though, is that though the center of the chamber, there are stumps where other
    stalagmites should be.  Something REALLY strong must have done that.
  sector: inside
  exits:
    north:
      to: tba:42:room:4208
    south:
      to: tba:42:room:4203

"tba:42:room:4208":
  name: Further Into the Cave
  description: >
    You are going deeper and deeper into the cave.  The claw marks are back, and they have
    reinforcements.  You see some claw marks that go five to six inches into the stone!  The path through the
    stalagmites continues, and you feel too captivated by curiosity to stop now.  You conviently forget that
    curiosity killed the cat...
  sector: inside
  exits:
    north:
      to: tba:42:room:4209
    south:
      to: tba:42:room:4207

"tba:42:room:4209":
  name: A Choice of Ways
  description: >
    You have reached the back of the cave.  It branches off in three directions from here, with
    passages big enough to accomodate medium-sized giants.  To the north is a smaller hole in the otherwise
    completely smooth walls.  The walls are so smooth, in facts, that it is clear that they could not be
    natural...
  sector: inside
  exits:
    north:
      to: tba:42:room:4221
    east:
      to: tba:42:room:4210
    south:
      to: tba:42:room:4208
    west:
      to: tba:42:room:4216
  extras:
  - keywords: [claw]
    text: It is a long, deep gash, at least six inches deep.

"tba:42:room:4210":
  name: Top of A Stairwell
  description: >
    You have entered a massive stairwell, spiraling downwards as far as you can see.  Each step is
    about ten feet long and thirty feet wide.  You would hate to find out what would happen if you tripped
    and fell down them...
  sector: inside
  flags: [no_mob]
  exits:
    west:
      to: tba:42:room:4209
    down:
      to: tba:42:room:4211

"tba:42:room:4211":
  name: A Stairwell
  description: >
    You are plodding down a seemingly endless line of stairs.  They are all featureless, made out of
    solid granite.  The only thing interesting about these stairs is that they are very large and wide, big
    enough for a giant.  They spiral downwards are far as you can see.  You look up.  They go just as
    far that way.
  sector: inside
  exits:
    up:
      to: tba:42:room:4210
    down:
      to: tba:42:room:4212

"tba:42:room:4212":
  name: Bottom of a Stairwell
  description: >
    You are at the bottom of a very large stairwell.  The steps themselves are barely small enough for
    you to go up the stairs without climbing up each step. The stairwell is large enough to hold a giant,
    with some room to spare.  To the east, you detect a faint humidness.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:42:room:4213
    up:
      to: tba:42:room:4211

"tba:42:room:4213":
  name: A Dank Corridor
  description: >
    You are in a large corridor.  There is moisture coating the walls, and some other unidentifiable
    substances on the floor.  Like the rest of this place, the ceiling is high above, almost lost in
    shadow.  To the west, you see a stairwell.  To the east, you see more corridor.
  sector: inside
  exits:
    east:
      to: tba:42:room:4214
    west:
      to: tba:42:room:4212

"tba:42:room:4214":
  name: A Dank Corridor
  description: >
    The dark corridor abruptly terminates in a rough hewn stone wall on the south side.  There is a
    solid steel door set into the rock.  You think you can hear mumbling and heavy footfalls coming from
    beyond the doorway...
  sector: inside
  exits:
    east:
      to: tba:42:room:4222
    south:
      to: tba:42:room:4215
      door:
        keywords: [door, cell]
        kind: door
        key: tba:42:obj:4200
        reset: locked
    west:
      to: tba:42:room:4213

"tba:42:room:4215":
  name: A Prison Cell
  description: >
    You are in a solid stone cell, big enough for several man-sized creatures to fit in without
    complaint.  There are a few bones scattered around the room, and the bite marks on them are unsettling you...
  sector: inside
  exits:
    north:
      to: tba:42:room:4214
      door:
        keywords: [door, cell]
        kind: door
        key: tba:42:obj:4200

"tba:42:room:4216":
  name: A Stairwell
  description: >
    You are standing at the bottom of a gigantic stairwell, with each step being several meters high,
    almost taller than you are.  To the east, you see a cave with multiple stalagmites, and another
    stairwell opposite the one you are currently in.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:42:room:4209
    up:
      to: tba:42:room:4295

"tba:42:room:4217":
  name: A Small Room
  description: >
    You note with some relief that this room is too small to fit a dragon. There are numerous brooms
    and mops around, as well as a few buckets and a well carved into one corner.  Evidently this is a
    storeroom for cleaning supplies.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:42:room:4220

"tba:42:room:4218":
  name: A Hallway
  description: >
    You are walking down a featureless granite hallway.  The granite is rather pretty, with millions of
    shiny flecks strewn about the visible portion of the rock.  To the south, you see an intersection,
    and to the north, you see more hallway.  You notice that the smell of sulfur and brimstone has
    intensified...
  sector: inside
  exits:
    north:
      to: tba:42:room:4223
    south:
      to: tba:42:room:4220

"tba:42:room:4219":
  name: A Hallway
  description: >
    You have entered a large hallway, which is at least twenty feet wide and extremely long.  To the
    east is the stairway back down, and there is an intersection to the west.  The amount of claw marks
    here worries you...
  sector: inside
  exits:
    east:
      to: tba:42:room:4296
    west:
      to: tba:42:room:4220

"tba:42:room:4220":
  name: A Hallway
  description: >
    You are at a junction of two hallways, one of which goes east from here and the other north.  There
    is also a doorway to the west, and you think about hiding, as the claw marks here indicate that this
    passageway is well traveled.
  sector: inside
  exits:
    north:
      to: tba:42:room:4218
    east:
      to: tba:42:room:4219
    west:
      to: tba:42:room:4217

"tba:42:room:4221":
  name: A Hatchery
  description: >
    You are in a roughly circular room, with a large crater-shaped hole in the middle of the room. 
    There are a few eggs in the nest, and lost of scattered eggsells lying about.  There are no eggs,
    luckily for you- if there were eggs, there would be a watchful dragon nearby.  You think you hear a few
    high-pitched squeaks, though...
  sector: inside
  flags: [no_mob]
  exits:
    south:
      to: tba:42:room:4209

"tba:42:room:4222":
  name: The End of the Hallway
  description: >
    You are in a moderately cozy room, with a small air shaft going up through the ceiling to the sky
    above.  The ground is rough and pebbly, with a large mound a sand in the center of the room.  There is
    a keyrack here.
  sector: inside
  exits:
    west:
      to: tba:42:room:4214

"tba:42:room:4223":
  name: A Hallway
  description: >
    You are walking down an ordinary hallway...  If you count the extremely discomforting amount of
    claw marks as normal...  If you count the stench of sulfur as run of the mill...  And if you count the
    roaring you hear echoing from somewhere as ordinary...
  sector: inside
  exits:
    north:
      to: tba:42:room:4224
    south:
      to: tba:42:room:4218

"tba:42:room:4224":
  name: A Hallway
  description: >
    You are walking down an almost featureless granite corridor.  There is only a few things that mar
    its perfect smoothness, and those few things are multiple scratches and claw marks on the floor and
    walls.  Up ahead, you think you hear the sound of scales, but you can't be sure.
  sector: inside
  exits:
    north:
      to: tba:42:room:4225
    south:
      to: tba:42:room:4223

"tba:42:room:4225":
  name: A Guard Chamber
  description: >
    You are looking at what is quite obviously a guard room, and you can also tell that this area is
    very well traveled, and from some of the deep grooves in the rock you guess that many dragons have
    waited in this room for permission beyond.  You also notice that there is some smoke drifting down the
    ramp to the west.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:42:room:4226
    south:
      to: tba:42:room:4224

"tba:42:room:4226":
  name: A Ramp
  description: >
    You are walking up a ramp that is, if anything, more impressive then the species that made it. 
    There are inlaid designs along every inch of the walls, made out of gold, silver, platinum, and
    countless diamonds and rubies.  The granite floor has somehow been made so that the rock has the illusion of
    being a carpet.  The smell of sulfur, which is intensifying, is the only aspect of the stairwell that
    you think could be better.
  sector: inside
  exits:
    east:
      to: tba:42:room:4228
    west:
      to: tba:42:room:4225

"tba:42:room:4227":
  name: The Royal Treasury
  description: >
    You are in a large cave, filled almost to the brim with millions and millions of gold and silver
    pieces.  The entire floor is covered, except for a small cleared area where you are standing.  You take
    a step towards the treasure, but immediately realize that there is no way you could possibly take
    all of the treasure with you.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    up:
      to: tba:42:room:4228
      door:
        keywords: [pattern]
        kind: door
        key: tba:42:obj:4202

"tba:42:room:4228":
  name: The Royal Antechamber
  description: >
    You are standing in the middle of a perfectly round cavern, which could easily fit ten dragons
    comfortably.  In the middle of the room, you see a huge gold inlaid design, with many, many gems studded
    into it in an artistic fashion.  You think you can see a seam around the edges of the circle, and
    there is a small slot in the exact middle of the pattern.  To the west, you see a ramp desending
    downward, and you see three passages in the north, east, and south walls of the room.  The stench of sulfur
    is so thick that you can almost see it, and it is making your eyes water.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:42:room:4229
    east:
      to: tba:42:room:4231
    south:
      to: tba:42:room:4230
    west:
      to: tba:42:room:4226
    down:
      to: tba:42:room:4227
      door:
        keywords: [pattern, circle, door, design]
        kind: pickproof
        key: tba:42:obj:4202
        reset: locked

"tba:42:room:4229":
  name: The Royal Nest
  description: >
    You are in a medium-sized circular chamber, with only one major feature. In the almost exact middle
    of the room there is a large circular depression, with several pieces of armor and bones scattered
    around it.  The walls are carved from rock, but in the wall near you there is a skeleton *melted* into
    the wall, still carrying his sword and shield.  You shiver.  What a horrible fate...
  sector: inside
  exits:
    south:
      to: tba:42:room:4228

"tba:42:room:4230":
  name: The Royal Balcony
  description: >
    You have walked out onto a balcony, very high up, jutting out from a large sprialing structure that
    is obviously not natural.  You can see the ground far, far below you, and you shudder as you think
    what would happen if you fell from here.  You look up, and you can see the blue sky far above you.  To
    the north is the passageway that brought you here.
  sector: inside
  exits:
    north:
      to: tba:42:room:4228

"tba:42:room:4231":
  name: The Royal Throne Room
  description: >
    You are in a very large room, which is obviously a meeting hall or a gathering space of some sort,
    and as you look around, you see toward the east wall, a large circular hollow, with several
    indentations as if for places to lean your elbows, but they are way too big for you.  Everywhere you can see
    large designs, showing knights on horseback being slaughtered, countrysides being ravaged, and castles
    being destroyed.  They are obviously a monument to some particularly evil acts by dragons.
  sector: inside
  exits:
    west:
      to: tba:42:room:4228

"tba:42:room:4294":
  name: NOTE
  description: -add material desc for chasm walls -more stuff to add feeling to the zone
  sector: inside

"tba:42:room:4295":
  name: A Stairwell
  description: >
    You are plodding down a seemingly endless line of stairs.  They are all featureless, made out of
    solid granite.  The only thing interesting about these stairs is that they are very large and wide, big
    enough for a giant.  They spiral downwards are far as you can see.  You look up.  They go just as
    far that way.
  sector: inside
  exits:
    up:
      to: tba:42:room:4296
    down:
      to: tba:42:room:4216

"tba:42:room:4296":
  name: Top of A Stairwell
  description: >
    You have entered a massive stairwell, spiraling downwards as far as you can see.  Each step is
    about ten feet long and thirty feet wide.  You would hate to find out what would happen if you tripped
    and fell down them...
  sector: inside
  flags: [no_mob]
  exits:
    west:
      to: tba:42:room:4219
    down:
      to: tba:42:room:4295

"tba:42:room:4297":
  name: The Back of the Cave
  description: >
    You have reached the back of the cave.  It is nothing special, besides the fact that there is a
    globe of magical light floating in the middle of the room. This lets you see your surroundings, and the
    many claw marks decorating the walls.  There is a large circular depression by the wall, which have
    some bones and assorted pieces of armor lying about-all of them with large bite marks on them.  You
    start to get an uneasy feeling in the pit of your stomach...
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:42:room:4206
