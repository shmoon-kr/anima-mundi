# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 65.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:65:room:6500":
  name: The Path To The Dwarven Village
  description: >
    You are walking down a path that leads to the dwarven village.  Above you, you can see the Turning
    Point, and to the north the path continues toward the mountains.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:65:room:6501
      look: The path continues.
    up:
      to: tba:35:room:3502
      look: You can see the city of Midgaard.

"tba:65:room:6501":
  name: The Path At The Base Of The Mountain
  description: >
    Now you are at the bottom of a rugged mountain.  The forest around you is very dense, and it seems
    very dark to the north.
  sector: hills
  exits:
    north:
      to: tba:65:room:6502
      look: The path coninues up the mountain.
    south:
      to: tba:65:room:6500
      look: The path heads toward the main city of Midgaard.

"tba:65:room:6502":
  name: The Path At The Middle Of The Mountain
  description: >
    Standing on the middle of the mountain, you can easily see the city to the south, and the top of
    the mountain is very near to the north.
  sector: mountains
  exits:
    north:
      to: tba:65:room:6503
      look: The top of the mountain is easily seen from here.
    south:
      to: tba:65:room:6501
      look: The base of the mountain is near.

"tba:65:room:6503":
  name: The Top Of The Mountain
  description: >
    You are now on the top of the mountain.  To the south you see a path leading down the mountain.  To
    the east and west you see entrances to what seems like mines.
  sector: hills
  exits:
    east:
      to: tba:65:room:6540
      look: An entrance to the mountain which seems to lead underground.
    south:
      to: tba:65:room:6502
      look: The path leads down the mountain to the main city of Midgaard.
    west:
      to: tba:65:room:6505
      look: There is an entrance to the mountain.

"tba:65:room:6504":
  name: The Narrow Path
  description: >
    This is a narrow path leading to the Dwarven Kingdom.  It looks less travelled than the others, and
    it is very creepy.  The path opens up to the south, and continues to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:65:room:6506
    south:
      to: tba:65:room:6540

"tba:65:room:6505":
  name: The Entrance To The Mountain
  description: >
    Here is an entrance to the mountain.  The door looks very well built, and you can hear noise coming
    from within.
  sector: field
  exits:
    east:
      to: tba:65:room:6503
    west:
      to: tba:65:room:6513
      door:
        keywords: [door]
        kind: pickproof
        key: tba:65:obj:6515
        reset: locked

"tba:65:room:6506":
  name: A Bend In The Narrow Path
  description: >
    This is a narrow path that bends to the east here.  The trees hang over the path, and it is very
    overgrown.  The narrow path continues to the south and to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:65:room:6507
    south:
      to: tba:65:room:6504
  extras:
  - keywords: [tree, trees]
    text: They hang over the road in the most ominous of ways.

"tba:65:room:6507":
  name: The Narrow Path
