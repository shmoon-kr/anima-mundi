"tba:65:room:6531":
  name: The Queen's Waiting Room
  description:
  - >
    This is the Queen's waiting room.  Here the men literally 'wait' for the queen.  You've heard that
    the queen really likes to get to 'know' her people, in the biblical sense.
  - The Queen's bedroom is to the north, and you can see stairs to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:65:room:6532
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:65:room:6530

"tba:65:room:6532":
  name: The Queen's Bedroom
  description:
  - >
    This is the Queen's bedroom.  The bed is all ruffled, and there is a stack of dirty sheets piled in
    the corner.  There is a ladder that leads down, out of the castle, and you can leave the room to the
    south.  There is also a small wooden door to the west. There is a sign that says:
  - -------------------------
  - "|  I'm busy right now,  |"
  - "|  and don't know when  |"
  - "|  Ill be back, but if  |"
  - "|  there is a key here  |"
  - "|  take it and PLEASE,  |"
  - "|  try to get my birth  |"
  - "|  control pills back!  |"
  - "|  I've heard they can  |"
  - "|  be found somewhere,  |"
  - "|  deep in the mines..  |"
  - -------------------------
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:65:room:6531
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:65:room:6554
      door:
        keywords: [door, wooden]
        kind: pickproof
        key: tba:65:obj:6500
        reset: locked
    down:
      to: tba:65:room:6533

