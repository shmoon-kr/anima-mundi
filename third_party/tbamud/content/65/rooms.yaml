    You are standing on the north side of Castle Strangelove.  You notice that you are no longer inside
    the mountain anymore either. Along the southern horizon you see towering mountains.
  - The only exit, however, is back up the ladder into the Queen's Bedroom.
  sector: inside
  exits:
