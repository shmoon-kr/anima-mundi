"tba:250:room:25042":
  name: Walking through DragonSpyre
  description: >
    You should read room descriptions more often.  The acid cascades over your body, and burns the skin
    from the muscle, then the muscle from the bone.  You have never experienced this much pain in your
    entire life.
  sector: inside
  flags: [dark, no_mob, indoors, private]
  triggers: [tba:250:trg:25000]

"tba:250:room:25043":
  name: Walking through DragonSpyre
  description: >
    You are at the end of the tunnel.  The only exit other than the one you came in through is down. 
    You probably shouldn't go down...  It might be dangerous. But then again, you don't gain fame and
    fortune by being afraid of a little new challenge, now do you?
  sector: inside
  exits:
