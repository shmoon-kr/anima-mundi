"tba:250:room:25022":
  name: Walking through DragonSpyre
  description: >
    You are beginning to feel very unnerved.  Since you have been walking through DragonSpyre, the
    screams had been slowly dying off, and now they are no more.  Normally the lack of death cries would be a
    welcome change, only now they have been replaced by a very eerie silence.  You don't like this one
    bit.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:250:room:25023
      look: Walking through DragonSpyre
    west:
      to: tba:250:room:25021
      look: Walking through DragonSpyre

"tba:250:room:25023":
  name: Walking through DragonSpyre
  description: >
    This cave is really starting to get on your nerves.  With each new step, you hear what sounds like
    giggling coming from all sides, goading you onward. Daring you to learn the secrets that DragonSpyre
    has held for the past three hundred years.  "They are only dragons.  "
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:250:room:25024
      look: Walking through DragonSpyre
    south:
      to: tba:250:room:25022
      look: Walking through DragonSpyre

"tba:250:room:25024":
  name: Walking through DragonSpyre
  description: >
    This cave is really starting to get on your nerves.  With each new step, you hear what sounds like
    giggling coming from all sides, goading you onward. Daring you to learn the secrets that DragonSpyre
    has held for the past three hundred years.  "They are only dragons.  " To the north, the path forks.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:250:room:25025
      look: Walking through DragonSpyre
    south:
      to: tba:250:room:25023
      look: Walking through DragonSpyre

"tba:250:room:25025":
  name: Walking through DragonSpyre
  description: >
    You have reached a fork in the path through DragonSpyre.  You can't be sure which way you should
    go, but the odd scraching sound to the east makes you want to go west.  The giggling that has been
    following you around has now become a full blown laugh.  "They are ONLY dragons.  "
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:250:room:25028
      look: Walking through DragonSpyre
    south:
      to: tba:250:room:25024
      look: Walking through DragonSpyre
    west:
      to: tba:250:room:25026
      look: Walking through DragonSpyre

"tba:250:room:25026":
  name: Walking through DragonSpyre
  description: >
    The walls are blank and featureless, solid rock that has not been touched for unknown centuries. 
    The floor is scuffed and scraped from thousands of claws passing over it.  The ceiling is out of
    sight, the cave is obviously made for something well beyond human size.  "They are only dragons.  "
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:250:room:25025
      look: Walking through DragonSpyre
    west:
      to: tba:250:room:25027
      look: Walking through DragonSpyre

