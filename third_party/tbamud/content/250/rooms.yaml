# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 250.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:250:room:25000":
  name: An Ancient Path through the dense forest
  description: >
    This path appears to be very old, and well travelled.  It amazes you that you have never noticed it
    was here before.  That is until you look back and realize that the clay road is completely invisible
    to you from here.  To the east, the path continues.  It appears that the western opening you entered
    through is now impassible.  You are here whether you like it or not....
  sector: forest
  exits:
    east:
      to: tba:250:room:25001
      look: An Ancient Path through the dense forest
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder      :
           Zone         : 250 Dragonspyre
           Player Level : 28-30
           Rooms        : 100
           Mobs         : 10
           Objects      : 22
           Links        : 38u, 43d

"tba:250:room:25001":
  name: An Ancient Path through the dense forest
  description: >
    The path is becoming more and more difficult to traverse now, as the trees seem to reach out to
    strangle you.  You feel like you are utterly alone, and, if not for the mountain you can now see in the
    distance, would probably just recall to Midgaard.  But then again, who ever said that adventuring was
    easy?
  sector: forest
  exits:
    east:
      to: tba:250:room:25002
      look: End of the Ancient Path
    west:
      to: tba:250:room:25000
      look: An Ancient Path through the dense forest

"tba:250:room:25002":
  name: The End of the Ancient Path
  description: >
    You finally burst free from the grasp of the wood, only to find yourself at the foot of a path. 
    The path leads north, to the mountain which has, until now been your only beacon.  Now that you can
    better see the ominous mountain looming before you, you begin to rethink the idea of recalling to
    Midgaard.
  sector: forest
  exits:
    north:
      to: tba:250:room:25003
      look: Path to the Mountain
    west:
      to: tba:250:room:25001
      look: An Ancient Path through the dense forest

"tba:250:room:25003":
  name: Path to the Mountain
  description: >
    You are on a small nondescript path leading northward to the mountain.  The closer you get to the
    mountain, the worse you feel about the whole thing.  You begin to remember hearing old stories about a
    hidden mountain, which was, for some unknown reason, named DragonSpyre.
  sector: forest
  exits:
    north:
      to: tba:250:room:25004
      look: Path to the Mountain
    south:
      to: tba:250:room:25002
      look: End of the Anicient Path

"tba:250:room:25004":
  name: Path to the Mountain
  description: >
    You are on a small nondescript path leading northward to the mountain.  The closer you get to the
    mountain, the worse you feel about the whole thing.  The deep stench of dragon is wafting through the
    air now, and you are starting to feel the first tinges of dragon fear stir within you.  Maybe you
    should go back while you still have that option.
  sector: forest
  exits:
    north:
      to: tba:250:room:25005
      look: At the foot of the Mountain
    south:
      to: tba:250:room:25003
      look: Path to the Mountain

"tba:250:room:25005":
  name: At the foot of the Mountain
  description: >
    You have reached the foot of the great mountain.  Here, the dragon stench is almost strong enough
    to disable you.  The only way you are able to stand it is by ripping of a piece of cloth, and covering
    your mouth and nose with it as you walk.  Far above you, you see what must be the entrance to the
    cave.
  sector: forest
  exits:
    south:
      to: tba:250:room:25004
      look: Path to the Mountain
    up:
      to: tba:250:room:25006
      look: Climbing the Mountain

"tba:250:room:25006":
  name: Climbing the Mountain
  description: >
    Now that you have something to somthing to concentrate upon, scaling the mountain, you are actually
    able to think more clearly.  You have encountered dragons before, and vanquished them, why should
    these be any different.  This thought continues rolling through your mind, but as you reach the next
    level of the cliff, it does little to ease your fear.
  sector: mountains
  exits:
    up:
      to: tba:250:room:25007
      look: Climbing the Mountain
    down:
      to: tba:250:room:25005
      look: At the foot of the Mountain

"tba:250:room:25007":
  name: Climbing the Mountain
  description: >
    You are now close enough to the entrance to hear the sounds from within. The first thing you are
    aware of is that the mountain itself seems to breathe. In and out goes its breath, constantly in and
    out.  You suddenly hear footsteps approaching from all around you, and brace for combat.  It takes you
    a few moments to realize that the sound was your heart beating.
  sector: mountains
  exits:
    up:
      to: tba:250:room:25008
      look: The ledge on the Mountain
    down:
      to: tba:250:room:25006
      look: Climbing the Mountain

"tba:250:room:25008":
  name: The ledge on the Mountain
  description: >
    You have reached a small ledge about one fourth of the way up the mountain. To the east is the
    entrance to what seems to be a small cave.  The only hint as to the size of the cave are the screams that
    are echoing from within it, which seem to last an eternity.
  sector: mountains
  exits:
    east:
      to: tba:250:room:25009
      look: Entrance to the Cave
    down:
      to: tba:250:room:25007
      look: Climbing the Mountain

"tba:250:room:25009":
  name: Entrance to the Cave
  description: >
    Once inside the cave you feel completely lost to the outside world.  All around you are horrific
    sounds of death and fear.  The walls are all stained with many differing shades of red or brown, with a
    few frost particles glittering on one of the walls.  Even with the cloth, the smell of the dragons
    is almost unbearable.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:250:room:25010
      look: Walking through DragonSpyre
    west:
      to: tba:250:room:25008
      look: A ledge on the Mountain

"tba:250:room:25010":
  name: Walking through DragonSpyre
  description: >
    Within the realm of the DragonSpyres, everything seems different.  The walls appear to reach out
    towards you, while the floor and ceiling struggle to crush the life from you.  The further you proceed
    into the Mountain, the more you wish you hadn't come here in the first place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:250:room:25011
      look: Walking through DragonSpyre
    west:
      to: tba:250:room:25009
      look: Entrance to the Cave

