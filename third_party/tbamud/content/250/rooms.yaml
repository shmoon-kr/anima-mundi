"tba:250:room:25032":
  name: The Lair of the White Dragon
  description: >
    You have managed, through luck(?  ), to find the lair of the white dragon. It stands before you,
    glaring at you with its pale blue eyes.  All around, the walls are coated with a thick layer of ice. 
    You slip several times before gaining your balance enough to face the fearsome beast.  Will you fight
    it, or flee?  "It is JUST a dragon.  "
  sector: inside
  flags: [indoors]
  exits:
