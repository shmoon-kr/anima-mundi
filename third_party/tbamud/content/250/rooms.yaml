"tba:250:room:25073":
  name: Lair of the Copper Dragon
  description: >
    Within the bounds of this room, time has seemed to stop.  There is no movement, save for the large
    mass at the back of the room.  Out of the corner of you eye, you manage to catch a glimpse of a
    droplet of water "falling" from a stalagtite...  It appears to have been in the same position for the past
    century.  You have no chance to move before the Dragon strikes.
