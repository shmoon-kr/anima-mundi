"tba:19:obj:1953":
  type: note
  keywords: [old, leather, book, ruby]
  short: a leather book inset with a ruby
  long: An old leather book gathers dust here.
  action: |-
    Having spent considerable time studying the inhabitants of the place they
    call the Spider Swamp and the powerful magicks they possess, I have
    decided to preserve my findings in writing. Each of these volumes is
    dedicated to Tyrel the Machine-Maker, who was a brilliant colleague and
    great friend. Alas, both he and his devices are lost to the Drow lord who
    rules this place, and so the method of creating these potions is no more.
    Nonetheless, I lay it out here for any who would continue these studies.
    
       A powerful potion of strength was our first discovery, a deep red potion,
    the color of rich wine. When quaffed, it produced immediate physical
    effects, muscle ability enhanced and body defenses strengthened.
    
       As a base for all our testings, we used the nightblood of the driders, black
    viscous fluid that burns the eyes unless contained in special beakers. Then,
    for this particular solution we added an arachnoid fang, from a striped spider
    it was. Finally, one of the eggs from the lizard man tribe. All of these
    ingredients were gained with great peril, and once mixed together in Tyrel's
    machine, produced a solution so potent that we were forced to create special
    magical vials to hold it. The effects, though temporary, are nonetheless
    astounding.
    
       These findings are the work of myself - Artemis, of gnome-kind, and Tyrel,
    a man and machine-maker. Use them wisely.
  flags: [no_rent, no_donate, no_sell]
  wear: [take]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 1
  rent: 0
  level: 0

