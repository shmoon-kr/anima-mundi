# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 19.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:19:room:1900":
  name: Detta's [Spider Swamp] Description Room
  description:
  - >
    @BTheme:@n This zone is a recreation of the Spider Swamp within Forgotten Realms (Dungeons &
    Dragons). It is basically a hot, fetid swampland inhabited with spiders, bullywugs, and lizardfolk, with a
    submerged palace called Lost Ajhuutal in the Northern part. Have made liberal use of exit/extra
    descrips here, so examine at will. :)
  - >
    @GPlayers:@n Geared towards mid/high level players of around 15-20, there are smaller mobs to kill
    here if you feel like braving the aggressive stronger ones ;-). It is also a fairly evil area, with
    some limitations on what you can use and access as a good player here. Some equipment/money to be
    gained, big bad guy to be slaughtered, and lots of xp.
  - >
    @RLocation:@n Well the area itself is completely swampish, though at the southern part it could
    easily be joined to a river or lake, and a more foresty area would blend seamlessly into the eastern
    area.
  - "@MSecrets:@n Yes there are some :-), type LOOK SPOILERS to reveal all."
  - >
    @CNote:@n If you have any suggestions, spot any typos, bugs, or weirdnesses, please mudmail me -
    Detta. :-) All input appreciated! You can also email me at detta@@builderacademy.net East takes you
    through the other zones I have built here. Down takes you to the starting room of this zone.
  sector: inside
  flags: [indoors, private]
  exits:
    east:
      to: tba:27:room:2700
    west:
      to: tba:11:room:1100
    down:
      to: tba:19:room:1999
  extras:
  - keywords: [spoilers]
    text: >
      Ahhh, cheater!!  Don't you want to enjoy the zone?!  *sniff*, ok, if you really have to look there
      are a few little neat zone inclusions listed here to spoil your zone exploring pleasure.  Just type
      look and then the number to look at each one (look 1 for example). 1: The Leviathan 2: Spider Cocoons
      3: The Dark Candleholder 4: The Metal Contraption
  - keywords: ["1"]
    text: >
      This is just a little trigger that sets off in room 1911 when you enter.  A series of messages goes
      off and then the leviathan mob emerges.  If you move more than one room away in the middle of
      fighting the creature it will disappear again, reloading fully restored.  This is just the framework so far
      for a little quest I'm creating around it.  Ooh, additionally the room that the leviathan loads in
      will only let you leave 90% of the time due to slippery mud.
  - keywords: ["2"]
    text: >
      The spider's cocoons are used to trap people..  Both players and mobs alike. If you fight the
      whisper spider in room 1993 it will start sending messages about wrapping web around you.  Ultimately if
      you do not flee or kill the spider quickly you will find yourself wrapped in a cocoon, unable to move
      or see anything.  In this state all you can do is send tells, and wriggle which makes the cocoon
      visibly move to everyone else (as immortal you can also use the goto command).  To open one of these
      cocoons another player must have a fire torch (object 1905) and type burn.  This will set it on fire and
      release the trapped mob or player.  If a trapped player is not freed within about 5 minutes he/she
      will die.
  - keywords: ["3"]
    text: >
      In room 1982, a dark candleholder can be found.  On zone reset a candle loads inside, and if this
      is taken, a passage opens up to the north.  Once on the other side (room 1983), the passage closes and
      a voice can be heard telling you to "leave what you have taken", in reference of course to the
      candle.  If the candle is not dropped and you continue on to any other room, it will be purged and the
      voice will kindly remind you of your doom, as you are now essentially trapped.  However, dropping the
      candle like a good mudder will cause a drow spirit to reveal herself, explaining that she will open the
      way if you call on the name of Eilistraee.  Naturally, saying the word Eilistraee causes the spirit
      to vanish and the passage out to reopen..  Albeit for a limited time.
  - keywords: ["4"]
    text: >
      In room 1990 there is a large metal contraption, that essentially produces potions when the right
      ingredients are put into it.  PRESS empties the machine of any ingredients it has, SWITCH mixes
      whatever ingredients are in it together, and TURN pours the resulting substance out.  If an empty vial
      (1949) is placed into the machine before pouring, you'll get a potion, otherwise the mixture just pours
      onto the floor.  There are three books scattered throughout the zone with the recipes of each potion
      in, but for now I'll just put them here. Red potion (enhances physical strength) - fang (1900), egg
      (1908), blood (1951). Blue potion (enhances magical strength) - gland (1934), tongue (1950), blood
      (1951). Green potion (enhances dexterity & moves) - weed (1901), hide (1923), blood (1951). Once the
      ingredients for one potion are inside, they must be mixed, an empty vial placed into the contraption and
      the mixture poured out. If any combination of ingredients other than those listed are combined, a
      black potion will be produced which lowers all three attributes.

"tba:19:room:1901":
  name: Muddy Crossroads
  description: >
    An old broken crossroads sign stands wearily here, half rotted with fungus and the general decay of
    time.  It appears as though there were indeed paths here long ago, but water has saturated the
    ground, leaving nothing but featureless mud.
  sector: field
  exits:
    north:
      to: tba:19:room:1907
      look: >
        The ground seems to slope downwards in this direction, making it look potentially difficult or
        impossible to get back up.
    east:
      to: tba:19:room:1902
      look: >
        Thick sloshing mud seems to get thicker, slightly churning mud bubbling further toward the east.
    south:
      to: tba:19:room:1999
      look: >
        The ground appears to get slightly drier and firmer, traces of brown struggling plant life marking
        the way south.
    west:
      to: tba:19:room:1903
      look: >
        A great rock casts a dreary shadow over the way west, colder air wafting from this direction.
  extras:
  - keywords: [fungus]
    text: >
      These tiny sprouting mushrooms are typical swamp flora, thriving on the damp rotting wood of the
      abandoned sign.
  - keywords: [old, broken, crossroads, sign]
    text: >
      This old splintered sign has long lost any visible markings, black rivulets of ink staining the
      rotting wood that stands uselessly here, just a remnant of past inhabitants.

"tba:19:room:1902":
  name: Squelching Ground
  description: >
    Slick with moisture, the ground is unnaturally swollen and soft.  The slightest weight leaves deep
    imprints that quickly well back up with sloshing mud and the few sickly bits of plant life that grow
    here.
  sector: field
  exits:
    north:
      to: tba:19:room:1910
      look: >
        The ground dips suddenly, substantial flooding and algae rendering it very slippery indeed.
    west:
      to: tba:19:room:1901
      look: >
        The ground looks well trodden to this direction, wet mud packed fairly firmly and an old piece of
        wood can be seen protruding from the ground.
  extras:
  - keywords: [sickly, bits, plant, life]
    text: >
      Limp and miserable, these plants look as though they are barely surviving on what little
      nourishment and sunlight the swamp provides.

"tba:19:room:1903":
  name: Shadow of a Great Rock
  description: >
    A massive rock towers from the ground to the north, overhanging at the top and casting the boggy
    ground in shadow.  The air is cooler here, the stone itself emitting an almost unnatural chill in
    contrast to the warmth of the surroundings.
  sector: field
  flags: [dark]
  exits:
    east:
      to: tba:19:room:1901
      look: >
        The ground seems flatter and more stable toward this direction, an upright wooden stick breaking
        the smoothness of the horizon.
    south:
      to: tba:19:room:1905
      look: >
        The ground becomes an almost unnatural red color, glimpses of something sparkling winking in and
        out like stars amongst the mud.
    west:
      to: tba:19:room:1904
      look: >
        Shimmering air indicates that the heat increases to this direction, the sound of slight bubbling
        coming from further to the west.
  extras:
  - keywords: [massive, rock, stone]
    text: >
      This great stone looks almost as though it were part of a statue that has long sunk irretrievably
      into the swamp.  A faint glow surrounds it, and an unnatural coldness fills the air as if this place
      were somehow connected with some evil magic.

"tba:19:room:1904":
  name: Drowned Land
  description: >
    Water pools slightly deeper here, the mud beneath bubbling slightly with the heat of some
    underground current.  Large blisters swell from the ground, popping with a hiss and releasing hot, swirling
    steam into the foggy air.
  sector: field
  exits:
    north:
      to: tba:19:room:1909
      look: >
        It looks as though a large log has sunk into the area to the north, making it at least stable to
        walk on.
    east:
      to: tba:19:room:1903
      look: >
        Cold air wafts eerily from this direction, a great rock towering visibly above the watery ground.
    south:
      to: tba:19:room:1906
      look: >
        The soil seems to become more copper-colored toward the south, a slight smell of metal and rust
        carrying on the air.

"tba:19:room:1905":
  name: Bloodied Soil
  description: >
    Scarlet stains blossom here and there like spreading wounds in the soil, giving the impression that
    this place has not recovered from some ancient battle.  Glimpses of metal can be seen half-buried in
    the ground, the armor and weapons of some long-decayed army.
  sector: field
  exits:
    north:
      to: tba:19:room:1903
      look: >
        A darkness and chill seem to emanate from this direction, a great rock breaking the horizon far to
        the north.
    west:
      to: tba:19:room:1906
      look: >
        Red, metallic water trickles constantly from this direction, a vile smell wafting on the western
        air.
  extras:
  - keywords: [glimpses, metal, armor, weapons]
    text: >
      Small pieces of weaponry and armor protrude from the ground like shrapnel, so deeply rusted and
      swallowed in mud that they are practically irretrievable and are obviously of no further use for warring.
  - keywords: [scarlet, stains]
    text: >
      These large dark patches in the mud glisten slightly crimson in any light, the faded blood stains
      of many fallen warriors.

"tba:19:room:1906":
  name: Crimson Waters
  description: >
    Old rusted weapons and armor lie half rotted in scattered pools of slime. The rust has leached into
    the water, discoloring it deep red and filling the air with the overwhelming stench of decay and the
    sickly metallic scent of blood.
  sector: field
  exits:
    north:
      to: tba:19:room:1904
      look: >
        A rhythmic blast of heat comes from this direction, cloudy steam obscuring the view of what lies
        beyond.
    east:
      to: tba:19:room:1905
      look: >
        Red soil sprinkles the eastern path, silver glinting metals sparkling here and there in the
        distance.
    west:
      to: tba:19:room:1912
      look: >
        A putrid smell wafts on the western air, the smell of death, and deep waters ripple in the restless
        breeze.
  extras:
  - keywords: [scattered, pools, slime]
    text: >
      These slippery pools are coated with floating algae and slime of various organic kinds.  The water
      is presumably toxic as it is so saturated with rust and rot that it glints scarlet in the light.
  - keywords: [old, rusted, weapons, armor, rotted]
    text: >
      These battered pieces of metal and algae-encrusted leather are all that is left of an obviously
      mighty battle.  There are no corpses to be found, all that died presumably devoured by creatures here or
      rotted long before these metals began to rust.

"tba:19:room:1907":
  name: Slippery Slope
  description: >
    Slick with mud, the ground is incredibly hard to walk on without slipping. Sloping steeply down
    from the south, thin rivulets of water trickle their way lazily down, accumulating in a watery pool at
    the base.
  sector: field
  exits:
    south:
      look: The way south looks too steep and too slippery to even begin trying to climb.
    west:
      to: tba:19:room:1908
      look: >
        Rocky spikes break up the horizon line, gaping like the open jaw of some predatory creature.
  extras:
  - keywords: [thin, rivulets, water, watery, pool, base]
    text: >
      Tiny veins of sparkling water line the surface of this slanted ground, muddy churning water
      bubbling continously in the pool that saturates the lower ground.

"tba:19:room:1908":
  name: Scattered Rocks
  description: >
    Small jagged peaks protrude from the marshy ground, providing a solid but treacherous path for
    walking.  Thin layers of slime glisten on the sharp rocks, along with various other old and
    unidentifiable stains.
  sector: field
  exits:
    north:
      to: tba:19:room:1915
      look: >
        More scattered broken rocks can be seen trailing off to the north, water deepening steadily around
        them.
    east:
      to: tba:19:room:1907
      look: >
        A little pool can be see glistening off to the east, and the solid path curves around steadily to
        the south where the ground rises.
    south:
      to: tba:19:room:1924
      look: >
        A massive piece of broken stone rises from the ground in this direction, it appears to have once
        stood upright, torn from the jagged base here and overturned by some unimaginable force.
    west:
      to: tba:19:room:1909
      look: >
        The thick smell of swamp fungus and rotting wood saturates the breeze, an overturned tree's
        skeletal branches grasping at the air.
  extras:
  - keywords: [thin, layers, slime, old, unidentifiable, stains]
    text: >
      The slick green coating of algae is obvious over all of these rocks, decaying plant slime as well
      as darker and more ominous stains paint the jagged surfaces various shades of red and black.
  - keywords: [small, jagged, peaks, sharp, rocks]
    text: >
      These rocks look almost like the remnants of a huge embedded boulder or statue that has been broken
      away by some massive force.  Firmly entrenched in the mud, the rough-edged base spikes out like
      several rows of teeth.

"tba:19:room:1909":
  name: Rotting Branch
  description: >
    Blue and green mould carpets this large crumbling branch, half sunk into the soil it nevertheless
    is so large that it almost completely blocks further advancement.  Tiny fungi sprinkle the rotting
    wood and surrounding mud, products of its continuing decomposition.
  sector: field
  exits:
    east:
      to: tba:19:room:1908
      look: >
        Little stony peaks rise from the slippery mud here, providing a somewhat stable, albeit dangerous
        footpath.
    south:
      to: tba:19:room:1904
      look: >
        Waves of steamy heat cascade on the shimmering air from this direction, the sound of simmering
        water and mud bubbling continously.
  extras:
  - keywords: [blue, green, mould, tiny, fungi]
    text: >
      These dark creeping moulds cover the wood in an almost velvety texture, little swamp mushrooms
      sprouting here and there, feeding off of the damp and rot.

"tba:19:room:1910":
  name: Flooded Waterway
  description: >
    This deep ditch looks as though it may once have been a rushing river, though now it is just a
    watery bog, its high sloping sides sodden with slime from rotting vegetation and the wild overgrowth of
    algae and desperate creeping swamp vines.
  sector: field
  exits:
    north:
      to: tba:19:room:1911
      look: >
        The way to the north grows darker and deeper, a strange ominous feeling hanging over the area like
        an invisible shadow.
    south:
      to: tba:19:room:1902
      look: >
        The ground seems to become muddier and softer, but the sloping sides of this ditch level out into
        flatter land.

"tba:19:room:1911":
  name: Dark Waters
  description: >
    The water here is so dark that nothing can be seen beneath the single layer of scum that floats
    everywhere.  Insects dart quickly here and there, apparently fleeing from the more ominous shadows that
    slide just beneath the surface.
  sector: field
  flags: [no_mob]
  exits:
    south:
      to: tba:19:room:1910
      look: The way south looks very slippery indeed, difficult to climb out of but not impossible.
  extras:
  - keywords: [ominous, shadows]
    text: >
      Dark rippling shadows stir unnaturally beneath the water, the movements of some hidden creature no
      doubt.
  - keywords: [insects]
    text: >
      These simple swamp insects flit so fast it is hard to see them properly, tiny and plated with
      defensive exoskeletons they pause only to feed on the smaller zooplankton in the water.

"tba:19:room:1912":
  name: Ditch of the Dead
  description: >
    Forlorn water swirls slowly in this forsaken riverbed, churning as though stirred by some unseen
    current.  Strange things surface with the movement, glimpses of shiny metal and splintered bone are all
    that mark this place as the grave it has become.
  sector: field
  exits:
    north:
      to: tba:19:room:1913
      look: >
        The vast splayed roots of a giant tree stand upturned in the air, blocking any view of what lies
        beyond.
    east:
      to: tba:19:room:1906
      look: >
        Red waters leach slowly from this direction, polluting the soil and filling the air with an
        eye-watering metallic scent.
  extras:
  - keywords: [splintered, bone]
    text: >
      Pieces of decaying bone are all that remain of any organic corpses, bleached almost white from the
      alkaline water here and stripped by predators of all flesh that hadn't rotted away naturally.
  - keywords: [glimpses, shiny, metal]
    text: >
      Old broken pieces of weapons and shields float in shards amongst the bubbling water, stirring as
      though in some cauldron of death.

"tba:19:room:1913":
  name: Toppled Tree
  description: >
    The vast roots of this overturned tree splay in all directions like the legs of an attacking
    spider.  Almost as thick as branches they are hard and brittle as though this tree died years ago.  Dark
    streaks marr the wood, evidence perhaps of long past lightning storms, or the use of powerful magic in
    this area.
  sector: field
  exits:
    north:
      to: tba:19:room:1914
      look: >
        This giant tree's trunk continues on into the north, sloping slightly downward as it becomes
        increasingly submerged in the mud.
    south:
      to: tba:19:room:1912
      look: A foul smell wafts on the discolored air, water bubbling and simmering away to the south.
    down:
      to: tba:19:room:1918
      look: >
        The bark of the trunk has rotted away, leaving a gaping hole that leads into the hollow trunk.
  extras:
  - keywords: [dark, streaks]
    text: >
      These are charred areas in the wood that have burnt in strange patterns.  It looks as though it may
      indeed be the work of lightning, though evil magic is more likely considering these whereabouts.

"tba:19:room:1914":
  name: Scorched Trunk
  description: >
    This massive trunk has been half swallowed by the gurgling ground, only the huge reaching branches
    hold it from complete submersion.  Black unnatural burn marks weave their way like rotting vines all
    along the ancient bark.
  sector: field
  exits:
    north:
      look: Huge splaying branches reach out in every direction, preventing further advancement.
    east:
      look: Huge splaying branches reach out in every direction, preventing further advancement.
    south:
      to: tba:19:room:1913
      look: The giant grasping roots of the tree can be seen reaching darkly into the air.
    west:
      look: Huge splaying branches reach out in every direction, preventing further advancement.
  extras:
  - keywords: [black, unnatural, burn, marks, rotting, vines]
    text: >
      These strange and ominous markings appear almost to have been designed, not just the random streaks
      of lightning or fire.  The evils of lethal magic are almost certainly at work here.

"tba:19:room:1915":
  name: Stony Path
  description: >
    All around the murky water simmers and bubbles, releasing terrible stench into the air as it laps
    around this small trail of island rocks, the only path through this watery part of the swamp.
  sector: field
  exits:
    south:
      to: tba:19:room:1908
      look: >
        The trail of jagged rocks continues to the south, the stones becoming suddenly larger and less
        natural as though broken off from some designed stonework.
    west:
      to: tba:19:room:1916
      look: >
        Dark discolored water churns gently in the breeze, the slippery algae-laden surface glinting with
        each ripple.
  extras:
  - keywords: [small, trail, island, rocks]
    text: >
      These little rocks stick up like stalagmites from the muddy and unstable ground, perilous but
      weight-supporting enough to act as a trail.

"tba:19:room:1916":
  name: Puddle of Algae
  description: >
    Various slimes of green, brown and red slide across the surface of this muddy water.  Plant life of
    various kinds tangle and intertwine into each other beneath the water, making it very easy to become
    caught.
  sector: field
  exits:
    east:
      to: tba:19:room:1915
      look: >
        The bleak surface of the dark water is broken here and there with the peak of a jagged rock,
        leading off further to the east.
    west:
      to: tba:19:room:1917
      look: >
        Pieces of wood protrude from the ground to the west, a large dark hole visibly gaping through the
        mud.

"tba:19:room:1917":
  name: Buried Tree
  description: >
    A flat area of bark protrudes slightly from the sopping ground here, a gaping hole leading into
    darkness beneath, as though some hollow tree has become buried just below the surface, the sound of
    thick mud dripping within a concealed space below.
  sector: field
  exits:
    north:
      to: tba:19:room:1921
      look: Thin, mossy trees wave wearily, blocking any further view of what lies to the north.
    east:
      to: tba:19:room:1916
      look: >
        Dark discolored water churns gently in the breeze, the slippery algae-laden surface glinting with
        each ripple.
    west:
      to: tba:19:room:1922
      look: >
        A small battered bridge can be seen further off to the west, though no body of water appears to be
        present.
    down:
      to: tba:19:room:1920
      look: >
        Broken, splintered wood gapes widely around this mud-slicked hole.  It appears a tree has become
        submerged within the ground, the contents of its hollow trunk just beyond the scope of normal vision.
  extras:
  - keywords: [bark, gaping, hole, darkness]
    text: >
      Broken, splintered wood gapes widely around this mud-slicked hole.  It appears a tree has become
      submerged within the ground, the contents of its hollow trunk just beyond the scope of normal vision.

"tba:19:room:1918":
  name: Within the Roots
  description: >
    Dark and dank with the smell of decay, the rotting wood all around makes this place even more
    miserable.  The floor slants slightly downward to the north, and each movement makes it dip a little more
    as if the swamp were threatening to consume it whole.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1919
      look: >
        The long hollow trunk of the tree continues, nothing but the smell of rotting wood and thick mud
        giving any clues as to what lies beyond the darkness.
    up:
      to: tba:19:room:1913
      look: >
        Above, the grasping roots of this upturned tree can be seen clawing like brittle fingers at the
        foggy air.

"tba:19:room:1919":
  name: Hollow Trunk
  description: >
    Mud oozes slowly through cracks in the ancient wood, making the ground sticky and treacherously
    slippery.  The roof of the trunk curves sharply around, so low as to give the place a smothering
    claustrophobic feel.  Little worms and maggots wriggle their way through the fungating bark, making the
    enclosure seem to crawl revoltingly.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1920
      look: >
        The trunk dips even lower, creaking sounds and the smell of mouldy damp wafting from the darkness
        ahead.
    south:
      to: tba:19:room:1918
      look: >
        The trunk slopes upwards, the grasping tendrils of roots can be seen further ahead in this
        direction, clawing at the foggy air.
  extras:
  - keywords: [worms, maggots]
    text: >
      These little creatures are gorging on the filth and decay that coats this dying tree, it seems
      almost that every scavenging insect in the place as homed in on this location.

"tba:19:room:1920":
  name: Submerged
  description: >
    Completely beneath ground level, drips of mud trickly slowly down the walls from a large hole in
    the ceiling.  It seems as though extra weight in this part of the submerged tree would sink it very
    quickly, the wood moaning and groaning at any extra burden.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:19:room:1919
      look: >
        The wood enclosure seems to slope vaguely upwards, trickling mud running in rivulets from the south
        and gathering in a small puddle here.
    up:
      to: tba:19:room:1917
      look: >
        Shafts of vague light and a relatively fresh breath of air from this direction indicate that it
        likely leads to open ground.

"tba:19:room:1921":
  name: Straggling Trees
  description: >
    Weak bending trunks support the anemic looking branches and leaves of these stunted willows. 
    Swaying miserably in the slight breeze, their bark seems to creak and groan, swamp moss spreading slowly
    as if to consume them.  Thin grasses lean pathetically against the lanky trunks, almost like weary
    children clinging to their mothers.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:19:room:1955
      look: >
        A large gathering of trees can be seen extending to the north, a small gap opening the way.
    east:
      to: tba:19:room:1951
      look: >
        The gaping hollow of an old, crumbling tree shrouds everything that lies to the east in darkness.
    south:
      to: tba:19:room:1917
      look: >
        Thick mud sloshes lazily around the massive submerged trunk of a tree, its roots sticking high into
        the air further south.
  extras:
  - keywords: [weak, trunks, branches, leaves, willows, bark]
    text: >
      These frail looking trees look as though they are barely surviving off of the watery soil and fog
      shrouded sunlight, bending weakly in the slightest breeze.
  - keywords: [moss, grasses]
    text: >
      The plant life here is abundant but miserable looking, as though there is constant competition to
      survive, nutrients being scavenged by almost every form of life imaginable.

"tba:19:room:1922":
  name: A Broken Bridge
  description: >
    Crumbled brick and stone stick up from the surrounding quagmire, creating an almost natural mosaic
    walkway through the watery slime.  No river runs through here though the presence of this ancient
    bridge indicates that once there did.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:19:room:1917
      look: >
        The sloping curve of a buried tree can be seen, rising like another small wooden bridge out of the
        watery ground.
    west:
      to: tba:19:room:1923
      look: >
        A little, broken path extends its way through the soggy, marshy grounds that lie to the west.

"tba:19:room:1923":
  name: Sunken Road
  description: >
    Beneath the shallow murky water, a layer of hard stone winds smoothly along, no naturally formed
    path and an indication that long ago these grounds saw dry land, though now the smooth road is pitted
    with fungus and shelled creatures.
  sector: field
  exits:
    north:
      to: tba:19:room:1925
      look: >
        The ground slopes downward, jagged rocks standing like little islands amongst the murky waters.
    east:
      to: tba:19:room:1922
      look: >
        A jumbled collection of stone and brick are somehow still clinging to each other, forming a bridge
        that extends to the east.
  extras:
  - keywords: [fungus]
    text: >
      This is the same miserable organism that grows abundantly on every surface on sight, flat and
      sickly green, they are just another indication that the entire place is rotting.
  - keywords: [shelled, creatures]
    text: >
      Little snails, and the encrustations of crabs and mollusks decorate the surfaces with their colored
      remains.  It is impossible to tell which of these are alive and which are long dead, most seem
      perfectly content to stay completely motionless.

"tba:19:room:1924":
  name: Peak of the Rock
  description: >
    All around, the misty smog of the swampland rises, blocking what may have been a spectacular view
    if not for the waves of heat that cause the air to shimmer and swim, making everything seem eerily
    unreal.
  sector: field
  exits:
    north:
      to: tba:19:room:1908
    down:
      to: tba:19:room:1903

"tba:19:room:1925":
  name: Rising Water
  description: >
    The ground slopes lower here, deeper water gurgling around the various rock crevices and jagged
    stones that break the surface.  To the east and the west, large cavernous mouths protrude, though the
    hollows within appear to be underwater.
  sector: field
  exits:
    north:
      to: tba:19:room:1928
      look: >
        A sunken path leads treacherously to the north, looking as though it was originally a continuation
        of the same path that extends to the south.
    east:
      to: tba:19:room:1926
      look: >
        The open mouth of a cavern gapes, ominously black and silent. Slanted vaguely downward, it is
        actually more like a hole than a cave.
    south:
      to: tba:19:room:1923
      look: >
        A submerged pathway winds its way gradually up to the south, curving around just out of sight.
    west:
      to: tba:19:room:1927
      look: >
        A dark opening gurgles slightly with the sound of water sloshing its way around rocks, agitated
        with some unseen movement.

"tba:19:room:1926":
  name: Flooded Cave
  description: >
    Scarce light penetrates the dark waters of this cavern, but what little can be seen is slick with
    swamp slime and mosses, the odd glittering piece of armor shining like stars from the inky depths
    below.
  sector: underwater
  flags: [dark, no_mob, indoors]
  exits:
    west:
      to: tba:19:room:1925
      look: >
        Open air breathes gently from the west, natural light rippling vaguely on the surface of the
        breaking waters.
    down:
      to: tba:19:room:1954
      look: >
        An even darker cave can be seen through the swirling mud and algae below, the same sparkling pieces
        of metal sliding in and out of view.
  extras:
  - keywords: [glittering, armor]
    text: >
      Once in a while, something shiny moves to the surface, lingering just long enough to reveal itself
      as a piece of warrior's equipment before sinking back down into the deep.

"tba:19:room:1927":
  name: Underwater Enclosure
  description: >
    Sharp rocks protrude dangerously and invisibly from the darkness, muddy water swirling about and
    creating the apparent illusion of dark shadows and shapes swimming cautiously about.
  sector: underwater
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:19:room:1925
      look: >
        Murky water and spiked rocks travel in a vague north to south path just outside the enclosure.

"tba:19:room:1928":
  name: Sunken Road
  description: >
    Small pieces of colored glass glint up from beneath the water, broken bits of slate and chunks of
    stone mixing with the wreckage to create an unstable surface for walking on, the slick overgrowth of
    plant life making it even more treacherous.
  sector: field
  exits:
    north:
      to: tba:19:room:1934
      look: >
        The path continues wet and treacherous to the north, smooth paved surfaces crumbled into broken
        pieces of stone and grit.
    south:
      to: tba:19:room:1925
      look: >
        The ground seems to tilt slightly downward, the sound of bubbling, rushing water swirling around
        the island rocks that stick up.
    west:
      to: tba:19:room:1929
      look: >
        The eerie sound of echoing droplets and gently murmuring water are all that come from the cavernous
        mouth in this direction.

"tba:19:room:1929":
  name: A Great Cavern
  description: >
    Water trickles lazily into this vast cavern, covering the rock floor with an inch or two of
    sloshing muck.  The great stone walls have been excavated roughly, leaving sharp spikes and serrated areas
    that look almost deliberately made.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1932
      look: >
        The dark depths of the cavern don't reveal much visually, but the sound of running water can be
        heard more intensely.
    east:
      to: tba:19:room:1928
      look: >
        The open air swirls hazily around, mist and humidity wafting in from the hot sticky swamp
        atmosphere.
    west:
      to: tba:19:room:1930
      look: >
        A subtle flickering light comes from this direction, sly shadows darting in and out of existance
        along the stone walls.

"tba:19:room:1930":
  name: A Great Cavern
  description: >
    Light flickers eerily throughout this cave, apparently emanating from small torches that have been
    placed in the natural cavernous cracks and crevices. Dark green moss carpets the floor, squishing
    loudly with saturated water when stepped on.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:19:room:1931
      look: >
        The ground continues somewhat smoother to the north, dark cool stone curving around to form the
        continuing wall.
    east:
      to: tba:19:room:1929
      look: >
        Sloshing mud and jagged stone surfaces are all that reveal themselves in the few shafts of light
        cast this way.

"tba:19:room:1931":
  name: Cavernous Gates
  description: >
    Two large bamboo gates stand imposingly to the north, bright glowing light visible within and large
    flickering shadows creeping through the gaps of them. The rest of the cavern has been rather
    deliberately smoothed from the look of it, as if to make a somewhat grander impression.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1933
      look: >
        Tall bamboo gates stand here, a rough rope wrapped around them and attached with what looks like a
        wooden padlock.
      door:
        keywords: [bamboogates]
        kind: door
        key: tba:19:obj:1906
        reset: open
    east:
      to: tba:19:room:1932
      look: >
        The sound of rushing water echoes loudly off the rough rocky surfaces that continue to the east.
    south:
      to: tba:19:room:1930
      look: >
        Gentle flickering light, cascades through the shadows from this part of the cavern, the subtle
        scent of green mosses wafting on the air.

"tba:19:room:1932":
  name: A Great Cavern
  description: >
    A large fissure in the side of the wall here lets in a continuous stream of trickling water. 
    Dribbling noisily along the projecting rocks, the sound echoes as if a large stream gushed through this
    place, the sounds of rushing water amplifying along the stone walls and floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:19:room:1929
      look: >
        A subtle scent of fresh air wafts from the south, the sound of birds and outside wild life echoing
        in what appears to be the entrance to this cave.
    west:
      to: tba:19:room:1931
      look: >
        Very soft flickering light and smoothly sanded stone create a somewhat more finished appearance in
        this part of the cavern.

"tba:19:room:1933":
  name: A Primitive Throne Room
  description: >
    A great fire burns in the middle of this room, giving off the horrible stench of some cooking
    flesh.  Bits and pieces of broken armor and swords are hung here and there as decoration for the walls,
    along with various animal and humanoid skulls.  At the far north end, several swords have been tied
    together and bent to form a crude jewelled throne.  To the south, two large bamboo gates stand,
    guardians to the way out.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:19:room:1931
      look: >
        Tall bamboo gates stand here, a rough rope wrapped around them and attached with what looks like a
        wooden padlock.
      door:
        keywords: [bamboogates]
        kind: door
        key: tba:19:obj:1906
  extras:
  - keywords: [great, fire]
    text: >
      This raging fire seems to be kept continually going, the sickly smell of flesh and burning leather
      wafting in the smokey air around it.
  - keywords: [pieces, broken, armor, decoration, walls]
    text: >
      Glittering pieces of broken and bent metal embed the walls like jewels, no doubt serving the
      secondary purpose of displaying the vanquishing of foes.
  - keywords: [swords, crude, jewelled, throne]
    text: >
      These rather beautiful swords have been carelessly bent and fastened together to form a slightly
      unusual but attractive throne, colored gems sparkling in the hilts and firelight reflecting off the
      still shiny metal.

"tba:19:room:1934":
  name: Mirey Path
  description: >
    Water flows slowly down this submerged path, agitating particles of dirt and sand so that
    everything beneath the surface is cloudy.  Only the feel of laid stone and grit indicates the path that lies
    here, a slight mist hovering over the surface of the muggy water.
  sector: field
  exits:
    north:
      to: tba:19:room:1936
      look: A small enclosure can be seen to the north, tiny wisps of smoke escaping into the air.
    east:
      to: tba:19:room:1935
      look: >
        A little greenish cave opens to the east, the forlorn sound of dripping water coming from within.
    south:
      to: tba:19:room:1928
      look: >
        The land slants gradually down, water trickling amongst cloudy particles of grit and swirling
        masses of plant life.

"tba:19:room:1935":
  name: Dripping Cave
  description: >
    Dank and cold, the sound of continuous dripping makes this place seem even more miserable.  Thin
    layers of green slime coat the walls, and a few organic encrustations higher up show that at one time
    water flooded this cave.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:19:room:1934
      look: >
        Slight wisps of mist swirl just inside from the gaping entrance to the west, the sound of lazily
        trickling water coming from outside.

"tba:19:room:1936":
  name: Cluttered Campsite
  description: >
    A rudimentary shelter has been constructed here, various stiff reeds roped together, grasses
    thatched together to make a somewhat waterproof ceiling. Wisps of smoke and glowing embers cling to life as
    the recently used campfire slowly dies away.  Various cooking utensils and simple clay pots lie
    soiled and strewn about.
  sector: field
  exits:
    south:
      to: tba:19:room:1934
      look: >
        Muddy, grimey water swirls lazily away, stirring up the gravelly ground as it trickles noisily.
    west:
      to: tba:19:room:1937
      look: >
        Taller grasses sway gently in the air, a faint sound of droplets echoing can be heard, as though
        some hidden cave lies beneath.
  extras:
  - keywords: [rudimentary, shelter, stiff, reeds]
    text: >
      This primitive enclosure is of only basic use in shielding rainfall and heavy winds.  Open on one
      side, it seems for the most part abandoned, as though the creatures who made it only gather here for
      certain occasions.
  - keywords: [cooking, utensils, simple, clay, pots]
    text: >
      These recently used tools have been dumped on the ground with pieces of flesh still clinging to
      them, the smell of rotting is almost unbearable and flies buzz almost frantically around the filthy
      surfaces.

"tba:19:room:1937":
  name: Grassy Hole
  description: >
    Tall grasses wave slowly in the air, drops of moisture trickling down their lengths and echoing
    slightly as they hit rock surface below.  A deep black hole gapes widely in the ground, concealed
    perfectly until almost falling into it.
  sector: field
  exits:
    north:
      to: tba:19:room:1943
      look: >
        Copious amounts of smoke fill the air thickly, staining the ground and plant life darkly black and
        blocking any further view.
    east:
      to: tba:19:room:1936
      look: >
        The smell of smoke wafts on the eastern breeze, smoke rising visibly into the air and the roped
        walls of some structure only just visible through the grasses.
    down:
      to: tba:19:room:1938
      look: >
        Nothing can be seen within the dark recesses of this hole, just a chill feeling as though something
        unnatural lingers, and the sound of droplets hitting stone.

"tba:19:room:1938":
  name: Rainy Chasm
  description: >
    Hardly any natural light penetrates this darkness, just the continuous sound of dripping and
    trickling water all around.  The stoney chill of the surrounding rock seems to pierce through everything,
    feeling almost supernatural in its strength.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:19:room:1939
      look: >
        Bright light shines from the larger cavern to the north, sending flickering shadows all around and
        the choking smell of smoke.
    up:
      to: tba:19:room:1937
      look: >
        Shafts of natural light trickle down from amidst waving grasses, little drops of water drip down,
        collecting in rivulets along the ceiling.

"tba:19:room:1939":
  name: Firelit Cavern
  description: >
    A great fire burns steadily here, smoke billowing around the ceiling and escaping through a small
    hole.  Dancing light casts flickering shadows all about the room, piles of dried bracken and wood
    nearby to keep the fire fueled.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:19:room:1940
      look: >
        A smallish, moss-covered cavern yawns widely to the north, the wafting smoke making it difficult to
        see much else.
    east:
      to: tba:19:room:1941
      look: >
        A slight scratching sound can be heard coming from the cavern to the east, and a makeshift gate of
        reeds has been fastened across its entrance.
    south:
      to: tba:19:room:1938
      look: >
        A faint natural glow comes from this part of the cavern, trickling water echoing loudly as it drips
        onto the stone.
    west:
      to: tba:19:room:1942
      look: >
        A rather sickening smell of raw and cooking meat wafts on the western air, scattered leaves
        covering the contents of the cave beyond.

"tba:19:room:1940":
  name: Nesting Grounds
  description: >
    Cozy piles of green mosses and dried grass form a thick layer of bedding on the floor here.  Gentle
    heat wafts from the room to the south, filling the place with shimmering warm air.  Several large
    eggs lie nestled here and there, partially covered with the grasses.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:19:room:1939
      look: >
        Bright flickering fire sends shadows dancing all around, a curtain of smoke veiling anything that
        lies beyond.

"tba:19:room:1941":
  name: Hatchery
  description: >
    Thin reeds have been tied across the exit to the west, acting as a miniature gate to prevent the
    young ones from wandering out.  Little bits of meat are left rotting about the floor, and bits of
    broken egg-shell are scattered about, the few intact eggs rocking gently as though about to hatch.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:19:room:1939
      look: >
        Bright flickering fire sends shadows dancing all around, a curtain of smoke ve iling anything that
        lies beyond.

"tba:19:room:1942":
  name: Stone Larder
  description: >
    Cool stone shelves support large slabs of raw flesh while smoke wafts lazily in from the east,
    slowly cooking smaller pieces that hang from hooks in the ceiling.  In the corner, large leaves cover
    what appears to be the half butchered corpse of some unidentifiable animal.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:19:room:1939
      look: >
        Bright flickering fire sends shadows dancing all around, a curtain of smoke ve iling anything that
        lies beyond.

"tba:19:room:1943":
  name: Smokey Path
  description: >
    Creeping plants and mosses cover the slimey broken slate that makes up this abandoned path.  From a
    large crack in the ground, dark smoke billows slowly up into the sky, shrouding the place in
    darkness and creating the claustrophobic feeling of being unable to breathe.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:19:room:1945
      look: >
        The water runs deeper to the north, shimmering fog wafting restlessly and clouding any further view.
    east:
      to: tba:19:room:1944
      look: >
        A well-travelled way lies to the east, stalks of reeds having obviously been brushed aside.
    south:
      to: tba:19:room:1937
      look: >
        Tall grasses swish in the heavy air, the sound of trickling water echoing strangely from some area
        of the ground.
    west:
      to: tba:19:room:1950
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1944":
  name: Wetlands
  description: >
    Tall reeds poke slightly above the surface of this murmuring pool, soft mud giving easily beneath
    and sending clouds of darkness up into the water.  Broken stalks litter the bottom, and deep
    footprints can be seen imprinted in the watery ground, indicating that this way is well travelled.
  sector: field
  exits:
    north:
      to: tba:19:room:1946
      look: >
        Deep waters and eerie blue mists swirl silently around, both almost purposely hiding the way from
        view.
    east:
      to: tba:19:room:1965
      look: >
        A muddy path of slate stretches to the east, reeds and other plantlife rustling with the movements
        of small animals.
    west:
      to: tba:19:room:1943
      look: >
        The way west is shrouded from view by a black cloud of hot billowing smoke, the air almost
        stiflingly warm.

"tba:19:room:1945":
  name: Eerie Wetlands
  description: >
    Strange mist hovers just above the surface of the high murky waters here, clouding everything so
    that only ghosts and shadows can be seen moving about in the periphery of vision.  The air is hot and
    stifling, but the cloudy moisture leaves a bone-chilling cold on every surface.
  sector: field
  exits:
    north:
      to: tba:19:room:1976
      look: >
        Some sort of entrance can be seen through the brush, a black stair descending into darkness.
    east:
      to: tba:19:room:1946
      look: >
        Swirling blue mist, and a chill moisture drift about the air, algae-infested waters stirring
        silently.
    south:
      to: tba:19:room:1943
      look: A wave of heat shimmers from the south, dark smoke wafting its way up into the muggy air.
    west:
      to: tba:19:room:1949
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1946":
  name: Eerie Wetlands
  description: >
    A deadly silence seems to settle here, even the sounds of cricket chirpings die away as the bluish
    haze around this place swirls ever thicker.  The water slides easily, thick algae blocking any view
    as to what lies beneath.
  sector: field
  exits:
    south:
      to: tba:19:room:1944
      look: >
        A well travelled way lies to the south, broken reeds and muddy footprints left as recent evidence.
    west:
      to: tba:19:room:1945
      look: >
        Stifling air wafts from the east, the chill of swamp moisture clinging to everything it touches.
    down:
      to: tba:19:room:1947
      look: >
        The way down is impossibly black, deep cold water offering no hint of what lies beneath the
        stirring surface.

"tba:19:room:1947":
  name: Absolute Darkness
  description: >
    The water is much colder at this depth, every movement sending mud and plant life swirling about. 
    The blackness seems all-encompassing, nothing visible in any direction, just the slimey touch of
    unseen creatures brushing past.
  sector: underwater
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:19:room:1946
      look: >
        Faint shafts of natural light penetrate the darkness, the stalks of gently swaying reeds only just
        visible through the murkiness.

"tba:19:room:1948":
  name: "[Private Set Aside Room for Trigger]"
  description: >
    Set aside for the sheer purpose of having the leviathan load here and teleporting it to room 1911
    as part of the trigger.  ;) And then I added some more words at the end of this descrip because the
    error in zcheck was bugging me :P
  sector: inside
  flags: [indoors, peaceful, no_magic]

"tba:19:room:1949":
  name: Endless Marshlands
  description: >
    The swamp seems to stretch almost endlessly to the west, far off shapes and shadows potentially
    only the product of imagination.  Almost untouched, the quiet water and still reeds can be seen for
    miles.
  sector: field
  exits:
    east:
      to: tba:19:room:1945
      look: >
        Chilly air breezes from the west, damp and clinging miserably to everything like a cold sweat.
    south:
      to: tba:19:room:1950
      look: >
        A vast and confusing landscape stretches to the south, heavy fog making it difficult to see any
        straight path through.
    west:
      to: tba:19:room:1952
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1950":
  name: Endless Marshlands
  description: >
    Far off into the distant west, the same landscape can be seen that is visible here.  Desperate
    creeping plant life, hovering insects and scummy algae-infested water appears to be all there is.
  sector: field
  exits:
    north:
      to: tba:19:room:1949
      look: >
        A vast and confusing landscape stretches to the north, heavy fog making it difficult to see any
        straight path through.
    east:
      to: tba:19:room:1943
      look: >
        Dark smoke snakes its way through the air, staining everything around it black, nearby grasses
        withering with the heat.
    west:
      to: tba:19:room:1953
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1951":
  name: Crumbling Oak
  description: >
    This ancient oak tree has long since decayed into little more than a shell. Sharp spokes of wood
    stick up like a thorny crown where the higher parts of the tree have snapped away, presumably buried
    deep within the surrounding mud.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    west:
      to: tba:19:room:1921
      look: >
        Tall, thin trees weave hypnotically in the wind, the croaks and chirps of various wildlife filling
        the air.

"tba:19:room:1952":
  name: Endless Marshlands
  description: >
    Deep muddy water sloshes about with every disturbance, bending reeds swish wearily back and forth,
    and almost eternally around in the swirling mists everything seems to look exactly the same.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:19:room:1953
      look: >
        A vast and confusing landscape stretches to the east, heavy fog making it difficult to see any
        straight path through.
    south:
      to: tba:19:room:1952
      look: >
        A vast and confusing landscape stretches to the south, heavy fog making it difficult to see any
        straight path through.
    west:
      to: tba:19:room:1953
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1953":
  name: Endless Marshlands
  description: >
    Deep muddy water sloshes about with every disturbance, bending reeds swish wearily back and forth,
    and almost eternally around in the swirling mists everything seems to look exactly the same.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:19:room:1950
      look: >
        A vast and confusing landscape stretches to the north, heavy fog making it difficult to see any
        straight path through.
    east:
      to: tba:19:room:1953
      look: >
        A vast and confusing landscape stretches to the east, heavy fog making it difficult to see any
        straight path through.
    west:
      to: tba:19:room:1952
      look: >
        A vast and confusing landscape stretches far to the west, heavy fog making it difficult to see any
        straight path through.

"tba:19:room:1954":
  name: Air-Filled Cavern
  description: >
    A large bubble of air is trapped within this cave, creating the illusion that this place is above
    ground, although swirling mud and grasses can be seen dancing in the water just around the opening.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:19:room:1926
      look: >
        Dark swirling waters block most of the upper cavern from sight, minimal light penetrates the
        surface, bits of floating debris making it hard to see what lies beyond.

"tba:19:room:1955":
  name: Opening in a Circle of Trees
  description: >
    All around, the ancient and brittle bark of dying trees fills all view, the odd green shoot of a
    struggling youngster coloring the gloominess, and the scent of new plant life freshening the air, even
    as fungi consume the rotting elders.
  sector: forest
  exits:
    east:
      to: tba:19:room:1957
      look: >
        Swaying branches trail leisurely over the murky waters, the sounds of rustling and crow's
        screeching carrying on the air.
    south:
      to: tba:19:room:1921
      look: >
        The trees grow thinner to the south, a large tree stump can be seen vaguely off to the southeast,
        and even further south a large rock breaks the horizon.
    west:
      to: tba:19:room:1956
      look: >
        Gnarled black tree branches stick rigidly out into the air like the upturned spears of some dark
        army.

"tba:19:room:1956":
  name: Circle of Trees
  description: >
    Tall dark trunks emerge from the sloshing mud, fragile and crooked with age, slimy swamp algae
    covering them with slick green ooze.  Spindly desperate branches grasp blindly at the air like the
    skeletal fingers of some long buried giant.
  sector: forest
  exits:
    north:
      to: tba:19:room:1962
      look: >
        Thick, brittle treetrunks continue on and around to the north, the sounds of wildlife crunching
        through the leaves.
    east:
      to: tba:19:room:1955
      look: >
        The trees seem to grow more sparse, what looks like a clearing veers off to the southeast.

"tba:19:room:1957":
  name: Circle of Trees
  description: >
    The fluttering of wings disturbs the still air every now and again and the mournful screeching of
    crows can be heard from the swaying branches above. Most of the trees here are dead, only one or two
    trailing green leaves into the watery surroundings.
  sector: forest
  exits:
    north:
      to: tba:19:room:1958
      look: >
        A vast array of dried branches forms a canopy overhead, a mighty tree standing proudly to the
        north, even as it decays.
    west:
      to: tba:19:room:1955
      look: It becomes more visible to the west, trees giving way to what looks like a clearing.

"tba:19:room:1958":
  name: Circle of Trees
  description: >
    The great shell of a long dead cypress tree stands here, mighty branches creating a skeletal
    leaf-less canopy.  The persistant creep of swamp vines and moss coats nearly the entire trunk, as though
    the bog were trying to reclaim it.
  sector: forest
  exits:
    north:
      to: tba:19:room:1959
      look: >
        Tangled tree roots stretch out to the north, creeping through the treacherous mud as though
        grasping for safety.
    south:
      to: tba:19:room:1957
      look: >
        The sound of snapping twigs and squawking birds comes from the south, the continuing treeline
        rustling with unseen movement.

"tba:19:room:1959":
  name: Circle of Trees
  description: >
    The mud here is dangerously sticky, only the buried weaving roots of the surrounding trees acting
    as footholds.  It seems as though the brittle wood moans gently, complaining at the cruelty of the
    wind, restless breezes scurrying here and there as though being chased.
  sector: forest
  exits:
    south:
      to: tba:19:room:1958
      look: >
        A line of trees continues around, curving as if to form a large circle that shrouds the outside
        from view.
    west:
      to: tba:19:room:1960
      look: A trickle of water runs bubbling and churning over a submerged trail.

"tba:19:room:1960":
  name: Drowned Path
  description: >
    Clear water runs here as several surrounding streams trickle into this large pool.  Dirt and grit
    settle slowly at the bottom, covering partially what appear to be the carefully set slate tiles of an
    ancient road running north and south.
  sector: field
  exits:
    north:
      to: tba:19:room:1966
      look: A small junction lies ahead, this path meeting with a larger west-to-east trail.
    east:
      to: tba:19:room:1959
      look: >
        Trees grow thickly around, spreading in a carefully sculpted line to the east that curves its way
        around in a circular shape.
    south:
      to: tba:19:room:1963
      look: >
        A massive statue can be seen rising from the ground, a small clearing flanked on all sides by the
        watchful presence of trees.
    west:
      to: tba:19:room:1961
      look: >
        Trees grow thickly around, spreading in a carefully sculpted line to the west that curves its way
        around in a circular shape.

"tba:19:room:1961":
  name: Circle of Trees
  description: >
    Pale green saplings sway gently in the breeze, struggling for life though they seem to be
    well-tended.  Leaning in on each other, their green waving branches seem to rustle uncomfortably, whispering
    quietly with each other.
  sector: forest
  exits:
    north:
      to: tba:19:room:1964
      look: A greenish film of water and slime coats a long-neglected path to the north.
    east:
      to: tba:19:room:1960
      look: >
        The water grows higher as the land seems to sink, thick bubbling mud and shallow streams coating
        the way eastward.
    south:
      to: tba:19:room:1962
      look: >
        Red leaves and dark trunks shift uneasily in the wind, a gathering of trees spreading toward the
        south.

"tba:19:room:1962":
  name: Circle of Trees
  description: >
    A patch of red flashes in and out of vision through the thick dark cluster of trunks.  The
    beautiful crimson leaves of a black gum tree seem almost to light the area as a burning fire illuminates
    night.
  sector: forest
  exits:
    north:
      to: tba:19:room:1961
      look: >
        Younger saplings grow to the north, slender green branches and fresh budding leaves adding a sense
        of freshness to the atmosphere.
    south:
      to: tba:19:room:1956
      look: >
        Older trees grow crookedly to the south, gnarled trunks and grasping fingers clawing their way
        through the misty air.

"tba:19:room:1963":
  name: Place of Worship
  description: >
    A small trail of crushed bones mingles with the broken twigs and branches carpeting the floor.  A
    massive stone altar stands within a small clearing here, enclosed within the trunks of the surrounding
    trees.  A smoking fire lingers here, some burned carcass giving off the smell of cooked flesh. 
    Before the altar, a large metal grid is embedded into the ground.
  sector: forest
  exits:
    north:
      to: tba:19:room:1960
      look: >
        A small water-logged path leads northward, flanked on either side by closely hovering trees.
    down:
      to: tba:19:room:1971
      look: >
        A small stone room has been dug deep into the ground, a cold damp chill emanating from within.

"tba:19:room:1964":
  name: Drizzling Path
  description: >
    Rivulets of muddy water trickle lazily across the broken pieces of stone that make up this old
    path, creeping algae and swamp slime give it a carpeted look, tinting both the stone and the water
    slightly green.
  sector: field
  exits:
    east:
      to: tba:19:room:1966
    south:
      to: tba:19:room:1961
    west:
      to: tba:19:room:1965

"tba:19:room:1965":
  name: Pool of Mud
  description: >
    The gray surface of slate paving stones can barely be seen beneath the surface of these dark
    waters.  Small fish dart nervously about, hiding instantly at the sight of any shadow, and bulrushes sway
    gently, spreading ripples throughout the pool.
  sector: water_swim
  flags: [no_mob]
  exits:
    east:
      to: tba:19:room:1964
    west:
      to: tba:19:room:1944

"tba:19:room:1966":
  name: Bend in an Ancient Path
  description: >
    Water sloshes noisily down this path which slopes downward to the west, coated slightly with the
    glassy sheen of an inch or two of clear running water, the carefully laid mosaic stones and colored
    glass can clearly be seen.
  sector: field
  exits:
    north:
      to: tba:19:room:1970
    east:
      to: tba:19:room:1967
    south:
      to: tba:19:room:1960
    west:
      to: tba:19:room:1964

"tba:19:room:1967":
  name: Place of Meeting
  description: >
    A small campfire flickers lazily in this paved circular area.  Several smooth rocks are placed
    strategically all around the center as if making up some sort of seating.  Beside the fire, a crude
    wooden platform has been erected.
  sector: field
  exits:
    north:
      to: tba:19:room:1969
    east:
      to: tba:19:room:1972
    west:
      to: tba:19:room:1966

"tba:19:room:1968":
  name: "[Inside the Cocoon (for Trigger)]"
  description: >
    This room is for people to be teleported to when they are trapped inside a spider's cocoon (or a
    good time-out room).  Only the commands who and gossip should work in this room for any players under
    level 33.  Oh the command wriggle also works, but only to make the object cocoon visibly wriggle to
    anyone in room 1993.
  sector: inside
  flags: [indoors, no_magic]

"tba:19:room:1969":
  name: Wooden Shelter
  description: >
    Several dead branches have been roped together with vines to make this small shelter.  Several
    reeds and grasses have been used to patch up the gaps, and the whole structure has been coated with a
    layer of mud.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:19:room:1967

"tba:19:room:1970":
  name: A Cozy Hut
  description: >
    Some sort of underground heat seems to warm this little hut, the cracked stone floor feeling
    slightly warm to the touch.  Bundles of hollow reeds have been used to create small tables, upon which
    dried grasses and leaves are heaped like bedding.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:19:room:1966

"tba:19:room:1971":
  name: A Dank Prison
  description: >
    The walls drip mournfully with muddy water that trickles slowly from the ceiling grid.  A large
    sacrificial slab stands in the center of the room, covered with gruesome stains.  Various metal
    instruments hang from the walls, along with the well-used chains of past unfortunate prisoners here.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:19:room:1963

"tba:19:room:1972":
  name: A Large Hut
  description: >
    A huge straw mat covers the ground here, decorated with various tribal paints to display images of
    royalty and wealth.  Gold and silver glint here and there like stars in the dark clay walls, and a
    large cushioned chair sits against the eastern wall.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:19:room:1967
    down:
      to: tba:19:room:1973

"tba:19:room:1973":
  name: Trophy Room
  description: >
    Flickering fire illuminates the room from a high wooden shelf.  Dancing shadows creep along the
    lower shelves which hold a variety of humanoid and animal skulls.  Small piles of teeth and claws
    sprinkle the perimeter of the floor, and it can only be assumed that these trophies are all that remain of
    past enemies.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:19:room:1974
    up:
      to: tba:19:room:1972

"tba:19:room:1974":
  name: Jumbled Armory
  description: >
    A rough walkway has been cleared through the piles of dented and rusting armor that lie here. 
    Miscellaneous scavenged shields and pieces of equipment lie scattered around in varying states of decay
    or repair.  A few finer pieces hang along the wall, ready for use.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:19:room:1975
    west:
      to: tba:19:room:1973

"tba:19:room:1975":
  name: Treasure Storage
  description: >
    Glittering pieces of gold and jewellry line the whole interior of this room, embedded into the
    actual structure of the room and dangling as decorations from the wall.  Some useless trinkets and pieces
    of bent metal are also scattered around amongst the treasure, collected apparently only for their
    shiny surfaces.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:19:room:1974

"tba:19:room:1976":
  name: Palace Entrance
  description: >
    A grand obsidian stair slopes gradually down into darkness and the submerged palace of Lost
    Ajhuutal.  Creeping swamp plants and mosses glow slightly where they touch the black stone, almost pulsing
    as though they were the living veins of the structure itself.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:19:room:1945
    down:
      to: tba:19:room:1977

"tba:19:room:1977":
  name: Webbed Corridor
  description: >
    Fine silvery filaments of cobweb wave gently in the subtle musty breeze that stirs here.  Beads of
    moisture condense on the cool black stone of the walls, rivulets of water gathering and trickling
    like sweat in the suffocating humidity.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:19:room:1978
    west:
      to: tba:19:room:1992
    up:
      to: tba:19:room:1976

"tba:19:room:1978":
  name: Damaged Passageway
  description: >
    Great claw-like gashes mark the walls here, the aftermath of some great struggle.  Broken pieces of
    the floor lie gathering dust and large dark stains have corroded the passage as though splashed with
    acid or burnt by some powerful magic.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1979
    east:
      to: tba:19:room:1998
    west:
      to: tba:19:room:1977

"tba:19:room:1979":
  name: Blood-Spattered Corridor
  description: >
    Dark red splatters fleck the wall and floors here, filling the air with the metallic and
    unmistakeable stench of congealing blood.  New stains freshly cover the old, years of lost struggles painted
    about the room with all that remains of the unfortunate victims.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:19:room:1991
    south:
      to: tba:19:room:1978
    west:
      to: tba:19:room:1980

"tba:19:room:1980":
  name: Halls of the Aranea
  description: >
    A few ancient trinkets glitter here, actually embedded into the walls with crystallised webbing. 
    The decaying skull of a humanoid can also be spotted here and there through the drifting strands of
    cottony thread, apparently the trophy of a past conquest.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1982
    east:
      to: tba:19:room:1979
    west:
      to: tba:19:room:1981

"tba:19:room:1981":
  name: Halls of the Aranea
  description: >
    Dark and glistening with some sort of saliva-like ooze, hundreds of primitive carvings have been
    intricately woven into the cold, dripping stone walls, most depicting various battles including the
    capture of the mighty leviathan and the destruction of Fallorain's army.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:19:room:1980
    south:
      to: tba:19:room:1992
    west:
      to: tba:19:room:1994

"tba:19:room:1982":
  name: Zanassu's Altar
  description: >
    Cold and unwelcoming, it is impossible to tell if the crystal patterns around this room are frost
    or the intricate webbings of spiders.  A great stone altar stands here, steps making it possible to
    actually stand upon it.  To the north, a great black gate stands, barring the way further into the
    palace.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:19:room:1980

"tba:19:room:1983":
  name: Palace of Lost Ajhuutal
  description: >
    Dark menacing shadows jump erratically from the corners and flit swiftly along the walls as rows of
    torches light the room with flickering firelight, cold stone and slate paving the chilly corridor.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    east:
      to: tba:19:room:1984
    west:
      to: tba:19:room:1988

"tba:19:room:1984":
  name: Palace of Lost Ajhuutal
  description: >
    A cool and unnatural breeze wafts through this part of the hall, almost seeming to whisper words as
    it sighs along the jagged crooks and crevices in the cavernous wall, wisps of silk glistening as
    they stir.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    north:
      to: tba:19:room:1985
    east:
      to: tba:19:room:1990
    west:
      to: tba:19:room:1983

"tba:19:room:1985":
  name: Palace of Lost Ahjuutal
  description: >
    Damp and miserable, the black surroundings are nonetheless regal to behold, tall black columns
    supporting the increasingly high ceiling and every surface sparkling with tiny dark jewels as though
    starlit.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    east:
      to: tba:19:room:1989
    south:
      to: tba:19:room:1984
    west:
      to: tba:19:room:1986

"tba:19:room:1986":
  name: Palace of Lost Ahjuutal
  description: >
    Magnificent tapestries of pure silk line the walls here, simple portrayals of victorious battles
    and weaponry woven by some magic into the crimson and scarlet strands.  The taste for luxury is further
    evidenced here by the use of many hundred mandora spider furs to cover the substantial floor with
    lush velvety carpeting.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    north:
      to: tba:19:room:1997
    east:
      to: tba:19:room:1985
    west:
      to: tba:19:room:1987

"tba:19:room:1987":
  name: Palace of Lost Ahjuutal
  description: >
    The air is sticky and oppressive here although almost too cold to be so humid.  Slight viscuous
    moisture coats the floors and walls alike, making the naturally dark surroundings glimmer in places as
    though tiny eyes twinkled in and out of existance.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    east:
      to: tba:19:room:1986
    south:
      to: tba:19:room:1988
    west:
      to: tba:19:room:1996

"tba:19:room:1988":
  name: Palace of Lost Ahjuutal
  description: >
    Strange and intricate carvings of combat scenes as well as writings line the cavernous walls, both
    runes and some unfathomable language darken the place further with the lingering and heady presence
    of evil magic.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    north:
      to: tba:19:room:1987
    east:
      to: tba:19:room:1983
    west:
      to: tba:19:room:1995

"tba:19:room:1989":
  name: Weaponry of the Spider Demon
  description: >
    Glittering silvery metal runs in natural veins through the rock in this room, naturally
    complementing the selection of fine weaponry to be found within. Functional and ornamental swords alike hang
    proudly displayed upon the walls, with central glass cases containing elegant two-handed blades as well
    as jewelled maces.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    west:
      to: tba:19:room:1985

"tba:19:room:1990":
  name: Chamber of Strange Arts
  description: >
    Darkly polished shelves hold an assortment of strange bottles and jars, some of them shifting
    slightly now and again as though the contents moved.  A towering bookshelf on the western side of the room
    holds ancient looking scrolls and pieces of parchment as well as large bound books that lie almost
    unseen beneath layers of dust.  At the northern end, a large fire crackles quietly, giving off copious
    amounts of sickly smelling smoke.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    west:
      to: tba:19:room:1984

"tba:19:room:1991":
  name: Torture Chamber
  description: >
    A gleaming black table lies like a coffin on a stand in the center of the room, bloody bits of
    frayed rope left scattered across it.  Flickering light from a red hot fireplace casts the dingy room in
    shadows, intermittently illuminating a selection of terrifying metal instruments that decorate the
    stained walls.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:19:room:1979

"tba:19:room:1992":
  name: Sticky Passage
  description: >
    The walls glisten with crystallised strands of cobweb, slightly sticky slime glistening as it oozes
    down the walls, collecting in slippery puddles and droplets on the dark floor that sparkle almost
    like stars.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:19:room:1981
    east:
      to: tba:19:room:1977
    west:
      to: tba:19:room:1993

"tba:19:room:1993":
  name: Spider Lair
  description: >
    New and old cobwebs coat the walls, fluttering in layers like some kind of eerie wallpaper.  A
    slight rustling echoes all throughout this dreary cavern, and on closer inspection thousands of tiny
    spiders can be seen scuttling across the ceiling and drifting on webbed strands through the musty air.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:19:room:1992

"tba:19:room:1994":
  name: Food Storage
  description: >
    Shelves line the relatively clean walls here, holding a variety of rich food and drink.  Fermenting
    pails of wine stand covered in the corners and dried meats and herbs hang, slightly swaying from the
    ceiling.  The unmistakeable smell of aging cheese fills the air along with the pungently sweet scent
    of ripening fruits.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:19:room:1981

"tba:19:room:1995":
  name: Place of Plunder
  description: >
    Dancing light from several wall-hung torches keeps the whole room aglow as if with sunfire.  Gold
    and silver alike generously line the walls and floor as if some incredible heat simply melted the
    treasure into the structure all at once. Sparkling jewels and gems of many colors glitter from assorted
    piles like bundles of freshly picked flowers, left scattered around the many ornamental chests as
    though for casual decoration.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    east:
      to: tba:19:room:1988

"tba:19:room:1996":
  name: Regal Armory
  description: >
    The ghostly figures of several wooden mannikins stand eerily in this dimly-lit room, display stands
    for various sets and pieces of armor.  Coats of mail glisten beautifully from the shadowy corners,
    fine mesh and dark admantite alike being woven into regal pieces adorned with gems.  Elaborate helmets
    and visors stand encased within crystal columns, and glittering shields shine from the walls like
    moonlight.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    east:
      to: tba:19:room:1987

"tba:19:room:1997":
  name: Throne of the Champion of Lloth
  description: >
    An elaborate jewelled throne stands centrally at the northern end of the room, surrounded by the
    massive column-like legs of an upturned gargantuan spider crystallised into the floor.  Black, thorny
    spines protrude here and there from the jagged walls, twitching now and again as though some magic has
    rendered the structure alive.  Even the beautiful maroon carpet has been utterly spoiled, ugly
    patches of old and drying blood left almost proudly displayed, tainting the air with a sickly metallic
    scent.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:19:room:1986

"tba:19:room:1998":
  name: Cocooned Cell
  description: >
    Dank and cold, old rusted chains hang mostly unused from the walls.  Various nets and cruel-looking
    traps litter the area, and an unbearable smell of rotting food and waste fills the room. 
    Spider-spun cocoons lie freely about the floor or attached to the wall, some opened whereas others seem almost
    to writhe.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:19:room:1978

"tba:19:room:1999":
  name: Withered Grasses
  description: >
    The air here is smotheringly warm, humidity condensing in the air and drifting away to join the
    wandering mist that swirls forlornly about.  Tall withered grasses whisper amongst themselves as they
    bend, almost seeming to deliberately make way for passage.
  sector: field
  exits:
    north:
      to: tba:19:room:1901
