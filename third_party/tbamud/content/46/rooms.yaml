# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 46.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:46:room:4600":
  name: Inside A Giant Anthill
  description: >
    You have fallen into a large open area beneath the surface of the earth. Ants can be seen running
    in every direction.  They do not take the time to notice anything going on around them.  There are
    exits in just about every direction possible.  There is a distinct smell of fresh air here, maybe it's
    possible to get out.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4601
    east:
      to: tba:46:room:4602
    south:
      to: tba:46:room:4603
    west:
      to: tba:46:room:4604
    down:
      to: tba:46:room:4605
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Garrison
        Zone         : 46 Ant Hill
        Began        : 3/1/2000
        Player Level : 3-7
        Rooms        : 41
        Mobs         : 6
        Objects      : 16
        Shops        : 0
        Triggers     : 8
        Theme        : A giant anthill with BUGS, ewww gross.
        Plot         : A giant ant hill.
        Notes        : Plan on having a lot of mobs so the zone will be a slaughterhouse
                       for experience points.
        Links        : 00u, or better yet through teleport triggers 00, 01

"tba:46:room:4601":
  name: Inside The Anthill
  description: >
    This small room is packed with junk that the ants have pulled in that has no use.  There is a
    little bit of everything in this room.  And the ants just keep bringing more stuff in.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4639
    south:
      to: tba:46:room:4600

"tba:46:room:4602":
  name: A Small Room
  description: >
    Here is a small empty room that has nothing at all inside of it.  Except for the few ants that
    wander in.  Another passage can be seen to the east of here. The ants have dug through the dark brown
    soil recently.  The smell of the fresh earth is invigorating.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4634
    west:
      to: tba:46:room:4600

"tba:46:room:4603":
  name: A Hole In The Wall
  description: >
    Here is a small opening that looks as if the ants were going to make another passage but never
    completed it.  A ledge of rock in the southern wall explains why they stopped.  The ledge has a strange
    golden sparkle to it.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4600

"tba:46:room:4604":
  name: Another Room In The Anthole
  description: >
    Here is another basic room full of ants just standing around looking for something to do.  Small
    dugouts in the wall can be seen that looks like they have tried to make more passages but never
    completed them.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4600

"tba:46:room:4605":
  name: Farther Into The Hole
  description: >
    Now farther into the hole it seems to be a little cooler than it was.  More passages lead elsewhere
    in ever direction, and ants can be seen coming from each one.  Trails of food lead from each room to
    another where the ants have been carrying it.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4606
    east:
      to: tba:46:room:4609
    south:
      to: tba:46:room:4608
    west:
      to: tba:46:room:4607
    up:
      to: tba:46:room:4600
    down:
      to: tba:46:room:4610

"tba:46:room:4606":
  name: A Passage In The Hole
  description: >
    This is a fairly large room that seems to be used often for tired ants to set and rest awhile
    without being in the way of others.  The wall has little indents where the ants lean agaist it so they
    don't take up as much room on the ground.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:46:room:4605

"tba:46:room:4607":
  name: A Tunnel
  description: >
    Yet another room where the ants are seen coming and going as always.  Some are laying around and
    others look as if they are actually doing work.  The earthen tunnel lead both east and west.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4605
    west:
      to: tba:46:room:4635

"tba:46:room:4608":
  name: A Sandy Dead End
  description: >
    The tunnel walls consist of a light brown sand, making it impossible to continue excavation in this
    direction.  The ants seemed to have given up on this tunnel once they ran into the unsupportive soil.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4605

"tba:46:room:4609":
  name: A Collapsed Tunnel
  description: >
    The tunnel comes to an abrupt end to the east.  It appears that the eastern wall may have recently
    caved in, closing off what once used to be another tunnel.  Strange how the ants have not fixed it
    yet.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    west:
      to: tba:46:room:4605

"tba:46:room:4610":
  name: Deeper In The Anthole
  description: >
    Now deeper in the hole it is even colder and darker than when you were only one level up.  More and
    more ants can be seen running around back and forth doing there jobs.  Tunnels and passages can be
    seend in all the cardinal directions.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4613
    east:
      to: tba:46:room:4612
    south:
      to: tba:46:room:4614
    west:
      to: tba:46:room:4611
    up:
      to: tba:46:room:4605
    down:
      to: tba:46:room:4615

"tba:46:room:4611":
  name: A Small Passage
  description: >
    This small passage leads west into another part of the anthole.  Sounds can be heard coming from
    it.  It almost sounds as if the ants are fighting. Probably more of the fire ants have invaded the
    tunnel.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4610
    west:
      to: tba:46:room:4616

"tba:46:room:4612":
  name: A Caved in Tunnel
  description: >
    The tunnel has collapsed here, leaving a sloping pile of dirt that rises to the ceiling of the
    tunnel.  In the rubble you notice a large red soldier ant crushed from the collapse.  Maybe these
    collapses were planned.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    west:
      to: tba:46:room:4610

"tba:46:room:4613":
  name: A Storage Room
  description: >
    This large empty room looks like it is used for storage.  Shelf-like burrows are carved into the
    dirt walls.  Perhaps to place crumbs and other food particals that they picked up and brought in.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:46:room:4610

"tba:46:room:4614":
  name: A Caved-in Tunnel
  description: >
    A collapse of the tunnel has buried even more red fire ants.  The green ants that run the anthill
    must have caused these collapses to prevent the fire ants from taking over their hill.  The two
    species of ants must have put up home too close to each other.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4610

"tba:46:room:4615":
  name: At The Bottom
  description: >
    You have now reached the bottom of the anthole.  The fall was so far that there is no way you could
    get back up to the other levels of the hole.  Larger worker ants and guards can be seen roaming in
    and out of the passages.  The queen has to be somewhere around here.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4618
    south:
      to: tba:46:room:4620
    west:
      to: tba:46:room:4619

"tba:46:room:4616":
  name: A Rocky Tunnel
  description: >
    This section of the tunnel is heavily guarded by soldier ants, something valuable must be contained
    at its end.  The tunnel here is bordered by rock and ledge, making more digging almost impossible.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4611
    south:
      to: tba:46:room:4617

"tba:46:room:4617":
  name: The Larvae Storage Room
  description: >
    Eggs and larvae fill this entire room.  The green queen and green dominant male must have been busy
    here.  Severl soldier ants are close by to protect the newborn.  The tunnel exits to the north.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4616

"tba:46:room:4618":
  name: A Large Hallway
  description: >
    The short hallway leads to a large open room.  Worker ants rush back and forth bringing food and
    other supplies deep into the anthill for safety.  This rooms sole purpose seems to be for storage and
    the worker ants to live.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    west:
      to: tba:46:room:4615

"tba:46:room:4619":
  name: A Large Tunnel
  description: >
    The tunnel has been dug out wider than usual.  The sounds of digging can be heard in almost every
    direction.  The tunnel floor is packed hard from the heavy traffic.  The tunnel continues east and
    west.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4615
    west:
      to: tba:46:room:4629

"tba:46:room:4620":
  name: A Dark Tunnel
  description: >
    The thick black soil causes this tunnel to look darker than normal.  The interconnecting tunnels
    make it hard to stay orientated in which direction you are travelling.  East and west you see even more
    tunnels with side passages.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:46:room:4615
    east:
      to: tba:46:room:4621
    west:
      to: tba:46:room:4629

"tba:46:room:4621":
  name: A Dark Intersection
  description: >
    The dark earth here has been dug out by the workers and now forms a precise junction in all four
    cardinal directions.  It is amazing how a bug with a tiny brain can build things so perfectly.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4622
    east:
      to: tba:46:room:4625
    south:
      to: tba:46:room:4626
    west:
      to: tba:46:room:4620

"tba:46:room:4622":
  name: Another Branch
  description: >
    The tunnel becomes increasingly more damp the further to the north.  The sound of running water can
    be heard.  The walls here appear to have been washed out, not dug out by ants.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4623
    south:
      to: tba:46:room:4621

"tba:46:room:4623":
  name: Along The Passage
  description: >
    Small puddles form along the floor, and water drips from the ceiling.  The thought of being under a
    lake or other large body of water is rather disturbing.  To the north you see a reflection off from
    something.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4624
    south:
      to: tba:46:room:4622

"tba:46:room:4624":
  name: An Underground Pond
  description: >
    A small pond fills the entire room here, several ant corpses can be seen floating in the dirty
    water.  A small river flows in from the west, into the room, and then exits to the east.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:46:room:4623

"tba:46:room:4625":
  name: A Dark Passage
  description: >
    The air is thin this far down in the tunnel and getting thinner the further you travel.  This
    hallway appears to end just to the east in a large room.  An intersection of tunnels is just to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:46:room:4627
    west:
      to: tba:46:room:4621

"tba:46:room:4626":
  name: A Collapsing Tunnel
  description: >
    The earthen floor gives slightly as you tread upon it.  The ceiling above you crumbles slightly and
    hangs over you, ready to drop at any minute.  The tunnel turns to the west where it looks like the
    slightest pressure on the floor could cause a collapse.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4621
    west:
      to: tba:46:room:4628

"tba:46:room:4627":
  name: The End Of The Tunnel
  description: >
    You are at the east end of a tunnel inside the giant anthill.  You can faintly hear the sound of
    ants working somewhere deeper inside.  Looking closer at the base of the tunnel you get the impression
    that this tunnel is used quite frequently.  You feel a draft coming from a small hole in the ceiling,
    bringing with it the distinct smell of fresh air, maybe there is a way out.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:46:room:4625

"tba:46:room:4628":
  name: Buried Alive
  description: >
    The dirt and earth sucks you in like quicksand.  A nice little trap for the unwary and stupid. 
    Trying to climb out only buries you further.  Now is a good time to either have a friend with summons or
    a scroll of recall.
  sector: inside
  flags: [dark, no_mob, indoors]

"tba:46:room:4629":
  name: Into the Large Tunnel
  description: >
    As you walk down the tunnel more passages and tunnels can be seen.  The sounds that could be heard
    before are even louder now but still sound as if they are still far away.  The large tunnel seems to
    make a turn to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:46:room:4619
    south:
      to: tba:46:room:4630

"tba:46:room:4630":
  name: A Long Tunnel
  description: >
    The sounds and bustle of the main parts of the anthill seem to quiet down in this area.  The ants
    here do not seem to be rushing as much.  The tunnel continues north and south.  It is too dark and too
    long of a distance to see where they lead.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4629
    south:
      to: tba:46:room:4631

"tba:46:room:4631":
  name: A Long Tunnel
  description: >
    This part of the tunnel is completely empty, not a single bug in sight. The walls and ceiling
    appear to be in good shape and this part of the tunnel looks very strong and secure.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:46:room:4630
    south:
      to: tba:46:room:4632

"tba:46:room:4632":
  name: A Small Room
  description: >
    The long tunnel to the north opens up into a small room.  A few large ants go about their business
    and ignore you.  A lot of commotion to the east attracts your attention.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4631
    east:
      to: tba:46:room:4633
      look: A large clay door.
      door:
        keywords: [door]
        kind: door

"tba:46:room:4633":
  name: The Queen's Chamber
  description: >
    You have entered the Queen's chamber.  The Queen is in charge of the anthill and is always heavily
    guarded.  The room you stand in is the largest you've seen.  The walls are made of a hard red clay,
    and are lined with stones to prevent intrusion.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:46:room:4632
      look: A large clay door.
      door:
        keywords: [door]
        kind: door

"tba:46:room:4634":
  name: A Small Room
  description: >
    This is just another small room that has been dug out by the ants.  They seem to be expanding their
    tunnels for some reason.  A small tunnel leads back to the west.  The northern wall of this room is
    extremely moist and small puddles of water are forming in the corners.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    west:
      to: tba:46:room:4602

"tba:46:room:4635":
  name: An Earthen Tunnel
  description: >
    The ground through which this tunnel was dug has been packed into what looks like a typical dirt
    road.  The constant travelling of the ants has padded it down smoothly.  A few light brown rocks just
    out of the floor, ceiling, and walls.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4607
    west:
      to: tba:46:room:4636

"tba:46:room:4636":
  name: A Small Passage
  description: >
    Continuing along the passage you can see that it makes a sharp bend ahead. So you can either go
    back to the east or go on west and see where that bend in the tunnel leads.  The ants seem oblivious to
    your intrustion so far.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4635
    west:
      to: tba:46:room:4637

"tba:46:room:4637":
  name: A Bend In The Tunnel
  description: >
    The tunnel curves sharply to the south as it comes against a rocky ledge. To the south you can make
    out a large room that is in the process of being dug out.  Ants can bee seen pushing and pulling the
    dirt away.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:46:room:4636
    south:
      to: tba:46:room:4638

"tba:46:room:4638":
  name: A Dead End Tunnel
  description: >
    The large are before you must be the latest expansion to the anthill. Unfortunately it is
    unfinished and leaves you with no choice other than to head back the way you came.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:46:room:4637

"tba:46:room:4639":
  name: A Small Crevice
  description: >
    You have just walked into a small room that seems to be nothing special except that it is slightly
    cleaner than the rest.  Maybe it is special.  Who knows?  A few odd objects are scattered around the
    room.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:46:room:4601

"tba:46:room:4698":
  name: Before A Giant Anthill
  description: >
    You have came upon what has to be the largest anthill ever.  It stands atleast 20feet high and
    about 50feet wide.  It is evident that ants have been entering and leaving this hill for quite some
    time.  The hole is large enough for the heaviest armor adventurer.
  sector: inside
  flags: [private]
