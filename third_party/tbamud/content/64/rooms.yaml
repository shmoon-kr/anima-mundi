      to: tba:64:room:6430
    up:
      to: tba:64:room:6425
    down:
      to: tba:64:room:6431

"tba:64:room:6430":
  name: A Mage's Office
  description: >
    A small desk here is cluttered with magically preserved papers and documents.  None seem of value,
    except perhaps to a historian.  This place seems vaguely uninteresting...
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6429
  extras:
  - keywords: [paper, papers, documents, document]
    text: >
      Well, one of the papers relate a story about how the mage of this tower, Rand, angered many kings,
      and relates how they set his armies on him.  You wonder if the lava outside was a failed attempt to
      destroy the armies...
  - keywords: [desk]
    text: It is cluttered with all sorts of papers.  Some look half interesting, actually.

"tba:64:room:6431":
  name: The Stairwell
  description: The stairwell continues up and down here, and there is a room to the west...
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:64:room:6432
    up:
      to: tba:64:room:6429
    down:
      to: tba:64:room:6433

"tba:64:room:6432":
  name: A Sitting Room
  description:
  - >
    This is a simply furnished room, with chairs all about. A fireplace is inset into an inner wall,
    the chimney undoubtedly directed by magic...
  - This would be a nice place to rest a while...
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:64:room:6431

"tba:64:room:6433":
  name: The Stairwell
  description: This is where the stairwell finally ends.  There is a hall to your west.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:64:room:6434
    up:
      to: tba:64:room:6431

"tba:64:room:6434":
  name: A Hallway
  description: >
    This small hallway on the former 'ground floor' ran north- south.  To the east is the stairwell
    that leads up into the shadowy recesses of the tower.  To the west is the entrance way to the tower. 
    The north is completely blocked off by lava, and the way south is still clear.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6433
    south:
      to: tba:64:room:6437
    west:
      to: tba:64:room:6435

"tba:64:room:6435":
  name: The Entranceway
  description: >
    This is a grand chamber with giant double-doors to the west.  To the east is the main floor of the
    tower.  This room is arranged highly attractively and very impressively, with sculptures and
    tapistries everywhere.  The doors seem impenetrable... you don't think you'd be able to get through them if
    you really had to...
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6434
    west:
      to: tba:64:room:6436
      look: These doors seem incredible.  Unfortunately, they're locked.
      door:
        keywords: [door, double]
        kind: door
        reset: locked
  extras:
  - keywords: [sculpture, tapestry, sculptures, tapestries]
    text: They look nice, but aren't very valuable.

"tba:64:room:6436":
  name: The Doorway
  description:
  - "This was the entrance to the tower.  Now lava has blocked it up completely.  However:"
  - >
    It seems when the lava came down a man was outside the doors.  He was blasted into the doors, and
    died instantly, but his skeleton still clutches a staff in perfect condition...
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6435
      look: These double doors have the outline of a man blasted into them...
      door:
        keywords: [double, doors]
        kind: door
        reset: locked

"tba:64:room:6437":
  name: The Hallway
  description: >
    This is the southern part of the hallway.  There is a door to the west, barred with gleaming bands
    of lights. To the north is more hallway.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6434
    west:
      to: tba:64:room:6438
      door:
        keywords: [door]
        kind: door
        reset: closed

