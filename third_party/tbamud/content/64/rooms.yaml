"tba:64:room:6423":
  name: The Dining Hall
  description: >
    This is a large dining hall, with a long table that runs down the length of it.  Chairs are set up
    along the sides to accomodate approximately 10 people.  There are paintings and tapestries on the
    walls, adding color to the stonework, The cooled lava that had poured in the windows makes the place
    seem eerie somehow .  There is a door to the north, and the stairwell is to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6424
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:64:room:6422
  extras:
  - keywords: [tapestry, tapestries, painting, paintings]
    text: >
      Many of these show scenes of high magic and heroism.  Just like almost every tapestry and painting
      you've seen.

"tba:64:room:6424":
  name: The Kitchen Area
  description: >
    This is a well-stocked kitchen, the larders still fresh and full as if by magic.  Perhaps this
    would be a good place to take a break.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:64:room:6423
      door:
        keywords: [door]
        kind: door
        reset: closed

