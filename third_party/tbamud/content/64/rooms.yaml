"tba:64:room:6426":
  name: A Hall
  description: >
    This area of the tower seems dank and oppressive.  The hall runs north-south, and there is an empty
    cell to your west.  The stairwell is to your east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6427
    east:
      to: tba:64:room:6425
