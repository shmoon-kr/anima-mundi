      to: tba:64:room:6441
    east:
      to: tba:64:room:6442
    west:
      to: tba:64:room:6439

"tba:64:room:6441":
  name: The Laboratory
  description: >
    This laboratory has lots of stuff in it.  Beakers, flasks, burners, tongs, mortars and pestles,
    jars filled with normal things, jars filled with abnormal things, jars filled with things you'd rather
    not think about... A search could reveal many things...
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:64:room:6440
  extras:
  - keywords: [beaker, beakers, flask, flasks, burner, burners, tong, tongs]
    text: Looks like normal, fragile lab equipment to you.
  - keywords: [mortar, mortars, pestle, pestles, jar, jars]
    text: Looks like normal, fragile lab equipment to you.

"tba:64:room:6442":
  name: The Stairs
  description: Stairs lead down here to the second level of the basement, or back west to the alcove.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:64:room:6440
    down:
      to: tba:64:room:6443

"tba:64:room:6443":
  name: The Stairs
  description: >
    Stairs lead up here to the first level of the basement, or you can go east to another big room.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6444
    up:
      to: tba:64:room:6442

"tba:64:room:6444":
  name: The Summoning Room
  description: >
    This room is darkly lit by a giant glowing pentagram in the center of the room.  Bands of force
    encircle some sort of being trapped inside.  You think that going inside would be an EXTREMELY BAD
    idea...
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:64:room:6445
    west:
      to: tba:64:room:6443
  extras:
  - keywords: [pentagram]
    text: It is centuries old.  You don't think standing close by would be a good idea.
  - keywords: [being]
    text: >
      You can't see it clearly through the energy field of the pentagram, but you sense that whatever it
      is, it is very, very, very, very angry.

"tba:64:room:6445":
  name: Inside A Pentagram
  description: >
    Inside the pentagram the floor is covered in a fine golden dust.  The lines of the pentagram seem
    to be drawn in blood which has dried to a dark reddish-brown.  The edges of the pentagram seem to hold
    some unseen power or protection.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:64:room:6444
