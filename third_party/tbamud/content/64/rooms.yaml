# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 64.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:64:room:6400":
  name: A Mountain Trail
  description: >
    This trail leads up, up, up into the mountains.  You hope you don't fall down, because that would
    hurt, hurt, hurt!  The trail continues to the east, and you can go back down to the small hidden
    valley to the west.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6401
    west:
      to: tba:40:room:4078

"tba:64:room:6401":
  name: A Mountain Trail
  description: >
    You're really high up now.  You can keep going even farther up into the mountains to the east, or
    go back down to the west.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6402
    west:
      to: tba:64:room:6400

"tba:64:room:6402":
  name: A Mountain Trail
  description: >
    Wispy clouds are beginning to surround you now, and your ears pop due to the altitude.  To the
    east, you see the summit of the mountain, and from the way the nearby mountains are arranged behind it,
    you believe you're on your way to a big valley.  You can also go down to the west.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6403
    west:
      to: tba:64:room:6401

"tba:64:room:6403":
  name: Near The Mountain's Peak
  description:
  - >
    The peak of this mountain is another couple hundred feet above you, but here is where the trail
    leads down into the valley...  What an odd valley!
  - >
    The valley seems to have been filled up by a hundreds of feet of lava many years ago.  It gives the
    valley an odd, 'flat' look and darkish ground.  The path leads down east into the valley, and west
    back to civilization.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6404
    west:
      to: tba:64:room:6402

"tba:64:room:6404":
  name: The Trail To The Valley
  description: >
    The trail leads down into the valley, where, by judging by the height of the trees, the lava had
    cooled tens of decades ago.  Down below you see the path lead into the small forest in the valley, and
    disappear out of sight.  East leads into the valley, West back to civilization.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6405
    west:
      to: tba:64:room:6403

"tba:64:room:6405":
  name: In The Valley
  description:
  - >
    The ground has taken on the texture of dirt on the top, but this valley is far too flat and too
    rocky to disguise the catastrophe that happened here so long ago.  Looking up to the mountains ringing
    this area, you notice several mountains look as if they had 'exploded', which is strange, considering
    that they are not volcanos.
  - The path leads into the woods to the east, and back up the mountain to the west.
  sector: forest
  exits:
    east:
      to: tba:64:room:6406
    west:
      to: tba:64:room:6404

"tba:64:room:6406":
  name: In A Clearing
  description: >
    You come to a small clearing now, after walking for several minutes through the silent woods.  An
    odd block sticks up here and there in   the ground... wait a minute.  These stones seem a little too
    regular, and from the circle formation and size you could almost swear that they were...
    crenellations?  Could some sort of building been buried by the lava here?  A rusty ring sticks out of the earth in
    the center... a trapdoor?  This is almost too good to be true!
  sector: forest
  exits:
    west:
      to: tba:64:room:6405
    down:
      to: tba:64:room:6407
      look: An ancient trapdoor, grimed with earth and age.
      door:
        keywords: [trapdoor, trap]
        kind: door
        reset: closed

"tba:64:room:6407":
  name: A Stairwell
  description: >
    This small room is the top of a stairwell leading down deep into the tower.  A small trapdoor
    overhead leaks the light of day around its edges.  To the south is a wooden door, preserved through the
    ages by means unknown.  To the west is a short hall.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:64:room:6408
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:64:room:6409
    up:
      to: tba:64:room:6406
      look: An ancient trapdoor, grimed with earth and age.
      door:
        keywords: [trapdoor, trap]
        kind: door
        reset: closed
    down:
      to: tba:64:room:6413

"tba:64:room:6408":
  name: A Linen Closet
  description: >
    This small room holds many types of linen on shelves along the walls.  They are undoubtedly
    preserved by magic against the toil of the ages, since they seem freshly washed and folded.  You wonder what
    sort of mage could wield so much power to waste on such little things.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6407
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [linen, shelf, shelves]
    text: White sheets, pillow-cases, etc.  Not really anything that you need, but interesting.

"tba:64:room:6409":
  name: A Corridor
  description: >
    This is only a clean corridor, that leads back to the stairwell to the east, and has doors leading
    to other rooms to the north and south.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6411
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:64:room:6407
    south:
      to: tba:64:room:6410
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:64:room:6410":
  name: A Bathroom
  description: >
    This is some sort of bathroom, like you've never seen before...  Water appliances leading from
    nowhere deliver hot and cold running water to basins that drain to... where?  How strange!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:64:room:6409
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:64:room:6411":
  name: The Master Bedroom
  description: >
    This is an opulent room, decorated in silks and gold. There is an ebony desk against one wall,
    cooled lava rock spilling over its surface from the window it once looked out at.  A nice, spacious
    closet is filled with clothes just cleaned and pressed.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:64:room:6409
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [desk]
    text: The desk is basically uninteresting, as are the papers on top of it...
  - keywords: [closet]
    text: Nice clothes, but not your size at all.

"tba:64:room:6412":
  name: The Library
  description: >
    A great mages' library is contained on this floor of the tower.  You feel you could learn anything
    you wanted to if you only looked and read long enough.  A door opens up back on the stairwell to the
    east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:64:room:6413
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:64:room:6414
      look: A big bookcase, that looks rather odd.
      door:
        keywords: [bookcase]
        kind: door
        reset: closed
  extras:
  - keywords: [book, books]
    text: There are lots of books about everything here!

