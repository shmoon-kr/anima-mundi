"tba:104:room:10437":
  name: The Monsters Den
  description: >
    {yellow}The walls are covered with blood, and the floor is also covered withit too. Human skeletons
    litter the floor, and multiple animal skeletons also fill this place.  The ceiling is not perfect
    here, and the walls are cover in scratches, and the ceiling is cover in blood and scratches.{/yellow}
