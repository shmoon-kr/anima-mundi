"tba:104:room:10401":
  name: A Small Woodland Path
  description: >
    {yellow}A small indent lies in the ground, it seems to be some kind of animals bed, but it is hard
    to tell for sure.  There are tall fat oak trees growing up here, blocking your view in some places. 
    The woodland path winds on every side of you, each one more winding than the other, making it hard to
    tell where they go.  Birds chirp in the trees, and sounds of animals come from all around you, the
    sun fights its way through the leaves in the trees, and the wind tries to break through the trees, but
    is unsuccessful.  The morning dew still sits on the forest floor, adding the this serene setting,
    the trees creep up towards the sky, large branches sticking out of its trunk, blocking the sky from
    view.{/yellow}
  sector: forest
  exits:
    north:
      to: tba:104:room:10402
    east:
      to: tba:104:room:10405
    south:
      to: tba:104:room:10404
    west:
      to: tba:104:room:10403
  triggers: [tba:104:trg:10401]

"tba:104:room:10402":
  name: Further in to the Woods
  description: >
    {yellow}The morning dew lies here, making it seem as though it were still early in the morning.  A
    large imprint is in the ground here, made by what seems to have been a deer.  The trees grow wilder
    here, and the brush makes it hard to walk around.  The sound of laughing children comes into this part
    of the woods, and the forest seems to be enchanted with the spirits of these children.  The trees
    seem to hold onto their spirits, these trees seem to be gentle, but at the same time they seem to be
    sinister, their branches seem to lash out and try to catch you in their grasp.{/yellow}
  sector: forest
  exits:
    south:
      to: tba:104:room:10401
  triggers: [tba:104:trg:10402]

"tba:104:room:10403":
  name: A Barricade of Trees
  description: >
    {yellow}The same large winding oak trees cover this area, each large twisted trunk touches one
    another, blocking off almost all sunlight.  The sounds of wind are no longer heard in this place, only
    the whining of the trees surrounding this place.  Some large branches cover this place, and multiple
    animal tracks are imprinted into the ground here.  Towards the top of the trees, the scratching of
    little squirrels feet bounces off the trees surrounding this place.{/yellow}
  sector: forest
  exits:
    east:
      to: tba:104:room:10401
    south:
      to: tba:104:room:10412
  triggers: [tba:104:trg:10403]

"tba:104:room:10404":
  name: A Lightly Lit Path
  description: >
    {yellow}The morning dew does not seem to be able to reach any part of this part of the forest, the
    tall trees collide above you, entwining like a jigsaw puzzle.  On a few trees, there are some stands
    up in them, these stands have a few specks of blood on them, making this area feel uncomfortable in
    some ways.  Although the trees entwine above you, the area all around you is not surrounded by such
    trees.  The wind blows through here freely, and the sun shines in from the trees around you, not
    letting in a lot of light though.  The rustling of leaves comes to your ears in the area around you, adding
    to the feeling of being uncomfortable.{/yellow}
  sector: forest
  exits:
    north:
      to: tba:104:room:10401
    east:
      to: tba:104:room:10407
  triggers: [tba:104:trg:10404]

"tba:104:room:10405":
  name: Nearing a Small Tree Fort
  description: >
    {yellow}This path does not seem to be natural, it looks to have been forced here by the destructive
    human hand.  Plastic bottles and foam cups litter this area, along with many cardboard boxes.  The
    sun shines in this area as though there were no trees overhead, this is not like the other parts of
    the forest, it is mostly clear, and it seems to have been forced to be this way.  The wind whistles
    through here, rustling leaves and moving branches all around.{/yellow}
  sector: forest
  exits:
    east:
      to: tba:104:room:10408
    west:
      to: tba:104:room:10401

"tba:104:room:10406":
  name: The Mazes Entrance
  description: >
    {yellow}The fresh air totally leaves the area around you, in it's place there is a stagnant smell. 
    The walls a large marble stones, and are well made.  The ground is sleek, and it has a few blood
    stains every now and then.  For as closed in as this area is, it gives off a good amount of light,
    enough to illuminate your path.{/yellow}
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:104:room:10426
    west:
      to: tba:104:room:10411

"tba:104:room:10407":
  name: Entrance to The Forest
  description: >
    {yellow}A light wind blows through the trees and they sway gently.  The air here smells crisp and
    clean.  This is a rather large clear area.  Some creatures frolic in the field, and some in the
    trees.  Leaves fall to the ground from the trees swaying branches.  A small stream flows gently into the
    forest.  Small fish can be seen in the stream, bolting up and down the stream, distorting the image af
    the pebbles.  The grass is soft and the color is perfect.  {/yellow}
  sector: field
  flags: [peaceful]
  exits:
    west:
      to: tba:104:room:10404

"tba:104:room:10408":
  name: The Foot of the Tree Fort
  description: >
    {yellow}A tree fort sits at the top of a huge oak tree.  The roots protrude from the ground, and
    cover the surrounding area.  A small light sits in the fort atop the tree.  There is no way to go up
    into the fort because of a lack of a ladder, or a rope.  Large plastic bottles cover the ground, and
    some foam coolers every now and then.  A piece of broken wood lies in a large brush pile, it seems to
    be connected to the brush.{/yellow}
  sector: forest
  exits:
    south:
      to: tba:104:room:10409
    west:
      to: tba:104:room:10405

"tba:104:room:10409":
  name: Jaks Shack
  description: >
    {yellow}Many items cover the wall, armor and weapons.  The wall towards the back of the room is
    made of a fine polished oak, while all the other walls are made of a flimsy type of wood.  The roof is
    also made of a fine polished oak.  A desk sits at the back of the room where the items are and a Elven
    man sits behind it. Light flows in through a small window on the side of the room, it seems to have
    no glass so it a small breeze comes in through it.  {/yellow}
  sector: forest
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:104:room:10408
    east:
      to: tba:104:room:10410

"tba:104:room:10410":
  name: Orchans Lake
  description: >
    {yellow}A soft breeze comes blows over you.  The small rustle of leaves fills your ears.  Small
    waves wash up on to the shore.  Fish swim in the lake, adding to the beautiful scene.  The ground here
    is softer here, making it a great place to just rest.  The air is fresh, and the sounds of animals
    also fills your ears. Tall grass grows all around the lake, and large boulders are also here.  It is
    mysterious how they got here, air also has a moist smell in it.{/yellow}
  sector: forest
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:104:room:10411
    west:
      to: tba:104:room:10409

"tba:104:room:10411":
  name: Entrance to the Forest
  description: >
    {yellow}Large trees are to the south, and strange sounds emit from the opening in the trees. 
    Animal bones litter the ground.  A harsh wind blows from all around. To the north is another forest, dark
    shadows cover it's entrance.  Even larger skeletons cover the ground, some human, and some are
    unknown.  A cold feeling emits from the forest, adding an uncomfortable feeling to this area.  {/yellow}
  sector: forest
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:104:room:10460
    east:
      to: tba:104:room:10406
    south:
      to: tba:104:room:10410
    west:
      to: tba:104:room:10413

"tba:104:room:10412":
  name: Broken Down Old House
  description: >
    {yellow}Tree stumps litter the ground here, and large broken trees are everywhere. One large oak
    has up-rooted and fallen on an old wooden house.  The house was split in half and it seems to be home
    to multiple animals now.  Strange sounds emit from the house, and a horrid smell also comes from the
    house.  An old rusted well sits in front of the house, it seems to have been protected from the tree
    by the house.{/yellow}
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:104:room:10403

"tba:104:room:10413":
  name: Gate to Orchan
  description: >
    {yellow}A hard wooden platform lies under your feet.  Straight ahead is a large metal gate that
    stands open.  No one is patrolling the perimeter of the gate. Torches are on either side of the gate
    casting shadows on either side of the gate.  At the top of the gate is some weird insigne, this is also
    on either side of the gate.  At the gates entrance the wooden platform stops and the ground turns to
    rock.{/yellow}
  sector: city
  exits:
    east:
      to: tba:104:room:10411
    west:
      to: tba:104:room:10414

"tba:104:room:10414":
  name: A Rock Road
  description: >
    {yellow}The road that started at the foot of the gate continues on here.  Every little stone seems
    to have been placed with extreme care.  Houses line the road, to the north the road continues, and it
    also continues to the south.  Noise emits from people walking around on this road, they seem to be
    in a hurry, and don't want to talk to anyone.{/yellow}
  sector: city
  exits:
    north:
      to: tba:104:room:10415
    east:
      to: tba:104:room:10413
    south:
      to: tba:104:room:10420

"tba:104:room:10415":
  name: A Rock Road
  description: >
    {yellow}The rocky road seems to be ending here, it leads to a luxurious house. Smoke emits from the
    chimney, and the smell of something cooking is in the air. A sign is neatly placed on the door of
    the house.  The steps that lead up to the house are made of pine wood, each step has been carefully
    cut, and carefully put in to its place.  The door stands open, letting in the fresh air from the
    outside.  {/yellow}
  sector: city
  exits:
    north:
      to: tba:104:room:10416
    south:
      to: tba:104:room:10414

"tba:104:room:10416":
  name: Ligerns' House
  description: >
    {yellow}A new looking cobble stone floor is underneath your feat.  The walls are made up of a
    freshly polished oak.  The ceiling rises high above, and thick boards spread out evenly are stained
    perfect.  Many large plaques and trophies cover the wall towards the back.  Some large swords are placed
    neatly in a little case, also hanging on the wall.  A large round oak table sits in the center of the
    room, with one lone chair sitting at it.  {/yellow}
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:104:room:10415
    west:
      to: tba:104:room:10417

"tba:104:room:10417":
  name: Main Street
  description: >
    {yellow}The ground moves from the rough rock road to a smooth cobblestone road. This road is wider
    then the rock road, and even more people move through here. Large houses line the side of the road,
    and some trees are able to be seen every now and then.  A sign is stuck into the ground on the side of
    the road, it seems to be a direction sign.  A warm feeling seems to be coming from all around you.
    It seems to be coming from the towns people.{/yellow}
  sector: city
  exits:
    east:
      to: tba:104:room:10416
    west:
      to: tba:104:room:10418

"tba:104:room:10418":
  name: Main Street
  description: >
    {yellow}The large cobble stone road ends here.  Large buildings cover the road, some trees are here
    and there.  Loads of people litter the street, some short, others tall.  But every person seems to
    be Elven.  A warm feeling comes from the area around you.  The people seem to be giving this feeling
    off.  The cobble stone road is freshly polished and looks to be brand new.{/yellow}
  sector: city
  exits:
    north:
      to: tba:104:room:10419
    east:
      to: tba:104:room:10417

"tba:104:room:10419":
  name: Orchan Map Shop
  description: >
    {yellow}One large marble stone makes up the floor here, and the walls seem to be made up of some
    type of metal.  There seems to be pieces of blank parchment strewn all over the store.  A large glass
    case sits in the back of the room, inside of it it has very few maps.  But there are many sheets of
    parchment.  A very beautiful young looking elf sits behind the glass desk, making what seems to be a
    map.  {/yellow}
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:104:room:10418

"tba:104:room:10420":
  name: A Rock Road
  description: >
    {yellow}The road seems to get a little smoother her, but it is barely noticeable. Some small trees
    are starting to grow up on the side of the road.  A building lies to the west, it seems to be gaining
    a lot of attention.  A small breeze blows through this part of town.  Another sign has been placed
    neatly on the wall beside the buildings opening.  {/yellow}
  sector: city
  exits:
    north:
      to: tba:104:room:10414
    west:
      to: tba:104:room:10421

"tba:104:room:10421":
  name: Chwins' Weapon Shop
  description: >
    {yellow}A newly made building, with brand new polished pine floors.  The walls are also made of
    pine, a small desk sits in the corner of the room, it has all sorts of papers strewn all over it. 
    Weapons line the walls all around you.  Multiple weapons, not any two are alike.  The smell of something
    burning is in the air, and it turns out to be coming from a small cobble stone fire place off in the
    other corner of the room.  Each stone has been placed on this fireplace with extreme care.  {/yellow}
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:104:room:10422
    east:
      to: tba:104:room:10420

"tba:104:room:10422":
  name: Mic`zell's Armor Shop
  description: >
    {yellow}This seems to be an extension of the weapon shop.  The floor and the walls look the same as
    the other part, but the ceiling is completely different.  A large red orb floats above in the
    rafters.  It adds a red tint to everything in the room.  Lining the walls is a small assortment of armor,
    it seems that this shop has just opened.  Although there is not much armor, it seems to be extremely
    expensive.  {/yellow}
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:104:room:10421
    west:
      to: tba:104:room:10423

"tba:104:room:10423":
  name: A Rock Road
  description: >
    {yellow}This road is unlike any of the other rock roads, each road has been carefully placed so
    that there are no spaces in between them.  A gigantic wooden house lies to the south.  It stands taller
    than all the others in this village. A large golden statue of some old looking elf is in front of
    this house. Beautiful pine steps are leading up to his house, and the door is nowhere to be seen, it
    seems it has been taken off.  {/yellow}
  sector: city
  exits:
    north:
      to: tba:104:room:10464
    east:
      to: tba:104:room:10422
    south:
      to: tba:104:room:10424

"tba:104:room:10424":
  name: Elder Lucious' House
  description: >
    {yellow}This seems to be the best looking house in the whole village.  Lots of beautiful items line
    the walls, and even more are on a table that sits in the center of the room.  Heat emits from
    another well built looking cobble stone fireplace.  High in the rafter you notice another red glowing orb. 
    This orb adds another reddish tint, but the color is darker.  {/yellow}
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:104:room:10423
    west:
      to: tba:104:room:10425

"tba:104:room:10425":
  name: Orchan Post Office
  description: >
    {yellow}This is a large room, and this room seems to draw a lot of people to it. People are giving
    there mail to the postmaster to send, and she is giving them their mail.  There are loads of bags
    with mail in them, he seems to be send mail for a small fee though.  The floor is also littered with
    paper, but this paper is blank.{/yellow}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:104:room:10424

"tba:104:room:10426":
  name: A Maze Room
  description: >
    {yellow}The walls are a dark blue, but the rock is still made of marble.  There is a little more
    blood splatter here.  The floor is made up of a smaller light marble stone.  There are many scratches
    on the ground and they seem to have been made by something in-human.  The ceiling is made of the same
    marble, but this is smoother, and only enough light is here to allow sight.{/yellow}
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:104:room:10427
    south:
      to: tba:104:room:10406

