"tba:104:room:10460":
  name: Path Through the Forest
  description: >
    {yellow}This path looks like it has been used by many travelers and creatures. The earth is compact
    and the no shuberry grows near this place. The sky above can be seen, but it looks as if the sky
    fades into the trees ahead. {/yellow}
  sector: forest
  exits:
    north:
      to: tba:104:room:10461
    south:
      to: tba:104:room:10411

"tba:104:room:10461":
  name: A Bend in the Path
  description: >
    {yellow}The path looks to bend here, for as you know, there is never truely any straight path. The
    brush looks like it is growing away from the road, as if some sort of magic is causing it to retreat.
    The Sky is not able to be seen, and the sounds of the forest have become silent now.{/yellow}
  sector: forest
  exits:
    south:
      to: tba:104:room:10460
    west:
      to: tba:104:room:10462

"tba:104:room:10462":
  name: A Bend in the Path
  description: >
    {yellow}The path looks to bend here, for as you know, there is never truely any straight path. The
    brush looks like it is growing away from the road, as if some sort of magic is causing it to retreat.
    The Sky is not able to be seen, and the sounds of the forest have become silent now. {/yellow}
  sector: inside
  exits:
    north:
      to: tba:104:room:10463
    east:
      to: tba:104:room:10461

"tba:104:room:10463":
  name: A Path Through the Forest
  description: >
    {yellow} The road seems to have been used many times before, the earth has become compacted, harden
    into what feels like clay.  The shruberry that was once here has turned into nothing but a skeleton
    of branches.  A dark presence seems to reside over this particular intersection, but oddly enough so
    does the presence of life.  The darkness engulfs the northern exit while the life fills the
    surrounding area.{/yellow}
  sector: inside
  exits:
    south:
      to: tba:104:room:10462

"tba:104:room:10464":
  name: An Observation Room
  description: >
    {yellow}The room is not a small room, but rather vast, books are scattered all around the floor and
    on the tables.  This place seems as though no one has cleaned it for months.  Large tools scatter
    the desk off in the corner, and many piles of papers with writing on them scatter this desk as well. 
    The ceiling above is nothing but a thick looking glass with bars filling in for support.{/yellow}
  sector: city
  flags: [no_mob]
  exits:
    south:
      to: tba:104:room:10423

"tba:104:room:10499":
  name: Taylor's Lounge
  description: >
    {bright_white}A small lamp sits in the center of the room letting off a small amount of light. A
    beautiful white shag carpet is covering the whole floor besides in a small spot where there is white
    marble with small flecks of black in them. Directly on the wall behind the marble is a large fireplace
    the sinks deep into the wall. A small fire crackles in the center on the fireplace, casting a soft
    glow upon the walls. Pictures line the pure white walls, all are in finely made wooden frames. A
    freshly stained trim lies at the top of every wall. The fireplaces frame is made of small marble bricks,
    all are black, making the fireplace standout from the rest of the room. A window lies on the wall
    opposite the fireplace, letting in a little light through the linen curtains. A large squishy looking
    armchair sits in the middle of the room only a few feet from the fireplace. {/bright_white}
  sector: inside
  flags: [indoors, peaceful]
  extras:
  - keywords: [main, chamber, room, taylors, tays]
    text: >
      {bright_white}A small lamp sits in the center of the room letting off a small amount of light.  A
      beautiful white shag carpet is covering the whole floor besides in a small spot where there is white
      marble with small flecks of black in them. Directly on the wall behind the marble is a large fireplace
      the sinks deep into the wall.  A small fire crackles in the center on the fireplace, casting a soft
      glow upon the walls.  Pictures line the pure white walls, all are in finely made wooden frames.  A
      freshly stained trim lies at the top of every wall.  The fireplaces frame is made of small marble
      bricks, all are black, making the fireplace standout from the rest of the room.  A window lies on the wall
      opposite the fireplace, letting in a little light through the linen curtains. A large squishy
      looking armchair sits in the middle of the room only a few feet from the firplace.  {/bright_white}
