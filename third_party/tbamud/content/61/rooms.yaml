# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 61.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:61:room:6100":
  name: A Narrow Trail Through The Deep, Dark Forest
  description: >
    You are on a narrow trail winding its way between the enormous, gray trunks.  The crowns of the
    trees must be very dense, as they leave the forest floor in utter darkness.  The trail leads east and
    west.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:60:room:6064
      look: A small shadowy path leads away to the north.
    east:
      to: tba:60:room:6004
      look: The narrow trail leads east to a somewhat lighter part of the forest.
    west:
      to: tba:61:room:6101
      look: The narrow, dusty trail leads west through the forest.
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: >
      These ancient trees must have been here for many, many years.  It is impossible to catch even a
      glimpse of anything above the lowest branches.
  - keywords: [trail]
    text: >
      The dark and dusty trail seems fragile compared to the massive trunks, and in some places, giant
      gray roots have broken up through its surface.

