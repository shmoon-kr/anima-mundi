"tba:61:room:6130":
  name: A Narrow Trail Through The Deep, Dark Forest
  description: >
    You are on a dusty trail winding its way westward between huge, ancient trees that stand close on
    all sides.  The tree trunks seem to be covered in some sticky substance which gets much stickier
    towards the west!  Beware!
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6110
      look: The narrow, dusty trail leads east through the forest.
    west:
      to: tba:61:room:6131
      look: >
        The sticky substance is hanging like ropes between the trees just above the path.  To the west the
        path seems to be covered with these giant threads covered with glue.  You can sense the forces of
        evil coming from the west and your bones tell you it may not be such a good idea to proceed.
    up:
      to: tba:61:room:6132
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: >
      The sticky substance is hanging like ropes between the ancient trees, crossing the path just out of
      reach.  It might be possible to climb one of the sticky trunks.
  - keywords: [trail]
    text: >
      The dark and dusty trail seems fragile compared to the massive trunks, and in some places, giant
      gray roots have broken up through its surface.
  - keywords: [substance, rope, ropes, thread, threads]
    text: >
      The substance reminds you of giant threads covered with glue.  If it hadn't been for the size you
      could have sworn it was part of a spider web.

"tba:61:room:6131":
  name: The Deadly Spider Web
  description: >
    You are walking along the narrow path, ducking under the sticky ropes as you advance... > A huge,
    poisonous spider drops from above! A huge, poisonous spider drops from above! A huge, poisonous spider
    drops from above! > The huge, poisonous spider stings you!  You resist the poison! The huge,
    poisonous spider stings you!  You are poisoned! The huge, poisonous spider stings you!  You are poisoned!
  sector: forest
  flags: [no_mob, indoors]
  exits:
    up:
      to: tba:61:room:6130

"tba:61:room:6132":
  name: Up In The Tree
  description: >
    You are hanging on the outside of a huge tree trunk covered in a sticky substance.  Directly to the
    west is an immense spider web suspended between numerous of the giant trees including the one you
    are hanging on.  To the north is what looks like a large webbed entrance.
  sector: water_swim
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:63:room:6301
      look: >
        To the north is what looks like a large expanse of webbing which extends very far into the trees.
    west:
      to: tba:61:room:6133
      look: To the west is the immense spider web.  It seems to move softly.
    down:
      to: tba:61:room:6130
      look: Downwards is the narrow forest path.
  extras:
  - keywords: [web]
    text: The spider web stretches out to the west.  It looks as if it is possible to walk on it.

"tba:61:room:6133":
  name: On The spider web
  description: >
    You are balancing carefully on the giant sticky threads that holds the giant web in place.  To the
    east is a giant tree trunk and to the west is an entrance to a cave-like structure made from many
    layers of spider web.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6132
      look: To the east is the giant tree trunk.
    west:
      to: tba:61:room:6134
      look: To the west is the entrance to the cave-like structure.
  extras:
  - keywords: [cave, structure]
    text: >
      It covers a ground area corresponding to an irregular circle with a diameter of about 20 feet and
      is nearly 10 feet tall.  It looks very old.
  - keywords: [web]
    text: The immense spider web moves softly.

"tba:61:room:6134":
  name: The Den Of The Queen Spider
  description: >
    You are inside a cave-like structure that seems to be made entirely from countless layers of spider
    web.  Temperature and humidity is very high making it hard to breathe the foul air that lingers
    here.  The walls are covered with open cocoons.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6133
      look: Compared to this place the east exit looks inviting.
  extras:
  - keywords: [cocoon, cocoons]
    text: >
      The cocoons are burst open as if something inside really wanted to get out. They are at the size of
      a human head.
  - keywords: [web, wall, walls]
    text: The sticky walls are covered with open cocoons.

"tba:61:room:6135":
  name: A Dusty Trail In The Deep, Dark Forest
  description: >
    You are on a dusty trail leading through the deep, dark forest.  Ancient gray trees loom all around
    you.  The trail continues north and east.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6136
      look: The dusty trail leads north through the trees.
    east:
      to: tba:61:room:6129
      look: The dusty trail leads east through the trees.
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: The ancient gray giants seem to observe you silently.

"tba:61:room:6136":
  name: A Dusty Trail In The Deep, Dark Forest
  description: >
    You are on a dusty trail leading through the deep, dark forest.  Ancient, gray trees loom
    everywhere.  The trail continues south and west.  A broad irregular path leads eastward away from the trail.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6142
      look: The trees standing on the sides of the path have scratch marks on them.
    south:
      to: tba:61:room:6135
      look: The dusty trail leads south through the trees.
    west:
      to: tba:61:room:6137
      look: The dusty trail leads west through the trees.
  extras:
  - keywords: [trail]
    text: >
      The dark and dusty trail seems fragile compared to the massive trunks, and in some places, giant
      gray roots have broken up through its surface.
  - keywords: [path]
    text: The trees standing on the sides of the path have scratch marks on them.
  - keywords: [tree, trees, trunk, trunks]
    text: >
      To the east the ancient gray giants have many marks as if something with huge claws has been
      tearing at them in rage.

"tba:61:room:6137":
  name: At The End Of The Trail Through The Deep, Dark Forest
  description: >
    You are on a dusty trail leading through the deep, dark forest.  Ancient gray trees loom all around
    you.  A small trail leads northwards and the only other exit is east, along the main trail.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6138
      look: A narrow trail leads northwards through the underbrush.
    east:
      to: tba:61:room:6136
      look: The dusty trail leads east through the trees.
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: The ancient gray giants seem to observe you silently.

"tba:61:room:6138":
  name: On The Narrow Trail
  description: >
    The trail continues to the north and south as it leads through the heavy underbrush of this part of
    the Haon-Dor Forest.  Ancient gray trees loom all around you.  The brush seems to be bending closely
    over the path in a somewhat ominous manner, but you easily shrug it off.  The trail looks to open up
    somewhat a short distance to the south.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6139
      look: The narrow trail continues northwards through the underbrush.
    south:
      to: tba:61:room:6137
      look: The dusty trail leads east through the trees.
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: The ancient gray giants seem to observe you silently.

"tba:61:room:6139":
  name: On The Narrow Trail
  description: >
    The trail continues to the north and south as it leads through the heavy underbrush of this part of
    the Haon-Dor Forest.  The trail looks surprisingly well trodden along this part.  The brush seems to
    be bending closely over the path in a somewhat ominous manner, but you easily shrug it off.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:62:room:6203
      look: A short distance to the north, you can see something shimmering.
    south:
      to: tba:61:room:6138
      look: The path leads southwards through the underbrush.

"tba:61:room:6142":
  name: Outside A Cave In The Deep, Dark Forest
  description: >
    You are at the end of a broad, irregular path.  To the north is a very large ominous-looking cave
    opening.  The trees here have many marks as if something with huge claws has been tearing at them in
    rage.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6143
      look: The disgusting smell of a large reptile emanates from the cave opening.
    west:
      to: tba:61:room:6136
      look: The path winds its way westward.
  extras:
  - keywords: [cave, opening]
    text: The disgusting smell of a large reptile emanates from the cave opening.
  - keywords: [tree, trees]
    text: >
      The ancient gray giants have many marks as if something with huge claws has been tearing at them in
      rage.

"tba:61:room:6143":
  name: The Cave Of The Green Dragon
  description: >
    You are in a big natural cave.  The floor is littered with bones of all sorts and the stench is so
    massive that you could cut it with a knife.  The only exit is to the south.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:61:room:6142
      look: The exit leads out into the forest.
  extras:
  - keywords: [bone, bones, floor]
    text: Most of the bones on the floor appear to be of human origin.

"tba:61:room:6150":
  name: The Narrow Trail
  description: >
    This trail looks much spookier than any other that's you have seen.  The usual animal claw marks
    and bites on the trees are becoming few and far between.  The trail continues north.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6151
      look: The narrow trail continues north.
    south:
      to: tba:61:room:6103
      look: The trail intersects the main forest path.

"tba:61:room:6151":
  name: The Narrow Trail
  description: >
    This area of the trail is also very peculiar.  You can see no signs of animal life what so ever. 
    The structure of the surrounding trees forces the path to make a sharp turn to the east.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6152
      look: The trail bends east.
    south:
      to: tba:61:room:6150
      look: The start of the trail.

"tba:61:room:6152":
  name: The Circle Of Trees
  description: >
    The trees here seem to form a circle around the enormous tree in the center.  You notice a wooden
    door carved into the huge tree to the east.  The trail that you followed to get here seems to end at
    the base of the tree.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6153
      look: The tree door is carved beautifully.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:61:room:6151
      look: The bend on the trail.

"tba:61:room:6153":
  name: Inside The Great Tree
  description: >
    You have stepped inside of this hollowed tree.  From here steps lead down into darkness or you can
    exit the tree by going west.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:61:room:6152
      look: The door is carved beautifully.
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:61:room:6154
      look: The steps look appear like they will hold your weight.

"tba:61:room:6154":
  name: The Underground Hallway
  description: >
    This hallway is apparently one of the roots of the tree hollowed out. The hall leads south to a
    room where you hear strange noises or you can go up the steps.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:61:room:6155
      look: The hallway looks quite grand.
    up:
      to: tba:61:room:6153
      look: The steps appear like they will hold your weight.

"tba:61:room:6155":
  name: The Cultist Temple
  description: >
    This temple, built to a god you don't worship, is a nice place to visit but you feel very
    uncomfortable about spending any amount of time here.  The wooden altar seems to almost glow as you enter the
    room.  The only exit is the way you came in.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:61:room:6154
      look: The hallway to the north looks quite grand.
