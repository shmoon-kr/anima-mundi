    You are on a dusty trail winding its way between huge, ancient trees standing close on all sides. 
    The trail leads east and south.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:61:room:6112
      look: The narrow, dusty trail leads east through the forest.
    south:
      to: tba:61:room:6126
      look: The narrow, dusty trail leads south through the forest.
  extras:
  - keywords: [tree, trees, trunk, trunks]
    text: >
      These ancient trees must have been here for many, many years.  It is impossible to catch even a
      glimpse of anything above the lowest branches.
  - keywords: [trail]
    text: >
      The dark and dusty trail seems fragile compared to the massive trunks, and in some places, giant
      gray roots have broken up through its surface.

