"tba:70:room:7008":
  name: A Muddy Intersection
  description: >
    You have both your feet safely stuck in mud.  It isn't the mud that is wrong it is the smell, the
    sounds, the total darkness that surrounds you. Everything here is so depressing.  The pipe leads on
    with a trail of thick mud to the north, east and south.
  sector: hills
  flags: [dark, indoors]
  exits:
    north:
      to: tba:70:room:7007
      look: >
        North.  The pipe goes into a bend with a load of mud all the way up the walls. The bend leads west.
    east:
      to: tba:70:room:7014
      look: >
        East.  This way looks like a place for the annual mud festival, although the stench wouldn't allow
        any happiness at all.  The pipe leads into a bend that leads north.
    south:
      to: tba:70:room:7009
      look: >
        South.  There is much less mud in that direction.  Your light doesn't uncover enough space for you
        to see much more than that it leads into some sort of junction.
  extras:
  - keywords: [mud]
    text: >
      It is as dark as tar and looks like something out of a toilet, on top of that, the smell is
      absolutely overwhelming.

"tba:70:room:7009":
  name: The Sewer Junction
  description: >
    You stand in the middle of a huge junction of sewer pipes right under what you'd think was an air
    shaft.  The sewer pipes lead to the north, south, east and west.  It look quite impossible to force
    your way up.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:70:room:7008
      look: North.  Mud is the floor basis in that direction.  Yummy.
    east:
      to: tba:70:room:7017
      look: YYEEUUCH!  BOOH!  THAT looks like a nice place for creepy crawlies.
    south:
      to: tba:70:room:7010
      look: >
        South.  This direction looks quite nice actually.  The pipe leads into a bend that goes east.
    west:
      to: tba:70:room:7004
      look: >
        A few yards ahead - away from this junction - there is a pit leading down, but the smell from
