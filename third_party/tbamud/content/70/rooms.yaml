"tba:70:room:7013":
  name: A Muddy Intersection
  description: >
    You wouldn't want to know the true feeling of standing in this mud up to your hips.  >BWAADR<.  All
    that fills your mind right now is the dream of a hot bath.  This is NOT very clean mud you know,
    remember you're in the sewer!  The pipes leads north, south and east.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:70:room:7012
      look: >
        North.  Sludge and sediment fills this corridor of the sewer that leads into a bend going west.
    east:
      to: tba:70:room:7026
      look: >
        East.  You can see absolutely nothing of interest in that direction (Maybe that is why it is so
        damn interesting...)  There is no mud in that direction either, GREAT!
    south:
      to: tba:70:room:7014
      look: South.  All you can see is more mud!  Although the pipe goes into a bend leading west.
  extras:
  - keywords: [mud]
    text: >
      It is as dark as tar and looks like something out of a toilet, on top of that, the smell is
      absolutely overwhelming.
  - keywords: [sediment]
    text: >
      It is NOT the kind of matter that would concern you too much, normally, but as you are in the
      middle of it, it just might become your main concern.  REAL YUCKY!

"tba:70:room:7014":
  name: The Muddy Sewer
  description: >
    You stand in a bend of the pipe system of the sewer with mud up to your thighs.  Contemplating a
    higher level of existence here would be utterly inappropriate, as the smell would keep any intelligent
