      look: West.  You see another junction very similar to this one that leads north and west.

"tba:70:room:7045":
  name: The Sewer Room
  description: >
    You are standing in a large room with chairs set in the walls.  You have the feeling of being
    watched.  To the south there is an entrance to a larger room.  The room is lit by five torches, also set
    in the walls.  To the west there is a doorway leading out to the sewers.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:70:room:7046
      look: You can see an even larger room than this one, filled with light.
    west:
      to: tba:70:room:7038
      look: To the west you can see the sewers.
      door:
        keywords: [door]
        kind: pickproof

"tba:70:room:7046":
  name: The Sewer Room
  description: >
    This is a Room with walls that glitters like gold though not quite like it. This is strange as it
    looks as if the glitter lights the whole room. It looks very bright.  To the south the floor is
    covered with yucky water. The north leads to a sort of a guard room.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:70:room:7045
      look: To the north you can see the guard room.
    south:
      to: tba:70:room:7047
      look: To the south there is nothing but water and an exit leads east from there.

"tba:70:room:7047":
  name: The Pool In The Sewer
  description: >
