"tba:70:room:7000":
  name: The Fissure Under The Ledge
  description: >
    This is a small fissure in the solid rock.  Under you lies the deep dark pool.  The water trickles
    quietly down from the ledge above you.  The water smells like the water in a sewer.
  sector: mountains
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:70:room:7070
    down:
      to: tba:71:room:7100
      look: The water's edge.

"tba:70:room:7001":
  name: The Muddy Sewer
  description: >
    You are standing in mud to your knees.  This is not the kind of place for a picnic.  The muddy
    sewer stretches further into the south.
  sector: mountains
  flags: [dark, indoors]
  exits:
    south:
      to: tba:70:room:7002
      look: You see the muddy sewer continuing into the darkness to the south.
  extras:
  - keywords: [mud]
    text: >
      It is as dark as tar and looks like something out of a toilet, on top of that, the smell is
      absolutely overwhelming.

