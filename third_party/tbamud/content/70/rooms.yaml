  - keywords: [ladder]
    text: Firmly set into the wall of the shaft it is impossible to even move, in your estimate.

"tba:70:room:7043":
  name: The Sewer Entrance
  description: >
    You stand in the middle of a pipe that leads from north to south.  Above you an air shaft leads up
    into sunlight.  It seems totally impossible to go up that way.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:70:room:7041
      look: To the north you can just make out a huge shaft leading down.
    south:
      to: tba:70:room:7044
      look: To the south you can see a triple junction leading west and east.

"tba:70:room:7044":
  name: The Junction Going Three Ways
  description: You are in a passageway in the pipes of the sewer system leading north, east and west.
  sector: city
  flags: [dark, indoors]
  exits:
