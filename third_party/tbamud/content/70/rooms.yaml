"tba:70:room:7015":
  name: The Old Well
  description: >
    You are standing by an old and worn well from before this century.  The sewer leads to the east
    from here and the well leads down into darkness. Metal bars implanted in the side of the well lead down
    as a ladder.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:70:room:7028
      look: >
        East.  You see, because of the utter darkness that surround you, absolutely nothing.  Your light
        isn't of much use for that kind of distance.
    down:
      to: tba:71:room:7105
      look: >
        Down the well there is even less light than up here, so... sorry, you can't see a thing.  There are
        metal bars in the side leading down into the darkness.
  extras:
  - keywords: [bars]
    text: >
      These look like they're pretty slippery, and not very safe, but perhaps safe enough for you to
      climb down, WITH both hands on them.

