# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 305.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:305:room:30500":
  name: The Stone Door
  description: >
    You find yourself standing in a dry circular room which is illuminated by a small brass torch set
    in the wall.  Flickering shadows dance about the room in a manner you find disorienting.  Beneath the
    torch is an elaborate mahogany door, complete with a small silver doorknob.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30501
      look: You see an elaborate mahogany door.
      door:
        keywords: [door, mahogany]
        kind: door
        key: tba:305:obj:30501
        reset: locked
  extras:
  - keywords: [credits, info]
    text:
    - >
      Chessboard Written March 1994 This area is kinda weird, It started as an addendum to Moria and then
      went off in its own direction. *shrug*
    - >
      Enclosed is an area I wrote back in my mudding days; they are designed for circle code, but with
      some modifications can probably be integrated into whatever kind of mud you're running.
    - >
      These areas are FREE- however, if you use them: 1. Feel free to make whatever modifications you
      need, change mobs, objects, room descriptions etc.- but please make sure that signs and author
      references are unmodified and readable by players. 2. Please send me an e-mail message if you do use them, I'd
      just like to have some idea of where they end up (please include mud site)- my address is
      wjp@@hopper.unh.edu until Sept 1996 3. If you redistribute these areas, please make sure this README file goes
      with them :)
    - Bill Pelletier wjp@@hopper.unh.edu Aten/Talisman of GenericMUD

"tba:305:room:30501":
  name: The Smooth Tunnel
  description: >
    Looking down at your feet, you are somewhat surprised to find that you are walking on a thick woven
    rug.  The walls of the tunnel that you are in are completely smooth, and polished to a gleam. 
    Before you, the tunnel opens up to what appears to be a small chamber.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30502
      look: It is difficult to see into the chamber from here.
    south:
      to: tba:305:room:30501
      look: There is a circular room back there.

"tba:305:room:30502":
  name: The Furnished Chamber
  description: >
    This chamber is furnished quite nicely, with a thick woven rug beneath your feet, and tapestries
    along the walls.  There is a rectangular hole in the rug, revealing a trapdoor which seems to open via
    a small iron ring, The room's exit looms behind you.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:305:room:30501
      look: There is a smooth tunnel back there.
    down:
      to: tba:305:room:30503
      look: You see a wooden trapdoor.
      door:
        keywords: [trapdoor, trap]
        kind: door

"tba:305:room:30503":
  name: The Stone Staircase
  description: >
    You find yourself in a rough stone staircase, which winds around a smooth core of stone, descending
    deeper into the bowels of the earth.  Small torches are set into the stone, guiding your way.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:305:room:30502
      look: There is a small room up there.
    down:
      to: tba:305:room:30504
      look: The stairs continue downward..

"tba:305:room:30504":
  name: Down..Down..Down..
  description: >
    Your descent picks up speed, and you trip over an unseen obstacle in the stairway!  As you tumble,
    the stairs start to become narrower and then begin to slope forward.  You soon find yourself sliding
    in circles down the tunnel, which has now become smooth stone, covered with very fine sand.  You
    faintly detect the sound of delighted laughter echoing in some faraway place.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:305:room:30505
      look: You're gonna find out fast- cuz thats the way your sliding!

"tba:305:room:30505":
  name: The Slide
  description: >
    You come out of the last spin, and are abruptly deposited on a slide made of some slick metal.  You
    descend rapidy, being abruptly slammed against the walls as the slide banks through several tight
    corners.  Ahead of you, approaching rapidly is a small point of light.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:305:room:30506
      look: You see a point of light..approaching fast!

"tba:305:room:30506":
  name: The Ledge
  description: >
    You pop out of the slide, sail through the air for several long moments, crash into the side of a
    cavern, and land on a ledge in a crumpled heap.  You slowly look upwards, and what you see astounds
    even you- a seasoned adventurer. You are in the north end of a perfectly square cavern with a floor
    composed of sixty-four alternating black and white marble tiles.  Giant torches line the walls, casting
    a dazzling glow over the entire room.  Standing guard over half the squares are giant carved wooden
    beings, looming and silent.  There is a neat wooden ladder beneath you, leading downward, and three
    quarters up the opposite wall is the small hole you just came flying out of.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:305:room:30507
      look: The ladder looks safe...kinda.

"tba:305:room:30507":
  name: The Ladder
  description: >
    You are on a simple wooden ladder, which has been bolted by means of small metal hooks to the
    cavern wall.  The ledge is above you, and the cavern floor is below you.  There is a small sign on the
    wall.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:305:room:30506
      look: The ledge is up there.
    down:
      to: tba:305:room:30512
      look: There is a large black tile down there.

