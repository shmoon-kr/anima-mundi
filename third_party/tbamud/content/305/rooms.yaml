"tba:305:room:30576":
  name: The Black Queen's Chamber
  description: >
    You are in a small chamber, containing only a bed, basin, mirror and braided rug.  Despite being
    very small, it looks comfortable enough to rest in for a bit.  As you seat yourself on the bed, you see
    a flicker of motion in the mirror..
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:305:room:30579
      look: You find a trapdoor under the bed!
      door:
        keywords: [trapdoor, trap]
        kind: door
        reset: closed
  extras:
  - keywords: [mirror]
    text: >
      The mirror is full of smoke!  As you gaze upon it, a face comes into focus. It appears to be a
      crazily laughing man dressed in bright clashing clothes.  He looks into your eyes and points downward. 
      "Come visit me, dearie..  ", he says with a cackle.  The image abruptly fades...

