"tba:305:room:30578":
  name: The Landing
  description: >
    You drop down from the trap-door, and land on soft dirt.  You seem to be inside some sort of
    enclave, and you see an underground river to the east. There is a small wooden dock extending from your
    enclave out into the river.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:305:room:30580
      look: There is a dock over there.

"tba:305:room:30579":
  name: The Landing
  description: >
    You drop down from the trap-door, and land on soft dirt.  You seem to be inside some sort of
    enclave, and you see an underground river to the west. There is a small wooden dock extending from your
    enclave out into the river.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:305:room:30581
      look: There is a dock over there.

"tba:305:room:30580":
  name: The Dock
  description: >
    As you step onto the dock, it sags crazily and settles more firmly into the river.  A sudden bright
    light shines out from upriver, blinding you momentarily.  The light approaches closer, and you
    realize that it is some strange form of boat.  It stops at the north side of the dock, ready to be boarded.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30582
    west:
      to: tba:305:room:30578

"tba:305:room:30581":
  name: The Dock
  description: >
    As you step onto the dock, it sags crazily and settles more firmly into the river.  A sudden bright
    light shines out from upriver, blinding you momentarily.  The light approaches closer, and you
    realize that it is some strange form of boat.  It stops at the north side of the dock, ready to be boarded.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30582
    east:
      to: tba:305:room:30579

"tba:305:room:30582":
  name: The Sulking Swan
  description: >
    The sulking swan is a large wooden craft, carved to the exact likeness of a swan.  Its wooden sides
    thump hollowly against the tunnel sides, as it bobs gently and begins to carry you downstream.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30583

"tba:305:room:30583":
  name: The Underground River
  description: >
    You bob along lazily in the strange craft, spinning in complete circles at points, but always
    headed downstream.  In the distance you see another dock.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30584

"tba:305:room:30584":
  name: Arrival
  description: >
    The Sulking Swan heads directly to its berth, lining up alongside the wooden platform.  Ropes move
    of their own accord, rising from the pilings and intertwining themselves with the boat's brass
    brackets.  It seems safe to step east onto the second dock, or you could just sit here and keep the boat
    company.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:305:room:30585

"tba:305:room:30585":
  name: The Second Dock
  description: >
    You decide that this dock is much sturdier than the first, and it feels quite nice to stand on firm
    ground again.  The boat is tied to the west, and a nice red wooden door waits expectantly at the
    east end of the dock- it seems to lead directly into the tunnel wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:305:room:30586
      look: There is a nice red door there.
      door:
        keywords: [door, red]
        kind: door
    west:
      to: tba:305:room:30584

"tba:305:room:30586":
  name: The Entrance Hall
  description: >
    You find yourself standing at the beginning of a giant entrance hall.  A fine red carpet leads
    north, and extravagant silks line the walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30587
    west:
      to: tba:305:room:30585

"tba:305:room:30587":
  name: The Entrance Hall
  description: >
    You are standing on a fine red carpet, halfway down the length of the entrance hall.  There is
    retreat to the south, and a giant throne to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:305:room:30588
    south:
      to: tba:305:room:30586

"tba:305:room:30588":
  name: The Joker's Throne
  description: >
    You stand before a giant throne, made entirely of fool's gold.  This seems to be the domain of the
    Joker- It may be wise to leave him to his games...
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:305:room:30587
