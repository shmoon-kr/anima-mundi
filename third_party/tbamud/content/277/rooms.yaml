# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 277.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:277:room:27700":
  name: A Dimly Lit Path
  description: >
    This dark path winds through a deep, black forest, tree branches waving silently in the mild air. 
    Ahead the lights and sounds of a peaceful village can be heard faintly, smells of farm animals and
    cooking food wafting on the breeze.
  sector: forest
  exits:
    north:
      to: tba:277:room:27701
      look: The dimly lit path leads north through the dense forest.
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           #SHOPS  (in merc format)
         QQ13 17  0  0  0  0 150 50  0 23       innkeeper
         QQ18 13  5 15  1 17 150 50  0 23       shopkeeper
         QQ19 13  5 15  1 17 150 50  0 23       grocer
         QQ20  9  5  0  0  0 150 50  0 23       blacksmith
         QQ30 17  0  0  0  0 150 50  0 23       innkeeper
        0
        #SPECIALS (in merc format)
        M  QQ00 spec_cast_mage          Wizard
        M  QQ01 spec_poison             keeper
        M  QQ10 spec_guard              shiriff
        M  QQ11 spec_guard              shiriff
        M  QQ12 spec_guard              Thain
        M  QQ16 spec_cast_mage          elf
        M  QQ17 spec_cast_mage          dwarf
        M  QQ21 spec_guard              battlemaster
        M  QQ22 spec_thief              youth
        M  QQ32 spec_guard              shiriff
        S
        This is the classic Shire area. It is in a mixed format, part Merc 2.2, part standard Diku.
        Links
        50u

"tba:277:room:27701":
  name: A Dimly Lit Path
  description: >
    This little winding path is not lit very well, dim shadows looming from the deep, dark forest all
    around.  The bustling sounds of people and the workings of a little village can be heard coming from
    the north, the light shining brighter from that direction.
  sector: forest
  exits:
    north:
      to: tba:277:room:27702
      look: The dimly lit path leads north through the dense forest.
    south:
      to: tba:277:room:27700
      look: The dimly lit path leads south through the dense forest.

"tba:277:room:27702":
  name: A Dimly Lit Path
  description: >
    The forest seems fairly sparse here, growing denser to the south and less so to the north.  Waving
    shadows dance across the ongoing path, growing less and less noticeable as the radiating light from
    the northern village increases.
  sector: forest
  exits:
    north:
      to: tba:277:room:27703
      look: The dimly lit path leads to a village.
    south:
      to: tba:277:room:27701
      look: The dimly lit path leads south through the dense forest.

"tba:277:room:27703":
  name: Entrance to the Shire
  description: >
    The green Shire looms ahead, little halflings scurrying here and there amongst peaceful animals and
    gently waving crops.  Lush grasses thrive here, wisps of smoke unfurling from the tiny embedded
    chimneys in the hillsides. Bywater road can be seen travelling from east to west.
  sector: city
  exits:
    east:
      to: tba:277:room:27704
      look: To the east runs Bywater Road.
    south:
      to: tba:277:room:27702
      look: To the south you see a dimly lit path which leads to a dense forest.
    west:
      to: tba:277:room:27718
      look: To the west runs Bywater Road.

"tba:277:room:27704":
  name: Bywater Road
  description: >
    This road continues on to the east, the busiest street in all of Shiredom, well evidenced by the
    worn surface, smoothed by the constant travels of hobbit feet.  Much of the lush, flourishing Shire
    stretches to the west, and a little general store stands to the north.
  sector: city
  exits:
    north:
      to: tba:277:room:27705
      look: The general store lies to the north.
    east:
      to: tba:277:room:27706
      look: To the east runs Bywater Road.
    west:
      to: tba:277:room:27703
      look: To the west you see the entrance to the Shire.

"tba:277:room:27705":
  name: The General Store
  description: >
    This is the general store of the Shire, the many wooden shelves stacked full with various items of
    usefulness and other goodies.  The smell of pipeweed lingers warmly in the air, along with
    miscellaneous spices from some nearby cooking.  The only exit is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:277:room:27704
      look: The only exit lies to the south.

"tba:277:room:27706":
  name: Bywater Road
  description: >
    Bywater Road continues peacefully on to both the east and west, murmuring sounds of Shire life
    breaking the quietness.  A few wooden steps lead to the north and a little blacksmith's shop there, while
    to the south lies a pleasant looking nursery.
  sector: city
  exits:
    north:
      to: tba:277:room:27707
      look: Steps lead to a friendly looking weaponry and armory.
    east:
      to: tba:277:room:27709
      look: To the east runs Bywater Road.
    south:
      to: tba:277:room:27708
      look: To the south lies Kid'n Keep, the local nursery.
    west:
      to: tba:277:room:27704
      look: To the west runs Bywater Road.

"tba:277:room:27707":
  name: The House of Arms
  description: >
    Here is the finest weapons and armor shop in all of Shiredom, many fine daggers and other blades
    displayed proudly along the walls and within various cabinets.  A few humble pieces of armor can be
    seen, most in fine shape although they look rarely used.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:277:room:27706
      look: The only exit lies to the south.

"tba:277:room:27708":
  name: Kid'n Keep
  description: >
    This one-stop nursery appears to be a convienient place for Shire parents to leave their children
    in safekeeping.  The sounds of children's giggling fills the air while the nursemaids can be heard
    sighing in exasperation.  Little wooden toys scattered across the floor where little feet have kicked
    them in their haste to run around and play.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27706
      look: The only exit lies to the north.

"tba:277:room:27709":
  name: A Bend in the Road
  description: >
    Bywater Road curves around from the west to the south, tall crops and various orchard trees filling
    the air with the scent of plant life, as well as the buzzing of various bees about their work.  A
    large, imposing building lies to the east and a homey looking Inn stands further to the south.
  sector: city
  exits:
    north:
      to: tba:277:room:27758
    east:
      to: tba:277:room:27710
      look: A large, imposing building lies to the east.  A sign reads 'Shiriff Post'.
    south:
      to: tba:277:room:27712
      look: To the south runs Bywater Road.
    west:
      to: tba:277:room:27706
      look: To the west runs Bywater Road.

"tba:277:room:27710":
  name: Shiriff Post of the Eastern Shire
  description: >
    This formally furnished building is the Shiriff Post which acts as the nucleus for the three
    shiriffs of the Eastern Shire.  Rich, warm hues of polished wood make the place seem welcoming, despite its
    stern purpose of keeping the local law in place.  A door offers passage to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:277:room:27711
      look: A door offers passage to the office of the Thain.
      door:
        keywords: [door]
        kind: door
    west:
      to: tba:277:room:27709
      look: To the west you can see Bywater Road.

"tba:277:room:27711":
  name: Thain's Office
  description: >
    This is the office of the Thain, the police protectorate of the great Shire. Brightly lit, and well
    built from the finest rich woods, this building has an air of importance and respect not common to
    hobbit dwellings.  An open window allows fresh green-scented air to flow in, a door to the west
    leading the way to the Shiriff Post.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:277:room:27710
      look: A door offers passage to the Shiriff Post.
      door:
        keywords: [door]
        kind: door

"tba:277:room:27712":
  name: Bywater Road
  description: >
    Bywater Road runs from north to south, little dust clouds kicking up as the air wafts lazily about,
    carrying golden scents of honeysuckle and luscious ripe fruits.  Bright pollen sparkles here and
    there like tiny fireflies dancing in the breeze.  The sounds of an instructor's monotone voice can be
    heard faintly, perhaps from the grounds to the east.
  sector: city
  exits:
    north:
      to: tba:277:room:27709
      look: To the north runs Bywater Road.
    east:
      to: tba:277:room:27717
      look: The Shiriff Training Grounds lies to the east.
    south:
      to: tba:277:room:27713
      look: To the south runs Bywater Road.

"tba:277:room:27713":
  name: Bywater Road
  description: >
    Stretching lazily to the north, Bywater Road continues on, offering easy passage through much of
    Shiredom.  Strong smells of baking and frying mushrooms permeate the air from the residences to the
    east and west.  To the south, the Ivy Bush inn stands, much fabled for its hospitality and services.
  sector: city
  exits:
    north:
      to: tba:277:room:27712
      look: To the north runs Bywater Road.
    east:
      to: tba:277:room:27715
      look: You spy the private dwelling of a Shire folk to the east.
    south:
      to: tba:277:room:27716
      look: >
        To the south you see the Ivy Bush, a favorite haunt of Shire urbanites and seasoned travelers.
    west:
      to: tba:277:room:27714
      look: You spy the private dwelling of a Shire folk to the west.

"tba:277:room:27714":
  name: A Smial
  description: >
    This humble smial is basically a hole in the ground which serves as the proper dwelling place for
    halflings.  Little round windows allow a view of the green Shirelands outside, the curving walls and
    gentle colors making this home a very restful place to be in.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:277:room:27713
      look: The only exit lies to the east.

"tba:277:room:27715":
  name: A Smial
  description: >
    This little round hobbit dwelling is warm and cozy, welcoming colors and comfortably padded wooden
    furniture making it a most hospitable place.  Gentle heat wafts from a flickering fireplace, the
    smells of some savoury stew filling the room deliciously.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:277:room:27713
      look: The only exit lies to the west.

"tba:277:room:27716":
  name: The Ivy Bush
  description: >
    This is the much loved Ivy Bush, one of the most famous inns in all of Shiredom.  Local folk and
    seasoned travelers alike fill the confines of the room with gay and lively talk.  Hearty laughter
    echoes off the rounded walls, and the high notes of inebriated hobbits singing from time to time.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27713
      look: The only exit lies to the north.

"tba:277:room:27717":
  name: Shiriff Training Grounds
  description: >
    The sounds of mock battle and feigned death cries echo loudly around this place, clanging of
    weapons and scuffling as young halflings train in defense. The ground is grassless and muddy where
    grappling hobbits have worn away the grass, the air saturated with the smell of sweat.
  sector: inside
  exits:
    west:
      to: tba:277:room:27712
      look: The only exit lies to the west.

"tba:277:room:27718":
  name: Bywater Road
  description: >
    This long dusty road continues unbroken to the east and to the west, straggling bits of grass and
    plantlife gradually pushing at the borders as they flourish.  Cattle can be seen grazing lazily
    amongst the fields, small rabbits and other creatures scurrying about obliviously.
  sector: city
  exits:
    east:
      to: tba:277:room:27703
      look: To the east you see the entrance to the Shire.
    south:
      to: tba:277:room:27719
      look: A large, imposing building lies to the south.  A sign reads 'Shiriff Post'.
    west:
      to: tba:277:room:27720
      look: To the west runs Bywater Road.

"tba:277:room:27719":
  name: Shiriff Post of the Bridge
  description: >
    This old looking building is made with darkly-stained wood, several small windows allowing an
    unblocked watch of the road for the Shiriffs on duty.  The clear Brandywine River can be seen gurgling
    smoothly past, tall reeds swaying gently beside it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27718
      look: The only exit is to the north.

"tba:277:room:27720":
  name: Bywater Road
  description: >
    A little stone bridge lies to the north, intersecting with this long east to west road.  The ruts
    of wagon wheels line the path here as though this section is well travelled, a small grocery shop to
    the south catering to hungry venturers.
  sector: city
  exits:
    north:
      to: tba:277:room:27731
      look: Brandywine Bridge offers safe passage across the tumultuous river.
    east:
      to: tba:277:room:27718
      look: To the east runs Bywater Road.
    south:
      to: tba:277:room:27721
      look: You see the Grocer's Delight to the south.
    west:
      to: tba:277:room:27722
      look: To the west runs Bywater Road.

"tba:277:room:27721":
  name: The Grocer's Delight
  description: >
    Tempting scents of newly baked goods fill the air, brightly colored fruits and vegetables
    glistening in neatly lined baskets.  Various dried meats hang on metal hooks against the wall, salted pork and
    beef jerky amongst them.  A small section is set aside for the locally made treats; apple tarts and
    hard toffees set just high enough to escape little hobbit childrens reach.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27720
      look: The only exit is to the north.

"tba:277:room:27722":
  name: Bywater Road
  description: >
    A gentle green hill can be seen rising to the west, the crystal blue Brandywine River winding
    through the land to the north.  The air is crisp and slightly moist, the only sounds the babbling river
    and louder trickling from a southern watermill.
  sector: city
  exits:
    east:
      to: tba:277:room:27720
      look: To the east runs Bywater Road.
    south:
      to: tba:277:room:27723
      look: An entrance to the watermill lies to the south.
    west:
      to: tba:277:room:27726
      look: A small hill to the west blocks your view.

"tba:277:room:27723":
  name: Entrance to a Watermill
  description: >
    This large watermill seems quite busy, sounds of bustling workers and the creaking of the mill
    itself breaking the characteristic serenity of this place. Rough, red stones make up the majority of the
    structure, emanating a cool dampness.
  sector: inside
  exits:
    north:
      to: tba:277:room:27722
      look: You see Bywater Road to the north.
    south:
      to: tba:277:room:27724
      look: A watermill meets your gaze.

"tba:277:room:27724":
  name: The Watermill
  description: >
    Slightly messy with scattered objects and tools in use, this part of the mill is loud with the
    sound of scurrying workers and the splashing of continuously churning water.  The air is cold and wet, a
    slight film of moisture clinging to most of the stone surfaces.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27723
      look: You see the entrance.
    south:
      to: tba:277:room:27725
      look: A wooden door leads to the rear of the watermill.
      door:
        keywords: [door]
        kind: door

"tba:277:room:27725":
  name: Back of the Watermill
  description: >
    This damp, dimly let room is quite chilled, mildew and various moulds staining the curving stony
    walls.  The place is slightly grimy where water has mixed with dust, the sound of miserable dripping
    echoing in the empty space, apparently abandoned for the most part.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27724
      look: A watermill meets your gaze.
    down:
      to: tba:277:room:27746
      look: A hidden portal reveals a passageway down.

"tba:277:room:27726":
  name: Took Hill
  description: >
    Here at the peak of Took Hill almost all of the Shire can be seen, vibrant green and sparkling with
    fresh floating pollen.  Clear water trickles lazily by, small animals scurrying past to lap at the
    pure Brandwine water, larger cattle and deer peacefully grazing in the far stretching fields.  Sounds
    of joyful celebration can be heard coming from the west, wisps of smoke unfurling like banners on the
    horizon.
  sector: hills
  exits:
    east:
      to: tba:277:room:27722
      look: To the east runs Bywater Road.
    west:
      to: tba:277:room:27728
      look: You see a grassy field to the west.

"tba:277:room:27727":
  name: Northern End of a Grassy Field
  description: >
    Green grasses ripple gently like the waves of an ocean as the breeze flows serenly past.  Splashes
    of white and yellow stand out brightly where patches of clover and daisies grow, puffy dandelion
    heads explode into seedlings, sending miniature twirling parachutes through the air.
  sector: field
  exits:
    south:
      to: tba:277:room:27728
      look: You see a grassy field.

"tba:277:room:27728":
  name: A Grassy Field
  description: >
    This large field is festively decorated, great tables of food spread out and colorful banners
    strewn about the trees.  It seems to be a birthday party judging by the joyful chants and songs that
    spontaneously erupt, filling the air with the sound of laughter and merriment.
  sector: field
  exits:
    north:
      to: tba:277:room:27727
      look: You see a grassy field.
    east:
      to: tba:277:room:27726
      look: A small hill to the east blocks your view.
    south:
      to: tba:277:room:27729
      look: You see a grassy field.
    west:
      to: tba:277:room:27730
      look: You see a grassy field.

"tba:277:room:27729":
  name: Southern End of a Grassy Field
  description: >
    Little flowers and grasses flourish peacefully here, the sounds of music and clapping coming from
    the north.  Little pieces of colored party confetti floats in the breeze along with the seedlings,
    smells of fresh cooking and baking saturating the air.
  sector: field
  exits:
    north:
      to: tba:277:room:27728
      look: You see a grassy field.

"tba:277:room:27730":
  name: Western End of a Grassy Field
  description: >
    Glistening green grass is dotted here and there with splashes of yellow clover and vibrant red
    poppies dancing in the breeze.  The sounds of partying and joyful shouts fill the air, several tables
    laid out to the east and the smell of all sorts of food wafting temptingly.
  sector: field
  exits:
    east:
      to: tba:277:room:27728
      look: You see a grassy field.

"tba:277:room:27731":
  name: Brandywine Bridge
  description: >
    The clear water of the Brandywine River flows beneath this solidly built bridge, bright colored
    fish swiming with the current.  The cool water looks invitingly refreshing, pale smooth pebbles lining
    the ground beneath and tall reeds bending in the breeze, caressing the water as it rushes past. 
    Delving Lane extends to the north, while Bywater Road can be seen to the south.
  sector: city
  exits:
    north:
      to: tba:277:room:27732
      look: You see Delving Lane.
    south:
      to: tba:277:room:27720
      look: To the south runs Bywater Road.

"tba:277:room:27732":
  name: Delving Lane
  description: >
    Delving Lane runs north and south in this small borough of the Shire.  To the south stands
    Brandywine Bridge.  The Green Dragon, the undisputed leader in the art of innkeeping, offers rest and comfort
    to the east.  Little fireflies dance in clusters here beneath the larger trees, glowing lights
    winking in and out of exis tance from the shadows.
  sector: city
  exits:
    north:
      to: tba:277:room:27733
      look: You see Delving Lane.
    east:
      to: tba:277:room:27744
      look: The Green Dragon offers food, drink, and above all hospitality for mere gold.
    south:
      to: tba:277:room:27731
      look: Brandywine Bridge offers safe passage across the tumultuous river.

"tba:277:room:27733":
  name: Delving Lane
  description: >
    Delving Lane continues from north to south, a large building lying to the east.  The road is gently
    paved here, cobbled stone carefully laid to ease the passage of riders and wagons.  An unpleasant
    smell lingers in the air of various farm animals, the sounds of braying and mooing coming from the west.
  sector: city
  exits:
    north:
      to: tba:277:room:27734
      look: You see Delving Lane.
    east:
      to: tba:277:room:27745
      look: A large, imposing building lies to the east.  A sign reads 'Shiriff Post'.
    south:
      to: tba:277:room:27732
      look: You see Delving Lane.
    west:
      to: tba:277:room:27738
      look: You see a grassy field.

"tba:277:room:27734":
  name: Delving Lane
  description: >
    Stretching to the north and the south, Delving Lane is well-tended, beautiful flowers of various
    colors blooming on either side, and large trees lining the path, shading it with long graceful
    branches.  Little sunflower seeds lie scattered around, as if some traveller stopped for a brief snack.
  sector: city
  exits:
    north:
      to: tba:277:room:27735
      look: >
        A large, magnificent house meets your steady gaze.  Above the round door a sign reads 'Bag End'.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:277:room:27733
      look: You see Delving Lane.

"tba:277:room:27735":
  name: Bag End
  description: >
    This home looks comfortable and well-furnished, a palace by humble halfling standards.  On the
    wall, a banner reads "Home Sweet Home", and various drawings of maps can be seen pinned here and there. 
    A solid oak door to the east leads to a pantry, while a cozy bedroom lies to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:277:room:27737
      look: Through the keyhole you see what looks like a well stocked pantry.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:277:room:27734
      look: You see Delving Lane.
    west:
      to: tba:277:room:27736
      look: You see a bedroom.  It looks like the beds have recently been slept in.

"tba:277:room:27736":
  name: Bedroom
  description: >
    This private bedroom is sufficiently grand to give the impression that the owner is one of
    considerable wealth.  There are two beds to the side, neither of which are made, and portraits of halflings
    hang on the wall, apparently the likenesses of a long family line of distinguished hobbits.  A cozy
    flame flickers in the stone fireplace, keeping the room warm and comfortable.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:277:room:27735
      look: Through the doorway you see the main room of Bag End.

"tba:277:room:27737":
  name: Pantry
  description: >
    This large pantry is stocked with large shelves full of food and drink on all sides, substantial
    amounts even for a halfling to eat.  There is an eerie feeling of some unnatural magic in this part of
    the house, a slight chill to the atmosphere, and occasionally it seems as though the floor creaks of
    its own accord.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:277:room:27735
      look: Beyond the door you see the main room of Bag End.
      door:
        keywords: [door]
        kind: door
    down:
      to: tba:277:room:27756
      look: It's anyone's guess as to where the trapdoor leads.

"tba:277:room:27738":
  name: A Grassy Field
  description: >
    This large grazing field is peaceful and almost wholly untouched by gardening hands.  The grass has
    been left to grow wild and plentiful, kept trimmed by the constant munching of the various cattle
    animals here.  The smell of a pig pen is unmistakeable in the air, sounds of scuffling and grunts
    coming from the south.
  sector: field
  exits:
    north:
      to: tba:277:room:27742
      look: You see a large barn.
    east:
      to: tba:277:room:27733
      look: You see Delving Lane.
    south:
      to: tba:277:room:27739
      look: A rather large pig pen is to the south.

"tba:277:room:27739":
  name: Pig Pen
  description: >
    The ground here is thick and muddy, sticking slickly to everything it touches.  Various slops and
    leftovers have been spilt on the ground, being scavenged and trodden into the mud by the resident farm
    animals, their smell hanging rankly in the air.
  sector: city
  exits:
    north:
      to: tba:277:room:27738
      look: You see a grassy field.
    west:
      to: tba:277:room:27740
      look: A small path winds its way eastward.

"tba:277:room:27740":
  name: A Stony Path
  description: >
    Little colored pebbles have been embedded in this bumpy little path that winds through the grass. 
    A small residence can be seen at the northern end of the trail.  The rest of the land seemingly left
    to the farm animals, the noisy din of pigs grunting and scuffling coming from the east.
  sector: city
  exits:
    north:
      to: tba:277:room:27741
      look: To the north you see a modest house.
    east:
      to: tba:277:room:27739
      look: A rather large pig pen is to the east.

"tba:277:room:27741":
  name: Gamgee Residence
  description: >
    This modest home appears to be the house of whomever owns the surrounding lands.  The air is
    somewhat musty and the smell is reminiscent of a stable.  In fact, in comparison to the urban riches of the
    Shire proper, this is little more than a shack.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:277:room:27740
      look: You see a small path winding its way southward.

"tba:277:room:27742":
  name: A Barn
  description: >
    This cozy barn is warm with the heat of the resident animals here, although unfortunately the smell
    lingers along with them.  The atmosphere is restful and feels very safe, as though nothing bad in
    the world could touch these garden-like lands.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:277:room:27743
      look: You see a chicken coop to the north.
    south:
      to: tba:277:room:27738
      look: You see a grassy field.

"tba:277:room:27743":
  name: A Chicken Coop
  description: >
    This moderately sized coop is filled with wafting white feathers and the scattered corn for the
    feeding chickens.  The sound of clucking and claws scratching at ground can be heard continuously as the
    resident animals go about their normal living.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:277:room:27742
      look: You see a large barn.

"tba:277:room:27744":
  name: The Green Dragon
  description: >
    This lively inn is the Green Dragon, the undisputed leader in the art of innkeeping.  The air is
    filled with the sounds of clinking glasses and laughter, animated conversations and tales of great and
    seasoned adventurers mix with the constant murmur of local gossip.  A flickering fire lights the
    place with a gentle glow, warming it cozily and providing a center of gathering for the joyful
    storytellers.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:277:room:27732
      look: You see Delving Lane.
    up:
      to: tba:277:room:27757
      look: You see the reception.

"tba:277:room:27745":
  name: Shiriff Post of Delving Lane
  description: >
    You are in the Shiriff Post which acts as the nucleus for the three shiriffs of Delving Lane.  As
    you examine the shiriffs on duty, you come to realize that the halflings of the Shire are not to be
    reckoned with.  You cower with awe.  The only exit is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:277:room:27733
      look: You see Delving Lane.

"tba:277:room:27746":
  name: A Dark Tunnel
  description: >
    This cramped underground tunnel is dark and stifling, the miserable sound of dripping echoes along
    the stoney walls, and perhaps the sound of faint whipsering.  Bone-chillingly cold, this passage
    seems to actively discourage travellers from continuing further.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:277:room:27747
      look: You see a dark tunnel.
    up:
      to: tba:277:room:27725
      look: You see a portal which leads to a small room.

"tba:277:room:27747":
  name: Smuggler's Storage
  description: >
    The cavern opens widely here, allowing room for the many storage materials that lie scattered
    around.  The place seems to echo with random scuffling and scurrying sounds, as it would if infested with
    rats; although the noises are somewhat too loud.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:277:room:27748
      look: You see a dark tunnel.
    west:
      to: tba:277:room:27746
      look: You see a dark tunnel.

"tba:277:room:27748":
  name: Smuggler's Storage
  description: >
    The jagged walls lean closely in, dark shadows flickering subtly in the thin beams of light that
    pierce from the west.  Rivulets of cold water trickle lazily along the stone, mixing with the dust to
    create a layer of slippery mud.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:277:room:27749
      look: You see a dark tunnel.
    west:
      to: tba:277:room:27747
      look: You see a dark tunnel.

"tba:277:room:27749":
  name: A Three-way Intersection
  description: >
    In the darkness, three yawning openings can be seen, each looking as damp and cold as the others,
    although the sounds of scurrying seem to grow louder to the north, the path perhaps a little lighter
    to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:277:room:27751
      look: You see a dark tunnel.
    east:
      to: tba:277:room:27750
      look: You see a dark tunnel.
    west:
      to: tba:277:room:27748
      look: You see a dark tunnel.

"tba:277:room:27750":
  name: End of a Dark Tunnel
  description: >
    The cavernous tunnel comes abruptly to an end, this small room cloaked in almost absolute darkness
    and musty with dampness and age.  The black floor is slick with mud and various slimes, sticky
    cobwebs clinging to every dreary surface.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:277:room:27749
      look: You see a dark tunnel.

"tba:277:room:27751":
  name: A dark tunnel
  description: >
    You stand inside a small underground tunnel.  The ceiling is so low that you must crouch to avoid
    hitting your head.  The tunnel continues north and south.  To the west you see a Shirriff Post while
    to the east lies a small home.  All you can see is darkness.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:277:room:27752
      look: You see a dark tunnel.
    east:
      to: tba:277:room:27754
      look: You see a halfling hole.
    south:
      to: tba:277:room:27749
      look: You see a dark tunnel.
    west:
      to: tba:277:room:27753
      look: Above a great oak door you see a sign which reads 'Shirriff Post'.

"tba:277:room:27752":
  name: A dark tunnel
  description: >
    You stand inside a small underground tunnel.  The ceiling is so low that you must crouch to avoid
    hitting your head.  The tunnel continues north and south.  To the west lies a small home.  All you can
    see is darkness.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:277:room:27756
      look: You see a dark tunnel.
    south:
      to: tba:277:room:27751
      look: You see a dark tunnel.
    west:
      to: tba:277:room:27755
      look: You see a halfling hole.

"tba:277:room:27753":
  name: Shiriff Post of the Lower Shire
  description: >
    You are in the shiriff Post which acts as the nucleus for the three shiriffs of the Lower Shire. 
    As you examine the shiriffs on duty, you come to realize that the halflings of the Shire are not to be
    reckoned with.  You cower with awe.  The only exit is to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:277:room:27751
      look: You see a dark tunnel.

"tba:277:room:27754":
  name: A halfling hole
  description: >
    You stand inside a rather crudely built halfling hole.  The many passageways and winding paths
    remind you of a rodent's lair.  The air is musty and damp and you feel the need for fresh air.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:277:room:27751
      look: You see a dark tunnel.

"tba:277:room:27755":
  name: A halfling hole
  description: >
    You stand inside a rather crudely built halfling hole.  The many passageways and winding paths
    remind you of a rodent's lair.  The air is musty and damp and you feel the need for fresh air.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:277:room:27752
      look: You see a dark tunnel.

"tba:277:room:27756":
  name: End of a dark tunnel
  description: >
    You are at one end of a dark tunnel.  The tunnel continues to the south while on the ceiling you
    can make out a trapdoor.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:277:room:27752
      look: You see a dark tunnel.
    up:
      to: tba:277:room:27737
      look: A trapdoor on the ceiling reveals a passageway.

"tba:277:room:27757":
  name: The Inn of the Green Dragon
  description: >
    You are standing in the Inn of the Green dragon.  Large paintings of halflings at work, and
    halflings at play adorn the walls.  Comfortable benches and seats line the walls.  A stairway leads down.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    down:
      to: tba:277:room:27744

"tba:277:room:27758":
  name: The Tailor's
  description: >
    Yards of various types of fabric are spread carefully out for display, examples of handsewn gowns
    and garments hanging from the ceiling or modelled by wooden stick figures.  Baskets of different
    colored threads and ribbons sit on a table in the center of the room, allowing the buyer to choose exactly
    what they want.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:277:room:27709
