# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 290.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:290:room:29000":
  name: The Entrance To The Lizard Lair Safari
  description: >
    This is the opulent entrance to the exciting Lizard Lair Safari Park. Around you stand many other
    adventurers awaiting their chance to try their luck in the quest set before them.  And you.  This
    quest consists of the recovery of the Golden treasure in the depths of the lair of the lizardmen.  If you
    wish to test your luck, you can push your way through the exit to the south...  If not, you can
    leave the Safari Park to the east.  There is a large sign here.
  sector: hills
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:290:room:29017
      look: The Real World is to the east.
    south:
      to: tba:290:room:29001
      look: The quest begins to the south.
  extras:
  - keywords: [sign, large]
    text:
    - "The sign reads as follows:"
    - This area is not suggested if your character is less than 15th level
    - since there are several tough aggressive monsters.  There are one or
    - two essential skills to have... either a knock spell or item, or the
    - ability to pick locks.  If you are LUCKY you might find
    - an item to open locks....
    - Matrix
  - keywords: [credits, info]
    text: >
      The Lizard Lair Safari by Matrix and The Wandering Bard * Copyright 1994 by Curious Areas Workshop
      * The Lizard Lair Safari was originally merely the example area included with the Builders' Handbook,
      but since so many people use it, it was decided to release the area in its own right. * The lair
      consists of 18 rooms.  Edit the following room: #17 (exit north to the rest of the world) * The mobs in
      this area were built on a -100 (good) to 100 (bad) armor class range.  Remove the extra '0' if you
      don't need/want it. * Credits THANKS TO: C.A.W. for examples of areas. Builder_5 for the original Diku
      Builders' Handbook. VieMud (viemud.org 4000) for giving us a chance, and another, and... Links: 17

"tba:290:room:29001":
  name: The Quest Preparation Room
  description: >
    In this room are various items of preparation for the upkeep of the quest. A guide explains to you
    what the object is: To get the gold.  Looking around, you see that the exit to the north has
    disappeared and you are left with only the one exit down...  Into the water.  As you ready yourself to begin
    the quest, the guide gives you a potion and tells you to quaff it.  You do so and feel like your
    movements are easier, and much more free.  The guide suddenly vanishes and you begin the quest.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    down:
      to: tba:290:room:29002
      look: The water below you looks rather ominous.

"tba:290:room:29002":
  name: A Tunnel
  description: >
    This tunnel is filled with water and your light sheds all of the light that gives you visibility
    here.  There are two exits.  One is to the east and one above you.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    north:
      to: tba:290:room:29016
      look: A LUCKY blocks your view of whatever is north.
      door:
        keywords: [lucky]
        kind: door
        reset: closed
    east:
      to: tba:290:room:29003
      look: The tunnel stretches off to the east.
    up:
      to: tba:290:room:29015
      look: The quest preparation room is above you.

"tba:290:room:29003":
  name: A Tunnel
  description: >
    This tunnel is filled with water.  There are exits to the east and west. The tunnel stretches off
    in both directions.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:290:room:29004
      look: The tunnel stretches off to the east.
    west:
      to: tba:290:room:29002
      look: The tunnel stretches off to the west.

"tba:290:room:29004":
  name: A Tunnel
  description: >
    The tunnel comes to an abrupt end as there is a rock wall right in front of you.  Fortunately,
    there are two exits, one to the west and one through a hole in the floor.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    west:
      to: tba:290:room:29003
      look: The tunnel stretches off to the west.
    down:
      to: tba:290:room:29005
      look: There is a hole in the floor leading down.
  extras:
  - keywords: [hole]
    text: The hole leads down.

"tba:290:room:29005":
  name: Tunnel End
  description: The tunnel ends here.  There is a hole in the ceiling and a large door to the west.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    west:
      to: tba:290:room:29006
      look: There is a door here.
      door:
        keywords: [door]
        kind: door
        key: tba:290:obj:29008
        reset: locked
    up:
      to: tba:290:room:29004
      look: There is a hole in the ceiling leading up.
  extras:
  - keywords: [hole]
    text: The hole leads up.  Big surprise since you've already seen it.
  - keywords: [door]
    text: You have to be able to Pick or Knock this door open, unless you got LUCKY.

"tba:290:room:29006":
  name: The Conjuring Chamber
  description: >
    This large room is dominated by a whirlpool.  There are two exits.  To the east you can see a door
    and to the west you can see a waterfilled hallway stretching off.  The whirlpool is threatening to
    pull you down, but you are certain that you would drown in it.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    north:
      to: tba:290:room:29018
      look: There is a strange store that seems suspiciously out of place just to the north.
    east:
      to: tba:290:room:29005
      look: A door blocks your way, unless it is open in which case it doesn't block your way.
      door:
        keywords: [door]
        kind: door
        key: tba:290:obj:29008
        reset: locked
    west:
      to: tba:290:room:29008
      look: A hallway begins to move to the east.
    down:
      to: tba:290:room:29007
      look: The whirlpool is threatening to pull you down to your death.
  extras:
  - keywords: [door]
    text: This is a big door, but not as big as it looked from the other side.
  - keywords: [whirlpool]
    text: This just looks scary and EXTREMELY dangerous.

"tba:290:room:29007":
  name: The Whirlpool
  description: It was not a good idea to come here.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:290:room:29006

"tba:290:room:29008":
  name: A Hallway
  description: >
    The hallway naturally twists so that is seems to head east and down, but the hallway doesn't seem
    to be curved or bent in any way.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:290:room:29006
      look: There is a large room to the east.
    down:
      to: tba:290:room:29009
      look: The hallway continues to the south... er... below.
  extras:
  - keywords: [hallway, hall]
    text: It is dead straight but it goes down and east...  M.  C.  Escher has struck again!

"tba:290:room:29009":
  name: A Hallway
  description: The hallway here is bent in a big way.  It goes up and east.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:290:room:29011
      look: There is a large chamber to the east.
    up:
      to: tba:290:room:29008
      look: The hall continues up.
  extras:
  - keywords: [hallway, hall]
    text: This hall is BENT!

"tba:290:room:29010":
  name: A Completely Useless Room
  description: >
    This is a room to keep the continuity going of the numbering system.  Other than that it serves no
    purpose.  This area was conceived and built by Matrix of The Curious Area Workshop If you have
    questions or complaints please contact <fletcher@cspo.queensu.ca>
  sector: inside

"tba:290:room:29011":
  name: The Throne Room Annex
  description: >
    This is the entrance to the Throne room which lies to the east.  A hall leads off to the west.  The
    room is lavishly decorated but there is not much to see.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:290:room:29012
      look: The Throne Room looms to the east.
    west:
      to: tba:290:room:29009
      look: A hall looms to the west.
  extras:
  - keywords: [loom]
    text: What a descriptive word that is.  Loom.

"tba:290:room:29012":
  name: Throne Room
  description: >
    This large room is rather large.  A throne sits on the east wall below a hole in the ceiling.  The
    throne almost dominates the room.  No one is sitting in it.  The wall is decorated to look like
    pillars surround the room.  The annex is to the west whilst you are not sure what is above.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    west:
      to: tba:290:room:29011
      look: The Throne Room Annex is to the west.
    up:
      to: tba:290:room:29013
      look: You can't see what is above this room.
  extras:
  - keywords: [throne]
    text: >
      This is a large ugly thing that you are repulsed by.  You can think of no conceivable reason why
      the lizardmen keep it here.
  - keywords: [pillars, wall]
    text: What a useless concept.  Why didn't the designer just put actual pillars in?

"tba:290:room:29013":
  name: Temple Of Morgash
  description: >
    This is the temple to the Lizardmen's evil deity, Morgash.  It is quite ugly.  At least in your
    opinion it is...  You are certain that the lizardmen like it though.  There are two exits.  Down and
    through the large door to the east.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    east:
      to: tba:290:room:29014
      look: A large door blocks your way.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:290:obj:29005
        reset: locked
    down:
      to: tba:290:room:29012
      look: There is a hole leading down.  Obvious eh?
  extras:
  - keywords: [door]
    text: It is quite large with a small keyhole.

"tba:290:room:29014":
  name: Quest End
  description: >
    You have completed the quest!  CONGRATULATIONS!!  There are two exits back into the quest through
    the door and back to the outer world which lies to the east.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:290:room:29017
      look: The way back to te real world is to the east.
    west:
      to: tba:290:room:29013
      look: The quest is back to the west.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:290:obj:29001
        reset: locked

"tba:290:room:29015":
  name: Quest Preparation Room
  description: This room is exactly as you left it.  One exit...  Down...
  sector: inside
  flags: [no_mob, indoors]
  exits:
    down:
      to: tba:290:room:29002
      look: The water below still looks ominous.

"tba:290:room:29016":
  name: LUCKY
  description: >
    This room is empty.  There is a LUCKY blocking your way to the south. There is a sign on the wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:290:room:29002
      look: The is a LUCKY blocking your view.
      door:
        keywords: [lucky]
        kind: door
        reset: closed
  extras:
  - keywords: [sign]
    text: "The sign says: Boy are you ever LUCKY!!!!"

"tba:290:room:29017":
  name: The Real World Ends Here
  description: >
    This is the point where the real world ends...  PROCEED AT YOUR OWN RISK! The entrance to the
    Lizard Lair Safari is to the west.
  sector: inside
  exits:
    west:
      to: tba:290:room:29000
      look: This is the entrance way to the Safari.
  extras:
  - keywords: [door, metal, huge]
    text: It's one of those huge studio-like doors.  It seems pretty strong.

"tba:290:room:29018":
  name: Mr. Hooper's store
  description: >
    This is your friendly neighbourhood convenience store and restaurant. There are many interesting
    things that you can buy here.
  sector: city
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:290:room:29006
      look: The conjuring chamber is still to the south.
  extras:
  - keywords: [counter]
    text: The counter is nice and clean.  Mr.  Hooper looks at you expectantly.
