"tba:36:room:3600":
  name: The Great Chessboard Of Midgaard
  description:
  - >
    You stand in the archway of the Chessboard of Midgaard.  The giant wooden gate is rusted open.
  - >
    A narrow dirt path leads eastwards into the thick grass and the chessboard opens up to the west.
  sector: city
  flags: [no_mob]
  exits:
    east:
      to: tba:30:room:3066
      look: A dirt path leads away through the great field north of Midgaard.
    west:
      to: tba:36:room:3632
      look: The huge chessboard opens up to the west.

