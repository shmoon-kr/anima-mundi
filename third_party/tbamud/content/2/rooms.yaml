# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 2.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:2:room:200":
  name: The Northern Road
  description: >
    This seems to be the middle of a very mysterious looking road.  Everything to the east appears to
    be dark and gloomy, giving off the impression that maybe travelers would better avoid coming here. 
    However, things in the west change dramatically.  The shouts of soldiers in training can be heard.  The
    road continues to the north and south.
  sector: city
  exits:
    north:
      to: tba:1:room:189
    south:
      to: tba:2:room:210
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 2 Sanctus II
        Related Zones: 1 Sanctus, 3 Sanctus III
        Began        : 2000
        Player Level : 1-34
        Rooms        : 100
        Mobs         : 6
        Objects      : 19
        Shops        : 10
        Triggers     : 1
        Theme        : A mortal starting town.
        Plot         : Fabric of time torn, world going to hell. Sanctus one of the few
                       safe havens remaining.
        Links        : 43w
        Zone 2 is linked to the following zones:
          1 Sanctus                        at   200 (north) --->   189
          1 Sanctus                        at   201 (north) --->   194
          1 Sanctus                        at   202 (north) --->   195
          1 Sanctus                        at   203 (north) --->   196
          1 Sanctus                        at   204 (north) --->   197
          1 Sanctus                        at   205 (north) --->   198
          1 Sanctus                        at   206 (north) --->   199
