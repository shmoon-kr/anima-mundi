          3 Sanctus III                    at   298 (south) --->   305
          3 Sanctus III                    at   299 (east ) --->   300

"tba:2:room:201":
  name: Thieves Avenue
  description: >
    This avenue passes between the inner city wall and the warehouse.  The warehouse is made from
    sturdy timber with a set of wide double doors that appear to open outwards.  Wagon tracks lead right up to
    the warehouse.  This must be where traders come to unload their supplies.
  sector: city
  exits:
    north:
      to: tba:1:room:194
    south:
      to: tba:2:room:214

"tba:2:room:202":
  name: The Thieves Warehouse
  description: >
    You are close to the southern end of the storeroom.  Smaller adjoining rooms are to the south and
    east.  The financial holdings of the city are said to be hidden somewhere within this building.  Of
    course only a fool would try to steal from a bunch of thieves.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:1:room:195
    east:
      to: tba:2:room:203
    south:
      to: tba:2:room:215

"tba:2:room:203":
  name: The Workers Room
  description: >
    This room smells of sweat and dust.  The workers responsible for loading, unloading, and sorting
    through all the supply crates live in this single room. Mattresses that are shredded to pieces by rats
    and mice line one wall.  A small washbasin, stool and bench are the only other luxuries these
    overworked brutes own.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:1:room:196
    south:
      to: tba:2:room:216
    west:
      to: tba:2:room:202

"tba:2:room:204":
  name: A Meeting Room
  description: >
    Benches face toward the west wall where a large map has been pinned up. This is where the
    lieutenants of the army relay their plans to the sergeants to carry them out.  You can work your way between
    the benches to the south, east, or north.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:1:room:197
    east:
      to: tba:2:room:205
    south:
      to: tba:2:room:217

"tba:2:room:205":
  name: The Galley
  description: >
    Everything shines a bright silver.  Any recruits who misbehave are sent here to polish the
    kitchen.  A small scullery filled with messy pots gives the room a charred smell.  Large ovens line the east
    wall and are cold for the time being.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:1:room:198
    south:
      to: tba:2:room:218
    west:
      to: tba:2:room:204

"tba:2:room:206":
  name: Warriors Avenue
  description: >
    The inner city wall and the army barracks guide the avenue north and south through the Warriors
    Quarter.  Very few people are around, but plenty of soldiers rush about.  One might wonder why anyone
    would sign up for the army after all the stories flying around.
  sector: city
  exits:
    north:
      to: tba:1:room:199
    south:
      to: tba:2:room:219

"tba:2:room:207":
  name: The Northern Temple Circle
  description: >
    As one continues walking along the cobblestone road the temple can be seen towering high above,
    shimmering in the light.  The road continues to the south and east.  A stairwell leads up onto the top
    of the inner city wall.
  sector: city
  exits:
    east:
      to: tba:2:room:208
    south:
      to: tba:2:room:220
    up:
      to: tba:1:room:111

"tba:2:room:208":
  name: The Northern Temple Circle
  description: >
    The road ahead is long, and an intersection can be seen up ahead to the east. It looks like it
    leads into the temple.  The smell of some sort of vile concoction emanates from a building to the south. 
    The sound of someone chanting can be heard coming from within.
  sector: city
  exits:
    east:
      to: tba:2:room:209
    south:
      to: tba:2:room:221
    west:
      to: tba:2:room:207

"tba:2:room:209":
  name: The Northern Temple Circle
  description: >
    An intersection can be seen just ahead to the east.  Its leading directly into the temple of
    Sanctus.  The road continues to the east and west.  A small building to the south has boxes and envelopes
    stacked on both sides of the entrance.  The sound of someone cursing can be heard coming from within.
  sector: city
  exits:
    east:
      to: tba:2:room:210
    south:
      to: tba:2:room:222
    west:
      to: tba:2:room:208

"tba:2:room:210":
  name: The Northern Temple Circle Intersection
  description: >
    A large intersection spreads out in all directions.  The southern path appears to lead to the
    wonderful Temple of Sanctus.  To the east and west is a road that looks to wind around the temple.  To the
    north nothing can be seen but open road.  Everything around is silent, making the area seem
    abandoned and alone.
  sector: city
  exits:
    north:
      to: tba:2:room:200
    east:
      to: tba:2:room:211
    south:
      to: tba:2:room:223
    west:
      to: tba:2:room:209

"tba:2:room:211":
  name: The Northern Temple Circle
  description: >
    An intersection can be seen just ahead to the west.  Its leading directly into the temple of
    Sanctus.  The road continues to the east and west.  To the south is a building with barred windows and a
    reinforced door that currently stands open.  A sign above the door informs passing people that it is
    the Bank of Sanctus.
  sector: city
  exits:
    east:
      to: tba:2:room:212
    south:
      to: tba:2:room:224
    west:
      to: tba:2:room:210

"tba:2:room:212":
  name: The Northern Temple Circle
  description: >
    An intersection can be seen just ahead to the west.  It looks to be leading directly into the
    temple of Sanctus.  The road continues east and west.  The sound of running water to the south and the
    squeak of a water pump can only mean one thing.  It must be the infamous Sanctus Water Hole run by none
    other than Hazel herself.
  sector: city
  exits:
    east:
      to: tba:2:room:213
    south:
      to: tba:2:room:225
    west:
      to: tba:2:room:211

"tba:2:room:213":
  name: The Northern Temple Circle
  description: >
    The road makes a sharp turn here, heading to the south.  One can see an intersection just up
    ahead.  A set of stone stairs leads up into the northeastern lookout tower of the inner city wall.  From
    there guards can oversee the entire Thieves Quarter.
  sector: city
  exits:
    south:
      to: tba:2:room:226
    west:
      to: tba:2:room:212
    up:
      to: tba:1:room:112

"tba:2:room:214":
  name: Thieves Avenue
  description: >
    Wagons of supplies and loud mouthed traders pass by, looking travelers over to see if they might be
    able to swindle some of your gold.  Most look with disappointment as everyone knows few adventurers
    are rich these days.  The avenue follows along the inner city wall to the north and south.
  sector: city
  exits:
    north:
      to: tba:2:room:201
    south:
      to: tba:2:room:227

"tba:2:room:215":
  name: A Hallway
  description: >
    You pass through a well-lit hallway with a fancy rug, tiled walls and arched ceiling.  Small
    chandeliers hang just above your head.  This fancy hall belongs in a mansion, not a warehouse.  Several
    benches line the walls.  It almost looks like some type of waiting room the thieves use to impress would
    be traders.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:202
    south:
      to: tba:2:room:228

"tba:2:room:216":
  name: A Washroom
  description: >
    A large washbasin meant for washing clothes, a few pots, and even a hand pump with fresh running
    water are kept in this room.  Too bad none of the workers seem to have ever touched any of them.  Leave
    it to the thieves to hire workers to do any manual labor.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:203
    south:
      to: tba:2:room:229

"tba:2:room:217":
  name: A Class Room
  description: >
    Here the army recruits spend their time learning the basics about the army. It's structure, ranking
    system, history, and future developments are all taught to the recruits who usually fall asleep
    during the lectures, until they are taken outside to be "woken up.  "
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:204
    east:
      to: tba:2:room:218
    south:
      to: tba:2:room:230

"tba:2:room:218":
  name: Training Room
  description: >
    Although the majority of people believe the army is just good for fighting and winning wars few
    people realize that recruits go through some educational training as well.  They are taught the basics
    of reading and writing and strategy to help them become better fighters and better citizens.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:205
    south:
      to: tba:2:room:231
    west:
      to: tba:2:room:217

"tba:2:room:219":
  name: Warriors Avenue
  description: >
    The building to the west is made out of stone, sealed with mortar.  It must have taken years to
    construct it.  The inner city wall to the east is made of the same material.  That must have been one of
    the many foul jobs given to new recruits.
  sector: city
  exits:
    north:
      to: tba:2:room:206
    south:
      to: tba:2:room:232

"tba:2:room:220":
  name: The Western Temple Circle
  description: >
    This circle lies within the western sector of the inner city, beside the Temple of Sanctus.  The
    tall reinforced western wall rises high into the air. Few people roam the streets and the area has a
    very peaceful feeling.  The sound of muttering voices seems to be coming from within or on top of the
    wall to the west.
  sector: city
  exits:
    north:
      to: tba:2:room:207
    south:
      to: tba:2:room:233

"tba:2:room:221":
  name: Ingrid's Potions
  description: >
    A foul smelling yellow mist hugs the floor.  Billowing around the floor as one works their way to
    the counter.  Several kettles are boiling over woodless fires that put off no smoke.  The yellow fog
    overflows the top of one of the kettles, giving the room an awful aroma.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:208

"tba:2:room:222":
  name: Post Office
  description: >
    Piles of mail are stacked in every nook and cranny of this small room.  The postal service of
    Sanctus is heavily overworked it seems.  Somewhere amidst the piles of mail someone can be heard snoring. 
    Maybe not overworked, just lazy.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:209

"tba:2:room:223":
  name: Northern Temple Entrance
  description: >
    This appears to be the northernmost entrance to the temple.  Hundreds of small lit candles surround
    the place in a blanket of light.  A soft humming noise can be heard coming from within the depths of
    the temple.  An adventurous traveler would certainly be drawn to go and have a look.
  sector: city
  exits:
    north:
      to: tba:2:room:210
    south:
      to: tba:2:room:236

"tba:2:room:224":
  name: The Bank of Sanctus
  description: >
    A man dressed in rich clothes and wearing a set of spectacles appears to be tediously counting a
    few thousand coins spread out on the table before him. This bank is well known for the security it
    enforces to ensure safe storage of the cities gold.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:211

"tba:2:room:225":
  name: Hazel's Water Hole
  description: >
    An elderly woman sits behind a short rack of various water containers.  A large water pump behind
    her drips slowly into a bucket set below to catch the water.  The DRIP, DRIP, DRIP would drive a
    normal person crazy, but not Hazel. She loves her water.  A set of stairs behind the counter leads to what
    appears to be Hazel's living quarters.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:212
    up:
      to: tba:3:room:367
      door:
        keywords: [door]
        kind: pickproof
        reset: locked

"tba:2:room:226":
  name: The Eastern Temple Circle
  description: >
    The inner city wall rises above to the east.  The sound of armor clanking can be heard as some
    guards must be making their rounds on top of the wall.  This road winds around the Temple of Sanctus
    allowing one to enter from either the north or south.
  sector: city
  exits:
    north:
      to: tba:2:room:213
    south:
      to: tba:2:room:239

"tba:2:room:227":
  name: Thieves Avenue
  description: >
    Few people roam this section of the city, the avenue gets its name for obvious reasons and most
    people are too wary of their gold to chance an encounter with a pickpocket.  A large warehouse to the
    east and the inner city wall to the west guides the avenue to the north or south.
  sector: city
  exits:
    north:
      to: tba:2:room:214
    south:
      to: tba:2:room:240

"tba:2:room:228":
  name: A Meeting Room
  description: >
    A large board is nailed to the eastern wall.  A blank sheet of paper covers the board.  A bunch of
    chairs and benches are arranged in rows facing the board.  Looks like someone is preparing for a
    meeting.  Maybe you can sit in and learn a few things.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:215
    east:
      to: tba:2:room:229
    south:
      to: tba:2:room:241

"tba:2:room:229":
  name: A Meeting Room
  description: >
    A large board is nailed to the western wall.  Various numbers are scratched haphazardly all over
    it.  The type of writing that only the person who made it can really comprehend what it means.  This
    must be where some of the planning for the city takes place.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:216
    south:
      to: tba:2:room:242
    west:
      to: tba:2:room:228

"tba:2:room:230":
  name: The Generals Room
  description: >
    This is where the higher ups meet to decide on policies and rules within the army.  Many sleepless
    nights have always been spent in this room during small skirmishes that almost break out into an all
    out war.  Chairs line the walls and a large table fills the center of the room.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:217
  triggers: [tba:2:trg:207]

"tba:2:room:231":
  name: The Latrine
  description: >
    The smell is disgusting, a recruit needs to clean this place up soon.  A couple of pots lie on the
    floor and a bucket of water sits on the table.  Very rudimentary, but functional, which seems to be
    the unsung motto of the army.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:218

"tba:2:room:232":
  name: Warriors Avenue
  description: >
    This avenue is just north of the center of the western half of Sanctus where the Warriors Quarter
    and Clerics Quarters meet.  The Western Road runs from the temple to the west gate.  Very few people
    are about, mostly just soldiers on patrol.
  sector: city
  exits:
    north:
      to: tba:2:room:219
    south:
      to: tba:2:room:246

"tba:2:room:233":
  name: The Western Temple Circle
  description: >
    To the south one see the western gate to leave the inner city.  The Temple of Sanctus can only be
    entered from the north or south.  A small shed of some sort has been erected to the east.  It was
    recently made from wood and appears to have been constructed in a hurry.
  sector: city
  exits:
    north:
      to: tba:2:room:220
    east:
      to: tba:2:room:234
    south:
      to: tba:2:room:248

"tba:2:room:234":
  name: Captain Lugdach's
  description: >
    Every imaginable type of watercraft fills this room.  From canoes, to buoyant vests.  An old salty
    sailor sits in the back carving out what must be a canoe from a huge oak.  He looks about as tough as
    they come.  He inspires the urge to look for a parrot and peg leg.
  sector: city
  exits:
    west:
      to: tba:2:room:233

"tba:2:room:235":
  name: Donation Room
  description: >
    A large area has been set aside for those of great wealth and power to donate to those who are less
    fortunate.  Racks and shelves line the walls to supply ample storage for those who wish to donate. 
    This is the ideal place to be a good citizen and leave something for the poor.
  sector: city
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:2:room:236
    south:
      to: tba:2:room:250

"tba:2:room:236":
  name: Inside the Temple of Sanctus
  description: >
    The floor spreads out lengthwise into a small hallway.  To the south a large room containing a
    beautiful stone fountain is visible, tempting travelers to drink from it.  The polished floor is made
    from smooth marble, and looks flawless.  A lot of time and effort must have been put into this temple.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:223
    east:
      to: tba:2:room:237
    south:
      to: tba:2:room:251
    west:
      to: tba:2:room:235

"tba:2:room:237":
  name: A Waiting Room
  description: >
    The room is made entirely from white marble inlaid with gold.  Columns of white marble rise up to
    the ceiling which looks to be pure hammered gold. Several cushions and benches line the walls to allow
    a place for people to wait before the daily services.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:252
    west:
      to: tba:2:room:236

"tba:2:room:238":
  name: Carla the Cloth Mistress
  description: >
    The room is filled to overflowing with bundles of wool, cloth, velvet, silk. Everything a person
    could imagine.  All used to make some of the finest clothes in the realm.  Every type of clothing can
    be found here.  Anything that can't be seen, Carla can make.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:2:room:239

"tba:2:room:239":
  name: The Eastern Temple Circle
  description: >
    The western gate of the inner city wall is just to the south where one can venture out into the
    city.  The Tower of Sanctus shines brightly, its white marble reflecting all light that strikes it.  The
    Tower is rumored to be a combination of magic and perfect architecture.
  sector: city
  exits:
    north:
      to: tba:2:room:226
    south:
      to: tba:2:room:254
    west:
      to: tba:2:room:238

"tba:2:room:240":
  name: Thieves Avenue
  description: >
    From here one has an excellent view of the temple to the west.  It reflects any light that shines
    at it, the smooth white walls seem almost magical.  To the south the avenue reaches an intersection. 
    The meeting of the Thieves Quarter and the Magi Quarter.
  sector: city
  exits:
    north:
      to: tba:2:room:227
    south:
      to: tba:2:room:256

"tba:2:room:241":
  name: The Vault
  description: >
    A huge locked safe is built into the southern wall.  The kind you would expect in a bank, not in a
    warehouse.  The vault looks impossible to pick and considering who made it you bet only the person
    with the key could ever get into it.  A large ornate rug covers the floor.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:228

"tba:2:room:242":
  name: The Counting Room
  description: >
    Strange tools sit on tables in the back of the room.  They must be some sort of coin counting
    apparatus.  Unfortunately, no money has been left out.  Even under the tables and in the corners.  The
    room is very clean and organized just right.  If you moved something I bet people would know.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:229

"tba:2:room:243":
  name: The West Gate
  description: >
    The dome can be seen just to the west.  The gate standing here is normally kept open, the tall
    wooden beams are reinforced with metal bars.  Guards can be heard high above, lookouts to warn in the
    case of an attack.  The town looks very safe and secure from here.
  sector: city
  exits:
    east:
      to: tba:2:room:244
    up:
      to: tba:1:room:114
  extras:
  - keywords: [dome]
    text: >
      Created by Rumble and Ferret, the dome holds back the magical chaos that was created by Drakkar. 
      The dome is used to keep balance within the city limits and allows everyone to exist in peace.  Those
      brave enough to venture beyond the dome do so at their own risk.  Beyond the dome the scale of
      balance has collapsed and the laws of science and nature are in disorder.

"tba:2:room:244":
  name: The Western Road
  description: >
    The road leads directly from the Temple to the western gate.  To the north one can see the Warriors
    Barracks and to the south the Hall of Clerics.  The road consists of hard packed dirt with a few
    ruts from wagons.  The hustle and bustle of the city can be heard all around.
  sector: city
  exits:
    east:
      to: tba:2:room:245
    west:
      to: tba:2:room:243

"tba:2:room:245":
  name: The Western Road
  description: >
    In the western half of the city one can see a large building set aside for the army to the north
    while a smaller building to the south appears to be part of the clerics' quarter.  The temple rises
    high above to the east.  Here, one could leave the protection of the city and go west through the gate.
  sector: city
  exits:
    east:
      to: tba:2:room:246
    west:
      to: tba:2:room:244

"tba:2:room:246":
  name: The Western Intersection
  description: >
    This road leads west to the gate or east to the Temple of Sanctus.  The Temple is where people go
    to pray to the gods, they are guaranteed safety within certain rooms of the temple.  A safe haven is
    very rare in the realm these days.  That is why Sanctus was created.
  sector: city
  exits:
    north:
      to: tba:2:room:232
    east:
      to: tba:2:room:247
    south:
      to: tba:2:room:262
    west:
      to: tba:2:room:245

"tba:2:room:247":
  name: Under the Inner Wall
  description: >
    This path passes through the western inner wall gate.  It is extremely dark in here.  The inner
    wall appears to be about twenty feet in thickness.  No one could ever batter down this wall.  Looking
    up, one can see a portculis built into the wall.  Its probably best not to wonder what would happen if
    it were to suddenly let go and come crashing down.
  sector: city
  exits:
    east:
      to: tba:2:room:248
    west:
      to: tba:2:room:246

"tba:2:room:248":
  name: The Western Road
  description: >
    This is the beginning of the Western Road that leads from the Temple of Sanctus to the western gate
    and beyond the protection of the dome.  Few people travel beyond the dome because they fear the
    gateways between worlds may open at anytime.  Only brave adventurers dare travel far beyond the city
    walls.
  sector: city
  exits:
    north:
      to: tba:2:room:233
    south:
      to: tba:2:room:263
    west:
      to: tba:2:room:247
    up:
      to: tba:1:room:115

"tba:2:room:249":
  name: The Mortal Board Room
  description: >
    A large board hangs on the western wall to allow for mortals to keep in contact with the gods or
    each other.  The board is monitored and any questions should be promptly answered.  If the board is not
    the right place for a particular problem to be solved, it is possible to go to the post office and
    mail a god.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:2:room:250

"tba:2:room:250":
  name: Inside the Temple
  description: >
    The white marble floor has been polished to the point where one can see their own reflection
    perfectly.  Not a single marr or scratch on it's flawless surface.  The echo of people walking inside the
    temple can be heard, though not pinpointed.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:235
    east:
      to: tba:2:room:251
    south:
      to: tba:2:room:265
    west:
      to: tba:2:room:249

"tba:2:room:251":
  name: The Center of Sanctus
  description: >
    This open space seems to be the exact center of the city of Sanctus.  From this spot is where
    Rumble and Ferret began restoring order to the world.  Many tales abound about this fabled temple and its
    founders.  Most are just that, tales, but many hold truths beyond what even the storytellers realize.
  sector: city
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:2:room:236
    east:
      to: tba:2:room:252
    south:
      to: tba:2:room:266
    west:
      to: tba:2:room:250
    up:
      to: tba:1:room:100

"tba:2:room:252":
  name: Inside the Temple of Sanctus
  description: >
    The fluted columns of white marble laced with gold are enough to make anyone's mouth gape.  The
    workmanship required to create this place must have been unbelievable.  Must be the rumors that it was
    created by the gods are true.  Several benches can be seen to the north.  The sound of running water
    can be heard to the west.  To the south people can be seen, busy in prayer, while to the east a small
    room lies, full of several people gossiping.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:237
    east:
      to: tba:2:room:253
    south:
      to: tba:2:room:267
    west:
      to: tba:2:room:251

"tba:2:room:253":
  name: The Social Board Room
  description: >
    It is here the people of Sanctus come to discuss anything and everything. This board is used for no
    other reason than to socialize with one another. Various boards can be found throughout the realm. 
    This one can be viewed by anyone.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:2:room:252

"tba:2:room:254":
  name: The Western Road
  description: >
    This road connects the Temple of Sanctus with the eastern gate to allow easy travelling for those
    wishing to visit the temple from the farmlands.  The farmlands are known to be one of the most stable
    regions outside the protection of the dome.
  sector: city
  exits:
    north:
      to: tba:2:room:239
    east:
      to: tba:2:room:255
    south:
      to: tba:2:room:269
    up:
      to: tba:1:room:118

"tba:2:room:255":
  name: Under the Inner Wall
  description: >
    This passage through the inner city wall is reminiscent of of a tunnel.  The wall is so thick that
    no matter the time of day shadows still lurk everywhere under here.  A portculis is built into the
    ceiling high above.  Must be the controls for it are on top of it.
  sector: city
  exits:
    east:
      to: tba:2:room:256
    west:
      to: tba:2:room:254

"tba:2:room:256":
  name: The Eastern Intersection
  description: >
    This intersection stands on the Eastern Road that travels from the east gate to the Temple of
    Sanctus.  North lies the Thieves Quarter while to the South one can enter the Magi's Quarter.  This road
    bustles with activity as people go about their daily lives.
  sector: city
  exits:
    north:
      to: tba:2:room:240
    east:
      to: tba:2:room:257
    south:
      to: tba:2:room:270
    west:
      to: tba:2:room:255

"tba:2:room:257":
  name: The Eastern Road
  description: >
    The Eastern intersection is just to the west.  To the north lies the Thieves Quarter and their
    warehouse.  South is the Magi's Mansion and the Magi's Quarter.  To the east one can exit the city
    through the Eastern Gate.  The infamous Temple of Sanctus can be seen rising from the center of the city.
  sector: city
  exits:
    east:
      to: tba:2:room:258
    west:
      to: tba:2:room:256

"tba:2:room:258":
  name: The Eastern Road
  description: >
    This road passes along the Eastern Road.  The gate lies to the east while the entire city spreads
    out to the west.  The safety of the city is preferred by almost everyone.  But, some people choose to
    live outside the east gate where there are very few troubles or mishaps.
  sector: city
  exits:
    east:
      to: tba:2:room:259
    west:
      to: tba:2:room:257

"tba:2:room:259":
  name: The Eastern Gate
  description: >
    The dome stretches out further than usual here, covering some sections of the residential
    district.  This area is known for it's relative safety.  Very few problems arise from beyond the east gate. 
    The city of Sanctus lies to the west. To the east one can see the remains of an old gatehouse.
  sector: city
  exits:
    west:
      to: tba:2:room:258
    up:
      to: tba:1:room:119

"tba:2:room:260":
  name: The High Councillor's Chambers
  description: >
    A large but simple room with plaster walls and a ceiling of wooden beams. Seven beds are arranged
    side by side along one wall while seven desks with chairs a writing pad, inkpen and ink blotter.  This
    is where the high councillors spend their nights.  They live a life without possession or desires.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:273

"tba:2:room:261":
  name: A Bathroom
  description: >
    The natural scent of the room is masked by an abundance of flowers growing in small pots lining the
    walls.  A large wooden box crafted like a chair with a hole cut in the top must be the only bathroom
    in the entire Hall of Clerics. You can hear something moving around below you.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:274

"tba:2:room:262":
  name: Clerics Avenue
  description: >
    To the north one can leave the Clerics Quarter and either continue to the Warriors Quarter, go east
    into the Temple of Sanctus or west to the western gate.  A large building and the inner city wall on
    each side of this north south street leaves little room for walking.
  sector: city
  exits:
    north:
      to: tba:2:room:246
    south:
      to: tba:2:room:275

"tba:2:room:263":
  name: The Western Temple Circle
  description: >
    The inner city not only holds the temple, but also numerous shops for the town folk.  Everything,
    well almost everything, can be found within these walls to support the town.  Women lugging sacks full
    of groceries arrive from the east and pass down the street.
  sector: city
  exits:
    north:
      to: tba:2:room:248
    east:
      to: tba:2:room:264
    south:
      to: tba:2:room:276

"tba:2:room:264":
  name: The Town Grocer
  description: >
    Chunks of ice lie in crates of sawdust to cool the perishable items.  Fruit and vegetable stands
    line both walls.  This shop seems to carry everything, except bread and meat.  Must be the baker,
    butcher, and grocer have an understanding.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:2:room:263

"tba:2:room:265":
  name: A Room of Prayer
  description: >
    Decorative cushions are arranged in neat rows for people to kneel and pray on.  Several candles
    line the walls.  Large murals dominate the wall and ceiling above a small altar.  Those who are feeling
    pious may come here to give thanks to their gods.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:250
    east:
      to: tba:2:room:266

"tba:2:room:266":
  name: Inside the Temple of Sanctus
  description: >
    This is the main passage through the temple.  Small rooms to each side are unusually quiet.  It
    appears people are in prayer inside.  The center of the temple lies to the north.  The white marble
    floor, walls, and ceilings of the temple are spotless.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:251
    east:
      to: tba:2:room:267
    south:
      to: tba:2:room:279
    west:
      to: tba:2:room:265

"tba:2:room:267":
  name: A Room of Prayer
  description: >
    The room is surrounded with a soft glow from dozens of candles lining the walls, filling the alter
    and even hanging from the ceiling by chandeliers.  The candles are scented, leaving a faint aroma of
    spring flowers.  Cushions of various colors cover the floor in precise rows.
  sector: city
  exits:
    north:
      to: tba:2:room:252
    west:
      to: tba:2:room:266

"tba:2:room:268":
  name: The Town Furrier
  description: >
    Aromatic candles line one wall over a rack of fur hides.  Must be the Furrier is trying to blanket
    the disgusting smell from the tanning process. This guy can make almost anything from a good fur
    hide.  He is very skilled and his prices are not too outrageous.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:2:room:269

"tba:2:room:269":
  name: The Eastern Temple Circle
  description: >
    The smell of tanned hides and flowers comes from the west, how strange. This circle lies just
    inside the market center of Sanctus.  The stores have all taken up shop surrounding the Temple.  They
    originally were afraid the outer city could be overrun, but now they are just too lazy to move.
  sector: city
  exits:
    north:
      to: tba:2:room:254
    south:
      to: tba:2:room:282
    west:
      to: tba:2:room:268

"tba:2:room:270":
  name: Magi Avenue
  description: >
    A fabulous mansion sits on a small hill to the east.  The entrance is far to the south .  To the
    north one can leave the Magi's Quarter and travel along the Eastern Road or head further north into the
    Thieves Quarter.  This Quarter of the city is very well maintained, decorative streetlamps line both
    sides of the wide street.
  sector: city
  exits:
    north:
      to: tba:2:room:256
    south:
      to: tba:2:room:283

"tba:2:room:271":
  name: A Sleeping Chamber
  description: >
    Three sets of beds and closets are all colored differently.  One Blue, one Green, and one Yellow. 
    The closets are filled with robes and small sandals, all of the same three colors.  You have
    trespassed on three of the five orders of the Master Magi.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:284

"tba:2:room:272":
  name: A Sleeping Chamber
  description: >
    Two Large down filled beds crowd the room.  Large closets occupy the northern walls.  Filled with
    robes of Red and Black.  The floor is covered in a thick maroon run that cushions your every step. 
    The Master Magi must live in this room.  Better not be caught trespassing.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:285
  triggers: [tba:0:trg:55]

"tba:2:room:273":
  name: A Study
  description: >
    Bookshelves line the western wall, reaching well above your head.  A small ladder is built into the
    center to allow people to reach the top.  A few chairs and cushions allow comfortable places to
    relax and peruse the many novels. Light from lanterns hanging overhead fills the room as if it was broad
    daylight.
  sector: city
  exits:
    north:
      to: tba:2:room:260
    east:
      to: tba:2:room:274
    south:
      to: tba:2:room:286

"tba:2:room:274":
  name: The Kitchen
  description: >
    The smell of fresh stew makes your stomach grumle uncomfortably.  Several overweight cooks are
    sampling their favorite dishes as they prepare for the next meal.  They look at you just daring you to
    try and take some of their food that they spent hours preparing.
  sector: city
  exits:
    north:
      to: tba:2:room:261
    south:
      to: tba:2:room:287
    west:
      to: tba:2:room:273

"tba:2:room:275":
  name: Clerics Avenue
  description: >
    The building to the west is the Hall of Clerics where the High Council holds audience with any who
    request it.  To the east the inner city wall looks about as impenetrable as any wall ever seen. 
    Clerics Avenue continues north and south.
  sector: city
  exits:
    north:
      to: tba:2:room:262
    south:
      to: tba:2:room:288

"tba:2:room:276":
  name: The Western Temple Circle
  description: >
    An expensive looking shop to the east looks extremely out of place.  A sign displayed in one window
    depicts several precious gems and minerals.  The Temple Circle continues north and south.  The
    cobblestone streets are bordered by the inner city wall to the west and various stores and shops to the
    east.
  sector: city
  exits:
    north:
      to: tba:2:room:263
    east:
      to: tba:2:room:277
    south:
      to: tba:2:room:289

"tba:2:room:277":
  name: The Town Jeweler
  description: >
    Display cases of very nice looking gems sit in the back of the room behind some steel bars.  Must
    be the jeweler has had problems with thieves.  Several nuggets of strange minerals are display on
    shelves all around.  Lucky is the individual who can find some of these valuable items to sell.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:2:room:276

"tba:2:room:278":
  name: The Butcher
  description: >
    Slabs of meat are suspended from hooks hanging from the rafters overhead. Everything from rabbit,
    to cow, to goodness knows what.  One of the pieces looks an awful lot like a cat.  Any meat a person
    may need, this guy sells it.  Blood covers the counter and the small cutting area behind it.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:291

"tba:2:room:279":
  name: Southern Temple Entrance
  description: >
    This appears to be a small foyer at the southern end of the Temple of Sanctus.  The white marble
    walls have been polished smooth.  A small road to the south leads to the Cleric's and Magi's quarters
    of the city.  The scent of flowers fills the air with a soothing aroma.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:266
    south:
      to: tba:2:room:292

"tba:2:room:280":
  name: The Bakery
  description: >
    Everything is covered in dust, or actually maybe that is flour.  A hefty woman behind the counter
    is pounding relentlessly on a stubborn hunk of dough. Those arms on her are similar to those of the
    smithy.  Various baked goods fill the entire room.  Baked fresh daily of course.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:2:room:293
    up:
      to: tba:2:room:280
      look: A narrow flight of steps leads up to a plain wooden door.
      door:
        keywords: [Door]
        kind: door
        reset: locked

"tba:2:room:281":
  name: The General Store
  description: >
    Various types of hardware needed by any wanna be adventurer fill bins and buckets around the
    store.  The items look second hand, but they would all serve their purpose.  A few other customers wander
    the store.  They can't seem to find what they are looking for either.
  sector: city
  exits:
    east:
      to: tba:2:room:282

"tba:2:room:282":
  name: The Eastern Temple Circle
  description: >
    A large shop to the west displays a few packs, some lanterns, and even some mining equipment.  The
    cobblestone road is blocked to the east by the inner city wall and several stores crowd against the
    Temple of Sanctus to the west.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:269
    south:
      to: tba:2:room:295
    west:
      to: tba:2:room:281

"tba:2:room:283":
  name: Magi Avenue
  description: >
    The streetlamps glow an unnatural white, upon closer examination it becomes obvious that they must
    be magical in nature since no oil you've ever seen burns that color.  The beautiful cobblestone road
    meanders north and south.  The Magi Mansion to the east looks glorious.
  sector: city
  exits:
    north:
      to: tba:2:room:270
    south:
      to: tba:2:room:296

"tba:2:room:284":
  name: The Reading Room
  description: >
    A large bookshelf is overburdened and looking about ready to collapse from the hundreds of volumes
    of books it holds.  These are the chronicles of the Magi.  Within them they hold the secrets of their
    mystical art.  A large sign above the bookshelf warns anyone from attempting to touch the books.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:271
    east:
      to: tba:2:room:285
    south:
      to: tba:2:room:297

"tba:2:room:285":
  name: The Dining Room
  description: >
    A large table with a silk cloth is set for the next meal.  Sparkling silverware and spotless wine
    glasses all fill the majestic table.  Enough for seven settings.  Two of the place settings are turned
    upside down.  Servants rush about their work around you.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:272
    south:
      to: tba:2:room:298
    west:
      to: tba:2:room:284

"tba:2:room:286":
  name: The Aundience Chamber
  description: >
    This is the room where the High Council meets with any who bring forth problems.  The High Council
    will then vote and decide on a way to settle the matter.  Their word is final and none ever disobey
    them.  They are respected for their intelligence and wisdom.
  sector: city
  exits:
    north:
      to: tba:2:room:273
    south:
      to: tba:2:room:299

"tba:2:room:287":
  name: A Long Hallway
  description: >
    Citizens may ask advice of the High Council in settling disputes among each other.  The Hall is the
    only form of justice within the city besides the army. Everyone respects the High Council for their
    devotion and wisdom towards what is right.
  sector: city
  exits:
    north:
      to: tba:2:room:274
    south:
      to: tba:3:room:300

"tba:2:room:288":
  name: Clerics Avenue
  description: >
    The inner city wall to the east consists of large boulders, that look to be too big to move by any
    humans, and some sort of filler.  The wall rises at least three times the average man's height and
    one can not tell how thick it must be. YouThe sound of clanking armor can be heard, along with idle
    chat as guards on the wall above you make their rounds.
  sector: city
  exits:
    north:
      to: tba:2:room:275
    south:
      to: tba:3:room:301

"tba:2:room:289":
  name: The Southern Temple Circle
  description: >
    This circle appears to be the southeastern intersection of the inner city. The south and west inner
    city walls merge here.  A set of stone stairs lead up into a small lookout post high above.  The
    street turns here, wrapping around the Temple of Sanctus.
  sector: city
  exits:
    north:
      to: tba:2:room:276
    east:
      to: tba:2:room:290
    up:
      to: tba:1:room:121

"tba:2:room:290":
  name: The Southern Temple Circle
  description: >
    The cobblestone street continues to the east and west along the southern wall of the inner city. 
    Small shops line the road to the north.  The Tower of Sanctus, with its single tall spire reaching to
    the heavens, looks magnificent. A style of workmanship that has never been surpassed.
  sector: city
  exits:
    east:
      to: tba:2:room:291
    west:
      to: tba:2:room:289

"tba:2:room:291":
  name: The Southern Temple Circle
  description: >
    The smell of fresh, and not so fresh, meat wafts in from the north.  A sign swaying above the door
    in the breeze depicts a hunk of meat crossed with a butcher's axe.  An intersection can be seen just
    to the east where one can exit the inner city or enter the temple.
  sector: city
  exits:
    north:
      to: tba:2:room:278
    east:
      to: tba:2:room:292
    west:
      to: tba:2:room:290
  triggers: [tba:2:trg:210, tba:2:trg:211]

"tba:2:room:292":
  name: The Southern Temple Circle Intersection
  description: >
    The southern entrance to the Temple of Sanctus lies just to the north.  It is also possible to
    travel along the Temple Circle east and west.  To the south one can exit the inner city and work their
    way into the magi or clerics' Quarters.
  sector: city
  exits:
    north:
      to: tba:2:room:279
    east:
      to: tba:2:room:293
    south:
      to: tba:3:room:302
    west:
      to: tba:2:room:291

"tba:2:room:293":
  name: The Southern Temple Circle
  description: >
    The smell of freshly baked bread wafts heavily through the air, tempting feelings of hunger.  To
    the west can be seen an intersection that can lead into the temple to the north or exit the inner city
    to the south.  The inner city wall stretches east and west along the Temple Circle.
  sector: city
  exits:
    north:
      to: tba:2:room:280
    east:
      to: tba:2:room:294
    west:
      to: tba:2:room:292

"tba:2:room:294":
  name: The Southern Temple Circle
  description: >
    The cobblestone street continues to the east and west along the southern wall of the inner city. 
    Small shops line the road to the north.  The Tower of Sanctus, with its single tall spire reaching to
    the heavens, looks magnificent. A style of workmanship that has never been surpassed.
  sector: city
  exits:
    east:
      to: tba:2:room:295
    west:
      to: tba:2:room:293

"tba:2:room:295":
  name: The Southern Temple Circle
  description: >
    Various shops surround the Temple of Sanctus to the east and west.  The shops were moved within the
    inner city years ago.  All the shops seem to do good business and the overall wealth of the city
    seems to be geared mostly to the middle class.  Only a few have achieved poverty or great wealth within
    the city.
  sector: city
  exits:
    north:
      to: tba:2:room:282
    west:
      to: tba:2:room:294
    up:
      to: tba:1:room:122

"tba:2:room:296":
  name: Magi Avenue
  description: >
    The stark inner city wall to the west bears a sharp contrast to the luxurious mansion to the east. 
    The magi have trained hard to become very powerful within the city and have begun living the life
    that shows it.  Unlike the clerics who do not believe in worldly possessions the Magi surround
    themselves with it.
  sector: city
  exits:
    north:
      to: tba:2:room:283
    south:
      to: tba:3:room:303

"tba:2:room:297":
  name: An Elegant Hall
  description: >
    The walls are covered in some sort of drawing that stretches from floor to ceiling.  It depicts a
    battle with the Master Magi obliterating hundreds of demons by calling down lightning and hurling
    fireballs.  The demons look vaguely familiar, like something you remember from a dream.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:284
    south:
      to: tba:3:room:304

"tba:2:room:298":
  name: A Bunk Room
  description: >
    Small beds circle the room, a large table sits at their center.  This is where the servants and
    students sleep and, from the looks of the table and what is on it, gamble.  The table is full of chips
    and various headed die.  A deck of cards lies in the center of the table waiting to be dealt.
  sector: city
