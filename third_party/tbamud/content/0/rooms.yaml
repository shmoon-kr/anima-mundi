# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 0.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:0:room:0":
  name: The Void
  description: >
    You don't think that you are not floating in nothing.  You can see a strange portal located above
    you.
  sector: city
  flags: [indoors]
  exits:
    up:
      to: tba:1:room:100

"tba:0:room:1":
  name: Limbo
  description: >
    You are floating in a formless void, detached from all sensation of physical matter, surrounded by
    swirling glowing light, which fades into the relative darkness around you without any trace of edges
    or shadow.
  sector: city
  flags: [indoors]
  exits:
    down:
      to: tba:1:room:100
      look: A strange portal in the floor is the only exit.

"tba:0:room:2":
  name: Welcome to the Builder Academy
  description:
  - >
    A builder is a term usually used to describe a person who designs MUD zones for other characters to
    explore. Any player with motivation, ideas, and good writing style can be a builder as well as a
    player. As a Builder, your job is to create the virtual world in which players can roam around, solve
    puzzles, find treasures, and gain experience. A Builder creates the rooms, objects, mobs, shops, and
    triggers with which players will interact.
  - >
    If this is something you are interested in doing then you have come to the right place. Be warned,
    building is not easy and will require hard work, patience, and the ability to take constructive
    criticism.
  - >
    Your first task is to apply for builder status at: {bright_cyan}www.tbamud.com{/bright_cyan}
  - >
    When you finish and submit the application tell anyone level 32 or higher and they will advance you
    to begin your training.
  - If would like to check out the tbaMUD World as a player connect to tbamud.com 4000.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:3

"tba:0:room:3":
  name: The Builder Academy
  description:
  - >
    Congratulations on your new-found immortality. Now all you need to know is how to use your new
    abilities. This zone describes how to create CircleMUD areas. The intended audience is builders
    interested in creating new worlds. There are a few basic rules to understand while exploring this zone and
    learning how to build. Everything in {bright_red}CAPITAL LETTERS{/bright_red} is something that can be
    further explored by typing {bright_red}CAPITAL LETTERS{/bright_red} and hitting return.
  - Test this out, {bright_red}HELP DISCLAIMER{/bright_red}.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:4

"tba:0:room:4":
  name: The Beginning
  description: >
    By simply following the different halls new builders will be taught the basics of building on a
    tbaMUD. If new to immortality and building then I highly recommend the hallway to the north for an
    overview of immortal commands. For those that have a grasp on all commands listed under
    {bright_red}WIZHELP{/bright_red} continue to the east. TBA is constantly striving to improve upon the training process
    so please use the typo and idea commands liberally.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:16
    east:
      to: tba:0:room:5
    west:
      to: tba:0:room:3

"tba:0:room:5":
  name: The Builder Academy Implementation
  description:
  - >
    Here at The Builder Academy we try not to restrict builders with rules and regulations. But, some
    are required in order to make this place run smoothly. Please realize we handle a lot of newbie
    builders with a very minimal staff so be patient, learn to use the helpfiles and have fun.
  - >
    Read the following help files on TBA's training process: {bright_red}HELP TRIALROOM HELP
    REPORT-EXAMPLE HELP LEVEL HELP ADVERTISING{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:6
    west:
      to: tba:0:room:4

"tba:0:room:6":
  name: Building
  description:
  - >
    This hallway running west to east is the route you will advance after completing each hallway
    leading off to the north (if there is one) {bright_red}HELP TBAMAP{/bright_red}.
  - >
    The first thing all builders need to realize is that their area is not going to be the best, and it
    is not going to have the best equipment or toughest mobs in the game.  All new builders want to make
    a piece of equipment that is better than any other and they all want the large group of players to
    remember the trials and tribulations they went through while trying to kill a mob that they have
    created.  If you are a veteran of any MUD, you know that the toughest mobs have already been made, and to
    try to create a mob that is tougher is almost impossible and will only duplicate existing mobs, or
    throw off the balance of the game. So start out small and do not expect to create a perfect zone the
    first time around. Do not make anything super-powerful. It will not be allowed and you will have to
    redo it, wasting everyone's time, both yours and ours.
  - >
    Read the following help files: {bright_red}HELP BUILDER HELP PREREQUISITE HELP BALANCE HELP
    BREATHE{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    north: {}
    east:
      to: tba:0:room:7
    south: {}
    west:
      to: tba:0:room:5
    up: {}

"tba:0:room:7":
  name: Writing Good Descriptions
  description:
  - >
    The following help files go into the lengthy subject of writing good descriptions.  This will also
    cover proper grammar and the use of the text editor where you enter all of your long descriptions.
  - >
    The hardest part for most new builders is writing descriptions. We assume that you are reasonably
    literate and know basic grammar and spelling. If this does not describe you, we humbly suggest that
    you take some classes, get a dictionary, and start learning. Proper grammar should be used at all
    times. If you can write reasonably well, great! I am sure you will still find this hallway useful. We will
    discuss some of the issues related to writing specifically for a MUD, such as: {bright_red}HELP
    DESCRIBING HELP YOU HELP BIAS HELP GRAMMAR HELP REDIT-DESCRIPTIONS HELP REDIT-EXTRA HELP OEDIT-EXTRA HELP
    D-DESC HELP MEDIT-L-DESC HELP TEXT-EDITOR{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:8
    west:
      to: tba:0:room:6

"tba:0:room:8":
  name: How to Use Redit
  description:
  - >
    Room edit, or redit, is how you create, link, and describe the rooms that a player explores. It can
    be used by simply typing redit in the room you wish to edit.  If you get a message that you do not
    have permission to edit that zone it is because your OLC is not set to that zone. {bright_red}STAT
    SELF{/bright_red} to see what your {bright_magenta}OLC[]{/bright_magenta} is set to. OLC, or
    on-line-creation is set to the zone number assigned to you by the staff.  The zone number is then divided into
    VNUM's ##00 to ##99. For example, Zone 12 has VNUM's 1200 to 1299. These numbers are critical; they
    are the identities of the rooms within the game.  They can be used with "goto" to go to that room.
  - >
    Now, lets look at the redit menu. Type the following: {bright_red}HELP REDIT-MENU{/bright_red} That
    is an example of the redit menu you will see when you edit a room. Notice how each important line
    has an associated help topic. To learn more about it just see the appropriate help file. If this is
    your first experience with redit read ALL the help files. {bright_red}HELP STYLISTICS{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:9
    west:
      to: tba:0:room:7
    up: {}

"tba:0:room:9":
  name: How to Use Oedit
  description:
  - >
    Now you will learn the intricacies of creating objects with the object editor. Please remember that
    every MUD has different ideas of balance and the basics of building you learn here should be
    universal, but expect limitations on objects from your MUD administration. To further help your training we
    have added object standards to all values a builder can set. This way you know what values are
    appropriate and will not have to redo objects because you did not know what values to set.
  - >
    Oedit can be used by typing "oedit <<VNUM>>".  A zone is divided into VNUM's ##00 to ##99.  For
    example, Zone 12 has VNUM's 1200 to 1299.  These numbers are critical; they are the identities of the
    objects within the game.  It is a good habit to start using all VNUMs from ##00 to ##99 consecutively.
  - >
    Start off by checking out the oedit menu. Type {bright_red}HELP OEDIT-MENU{/bright_red} That is an
    example of the oedit menu you will see when you edit an object. Notice how each important line has an
    associated help topic. To learn more about it just see the appropriate help file. If this is your
    first experience with oedit read ALL the help files.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:10
    west:
      to: tba:0:room:8

"tba:0:room:10":
  name: How to Use Medit
  description:
  - >
    Next you will learn how to create mobiles with the mobile editor. Mobs are the non-player
    characters within the game (NPC's). With medit you will be able to create a mob and modify all of its stats
    (statistics), flags, and settings.
  - >
    Mobile edit, or medit, is how you create the monsters a player can interact with.  Notice I use the
    word interact.  Every mob should not be made for just killing.  There can and should be a variety. 
    For example, one mob could be made for high experience value, another for gold, another for a unique
    object, another to fill a storyline, another as part of a quest.  The options are limitless,
    especially with triggers, mobs are meant for much more than just killing.  Medit can be used by typing "medit
    <VNUM>".
  - >
    Type {bright_red}HELP MEDIT-MENU{/bright_red} That is an example of the medit menu you will see
    when you edit a mobile. Each line has its own help topic you should also read.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:11
    west:
      to: tba:0:room:9

"tba:0:room:11":
  name: How to Use Zedit
  description:
  - >
    Zedit is what is used to load mobiles and objects into rooms. Every zone goes through a zone reset,
    each one depending on how you set it. Upon a zone reset all rooms, mobs, and objects will reload if
    they are no longer present.
  - >
    Most new builders think mobs and objects are loaded by the "load" command. This is not how it is
    done. Instead you use zedit in each room you wish a mob or object to load. This way whenever the zone
    resets it will execute the zone commands to load all of your mobs and objects.
  - >
    Zone edit, or zedit, is how you control how mobiles and objects are integrated within the zone to
    create an inhabited world. Using "load obj <VNUM>" does not ensure that the mob will always be there,
    in fact if someone kills it or the mud reboots it will be gone. So you need to load mobs and objects
    through zedit.
  - >
    It can be used just like redit, by simply typing zedit while you are in the room you wish to edit
    or "zedit <<VNUM>>." Now, lets look at the zedit menu. {bright_red}HELP ZEDIT-MENU{/bright_red}.  That
    is an example of the zedit menu, be sure to read the related helpfiles on each menu option.
  - >
    Zedit contains zone settings, followed by a series of reset commands. Each time a zone is reset,
    the server executes all the commands in order from beginning to end. All zones are reset when the
    server first boots, and periodically reset again while the game is running.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:12
    west:
      to: tba:0:room:10

"tba:0:room:12":
  name: How to Use Sedit
  description:
  - >
    Shops are stores within the mud that players can list the items for sale and then buy or sell from.
    Shops are one of the more complicated aspects of building and should not be attempted until you are
    comfortable with the other forms of OLC (except trigedit).
  - >
    When you make a shop I suggest you use the shop vnum that matches the room you wish the shop to be
    in. For example, say I want a shop in room 1333. I would sedit 1333 to create that shop. Now, let us
    look at the sedit menu. Type the following: {bright_red}HELP SEDIT-MENU{/bright_red}. That is an
    example of the sedit menu you will see when you edit a shop. Notice how each important line has an
    associated help topic. To learn more about it just see the appropriate help file. If this is your first
    experience with sedit read ALL the help files.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:13
    west:
      to: tba:0:room:11

"tba:0:room:13":
  name: How to Use Trigedit
  description:
  - >
    The hall to the north will show you how to use the trigger editor. Trigedit is the most advanced
    form of OLC we have to offer. It is the hardest, but also the most rewarding. If you are looking to
    pour life into your mobs, enliven your rooms or just make your objects special? This can all be done
    with trigedit. Have fun with the power of (minor) coding!
  - >
    Like all the hallways before use this hallway in conjunction with the help files: {bright_red}HELP
    TRIGEDIT-MENU{/bright_red} and the commands {bright_red}TLIST{/bright_red} and
    {bright_red}TSTAT{/bright_red} commands. Do not attempt to use trigedit until you complete your trial vnum and are assigned
    a zone. Remember you must disable {bright_red}NOHASSLE{/bright_red}. Triggers will not work on you
    otherwise.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:0:room:18
    east:
      to: tba:0:room:14
    west:
      to: tba:0:room:12

"tba:0:room:14":
  name: Planning
  description: >
    The ideas discussed in the help files below are tried and true. Though they may not work for
    everyone, they will for the majority. Learn from others mistakes and understand the planning required to
    make a good zone. Building a great zone takes many things; such as time, patience, good
    grammar/spelling, knowing how to balance your zone, a lot of work, and most importantly planning. Now this all may
    sound like a lot to do, but I can assure you that with this zone, and the help of others, you can do
    this. {bright_red}HELP DICTIONARY{/bright_red} {bright_red}HELP WORK{/bright_red} {bright_red}HELP
    PLANNING{/bright_red} {bright_red}HELP CARTOGRAPHY{/bright_red} {bright_red}HELP LOCATION{/bright_red}
    {bright_red}HELP THEME{/bright_red} {bright_red}HELP PLOT{/bright_red} {bright_red}HELP
    ZONE-SIZE{/bright_red} {bright_red}HELP ALIGNMENT{/bright_red} {bright_red}HELP BIAS{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:15
    west:
      to: tba:0:room:13

"tba:0:room:15":
  name: Lessons Learned and Advanced Building
  description:
  - >
    Here are a few lessons that have been passed down from builder to builder through out the years. 
    Take heed to these words as they have been and done what you are now doing many times over.
    {bright_red}HELP LANCE HELP SNOWLOCK HELP ELASETH HELP PATHS{/bright_red}
  - >
    There are numerous resources out there for MUDs. Here are a few I have used in the past: Please
    mudmail me any good links to add. {bright_red}HELP DOCUMENTATION HELP OFFLINE{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:98
    west:
      to: tba:0:room:14

"tba:0:room:16":
  name: Immortal Commands
  description:
    preformatted: |2
         As an immortal you have some new commands available to you.  To see all
      of your immortal commands simply type {bright_red}WIZHELP{/bright_red}. Every command in the game
      has a help entry. So the best way to learn how to use all these commands is
      by simply typing {bright_red}HELP <COMMAND>{/bright_red}. This will bring up some information
      about the command. For example, this is what you will see if you type
      {bright_red}HELP NOHASSLE{/bright_red}:
      
      {bright_white}NOHASSLE      -------->> help topic
      
      Usage: nohassle         ---------->> what you need to type to do it.
      
         Toggles a flag to prevent aggressive monsters from attacking and also prevents
      immortals from firing triggers. If you wish to test triggers you must turn
      nohassle off.  -->> description
      
      See Also: HOLYLIGHT, ROOMFLAGS  ------->> other related commands in help file.
      {/bright_white}
         Now is the time to practice all of your immortal commands, make sure you
      understand what they do and how they can be used. Read all the help file
      entries on every command!!! Do not worry too much about redit, oedit, medit,
      zedit, sedit, and trigedit. We will get to those later. Know how to use all
      the commands available to you.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:0:room:17
    south:
      to: tba:0:room:4

"tba:0:room:17":
  name: Overview of the MUD World
  description:
  - >
    The first thing you need to build is a good telnet client. {bright_red}HELP TELNET{/bright_red} for
    a list.
  - >
    Once you have a good client you must understand a few basics: {bright_red}HELP
    VIRTUAL-NUMBERS{/bright_red} {bright_red}HELP TERMINOLOGY{/bright_red}
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:0:room:16

"tba:0:room:18":
  name: A Quick Mob Quest Tutorial
  description: >
    See: {bright_red}HELP TRIGEDIT-MOB-TUTORIAL{/bright_red} {bright_red}STAT QUESTMASTER{/bright_red}.
    Notice the attached triggers. {bright_red}TSTAT 1{/bright_red}.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:20
    east:
      to: tba:0:room:19
    south:
      to: tba:0:room:13

"tba:0:room:19":
  name: A Quest Room
  description: In this room you may be able to finish the Mob Quest Tutorial.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:0:room:18

"tba:0:room:20":
  name: Advanced Trigedit Example
  description: >
    Begin by {bright_red}STAT GATEGUARD{/bright_red} and then tstat each trigger listed to see what
    they do.  This example is explained under {bright_red}HELP TRIGEDIT-ADVANCED-TUTORIAL{/bright_red}.
    Including triggers 4, 5, 7, 8. To pay the gateguard: {bright_red}GIVE 10 COINS GUARD{/bright_red}.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:21
      look: The tutorial hallway continues.
      door:
        keywords: [gateway]
        kind: pickproof
        key: tba:0:obj:46
        reset: locked
    south:
      to: tba:0:room:18

"tba:0:room:21":
  name: Another Example With Quest Variables
  description: >
    These triggers are a little more complex.  The complexity gives the builder more flexibility.  By
    setting a variable on a player you can later call on these variables.  The most basic usage is to set
    a quest as completed when the player is done.  Another use would be to set something else like
    player_can_breathe_water and prevent a player from entering a certain room unless they have this variable
    set.  To see what variables are set on a player simply stat that player.  {bright_red}STAT
    SELF{/bright_red}.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:23
    east:
      to: tba:0:room:22
    south:
      to: tba:0:room:20
      door:
        keywords: [gateway]
        kind: door

"tba:0:room:22":
  name: Quest Variables Example
  description: >
    I used triggers 190 thru 192 to setup this example.  Simply tstat each to see what they do.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:0:room:21

"tba:0:room:23":
  name: Trigger Help Files
  description:
  - >
    I have added extensive help files on every type of trigger.  Please use them and give feedback. 
    The easiest way to get to them all is through: {bright_red}HELP TRIGEDIT-MENU{/bright_red} and
    {bright_red}HELP TRIGEDIT-TYPE{/bright_red}.
  - >
    There are 1000's of triggers on TBA you can use as examples. {bright_red}HELP EXAMPLES{/bright_red}
    for a few. {bright_red}HELP TRIG-EXAMPLES{/bright_red} for some advanced ones. {bright_red}GOTO
    14{/bright_red} to access the next hallway.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:0:room:21

"tba:0:room:33":
  name: Rumble's Room
  description: >
    War is an ugly thing, but not the ugliest of things.  The decayed and degraded state of moral and
    patriotic feeling which thinks that nothing is worth war is much worse.  The person who has nothing
    for which he is willing to fight, nothing which is more important than his own personal safety, is a
    miserable creature and has no chance of being free unless made and kept so by the exertions of better
    men than himself. John Stuart Mill HELP QUOTE
  sector: inside
  flags: [indoors]

"tba:0:room:34":
  name: Pool of Images
  description: >
    A broad mosaic walkway wraps around the natural hotsprings in this cavernous room.  Three large
    chandeliers are suspended from the domed ceiling and their sparkling light dances on the surface of the
    bubbling hotsprings.  As you peer into the water images begin to form from out of the depths,
    coalescing into a vivid scene.  Your heart begins to pound and your breathing becomes deeper as you watch
    the images taking shape in the turbulent liquid.  Your mouth becomes dry as you see yourself in the
    watery panorama ...  And time stands still for just one moment ...  As you see your future in the depths
    ...
  sector: inside
  flags: [indoors, private]

"tba:0:room:35":
  name: "{x203}Elora's{/x203}{x168} Den{/x168}{x133} of {/x133}{x98}Dreams{/x98}"
  description: >
    Shadows form and dissipate, creating fluid, illogical images, which seem to come to life one
    minute, only to disappear as wisps of smoke the next.  Around them, sharp brush strokes of iridescence
    twist into crooked, ever-changing patterns.  The warble of a songbird becomes the maniacal laughter of a
    dancing clown, which in turn dissolves into a prancing pony.  The only constant here appears to be a
    faint scent of jasmine.
  sector: inside
  flags: [indoors, peaceful]

"tba:0:room:71":
  name: The Vault Of The Programancer
  description: >
    The walls, furniture and other decor that animate Vatiken's vault are comprised of nothing more
    then floating ones and zeros.
  sector: underwater
  flags: [godroom]

"tba:0:room:88":
  name: Advertising Room
  description: >
    Feel free to use this board to advertise for your own MUD.  DO NOT advertise on any channel or
    board besides this one.  A single post on this board is the only advertising allowed.  The quality of
    your post reflects on the quality of your MUD so please review and format your work before saving.  Do
    not format the MUD address with /f.  Since TBA uses the @@ as a colorcode you must use 2 @@@@ with
    your email address.  Posts may be deleted if done poorly or if the MUD is no longer online.
  sector: inside
  flags: [indoors]

"tba:0:room:89":
  name: The Prison Cell Corridor
  description: >
    This long hallway is barely wide enough for two people to walk abreast. Along the Northern wall are
    steel doors spaced a few feet apart while the southern wall is of cinder block construction.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:0:room:89
    west:
      to: tba:0:room:89
    up:
      to: tba:1:room:130
      door:
        keywords: [trapdoor]
        kind: door
        key: tba:0:obj:68
        reset: locked

"tba:0:room:90":
  name: Epictetus' Prison Cell
  description: >
    This shower stall remodeled into a prison cell is not yet completed.  While the shower head has
    been removed and cemented a drain still exists in the floor. Unintelligible voices can be heard
    whispering through the piping in the drain below.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:0:room:89
  extras:
  - keywords: [drain, floor]
    text: >
      The metal drain is covered with years of hair and grime. Several screws holding the drain in place
      seem to be missing.

"tba:0:room:91":
  name: Aristotle's Prison Cell
  description: >
    What used to be a shower stall has been turned into a cell complete with a pungent waste bucket.
    The old shower head is still sticking out of the wall with a steel door opposite.
  sector: inside
  flags: [indoors]
  extras:
  - keywords: [shower, head, cap]
    text: >
      The metal shower head has a plastic variable setting cap complete with a massage setting. The cap
      looks a bit damaged like someone may have opened it before.

"tba:0:room:92":
  name: Plato's Prison Cell
  description: >
    The now familiar cell is cast in strange movement and shadows as the single light bulb above
    flickers randomly as if it is about to burn out. The alternating bright and pitch black environment makes
    the eyes ache.
  sector: inside
  flags: [indoors]

"tba:0:room:93":
  name: Friedrich Nietzsche's Prison Cell
  description: >
    The stale, uncirculated air reeks from the prior occupants of this small cell. The silence is
    broken only by the occasional footsteps in the corridor outside or a fellow prisoner tapping on the cell
    wall.
  sector: inside
  flags: [indoors]

"tba:0:room:94":
  name: Socrates' Prison Cell
  description: >
    The small prison cell is stifling and claustrophobic. A single glaring bulb in the plywood ceiling
    is out of reach. The only break in the block walls is a steel door that is closed and locked.
  sector: inside
  flags: [indoors]

"tba:0:room:95":
  name: Confucius' Prison Cell
  description: >
    The musty stall is somehow cleaner than the others. A hole in the North wall and another in the
    floor has been cemented over. They must have once been a shower head and a drain before this stall was
    converted into a prison cell.
  sector: inside
  flags: [indoors]

"tba:0:room:96":
  name: James Stockdale's Prison Cell
  description: >
    The small stall turned confinement cell is covered in dust. The dirty floor has various words and
    designs scratched into the dirt. The ceiling consists of a single sheet of unpainted plywood.
  sector: inside
  flags: [indoors]

"tba:0:room:97":
  name: A Prison Cell
  description: >
    What used to be a shower stall has been converted into a solitary confinement cell complete with
    iron shackles. A single steel door that is closed and locked is the only exit. The walls are
    constructed of unpainted cinder blocks.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:0:room:89
      door:
        keywords: [lock]
        kind: pickproof
        reset: locked

"tba:0:room:98":
  name: The End of the Beginning
  description:
  - >
    For those of you who have read this far and actually made something out of it, Congratulations. You
    have the patience to become a builder and make CircleMUD zones. If you wimped out or skipped some
    areas then please MUDmail me why. {bright_red}AT POSTMASTER MAIL RUMBLE{/bright_red}. Also, please
    MUDmail or email me any questions, comments, concerns, or suggestions about this zone.  What did I do
    wrong, forget, misspell, anything! If you have something to add feel free to MUDmail or email me.
    {bright_red}HELP EMAIL{/bright_red}.
  - >
    This area is a culmination of help files I have come across and my own experiences in the CircleMUD
    community. I thank all those before who have helped in the creation of this masterpiece. Special
    Thanks to Welcor, Elaseth, Manivo, Snowlock, and Lance for their additions.
  - Remember, MUDding is fun!
  - Respectfully,
  - Rumble
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:0:room:99
    west:
      to: tba:0:room:15

"tba:0:room:99":
  name: TBA Cafe 99
  description: >
    Welcome to TBA Cafe 99, the hangout of builders and implementors. So pull up a pew and have a nice
    drink! If you want to have a social chat or lurk in order to help newer builders, this is the place
    to be!
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:0:room:98
  extras:
  - keywords: [sky, winds]
    text: Cold winds plunge ceaselessly at you from the dark, cloudless sky.
  - keywords: [floor]
    text: >
      The stone floor is the same shade of gray as the sky and is completely plain and unscratched. It is
      probably too hard for anything to leave as much as a scratch on it.
