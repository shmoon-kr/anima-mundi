"tba:0:mob:27":
  keywords: [man, james, bond, stockdale, admiral]
  short: James Stockdale
  long: A man beaten to the brink of his life stares up at you with powerful eyes.
  description: >
    James Stockdale was shot down by anti-aircraft fire during Vietnam.  He was held as a POW for seven
    years.  He spent over half of this time in solitary confinement in leg irons.  Even being
    incapacitated he was still able to lead the POW underground resistance successfully.  For this he was routinely
    tortured and beaten resulting in permanent disablement from a repeatedly broken leg, broken back,
    and shoulders being wrenched from their sockets.  When his captors attempted to use him as televised
    propaganda, he slit his scalp with a razor. When they covered the cut with a hat he beat himself with a
    stool until his face was swollen beyond recognition.  As a final attempt he slit his wrists rather
    than allow himself to be used or let down his fellow POWs.  His captors found him unconscious and near
    death.  The torture stopped after that and they no longer attempted to use him.  He received the
    Medal of Honor for his actions.
  level: 34
  sex: male
  alignment: 0
  flags: [sentinel, no_kill]
  combat:
    thac0: 9
    armor: -10
    hit_points: 6d6+340
