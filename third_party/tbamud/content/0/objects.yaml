      Resplendent as the sun, this bow of pure silver seems to exude purity and goodness.  The bow itself
      is a shaft of pure silver, inscribed with sunbursts and lightning bolts.  Its string is a thread of
      purest white light that shimmers as you look at it.  No arrow is needed for this mighty weapon.  Its
