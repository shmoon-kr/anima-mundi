      white were before.  Seek truth where others seek good and evil.  Bring justice through the scales of
      balance.  Then may you wield the truth that is my gift."

"tba:0:obj:27":
  type: weapon
  keywords: [axe, quest, doomslaying]
  short: the axe of doomslaying
  long: The axe meant to end all that is good in the realms floats here seeking a head to remove.
  flags: [hum, no_donate, magic, anti_good, anti_neutral, no_sell]
  wear: [take, wield, hold]
  values:
    damage: 10d9
    attack: slash
  weight: 1
  cost: 1000
  rent: 0
  level: 20
  affects:
  - apply: hitroll
    modifier: 5
  - apply: damroll
    modifier: 5
  - apply: dex
    modifier: 3
  extras:
  - keywords: [axe, doomslaying, quest]
    text: >
      Darkest midnight, purest evil, death embodied.  This weapon is the end of all that is good.  Made
      only of shadows and the taint that is the most obscene corruption, the head of this axe is jagged and
      spiked.  The blade is balanced by a wicked spike giving this ancient weapon the look of a warped
      headsman's axe. No light seems to reach it, no living thing seeks its touch.  Tendrils of sickly smoke
      rise from the blade tainting your thoughts and the very air around you. It calls you, it draws you. 
      "Wield me, worship me, watch me take the blood of the pure.  Become one with my taint.  Feel the
      foulness fermenting your soul. Accept evil, accept the shadow.  Wield me and become death.  Become
      immortal."

