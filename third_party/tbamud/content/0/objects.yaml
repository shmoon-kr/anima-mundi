      The blade of this beautiful weapon is inlaid with tiny wavelets.  The guard extends far out from
      the basket hilt, guarding the wielder from all attacks. Engraved across the blade are these words. 
      "Seek not death.  Seek not triumph. Seek wisdom, honor, and truth.  For I wield the spirit of my
