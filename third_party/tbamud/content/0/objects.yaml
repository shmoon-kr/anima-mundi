    text: >
      This small green cap is made of a fine velvet lined with silk.  Its material seems to conform to
      your touch, as if trying to accommodate itself to your grasp.  Its only distinctive feature is a
      emerald studded silver stickpin jutting jauntily out of the front of the cap.  A peace of silk ribbon forms
      a band around the inside of the brim.  These words have been embroidered into the cap's material. 
