    text: >
      There is no greater weapon in mortal hands.  This is an instrument of death. The two-headed axe was
      meant for the hands of a giant.  The shaft and hilt of this mighty blade are formed from a gray
      stone that can never be chipped or broken.  The head of the weapon is formed from two massive pieces of
      obsidian, shaped like diamonds, side by side.  However this vicious object has but one purpose. 
      Etched into the two heads of the axe are these words.  "Slash, slice, swerve and swipe.  Dodge, duck, down
      and up.  I draw the blood of the weak. Thunder marks my strike.  Lightning shines when I am drawn. 
      I am the storm to end all.  I am the dragonbane."

