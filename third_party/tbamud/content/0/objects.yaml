  - apply: move
    modifier: 50
  extras:
  - keywords: [spear, quest, balance]
    text: >
      The Lance of heroes.  The spear of mortal man.  The shaft of this legendary pike is carved from the
      wood of the tree of life.  Though separated from the tree that gave it life, the wood is a living,
      thinking entity.  Full 6 feet in length, the shaft's wood is smooth and unbroken by any scratch or
      mark.  The head of the spear is a huge dragon's fang, rumored to be from the mouth of the god Balm
