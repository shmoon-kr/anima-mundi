# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 39.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:39:room:3900":
  name: The City of Haven
  description: >
    Haven is located far south of the capital.  The city thrives because it's the main supplier of fish
    and other sea goods to the capital.  The location of the city provides quite a scenery.  There are
    mountains to the east and forest to the west.  More of a jungle really.  The sea is just south of the
    city with a beautiful sandy beach, stopped abruptly by the mountains to the east and a range of
    impassable cliffs not far west of the forest line.  The South Road (people in Haven have always laughed at
    this name for it, since from here it actually goes north) begins just outside a marvelous city
    gate.  The gate is more for show though than for protection since Haven never had anything to fear because
    of its remote location.  Anyway, what lord would be inerested in a few fish?  This has not really
    changed, even with the coming of the south road, since regular patrols of elite soldiers are assigned
    to protect it and garrison the city itself.
  sector: inside
  flags: [dark, indoors, no_track, private]
  extras:
  - keywords: [credits]
    text: Nivan

"tba:39:room:3901":
  name: The Captain's Cabin
  description: >
    The cabin looks comfortable, but not exactly opulent or rich.  The round windows are open to let in
    the salty breeze.  A couch is under one of these, made of horsehair and very soft-looking.  Maps of
    the sea line the walls, along with the many instruments used in sailing.  There is also a bed and a
    small stove here, next to the writing desk.  All of the furniture is securely bolted to the floor,
    thus unaffected by the ship's rocking.  The door to the north leads back out onto the decks.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:39:room:3931
      door:
        keywords: [north, cabin]
        kind: door
        reset: closed

"tba:39:room:3902":
  name: Harem Room
  description: >
    Interesting.  The Lord of Haven is quite obviously a man with a vice. Scantily clad women fill this
    room.  There are piles of silks and pillows all over the floor, looking comfortable to just rest
    in.  There is a particularly large pile of the softest pillows against the west wall.  Maybe they are
    for Degruziel's favorite girl.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:39:room:3904
      door:
        keywords: [down]
        kind: door
        reset: closed

"tba:39:room:3903":
  name: Degruziel's Private Chamber
  description: >
    This room is floored in lush red carpet, soft and almost ankle deep.  The curtains are open over
    the windows, giving you a wonderful view of the garden. The walls here are white, where they aren't
    obscured by tapestries of the local gods and goddesses.  Against the wall by the only exit, the door you
    came in through, there is a great oak wardrobe.  With much space inside.  What catches and hold your
    attention, however, is the huge bed in the center of the room. It could comfortably sleep three, but
    looks more to the liking of two.  It looks comfortable.
  sector: inside
  exits:
    west:
      to: tba:39:room:3904
      door:
        keywords: [west, door]
        kind: door
        reset: closed

"tba:39:room:3904":
  name: Top of the Staircase
  description: >
    The room at the top of the staircase isn't so large, nor so fancy, as the rooms of the lower
    story.  These rooms on the second floor must be private rooms, not meant for the public eyes.  Though not
    as brightly lit as the area downstairs, you can still see well by the torches lining the stone walls.
    There is a curtained window looking outside, while there are also doorways leading north and east.  A
    simple staircase against the west wall leads up into the tower of Degruziel's Manor, the door up
    there being barred with a very LARGE lock.  There is a curtained window looking outside, to the south
    and the sea.  To the north is a plain, low door.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:39:room:3905
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:39:room:3903
      door:
        keywords: [east, door]
        kind: door
        reset: closed
    up:
      to: tba:39:room:3902
      door:
        keywords: [up]
        kind: door
        reset: closed
    down:
      to: tba:39:room:3907

"tba:39:room:3905":
  name: Servant's Quarters
  description: >
    The room is crowded, but a faint breeze scented with smells of the garden wafts in through an open
    window.  It must be getting funneled in around the tower, because the window is facing north, and the
    wind usually blows from the south.  There are several mats lying out on the middle of the floor, and
    a drawn-back curtain separates the room into sections.  The mats, though only filled with straw,
    look pretty comfortable.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:39:room:3904
      door:
        keywords: [south]
        kind: door
        reset: closed

"tba:39:room:3906":
  name: A Dank Dungeon Chamber
  description: >
    You step into the dark wetness of the prison chamber...  And the heavy iron door swings swiftly
    shut behind you!  You are trapped in the dank room.  You are able to make out manacles on the north
    wall.  A filthy pile of cloth is heaped against the west wall.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:39:room:3921
      door:
        keywords: [pile, secret, cloth]
        kind: door
        reset: closed
  extras:
  - keywords: [dungeon]
    text: >
      His words bring to mind that the cloth looks suspicious.  Maybe you should stir it around a bit... 
      It might be concealing something.

"tba:39:room:3907":
  name: The Double Stairway
  description: >
    Against the north and south walls are twin pairs of beautiful staircases. They are salmon-colored
    marble arms curving into an embrace of the center of the room, where a fountain stands.  The exquisite
    marble fountain is of a fish perched on its tail, water spurting from its mouth.  Back to the east
    the red carpet begins again, while the stairs lead up to the second floor of the Manor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:39:room:3908
    up:
      to: tba:39:room:3904

"tba:39:room:3908":
  name: An Artfull Hallway
  description: >
    This room is only called a hallway because it connects one room in the Manor to another, not
    because of its size.  Beautifully stitched tapestries line the walls, each with its own story to tell. 
    Carvings, sculptures, paintings, and all sorts of forms of art are scattered around, some hanging and
    others on marble stands that are themselves sculptures.  Here the stone floor has been covered in rich
    red carpet.  To the north is a small plain door, and to the west is a twin set of double,
    majestically curving staircases.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:39:room:3909
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:39:room:3910
    west:
      to: tba:39:room:3907

"tba:39:room:3909":
  name: Degruziel's Audience Chamber
  description: >
    Through the door lies a small office, where Degruziel likes to hold his appointments, inner
    councils, audiences, and other such functions.  There is a round table in the center of the room, set with
    six chairs, and a desk in the nearest corner.  The desk is piled with all sorts of papers, scrolls,
    and writing utensils.  The candleholders on both the table and the desk are fancy, like everything else
    in the room, but they also have an air of utility about them instead of the plain oppulance of the
    hallway you just exited.  The stone walls are lined in shelves which are covered in books.  Behind the
    high-backed wooden chair is a small painting, and on the north wall is a window facing into the
    garden.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:39:room:3908
      door:
        keywords: [south]
        kind: door
        reset: closed
  extras:
  - keywords: [painting]
    text: >
      This painting is of Lord Degruziel standing proudly on the deck of a ship at full sail, a huge fish
      held in his outreaching arms.

"tba:39:room:3910":
  name: Degruziel's Parlor
  description: >
    This must be where Degruziel, the Lord of Haven, entertains his guests. There are comfortable
    chairs and couches strewn about the center of the large room.  Above the massive fireplace there sets a
    large painting of the god of the sea.  Before the fireplace there is a long mahogony dining table,
    large enough to seat twelve.  Tapestries cover the stone walls.  From the archway to the east drift
    pleasant smells, while to the west, across a distance filled with art, you can see a double curving
    stairway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:39:room:3911
      door:
        keywords: [door, north]
        kind: door
        reset: closed
    east:
      to: tba:39:room:3912
    west:
      to: tba:39:room:3908

"tba:39:room:3911":
  name: The Manor Porch
  description: >
    The cart path here leads both eastward toward the stables, where a body might visit the horses, or
    to the north through the garden and back to the street.  To the south is the Lord of Haven's oppulant
    porch and front door. The railing of the porch is carved to resemble a vine twisting about itself,
    while the posts are exquisitely carved into fish sitting on their tails, with their mouths around the
    railing.  Their jeweled eyes wink in the light.  The door is a large, fanciful myriad of carvings
    depicting a local legend.
  sector: city
  exits:
    north:
      to: tba:39:room:3914
    east:
      to: tba:39:room:3913
      look: Nothing.
      door:
        keywords: [door, stable, east]
        kind: door
        reset: closed
    south:
      to: tba:39:room:3910
      door:
        keywords: [door, south]
        kind: door
        reset: closed
  extras:
  - keywords: [door, legend]
    text: >
      The carvings on the door show a scene of one of Haven's greatest heros, Delegarthe Haven himself,
      slaying the dreaded sea dragon and making Haven a safe place to fish.
  - keywords: [railing, fish, carving, porch]
    text: >
      Before you is the masterfully decorated porch.  It is roofed in red tiles. The railings are all one
      piece of wood, a flowing flowery vine.  The flowers collect water and form pools for small bird
      baths.  The posts holding the railing up are of the same piece of wood as the railing itself, and are of
      Haven's main export, fish, standing on their tails and supporting the vine with their mouths.  The
      sapphires that form the eyes of the fish twinkle merrily, almost making you believe the fish to be
      alive.

"tba:39:room:3912":
  name: Tiama's Kitchen
  description: >
    Serving girls bustle about all around this pleasant-smelling room.  It is very warm in here, from
    all the heat being given off by the many stoves, ovens, and fireplaces.  The countertops in this room
    are all dusted with flour, and so are the bustling serving girls.  A cooling rack for bread is
    fastened against one wall, while a cellar entrance is not to far away from the archway leading back to the
    parlor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:39:room:3910
    down:
      to: tba:39:room:3982
      door:
        keywords: [down, cellar, door]
        kind: door
        key: tba:39:obj:3901
        reset: closed

"tba:39:room:3913":
  name: The Manor Stables
  description: >
    The interior of the stables is dim, but you can make out many rows of rather spacious, grand
    stables.  A little bit much for horses and such, but if that is the way a person wants to spend their
    money...  The smells of hay and horses are strong, and the soft sounds of stable boys calming some of the
    more skitish horses that were startled by your entry can be heard in the far back of the complex over
    the swish of tails and the periodic whinny.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:39:room:3911
      door:
        keywords: [west, stable, door]
        kind: door

"tba:39:room:3914":
  name: The Lord's Flower Garden
  description: >
    The winding cart path that passes from the street by the Lord's front porch and onward to the
    stables also passes through his magnificent flower garden. The gentle hues of purples, reds, whites,
    yellows, and blues rest the eyes from all the other attractions in the city.  The purfume of the
    everblooming flowers fill the air pleasantly, mingling with the salty breeze of the sea.  Vines hang festively
    from the branches of the many trees, and animals cavort under them, unafraid.  The cart path
    continues both toward the street and toward the porch, up to you to choose the way.
  sector: city
  exits:
    north:
      to: tba:39:room:3991
    south:
      to: tba:39:room:3911
  extras:
  - keywords: [flower, everblooming, flowers, ever, blooming, vine, vines]
    text: >
      The flowers are in many hues and give off meny scents that mix to make an overall pleasant
      purfume.  The plants have been magically altered to produce sweet blooms, even in the dead of winter.
  - keywords: [animal, animals]
    text: >
      Rabbits, foxes, birds, and other small mammals dart under the trees and across your path,
      absoluetly unafraid.

"tba:39:room:3915":
  name: A Room Full of Stolen Goods
  description: >
    This room, beyond any of the others, is cluttered with many stolen goods. Everything from rolls of
    carpet to chests of coins and jewels are here, carefully packed to be sold on the black market.  Some
    of the towers are so high that if you are not careful and wary of your step they might collapse,
    crushing you.  This is obviously where the current inhabitants of the Hideout store the majority of
    their booty.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:39:room:3917
    east:
      to: tba:39:room:3916

"tba:39:room:3916":
  name: The Common Room
  description: >
    The floor of this room is littered in rolls of bedding, its single candle not helping to illuminate
    much of anything in the dim room.  The sounds of people in slumber filter through, as if the room is
    very much occupied.  This room is way to dim to see the edges of, but it echos as though the chamber
    is very large.  Water drips somewhere to the east, pinging in the bottom of an unseen pot.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:39:room:3915

"tba:39:room:3917":
  name: A Room in the Thieve's Hideout
  description: >
    This room is loaded with stolen goods, from the tapestries hanging on the walls to the single gold
    candleholder that holds this room's one candle, to the expensive imported rugs on the floor.  The
    shadows in this room are deep and sinister.  You get the feeling it would be wise to keep an eye open
    for trouble.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:39:room:3922
    south:
      to: tba:39:room:3915

"tba:39:room:3918":
  name: Beyond the Shrine
  description: >
    As you push aside the black velvet curtain you notice that this room is quiet and obviously unused
    by the thick layer of dust on the floor.  It is also dark, the black lump of wax on the table
    indicating the candle that had once lit this room burned down long ago.  This room might have once been
    splendid, but now its bright tapestries are faded and covered in dust, the red carpet rotten and ready to
    fall apart.  Even the full-sized portrait on the east wall is faded beyond recognition.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      look: >
        The portrait here is faded beyond recognition, but perhaps in the shadows of dust you can make out
        the form of a smiling woman.
      door:
        keywords: [portrait]
        kind: door
    south:
      to: tba:39:room:3919

"tba:39:room:3919":
  name: A Small Shrine
  description: >
    This is the most brilliantly lit room you have seen in the whole of the thieve's hideout, with
    several small, low-burning candels set up under a picture of a beautiful woman.  The colors of the
    candles vary from bright red, to dried-blood, to the deepest midnight black.  You feel as though it
    wouldn't be prudent to speak above a whisper in this room.  The air here is serious and mournful, with the
    boards of the floor and both the stone walls and ceiling painted black.  The small current of flowing
    air ripples the black fabric covering the arch to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:39:room:3918
    south:
      to: tba:39:room:3922

"tba:39:room:3920":
  name: Trianne's Hidden Cache
  description: >
    Upon entering the room magical lights trace a script through the air, {bright_red}'Touch my things
    and I will find thee and kill thee.  Trianne.  '{/bright_red} Half-rotten chests line the walls,
    their magical barriers still standing though the wood that the spells were cast upon is in a state of
    advanced decay. Golden nuggets and jewels of all colors sparkle through the gaps in the wood, reflecting
    light from the light spell cast upon a globe of rock in the center of the room.  So tantalizing... 
    Too bad you can't touch them.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:39:room:3918

"tba:39:room:3921":
  name: A Boring Room
  description: >
    This room is carpeted plainly in black, enhancing the appearance of the shadows cast by the single
    black candle, whose flame burns blue in the room. It sets on the simple table, the only furniture.  A
    rather plain tapestry rests hanging from the east wall.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:39:room:3906
      door:
        keywords: [secret, tapestry]
        kind: door
        reset: closed
    west:
      to: tba:39:room:3922

"tba:39:room:3922":
  name: Passageway
  description: >
    You find yourself in a passageway of the thieve's hideout, archways on all sides of you.  The east
    is carved simply, the west having a lion's head over it, the north a wolf's, and the south a bear's. 
    Another single candle lights this room, casting long shadows around the mismatches furniture and
    stolen tapestries.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:39:room:3919
    east:
      to: tba:39:room:3921
    south:
      to: tba:39:room:3917
    west:
      to: tba:39:room:3923

"tba:39:room:3923":
  name: Thieve's Hideout
  description: >
    When a person thinks of Haven with its Crowded Market and its patrols of elite guards one doesn't
    often think of a thieve's headquarters.  But the is what you find yourself in - a skillfully hidden
    and very dry thieve's hideout. Tapestries line the walls, most likely as stolen as the comfortable
    furniture scattered around on the wooden floor.  The light is dim - a single candle leaves many
    conspicuous shadows around the room.  There is a glow through the archway to the east, also.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:39:room:3922
    up:
      to: tba:39:room:3924
      door:
        keywords: [trap, door, trapdoor, up]
        kind: door
        reset: closed

"tba:39:room:3924":
  name: Under Haven
  description: >
    This must be a part of the old sewer system of Haven when it was a small town.  Now the walls of
    the sewer have crumbled, leaving a giant pool of open water, littered on the bottom by old stones.  The
    water stretches out far past your eyes and your light in some places.  The floor is made up of a
    watery muck, consisting of water, sand, rotten seaweed, and some other things you wouldn't even want to
    think of.  The much is shallow, only up to your knees. It churns violently in some places, as if
    there are living things under it. There is a wooden crate in the corner here, sunk into the muck.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:39:room:3930
    east:
      to: tba:39:room:3926
    down:
      to: tba:39:room:3923
      look: The muck is still shallow, with a rotting crate stuck into it.
      door:
        keywords: [crate]
        kind: door
        reset: closed

"tba:39:room:3925":
  name: Under the Docks
  description: >
    It's pretty dark under the docks, though the sand is stable.  The water is calm here, being
    surrounded by rocks that break the waves, leaving you in knee deep stagnant water.  The docks here descend
    to the street to the north, forcing you to crouch, while to the south there is a hole in the rocks
    that might be the lair of a king crab.  A rope ladder hands down from the docks aboe, green with moss
    that thrives in the moist air.  It would be a tight squeeze, but you also think you might be able to
    edge between the wood and the rocks to the north, but your ability to return is indeed questionable.
  sector: city
  exits:
    north:
      to: tba:39:room:3938
    east:
      to: tba:39:room:3970
    west:
      to: tba:39:room:3927

"tba:39:room:3926":
  name: Under Haven
