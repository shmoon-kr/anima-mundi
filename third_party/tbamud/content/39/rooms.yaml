"tba:39:room:3931":
  name: Forward Deck of the Fishing Vessel
  description: >
    The ship rocks gently on the waves, making most landgoers almost lose their balance.  A net has
    been spread across the deck, absolutely heaped with all manner of huge fish.  Many sailors line the deck
    of the ship, their huge muscular arms pitching fish over the railing quickly, their movements almost
    a blur.  Skinnier men dart here and there, what they are doing quite unapparent to you.  There is a
    trap door leading to below the decks not far from where you stand, while to the south is the door of
    a cabin.
  sector: city
  exits:
    east:
      to: tba:39:room:3935
    south:
      to: tba:39:room:3901
      door:
        keywords: [south, cabin]
        kind: door
        reset: closed
    down:
      to: tba:39:room:3950
      door:
        keywords: [down, hatch, trap, door, trapdoor]
        kind: door
        reset: closed

"tba:39:room:3932":
  name: Amid Ships
  description: >
    Fishing vessles line the docks here, their planks puled up and the ships dark.  Apparently they
    have finished unloading cargo and have let their men go into the city.  To the east is a bare, wet,
    windswept area of docks.  Funny, but for all the traffic elsewhere nobody is on that section.
  sector: city
  exits:
    east:
      to: tba:39:room:3975
    west:
      to: tba:39:room:3935

"tba:39:room:3933":
  name: Beautiful Beach
  description: >
    The beach here is calming to the nerves.  Sunbathers inhabit the sand, happily wasting their day on
    getting a tan and relaxing in the very fine sand. The sand is soft and the beach smooth from the
    constant wind.  The water here is warm and calm, lapping in gentle waves.  Children of the town swim
    merrily, all the way out to the jagged rocks that waves crash against the other side of, throwing spray
    into the air.  It is a good thing those rocks are there to act as breakers, or this beautiful beach
    wouldn't be swimable.
  sector: field
  exits:
    north:
      to: tba:39:room:3959
    east:
      to: tba:39:room:3976

"tba:39:room:3934":
  name: Aramut's Workroom
  description: >
    Through the door behind Aramut's counter is his workroom, where he works on his armor.  There are
    tools scattered around a bench and a table.  Upon the table lies the beginning of a piece of mail,
    with several hours of work left before it will become one of Aramut's fine crafts.  The south 'wall' of
    the workroom is open, with several feet of a drop to the deep water and jagged rocks below.  It would
    be wise not to step to close - the wind past the entrance is swift, though the inside of the
    workroom is strangely calm.  There is a heavy sea chest against the east wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:39:room:3975
    west:
      to: tba:39:room:3972

"tba:39:room:3935":
  name: Amid Ships
  description: >
    To the east the docks continue, but to the west there is a huge fishing ship. It definitely isn't
    the small, one-man boat the words 'fishing boat' would likely bring to mind.  It is monstrous! 
    Sailors with carst stand waiting as huge fish are constantly pitched over the side of the ship.  Other men
    stand in line, waiting for the front cart to be filled and rush off to the market so that they may
    move up and have their own filled.  A plank ramp leads up onto the deck.
  sector: city
  exits:
    north:
      to: tba:39:room:3967
    east:
      to: tba:39:room:3932
    west:
      to: tba:39:room:3931

"tba:39:room:3936":
  name: On the Docks
  description: >
    The docks of Haven are rumored to be a marvelous place - or so the conversations you have overheard
    between townspeople and weary travelers say. But from here you can't see much of them.  There is
    just plain too much traffic.  On both sides of the docks here there are wet-looking sand closest to the
    shore, while further out waves crash into treacherous rocks.  There is a slippery rope ladder over
    the side here, hanging down into the darkness under docks.
  sector: city
  exits:
    north:
      to: tba:39:room:3938
    south:
      to: tba:39:room:3967

"tba:39:room:3937":
  name: Sandy Path
  description: >
    The sound of the sea against the rocks to the south is soothing to the nerves.  The wide path has
    some traffic, but though there are men with carts rushing both to the market and to the docks, the
    wideness of the road makes it somehow less crowded.  There is loud, bawdy singing to the east somewhere,
    and a sandy beach to the south, strangely flat.
  sector: city
  exits:
    east:
      to: tba:39:room:3971
    south:
      to: tba:39:room:3970
    west:
      to: tba:39:room:3938

"tba:39:room:3938":
  name: Before the Docks
  description: >
    The sandy path isn't so sandy here, the sand regularly being swept off the cobbles by the quick
    passage of feet.  To the south there is a large ramp leading onto the docks.  Sailors pushing carts at
    furious paces speed along, and it's surprising that they don't crash into each other.  Far out along
    the docks you can see men rushing on and off of giant fishing vessels, and even a few colorful ships. 
    To the north is a squat building, in good repair.  The open door spills the smells of beer and
    heavier drinks out onto the street, along with the bawdy drinking songs the patrons are singing.  Above
    the door is nailed a cracked mug.
  sector: city
  exits:
    north:
      to: tba:39:room:3940
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:39:room:3937
    south:
      to: tba:39:room:3936
    west:
      to: tba:39:room:3939

"tba:39:room:3939":
  name: Sandy Path
  description: >
    This path has barely any traffic compared to the rest of Haven.  The few people here are leisurely
    loitering, enjoying the scenery.  From somewhere to the east tendrils of bawdy songs reach your ears,
    quickly swept away by the rush of the ever-present sea breeze.  Looking to the east you can see the
    rush of men on to and off of the dock entrance that is there, while to the west the area is peaceful.
  sector: city
  exits:
    east:
      to: tba:39:room:3938
    west:
      to: tba:39:room:3963

"tba:39:room:3940":
  name: Inside the Cracked Mug
  description: >
    This is quite obviously a fisherman's bar, from the net hanging across the ceiling, which is
    currently being used to hand lanterns from, to the giant trophy fish hung on the walls.  Both the smells of
    beer and pipesmoke hand heavily in the air in the hazy room, and the tables are spread near together
    on the dirty floor.  To the north a short, muscular, young bar keeper is polishing glasses with a
    dirty rag when he isn't serving drinks.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:39:room:3938
      door:
        keywords: [south]
        kind: door
        reset: closed

"tba:39:room:3941":
  name: North Gull Road
  description: >
    Here is not nearly as crowded as the area near the gate you can see to the east.  North Gull Road
    is peaceful, though it still has some traffic.  It runs through the residential section of Haven, and
    to the south are mostly houses. The cobbles here are clean, and the smell of salt is strong.  To the
    north the land slopes upward, keeping Haven in its beautiful vale.
  sector: city
  exits:
    east:
      to: tba:39:room:3998
    west:
      to: tba:39:room:3942

"tba:39:room:3942":
  name: Intersection of North Gull Road and Market Path
  description: >
    This intersection is slightly more crowded than the parts of Nroth Gull Road you can see to the
    east and west.  To the south is Market Path, and beyond that you can see flashes of color.  To the north
    the land continues to slope upwards, keeping Haven in its beautiful vale.
  sector: city
  exits:
    east:
      to: tba:39:room:3941
    south:
      to: tba:39:room:3964
    west:
      to: tba:39:room:3943

"tba:39:room:3943":
  name: North Gull Road
  description: >
    To the west North Gull road continues, while to the east there is a small intersection.  North Gull
    Road is peaceful, though it still has some traffic. It runs through the residential section of
    Haven, and to the south are mostly houses.  The cobbles here are clean, and the smell of salt is strong. 
    To the north the land slopes upward, keeping Haven in its beautiful vale.
  sector: city
  exits:
    east:
      to: tba:39:room:3942
    west:
      to: tba:39:room:3944

"tba:39:room:3944":
  name: North Gull Road
  description: >
    To the east and west North Gull Road continues.  North Gull Road is peaceful, though it still has
    some traffic.  It runs through the residential section of Haven, and to the south are mostly houses. 
    The cobbles here are clean, and the smell of salt is strong.  To the north the land slopes upward,
    keeping Haven in its beautiful vale.
  sector: city
  exits:
    east:
      to: tba:39:room:3943
    west:
      to: tba:39:room:3945

"tba:39:room:3945":
  name: North Gull Road
  description: >
    To the east is more of North Gull Road, while to the west there is a small intersection.  North
    Gull Road is peaceful, though it still has some traffic. It runs through the residential section of
    Haven, and to the south are mostly houses.  The cobbles here are clean, and the smell of salt is strong. 
    To the north the land slopes upward, keeping Haven in its beautiful vale.
  sector: city
  exits:
    east:
      to: tba:39:room:3944
    west:
      to: tba:39:room:3946

"tba:39:room:3946":
  name: Intersection of North Gull Road and Luna's Alley
  description: >
    People hurry past this intersection, casting worried glances to the south as if they expect
    something monstrous to leap out of the alley at any second. From there the pungent odors of trash and other
    unpleasant smells drift towards you.  Cackling, insane laughter and assorted gibberish can also be
    heard from the darkness created by the overhanging roofs.  It really isn't a wonder people hurry past
    with their noses covered by handkerchiefs.
  sector: city
  exits:
    east:
      to: tba:39:room:3945
    south:
      to: tba:39:room:3974
    west:
      to: tba:39:room:3947

"tba:39:room:3947":
  name: North Gull Road
  description: >
    To the east is a small intersection, while to the west North Gull Road ends. North Gull Road is
    peaceful, though it still has some traffic.  It runs through the residential section of Haven, and to
    the south are mostly houses.  The cobbles here are clean, and the smell of salt is strong.  To the
    north the land slopes upward, keeping Haven in its beautiful vale.  To the south the town spreads before
    your view like a colorful map.
  sector: city
  exits:
    east:
      to: tba:39:room:3946
    west:
      to: tba:39:room:3948

"tba:39:room:3948":
  name: Corner of North Gull Road and Riverwalk
  description: >
    Here, North Gull Road intersects with Riverwalk.  North Gull road goes east through the residential
    section while Riverwalk goes south, close to the bank of the swiftly running stream.  The once
    rushing, giant river that had carved the vale that Haven now lies in is now nothing more than quick
    stream.  On the other side of the stream begins a dense forest, the leafy foliage and dense undergrowth so
    thick that you can see nothing else.
  sector: city
  exits:
    east:
      to: tba:39:room:3947
    south:
      to: tba:39:room:3951

"tba:39:room:3949":
  name: South Gull Road
  description: >
    The houses along South Gull Road are smaller than the ones you can see to the north, but they are
    still quite nice.  This road is patchily shaded by the small trees in some of the small yards, and
    periodic small beds of flowers add their scents to the breeze that sweeps across the clean cobbles. 
    Strolling residents occasionally pass you, smiling happily.  To the west is the intersection with
    Riverwalk, which hardly has any more people than South Gull Road has.  There are white benches that you
    might rest on, however.
  sector: city
  exits:
    east:
      to: tba:39:room:3987
    west:
      to: tba:39:room:3953

"tba:39:room:3950":
  name: Below the Decks
  description: >
    Under the decks is dark, having no windowns or outside light sources.  No lamps are lit down here,
    being a fire hazard on the swaying ship.  Bunks are here in neat rows, bolted down to the floor. 
    There is also a small group of tables near here, obviously a mess.  To the north barrels of water are
    securely tied, in the case of the sailors and fishermen getting struck at sea by a storm.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:39:room:3931
      door:
        keywords: [up, hatch, trap, door, trapdoor]
        kind: door
        reset: closed

"tba:39:room:3951":
  name: Riverwalk
  description: >
    This walk is pleasantly shaded by trees growing on the west side of the road, in small areas before
    pleasant homes.  To the east beyond a small grassy bank the quick stream gurgles merrily on its way
    to the south and the sea. People stroll slowly along, enjoying the shade and looking at the river.
  sector: city
  exits:
    north:
      to: tba:39:room:3948
    south:
      to: tba:39:room:3952

"tba:39:room:3952":
  name: River Walk
  description: >
    This walk is pleasantly shaded by trees growing on the west side of the road, in small areas before
    pleasant homes.  To the east beyond a small grassy bank the quick stream gurgles merrily on its way
    to the south and the sea. People stroll slowly along, enjoying the shade and looking at the river.  A
    few couples sit on the grass on the bank of the river, talking in low voices as the look at each
    other with love.
  sector: city
  exits:
    north:
      to: tba:39:room:3953
    south:
      to: tba:39:room:3953

"tba:39:room:3953":
  name: Intersection of Riverwalk and South Gull Road
  description: >
    This intersection has people walking through it in all directions, merrily going on their way. 
    There are the people traversing the Riverwalk, those going up and down South Gull Road, and those just
    resting on the benches.  There is even a platform here where a bard might perform.  It is a very
    peaceful intersection.
  sector: city
  exits:
    north:
      to: tba:39:room:3952
    east:
      to: tba:39:room:3949
    south:
      to: tba:39:room:3954

"tba:39:room:3954":
  name: Riverwalk
  description: >
    This walk is pleasantly shaded by trees growing on the west side of the road, in small areas before
    pleasant homes.  To the east beyond a small grassy bank the quick stream gurgles merrily on its way
    to the south and the sea. People stroll slowly along, enjoying the shade and looking at the river. 
    This is such a nice place, it is no wonder some people just walk along Riverwalk all day, enjoying the
    scenery.
  sector: city
  exits:
    north:
      to: tba:39:room:3952
    south:
      to: tba:39:room:3955

"tba:39:room:3955":
  name: Riverwalk
  description: >
    This walk is pleasantly shaded by trees growing on the west side of the road, in small areas before
    pleasant homes.  To the east beyond a small grassy bank the quick stream gurgles merrily on its way
    to the south and the sea. People stroll slowly along, enjoying the shade and looking at the river,
    which gurgles even louder as it flows over the small rocks here.
  sector: city
  exits:
    north:
      to: tba:39:room:3954
    south:
      to: tba:39:room:3956

"tba:39:room:3956":
  name: Riverwalk
  description: >
    This walk is pleasantly shaded by trees growing on the west side of the road, in small areas before
    pleasant homes.  To the east beyond a small grassy bank the quick stream gurgles merrily on its way
    to the south and the sea. People stroll slowly along, enjoying the shade and looking at the river. 
    To the south there is an intersection, marking the southern end of Riverwalk.
  sector: city
  exits:
    north:
      to: tba:39:room:3955
    south:
      to: tba:39:room:3959

"tba:39:room:3957":
  name: Mithroq's Instruments of Destruction
  description: >
    This shop is full of weapons of all kinds.  Indeed it wouldn't be wise to go too close to the
    walls, for the sheer number of naked sharp things hanging from the wooden racks there would shred you if
    any of the delicate structures collapsed.  It might be a nice idea to ask the shop keeper why he
    doesn't get sturdier-looking racks...  But then again, maybe he has them flimsy for a reason.  There is no
    way a thief would be able to grab any of those without the utmost caution.  The open door to the
    west leads back to Market Path, while Mithroq the minotaur stands behind a counter to the east,
    sharpening a giant sword and looking ready to help you.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    west:
      to: tba:39:room:3965

"tba:39:room:3958":
  name: Milos' Office, the Tax Collector with a Banking Hobby
  description: >
    Through the fancifully carved door you chose to go, and find yourself inside a rich, brightly lit
    room.  You can only enter the smallest part of it, however, with a large wooden counter seperating you
    and the huge pile of gold that takes up much of the other half of the room.  A guard stands behihd
    the counter, prepared for trouble with his hand resting lightly on the hilt of his sword.  There is
    also a short, thin gentleman here in rich silk clothes, quite obviously Milos the Banker of Haven.  The
    door to the south leads back to South Gull Road.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:39:room:3989

"tba:39:room:3959":
  name: Corner of Riverwalk and Sandy Path
  description: >
    Here Riverwalk turns into Sandy Path.  The stream to the west bubbles merrily into the ocean, where
    it joins with the rest of water.  The sound of waves crashing against rocks somewhere to the south
    fills the air, along with the screams of assorted seabirds.  The salty breeze blows a fine, refreshing
    mist onto you face.
  sector: city
  exits:
    north:
      to: tba:39:room:3956
    east:
      to: tba:39:room:3960
    south:
      to: tba:39:room:3933

"tba:39:room:3960":
  name: Sandy Path
  description: >
    Here the sand-covered cobbles of Sandy Path aren't very crowded.  Those who do pass here either
    hurry toward the east or leisurely stroll to the south. The far-off sound of waves pounding rocks comes
    faintly to your ears.  To the south there is a beautiful sandy beach, and the screams of children can
    be heard mingled with the cries of gulls.
  sector: city
  exits:
    east:
      to: tba:39:room:3961
    west:
      to: tba:39:room:3959

"tba:39:room:3961":
  name: Sandy Path
  description: >
    Here the sand-covered cobbles of Sandy Path aren't very crowded.  Those who do pass here either
    hurry toward the east or leisurely stroll to the south. The far-off sound of waves pounding rocks comes
    faintly to your ears.  To the south there is a beautiful sandy beach, and the screams of playing
    children can be heard mingled with the cries of gulls.  You can also see the outline of jagged rocks far
    off on the horizon.
  sector: city
  exits:
    east:
      to: tba:39:room:3962
    south:
      to: tba:39:room:3976
    west:
      to: tba:39:room:3960

"tba:39:room:3962":
  name: Sandy Path
  description: >
    Here the sand-covered cobbles of Sandy Path aren't very crowded, but to the south you see what
    could be sunbathers.  Those who do pass here either hurry toward the east or leisurely stroll to the
    south to join with others.  The far-off sound of waves pounding rocks comes faintly to your ears.  To the
    south there is a beautiful sandy beach, and the screams of children can be heard mingled with the
    hungry cries of gulls.
  sector: city
  exits:
    east:
      to: tba:39:room:3963
    south:
      to: tba:39:room:3968
    west:
      to: tba:39:room:3961

"tba:39:room:3963":
  name: Sandy Path
  description: >
    To the south what was previously sandy-looking is now a giant, jagged boulder of shiny black rock. 
    The southeastern breeze drifts the happy screams of children toward you.  To the north the door of
    one of the fishing family's house's stands open, the resident of the house is not there.  Perhaps they
    left in a hurry to the beach to retrieve a child, or maybe they went to the market for some last
    minute supplies.  The wind whistles through the cracks on the boulders and would set all but a deaf
    person's teeth on edge.
  sector: city
  exits:
    north:
      to: tba:39:room:3981
    east:
      to: tba:39:room:3939
    west:
      to: tba:39:room:3962

"tba:39:room:3964":
  name: Market Path
  description: >
    This path is a little bit crowded, being right between one of the better residential sections of
    Haven, North Gull Road, and the main commercial section of Haven, the market.  The traffic here, though
    more than you can see the the north, only gets worse as you go further south towards the colorful
    canopies. Shops line the east, but it appears most of the owners are out to the market. One shop is
    still open, one with a hanging sign nailed above the door, portraying a smoking vial.
  sector: city
  exits:
    north:
      to: tba:39:room:3942
    east:
      to: tba:39:room:3966
    south:
      to: tba:39:room:3965

"tba:39:room:3965":
  name: Market Path
  description: >
    To the south the noise and smells of the market are so much that they are almost painful.  Here the
    crowd is quieter, being mostly people carrying their day's find at the market back to their homes. 
    There is only one shop with its door still left open, begging for business.  It has a sign nailed
    above the door, one of a crossed sword and mace.
  sector: city
  exits:
    north:
      to: tba:39:room:3964
    east:
      to: tba:39:room:3957
    south:
      to: tba:39:room:3980

"tba:39:room:3966":
  name: Tia's Apothecary
  description: >
    This room is smoky and smells heavily of incense.  The beads hanging from the door rattle as you
    push them aside to enter, causing Tia to make note of your presence before turning back to her
    cauldron, adding a pinch of a strange-smelling herb to the foaming pot.  Other assorted herbs hang from the
    ceiling and both empty and full vials and bottles fill the shelves on the wall.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    west:
      to: tba:39:room:3964

"tba:39:room:3967":
  name: On the Docks
  description: >
    Contrary to the north, where the waves pound upon the rocks and stir the whole ocean up into a
    white froth, here merchant ships line the raised wooden docks in the safely deep water.  You can tell
    they are merchant vessels, for no fisherman with carts or anything else dash up and down their planks
    like they do for the ships further down.  The merchant vessels have sails of many colors, with flags
    from assorted kingdoms.  To the north the street is a bit far off, while to the south there are some of
    Haven's famous fishing vessels.
  sector: city
  exits:
    north:
      to: tba:39:room:3936
    south:
      to: tba:39:room:3935

"tba:39:room:3968":
  name: Beautiful Beach
  description: >
    Here is a serene sandy beach.  Happily smiling sunbathers sprawl in the sand, making those who wish
    to walk the beach have to watch their step or step upon a protruding limb.  The fine sand is soft,
    the beachsmoothed by the winds constantly sweeping it.  The water here is warm and calm, lapping in
    gentle waves.  Children in their underwear, probably children of the town, swim merrily, all the way
    out to the jagged rocks that waves crash against the other side of, throwing spray into the air.  It is
    a good thing those rocks are there to act as breakers, or this beautiful beach wouldn't be swimable.
  sector: field
  exits:
    north:
      to: tba:39:room:3962
    west:
      to: tba:39:room:3976

"tba:39:room:3969":
  name: Knee Deep
  description: >
    Contrary to the sandy cobbled walkway running to the north, standing in this apparently stable sand
    results in your sinking into the watery quicksand up to your knees before your feet come in contact
    with something solid.  To the east is another small stretch of quicksand beach before the docks
    begin.  To the south the sea begins, pounding aginst the jagged rocks in the quickly deepening water.
  sector: water_swim
  exits:
    north:
      to: tba:39:room:3971
    west:
      to: tba:39:room:3970

"tba:39:room:3970":
  name: Knee Deep
  description: >
    Contrary to the sandy cobbled walkway running to the north, standing in this apparently stable sand
    results in your sinking into the watery quicksand up to your knees before your feet come in contact
    with something solid.  To the west Are the thick, tall pillars that support the huge docks.  The area
    under the docks is dark.  To the south the sea begins, pounding aginst the jagged rocks in the
    quickly deepening water.
  sector: water_swim
  exits:
    north:
      to: tba:39:room:3937
    east:
      to: tba:39:room:3969
    west:
      to: tba:39:room:3925

"tba:39:room:3971":
  name: Intersection of Market Road and Sandy Path
  description: >
    The cobbled road of Haven here is almost covered by a thin layer of sand, with more constantly
    blowing in on the sea breeze coming from the south. There is also the beginning of the sea to the south,
    the sand interspersed with many jagged rocks upon which the waves break.  To the west Sandy Path,
    earned of its name, travels unbroken.  To the east is a wooden shack with a sign depicting a boat nailed
    over the door.
  sector: city
  exits:
    north:
      to: tba:39:room:3977
    east:
      to: tba:39:room:3972
    south:
      to: tba:39:room:3969
    west:
      to: tba:39:room:3937
  extras:
  - keywords: [sign, shack]
    text: >
      As you study the shack you see the sign with a boat painted on it. Underneath the boat in flowing
      caligraphy reads the words Aramut's Seaworthy Crafts.

"tba:39:room:3972":
  name: Aramut's Protective Wear
  description: >
    As you enter the shack you see a wizened old man standing over an almost finished piece of chain
    mail, adding the finishing touches.  There are all sorts of armor and clothes hanging from the ceiling
    and mounted upon the walls. The old man looks up as you enter, quickly jumping behind a counter
    against the eastern wall.  Behind the counter there is a squat door leading to a back room, presumably
    Aramut's workshop.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    east:
      to: tba:39:room:3934
    west:
      to: tba:39:room:3971

"tba:39:room:3973":
  name: Luna's Alley
  description: >
    The narrow alley is twisting, dark, and full of rotting trash.  The niches in the walls hold eyes
    the glow the reflection of your own light back at you, and laughter echos in the close space along
    with gibberish and screams, seeming to come from everywhere and nowhere at once.  Rats scurry around
    your feet and watch you from the shadows, hostile and almost as large as small cats.  It is not much of
    a wonder that the people of Haven avoid this place.  The inhabitants of this alley shy away from the
    small amount of light streaming in from the south and the intersection, their eyes accustomed to
    darkness and hurt by the natural light.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:39:room:3974
    south:
      to: tba:39:room:3987

"tba:39:room:3974":
  name: Luna's Alley
  description: >
    The narrow alley is twisting, dark, and full of rotting trash.  The niches in the walls hold eyes
    the glow the reflection of your own light back at you, and laughter echos in the close space along
    with gibberish and screams, seeming to come from everywhere and nowhere at once.  Rats scurry around
    your feet and watch you from the shadows, hostile and almost as large as small cats.  It is not much of
    a wonder that the people of Haven avoid this place.  The people at the comparatively light
    intersection to the north hurry past with their heads down.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:39:room:3946
    south:
      to: tba:39:room:3973

"tba:39:room:3975":
  name: Against the Rocks
  description: >
    The boards are wet from the spray of the waves crashing against the rocks below.  You get too close
    to the edge, and the quick wind picks you up and throws you over the boundaries of the wet boards. 
    The spiral of the wind throws you down into the bone-chilling water with a SPLASH!!  As you surface,
    before you have even the slightest time to react, you are dashed against the jagged rocks by the
    pounding waves.
  sector: inside
  flags: [no_mob]
  triggers: [tba:39:trg:3911]

"tba:39:room:3976":
  name: Beautiful Beach
  description: >
    Here is a serene sandy beach.  People lie in the sand, and those who have the full day away from
    work might sunbathe all day, sleeping under the stars at night.  The fine sand is soft, the beach
    smoothed by the winds constantly sweeping it.  The water here is warm and calm, lapping in gentle waves.
    Children of the town swim merrily, all the way out to the jagged rocks.  Waves crash hard against the
    other side of those rocks, throwing spray into the air. It is a good thing those rocks are there to
    act as breakers, or this beautiful beach wouldn't be swimable.
  sector: field
  exits:
    north:
      to: tba:39:room:3961
    east:
      to: tba:39:room:3968
    west:
      to: tba:39:room:3933

"tba:39:room:3977":
  name: Market Road
  description: >
    There is much traffic on this winding road.  Many of the people heading north are hauling carts
    full of fish, while many of the people heading south are hauling empty carts, smiling as their full
    purses jangle from their hips. To the north you can glimpse colorful canopies and crowds of people, while
    to the south you can hear the crash of waves breaking on rocks.  If you squint perhaps you can see a
    bit of the shimmering blue of reflected light where the winding road breaks between the many houses
    and establishments.
  sector: city
  exits:
    north:
      to: tba:39:room:3978
    south:
      to: tba:39:room:3971
    west:
      to: tba:39:room:3932

"tba:39:room:3978":
  name: Market Road, near the market
  description: >
    To the north the smell of fish, the press of people, and the noise of a busy market all become
    greater.  On both sides of the road you can see the crowd of people moving in all directions.  You can
    also glimpse the great gate of Haven to the south, and flashes of colorful canopies to the north.  One
    might wonder why so many people would be attracted to a fish market, of all things.
  sector: inside
  exits:
    north:
      to: tba:39:room:3994
    south:
      to: tba:39:room:3977

"tba:39:room:3979":
  name: Crowded Fish Market
  description: >
    People press in from all sides!  Under the brilliant, patched, colored cloth there is no such thing
    as a sky.  There are only people wandering the crowded market, men loading wagons, and merchants. 
    Oh the merchants!  Dressed in outrageous costumes and with all sorts of accents merchants yell of
    their wares, vying for your attention.  In a crowd such as this, one to make even you claustrophobic, it
    would be wise to keep your hands near your belt pouch.
  sector: inside
  exits:
    east:
      to: tba:39:room:3995
    south:
      to: tba:39:room:3993
    west:
      to: tba:39:room:3980

"tba:39:room:3980":
  name: Crowded Fish Market
  description: >
    People press in from all sides!  Under the brilliant, patched, colored cloth there is no such thing
    as a sky.  There are only people wandering the crowded market, men loading wagons, and merchants. 
    Oh the merchants!  Dressed in outrageous costumes and with all sorts of accents merchants yell of
