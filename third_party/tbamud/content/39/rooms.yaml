"tba:39:room:3981":
  name: The Fisherman's Shack
  description: >
    This shack is quite small, but looks very comfortable.  Against the east wall three bunks are
    stacked on top of each other in such a way as to fit, but to give each person enough space to lay down
    comfortably.  There is a small stove against the north wall, its red coals lighting the room.  A new
    hangs across the single window facing to the south and Sandy Path, serving as a curtain.  There is a bin
    of fish, Haven's main staple, against the west wall. The small floor, what isn't covered by a rug,
    is neatly swept dirt.
  sector: city
  exits:
    south:
      to: tba:39:room:3963

"tba:39:room:3982":
  name: The Manor Torture Chamber
  description: >
    This isn't exactly the cellar that the doors implied it would be.  It looks as though Lord
    Degruziel isn't exactly popular with everybody.  The room is dimly lit by a glowing brazier filled with red
    hot coals.  There is also a hot iron rod in the brazier, and it doesn't look too friendly.  You can
    barely make out a rack of glinting torture implements on the far wall, right to the left of the iron
    maiden.  Some of those instruments would make even the most hard-hearted and evil of the realm balk. 
    There is a heavy iron door to the west, with a small slit for looking inside to check on the prisoners.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:39:room:3906
      door:
        keywords: [west, door, prison]
        kind: door
        key: tba:39:obj:3900
        reset: closed
    up:
      to: tba:39:room:3912
  extras:
  - keywords: [door, slit, prison, prisoner, prisoners]
    text: The prison room is dark and damp, and you can't see much else through the small slit.

"tba:39:room:3983":
  name: Luna's Square
  description: >
    You step into the light created by many burning bundles of oil-soaked cloth, obviously makeshift
    torches, which light this open square.  Piles of filthy rags are heaped against the walls, serving as
    beds for those without homes. There is an old wooden chair against the east 'wall' of the square. 
    Once it might have been magnificent, the square, but now the once-beautiful fountain is just a
    granite-incased stagnant puddle, and the square itself is horribly dirty and in disrepair.
  sector: city
  exits:
    west:
      to: tba:39:room:3984
    down:
      to: tba:39:room:3928
      look: The chair sets comfortably on the dirty ground, its legs digging in to the dried dirt.
      door:
        keywords: [chair]
        kind: door
        reset: closed
  extras:
  - keywords: [chair]
    text: >
      You see a chair that might have once been marvelous, but is now in an advanced state of decay. 
      What might have once been intricate carvings are now only small indentations in the rotting wood, and
      one of the chair's legs is missing.

"tba:39:room:3984":
  name: Luna's Alley
  description: >
    The narrow alley is twisting, dark, and full of rotting trash.  The niches in the walls hold eyes
    the glow the reflection of your own light back at you, and laughter echos in the close space along
    with gibberish and screams seeming to come from everywhere and nowhere at once.  Rats scurry around your
    feet and watch you from the shadows, hostile and almost as large as small cats.  It is not much of a
    wonder that the people of Haven avoid this place, using it only as a dump.  Light streams in from
    the east, almost allowing you to see the path.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:39:room:3985
    east:
      to: tba:39:room:3983

