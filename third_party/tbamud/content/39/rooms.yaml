  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:39:room:3929
    west:
      to: tba:39:room:3924

"tba:39:room:3927":
  name: Knee Deep
  description: >
    Wow your going out a long way.  You are now knee deep in some dark waters. Will you not reconsider
    and turn back?  The waters are dark and you can not see anything below the surface except for a few
    small fish.
  sector: inside
  exits:
    east:
      to: tba:39:room:3925

