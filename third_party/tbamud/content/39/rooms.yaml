"tba:39:room:3994":
  name: Market Road, past the market
  description: >
    People shove past, in a hurry to get wherever it is they are going.  You can hear the swearing of
    various men on carts and wagons, trying to get them and their goods through the throng.  Nearby to the
    east colorful stitched canopies billow in the stiff, salty sea breeze.  The sounds of merchants
    yelling their wares and people yelling to each other in general are almost overwhelming.  To the south
    the throng thins into a crowd, and to the north you see the same sort of encounter you see here.
  sector: city
  exits:
    north:
      to: tba:39:room:3995
    south:
      to: tba:39:room:3978
    west:
      to: tba:39:room:3993

"tba:39:room:3995":
  name: Market Road, past the market
  description: >
    People shove past, in a hurry to get wherever it is they are going.  You can hear the swearing of
    various men on carts and wagons, trying to get them and their goods through the throng.  Nearby to the
    east colorful stitched canopies billow in the stiff, salty sea breeze.  The sounds of merchants
    yelling their wares and people yelling to each other in general are almost overwhelming.  To the north
    the throng thins into a crowd, and to the south you see the same sort of encounter you see here.
  sector: city
  exits:
    north:
      to: tba:39:room:3996
      look: The road is in the same condition as here - CROWDED.
    south:
      to: tba:39:room:3994
    west:
      to: tba:39:room:3979
      look: Nothing.

"tba:39:room:3996":
  name: Market Road
  description: >
    To the south the smell of fish, the press of people, and the noise of a busy market all become
    greater.  On both sides of the road you can see the crowd of people moving in all directions.  You can
    also glimpse the great gate of Haven to the north, and flashes of colorful canopies to the south.  One
    might wonder why so many people would be attracted to a fish market, of all things.
  sector: city
  exits:
    north:
      to: tba:39:room:3997
    south:
      to: tba:39:room:3995
      look: To the south the crowd thickens as the road goes past the market.
  extras:
  - keywords: [color, canopies, colorful]
    text: >
      As you look intently to the south and the flashes of color you can see that the canopies are really
      lots of tightly woven blankets stitched together.  It probably serves to keep the sun off the
      customers and merchants.  It doesn't really look like a canopy, but more of a colorful roof over the
      marketplace, billowing in the wind.
  - keywords: [traffic, people]
    text: >
      People, mules, horses, and all manner of things race along the road here, in a hurry to get to
      wherever it is they want to go.  The ones headed to the south carry empty baskets, the cartsmen with
      their full loads yelling loudly at their straining animals.  The ones heading north lug heavy baskets
      full of the day's find at the market, their expressions pleased that they got the best of the pesky
      merchants.  Didn't they?

"tba:39:room:3997":
  name: Market Road
  description: >
    The breeze from the south blows a fishy scent your way, and through the press of people on this
    relatively narrow winding road you can glimpse the gate of Haven to the north, and flashes of colorful
    canopies somewhere to the south. Over the clacking of hooves on cobbles and catcalls from neighbors to
    each other you can hear the dull, background roar of sea surf crashing onto rocks. The air is hot
    and humid enough to make the slight breeze refreshing.
  sector: city
  exits:
    north:
      to: tba:39:room:3998
      look: To the north there is a magnificent city gate.
    south:
      to: tba:39:room:3996
      look: To the south you see a relatively narrow, crowded winding road leading toward the market.
  extras:
  - keywords: [people, traffic]
    text: >
      People, mules, horses, and all manner of things race along the road here, in a hurry to get to
      wherever it is they want to go.  The ones headed to the south carry empty baskets, the cartsmen with
      their full loads yelling loudly at their straining animals.  The ones heading north lug heavy baskets
      full of the day's find at the market, their expressions pleased that they got the best of the pesky
      merchants.  Didn't they?
  - keywords: [color, canopies, colorful]
    text: >
      As you look intently to the south and the flashes of color you can see that the canopies are really
      lots of tightly woven blankets stitched together.  It probably serves to keep the sun off the
      customers and merchants.  It doesn't really look like a canopy, but more of a colorful roof over the
      marketplace, billowing in the wind.

"tba:39:room:3998":
  name: The Ornate City Gates
  description: >
    To the north lies a magnificent pair of gates.  Twenty feet high at the least, and wide enough to
    drive two wagons through, side by side.  It is entirely made of polished oak, which looks a rich
    golden brown and smooth to the touch.  There are many carvings of sea animals and birds on the gate,
    masterfully done, but the most eye-catching set of carvings are the twin leaping fish.  Five feet tall
    themselves, their jeweled eyes winking, they are in the direct center of each gate.  You can tell by the
    reverant glances of those passing by that the people of the town are very proud of their gate.
  sector: city
  exits:
    south:
      to: tba:39:room:3997
      look: To the south you see a relatively narrow, crowded winding road leading toward the market.
    west:
      to: tba:39:room:3941
  extras:
  - keywords: [gate, fish]
    text: >
      Upon the gate, the twin masterfully carved fish are so realistic they appear to almost have life. 
      The red rubies set into their eyes are so skillfully embedded in the wood that no amount of pulling,
      even from one of huge strength, would remove them.

"tba:39:room:3999":
  name: A Linking Room
  description: This zone will link north to room 3472.  Build all rooms south of that connection point.
  sector: inside
  flags: [private]
