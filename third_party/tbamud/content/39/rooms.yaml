"tba:39:room:3987":
  name: Intersection of South Gull Road and Luna's Alley
  description: >
    Animal-like howls from both the north and south block out the sounds of the wind here, originating
    from a narrow, filthy alley.  The overhanging roofs make it as black as pitch and the odd flashes you
    see comming from the dark of the alley might be reflections of light in animal...  or human... 
    eyes.  It isn't a wonder people hurry past this intersection with worried glances to the north and south.
  sector: city
  exits:
    north:
      to: tba:39:room:3973
    east:
      to: tba:39:room:3988
    south:
      to: tba:39:room:3986
    west:
      to: tba:39:room:3949

"tba:39:room:3988":
  name: South Gull Road
  description: >
    The houses along South Gull Road are smaller than the ones you can see to the north, but they are
    still quite nice.  This road is patchily shaded by the small trees in some of the small yards, and
    periodic small beds of flowers add their scents to the breeze that sweeps across the clean cobbles. 
    Strolling residents occasionally pass you, smiling happily.  Perhaps they don't hear the soft maniacal
    laughter that comes from somewhere to the east.
  sector: city
  exits:
    east:
      to: tba:39:room:3989
    west:
      to: tba:39:room:3987

"tba:39:room:3989":
  name: South Gull Road
  description: >
    The houses along South Gull Road are smaller than the ones you can see to the north, but they are
    still quite nice.  This road is patchily shaded by the small trees in some of the small yards, and
    periodic small beds of flowers add their scents to the breeze that sweeps across the clean cobbles. 
    Strolling residents occasionally pass you, smiling happily.  The road turns south here, while to the
    north an oppulent building has open doors, which spill a rich golden light onto the street.  Through the
    tiny, barred window you can catchi glimpses of well-armed guards and a sparkling pile of what
    appears to be gold coins.
  sector: city
  exits:
    north:
      to: tba:39:room:3958
    south:
      to: tba:39:room:3990
    west:
      to: tba:39:room:3988

"tba:39:room:3990":
  name: South Gull Road
  description: >
    The houses along South Gull Road are smaller than the ones you can see to the north, but they are
    still quite nice.  This road is patchily shaded by the small trees in some of the small yards, and
    periodic small beds of flowers add their scents to the breeze that sweeps across the clean cobbles. 
    Strolling residents occasionally pass you, smiling happily.  Somewhere to the southeast you can see the
    tall white tower of the Lord of Haven's Manor House.
  sector: city
  exits:
    north:
      to: tba:39:room:3989
    east:
      to: tba:39:room:3991

"tba:39:room:3991":
  name: South Gull Road
  description: >
    Quite contrary to the crowded market to the east, this street is somehow peaceful.  This may just
    be because of the patrols of brawny guards that pass by at regular intervals.  The smell of fish that
    is so prrevalent elsewhere in Haven is almost absent from the air here, being replaced by the salty
    tang of the sea breeze to the south which is carrying the sweet perfume of flowers your way.  To the
    south the white tallness of the tower protruding from the manor that lies there is like a bone finger
    raised in realization of the answer to a pressing question.
  sector: inside
  exits:
    east:
      to: tba:39:room:3992
    south:
      to: tba:39:room:3914
    west:
      to: tba:39:room:3990

