      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30823":
  name: Cul-de-sac
  description: >
    You are surrounded on all sides but the south by the private homes of the people that live in
    Cailveh's care.  The only way out of here is south unless you desire to meet some of the folk who live
    within these homes.
  sector: inside
  exits:
    north:
      to: tba:308:room:30824
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:308:room:30835
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30822
    west:
      to: tba:308:room:30834
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30824":
  name: Simple Home
  description: >
    The furnishings of this place are at best simple, nothing looks as if it would hold any true value,
    only function.  There is only one adornment to the walls, that being a large, flat cross which hangs
    directly above the dining table.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30823
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30825":
  name: Town Road
  description: >
    This is the residential section of the community with homes lining both sides of the street.  Just
    north of here is a main intersection in the street, suth lies a small square.
  sector: inside
  exits:
    north:
      to: tba:308:room:30820
    east:
      to: tba:308:room:30831
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30826
    west:
      to: tba:308:room:30830

"tba:308:room:30826":
  name: Schoolhouse Square
  description: >
    Named Schoolhouse Square for no other reason than the fact that the schoolhouse is located just
    south of here, this small square is a tidy little turn-around with houses on the east and west sides of
    the school.
  sector: inside
  exits:
    north:
      to: tba:308:room:30825
    east:
      to: tba:308:room:30829
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30827
    west:
      to: tba:308:room:30828
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30827":
  name: Ye Olde School
  description: >
    Three rows of desks line the floor, a moderate-sized desk fronting the south side of the room.  A
    gilded cross hangs on the south wall above the desk, obviously the people of this community place a
    large emphasis on religion.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30826

"tba:308:room:30828":
  name: Small Home
  description: >
    This single-room home is no bigger than ten by ten, obviously the home of a single occupant.  A
    small bed lies against the south wall, a small table is nudged into the northwest corner.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30826
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30829":
  name: Tidy Home
  description: >
    This mid-sized home is meticulously cleaned from top to bottom, the walls even squeaky clean.  A
    small cross hangs on the wall right next to the door.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30826
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [sign]
    text: Please remove shoes!

"tba:308:room:30830":
  name: Empty Home
  description: >
    It appears that whoever built this place has either passed on or possibly went to live somewhere
    else.  With very little cleaning and even less construction, this could be a very livable place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30825

"tba:308:room:30831":
  name: Freshly-Painted Home
  description: >
    The smell of the stain used on the walls is still fresh in this house, the walls still shine with
    that glare that comes from freshly painted walls.  All of the furniture is pulled away from the walls
    until they dry, as a result it is very cramped in this home.
  sector: inside
  flags: [indoors, tunnel]
  exits:
    west:
      to: tba:308:room:30825
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30832":
  name: Quiet Home
  description: >
    The plain white walls of this home coupled with the somber furnishings only add to the vibe that
    immediately soaks in as you enter.  It is obvious that the occupants like it quiet in their home and
    wish to keep it that way.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30821
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30833":
  name: Simple Home
  description: >
    This is indeed someone's happy home, however it appears that whoever lives here lives quite the
    simple life; nothing in the house appears to hold any sort of monetary value whatsoever.  There is a
    table and chairs made of crude wood and a bed made from the same of wood and hay.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30822
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30834":
  name: Small Home
  description: >
    The quarters in this small home are tight, indeed, allowing comfortbale movement for only one
    person at a time.  The door lies to the east.
  sector: inside
  flags: [indoors, tunnel]
  exits:
    east:
      to: tba:308:room:30823
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30835":
  name: Thatch-Roofed Home
  description: >
    This is the only home in the entire settlement that is not completely weather-proof.  The roof is
    made from thatch, the walls from rough-hewn timber, but strangely enough it appears to work very well
    as an abode.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30823
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30836":
  name: Small Log Home
  description: >
    This is, as far as you can tell, the only home in the settlement made from log.  The owner must
    have spent quite some time building this place and have quite a large amount of pride in his work
    because the place is beautiful.  Much of the wood for the inner walls have been carved out to allow for
    shelving and such.  The furniture is most made from the same dark wood as the home itself.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30822

"tba:308:room:30837":
  name: Cozy Home
  description: >
    This home boasts a very warm wood stove burning in the northeast corner of the room, the warm air
    giving the place a drowsy, comfortable feeling.  A plush armchair and matching divan lie against the
    south wall, beds on the north wall.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30821
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30838":
  name: Town Road
  description: >
    This small portion of road runs between the two main intersections of the settlement, bordering the
    north side and entryway into the local pub and dining establishment.  It is actually a very nice
    place to eat, having a strong reputation of good food and good people, recommended throughout the land.
  sector: inside
  exits:
    east:
      to: tba:308:room:30839
    south:
      to: tba:308:room:30848
    west:
      to: tba:308:room:30820

"tba:308:room:30839":
  name: Town Square
  description: >
    A beautiful park lies along the eastern side of the road, full of beautiful flowers and trees.  The
    road travels north and south through the business district and also west past the local pub toward
    the main road.
  sector: inside
  exits:
    north:
      to: tba:308:room:30840
    east:
      to: tba:308:room:30847
    south:
      to: tba:308:room:30850
    west:
      to: tba:308:room:30838

"tba:308:room:30840":
  name: Town Road
  description: >
    The road travels north to south past a small restaurant on the east and an herbalist on the west
    side of the road.  Just north of here is small square.
  sector: inside
  exits:
    north:
      to: tba:308:room:30841
    east:
      to: tba:308:room:30845
    south:
      to: tba:308:room:30839
    west:
      to: tba:308:room:30846

"tba:308:room:30841":
  name: Northern Square
  description: >
    Businesses surround you, the tink tink of the blacksmith very audible on the west side of the road,
    a low single story building lies to the east - the town doctor.  To the north is the apothecary, who
    is said to have the finest and most potent potions in all the realm.
  sector: inside
  exits:
    north:
      to: tba:308:room:30842
    east:
      to: tba:308:room:30843
    south:
      to: tba:308:room:30840
    west:
      to: tba:308:room:30844

"tba:308:room:30842":
  name: The Apothecary
  description: >
    Odd smells linger in the air of this musty and yet curiously drafty place. Colored liquids fill
    glass containers along the northern wall behind the counter, the labors of long hours of brewing by the
    master apothecary.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30841

"tba:308:room:30843":
  name: Town Doctor
  description: >
    It appears that the doctor is not in at this time.  The entire building lies silent and empty. 
    Devoid of life.  Odd.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30841

"tba:308:room:30844":
  name: Smithy
  description: >
    Entering into this high-roofed building immediately engulfs you in a tremendous heat.  The gruff
    and filthy man who works within the confines of this room must obviously not care much about hiegene or
    the fact that its easily one hundred degrees in this building.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30841

"tba:308:room:30845":
  name: Salaylia's
  description: >
    Salaylia makes a mean dish of food that can be eaten right here in comfort or taken with you on
    your journeys.  Either way, she is always pleased to be able to provide for the hungry.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30840

"tba:308:room:30846":
  name: The Herbalist
  description: >
    Small plants grow along shelves high along the north and south walls of this room, a long counter
    running the west end of the room.  Within that counter lie samples of the poultices and remedies which
    the herbalist offers.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30840

"tba:308:room:30847":
  name: Colorful Park
  description: >
    This is obviously a place that harbors a great deal of pride for the locals, it so well tended.  A
    small stone bench lies alongside the path, allowing you to rest for a short period if that be your
    desire.
  sector: inside
  flags: [peaceful]
  exits:
    west:
      to: tba:308:room:30839

"tba:308:room:30848":
  name: The Town Hall
  description: >
    This pub, named the Town Hall in jest, is only so named due to the fact that after most day's work,
    most of the local residents end up coming here to dine with their fellow townsfolk.  Nightly
    'meetings' are conducted over steaming plates of meat and vegetables, accompanied by laughter and the
    occasional music of a traveling musician.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30838

"tba:308:room:30849":
  name: Tailor
  description: >
    The locals tend to mostly the servicable garb of the simple worker, humble people of the Gods who
    perform their daily work with pride.  As such, the tailor mostly carries what sells.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30850

"tba:308:room:30850":
  name: Town Road
  description: >
    The road runs south past a number of businesses and the local chapel toward a wonderful garden,
    full of bloom and color.  To the north is the Town Square.
  sector: inside
  exits:
    north:
      to: tba:308:room:30839
    east:
      to: tba:308:room:30851
    south:
      to: tba:308:room:30853
    west:
      to: tba:308:room:30849

"tba:308:room:30851":
  name: House of Worship
  description: >
    Every morning and every evening, the entire community gathers in this humble building to give
    thanks for the land they live upon and their gracious benefactor, the Baron Cailveh.  Lines of benches run
    up to the east wall where large cross hangs upon the wall, gleaming beautifully.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30850

"tba:308:room:30852":
  name: The General Store
  description: >
    You name it, this place has it and if they don't have it, they'll get it. At least that is their
    reputation.  All manner of oddities and necessities lie scattered about on shelves and in displays.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30853

"tba:308:room:30853":
  name: Southern Square
  description: >
    A magnificent garden lies just south of here, a tidy little store on the west side and mill of some
    sort on the east side.
  sector: inside
  exits:
    north:
      to: tba:308:room:30850
    east:
      to: tba:308:room:30854
    south:
      to: tba:308:room:30855
    west:
      to: tba:308:room:30852

"tba:308:room:30854":
  name: Distillery
  description: >
    This used to be the old mill for the settlement, but has since been converted into a distillery for
    the locals so that they might have drinking water free of disease.  Barrels, bottles or whatever you
    like can be refilled or simply purchased here.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30853

"tba:308:room:30855":
  name: Town Gardens
  description: >
    These beautiful gardens are tended with love and care by all of the locals, kept as a haven for
    thought and quiet contemplation.  They are kep immaculate year round, with no exceptions.
  sector: inside
  exits:
    north:
      to: tba:308:room:30853

"tba:308:room:30856":
  name: Entryway Into the Main Hall
  description: >
    This is actually a part of the main hall, however most of the politicking goes on a bit to the east
    where Cailveh holds his court.  The exit from the tower lies to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30857
    west:
      to: tba:308:room:30814
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30857":
  name: Main Hall
  description: >
    A door lies on the north wall, next to an ornate silver tapestry which hangs from the ceiling to
    the floor, covering the entire wall.  On the south wall is a matching tapestry, giving the hall a
    feeling of majestic holiness.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30861
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:308:room:30858
    west:
      to: tba:308:room:30856

"tba:308:room:30858":
  name: Audience Chamber
  description: >
    All of Cailveh's formal matters of state are conducted here, at this very spot.  A gilded chair of
    worked silver sits upon a low dias, a plush cushion resting atop the chair.  A thick silver curtain
    runs along behind the chair, completing the picture of strength and calm that Cailveh wishes to
    project. Doors lie on the north and south walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30860
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:308:room:30859
      door:
        keywords: [curtain]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30862
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30857

"tba:308:room:30859":
  name: Behind the Gilded Chair
  description: >
    It appears that the Baron has a spot to get away from all the noise and stress of court whenever he
    likes.  There is a stone stairway leading upward into the heights of the tower, curving around and
    up out of sight.  Behind the curtain lies the Audience Chamber.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30858
      door:
        keywords: [curtain]
        kind: door
        reset: closed
    up:
      to: tba:308:room:30863

"tba:308:room:30860":
  name: The Feasting Hall
  description: >
    Twin doors lie on the south wall of this enormous chamber, exits designed to allow the ingress and
    egress of large amounts of people.  A long table runs most of the length of the room, beautifully
    woven table coverings over most of its surface.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30858
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30861

"tba:308:room:30861":
  name: The Feasting Hall
  description: >
    Twin doors lie on the south wall of this enormous chamber, exits designed to allow the ingress and
    egress of large amounts of people.  A long table runs most of the length of the room, beautifully
    woven table coverings over most of its surface.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30860
    south:
      to: tba:308:room:30857
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30862":
  name: Private Meeting Room
  description: >
    Whenever a visitor comes that is not considered one of Cailveh's 'friends' but needs to conduct
    business privately, this is where Cailveh brings the visitor to talk.  The room is protected by a ward
    of silence maintained by Cailveh himself so that conversations within this room stay only within this
    room.
  sector: inside
  flags: [indoors, soundproof]
  exits:
    north:
      to: tba:308:room:30858
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30863":
  name: Secret Stair Passage
  description: >
    These stairs are the single one way to reach the upper levels of the tower. Cailveh keeps them
    hidden so that he might enjoy a relative calm when dealing with family or personal life.  No visitors are
    ever allowed in these higher chambers, only Cailveh, his family, and a small slew of servants.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:308:room:30864
    down:
      to: tba:308:room:30859

"tba:308:room:30864":
  name: Stone and Mortar Hallway
  description: >
    The stairs open into a hallway that is neither large nor small, simply very average.  The walls are
    of stone and mortar, well formed and solid to the touch. On the south wall is a door, the stairs
    lead downward to the main floor of the tower and the hallway runs westward toward more doors, actually
    ending at a door.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30870
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30865
    down:
      to: tba:308:room:30863

"tba:308:room:30865":
  name: Stone and Mortar Hallway
  description: >
    A door lies on the north wall, the hallway heads east and west, both only for short distances.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30867
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:308:room:30864
    west:
      to: tba:308:room:30866

"tba:308:room:30866":
  name: End of the Hall
  description: >
    A wide door lies on the west wall of the hall which would be the dead end to the hall if there
    weren't a door there.  Off to the east are more doors, with a stairway leading downward at the end of the
    hall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30865
    west:
      to: tba:308:room:30871
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30867":
  name: Gilzaan's Private Chambers
  description: >
    Gilzaan, being the eldest of Cailveh's two sons and most likely to receive the endowment of all
    that Cailveh holds upon his death, holds the largest room in the tower save for Cailveh himself.  All
    that is holy and worthy, studious and pious lies in an orderly fashion in this enormous apartment.  A
    door lies in the south wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30865
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30868

"tba:308:room:30868":
  name: Gilzaan's Private Chambers
  description: >
    Gilzaan, being the eldest of Cailveh's two sons and most likely to receive the endowment of all
    that Cailveh holds upon his death, holds the largest room in the tower save for Cailveh himself.  All
    that is holy and worthy, studious and pious lies in an orderly fashion in this enormous apartment.  A
    door lies on the south wall just east from here.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30867

"tba:308:room:30869":
  name: Necromocis' Private Chambers
  description: >
    Necromocis is Cailveh's youngest son, but certainly the brighter of the two. Most of Necromocis'
    time is spent up in the higher reaches of the tower, pouring over the ancient tomes which Cailveh holds
    locked within his library. Necromocis could soak up knowledge all day long and still yearn for more
    at the fall of night.  He is Cailveh's pride and joy, unencumbered the knowledge that he may have to
    one day run the Barony, as his brother is.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30870

"tba:308:room:30870":
  name: Necromocis' Private Chambers
  description: >
    Necromocis is Cailveh's youngest son, but certainly the brighter of the two. Most of Necromocis'
    time is spent up in the higher reaches of the tower, pouring over the ancient tomes which Cailveh holds
    locked within his library. Necromocis could soak up knowledge all day long and still yearn for more
    at the fall of night.  He is Cailveh's pride and joy, unencumbered the knowledge that he may have to
    one day run the Barony, as his brother is.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30864
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30869

"tba:308:room:30871":
  name: Sitting Room
  description: >
    This room is dominated by a huge fireplace on the west wall.  It spans the entire length of the
    wall, the stonework giving the room a very rustic, cozy feel.  Lounge chairs and couches lie in a
    fashionable array about the room. This is where Cailveh and his family spend most of their evenings
    together, away from the main court life which never seems to end downstairs.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30874
    east:
      to: tba:308:room:30866
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30872
    up:
      to: tba:308:room:30875
      door:
        keywords: [fireplace]
        kind: door
        reset: closed
  extras:
  - keywords: [stones]
    text: >
      They look as if they aren't anchored all that well, as if they might be able to be moved or jarred
      free.
  - keywords: [fireplace]
    text: >
      It is a huge piece of work, spanning the entire length of the room.  The place where the firewood
      is actually kept and burnt only takes up about a quarter of the space that it could, the rest of it is
      just ornate.  Most of the rocks are made from regular, grayish stone but there is a particular run
      of them that are a bit darker than the rest.

"tba:308:room:30872":
  name: Cailveh's Private Chambers
  description: >
    This section of the room is more an entryway into the larger part of Cailveh's private area which
    is shared with his wife.  The room follows the curve of the tower, opening east into the private
    chambers and north into the sitting room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30871
    east:
      to: tba:308:room:30873

"tba:308:room:30873":
  name: Cailveh's Private Chambers
  description: >
    This lavish section of Cailveh's private quarters are reserved for he and his wife only, a retreat
    for the two of them to get away from everything completely. There is a large bed and a long, low
    divan that sits before a fireplace - a very appealing setup.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30872

"tba:308:room:30874":
  name: Bathing Area
  description: >
    A carved bathing vessel lies in the center of the room, raised upon a curious-looking stone
    pedestal designed specifically for holding the hot embers of coal that heat the tub above it.  A curtain can
    be drawn about the tub or left wide open, a wooden desk lies against the west wall with a washbasin
    and mirror atop it.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30871

"tba:308:room:30875":
  name: Runed Stairwell
  description: >
    The runes on the sides of this stairwell or there as wards against intruders, but more so they are
    wards of notification which will let Cailveh when an unwelcome guest has intruded upon his private
    demenses unwelcome.  Enter upward into the private work area of the Baron Cailveh, but beware of his
    fury and the wrath of his gods.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:308:room:30876
    down:
      to: tba:308:room:30871
      door:
        keywords: [secret]
        kind: door
        reset: closed

"tba:308:room:30876":
  name: Laboratory
  description: >
    The entire room in this area and to the east is covered in tables and runes, the walls lined with
    shelving which holds all manner of scrolls, books and tablature.  The wooden creaks underfoot as you
    move about, even a shifting of your weight makes a fair amount of noise.  It will be very difficult,
    indeed, to stay here undetected for very long.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:308:room:30877
    south:
      to: tba:308:room:30878
    down:
      to: tba:308:room:30875

"tba:308:room:30877":
  name: Laboratory
  description: >
    The entire room in this area and to the east is covered in tables and runes, the walls lined with
    shelving which holds all manner of scrolls, books and tablature.  The wooden creaks underfoot as you
    move about, even a shifting of your weight makes a fair amount of noise.  It will be very difficult,
    indeed, to stay here undetected for very long.  There is a door on the south wall, one that does not
    look as if it is opened very often.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:308:room:30881
      door:
        keywords: [door]
        kind: pickproof
        key: tba:308:obj:30800
        reset: locked
    west:
      to: tba:308:room:30876

"tba:308:room:30878":
  name: Study
  description: >
    This is a more sedate setting than that just north of here.  A plush chair lies against the west
    wall, one that looks very much like it is used extremely often.  Shelves line the east wall, however
    the books there are more scholarly than for research.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30876
    south:
      to: tba:308:room:30879

"tba:308:room:30879":
  name: Library
  description: >
    If it seemed that there were a lot of books on the shelves in the rooms to the north, then you had
    no idea what to expect here.  Every single foot of space available has been utilized for shelving for
    books, all of them organized by size and content.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30878
    east:
      to: tba:308:room:30880

"tba:308:room:30880":
  name: Observatory
  description: >
    There is wide, tall window in the southeastern wall, one that rises all the way to the ceiling and
    opens out into the heavens.  A strange object has been placed near to the window, one that looks much
    like a long tube with glass at the ends.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:308:room:30879

"tba:308:room:30881":
  name: Artifact Room
  description: >
    This room has been looted.  Nothing remains except empty shelves and tables that were once laden
    with numerous items and artifacts.  The patches of dust free shelves hint at the outlines of the
    previous occupants.  Uneven shadings of the walls hint at portraits that may have once been hung for many
    years.
  sector: inside
  exits:
    north:
      to: tba:308:room:30877
      door:
        keywords: [door]
        kind: pickproof
        key: tba:308:obj:30800
        reset: locked
