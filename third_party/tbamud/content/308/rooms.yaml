# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 308.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:308:room:30800":
  name: Wooden Guard Gate
  description: >
    The road south of this gate is covered in an even coating of gravel, just a short distance to the
    southeast a small settlement is visible.  The gate appears to be more of a stopping point for
    travelers to stop for directions or to make certain that the Baron is indeed in his tower rather than a
    checkpoint for a military operation - although there are guards who man it.  To the west is the short
    stretch of the King's Highway before it turns north, headind far from Cailveh's lands.
  sector: inside
  exits:
    south:
      to: tba:308:room:30801
  extras:
  - keywords: [credits, info]
    text: >
      *Baron Cailveh's Tower * Built by Kaan for Dibrova Level: 50 - 120 82 rooms 38 mobs 22 objs
      Connector Zone(s): The King's Road This is one in a group of Barons' land holdings that lie along the King's
      Road. This particular holding is held by a Cleric Baron whose main export is corn, wheat and healing
      potions. There is a short road that passes a small settlement of the Baron's people and the Tower of
      the Baron itself. A great deal of excellent eq is included in this zone as well as some extremely
      difficult mobs.

"tba:308:room:30801":
  name: Gravel Road
  description: >
    This long north-south road is meticulously cared for, running through the usual corn and wheat
    fields that seem to grow without cessation through this entire area.  A small settlement lies southeast
    from here, smoke rising from many of the chimneys, all of the buildings seeming in good repair.
  sector: inside
  exits:
    north:
      to: tba:308:room:30800
    south:
      to: tba:308:room:30802

"tba:308:room:30802":
  name: Gravel Road
  description: >
    On the east side of the road, the backs of many small homes now face you. They are all
    well-constructed, strong and freshly painted with short, cropped grass growing in their lawns.  The road
    continues to run north and south.
  sector: inside
  exits:
    north:
      to: tba:308:room:30801
    south:
      to: tba:308:room:30803

"tba:308:room:30803":
  name: Gravel Road
  description: >
    On the east side of the road, the backs of many small homes face you.  They are all
    well-constructed, strong and freshly painted with short, cropped grass growing in their lawns.  The road continues
    to run north and south, with an entrance into the settlement just south of here.
  sector: inside
  exits:
    north:
      to: tba:308:room:30802
    south:
      to: tba:308:room:30804

"tba:308:room:30804":
  name: Gravel Road at the Settlement
  description: >
    A road, also graveled just like the one you stand upon, leads east into the settlement.  To the
    south, the road continues for a distance before curving eastward, to the north the road runs for quite
    some way.
  sector: inside
  exits:
    north:
      to: tba:308:room:30803
    east:
      to: tba:308:room:30819
    south:
      to: tba:308:room:30805

"tba:308:room:30805":
  name: Gravel Road
  description: >
    The road runs north and south, the settlement for the Baron's constituants just to the east and
    rolling fields of grain to the west.
  sector: inside
  exits:
    north:
      to: tba:308:room:30804
    south:
      to: tba:308:room:30806

"tba:308:room:30806":
  name: Gravel Road
  description: >
    The road runs north and south, the settlement for the Baron's constituants just to the east and
    rolling fields of grain to the west.  Just to the south, the roads bends away to the southeast.
  sector: inside
  exits:
    north:
      to: tba:308:room:30805
    south:
      to: tba:308:room:30807

"tba:308:room:30807":
  name: Gravel Road
  description: >
    The road bends to the east, making a slow southeastern curve toward the tower that can now be seen
    in the distance.  A slight ways further is a small barn, the only building between the settlement and
    the tower.
  sector: inside
  exits:
    north:
      to: tba:308:room:30806
    east:
      to: tba:308:room:30808

"tba:308:room:30808":
  name: Gravel Road
  description: >
    The road continues to twist and bend its way through the fields, the tower larger than ever to the
    southeast.  To the north, through a short length of corn stalks, a fair-sized settlement can be seen
    - the place where all that work for the Baron live.
  sector: inside
  exits:
    south:
      to: tba:308:room:30809
    west:
      to: tba:308:room:30807

"tba:308:room:30809":
  name: Bend in the Gravel Road
  description: >
    The road makes a twist to the north and east, heading toward the tower of Cailveh or away from it -
    depending on which way you may be traveling.  A barn lies southeast of here, the only structure
    visible between here and the tower.
  sector: inside
  exits:
    north:
      to: tba:308:room:30808
    east:
      to: tba:308:room:30810

"tba:308:room:30810":
  name: Bend in the Gravel Road
  description: >
    The road makes a bend to the west and the south, heading along the road that leads to Cailveh's
    tower.  A short jaunt to south is the entrance into a small barn, a sturdy-looking structure wih a fresh
    coat of silver paint.
  sector: inside
  exits:
    south:
      to: tba:308:room:30811
    west:
      to: tba:308:room:30809

"tba:308:room:30811":
  name: Before a Large Barn
  description: >
    The entrance into a small barn lies to the south, the door wide open to anyone who might wish to
    enter.  It must be that Cailveh feels very comfortable about who his complacent guards let through at
    the entrance to his property... To the east the road runs directly up to Cailveh's front door, to the
    north the road runs away and off of Cailveh's property.
  sector: inside
  exits:
    north:
      to: tba:308:room:30810
    east:
      to: tba:308:room:30812
    south:
      to: tba:308:room:30815

"tba:308:room:30812":
  name: West of the Tower
  description: >
    Cailveh's tower lies just east from from here, its looming height now just a bit daunting as you
    approach.  The road runs toward the tower or west toward the exit from Cailveh's property.
  sector: inside
  exits:
    east:
      to: tba:308:room:30813
    west:
      to: tba:308:room:30811

"tba:308:room:30813":
  name: Before the Tower
  description: >
    The tower doors lie just to the east, large wooden doors made of slats of oak and bound by iron. 
    Plentiful crops lie on the north and south of the road, a calming breeze blows by.  This is not a
    place to feel at all intimidated or unwelcome.
  sector: inside
  exits:
    east:
      to: tba:308:room:30814
    west:
      to: tba:308:room:30812

"tba:308:room:30814":
  name: The Tower Entry Gate
  description: >
    The doors to the tower are certainly large enough to be considered a gate - they are at least ten
    feet in height, rising to a point where they meet each other.  Enter, if you will, or head west back
    along the main road.
  sector: inside
  exits:
    east:
      to: tba:308:room:30856
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:308:room:30813

"tba:308:room:30815":
  name: Scrupulously Clean Barn
  description: >
    Even the inner walls of this small barn have been painted silver!  All of the harnesses and yokes
    are hung upon the walls in neat and orderly fashion, the floor is even swept.  Through a door in the
    south wall lies the pastures.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:308:room:30811
    south:
      to: tba:308:room:30816
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30816":
  name: The Pastures
  description: >
    This small, fenced in area holds the cows that keep the people who live in Cailveh's care well fed
    with an ample supply of milk.  Be careful where you step...
  sector: inside
  exits:
    north:
      to: tba:308:room:30815
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:308:room:30817
    west:
      to: tba:308:room:30818

"tba:308:room:30817":
  name: The Pastures
  description: >
    This small, fenced in area holds the cows that keep the people who live in Cailveh's care well fed
    with an ample supply of milk.  Be careful where you step...
  sector: inside
  exits:
    west:
      to: tba:308:room:30816

"tba:308:room:30818":
  name: The Pastures
  description: >
    This small, fenced in area holds the cows that keep the people who live in Cailveh's care well fed
    with an ample supply of milk.  Be careful where you step...
  sector: inside
  exits:
    east:
      to: tba:308:room:30816

"tba:308:room:30819":
  name: Town Road
  description: >
    This well graveled road leads east into the settlement, a very tidy place where the streets are
    free of litter and all the homes are tended to regularly. The main road lies just to the west.  A small
    sign lies on the south side of the road.
  sector: inside
  exits:
    east:
      to: tba:308:room:30820
    west:
      to: tba:308:room:30804
  extras:
  - keywords: [sign]
    text: >
      All travelers welcome in Cailveh Town. Bring no malice with ye upon entry, but only the goodwill
      harbored within your heart. May the Gods be with you.

"tba:308:room:30820":
  name: Intersection on Town Road
  description: >
    Homes lie to the north and south; small, neat structures which look welcome and very
    non-threatening.  To the east is what must be the merchant's area, where most of the business of the town is
    conducted.  The main road to the tower and the King's Highway lies to the west.
  sector: inside
  exits:
    north:
      to: tba:308:room:30821
    east:
      to: tba:308:room:30838
    south:
      to: tba:308:room:30825
    west:
      to: tba:308:room:30819

"tba:308:room:30821":
  name: Town Road
  description: >
    Homes lie on the east and west sides of the road.  The road itself runs north and south for some
    distance past homes of all shape and size.
  sector: inside
  exits:
    north:
      to: tba:308:room:30822
    east:
      to: tba:308:room:30837
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:308:room:30820
    west:
      to: tba:308:room:30832
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:308:room:30822":
  name: Town Road
  description: >
    Homes lie on the east and west sides of the road.  The road itself runs north and south for some
    distance past homes of all shape and size.
  sector: inside
  exits:
    north:
      to: tba:308:room:30823
    east:
      to: tba:308:room:30836
      door:
