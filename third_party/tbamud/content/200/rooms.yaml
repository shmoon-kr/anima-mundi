# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 200.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:200:room:20000":
  name: Western Highway Zone Description Room
  description:
    preformatted: |2
         Builders  : Talandra
      Zone         : 200 Western Highway
      Began        : 1998
      Player Level : 3-7
      Rooms        : 41
      Mobs         : 12
      Objects      : 25
      Shops        : 1
      Triggers     : 0
      Theme        : The zone is a basic highway filler to link other zones.
      Plot         : It will be low level and easy due to its proximity to the newbie
                     zone. Generally friendly wildlife, travellers. Mostly forest.
      Links        : 01e to a major city
      
      Zone: 200 was linked to the following zones:
       37 Capital sewer system           at: 20001 (north) --->  3746
      115 Monestary Omega                at: 20003 (north) ---> 11500
      187 The Circus                     at: 20003 (south) ---> 18700
      106 Elcardo                        at: 20025 (north) ---> 10609
       75 Zamba                          at: 20038 (west ) --->  7598
       78 Gideon                         at: 20039 (south) --->  7801
  sector: inside
  flags: [indoors, private]

"tba:200:room:20001":
  name: Western Highway
  description: >
    You are on the Western Highway east of here you can see the gates of the Capital while to the west
    the highway continues.  A gravelled path leads northward, away from this boring highway, towards some
    rocks a bit further north.
  sector: field
  flags: [bfs_mark]
  exits:
    west:
      to: tba:200:room:20002

"tba:200:room:20002":
  name: Western Highway
  description: >
    You continue along the western highway.  The city gates of the Capital can be seen to the east. 
    The highway stretches from the west towards the gates. A light forest to the north of pines and small
    saplings looks peaceful.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20001
    west:
      to: tba:200:room:20003

"tba:200:room:20003":
  name: Western Highway
  description: >
    As you walk along the Western Highway you notice a small path leading off to the south as well as
    the highway continuing off to the east and west.  The forest to the north seems to thin out a little
    allowing entrance.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20002
    west:
      to: tba:200:room:20004

"tba:200:room:20004":
  name: Western Highway
  description: >
    You continue your way along the western highway.  It stretches east, back to the Capital and west
    deeper into the wilderness, plains to the south and thick forest to the north.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20003
    west:
      to: tba:200:room:20005

"tba:200:room:20005":
  name: Western Highway
  description: >
    As you move a long the western highway you notice that it continues to the west as well as to the
    east.  The forest to the north looks peaceful and inviting, though it seems too dense to enter.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20004
    west:
      to: tba:200:room:20006

"tba:200:room:20006":
  name: Western Highway
  description: >
    Standing along the western highway you notice the forest to the northwest has thinned out and a
    large wooden building with smoke trailing out of a stone chimney is visible between the trees.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20005
    west:
      to: tba:200:room:20007

"tba:200:room:20007":
  name: Western Highway
  description: >
    The wester highway passes in front of a large wooden building.  The building is in disrepair, with
    shingles lying on the ground and a porch that looks like it could collapse any second.  A faded sign
    swings on rusty hinges that squeak annoyingly.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20040
    east:
      to: tba:200:room:20006
    west:
      to: tba:200:room:20008
  extras:
  - keywords: [sign]
    text: Sairith's Fur Trading Post

"tba:200:room:20008":
  name: Western Highway
  description: >
    Moving along the western highway you see that the highway continues to the west and to the east. 
    To the northeast a wooden building can be seen set back a little ways in the forest.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20007
    west:
      to: tba:200:room:20009

"tba:200:room:20009":
  name: Western Highway
  description: >
    Walking along the western highway you notice trees all around you except for to the east and west
    where the road continues on and to the south where the trees open up into a barren plain.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20008
    west:
      to: tba:200:room:20010

"tba:200:room:20010":
  name: Western Highway
  description: >
    As you continue along the western highway you notice a road heading to the south while the highway
    continues on to the east and to the west.  The road heads south through the plains.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20009
    south:
      to: tba:200:room:20026
    west:
      to: tba:200:room:20011

"tba:200:room:20011":
  name: Western Highway
  description: >
    As you walk along you notice that the trees have thinned out to the northwest to allow entry into
    the forest.  The plains to the south appear barren.  The highway continues onto the west and east.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20010
    west:
      to: tba:200:room:20012

"tba:200:room:20012":
  name: Western Highway
  description: >
    The highway branches to the north onto a small dirt road.  The road heads directly into the forest
    and disappears around a bend a short distance through the trees.  The more heavily travelled western
    highway continues east and west.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20018
    east:
      to: tba:200:room:20011
    west:
      to: tba:200:room:20013

"tba:200:room:20013":
  name: Western Highway
  description: >
    The highway consists of hard packed dirt, making travel very easy.  A warm breeze blows to you from
    over the plains to the south.  It carries a slight hint of smoke with it, civilization must be
    near.  To the north a thick forest blocks your view.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20012
    west:
      to: tba:200:room:20014

"tba:200:room:20014":
  name: Western Highway
  description: >
    As you move along the Western Highway you see in the distance a village to the Southwest.  To the
    north a thick grove of pines lays in deep shadow while to the south an open plain is broken by a few
    scattered hills.  The highway continues on to the west and east.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20013
    west:
      to: tba:200:room:20015

"tba:200:room:20015":
  name: Western Highway
  description: >
    As you walk along the Western Highway you notice a small path leading to the south.  It appears to
    be heavily travelled and the wind carries the smell of smoke with it from the south.  The highway
    continues on to the west and east.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20014
    south:
      to: tba:200:room:20039
    west:
      to: tba:200:room:20016

"tba:200:room:20016":
  name: Western Highway
  description: >
    As you venture along the Western Highway you notice a village far in the distance to the
    southeast.  The highway continues east or west.  To the west the sound of rushing water can be heard.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20015
    west:
      to: tba:200:room:20017

"tba:200:room:20017":
  name: Western Highway
  description: >
    The Western Highway ends abruptly at a collapsed bridge.  A raging river flows beneath it slowly
    washing the remains of the bridge away.  Debris and sand has been scattered everywhere.  The river must
    have overflown and washed the bridge away.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20016

"tba:200:room:20018":
  name: Dirt Road
  description: >
    You venture on a small, dirt road through the woods.  It looks well travelled.  It seems to lead on
    to the north as well as to the south, where you can see the Western Highway.  The thick forest
    continues on both sides of the dirt road.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20019
    south:
      to: tba:200:room:20012

"tba:200:room:20019":
  name: Dirt Road
  description: >
    Moving along the small dirt road the tall trees on each side prevent you from seeing very far.  A
    few small animals scamper here and there around your feet.  The road continues to the north and south.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20020
    south:
      to: tba:200:room:20018

"tba:200:room:20020":
  name: Dirt Road
  description: >
    The dirt road becomes more rough further to the north.  It seems less travelled in that direction. 
    The thick coniferous forest seems to be starting to thin out into a variety of hard woods.  Young
    maple trees seem to be dominating this part of the forest.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20021
    south:
      to: tba:200:room:20019

"tba:200:room:20021":
  name: Dirt Road
  description: >
    As you move along the dirt road you notice the trees have grown in closer to the path, hanging
    around you.  Thick underbrush has begun to form to the sides and the road looks unkept.  It is slowly
    being consumed by the forest around it.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20022
    south:
      to: tba:200:room:20020

"tba:200:room:20022":
  name: Dirt Road
  description: >
    The sounds of wildlife fill the woods.  Birds, squirrels, and other unseen animals stay just out of
    sight.  They seem unused to travellers and are very wary.  The trees continue to thin to the north.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20023
    south:
      to: tba:200:room:20021

"tba:200:room:20023":
  name: Dirt Road
  description: >
    The dirt path almost disappears in a section of thick brush and young saplings.  The path is barely
    distinguishable from the rest of the overgrowth. The smell of the forest is very strong.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20024
    south:
      to: tba:200:room:20022

"tba:200:room:20024":
  name: Dirt Road
  description: >
    The dirt path widens and seems to be pushing the forest and underbrush back. The path continues
    north and south between the columns of thick trees and brush.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20025
    south:
      to: tba:200:room:20023

"tba:200:room:20025":
  name: Dirt Road
  description: >
    Several fallen trees block the path to the north.  They appear to have been cut down and fallen
    over the path, as if to block it.  The smell of fresh pine must mean they were cut recently.  Through
    the brush and trees to the north you can just barely make out what looks like a gate and a city wall.
  sector: field
  flags: [bfs_mark]
  exits:
    south:
      to: tba:200:room:20024

"tba:200:room:20026":
  name: Dirt Road
  description: >
    As you venture on a small, dirt road you can see the western highway to the north and the dirt road
    continuing to the south.  The forest around the road diminishes to plains the further south you
    travel.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20010
    south:
      to: tba:200:room:20027

"tba:200:room:20027":
  name: Dirt Road
  description: >
    Moving along the dirt road you see that the road leads to the west and also to the north.  Tall
    fields of wild grass, weeds, and other small brush borderw the road.  The fields have grown to about
    waist height and could be used easily to conceal oneself within.  The grass sways gently in the breeze.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20026
    west:
      to: tba:200:room:20028

"tba:200:room:20028":
  name: Dirt Road
  description: >
    As you walk along the dirt road you notice a few small animals scampering to and fro.  The road
    continues to the south and east.  The sharp bend here goes around a huge pile of rocks to the
    southeast.  The remains of a stone wall runs through the middle of the pile.  Once used to mark out boundaries
    between land owners.  Now it seems no one is farming on these plains.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:200:room:20027
    south:
      to: tba:200:room:20029

"tba:200:room:20029":
  name: Dirt Road
  description: >
    The dirt path that you are on continues off to the south and also to the north.  The plains are
    overgrown and should be farmed, especially since it is so close to the Capital.  Instead they appear
    empty and deserted.  Very little sign of travel or civilization can be seen, except for a plume of smoke
    rising far to the west.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20028
    south:
      to: tba:200:room:20030

"tba:200:room:20030":
  name: Dirt Road
  description: >
    As you continue along the road you notice that the road continues to the north and also to the
    south.  The grassy plains sway gently in the breeze. Occasionally the grass will rustle as some animal
    flees at your approach.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20029
    south:
      to: tba:200:room:20031

"tba:200:room:20031":
  name: Dirt Road
  description: >
    Moving on the road you notice the foliage seems to be growing over the road in places.  You guess
    the road isn't used very often.  The road continues off to the north and south.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20030
    south:
      to: tba:200:room:20032

"tba:200:room:20032":
  name: Dirt Road
  description: >
    As you venture further you spot a few small flowers growing here and there on the road.  The road
    continues to the north and south.  To the north a field of swaying grass stretches to a forest in the
    distance.  South the plain gives way to a light forest.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20031
    south:
      to: tba:200:room:20033

"tba:200:room:20033":
  name: Dirt Road
  description: >
    Moving along the road you notice that the road continues the the east and north.  The road curves
    around a large steep hill to the south.  The hill looks somewhat unnatural, and out of place.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20032
    east:
      to: tba:200:room:20034

"tba:200:room:20034":
  name: Dirt Road
  description: >
    You make your way on the dirt road.  The road seems to continue to the west and south.  You stand
    alongside a steep hill covered in grass and moss.  The hill rises so steeply above you that you doubt
    it could be climbed.
  sector: field
  flags: [bfs_mark]
  exits:
    south:
      to: tba:200:room:20035
    west:
      to: tba:200:room:20033

"tba:200:room:20035":
  name: Dirt Road
  description: >
    As you move along the small, dirt road you see the road continues to the north and south.  A large
    hill directly to the west looms above you.  Strange, when the rest of the rolling hills around here
    are so small.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20034
    south:
      to: tba:200:room:20036

"tba:200:room:20036":
  name: Dirt Road
  description: >
    The brush grows a bit thicker here but is still passable.  A few tiny animals seem to be taking
    refuge in some of the small bushes to the side of the road.  The road continues off to the north and
    south.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20035
    south:
      to: tba:200:room:20037

"tba:200:room:20037":
  name: Dirt Road
  description: >
    Moving along the dirt road you notice that it continues to the north and south.  The brush is
    broken up by small trees which seem to grow even thicker further south.  To the north the road opens up
    into the plains.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20036
    south:
      to: tba:200:room:20038

"tba:200:room:20038":
  name: Dirt Road
  description: >
    You make your way on the dirt road.  You notice the road leads to the north. The road bends to the
    west into a dense forest.  Their seems to be an absence of wildlife in this area, the forest is
    strangely silent.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20037

"tba:200:room:20039":
  name: Narrow Path
  description: >
    You are following a well travelled branch off the Western Highway. Somewhere in the distance to the
    south-west you can make out some small streaks of smoke, as if coming from the chimneys in a small
    village, while to the north you see the busy Western Highway.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:200:room:20015

"tba:200:room:20040":
  name: Sairith's Trading Post
  description: >
    The building is covered in dust and everything is slick from animal fat. The horrible stench from
    the tanning and curing of the hides fills your nostrils.  Pelts and various types of clothing hang
    from the walls and rafters. A man behind the counter grins
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:200:room:20007
