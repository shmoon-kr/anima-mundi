# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 51.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:51:room:5100":
  name: The City Entrance
  description: >
    You are at the entrance to a small underground city.  A great adamantite gate lies open to the west
    allowing entrance into the city.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    west:
      to: tba:51:room:5101
      look: A huge gate opens to the west allowing entrance into the city.
      door:
        keywords: [gate]
        kind: door
        reset: open
    up:
      to: tba:50:room:5011
      look: A passageway opens up into a fairly large cave above.
  extras:
  - keywords: [gate]
    text: A large adamantite gate with giant spider shaped emblems stands here.

