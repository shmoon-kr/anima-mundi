# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 201.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:201:room:20100":
  name: Elixias's Zone Description Room
  description: >
    @RLocation@n: A few island in the middle of the ocean @BPurpose@n: For people to explore, from the
    sandy beaches to the hidden coves.  From deep underwater to the deserted island where Leviathius the
    son of Leviathan resides.  It's a lowbie exp zone too, with crabs that appear more frequently at
    night and agressive jellyfishes that floats in the shallow waters.  There's no plot, but when hunting
    becomes boring players can always stroll down here and explore the area.  ;) @YSize@n: Size?  There's 50
    rooms steeped with lots of trigs.  Things to note: Immortals, please turn nohassle off, or errors
    will occur OR you may not be able to enjoy the full experience of this zone.  If you are caught by the
    siren, simple type @Rgoto siren@n and purge siren.  You can also try to logon as another human
    character and ask for an imm to help ;)
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:201:room:20104
      look: A small ladder leads to the bottom.

"tba:201:room:20101":
  name: At the Entrance of a Gloomy Forest
  description: >
    To the north is a dull, lifeless forest where the vegetation is densely thick and impassable. 
    Shadows play in the darkness of these woods and no sound could be heard from within the trees.  The only
    exit is a narrow path that leads to the south.
  sector: forest
  exits:
    south:
      to: tba:201:room:20103
      look: A small path leads away from the forest so the south, where it splits into two.

"tba:201:room:20102":
  name: On a Cliff by a Lighthouse
  description: >
    The cliff stands high from the sea below it, like a big giant at the edge of the coast.  Grasses
    sprout randomly around the area.  Looming from the west is an old lighthouse, and to the east a path
    leads towards a T-Junction.
  sector: hills
  exits:
    east:
      to: tba:201:room:20103
      look: The road splits into a T-junction.
    west:
      to: tba:201:room:20104
      look: A lighthouse stands solemnly over the cliff, watching over the seas.
      door:
        keywords: [door, west]
        kind: pickproof
        key: tba:201:obj:20199
        reset: locked
  extras:
  - keywords: [grasses, grass]
    text: Tiny patches of green grass can be found growing randomly in this area.

"tba:201:room:20103":
  name: At a T-Junction by a Slope
  description: >
    The path is covered with lots of dust, which leads to the north, west and the south.  Northwards,
    the path leads to the entrance of a dark, ominous forest. To the west, it continues to a silhouette of
    a tall building while to the south the path descends steeply to a sandy beach.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:201:room:20101
      look: A narrow path leads to a gloomy looking forest.
    south:
      to: tba:201:room:20105
      look: A slope leads down to a small sandy beach.
    west:
      to: tba:201:room:20102
      look: The gradient ascends towards an old lighthouse - worn down by weathering and age.

"tba:201:room:20104":
  name: In a Lighthouse
  description: >
    The walls are made of rough granite and there are no windows at all, so light cannot enter this
    place.  Thick layers of dust have settled on the floor, but fresh footprints proves that it might not be
    really abandoned after all. Please @RCLOSE DOOR@n after exiting to prevent players from entering.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:201:room:20102
      look: Outside the Lighthouse
      door:
        keywords: [door, east]
        kind: pickproof
        key: tba:201:obj:20199
        reset: closed
    up:
      to: tba:201:room:20100
      look: A sturdy ladder ascends upwards,
  extras:
  - keywords: [footprints, prints, foot]
    text: The footprints are still fresh.
  - keywords: [dust]
    text: It is powdery-looking and gray in color.

