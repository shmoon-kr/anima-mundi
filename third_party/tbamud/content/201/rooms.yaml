"tba:201:room:20146":
  name: In Oblivion
  description: >
    You are floating in unconsciousness...  Your head hurts, your mind rears. You try to move, your
    movements are hindered.  Darkness surrounds you from all sides, and there appear to be nothing here.
  sector: inside
  flags: [dark]

"tba:201:room:20147":
  name: On a Sandy Bay
  description: >
    The bay is a coast wenched between two cliffs, sandwiched in the middle. Covered with washed up
    pieces of broken wood and miscellaneous junk items dumped onto it, the area is fully of rubbish peeking
    out from the sand.
  sector: field
  exits:
    north:
      to: tba:201:room:20148
      look: A dead end
    west:
      to: tba:201:room:20149
      look: A shipwreck
  extras:
  - keywords: [wood, junk]
    text: The litter the beach, making it unsightly.  Several organic items are decaying already.

"tba:201:room:20148":
  name: On a Sandy bay
  description: >
    The cliff are on three sides, and the only visible exit is to the south.  It appears to be empty,
    and heavily populated by tropical plants and vicious vines. Speckles of broken rocks and stones lie
    here, and several marks are shown in the sand.
  sector: field
  exits:
    south:
      to: tba:201:room:20147
  extras:
  - keywords: [sand, marks]
    text: >
      Lines leading to the area against the north cliff suggests that something has been dragged there.
  - keywords: [north, cliff]
    text: >
      Marks leading to the north cliff suggests that something has been dragged there.  Perhaps
      @Rsearch@ning for something will uncover a treasure box?

"tba:201:room:20149":
  name: At the Scene of a Shipwreck
  description: >
    The shore ends here, prodding out of the sand are many jagged rocks.  Broken wooden planks are
    here, as well as a ship, torn by ocean reefs and left discarded here.
  sector: field
  exits:
    east:
      to: tba:201:room:20147
      look: On a Sandy Shore
  extras:
  - keywords: [ship, shipwreck]
    text: >
      This ship did not survived the cruel test of the stormy seas and hiding reefs.  Wrecked apart, the
      massive wooden structure is decaying, along with the stuff inside.

"tba:201:room:20150":
  name: In a Small Cozy House
  description: >
    The room is plain and simple without many furniture.  Resting against the north wall is a sizeable
    bed, and beside it is a wooden cupboard.  To the south a carpet has been carefully placed there.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:201:room:20108
      door:
        keywords: [door]
        kind: pickproof
        key: tba:201:obj:20113

"tba:201:room:20151":
  name: In a Small Underwater Tunnel @C[SURFACE]@n
  description: >
    Light filters from the surface, refracted to form ghostly figures that dance in the water.  The
    only exit out is to surface, or to go deeper into the tunnel north.
  sector: underwater
  flags: [indoors, soundproof, no_track, tunnel]
  exits:
    north:
      to: tba:201:room:20152
      look: The circular tunnel leads north.

"tba:201:room:20152":
  name: In a Underwater Tunnel @C[SURFACE]@n
  description: >
    The tunnel is made out of granite, with tiny pieces of glowing stones that lights the way in this
    tunnel.  It continues to the south, but it is possible to surface here.
  sector: inside
  flags: [indoors, soundproof, no_track, tunnel]
  exits:
    south:
      to: tba:201:room:20151

"tba:201:room:20153":
  name: In a Secret Cove @B[DIVE]@n
  description: >
    This is the entrance and the exit of the hidden cove, naturally build within the cliff itself. 
    There is a pool of water to the southern edge of the wall, and to the north the cove continues.
  sector: inside
  flags: [dark, indoors, peaceful, soundproof, no_track, private]
  exits:
    north:
      to: tba:201:room:20154

"tba:201:room:20154":
  name: In a Tunnel of A Cove
  description: >
    The sound of dripping water echoes in the tunnel of the cove.  The walls here are nearly empty,
    with pieces of glowing minerals etched into them.  The tunnel continues west - where you see a small
    room, upwards to another room and south to the exit/entrance of the cove.
  sector: inside
  flags: [indoors, peaceful, soundproof, no_track, private]
  exits:
    south:
      to: tba:201:room:20153
    west:
      to: tba:201:room:20155
      look: The tunnel leads to a small room.
    up:
      to: tba:201:room:20156
      look: The tunnel leads to a small room.

"tba:201:room:20155":
  name: A Room in the Cliff
  description: >
    This room measures five feet high and eight feet wide, the walls bare except for glowing minerals
    in them.  Hidden from the outside world and carefully concealed in a cliff, this place would make a
    great hideout.
  sector: inside
  flags: [indoors, peaceful, soundproof, no_track, private]
  exits:
    east:
      to: tba:201:room:20154

"tba:201:room:20156":
  name: A Room in the Cliff
  description: >
    This room measures five feet high and eight feet wide, the walls bare except for glowing minerals
    in them.  Hidden from the outside world and carefully concealed in a cliff, this place would make a
    great hideout.
  sector: inside
  flags: [indoors, peaceful, soundproof, no_track, private]
  exits:
    down:
      to: tba:201:room:20154

"tba:201:room:20157":
  name: On top of a Cliff @G[CLIMB]@n
  description: >
    Tropical trees populates the cliff to the east and west, only a small dirt trial leads to the north
    towards a hut with no door.  To get to base level you will have to @GCLIMB DOWN@n the vines to
    arrive on a beach.
  sector: inside
  exits:
    north:
      to: tba:201:room:20158
      look: A small hut is to the north, set against some tropical trees.

"tba:201:room:20158":
  name: In a Small Wooden hut
  description: >
    The hut is made from different lengths and types of wood, and the roof - tropical, broad leaves
    attached in a circular shape.  The floor is a carpet of nicely trimmed, green grass.  Towards the south
    is a narrow dirt route which leads outside.
  sector: inside
  exits:
    south:
      to: tba:201:room:20157
      look: A narrow route leads to the edge of a cliff
