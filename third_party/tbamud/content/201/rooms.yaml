"tba:201:room:20137":
  name: In the Ocean
  description: >
    The wind tears and howls, inflicting its wrath against you and the vast ocean.  North are safer and
    much calmer waters, while to the other directions the ocean continues.
  sector: water_noswim
  exits:
    north:
      to: tba:201:room:20118
