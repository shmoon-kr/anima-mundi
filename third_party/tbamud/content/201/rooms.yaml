"tba:201:room:20136":
  name: In the Ocean
  description: >
    The ocean is a deep blue, and the waves here are strong.  It is impossible to look into the depths
    of the ocean, for the shifting bodies of the sea makes it difficult to.  To the north you can descry
    a small island.
  sector: water_noswim
  exits:
    north:
      to: tba:201:room:20117
