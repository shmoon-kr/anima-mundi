"tba:201:room:20110":
  name: On a Rocky Part of Konolua Seacoast @Y[DIG]@n
  description: >
    This area is highly populated with rocks.  Weathered stone as well as scree that had came of the
    nearby cliff are left here.  Because of this, lots of crabs and other creatures had made their home
