"tba:201:room:20138":
  name: In the Ocean
  description: >
    The water is a deep blue color and looks threateningly deep.  Howling winds come in all direction,
    invoking the rage of the waves.  To the north the sea is calmer, while to the east, south and west
    the ocean continues.
  sector: water_noswim
  exits:
    north:
      to: tba:201:room:20119
