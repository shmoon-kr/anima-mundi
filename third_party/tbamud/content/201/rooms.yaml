"tba:201:room:20139":
  name: Underwater
  description: >
    You are beneath the surface of the ocean.  The currents under here are strong, pulling and forcing
    you to go deeper.  The depths of the sea is great. It is deep, so deep that there is only inky
    darkness at the bottom. Surrounding you are nothing, just lots and lots of seawater...
  sector: inside
  exits:
    north:
