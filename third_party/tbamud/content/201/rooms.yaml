  name: On the Coast of Konolua Beach @Y[DIG]@n
  description: >
    The beach begins here - filled with grains and grains of coarse, dry sand. To the north is an
    upward going slope that ascends sharply.  To the west you can see the shore and to the south and east the
    coast continues on.
  sector: field
  exits:
    north:
      to: tba:201:room:20103
      look: Up a Slope to a T-junction
    east:
      to: tba:201:room:20108
      look: Konolua Beach
    south:
      to: tba:201:room:20112
      look: Konolua Seahore
    west:
      to: tba:201:room:20106
      look: Konolua Seashore
  extras:
  - keywords: [sand, grain, grains]
    text: >
      Coarse grains of sand fills this beach.  They are a rich yellow color and are rough in texture.

"tba:201:room:20106":
  name: On a Sandy Shore @Y[DIG]@n
  description: >
    Here is the edge of the beach, where the shore merges with the shallow waters.  The beach stretches
    all the way to the east, while to the west and south the water eventually leads to the sea.  A cliff
    stands tall as an obstacle to the North.
  sector: field
  exits:
    east:
      to: tba:201:room:20105
      look: Konolua Beach
    south:
      to: tba:201:room:20111
      look: In Shallow Waters
    west:
      to: tba:201:room:20107
      look: In Shallow Waters

"tba:201:room:20107":
  name: In Shallow Waters @B[DIVE]@n
  description: >
    Beyond the shore, the waters are a clear green with a tinge of ocean blue. Floating pieces of
    broken wood swims lazily here, moving to the rhythm of the waves.  The beach lies to the east, while the
    deeper waters are generally to the west and south.  A solid, sturdy rock cliff prevents movement to
    the north and west.
  sector: water_swim
  flags: [no_mob]
  exits:
    east:
      to: tba:201:room:20106
      look: To the Shores of Konolua Beach
    south:
      to: tba:201:room:20131
      look: In the Deep Ocean
  extras:
  - keywords: [wood]
    text: >
      Broken pieces of wood, dark-brown in texture from having soaked in the water for too long, floats
      around here.

"tba:201:room:20108":
  name: Konolua Seacoast @Y[DIG]@n
  description: >
    Some trees scatter around the beach, swaying occasionally in the breeze.  To the north is a cliff,
    densely covered with vines and other form of parasitic plants.  Against it is a small delapidated
    house - its windows are near falling apart.  To the south the beach gently descends to the shore.
  sector: field
  exits:
    north:
      to: tba:201:room:20150
      look: A small house has been built here.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:201:obj:20113
        reset: closed
    east:
      to: tba:201:room:20109
      look: Konolua Beach
    south:
      to: tba:201:room:20113
      look: Konolua Seashore
    west:
      to: tba:201:room:20105
      look: Konolua Beach
  extras:
  - keywords: [tree, trees]
    text: The trees have broad leaves that can provide shade from the sun in the morning.
  - keywords: [cliff]
    text: >
      The cliff stands tall at a good 45 feet skywards.  Covered with plenty of vegetation, it looks like
      a guards standing the coast protecting the shores from danger.

