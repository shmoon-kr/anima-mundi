    text: >
      Engraved on this sacred blade is the name of the sword.  Forged by a competant and highly skilled
      blacksmith and enchanted by an adept and powerful sorceror, this blade holds the potential to create
      HORRENDOUS amount of damage. The blade itself is made of a bluish metal, yet it cannot be determined
      for the tones of blue are always changing.  You may say the blade itself is made of a solid type of
      flowing liquid, while the hilt has been creatively designed to form the shape of Leviathan, the
      legendary dragon that sleeps beneath the ocean. {bright_white}To Use this blade:{/bright_white} At the
      expense of 50 mana points, this blade will constantly heal you for 10 hp every 2-3 seconds.  To use this
      command, type {bright_blue}EXECUTE FUSION{/bright_blue}.  For 100 of your own hp you can damage the
      opponent for 1000 in return, provided that it is not a player character.  A drawback to this ability is
      the time taken to fully execute the damage, it takes time to recharge before striking down the
      opponent.  To use this type {bright_blue}PERFORM AURORAFALL{/bright_blue}.
  triggers: [tba:201:trg:20123, tba:201:trg:20122, tba:201:trg:20127]

