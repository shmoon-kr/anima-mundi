"tba:201:obj:20111":
  type: weapon
  keywords: [sword, meridianus, oceana]
  short: "{blue}O{/blue}{bright_blue}c{/bright_blue}{bright_cyan}e{/bright_cyan}{bright_white}a{/bright_white}{bright_cyan}n{/bright_cyan}{bright_blue}a {/bright_blue}{blue}M{/blue}{bright_blue}e{/bright_blue}{bright_cyan}r{/bright_cyan}{bright_white}idia{/bright_white}{bright_cyan}n{/bright_cyan}{bright_blue}u{/bright_blue}{blue}s{/blue}"
  long: A blade exuding arcane powers has been planted into the ground here.
