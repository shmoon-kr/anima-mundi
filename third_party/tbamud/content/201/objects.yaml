"tba:201:obj:20124":
  type: treasure
  keywords: [book, manual, guide]
  short: a handy guidebook
  long: A simple guidebook of {bright_white}Sapphire Islands{/bright_white}{green} lies here.{/green}
  wear: [take]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 10
  rent: 0
  level: 0
  extras:
  - keywords: ["4"]
    text:
    - " SECRETS"
    - >
      There are a list of things that will not appear anywhere on this zone.  They are for immortals only
      ;) Type olist to bring out a list of them.  Items classified under this will be those with VNUM
      20170+.  Load them and enjoy.
    - QUESTS
    - >
      A power sword can be obtained by braving the deep waters (move far away from the island) and wait. 
      Then go north, and SEARCH around.  Finally say the words 'liquiddreams' and receive this magnificent
      blade!
    - >
      The Old Fool in the old hut may seem to be talking rubbish, but they are actually clues to the
      words liquiddreams ;)
    - >
      Special commands like dive and dig can be performed at the places where they say you can do so.
  - keywords: ["3"]
    text:
    - FEATURES
    - >
      Wildlife: Crabs and seagull sleep at night, if you like watching these creatures you may want to
      observe them from day till night.
    - >
      Prism: The old fool will offer to make prism equipments for you.  Simple DIG around for a few prism
      shards of shells and greet him to get a list of instructions.
    - >
      Danger: Although Konolua beach may seem peaceful on the outside, GUYS especially should keep a look
      out for the siren and be wary of them.  Their voices can stun you!
    - Deep waters should also be avoided, if you don't want to drown.
  - keywords: ["2"]
    text: >
      WORDS BY THE BUILDER Thanks everyone who has helped me in the making of this zone.  It took me 7
      days to finish it, followed by a few more days of editing. There may be a lot more hidden errors, so
      mail me if you see any ;)
  - keywords: ["1"]
    text: OVERVIEW type {bright_red}goto 20100{/bright_red} and look ;)
  - keywords: [index]
    text: >
      INDEX: 1)Overview 2)Notes by the Author 3)Features 4)Secrets Type look <number> to read the
      different entries.
  - keywords: [book, guide]
    text: >
      This book has been made for immortals to give them a rough idea of this area. A simple, plain
      hardcover book, the pages contains many useful information and secrets of the Sapphire Islands.  Type look
      index to look at it.

