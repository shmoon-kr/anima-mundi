# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 150.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:150:room:15000":
  name: The King's Road
  description:
  - >
    You stand at the beginning of the actual King's Road.  The road is wide enough for several horses
    to ride along side by side with room to spare. The stones which make up the road have been put into
    place with such skill that the road seems to be perfectly smooth and perfectly straight.
  - >
    You spot a small trail leading to the south through the undergrowth which surrounds the road at
    this point. A traveller passes by and waves cheerfully at you.
  sector: city
  flags: [no_mob]
  exits:
    east:
      to: tba:150:room:15001
      look: The King's Road continues in a straight line to the east towards a grand castle.
    south:
      to: tba:150:room:15061
      look: A small overgrown trail leads through the undergrowth to the south.
    west:
      to: tba:35:room:3502
      look: The King's Road thins out a bit into a lane just to the west.
  extras:
  - keywords: [traveller]
    text: >
      The traveller smiles cheerfully and calls 'hello' when you greet him, but continues on his way. 
      The traveller is in excellent condition.

"tba:150:room:15001":
  name: The King's Road
  description: >
    You stand in the center of the great King's Road.  The road is very well built, and goes in a
    straight line due east-west.
  sector: city
  exits:
    east:
      to: tba:150:room:15002
      look: The King's Road continues in a straight line to the east.
    west:
      to: tba:150:room:15000
      look: You see that the King's Road continues westwards towards a large city.

"tba:150:room:15002":
  name: The King's Road
  description: >
    You stand on the King's Road, which leads east and west.  The skill of the builders is apparent,
    since it is impossible to notice any turn or irregularity in the road.
  sector: city
  exits:
    east:
      to: tba:150:room:15003
      look: You see a castle in the far east.
    west:
      to: tba:150:room:15001
      look: The King's Road continues in a straight line to the west.

"tba:150:room:15003":
  name: On The King's Road Outside A Castle
  description: >
    You are standing on the King's Road.  Before you is a large Castle, evidently built not so much for
    strength as for beauty. It is not totally without defenses, though, for it is surrounded by a deep
    moat, and its windows are just narrow slits for archers to shoot through.  To the north there is a
    drawbridge across the moat.
  sector: city
  exits:
    north:
      to: tba:150:room:15004
      look: You see the drawbridge.
    west:
      to: tba:150:room:15002
      look: The King's Road continues in a straight line to the west.

"tba:150:room:15004":
  name: On The Drawbridge
  description: >
    You have arrived at the drawbridge leading into the Castle.  Before you is a huge, double-doored
    gate.  It seems very strong.  You see some whirls in the moat.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:150:room:15007
      look: >
        The gate has huge, but intricately carved hinges.  As the Castle itself, it seems designed not only
        for strength, but also for beauty.
      door:
        keywords: [gate, door]
        kind: door
        reset: closed
    south:
      to: tba:150:room:15003
      look: You see the King's Road.
  extras:
  - keywords: [whirls, whirl, moat]
    text: You can't see much, but it seems that something beneath the surface is creating them.

"tba:150:room:15005":
  name: The Kitchen
  description: >
    You are in the Kitchen.  Lots of helpers hurry to do the Chief Cook's bidding, and there is a
    wonderful smell that makes you feel very hungry. All around the room, there are shelves with different
    kinds of cooking gear stacked on them.  There is an exit to the north, and one to the east; both leading
    to small passages.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:150:room:15010
      look: You see a small, dimly lit passage.
    east:
      to: tba:150:room:15006
      look: You see a small, dimly lit passage.

"tba:150:room:15006":
