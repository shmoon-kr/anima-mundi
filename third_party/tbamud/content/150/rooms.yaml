  description: >
    You are standing in a small passage, that is clearly intended mostly for the servants of the
    Castle.  It is only dimly lit and quite narrow. The passage leads west, and to the east there is a small
    door.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:150:room:15007
      look: The door is small and uninteresting.
      door:
