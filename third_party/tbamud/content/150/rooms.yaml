  description: >
    You are below one the three mighty towers of the Castle.  There are no guards here, and you sense
    that this part of the Castle is largely unused.  There are stairs going up to the tower, and there is
    also an exit to the north.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:150:room:15014
      look: You see a small, dimly lit passage.
    up:
      to: tba:150:room:15034
      look: The stairs are old, but in good repair. They lead up into the tower.
  extras:
  - keywords: [stairs]
