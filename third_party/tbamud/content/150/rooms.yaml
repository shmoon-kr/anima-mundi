"tba:150:room:15011":
  name: The Great Hall
  description: >
    You are standing in the south-west end of the Great Hall. It is truly vast; the roof is so high
    above your head, that it seems no closer than the clouds outside.  The roof is beautifully painted, by
    someone who must have been a true master.  The hall is very large, and could easily seat several
    hundred people at a banquet.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:150:room:15016
      look: You see the King's Great Hall.
    east:
      to: tba:150:room:15012
      look: You see the King's Great Hall.
  extras:
  - keywords: [roof, paintings, paint]
    text: >
      The paintings on the roof depict the great heroes and gods.  One of the gods is fairly
      heavy-bellied and incredibly hairy, with a massive beard.  Also among them are the great enemies and wrongdoers,
      such as the evil Goddess Yochlol and the powerful evil Wizard Tharoecon.

