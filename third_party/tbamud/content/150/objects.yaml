"tba:150:obj:15000":
  type: weapon
  keywords: [nothingness, universal]
  short: Sapowox's Universal Nothingness
  long: You are quite unable to perceive Sapowox's Universal Nothingness here.
  flags: [hum, no_rent, magic]
  wear: [take, wield]
  values:
    damage: 6d4
    attack: sting
  weight: 40
  cost: 1
  rent: 200
  level: 0
  affects:
  - apply: hitroll
    modifier: 2
  - apply: damroll
    modifier: 2
  extras:
  - keywords: [text, writing, inscription]
    text: "It just says: ' (void *) ' Not very enlightening, is it?"
  - keywords: [nothingness, universal]
    text: >
      You are not sure, but you do not seem not able to figure out what it isn't, because it doesn't much
      resemble anything you haven't ever seen.  You feel a bit of mortal confusion, but you notice a small
      inscription on it.

