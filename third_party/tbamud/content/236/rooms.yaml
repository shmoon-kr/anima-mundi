    the sound of pickaxe against rock.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23630
      look: The hallway widens somewhat.
    south:
      to: tba:236:room:23618
      look: The hallway continues.

"tba:236:room:23624":
  name: A dwarven home
  description: >
    The dwarves might have spent many years working on their city.  However they have spent very little
    time decorating their dwellings.  In this, for dwarven measures quite large home, a bed has been set
    along one wall, a table with two small chairs by another, and a small stove in the farthest corner. 
    To the east a small portal, about three feet tall, leads into darkness, and north of here a wooden
    door leads out to the hallway.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23631
      look: A wooden door leads out of the dwarven home.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:236:room:23625
      look: A small portal leads into total darkness.  You might be able to squeeze your way through.

"tba:236:room:23625":
  name: In a closet
  description: >
    Wow, do you feel stupid now.  You've only just managed to crawl through the portal before you
    realize the place you've fought so hard to get into is nothing but a wardrobe for the dwarfs living in
    this home.  The only way out is back west.
  sector: city
  flags: [dark, indoors, private]
  exits:
    west:
      to: tba:236:room:23624
      look: The portal looks just as small from this side.

"tba:236:room:23626":
  name: The dwarven city
  description: >
    You are standing next to the town well, where fresh water is running from a spring halfway up the
    south wall into a masonry basin.  What the basin can't hold runs over the edge and through a hole in
    the floor.  You pause once again to marvel at the cleverness of the stonewright who made this once
    upon a time. You can leave the well by going north.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23632
      look: Up north you see the nice, but also quite boring masonry of the hallways.

