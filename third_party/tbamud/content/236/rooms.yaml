"tba:236:room:23651":
  name: A dwarven nobles' home
  description: >
    You're standing in the sleeping room of a dwarven noble.  So much is obvious from the rich
    decoration of the walls, the larger than average bed and the large ironbound chest in the corner.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23652
      look: A portal leads to the living area.

"tba:236:room:23652":
  name: a dwarven nobles' home.
  description: >
    You are standing in a very square living room, obviously the home of someone above average income
    and taste.  On the walls are some decorative tapestries, and the furniture looks almost comfortable. 
    After dwarven standards this is very luxurious - some might even call it ostentatious, had it been
    part of the general vocabulary of the dwarves.  Since it isn't, they simply refer to it as 'the
    ministers house'.  A portal leads to the sleeping room to the west, while a wooden door leads back south.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:236:room:23645
      look: A wooden door leads out into the corridors.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    west:
      to: tba:236:room:23651
      look: A portal leads to the sleeping area.

"tba:236:room:23653":
  name: The tool shed.
  description: >
    Not very many people have been here recently.  Actually cobwebs cling to every single tool and
    every single piece of furniture is covered by dust.  It seems the small door to the east only blocks the
    worst of the wind, not the dust or the insects.  You don't see anything of value, but at least you
    are out of the terrible draft from the tunnel outside.
  sector: city
  flags: [dark, indoors, no_track]
  exits:
    east:
      to: tba:236:room:23654
      look: A small door leads out into the drafty tunnel.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:236:room:23654":
  name: In a drafty tunnel.
  description: >
    You are crawling on hands and knees in a small tunnel.  Up north you see a faint outline of the
    tunnels opening.  You realize the light coming from the opening is daylight from the outside.  South the
    tunnel ends in the dwarven city.  You seem to be in one of the tunnels the dwarves had to make to
    permit enough air to enter their city for them to breathe.  The walls are smooth as only the dwarves
    can make them, and a strong wind pushes at you from the north. In the west wall a small wooden door
    leads to what you guess must be the dwarves' best suggestion of a tool shed.
  sector: city
  flags: [dark, indoors, tunnel]
  exits:
    north:
      to: tba:236:room:23669
      look: You might be able to fight the wind, and move further north into the tunnel.
    south:
      to: tba:236:room:23647
      look: >
        You can see the lights of the dwarven city.  They all burn on the air let in through this hole.
    west:
      to: tba:236:room:23653
      look: >
        A wooden door leads into some old store room you think could contain old junk, the dwarves just
        wanted to forget.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:236:room:23655":
  name: The Checkpoint
  description: >
    You would think the dwarven king lived in eternal fear of assassination, with all those checkpoints
    on the way to the dwarven court.  You're only half mistaken - He's not afraid of his fellow dwarves
    but many men have sworn against him, since he alone controls the trade of iron and gold from the
    dwarven kingdom.  So right now you're standing at the gate to the dwarven court, waiting to be inspected
    by the kings' watch.  To your east a large white marble block serves as a gate and to the east a just
    as large black granite slap serves the same purpose.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23656
      look: You see the guards' barracks.
    east:
      to: tba:236:room:23648
      look: >
        A large white marble block, obviously magically enchanted, opens to let people through.  You're
        quite certain, though, that if your intent is to destry the kingdom, the doors would remain shut... 
        Letting noone in.
      door:
        keywords: [marble, white]
        kind: pickproof
        reset: closed
    south:
      to: tba:236:room:23658
      look: You see the guards' barracks.
    west:
      to: tba:236:room:23660
      look: A large black granite slab, which seem to function as a gate, can be pushed aside here.
      door:
        keywords: [granite, black]
        kind: pickproof
        reset: closed

"tba:236:room:23656":
  name: The barracks
  description: >
    You are certain about one thing.  The dwarves have been here for a long time.  The smell of dwarven
    sweat hangs in the air in these rooms, thick as a curtain.  The line of beds along the west wall and
    the small boxes set in front bears witness of strong disciplin.  This is a place for the best of the
    fighters among the dwarves - The kings' guard.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23657
      look: The barracks continue.
    south:
      to: tba:236:room:23655
      look: The checkpoint before the court is here.

