"tba:236:room:23622":
  name: Dwarven mines
  description: >
    You are standing in a comparatively large room deep inside the dwarven mountain.  The walls around
    you seem to be chipped directly from the surrounding rock, and you immidiately realize you're
    standing on the edge of the dwarven mines.  Also the large hole in the floor, with ladders leading into
    darkness might have given you a clue.  To your north a wooden door with a sturdy lock blocks your exit,
    while you may descend into the mines by going down.  A large crane has a very large basket hanging
    from it over the hole here.
  sector: mountains
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23629
      look: A wooden door, almost always closed to keep the noise from the mines in.
      door:
        keywords: [door, wooden]
        kind: door
        key: tba:236:obj:23626
        reset: closed
    down:
      to: tba:236:room:23670
      look: The ladder stretches into darkness.
  extras:
  - keywords: [walls]
    text: >
      The walls are the same rock as the surrounding city.  You notice, however, that these walls doesn't
      consist of blocks of stone.  The room's more likely been dug out of the mountain.
  - keywords: [crane, large]
    text: >
      A large crane made from wood, seemingly made to hoist large amounts of ore and stone from the
      mine.  You think you might be able to fit in the basket currently hanging here.
  - keywords: [basket]
    text: >
      A large basket, it looks sturdy enough to carry a ton of rock at once.  It should be able to carry
      you with all your belongings without any problems.
  triggers: [tba:236:trg:23606]

"tba:236:room:23623":
  name: The dwarven city
  description: >
