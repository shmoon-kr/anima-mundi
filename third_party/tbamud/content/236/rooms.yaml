"tba:236:room:23638":
  name: A dwarven home
  description: >
    You're in a small very square room, with stone walls, stone floor and stone ceiling.  A small bed
    has been set in one corner, and a table with small chairs around it in another.  Judging from the
    smell, the dwarf who lives here doesn't care too much for water, not for taking baths, anyway..  A wooden
    door leads north from here.
