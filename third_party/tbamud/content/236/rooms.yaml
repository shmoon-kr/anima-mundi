  name: The dwarven city
  description: >
    The underground hallway is wide enough for six people to walk next to each other here, and the
    stone floor has evidently been walked by many feet.  The walls are a show of fine masonry, and the gray
    marble rocks have been worked so perfectly, that you wouldn't be able to put even the tip of your
    knife between two stones.  Every three feet a torch lights up the corridor and the light makes you feel
    safe.  To your west a block of pure white marble blocks the hallway.  A short inspection reveals it to
    be a thick magical doorway.  A light push makes it turn aside.  You can also follow the wide hallway
    to the east.
  sector: city
