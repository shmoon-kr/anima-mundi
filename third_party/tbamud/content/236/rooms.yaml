  description: >
    You're standing in what some people might consider a very boring home.  A portal open up to the
    west, letting you peek into the sleeping chamber, whaile this living area is barren a devoid of anything
    that might have given you a clue about who lives here.  You guess, however, from the size of the
    furniture, that you've once again entered a dwarven home.  A wooden door leads north from here.
