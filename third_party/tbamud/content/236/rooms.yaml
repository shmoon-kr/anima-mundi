"tba:236:room:23629":
  name: The dwarven city
  description: >
    The hallway has widened to about twice the width it had earlier.  The walls are a show of fine
    masonry, and the gray marble rocks have been worked so perfectly, that you wouldn't be able to put even
    the tip of your knife between two stones.  Every three feet a torch lights up the corridor and the
    light helps you to read the sign above the door to the south.  It says 'Beware Of Falling Rocks - Use
    Helmets In The Mine' The wide hallway continues to the west and east, and from behind the door to the
    south you can hear miners at work.
  sector: city
