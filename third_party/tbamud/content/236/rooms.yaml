"tba:236:room:23660":
  name: At the court
  description: >
    You have entered the court of the dwarven king.  East of here a large black granite slab magically
    bars the exit, and while a light touch currently makes it turn aside, you realize quickly that the
    door can be sealed airtight by removing the spells from the slab To your west a brightly lit corridor
    with intricant decoration leads towards the throne room.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23655
      look: >
        A large granite slab, black as night, blocks your path.  It seems to be hovering just barely of the
        ground, making it easy to turn aside.
      door:
        keywords: [granite, black]
        kind: pickproof
        reset: closed
    west:
      to: tba:236:room:23661
      look: The intricantly carved corridor leads further towards the throne room.

"tba:236:room:23661":
  name: At the court
  description: >
    You're standing before a decorated wooden door to the west.  South and east of here the corridor
    continues, but to the north a very nicely decorated wall blacks you path.  The door to your west is
    ajar, and through it you can see the sleeping room of the royal dwarven family.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23660
      look: The intricantly decorated corridor leads toward the dwarven city.
    south:
      to: tba:236:room:23663
      look: The corridor continues.
    west:
      to: tba:236:room:23662
      look: A wooden door leads to the royal sleeping chamber.
      door:
        keywords: [wooden, door]
        kind: door

"tba:236:room:23662":
  name: Royal sleeping room
  description: >
    You are in a room, about twenty by thirty feet, which is totally dominated by s couple of very
    large beds.  This obviously is where the royal family sleep, when they sleep.  A wooden door leads back
    east.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23661
      look: A wooden door leads east.
      door:
        keywords: [door]
        kind: door

"tba:236:room:23663":
  name: At the court
  description: >
    The intricantly carved tunnel leads south and north here.  To your west a wooden and very nice door
    leads to the ministery of trade, the most important part of the dwarven kingdom.  To your east a
    portal open up to the shrine of Welcor, the dwarven deity.  South you spot the throne room.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23661
      look: The corridor continues.
    east:
      to: tba:236:room:23666
      look: A portal leads to the shrine of Welcor, the deity of the dwarves.
    south:
      to: tba:236:room:23667
      look: The Throne room is here.
    west:
      to: tba:236:room:23664
      look: You see the office of the trade minister.
      door:
        keywords: [door]
        kind: door

"tba:236:room:23664":
  name: Ministry of trade
  description: >
    The office of the minister of trade is a comfortable one.  Some of the funrniture is mansized,
    enabling both parts to sit back and relax when the important trade regulations are being discussed. 
    Currently, though no great discussion is taking place and nothing of much interest can be found here.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23663
      look: A wooden door leads beack to the corridor.
      door:
        keywords: [door]
        kind: door

"tba:236:room:23666":
  name: Shrine of Welcor
  description: >
    You are standing in front of stone altar, made from marble.  Or at least you think it's marble. 
    The color of the stone makes you think it is a large fire, changed into solid rock.  The altar is
    square, but even as you watch it, the colors seem to shift a bit, as if the stone were made from suspended
    flames.  In front of a the altar a silver chain shows just how near you're supposed to go.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:236:room:23663
      look: A portal leads back to the royal court.
  extras:
  - keywords: [chain, silver]
    text: >
      A thin silver chain seems to enter the rock on both sides of the altar. There are no hooks or
      rings, the chain simply continues into the rock.  A strong magical field protects the chain, and no matter
      how you try, you can't seem to cross it.
  - keywords: [altar, marble, fire]
    text: >
      Tha altar is about 3' tall, 6' wide and 2' deep.  It's just out of reach on the other side of the
      silver chain, and on it, an extremely beautiful hammer has been put.

"tba:236:room:23667":
  name: At the Dwarven Court
  description: >
    You have entered the throne room of the dwarven king.  Along the south wall rich tapestries hang,
    the only extravagant thing in the whole complex.  In front of you, the throne has been set up, with
    steps leading up to a seat in about the height if your chest.  You realize the throne has the obvious
    consequence that everyone has to look up, and consequently feel very small, when adressing the king.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23663
      look: The court continues.
  extras:
  - keywords: [tapestries]
    text: You wonder, could there be anything behind these heavy tapestries?
  - keywords: [throne, chair, seat, dwarven]
    text: >
      The Throne has been cut of black marble, and decorated with jade.  In the seat the king seem almost
      divine.
  triggers: [tba:236:trg:23603, tba:236:trg:23602]

"tba:236:room:23668":
  name: The dwarven treasury
  description: >
    The fabled dwarven treasury is at your feet.  Gold, platinum and silver. Gemstones of different
    fashion, different kinds.  The loot is so large you can't grasp it all, ad decide to concentrate on the
    nearest corner to get an overview.  This is what you think can be translated into real money later.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:236:room:23667
      look: The throne room is just outthere.
      door:
        keywords: [vault]
        kind: pickproof
        key: tba:236:obj:23634
        reset: locked

"tba:236:room:23669":
  name: In a drafty tunnel
  description: >
    You're crawling in a small tunnel, leading to the outside from the dwarven city, or the other way. 
    North the opening to the outside is very close, while to the south you can barely make out the light
    from the torches within the dwarven city.  A strong draft tries to push you deeper into the tunnel,
    pressing on from the north.
  sector: city
  flags: [dark, indoors, tunnel]
  exits:
    north:
      to: tba:236:room:23685
      look: North of here, the tunnel ends and you are under open sky.
    south:
      to: tba:236:room:23654
      look: Winds try to blow you into the city, by blowing you south.

"tba:236:room:23670":
  name: In the Mines
  description: >
    You are standing on a very steep wooden ladder, and you can't see how far down there are.  The
    echoes from below you suggest, however, that you are perched about halfway up (or down) a drop of several
    hundred feet.  Around you, large wooden bracers, probably made from oak, support the mountain walls,
    making the journey downwards safe from falling stone.  You may continue up or down the ladder.
  sector: inside
  flags: [dark, indoors, tunnel]
  exits:
    up:
      to: tba:236:room:23622
      look: The ladder leads to the mine entrance.
    down:
      to: tba:236:room:23671
      look: A very tall ladder leads to up into darkness.

"tba:236:room:23671":
  name: In the mines
  description: >
    The ladders continue, both up and down.  Once in a while baskets are lowered past you into the
    mine.  Always when one goes down, another goes up, past you. You stare downwards, hoping to make out some
    sort of bottom below you.  You have no such luck.
  sector: mountains
  flags: [dark, indoors]
  exits:
    up:
      to: tba:236:room:23670
      look: A ladder stretches upwards toward the dwarven city..
    down:
      to: tba:236:room:23672
      look: The seemingly endless ladder leads into darkness below you.

"tba:236:room:23672":
  name: In the mines
  description: >
    You are getting weary.  This ladder seems to go on forever.  Looking up, you see nothing but
    darkness, and looking down, nothing more can be seen.  It seems the ladders aren't so used anymore, since
    the baskets that are lowered into the mine can carry more than just gold and rocks.
  sector: mountains
  flags: [dark, indoors, no_track, tunnel, private]
  exits:
    up:
      to: tba:236:room:23671
      look: The seemingly endless ladder continues.
    down:
      to: tba:236:room:23673
      look: The seemingly endless ladder leads into darkness below you.
  triggers: [tba:236:trg:23607]

"tba:236:room:23673":
  name: In the mines
  description: >
    Standing on a ladder, inside a huge mountain, you're quite happy the dwarves seem to have supported
    their mine well.  Wooden bracers, the size of your leg support the walls around you.  This helps
    comfort you a bit, however you are certain there is a long walk to get to the top of this ladder.  But a
    very brief fall to the bottom.  Baskets pass you by sometimes, some with metals, others with people
    in them.
  sector: mountains
  flags: [dark, indoors, no_track, tunnel, private]
  exits:
    up:
      to: tba:236:room:23672
      look: The seemingly endless ladder leads up into the unknown.
    down:
      to: tba:236:room:23674
      look: The seemingly endless ladder leads into darkness below you.

"tba:236:room:23674":
  name: In the mines
  description: >
    Yuo are standing at the foot of a ladder.  The ladder is made of wooden and leads up through a
    large hole in the ceiling.  From the same hole a large basket is hanging from a thick rope.  Around you
    is the uneven rockface, you can't avoid when mining after precious metals.  A ragged opening in the
    northern wall leads into the darkness of the mines.  An extremely large basket is hanging from a rope
    through the opening in the ceiling.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:236:room:23675
      look: The mine continues.
    up:
      to: tba:236:room:23673
      look: The ladder stretches farther than you can see.
  extras:
  - keywords: [basket, crane]
    text: >
      A large basket, it looks sturdy enough to carry a ton of rock at once.  It should be able to carry
      you with all your belongings without any problems.
  triggers: [tba:236:trg:23606]

"tba:236:room:23675":
  name: In the mines
  description: >
    Dwarven mines have a tendency to be very much the same all the time, all stone walls and wooden
    bracers.  However, at this point you have to be careful. Just north of here, a deep hole leads into
    deepest darkness, leaving no doubt you'd die if you fell in.  A small shelf along the east wall lets you
    walk past it, but walk carefully.  The slightest slip would cost you your life. You may also go south
    from here.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:236:room:23676
      look: >
        You may be able to cross the pit to the north by walking along the eastern wall.  But be careful -
        a fall into the darkness would surely kill you.
    south:
      to: tba:236:room:23674
      look: The mine continues.

"tba:236:room:23676":
  name: In the mines
  description: >
    You are walking on a ledge, about three feet wide, on the edge of a very deep pit.  You walk very
    close to the east wall, to avoid tripping and falling into the pit.  While you can't see the bottom of
    the pit you are certain that certain death awaits you in the depths.  The ledge continues north and
    south.
  sector: mountains
  flags: [dark, indoors, tunnel]
  exits:
    north:
      to: tba:236:room:23678
      look: A mine tunnel has been dug into the side of the pit wall. You may enter it here.
    south:
      to: tba:236:room:23675
      look: The mines stretch into darkness.
    down:
      to: tba:236:room:23684
      look: >
        You throw a small stone into the pit and wait to hear it strike.  And wait. And wait.  Carefully
        you choose another rock, a bit larger this time, and throw it in.  Again you wait.  This pit is DEEP. 
        Don't go there.

"tba:236:room:23677":
  name: In the mines
  description: >
    The mine walls has been supported by large wooden bracers here, and as far as you can see, the
    dwarves has struck another vein of ore, leading east from here.  The original tunnel continues north and
    south from here, while a side tunnel branches off, following the new vein eastwards.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:236:room:23679
      look: The mine tunnel continues.
    east:
      to: tba:236:room:23680
      look: A small side tunnel leads into darkness.
    south:
      to: tba:236:room:23678
      look: The mine tunnel continues.

"tba:236:room:23678":
  name: In the mines
  description: >
    You are now inside the very heart of the dwarven kingdom - The mines themselves.  The mine tunnel
    in which you're standing has been supported by bracers made from solid oak.  The face of the rock
    bears the markings of many a pick, and the mine continues northward, following the vein deeper into the
    mountain.  You may go south too, but tread carefully.
  sector: mountains
  flags: [dark, indoors, tunnel]
  exits:
    north:
      to: tba:236:room:23677
      look: The mine tunnel continues.
    south:
      to: tba:236:room:23676
      look: A ledge around a deep pit leads south from here.

"tba:236:room:23679":
  name: At a dead end in the mines.
  description: >
    The mine tunnel ends here.  The ore vein can be seen as a glimmering vertical stripe at about chest
    height.  Various mining tools and drills suggest you've just arrived at a bad time, seeing no one
    mining the ore.  The tunnel continues south from here.
  sector: mountains
  flags: [dark, indoors]
  exits:
    south:
      to: tba:236:room:23677
      look: The mine tunnel continues.

"tba:236:room:23680":
  name: In the side tunnels
  description: >
    This side tunnel isn't as large as the main mine tunnel just west of here. Also it twists and turns
    to follow the ore vein.  The reddish-brown and silvery white color on the walls suggest an ore with
    both titanium and iron.  The tunnel continue south and west from here you see the main tunnel.
  sector: mountains
  flags: [dark, indoors]
  exits:
    south:
      to: tba:236:room:23681
      look: The side tunnel leads into total darkness.
    west:
      to: tba:236:room:23677
      look: The main mine tunnel is just west of here.

"tba:236:room:23681":
  name: In the side tunnels
  description: >
    The mine tunnel splits here, going east, north and south.  This part of the tunnel is unsupported
    and you feel a little unsafe, considering the chance of a cave-in.  All over the mine floor large
    rocksa have been left where they fell, and you feel moreare about to fall down.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:236:room:23680
      look: The side tunnel leads towards the main mine tunnel here.
    east:
      to: tba:236:room:23683
      look: The reddish-brown colors lead this way.
    south:
      to: tba:236:room:23682
      look: The silvery white colors lead this way.

"tba:236:room:23682":
  name: In the side tunnels
  description: >
    The side tunnel ends here, at an excavation in the south wall.  The dwarves seem to be mining
    titanium here.  Since titanium is so strong it is hard on the tools used, and on the arms swinging the
    picks.  Currently no one is mining, but you think it is just a question of time before someone shows
    up.  A small bell has been connected to the small pile of ore that's stacked here.  You immidiately
    realize that as soon as you touch the pile, the miners will be on your neck.  The tunnel leads north from
    here.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:236:room:23681
      look: The tunnel leads north from here.

"tba:236:room:23683":
  name: In the side tunnels
  description: >
    This is where the dwarves get thir iron for the tempered steel plate armors you saw at the armorers
    stall in the trade halls.  The ore is so fine you can actually see the glimmer of iron, not just the
    reddish lump you see everywhere else.  The tunnel leads west from here.
  sector: mountains
  flags: [dark, indoors]
  exits:
    west:
      to: tba:236:room:23681
      look: The tunnel leads west from here.

"tba:236:room:23684":
  name: Falling......
  description:
  - AAAA
  - AAAA
  - AAAA
  - AAA
  - AA
  - A
  - A
  - A
  - R
  - R
  - G
  - G
  - H
  - H
  - >
    Your scream is stopped suddenly, as you hit the side of the pit, smashing your skull. Your body
    continues to fall, for several minutes, hitting the sides of the pit, until it is reduced to a bloody
    pulp, bearing no resemblance to a person.
  sector: mountains
  flags: [no_mob, no_track, no_magic]
  triggers: [tba:236:trg:23617]

"tba:236:room:23685":
  name: At the end of the tunnel
  description: >
    Standing on the edge of a ledge, high above a ragged ravine, you realize you have nowhere to go
    except back through the tunnel.  The only other option is to jump...
  sector: mountains
  flags: [no_track]
  exits:
    south:
      to: tba:236:room:23669
      look: >
        A small tunnel opens up in the side of the mountain.  The walls are perfectly smooth and a strong
        draft at the entrance makes you onder where it all goes.
