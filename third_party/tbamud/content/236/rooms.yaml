         This zone has been thought out, and implemented by Welcor of Cruelworld Mud.
      Builder      : Welcor
      Zone         : 236 Aldin
      Began        : 1998
      Player Level : 10-14
      Rooms        : 84
      Mobs         : 28
      Objects      : 42
      Shops        : 6
      Triggers     : 17
      Theme        :
      Plot         :
      Links        : 00, 99
      Map          : 00
      Zone 236 is linked to the following zones:
      237 Dwarven Trade Route            at 23601 (south) ---> 23700
  sector: inside
  flags: [private]

"tba:236:room:23601":
  name: Entrance to the Tradehalls
  description: >
    You're standing in front of a large gateway into the mountain.  The portal is large enough for
    several carriages to go through it at once.  It's very nice masonry work and you can't help thinking
    about how old it looks.  A sign has been posted near the entrance.
  sector: mountains
  exits:
    north:
      to: tba:236:room:23602
      look: >
        A large stone portal, rising from the cave floor and in a wide arch above you. In the middle the
        arch is more than 20' high.
      door:
        keywords: [portal]
        kind: door
    south:
      to: tba:237:room:23700
  extras:
  - keywords: [masonry]
    text: The stones have been set so close, you can't even force a knife between them.
  - keywords: [sign]
    text:
      preformatted: |2
           +----------------------------------+
           |                                  |
           | The Trade Halls                  |
           |                                  |
           |    AR       AR = Armorer        |
           |     |                            |
           | WP--+--+#   WP = Weaponsmith     |
           |     |                            |
           | SW--+-TR    SW = Stonewright     |
           |     |                            |
           |     +       TR = Travellers rest |
           |                                  |
           |              # = Restricted Area |
           |                                  |
           |          By Order of the King.   |
           |                                  |
           +---------------+---+--------------+
                           |   |
                           |   |
                           |   |
                           |   |
                           |   |
                           |   |

"tba:236:room:23602":
  name: Inside the Tradehalls
  description: >
    You have entered a large, partly natural cavern, The air is filled with yelling from the stalls to
    the west and north of here, East of here you see the travellers resting area, and to your south the
    great portal leads out of the trading halls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23607
    east:
      to: tba:236:room:23603
    south:
      to: tba:236:room:23601
      look: >
        A large stone portal, rising from the cave floor and in a wide arch above you.  In the middle the
        arch is more than 20' high.
      door:
        keywords: [portal]
        kind: door
    west:
      to: tba:236:room:23604

"tba:236:room:23603":
  name: Travellers rest.
  description: >
    This corner is a quiet resting spot, where a couple of bunks makes for complimentary meds.  You
    feel quite safe here, and expect to get a good rest. To your west the tradehalls extend, and north you
    see a narrow platform, inaccesible from here.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:236:room:23602

"tba:236:room:23604":
  name: The stonewrights stall
  description: >
    On the ground in front of you several blocks, hewn from the sorrounding rock, have benn spread
    evenly.  Behind a particularly large and square block, the stonewrights' assistant has set up a stall,
    selling large rocks for headstones and the like.  He also has a selection of smaller stones, refined
    into fine jewelry.  To the east you can go back in the main trading hall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23602
  extras:
  - keywords: [blocks, block, stone, rock]
    text: >
      It doesn't look like the bloacks of rock come from these walls.  They seem to have been moved here
      with might.

"tba:236:room:23605":
  name: The weaponsmiths stall
  description: >
    The weaponsmiths assistant has set up a stall here, selling the weaponsmiths produce.  He offers a
    selection of blunt and edged weapons, making sure you leave before you use them.  You can leave to
    the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23607

"tba:236:room:23606":
  name: The Armorers Stall
  description: >
    You are in the corner of the cave, which the dwarves have decided to use as a trade area.  In this,
    the farthest corner from the entrance, some shining armor has been laid out on an old sack.  Behind
    it, the assistant to the armorsmith is getting ready to display his merchandise to you.  To get back
    to the center of the trade halls, you must go south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:236:room:23607
  extras:
  - keywords: [sack, armor, armor]
    text: >
      The different pieces of armor have been strewed all over the ground here, but it might be an unwise
      idea to try to just pick it up.  Theft is not looked lightly upon in the dwarven kingdom.

"tba:236:room:23607":
  name: Center of the Trade Halls
  description: >
    You are Standing in the middle of what you would have to call a domed cave, in lack of other
    words.  The cave is strangely symmetrical, though, and you are certain the ceiling high above you have been
    touched by a dwarfs pickaxe in the past.  The floor is rock, and there is rock above and around
    you.  You are also certain the dwarfs can monitor you here from hidden holes in the rockface.  To your
    west and north there are stalls set up by the traders, while to the east you can try to enter the
    dwarven city itself.  You can leave to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23606
    east:
      to: tba:236:room:23609
    south:
      to: tba:236:room:23602
    west:
      to: tba:236:room:23605

"tba:236:room:23609":
  name: On a narrow platform
  description: >
    You are standing on a narrow platform outside a wooden door.  The platform has been hewn out of the
    rock in the northeastern corner of the cave.  There is only one way onto the platform, and that is
    from the center of the trade halls. You feel very exposed as you walk the last couple of feet towards
    the door. The door itself is about ten feet wide and fifteen feet tall, making it a huge portal to
    the dwarves.  However it is still quite easy to defend, and you realize they might not want you inside.
  sector: inside
  flags: [indoors, tunnel]
  exits:
    east:
      to: tba:236:room:23610
      look: The entrance to the dwarven city.
      door:
        keywords: [gate, wooden]
        kind: door
        reset: closed
    west:
      to: tba:236:room:23607

"tba:236:room:23610":
  name: Entrance to Aldin, City of the Dwarves
  description: >
    You are standing in a domed cave, which obviously serves as a portcullis. To your west, a rather
    large gate opens to the trade halls, and to your east a smaller stone door blocks your entry into the
    heart of Aldin.  This cave obviously has been set up, so the guards have a place to check people
    before they leave the trade halls and enter the city itself.  You realize with sudden brutality the guards
    are stopping anyone who isn't dwarven...
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23611
      look: This small runed door is made of stone, and it seems to have been there forever.
      door:
        keywords: [door, stone]
        kind: door
        key: tba:236:obj:23642
        reset: locked
    west:
      to: tba:236:room:23609
      look: The trade halls are here.
      door:
        keywords: [gate, wooden]
        kind: door
        reset: closed

"tba:236:room:23611":
  name: Passing by the workshops
  description: >
    You are stand,ing just inside the entrance to the dwarven city, and you are almost deafened by the
    sounds from the nearby workshops. It seems all of the things traded in the trade halls come from
    these workshops. To your south the weaponsmith is working and east of here the armor smith is preparing
    more armors for sale. You can leave the city by going west from here, or go deeper into it by heading
    north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23613
    east:
      to: tba:236:room:23615
    south:
      to: tba:236:room:23612
    west:
      to: tba:236:room:23610
      look: This small stone door leads out of the city.
      door:
        keywords: [door, stone]
        kind: door
        key: tba:236:obj:23642
        reset: locked
  triggers: [tba:236:trg:23616]

"tba:236:room:23612":
  name: At Torgs' smithy
  description: >
    The dwarves are very proud of their fine weaponry.  Rods of several different metals have been laid
    on shelves along the south wall, ready to go into the forge.  The forege itself has been set in the
    east wall, accesible from both here and the armorers smithy just north and east of here.  The walls
    are blackened wth soot from many years of smoke from the large forge.  A strange contraption makes
    sure the bellows keep the heat at its peak.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23611
  extras:
  - keywords: [forge, contraption, strange]
    text: >
      A forge with large leather bellows has been set in the full length of the eastern wall.  A small
      stream in the corner makes a small milling wheel turn, which in turn makes the bellows blow.  It is
      obvious to you that the reason for putting the forge here is that small stream.  It runs from a hole in
      the cave wall about three feet up, into a hole in the corner.  A small basin suggests the stream is
      used to temper the steel in, too.
  - keywords: [rods, metal]
    text: >
      Long rods of differently alloyed metal hang here.  On the floor next to them, bars of lead have
      been lain down.  Also a barrel sits here, full to the edge with leather strips for handles.

"tba:236:room:23613":
  name: Before the city
  description: >
    Just north of here, you can hear the rustle of a large town here beneath the mountain. The walls
    around you are made with some of the finest masonry you have ever witnessed. To your south you can hear
    the clanging of iron against iron from the forges, and from your east comes the crisp sound of
    chisel against rock. It sounds if someone is making gravestones. To the north a small portal shields the
    living areas from the noise of the workshops.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23617
      look: >
        A small arched doorway, not much more than four feet across, and about 6 feet tall leads into the
        dwarven city.
    east:
      to: tba:236:room:23616
    south:
      to: tba:236:room:23611
  extras:
  - keywords: [portal]
    text: >
      A small, arched doorway, not much more than four feet across and about 6 feet tall, leads into the
      dwarven city.

"tba:236:room:23614":
  name: The dwarven city
  description: >
    You are standing in an underground hallway, deep inside the mountain.  The walls are a show of fine
    masonry, and the gray marble rocks have been worked so perfectly, that you wouldn't be able to put
    even the tip of your knife between two stones.  Every three feet a torch lights up the corridor and
    the light helps you to not think of the terrible weight of the mountain above you.  The hallway turns a
    perfect right angle turn to the north and east here.  Perfect walls block your progress to the west
    and south.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:236:room:23621
      look: The hallway continues.
    east:
      to: tba:236:room:23618
      look: The hallway continues.

"tba:236:room:23615":
  name: At Ralfs' smithy
  description: >
    Upon entering the smithy you immidiately discover the reason for all the noise in the area.  All
    the armors made here are full-body armors.  When struck by Ralf, they make about as much noise, as a
    churchbell.  The forge is set in the south wall, and on the northern and eastern wall, several
    half-finished armors have been lain on shelves.  In a crate near the eastern wall, different straps and
    thongs of leather are stored - nothing of use until they've been applied to an armor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:236:room:23611
  extras:
  - keywords: [crate]
    text: >
      A wooden crate about one by two feet.  It contains strips of leather used for the armors made here.
  - keywords: [forge]
    text: >
      The forge has been set in sotnes and is extremely hot.  On the other side of the fire, you notice
      the weaponsmiths' smithy.

"tba:236:room:23616":
  name: At the stonewrights.
  description: >
    Large rocks, the size of headstones sit on the ground in nice rows.  A sudden realisation grabs
    you, as you see them for what they really are. Tombstones.  And many of them too.  But there's also a
    shelf with some much finer art.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:236:room:23613
  extras:
  - keywords: [tombstones, stones, headstones]
    text:
      preformatted: |2
           They all look about the same:
        _____________       ___           _______
        |           |       | |           |  _  |
        |           |    ___| |___        | |_| |
        |  R. I. P. |   |___RIP___|   ____| RIP |____
        |           |       | |      |______   ______|
        |           |       | |            |   |
        |           |       | |            |   |
        |           |       | |            |   |
        |___________|       |_|            |___|
  - keywords: [shelf]
    text: >
      A wide shelf has been made from the stone wall.  And you notice it has been made by removing the
      surrounding rock piece by piece.  A labour with no end, it seems.  On it a couple of small gemstones
      have been laid, along with a handwritten sign: HANDS OFF!

"tba:236:room:23617":
  name: The dwarven city
  description: >
    You are standing in an underground hallway, deep inside the mountain.  The walls are a show of fine
    masonry, and the gray marble rocks have been worked so perfectly that you wouldn't be able to put
    even the tip of your knife between two stones.  Every three feet a torch lights up the corridor, and
    the light helps you to not think of the terrible weight of the mountain above you.  To your south a
    portal opens to the sound of hammers on metal, and a faint draft of air lets you know this is a way
    out.  The hallway continues west and east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:236:room:23619
      look: The hallway continues.
    south:
      to: tba:236:room:23613
      look: >
        A small arched doorway, not much more than four feet across, and about 6 feet tall leads out of the
        dwarven city, towards the trade halls.
    west:
      to: tba:236:room:23618
      look: The hallway continues.
  extras:
  - keywords: [portal]
    text: >
      A small arched doorway, not much more than four feet across, and about 6 feet tall leads out of the
      dwarven city, towards the trade halls.

