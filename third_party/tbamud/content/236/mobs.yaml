  short: the armorsmiths' assistant
  long: The assistant to the Armorsmith is here, showing you his wares.
  description: >
    Having realized how many people with bad intentions come to buy their armor, the dwarves have
    decided to only send the assistants to the tradehalls, leaving the masters i the safety of their
    workshops.  Thus a young dwarf, no more than seventy or eighty years old, tends the stall for the armorsmith. 
    But don't let his age fool you.  He knows how to wield the hammer to make the armor last. Having
    discovered the possibilities in trade, the dwarves have decided to make the armor in your size too.
  level: 10
  sex: male
  alignment: 650
  flags: [sentinel, no_summon]
