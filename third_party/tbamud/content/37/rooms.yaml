# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 37.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:37:room:3700":
  name: Zone Description Room for Capital Sewer System
  description:
    preformatted: |2
         Capital Sewer System by Welcor
      Player Level : 1-10
      Rooms        : 46
      Objects      : 11
      Mobs         : 14
      Triggers     : 1 (prevents mobs from filling a room they cannot get out of)
      Theme        : The zone is currently the top level of the sewer system
                     It's populated by rats, bats and some blind fish.
      Began        : Quite some time ago.
      Finished     : The top level is finished. See below.
      Notes        : The zone will eventually consist of three levels. The top level,
                     which is finished, a catacomb level and another level of old
                     sewers - populated by undeads and swamp things.
      
      Zone 37 is linked to the following zones:
      38 Capital Sewer System           at  3717 (down ) --->  3801
      
      Links: 02u, 17d, 28w
  sector: inside
  flags: [dark, private]

"tba:37:room:3701":
  name: Entering the sewers
  description: >
    As you descend into this stinking, mud-filled swamp, at the very bottom of the city, you can't help
    noticing how much waste, so many people create.  And it's all here under your feet - and in your
    boots!  You see water filled with all kinds of bad things coming from east and west, drifting north from
    here.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3716
      look: A pipe leads north. It's filled with muck.
    east:
      to: tba:37:room:3703
      look: A pipe is here.
    south:
      to: tba:37:room:3702
      look: Under the manhole.
    west:
      to: tba:37:room:3718
      look: A tunnel intersection.

"tba:37:room:3702":
  name: Under the Drainpipe
  description: >
    You are standing at the end of a huge drainpipe, which leads upward in a gentle slope, a gentle
    stream of sewage slowly runs north, deeper into what must be the sewers of what ever city is at the end
    of that pipe.  Few options present themselves to you in this mess, knee deep in sewage you have but
    two choices, either venture north and deeper in to the sewers, and meet what ever creatures might
    dwell in this filthy place, or attempt to go up through that pipe, with a chance of getting out of this
    dark and gloomy place.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3701
      look: You see the entrance to the sewers.

"tba:37:room:3703":
  name: Pipe turning north and west
  description: >
    You are in a pipe, leading north and west.  The pipe is big enough for you to stand upright, and
    just dry enough at this point to be able to walk without getting your feet wet.  Still, sewage is
    trickling through the pipe and you come to the conclusion, that you're happy you chose to come here in the
    dry season.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3704
      look: The pipe continues north, as far as your light extends.
    west:
      to: tba:37:room:3701
      look: You can see the sewer entrance.

"tba:37:room:3704":
  name: A pipe deep underground.
  description: >
    You are walking through a larger than man-sized pipe, in the capitals sewers. From the north you
    hear some scratching and the sound of small animals.  You've seen rat tracks earlier, and they were a
    bit too large for your taste.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3705
      look: The pipe continues.
    south:
      to: tba:37:room:3703
      look: A turn in the pipe.

"tba:37:room:3705":
  name: A pipe deep underground
  description: >
    The sounds of rats can no longer be ignored.  The big pipe has recent markings of claws and fangs. 
    It is clear, that whatever lives here is too big to be ordinary rats.  North of here you can barely
    make out a crossing, and south the pipe continues.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3707
      look: A three-way crossing.
    south:
      to: tba:37:room:3704
      look: The pipe extends further than your light.

"tba:37:room:3707":
  name: A three-way intersection
  description: >
    You are standing in what was once a north/east turn in the pipe.  To the west, however, there is a
    large hole in the pipe which makes it possible to go that way too.  As you examine the hole, you
    notice that it's not man-made. Some quite large, toothmarks along the perimeter suggest it was done by
    some of the rodents inhabiting the sewers.  The sound of rats moving about is strong from both the east
    and the west.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3708
      look: The tunnel continues and turns north.
    south:
      to: tba:37:room:3705
      look: The pipe heads south from here.
    west:
      to: tba:37:room:3714
      look: A hole has been dug through the wall here. Behind it you see dirt walls.
  extras:
  - keywords: [bite, marks, bitemarks]
    text: The bitemarks are deep, and approximately 8" wide.
  - keywords: [hole]
    text: >
      The hole is about 3 feet high, and must've been dug out by big rats.  It's full of marks of teeth.

"tba:37:room:3708":
  name: A bend in the tunnel
  description: >
    The pipe turns north and west.  To the north there is a grating which blocks the pipe.  It seems
    noone has been down here for ages to clean the grate, so it is stuck in it's current position.  It's
    hopeless getting past it.  Behind it you hear the sound of animals.  Again you think of rats, but they
    sound so BIG!.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3709
      look: The grate obviously has rusted in the hinges, and is covered in muck.
      door:
        keywords: [grate]
        kind: pickproof
        reset: locked
    west:
      to: tba:37:room:3707
      look: The three-way junction is here.

"tba:37:room:3709":
  name: North of a grate
  description: >
    You are on the north side of a very mucky grate, and around you are every evidence of absence of
    people you'll ever need - knee-high muck, green slime dropping from the walls, a profound smell of
    rats, fungus growing on the ceiling.  You feel very dirty just being here.  Also you can't help hearing
    lots of noises from the north-west.  Sounds like something's having a feast.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3710
      look: A bend in the pipe is here.
    south:
      to: tba:37:room:3708
      look: A very mucky and rusty grate is here, stuck in position.
      door:
        keywords: [grate]
        kind: pickproof
        reset: locked

"tba:37:room:3710":
  name: Near the northern drainhole
  description: >
    The pipe bends here, going south and west.  West you see a drainhole and around your ankles you
    feel the water flowing towards it.  The fungus on the walls are luminous, so you have every chance to
    study the dirty ceiling, the green slime, and the big rats.  From the west you hear the sounds of big
    creatures eating - or is it many small?
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:37:room:3709
      look: The pipe continues south.
    west:
      to: tba:37:room:3711
      look: A drainhole is here.

"tba:37:room:3711":
  name: The northern drainhole
  description: >
    You are in a domed room with a drainhole in the middle.  Originally this room was intended as the
    end of the pipe from the east, but it seems that the rats disagree.  They have made a nest south of
    here, and a tunnel to the west.  The room is very dirty and you deduct that no civil servant would ever
    go all the way inhere, even if it was originally so intended.  The ceiling is overgrown with
    luminous fungus, making the room bright as day.  You can hear the sounds of creatures eating, bones being
    crushed.  The source seems to be south of here.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3710
      look: The pipe extends east.
    south:
      to: tba:37:room:3715
      look: You see the rats' lair. It's a bit unclear from here.
    west:
      to: tba:37:room:3712
      look: A hole has been grinded by many teeth, leading to a dirt tunnel.
  extras:
  - keywords: [drain, hole, drainhole]
    text: >
      A hole with a grate on it, the drainhole is there to lead the polluted water of the Capital
      straight to the river.  Downstream, of course.

"tba:37:room:3712":
  name: A dirt tunnel
  description: >
    This low tunnel has been dug by many claws, making the walls if not smooth, then at least soft to
    the touch, and you do not feel very safe here.  You are worried if the tunnel can take a full grown
    person, crawling as you are.  East of here you see a domed chamber, nothing like the dirt you're
    crawling in, but south you just see more and more of it.  You are also aware of a loud sound from your east
    - almost like chewing.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3711
      look: The northern drainhole.
    south:
      to: tba:37:room:3713
      look: The dirt tunnel continues.

"tba:37:room:3713":
  name: In a dirt tunnel
  description: >
    As far as you can see live couldn't get much worse - You're crawling through dirt on your hands and
    knees with no obvious relief within eyesight.  Around you the markings of claws suggest large
    amounts of rats of dog-like proportions in your immediate vicinity.  And to top that off, you are hearing
    strange sounds from the north.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3712
      look: The dirt tunnel continues.
    south:
      to: tba:37:room:3714
      look: The dirt tunnel continues.

"tba:37:room:3714":
  name: A dirt tunnel
  description: >
    This tunnel is not very big.  You can only fit in, if you crawl on your hands and knees, making it
    hard for you to get an overview of the situation. However, you have no doubt that the tunnel leads
    somewhere, as it's obviously being used often, judging from the marks on the walls.  You can crawl on
    north, or make your way to the intersection to the east.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3713
      look: The dirt tunnel continues.
    east:
      to: tba:37:room:3707
      look: A three-way intersection.

"tba:37:room:3715":
  name: The Lair of the King Rat.
  description: >
    You are in a cave, dug in the wall.  In the far corner a lot of debris is huddled up, in the
    makings of a nest, while closer to the exit, a mound of old bones make out a trash pile.  Or at least
    that's your guess - hard to tell exactly, actually.  The room is the lair of a gigantic rat, bigger than
    the rest of them, which seems to have at least some intelligence.  Glittering objects, reflecting the
    dim light from the luminous fungus, litter the nest.  It seems the Rat King has gathered what others
    has dropped.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3711
      look: The northern drainhole.
  extras:
  - keywords: [gems, glitter]
    text: Not all that glitters is gold - or gems!

"tba:37:room:3716":
  name: The Northern Pipe
  description: >
    Standing in a large pipe, you feel the muck around your ankles drifting northward.  You are able to
    stand tall in this room, and as far as you can tell, there is a large drainhole to your north.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3717
      look: You see a domed chamber with a drainhole.
    south:
      to: tba:37:room:3701
      look: You see the entrance to the sewers.

"tba:37:room:3717":
  name: At the edge of a pit
  description: >
    You find yourself in a large domed chamber, at the edge of a 2' wide hole in the floor of the
    room.  Muck is dripping over the edge, and the smell is horrible.  As you go closer to the edge and take a
    peek, you realize there is a drop of about 20', before the bottom is reached.  Not caring to try if
    you can climb down, you also notice a ladder carved into the wall of the hole.  As you examine the
    hole closer you see a grate further down.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    south:
      to: tba:37:room:3716
      look: A large pipe leads southwards.
    down:
      to: tba:38:room:3801

"tba:37:room:3718":
  name: The western junction.
  description: >
    Entering the chamber, you see tunnels leading west, north and east of here. This chamber in itself
    is but a mere junction of pipes.  Stinking water comes drifting from the west and north, flowing out
    to your east.  The smell inhere is torture to your nose, but luckily you are starting to get used to
    it.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3719
    east:
      to: tba:37:room:3701
    west:
      to: tba:37:room:3729

"tba:37:room:3719":
  name: North/south Pipe
  description: >
    A large tube is what this is.  Leading from a junction to the south and straight north, a lot of
    small pipes - too small to be entered - join in from the sides, randomly spilling sewage in your path. 
    The pipe leads north as far as your light lets you see.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3720
    south:
      to: tba:37:room:3718
  extras:
  - keywords: [sewage, pipe, pipes]
    text: >
      From these pipes sewage spills into the tube, starting its journey through the larger pipes here.

"tba:37:room:3720":
  name: North/south Pipe
  description: >
    A large tube is what this is.  Leading south and north, a lot of small pipes - too small to be
    entered - join in from the sides, randomly spilling sewage in your path.  It seems this pipe has been
    blocked by a very strong grate with small holes in it.  Through the small holes you see a lot of bats. 
    It seems the grating was put here for a reason.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3721
      door:
        keywords: [grate]
        kind: door
        reset: closed
    south:
      to: tba:37:room:3719

"tba:37:room:3721":
  name: North of the grate.
  description: >
    You immediately notice the change in smell.  Guano.  The bats have seized this part of the sewers
    for themselves.  Obviously the grate to your south is there to stop the bats from infecting the whole
    sewer system.  You can see the pipe through it.  You can also enter the bats' territory by going west
    or north.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3722
    south:
      to: tba:37:room:3720
      door:
        keywords: [grate]
        kind: door
        reset: closed
    west:
      to: tba:37:room:3724

"tba:37:room:3722":
  name: A domed cave
  description: >
    You're in a large domed room.  You realized this was once where the builders of the sewers lived
    and had their things stored.  This makes it easier to understand the fresh air you're smelling from the
    north.  It also helps explain the millions of bats you see on the ceiling, ignoring you totally. 
    You can continue north through a jagged opening, and south to the pipes.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3723
    south:
      to: tba:37:room:3721
  extras:
  - keywords: [bats, bat, ceiling]
    text: >
      What you first thought to be the face of the rock, you suddenly realize, is actually bats sitting
      side by side all across the ceiling.

"tba:37:room:3723":
  name: Near the outside
  description: >
    From here you can see the outside through a hole high up on the northern wall.  There is an old
    wooden ladder set under it so it can be traversed by foot.  Through the hole bats are swarming in and
    out.  As far as you can tell going up would take you out of the capital.  You can also go south to a
    large chamber.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:37:room:3722
    up:
      to: tba:37:room:3743

"tba:37:room:3724":
  name: A side tunnel
  description: >
    This tunnel is filled with bats.  Some fly and seem to know their way around, while others merely
    cling to the ceiling as you pass.  You come to think of the stories you have heard of bats sucking the
    blood of their victims, and a shiver runs down your spine.  You can leave this side tunnel to your
    east, and it continues north.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3725
    east:
      to: tba:37:room:3721

"tba:37:room:3725":
  name: A side tunnel
  description: >
    The side tunnel continues.  Still, bats are everywhere.  You almost have to duck not to scrape your
    head against the bats clinging to the ceiling, and no matter where you look there seem to be more
    bats.  These bats however does not try to harm you - at the moment.  The tunnel continues north and
    south of here.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3726
    south:
      to: tba:37:room:3724

"tba:37:room:3726":
  name: Turn in a side tunnel
  description: >
    You see still more of the bats, crawling and climbing on each other to get a place on the ceiling. 
    Some seem a little hostile to your presence.  The tunnel turns here, going west and south.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    south:
      to: tba:37:room:3725
    west:
      to: tba:37:room:3727

"tba:37:room:3727":
  name: The west tunnel
  description: >
    The tunnel seems to go on forever.  From small holes in the walls ooze is dripping onto the floor,
    and bats are everywhere, almost driving you crazy. The tunnel stretches west to east.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3726
    west:
      to: tba:37:room:3728

"tba:37:room:3728":
  name: The west tunnel
  description: >
    The tunnel seems to go on forever.  From small holes in the walls ooze is dripping onto the floor,
    and bats are everywhere, almost driving you crazy. The tunnel stretches west to east.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3727

"tba:37:room:3729":
  name: A turn in the western pipe
  description: >
    The water is knee-deep here, floating in from the north.  The smell of sewage is almost unbearable
    to your nostrils, and the water is so dirty, you wouldn't be surprised to be able to walk on it. 
    Unfortunately it doesn't keep you up, just leaks into your boots.  High on the western wall you notice a
    small hole, seemingly shut with a couple of nailed-in boards.  However it is too high for you to
    reach.  The pipe continues north and a junction is to the east.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3730
    east:
      to: tba:37:room:3718
  extras:
  - keywords: [hole, boards]
    text: A hole, just about 3' in diameter, nailed shut with wooden planks.

"tba:37:room:3730":
  name: A boring pipe
  description: >
    The water is knee-deep here, floating in from the north.  The smell of sewage is almost unbearable
    to your nostrils, and the water is so dirty, you wouldn't be surprised to be able to walk on it. 
    Unfortunately it doesn't keep you up, just leaks into your boots.  Nothing much of interest here.  The
    pipe continues north and south.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3731
    south:
      to: tba:37:room:3729

"tba:37:room:3731":
  name: A turn in a boring pipe
  description: >
    The water is knee-deep here, floating in from the west.  The smell of sewage is almost unbearable
    to your nostrils, and the water is so dirty, you wouldn't be surprised to be able to walk on it. 
    Unfortunately it doesn't keep you up, just leaks into your boots.  Small pipes coming out of the walls
    leak ooze into the sewage around you.  To your west the water seem cleaner.  South the boring pipe
    continues.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    south:
      to: tba:37:room:3730
    west:
      to: tba:37:room:3732

"tba:37:room:3732":
  name: A boring pipe
  description: >
    The water is knee-deep here, floating in from the north.  The smell of sewage is almost unbearable
    to your nostrils, however the water is a little less polluted than it is east of here.  Unfortunately
    it still doesn't keep you up, just leaks into your boots.  Small pipes coming out of the walls leak
    ooze into the sewage around you.  Both to your west and east you see turns in the pipe.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3731
    west:
      to: tba:37:room:3733

"tba:37:room:3733":
  name: A turn in a boring pipe
  description: >
    The water is knee-deep here, floating in from the south.  The smell of sewage is not as strong
    here, and the water seems a little clearer than east of here. It IS still polluted though.  Small pipes
    coming out of the walls leak ooze into the sewage around you.  To your south the water seems even
    clearer yet.  East the boring pipe continues.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3732
    south:
      to: tba:37:room:3734

"tba:37:room:3734":
  name: A boring pipe
  description: >
    The water is knee-deep here, floating in from the south.  The smell of sewage is not very strong
    here, and the water seems a little clearer than north of here.  It IS still a little polluted though. 
    A few small pipes coming out of the walls leak ooze into the water around you.  To the south the
    water seems even clearer.  North is a turn in the pipe.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3733
    south:
      to: tba:37:room:3735

"tba:37:room:3735":
  name: A strange halt
  description: >
    The tunnel comes abruptly to an end.  The room you're standing in has not been formed by humanoid
    hands.  It is a work of nature, carved by running water. Obviously the persons digging the sewers
    suddenly opened up to this chamber and found no way of closing again.  On the eastern wall clear water is
    running from a natural cavern of some sort, through a hole too small to fit in, and most of the
    water then continues to the east of here through a larger hole.  To your south however, a metal door,
    with a heavy padlock blocks your passage.  Through some bars in the door you see still water, and a
    moored boat.  Some of the water also runs through the pipe to your north, creating a natural flow.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3734
    east:
      to: tba:37:room:3736
    south:
      to: tba:37:room:3737
      look: A heavy steel door, padlocked to keep you out.
      door:
        keywords: [door, padlock]
        kind: door
        key: tba:37:obj:3710
        reset: locked

"tba:37:room:3736":
  name: By the hole
  description: >
    You enter a small room, with a ledge along the walls.  Near the middle of the room a large hole has
    been eroded by the running water.  You realize that however long you would hold your breath, that
    hole would most definitely kill you by sheer pressure from the water.  Also you notice several chests
    obviously hidden by someone who thought this a safe place.  You can't fight the water without risking
    to fall into the hole, so you can only get out through a little hole high up on the eastern wall.
  sector: inside
  flags: [dark, indoors, bfs_mark]
  exits:
    east:
      to: tba:37:room:3729
      door:
        keywords: [hole, planks]
        kind: door
        reset: closed

"tba:37:room:3737":
  name: By an underground fishing pond
  description: >
    You're standing by a still underground pool.  This is almost an underground lake.  There are
    moorings for a boats here, and you see fish swimming in the water.  They're attracted to your light.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:37:room:3735
      door:
        keywords: [steel, door, padlock]
        kind: door
