"tba:37:room:3743":
  name: Through the hole
  description: >
    Standing on the edge of the hole, you see things on the outside.  Looking down you see a jagged
    opening, which you might enter by an old wooden ladder. Swarms of bats fly around you, almost making you
    panic.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:37:room:3744
      look: Well, you see the outside, of course..
    down:
      to: tba:37:room:3723

"tba:37:room:3744":
  name: Outside the cave
  description: >
    You are standing outside a gloomy cave, from which an occasional bat flies out around you.  You may
    enter the cave by going south, but can head back toward the city by going west from here.
  sector: mountains
  flags: [bfs_mark]
  exits:
    south:
      to: tba:37:room:3743
      look: The cave opening looks inviting - kind of like a mouth, waiting to feed..
    west:
      to: tba:37:room:3745
      look: A gravelled path leads towards the city..

"tba:37:room:3745":
  name: Outside the capital
  description: >
    Who would have thought the world could be so barren just outside the capital itself.  You're
    standing in some low foothils near some rocky ground to your east.  South of here a gravelled path leads
    towards the western highway.
  sector: field
  flags: [bfs_mark]
  exits:
    east:
      to: tba:37:room:3744
      look: The gravelled path ends and the ground becomes rocky.
    south:
      to: tba:37:room:3746
      look: The gravelled path continues southward.

"tba:37:room:3746":
  name: On a gravelled path
  description: >
    You are walking along a gravelled path.  North of here the gravel path continues, while to the
    south you enter the bustle of the western highway.
  sector: field
  exits:
    north:
      to: tba:37:room:3745
      look: The gravelled path continues...
    south:
