# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 317.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:317:room:31700":
  name: North Street
  description: >
    The gradual slope that was just west of here has turned into a steep hill which climbs it's way up
    into the Wharf.  Seems the great people who make their homes in the Wharf like to be able to look
    down upon those less fortunate and watch them scurry about their daily lives.  The road heads east,
    uphill into the Wharf, or west into the main business district of the Cove.
  sector: inside
  exits:
    east:
      to: tba:317:room:31701
    west:
      to: tba:315:room:31515
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Kaan
           Zone 317 is linked to the following zones:
        315 McGintey Business District     at 31700 (west ) ---> 31515
        315 McGintey Business District     at 31732 (west ) ---> 31570

"tba:317:room:31701":
  name: North Street
  description: >
    The road continues east, still heading in a steep uphill direction.  To the west you can see most
    of the main business section of town, which is actually quite a ways beneath you.
  sector: inside
  exits:
    east:
      to: tba:317:room:31702
    west:
      to: tba:317:room:31700

"tba:317:room:31702":
  name: North Street
  description: >
    You are at the crest of North Street's hill leading into the Wharf, the upscale section of town. 
    The road heads east into more of the Wharf or west, downhill, into the main business section of town. 
    North of you is a small cobbled path, very well kept and brightly lit.  South is a glamorous looking
    hotel which looks to cater to wealthier people in town.
  sector: inside
  exits:
    north:
      to: tba:317:room:31704
    east:
      to: tba:317:room:31711
    south:
      to: tba:317:room:31703
    west:
      to: tba:317:room:31701

"tba:317:room:31703":
  name: Wharfside Inn
  description: >
    This huge, gaudily decorated hotel caters to the needs of the most influential businessmen and
    notables in McGintey Cove.  To the north is the exit out onto North Street, east is the bar, and south is
    a private dining/meeting room
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:317:room:31702
    east:
      to: tba:317:room:31734
    south:
      to: tba:317:room:31733
    up:
      to: tba:317:room:31737

"tba:317:room:31704":
  name: Gambler's Alley
  description: >
    Although not truly an alley, this well kept cobblestone path leads the way into the gambling
    section of the Wharf.  To the east and west are casinos which specialize in specific games, and to the
    north the path continues into a small court with casinos on all sides as well.  The way south heads back
    onto North Street.
  sector: inside
  exits:
    north:
      to: tba:317:room:31705
    east:
      to: tba:317:room:31707
    south:
      to: tba:317:room:31702
    west:
      to: tba:317:room:31710

"tba:317:room:31705":
  name: Gambler's Alley
  description: >
    This marks the end of Gambler's Alley, but not the end of the fun.  To the north, east and west are
    casinos, each of which specialize in a particular gambler's game.  South the path leads past more
    casinos and out onto North Street.
  sector: inside
  exits:
    north:
      to: tba:317:room:31708
    east:
      to: tba:317:room:31706
    south:
      to: tba:317:room:31704
    west:
      to: tba:317:room:31709

"tba:317:room:31706":
  name: The Art of War
  description: >
    This huge sprawling hall has dedicated it's entire space to the game of War. Although most of the
    tables are filled, there are a few empty chairs here and there.  There is a sign on the wall
    explaining the rules of the game.
  sector: inside
  flags: [peaceful]
  exits:
    west:
      to: tba:317:room:31705

"tba:317:room:31707":
  name: Slots
  description: >
    Lined against every wall of this building and in neat rows in the center are slot machines, slot
    machines, and more slot machines.  The noise of this place is almost deafening, the people's cursing
    quite the same.  The exit lies west or you may try you luck with any one of these one armed bandits!
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:317:room:31704

"tba:317:room:31708":
  name: Blackjack
  description: >
    Dealers sit at tables spaced evenly throughout this plush room, all wearing the same expressionless
    face as they deal the cards to the players.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:317:room:31705

"tba:317:room:31709":
  name: Poker
  description: >
    The men and women who sit at the tables spaced throughout this room try their best to keep their
    faces blank, however every now and again a small smirk escapes or an eyebrow gets raised.  The exit
    from this room is to the east
  sector: inside
  exits:
    east:
      to: tba:317:room:31705

"tba:317:room:31710":
  name: Roulette
  description: >
    This building, by far the smallest of all the casinos in Gambler's Alley, houses one giant wheel
    and an attendant who seems to speak nonstop, trying to get all who walk into the room to place a wager
    on the next spin.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:317:room:31704

"tba:317:room:31711":
  name: North Street
  description: >
    North Street heads east toward a huge building, apparently a home of some sort.  Just before the
    home, it looks as if the road makes some sort of turn or merges into another street which heads south. 
    Just south of your current locale is a short brick wall which encloses a large park that from the
    looks of it, is maintained quite regularly.  The road also heads west past a small cobbled street and
    heads out of sight downhill toward McGintey's main business district.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:317:room:31712
    west:
      to: tba:317:room:31702

"tba:317:room:31712":
  name: North Street
  description: >
    North Street ends here before a huge mansion of some sort which lies just east from here.  Wharf
    Street runs south from here thru a great number of hotels and high class restaurants.  You may head
    west along North Street as well.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:317:room:31713
    south:
      to: tba:317:room:31714
    west:
      to: tba:317:room:31711

"tba:317:room:31713":
  name: The Mayor's House
  description: >
    This lush mansion holds all manner of eccentricies, from plush luxuriant divines to wide carpets
    and rugs from overseas.  A wide hallway leads into what appears to be a ballroom and a double wide set
    of stairs lead to the upper wing of the mansion.  You may exit to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:317:room:31735
    west:
      to: tba:317:room:31712
    up:
      to: tba:317:room:31736

"tba:317:room:31714":
  name: Wharf Street
  description: >
    This street, completely done in white marble stone, heads north and south from here.  To the west
    is the entrance to a large park, completely enclosed in by a low brick wall.  North of here is another
    street, one which heads to the west.
  sector: inside
  exits:
    north:
      to: tba:317:room:31712
    south:
      to: tba:317:room:31717
    west:
      to: tba:317:room:31715

"tba:317:room:31715":
  name: McGintey Park
  description: >
    This park, kept up by the city commission, boasts a wide open expanse of beautifully trimmed green
    grass complete with a fountain and playground equipment for the kids.  It looks as if many a family
    has come here for Sunday picnics from the way the people here simply saunter through the park without
    fear of phsycial harm or theft.  To the south is more of this beautiful park, east is Wharf Street.
  sector: inside
  exits:
    east:
      to: tba:317:room:31714
    south:
      to: tba:317:room:31716

"tba:317:room:31716":
  name: McGintey Park
  description: >
    This beautiful, well tended patch of earth hosts McGintey Cove's most comforting, spacious and
    luxurious pieces of land in the whole city.  Children run around your feet as you saunter through the
    park, enjoying the fresh air and the tangy smell of the sea as the breeze wafts it your way every now
    and then. The park continues north form here and Wharf Street lies just east.
  sector: inside
  exits:
    north:
      to: tba:317:room:31715
    east:
      to: tba:317:room:31717

"tba:317:room:31717":
  name: Wharf Street
  description: >
    Wharf Street continues north and south from here, white marble stone chips the entire distance.  A
    very large, very beautiful park lies just west of here looking extremely inviting.  To the east is a
    glitzy looking restaurant called the Blind Pig.
  sector: inside
  exits:
    north:
      to: tba:317:room:31714
    east:
      to: tba:317:room:31718
    south:
      to: tba:317:room:31719
    west:
      to: tba:317:room:31716

"tba:317:room:31718":
  name: The Blind Pig
  description: >
    Upon entering this establishment (it could only be called an establishment from the way it looks)
    you immediately feel as if you may be a bit underdressed. All the clientele at this establishment seem
    to be dressed in their Sunday finest, the waiters and waitresses all decked out in tuxedos and
    beautiful serving gowns.  The matre de gives a bit of a sniff at your appearance, but quickly regains his
    composier as he asked if he can show you to a table.
  sector: inside
  exits:
    west:
      to: tba:317:room:31717

"tba:317:room:31719":
  name: Wharf Street
  description: >
    The glamour never ends as you strut your way through this upper class section of town.  A huge
    churich, looking as if it must have thousands of rch parishoners who attend weekly stands to your east. 
    To the west is a large hotel, the Royale.  The street runs north and south from here.
  sector: inside
  exits:
    north:
      to: tba:317:room:31717
    south:
      to: tba:317:room:31723
    west:
      to: tba:317:room:31721

"tba:317:room:31721":
  name: The Royale
  description: >
    The glittering copper and gold that adorns most everything in this hotel gives testament to the
    fact that it has been aptly named.  It seems that only the creme de la creme of McGintey Cove would be
    able to afford to stay in this palacial place.  A small door leads south into a beautiful garden.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:317:room:31719
    south:
      to: tba:317:room:31722

"tba:317:room:31722":
  name: The Wharf Garden
  description: >
    The flowers and trees all around give such an overwhelming aroma, such a delightful mixture of
    fragrances it's easy to forget that you are standing in the middle of a huge city.
  sector: inside
  flags: [peaceful]
  exits:
    north:
      to: tba:317:room:31721
    east:
      to: tba:317:room:31723

"tba:317:room:31723":
  name: Wharf Street
  description: >
    The street runs north to south past a small garden on the west side.  To the northeast is a large
    church or temple which sits against the wall of the city. Northwest is large hotel and southeast is a
    restaurant of some sort.
  sector: inside
  exits:
    north:
      to: tba:317:room:31719
    south:
      to: tba:317:room:31724
    west:
      to: tba:317:room:31722

"tba:317:room:31724":
  name: Wharf Street
  description: >
    This broad street runs north to south, all covered in beautiful white marble stone chips.  Just
    east of you is a restaurant - the Vista View - and to the south the road runs into South Street, which
    heads off to the west.
  sector: inside
  exits:
    north:
      to: tba:317:room:31723
    east:
      to: tba:317:room:31725
    south:
      to: tba:317:room:31726

"tba:317:room:31725":
  name: The Vista View
  description: >
    This opulent restaurant serves what is claimed by many to be the finest dining in all of McGintey
    Cove, possibly in all of Dibrova.  To enjoy any of the fine meals offered here, all one has to do is
    cough up the coin to pay for this exquisite fare.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:317:room:31724

"tba:317:room:31726":
  name: South Street
  description: >
    South Street ends here, however Wharf picks up where the other leaves off and heads north into the
    Wharf.  From here you can see many a fine establishment to the north, the rich promise of the 'good
    life'.  West the street runs past a well-kept cemetary and a hotel and begins it's downward slant
    toward the main business dictrict of the Cove.
  sector: inside
  exits:
    north:
      to: tba:317:room:31724
    west:
      to: tba:317:room:31727

"tba:317:room:31727":
  name: South Street
  description: >
    This shady lane heads east to west through this cheery, beautiful section of town.  Just east of
    you, South Street comes to an end and Wharf Street picks up heading north.  The road heads west past a
    cemetary and a hotel, then begins it's downhill descent toward the business district.
  sector: inside
  exits:
    east:
      to: tba:317:room:31726
    west:
      to: tba:317:room:31729

"tba:317:room:31728":
  name: The Oakland
  description: >
    This huge hotel, perched on the outskirts of the Wharf, caters to a higher class of citizen, but
    not the highest class.  Prices here are still higher than those of the inns and taverns you will find
    in the business district, but not so outrageous as to turn your stomach.  The exit lies to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:317:room:31729

"tba:317:room:31729":
  name: South Street
  description: >
    You stand at the crest of South Street Hill, the large steep hill that runs up into the Wharf, the
    high class section of McGintey Cove.  To your south is a very nice hotel, to the north is finely
    tended cemetary.  The road runs east into the Wharf or south, down into the business district.
  sector: inside
  exits:
    north:
      to: tba:317:room:31730
    east:
      to: tba:317:room:31727
    south:
      to: tba:317:room:31728
    west:
      to: tba:317:room:31732

"tba:317:room:31730":
  name: Cemetary Entrance
  description: >
    This small path leading into this cemetary is lined with pretty flowers, all landscaped just
    right.  Most cemetaries give a feeling of foreboding, of impending doom, but for some reason this cemetary
    inspires a serene, Almost peaceful feeling and you can' t help but feel drawn into it.
  sector: inside
  exits:
    north:
      to: tba:317:room:31731
    south:
      to: tba:317:room:31729

"tba:317:room:31731":
  name: Cemetary
  description: >
    All around you, birds chirp and chipmunks play.  This is definitely not a bad place, not in the
    traditional way a cemetary is thought to be anyway.  Many epitaphs are inscribed on tombstones which
    surround you, some interesting, some just simple statements of fact.  The exit from this place lies
    south across a cheery path.
  sector: inside
  exits:
    south:
      to: tba:317:room:31730

"tba:317:room:31732":
  name: South Street
  description: >
    The road heads east at an extremely steep incline toward the crest, which is just to the east.  At
    the top of the hill begins the Wharf, the upscale, high class section of McGintey Cove where only the
    richest folk can afford to live and abide.  To the south the street heads downhill into the main
    business district.
  sector: inside
  exits:
    east:
      to: tba:317:room:31729
    west:
      to: tba:315:room:31570

"tba:317:room:31733":
  name: Private Dining Room
  description: >
    Thsi room has hosted some of the most powerful men in all the land's meetings and private affairs. 
    The owner of the inn, always discreet, always willing to go the extra mile has created quite a
    reputation for himself and his establishment as being THE place to meet when in McGintey Cove.  The exit
    from this room is north, or you may relax at the large table here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:317:room:31703

"tba:317:room:31734":
  name: Wharfside Inn Bar
  description: >
    This quiet, dimly lit bar provides a formal yet comfortable atmosphere where the man and women who
    frequent the place go to escape from their daily hectic lives.  Soft music is played by a harpist in
    the back west corner of the room, a fireplace crackles quietly and Maree serves drinks with quiet and
    dignified effeciency.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    west:
      to: tba:317:room:31703

"tba:317:room:31735":
  name: Mayor's Ballroom
  description: >
    Your footsteps echo loudly on the polished wooden floor as you enter this room.  It seems no one is
    planning any types of parties in the near future - all the tables are folded neatly against the
    walls, the chairs the same way.  The bandstand stands empty, with no hint of any use forthcoming in the
    near future. The exit from this room lies west from here.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:317:room:31713

"tba:317:room:31736":
  name: Hallway
  description: >
    Every door leading from this hallway is shut and locked tight.  It seems that the mayor takes no
    chances with his personal affects, keeping them under lock and key at all times.  The only obvious exit
    from where you stand is back down the stairs.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:317:room:31713

"tba:317:room:31737":
  name: Reception at the Wharfside
  description: A scantily dressed woman is waiting to show you to your room.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:317:room:31703
