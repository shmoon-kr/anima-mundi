# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 262.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:262:room:26200":
  name: Forest Trails Zone Description Room By Kaan
  description: >
    *The Forest Trails *Modified by Kaan for Dibrova This is the same Forest that is available on the
    CircleMud site, a lump of same descrip rooms which work as an extremely effective connector zone off
    of any city.  I added some mobs and eq which are not part of the package you receive from the
    CircleMud download. Apologies to the original builder if I have offended at all by reposting this zone on my
    webpage, just thought that others might appreciate the mobs and eq as well. Links: 17s, 18se, 20e,
    45n, 56esw 26233 west to 3053 26239 east to silverthorne
  sector: inside
  flags: [private]

"tba:262:room:26201":
  name: Woods
  description: >
    As your eyes get used to the dimness, you can see a little way to either side, a sort of darkend
    green glimmer.  Ocassionally a slender beam of sun has the luck to slip in through some opening in the
    leaves far above, and still more luck in not being caught in the tangled boughs and matted twigs
    beneath.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:262:room:26202
      look: The woods continue to the east.
    south:
      to: tba:262:room:26205
      look: The woods continue to the south.

