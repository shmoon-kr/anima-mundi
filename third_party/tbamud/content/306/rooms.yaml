"tba:306:room:30604":
  name: Inside the Trunk
  description: >
    This inner trunk has been carved out and made into a cozy little home complete with a lounge chair
    and small bed made from twigs and leaves. Another small chamber is connected to the north through a
    short archway.
  sector: inside
  exits:
    north:
      to: tba:306:room:30605
    south:
      to: tba:306:room:30600
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:306:room:30605":
  name: Inside the Trunk
  description: >
    This is the inner abode of a treant, a being made from the very essence of the tree in which it
    resides.  Only the most foolish would attempt to defy a treant within its own home.
  sector: inside
  exits:
    south:
      to: tba:306:room:30604

