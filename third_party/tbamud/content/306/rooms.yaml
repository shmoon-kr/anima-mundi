"tba:306:room:30603":
  name: On the Trunk at the Upper Branch System
  description: >
    This is as far up as is safely possible within the Great Tree.  The trunk above this point is not
    strong enough to hold any substantial weight. Branches lead off in every direction, the upper branch
    system still just as strong as the branches below.
  sector: inside
