"tba:306:room:30662":
  name: The Outer Branches
  description: >
    The top of the Great Tree is a beautiful, stunning panorama of views and vistas which look out over
    the entire world in all its splendor.  A slow wind blows by, ruffling the leaves all around, causing
    the branches to sway ever so slightly.
  sector: inside
  exits:
    east:
      to: tba:306:room:30663

"tba:306:room:30663":
  name: The Outer Branches
  description: >
    The steady swaying of the Tree from the winds which buffet it at this altitude is strangely
    pacific, a very nonassuming sway which is absolutely no cause for alarm.  Branches of the Tree lie in every
    direction.
  sector: inside
  exits:
