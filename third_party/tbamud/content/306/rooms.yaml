# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 306.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:306:room:30600":
  name: Lower Trunk of the Great Tree
  description: >
    The base of the Great Tree lies below, the newbie area just a short jump from the trunk upon which
    you precariously cling.  Up above are the many branchings of the Great Tree, the system of branches
    making a vweritable highway in the sky where movement can be seen from the many creatures which
    inhabit the tree even from here.  A hole in the trunk opens up into the tree northward, a small home
    visible inside.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:306:room:30604
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:306:room:30601
  extras:
  - keywords: [credits, info]
    text: >
      Great Newbie Tree * Built by Kaan for Dibrova Level: 1 - 10 78 rooms 19 mobs 7 objs Connector
      Zone(s): None, this is a floating newbie area This is a huge tree that newbie players may climb into and
      find all manner of tree-dwelling creatures. Eq has extremely low stats, as do all mobs.

"tba:306:room:30601":
  name: On the Trunk at the Lower Branch System
  description: >
    The tree's branches open out wide and full over the entire newbie area, making it possible to
    wander about the tree limbs, looking down upon Dibrova's world.  The way down to the main Newbie Area lies
    just below, a steady climb upward is also possible.  Branches lead out in every direction.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:306:room:30606
    east:
      to: tba:306:room:30608
    south:
      to: tba:306:room:30610
    west:
