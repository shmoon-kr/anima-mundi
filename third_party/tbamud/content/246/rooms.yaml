# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 246.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:246:room:24600":
  name: The Nether Docks
  description: >
    This is a stone quay set upon the west shore of the Pool of Innocents.  The quay backs up against a
    solid stone wall on the west, south and north sides, hemming it in so that the only direction to
    travel is out onto - or into - the Pool.  Near the northern edge of the quay there is a strange purplish
    substance floating upon the water of the Pool, almost like a lillypad but more thick and almost
    spongey.  It criss-crosses across the Pool's surface, leading east toward another smaller quay on the
    east side of the pool.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:246:room:24603
    east:
      to: tba:246:room:24601
  extras:
  - keywords: [credits]
    text: See Nether credits.

