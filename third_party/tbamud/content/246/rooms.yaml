"tba:246:room:24618":
  name: Treading the Pool of the Innocents
  description: >
    You more splash than tread any sort of comfortable poise within this thick, murky water.  The docks
    lie to the west, it should be easy enough to hoist yourself up onto them from here.  The spongey
    padway which crosses the surface of the pool is right next to you, however it proves impossible to get a
    firm grip on the squishy sunstance of the pad to haul yourself up onto it.  Did something just brush
    your leg under the water?
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track]
  exits:
    up:
      to: tba:246:room:24617
    down:
      to: tba:246:room:24659

"tba:246:room:24619":
  name: On a Sponge Pad
  description: >
    Your feet sink into the purple substance, getting slightly wet from water seeping over the edges
    and yet still it holds your weight.  The padway lead east, the docks lie to your west - blackish,
    smelly water surrounds you.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:246:room:24618
    east:
      to: tba:246:room:24625
    south:
      to: tba:246:room:24620
    west:
      to: tba:246:room:24614

