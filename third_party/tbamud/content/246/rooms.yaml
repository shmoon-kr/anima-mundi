"tba:246:room:24651":
  name: The Dias of the Matrons
  description: >
    The Matrons are the self-appointed protectors of the Nether Lord.  They all lay claim to having
    given birth to the Lord and since none of these hideous ladies' claims have ever been disproven they all
    stand watch against unwarranted intrusions.  Some even say that it is possible that every one of
    these five ladies contributed to bringing the Nether Lord into being - that the Lord is somehow the
    spawn of all five of these things.  The Lord's Throne lies dead center at the far east side of the Dias.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    east:
      to: tba:246:room:24652
    south:
      to: tba:246:room:24654
    down:
      to: tba:246:room:24648

