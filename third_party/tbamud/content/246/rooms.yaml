"tba:246:room:24645":
  name: Supplication
  description: >
    Those who seek retribution or forgiveness for the deeds they have done in the afterlife come here
    in supplication to the Nether Lord and his Matrons.  This flat pad of stone holds hoardes of prostrate
    beings, all begging of the Matron for a chance to receive the blessing of the Lord so that they
    might gain the Eternal Rest.  Do not seek to cut in on those closest to the Dias of the Matrons, you
    could end up one of these, begging for Eternal Rest.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    east:
      to: tba:246:room:24648
    south:
      to: tba:246:room:24646
    west:
      to: tba:246:room:24642

