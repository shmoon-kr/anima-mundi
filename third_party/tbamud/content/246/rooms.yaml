"tba:246:room:24657":
  name: The Throne of the Nether Lord
  description: >
    The throne of the Nether Lord gleams a bright, glowing white, shimmering in all its brilliance with
    the knowledge of all and none upon its seat.  It sits slightly higher than the rest of the dias,
    backed into a niche in the stone of the cavern that surrounds the Dias, the Pool of Innocents and the
    Docks.  It is truly the seat of power - power which must be conquered if ever you wish to leave this
    place.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track, no_magic]
  exits:
    east:
      to: tba:246:room:24658
    west:
      to: tba:246:room:24653

"tba:246:room:24658":
  name: The Way
  description: >
    Your journeys have finally come to an end within the Nether.  Whether your achievements were those
    of fable or those of folly, only you can answer - but one thing is certain: To have entered into the
    Nether and returned alive is a feat that only few can lay claim to - and of those few, only a handful
    speak the truth.  Be well, adventurer - may you flourish in the Realm of the Living.
  sector: inside
  flags: [no_mob, indoors, soundproof, no_track]

"tba:246:room:24659":
  name: The Pool of the Innocents
  description: >
    The thick black water of the Pool slides along your body, the feel of it an oozing, mucusish
    sensation.  It is impossible to see any further than where you swim immediately, the water's dark color
    obscuring sight almost alarmingly.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    east:
      to: tba:246:room:24660
    south:
      to: tba:246:room:24662
    up:
      to: tba:246:room:24618

