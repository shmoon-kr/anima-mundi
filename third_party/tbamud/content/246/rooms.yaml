"tba:246:room:24636":
  name: Treading the Pool of the Innocents
  description: >
    You splash around in the murky goo of the Pool of Innocents, unable to get a firm grip on the
    spongey substance of the padway which floats on the surface right near you.  Trying to swim in any
    direction on the surface of the water only gets you tired - looks like you will have to take a deep breath
    and make a dive for it underwater.  The Nether Docks lie to the west.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track]
  exits:
    down:
      to: tba:246:room:24665

