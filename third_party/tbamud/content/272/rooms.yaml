"tba:272:room:27208":
  name: A dwelling perched precariously on the edge
  description: >
    This home is so tenuously held to the brink of stone and mud that you have to wonder how long
    before the rains carry it over the edge.  However, if a god assures you it is safe, it must be.... 
    Right?  You trust us, don't you?
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:272:room:27215

"tba:272:room:27209":
  name: A black stone dwelling
  description: >
    You stand in a quiet, empty dwelling of sturdy black sandstone.  Occupied now by only a few
    spiders, it looks like it could be a comfortable place to live with a little work.  With enough gold,
    perhaps one of the higher gods might sell it to you?
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:272:room:27203

"tba:272:room:27210":
  name: A garden of wild rosethorn
  description: >
    Dense bushes of rosethorn, growing wild, fill the garden with splashes of white and red colors. 
    There is a grassy space in the center, circled by smooth gray stones, where children play and older
    residents of the town picnic and enjoy themselves.
  sector: field
  exits:
    east:
      to: tba:272:room:27212
    south:
      to: tba:272:room:27211
    west:
      to: tba:272:room:27213

