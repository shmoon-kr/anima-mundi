"tba:272:room:27225":
  name: Climbing a small bluff
  description: >
    A few gnarled, wind-tortured trees spread their meager limbs in hunched eastward arcs.  There is
    little that is extraordinary about this place.  It is deserted, it is lonely, yet a particularly green
    bluff forms a plateau just above you.  It calls to you in an eerie way, yet emits a chaotic aura that
    might be best left alone.
  sector: hills
  exits:
    up:
      to: tba:272:room:27226
    down:
      to: tba:272:room:27224

"tba:272:room:27226":
  name: Blind Man's Bluff
  description: >
    The lonely hilltop is blanketed in a strange, rich green grass-cover, and the only sound is that of
    the wind whistling over the moors.  A haunting, otherworldly presence has made this bluff its home,
    casting what malevolence it yet can on the mortal world, and giving the bluff its name.
  sector: field
  exits:
    down:
      to: tba:272:room:27225

"tba:272:room:27227":
  name: A clearing circled by oaks and maples
  description: >
    The stone-rimmed path opens out to a clearing of dirt, encircled by broad oaks and maples with
    leaves the color of honey.  To the north a black gate is closed against the clamor of the world, and the
    road continues east to town, and west where it vanishes into a fog banked forest.
  sector: forest
  exits:
    north:
      to: tba:272:room:27228
    east:
      to: tba:272:room:27221
    west:
      to: tba:272:room:27248

"tba:272:room:27228":
  name: The black orchard gate
  description: >
    A small gate wrought with black iron flowers and arches swings loosely in the shallow wind. 
    Beyond, rows of brambles are stretching past the range of your vision.
  sector: field
  exits:
    north:
      to: tba:272:room:27229
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:271:obj:27179
        reset: closed
    south:
      to: tba:272:room:27227

"tba:272:room:27229":
  name: The blackberry orchard
  description: >
    Dark brambles hung with dully shining berries form condensed hedges, growing in lines and
    stretching their thorny tendrils across your path.  The limbs trail low, heavy with fruit in temperate
    climate.  High stone walls protect this precious bower from the destructive noise and thoughts of ordinary
    humans.
  sector: field
  exits:
    north:
      to: tba:272:room:27230
    south:
      to: tba:272:room:27228
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:271:obj:27179
        reset: closed
    west:
      to: tba:272:room:27232

"tba:272:room:27230":
  name: Under an oak dark and wet with rain
  description: >
    A broad oak, knotted with the eons it has seen, stands amidst a circle of blackberry shrubs that
    seem to form a protective shroud of thorns about the area.  Ivy vines hang loose from its many-cornered
    limbs.  Some images have been carved into the oak.
  sector: field
  exits:
    north:
      to: tba:272:room:27247
    south:
      to: tba:272:room:27229
    west:
      to: tba:272:room:27231
  extras:
  - keywords: [oak]
    text: >
      The giant oak is covered in thick blue-green mosses and dark swaying ivy. Some images have been
      carved and charred in by a fiery touch, a sternly beautiful woman with a ruby dagger sheathed at her
      waist stands beside a man with the robe of the priesthood.  The cold wind of the sea blows the sails of
      the rocking ship they ride upon.  The rogue woman is imploring a second man to destroy a beast far
      too great for his strength, a cruel smile playing upon her lips.  The image is frozen upon the bark,
      immobile, yet it is apparent she is winning the battle.  Beneath the picture are engraved the words
      "Know thy limits".

