# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 272.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:272:room:27200":
  name: A short rockslide
  description: >
    You stand amidst a tumble of rocks of various sizes and shades of gray and ebony.  A pale hawk
    circles overhead, uttering a shivering cry.  It is impossible to continue downwards without meeting an
    untimely (?  ) death.  A few homes have been hidden here in the cliff face, a bit of a hike from any
    civilization.
  sector: mountains
  exits:
    east:
      to: tba:272:room:27202
    west:
      to: tba:272:room:27201
    up:
      to: tba:272:room:27204
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Sundhaven is designed to be a newbie starting town, essentially
        an alternative to a time-worn Midgaard. It is complete with the guilds
        of the four basic classes, shops, bank, post office, and several
        connecting points which make it easy to link to any world.
        SPECS:
        guilds:  {{CLASS_WARRIOR, 6757, SCMD_WEST}},
                 {{CLASS_THIEF, 6740, SCMD_EAST}},
                 {{CLASS_MAGIC_USER, 6616, SCMD_UP}},
                 {{CLASS_CLERIC, 6661, SCMD_WEST}},
           Room 6602 may function as a donation room if you desire.
        Room 6601 may serve as a player loadroom, with the following
        equipment loading with new players:
              objs 6602, 6603, 6604 to all.
              obj 6605 to thieves  (dagger).
              obj 6606 to mages  (staff).
              obj 6607 to clerics  (mace).
              obj 6608 to warriors  (short sword).
           I hope you find the zone useful.
        
        Zone 272 is linked to the following zones:
