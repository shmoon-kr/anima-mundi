"tba:272:room:27201":
  name: A home embedded in the cliff
  description: >
    This is a windowless, but airy, nook of walls built inside cliff stone.  It looks as though with
    some cleaning up it could be a comfortable place to live.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:272:room:27200

