"tba:272:room:27203":
  name: A path of black grass
  description: >
    A little trail picks its way among small ill-anchored stones and patches of black, wiry grass, that
    at first site gives the place a ravaged, charred look. However, the vegetation is living, just
    endowed with a dark hue.
  sector: field
  exits:
    east:
      to: tba:272:room:27204
    south:
      to: tba:272:room:27207
    west:
      to: tba:272:room:27209

"tba:272:room:27204":
  name: A small haunted grove
  description: >
    With the exception of the inexplicable darkness permeating this grove, there is little way to
    explain the odd feeling of foreboding about this place.  No birds sing, no rat scurries in the open, the
    leaves rustle barely enough to break the silence.  Yet an odd presence makes itself felt.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:272:room:27210
    east:
      to: tba:272:room:27206
    south:
      to: tba:272:room:27205
    west:
      to: tba:272:room:27203
    down:
      to: tba:272:room:27200

