"tba:272:room:27214":
  name: A red stone dwelling
  description: >
    You stand in a quiet dwelling of mortar and rose-colored stone.  Occupied now by only a few
    spiders, it looks like it could be a comfortable place to live, with a little work.  And gold, of course. 
    Perhaps it may be bought from one of the gods.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:272:room:27217

"tba:272:room:27215":
  name: Passing through a vine-wreathed gate
  description: >
    A gate swathed in green, fruitless vine lies open, but the path looks little-travelling.  You
    wonder if there is anything of use to you out this remote way, apparently passing out of the residential
    area.
  sector: field
  exits:
    north:
      to: tba:272:room:27216
    east:
      to: tba:272:room:27208
    west:
      to: tba:272:room:27222

