"tba:272:room:27217":
  name: A path hung with golden lanterns
  description: >
    A wide path of chalky-white cobblestone leads to southwards towards some dense illumination.  Here
    the lane is lined with poles hung with lanterns giving off a mild golden glow, swinging in the
    breeze.  The wind passes more strongly along a lane to the north.
  sector: field
  exits:
    north:
      to: tba:272:room:27218
    west:
      to: tba:272:room:27214

"tba:272:room:27218":
  name: A circle of golden lanterns
  description: >
    The path fades into a broad circular clearing, ringed with white stones and hanging golden lanterns
    that provide a bright radiance.  A few white stone houses, small but cozy-looking, lie just east and
    west, enjoying the luminescence.
  sector: field
  exits:
    east:
      to: tba:272:room:27220
    south:
      to: tba:272:room:27217
    west:
      to: tba:272:room:27219

"tba:272:room:27219":
  name: A white stone dwelling
  description: >
    A small dwelling has been fashioned from chalky-white stones and gray mortar.  It is empty of signs
    of habitation.  You feel, nevertheless, that this could be a comfortable place to live, if bought
    from the gods of the realm.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:272:room:27218

"tba:272:room:27220":
  name: A white stone dwelling
  description: >
