  exits:
    west:
      to: tba:272:room:27218

"tba:272:room:27221":
  name: A wide cart path
  description: >
    The road outside the town of Sundhaven is well-travelled by vehicles of trade....  Is it a path for
    wide carts, or a wide path for carts?  Westwards, a dense forest is blurred with low-hanging clouds.
  sector: field
  exits:
    east:
      to: tba:271:room:27145
      door:
        keywords: [gate]
        kind: door
        key: tba:271:obj:27179
        reset: closed
    west:
      to: tba:272:room:27227

"tba:272:room:27222":
  name: An untravelled path
  description: >
    A thin line of soil barely resembling a path threads its lonesome way between the dull gray
    stones.  You can only wonder if there is much of note out this direction, as a sense of barrenness is
    prominent.
  sector: field
  exits:
    north:
      to: tba:272:room:27217
    east:
      to: tba:272:room:27215
    west:
      to: tba:272:room:27223

