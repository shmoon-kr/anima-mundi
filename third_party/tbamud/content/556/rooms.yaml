"tba:556:room:55649":
  name: The Shrine of Spirituality
  description: >
    In this room a huge ankh sits on a pedestal.  The Shrine is the source of all magical power.  The
    Timelord himself lives here.  There is a moongate here also. And last of all there is a huge engraving
    taking up the west wall.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:556:room:55654
      look: You peer into the blackness, and hear shrieks and sounds totally inhuman.
    south:
      to: tba:556:room:55657
      look: Peace infuses your body.  The graveyard is a solemn and sobering place.
    up:
      to: tba:556:room:55662
      look: Through the moongate you see a castle.
      door:
        keywords: [moongate]
        kind: pickproof
        key: tba:555:obj:55515
        reset: locked
  extras:
  - keywords: [engraving]
    text:
    - " Pilgrim,"
    - >
      You have reached the final step on your way to enlightenment. In this last step you will be shown
      ultimate evil to your north, and ultimate good to your south.  This is the land of the undead.
    - >
      The dead of both those whose goodness links them to the land, and those whose evilness was rejected
      are here.  To have true spirituality one must know both.  Once you have been strengthened and forge
      through the evil, there is one final test before you prove yourself equal to the Avatar himself.  You
      must endure the test of time.
  - keywords: [ankh]
    text: >
      Through your entire journey you have not understood the real symbol of the ankh.  Its true beauty
      only reveals itself to you now.  This knowledge transcends all that came before.

"tba:556:room:55650":
  name: The Place of Ultimate Evil
  description: The ground itself seems malevolent.  It seems to suck at you as it tries to engulf you.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:556:room:55651
    south:
      to: tba:556:room:55653

"tba:556:room:55651":
  name: The Place of Ultimate Evil
  description: The air sickens you.  You choke on whatever flows through the air as you gasp for oxygen.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:556:room:55652
    south:
      to: tba:556:room:55654
    west:
      to: tba:556:room:55650

"tba:556:room:55652":
  name: The Place of Ultimate Evil
  description: >
    It is dark, there is no evidence of light except what you have with you. And this is swallowed by
    the darkness within 2 feet.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:556:room:55655
    west:
      to: tba:556:room:55651

"tba:556:room:55653":
  name: The Place of Ultimate Evil
  description: >
    Sounds are very weird in this place.  Some sounds, like shrieks and blood-curdling shouts, are
    amplified, and you hear them frequently.  Others, like your own voice, will not travel to beyond a inch
    from your face.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:556:room:55650
    east:
      to: tba:556:room:55654

"tba:556:room:55654":
  name: The Place of Ultimate Evil
  description: >
    When you enter this place all of your senses are immediately blasted.  You breathe in that total
    evilness and feel dirty.  You want to leave right now.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
