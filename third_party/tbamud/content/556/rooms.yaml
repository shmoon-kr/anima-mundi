  exits:
    north:
      to: tba:556:room:55618
      look: The Ocean Roars.
    east:
      to: tba:556:room:55613
      look: The beach sparkles.

"tba:556:room:55685":
  name: Entrance to Ultima
  description: >
    The blue moongate casts a strange blue light upon a huge gate to the south. The gate is open and
    beyond it you see a simple village.  Around the gate there are two pedestals.  On the first pedestal is
    a magic scroll.  On the second is a plaque.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:555:room:55501
      look: There is a huge gate.
  extras:
  - keywords: [magic, scroll]
    text: >
      An image flies out of the scroll and creates a huge image of a face approximately ten feet off the
      ground.  It says, "Welcome to Ultima, where adventure and excitement may be found for all people, and
      all levels.  Each of the separate planes increase in level.  Have a nice day!"
  - keywords: [plaque]
    text: The plaque reads, "The Ultima Area was originally made for Merc 2.0."
