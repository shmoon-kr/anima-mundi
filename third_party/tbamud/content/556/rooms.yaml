"tba:556:room:55677":
  name: The Enlightenment
  description: >
    A voice booms out, "You are now eight parts enlightened.  To truly become an Avatar though you must
    experience what he has experienced.  Go through the time warp and fight his enemies.  Beware!  Only
    High Mortals should attempt this challenge."
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:556:room:55679
      look: The Time Warp leads you to another place.
      door:
        keywords: [warp]
        kind: pickproof
        key: tba:555:obj:55516
        reset: locked

"tba:556:room:55678":
  name: In the Warp
  description: >
    This is a forest.  You were sent very far back in time.  Before there was a Britannia.  Almost
    before there was a Lord British.  This is the time of Mondain.  The first enemy that the Avatar met.
  sector: forest

"tba:556:room:55679":
  name: In the Warp
  description: >
    You are in a featureless room.  You see the apprentice and lover of Mondain here.  Minax.  She does
    not seem happy to see you.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:556:room:55680
      look: The Time Warp zips to the future.
      door:
        keywords: [warp]
        kind: pickproof
        key: tba:555:obj:55516
        reset: locked

"tba:556:room:55680":
