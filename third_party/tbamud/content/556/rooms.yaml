    Avatar's enemies of the past.  Now the time warp leads to the future.  Only the truly courageous can
    survive the enemies there."
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:556:room:55682
      look: The Time Warp changes space, and fluxes its surroundings.
      door:
        keywords: [warp]
        kind: pickproof
        key: tba:555:obj:55516
        reset: locked

"tba:556:room:55682":
