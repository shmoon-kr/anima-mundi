"tba:556:room:55669":
  name: The Altar of Honesty
  description: >
    You may gain true enlightenment here.  There is a large plaque on the wall. The path continues only
    if you use the mantra, to gain enlightenment.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:556:room:55670
      look: The Path Of Enlightenment leads on.
      door:
        keywords: [Path]
        kind: pickproof
        key: tba:555:obj:55504
        reset: locked
  extras:
  - keywords: [plaque]
    text: >
      Honesty is the scrupulous respect for truth-the willingness never to deceive oneself or another.

