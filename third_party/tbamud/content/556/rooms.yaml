    west:
      to: tba:556:room:55633

"tba:556:room:55635":
  name: The Map Tent
  description: >
    This room has many maps and scrolls all over the table.  There is one in particular that interest
    you.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:556:room:55634
  extras:
  - keywords: [scroll]
    text:
    - "The scroll reads as follows:"
    - Dear Lord British,
    - >
      This is Dupre reporting about the paladin expedition.  We are in the process of clearing the desert
      of those annoying sandtraps.  Unfortunately one of my men had wandered into the dragon cave and was
      slayed by that evil creature.  We need another knight, and also he had a moonstone.  Thank you, my
      liege.
    - Your Servant,
    - Dupre
  - keywords: [map]
    text: >
      The map has a rough drawing of the camp and to the north a small segment of the desert, and a
      drawing of a winged lizard near the very north.

