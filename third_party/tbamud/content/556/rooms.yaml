"tba:556:room:55633":
  name: The Treasure Tent
  description: >
    There is a HUGE stack of treasure here.  It is truly immense.  It would make you easily a
    millionaire.  If you could even take a tenth of it, you could buy your levels.  But the treasure is surrounded
    by a shield.  A shield that only the truly Honorable could get through.  And if you were truly
    honorable you wouldn't take the treasure.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:556:room:55634

"tba:556:room:55634":
  name: The Grand Tent
  description: >
    This tent is absolutely huge.  To the east is the map room.  To the south there is Dupre.  To the
    east is the treasure room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:556:room:55630
