"tba:291:room:29169":
  name: The Room of 10,000 pillars
  description: You are in the Room of 10,000 pillars.  Have a nice day.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:291:room:29168
    south:
      to: tba:291:room:29166

"tba:291:room:29170":
  name: The Observing Chamber
  description: >
    This is the observation chamber on the top of the observing tower.  A large telescope if mounted
    into the wall allowing a view to the outside.  The center of the room has a sturdy oaken table which is
    has a modest collection of maps and charts.  A spiral starcase leads down the tower.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:291:room:29159

"tba:291:room:29171":
  name: In the Halls of the Citadel
  description: >
    The long vaulted hall extends in an east-west direction.  It serves to connect the Eastern complex
    and the Western one.  Your footsteps echo off the walls, reverbing, rebounding, resounding, refusing
    to die, as if they knew that to perish here is to risk eternal damnation.  Above you, supernatural
    flames forever dance in crystal orbs that hang suspended from the ceiling by wrougt iron chains.  The
    strange light these provide casts long shadows that envelop long tracts of hall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:291:room:29172
    west:
      to: tba:291:room:29155

"tba:291:room:29172":
  name: In the Halls of the Citadel
  description: >
    The long vaulted hall extends in an east-west direction.  It serves to connect the Eastern complex
    and the Western one.  Your footsteps echo off the walls, reverbing, rebounding, resounding, refusing
    to die, as if they knew that to perish here is to risk eternal damnation.  Above you, supernatural
    flames forever dance in crystal orbs that hang suspended from the ceiling by wrougt iron chains.  The
    strange light these provide casts long shadows that envelop long tracts of hall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:291:room:29173
    west:
      to: tba:291:room:29171

"tba:291:room:29173":
  name: The Clock Tower
  description: >
    You have entered the clock tower.  As you gaze upward you see a mass of intricate gears, cogs, and
    other clockwork parts meshing and grinding above you.  The effect is almost hypnotic.  A staircase is
    built into the wall allowing access to the intricate mechanisms above, if you dare to climb it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29174
    west:
      to: tba:291:room:29172
    up:
      to: tba:291:room:29175

"tba:291:room:29174":
  name: A Connecting Corridor
  description: You are in the Citadel.  Have a nice day.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:291:room:29159
    south:
      to: tba:291:room:29173

"tba:291:room:29175":
  name: In the Clock Tower
  description: >
    You stand in the lower portion of the inner working of the citadel's clock tower.  Gears mesh and
    springs flex all around you.  You realize that with so much ambient motion it would be easy to ambush
    you here.  There is a staircase down to the ground floor, to go upward any more you will have to
    climb the gears.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:291:room:29176
    down:
      to: tba:291:room:29173

"tba:291:room:29176":
  name: Amongst the cogs.
  description: >
    You are playing a game of High Stakes Hop-Scotch, leaping from gear to gear, Hanging on a chain one
    moment, climing on a gear the next.  You had better act quickly to make your next move before your
    luck runs out.  One false step here could be disasterous.  Its a long way down, if you are lucky, if
    not you stand to be a red stain between two gears.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29177
    up:
      to: tba:291:room:29178
    down:
      to: tba:291:room:29175

"tba:291:room:29177":
  name: Between the Gears
  description: >
    You hop to one a stationary gear to catch your breath.  The effect of all the movement in the
    background is dizzying.  You momentairly loose track of your sense of balence.  A slip up that would prove
    to be fatal.  Without warning the gear shudders to life and you fall.  You land between the teeth of
    a moving cog and come to your senses just as it starts to move.  You barely escape a crunching death.
  sector: inside
  flags: [no_mob, indoors]

"tba:291:room:29178":
  name: The Top of the Clock Tower
  description: >
    You are above the bulk of the clockwork mechanisms.  On a small balcony you stand looking down. 
    You can try to brave the trip down of you care to, or you can go out onto the clock face.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:291:room:29179
    down:
      to: tba:291:room:29176

"tba:291:room:29179":
  name: On the Clock Face
  description: >
    You stand on the central peg of the clock face that the hands rotate around. An icy wind whips by
    that threatens to chill you to the soul.  You look around and can look out over the tops of the oaken
    trees which extend to the horizon. On the other side of the citadel you can see the observation tower
    extending only slightly higher they you are now.  And then you see the spire of the citadel which
    extends high into the sky, casting its long shadow across the Black Forest.
  sector: inside
  exits:
    east:
      to: tba:291:room:29178

"tba:291:room:29180":
  name: The Ground Floor of the Spire
  description: >
    You are in the spire of the Citadel.  A Large room.  It is all but pitch black.  The only thing
    that breaks the monotony is a starcase that extends both up and down
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:291:room:29166
      door:
        keywords: [door, double]
        kind: pickproof
        key: tba:291:obj:29117
    up:
      to: tba:291:room:29141
    down:
      to: tba:291:room:29181

"tba:291:room:29181":
  name: The Tower Dungeon
  description: >
    You have decended into the dank dungeon below the spire.  A strange green moss grown on the rough
    hewn rock walls that illuminates the room with an eeire green glow.  There are a few holding cells
    that line the far walls A row of manacles are affixed to the near wall to hold prisoners while they
    await torture.  The middle of the room is taken up by several implements of pain. There is a vat for
    boiling oil.  Several racks and countless hideous bladed instruments, old, diseased, and rusty with age.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:291:room:29140
    up:
      to: tba:291:room:29180

"tba:291:room:29182":
  name: The Infernal Altar
  description: >
    Partway up the tower is the chapel dedicated to the mistress of the tower and of the Void.  The
    room is in a circular shape with an altar of some strange black material in the middle.  Unholy lights
    burn with the power of the symmetry, casting an unnatrual sheen on the room.  The spiral staircase
    that wraps around the room continues both up and down
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:291:room:29183
    down:
      to: tba:291:room:29141

"tba:291:room:29183":
  name: The Great Spiral Staircase
  description: >
    Just above the altar, the tower hollows itself out and you now stand in a giant chamber.  In the
    middle of the hollowed column stands a pair of spiral staircases twisting and turning upon each other
    in a doulbe helix.  There is no central pillar on which the staircases are supported.  You have to
    marvel at the wonder of engineering this is.  But only the bravest souls will climb it because each step
    you take brings you that much closer to...  Her.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:291:room:29184
    down:
      to: tba:291:room:29182

"tba:291:room:29184":
  name: The Great Spiral Staircase
  description: >
    You are about halfway up the Great Spiral Staircase.  The steps continue to spiral onward like two
    intertwined slinkies made of a dark marble.  Your light grows noteably dimmer, as if the tower's very
    darkness consumes the light as soon as it is produced.  Your legs plead with you to decend the
    steps, rather than ascend.  For to go down is to go away from the terror at the top.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:291:room:29185
    down:
      to: tba:291:room:29183

"tba:291:room:29185":
  name: The Choice
  description: >
    Above the Great Spiral Staircase.  You enter a small mist-filled room.  It is has two exits to it,
    and to go forth you have to make a fateful choice. Think carefully before you make your choice.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:291:room:29186
    south:
      to: tba:291:room:29187
    down:
      to: tba:291:room:29189

"tba:291:room:29186":
  name: Damned if You Do
  description: You've made your choice, now live with it
  sector: inside
  flags: [indoors]

"tba:291:room:29187":
  name: Damned if You Don't
  description: You've made your choice, now live with it
  sector: inside
  flags: [indoors]

"tba:291:room:29188":
  name: The Music Room
  description: >
    This is a sprawling room is filled with musical instruments.  The largest feature of the room is
    the pipe organ.  It dominates over half of the room. The organ has five sets of organ keys which have
    been polished to a high reflective sheen.  The brass pipes of the organ are likewise polished waiting
    to be used.  In the background you can hear the echos of a phantasmal orquestra playing in some
    forgotten and lost dimention, whose music somehow leaks through to where you now stand.
  sector: inside
  flags: [dark, indoors, soundproof]
  exits:
    north:
      to: tba:291:room:29158
    south:
      to: tba:291:room:29159

"tba:291:room:29189":
  name: The Great Spiral Staircase
  description: >
    Congradulations.  You made the right choice.  You walked away.  Maybe you have a chance after all,
    but if you had any sense at all you'd just keep on going back down.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:291:room:29190
    down:
      to: tba:291:room:29184

"tba:291:room:29190":
  name: At Death's Door
  description: >
    You were wise (Or luckey) enough to survive the Choice.  You have arrived at Death's Door.  The
    Large, Iron double door stands as an obstacle to your passage.  Trying force the door would be futile. 
    To progress any further you will need a key.  There is a door to the north
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29191
      look: Death's Door stands here to block you.
      door:
        keywords: [death, door]
        kind: pickproof
        key: tba:291:obj:29115
        reset: locked
    down:
      to: tba:291:room:29189

"tba:291:room:29191":
  name: The Final Ascent
  description: >
    Just beyond Death's door is a narrow staircase.  The air is unusually damp and the walls are slick
    with moss.  As you walk upwards your way is lit by candles that are lining both sides of the
    starecase.  The air is thick with the humidity and the stench of evil.  It is still not to late to turn back.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:291:room:29190
      look: Death's is here barring your progress
      door:
        keywords: [door, death]
        kind: pickproof
        key: tba:291:obj:29115
    up:
      to: tba:291:room:29192

"tba:291:room:29192":
  name: Beyond the point of no return
  description: >
    As the name implies, you are past the point of no return.  The only way out is through the mistress
    of the void, Ilian.  Unless you want to take the easy way out and just die now.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    up:
      to: tba:291:room:29193

"tba:291:room:29193":
  name: Near the Balcony
  description: >
    After leaving the point of no return behind.  You stand on a broad square dotted with pillars
    supporting the final stories above you.  With nothing to stop it, the wind is a constant gale through this
    wind tunnel.  Looking out the gray skies loom ominously foretelling of a coming storm.  You can step
    out on to the balcony if you like, or you can climb the staircase in the middle to challenge the
    mistress of this fortress.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:291:room:29194
    up:
      to: tba:291:room:29196
    down:
      to: tba:291:room:29192

"tba:291:room:29194":
  name: The High Balcony
  description: >
    You are on the high balcony on the spire.  It rests right above the huge symbol of on the walls of
    the tower you say when you were first entering the woods.  Glancing around you see the clock tower
    and the observing post far below you.  From here you can see the entire expanse of the black woods. 
    From the western hills where you began this nightmare to the sea which lies FAR to the south.  The
    balcony extends to the south a bit, but be careful There is no guardrail, and that first step is a doozy.
  sector: city
  exits:
    south:
      to: tba:291:room:29195
    west:
      to: tba:291:room:29193

"tba:291:room:29195":
  name: Look Before you Leap
  description: >
    You are on the edge of the balcony.  There is no guardrail here only a shear clifflike drop at the
    edge.  An unexpected gust of wind nearly makes you loose your footing, but you manage to hang on.  As
    nervous as you are, this place has an unusual serenity to it.
  sector: city
  exits:
    north:
      to: tba:291:room:29194

"tba:291:room:29196":
  name: The Guardian's Chamber
  description: >
    This room, near the top of the tower is draped in chains that completely hide the walls.  You feel
    the unmitigated force of evil radiating from a door to the north.  This chamber is the guardpost for
    Ilian's personal bodyguard and enforcer.  The Greatest and Most Powerful of all the Doomguard: The
    Dark and Stormy Knight!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:291:room:29197
    down:
      to: tba:291:room:29193

"tba:291:room:29197":
  name: Ilian's Throne Room
  description: >
    Well, you made it.  I'm not sure if this is a good thing or a bad thing, but after all the trials
    and struggles, you are at the top of Ilian's citadel.  The room seems impossibly large, and the center
    of it is dominated by a presence which radiates pure, unadulterated, unmitigated, unqualified,
    unholy evil.  The mistress of the citadel, Ilian sits on her throne surrounded by a small horde of her
    children, She looks at you as her mastery of the dark symmetry probes your mind to find out if you are
    significant enough to be bothered with.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:291:room:29196
    down:
      to: tba:291:room:29198

"tba:291:room:29198":
  name: The Way Out
  description: >
    Fleeing quickly, you leave the throne room behind and make your way down a secret staircase
  sector: inside
  flags: [dark, no_mob]
  exits:
    down:
      to: tba:291:room:29180

"tba:291:room:29199":
  name: Even more of the Black Forest
  description: >
    Does this accursed forest never end?  You press deeper and deeper into the seemingly endless cadre
    of oak trees that stand as omnious guardians to this dark place.  Press much further and you do not
    know if you will be able to find your way back.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29149
    east:
      to: tba:291:room:29120
    south:
      to: tba:291:room:29149
