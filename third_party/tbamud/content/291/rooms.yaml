# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 291.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:291:room:29100":
  name: The hill near the Black Forest
  description: >
    You stand on a hill overlooking a dense forest of old oak trees. A slight chilling breeze blows by
    and you can't help but shudder as you look toward it In the middle of the forest, popping out over
    the trees is the tall spire of the Citadel. The symbol of the triangled wheel on the tower's side is
    there for all to see. A trail leads eastward down the hill towards the woods.
  sector: hills
  flags: [no_mob]
  exits:
    east:
      to: tba:291:room:29101
  extras:
  - keywords: [credits, info]
    text: >
      A zone built by Silverangel on Ironic Building MUD: ironic.betterbox.net port 1919 Contains a
      forest, a tower, and a disco.

"tba:291:room:29101":
  name: Just Outside the Black Forest
  description: >
    A chilling wind blows by you from deep within the dark forest.  You stand near the outermost trees
    on a rapidly dwindling trail that winds into the dark heart of the woods.  Your know your imagination
    can only scratch the surface of the unholy terrors that lie within.  You have been warned.
  sector: hills
  exits:
    east:
      to: tba:291:room:29102
    west:
      to: tba:291:room:29100

"tba:291:room:29102":
  name: The outskirts of the Black Forest
  description: >
    Little light penetrates the dense foliage of the forest.  Almost no plant life occupies the hard,
    rocky ground.  If you push much further into the doomed forest, you will be in all but total
    darkness.  Every so often a haunting, diabolical laugh drifts to your ears.  It drives shivers down your
    spine.  You can make out a trail to the south and east.  To the north there is a cabin. Or you could flee
    the woods.
  sector: forest
  exits:
    north:
      to: tba:291:room:29103
    east:
      to: tba:291:room:29107
    south:
      to: tba:291:room:29104
    west:
      to: tba:291:room:29101

"tba:291:room:29103":
  name: A Deserted Cabin
  description: >
    You are in a cabin in the woods.  Time has not been kind to this structure. The logs that make up
    it are starting to rot, and there are a few gaps in the walls.  Still, it does provide shelter from
    the wind.  The floor is a rough, clumpy packed earth.  Whoever lived here has long since abandoned it. 
    But if you take a closer look, you may find something useful.
  sector: inside
  exits:
    south:
      to: tba:291:room:29102

"tba:291:room:29104":
  name: The Black Forest
  description: >
    The trail you have followed has dwindled to a nothing.  Every so often you think you see some
    movement out of the corner of the eye.  As you are looking around, a fresh bout of evil laughter comes to
    your ear.  It echos off the trees, refusing to die.  You feel a bead of sweat form on the back of
    your neck.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29102
    south:
      to: tba:291:room:29105

"tba:291:room:29105":
  name: The Black Forest
  description: You are in the Black Forest.  Have a Nice Day.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29104
    east:
      to: tba:291:room:29110
    south:
      to: tba:291:room:29106

"tba:291:room:29106":
  name: Hopelessly Lost
  description: >
    You stumbled off the path now you are Hopelessly Lost!  But don't fret. There IS a way out, but can
    you find it?
  sector: inside
  flags: [no_mob]
  exits:
    south:
      to: tba:291:room:29120

"tba:291:room:29107":
  name: The great oak
  description: >
    This is the largest tree in the forest.  It stretches high overhead.  The gnarled limbs hang above
    you like grasping hands waiting to strangle you The bark is rough and blood stained.  At the roots
    lie a fallen hero.  His body well along in decomposition, but the cause of death is obvious.  This
    foolish hero has been decapitated.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29108
    east:
      to: tba:291:room:29112
    west:
      to: tba:291:room:29102

"tba:291:room:29108":
  name: The dense woods
  description: >
    The trees get thicker as you push foreward.  You have to squeeze if you go much further.  Every so
    often one of the trees carries an aged blood stain marring one of the trees.
  sector: forest
  exits:
    north:
      to: tba:291:room:29109
    south:
      to: tba:291:room:29107
    west:
      to: tba:291:room:29106

"tba:291:room:29109":
  name: The dead end
  description: >
    You have discovered a portion of the outer wall of Ilian's Citadel.  The nearby trees prevent you
    from exploring the wall.  It is an imposing mass of cold, smooth, black granite.  So near the vile
    citadel, you know in your soul this is not a place you want to be caught dead at.
  sector: forest
  exits:
    south:
      to: tba:291:room:29108

"tba:291:room:29110":
  name: The Bridge
  description: >
    This rickety covered bridge spans a rather wide natural chasm in the forest floor.  It lit by two
    rusty lantern hanging off pegs in the wall.  This place provides much protection from the icy winds
    common to the Black Forest.  You do not know why, but at least here you can find some measure of
    sanctuary from the evils of the woods.
  sector: inside
  flags: [no_mob, no_track]
  exits:
    east:
      to: tba:291:room:29119
    west:
      to: tba:291:room:29105
    down:
      to: tba:291:room:29111

"tba:291:room:29111":
  name: Under the bridge
  description: >
    You are in a rocky ravine under the bridge.  Sparse vegitation manages to grow in small pockets of
    soil interespersed about.  The loose nature of the gravely slopes makes for difficult going.  You can
    surmise that this place would fill up rapidly in a heavy rain.  You just hope that dosen't happen
    while you are here.
  sector: mountains
  exits:
    south:
      to: tba:291:room:29133
    up:
      to: tba:291:room:29110

"tba:291:room:29112":
  name: Deeper into the Black Forest
  description: >
    The deeper into the forest you press, the more you doubt the sanity of your choice.  But you know
    that with great risks come great rewards.
  sector: forest
  flags: [dark]
  exits:
    east:
      to: tba:291:room:29115
    south:
      to: tba:291:room:29113
    west:
      to: tba:291:room:29107

"tba:291:room:29113":
  name: Ed's Disco Palace
  description: >
    What is this place doing here?  Lights flash.  People dance the night away. A spinning disco ball
    hangs suspended from the ceiling spraying the insides with multicolored light.  The noise of the music
    and chatter is all but deafening
  sector: inside
  flags: [no_mob, indoors, soundproof]
  exits:
    north:
      to: tba:291:room:29112
    south:
      to: tba:291:room:29114

"tba:291:room:29114":
  name: The Dance floor
  description: >
    You now stand on the dance floor of Ed's Disco Palace.  The lights strobe and the dancers groove to
    the music of the preforming Elvis Impersonators as they jive around a lovely selection of rabid
    potted plants.
  sector: inside
  flags: [indoors, soundproof]
  exits:
    north:
      to: tba:291:room:29113
    south:
      to: tba:291:room:29118
    west:
      to: tba:291:room:29144

"tba:291:room:29115":
  name: The Dark Heart of the woods
  description: >
    In the heart of the woods, things are strangely calm.  But it is the calm before the storm.  In the
    soft earth you can clearly see hoofmarks of some horse.  Around the hoofmarks the earth is scorched
    as if by a hot flame. Looking around there are the signs of a strugle.  Somebody placed his bets
    against whatever made the hoofmarks, and lost.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29143
    east:
      to: tba:291:room:29116
    west:
      to: tba:291:room:29112

"tba:291:room:29116":
  name: Nearing a clearing
  description: >
    The trees thin out a bit as you can see a glade.  There is an unnerving quiet around the area.  You
    look at the clearing you are standing near and you recognize it for what it is.  A killing field. 
    Your boot crunches on the headless skeleton of some small woodland creature.
  sector: forest
  exits:
    north:
      to: tba:291:room:29106
    east:
      to: tba:291:room:29117
    west:
      to: tba:291:room:29115

"tba:291:room:29117":
  name: The Glade
  description: >
    You stand in a glade.  The grass comes up to your knee, although it has been trampled down in many
    places where some unfortunate creature was hounded by something truly evil.  A fresh burst of icy
    wind whips through the grass sending waves rolling through the glade.  Out of the chilled wind comes a
    bout of the evil, maniacle, unholy cackles that cause your hair to stand on end.
  sector: inside
  exits:
    north:
      to: tba:291:room:29142
    east:
      to: tba:291:room:29127
    south:
      to: tba:291:room:29126
    west:
      to: tba:291:room:29116

"tba:291:room:29118":
  name: Boogie Time!
  description: >
    This is the small, open longue next to the dance floor.  People congregate to listen to the music. 
    A few of the Elvis Impersonators have wandered over here as they boogie down.
  sector: inside
  flags: [soundproof]
  exits:
    north:
      to: tba:291:room:29114

"tba:291:room:29119":
  name: the Stream
  description: >
    You walk alongside a small stream.  It silently sweeps away the dead leaves and other debris as it
    continues on.  It is a pity that it won't likewise sweep away your nervousness and trepidation too. 
    From here you can push on eastward or you can flee west to the safety of the bridge.  Your other
    option is to follow the river to its end.
  sector: forest
  exits:
    east:
      to: tba:291:room:29126
    south:
      to: tba:291:room:29146
    west:
      to: tba:291:room:29110

"tba:291:room:29120":
  name: Hopelessly Lost
  description: You are Hopelessly Lost!
  sector: forest
  flags: [dark]
  exits:
    east:
      to: tba:291:room:29121
    south:
      to: tba:291:room:29123

"tba:291:room:29121":
  name: Hopelessly Lost
  description: You are Hopelessly Lost!
  sector: forest
  flags: [dark]
  exits:
    south:
      to: tba:291:room:29122
    west:
      to: tba:291:room:29124

"tba:291:room:29122":
  name: Hopelessly Lost
  description: You are Hopelessly Lost!
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29121
    west:
      to: tba:291:room:29123

"tba:291:room:29123":
  name: Hopelessly Lost
  description: You are Hopelessly Lost!
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29120
    east:
      to: tba:291:room:29122

