  sector: forest
  flags: [dark]
  exits:
    east:
      to: tba:291:room:29121
    south:
      to: tba:291:room:29125

"tba:291:room:29125":
  name: Hopelessly Lost
  description: You are Hopelessly Lost!
  sector: forest
  flags: [dark]
  exits:
    south:
      to: tba:291:room:29104

"tba:291:room:29126":
  name: In the shadow of the citadel
  description: >
    You turn up your collar to the subthermal gales.  That's when you see it. From here you can see,
    not 200 yards ahead, the infernal structure that is the citadel.  You whisper a silent prayer of thanks
    that there are still many trees to hide behind.  It is best if the residents of the place don't know
    of your existance as long as possible.  It takes a major force of effort to tear your eyes off the
    citadel, but you manage.  To the west lies a small stream.  To the north is a clearing, and south of
    you is a trail that leads to a small keep in ruins.
  sector: forest
  exits:
    north:
      to: tba:291:room:29117
    east:
      to: tba:291:room:29129
    south:
      to: tba:291:room:29134
    west:
      to: tba:291:room:29119

"tba:291:room:29127":
  name: Up against the wall.
  description: >
    You have found a section of the outer wall.  The trees have been cut back making a path around part
    of the keep belonging to the mistress of the Void Far to the south you can see what seems to be the
    main gate.  To the north the wall disappears into the darkness of the Black Forest.
  sector: forest
  exits:
    north:
      to: tba:291:room:29130
    south:
      to: tba:291:room:29128
    west:
      to: tba:291:room:29117

"tba:291:room:29128":
  name: Up against the wall.
  description: >
    You have found a section of the outer wall.  The trees have been cut back making a path around part
    of the keep belonging to the mistress of the Void Far to the south you can see what seems to be the
    main gate.  To the north the wall disappears into the darkness of the Black Forest.
  sector: forest
  exits:
    north:
      to: tba:291:room:29127
    south:
      to: tba:291:room:29129
    west:
      to: tba:291:room:29106

"tba:291:room:29129":
  name: The Front Gate
  description: >
    You have reached the Gate of Ilian's Citadel.  The high black granite walls are smooth to the
    touch.  The gate is a huge, cast iron affair, emblazoned with the symbol of the triangled wheel.  Only the
    bravest of souls would consider entering this dreadful place.  There is a gate to the east.
  sector: forest
  exits:
    north:
      to: tba:291:room:29128
    east:
      to: tba:291:room:29150
      look: The massive door stands here, defying you to enter.
      door:
        keywords: [gate, door, portcullis]
        kind: door
        reset: closed
    west:
      to: tba:291:room:29126

"tba:291:room:29130":
  name: Up against the wall.
  description: >
    You have found a section of the outer wall.  The trees have been cut back making a path around part
    of the keep belonging to the mistress of the Void Far to the south you can see what seems to be the
    main gate.  To the north the wall disappears into the darkness of the Black Forest.
  sector: forest
  exits:
    north:
      to: tba:291:room:29131
    south:
      to: tba:291:room:29127
    west:
      to: tba:291:room:29142

"tba:291:room:29131":
  name: Are you sure this is a good idea?
  description: >
    You have found a section of the outer wall.  The trees have been cut back making a path around part
    of the keep belonging to the mistress of the Void Far to the south you can see what seems to be the
    main gate.  To the north the wall disappears into the darkness of the Black Forest.
  sector: forest
  exits:
    north:
      to: tba:291:room:29132
    south:
      to: tba:291:room:29130

"tba:291:room:29132":
  name: Trapped like a rat!
  description: >
    You have walked along the wall and now are in a small walled alcove.  The crack of evil laughter
    makes you jump in fright.  It came from right behind you!  You look around to see a headless rider on a
    ferocious charger that breaths fire.  In one hand he holds the reigns to his nightmare in the other
    he wields a black scimitar.  In a panic, you look around, but to your horror, you realize you are
    boxed in.  The horseman rides closer, he swings his huge scimitar, trying to lope off your head.  You
    manage to keep the blow from decapitating you, but he does connect with your head, sending you
    sprawling. The horseman rides off cackling.
  sector: inside
  flags: [no_mob, soundproof]
  triggers: [tba:291:trg:29100]

"tba:291:room:29133":
  name: The rockey ravine
  description: >
    This is a rough crevace.  It might be a geologists paradice.  Samples of quartz, feldspar,
    limestone, calcite, and other minerals in a stunning disarray.
  sector: inside
  exits:
    north:
      to: tba:291:room:29111

"tba:291:room:29134":
  name: On the Trail to the Ruins
  description: >
    You have stumbled onto a trail that the forest has yet to reclaim.  If you strain your eyesight you
    can barely makeout the remains of a ruined keep.  The few remaining walls, once a gleeming white are
    now a dull gray.  Evidently this keep was laid waste by the forces of the citadel.  Pity.
  sector: forest
  exits:
    north:
      to: tba:291:room:29126
    east:
      to: tba:291:room:29120
    south:
      to: tba:291:room:29135

"tba:291:room:29135":
  name: The Ruined Castle
  description: >
    Only a shattered shell reamins of what one was a bastion of good.  A few scattered bits of
    shattered walls remain as testiment to what once was, now they are merely waiting for the forest to reclaim
    them.  At least the ruins provide some measure of shelter from the incessent, madening wind.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29134
    east:
      to: tba:291:room:29137
    south:
      to: tba:291:room:29136
    west:
      to: tba:291:room:29145

"tba:291:room:29136":
  name: The Ruined Chapel
  description: >
    Once upon a time this was this keep's place of worship, but apparently the beings that this place
    was consecrated to didn't chose to spare this place any more than the rest of the castle.  Didn't
    chose to or weren't able to.  Maybe when Ilian's black citadel was erected, those protecting beings
    withdrew their protection to flee to safety, or maybe they made their stand with the occupants of the
    castle, and shared their fate.
  sector: forest
  exits:
    north:
      to: tba:291:room:29135
    west:
      to: tba:291:room:29138

"tba:291:room:29137":
  name: The Ruined Stables
  description: >
    Although the stables are in ruins, they still stand as a building, or at least half of a building. 
    The western half is nothing more than a rotting pile of debris.  The eastern half is beinh
    precariously held up by rotting wooden beams.  It does not look all that stable (No pun intended), but still
    there is fresh hay on the floor.  Although you take note that some of it has been scorched by fire of
    some sort.  There is still water in the trough.  All this leads you to believe that someone or
    something still makes use of this place
  sector: forest
  exits:
    west:
      to: tba:291:room:29135

"tba:291:room:29138":
  name: The Ruined Great Hall
  description: >
    This used to be the great hall of the castle, now it is in no better condition than the rest of the
    place.  The once highly polished marble floors are now cracked and covered with rubble that once was
    the roof.  The west wall is nothing but a memory and a heap of crumbling stones.  The great stained
    glass window set into the north wall, once the pride of the castle has been shattered into a million
    shards of rainbow hued glass strewn over the ground. The east wall still seems soundly built, but you
    have trepidations about the south wall It seems like it could come crashing down at any moment.
  sector: forest
  exits:
    north:
      to: tba:291:room:29145
    east:
      to: tba:291:room:29136
    west:
      to: tba:291:room:29139

"tba:291:room:29139":
  name: The Ruined Bell Tower
  description: >
    This was once a tall tower that housed a warning bell.  It was rung to alert the occupants to any
    threat, but nowadays it is a different story.  The walls have fallen like the rest of the keep.  The
    Gigantic bell that once rang its clarion call of alarum now is a shattered heap of twisted bronze that
    sits amidst the rest of the rubble.
  sector: inside
  exits:
    east:
      to: tba:291:room:29138

"tba:291:room:29140":
  name: The Torture Chamber
  description: >
    Adjacent to the dungeon is the citadels torture chamber.  While the dungeon had a rudimental
    assortment of torture devices, this room has the professional's assorment of excrutiation devices.  The
    Iron Maiden, the Rack, the Wheel, thumbscrews, are all represented here along with such classics as red
    hot pokers and the Chineese Water Torture.  Each device designed to inflict as much pain as possible.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:291:room:29181

"tba:291:room:29141":
  name: The Antechamber
  description: >
    The antechamber serves as the outer gathering area for the alter of the tower's chaple.  Off to one
    side are a row of pegs on which a few robs are hung.
  sector: inside
  exits:
    up:
      to: tba:291:room:29182

"tba:291:room:29142":
  name: The Black Forest
  description: You are in the Black Forest.  Blah Blah Blah Blah
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29120
    east:
      to: tba:291:room:29130
    south:
      to: tba:291:room:29117
    west:
      to: tba:291:room:29143

"tba:291:room:29143":
  name: More of the black forest
  description: >
    The Black forest extends as far as the eye can see.  Granted that's not too far, given how dense
    the forest is.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29148
    east:
      to: tba:291:room:29142
    south:
      to: tba:291:room:29115

"tba:291:room:29144":
  name: Disco Inferno!
  description: >
    This is the hot, hot dance floor that is the hub of Ed's Disco Palace.  If you want you can dance
    the night away and disco till your feet are blistered or you can just kill everything in sight here.
  sector: inside
  exits:
    east:
      to: tba:291:room:29114

"tba:291:room:29145":
  name: The Ruined Castle Keep
  description: >
    Once upon a time this was the most secure area in good King Haggard's castle.  Now the forces of
    the Citadel have defiled the marble court and sacked it.  It once famed secure walls now can barely
    protect themselves from the ravages of the elements.
  sector: inside
  exits:
    east:
      to: tba:291:room:29135
    south:
      to: tba:291:room:29138

"tba:291:room:29146":
  name: The Murky Mire
  description: >
    The Stream leads to a nautral pond.  It is not a clear or pure pond, murky pond scum floats in a
    fine skin over the surface.  This place approaces a swamp more than it does a pond.  This place is a
    prime breeding ground for mosquitoes and other stinging insects that buzz about your face.
  sector: forest
  exits:
    north:
      to: tba:291:room:29119
    south:
      to: tba:291:room:29147

"tba:291:room:29147":
  name: Ivy Island
  description: >
    This is a small patch of ground that pokes up over the surface of the murky mire.  It is little
    more than a patch of rock that is covered with poison ivy. There is little soil, but somehow the vines
    mamage to find enough food to survive.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29146

"tba:291:room:29148":
  name: Still More of the forest
  description: >
    You know the drill.  Can you tell that I was running low on my creative inspiration when I made
    this room?
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29149
    south:
      to: tba:291:room:29143

"tba:291:room:29149":
  name: Even more of the Black Forest
  description: >
    Does this accursed forest never end?  You press deeper and deeper into the seemingly endless cadre
    of oak trees that stand as omnious guardians to this dark place.  Press much further and you do not
    know if you will be able to find your way back.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:291:room:29199
    east:
      to: tba:291:room:29120
    south:
      to: tba:291:room:29148

"tba:291:room:29150":
  name: The Citadel antechamber
  description: >
    This is a high vaulted room that serves an the entryway to the citadel. The dark granite wals seem
    to absorb the light, yet strangely you can see rather easily.  Lining the walls are several statues
    each one made of fine marble and totally identical.  Each one depticts the mistress of the citadel in
    her rather imposing stance.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:291:room:29151
    west:
      to: tba:291:room:29129
      look: The gate stands as a barrier to your egress.
      door:
        keywords: [door, gate, portcullis, doors]
        kind: door
        reset: closed

"tba:291:room:29151":
  name: Inside the Citadel
  description: >
    Your footsteps echo off the walls as you tread through the halls.  The outer shell of the citadel
    stands as the maintainence and upkeeping fraction of this evil construct.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29152
    east:
      to: tba:291:room:29160
    south:
      to: tba:291:room:29155
    west:
      to: tba:291:room:29150

"tba:291:room:29152":
  name: The South end of the Hall of Mirrors
  description: >
    This is a long hall.  The walls have been covered with mirrors This gives the room the appearance
    of being many times larger than it is.  Occasionally a torch is mounted in a setting in the wall.  You
    can see the hall extending well to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29153
    south:
      to: tba:291:room:29151

"tba:291:room:29153":
  name: The North end of the Hall of Mirrors
  description: >
    This is a long hall.  The walls have been covered with mirrors This gives the room the appearance
    of being many times larger than it is.  Occasionally a torch is mounted in a setting in the wall.  You
    can see the hall extending to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29154
    south:
      to: tba:291:room:29152

"tba:291:room:29154":
  name: The Library
  description: >
    This chamber in the citadel is lines with rows upon rows of bookshelves. Most are thick
    leatherbound tomes.  Most haven't been used in months, or years A fine layer of dust has setteled on most of
    them.  The tiled floor, however is spotless.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:291:room:29156
    south:
      to: tba:291:room:29153

"tba:291:room:29155":
  name: The Master Armorer's Workshop
  description: >
    This room is where Durlak, The citadel's armorer, does his craft.  The room is unconfortably warm
    from the forge.  The walls are lined with the castle's guardians, the DoomGuard.  Most of them are in
    various stages of repair, to be worked on by Durlak.  Occasionally, one will walk into the room and
    stand by the wall waiting repair.  Occasionally one of the others will become active and begin its
    patrolling duties.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29151
    east:
      to: tba:291:room:29171

"tba:291:room:29156":
  name: In the Halls of the Citadel
  description: >
    The long vaulted hall extends in an east-west direction.  It serves to connect the Eastern complex
    and the Western one.  Your footsteps echo off the walls, reverbing, rebounding, resounding, refusing
    to die, as if they knew that to perish here is to risk eternal damnation.  Above you, supernatural
    flames forever dance in crystal orbs that hang suspended from the ceiling by wrougt iron chains.  The
    strange light these provide casts long shadows that envelop long tracts of hall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:291:room:29157
    west:
      to: tba:291:room:29154

"tba:291:room:29157":
  name: In the Halls of the Citadel
  description: >
    The long vaulted hall extends in an east-west direction.  It serves to connect the Eastern complex
    and the Western one.  Your footsteps echo off the walls, reverbing, rebounding, resounding, refusing
    to die, as if they knew that to perish here is to risk eternal damnation.  Above you, supernatural
    flames forever dance in crystal orbs that hang suspended from the ceiling by wrougt iron chains.  The
    strange light these provide casts long shadows that envelop long tracts of hall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29109
    east:
      to: tba:291:room:29158
    west:
      to: tba:291:room:29156

"tba:291:room:29158":
  name: The Gallery
  description: >
    This is the marble gallery.  A large square room filled with statues of every make and style. 
    Abstract and Bas Releif and Lifelike scuplture all are represented here in the gallery.  The marbled
    white walls almost seem to glow providing more than enough light to see by.  The statues seem to be
    writhing in pain.  Each one captured in a snapshot in time, displaying its agony for all to see.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:291:room:29188
    west:
      to: tba:291:room:29157

"tba:291:room:29159":
  name: The Observing tower
  description: >
    This is a large cylencrical room, made out of a tan stone of some form.  A large bonefire burning
    with an unnatural black flame burns in the middle of the room.  A staircase, built into the wall,
    spirals upward towards the observation chamber.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:291:room:29188
    south:
      to: tba:291:room:29174
    up:
      to: tba:291:room:29170

"tba:291:room:29160":
  name: The Room of 10,000 pillars
  description: >
    Standing before you are rows upon rows of evenly spaced marble columns. Arranged in a perfect
    square matrix, the two foot thick pillars stretch upward, reaching higher and higher until they
    dissappear, enveloped in the darkness high above where your light dares not reach.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:291:room:29164
    west:
      to: tba:291:room:29151

