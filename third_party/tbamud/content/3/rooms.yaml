          1 Sanctus                        at   362 (up   ) --->   139
          1 Sanctus                        at   365 (north) --->   101

"tba:3:room:301":
  name: Clerics Avenue
  description: >
    The cobblestone road is in decent shape, though a few stones have been overturned leaving gaping
    holes.  No wagons travel down this part of the city. Everyone knows clerics have no need for anything
    besides what they can provide by themselves.
  sector: city
  exits:
    north:
      to: tba:2:room:288
    south:
      to: tba:3:room:308

"tba:3:room:302":
  name: The Southern Road
  description: >
    This road passes underneath the inner city wall.  The surface turns into hard packed dirt.  To the
    north one may enter the inner city towards the Temple of Sanctus or go south towards the southern
    gate.  The southern half of the city consists of the magi and clerics' quarters.
  sector: city
  exits:
    north:
      to: tba:2:room:292
    south:
      to: tba:3:room:313

"tba:3:room:303":
  name: Magi Avenue
  description: >
    The Tower of the Magi lies to the southwest.  Just to the south one can see where the inner city
    wall turns to the west.  This avenue runs deep within the Magi's Quarter.  Accidents have been known to
    happen around here.  People must be careful for who knows what an inexperienced student may do.
  sector: city
  exits:
    north:
      to: tba:2:room:296
    south:
      to: tba:3:room:318

"tba:3:room:304":
  name: An Elegant Hall
  description: >
    Drawings of ancient battles in which the Magi slaughter their foes line both sides of the hallway. 
    Depicted on these drawings are a myriad of creatures ranging from ogres, orcs, goblins, and demons
    to humans, elves, and dwarves. One of the paintings looks oddly familiar.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:297
    east:
      to: tba:3:room:305
    south:
      to: tba:3:room:319

"tba:3:room:305":
  name: The Baths
  description: >
    The air is musky and hard to breathe due to the hot steam wafting from the large copper tubs filled
    with hot water.  A large fire with pots of water heating over it fills the eastern wall.  These
    baths are only to be used by the magi whom believe cleanliness is next to godliness.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:2:room:298
    south:
      to: tba:3:room:320
    west:
      to: tba:3:room:304

"tba:3:room:306":
  name: A large Bunk Room
  description: >
    Neatly made bunks are arranged in precise rows and colums filling the room from wall to wall. 
    Every rack is made precisely to standard, every sheet a pristine white, without even a speck of dust. 
    The Cleric's of Sanctus lead a disciplined life, second to none, not even the soldiers.
  sector: city
  exits:
    east:
      to: tba:3:room:307
    south:
      to: tba:3:room:321

"tba:3:room:307":
  name: A Long Hallway
  description: >
    The barren walls and floor would seem odd anywhere but here as the Clerics of Sanctus consider
    decorations, desires, or any form of unnecessary wants to be blasphemous.  They dedicate their lives to
    helping others, never themselves, and would all sacrifice their lives for that principle.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:300
    south:
      to: tba:3:room:322
    west:
      to: tba:3:room:306

"tba:3:room:308":
  name: The Southwest Intersection
  description: >
    The inner city wall ends here, as it reaches Clerics' Avenue, and continues on to the east.  A
    small road follows along the inner city wall just north of the Tower of the High Council which seems to
    glow because of its glaring brightness.
  sector: city
  exits:
    north:
      to: tba:3:room:301
    east:
      to: tba:3:room:309
    south:
      to: tba:3:room:323

"tba:3:room:309":
  name: Clerics Alley
  description: >
    Within the Clerics' Quarters an adventurer has very little to worry about. Even those would be
    vandals, pickpockets, and thugs shy away out of their respect of the clerics.  To be a cleric is to be
    respected second only to that of the Master Magi.
  sector: city
  exits:
    east:
      to: tba:3:room:310
    west:
      to: tba:3:room:308

"tba:3:room:310":
  name: Clerics Alley
  description: >
    The southern section of the inner city wall towers high above to the north. The massive
    fortification of rock and mortar is impressive, rising at least two or maybe three times the average man's
    height.  One can just make out a small walkway on the top of the wall, too bad only the guards know where
    the entrance is.
  sector: city
  exits:
    east:
      to: tba:3:room:311
    west:
      to: tba:3:room:309

"tba:3:room:311":
  name: Clerics Alley
  description: >
    The Tower of the High Council of Clerics is almost as impressive as the Temple of Sanctus.  They
    look very similiar, except of course the Tower is much smaller.  Far up in the tower you can see people
    walking by windows in white flowing robes.  The healers within are known for their miraculous
    abilities in restoring the wounded.
  sector: city
  exits:
    east:
      to: tba:3:room:312
    west:
      to: tba:3:room:310

"tba:3:room:312":
  name: Clerics Alley
  description: >
    The inner city wall opens up just to the east into the southern road which runs from the south gate
    directly to the heart of Sanctus inside the temple.  A few apprentice healers in flowing robes rush
    between the Temple and the Clerics' Quarters, no doubt on an errand from the Council.
  sector: city
  exits:
    east:
      to: tba:3:room:313
    west:
      to: tba:3:room:311

"tba:3:room:313":
  name: The Southern Road
  description: >
    A large gate has been built into the inner city wall here to allow adventurers to pass between the
    temple and the southern half of the city.  The clerics' quarters lie to the west while the magi
    quarters are to the east. Within their centers rises the Tower of the High Council of Clerics and the
    Tower of the Magi respectively.
  sector: city
  exits:
    north:
      to: tba:3:room:302
    east:
      to: tba:3:room:314
    south:
      to: tba:3:room:328
    west:
      to: tba:3:room:312

"tba:3:room:314":
  name: Magi Alley
  description: >
    The black Tower of the Magi casts an intimidating shadow over the surroundings and the underlying
    alley.  Within the tower lie many secrets that the average citizen is not privileged enough to be told
    about.  Rumors abound, especially about the Orb of Sanctum the gods left in the Master Magi's care.
  sector: city
  exits:
    east:
      to: tba:3:room:315
    west:
      to: tba:3:room:313

"tba:3:room:315":
  name: Magi Alley
  description: >
    The sound of voices from above are impossible to locate.  They could be coming either from on top
    of the inner city wall to the north or from an open window of the Tower of the Magi south of here. 
    The voices are too low to be discernable.
  sector: city
  exits:
    east:
      to: tba:3:room:316
    west:
      to: tba:3:room:314

"tba:3:room:316":
  name: Magi Alley
  description: >
    The inner city wall is used to separate the city into two separate battlefields.  In case of an
    attack by superior numbers the citizens will fall back into the inner city as a last measure of
    defense.  Luckily, the army has been very successful in protecting the city and it has never come to that.
  sector: city
  exits:
    east:
      to: tba:3:room:317
    west:
      to: tba:3:room:315

"tba:3:room:317":
  name: Magi Alley
  description: >
    This alley has reached the southeastern corner of the inner city wall where it turns north along
    the Magi Avenue.  The Tower of the Magi still looms heavy over the surroundings oppressively.  The
    sounds of voices echo between the tower and the inner city wall, very disturbing.
  sector: city
  exits:
    east:
      to: tba:3:room:318
    west:
      to: tba:3:room:316

"tba:3:room:318":
  name: The Southeastern Intersection
  description: >
    A small alley ducks between the Tower of the Magi and the southern section of the inner city wall. 
    The Magi Mansion lies just to the east, so extravagant that it is almost at the point of becoming an
    eyesore.  The Tower contains the fabled Orb of Sanctum, but few are ever lucky enough to lay their
    eyes on it.
  sector: city
  exits:
    north:
      to: tba:3:room:303
    south:
      to: tba:3:room:333
    west:
      to: tba:3:room:317

"tba:3:room:319":
  name: An Elegant Hall
  description: >
    Both sides of the hallway are covered from floor to ceiling in exquisite drawings.  All of them
    depicting various battles in which the Magi have fought in.  In the one in front of you the army of
    Sanctus stands on the verge of defeat, except for the constant bombardment of fireballs, lightning, and
    meteors hurled from the battlements by the Magi.
  sector: city
  exits:
    north:
      to: tba:3:room:304
    east:
      to: tba:3:room:320
    south:
      to: tba:3:room:334

"tba:3:room:320":
  name: The Kitchen
  description: >
    An assortment of foods are being prepared.  Some on small trays to be served as appetizers, and
    others in fine silver plates and containers.  The kitchen is cramped, too many things and too many
    people in one area.  The cooks look overworked and ready to revolt.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:305
    south:
      to: tba:3:room:335
    west:
      to: tba:3:room:319

"tba:3:room:321":
  name: A Room of Prayer
  description: >
    Candles are arranged along a set of shelves, some of which are burning, while others remain unlit. 
    Cushions are arranged along the floor facing the candles, so that one can give thanks for all that
    has been given in this simple room of prayer.  The walls are unadorned, everything looks to be plain
    and only used for its intended purpose.
  sector: city
  exits:
    north:
      to: tba:3:room:306
    east:
      to: tba:3:room:322
    south:
      to: tba:3:room:336

"tba:3:room:322":
  name: The Hall of Clerics
  description: >
    A long hallway carries on to the north.  It appears to run the length of the entire building.  The
    only source of light are lanterns spaced widely apart upon the walls which leave much of the hall in
    shadow.  The bare floor and walls show the lifestyle the clerics lead.
  sector: city
  exits:
    north:
      to: tba:3:room:307
    south:
      to: tba:3:room:337
    west:
      to: tba:3:room:321

"tba:3:room:323":
  name: Clerics Avenue
  description: >
    The entrance to both the Hall of Clerics and the Tower of the High Council are just to the south. 
    One can see a small intersection to the north where the inner city wall begins.  Many people come to
    this quarter to seek aid from the clerics, whether it be healing in the tower or to settle disputes
    within the Hall.
  sector: city
  exits:
    north:
      to: tba:3:room:308
    south:
      to: tba:3:room:338

"tba:3:room:324":
  name: A Training Room
  description: >
    Within this tower new clerics are taken to be trained in the art of healing. Very few are selected
    for this great honor, and even fewer ever achieve a mastery in the art of restoring health.  Several
    of the older clerics are here bestowing their knowledge and wisdom to their students.
  sector: city
  exits:
    east:
      to: tba:3:room:325
    south:
      to: tba:3:room:339

"tba:3:room:325":
  name: A Training Room
  description: >
    A rug lines the floor where several clerics in training listen intently to a gray-haired man who is
    drawing something on a board.  He often uses words of a different language that are very hard to
    follow and impossible to understand.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:3:room:326
    south:
      to: tba:3:room:340
    west:
      to: tba:3:room:324

"tba:3:room:326":
  name: A Training Room
  description: >
    A group of clerics in training surround a poor frightened white cat.  The cat is shivering in
    fright.  It seems to have broken its foot and the soon to be healers are practicing their skills on it. 
    Better than expirementing with live humans.
  sector: city
  exits:
    east:
      to: tba:3:room:327
    south:
      to: tba:3:room:341
    west:
      to: tba:3:room:325

"tba:3:room:327":
  name: An Advanced Training Room
  description: >
    A small child lay on a cot circled by several young clerics dressed in white robes.  One of them
    lays a gentle hand on the child's forehead causing the young boy to instantly fall asleep.  Another
    cleric takes the boys arm which has been badly bruised and possibly broken and begins chanting
    mysterious words.  The bruises fade away without a trace.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:3:room:342
    west:
      to: tba:3:room:326

"tba:3:room:328":
  name: The Southern Road
  description: >
    This path passes between the pristine Tower of the High Council of Clerics and the oppressive Tower
    of the Magi.  This section of the city has a very solemn feeling overshadowing it.  The magic of
    healing on one side and the magic of power and destruction on the other.
  sector: city
  exits:
    north:
      to: tba:3:room:313
    south:
      to: tba:3:room:343

"tba:3:room:329":
  name: The Training Room
  description: >
    Several apprentices sit patiently waiting for their next lesson.  Classes are held within this
    tower no matter what time of day.  The Magi are searching relentlessly for the next Master Magi.  They
    are short by two and the five existing are all old and nearly finished in their lives.
  sector: city
  exits:
    east:
      to: tba:3:room:330
    south:
      to: tba:3:room:344

"tba:3:room:330":
  name: The Training Room
  description: >
    The Magi within the tower train to help protect the city from invasion. Though the army is
    generally all that is required to handle most battles, the Magi are sometimes called upon to prevent heavy
    casualties or counter any magical abilities the attackers may possess.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:3:room:331
    south:
      to: tba:3:room:345
    west:
      to: tba:3:room:329

"tba:3:room:331":
  name: The Training Room
  description: >
    Several older students are sitting in on a class about the protective dome that upholds the balance
    within the city.  Mention of the Orb of Sanctus whispers around the room, and of how the gods
    bestowed it upon the Master Magi to preserve and protect.  Without the Orb the city would surely fall.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:3:room:332
    south:
      to: tba:3:room:346
    west:
      to: tba:3:room:330

"tba:3:room:332":
  name: The Training Room
  description: >
    A Master Magi overlooks several students as they pass between themselves a small flickering ball of
    light.  The Master Magi casts a stern eye over anyone watching and motions them away.  No one
    disagrees with a Master Magi, at least no one that wishes to live.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:3:room:347
    west:
      to: tba:3:room:331

"tba:3:room:333":
  name: Magi Avenue
  description: >
    The street narrows here as it passes between the tower and the mansion.  One can hear strange
    incantations coming from an open window in the black tower, far above the other buildings.  The Magi train
    young students within to take their place, but fewer and fewer meet the requirements and actually
    survive the training.
  sector: city
  exits:
    north:
      to: tba:3:room:318
    south:
      to: tba:3:room:348

"tba:3:room:334":
  name: The Foyier
  description: >
    The mansion surrounding you leaves your mouth agape from the luxuries the Magi have come to call
    their home.  Curtains of deep maroon velvet drape over the windows.  Rugs of the colors of the Magi
    line the floors.  Everything is spotless and well maintained.  Living here would be what many would
    consider as living the good life.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:319
    south:
      to: tba:3:room:349

"tba:3:room:335":
  name: A Back Hall
  description: >
    This part of the mansion is rarely used except by servants and students traveling unseen from one
    section of the mansion to another.  The Magi live an extravagant life and hold themselves to be very
    prestigious and elegant.  No one would ever dare call them otherwise.  The hall is unkempt and bare of
    any furnishings.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:320
    south:
      to: tba:3:room:350

"tba:3:room:336":
  name: An Emergency Shelter
  description: >
    The plain white plaster walls are devoid of all decoration.  Lining the walls are shelves holding
    bandages, slings, healing aids and other supplies in neatly arranged assortments.  The rest of the
    room is filled with empty cots and bunks which are used to rehabilitate the injured if there are ever
    more casualties than the tower can hold.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:321
    east:
      to: tba:3:room:337

"tba:3:room:337":
  name: The Hall of Clerics
  description: >
    This building holds the majority of the clerics within the city of Sanctus. It is here the High
    Council convenes to help citizens solve minor disputes. The building is barren of any luxuries.  That is
    the way a cleric must live, without desires or wants.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:322
    east:
      to: tba:3:room:338
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:3:room:336

"tba:3:room:338":
  name: The Clerics' Quarters
  description: >
    Large doors to the east and west lead into the Hall of Clerics and the Tower of the High Council
    respectively.  To the south a small shop displaying a sign with multi-colored herbs swings in the
    gentle breeze.  The Tower rises far above, its two spires reaching almost as high as the Temple.  In
    contrast the hall looks very mundane.
  sector: city
  exits:
    north:
      to: tba:3:room:323
    east:
      to: tba:3:room:339
    south:
      to: tba:3:room:351
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:3:room:337
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:3:room:339":
  name: The Tower of the High Council of Clerics
  description: >
    A large archway leads into the center of the Clerics' Quarters just to the west.  The Tower is
    bathed in bright white light that reflects off every surface.  All around, the soft murmur of healers in
    training or going about their daily routine can be heard.
  sector: city
  exits:
    north:
      to: tba:3:room:324
    east:
      to: tba:3:room:340
    south:
      to: tba:3:room:352
    west:
      to: tba:3:room:338

"tba:3:room:340":
  name: The Tower of Clerics
  description: >
    A wide staircase covered by a large tan rug leads up into the heart of the tower towards the High
    Council's chambers.  Many famous healers reside within this tower's magical walls.  It is said that
    just by standing in certain rooms of the tower one can heal at unnatural rates.
  sector: city
  exits:
    north:
      to: tba:3:room:325
    east:
      to: tba:3:room:341
    south:
      to: tba:3:room:353
    west:
      to: tba:3:room:339
    up:
      to: tba:1:room:128

"tba:3:room:341":
  name: The Tower of the Clerics
  description: >
    A wide set of stairs leads up to the second floor of the tower.  The building around you is
    impressive in both size and stature.  Large white pillars support high domed ceilings of this spotless white
    room.
  sector: city
  exits:
    north:
      to: tba:3:room:326
    east:
      to: tba:3:room:342
    south:
      to: tba:3:room:354
    west:
      to: tba:3:room:340
    up:
      to: tba:1:room:129

"tba:3:room:342":
  name: The Tower of the High Council of Clerics
  description: >
    The east end of the Tower opens into the Southern Road which passes between the Southern Towers and
    the Temple of Sanctus.  This junction lies at the entrance of the revered Tower of the High
    Council.  High above is where the councillors make many important decisions on how to uphold the welfare and
    health of the city.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:327
    east:
      to: tba:3:room:343
    south:
      to: tba:3:room:355
    west:
      to: tba:3:room:341

"tba:3:room:343":
  name: The Southern Road
  description: >
    The entrance to both towers of the southern half of Sanctus open before this part of the road.  To
    the west the Tower of the High Council of Clerics, to the east the Tower of the Magi.  Both
    impressive structures were built by both master architects and the use of magic.
  sector: city
  exits:
    north:
      to: tba:3:room:328
    east:
      to: tba:3:room:344
    south:
      to: tba:3:room:356
    west:
      to: tba:3:room:342

"tba:3:room:344":
  name: The Tower of the Magi
  description: >
    The black floor, walls, and ceiling of this tower bring about a feeling of oppression, as if
    something or someone is holding something deliberately back. A large doorway to the west leads to the
    Southern Road or it is possible to explore deeper into the temple to the east.
  sector: city
  exits:
    north:
      to: tba:3:room:329
    east:
      to: tba:3:room:345
    south:
      to: tba:3:room:357
    west:
      to: tba:3:room:343

"tba:3:room:345":
  name: The Tower of the Magi
  description: >
    A large spiral staircase winds up into the heart of the tower.  A slight tinge of sulphur hangs in
    the air, probably a spell that went haywire. Students roam the halls in deep thought, oblivious to
    the normal reality you live in.  Training Rooms lie in all directions.
  sector: city
  exits:
    north:
      to: tba:3:room:330
    east:
      to: tba:3:room:346
    south:
      to: tba:3:room:358
    west:
      to: tba:3:room:344
    up:
      to: tba:1:room:132

"tba:3:room:346":
  name: The Tower of the Magi
  description: >
    A pair of circular stairwells wind their way higher into the tower.  The sounds of people chanting
    echo off the pitch black walls that almost appear depthless.  Most likely a simple trick of the eye,
    but then again, maybe not.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:331
    east:
      to: tba:3:room:347
    south:
      to: tba:3:room:359
    west:
      to: tba:3:room:345
    up:
      to: tba:1:room:133

"tba:3:room:347":
  name: The Tower of the Magi
  description: >
    Everything is made from black stone, which at first glance appears to be marble, but upon closer
    examination has no grain within it.  Looking into the wood causes one to lose themselves as they peer
    further and further into the blackness.  It is impossible to tell if this is caused by magic or just a
    simple trick of the eye.  To the east is the center of the Magi Quarters.
  sector: city
  exits:
    north:
      to: tba:3:room:332
    east:
      to: tba:3:room:348
    south:
      to: tba:3:room:360
    west:
      to: tba:3:room:346

"tba:3:room:348":
  name: The Magi Quarters
  description: >
    This is the heart of the Magi Quarters.  The Magi Mansion where they can be found when they are not
    guarding the orb is to the east.  Also nearby is the pure black Tower of the Magi which houses the
    sacred orb that protects the city.
  sector: city
  exits:
    north:
      to: tba:3:room:333
    east:
      to: tba:3:room:349
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:3:room:361
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:3:room:347

"tba:3:room:349":
  name: The Magi Mansion
  description: >
    The walls are adorned in fancy draperies and expensive tapestries of every style and design
    imaginable.  The Magi believe in a life of service to their discipline, but they also believe that they
    should be able to live in comfort. This building is one of the most elaborate within the entire city.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:334
    east:
      to: tba:3:room:350
    west:
      to: tba:3:room:348
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:3:room:350":
  name: A Study
  description: >
    Three low hanging lanterns positioned over the rooms large tables illuminate the book-lined walls. 
    There are several chairs at each table so as to allow those who wish to study the fine art of magic
    to rest comfortably.  Several books lay open upon the tables.  Occasional trickles of smoke waft in
    from under the doorway to the east.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:335
    east:
      to: tba:3:room:366
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:3:room:349

"tba:3:room:351":
  name: The Healer's Shop
  description: >
    Small indoor gardens have been set up within this small house to grow the herbs required for the
    mixes and salves the clerics require.  They are rumored to sometimes sell some of their remedies,
    though this is very rare and at a very steep price.
  sector: city
  exits:
    north:
      to: tba:3:room:338
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:3:room:352":
  name: Clerics in Training
  description: >
    Several beds lie in columns and rows spaced evenly apart.  The smell of some form of antiseptic
    stings in the air.  All the beds are empty, must be the healers here are well-versed in their craft. 
    The Temple continues to the north and west.
  sector: city
  exits:
    north:
      to: tba:3:room:339
    east:
      to: tba:3:room:353

"tba:3:room:353":
  name: A Large Basin
  description: >
    A large basin of water lies against the southern wall.  Small statues portraying a woman and
    children playing on a river's edge surround the edge of basin.  The water inside the basin is extremely
    clean and sterily, likely used by the the clerics to tend for the wounded.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:340
    east:
      to: tba:3:room:354
    west:
      to: tba:3:room:352

"tba:3:room:354":
  name: Clerics' Hallway
  description: >
    The smell of exotic medicines fills the entire tower.  A large open area to the north, the center
    of the tower, holds a set of stairs leading higher up into the tower.  Small benches line the walls
    here, allowing people to rest from their adentures.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:341
    east:
      to: tba:3:room:355
    west:
      to: tba:3:room:353

"tba:3:room:355":
  name: A Waiting Room
  description: >
    Benches filled with people waiting to see a healer line the walls here.  An apprentice does what he
    can to aid these poor people, but it is obvious that many of them need to be attended to shortly by
    a real healer or else they may perish.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:342
    west:
      to: tba:3:room:354

"tba:3:room:356":
  name: The Southern Road
  description: >
    To the east the Tower of the High Council of Clerics glows a bright white, its polished surfaces
    reflecting all light down onto the Clerics' Quarters which it protects.  To the west the Tower of the
    Magi does the exact opposite, seeming to absorb all light surrounding it.  There must be balance in
    all things.
  sector: city
  exits:
    north:
      to: tba:3:room:343
    south:
      to: tba:3:room:362

"tba:3:room:357":
  name: The Magi Training Room
  description: >
    Bookshelves line the two walls of this small open area within the tower. The smell of dust and
    musty old papers emanates from them.  Many centuries of knowledge lie within these books that were
    salvaged from the lands beyond. Many more have yet to be found.
  sector: city
  exits:
    north:
      to: tba:3:room:344
    east:
      to: tba:3:room:358

"tba:3:room:358":
  name: A Tower Hallway
  description: >
    Through a small door to the north one can see the center of the tower where a set of spiral
    staircases lead to the second floor.  The Orb of Sanctum is protected somewhere within this tower.  The
    Master Magi have been given the task of ensuring its safety.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:345
    east:
      to: tba:3:room:359
    west:
      to: tba:3:room:357

"tba:3:room:359":
  name: The Magi Hallway
  description: >
    The seven Orders of the Magi are slowly dying out.  That is why they rarely fight in battles any
    longer.  They have instead devoted their time to training future Magi to take their places.  But, good
    students have become even harder to come by these days.
  sector: city
  exits:
    north:
      to: tba:3:room:346
    east:
      to: tba:3:room:360
    west:
      to: tba:3:room:358

"tba:3:room:360":
  name: A Magi Training Room
  description: >
    Short tables with cushions surrounding them are placed about the room. These cushions are obviously
    meant to kneel on and the tables are overflowing with various books.  This must be some sort of
    study room for the Magi.  The black walls seem to absorb the white light coming from strange bulbs
    hanging from the ceiling.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:3:room:347
    west:
      to: tba:3:room:359

"tba:3:room:361":
  name: Sareth's Scrolls
  description: >
    The smell of old paper that is slowly crumbling to dust fills the room. Thousands of books, scroll,
    parchments, and even some tablets fill the bookshelves, tables and the floor of this under sized
    room.  It is here a vast amount of the Magi have left thei findings when delving into the depths of
    their magic.
  sector: city
  exits:
    north:
      to: tba:3:room:348
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:3:room:362":
  name: The Southern Gate
  description: >
    The heavily fortified passage between the gate and the wilderness beyond is well protected against
    an attack.  Lookouts can be heard above chatting idly while the sentinel guards stand at attention
    waiting to be called into action.
  sector: city
  exits:
    north:
      to: tba:3:room:356
    west:
      to: tba:3:room:363
    up:
      to: tba:1:room:139

"tba:3:room:363":
  name: The Stables
  description: >
    The smell of hay and manure clings to the room like a cheap cologne somebody's grandmother might
    wear.  Stalls line both sides of the cramped building with bales of hay stacked everywhere.  The horses
    can't reach the hay though they all seem to still try.  It is possible to buy a horse for a minimal
    fee, but not all of them are well tamed and have been known to become ornery.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:3:room:362

"tba:3:room:364":
  name: PETSHOP STOREROOM
  description: >
    To make a pet shop you need two rooms and some pets. The rooms MUST be sequential. If the first
    room is 3015 then the second must be 3016. The second room is known as the storeroom. All that is
    required in the storeroom is to load one of each mob you wish to be a pet. This room can not have any exits
    and will never be used by mortals. Although a pet shopkeeper is not required it is recommended. In
    order to implement a pet shop the actual mud code has to be modified. Just ask Rumble to do it for you.
  sector: city
  flags: [godroom]

"tba:3:room:365":
  name: On the Window Ledge
  description: >
    From this perilous perch an excellent view is available of the southern half of the city.  A gust
    of wind howls past threatening to pull anything along with it.  The only exit is back into the tower
    or a deadly jump to the cobblestone road below.
  sector: city
  exits:
    north:
      to: tba:1:room:101

"tba:3:room:366":
  name: The Lab
  description: >
    The room is covered in shadow and what little that can be seen is a clutter of books, scrolls, and
    potions. The entire room is scarred from fire and a fine ash covers everything. Smoke still lingers
    in the rafters overhead.
  sector: inside
  exits:
    west:
      to: tba:3:room:350
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:3:room:367":
  name: Hazel's Living Quarters
  description: >
    The room is cluttered with various water container and filtration canisters overflowing the desks
    and shelves.  A small cot is crowded into one corner. Though there is very little room to move around
    the room is surprisingly clean and well kept.  A single door leads down to the shop below.
  sector: inside
  flags: [indoors, private]
  exits:
    down:
      to: tba:2:room:225
      door:
        keywords: [door]
        kind: pickproof
  extras:
  - keywords: [sky, winds]
    text: Cold winds plunge ceaselessly at you from the dark, cloudless sky.
  - keywords: [floor]
    text: >
      The stone floor is the same shade of gray as the sky and is completely plain and unscratched. It is
      probably too hard for anything to leave as much as a scratch on it.

"tba:3:room:391":
  name: Bomber's Trial Vnum
  description: You are in an unfinished room.
  sector: inside

"tba:3:room:399":
  name: Welcome to the Builder Academy
  description:
  - >
    A builder is a term usually used to describe a person who designs MUD zones for other characters to
    explore. Any player with motivation, ideas, and good writing style can be a builder as well as a
    player. As a Builder, your job is to create the virtual world in which players can roam around, solve
    puzzles, find treasures, and gain experience. A Builder creates the rooms, objects, mobs, shops, and
    triggers with which players will interact.
  - >
    If this is something you are interested in doing then you have come to the right place. Be warned,
    building is not easy and will require hard work, patience, and the ability to take constructive
    criticism.
  - "Your first task is to apply for builder status at: http://tbamud.com/"
  - >
    When you finish and submit the application tell anyone level 32 or higher and they will advance you
    to begin your training.
  - If would like to check out the tbaMUD World as a player connect to tbamud.com 4000.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:0:room:3
