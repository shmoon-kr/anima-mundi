# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 3.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:3:room:300":
  name: A Long Hallway
  description: >
    The hall stretches north and south.  Lanterns set in brackets along the wall offer ample lighting. 
    The smokeless kerosene that is used leaves a strange smell.  The Hall is bare, only a few small
    paintings cover the walls.  Clerics have very little need for decorations of any kind.  A small waiting
    room is to the west.
  sector: city
  exits:
    north:
      to: tba:2:room:287
    south:
      to: tba:3:room:307
    west:
      to: tba:2:room:299
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 3 Sanctus III
        Related Zones: 1 Sanctus, 2 Sanctus II
        Began        : 2000
        Player Level : 1-34
