# keywords: words to name it in commands; short: in sentences ("the pit beast"); long: its line in a room.
# combat.armor is tbaMUD's armor class / 10 (lower is better); hit_points and damage: a number, or dice NdS+B when rolled.
"tba:3:mob:300":
  keywords: [chemist, camille]
  short: Camille the chemist
  long: Camille the chemist stands over a cauldron mixing ingredients.
  description: >
    Camille wears a thick brown robe that covers most of her features. Only her hands and head stick
    out of her robe. Stains and burns cover her body and clothing. She works diligently over her cauldron.
    Camille has been known to concoct many different potions and is most famous for her liquid fire.
  level: 30
  sex: female
  alignment: 0
  flags: [sentinel, no_charm, no_summon, no_sleep, no_bash, no_blind]
  combat:
    thac0: 10
    armor: -8
    hit_points: 6d6+300
    damage: 5d5+5
  gold: 300
  exp: 90000
  position:
    load: standing
    default: standing
  triggers: [tba:3:trg:300, tba:3:trg:335]

