"tba:41:room:4125":
  name: The Passage
  description: >
    You are at the end of a narrow passage which leads away from here to the north.  The southern wall
    is bare and almost seems to dance with the shadows created by the flickering light emanating from the
    cave to the east.
  sector: forest
  flags: [indoors]
  exits:
    north:
      to: tba:41:room:4120
    east:
      to: tba:41:room:4124

"tba:41:room:4126":
  name: The Crawlway
  description: >
    You are in a very narrow crawlway.  To back out of it, you would have to move carefully in order to
    not catch anything on the jutting rocks of the ceiling and walls.  The diameter of the crawlway is
    about two feet, and is a rather tight squeeze.  You'd better hope that there aren't any worms or
    similar creatures down this way since it might be difficult to defend yourself in here.
  sector: mountains
  flags: [dark, no_mob, indoors, soundproof, no_track, tunnel, private]
  exits:
    north:
      to: tba:41:room:4111
      look: You can see a small hole marking the north exit of the crawlway.
    south:
      to: tba:41:room:4118
      look: You can see the light emanating from the southern exit of the crawlway.
