        kind: door
        reset: closed

"tba:41:room:4120":
  name: The Passage
  description: >
    You stand in a fairly normal passage, slightly wider than is necessary for one person, but not
    quite wide enough for two.  The ceiling dips here rather surprisingly, or wait, is that because the floor
    climbs upwards toward it?  The tunnel seems to narrow slightly more as you look to the south, and
    widens up somewhat as you look northward.  The light to the south continues to flicker.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:41:room:4116
    south:
      to: tba:41:room:4125
  extras:
  - keywords: [light]
    text: It nearly is enough to light the passage.

"tba:41:room:4121":
  name: The Secret Tunnel
  description: >
    You stand in a very unnatural hallway, about ten feet across and about ten or twelve feet up.  The
    passageway funnels down towards the west where it leads to a doorway that looks to be about five feet
    across.  The east end of the tunnel comes to a sudden end at a very smooth rock wall.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:41:room:4119
      look: The rock wall to the east looks like it might be able to be moved.
      door:
        keywords: [wall, rock]
        kind: door
        reset: closed
    west:
      to: tba:41:room:4122
  extras:
  - keywords: [wall, rock]
    text: The rock wall to the east looks like it might be able to be moved.

"tba:41:room:4122":
  name: The Secret Chamber
  description: >
    You stand in a small chamber that you never would have thought could exist.  This small, almost
    perfectly round cave does not appear to be a natural formation at all, since the walls are far too
    smooth and the doorways to the north and east are both almost exactly five feet wide and eleven feet tall.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:41:room:4117
    east:
      to: tba:41:room:4121

