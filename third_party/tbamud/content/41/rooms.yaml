  name: The Cave
  description:
  - >
    This rather large cave is surprisingly very well lit.  There are about twenty torches spread about
    the room set in sconces which hang several feet above your head.  The dancing shadows created by the
    flickering flames catch your eyes for a few minutes and threaten to hold you entranced.
  - Looking about the cave, it appears to continue to the east and south.
  sector: city
