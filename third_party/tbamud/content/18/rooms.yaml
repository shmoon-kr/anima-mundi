"tba:18:room:1813":
  name: Resistance Force Headquarters
  description: >
    This army lives in a eternal state of war, a few soldiers are sleeping on the floor around you. 
    Weapons still in hand.  Some of them don't even look old enough to shave.
  sector: inside
  exits:
    north:
      to: tba:18:room:1814
    west:
      to: tba:18:room:1838

"tba:18:room:1814":
  name: Resistance Force Headquarters
  description: >
    Two children sit here watching a fire flickering in the blown out case of an old television set,
    they are covered in dirt and grime.  They look hopeless.
  sector: inside
  exits:
    north:
      to: tba:18:room:1815
    south:
      to: tba:18:room:1813
    west:
      to: tba:18:room:1839

"tba:18:room:1815":
  name: Resistance Force Headquarters
  description: >
    More soldiers are sleeping in any available spot on the floor, a few are even huddled around a fire
    barrel.  A slogan has been scratched into the east wall.
  sector: inside
  exits:
    north:
      to: tba:18:room:1816
    south:
      to: tba:18:room:1814
    west:
      to: tba:18:room:1840
  extras:
  - keywords: [slogans, wall, east]
    text: Live free or die.

"tba:18:room:1816":
  name: Resistance Force Headquarters
  description: >
    The wounded are stretched out before you, it looks like they are losing this war.  Even in their
    worst hour some still seem to have hope.  Another slogan is on the east wall.
  sector: inside
  exits:
    north:
      to: tba:18:room:1817
    south:
      to: tba:18:room:1815
    west:
      to: tba:18:room:1841
  extras:
  - keywords: [slogan, wall, east]
    text: We created them, we can destroy them.  We created them, we can destroy them.

"tba:18:room:1817":
  name: Resistance Force Headquarters
  description: >
    More of the wounded are being cared for here.  A few of them look up at you hopefully as you pass. 
    They are becoming desperate and need all the help they can get.
  sector: inside
  exits:
    south:
      to: tba:18:room:1816
    west:
      to: tba:18:room:1842

