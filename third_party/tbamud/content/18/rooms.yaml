# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 18.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:18:room:1800":
  name: Nuclear Wasteland
  description: >
    Thick layers of slightly radioactive cumulus prevent any light from coming through.  Heaps of
    fire-blackened human bones and skulls are scattered amid shattered concrete and fire-gutted cars. 
    Something is scratched onto the hood of one of the burnt cars.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:18:room:1801
    west:
      to: tba:18:room:1825
  extras:
  - keywords: [hood, sign, info, credits]
    text:
      preformatted: |2
           This area created by the warped imagination of Rumble.
        Builder      : Rumble
        Zone         : 18 Nuclear Wasteland
        Began        : 1997, one of my first zones.
        Player Level : 30-34
        Rooms        : 82
        Mobs         : 13
        Objects      : 3
        Shops        : 0
        Triggers     : 0
        Theme        : Futuristic Fantasy
        Plot         : After the book/movie the Terminator.
        Links        : 00es

