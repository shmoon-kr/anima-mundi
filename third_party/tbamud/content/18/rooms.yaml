"tba:18:room:1863":
  name: Nuclear Wasteland
  description: >
    You walk between two toppled sky scrapers, a path leads north and south.  You see the remains of a
    playground, the outlines of playing children are flash-burned into the concrete.
  sector: inside
  exits:
    north:
      to: tba:18:room:1864
    south:
      to: tba:18:room:1862

"tba:18:room:1864":
  name: Entrance
  description: >
    The fallen sky scrapers are closing the path to the north, but you see a open door, partially
    covered by a large granite slab with some writing on it.  It is unreadable.
  sector: inside
  exits:
    north:
      to: tba:18:room:1865
    south:
      to: tba:18:room:1863

"tba:18:room:1865":
  name: Cyberdyne Building
  description: >
    A massive office lays in ruins, dozens of computers are in ruins.  Once precisely cluttered
    cubicles are shredded and blocking all paths except to the north or south.
  sector: inside
  exits:
    north:
      to: tba:18:room:1866
    south:
      to: tba:18:room:1864

"tba:18:room:1866":
  name: Cyberdyne Building
  description: >
    You walk deeper into the complex, past broken security cameras and through open security doors. 
    Not a single sound reaches your ears.  Not much point on walking to the end of this building, is there?
  sector: inside
  exits:
    north:
      to: tba:18:room:1867
    south:
      to: tba:18:room:1865

"tba:18:room:1867":
  name: Cyberdyne Building
  description: >
    More computers and technical gadgetry lie throughout the room.  All broken and useless.  Charred
    human bodies still sit at the desks, the building was almost thick enough to save them.
  sector: inside
  exits:
    north:
      to: tba:18:room:1868
    south:
      to: tba:18:room:1866

"tba:18:room:1868":
  name: Cyberdyne Building
  description: >
    You work your way deeper into the complex, less and less damage is evident.  Except for the fact
    that every piece of electronic equipment is fried beyond repair.  A few bodies lay in the middle of the
    room.  Strange, they should have survived the blast this deep in the building.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:18:room:1869
    south:
      to: tba:18:room:1867

"tba:18:room:1869":
  name: Cyberdyne Building
  description: >
    Besides from some small fires caused by the computers in the room, this area was unaffected by the
    blast.  But there are still bodies laying everywhere.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:18:room:1870
    south:
      to: tba:18:room:1868

"tba:18:room:1870":
  name: Cyberdyne Lab
  description: >
    You enter through a large door that was blasted open into a huge lab with mechanical wonders from
    this era.  All seem to powerless and unused for quiet some time.
  sector: inside
  flags: [bfs_mark]
  exits:
    south:
      to: tba:18:room:1869

"tba:18:room:1871":
  name: Skynet Storage
  description: >
    There are rows upon rows of naked human bodies, hanging on steel racks suspended from the ceiling. 
    They are all absolutely identical.  All are Terminators.
  sector: inside
  exits:
    west:
      to: tba:18:room:1896

"tba:18:room:1875":
  name: Nuclear Wasteland
  description: >
    The nuclear tundra continues to the north and east the south is blocked by a river overflowing with
    dead fish, animals and human bodies.  To the west is the open ocean, dead fish line the beach for
    miles.
  sector: inside
  exits:
    north:
      to: tba:18:room:1876
    east:
      to: tba:18:room:1850

"tba:18:room:1876":
  name: Nuclear Wasteland
  description: >
    The nuclear tundra continues in all directions but west, which is blocked by the open ocean, dead
