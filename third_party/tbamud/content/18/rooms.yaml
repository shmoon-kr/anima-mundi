"tba:18:room:1838":
  name: Resistance Force Headquarters
  description: >
    Your eyes sting from the haze of smoke as you enter the Guerilla hideout.   A pair of German
    Shephards sniff you urgently, then ignore you. The Guerilla Officer waves you on.
  sector: inside
  exits:
    north:
      to: tba:18:room:1839
    east:
      to: tba:18:room:1813
    south:
      to: tba:18:room:1837
      door:
        keywords: [door]
        kind: door
        key: tba:18:obj:1803
        reset: closed

"tba:18:room:1839":
  name: Resistance Force Headquarters
  description: >
    Soldiers are standing here in precise rows.  It looks like they are getting ready for an invasion. 
    They look at you with a glimmer of hope in their eyes that maybe you'll help them.
  sector: inside
  exits:
    north:
      to: tba:18:room:1840
    east:
      to: tba:18:room:1814
    south:
      to: tba:18:room:1838

"tba:18:room:1840":
  name: Resistance Force Headquarters
  description: >
    More soldiers are here preparing for an invasion.  They look already defeated.  Some children stand
    close by, carrying equipment, weapons and ammo for the troops.
  sector: inside
  exits:
    north:
      to: tba:18:room:1841
    east:
      to: tba:18:room:1815
    south:
      to: tba:18:room:1839

"tba:18:room:1841":
  name: Resistance Force Headquarters
  description: >
    The wounded are being tended for here.  Some who are beyond help are being led outside to fight
    their final battle.  Better to die fighting than slowly in a hospital bed.
  sector: inside
  exits:
    north:
      to: tba:18:room:1842
    east:
      to: tba:18:room:1816
    south:
      to: tba:18:room:1840

"tba:18:room:1842":
  name: Resistance Force Headquarters
  description: >
    More wounded are gathered here.  Any who are no longer fit to fight or carry equipment are being
    led outside.  Easier to dispose of a body in a battle field than having to remove them from here to
    prevent the spread of disease.
  sector: inside
  exits:
    north:
      to: tba:18:room:1843
    east:
      to: tba:18:room:1817
    south:
      to: tba:18:room:1841

"tba:18:room:1843":
  name: Resistance Force Headquarters
  description: >
    Computers line the walls and technicians are punching away at keyboards.  They seem to be trying to
    decipher something on their screens.  To the north you hear people arguing.
  sector: inside
  exits:
    north:
      to: tba:18:room:1844
    south:
      to: tba:18:room:1842

"tba:18:room:1844":
  name: Resistance Force Headquarters
  description: >
    A map of the area lays on a large table in the middle of the room. Several officers are looking
    over the map and listening intently to every word that one man tells them.  The leader of this force is
    standing over the map giving orders.
  sector: inside
  exits:
    south:
      to: tba:18:room:1843

