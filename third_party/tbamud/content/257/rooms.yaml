# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 257.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:257:room:25700":
  name: Maris' Armory
  description: >
    You stand in Maris' Armory, self proclaimed finest armory in all Jareth. An ornate but servicable
    looking counter makes an 'L' shape around a door which appears to lead into a rear service and holding
    area.  Shields adorn the walls, all polished to a bright gleam, and a suit of armor stands
    attentively on a pedestal to the right of the counter.  There is a plaque on the front of the pedestal
    labelling the suit to be the 'Authentic Armor worn by an Ionion Knight during the 2nd Crusade'.  A sign on
    the front of the counter reads; Better to die on your feet than live on your knees.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25701
      look: You see the exit to North Bourbon St.
  extras:
  - keywords: [credits]
    text:
      preformatted: |2
           Jareth by Kaan for Dibrova
        Jareth was my very first zone, which I stupidly used zone #30 as my vnum
        base.  I figured that overwriting would be easier and I could use the
        existing info for reference as I was writing offline at the time and was
        pretty confused as to how the files were set up.  I was wrong about it
        being easier and I don't suggest that route for anyone new to building ;-)
        Jareth has all the amenities of a hometown with a couple of added features.
        There is the Casino off the Boardwalk - look for the snippet if you need it
        on the snippet page - where players can try their luck and see if they can
        make some money the old fashioned way.  There is a blood bank near the
        Temple where a player can give blood, losing some hp, but gaining some cash.
        The cash is minimal and the hp drain is too, but for a newbie, anything helps.
        This was to be our main town for all of Dibrova, however with a bit of
        whining and a lot of persuasion, we went the route of allowing players to
        choose their hometown at the main menu and unfortunately most do not choose
        this wondrous metropolis.
        Please forgive if any objs or mobs are close to Midgaard's - in my defense
        I say that is WAS my first zone, and I was very in the dark on how a mud
        worked at all at the time.
        
        Zone 257 is linked to the following zones:
        258 Light Forest                   at 25729 (east ) ---> 25803
        263 Farmlands                      at 25756 (west ) ---> 26300
         33 Three of Swords                at 25771 (north) --->  3301
        
        Links: 13n
        Postmaster: 83

"tba:257:room:25701":
  name: North Bourbon St.
  description: >
    You are on a wide promenade which stretches north and south for quite some distance.  This seems to
    be one of, if not the, main thoroughfare for the city of Jareth.  Shops line both sides of the
    street, offering an abundance of choices for any traveller in need of supplies.  To the south it appears
    that the street meets another street of similar size and opens into a large sqare.  To the east you
    see a weapons shop and to the west you see an armor shop.  Quite convenient, wouldn't you say? 
    Obviously, Maris the arms dealer thinks so, too, since his name is on both store fronts, proclaiming him the
    procurer of the finest armor and weapons in all of Jareth.
  sector: city
  exits:
    north:
      to: tba:257:room:25754
      look: Looking north you see Bourbon Street stretch off into the distance.
    east:
      to: tba:257:room:25763
      look: You see Maris' Weaponry.
    south:
      to: tba:257:room:25705
      look: You see the City Proper.
    west:
      to: tba:257:room:25700
      look: You see Maris' Armory.

"tba:257:room:25702":
  name: Floris Avenue
  description: >
    You stand on a long road which runs east to west.  Inns, taverns, and all manner of shops line both
    sides of the avenue.  To the south you see Clariss' Concoctions, a brewery specializing in potions
    to aid the wandering adventurer. To the north you see The Bootery.  It appears that to the east, the
    avenue opens into a large square of some kind, while to the west Floris Avenue runs uninterrupted.
  sector: city
  exits:
    north:
      to: tba:257:room:25733
      look: You see the entrance to the Bootery.
    east:
      to: tba:257:room:25713
      look: You see Floris Ave. continuing east.
    south:
      to: tba:257:room:25717
      look: You see the entrance to Clariss'.
    west:
      to: tba:257:room:25740
      look: Floris Ave opens into a square.

"tba:257:room:25703":
  name: Floris Ave
  description: >
    Floris Ave continues east and west, with the East Gate only a block away. To the north you may
    enter the Constabulary, the main office and station of Jareth's law enforcemnt professionals.  To the
    south begins Worship Way, the road leading to Jareth's famed Temple of All and None.
  sector: city
  exits:
    north:
      to: tba:257:room:25768
      look: You see the main office of the Constabulary.
    east:
      to: tba:257:room:25750
      look: Floris Ave runs east.
    south:
      to: tba:257:room:25741
      look: Worship Way runs south.
    west:
      to: tba:257:room:25707
      look: Floris Ave runs west.

"tba:257:room:25704":
  name: Blood Bank
  description: >
    This small but servicable room houses the Blood Bank, a non-profit Jareth community service set up
    so that wayward adevnturers who get a bit too over- zealous in their wanderings can be treated
    properly in Jareth's hospital. Because it is a non-profit service, the room is not designed for comfort but
    to accomplish it's purpose.  A slightly reclined chair sits in the center of the room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25760
      look: You may enter onto Worship Way.
  triggers: [tba:257:trg:25705]

"tba:257:room:25705":
  name: Jareth City Proper
  description: >
    You are standing in what appears to be the center of this massive city.  All around you the hustle
    and bustle of city life carries on, paying no notice to you whatsoever.  To the north, Bourbon street
    continues to a dead end at the river bank, to the south Bourbon St.  Offers a slew of inns and
    taverns, and east and west Floris St lines itself with shops of every description.
  sector: city
  exits:
    north:
      to: tba:257:room:25701
      look: Bourbon St heads north from here.
    east:
      to: tba:257:room:25706
      look: Floris Ave heads east from here.
    south:
      to: tba:257:room:25714
      look: Boubon St heads south from here.
    west:
      to: tba:257:room:25713
      look: Floris Ave heads west from here.

"tba:257:room:25706":
  name: Floris Ave
  description: >
    Floris Ave continues unabated for as far as your sight will allow.  To your north you see an
    entrance to Maris' Weapon Shop, and to your south lies an entrance to the Kitty-Kat Club, a local fine
    dining and entertainment establishment.
  sector: city
  exits:
    north:
      to: tba:257:room:25763
      look: You see the entrance to Maris' Weaponry.
    east:
      to: tba:257:room:25707
      look: Floris Ave. continues east.
    south:
      to: tba:257:room:25715
      look: You see the entrance to the Kitty Kat Club.
    west:
      to: tba:257:room:25705
      look: You see the City Proper.

"tba:257:room:25707":
  name: Floris Ave
  description: >
    Here Floris St seems to be at it's finest.  The streets is kept clean and looks to have been
    recently swept free of the usual clutter and debris you find on the streets of Jareth.  The Jareth City
    Bank lies to the north, a beautiful building with worked stone, polished glass, and a great deal of
    copper trimming. To the south lies the entrance to the City Provisioner.  Any and all foodstuffs needed
    can be purchased in his shop.  East and west Floris Ave continues.
  sector: city
  exits:
    north:
      to: tba:257:room:25711
      look: You may enter Jareth City Bank to the north.
    east:
      to: tba:257:room:25703
      look: Floris Ave runs east.
    south:
      to: tba:257:room:25716
      look: The town provisioner's shop.
    west:
      to: tba:257:room:25706
      look: Floris Ave runs west.

"tba:257:room:25708":
  name: The Reception
  description: >
    You are standing in the reception.  The staircase leads down to the entrance hall.  An exit to the
    north leads to the Cryogenic Center.  There is a small sign on the counter.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25764
      look: You see the Cryogenic Center.
    down:
      to: tba:257:room:25706
      look: You see the entrance hall.
  extras:
  - keywords: [sign]
    text:
    - "Rooms are expensive but good!  You may:"
    - Offer - get an offer on a room - Time is in real life days.
    - Rent  - Rent a room (saves your stuff, and quits the game),
    - minimum charge is one day.
    - MY WAY OR THE HIGHWAY
    - PAY YOUR RENT!
    - WE WON'T THINK TWICE BEFORE KICKING YOU OUT.

"tba:257:room:25709":
  name: The Wellmaster
  description: >
    Here in the shop of the town watermaster one can buy a miriad of containers holding the cleanest,
    purest, and sweetest tasting water in Jareth.  This is true, but mostly because it's the only shop in
    Jareth that sells purified water. The wellmaster stands in the center of his shop, hands on his ample
    belly, waiting for your pleasure.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25754
      look: You see the exit out to Bourbon St.

"tba:257:room:25710":
  name: Captain Vulcevic's Boat House
  description: >
    This leaning, ramshackle, single story wooden structure perched on the edge of the river is the
    proud home and shop of Captain Vulcevic, formally an admiral in Lord Eyeball's Royal Fleet.  Vulcevic
    retired from duty when a sudden squall took the not only his ship, but most of his crew to the icy
    bottoms of the Polarinus.  There are all manner of nets, buckets of tar, boxes of nails, and other
    paraphenalia for the repair of river and sea going vessels.  A cot hangs in one corner, obviously
    Vulcevic's bed.  There is no counter or area where one would expect to get helped, so you must just wait upon
    the Captain for his appearance.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:257:room:25759
      look: You see River St.

"tba:257:room:25711":
  name: Jareth City Bank
  description: >
    A true work of art in every sense, this building is obviously the proud work of an architect who
    takes great pride in his or her work.  Stone pillars rise from four equidistant locations in the floor,
    tapering in the center while being wide as a full grown Gold Dragon on the tops and bottoms.  The
    enormously high cathedral ceiling offers a beautiful stained glass rendition of the Holy Wars which
    Lord Krolar led those hundred years ago against the foul Goblin Hordes. A line of tellers stand behind
    the main counter, a beautiful cherry oak work of art intricately carved and inlaid with what looks to
    be gold.  A large iron door built into the northernmost door behind the tellers leads to what must be
    the vault, although this is only conjecture because at this time the door stands closed, and it
    looks as though it would take Dibrova's most skillful lockpick and the strength of ten giants to open
    it.  South is the exit to Floris Ave.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    south:
      to: tba:257:room:25707
      look: You see Floris Ave.

"tba:257:room:25712":
  name: River St
  description: >
    You stand on River St.  To your north you can head south into the central part of Jareth, south is
    a Constable's Outpost.  To the east is the Jeweler and to the west is the Mage's Guild.
  sector: city
  exits:
    north:
      to: tba:257:room:25742
      look: River St continues north.
    east:
      look: You see the entrance to the Jeweler.
    south:
      to: tba:257:room:25757
      look: The constable's Outpost looms ominously before you.
    west:
      to: tba:257:room:25737
      look: The entrance to the Mage's Guild.

"tba:257:room:25713":
  name: Floris Avenue
  description: >
    You are strolling along one of the larger avenues in Jareth.  The road runs east to west, with what
    looks to be the town square to the east and many shops to the west.  To the north is the wall of a
    shop with murals of gallant knights in battle and damsels in distress waving white handkerchieves.  To
    the south is the northernmost wall of Grainy's Tavern, famous for their malt liquor and great
    entertainment.
  sector: city
  exits:
    east:
      to: tba:257:room:25705
      look: You see the City Proper.
    west:
      to: tba:257:room:25702
      look: You see the main street.

"tba:257:room:25714":
  name: South Bourbon St.
  description: >
    You can now understand why this street, in all it's majesty, was given the name Bourbon St.  As far
    to the south as you can see, inns and taverns, brothels and bars line the street.  You realize that
    for many, this area of town would be quite a little slice of heaven, possibly even a large slice! 
    Your step gets a bit lighter and for some reason you feel like whistling a merry tune you heard once in
    a bar in Shreve.  To your immediate west you see Grainy's, which many say has the best malt liquor
    in all of Dibrova, and to your east you see the Kitty-Kat club.  The sign reads 'Fine Dining and a
    Great Night's Sleep!  ', but from the look of the servers you can see through the windows, they serve
    more than bar burgers.  To the south are more shops of ill repute, and the town square opens up to the
    north.
  sector: city
  exits:
    north:
      to: tba:257:room:25705
      look: You see the City Proper.
    east:
      to: tba:257:room:25715
      look: You see the entrance to the Kitty-Kat Club.
    south:
      to: tba:257:room:25725
      look: Bourbon St heads south from here.
    west:
      to: tba:257:room:25732
      look: You see the entrance to Grainy's.

"tba:257:room:25715":
  name: Reception Area at the Kitty-Kat Club
  description: >
    Fine furniture is scattered throughout this room, allowing customers who are awaiting a table to
    sprawl in comfort.  At an ornate black desk polished to a high sheen sits a short, balding man with
    thick spectacles perched precariously on the end of his nose.  When not making reservations for his
    guests, he constantly varies between shoving his specs back up on his nose and adding up the hourly sales
    on a large abacus.  This is obviously the owner of the establishment, and the man you must speak to
    if you wish to enjoy a meal and/or 'rest' at his fine establishment.  To the south is an open doorway
    leading to the main dining area and a set of stairs lead upwards into what you assume would be the
    'entertainers' quarters.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25706
      look: You see the exit to Floris Ave.
    south:
      to: tba:257:room:25731
      look: You see the main dining area.
    west:
      to: tba:257:room:25714
      look: You see the exit to Bourbon St.

"tba:257:room:25716":
  name: Town Provisioner
  description: >
    Arius the town provisioner stands smiling behind his desk as you enter, hoping to make a sale. 
    Many shelves and racks stand all over this small shop waiting for your purchase.  The only available
    exit is to the north, leading to Floris Ave.
  sector: city
  exits:
    north:
      to: tba:257:room:25707
      look: You see Floris Ave.
    east:
      to: tba:257:room:25741
      look: You may enter onto Worship Way.

"tba:257:room:25717":
  name: Clariss' Concoctions
  description: >
    Here you can find all sorts of magic brews made specially by Clariss herself. There is only a small
    area for you to stand in, the rest is blocked off by a long counter which stretches the length of
    the shop.  Shelves and drawers are built into the back wall with glass vials filling every nook and
    cranny.
  sector: inside
  flags: [no_mob, indoors, no_magic]
  exits:
    north:
      to: tba:257:room:25702
      look: You see Floris Ave.
    west:
      to: tba:257:room:25742
      look: You see River St.

"tba:257:room:25718":
  name: River St
  description: >
    You stand on River St, so named for being the street which offers the main crossing of the River
    Alquandon.  This street is obviously the pride of Jareth, being that is it paved with well maintained
    cobblestones, all kept extremely clean.  The fresh smell of the water so near by, the people passing
    by who all seem in good cheer make this part of city far more pleasant than the dismal dregs found in
    the southern reaches of the city.  To your west is the wall of a large complex of flats.  To your
    east you see the western wall of of the bootery, where you may windowif so desired.  North is more of
    River St, which crosses the river further up, and south, River St crosses Floris St in a square.
  sector: city
  exits:
    north:
      to: tba:257:room:25759
      look: River St runs north over the River Alquandon.
    south:
      to: tba:257:room:25740
      look: River St opens into a square.

"tba:257:room:25719":
  name: Jahred's Tavern
  description: >
    A very ramshackle place, Jahred's tavern caters to those 'less fortunate' in the town of Jareth. 
    Sawdust on the floor, bloodstains on the wall, and torn curtains seperating the 'hostess' booths' tell
    you that unless you like your whiskey the old fashioned way and your woman slightly used, this is
    not your kind of place.  Most of the patrons of Jahred's look as if they'd rather stick a knife in your
    back than let you buy them a drink, so a friendly game of cards is probably out of the question.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:257:room:25730
      look: You see the bar.

"tba:257:room:25720":
  name: Granny's Quilt Shop
  description: >
    You stand in Granny's quilt shop.  Strange that a such a nice, fragile looking old ladu could make
    it in such a rough area of town, but from the look of all the inventory she carries, she must do
    quite well.  New, used, drab, colorful, all sorts of quilts drape over racks and hang on the walls.  Most
    are knit, but there are some patchwork and full length available.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:257:room:25730
      look: You see Bourbon street.
    east:
      to: tba:257:room:25767
      look: You see Granny's prize winning afghan.
      door:
        keywords: [afghan, secret, door]
        kind: pickproof
        reset: locked

"tba:257:room:25721":
  name: Blacksmith
  description: >
    More of a barn than a shop, this open air dirt floored building offers all manner of steel work. 
    Josef, the proprieter of this business, is reputed to do some of the best shoe work on horses and
    enjoys a good living from his reputation which has spread far beyond the boundaries of Jareth.  He seems
    not to notice as you walk in, so intent on his work he seems, and almost startles you when he asks if
    he can help you, without looking up.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25758
      look: You may enter onto Worship Way.

"tba:257:room:25722":
  name: The Pet Shop
  description: >
    Barking dogs, whining cats, howling wolves, and a smell more powerful than your feet after a day of
    intense hiking through wet swamp mud nearly make you turn tail and run from this shop.  You try and
    hold your breath, but that requires you to first take a deep breath, so that doesn't work.  Instead,
    you decide to give in and inhale all the sights and sounds and soon you get so used the intense
    stench that you don't even notice it anymore.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:257:room:25758
      look: You see Worship Way.

"tba:257:room:25723":
  name: PETSHOP STOREROOM
  description: >
    Make two rooms and some pets.  The rooms MUST be sequential.  If the first room is 315 then the
    second must be 316.  The second room is known as the storeroom.  All that is required in the storeroom
    is to load one of each mob you wish to be a pet.  This room can not have any exits and will never be
    used by mortals.  Although a pet shopkeeper is not required it is recommended.  After all of this is
    done ask your coder to implement the petshop.  It will not work until the code is changed and the MUD
    is rebooted.  The cost of pets is 300 times their level.
  sector: inside
  flags: [private, godroom]

"tba:257:room:25724":
  name: The Bloated Goat
  description: >
    Entering the Bloated Goat, you notice a lack of the normal hubbub and noise the usually accompanies
    a tavern such as this.  There are plenty of customers here, which seems odd to you, because only the
    occasional murmur or low voice is what drifts over to you, and the more of those customers that
    notice your entrance into the Goat, the quieter it gets.  Soon it is completely silent. Everyone is
    looking at you.  "What'll it be?  ", the bartender growls at you from under his thick beard.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:257:room:25725
      look: You see the exit to South Bourbon St.
    down:
      to: tba:257:room:25774

"tba:257:room:25725":
  name: South Bourbon St.
  description: >
    You stand on South Bourbon St.  , aptly named for it's great variety of inns and taverns.  Heading
    south, the road starts to lose some of the charm it seems to have farther north.  More trash litters
    the walk ways and the people seem to be more of the rough-and-tumble sort.  You see that farther to
    the south, the road takes a turn to the west, just before what looks to be a ...  Quilt shop? To your
    north the road continues toward the town square and other inns and bars. To your east you can peer
    through windows into the dining area of The Kitty-Kat club, and what you see is very enticing.  To your
    west is The Bloated Goat, a tavern for wayward adventurers.
  sector: city
  exits:
    north:
      to: tba:257:room:25714
      look: You see more of Bourbon St.
    south:
      to: tba:257:room:25730
      look: You see even more of Bourbon St.
    west:
      to: tba:257:room:25724
      look: You see the Bloated Goat.

"tba:257:room:25726":
  name: Main Hall to Ranger's Guild
  description: >
    The first thing you notice as pass through the shimmering archway is the drastic change in your
    surroundings.  The second thing you notice is the impossible size of this 'hall'.  The ceiling, which
    must be there somewhere, is far too far up for you to even catch a hint of it.  The floor is not a
    floor at all anymore, but the dirt and loam of a forest.  You give a small start as you realize that
    there is a man standing directly before you.  How could you have missed him when you first walked in? 
    There is a large tree to your east which looks to be hollow, and the exit into the reception room is
    north.
  sector: city
  flags: [no_mob, indoors, peaceful, private]
  exits:
    north:
      to: tba:257:room:25766
    east:
      to: tba:257:room:25745
      look: The alley continues east.

"tba:257:room:25727":
  name: The Hire Room
  description: >
    The only fixture in this small 4 x 4 cubicle is a small wooden drop box attached to the wall.  A
    pad of paper sits on the drop box and a pencil is attached to a cord which hangs from the drop box. 
    Obviously if you wish to target someone for assassination, you must write it on a piece of paper and
    drop the paper in the box.  Be sure to include the name of the target, the price on their life, and a
    brief explanation why you wish them killed.  East is the entrance to the Assassin's Guild, and west is
    the main room for Contracts, Ltd.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25749
      look: You see the thieves bar, where everything disappears.
    west:
      to: tba:257:room:25736

"tba:257:room:25728":
  name: Floris Ave
  description: >
    Here Floris Ave allows passage out of town through the West Gate, directly east of here.  To the
    west, the City of Jareth awaits your pleasure.  North of you are the stables and south is the horse
    trader.
  sector: city
  exits:
    north:
      to: tba:257:room:25772
      look: You see the stables.
    east:
      to: tba:257:room:25729
      look: You see the east gate.
    south:
      to: tba:257:room:25765
      look: You see the Horse Trader.
    west:
      to: tba:257:room:25746
      look: You see the entrance hall to the thieves' guild.

"tba:257:room:25729":
  name: East Gate
  description: >
    You stand at the entrance (or exit) to the great City of Jareth, the pride of all Dibrova, at least
    the pride of all cities in the Known Lands.  Jareth, also known by some as the City of Freedom, was
    built on the auspice of racial and class equality.  All races are welcome here, no one is refused
    service in any establishment, or so it is said, and all forms of worship are respected.  To leave the
    city, you need only to move east, but to enter it may prove to be a bit more difficult.  Although
    Jareth does boast the title 'The Free City', it does have laws and they are enforced.
  sector: city
  exits:
    east:
      to: tba:258:room:25803
    west:
      to: tba:257:room:25728

"tba:257:room:25730":
  name: South Bourbon St.
  description: >
    Aaahh...  And what a grand street it is!  Bars and taverns abound on this grubby thoroughfare,
    giving it the perpetual look of double-visioned dimness that can only accompany inebreation.  It's as if
    the street has taken on the persona of the businesses which occupy it.  North of you are a plethora
    of bars (surprise), to your east is (three guesses) a tavern, to your west there seems to be an alley
    curving out of sight, slightly southward.  It's hard to see anything in the alley, mainly because of
    the curve it takes, but also because it seems to be very dark.  To the south is Granny's Quilt Shop,
    a shop that, although in a rough part of town, has nevertheless perservered and even been able to
    thrive on a healthy chunk of business, or so it seems from the way the building is maintained.
  sector: city
  exits:
    north:
      to: tba:257:room:25725
      look: Bars bars bars and Bourbon St.
    east:
      to: tba:257:room:25719
      look: A sign over an entryway reads 'Jahred's'.
    south:
      to: tba:257:room:25720
      look: You see the entrance to Granny's Quilt Shop.
    west:
      to: tba:257:room:25755
      look: You see the entrance to a dark alley.

"tba:257:room:25731":
  name: The Kitty-Kat Club
  description: >
    The first thing you notice when enter the main room is that the whole place is clean beyond
    reason.  The soft glow from the crystal lights (suspended in mid-air) give the high polished brass which
    adorns almost every spot for a rail an almost blinding gleam.  Every server, without exception, is a
    strikingly beautiful young woman wearing skirts which leave little to the imagination and tight blouses
    which leave even less.  As your hostess shows you to your table, hands you your menu, and asks if you
    would like any drinks, you realize that if there is any other place in Jareth you would like to be
    more than where you are now, it really doesn't matter.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25715
      look: You see the reception area.

"tba:257:room:25732":
  name: Grainy's Bar & Grille
  description: >
    You enter the room and immediately a wash a pure noise (more accurately described as racket) slams
    into you full force.  The clientele here seems to be the rowdy sort, but no fights seem in the
    making, just a lot of good old fashioned comraderie.  There are three or four tables with card games in
    play, one with a group of happy drunks singing along with the bard who is plucking out all the wrong
    chords to a popular bar tune in the realm.  A long bar to your left offers a wood stool to rest on and a
    cold drink to quench your thirst and you have the choice of half a dozen empty tables as well.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25714
      look: You see the exit to South Bourbon St.

"tba:257:room:25733":
  name: The Bootery
  description: >
    Entering this shop you immediately smell the wonderful scent of freshly worked leather and oils. 
    Shelves line the walls to your left and right and boots of all size, make, and color await your eager
    feet.
  sector: inside
  flags: [no_mob, indoors, no_magic]
  exits:
    south:
      to: tba:257:room:25702
      look: You see Floris Ave.

"tba:257:room:25734":
  name: Jeweler
  description: >
    Here you may purchase jewels of all sizes and shapes.  A display case rests on the far wall
    displaying the many fine items for sale in this shop. Necklaces, earrings, rings, pendants, rough- and
    fine-cut stones abound.
  sector: inside
  exits:
    west:
      to: tba:257:room:25712

"tba:257:room:25735":
  name: Scrolls and More
  description: >
    It seems the owner of this shop feels that a more psychedelic look will give the shop a bit of a
    mystical appeal.  Pastels, mirrors, flashing lights all dazzle your eyes in an attempt to create a
    magical atmosphere.  This must be in hopes that the crazy colors will build a desire in you to buy, buy,
    buy. (scroll maker)
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25742
      look: You see the exit to River St.

"tba:257:room:25736":
  name: Contracts, Ltd.
  description: >
    A small desk sits diagonal in the corner of the room, other than that there is nothing but dust.  A
    sign hanging over the eastern doorway reads: No Refunds Given.  This is Final!  You may leave out
    onto Worship Way to the west or head east into the hire room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25727
    west:
      to: tba:257:room:25760

"tba:257:room:25737":
  name: Mage Reception
  description: >
    A very comfortable room, the reception to the mage's guild offers plush seating, beautiful
    tapestries hung on every wall, and a refreshment stand for those waiting for friends to complete levels. 
    Soft harp music comes from an unknown source, and although you may not be a big harp fan, the music is
    not unappealing.  A doorway to the west leads to what must be the main guild area and the exit to
    River St.  Is east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:257:room:25712
      look: You see the exit to River St.
    west:
      to: tba:257:room:25738

"tba:257:room:25738":
  name: Practice & Reading Room
  description: >
    This large room has been sectioned off into categories for the learning of each and every spell and
    skill.  Easy to follow directions make finding your way to the proper section for the spell or skill
    you would like to train in will be no problem.  A partitioned off space has also been set aside for
    the studying of spells and magic.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25739
      look: A curtained doorway leads you to your Guildmaster.
    east:
      to: tba:257:room:25737
      look: The entryway leads to the reception room.

"tba:257:room:25739":
  name: Mage's Guild
  description: >
    This small cell has been set aside for the sole purpose of advancing those mages ready to continue
    with their education.  An eight sided star has been etched into the floor here, with incense burning
    at each of the eight points. At each point there reads a word which identifies one of the eight
    duties of all mages.
  sector: inside
  flags: [no_mob, indoors, peaceful, private]
  exits:
    south:
      to: tba:257:room:25738
      look: A curtained doorway leads to the Practice and Reading Room.

"tba:257:room:25740":
  name: Square
  description: >
    You stand at the crossing of Floris Ave and River St.  Here the road is more worn and travelled due
    to the fact that the west gate lies straight to the west only a few hundred feet.  To the northwest,
    you can see a complex of tall buildings which stretch out for some distance.  To the north runs
    River St, which crosses over the Alquandon River and continues to the more affluent and entertaining side
    of town.  To the south lies more of River St and what looks to be a number of shops, while to the
    east, Floris Ave offers a variety of shops which gradually give way to Jareth's city proper.
  sector: city
  exits:
    north:
      to: tba:257:room:25718
      look: River St runs north.
    east:
      to: tba:257:room:25702
      look: Floris Ave runs east.
    south:
      to: tba:257:room:25742
      look: River St runs south.
    west:
      to: tba:257:room:25752
      look: Floris Ave runs west.

"tba:257:room:25741":
  name: Worship Way
  description: >
    This short street leads directly to the Temple of All and None, the only temple in all Dibrova
    where all races and classes are welcome and all forms of worship are accepted and embraced.  To the west
    you see the eastern wall of the Twon Provisioner's small shop, while to the east, you see the westren
    wall of the Cartwright's shop.  North you can enter back into the hustle and bustle of regular city
    traffic on Floris Ave.
  sector: city
  exits:
    north:
      to: tba:257:room:25703
      look: You may enter onto Floris Ave.
    east:
      to: tba:257:room:25753
      look: You see the Cartwright's shop.
    south:
      to: tba:257:room:25758
      look: Worship Way runs south.
    west:
      to: tba:257:room:25716
      look: You may enter the Town Provisioner's shop.

"tba:257:room:25742":
  name: River St
  description: >
    This is the southern section of River St, which offers no access to the river, but does offer
    access to a number of specialty shops.  To your west is the entrance to Scrolls and More, and scroll shop,
    obviously.  To the east is Clariss' Concoctions, the local shop where potions are brewed to aid the
    wandering adventurer.  North you see Floris Ave crossing River St and to the south, more shops and at
    a cul-de-sac where the road ends, a constable's outpost.
  sector: city
  exits:
    north:
      to: tba:257:room:25740
      look: River St continues north.
    east:
      to: tba:257:room:25717
      look: The entrance to the potion shop.
    south:
      to: tba:257:room:25712
      look: River St continues south.
    west:
      to: tba:257:room:25735
      look: You see the Magic Shop.

"tba:257:room:25743":
  name: Dark Alley
  description: >
    As you enter into this section of the alley, the eight street toughs who await the arrival of
    anyone fool enough to enter their domicile.  They seem almost exuberant in the way they check each other's
    loose armor fittings, exchange weapons for better killing power, and stretch out in anticipation of
    a good fight.  You can't help but feel just a bit apprehensive as the group begins their approach.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:257:room:25744
    east:
      to: tba:257:room:25747
      look: More hoodlums - you just can't escape them.

"tba:257:room:25744":
  name: Dark Alley
  description: >
    Your situation just can't seem to improve today.  Five street toughs stand up from a game of dice
    as you enter their territory, and they seem just a bit perturbed.  You can leave to the north or
    south, though neither choice seems all that inviting since both directions lead to more of what you're
    standing in now.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:257:room:25755
      look: The alley seems to get a bit brighter in that direction.
    south:
      to: tba:257:room:25743
      look: The alley continues south.

"tba:257:room:25745":
  name: Ranger's Guild Hall
  description: >
    Here in the base of the tree, a ring of stones is set into the ground and a firepit in the center
    glows with hot coals.  It seems the tree itself serves as a chimney for the smoke from the hot coals,
    but you cannot be certain of that, because looking up into the tree, you see only darkness.
  sector: city
  flags: [no_mob, indoors, peaceful, private]
  exits:
    west:
      to: tba:257:room:25726
      look: The alley leads west.

"tba:257:room:25746":
  name: Floris Ave
  description: >
    Floris Ave continues east to towards the East Gate and west into the center of the city.  To the
    south is the Ranger Guild and to the north begins a cobblestone street which leads to Lord's Keep, home
    of the Lord of Jareth.
  sector: city
  exits:
    north:
      to: tba:257:room:25771
      look: You see the beginning of a Cobbled St.
    east:
      to: tba:257:room:25728
      look: Floris Ave runs east toward the east gate.
    south:
      to: tba:257:room:25766
      look: You see the Ranger's Guild.
    west:
      to: tba:257:room:25750
      look: Floris Ave runs west.

"tba:257:room:25747":
  name: Dark Alley
  description: >
    Things probably couldn't get much worse.  You are in the deepest, darkest, smelliest, and probably
    most dangerous part of Jareth.  Even the constables don't dare come here.  Blood stains coat every
    wall, some blackened and peeling, some still wet and running.  The only exit out of here is to the
    west.  Well, more aptly put, the only WOULD BE exit out of here is to the west, but unfortunately a dozen
    of the meanest looking street toughs you've ever seen are blocking the way.  They mill about,
    unconcerned, knowing that their sheer numbers will prevent you from any advantages.  Your only chance to
    run like hell is now, and although a cowardly way to deal with the situation, it is recommended.
  sector: city
  flags: [dark]
  exits:
    east:
      to: tba:257:room:25748
      look: You see a nondescript brick wall.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:257:room:25743
      look: Could be worse - it could be raining.

"tba:257:room:25748":
  name: Thieves' Guild
  description: >
    This appears to be what used to be an old warehouse before your guild took it over for their own. 
    The awesome size of the place, the sheer immensity only adds to your lust for material wealth as you
    survey your surroundings.  All around you, the finest of all furniture and goods lay sattered
    haphazardly around, as if the owner of these items were not aware of their value.  In one corner, a chest
    heaped with coins lays on it's side, while in another, a rack of glowing, golden armor and weapons sits
    propped against the wall.  Your only exit is to the west.
  sector: inside
  flags: [no_mob, indoors, private]
  exits:
    west:
      to: tba:257:room:25747
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [rack, armor]
    text: >
      The value of that armor must be twenty times the value of any other armor in all the land..
  - keywords: [chest, coins]
    text: There could be as much as one million gold in that chest...

"tba:257:room:25749":
  name: The Assassin's Guild
  description: >
    The austerity and peace you feel in this room can only be described as serene bliss.  The clarity
    of mind you feel, the strength of purpose emanating from the very walls seem to ooze into every part
    of your being.  A soft, slightly padded mat lies on the floor, offering you the chance to rest or
    meditate, as you will.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic, private]
  exits:
    south:
      to: tba:257:room:25761
      look: You see the river flowing west.
    west:
      to: tba:257:room:25727

"tba:257:room:25750":
  name: Floris Ave
  description: >
    Floris Ave runs east and west, east leading to the East Gate, west leading deeper into town.  South
    is the entrance to the Cartwright, where one can buy mobile transportation enabling easier transport
    of larger and/or heavier loads over long distances.  North is the windowless wall of the city jail,
    which can be entered through the Constabulary to the northwest.
  sector: city
  exits:
    east:
      to: tba:257:room:25746
      look: Floris Ave runs east.
    south:
      to: tba:257:room:25753
      look: You see the Cartwright's
    west:
      to: tba:257:room:25703
      look: Floris Ave runs west.

"tba:257:room:25751":
  name: Boardwalk
  description: >
    The wooden Boardwalk continues east and west along the river.  Fishermen line the river bank trying
    their luck while others relax on benches here enjoying the sights and sounds of the river.  You can
    enter the Bait & Tackle to the north or continue along the Boardwalk.
  sector: city
  exits:
    north:
      to: tba:257:room:25773
      look: You see the Bait and Tackle.
    east:
      to: tba:257:room:25797
      look: The boardwalk runs east.
    west:
      to: tba:257:room:25799
      look: The boardwalk runs west.

"tba:257:room:25752":
  name: Floris Ave
  description: >
    You stand in Floris Ave, close to the west gate.  The streets are a bit dirtier and worn the closer
    you get to the west gate.  The paving is chipped, cracked, and in some places entirely gone, making
    the way somewhat bumpy.
  sector: city
  exits:
    east:
      to: tba:257:room:25740
      look: Floris Ave opens into a square.
    west:
      to: tba:257:room:25756
      look: You see the West Gate of Jareth.

"tba:257:room:25753":
  name: The Cartwright
  description: >
    Here one may purchase overland transportation for goods and extra people in your party who may slow
    you down for one reason or another.  No actual models are inside for inspections, but many well
    drawn sketches of blueprints, load maximums, and actual pictures of what the product should look like are
    on the walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25750
      look: You see Floris Ave.
    west:
      to: tba:257:room:25741
      look: You see Worship Way.

"tba:257:room:25754":
  name: North Bourbon St.
  description: >
    You are on a wide promenade which stretches north and south for quite some distance.  To the north,
    you can hear the faint sound of water on the move, possibly a river or lake.  To the south the road
    cotinues offering shops on either side.  To your immediate west is the Wellmaster and to the east you
    see Dalston Outfitters, one of many in the ever growing chain of stores which Dalston the Wanderer
    began way back when he was still a strapping young man. It is said that now his children run the
    franchise, and the rumor is, they do a handsome business by being fair priced and always giving a quality
    product.
  sector: city
  exits:
    east:
      to: tba:257:room:25762
      look: You see the entrance to Dalston Outfitters.
    south:
      to: tba:257:room:25701
      look: Bourbon St continues south.
    west:
      to: tba:257:room:25709
      look: You see the entrance to the Wellmaster.

"tba:257:room:25755":
  name: Dark Alley
  description: >
    This does NOT seem like a good place to be, not at ANY time of the day, not under ANY
    circumstances.  All of your instincts scream at you to head east and get the hell out of here!  Three street
    toughs lounge against the alley wall, not moving, not talking, they just stare intently at you, as if
    waiting for some unseen signal.
  sector: city
  flags: [dark]
  exits:
    east:
      to: tba:257:room:25730
    south:
      to: tba:257:room:25744
      look: It doesn't look too good for you in that direction.

"tba:257:room:25756":
  name: West Gate
  description: >
    You stand at the entrance (or exit) to Jareth, the pride of all Dibrova, at least the pride of all
    cities in the Known Lands.  Jareth, known by some as 'The City of Freedom', was built on the auspice
    of racial and class equality.  All races are welcome here, no one is refused service in any
    establishment, or so it is said, and all forms of worship are respected.  To leave the city, you need only
    head west.  Entering, however, may prove to be a bit more difficult. Although Jareth does boast the
    title Free City, it does have laws and they are enforced.
  sector: city
  exits:
    east:
      to: tba:257:room:25752
      look: Floris Ave runs east.
    west:
      to: tba:263:room:26300

"tba:257:room:25757":
  name: Constable's Outpost
  description: >
    Here the law of Jareth maintains a small but servicable outpost for their main office in the center
    of town.  Posters of known criminals hang from the walls, short descriptions of each criminal at the
    bottom of each.  Knowing that Jareth is protected so well by these fine men and women of the City
    Constabulary, you feel much more at ease about walking the streets of Jareth. Whether that is because
    you feel you are better protected or you can better get away with what you would like to, well, that
    remains to be seen.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25712
      look: You see the exit to River St.

"tba:257:room:25758":
  name: Worship Way
  description: >
    This short street leads directly to the Temmple of All and None, the only temple in all Dibrova
    where all races and classes are welcome and all forms of worship are embraced.  To the west you see the
    entrance to the blacksmith's and to the east is the pet shop.
  sector: city
  exits:
    north:
      to: tba:257:room:25741
      look: Worship Way runs north.
    east:
      to: tba:257:room:25722
      look: You see the Pet Shop.
    south:
      to: tba:257:room:25760
      look: Worship Way runs south.
    west:
      to: tba:257:room:25721
      look: You see the Blacksmith's.

"tba:257:room:25759":
  name: River St.
  description: >
    You stand on River St, so named for the street which offers the main crossing for the River
    Alquandon.  This crossing, an extremely well maintained and ornate bridge, stands directly north of you. 
    South, River St continues to a square at the crossing of Floris Ave.  East of you is the entrance to
    Captain Vulcevic's Boat House, where Vulcevic buys, sells, and repairs new and used boats.  West is the
    long tall building which houses flats for any who wish to lease, although the entrance is
    southwest.  Directly west only leads to a tall, windowless wall.
  sector: city
  exits:
    north:
      to: tba:257:room:25779
      look: River St crosses a beautiful bridge to the north.
    east:
      to: tba:257:room:25710
      look: You see the boathouse.
    south:
      to: tba:257:room:25718
      look: River St runs south.

"tba:257:room:25760":
  name: Worship Way
  description: >
    You stand at the entrance the to fabled Temple of All and None, who's doors stand open to you to
    the south.  To the west is the Blood Bank, where one may donate blood to the good people of Jareth in
    return for a small gratuity.  To the east is Contracts, Ltd.  , where one may offer gold in return for
    the service of a professional assassin.  North is Worship Way and the many shops it offers.
  sector: city
  exits:
    north:
      to: tba:257:room:25758
      look: Worship Way runs north.
    east:
      to: tba:257:room:25736
      look: You may enter into the Assassin's Guild.
    south:
      to: tba:257:room:25776
      look: You may enter the Temple of All and None.
    west:
      to: tba:257:room:25704
      look: You see the blood bank.

"tba:257:room:25761":
  name: Assassin's Weaponry
  description: >
    Here you may purchase the many specialty weapons avaible only to the professional killing
    community.  All manner of weapons hang on the walls, rest in glass display cases, and lay on shelves.
  sector: inside
  flags: [no_mob, indoors, private]
  exits:
    north:
      to: tba:257:room:25749
      look: The path continues northwards bringing you ever closer to the Dragonhelm Mountains.

"tba:257:room:25762":
  name: Dalston Outfitters
  description: >
    Here at Dalston Outfitters, Ltd.  You can find great bargains on quality new and pre-owned
    adventuring equipment.  All merchandise has been run through a rigorous one point inspection, and is
    guaranteed to make it out of the store intact, or your money back.  All manner of bags and sacks, backpacks
    and lanterns, pots and pans, you name it they have it hang on pegs on the wall or on shelves on
    display.  Many tree-racks crowd the center of the store, in some places making pass-through impossible. 
    You finally make it to the counter, behind which stands a clerk in a blue and green striped shirt with
    the Dalston logo emblazoned on the left breast.  The only exit is to the west.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:257:room:25754
      look: You see the exit out to Bourbon St.

"tba:257:room:25763":
  name: Maris' Weaponry
  description: >
    You have entered the small inner lobby to Maris' weapon shop.  A crude, blockish looking counter
    makes an 'L' shape around the entrance to a back where (it is said) Maris keeps his cache of weapons. 
    Many ancient weapons hang from the ceiling and walls, giving the shop a look of both nostalgia and
    rugged strength.  A sign over the doorway leading to the backroom reads; Better to be a Lion for a day
    than a sheep for a whole lifetime.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:257:room:25706
    west:
      to: tba:257:room:25701
      look: You see the exit out to Bourbon St.

"tba:257:room:25764":
  name: The Cryogenic Center
  description: >
    You are standing in an impossible white sterile room with cylindrical body-length canisters lined
    up against the walls.  The Reception is to the south.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25708
      look: The Reception is to the south.

"tba:257:room:25765":
  name: Horse Trader
  description: >
    Only a small, 8 x 8 structure, this place of business sees probably more money pass through it's
    coffers than the Jareth City Bank.  A small desk sits in corner of the room, and a small man sits
    behind it waiting for you to begin dealing on the steed of your choice.
  sector: inside
  exits:
    north:
      to: tba:257:room:25728
      look: You may enter onto Floris Ave.

"tba:257:room:25766":
  name: Ranger Reception
  description: >
    You stand in a rugged but peaceful room devoted mostly to the Mother, Nature. All furniture in the
    room has not been worked in any way, but allowed to keep it's natural shape.  Obviously someone(s)
    went to great lengths to find these pieces which would allow comfort and rest without marring them in
    any way.  You give a start as you realize that many of the seats in this room are already taken by
    people who blend so well into the seats as almost seem invisible. Many seem to be in meditation, while
    others simply relax, enjoying herbal drinks offered by others of the same kind.  The entrance to the
    main Ranger Guild Hall lies south through an archway which shimmers with a light not unlike that of a
    warm spring day.  North is the exit to Floris Ave.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25746
      look: You see Floris Ave.
    south:
      to: tba:257:room:25726

"tba:257:room:25767":
  name: Thief Shop
  description: >
    This small nook hidden behind Granny's Prize-Winning Afghan is actually a place where those of the
    more...  Shall we say free-lance?  Profession may purchase the tools and tricks of the trade.  The
    small, weasel-faced man sitting here looking bored makes you think that either he is a complete moron
    to be here alone selling wares, or he could simply be the baddest sonofabitch (in disguise) that
    you've ever laid eyes on.  Take your pick.  The exit is west.
  sector: city
  exits:
    west:
      to: tba:257:room:25720
      door:
        keywords: [afghan, secret, door]
        kind: pickproof
        reset: locked

"tba:257:room:25768":
  name: Constabulary
  description: >
    This is main HQ for all the constables in the city.  Seeing such a gathering of constables all in
    one place together makes you feel a bit uneasy even though you've probably done nothing to invoke
    their anger.  Besides, if you had done something to invoke their anger, you would have been 'escorted'
    here and unceremoniously dumped in the holding cell to your east.  You see a few of the rag-bags of
    Jareth sleeping off their hangovers there now.  To the north is a closed door.  Mounted on the door is a
    plaque which labels the room beyond to be the Magistrate's Office.  From the way voices are kept to
    a low murmur in this room, you figure the Magistrate must be a tough cookie, at least on his workers.
    The exit to Floris Ave is south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25770
      look: You see a closed door.
      door:
        keywords: [door, office]
        kind: door
        reset: closed
    east:
      to: tba:257:room:25769
      look: You see a VERY uncomfortable looking cell.
      door:
        keywords: [cell, door]
        kind: pickproof
        reset: locked
    south:
      to: tba:257:room:25703
      look: You see Floris Ave.

"tba:257:room:25769":
  name: Holding Cell
  description: >
    You are in a relatively large holding awaiting the Magistrate's judgement on your case.  A low
    bench suspended from chains anchored into the wall runs along the south wall.  Judging from the smell,
    the small hole in the northeast corner of the cell is intended for you to relieve yourself.  West of
    you, beyond the bars, is the Constabulary, where a flurry of efficient activity goes on without
    intermission.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:257:room:25768
      door:
        keywords: [cell, door]
        kind: pickproof
        reset: locked

"tba:257:room:25770":
  name: The Magistrate's Office
  description: >
    The spotlessly clean, polished desk, the neat stacks of files on the desk and shelves, the
    leather-bound books neatly lined in the bookshelves gives you the impression that man who spends his time in
    this office is a man of efficiency, detail, and neatness.  A map of Jareth covers most of the west
    wall while on the east wall hangs the many awards and plaques given to the Magistrate by the grateful
    people of Jareth.  The north wall is mostly glass, a window offering a beautiful view of the Alquandon
    River and the boardwalk on the far side.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25768
      door:
        keywords: [door, office]
        kind: door
        reset: closed
  extras:
  - keywords: [map, wall]
    text:
      preformatted: |2
                            Constable
                             Outpost
