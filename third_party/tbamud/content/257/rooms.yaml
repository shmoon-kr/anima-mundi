"tba:257:room:25771":
  name: Cobbled St
  description: >
    You stand on a cobbled street running north out of the town proper.  To the east you may enter the
    stables, west is the windowless wall of the City Jail, and south is the hustle and bustle of Floris
    Ave.
  sector: city
  exits:
    north:
      to: tba:256:room:25601
    south:
      to: tba:257:room:25746
      look: You may enter onto Worship Way.

"tba:257:room:25772":
  name: Stables
  description: >
    Row upon row of stalls line this barn.  Here you may leave your steed until your needs dictate
    otherwise.  Great care is given to each and every animal, whether thoroughbread or jackass they receive
    the best of oats, a nightly sponge bath and rub down, and twice daily they are run in the yard for
    excercise.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25728
      look: You may eneter onto Floris Ave.

"tba:257:room:25773":
  name: Grigor's Bait and Tackle
  description: >
    All manner of fishing paraphenalia line the walls and stack the racks here Grigor's.  Grigor, being
    a fisherman by trade for most of his younger years, knows all the best spots on the river and all
    the best tackle to use.  You may exit south to the Boardwalk.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25751

"tba:257:room:25774":
  name: Warrior's Lounge
  description: >
    This room was specifically made by warriors for warriors.  After a long, hard day, a warrior needs
    a chance to take a load off.  Round bar tables sit haphardly around the room with plush chairs
    circling each.  Scantily-clad ladies serve drinks ranging from high protein to high octane moonshine,
    depending on what your personal needs might be.  A practice area, wide open to those seated at the tables,
    allows not a place for warriors to hone their abilities to a fine, cutting edge, but it also gives
    those seated some entertainment watching their peers make asses of themselves while practicing new
    moves not quite perfected.
  sector: inside
  flags: [indoors, private]
  exits:
    west:
      to: tba:257:room:25775
    up:
      to: tba:257:room:25724

"tba:257:room:25775":
  name: Warrior's Guild
  description: >
    A huge granite throne sits in the center of the room, with what you assume would be your
    guildmaster seated on it.  Flanked by guards on either side, both carrying spears the size of a large tree, you
    can't help but feel just a bit intimidated.
  sector: inside
  flags: [indoors, private]
  exits:
    east:
      to: tba:257:room:25774

"tba:257:room:25776":
  name: Temple of All and None
  description: >
    Robed and hooded priests walk solemnly by with heads bowed.  After being so used to the normal din
    of the city, the near-library silence that surrounds you hear seems almost like a dream.  The temple,
    formed in the shape of a cross, allows worship at three of the four points of the cross, each
    devoted to an alignment, a following of belief.  The fourth point is the entrance to the temple itself,
    which is north.  A door in the wall near the temple exit allows access to the Cleric's Guild.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25760
      look: You may enter onto Worship Way.
    down:
      to: tba:257:room:25777

"tba:257:room:25777":
  name: Meditation and Prayer
  description: >
    Solemn and intense, this room offers the chance for clerics to find a bit of inner peace before
    embarking upon adventures into the outside world.  A row of kneeling pads line the floor along the north
    and south walls, allowing comfort while in prayer.  A flight of stairs lead up to the Temple of All
    and None, and to the west, the High Priest of Jareth.
  sector: inside
  flags: [indoors, peaceful, private]
  exits:
    west:
      to: tba:257:room:25778
    up:
      to: tba:257:room:25776

"tba:257:room:25778":
  name: Cleric's Guild
  description: >
    Candlebra hold scores of candles burning in devotion to the gods of Dibrova. Draped in red and
    purple silk tapestries, the room makes you feel both majestic and at peace.
  sector: inside
  flags: [indoors, peaceful, private]
  exits:
    east:
      to: tba:257:room:25777

"tba:257:room:25779":
  name: River St Bridge
  description: >
    This bridge, one of the wonders of the Known Lands, spans the Alquandon River in such a graceful
    arc it seems the craftsmanship required for such a feat would be impossible.  Near the crest of the
    arc, engraved into the steel an inscription reads 'This bridge dedicated to the great and wonderful
    people who made the notion of a free city a reality.  ' It is not signed, but such metal work could only
    be the work of the fabled dwarven metalsmiths at Krat.  North of you the boardwalk begins, south is a
    square and most of Jareth, and you may enter the Alquandon River from a path leading down.
  sector: city
  exits:
    north:
      to: tba:257:room:25780
      look: River St runs north into the more 'upper class' section of Jareth.
    south:
      to: tba:257:room:25759
      look: River St runs south.

"tba:257:room:25780":
  name: River St
  description: >
    You stand on River St, north of town, entering the arts and entertainment district of Jareth. 
    South of you is the Bridge, north the road makes a turn to the west before a Constable's Ouptost, and
    east begins the Boardwalk along the river.
  sector: city
  exits:
    north:
      to: tba:257:room:25781
      look: River St runs north.
    east:
      to: tba:257:room:25798
      look: You see the Boardwalk.
    south:
      to: tba:257:room:25779
      look: You see the River St bridge.

"tba:257:room:25781":
  name: Ulath Way
  description: >
    Here begins Ulath Way, the northernmost road in all Jareth.  A Constable's Outpost is north of you,
    offering protection to any in need.  To the east Ulath Way continues with the city wall to the north
    and River St to the south.
  sector: city
  exits:
    north:
      to: tba:257:room:25782
      look: You see a Constable's Outpost.
    east:
      to: tba:257:room:25790
      look: Ulath Way runs east.
    south:
      to: tba:257:room:25780
      look: You may enter onto River St.

"tba:257:room:25782":
  name: Constable's Outpost
  description: >
    Here the law of Jareth maintains a small but servicable outpost for their main office in the center
    of the city.  Posters of known criminals hang on the walls with a short description of each criminal
    at the bottom of each.  Knowing Jareth is so well protected by the fine men and women of the City
    Constabulary, you feel much more at ease about walking the streets of Jareth.  Whether that is because
    you feel that you are better protected, or simply more able to get away with whatever it is you would
    like, well, that remains to be seen.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25781

"tba:257:room:25783":
  name: Post Office
  description: >
    This building houses a number of P.O. boxes, all lined against the east wall.  Here you may post a
    message to any other player on the MUD or get any messages you may have waiting for you.  A clerk,
    wearing a visor and a thumb rubber stands behind a desk.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25790

"tba:257:room:25784":
  name: Hospital
  description: >
    The city keeps an efficient staff hustling about in this one room clinic. Cots line one wall, where
    a number of sick people lay, some resting peacefully, some moaning in pain.  Here you may receive
    attention for any wounds you may have incurred or simply get a 'recharge'.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25791

"tba:257:room:25785":
  name: Library
  description: >
    This long, low building houses some of the greatest works in the Known Lands, both fictional and
    nonfictional.  An attendant is always on hand to help locate any works you may be looking for, and also
    to help those who have difficulty in reading.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25792

"tba:257:room:25786":
  name: Clothing Shop
  description: >
    This shop is considered to be the best in all Jareth where fashion is concerned.  Franz, designer
    and operator of this establishment, takes a great deal of time in locating the finest materials for
    his garments.  You see no sale signs, which means that Franz must deserve his reputation.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25797

"tba:257:room:25787":
  name: Training Hall
  description: >
    Many floor mats, weights, training dummies, and manuals lay about waiting to be used for training. 
    All sorts of people train or work out in various places around you.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:257:room:25793

"tba:257:room:25788":
  name: Casino
  description: >
    Not quite what you would expect from a casino.  More like a mafia cooling room.  Lights dimmed to
    near-darkness, smoke in a cloud hanging low over the entire room, small tables with four chairs and a
    dealer at each are scattered about the room.  Men in dark armor stand with their arms crossed at 3
    foot intervals along the walls watching and making sure no one cheats.  The exit is south, or you may
    sit down and try and win some fast cash.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25799

"tba:257:room:25789":
  name: Salazar's on the River
  description: >
    This bar seems to have such a festive atmosphere, it nearly reaches out and snatches you onto the
    dance floor.  Women of every race strut their stuff, men cut a rug with reckless abandon, and the
    music, so loud as to alomost deafen you, moves through your body and makes you want to join in.  Low
    boothes line walls east and west, a long bar next to the bandstand offers drinks to your north, and the
    dance floor, smack dab in the center of the room, simply calls to you.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:257:room:25798

"tba:257:room:25790":
  name: Ulath Way
  description: >
    Ulath Way continues east and west along the north wall.  To the south, you may enter the Post
    Office.
  sector: city
  exits:
    east:
      to: tba:257:room:25791
      look: Ulath Way runs east.
    south:
      to: tba:257:room:25783
      look: You see the Post Office.
    west:
      to: tba:257:room:25781
      look: Ulath Way runs west.

"tba:257:room:25791":
  name: Ulath Way
  description: >
    The road continues east and west along the north wall.  You may enter the Hospital to the south.
  sector: city
  exits:
    east:
      to: tba:257:room:25792
      look: Ulath Way runs east.
    south:
      to: tba:257:room:25784
      look: You see the hopsital.
    west:
      to: tba:257:room:25790
      look: Ulath Way runs west.

"tba:257:room:25792":
  name: Ulath Way
  description: >
    The road continues east and west here along the north wall.  You may enter the Library to the south.
  sector: city
  exits:
    east:
      to: tba:257:room:25793
      look: Did I say you could look east, punk?
    south:
      to: tba:257:room:25785
      look: You see the Library.
    west:
      to: tba:257:room:25791
      look: Eyes to the front, you maggot, it's none of your business what is west.

"tba:257:room:25793":
  name: Ulath Way
  description: >
    The road continues east and west here along the north wall.  To the east you see that Ulath Way
    makes a turn south, onto the boardwalk.  Directly south of you is the Training Hall.
  sector: city
  exits:
    east:
      to: tba:257:room:25794
      look: Ulath Way runs east.
    south:
      to: tba:257:room:25787
      look: You may enter the training hall.
    west:
      to: tba:257:room:25792
      look: Ulath Way runs west.

"tba:257:room:25794":
  name: Boardwalk
  description: >
    You stand on a wooden road which runs south along the river bank.  To your west is Ulath Way, the
    northernmost road in Jareth.
  sector: city
  exits:
    south:
      to: tba:257:room:25795
      look: The boardwalk runs south.
    west:
      to: tba:257:room:25793
      look: Ulath Way runs west.

"tba:257:room:25795":
  name: Boardwalk
  description: >
    This short section of the boardwalk runs along the river where the Alquandon the Karafa meet. 
    Fishermen line the bank, trying their luck, while others lounge on benches just enjoying the sights and
    sounds along the river.
  sector: city
  exits:
    north:
      to: tba:257:room:25794
      look: The boardwalk runs north
    south:
      to: tba:257:room:25796
      look: The boardwalk runs south.

"tba:257:room:25796":
  name: Boardwalk
  description: >
    The boardwalk makes a turn here, allowing traffic north and west, still following the course of the
    river.  Fishermen line the river bank, trying their luck, while others just lounge on benches here,
    enjoying the sights and sounds of the river.
  sector: city
  exits:
    north:
      to: tba:257:room:25795
      look: The boardwalk runs north.
    west:
      to: tba:257:room:25797
      look: The boardwalk runs west.

"tba:257:room:25797":
  name: Boardwalk
  description: >
    The boardwalk runs east and west here along the Alqaundon, allowing fishing or relaxation, as you
    will.  Les Franz, a well reknowned clothing shop in Jareth, is to your north.
  sector: city
  exits:
    north:
      to: tba:257:room:25786
      look: You see a clothing shop.
    east:
      to: tba:257:room:25796
      look: The boardwalk runs east.
    west:
      to: tba:257:room:25751
      look: The boardwalk runs west.

"tba:257:room:25798":
  name: Boardwalk
  description: >
    Here the boardwalk begins it's run east and west along the banks of the Alquandon.  Fishermen line
    the river bank, trying their luck, while others simply sit on benches here enjoying the sights and
    sounds of the river.  Loud music can be heard to the north, coming from a bar and to your west you may
    enter onto River St.
  sector: city
  exits:
    north:
      to: tba:257:room:25789
      look: You see a bar.
    east:
      to: tba:257:room:25799
      look: The Boardwalk runs east.
    west:
      to: tba:257:room:25780
      look: You see River St.

"tba:257:room:25799":
  name: The Boardwalk
  description: >
    The boardwalk runs east and west along the riverbank.  There is a casino to the north and if one
    has the desire, on may try fishing here in the river.
  sector: city
  exits:
    north:
      to: tba:257:room:25788
    east:
      to: tba:257:room:25751
    west:
      to: tba:257:room:25798
