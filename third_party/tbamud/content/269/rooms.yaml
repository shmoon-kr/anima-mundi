# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 269.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:269:room:26900":
  name: The Beginning Of The Southern Desert
  description: >
    This path marks the beginning of the long road to the southern part of the world.  There are
    several rumors as to where it leads, but no one knows for sure.  Looking south, you gaze into a panorama of
    a rocky, cactus-dotted land, shimmering in the heat of the day.
  sector: field
  exits:
    south:
      to: tba:269:room:26901
      look: A huge cactus-dotted desert spreads out before you.
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Southern Desert by  Ian Smith/Freak, Dark Master of Thieves
        Builder      : Freak
        Zone         : 269 Souther Desert
        Began        : 12/30/95
        Player Level : 17-20
        Rooms        : 68
        Mobiles      : 13
        Objects      : 10
        Triggers     : 1
        Links        : 00, 24, 15

"tba:269:room:26901":
  name: The Beginning Of The Southern Desert
  description: >
    Scrub brush and cacti of many sorts are beginning to appear, you are thankful that they do not grow
    on the path. To the south, you see a desert, teeming with desert life.
  sector: field
  exits:
    north:
      to: tba:269:room:26900
    south:
      to: tba:269:room:26902
      look: The heat makes the desert to the south shimmer.

"tba:269:room:26902":
  name: The Southern Desert
  description: >
    Heat waves make the world shimmer, as you trod through what feels like an oven. Plants of all sorts
    cling to the dry ground here, barely surviving the dry heat. The only sound is the low whisper of
    hot wind, and the small rustling of rodents fleeing from your presence.
  sector: inside
  exits:
    north:
      to: tba:269:room:26901
    south:
      to: tba:269:room:26903
      look: Far to the south you can barely make out a large rock of some sort.

"tba:269:room:26903":
  name: Near A Large Mesa
  description: >
    To the south you can barely see a huge, low, mesa, sitting solidly as it has been from the
    beginning of time. Looking northward brings no rewards, it just hurts your eyes.
  sector: inside
  exits:
    north:
      to: tba:269:room:26902
    south:
      to: tba:269:room:26904
      look: There is a mesa near to the south.

"tba:269:room:26904":
  name: A Fork In The Path
  description: >
    The small footpath you have been following splits here; one part leading off to the east where it
    disappears into the sagebrush. To the south the path continues, getting more and more overgrown as it
    goes.  Near to the south the northern edge of the large mesa looms up, a black wall against the sky.
  sector: inside
  exits:
    north:
      to: tba:269:room:26903
      look: The path lead off to the north.
    east:
      to: tba:269:room:26905
      look: The path forks off to the east, where it disappears into the brush.
    south:
      to: tba:269:room:26908
      look: A large mesa looms up in the south.

"tba:269:room:26905":
  name: A Choked Footpath
  description: >
    The footpath here leads east and west, nearly choked in parts with sagebrush anc cacti. Up ahead
    you see...can it be true? is that a Taco Bell you see?
  sector: inside
  exits:
    south:
      to: tba:269:room:26906
      look: You see a shimmering image to the east.
    west:
      to: tba:269:room:26904
      look: A fork in the path lies to the west.

"tba:269:room:26906":
  name: The Mirage
  description: >
    Nearly delirious from the heat and thirst, you totter up to the front steps of the Taco Bell.  (or
    is it Taco Hell?  ) Stumbling through the weeds, you suddenly realize that this is all some deadly
    trick of the desert.  The mirage quivers, and disappears before your bloodshot eyes.  The path here
    leads east and west.
  sector: inside
  exits:
    south:
      to: tba:269:room:26907
      look: The path look like it disappears to the east.
    west:
      to: tba:269:room:26905
      look: You have no desire to see the cacti to the west.

"tba:269:room:26907":
  name: A Curve In The Path
  description: >
    The small path you have been carefully following turns to the south, and runs off to the west.  The
    sage here now begins to irritate you, as it is spreading little burrs under your clothing. You are
    now hoping that soon one of the oasis you see will be real.
  sector: inside
  exits:
    south:
      to: tba:269:room:26909
      look: You rub your eyes and try to make out the split in the path to the south.
    west:
      to: tba:269:room:26906
      look: The west doesn't seem as glorious as it does in all those old movies.

"tba:269:room:26908":
  name: The Large Mesa
  description: >
    To the south a great, impassable rock wall looms high above you. It seems to sneer at you, puny
    compared to its enormous size. a small footpath leads north from here.
  sector: inside
  exits:
    north:
      to: tba:269:room:26904
    south:
      look: The side of the mesa is impossible to climb.

"tba:269:room:26909":
  name: Another Split In The Path
  description: >
    The path splits here, one part leading off to the east and the other continuing to the south.
    Scanning the horizon, you see nothing but dry, dull, weeds, and the occasional stately Saguaro cactus. 
    You wonder how the world got to be so darn ugly.
  sector: inside
  exits:
    north:
      to: tba:269:room:26906
      look: A boring path leads northwards, perhaps to some famous land.
    east:
      to: tba:269:room:26910
      look: A path leads off into desert mountains.
    south:
      to: tba:269:room:26912
      look: Your eyes hurt, due to the continuous desert scene.

"tba:269:room:26910":
  name: Lonely Desert Mountains
  description: >
    Here you stand in the foothills of the mountains to the east. The vegetation dies around you, as
    the insects sing their lonesome song.
  sector: inside
  exits:
    east:
      to: tba:269:room:26911
      look: To the east the mountains begin to rise, as your spirits fall.
    west:
      to: tba:269:room:26909
      look: To the west you see a dreary little fork in the weed-choked path.

"tba:269:room:26911":
  name: The Desert Mountains
  description:
  - >
    Here the ground has risen up, forcing you to exert yourself harder. Those precious movement points
    slip away as you trod over the now rocky road. Stray critters scamper about, praying to their critter
    gods that you will quickly leave the area.
  - The road here curves to the south.
  sector: mountains
  exits:
    south:
      to: tba:269:room:26913
      look: You see more of the mountainous road.
    west:
      to: tba:269:room:26910
      look: The rocky path leads west.

"tba:269:room:26912":
  name: The Desert Foothills
  description:
  - >
    Here the desert forbids your life to get any easier, and you are forced to exert yourself to travel
    uphill.  Cursing mother nature, you ignore your thirst and plod onward.
  - To the south the mountains rise up out of the earth like an ill specter.
  sector: hills
  exits:
    north:
      to: tba:269:room:26909
      look: To the north you look down onto flatter ground.
    south:
      to: tba:269:room:26915
      look: You are displeased with the thought of travelling uphill.

"tba:269:room:26913":
  name: A Fork In The Rocky Road
  description: >
    Here you really have to be careful as you travel. The number of rocks and dust particles in the
    path seems to rise with the number of steps you take.  A trail leads off to the east, and the path
    continues south.
  sector: mountains
  exits:
    north:
      to: tba:269:room:26911
      look: You see a dangerous road, almost unfit for travel.
    east:
      to: tba:269:room:26914
      look: You see an overgrown trail, complete with fallen rocks.
    south:
      to: tba:269:room:26916
      look: To the south the road leads through the mountains.

"tba:269:room:26914":
  name: The Disappearing Path
  description: >
    Here you stop, and gaze of into the panoramic view to the east. The path here has ceased to exist,
    due to the severe drop down to the rest of the desert far below you. Off in the distance you see a
    huge landmark, that looks strikingly similar to an enormous crater.
  sector: mountains
  exits:
    east:
      look: You gaze upon the Southern desert.
    west:
      to: tba:269:room:26913
      look: You look back to the desert mountains.

"tba:269:room:26915":
  name: The Desert Mountains
  description: You grow weary as you trod through these dry mountains.
  sector: mountains
  exits:
    north:
      to: tba:269:room:26912
    south:
      to: tba:269:room:26917
      look: You see a bend up ahead.

"tba:269:room:26916":
  name: The Foothills
  description: >
    With the worst of the mountains to the north, the trail here becomes easier. Far off to the east
    you think you see blue. to the south the dusty road continues.
  sector: hills
  exits:
    north:
      to: tba:269:room:26913
      look: The road leads north into the Southern Desert.
    south:
      to: tba:269:room:26919
      look: The road to the south ends in a 'T'.

"tba:269:room:26917":
  name: A Bend In The Fading Road
  description: >
    Here the road bends, on end leads north and the other leads east. You are surrounded by sage brush,
    and heat. You can barely make out a path to the south.
  sector: field
  exits:
    north:
      to: tba:269:room:26915
      look: The path leads north into the heart of the desert mountains.
    east:
      to: tba:269:room:26918
      look: The path leads east, where it turns into a road.

"tba:269:room:26918":
  name: A Dusty Road
  description: Here the land is harsh and hot, reminding you of your 4th-grade teacher.
  sector: field
  exits:
    east:
      to: tba:269:room:26919
      look: You see a 'T' in the road to the east.
    west:
      to: tba:269:room:26917
      look: The road fades into a path to the west.

"tba:269:room:26919":
