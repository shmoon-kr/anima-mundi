"tba:269:room:26965":
  name: A Small Clearing
  description:
  - >
    You have arrived at what seems to be the uttermost southern point of the Earth.  to the east there
    is what seems to you to be a large Indian-style dwelling of some sort, made of a dark quartz-like
    stone. About half way up it you can see the outlines of a sealed door.
  - Looking about, you wonder why you begin to hear noises...
  sector: field
  exits:
    east:
      to: tba:269:room:26967
      look: You see the front end of a stone wigwam of some sort.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:269:obj:26967
        reset: locked
    west:
      to: tba:269:room:26964
      look: You see Brush to the west.
  extras:
