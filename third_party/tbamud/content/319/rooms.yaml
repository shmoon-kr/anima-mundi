# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:319:room:31900":
  name: Calm Waters
  description: >
    The waters of the sea are very still here, so still that they bring a feeling of peace and
    comfort.  They are not the dead calm that always is associated with dread in a sailor's heart but a slowly
    moving roll that promises a good day at sea.
  sector: inside
  exits:
    north:
      to: tba:319:room:31921
    east:
      to: tba:319:room:31995
    south:
      to: tba:319:room:31999
    west:
      to: tba:320:room:32055
  extras:
  - keywords: [credits]
    text:
      preformatted: |2
           *Yllythad Sea
           *Written by Kaan for Dibrova
        Level: 10 - 40
        300 rooms
        15 mobs
        9 objs
        Connector Zones: Beach and Lighthouse, McGintey Bay
        This is a fairly large sea made strictly for the purpose of connecting
        new continents and islands to the MUD. The mobs have little eq as most
        of them are fish or other sea-faring animals. This zone can add a
        great deal of openings for builders to add to the overall theme of the
        MUD.
        Zone 319 is linked to the following zones:
        320 Yllythad Sea II                at 31900 (west ) ---> 32055
        320 Yllythad Sea II                at 31901 (west ) ---> 32046
        322 McGintey Bay                   at 31903 (north) ---> 32200
        322 McGintey Bay                   at 31904 (north) ---> 32201
        322 McGintey Bay                   at 31905 (north) ---> 32202
        320 Yllythad Sea II                at 31906 (west ) ---> 32047
        320 Yllythad Sea II                at 31911 (west ) ---> 32048
        320 Yllythad Sea II                at 31916 (west ) ---> 32049
        320 Yllythad Sea II                at 31921 (west ) ---> 32050
        322 McGintey Bay                   at 31926 (north) ---> 32203
        322 McGintey Bay                   at 31931 (north) ---> 32204
        321 Yllythad Sea III               at 31976 (south) ---> 32146
        321 Yllythad Sea III               at 31981 (south) ---> 32141
        321 Yllythad Sea III               at 31986 (south) ---> 32136
        321 Yllythad Sea III               at 31991 (south) ---> 32131
        321 Yllythad Sea III               at 31996 (south) ---> 32126
        320 Yllythad Sea II                at 31996 (west ) ---> 32075
        320 Yllythad Sea II                at 31997 (west ) ---> 32070
        320 Yllythad Sea II                at 31998 (west ) ---> 32065
        320 Yllythad Sea II                at 31999 (west ) ---> 32060
        Links: 01n to the beach

"tba:319:room:31901":
  name: Calm Waters
  description: >
    The calm sooth mind and body, lending a feeling of peace and comfort to any traveler who passes. 
    The waves roll gently by, the ocean seeming harmless and worry-free.  A sandy beach lies just to the
    north, running along the length of a steep cliff face.
  sector: inside
  exits:
    east:
      to: tba:319:room:31902
    south:
      to: tba:319:room:31906
    west:
      to: tba:320:room:32046

"tba:319:room:31902":
  name: Calm Waters
  description: >
    The water is a gently rolling calm here that seems to go on forever.  The sky and the water match
    almost exactly, so blue the water and so clear the sky.  A steep cliff face rises up to the north,
    opening up east of here into a bay.
  sector: inside
  exits:
    east:
      to: tba:319:room:31903
    south:
      to: tba:319:room:31907
    west:
      to: tba:319:room:31901

"tba:319:room:31903":
  name: A Choppy Section of the Sea
  description: >
    The water has grown tumultous and rough here, the waves not high but frequent.  Water splashes into
    the air as the small waves spalsh into each other.  McGintey Bay's entryway lies just north from
    here, in fact from this angle the city itself can be seen.
  sector: inside
  exits:
    north:
      to: tba:322:room:32200
    east:
      to: tba:319:room:31904
    south:
      to: tba:319:room:31908
    west:
      to: tba:319:room:31902

"tba:319:room:31904":
  name: A Choppy Section of the Sea
  description: >
    The wind has picked up a bit and has caused the sea to begin to churn a bit, the water bobbing and
    jumping rapidly.  Every now and again a small fish can be seen jumping up from the wake, searching
    for food on the surface.  McGintey Bay's entryway lies just north from here, in fact from this angle
    the city itself can be seen.
  sector: inside
  exits:
    north:
      to: tba:322:room:32201
    east:
      to: tba:319:room:31905
    south:
      to: tba:319:room:31909
    west:
      to: tba:319:room:31903

