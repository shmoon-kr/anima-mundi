"tba:118:obj:11806":
  type: container
  keywords: [dollhouse, house, dollshouse]
  short: an old and magnificent wooden dollhouse
  long: An old and magnificent wooden dollhouse stands prominently displayed.
  flags: [magic]
  wear: []
  values:
    capacity: 99
    lock_flags: 0
    corpse: false
  weight: 0
  cost: 0
  rent: 0
  level: 0
  extras:
  - keywords: [dollhouse, house]
    text: >
      This intricately fashioned dollhouse looks to be many years old, a thin layer of dust coating its
      nonetheless exceptionally beautiful wooden structure. There are many rooms to this house, some bright
      and large whilst others are darker and drearier, here cobwebs flutter in the corner, and here
      glorious miniature paintings decorate a grand display room.  There are three levels to the house, and each
      seems rather peculiarly to be an independantly designed structure of its own.  Tiny pieces of
      furniture are scattered here and there, realistically placed as though a tiny family actually lived here.  In
      fact, there is an unusual aura around this little house, a slight chill in the dusky air surrounding
      it, and an almost imperceptible murmuring sound of talking, laughing, crying; all echoing faintly
      within the miniature rooms and halls as if tiny ghosts wandered amongst them.

