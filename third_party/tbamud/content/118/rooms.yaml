"tba:118:room:11899":
  name: A Street Corner
  description: >
    This long gray street is wet with puddles from the nearly constant rain here, the splashing sound
    of cars driving past and the cooing of pigeons as they flutter overhead is almost all there is to be
    heard.  It seems mostly deserted, the few people to be seen scurrying quickly about, faces down as
    they rush to their destinations.  All seems dim and dreary, the only warmth is the subtle glow of light
    coming from a shop to the east.
  sector: city
  exits:
    east:
      to: tba:118:room:11802
