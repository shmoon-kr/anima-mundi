# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 118.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:118:room:11800":
  name: Detta's [Dollhouse] Description Room
  description:
  - >
    {bright_blue}Theme:{/bright_blue} This zone is a little abstract, more a sort of
    Alice-in-Wonderland experience that revolves around a strange dollhouse in an antique shop. The idea is to get out once
    you're in, which basically entails completing the quest... a series of mini-quests. Note that to get
    any sense of this zone, you pretty much need to start in the room down from here, and nohassle needs
    to be off. ;)
  - >
    {bright_green}Players:{/bright_green} Mainly for players around level 10-ish, this zone is
    primarily neutral with a couple evil places and a couple good ones. Its been designed as mostly a
    puzzle-solving, quest area, but opportunity for xp to be gained as well, as each completed quest gives 10,000 xp.
  - >
    {bright_red}Location:{/bright_red} The only concrete location in the zone is the beginning room
    which is a London street leading into an antiques shop.
  - >
    {bright_magenta}Secrets:{/bright_magenta} There are now absolutely loads up :), just type LOOK
    SPOILERS to see them, but you'll have more fun here if you don't ;).
  - >
    {bright_cyan}Note:{/bright_cyan} If you have any suggestions, spot any typos, bugs, or weirdnesses,
    please mudmail me - Detta. :-) All input appreciated! You can also email me at
    detta@@builderacademy.net East takes you through the other zones I have built here. Down takes you to the starting room of
    this zone.
  sector: inside
  flags: [indoors, private]
  exits:
    east:
      to: tba:11:room:1100
    west:
      to: tba:27:room:2700
    down:
      to: tba:118:room:11899
  extras:
  - keywords: ["14"]
    text: >
      In room 11859 you can find the angry girl.  She will attack you instantly when you walk in and the
      key to completing this quest is to let her tire herself out attacking you while keeping both her and
      yourself alive.  Once you let her wear herself out she will apologize and ask for a hug, give it to
      her and she will suddenly be a lot more receptive to writing in the journal.
  - keywords: ["12"]
    text: >
      In room 11844 is the emaciated girl, mumbling away absent-mindedly to herself.  To trigger this
      quest, as with almost all the others; just give her the journal.  She will give a little speech about
      sacrifice before asking you to make the ultimate one, and handing you a hotdog.  Now, not being any
      ordinary hotdog, eating it will take a huge chunk out of your hps.  If it doesn't kill you she will hand
      you another one, reminding you that the sacrifice is death. Once you have eaten enough of them to
      render you incapacitated, she will heal you and explain that it was your willingness to make the
      sacrifice that she wanted.  Giving her the journal at any time after this point will cause her to write in
      it for you.
  - keywords: ["11"]
    text: >
      If you enter room 11870 (The Bunkbed Room) you will hear a child's voice telling you to "crawl in
      here".  The command crawl will cause you to crawl under the bed and enter room 11871 where the hiding
      girl is.  Giving her the journal will make her ask you for three things...  Three corpses in
      particular. The corpse of a fish (the red trout - mobvnum: 11830, objvnum: 11856) The corpse of a bird (the
      taildove - mobvnum: 11831, objvnum: 11857) The corpse of a toad (the vile toad - mobvnum: 11832,
      objvnum: 11858) Once you have brought her all three of those things she will apologize and ask for one
      further thing... a secret that Ridley guards. If you go to Ridley and ask her a question with the word
      secret in it she will consent to give it to you. Once you have this item, just return to the hiding
      girl, give it to her and she will offer to write in the journal for you... give it to her and the job
      is done.
  - keywords: ["09"]
    text: >
      The weeping girl is found in room 11864.  As with all of the quests, giving her the journal is what
      triggers it.  She will explain that she is upset because she can no longer spend time in her garden
      because of the monster there.  The quest then is to find is search out the garden west of the porch
      (room 11846) until you see a hideous looking creature.  Kill it, return to the weeping girl and give
      her the journal, and she will write in it for you.  As a side note, examining the mirror in the room
      with her will give you some dynamic information on your character ;)
  - keywords: ["08"]
    text: >
      The blind girl can be found in room 11854.  Giving her the journal triggers her giving you a pair
      of eyes and telling you to examine the walls.  All you have to do is wear the eyes, examine the walls
      as she says, and say aloud the word you see written there.  If its correct she'll agree to write in
      the journal.
  - keywords: ["07"]
    text: >
      The running girl can be found running up and down inside the tunnel in room 11831.  She moves fast,
      so the only way to really interact with her is to follow her..  Which will take you on a bit of a
      spammy ride.  As soon as you give her the journal however, she will come to a halt and tell you that
      all she wants is to be taken out of there.  She agrees to write in it if you will show her the way out
      and agrees to do whatever you say.  The key here is that she does just that, whatever you speak she
      does...  So if you say north, she moves north etc. All you have to do is lead her with speech to the
      vortex and through it.  Once on the other side she will happily write in the journal when you give it
      to her.
  - keywords: ["05"]
    text: >
      Ridley can be found playing with alphabet blocks in room 11836.  If you give her the journal she'll
      launch into a little speech and finally decide to write in it if you bring her three things.  She'll
      give you a black box and ask for a fruit, a flower, and a flying thing, and for you to return them
      in the box. The fruit is obj 11828 and loads in room 11837. The flower is obj 11832 and loads in room
      11831. And the flying thing is a little mob (11821) that basically wanders all over. The trick to
      giving her this thing is to type CAPTURE INSECT in the same room as it. This will then let you put it in
      the box with the rest of the things. Once all three things are in the box, just give it to her, and
      she'll write in the journal as well as giving you a sword that you'll need for later. ;) Oh, the
      insect will escape from you after a while, so make sure to put it in the box if you don't want to lose it.
  - keywords: ["04"]
    text: >
      The coloring child is super easy to deal with, she is in room 11809 and just wants a red crayon. 
      Give her the journal as always to trigger the quest, then find the red crayon in room 11812 (where the
      playing child is).  Once you give her the crayon she'll accept the journal and write in it.
  - keywords: ["03"]
    text: >
      The playing child can be found in room 11812 (Their Room), once you give her the journal she will
      hand it back and tell you she wants you to release the bird kept in the house.  She'll also give you a
      key (referred to as Pin) so that you can unlock the cage.  You'll find the bird inside a cage in
      room 11818, just unlock the cage and take the bird out to release it.  Then the playing child will write
      in the journal when you give it to her.  Additionally, the key she gave you will open the door that
      The Way to the Middle leads to from The Crossroads.
  - keywords: ["02"]
    text: >
      Okay, this is basically the main point of the zone.  When you are teleported by the dollshouse you
      find yourself in a room with a girl who gives you an eye. If you OPEN EYE you will continue with the
      quest, CLOSE EYE to hightail it out of there.  For those who continue on, they will be teleported to
      a crossroads and given a journal.  The basic idea behind the journal is that its empty when you start
      off, the only way to get it filled is to give it to the various mobs you find, and complete their
      mini quests to get them to write in it.  The goal is to find all those mobs, get them all to write in
      it, and complete the journal.  :)
  - keywords: ["01"]
    text: >
      Once you enter the Antique shop, the saleswoman should greet you.  The main item to look out for
      here is of course the dollshouse ;).  Looking at it or examining it should trigger some prompts from
      the saleswoman as to the doll that came with it.  Removing the doll from the dollshouse will cause you
      to be teleported, essentially triggering your quest within the zone.
  - keywords: [spoilers]
    text: >
      Ahhh, cheater!!  Don't you want to enjoy the zone?!  *sniff*, ok, if you really have to look there
      are a few little neat zone inclusions listed here to spoil your zone exploring pleasure.  Just type
      look and then the number to look at each one (look 1 for example). 01: The Antique Shop 02: The
      Journal Quest 03: The Playing Child 04: The Coloring Child 05: Ridley 06: The Tunnel-man 07: The Running
      Girl 08: The Blind Girl 09: The Weeping Girl 10: The Fidgety Girl 11: Ruth 12: The Emaciated Girl 13:
      The Silent Girl 14: The Angry Girl 15: The Scarred Child 16: The Ghostly Girl 17: The Fiery Bloodstone
      Amulet
  - keywords: ["6"]
    text: >
      The tunnel-man can be found in room 11831, once you give him the journal he asks you to enter the
      tunnel and destroy some of the secrets there.  Typing ENTER will put you through the vortex and into
      another area where secrets are roaming wildly in the form of dark figures.  Once you've killed fifteen
      of them, the tunnel-man will accept the journal and write in it.  He'll also tell you of how many
      you've killed if you hand the journal to him before you've killed all fifteen.
  - keywords: ["10"]
    text: >
      The fidgety girl hangs out in room 11863 and is a pretty unstable character. Once you give her the
      journal she'll ask you to play a game with her...  If you win three times she'll write in the book
      for you.  The bad part?  Every time you lose she slashes her arm with frustration, if she does that
      three times without healing she'll die.  Its a simple cup and ball game though, so hopefully not too
      difficult..  She just puts the ball under a random cup, and then randomly mixes them around.  If you
      pick the right cup you win.  She keeps track of your score and once you have won three times (it does
      not have to be concurrently), just give her the journal again.
  - keywords: ["13"]
    text: >
      The silent girl can be found in room 11852, and is silent for one major reason - her lips have been
      stitched together.  She will indicate this when you give her the journal, hopefully providing the
      hint that she wants something done about it.  Examining her will offer the idea that you have to cut
      them, and with no ordinary sword.  The sword you need is the sword of words (obj 11835), which Ridley
      gives you upon completion of her quest.  If you have it, just type cut, and the stitching will weaken
      enough to allow her to speak, and agree to write in the journal.
  - keywords: ["15"]
    text: >
      The scarred child hangs out in room 11872 (Inside the Gazebo), giving her the journal will launch
      her into a speech about her own lost story.  Choked by the pines she says it is, and the only way to
      get it back is to burn them down and recover the pages from the ashes.  With this task set, she gives
      you a flickering candle and asks you to return all the pages to her.  There are five pines throughout
      the zone and all must be burned down to retrieve the right amount of pages.  In rooms (11850, 11849,
      11848, 11820, 11837) is where they can all be found.  As long as you have the candle somewhere on
      your person, typing BURN PINES will set the trees on fire.  They will burn for about three minutes
      before leaving nothing but a black page.  Return all five pages to the girl and she will offer to write
      in the journal.  Once this is done, she will also give you the completed book and ask you to return it
      to the house somewhere, just as a favor to her.
  - keywords: ["16"]
    text: >
      The ghostly girl can be found in room 11848 and is the last mob that must be approached.  If you
      approach her before completing every one of the other quests she will remind you of this.  If they are
      already completed and you give her the journal she will make the request that you kill her and bury
      the corpse in the room.  Once you do this, her invisible spirit will complete the last entry in the
      journal for you, and you will be returned to the antique shop where the entire quest started.
  - keywords: ["17"]
    text: >
      Once you are returned to the antique shop, a young woman will approach you with an interest in the
      journal.  If you give it to her she will exchange it for a fiery bloodstone amulet.  This amulet has
      the power to move you to a safe place whenever you use it.  This can however, only be used about once
      every 20 minutes, as the amulet needs to recharge itself.

"tba:118:room:11801":
  name: A Dimly-lit Room
  description: >
    An all but silent, featureless room curves gently around in an oddly oval shape.  Smooth walls glow
    faintly, a gentle light pulsing from the polished white floor.  Vague muffled noises can be heard
    from very far away, the border of the room shimmering transparantly now and again and allowing glimpses
    of other places.  There are no windows, no doors or exits, but then it seems that not much here
    actually exists at all.
  sector: inside
  flags: [indoors, peaceful]
  extras:
  - keywords: [gentle, light]
    text: >
      Smoothly dome-shaped and a subtle cream color, this melon-sized light sends pulses of light
      spreading out over the whole room.

"tba:118:room:11802":
  name: A Dusty Antiques Shop
  description: >
    The smell of time and decay lingers heavy in the air, along with the various sparkling particles of
    dust.  Cobwebs flutter in the darker corners of the ceiling beams, weary wood panelling flaking
    slightly with dried paint.  Various old and forgotten items lie cluttered around the place, even the shop
    counter is cracked and sagging beyond repair.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    west:
      to: tba:118:room:11899
      look: >
        The sound of splashing puddles and car engines can be heard, a cool draft wafting from the damp,
        gray street outside.
  extras:
  - keywords: [sparkling, particles, dust]
    text: >
      These silver specks dance carelessly in the gentle wafts of air, turning and sparkling like tiny
      stars in each shaft of light.
  - keywords: [cobwebs, darker, corners, ceiling, beams]
    text: >
      Fine silvery threads mark the perpetual residence of spiders in these dark parts of the room.  Some
      of the older webs are dimmed and gray with time, flapping like indignant hands trying to shoo
      visitors away.
  - keywords: [weary, wood, panelling, dried, paint]
    text: >
      A sombre dark wood has been painted with a cheerful lick of paint, presumably to brighten it up. 
      However the paint has been left to flake and peel away, leaving the walls looking even more ghastly.
  - keywords: [old, forgotten, items]
    text: >
      Old-fashioned children's toys seem to make up the bulk of the items here, tiny china dolls and
      wooden cars.  Some delicate jewellry boxes can be spied glinting from the higher shelves, along with
      crystal ornaments of many kinds.
  - keywords: [shop, counter]
    text: >
      It looks almost as if someone had a fit of rage and pounded on it, a long black crack running along
      its length so that it barely holds up its own weight.

"tba:118:room:11803":
  name: Entrance to a Grand House
  description: >
    Darkly polished wood flooring sparkles beautifully as both natural and artificial light dance
    across the surface.  It appears this is the entrance to a rather grand house, large adjacent rooms are
    openly visible and soft woodwind music echoes off the distant walls and ceiling.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11810
      look: The hallway continues on to the north, the hard flooring covered with a rug.
    east:
      to: tba:118:room:11816
      look: >
        Bright, cheery light almost blinds the view of this large room.  The smell of spices and a subtle
        waft of heat come from this direction.
    south:
      to: tba:118:room:11804
      look: >
        The hallway continues on, soft glowing light filling the pale walls and a leafy plant only just
        visible in the corner.
    west:
      to: tba:118:room:11821
      look: >
        This large oakdoor is as magnificent as the expensive house that lies beyond it, carved with
        beautiful patterning and polished until smooth and glossy.
      door:
        keywords: [oakdoor]
        kind: door
        reset: closed

"tba:118:room:11804":
  name: A Bright Hallway
  description: >
    Smooth, unblemished walls seem to glow softly from the light that cascades along this long north to
    south corridor.  Two oriental parasols stand decoratively in the corners, the rest of the
    substantial floor left open and spotlessly clean.  A subtle perfumed scent fills the air, creating a peaceful
    sleepy atmosphere.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11803
      look: >
        The hallway stretches spaciously to the north, a gentle draft coming from the entrance of the house
        just ahead.
    down:
      to: tba:118:room:11805
      look: >
        Little polished steps lead carefully down into a brightly lit room, a rumbling sound coming
        distantly from below.
  extras:
  - keywords: [two, oriental, parasols]
    text: >
      These delicately feminine parasols are designed to shade the effects of the sun, being used here
      however for simple ornamental purposes.  The intricate floral pattern and woven lace making them
      stunning decorations.
  triggers: [tba:118:trg:11808]

"tba:118:room:11805":
  name: A Little Nursery
  description: >
    This room appears to be below ground level, horizontal windows running all around the upper edges
    of the walls, half obscured with outside grasses. Bright fluorescent light illuminates the place, tiny
    children's chairs placed neatly next to bookshelves full of brightly colored books.  A little
    plastic teaparty set sits carefully arranged on a round table, and several metal cars sparkle from where
    they sit lined against the southern wall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11815
      look: >
        A large wood-panelled room lies to the north, filled with pieces of what look to be electronic
        equipment.
    east:
      to: tba:118:room:11806
      look: >
        Here the wood flooring begins to give way to shiny tiles, the low rumble of a washing machine
        reverberating from just ahead.
    up:
      to: tba:118:room:11804
      look: >
        Beautifully polished wooden steps lead up a little ways into what seems to be a hall, the green
        leaves of some tall plant just in view.
  extras:
  - keywords: [tiny, children's, chairs]
    text: >
      These vibrantly colored plastic chairs sit low to the ground, just perfect for young children and
      toddlers.
  - keywords: [bookshelves, brightly, colored, books]
    text: >
      These books are mostly educational, reading and writing as well as mathematical titles display
      themselves proudly.  One shelf holds an assortment of Disney and fantasy stories, and yet another holds
      several coloring books.
  - keywords: [little, plastic, teaparty, set, round, table]
    text: >
      A low plastic table holds an assortment of pretty little cups and saucers, make believe biscuits
      made out of cardboard sit almost too perfectly in a plate on the little lacey tablecloth.
  - keywords: [several, metal, cars]
    text: >
      These little cars have smoothly rounded edges, and are too large for a young child to swallow,
      glistening brightly in every color of the rainbow they look as if they'd be almost irresistable to play
      with.
  - keywords: [horizontal, windows]
    text: >
      These little windows are trimmed with lacey curtains, a few purple flowers nodding lazily just
      outside.

"tba:118:room:11806":
  name: A Concrete Corridor
  description: >
    Smooth tiling covers the concrete flooring here, bright coats of paint making the equally concrete
    walls glisten cheerfully.  The hall seems to drone gently as the sound of churning laundry echoes
    along the unyielding walls and ceiling. Little oily handprints smudge here and there on the otherwise
    clean surfaces, and one or two toys lie recently dropped.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11808
      look: >
        The hall seems to end at a corner to the east, perhaps one more little door visible further ahead.
    south:
      to: tba:118:room:11807
      look: >
        A little bedroom opens to the south, delicate tinkling sound playing from this direction, the tune
        of a nursery rhyme it seems.
    west:
      to: tba:118:room:11805
      look: >
        The hall seems to open up into a larger room, several pieces of children's furniture settled
        against the near wall.
  extras:
  - keywords: [toys]
    text: >
      These toys look a little out of place in such tidy surroundings, little lego bricks and a jigsaw
      puzzle piece lie dropped along the center of the floor, as though someone carried a pile of toys too
      large for their arms and lost a few along the way.
  - keywords: [oily, handprints]
    text: >
      These are very small handprints indeed, and freshly made, perhaps those of a very young child, or a
      baby just learning to walk.

"tba:118:room:11807":
  name: A Baby's Room
  description: >
    A tall wooden cot stands neatly tucked to one side of the room.  On the other, a changing table and
    a toy box occupy the space against the wall, a high window letting in natural lighting that cascades
    gently along the sky-blue walls.  A little music box plays quietly, filling the room with tinkling
    melody that echoes vibrantly off the hard floor and walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11806
      look: >
        A brightly lit hallway lies ahead, a shiny appliance standing against the far wall amidst scattered
        toys.
  extras:
  - keywords: [tall, wooden, cot]
    text: >
      This little cot is somewhat reminiscent of a cage, the long wooden bars painted a cheerful white
      but covered with smudgy handprints.
  - keywords: [changing, table]
    text: >
      Made from a bright yellow plastic, and equipped with several shelves, this table is stocked with
      all things necessary for, well, changing nappies.
  - keywords: [toy, box]
    text: >
      Little toys spill out of this brightly colored but unremarkable box, the odd stuffed arm of a doll
      or teddybear amongst little lego bricks and crayons.
  - keywords: [high, window]
    text: >
      Green grasses obscure much of the view, little yellow dandelions growing in what seems to be a
      neglected part of the garden outside.
  - keywords: [music, box]
    text: >
      The shape of a little piano, this clear plastic music box tinkles gently with the sleepy tune of
      Twinkle Twinkle Little Star.

"tba:118:room:11808":
  name: A Concrete Corridor
  description: >
    A little draft fills this end of the corridor, though there are no windows, leaving this room
    somewhat dim.  Little tufts of dust fluff blow quickly across the floor, snagging here and there and
    wriggling in the air currents like little spiders.  Cheerful licks of paint attempt to brighten the walls
    and floor, succeeding in opening the space up a little, making it look larger and lighter.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11809
      look: >
        It seems a little bedroom lies in this direction, a few flecks of light dancing along the floor
        from some crystal ornament.
    west:
      to: tba:118:room:11806
      look: >
        Stretching on to the west, the bright hallway seems relatively bare except for the presence of a
        large washing machine further ahead.
  extras:
  - keywords: [tufts, dust, fluff, spiders]
    text: >
      They look like bits of lint and fluff from clothing, unremarkable except for the fact that they are
      wriggling in the breeze as though alive.

"tba:118:room:11809":
  name: A Little Girl's Room
  description: >
    A little low bed sits snugly in the corner, covered with pale pink flowery quilting.  The walls are
    a bright sunshine color, delicate hanging ornaments casting flecks of light from the high window
    spiralling around the room.  Small fluffs blow quickly across the hard floor from the corridor outside,
    giving the somewhat uncomfortable impression that little insects are darting in and out of the
    flickering shadows.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11808
      look: >
        A somewhat dim hallway lies ahead, the stark coldness of concrete walls contrasting with the
        coziness of this little room.
  extras:
  - keywords: [low, bed]
    text: >
      This child's bed is made from a light colored wood that has been smoothly polished, tiny little
      pieces of glitter have been stuck to it as decoration.
  - keywords: [delicate, hanging, ornaments]
    text: >
      A little windchime hangs, tinkling every now and again in the breeze, and a long crystal spiral
      plays with any light as it twirls.
  - keywords: [high, window]
    text: >
      Tall grasses can be seen waving just slightly above window level, indicating that this room is
      below ground.

"tba:118:room:11810":
  name: A Bright Hallway
  description: >
    Hardwood flooring reflects the streams of light from the south, a small neatly woven rug lessening
    the effect, but even the amber walls seem to shine almost white.  A few family photos decorate the
    walls, the rest of this spacious area left pleasingly uncluttered.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11803
      look: >
        The hall grows colder to the south, probably because of the large entrance way and the fact that
        not even a rug softens the floor.
    up:
      to: tba:118:room:11811
      look: >
        The lighting becomes gently dimmed, and hard flooring gives way to soft lush carpeted stairs
        leading upward..
  extras:
  - keywords: [small, neatly, woven, rug]
    text: >
      This little rug has been delicately woven from fine materials, dark greens and blues backing a
      purplish flower pattern that stands out vibrantly in the otherwise stark surroundings.
  - keywords: [few, family, photos]
    text: >
      These neatly framed pictures look to be recent snapshots of the family here. A solemn unshaven man
      and a starry-eyed young woman hold two tiny children on their laps.  The small girl has her arm
      around what presumably is her baby brother, both smiling toothlessly.

"tba:118:room:11811":
  name: A Carpeted Hallway
  description: >
    This whole hallway is filled with an almost shimmering warmth from a nearby heat source.  Soft
    lighting illuminates the cream walls and thick carpeting.  A subtle orange glow comes from several
    plugged in nightlights, flickering gently almost like firelight, and the lingering smell of aromatic
    candles dances in the air.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11814
      look: A small cupboard can be seen, its contents hidden in the shadows of dim yellow lighting.
    east:
      to: tba:118:room:11812
      look: >
        A deep red wood door leads the way to what is assumably a bedroom, judging by the Mum and Dad's
        Room sign that hangs from it.
      door:
        keywords: [door, red, wood]
        kind: door
    west:
      to: tba:118:room:11813
      look: >
        A black door frames the entrance to a small room, an elegant brass handle slightly askew as if the
        locking mechanism has been sabotaged.
      door:
        keywords: [door]
        kind: door
    down:
      to: tba:118:room:11810
      look: >
        The shiny reflective surface of hardwood flooring can be seen glinting in the subtle light at the
        bottom of the stairs.
  extras:
  - keywords: [sign]
    text: "{bright_blue}MUM AND DAD'S ROOM{/bright_blue}"
  - keywords: [nightlights]
    text: >
      These small plastic lights give off just enough illumination for walking around without bumping
      into things.

"tba:118:room:11812":
  name: Their Room
  description: >
    A gloriously large room has been carefully decorated with dark wood furniture and rich tones of
    burgundy and red.  A delicate chandelier casts sparkling flecks of light dancing over the softly colored
    walls and lush cream carpet. A large double bed stands centrally against the northern wall, neatly
    made with slippery satiny quilts and plump pillows.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11811
      look: >
        A dark red wood door frames the exit to the hallway, its pretty ceramic doorknob decorated with
        paintings of flowers.
      door:
        keywords: [door, red, wood]
        kind: door
  extras:
  - keywords: [slippery, satiny, quilts, plump, pillows]
    text: >
      These soft padded blankets and pillows are covered with a shimmering red fabric, the same rich
      color as a deep glass of wine.
  - keywords: [large, double, bed]
    text: >
      Smooth cherry wood has been sculpted carefully into this beautifully carved four-poster bed, large
      enough for two adults to sleep comfortably.
  - keywords: [delicate, chandelier]
    text: >
      This pretty little light fixture has been made from glass beads and pendants dangling from delicate
      metal chains.  The resulting effect is one of a brilliant shimmering dome of light.

"tba:118:room:11813":
  name: A Spotless Bathroom
  description: >
    White tiles gleam spotlessly white like rows of smiling teeth along the walls.  A pale blue counter
    top is neatly covered with various bottles of cleansers and lotions.  Against the northern wall, a
    rather large and deep bath is surrounded with a pretty blue shower curtain, and a little oil burner
    stands next to the sink, filling the room with the fragrance of lavender.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11811
      look: >
        A black door frames the entrance to a hallway, an elegant brass handle slightly askew as if the
        locking mechanism has been sabotaged.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [little, oil, burner]
    text: >
      This small cermaic pot holds a basin full of sweet smelling oil, a flickering candle beneath it
      heating the liquid and filling the air with the aroma.
  - keywords: [pretty, blue, shower, curtain]
    text: >
      Swirling streaks of blue represent ocean waves, little purple shells and jumping dolphins making up
      the rest of the scenery.
  - keywords: [large, deep, bath]
    text: >
      Sparkling white, this bathtub looks almost as if it is never used at all, except for the big opened
      bottle of bubble bath that sits to the side.
  - keywords: [various, bottles, cleansers, lotions]
    text: >
      Amongst these relatively unremarkable supplies are the visible brand names of moisturisers and
      perfumes, most of them half-used.

"tba:118:room:11814":
  name: A Little Airing Cupboard
  description: >
    Heat shimmers lazily in the air from the large metal pipes that run through this cupboard, making
    it almost stiflingly hot.  The smell of fresh, warm fabric fills the air from the various piles of
    quilts, blankets and towels that fill each wooden shelf.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11811
      look: >
        A long hallway can be seen stretching to the south, filled with soft lighting and lush, padded
        carpet.
  extras:
  - keywords: [quilts, blankets]
    text: >
      These folded piles of quilting smell absolutely delicious, as though they are fresh from a hot wash
      and a long dry in mountain breezes.

"tba:118:room:11815":
  name: The Recreation Room
  description: >
    This large room is walled with warm wooden panels, giving it a log cabin appearance.  Soft lamp
    shades glow from every corner, and a few brightly lit electronic games stand against the walls.  A large
    stereo system hums quietly with unused volume, and a dart board hangs amidst several pinholes on the
    northern wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11805
      look: A large room to the south can be seen filled with various toys and children's furniture.
  extras:
  - keywords: [dart, board]
    text: >
      Seemingly well used, this circular board is filled with hundreds and hundreds of tiny black holes,
      a great deal of them within the bullseye.
  - keywords: [large, stereo, system]
    text: >
      This jet-black system blinks quietly with dozens of little green lights. Two massive speakers stand
      either side of it, practically prickling with the static of potential sound.
  - keywords: [electronic, games]
    text: >
      These large machines are reminiscent of what you'd find in an arcade game facility, amongst the
      various flashing lights pinball and pacman can be seen.
  - keywords: [soft, lamp, shades]
    text: >
      These shades are made from cream-colored tassled fabric, the kind that shows any speck of dust,
      only these are in absolutely pristine condition.

"tba:118:room:11816":
  name: A Cheery Kitchen
  description: >
    Warm and friendly colors decorate this whole room, soft amber walls complimenting gentle reddish
    tones in the wood counter tops and cupboards.  The hard flooring is somewhat darker, laid in long
    wooden strips and polished until gleaming.  The smell of spices and fresh baking bread fills the air,
    along with the fading aroma of burning citrus candles.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11817
      look: >
        Dark red carpet leads the way into a spacious livingroom, the sound of birds chirping coming from
        an open window.
    west:
      to: tba:118:room:11803
      look: >
        A large entranceway gives off an air of space and light, a large door framing the way to the
        outside.

"tba:118:room:11817":
  name: A Grand Living Room
  description: >
    Dark red carpet covers the whole of this open spacious room, long windows let in natural light and
    fresh breezes from outside, and tranquil music can be heard playing softly from nearby.  Rich
    mahogany sofas padded with black leather stand against the eastern wall and a glass cabinet full of crystal
    stands to the north along with three small steps continuing on.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11818
      look: >
        The sound of gentle music wafts on the air, three steps leading up into a smaller but nevertheless
        spacious room.
    east:
      to: tba:118:room:11819
      look: >
        Fresh air breezes down from the mountains, a large wooden patio looking out over a swimming pool.
    west:
      to: tba:118:room:11816
      look: >
        The plush carpet gives way to clean tiling, an open kitchen filling the air with smells of cooking.
  extras:
  - keywords: [glass, cabinet, crystal]
    text: >
      Smooth glassy shelves hold an array of crystal ornaments, tiny glittering swans and teddy bears
      sparkling in rows.
  - keywords: [righ, mahogany, sofas]
    text: >
      Carefully sculpted wooden frames hold a luxurious array of padded leather cushions, the smooth
      black texture of the sofa looking comfortable and inviting.

"tba:118:room:11818":
  name: The Music Room
  description: >
    This large, breezy room is naturally lit by several large open windows, delicate curtains
    whispering in the wind.  Soft music plays from an elaborate sound system, and several cd racks are lined up
    against the wall.  Rich burgundy carpet covers the whole of the floor, deep blood-red in stark contrast
    to the pale cream colored walls.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11817
      look: >
        Three small steps lead down into a larger livingroom, fresh air breezing in through all the large
        open windows.
  extras:
  - keywords: [cd, racks]
    text: >
      Various instrumental cds make up the bulk of the collection, panpipes and piano the most commonly
      featured kind.

"tba:118:room:11819":
  name: A Big Wooden Patio
  description: >
    A glorious mountain scene spreads infinitely in every direction, graying peaks and crystal snow
    sparkling along the horizon, dotted here and there with dark green pine trees.  This open patio is made
    of dark burgundy wood, coated with glossy sealant so that it shines as though marble.  Creeping
    plants wind their way around each wooden post, bright fuschia and pink clematus flowers blossming
    abundantly.
  sector: mountains
  exits:
    east:
      to: tba:118:room:11820
      look: >
        A clear swimmingpool shimmers gently as the watery surface stirs, green leaves from the surrounding
        trees twirling in the air.
    west:
      to: tba:118:room:11817
      look: >
        The large livingroom of a beautiful house lies to the west, red carpet and long flowing curtains
        fluttering elegantly in the breeze.

"tba:118:room:11820":
  name: A Large Outdoor Swimming Pool
  description: >
    Crystal clear blue water sparkles as it ripples lazily, gentle shimmering steam filling the air
    around this pool.  Shallow at one end, it gradually grows deeper, a small metal ladder attached to the
    side at the deepest end.  Green, blooming plants grow all around, large trees overhanging so that
    their trailing branches caress the water with each breeze.
  sector: water_swim
  exits:
    north:
      to: tba:118:room:11895
      look: >
        Mountain landscape stretches all around, the gentle babbling of a small stream breaking the silence
        of the air.
    west:
      to: tba:118:room:11819
      look: >
        A large wooden patio leads the way into a grand house, the subtle sound of music coming from within.
  extras:
  - keywords: [large, trees]
    text: >
      These gently swaying trees appear to be weeping willows, long trailing stems hanging gracefully
      down from the bent trunks.
  - keywords: [green, blooming, plants]
    text: >
      Amongst the assorted flowers and greenery, hibiscus and clematus can be seen, large red and magenta
      blossoms splashing colorfully through the green.
  - keywords: [small, metal, ladder]
    text: >
      This simple ladder is fastened to the side of the pool, enabling swimmers to climb either in or out.

"tba:118:room:11821":
  name: Way to the Beginning
  description: >
    To the east stands the large oak door of an impressive and beautiful house. Vast mountainside
    slopes continually upward, the graying peaks topped with white clouds.  Soft open breeze carries the green
    scent of growth and life, new grass and dark fragrant pine trees.  Beautiful untouched landscape
    spans all around, the grassy paths sparkling softly with a sprinkling of fresh dewy tears.
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:118:room:11803
      look: >
        This large oakdoor is as magnificent as the expensive house that lies beyond it, carved with
        beautiful patterning and polished until smooth and glossy.
      door:
        keywords: [oakdoor]
        kind: door
        reset: closed
    west:
      to: tba:118:room:11822
      look: >
        A white dome-shaped structure can be seen, adorned with pale green leaves and large red blossoms.

"tba:118:room:11822":
  name: The Crossroads
  description: >
    Delicate wooden posts bend into a dome-shaped enclosure, painted white and adorned with spiralling
    green vines.  Red blossoms hang amidst the whispering leaves like scarlet tears, the ghostly wind
    hushing as it drifts restlessly here and there.  The place has an air of quiet acceptance, and yet the
    air is uneasy, warm and soft one moment before changing to frosty chill the next.  Little sparks
    flicker randomly in the air, murmuring as they linger, only to fade and die like half spoken words.
  sector: field
  exits:
    north:
      to: tba:118:room:11823
      look: >
        A quaint English house lies to the north, a little cobblestone road winding its way to the modest
        front door.
    east:
      to: tba:118:room:11821
      look: >
        A gentle path winds its way to a grand house, set in a towering and rugged mountain landscape.
    west:
      to: tba:118:room:11824
      look: >
        Brown, bleak praries stretch to the west, huddled at the far end of the path a house is visible
        within a cluster of trees.
  extras:
  - keywords: [red, blossoms, scarlet, tears]
    text: >
      Little smatterings of golden pollen blossom into a full crimson head of petals, hanging wearily
      downward as though too heavy a burden for the stems that bear them.
  triggers: [tba:118:trg:11813]

"tba:118:room:11823":
  name: Way to the Middle
  description: >
    This appears to be a path through a quiet English town, little wooden fences surrounding the tiny
    brick houses and green flourishing gardens.  To the north the blue wooden door to a well-sized house
    stands, a little driveway leading into a garage at the side.  The sounds of birds chirping can be
    heard all around, and the subtle tinkling of a windchime though the air is still and breathtakingly
    cold.  To the north, a wooden door guards the way.
  sector: city
  exits:
    north:
      to: tba:118:room:11825
      look: >
        This painted wooden door is relatively unnoteworthy, apart from its bright blue color.  Time and
        dampness are already making their presence known through the creeps of dark moulds that begin to infest
        the wood.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:118:obj:11823
        reset: locked
    south:
      to: tba:118:room:11822
      look: >
        A white dome-shaped structure can be seen, adorned with pale green leaves and large red blossoms.
  extras:
  - keywords: [garage]
    text: >
      A large garage stands, closed to the outside and padlocked, its large metal door painted blue.

"tba:118:room:11824":
  name: Way to the End
  description: >
    Bleak, brown-grassed plains stretch all around, the movements of gophers flickering upon the
    landscape, coyotes and cattle roaming in groups as far as the eye can see.  To the west, a large wooden
    house stands, sheets of opaque plastic covering every window, and trees growing closely around as though
    huddled in some secret understanding.  A dark black door guards the way to the west.
  sector: field
  exits:
    east:
      to: tba:118:room:11822
      look: >
        A white dome-shaped structure can be seen, adorned with pale green leaves and large red blossoms.
    west:
      to: tba:118:room:11840
      look: >
        This large door has been painted with a thick layer of black paint, making it seem more like a
        yawning hole than a doorway.  A layer of sticky tape has been fastened all the way around it, sealing
        even the tiny gap that links the inside to outside.
      door:
        keywords: [blackdoor]
        kind: pickproof
        key: tba:118:obj:11855
        reset: locked
  extras:
  - keywords: [plastic, opaque, sheets, windows]
    text: >
      The plastic rustles eerily, covering the span of the windows so that nothing can be seen within, a
      layer of dirt and grime streaked across the rippling sheets.

"tba:118:room:11825":
  name: A Small Front Porch
  description: >
    This small porch is cluttered with various coats and jackets hung against the walls.  Scattered
    shoes are half heartedly flung onto and beneath the provided shoe rack, scrapes of dried mud and dirt
    darkening the faded yellow floor.  A slightly mouldy wooden door stands to the south, apparently the
    way outside.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11833
      look: >
        A moderate-sized livingroom opens to the east, filled with patterned furniture and wooden shelving.
    south:
      to: tba:118:room:11823
      look: >
        This painted wooden door is relatively unnoteworthy, apart from its bright blue color.  Time and
        dampness are already making their presence known through the creeps of dark moulds that begin to infest
        the wood.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:118:obj:11823
        reset: closed
    up:
      to: tba:118:room:11826
      look: A long flight of carpeted stairs leads into the upper level of the house.
  extras:
  - keywords: [coats, jackets]
    text: >
      Most of the coats and jackets here are in states of disrepair, starting to tear or fray in places,
      and covered with smudges of grass and dirt.

"tba:118:room:11826":
  name: Top of the Stairs
  description: >
    The large wooden post of a banister marks the edge of the stairs here, smells of cooking wafting
    from below.  The carpet is pulled up in places, exposing a few little tacks that look painful to step
    on, a few half bent nails lying off to the sides as if renovation is being done here.  Fresh breeze
    drafts in from an window to the west, allowing a clear view out onto the street.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11827
      look: >
        A wooden banister winds its way around to the east, separating the stretch of hallway from the
        descending stairs.
    west:
      to: tba:118:room:11839
      look: >
        This large wooden window looks as though it is normally propped open, chips of paint peeling off
        the window frame around.
      door:
        keywords: [window]
        kind: door
    down:
      to: tba:118:room:11825
      look: A long flight of carpeted stairs leads into the lower level of the house.
  extras:
  - keywords: [tacks, nails]
    text: >
      These little bits of rusty metal look to have been pulled from the floor in some kind of renovation
      and abandoned in the midst of the work.

"tba:118:room:11827":
  name: A Banistered Hallway
  description: >
    Long and narrow, this hallway is mostly undecorated, beige carpet fraying slightly at the edges
    where it meets the wall.  A wooden banister runs along the western side, guarding a potentially nasty
    slip down the stairs, and a single light hangs here, dark blotches visible on the light shade where
    various bugs have been attracted to an untimely death.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11828
      look: A white door leads into a small bathroom, soft carpet giving way to smooth hard tiles.
      door:
        keywords: [door]
        kind: door
    east:
      to: tba:118:room:11829
      look: >
        A wooden door leads the way into the master bedroom, its smooth brass doorknob slightly worn with
        use.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:118:room:11830
      look: >
        The hallway extends to the south, leading to what look to be two small bedrooms, flanked on the
        western side by a wooden banister.
    west:
      to: tba:118:room:11826
      look: >
        Curving around, the hallway leads to the top of a flight of stairs, a wooden banister blocking the
        view of what lies below.
  extras:
  - keywords: [wooden, banister]
    text: >
      Carved simply, this banister is made up of a series of wooden poles, fastened together in a kind of
      fence framework to shield the gap where the stairs plunge downward.

"tba:118:room:11828":
  name: A Modest Bathroom
  description: >
    Cramped but cheery, this little bathroom is laid with blue and white tiles, the deep bathtub
    surrounded by a pale bule shower curtain.  A small frosted window looks out over the back garden, the glass
    pane propped up slightly so that fresh air drifts around the room.
  sector: inside
  exits:
    south:
      to: tba:118:room:11827
      look: A white door leads into an open hallway, smooth hard tiles giving way to soft carpeting.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [small, frosted, window, back, garden, glass, pane]
    text: >
      The view into the garden reveals a bright collection of daffodils and roses, sweeping green trees
      shielding the majority of the ground from view.

"tba:118:room:11829":
  name: Their Room
  description: >
    A faded floral wallpaper lines the pale walls, a single lampshade hanging from the ceiling, casting
    a soft glow around the room.  Dark wood furniture stands either side of the large double bed, a
    thick flowery quilt spread neatly over it and several pillows propped against the headboard.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11827
      look: >
        A wooden door leads the way into the hallway, its smooth brass doorknob slightly worn with use.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [dark, wood, furniture, double, bed]
    text: >
      This large bed stands in the middle of the room, squarely cut and slightly rough looking as if it
      has been bought second-hand, or merely used for many years.

"tba:118:room:11830":
  name: A Banistered Hallway
  description: >
    A long wooden railing runs along the western side of this hallway, simply carved posts standing far
    enough apart to allow a good view of the stairs stretching beneath.  The light colored carpet is a
    bit worn, old stains and fraying edges indicating its long overdue replacement.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11827
      look: >
        The hallway extends onward to the north, leading past another bedroom and a bathroom before curving
        around into a flight of stairs.
    east:
      to: tba:118:room:11831
      look: >
        A wooden door guards the way into a small bedroom, a few flakes of white paint peeling from its
        surface.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:118:room:11832
      look: >
        A heavy rectangular door guards the way to what looks little more than a large closet, although it
        seems to have been converted.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [wooden, railing]
    text: >
      Carved simply, this railing is made up of a series of wooden poles, fastened together in a kind of
      fence framework to shield the gap where the stairs plunge downward.

"tba:118:room:11831":
  name: A Girl's Bedroom
  description: >
    Pale pink, the walls are decorated with large stickers of cartoon characters. Lacey rose curtains
    blow gently in the wind, bright twirling suncatchers capturing any rays of light and scattering them
    dancing around the room. Little wooden dressers stand against the western wall, colorfully handpainted
    with images from Bambi and Snow White.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11830
      look: >
        A wooden door guards the way into the outer hallway, a few flakes of white paint peeling from its
        surface.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [twirling, suncatchers]
    text: >
      These pretty little suncatchers are made from long spirals of glass, attached to a silver thread
      and hung from the ceiling to twirl in the stirring air.
  - keywords: [stickers, cartoon, characters, wooden, dressers, images]
    text: >
      Various depictions of Disney characters cover most of the wooden surfaces, brightly and carefully
      hand-painted, although smudged with little fingerprints.
  triggers: [tba:118:trg:11834]

"tba:118:room:11832":
  name: A Boy's Bedroom
  description: >
    Light shades of pastel blue coat the walls, the southern wall sloping strangely where it allows
    room for the stairs beneath.  Brown carpet lines the flooring here, barely noticeable as the room is
    almost entirely filled with the space of the bed and dresser alone.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11830
      look: A heavy rectangular door guards the way out into the main hallway.
      door:
        keywords: [door]
        kind: door
  extras:
  - keywords: [dresser]
    text: >
      Made of plain, unfinished wood, this small dresser looks as if it were thrown together by hand,
      pressed tightly into the corner so as to take up the least amount of room.
  - keywords: [bed]
    text: >
      Just a regular wooden bed, this little piece of furniture stands tucked as closely against the wall
      as it can get, made with blue bedding.

"tba:118:room:11833":
  name: A Cozy Living Room
  description: >
    This moderately sized living room is wallpapered with patterns of cream and beige, light sandy
    carpet covering the floor and tan armchairs settled into the western corners.  A television stands here
    though it does not look often used, and a hanging light fixture casts the room in a warm subtle glow. 
    Several family photos can be seen lining the walls, along with various cross-stitchings and
    paintings.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11834
      look: >
        A small kitchen stretches to the north, smells of fresh baking and more distant garden flowers
        wafting on the air.
    west:
      to: tba:118:room:11825
      look: >
        A small porch lies to the west, slightly dirt streaked and cluttered with shoes and coats.
  extras:
  - keywords: [cross-stitchings, paintings]
    text: >
      These little works of art are obviously amateur but nonetheless very pretty, portrayals of flowers
      and landscapes are the main subject, with one elaborate stitching of a tiger placed in clear view.
  - keywords: [several, family, photos]
    text: >
      These smiling portraits display a young man, and a woman holding a baby along with four small
      children gathered around her.  The older girl and boy look to be about seven, whereas the younger two
      girls are barely out of their toddler years, one sucking contendedly on a dummy.
  - keywords: [television]
    text: >
      This television is covered in a very fine layer of dust, indicating that it has not been turned on
      for some time though it is large and prominent in the room.

"tba:118:room:11834":
  name: A Homey Kitchen
  description: >
    Soft lamps fill the room with a gentle amber light, a red glow emanating from the oven as the
    smells of fresh baking fill the air.  Long wooden counters stand all the way around the room, a few plates
    stacked next to the metal sink.  A large window looks out onto the back garden, the sound of gentle
    breezes tinkling a windchime drifting through the house.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11833
    west:
      to: tba:118:room:11835

"tba:118:room:11835":
  name: An Attached Dining Room
  description: >
    A large round table stands in the center of the room, six chairs and a highchair pulled around it. 
    Floral patterned walls are almost completely covered up with the drawings done by little children,
    the odd smudge or little handprint darkening the pale walls.  Golden light streams from the overhead
    hanging lamps, an open window in the northern door displaying a beautiful view of the garden.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11837
    east:
      to: tba:118:room:11834
    west:
      to: tba:118:room:11836

"tba:118:room:11836":
  name: An Empty Garage
  description: >
    Dark and damp, silver cobwebs flutter silently in the corners like flickering ghosts.  There is not
    much here but concrete floor and wooden walls, a few dusty pieces of broken furniture discarded and
    left to rot in the shadows.  The air is musty and chill, the low moaning of the wind echoing forlonly
    along the bare walls.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:118:room:11835

"tba:118:room:11837":
  name: A Large Flowering Garden
  description: >
    Fully abloom, this garden is ripe with the scents of blossoming flowers and fruits, the sweet smell
    of honeysuckle and gooseberries ebbing and flowing with the breeze.  A row of bright yellow
    daffodils dance innocently to the east like golden bursts of sunfire, dark red roses spreading like a wound
    to the west, scarlet petals dripping slowly onto the ground as the flowers wilt.
  sector: city
  exits:
    north:
      to: tba:118:room:11838
    south:
      to: tba:118:room:11835

"tba:118:room:11838":
  name: A Treehouse Camp
  description: >
    Crumbling bark and rustling leaves surround this little enclosure.  Once a mighty tree, there is
    little now left but a hollow shell, slow decay beginning to claim even this.  Old blankets have been
    fastened to some of the breaking branches, colored chalk pictures drawn here and there on the wood, and
    a large bundle of leaves carpets the ground, obviously meant to make this little treecamp more
    comfortable.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11837
  triggers: [tba:118:trg:11866]

"tba:118:room:11839":
  name: On the Roof of the Garage
  description: >
    The roofing is black and sticky with fresh-laid tar, feathers stuck here and there where
    unfortunate birds have tried to land.  All around, the rooftops of little brick houses can be seen, wisps of
    smoke unfurling lazily in the crisp air.  Distant smokestacks rise high above the horizon, the
    twinkling of car headlights passing through the shadowy air like shooting stars.
  sector: city
  exits:
    east:
      to: tba:118:room:11826
      look: >
        This large wooden window looks as though it is normally propped open, chips of paint peeling off
        the window frame around.
      door:
        keywords: [window]
        kind: door

"tba:118:room:11840":
  name: A Cluttered Front Porch
  description: >
    A small closet stands to the west, packed full with hanging jackets and coats of various sizes. 
    Scattered shoes in various states of disrepair lie kicked about, pieces of tape sticking out here and
    there from the more ragged ones, streaks of mud and dirt darkening the scuffed floor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11824
      look: >
        This large door has been painted with a thick layer of black paint, making it seem more like a
        yawning hole than a doorway.  A layer of sticky tape has been fastened all the way around it, sealing
        even the tiny gap that links the inside to outside.
      door:
        keywords: [blackdoor]
        kind: door
        reset: closed
    west:
      to: tba:118:room:11841

"tba:118:room:11841":
  name: The Livingroom
  description: >
    Light gray carpet has been worn almost bare and black where the constant passage of dirty feet has
    left its mark.  The wallpapered wall is stained with the oily marks of handprints and is made to look
    even dingier by the lack of proper lighting, just a dim yellow glow illuminating the place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11840
    south:
      to: tba:118:room:11842
    west:
      to: tba:118:room:11844
    up:
      to: tba:118:room:11862

"tba:118:room:11842":
  name: The Livingroom
  description: >
    The flickering blare of a television set fills the room with a steady barrage of noise and light. 
    The walls and carpet are dimmed with more than just shadow, disrepair and neglect leaving them worn
    and filthy.  Pieces of food and mud are mingled together and tangled disgustingly in the unravelling
    fabric of the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11841
    west:
      to: tba:118:room:11843

"tba:118:room:11843":
  name: The Office
  description: >
    The wall to the north has been crudely formed from wooden panelling, nailed together to form a
    temporary kind of barrier between this room and the next. Three desks stand against the walls, each
    holding various pieces of electronic equipment and stationary supplies.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11842

"tba:118:room:11844":
  name: A Messy Kitchen
  description: >
    A three-way lamp holder flickers here, two of the bulbs removed so that only one lights the room. 
    The floor is sticky with some sort of food residue, various dried and mouldy pieces scattered about
    the place.  Even large objects have been kicked to the perimeters of the room, empty cereal boxes and
    souring milk cartons, pencils, hairbrushes, and cutlery all jumbled together with the dirt.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11841
    west:
      to: tba:118:room:11845
    down:
      to: tba:118:room:11851

"tba:118:room:11845":
  name: A Messy Kitchen
  description: >
    A vile smell fills the air, like rotting fish and a thick slime covers the sink and soggy
    dishclothes alike.  Dirty kitchen plates are stacked in fungating piles or simply dropped on the floor in
    places, pieces of broken ceramic brushed to the sides amidst rusty streaks of blood.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11844
    south:
      to: tba:118:room:11846

"tba:118:room:11846":
  name: A Mud-slicked Back Porch
  description: >
    A damp musty smell hangs in the air, dry and fresh mud caked all over the floor, partially trodden
    into the dumped coats here.  Bits of dead grass and leaves lie liberally about the room, almost as if
    it were more outdoors than in.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:118:room:11845
    west:
      to: tba:118:room:11847

"tba:118:room:11847":
  name: A Massive Garden
  description: >
    A little concrete pathway leads to the east and the small porch there, long grasses dried brown by
    the dry climate.  Only the flourishing yellow heads of dandelions brighten the place with color.
  sector: field
  exits:
    north:
      to: tba:118:room:11848
    east:
      to: tba:118:room:11846
    west:
      to: tba:118:room:11850

"tba:118:room:11848":
  name: A Massive Garden
  description: >
    A rusty toolshed stands here, blocked up with various pieces of equipment and broken bicycles.  The
    grasses too seem stained with the color of bleeding metal, the copper color making the place seem
    even more dry and desert-like.
  sector: field
  exits:
    south:
      to: tba:118:room:11847
    west:
      to: tba:118:room:11849
  triggers: [tba:118:trg:11866]

"tba:118:room:11849":
  name: A Massive Garden
  description: >
    Young trees are just beginning to flourish here, frail branches waving uncertainly in the air, tiny
    seedlings and leaves wafting dreamily about.  The hard ground is slightly cracked, blistering with
    dryness benath the thick matted carpet of dead and dying grass.
  sector: field
  exits:
    east:
      to: tba:118:room:11848
    south:
      to: tba:118:room:11850
  triggers: [tba:118:trg:11866]

"tba:118:room:11850":
  name: By the Gazebo
  description: >
    A beautiful wooden gazebo stands to the south, a large house standing further off to the east
    surrounded by flat brown grasses.  Few flowers grow here, only scattered weeds and a few dark shrubs, most
    of the land too dry to support much growth.
  sector: field
  exits:
    north:
      to: tba:118:room:11849
    east:
      to: tba:118:room:11847
    south:
      to: tba:118:room:11872

"tba:118:room:11851":
  name: In the Basement
  description: >
    Cool white walls enclose this room, grayed with the markings of children's handprints and smudged
    crayon colors.  Thin gray carpeting covers this whole open area, the large room extending off to the
    north and to the east.  Pieces of food have scattered down from the stairs to the south, sticky black
    masses of unidentifiable substance staining the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11853
    east:
      to: tba:118:room:11857
    west:
      to: tba:118:room:11852
    up:
      to: tba:118:room:11844

"tba:118:room:11852":
  name: A Furnace Room
  description: >
    The floor here is hard and unfinished, the jagged surface flickering with dark shadows from the
    furnace flame that dances here.  Smooth metal panelling contains the fire, a small grid allowing the
    light and heat to fill the room, large pipes carrying the warmth to the rest of the house.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11851

"tba:118:room:11853":
  name: In the Basement
  description: >
    The air is chill here, an uncomfortable feeling of lingering presence permeating the air.  Dark,
    sticky stains blacken the carpet, piles and piles of dirty laundry scattered about.  The smell of must
    and mould fills the place, and some other disgusting scent, metallic and nauseating.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11855
    east:
      to: tba:118:room:11856
    south:
      to: tba:118:room:11851
    west:
      to: tba:118:room:11854

"tba:118:room:11854":
  name: A Girl's Bedroom
  description: >
    Cement walls have been painted white here, although the paint looks almost as if it has been rubbed
    away in places, leaving the cold stone-gray surface bare. Shelving along the walls hold various
    little stuffed animals and toys, as well as a plastic radio that crackles as it plays some old, worn tape
    of panpipe music.  A window on the western wall lets in a cool draft, wafting away a strong ammonia
    and chlorine smell, and a subtler metallic one.  The carpet is light in places, contrasting
    noticeably with the darker patches of dirt as if it had been bleached in areas, and a streak of bloodied
    fingerprints smears the eastern wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11853

"tba:118:room:11855":
  name: A Cold Bathroom
  description: >
    This little bathroom is almost unbearably cold and damp feeling.  The hard linoleum floor is
    stained with different blends of disgusting looking substances, and the room stinks as if it has never been
    cleaned.  The flickering light strip has had all the light bulbs but one removed, the dim glow
    mercifully casting much of the sight here in shadow.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11853

"tba:118:room:11856":
  name: A Makeshift Bedroom
  description: >
    This roughly made bedroom is actually part of the larger, open basement.  A crude structure of wood
    panelling and hanging blankets separates the small square-ish area from the rest of the room,
    allowing for some privacy and seclusion although no doors or solid walls seal it off.  A television set
    flickers dimly in the shadows, unwatched but left to buzz continually, as if there was a need to fill
    the place with constant noise.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11853

"tba:118:room:11857":
  name: A Dimly-lit Sitting Room
  description: >
    The walls here are rougly panelled with wood, giving it a somewhat cozy feel despite the coldness
    of the hard flooring.  This appears to be a kind of reading area for children, a few cushions lie
    strewn about, as well as several well-used children's books, and an old television set buzzes quietly to
    itself.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:118:room:11858
    west:
      to: tba:118:room:11851

"tba:118:room:11858":
  name: The Crawl-space
  description: >
    The ceiling dips very low here, just high enough for a small child to walk whilst stooping. 
    Several thick wooden beams run crisscrossed along the ceiling, supporting the floor above, and metal
    heating and water pipes run like veins in and out of the structure.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:118:room:11857
    south:
      to: tba:118:room:11859
    west:
      to: tba:118:room:11860

"tba:118:room:11859":
  name: Storage in the Crawl-space
  description: >
    A single broken lightbulb hangs here, pieces of sharp glass scattered along the freezing floor.  A
    pingpong table has been turned on its side to separate this half of the crawl-space from the other. 
    This side seemingly dedicated to the storage of various items and foods.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:118:room:11858

"tba:118:room:11860":
  name: A Play Area in the Crawl-space
  description: >
    The concrete walls have been painted bright white here, making the space look a little more cheery
    despite the coldness.  Hand-drawn cartoon characters decorate most of the surfaces, various toys
    lying scattered about or set up in various stages of play.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:118:room:11858
    south:
      to: tba:118:room:11861

"tba:118:room:11861":
  name: A Play Area in the Crawl-space
  description: >
    A large metal pole stands in the center of this room, supporting the network of wooden beams
    overhead.  A low thrumming sound vibrates through the whole place as heat and water flow throuh the many
    pipes to the rest of the house. It is very dark in this corner of the room, the brightness of the toys
    and cartoon drawings contrasting with the sinister feel of the shadows.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:118:room:11860

"tba:118:room:11862":
  name: A Dark Hallway
  description: >
    A large jagged hole gapes in the eastern wall, and the railing has been pulled from its place and
    left dangling at the side of the stairs.  The carpet is thick and padded but beginning to fray in
    places, exposing sharp nails beneath.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:118:room:11865
    east:
      to: tba:118:room:11863
      look: >
        A dark door is attached crookedly with metal hinges, several slashes carved through the surface;
        exposing the pale inner wood like glowing wounds.
      door:
        keywords: [door]
        kind: door
    west:
      to: tba:118:room:11864
    down:
      to: tba:118:room:11841

"tba:118:room:11863":
  name: A Little Book Closet
  description: >
    This tiny closet is stacked with shelves as high as the ceiling, a vague smell of must and mould
    wafting in the otherwise stagnant air.  Yellowing and torn books are strewn haphazardly here and there,
    most covered with a thick layer of cobwebs and dust.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:118:room:11862
      look: >
        A dark door is attached crookedly with metal hinges, several slashes carved through the surface;
        exposing the pale inner wood like glowing wounds.
      door:
        keywords: [door]
        kind: door

"tba:118:room:11864":
  name: A Filthy Bathroom
  description: >
    The floor looks as though it used to be blue tiles, a disgusting yellow grunge making it appear
    more green and filling the air with a revolting acrid smell.  The toilet and counters look as though
    they have never been cleaned, ugly stains and sticky grime covering almost every surface.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11862

"tba:118:room:11865":
  name: A Dark Hallway
  description: >
    A single lightbulb flickers quietly here without a light shade, the stark ripples of light
    contrasting with the dark shadows that creep in from the rest of the surroundings.  Streaked with grime, it
    is hard to separate the darkness of the walls from the dirt.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11869
    east:
      to: tba:118:room:11866
    south:
      to: tba:118:room:11862
    west:
      to: tba:118:room:11867

"tba:118:room:11866":
  name: A Boy's Bedroom
  description: >
    One wall of this room has been painted a deep navy blue, glow-in-the-dark stickers of stars and
    planets liberally decorating it, and a space-themed border runs around the top of the walls.  Scattered
    lego bricks are embedded into the gray carpet, various lego spacecraft in the works or completed,
    hanging from invisible thread and lego stands.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11865

"tba:118:room:11867":
  name: Their Room
  description: >
    A large double bed stands in the center of the room, covered with slippery quilts the deep color of
    fresh blood.  Dark wooden furniture accessorizes the rest of the room, piles of dirty laundry strewn
    all over the floor and draped over the various furnishings.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11865
    south:
      to: tba:118:room:11868

"tba:118:room:11868":
  name: A Small Private Bathroom
  description: >
    Small and cramped, this little bathroom looks as though it has been sabotaged by one of the
    resident children.  Bright red nail polish has been used to paint a glaring {bright_red}X{/bright_red} on
    almost every surface visible.  The smeared mirror, the dirty walls, the yellowing toilet; all marked
    irreversibly with the same angry sign.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:118:room:11867

"tba:118:room:11869":
  name: The Bunkbed Room
  description: >
    A horrible smell of souring milk and unwashed bedclothes is strong in the air, the lighting dim and
    gray where most of the lightbulbs have been removed, only one remaining in its socket.  The room is
    long and wide, filled with as many beds and dressers as it can hold, what little remaining floorspace
    filled with dirty laundry and piles of rubbish.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11870
    south:
      to: tba:118:room:11865

"tba:118:room:11870":
  name: The Bunkbed Room
  description: >
    Large ugly stains spread along the wallpapered walls, a combination of slimy moisture and moulds
    that are beginning to thrive off the dampness and sugar-backed papering.  The wall appears cracked
    beneath, a long split working its way up to the ceiling where a pretty unicorn border contrasts the ugly
    darkness of the rest of the room.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:118:room:11869
  triggers: [tba:118:trg:11868, tba:118:trg:11869]

"tba:118:room:11871":
  name: Under the Bed
  description: >
    This small space is neatly concealed from the outside world, bed above and gray carpet below, the
    gap around blocked on side by a wall and covered with hanging blankets on the other.  Everything seems
    suspended and silent here, only the occasional flicker of a creeping insect running across the
    floor, and the creaking of footsteps seems to disturb the stillness.  The only way to get out seems to be
    to crawl through the small gap.
  sector: inside
  flags: [dark, indoors]
  triggers: [tba:118:trg:11869]

"tba:118:room:11872":
  name: Inside the Gazebo
  description: >
    This rosy colored gazebo is fenced around with pretty lattice-work, five posts supporting the domed
    hexagonal roof.  Various climbing flowers crawl up the sides, most of them drying in the heat,
    filling the air with a condensed perfume scent.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:118:room:11850

"tba:118:room:11873":
  name: A Girl's Bedroom
  description: >
    {bright_cyan}Most noticeable is the streak on the eastern wall, suddenly transformed into a bright
    phosphorescent blue, shining almost blindingly as if the fingers had smeared radioactive liquid
    instead of the original substance.  It is not the only area that is glowing however, much of the wall
    covered in faded blue splotches or perhaps more disturbingly, smudged letters and words.  The naturally
    gray carpet is now luminous blue, brighter splashes here and there as if some glowing paintball gun
    had been liberally used to decorate the place.{/bright_cyan}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:118:room:11853
  triggers: [tba:118:trg:11843]

"tba:118:room:11874":
  name: On the Tip of a Hill
  description: >
    The ground here is made of pale pink rock, droplets of dew condensing and trickling along the
    grassless ground, making it glisten and shine even more. The surface slopes gently upward to the south,
    curving again abruptly down so that only horizon can be seen.
  sector: hills
  exits:
    east:
      to: tba:118:room:11875
    south:
      to: tba:118:room:11877
  triggers: [tba:118:trg:11834]

"tba:118:room:11875":
  name: On the Tip of a Hill
  description: >
    The soft beige stone here has been worn until it is completely smooth, giving it an almost
    purposefully polished appearance.  The gently curving surfaces are flawless and almost reflective, covered in
    a fine sheen of moisture.
  sector: hills
  exits:
    south:
      to: tba:118:room:11876
    west:
      to: tba:118:room:11874

"tba:118:room:11876":
  name: A Sloping Ridge
  description: >
    A prominent crest curves around from the east to the west, a deep purplish color veining through
    the rock as though mineral rich waters once ran in rivulets here, the tinted surface eroded until
    glossy and flawless.
  sector: hills
  exits:
    north:
      to: tba:118:room:11875
    east:
      to: tba:118:room:11879
    south:
      to: tba:118:room:11880
    west:
      to: tba:118:room:11877

"tba:118:room:11877":
  name: A Sloping Ridge
  description: >
    The land slants upward gently, only to slope deeply downward toward the south, rosy hues of purple
    mixing with the cool gray.  Splotches of deeper color blossom here and there, permanent stains on the
    smooth stony canvas.
  sector: hills
  exits:
    north:
      to: tba:118:room:11874
    east:
      to: tba:118:room:11876
    south:
      to: tba:118:room:11893
    west:
      to: tba:118:room:11878

"tba:118:room:11878":
  name: A Sloping Ridge
  description: >
    The rock becomes deep maroon in color here, encrustations of salt powdering its surface as if brine
    water flowed through here at some point.  Perfectly eroded, the chalk-like blemishes are all that
    spoil the smoothness, dulling the natural shine of the stone.
  sector: hills
  exits:
    east:
      to: tba:118:room:11877

"tba:118:room:11879":
  name: A Sloping Ridge
  description: >
    Deep purple stone rises gently before slanting steeply down to the south here, a faint vibration
    throbbing through the rock from some unseen source.  A feeling of heat rises in the air, the very
    surface of the stone hot to the touch as if warmed from within.
  sector: hills
  exits:
    west:
      to: tba:118:room:11876

"tba:118:room:11880":
  name: A Grave Plain
  description: >
    The ground here is level and unblemished, fine soil ribbed slightly where the breeze has stirred
    it.  No grass, rocks, or other features of any kind can be seen, just the ground untouched and bare
    like a vast sandy canvas.
  sector: field
  exits:
    north:
      to: tba:118:room:11876
    south:
      to: tba:118:room:11881
    west:
      to: tba:118:room:11893

"tba:118:room:11881":
  name: A Grave Plain
  description: >
    Flat and unmarked, the land stands blankly all around like some massive piece of unused parchment. 
    Void of all plantlife and rockery, the only things noticeable are the slight ripples that work
    through the fine earth with each breeze.
  sector: field
  exits:
    north:
      to: tba:118:room:11880
    south:
      to: tba:118:room:11882
    west:
      to: tba:118:room:11892

"tba:118:room:11882":
  name: A Grave Plain
  description: >
    Tawny-colored prarie stretches far to the north, an unbroken canvas of smooth, pale soil.  Gentle
    heat wafts from all around, a thick muggy humidity lingering in the air and coating everything in
    sight with a subtle sheen.
  sector: field
