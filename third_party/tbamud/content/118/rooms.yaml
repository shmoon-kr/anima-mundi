"tba:118:room:11894":
  name: How Perceptive Are You?
  description: >
    Count the F's in the following text, try to read through it only once: FINISHED FILES ARE THE RE-
    SULT OF YEARS OF SCIENTIF- IC STUDY COMBINED WITH THE EXPERIENCE OF YEARS... Once you have counted
    them all, type look next
  sector: inside
  flags: [indoors, peaceful]
  extras:
  - keywords: [two, "2"]
    text: >
      {yellow}{/yellow}{bright_red}F{/bright_red}{yellow}INISHED
      {/yellow}{bright_red}F{/bright_red}{yellow}ILES ARE THE RE- SULT O{/yellow}{bright_red}F{/bright_red}{yellow} YEARS
      O{/yellow}{bright_red}F{/bright_red}{yellow} SCIENTI{/yellow}{bright_red}F{/bright_red}{yellow}- IC STUDY COMBINED WITH THE
      EXPERIENCE O{/yellow}{bright_red}F{/bright_red}{yellow} YEARS...{/yellow}
  - keywords: [next]
    text: >
      How many F's did you get? The answer is that there are 6 :) Most people only count three as the
      brain does not process the F in the word of PS. if you are really stuck, type LOOK TWO, to see exactly
      where the F's are

"tba:118:room:11895":
  name: By a Gentle Stream
  description: >
    A babbling stream curves gently around here, the glassy surface broken with smooth pebbles and the
    falling petals from nearby trees.  Clear mountain breezes wash cleanly over the land, filling the
    atmosphere with a peaceful, serene feeling; a beautiful jagged view of the mountainsides spreading out
    below.
  sector: mountains
  exits:
    south:
      to: tba:118:room:11820
  triggers: [tba:118:trg:11866]

"tba:118:room:11896":
  name: A Quiet Place
  description: >
    Warm and softly dim, nothing here can be made out into any solid shape or form.  All around,
    distant watery colors and murmuring sounds fade and grow, all the world pulsing as if a giant heart beat. 
    Everything of the normal world becomes jaded and still, only a vague awareness lingering of the
    ability to 'awaken'.
  sector: inside
  flags: [indoors]
  triggers: [tba:118:trg:11899, tba:118:trg:11856]

