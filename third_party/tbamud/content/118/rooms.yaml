"tba:118:room:11883":
  name: Dark Grasses
  description: >
    Dark soil is spread in furrows here, tall black grasses standing unyielding and stubborn against
    the breezes, almost more like the spines of cacti than any green flora.  A deep shadow shrouds the
    place in gloom, the atmosphere clinging and moist.
  sector: field
  exits:
    north:
      to: tba:118:room:11882
    east:
      to: tba:118:room:11884
    south:
      to: tba:118:room:11886
    west:
      to: tba:118:room:11887

"tba:118:room:11884":
  name: Dark Grasses
  description: >
    The sandy soil is veined and crinkled like a withering autumn leaf, just as crisp and dry though
    the surrounding air is hot and humid.  Thick black grasses stand rigidly, covered with a slick shine of
    moisture.
  sector: field
  exits:
    south:
      to: tba:118:room:11885
    west:
      to: tba:118:room:11883

"tba:118:room:11885":
  name: Dark Grasses
  description: >
    Tall bristly plant growths stand like black sentinels watching over the land, stubbornly straining
    against the attempts of the breeze to move them.  Stifling muggy air swirls aimlessly about, leaving
    glistening droplets on every surface.
  sector: field
  exits:
    north:
      to: tba:118:room:11884
    west:
      to: tba:118:room:11886

"tba:118:room:11886":
  name: Dark Grasses
  description: >
    Long wiry grasses stand here and there, black and withered up like old trees, too weary to stand
    tall.  The soft sandy soil is dark and ribbed, alive with the dancing shadows of the swaying plant life.
  sector: field
  exits:
    north:
      to: tba:118:room:11883
    east:
      to: tba:118:room:11885

"tba:118:room:11887":
  name: Dark Grasses
  description: >
    Sinewy grasses stand stiffly here and there upon the brown ridged land, glossy with moisture and
    shining like black stalactites of oil.  An oppressive heat lingers in this place, a greasy film of
    wetness covering everything.
  sector: field
  exits:
    north:
      to: tba:118:room:11891
    east:
      to: tba:118:room:11883
    south:
      to: tba:118:room:11890
    west:
      to: tba:118:room:11888

"tba:118:room:11888":
  name: Dark Grasses
  description: >
    Tendrils of shadow sway and snake over the dark soil as the stiff grasses bend reluctantly to the
    wafting air.  Sticky and claustrophobic, the damp atmosphere seems to smother everything, filling the
    place with a tangy odour.
  sector: field
  exits:
    east:
      to: tba:118:room:11887
    south:
      to: tba:118:room:11889

"tba:118:room:11889":
  name: Dark Grasses
  description: >
    Bleak and sinister, only the weaving snake-like shadows of the coiled grasses seem to infuse this
    place with any life.  Muggy and clinging the air seems almost to coat everything with slime.
  sector: field
  exits:
    north:
      to: tba:118:room:11888
    east:
      to: tba:118:room:11890

"tba:118:room:11890":
  name: Dark Grasses
  description: >
    Dark, gloomy land stretches around, gently rippled by the wandering air. Sinewy grasses whisper
    mournfully, bent and stiff as though aging black ghosts that haunt the place.
  sector: field
  exits:
    north:
      to: tba:118:room:11887
    west:
      to: tba:118:room:11889

"tba:118:room:11891":
  name: A Grave Plain
  description: >
    Bland, unbroken land continues on to the north, shades of soft taupe glistening and stirring gently
    as the currents of air move, warmer air rising from the ground itself as if some heat source lay
    somewhere far beneath.
  sector: field
  exits:
    north:
      to: tba:118:room:11892
    east:
      to: tba:118:room:11882
    south:
      to: tba:118:room:11887

"tba:118:room:11892":
  name: A Grave Plain
  description: >
    Natural landscape stretches out widely here, fine, fawn-colored soil spread like gently rippled
    icing over the flat terrain.  A subtle heat stirs the air, making it shimmer and shift slightly as
    though part of some mirage.
  sector: field
  exits:
    north:
      to: tba:118:room:11893
    east:
      to: tba:118:room:11881
    south:
      to: tba:118:room:11891

"tba:118:room:11893":
  name: A Grave Plain
  description: >
    Soft sandy ground levels out here, stretching far to the south in one continuous plane.  The air is
