"tba:140:mob:14000":
  keywords: [Wyvern, guard, commander, wyv]
  short: the wyvern guard commander
  long: A mighty wyvern stands here defending his city.
  description: >
    This huge wyvern holds himself with military precision.  His claws are extremely sharp as if he has
    taken the time to file them to fine points.  His scales are a dull red and flex over the massive
    muscles underneath his hide. His glance scans the room and focuses on you intently.  He crooks one huge
    talon as you look at him as if to ask what you want from him, better not waist his time.
  level: 18
  sex: male
  alignment: -400
  flags: [sentinel, aware, stay_zone, memory, no_charm, no_summon]
  affects: [detect_align, detect_invis, detect_magic, sense_life]
