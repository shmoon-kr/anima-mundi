    raw: [0, 0, 0, 0]
  weight: 0
  cost: 0
  rent: 0
  level: 0
  extras:
  - keywords: [god, springfire, air, statue]
    text: >
      This statue of the God Springfire is made of pure transparent crystal.  To the naked eye it is
      completely invisible.  The warriors of the city paid a staggering amount of money to have the warrior
      god's image immortalized in their guild.  They hope he will aid them in battle against their mortal
      enemies the giants.

"tba:140:obj:14041":
  type: treasure
  keywords: [statue, khelben, god, knight, wyv]
  short: a statue of the mighty God Khelben
  long: There is a statue of the God Khelben, Lord of The Elements here.
  flags: [glow, magic, bless]
  wear: []
  values:
    raw: [0, 0, 0, 0]
  weight: 0
  cost: 0
  rent: 0
  level: 0
  extras:
  - keywords: [knight, khelben, god, statue, lord, elements]
    text: >
      The knights of the city have placed this statue here to watch over their guild.  Above all other
      gods they worship the mighty Khelben, who they believe founded the order of knighthood.  The statue
      itself is 9 feet tall and made of pure platinum.  It is clad in the armor and symbols of the city's
      royal line and the knights' personal colors.  The knights hope that the god will grant them their magic
      in days to come and aid them when they enter battle.

"tba:140:obj:14042":
  type: treasure
  keywords: [god, statue, thunder]
  short: a statue of the Thunder God Rumble
  long: A statue of the mighty God Rumble has been built here.
  flags: [glow, hum, magic, bless]
  wear: []
  values:
    raw: [0, 0, 0, 0]
  weight: 0
  cost: 0
  rent: 0
  level: 0
  extras:
  - keywords: [thunder, rumble, god, statue]
    text: >
      This statue was built by the city's guild of rogues and thieves. They have chosen the almighty
      thunder god as their patron deity because of his former status as a thief, and because they believe that
      in the final battle between order and chaos he will come down from the heavens and help them destroy
      Balm and all his followers for ever.  The statue is carved from polished obsidian stone and has been
      inlaid with streaks of silver lightning bolts.  The God is depicted, dressed in a gray robe with both
      hands raised hurling his deadly thunder around him.

