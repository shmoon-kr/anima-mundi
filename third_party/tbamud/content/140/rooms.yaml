"tba:140:room:14026":
  name: In the storm.
  description: >
    Stepping into this part of the vortex you stumble and almost lose your balance.  Clouds of choking
    dust and sand fill your nostrils and throat making it almost impossible to breathe.  The wind pulls
    you to the North and West While to the South you can feel the same natural forces ravaging the land.
  sector: field
  exits:
    north:
      to: tba:140:room:14033
    south:
      to: tba:140:room:14025
    west:
      to: tba:140:room:14027

"tba:140:room:14027":
  name: In the storm.
  description: >
    You can feel a slight drop in the strength of the wind to the north as you step into this part of
    the storm.  Unfortunately the power of the gusts is still so strong that you don't dare raise your
    head to see what may be in that direction.  The tornado pulls you to the East and West and you can tell
    there is no better weather to the South.
  sector: field
  exits:
    north:
      to: tba:140:room:14032
    east:
      to: tba:140:room:14026
    south:
      to: tba:140:room:14024
