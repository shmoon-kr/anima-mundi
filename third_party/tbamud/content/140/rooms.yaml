"tba:140:room:14004":
  name: The blasted sands.
  description: >
    You can see the cause of the sand storm now.  A large tornado seems to be spinning in place.  Where
    you are standing the grains of sand and rock blast your skin and the heat of the sun is almost
    unbearable.  You wonder how big that storm out there really is?  Behind you the dust still rises in
    blinding clouds.  To your right you find a large smooth face of sand polished stone obstructing your path.
  sector: field
  exits:
