"tba:140:room:14029":
  name: In the storm.
  description: >
    The storm is quite powerful here.  To the East it seems like it might be dropping off while
    powerful winds pull you to the North and South.  Everything around you seems to be made of heat, pain, and
    deafening sound.
  sector: field
  exits:
    north:
      to: tba:140:room:14030
    east:
      to: tba:140:room:14028
    south:
      to: tba:140:room:14022

"tba:140:room:14030":
  name: In the storm.
  description: >
    The fury of the tempest buffets you from all around here.  However their is a definite drop in the
    force of the gusts to the east.  To the North and South, the winds pull you toward more blinding
    sunscorched desert.  While to the west you find yourself unable to fight through the power of the storm.
  sector: field
  exits:
    north:
      to: tba:140:room:14037
    east:
      to: tba:140:room:14031
    south:
      to: tba:140:room:14029

"tba:140:room:14031":
  name: The eye of the storm.
  description: >
    Ah What peace.  You are in the eye of the sand storm.  Above you can see the harsh sun beating down
    from a clear blue sky.  On all sides you can see the towering walls of wind and sand that are the
    funnel of this tornado.  You wonder what could be on the other side of those walls and if you should go
    back into them to find out.
  sector: field
  exits:
    north:
      to: tba:140:room:14036
    east:
      to: tba:140:room:14032
    south:
      to: tba:140:room:14028
    west:
      to: tba:140:room:14030

