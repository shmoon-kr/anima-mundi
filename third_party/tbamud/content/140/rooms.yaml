"tba:140:room:14016":
  name: The bad lands.
  description: >
    You are surrounded by red hot rock and sand.  To the north the hills rise even higher.  To the
    south a desert of swirling sand and dust awaits more hopeless wanderers.  The wind gusts, moaning
    mournfully in your ears.  To the left you find yourself looking down a sheer cliff of red veined stone.
  sector: hills
  exits:
