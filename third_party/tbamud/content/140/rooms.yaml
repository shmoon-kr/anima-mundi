"tba:140:room:14012":
  name: The Blasted sands.
  description: >
    You stand before a low line of hills.  Sand dunes and jagged chimneys of rock dominate the land
    before you and to either side.  You can see the heat rising in shimmering tendrils from the hills to the
    north, East, and West.  A cloud of dust and sand rises into the air to the south.
