# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 140.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:140:room:14000":
  name: The Edge of the Desert
  description: >
    In front of you there is a huge sand storm raging.  The wind gusts behind and to either side,
    blowing the dust into a blinding cloud.  The howling of the gusts and your own foot steps are all you can
    hear.  To your left a steep outcropping of rock blocks your way.
  sector: field
  exits:
    north:
      to: tba:140:room:14007
    east:
      to: tba:140:room:14001
    west:
      to: tba:90:room:9031
  extras:
  - keywords: [info, credits]
    text:
      preformatted: |2
           Builders  : Balm
        Zone         : 140 Wyvern City
        Began        : 1998
        Player Level : 7-26
        Rooms        : 100
        Mobs         : 18
        Objects      : 45
        Shops        : 7
        Triggers     : 0
        Theme        : A city of Wyverns.
        Notes        :
        
        Zone: 125 was linked to the following zones:
         90 Oasis                        at 14000 (west ) ---> 9031

