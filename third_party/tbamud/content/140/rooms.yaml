"tba:140:room:14020":
  name: The bad lands.
  description: >
    You stand at the top of a low line of rocky hills.  To the South, the hills descend to a desert of
    blowing sand and dust.  To the North a slope descends into the largest vortex of blowing wind and
    dust you have ever seen.  The wind roars and the sun beats down on you making you wonder if anything
    could possibly survive out here.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:140:room:14024
    south:
