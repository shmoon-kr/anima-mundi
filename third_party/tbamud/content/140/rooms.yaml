"tba:140:room:14089":
  name: The Great Cave.
  description: >
    This is the great cave of Wyverns.  The walls here have been carved with the family history of the
    royal line of this city.  Large wyverns stand everywhere looking at you with distaste, "What are you
    doing here?  " One of them asks. The roof is polished gray rock set with crystals and precious
    stones.  To the North a natural opening in the rock leads to a second chamber.  All you can see within are
    the backs of worshiping Wyverns.
  sector: city
  exits:
    north:
      to: tba:140:room:14090
    south:
      to: tba:140:room:14087
    west:
      to: tba:140:room:14088

"tba:140:room:14090":
  name: The High Cavern of Wyverns.
  description: >
    This chamber is draped in the trappings of the royal house of Wyverns.  A huge throne stands in one
    corner on a platform made of polished silver. Wyverns kneel all around the chamber bowing their
    necks toward the throne. The room is lit by a huge glowing gem set in the roof.  You wonder what kind of
    wealth it would take to create such a chamber.
  sector: city
  exits:
    south:
      to: tba:140:room:14089

"tba:140:room:14091":
  name: Guards' Cave.
  description: >
    You are in the midst of hustling and bustling wyverns.  City Guards line the walls marking maps of
    the city with small red pins.  Clerks and citizens waiting their turn to register complaints stand in
    the center of this natural cavern.  There is a large arch to the North, which wyverns enter and
    leave one at a time.  To the East a second smaller arch leads back on to Scale way.
  sector: city
  exits:
    north:
      to: tba:140:room:14092
    east:
      to: tba:140:room:14045

"tba:140:room:14092":
  name: Wyvern Watch Central.
  description: >
    You are standing at the entrance to the head guard's chamber.  A large red couch sits against the
    North wall and tapestries of legendary wyverns cover the walls.  The room is lit only by a single
    candle over the couch.  The light flickers making it look as if the pictures on the wall are coming to
    life.  To the south an arch leads back into the waiting area.
  sector: city
  exits:
    south:
      to: tba:140:room:14091

"tba:140:room:14093":
  name: A wyvern cave.
  description: >
    You are standing in one of the residential caves carved into the walls of the main cavern.  The
    sides of the structure are lined with long low couches for the wyverns to rest on.  Set in one wall
    there is an altar to the household gods with a candle burning on it.  There is a cooking hearth in the
    center of the room with a smoke hole at the peek of the domed roof to clear the air. There are no
    decorations or other pieces of furniture.  These wyverns don't seem to need very much to live comfortably.
  sector: city
  exits:
    west:
      to: tba:140:room:14052

