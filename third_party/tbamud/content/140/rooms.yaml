"tba:140:room:14099":
  name: Wyvern Donations.
  description: >
    This is the donation room of the city.  Here charitable souls may drop items for those less
    fortunate than themselves.  The walls of this room are covered with hooks and shelving for more valuable
    items while barrels and baskets litter the floor for more common gifts.
  sector: city
  exits:
    west:
      to: tba:140:room:14076
