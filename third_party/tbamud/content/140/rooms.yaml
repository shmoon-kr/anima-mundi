  name: The edge of the desert.
  description: >
    You stand on the edge of a huge expanse of sand and rock.  Behind you the wind gusts blowing sand
    up into a blinding cloud.  In front of you a huge whirl wind of sand rages obscuring your vision.
  sector: field
  exits:
    north:
      to: tba:140:room:14006
    east:
      to: tba:140:room:14002
    west:
      to: tba:140:room:14000

