"tba:140:room:14022":
  name: Edge of the storm.
  description: >
    You are in the outer edge of a giant tornado of swirling sand and dust. The winds pull you to the
    North and East making it impossible to go in any other direction.  The roar of the storm and the sound
    of your heart in your ears is deafening.  The blowing sand scours your exposed skin causing you to
    hunch your shoulders and seek shelter from the storm.
  sector: field
  exits:
    north:
      to: tba:140:room:14029
    east:
      to: tba:140:room:14023

