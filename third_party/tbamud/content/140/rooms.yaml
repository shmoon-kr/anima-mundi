"tba:140:room:14034":
  name: In the storm.
  description: >
    This section of the tempest seems to have a hollow echoing sound to it. Cold rock walls block your
    way to the north and East, while powerful winds pull you to the South and West.  You wonder if you
    will ever return from this trek.
  sector: field
  exits:
    south:
      to: tba:140:room:14033
    west:
      to: tba:140:room:14035

"tba:140:room:14035":
  name: In the storm.
  description: >
    The full might of the tornado can be felt here.  You can't tell whether it is your imagination or
    not, but it seems like there is a moaning sound coming from the North.  However all you can really
    think about is the horrible heat and roar of the Storm.
  sector: field
  exits:
    north:
      to: tba:140:room:14038
    east:
      to: tba:140:room:14034
    south:
      to: tba:140:room:14032
    west:
      to: tba:140:room:14036

"tba:140:room:14036":
  name: In the storm.
  description: >
    You are becoming tired of the constant force of the wind and sand upon your clothes and skin.  For
    all its force, the wind does not cool you off a bit. The storm continues to rage around you, but
    there seems to be a drop in the gusts to the South.
  sector: field
  exits:
    east:
      to: tba:140:room:14035
    south:
      to: tba:140:room:14031
    west:
      to: tba:140:room:14037

"tba:140:room:14037":
  name: In the storm.
  description: >
    You stand in the midst of the storm's wrath.  Strong gusts of wind push you to the South and East. 
    The force of the storm is so strong to the West that you can't move in that direction.  To the
    North, you encounter smooth stone walls.  The sound of sand scratching on rock fills your ears.
  sector: field
  exits:
    east:
      to: tba:140:room:14036
    south:
      to: tba:140:room:14030

"tba:140:room:14038":
  name: A huge cave.
  description: >
    You are standing in the middle of a large dry cave of old sand stone. Small piles of sand cover the
    floor from the storm outside.  Bits of light reflect off the walls from small crystals imbedded in
    the rock wall.  The wind moans through the cavern, echoing down the tunnel that opens to the north.
    While the Storm rages Outside to the South.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:140:room:14039
    south:
      to: tba:140:room:14035

"tba:140:room:14039":
  name: A large tunnel
  description: >
    It is very dark here and all you can make out is the tunnel openings to the North and South.  A low
    groaning sound echos through the rocky caverns here, and somewhere far above you can hear the flap
    of leathery wings.  The rock of the walls is dull and unremarkable.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:140:room:14040
    south:
      to: tba:140:room:14038

"tba:140:room:14040":
  name: The city opening.
  description: >
    You are standing at the entrance to a gigantic cavern.  Within you can see low buildings that might
    be houses.  But what really draws your eye are the wyverns.  They are everywhere.  You wonder what
    you have stumbled across here.
  sector: city
  exits:
    north:
      to: tba:140:room:14041
    south:
      to: tba:140:room:14039

"tba:140:room:14041":
  name: Intersection of Claw and Scale.
  description: >
    You are standing at a four-way intersection.  Scale way runs East and West of Here, While Claw Road
    is to the North.  To the South is the City Entrance. The large reptilian citizens of this city move
    by you paying no attention to the insignificant creature in their domain.  The stone of this place is
    the same dull gray as the outer tunnels.  What a drab place to live.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:140:room:14050
    east:
      to: tba:140:room:14042
    south:
      to: tba:140:room:14040
    west:
      to: tba:140:room:14044

"tba:140:room:14042":
  name: Scale way.
  description: >
    You are walking along an unremarkable piece of Scale way.  The drab wall of a building is to the
    North, While the wall of the cavern stretches above your range of sight to the South.  To the East it
    looks as if there are some large gates set into the stone wall there.  Some very large and well
    armored wyverns stand in front of the gates: guards?  The citizens keep their heads down as they walk
    through this part of the city, as if not wanting to be recognized.
  sector: city
  exits:
    east:
      to: tba:140:room:14043
    west:
      to: tba:140:room:14041

"tba:140:room:14043":
  name: Intersection of Scale and Fang.
  description: >
    You are standing before a huge set of bronze gates.  To the North Fang street runs the length of
    the city, while Scale way goes back to the West. Two huge wyverns stand in front of the gates to the
    East.  One of them raises a giant claw and motions you to move on.  You realize that all the citizens
    of the city have disappeared leaving you alone before these massive creatures.
  sector: city
  exits:
    north:
      to: tba:140:room:14053
    east:
      to: tba:140:room:14086
      door:
        keywords: [gate]
        kind: door
        reset: closed
    west:
      to: tba:140:room:14042

"tba:140:room:14044":
  name: Scale way.
  description: >
    This is a long stretch of Scale way.  To the North there is the blank wall of one of the long low
    structures that seem to pass as buildings here.  To the South the smooth wall of the cavern forms a
    natural boundary to the city.  The road runs East and West to intersections.  As you are looking around
    one of the city guards plods by and gives you a glare from deep-set red eyes.  You begin to wonder
    if you should be here at all.
  sector: city
  exits:
    east:
      to: tba:140:room:14041
    west:
      to: tba:140:room:14045

"tba:140:room:14045":
  name: Intersection of Scale and Spike.
  description: >
    This part of the city seems a little more busy than the rest.  City guards are coming and going
    from a natural cave to the West.  You have to press back into the wall to the South not to be trampled. 
    Spike Road runs to the north, And Scale way extends to the East.  This entire city is very quiet as
    if the wyverns are communicating through some other means than speech.
  sector: city
  exits:
    north:
      to: tba:140:room:14046
    east:
      to: tba:140:room:14044
    west:
      to: tba:140:room:14091

"tba:140:room:14046":
  name: Spike road.
  description: >
    You are walking along Spike road.  To the south west is the center for the city guards.  To the
    East is the door to one of the city's many low buildings. A sign with a picture of a black staff covered
    in flames hangs over the door. The citizens seem to shy away from the door as if in fear.  Now what
    could make these huge beings afraid?
  sector: city
  exits:
    north:
      to: tba:140:room:14047
    east:
      to: tba:140:room:14084
      door:
        keywords: [Door]
        kind: door
        reset: closed
    south:
      to: tba:140:room:14045

"tba:140:room:14047":
  name: Intersection of Storm and Spike.
  description: >
    This is one of the intersections of roads that follow the curve of the cavern.  A small room is off
    to the west set into the wall itself.  A tiny wyvern child peeks at you from around a corner and
    then pulls its head back when it sees you looking at it.  There seems to be a store of some sort to the
    South East.
  sector: city
  exits:
    north:
      to: tba:140:room:14061
    east:
      to: tba:140:room:14048
    south:
      to: tba:140:room:14046
    west:
      to: tba:140:room:14094

"tba:140:room:14048":
  name: Storm street.
  description: >
    This part of the city seems relatively quiet.  A few citizens walk by but most of the traffic seems
    to be to the East at a large intersection.  To the west there is a small cave cut into the wall of
    the main cavern, While the walls of buildings form the North and South sides of the street.
  sector: city
  exits:
    east:
      to: tba:140:room:14049
    west:
      to: tba:140:room:14047

"tba:140:room:14049":
  name: Intersection of Storm and Claw.
  description: >
    This is one of the central intersections in the City.  Citizens and guards stream by you on all
    sides.  To the north you can see the fronts of two of the low buildings you assume to be stores.  A gust
    of wind from the south blows the musky sent of the inhabitants of this city to you, reminding you of
    what an alien society you are really in.
  sector: city
  exits:
    north:
      to: tba:140:room:14058
    east:
      to: tba:140:room:14051
    south:
      to: tba:140:room:14050
    west:
      to: tba:140:room:14048

"tba:140:room:14050":
  name: Claw road.
  description: >
    You are standing on a section of Claw road that seems empty of oficial activity.  The road runs
    North and South, While to the East and West you see the backs of the low stone buildings that these
    wyverns seem to favor.  The citizens still ignore you as if you weren't even there.
  sector: city
  exits:
    north:
      to: tba:140:room:14049
    south:
      to: tba:140:room:14041

"tba:140:room:14051":
  name: Storm street.
  description: >
    This is an empty stretch of Storm street.  The street runs to the East and West to Fang street and
    Claw road.  With nothing else to look at you glance up to where the roof of the huge city cavern
    should be.  Far above the darkness continues and you wonder just how large this cavern really is?
  sector: city
  exits:
    east:
      to: tba:140:room:14052
    west:
      to: tba:140:room:14049

"tba:140:room:14052":
  name: Intersection of Storm and Fang.
  description: >
    This is the intersection of Storm and Fang.  To the East you see a small cave opening off the main
    cavern.  To the North west and South west are more of the long low buildings of the city.  You find
    yourself having to jump aside to avoid being crushed by a pair of workers carrying a long package by
    you.  A third citizen walks by and glares at you but says nothing.
  sector: city
  exits:
    north:
      to: tba:140:room:14054
    east:
      to: tba:140:room:14093
    south:
      to: tba:140:room:14053
    west:
      to: tba:140:room:14051

"tba:140:room:14053":
  name: Fang street.
  description: >
    Your travels have taken you to a well worn stretch of Fang street.  To the South East a set of huge
    bronze gates are guarded by two fierce looking wyverns.  To the West a sign hangs over the front
    door to a shop.  The sign has a picture of a dragon diving into a barrel.  Many citizens enter and leave
    the building.  One of them leaves carrying a huge barrel.  He bumps into you and sends you
    sprawling, but doesn't seem to notice.
  sector: city
  exits:
    north:
      to: tba:140:room:14052
    south:
      to: tba:140:room:14043
    west:
      to: tba:140:room:14085
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14054":
  name: Fang street.
  description: >
    You are walking along an empty stretch of Fang street.  The citizens seem to take little interest
    in this part of the city.  There looks to be a small cave cut into the rock wall to the North east. 
    There is a flash of movement from the street ahead of you and then it vanishes.  Is someone following
    you?
  sector: city
  exits:
    north:
      to: tba:140:room:14055
    south:
      to: tba:140:room:14052

"tba:140:room:14055":
  name: Intersection of Wing and Fang.
  description: >
    This is the intersection of Wing and Fang.  Off to the East is one of the small caves that dot the
    sides of this huge cavern.  Looking to the North you can see a line of buildings running from East to
    West.  The streets here are larger and the buildings are more ornate.  Perhaps this is a more
    affluent part of the city?
  sector: city
  exits:
    north:
      to: tba:140:room:14069
    east:
      to: tba:140:room:14096
    south:
      to: tba:140:room:14054
    west:
      to: tba:140:room:14056

"tba:140:room:14056":
  name: Wing way.
  description: >
    This is a long piece of Wing way.  The few citizens that walk down this street hold their long
    necks up in the air importantly.  Far to the North you can see a gigantic arch leading into blackness. 
    It looks as though the buildings to the north are the last line of shops in the main cavern.  You
    begin to wonder how these creatures were able to build such a large city when there seems to be no
    craftsman among them.
  sector: city
  exits:
    east:
      to: tba:140:room:14055
    west:
      to: tba:140:room:14057

"tba:140:room:14057":
  name: Intersection of Wing and Claw.
  description: >
    You are standing in a small square.  To the South appears to be two buildings with signs hanging
    over their front doors.  Directly north you can clearly see that the cavern wall opens into a long high
    tunnel.  In the center of the square is a large statue of Ferret the mighty Dragon.  The people that
    pass by all bow respectfully to the image of the all-mighty God.
  sector: city
  exits:
    north:
      to: tba:140:room:14066
    east:
      to: tba:140:room:14056
    south:
      to: tba:140:room:14058
    west:
      to: tba:140:room:14059

"tba:140:room:14058":
  name: Claw road.
  description: >
    This section of Claw road looks like it is very well traveled.  The paving stones of the road are
    worn smooth.  Perhaps this has something to do with the two stores on either side of the road.  To the
    west a sign hangs over the storefront with the picture of a dragon's claw dripping gold and jewels
    from it.  To the East there is a sign with a dragon breathing flames and dripping blood.  Citizens
    walk in out of both stores still saying nothing to you or anyone else.
  sector: city
  exits:
    north:
      to: tba:140:room:14057
    east:
      to: tba:140:room:14083
      door:
        keywords: [Door]
        kind: door
        reset: closed
    south:
      to: tba:140:room:14049
    west:
      to: tba:140:room:14082
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14059":
  name: Wing way.
  description: >
    You are walking along an empty stretch of Wing way.  There is a rather large cave opening to the
    West.  A guard marches by and growls at you deep in its throat.  Apparently this part of the city is
    off limits to most people.  The street itself is hemmed in by the sides of buildings to the North and
    South.
  sector: city
  exits:
    east:
      to: tba:140:room:14057
    west:
      to: tba:140:room:14060

"tba:140:room:14060":
  name: Intersection of Wing and Spike.
  description: >
    You are standing outside what you now recognize to be a Wyvern house.  To the North of you Guards
    are patrolling the street with unusual intensity. What could be of such value?  To the South and East
    you can look all the way down the streets to the opposite cavern walls.  With the size of the
    citizens it's no wonder they have such a large home.
  sector: city
  exits:
    north:
      to: tba:140:room:14062
    east:
      to: tba:140:room:14059
    south:
      to: tba:140:room:14061
    west:
      to: tba:140:room:14095

"tba:140:room:14061":
  name: Spike road.
  description: >
    This side of the city seems to be the residential district.  Citizens quietly walk by in all
    directions.  There looks to be a small cave off to the north west from here.
  sector: city
  exits:
    north:
      to: tba:140:room:14060
    south:
      to: tba:140:room:14047

"tba:140:room:14062":
  name: Spike road.
  description: >
    Walking along this part of the road you begin to feel nervous.  For the past few minutes only
    heavily armed guards have gone by.  The decorative air of some of the larger buildings is gone.  To the
    North the Road turns East to what might be the front of a store.  Something flies above you in the
    darkness blowing the sent of ancient dust and mold to you but when you look to see what it is nothing is
    there.
  sector: city
  exits:
    north:
      to: tba:140:room:14063
    south:
      to: tba:140:room:14060

"tba:140:room:14063":
  name: Intersection of Dragon and Spike.
  description: >
    This is the end of Spike road.  Looking to your west you see a wyvern child peeking at you from the
    entrance to a wyvern cave.  The stones here glisten with moisture from a small spring that falls
    from the roof and into a pool at the side of the street.  Looking South you can see all the way to the
    end of Spike, where the guards headquarters is.  To the East is the front of a shop where several
    youths practice wielding weapons.
  sector: city
  exits:
    east:
      to: tba:140:room:14064
    south:
      to: tba:140:room:14062
    west:
      to: tba:140:room:14098

"tba:140:room:14064":
  name: Dragon drive.
  description: >
    You are on the Western part of Dragon drive.  To the South is the entrance to some sort of shop.  A
    sign over the door has a picture of a huge red dragon claw slashing downward at a figure in full
    plate armor on it.  To the East is the end of Claw road, while to the west is one of the small
    residential caves these reptiles seem to live in.  A guard wearing a huge crested helm plods by and spits at
    your feet.  There is a distinct feeling of menace about this place.
  sector: city
  exits:
    east:
      to: tba:140:room:14065
    south:
      to: tba:140:room:14079
      door:
        keywords: [Door]
        kind: door
        reset: closed
    west:
      to: tba:140:room:14063

"tba:140:room:14065":
  name: Intersection of Dragon and Claw.
  description: >
    This is the end of Claw road.  East and west of here long low buildings open up with signs over
    their front doors.  To the North you can see a tunnel with yet another store in its West side.  The
    tunnel leads to a square of some sort in a second cavern.  The citizens and youth of the city walk around
    you over the pitted gray paving stones paying no attention to the pitiful creature that has invaded
    their privacy.  Looking South you can see some sort of statue in a small plaza.  Dragon drive extends
    East and West, while Claw road goes further South toward the entrance to the cavern.
  sector: city
  exits:
    north:
      to: tba:140:room:14070
    east:
      to: tba:140:room:14067
    south:
      to: tba:140:room:14066
    west:
      to: tba:140:room:14064

"tba:140:room:14066":
  name: Claw road.
  description: >
    You are walking along the Northern end of Claw road.  A few of the guards seem to be congregating
    around the front of two buildings north of you. Directly in front of you is an arched entrance into a
    long tunnel.  Young wyverns enter and leave the tunnel and you can hear the sounds of combat far to
    the North.  For your sake you hope they keep ignoring you.
  sector: city
  exits:
    north:
      to: tba:140:room:14065
    south:
      to: tba:140:room:14057

"tba:140:room:14067":
  name: Dragon drive.
  description: >
    This part of the city is filled with marching guards and training recruits. To the South stands a
    low building with a sign hanging over the door.  The sign has a picture of a Dragon being skinned
    alive with a flaming knife on it.  The dull gray of the stones around you suddenly seems very
    depressing.  You wonder why there are so few reflective surfaces in this wealthy metropolis?  To the north West
    a large tunnel opens up easily accommodating several 15 foot long citizens abreast.  East and West
    Dragon drive runs the width of the main city cavern.
  sector: city
  exits:
    east:
      to: tba:140:room:14068
    south:
      to: tba:140:room:14081
      door:
        keywords: [Door]
        kind: door
        reset: closed
    west:
      to: tba:140:room:14065

"tba:140:room:14068":
  name: Intersection of Dragon and Fang.
  description: >
    You are standing at one of the corners of the main cavern.  To the East is a small wyvern house. 
    Fang street runs the length of the city to the South, While to the West you can see two stores and a
    large cave opening in the North wall.  This city seems so inhospitable should you keep traveling here?
  sector: city
  exits:
    east:
      to: tba:140:room:14097
    south:
      to: tba:140:room:14069
    west:
      to: tba:140:room:14067

"tba:140:room:14069":
  name: Fang street.
  description: >
    You are walking along Fang street.  It may be your imagination but all the citizens around here
    seem to be carrying weapons or wearing some kind of armor. The road you are on runs north and South
    following the curve of the main cavern.
  sector: city
  exits:
    north:
      to: tba:140:room:14068
    south:
      to: tba:140:room:14055

"tba:140:room:14070":
  name: Wyvern way.
  description: >
    You are standing in a short high arched tunnel of polished black stone.  To the West is a large
    iron door with a sign hanging over it.  The sign has a picture of a huge wyvern picking up a human and
    taking a big bite out of him. Many young wyverns are coming and going from a huge cavern to the
    north.  The sounds of battle and magic can be heard from that direction as well as chanting.  The smell of
    roasting meet comes from the door to the West and your mouth begins to water.  To the South is the
    End of Claw road.
  sector: city
  exits:
    north:
      to: tba:140:room:14071
    south:
      to: tba:140:room:14065
    west:
      to: tba:140:room:14080
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14071":
  name: The hall of Wyverns.
  description: >
    You are standing in an ornately carved cavern filled with statues and plaques in honor of long dead
    wyvern heros.  This might be a nice place to rest and think except that In a chamber to the East and
    a room up a flight of stone stairs the sounds of battle can be heard.  To the West there is a small
    glowing chamber that emanates a feeling of magical energy.  The citizens and youth who walk through
    here all bow respectfully to the statuary, acknowledging their long lost ancestors as they pass by.
  sector: city
  flags: [peaceful, soundproof, no_track]
  exits:
    north:
      to: tba:140:room:14076
    east:
      to: tba:140:room:14072
    south:
      to: tba:140:room:14070
    west:
      to: tba:140:room:14073
    up:
      to: tba:140:room:14075
    down:
      to: tba:140:room:14074
      door:
        keywords: [Stone]
        kind: door
        reset: closed

"tba:140:room:14072":
  name: Battle.
  description: >
    This is the guild of warriors.  All around you wyvern youth battle each other with claw and tooth
    for best advantage.  Some of the older adolescents use traditional claw sabers to fence, While others
    practice dodging their foes' attacks as quickly as possible.  Despite the best efforts of the
    trainees the gray stone floor is splattered with blood from accidental cuts and gashes. The room itself is a
    round arena filled with practice dummies and targets.  A huge plaque on one wall holds the names of
    all the graduates of the guild.
  sector: city
  exits:
    west:
      to: tba:140:room:14071

"tba:140:room:14073":
  name: Sorcery.
  description: >
    This is the hall of sorcery.  Spread around the edge of the room are large tomes on dark wooden
    stands.  The students gradually make their way around the room from left to right as they gain knowledge
    and master each book.  There are occasional flashes of light and puffs of smoke as spells misfire. 
    Every once in a while a bolt of fire or energy blasts forth and eradicates one of the targets in the
    center of the room.  Standing at the front of the room is a large statue of their dragon God.  Smoke
    from burning braziers fills the room with a musky scent and candles cast a flickering glow on the
    smooth stone walls.
  sector: city
  exits:
    east:
      to: tba:140:room:14071

"tba:140:room:14074":
  name: Shadows.
  description: >
    You are standing in a dark square chamber of shadows.  As your eyes adjust to the light you can see
    figures grouped around tables and standing within small alcoves around the room.  As you get a
    better view of the interior of the room you are aware of all the eyes, seen and unseen that focus on you. 
    The urge to climb out of this chamber to some place well-lighted is very strong.
  sector: city
  flags: [soundproof, no_track]
  exits:
    up:
      to: tba:140:room:14071
      door:
        keywords: [Stone]
        kind: door
        reset: closed

"tba:140:room:14075":
  name: Honor.
  description: >
    This is the Knights' Arena.  This massive stone circle is open for the use of the knights in
    training.  Several giants supervise the youth as they battle each other with a variety of traditional and
    exotic weapons.  Other knights offer instruction in mounted combat, the wyverns seem to be having
    trouble mastering the concept.  Off to one side is a statue to the founder of the knights, Khelben, Lord
    of the Elements.  Set off in a depression in the floor is a old wyvern repairing the dented training
    armors of the students.  These warriors look very professional.
  sector: city
  exits:
    down:
      to: tba:140:room:14071

"tba:140:room:14076":
  name: The Temple of Wyverns.
  description: >
    This is the high temple of Wyverns.  In the center of the domed and pillared room stands an altar
    to their dragon god.  Several clerics in training gesture and chant with holy symbols and books of
    wisdom in hand.  Despite the combative nature of wyverns, this room feels peaceful, an odd feeling given
    the general air of this city.
  sector: city
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:140:room:14077
    east:
      to: tba:140:room:14099
    south:
      to: tba:140:room:14071
    west:
      to: tba:140:room:14078

"tba:140:room:14077":
  name: The Viewing.
  description: >
    You are standing in a small room of polished blue and silver stone.  This is the holy viewing room
    where gods and mortals write their messages to each other.  In one corner a priest stands looking at
    the board.
  sector: city
  exits:
    south:
      to: tba:140:room:14076

"tba:140:room:14078":
  name: The Gathering.
  description: >
    This is the city's gathering room.  The room is filled with benches and a podium at the front of
    the hall.  In one corner a few old city officials are discussing some point of judicial law in hushed
    tones, while at one side of the hall a few citizens examine the board for news.
  sector: city
  exits:
    east:
      to: tba:140:room:14076

"tba:140:room:14079":
  name: Wyvern weapons of Chaos.
  description: >
    When you first enter this shop it looks as if you are in a jail of some sort.  The walls are
    blocked from floor to ceiling with iron bars.  Hanging on the walls behind the bars are all manner of
    weapons.  A large set of claw-like weapons catches your eye in particular.  There is a small desk at the
    back of the shop.  Attached to the bars is a sign that says, "Those thinking to remove the items of
    this store without paying should know the owner does not need them to defend himself or his store. 
    Those who doubt should attempt to walk off with a weapon while guessing how many pieces they will be
    left in soon.  "
  sector: city
  exits:
    north:
      to: tba:140:room:14064
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14080":
  name: The Dragon's Feast.
  description: >
    This is a huge cave carved with pictures of wyverns eating and drinking on all the walls.  Low
    couches are scattered across the floor and in front of the bar.  A few patrons are sipping from tankards
    of ale while others feast on huge portions of roasted meets.  There is a sign hanging over the bar
    that reads, "Eat drink and be merry.  Thieves will become part of the menu.  " The room is dimly lit
    making it difficult to see the faces of those in the room.  You vaguely think that this would be a good
    place for an ambush.
  sector: city
  exits:
    east:
      to: tba:140:room:14070
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14081":
  name: Wyvern Armors of Chaos.
  description: >
    This shop looks like a taxidermist's nightmare.  The walls are hung with armors of all types. 
    Prominently featured is a set of decorative scaled hide armor with the symbol of Balm etched upon it. 
    The back wall has a huge axe hanging on it and a low counter separates you from the goods.  A sign on
    the counter reads, "Thieves will become part of the merchandise, those with thick hides are
    particularly encouraged to join those displayed on the wall.  "
  sector: city
  exits:
    north:
      to: tba:140:room:14067
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14082":
  name: The Treasure Trove Store.
  description: >
    This building is filled with odds and ends of all types.  Glass cases line the walls holding
    unusual and sometimes valuable items.  A set of scales and a locked chest are behind a high counter of
    heavy stone.  A sign on the wall reads, "If you're here to buy or sell come right on in, if you're here
    to steal.  Please enjoy our security measures, we'll clean up what's left of you later.  "
  sector: city
  exits:
    east:
      to: tba:140:room:14058
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14083":
  name: The Dragon's Breath.
  description: >
    This cluttered shop is filled with the symbols of various gods and goddesses.  Featured prominently
    are the symbols of Rumble and Telemacos. Shelves and cabinets are everywhere.  They are filled with
    potions, salves, and magical tomes.  There is a sign hanging from the center of the roof.  It says,
    "Anyone wishing to remove the items of this shop are welcome to them.  They will need them to recover
    from the beating they will receive from the owner. Please pay for all items and have a nice day.  "
  sector: city
  exits:
    west:
      to: tba:140:room:14058
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14084":
  name: Wyvern Wards and all things magical.
  description: >
    You are in an odd combination of magic shop and museum.  Shelves and niches in the walls hold
    potions, scrolls, and artifacts from around the realms.  A counter of glowing red stone blocks your way
    before you can get any closer than looking at these wonders.  A small sign on the counter reads "do not
    touch the merchandise.  Survivors will be prosecuted.  "
  sector: city
  exits:
    west:
      to: tba:140:room:14046
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14085":
  name: Wyvern Water Works.
  description: >
    This is a rather low oblong room with a large well at one end.  Small fountains line each wall and
    there is a low counter of polished gray rock that runs the length of the room.  Barrels and all sorts
    of containers are hung on a rack on the other side of the counter.  A small sign reads, "do not
    drink without paying.  Violators will get there drink then be drowned.  "
  sector: city
  exits:
    east:
      to: tba:140:room:14053
      door:
        keywords: [Door]
        kind: door
        reset: closed

"tba:140:room:14086":
  name: The great cave.
  description: >
    This is the great cave of Wyverns.  The walls here have been carved with the family history of the
    royal line of this city.  Large wyverns stand everywhere looking at you with distaste, "What are you
    doing here?  " One of them asks. The roof is polished gray rock set with crystals and precious
    stones.  To the West the gates look like a good way to get out of here, something you are continually
    thinking about now.
  sector: city
  exits:
    north:
      to: tba:140:room:14088
    east:
      to: tba:140:room:14087
    west:
      to: tba:140:room:14043
      door:
        keywords: [Gates]
        kind: door
        reset: closed

