"tba:314:room:31493":
  name: Cracked Path
  description: >
    The path used to be a small street of cobbled stone, leading toward the asylum's main water source,
    the water tower.  The tower rises high into the dark sky to the west.
  sector: inside
  flags: [dark, no_mob]
  exits:
    east:
      to: tba:314:room:31462
    west:
      to: tba:314:room:31494

"tba:314:room:31494":
  name: Cracked Path
  description: >
    The path splits to south and also allows entrance into the water tower to the west.  There is some
    sort of short, thin structure rising about twenty feet into the air to the south but from here it is
    too dark and too far to be seen clearly.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31493
    south:
      to: tba:314:room:31497
    west:
      to: tba:314:room:31495

"tba:314:room:31495":
  name: In the Base of the Water Tower
  description: >
    This is an oddly wood tiled sphere which held water when the asylum was functional.  It now has too
    many holes and leaks to hold any water all, but a spiral staircase still leads around the inside up
    to the top, probably installed so that repairs could be made when their were leaks.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31494
    up:
      to: tba:314:room:31496

"tba:314:room:31496":
  name: At the Top of the Water Tower
  description: >
    There is no roof over the top of this thing, the asylum must have relied heavily on rain water to
    help replenish their supplies of water whenever nature was kind.  This small platform runs around near
    the utmost top of tower, a wire mesh affair that feels none-too-sturdy.
  sector: inside
  flags: [dark]
  exits:
    down:
      to: tba:314:room:31495

"tba:314:room:31497":
  name: Cracked Path
  description: >
    The path leads into a burnt out ruin of a building, one which was obviously not made of stone like
    the rest of this place.  All that remains, or so it appears, of the place is the chimney which still
    stands tall with a fireplace at the base.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31494
    south:
      to: tba:314:room:31498

"tba:314:room:31498":
  name: Ruins of a Building
  description: >
    The ground is covered in charred pieces of wood and debris.  No growth at all grows here, as the
    burning stunted that growth for many years yet to come.  A tall stone fireplace rises to the west.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31497
    west:
      to: tba:314:room:31499

"tba:314:room:31499":
  name: Ruins of a Building
  description: >
    The ground is covered in charred pieces of wood and debris.  No growth at all grows here, as the
    burning stunted that growth for many years yet to come.  A stone chimney with a fireplace at the base
    is all that is left of whatever sort of building might once have stood here long ago.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31498
