  name: Dormitory
  description: >
    This is where the students - or mental loonies - were bunked at night. There are no longer any
    sorts of furniture items left in the room, only hunks of broken plaster and mortar.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31480
    west:
      to: tba:314:room:31477

"tba:314:room:31480":
  name: Dormitory
  description: >
    This is where the students - or mental loonies - were bunked at night. There are no longer any
    sorts of furniture items left in the room, only hunks of broken plaster and mortar.
  sector: inside
