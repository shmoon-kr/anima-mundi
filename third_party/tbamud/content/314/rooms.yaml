"tba:314:room:31481":
  name: Storage and Detainment Area
  description: >
    This room has a wall of lockers, all broken and wide open with no contents in them whatsoever.  On
    the south wall is a small wooden door, still securely fastened on its hinges.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31482
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:314:room:31477

"tba:314:room:31482":
  name: The Cooling Room
  description: >
    This was the asylum staff's ultimate weapon against any of the students who became unruly or out of
    hand.  The temperature in this little cubicle dips down well below freezing in the nights, being
    dirt floored and in the basement.  Any students who had a problem with obedience ending up cooling their
    heels in the Cooling Room.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31481
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31483":
  name: Old Cobbled Trail
  description: >
    This was once a sedate cobbled walkway, the cobbles now missing or broken and soaked in blood.  The
    trail turns south and curves out of sight to the east again toward a tall, square-ish stone building.
  sector: inside
  flags: [dark, no_mob]
  exits:
    south:
      to: tba:314:room:31484
    west:
      to: tba:314:room:31466

"tba:314:room:31484":
  name: Old Cobbled Trail
  description: >
    This was once a sedate cobbled walkway, the cobbles now missing or broken and soaked in blood.  The
    trail heads north back toward the courtyard or turns east again, headed toward the entrance of a
    tall, stone building.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31483
    east:
      to: tba:314:room:31485

"tba:314:room:31485":
  name: Old Cobbled Trail
  description: >
    This was once a sedate cobbled walkway, the cobbles now missing or broken and soaked in blood.  The
    building, which now lies just south of you, can be entered through a doorway just east from here.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31486
    west:
      to: tba:314:room:31484

"tba:314:room:31486":
  name: Entrance to the Auditorium
  description: >
    The interior of the building can be seen through the flickering lights within.  Squatters can be
    seen inside the building, hunched over fires or sleeping in wretched balls on floor.  The trail heads
    west away from here back toward the courtyard.
  sector: inside
  flags: [dark]
  exits:
    south:
      to: tba:314:room:31487
    west:
      to: tba:314:room:31485

"tba:314:room:31487":
  name: Auditorium Floor
  description: >
    The place has an immense main floor, a large stage dominating the north end of the main floor. 
    Grubby, wretched people huddle near small fires or lie curled upon the floor sleeping what little
    amounts that they might before the next Choosing.  A set of stone stadium seats lead up to the roof on the
    south end of the place.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31486
    south:
      to: tba:314:room:31489
    west:
      to: tba:314:room:31488

