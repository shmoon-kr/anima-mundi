"tba:314:room:31491":
  name: Auditorium Seating
  description: >
    Rows and rows of stone seats line the sloping floor, east to west up to the south wall where the
    seats actually reach the ceiling.  More squatters lie wedged between seats, snug in their hopes that
    they will not be the next Chosen.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31492
    down:
      to: tba:314:room:31490

"tba:314:room:31492":
  name: Auditorium Seating
  description: >
    Rows and rows of stone seats line the sloping floor, east to west up to the south wall where the
    seats actually reach the ceiling.  More squatters lie wedged between seats, snug in their hopes that
