# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 314.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:314:room:31400":
  name: Entrance to the Asylum Grounds
  description: >
    The pitted black gate lies just to the north, the crumbling stone wall running off east and west
    from the gate.  It is a wonder the gate is still functional, so old and decrepit it seems.  South is
    what used to be the main entryway to a large compound of some sort, one that seems almost scholastic in
    appearance, but more somber - more militaristic.  In any case, it is certainly no longer in use, and
    has not been for some time.
  sector: inside
  exits:
    south:
      to: tba:314:room:31401
  extras:
  - keywords: [info, credits]
    text:
    - "*X'Raantra's Altar of Sacrifice"
    - >
      *Written by Kaan for Dibrova Level: 15 - 45 100 rooms 21 mobs 30 objs Connector Zones: The Plains
      of Blood This is set in the grounds of an old insane asylum which X'Raantra took for his own use.
      X'Raantra hears a voice in his head -he is a nutball- this voice he hears, he takes to be the Lord
      Almighty. The voice tells him that only through human sacrifice will he ascend through the gates of Heaven.
      X'Raantra, though obviously crazy, is extremely enigmatic and has been able to gather a good number
      of people to join in his cult which is centered in the ruins of this old asylum. There are a few
      spec_procs I added to a couple of mobs - just for effect, really. The zone probably will not lack without
      these procs. Links: 00n

"tba:314:room:31401":
  name: At the Old Fountain
  description: >
    A fountain, dry and cracked and blackened by grime and dirt, stands in the center of this small
    court.  The fountain boasts the figure of a man standing proudly in the center, a thick tome tucked
    under his one arm and the other hand holding onto his lapels.  There is still some sort of liquid at the
    bottom of the fountain, but it does not appear to be safe for consumption.
  sector: inside
  exits:
    north:
      to: tba:314:room:31400
    east:
      to: tba:314:room:31403
    south:
      to: tba:314:room:31402
    west:
      to: tba:314:room:31405

"tba:314:room:31402":
  name: The Asylum Grounds
  description: >
    Large buildings surround every side, paths which once must have been well tended are now choked
    with weeds and run between these buildings and around them.  Two very square-ish looking buildings lie
    to the east and the west, a smaller and taller building lying to the south.  To the north is, of
    course, the exit from this place.  The door to the southern-most building lies directly south from here.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31401
    east:
      to: tba:314:room:31404
    south:
      to: tba:314:room:31431
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:314:room:31406

"tba:314:room:31403":
  name: The Asylum Grounds
  description: >
    The tall weeds cover most of the masonry that used to cover the ground here, only small patches of
    stonework still visible through the tangle.  Once upon a time, this place must have been some sort of
    well-funded institution.  What could have happened to cause it to be left in this state, one can
    only imagine.
  sector: inside
  flags: [dark]
  exits:
    south:
      to: tba:314:room:31404
    west:
      to: tba:314:room:31401

"tba:314:room:31404":
  name: The Asylum Grounds
  description: >
    The ground beneath was very obviously once cobbled entirely in this small court, the stones still
    prohibiting growth in many small spots throughout.  A long two story building lies to the east, its
    main doors just east from here, one of them swinging on its hinge at a crazy angle.  Looking closely at
    the door, there can be seen a smear of blood near the handle and on the framework around the
    handle.  A jumbled path leads south between the buildings.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31403
    east:
      to: tba:314:room:31407
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31434
    west:
      to: tba:314:room:31402

"tba:314:room:31405":
  name: The Asylum Grounds
  description: >
    Close by to the west is the door to a long two story building made of carved stone.  The court
    around you must once have been quite a sight with the fountain in the center and the surrounding
    buildings, however someone or something caused all of this to be abandoned and left to rot into its current
    state.  Perhaps funding ran out, perhaps a disease.  One can only surmise.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31401
    south:
      to: tba:314:room:31406
    west:
      to: tba:314:room:31420
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31406":
  name: The Asylum Grounds
  description: >
    A long two story building runs along north and south, forming the western boundary of this court. 
    To the south is a path leading around the buildings of the court heading farther back into the
    asylum's area.  At this angle, south along the path and somewhat behind the southern building a light of
    some sort flickers.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31405
    east:
      to: tba:314:room:31402
    south:
      to: tba:314:room:31435

"tba:314:room:31407":
  name: Inner Hall of the Academy
  description: >
    The floor of this building is made from some of concrete that was once white concrete.  It is now
    stained black from the years of disuse and neglect, the elements getting a solid hold on its
    degradation.  A door lies on the east wall, a small hole cut in upper center area where it appears there might
    once have been glass placed.  The hallway runs north from here, a thin trail of old blood running
    along the length of the floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31408
    east:
      to: tba:314:room:31412
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:314:room:31404
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31408":
  name: Inner Hall of the Academy
  description: >
    The hall here looks much the same as the hall to the south, the grime making everything blend
    together dirtily.  Another door leads off to the east, the same opening in its top center where it appears
    a window might once have been.  The trail of blood continues north to the end of the hall and leads
    into yet another door there.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31409
    east:
      to: tba:314:room:31411
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31407

"tba:314:room:31409":
  name: Inner Hall of the Academy
  description: >
    The hallway comes to an end, a final door to the east leading into a classroom.  The blood trail,
    mostly dried, runs into the room where it is too dark to see what may be inside.  The hall runs south
    into the darkness, back toward the exit.  A set of concrete stairs lead up into the darkness, their
    steps covered in litter and rubble.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31410
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31408
    up:
      to: tba:314:room:31413

"tba:314:room:31410":
  name: Classing Room
  description: >
    This small twenty foot by twenty foot room was once used as a room for teaching some sort of
    education to the pupils which resided at this asylum. There is an old blackboard, broken at one corner,
    still attached to the south wall and the desks and chairs which used to seat the pupils are still nailed
    solidly to the floor.  Obviously, if the chairs and desks had to be nailed to the floor there was a
    need for forced discipline.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31409
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31411":
  name: Classing Room
  description: >
    This small room holds three rows of chairs and desks, all of them five desks wide.  The chairs face
    south to a large blackboard and an open area before it that must have been where a teacher's desk
    would have been placed.  There is no such desk now.  The chairs and desks remain only because they were
    bolted into the floor of the room, made so as to enforce discipline the old fashioned way.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31408
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31412":
  name: Classing Room
  description: >
    This small room holds three rows of chairs and desks, all placed exact in distance from each other
    and the walls.  The walls were once of white plaster, however the plaster has cracked time and time
    again, leaving gaping holes where once smooth clean walls stood.  Lewd scrawlings adorn the walls
    where they still hold any sort of flat surface, sure evidence that this place may not completely be
    deserted.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31407
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [scrawlings]
    text: >
      You try and make out as much of the words as you can but most of them have faded into smudges. 
      Words such as mother and whore are generally repeated as well as some short poetry.  One reads Here I
      sit all broken hearted, tried to shit but only, and then it too becomes too faded to tell what
      follows.  Must have been quite important - possibly runes of some sort.

"tba:314:room:31413":
  name: Upper Hall
  description: >
    Strange that there are no windows in this entire building, it would seem that a building of this
    size made entirely of brick and mortar would get extremely warm without ventilation.  There is a door
    on the east wall, the hall itself runs south for a short distance and terminates.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31418
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31414
    down:
      to: tba:314:room:31409

"tba:314:room:31414":
  name: Upper Hall
  description: >
    The hallway is so completely littered with debris and rubble from the walls and ceiling that it
    makes it difficult to traverse the hallway.  The walls are cracked and scorched from old fires, blood
    smattered in places.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31413
    east:
      to: tba:314:room:31417
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31415

"tba:314:room:31415":
  name: Upper Hall
  description: >
    Here at the end of the hallway, the floor is covered in chunks of plaster and mortar scattered
    throughout with bricks.  There is a door on the east wall, stuck open from all the collected trash on the
    floor.  Possibly a quick jump over the junk would allow a landing to the east...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31414
    east:
      to: tba:314:room:31416
      door:
        keywords: [door]
        kind: door
        reset: open

"tba:314:room:31416":
  name: Classing Room
  description: >
    Jumbled garbage and rubble lies all over the floor of this small room.  The remains of old desks
    and chairs lie broken and scattered all over the floor, on one wall, there is even a small hole through
    to the next room.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31415
      door:
        keywords: [door]
        kind: door
        reset: open
  extras:
  - keywords: [hole]
    text: >
      You can see a small bit of the next room over - it appears to be much in the same condition as this
      one.

"tba:314:room:31417":
  name: Classing Room
  description: >
    The litter that was all over the floor of the hallway has spilled over into this room - or is it
    vice versa?  - coating the floor in filth.  Broken splinters of wood from desks and chairs lie
    scattered about, pieces of forged metal interspersed throughout.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31414
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31418":
  name: Classing Room
  description: >
    The room is smeared in shades of blood, all at various stages of aging.  It is obvious that some of
    the smears are older than others, some seem even relatively fresh.  There is a ton of rubble from
    the building's collapsing walls and ceiling, and the stink is horrific.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31413
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31419":
  name: Hall's End
  description: >
    The hall ends with a door to the west.  The door stands open, propped by the floor as it hangs by
    only one hinge.  The rubble strewn about on the floor from the building's decay makes movement through
    this area quite difficult.  The blood soaked into the plastered walls and rubble strewn floors does
    not do much to bolster the ego, either.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31420
    west:
      to: tba:314:room:31422
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31420":
  name: Inner Hall
  description: >
    This hall can almost no longer be called such as it is so desolated, so ruined by the ravages of
    time and looters that the walls no longer appear to hold any sort of form.  There are holes in the
    walls, gaping things which give a clear view into the rooms of this broken down building.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31419
    east:
      to: tba:314:room:31405
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:314:room:31423

"tba:314:room:31421":
  name: An Old Office
  description: >
    This appears to have been some sort of office or place of administration at one time.  Who knows,
    possibly long ago it may have been the registration or maybe the room where the dean of the asylum had
    his private audiences with the more problematic children.  Who can say?
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31424

"tba:314:room:31422":
  name: Administrative Office
  description: >
    This is what appears to have been an office of some sort back when the asylum was still up and
    functional.  Scraps of wood and metal lie broken on the floor of the room, most likely the remains of
    office furniture.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31419
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31423":
  name: Inner Hall
  description: >
    The hall continues its decayed way into the depths of the building, the holes in the walls still
    showing into the other rooms of the building.  Tinges of red - what appears to be bloodstains - are
    very apparent as the way into this terrible place gets farther and farther.  It might be a good idea not
    to stray too far from the door.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31420
    south:
      to: tba:314:room:31424

"tba:314:room:31424":
  name: Base of a Crumbling Stairway
  description: >
    A set of stairs lead upward, half of the stone and mortar that once made them crumbled and fallen
    to the ground beneath.  It would take a great deal of skill and foolhardy bravery to get up those
    steps.  There is a door to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31423
    east:
      to: tba:314:room:31421
    up:
      to: tba:314:room:31425

"tba:314:room:31425":
  name: At the Top of a Crumbled Stair
  description: >
    The stairway lies just below, its broken mortar and gaping holes staring out at any soul foolish
    enough to attempt a descent.  A door lies to the north, a hallway runs east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31427
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:314:room:31426
    down:
      to: tba:314:room:31424

"tba:314:room:31426":
  name: A Darkened Hall
  description: >
    The hall turns at a right angle to the north, heading into darkness.  The rubble is just as bad on
    this upper level as it is in the lower levels.  There are no doors or windows in sight, but there is
    plenty of blood - ever present.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31428
    west:
      to: tba:314:room:31425

"tba:314:room:31427":
  name: An Old Office
  description: >
    This appears to have been a very small, very private office.  There are stacks of old pieces of
    paneling, rotted and long since made worthless from time and decay, which give every indication that
    this once was a place of comfort for some high ranking administrator.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31425
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31428":
  name: Rubble-Strewn Hallway
  description: >
    The hallway runs north to south with no doors on either side and no windows on either side.  It
    almost seems that the entire building may have been sprinkled in droplets of blood, as the red stains
    persist even here in this upper level.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31430
    south:
      to: tba:314:room:31426

"tba:314:room:31429":
  name: Office
  description: >
    This was once obviously some higher-up's office as it appears that it was made just for the purpose
    of entertaining guests and other faculty.  The floor is still covered in some small areas by chunks
    of ratty carpet that was once plush and lavish, the walls covered with the same.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31430
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31430":
  name: End of a Hallway
  description: >
    The hallways ends here with a door on the west wall.  Piles of rubble climb the other walls making
    footing in any direction very treacherous.  There are still the blood stains everywhere, making the
    whole place seem as if it were seen through a red tint.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31428
    west:
      to: tba:314:room:31429
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31431":
  name: Receiving Chamber
  description: >
    This was the dean of the asylum resided back when the asylum was functional - as an asylum anyway. 
    The blood which seems to cover most of the grounds of the asylum seems especially thick here, the
    walls sticky to the touch and the floor tacky when stepped upon.  There is a small door in the east
    wall.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31402
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:314:room:31432
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31432":
  name: Living Area
  description: >
    This was the dean and his family's main room for gathering together and eating meals or sharing
    time.  The remains of an old table are here, one leg all that is left of the original four, propping the
    table up at an absurd angle.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31433
    west:
      to: tba:314:room:31431
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31433":
  name: Bedchamber
  description: >
    This ramshackle room is all that is left of what was once a very comfortable bedchamber to the dean
    and his wife.  The sheets and pillows have long since been torn to shreds and carried off by rats
    for bedding and nests, now all that is left is a pile of timber from the bed and furniture and a lot of
    plaster chunks which have fallen from the walls.  All of which is - of course - soaked in blood.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31432

"tba:314:room:31434":
  name: Jumbled Path
  description: >
    Mostly covered in weeds and brownish plant life, this trail is strewn with a litter of rock and
    mortar from the buildings around it all of which is covered with a deep red hue, the color of blood.  It
    appears that the way may have been cleared quite recently as although there is a great deal of
    rubble strewn about, the way through it all is not in any way prohibitive, as if a path had been cleared. 
    To the south a flickering light of some sort can be seen.  To the east is the entryway into a small,
    low building made of stone.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31404
    east:
      to: tba:314:room:31438
    south:
      to: tba:314:room:31436

"tba:314:room:31435":
  name: A Flickering Path
  description: >
    The path heads south toward the source of the light.  In the dim flickers, wet red stains can be
    seen splashed all over the ground, the old stones soaked and in some cases already dried by the splash
    of blood.  A terrible feeling accompanies this place, almost as if an anticipation of death were in
    the near future.  A crude stone foundation with no roof lies just to the west.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31406
    south:
      to: tba:314:room:31437
    west:
      to: tba:314:room:31440

"tba:314:room:31436":
  name: Jumbled Path Near the Courtyard
  description: >
    The source of the flickering light is now in sight.  It comes from a large crumbling stone gazebo
    set in the middle of a huge courtyard.  The courtyard is surrounded by darkened buildings, all of
    which show signs of decay.  There are humanoid shaped moving all about the courtyard, some appear as if
    they might be dancing, others appear to be going about specified tasks.  In the gazebo there are a
    number of people as well, all of which swaying in unison to some as yet unheard sound.  In looking down
    on the floor of the courtyard and even on this path, blood can be seen spilled in huge quantities all
    over the stone.  It almost appears as if it were poured on the stone in an attempt to saturate the
    entire area.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:314:room:31434
    south:
      to: tba:314:room:31445

"tba:314:room:31437":
  name: Just North of the Courtyard
  description: >
    The path enters into the northwest corner of a large stone courtyard, complete with a huge stone
    gazebo in the center.  It turns out the gazebo is the source of the flickering light, as some sort of
    fire is lit upon it, humans moving about around that fire.  All along in the courtyard are also people
    who seem to be about some sort of business, whether swaying in some ritual of some sort of going
    about a task of some sort, they are many.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:314:room:31435
    south:
      to: tba:314:room:31442

"tba:314:room:31438":
  name: The Guards' Quarters
  description: >
    It must be that the inmates of this institution were at least slightly harmful to themselves and
    others if a guard had to be kept on the grounds at all times.  This building is much like any of the
    others around, decripid and falling apart, blood stains everywhere.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:314:room:31439
    west:
      to: tba:314:room:31434

"tba:314:room:31439":
  name: The Guards' Quarters
  description: >
    The building is in a shambles in every area.  Nothing is left of any value, only broken bits of
    furniture and the like.  This asylum must have been abandoned and left to rot quite some time ago.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31438

"tba:314:room:31440":
  name: The Old Stables
  description: >
    At one time this must have been where the residents, faculty and visitors of the asylum kept their
    mounts while they stayed on the grounds.  The floor shows no sign of ever having been stoned, the
    walls are all of a crude stone which does not look to have been made for the purpose of warmth at all.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31435
    south:
      to: tba:314:room:31441

"tba:314:room:31441":
  name: The Old Stables
  description: >
    The blood is just as prevalant here as it is everywhere else in this asylum, spatters of red
    decorating every inch of the place.  What sort of hideous crime was perpatrated at this place to cover the
    entire place in blood?  What sort of hideous creature could do such a thing to such a mass of warm
    blooded creatures?
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31440

"tba:314:room:31442":
  name: Asylum Courtyard
  description: >
    The courtyard here is enormous, dominated in the center by a large gazebo which holds within a
    flickering flame of some sort.  The stones underfoot are tacky, sticking to the soles of boots and shoes,
    making progress at the very least discouraged.
  sector: inside
  exits:
    north:
      to: tba:314:room:31437
    east:
      to: tba:314:room:31443
    south:
      to: tba:314:room:31448

"tba:314:room:31443":
  name: Asylum Courtyard
  description: >
    This is the main courtyard for the entire asylum.  A huge stone gazebo dominates the center of the
    courtyard, stone steps leading up to its main floor from every direction.  The ground underfoot is
    tacky to the touch, making feet stick it.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31444
    south:
      to: tba:314:room:31446
    west:
      to: tba:314:room:31442

"tba:314:room:31444":
  name: Asylum Courtyard
  description: >
    This courtyard was once very obviously the center of traffic for the asylum back in the day.  A
    large stone gazebo lies directly south from here, a set of wide steps leading up into it.  The stone of
    the courtyard is even more soaked with blood than the rest of the previous areas, the thick stains
    making travel almost difficult as the thick, dried blood attempts to stick to the bottoms of shoes and
    boots.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:314:room:31445
    south:
      to: tba:314:room:31447
    west:
      to: tba:314:room:31443

