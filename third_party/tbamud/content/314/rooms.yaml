"tba:314:room:31458":
  name: Asylum Courtyard
  description: >
    This is the far northeast end of the courtyard.  An old decrepit chapel lies to the east, the
    entrance south from here.  From this angle, a tall bell tower can be seen rising high above the chapel,
    the bell still hanging inside.  A large stone gazebo lies in the center of the courtyard, a flickering
    light burninng strong inside.
  sector: inside
  flags: [dark]
  exits:
    south:
      to: tba:314:room:31459
    west:
      to: tba:314:room:31445

"tba:314:room:31459":
  name: Asylum Courtyard
  description: >
    The entrance to a chapel lies just south from here, a wide set of stone steps leading up east to
    the main door.  To the southwest, in the center of the courtyard, is a large stone gazebo with a
    ceremony of some sort in progress. People of some race or another can be seen shuffling about in the
    courtyard going about some sort of business.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31458
    south:
      to: tba:314:room:31460
    west:
      to: tba:314:room:31455

"tba:314:room:31460":
  name: Entrance to the Chapel
  description: >
    These steps lead straight up to the door of the chapel, a carved wooden door which has withstood
    the ravages of time and looters.  The wood must once have been very beautiful with its carved cherubs
    and angels floating about on its surface, but now those angels are smeared in blood, their faces
    ghastly and horrific in the flickering light.  The steps up to the gazebo in the center of the courtyard
    lie just west.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31459
    east:
      to: tba:314:room:31467
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:314:room:31461
    west:
      to: tba:314:room:31456

"tba:314:room:31461":
  name: Asylum Courtyard
  description: >
    This is the eastern end of the courtyard, the outer wall of the chapel just to the east.  The
    entrance to the chapel lies just north, up a set of steps.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31460
    south:
      to: tba:314:room:31466
    west:
      to: tba:314:room:31457

"tba:314:room:31462":
  name: Asylum Courtyard
  description: >
    This is the southwestern corner of the courtyard.  A small path leads west around a large building
    which lies just south from here.  The ceremony continues in the gazebo to the northeast.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31452
    east:
      to: tba:314:room:31463
    west:
      to: tba:314:room:31493

"tba:314:room:31463":
  name: Asylum Courtyard
  description: >
    This is the south end of the courtyard, bound by a long building who's entrance lies to the south,
    one of two entrances.  The gazebo lies to the northeast, in the center of the courtyard.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31453
    east:
      to: tba:314:room:31464
    south:
      to: tba:314:room:31476
    west:
      to: tba:314:room:31462

"tba:314:room:31464":
  name: Asylum Courtyard
  description: >
    The gazebo lies just north from here, at the end of a flight of steps.  To the south is the wall of
    a stone building.  The blood on the ground seems never ending.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31454
    east:
      to: tba:314:room:31465
    west:
      to: tba:314:room:31463

"tba:314:room:31465":
  name: Asylum Courtyard
  description: >
    This is the southern end of the courtyard where it butts up against the wall of a long stone
    building.  A door to that building lies to the south, the gazebo standing in the center of the courtyard -
    almost seeming to beckon entry.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31457
    east:
      to: tba:314:room:31466
    south:
      to: tba:314:room:31478
    west:
      to: tba:314:room:31464

"tba:314:room:31466":
  name: Asylum Courtyard
  description: >
    This is the southeastern corner of the courtyard.  A trail leads east between the buildings which
    form the boundaries of the courtyard.  To the far northwest is a large gazebo, a fire flickering
    within.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31461
    east:
      to: tba:314:room:31483
    west:
      to: tba:314:room:31465

"tba:314:room:31467":
  name: Chapel Entryway
  description: >
    What a grand place this must once have been.  The walls all were at one time of worked stone,
    carvings of all sorts of angelic murals and poses.  To the north is a door, to the south is the main
    worship area.  East is a small room, the function of which unfathomable from this room.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31468
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:314:room:31469
    south:
      to: tba:314:room:31470
    west:
      to: tba:314:room:31460
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31468":
  name: Cloaking Room
  description: >
    The stone hooks still jut from the walls where the clergy must once have hung or donned their robes
    of office before or after a service.  There are, of course, no robes hanging from those hooks any
    longer.  This room, like most of the other rooms in the buildings of this asylum, has succumbed to the
    demand of time and decay, the walls crumbling and the floors broken and cracked.  All of this is, of
    course covered in a sheen of red.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:314:room:31467
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:314:room:31469":
  name: Shaft
  description: >
    This is nothing more than a small five by five room with no ceiling.  A look upward reveals that
    this tall shaft leads directly up into the bell tower, as the bell is visible even from here on the
    ground level.  A set of ropes hang down, their frayed ends high out of reach.  They must once have
    connected to something here, but whatever that was, it is long since rotted or taken.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:314:room:31467
    up:
      to: tba:314:room:31471

"tba:314:room:31470":
  name: Chapel Worship Room
  description: >
    There are spots where rows of pews once lined before a carved stone altar, however all that is left
    of the majesty of the place are two pews and the remains of the altar, tipped to the side and split
    asunder.  It would only appear the work of vandals or looters if not for the immense amounts of blood
    soaked into the stonework of the place.  This was a calculated ruination of a place of worship.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31467

"tba:314:room:31471":
  name: In the Shaft
  description: >
    Unbelievably, the sides of the shaft's interior walls are scalable!  Only a bit further and the
    bell can be reached, where a platform of stone surrounds the inside of the shaft.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:314:room:31472
    down:
      to: tba:314:room:31469

"tba:314:room:31472":
  name: Bell Tower
  description: >
    It turns out that the shaft leading up from the interior of the chapel is actually the bell tower
    itself.  A bird's eye view of the asylum is given here, especially of the courtyard where it is now
    painfully obvious that there are many more people moving about this place.  On the north wall is a
    window which leads out just above the roof of the chapel.  It does not appear that the tower would be
    accessible again once exited from and onto the chapel roof.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31473
    down:
      to: tba:314:room:31471

"tba:314:room:31473":
  name: Chapel Roof
  description: >
    There is not much of interest on this roof save for the fact that it is the only place thus far
    that is not soaked in blood, nor is it full of the rubble and trash that is littered about the ground
    and in the buildings.  It must be too much effort for the vandals of this area to climb out here and
    trash this part as well.  It appears that the only way from this rooftop is down, jumping from the roof
    to the courtyard below.
  sector: inside
  flags: [dark]
  exits:
    down:
      to: tba:314:room:31459

"tba:314:room:31474":
  name: Library Entry
  description: >
    This is a small antechamber where at one time check-out secretary or librarian once sat and made
    sure that all books within were accounted for. There is no desk, no secretary or librarian, only a set
    four crumbling walls, the plaster or mortar fallen and in decay.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:314:room:31450
    south:
      to: tba:314:room:31475

"tba:314:room:31475":
  name: Library
  description: >
    Most of the shelves that used to line the walls, molded into the stone that made up the walls, are
    now broken and lying in dust on the cracked floors.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31474

"tba:314:room:31476":
  name: Faculty Rooms
  description: >
    The faculty of the asylum kept their rest cots and break tables in this room, not to mention a
    guard was always on station as further in this building lies the dorm rooms of all 'students' for the
    place.  There is still a remnant of what the room must have been, some old steel frames - probably cots
    - line one wall, all rusted into uselessness.  Like every other section of this asylum, the walls are
    soaked in blood as are the floors.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31463
    south:
      to: tba:314:room:31477

"tba:314:room:31477":
  name: Dormitory
  description: >
    This is where the students - or mental loonies - were bunked at night. There are no longer any
    sorts of furniture items left in the room, only hunks of broken plaster and mortar.  A doorway opens wide
    into a basement stairway.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31476
    east:
      to: tba:314:room:31479
    down:
      to: tba:314:room:31481

"tba:314:room:31478":
  name: Faculty Rooms
  description: >
    The faculty of the asylum kept their rest cots and break tables in this room, not to mention a
    guard was always on station as further in this building lies the dorm rooms of all 'students' for the
    place.  There is still a remnant of what the room must have been, some old steel frames - probably cots
    - line one wall, all rusted into uselessness.  Like every other section of this asylum, the walls are
    soaked in blood as are the floors.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:314:room:31465
    south:
      to: tba:314:room:31480

