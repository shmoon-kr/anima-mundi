    stone holder, a makeshift altar next to it.  A man dressed in dark blood-soaked robes kneels before the
    altar, arms upraised in prayer - a curved dagger clenched tightly in one upraised fist.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:314:room:31446
    east:
      to: tba:314:room:31451
    south:
      to: tba:314:room:31453
    west:
      to: tba:314:room:31450

"tba:314:room:31450":
  name: Entrance to a Building
  description: >
    A very official looking building, at least it would look official had it not red blood stains
    covering the outer walls, lies to the west.  A set of double doors lie open at crazy angles, the interior
    dark and mysterious.  Straight to the east is a set of steps leading up to a stone gazebo.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31448
    east:
      to: tba:314:room:31449
    south:
      to: tba:314:room:31452
    west:
      to: tba:314:room:31474

"tba:314:room:31451":
  name: X'Raantra's Altar
  description: >
    The floor of the gazebo is stone, like the rest of the edifices which make up this asylum, and is
    sunk in roughly a foot from the edges.  This sunken area forms a sort of a pool, which was probably
    not the original intent of the builders, which is filled to the rim with thick, dark blood.  Torches
    are thrust into holders on the supports of the gazebo's ceiling, four of them in number lighting this
    terrible place all too well.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31447
    east:
      to: tba:314:room:31456
    south:
      to: tba:314:room:31454
    west:
      to: tba:314:room:31449

"tba:314:room:31452":
  name: Asylum Courtyard
  description: >
    The courtyard butts up against the outer wall of a single story building to the west.  The entrance
    to this building lies just north, through a set of open double doors.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31450
    east:
      to: tba:314:room:31453
    south:
      to: tba:314:room:31462

