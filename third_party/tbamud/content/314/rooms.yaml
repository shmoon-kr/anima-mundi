    west:
      to: tba:314:room:31444

"tba:314:room:31446":
  name: Asylum Courtyard
  description: >
    This area of the courtyard is a small spot of cobbled ground which lies wedged in between two sets
    of the stairs which run up to the gazebo.  The scent of fresh blood wafts heavily in the air, the
    stone all around testament to the fact that people must die in this courtyard daily.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31443
    east:
      to: tba:314:room:31447
    south:
      to: tba:314:room:31449
    west:
      to: tba:314:room:31448

"tba:314:room:31447":
  name: The Gazebo Steps
  description: >
    Now the source of the light in the gazebo is plain to see - a flickering torch is thrust into a
    stone holder, a makeshift altar next to it.  A man dressed in dark blood-soaked robes kneels before the
    altar, arms upraised in prayer - a curved dagger clenched tightly in one upraised fist.
  sector: inside
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:314:room:31444
    east:
      to: tba:314:room:31455
    south:
      to: tba:314:room:31451
    west:
      to: tba:314:room:31446

"tba:314:room:31448":
  name: Asylum Courtyard
  description: >
    The courtyard ends at its westernmost boundary, a long low building marking that boundary.  The
    entrance to the building lies just south, a set of tall steps leading up into its dark interior.  Just
    behind the building a tall water tower can be seen rising up into the night sky.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:314:room:31442
    east:
      to: tba:314:room:31446
    south:
      to: tba:314:room:31450

"tba:314:room:31449":
  name: The Gazebo Steps
  description: >
