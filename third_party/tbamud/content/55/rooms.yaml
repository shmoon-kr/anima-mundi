# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 55.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:55:room:5500":
  name: Underground
  description: The small passage continues west and east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:55:room:5501
    west:
      to: tba:54:room:5493

"tba:55:room:5501":
  name: Underground
  description: The small passage continues west and east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:55:room:5502
    west:
      to: tba:55:room:5500

"tba:55:room:5502":
  name: Underground
  description: The small passage continues west and east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5488
    west:
      to: tba:55:room:5501

"tba:55:room:5503":
  name: Clerics' Sanctum
  description: >
    You walk down the staircase into the silent inner sanctum.  Here sits your guildmaster ready to
    assist you when the time is right.  The room is completely silent.  The only obvious exit is back up the
    staircase into the the Nectar.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    east:
      to: tba:54:room:5479
      look: You notice the floor at the base of the eastern wall has some faint scratches in it.
      door:
        keywords: [secret, door]
        kind: door
        reset: closed
    up:
      to: tba:55:room:5519

"tba:55:room:5504":
  name: The Chamber Of The High Priest
  description:
  - >
    You have entered the chamber of the most holy man in New Thalos.  The High Priest advises the
    Sultan on all matters in the world of the sacred. From what you have heard however, this holy man has a
    bit of a temper, and he doesn't look very happy that you've disturbed his prayers.
  - The only obvious exit is south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5508

"tba:55:room:5505":
  name: By The Altar
  description: >
    You are by the temple altar in the northern end of Temple of New Thalos.  A huge altar made of
    highly polished black onyx is standing in front of you.  Behind this altar sits a twelve foot tall statue
    of Akbal, the highest god in all the lands.
  sector: inside
  flags: [indoors, peaceful, no_track]
  exits:
    south:
      to: tba:55:room:5509
  extras:
  - keywords: [statue]
    text: >
      Looking up the huge statue you see Akbal calmly gazing out across his lands, he seems pleased.

"tba:55:room:5506":
  name: The Weavers' Guild
  description: >
    Rows and rows of uncut cloth lie about waiting to be hemed up into tailored clothes.  Cotten is
    brought in from the country side and spun up into cloth and dyed different colors.  A young boy walks
    in, grabs a pile of clothing and leaves.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5461

"tba:55:room:5507":
  name: The Craftsmans' Guild
  description: >
    You have entered a busy workshop filled with people running amok with various tools and materials. 
    The air is tense with the rush to complete various projects and creations.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:54:room:5461

"tba:55:room:5508":
  name: Inside The Temple
  description: >
    The temple continues here, but not on such a grand scale.  The place still looks immaculate.  To
    the north you see the chamber of the High Priest and a sign on the door in BIG letters thats reads 'DO
    NOT DISTURB' To the south is the entrance to the Clerics' Guild.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:55:room:5504
    east:
      to: tba:55:room:5509
    south:
      to: tba:55:room:5512

"tba:55:room:5509":
  name: Inside The Temple
  description: >
    Huge marble pillars rise on either side of you and grab hold of the ceiling.  Between each of
    these, fine softstone frescoes have been carved depicting scenes from the religous history of New Thalos.
    Rows of pews face forward giving their full attention to the pulpit rising high above the ground. 
    The deep red carpeting underfoot shows not a speck of wear or dirt.  It is obvious that New Thalonians
    take religion seriously.
  sector: inside
  flags: [indoors, no_track, no_magic]
  exits:
    north:
      to: tba:55:room:5505
    east:
      to: tba:55:room:5510
    south:
      to: tba:55:room:5513
    west:
      to: tba:55:room:5508

"tba:55:room:5510":
  name: The Donation Room
  description: >
    This room is new to the temple, it was created during the hard times that had struck the city in
    recent decades.  Luckily for them the Sultan had been hoarding some of the basic neccesities for just
    such an occasion. These days the donation room depends on the generosity of wealthy adventurers, and a
    curse on any that walk in to take everything.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:55:room:5509

"tba:55:room:5511":
  name: The Museum Of The Greater Gods
  description:
  - >
    Four large stone statues reside in the museum.  They were constructed by the people of New Thalos
    to pay homage to the saints they believe to have saved all their lives.
  - The museum continues to the south.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:55:room:5516
    west:
      to: tba:54:room:5462

"tba:55:room:5512":
  name: The Entrance To The Guild of Clerics
  description: >
    This hall pales in comparison to that of the main hall, but is beautiful in its own right.  Shaven
    heads and brown robes can be seen milling about quitely talking to each other.  North is back inside
    the temple proper, and south is the entrance to the clerics' bar.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:55:room:5508
    south:
      to: tba:55:room:5519

"tba:55:room:5513":
  name: The Temple Gates
  description: >
    You stand before the entrance way to the Temple of New Thalos.  Two large wrought iron gates lie
    open before you.  Although they might not ever be used the priests in the temple are ready to defend
    themselves, should their city ever come under seige again.
  sector: city
  exits:
    north:
      to: tba:55:room:5509
    south:
      to: tba:55:room:5520
    down:
      to: tba:55:room:5520

"tba:55:room:5514":
  name: Ahkeem's Stuff
  description: >
    You step into a shop swirling with smoke.  Ahkeem seems to have a liking for things not of this
    world... very strange stuff indeed.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5414

"tba:55:room:5515":
  name: Vera's Veggies
  description: >
    This is a busy place.  Customers shuffle around, bartering for lower prices on the wide selection
    of vegetables.  You can still hear your mother telling you 'Eat your Veggies'.  That is probably why
    you are spending time in the city of New Thalos and not with her.  But wait... Vera looks just like
    your mother!
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5416

"tba:55:room:5516":
  name: The Museum Of The Greater Gods
  description:
  - >
    Four large stone statues reside in the museum.  They were constructed by the people of New Thalos
    to pay homage to the saints they believe to have saved all their lives.
  - The museum continues to the north.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:55:room:5511
    west:
      to: tba:54:room:5463

"tba:55:room:5517":
  name: The Base Of The Tower
  description: >
    You walk into a cold room whose only feature is an old wooden staircase spirling up along the wall
    to a higher level.  Up these stairs you are told awaits the old mage who may be able to help you
    advance in your studies.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:55:room:5518
    south:
      to: tba:55:room:5524
      look: You see some small scratches on the floor near the base of the wall.
      door:
        keywords: [door, secret]
        kind: door
        reset: closed
    up:
      to: tba:55:room:5548

"tba:55:room:5518":
  name: The Mages' Courtyard
  description: >
    You enter a small tiled courtyard with a small fountain in the middle. Around the sides are four
    wrought iron benches with cushions where the mages of the land sit and exchange ideas.  To the west
    stands a two-story tower where the leader of the mages' guild performs his experiments.
  sector: city
  flags: [peaceful]
  exits:
    south:
      to: tba:55:room:5525
    west:
      to: tba:55:room:5517

"tba:55:room:5519":
  name: Nectar Of The Gods
  description: >
    You are startled by the lavishness of this place.  From what you know of clerics they are supposed
    to be humble people, giving all their material goods to their cause.  Perhaps because only clerics
    are allowed to enter this bar they have condoned making it as comfortable as possible.  In the corner
    stands a staircase leading down to the meditaion chambers.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:55:room:5512
    down:
      to: tba:55:room:5503

"tba:55:room:5520":
  name: Temple Square
  description: >
    You are standing on the meeting grounds of those with holy intentions.  Monks, bards, paladins and
    clerics mill around either preaching or listening to their fellows preach.  Huge marble steps lead up
    to the gates of the temple and Main Street lies to the south.
  sector: city
  flags: [no_mob, no_track]
  exits:
    north:
      to: tba:55:room:5513
    south:
      to: tba:54:room:5424
    up:
      to: tba:55:room:5513

"tba:55:room:5521":
  name: The Bank
  description: >
    You stand in a large building decorated with black marble and red satin.  Huge pillars support an
    arched ceiling far above your head. You wonder at the skill the dwarves have for detail as you examine
    the trim.  Fine silver separates the polished blocks that make up the floor.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:54:room:5414

"tba:55:room:5522":
  name: The Butchery
  description: >
    This shop has the aroma of freshly slaughterd beasts.  You feel right at home.  You see a fairly
    simple set up.  The corpses... er... selections hang on hooks, still bleeding into catch pans that
    drain into a single underground vat.  You wonder where that leads...
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:54:room:5416
  extras:
  - keywords: [vat]
    text: You think you hear noises from the vat...  Naaah.

"tba:55:room:5523":
  name: The Witch's Brew
  description: >
    The first thing you notice as you walk into this spacious shop is the hundreds of candles that line
    the shelves.  The swirling mist that surrounds your feet makes it seem that you have stepped into a
    gateway to another plane.  A cluttered table stands near the far wall, opposite the doorway.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5429

"tba:55:room:5524":
  name: Braheem's Magic Shop
  description: >
    You enter a shop crowded with bookshelves and clutterd with scrolls. The owner seems to be hard at
    work on his latest magical creation. You see a small sign on the wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5430
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           The sign reads:
        
        Welcome to Braheem's...
        
        LIST   - Shows you all of my wonderful creations.
        VALUE  - Shows what an item might be worth to me.
        SELL   - Allows you to rid yourself of excessive magic items.
        BUY    - Allows you to rid youself of excessive cash.

"tba:55:room:5525":
  name: The Entrance To The Mages' Tower
  description: >
    The entrance hall is a small poor lighted room.  It would seem its only purpose is to house the
    powerful sorcerer standing here guarding the entrance.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:55:room:5518
    south:
      to: tba:54:room:5431

"tba:55:room:5526":
  name: The Entrance To The Guild of Warriors
  description: This small hall is merely a check point to keep the unwanted out.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:54:room:5423
    south:
      to: tba:55:room:5533

"tba:55:room:5527":
  name: The Repair Shop
  description: >
    One of the most popular shops in New Thalos, this shop is always a hive of activity.  It is almost
    inhuman the way one man can fix all types of armor singlehandedly.  If you have an item in need of
    repair simply give it to the man behind the counter. There is a small sign on the counter.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:54:room:5424
  extras:
  - keywords: [sign]
    text: "The sign reads: Closed for renovations"

"tba:55:room:5528":
  name: The General Store
  description: >
    The new found wealth of this beautiful city is apparent in the exotic items for sale here.  You
    wonder what would happen if you typed...LIST...
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5408

"tba:55:room:5529":
  name: Abdul's Armor
  description: >
    The sound of hammering metal grows louder as you enter the armory. Young boys run to and fro
    carrying buckets of water and coal.  A few dwarves work on sections of armor in the back of the shop, their
    hammers working too fast to follow.  The walls are adorned in all of Abdul's prize creations.  Here
    you can purchase suits of armor meant to keep monsters from hacking you into little pieces. A note on
    the wall beckons your attention.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:54:room:5407
  extras:
  - keywords: [note]
    text:
    - >
      The note reads: LIST  : gives you a list of items for sale. VALUE : tells you how much an item is
      worth to Abdul SELL  : sells an item to Abdul for a generous sum BUY   : Abdul's FAVORITE command lets
      you have an item for his low,
    - low price.

"tba:55:room:5530":
  name: The Mercenaries' Guild
  description: >
    This guild is frowned upon by most of the population of New Thalos, but the laws of supply and
    demand are irresistable.  People come here when they feel unable or are unwilling to fight their own
    battles.  For a small fee you may hire a henchman.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:54:room:5429
    east:
      to: tba:55:room:5532
      look: You notice some small scratches in the floor next to the eastern wall.
      door:
        keywords: [door, secret]
        kind: door
        reset: closed

"tba:55:room:5531":
  name: The Mercenaries Guild
  description: This is the storage room for the mercenaries to be hired.
  sector: inside
  flags: [indoors, private]

"tba:55:room:5532":
  name: Entrance To The Thieves' Guild
  description: >
    This small, dark room has a single torch mounted in the wall for light. There is a small wooden
    bench and a book lying on it.  The assassin guarding the entrance from 'outsiders' stands as you walk in.
  sector: inside
  flags: [dark, indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:55:room:5539
    west:
      to: tba:55:room:5530
      door:
        keywords: [door, secret]
        kind: door
        reset: closed

"tba:55:room:5533":
  name: The Whet Stone
  description:
  - >
    Very large men with very large swords drink beer from very large mugs. Everything in this room is
    BIG.  The large round tables are scuffed and nicked from the numerous bar brawls that have sprung up. 
    It might be a good idea to hold your tounge for a while as you soak up the atmosphere.
  - There is an exit to the east where the master swordsman awaits pupils to train with.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:55:room:5526
    east:
      to: tba:55:room:5534

"tba:55:room:5534":
  name: The Tournament And Practice Yard
  description: >
    This is a wide expanse of grass filled with dummies, punching bags and swordpupils.  To the north
    you see a man dressed in black robes, unlike his iron clad comrades, who you assume to be your master.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    east:
      to: tba:54:room:5473
      look: You see the grass near the base of the wall here is slightly torn.
      door:
        keywords: [secret, door]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5533

"tba:55:room:5535":
  name: The Bread Stand
  description: >
    A small stand has been set up here, showing the shopkeep's humble selection.  You notice he has
    added a few things to his list.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:54:room:5408

"tba:55:room:5536":
  name: Igor's Implements Of Destruction
  description: >
    You can't help but shiver as you look at the selection of vicious weapons.  Huge swords and wicked
    looking axes hang on pegs around the room.  A dwarf sits at a bench in the back hammering away on his
    latest creation.  It is here you can buy rare and exotic items not found in other parts of the
    world. A note catches your eye.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:54:room:5407
  extras:
  - keywords: [note]
    text:
    - "The note simply reads: READ THE NOTE IN THE ARMORY @"
    - Igor.

"tba:55:room:5537":
  name: Ye Old Leather Shoppe
  description: >
    You are standing on a thick oriental rug surrounded on all sides by racks of numerous leather
    goods.  A few women sit on leather cushions sewing in some detail work on custom ordered jackets.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5466

"tba:55:room:5538":
  name: Smuggler's Inn
  description: >
    You are inside a filthy inn, that seemingly has been cleaned in decades.  Poker tables line the
    walls and everyone stares at you as you walk in, you don't feel very welcome.  The bar has numerous
    knife holes in it and the bartender leans over waiting for your order.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:54:room:5467

"tba:55:room:5539":
  name: The Filthy Unicorn
  description: >
    A draft chills your bones as you enter, though you see no open window or door.  Hooded figures lurk
    around in the shadows and speak in low voices.  A flash of steel lets you know that weapons are in
    great abundance in this crowd.  As you quickly check your beltpouch you notice a small staircase
    leading down.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    north:
      to: tba:55:room:5532
    down:
      to: tba:55:room:5546

"tba:55:room:5540":
  name: The Warehouse
  description: >
    You are standing in a large room used to store merchandise made in the city before it is shipped
    off.  All the items here are made in New Thalos and shipped to other parts of the land.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5541
    south:
      to: tba:54:room:5433

"tba:55:room:5541":
  name: The Warehouse
  description: >
    Men walk to and fro counting crates and writing down their findings. This area of the warehouse is
    used for storing the raw materials brought in from areas outside the city.  These goods are then
    delivered to the various guilds.  The export area of the warehouses is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5434
    west:
      to: tba:55:room:5540

"tba:55:room:5542":
  name: The Shipwright
  description: >
    The wood under you feet creaks from years of being soaked in saltwater. An old man with a curly,
    gray beard stand behind a small counter waiting to take your order.  Behind him are mounted various
    model sailboats and large fish.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5543
    south:
      to: tba:54:room:5435

"tba:55:room:5543":
  name: The Drafting Room
  description: >
    The walls are covered with paper sketchings of hull designs.  This room is used by the shipwright
    to build his creations on paper before making a single cut in wood.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:55:room:5542

"tba:55:room:5544":
  name: The Forge
  description: >
    Very much like the weaponsmith this man deals in the molding of metal. It seems that most of his
    creations deal with horses.  On the walls you see several horseshoes made of iron.  The room is hot,
    hotter than the desert just south of here, and one wonders how the smithy can stand it.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5437

"tba:55:room:5545":
  name: The Royal Stables
  description: >
    Nothing you wouldn't expect is here.  Several stalls hold the Sultan's choice Arabian Stallions,
    and each has their own trough for drinking.  A small boy wanders in sometimes with a shovel to remove
    the offensive by-product of such beasts.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5549
    south:
      to: tba:54:room:5439

"tba:55:room:5546":
  name: The Secret Yard
  description:
  - >
    This is a hidden yard known to only a few people in New Thalos.  Here you may train in the arts of
    stealing, picking locks, and becoming almost invisible.
  - A small staircase leads back up to the Unicorn.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:54:room:5489
      look: You see some small scratches in the wall to the south.
      door:
        keywords: [secret, door]
        kind: door
        reset: closed
    up:
      to: tba:55:room:5539

"tba:55:room:5547":
  name: The Dump
  description: >
    This is the place where the people of the city dump their trash.  Due to the constant winds blowing
    down the moutains the smell is usually blown outside the walls and over the desert.
  sector: city
  exits:
    south:
      to: tba:54:room:5442

"tba:55:room:5548":
  name: The Mage's Laboratory
  description: >
    You stand in the top of an old stone tower.  Along the walls hundreds of potions, scroll, and wands
    lie in disaray.  The man you see before you sits hunched over a small wooden table with two beakers
    of bubbling liquid in front of him.  He looks up as you enter and smiles broadly.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    down:
      to: tba:55:room:5517

"tba:55:room:5549":
  name: The Hay Loft
  description: >
    Not as big as the ones you see on farms in the country, this hay loft serves as a storage area for
    the horses in the stables.  The young boy you saw with the shovel seems to have takes up residence on
    the second story.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:55:room:5545

"tba:55:room:5550":
  name: The Grand Entrance
  description: >
    Nowhere have you seen such an obscene display of wealth then in this corridor.  The shaggy
    carpeting under your feet makes it seem as if you are walking on a cloud.  Platinum candelabras hang
    delicately from the ceiling casting light on the ancient tapestries adorning the walls.  The crick in your
    neck tells you that it is time to stop staring.  To the west the numerous halls of the palace being and
    the gate lies to the east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5560
    east:
      to: tba:55:room:5558
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:54:obj:5400
        reset: locked
    south:
      to: tba:55:room:5557
    west:
      to: tba:56:room:5605

"tba:55:room:5551":
  name: The Library
  description: >
    This building holds the vast collection of books and documents that have been brought here by the
    commitee apointed to recover the lost knowledge of Thalos.  Rows of shelves filled with book in every
    condition line the walls.  The air has the aroma of old parchment and glue.
  sector: inside
  flags: [indoors, soundproof]
  exits:
    east:
      to: tba:54:room:5455

"tba:55:room:5552":
  name: The Dance Hall
  description: >
    You seem to have missed a huge party.  The janitors are here cleaning up the confetti and pieces of
    food.  Hundreds of empty beer mugs on the tables surrounding the dance floor suggest that the
    citizens love their drink.  There is still a banner on the wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5456
  extras:
  - keywords: [banner]
    text:
      preformatted: |2
           =====================================================================
                        H A P P Y   B I R T H D A Y   T O   U S
           =====================================================================

"tba:55:room:5553":
  name: The Jail
  description: >
    You are in jail.  For some reason, someone feels that you've screwed up pretty bad and should be
    put away safely for a while.
  sector: inside
  flags: [indoors, peaceful, soundproof, no_magic, private]
  exits:
    north:
      to: tba:54:room:5444
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:54:obj:5493
        reset: locked

"tba:55:room:5554":
  name: City Hall
  description: >
    You stand inside the administrative head of the city.  Here the decisions regarding city policy are
    made.  Although the Sultan's word is law, he usually spends his time on affairs outside the city
    wall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:54:room:5445

"tba:55:room:5555":
  name: The Boyer/Fletchers' Guild
  description: >
    The walls in this room are covered with pegs that hold various types of bows.  There are few people
    working here, lending to the fact that the skills are rare to come by in the general populas.  A few
    boys are busy in the corner preparing feathers for the fine shafts used in making arrows.  Some
    Elven craftsmen are carefuly inspecting each bow as it is finnished.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5460

"tba:55:room:5556":
  name: The Masons' Guild
  description: >
    There is no doubt that the Dwarves here know what they're doing.  They have been invaluable in the
    building of this beautiful city.  Here they are hard at work doing what they do best.  The hammers
    fly in a blur as these talented craftsmen work the stone into ornate bricks, pillars, trim, and many
    other forms.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:54:room:5460

"tba:55:room:5557":
  name: The Guard House
  description: >
    You stand inside the southern of the two main guard houses.  The stone interior has a spartan look
    to it, only the bare neccesities. A few weapons are mounted on the walls in case they might be needed.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5550

"tba:55:room:5558":
  name: The Palace Gate
  description: >
    You stand before a magnificently crafted gate wrought in solid gold. You gape in awe at the
    splendor of the spirilng towers beyond the portal. The ruler of all the eastern lands resides in this fine
    palace, and he is not a poor man.  The grand entrance lies byond the gate, and Sultan's Walk is to the
    east.
  sector: city
  exits:
    east:
      to: tba:54:room:5420
    west:
      to: tba:55:room:5550
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:54:obj:5400
        reset: locked

"tba:55:room:5559":
  name: The Northwest Tower
  description: >
    You stand on one of the four towers guarding the city.  The view from here is great!  To the west
    you see the tall mountains that make up the divide between here and Midgaard.  The River Ishtar slowly
    flows from that direction.  South you can see the entire city of New Thalos and the Great Eastern
    Desert to the south.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:54:room:5444

"tba:55:room:5560":
  name: The Guard House
  description:
  - >
    You stand inside the northern of the two main guard houses.  Strong guards are seated here, playing
    cards.  The stone interior is clean but bare walled save the weapons and armor mounted in the walls.
  - The only exit is south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5550

"tba:55:room:5561":
  name: The Kitchen
  description:
  - >
    Your footsteps echo off the stone tiles of the kitchen.  On the south wall you see the large fire
    place and a huge copper pot bubbling merrily. The chef is busy chopping up greens and other vegetables
    at the wooden table for tonight's meal.  Servants scurry about grabbing utensils and preparing fresh
    hares.
  - >
    A small door leads out into the hall northward and the doorway to the dining hall is west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5563
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5571

"tba:55:room:5562":
  name: The Northeast Tower
  description: >
    You stand on one of the four towers guarding the city.  To the north you see the wide plains and
    then the forset.  South of here you see the city and the Great Eastern Desert beyond.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:54:room:5454

"tba:55:room:5563":
  name: A Hall
  description: >
    You are at the eastern end of the southern hallway.  A small servants' entrance gives access to the
    kitchen and the hall continues west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5561
      door:
        keywords: [door, small]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5572

"tba:55:room:5564":
  name: The Tanners' Guild
  description: >
    You first notice the pungent smell of freshly tanned leather goods as you enter this strange
    place.  The next thing that grabs your attention is the many colors that these people have transformed the
    beautiful skins into.  The people are streaching the leather and cutting it into the shapes they
    need. You notice a small message on a wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:54:room:5462
  extras:
  - keywords: [message]
    text:
    - "The message appears to read:"
    - I hate being a Tanner

"tba:55:room:5565":
  name: A Hall
  description: >
    You have come to the eastern end of the northern hallway.  The only exit is west except for the
    simple wooden door to the north. There is a golden plaque above the door.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5566
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5574
  extras:
  - keywords: [plaque]
    text:
    - "Engraved on the plaque are the following words:"
    - The Holy Shrine of Allah

"tba:55:room:5566":
  name: The Shrine Of Allah
  description: >
    As you step into this room you seem to leave the material plane. The walls here are decorated with
    beautiful, multi-colored tiles. There is a strange stillness about the air.  You sense the presence
    of an all-mighty being.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5565
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:55:room:5567":
  name: Outside The Northern Gate Of New Thalos
  description: >
    You stand outside the gate of New Thalos.  The city lies to the south, and wilderness to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:56:room:5681
    south:
      to: tba:54:room:5422
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked

"tba:55:room:5568":
  name: Outside The Eastern Gate Of New Thalos
  description: >
    You stand outside the protective walls of the city.  The massive iron gate sits to the west and the
    unknown awaits you eastward.
  sector: city
  exits:
    east:
      to: tba:56:room:5690
    south:
      to: tba:55:room:5570
    west:
      to: tba:54:room:5431
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked

"tba:55:room:5569":
  name: Outside The West Gate Of New Thalos
  description: >
    You stand outside the city walls, the iron gate to the east.  The city lies in that direction and
    the road to Midgaard lies west.
  sector: city
  exits:
    east:
      to: tba:54:room:5423
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked
    west:
      to: tba:56:room:5618

"tba:55:room:5570":
  name: Outside The Wall
  description: >
    You are in a small clearing outside the east wall of the city.  The ground seems well trodden but
    you can see no apparent exit save that to the north.
  sector: field
  exits:
    north:
      to: tba:55:room:5568

"tba:55:room:5571":
  name: The Grand Dining Hall
  description:
  - >
    A long oaken table, coverd with silverware, plates, and a table cloth with gold trim, dominates the
    room.  Although no diners occupy the room as of yet, servants sprint about setting the table and
    placing condiments.
  - >
    The kitchen entrance is to the east, and two huge double doors open into the hallway north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5572
      door:
        keywords: [doors, double]
        kind: door
        reset: closed
    east:
      to: tba:55:room:5561

"tba:55:room:5572":
  name: A Hall
  description: >
    You stand at a T-crossing in the long hallways.  There are two large double doors to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5573
    east:
      to: tba:55:room:5563
    south:
      to: tba:55:room:5571
      door:
        keywords: [doors, double]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5577

"tba:55:room:5573":
  name: A Hall
  description: >
    You stand at an intersection of the hallways.  Wooden corridors lead off in all directions except
    west, the garden of the palace can be entered there.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5574
    east:
      to: tba:56:room:5605
    south:
      to: tba:55:room:5572
    west:
      to: tba:55:room:5578

"tba:55:room:5574":
  name: A Hall
  description: >
    You have come to a T-crossing on the hallways.  The wooden corridors continue east, west and
    south.  There is a large iron door to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5575
      door:
        keywords: [door, iron, heavy]
        kind: door
        reset: closed
    east:
      to: tba:55:room:5565
    south:
      to: tba:55:room:5573
    west:
      to: tba:55:room:5579

"tba:55:room:5575":
  name: The Entrance To The Dungeon
  description:
  - >
    You enter a cold damp room with bare roughly hewn stone walls. This room seems very out of place
    compared to the splendor of the rest of the Palace.
  - >
    A large steel grating leads down into darkness, and an iron door returns you to the hallway.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5574
      door:
        keywords: [door, iron]
        kind: door
        reset: closed
    down:
      to: tba:55:room:5591
      door:
        keywords: [grating, steel]
        kind: door
        reset: closed

"tba:55:room:5576":
  name: A Guest Room
  description: >
    This is a simple room used for visiting nobles.  A small dresser stands on the east wall with a
    mirror hung right above it.  A queen sized bed made up in satin sheets stands in the middle of the room
    against the south wall under a window.  The only obvious exit is north back out into the hallway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5577
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [mirror]
    text: You see a the fighting image of some armor clad humanoid wielding a weapon.
  - keywords: [window]
    text: >
      Looking out this window you can see the grounds of the palace that separate the walls of the palace
      from the building itself.

"tba:55:room:5577":
  name: A Hall
  description: >
    The long hall continues here with a wooden door in the south wall.  On the north wall hangs the
    picture of some forgotten nobleman who once ruled the land.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5572
    south:
      to: tba:55:room:5576
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5582

"tba:55:room:5578":
  name: The Sultan's Garden
  description:
  - >
    You have entered the Sultan's private gardens.  A light sweat breaks out on your skin from the
    humidity here.  All around you are thousands of exotic plants and flowers.  The sweet smell of jasmine
    and honeysuckle reminds you of happier days at home.  Off to the north, through the palm trees, you see
    a delicate white gazebo.
  - >
    A path leads out into the hallway and west towards the gazebo. To your right stands a gold sign.
  sector: field
  exits:
    east:
      to: tba:55:room:5573
    west:
      to: tba:55:room:5583
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           ======================================================================
           ======================================================================
           ||                                                                  ||
           ||       Welcome to my humble garden.  I have created this          ||
           ||       tiny bit of paradise for the pleasure of my people.        ||
           ||       Take only memories... Leave only footprints...             ||
           ||                                                                  ||
           ||                                 The Sultan                       ||
           ||                                                                  ||
           ======================================================================
           ======================================================================

"tba:55:room:5579":
  name: A Hall
  description: >
    The long stretch of hallway continues east and west from here.  The small red carpet covering the
    centerline is always underfoot and an occasional bench or potted plant lines the wall. There is a door
    here to the north with a plaque mounted over it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5580
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:55:room:5574
    west:
      to: tba:55:room:5584
  extras:
  - keywords: [plaque, door]
    text:
    - "The plaque on the door reads:"
    - THE ART EXHIBIT
    - of
    - NEW THALOS
    - "- the management is not responsible for lost items."

"tba:55:room:5580":
  name: The Art Exhibit
  description:
  - >
    You are standing in the Sultan's tribute to the finer virtues. Large paintings hang from the walls
    displaying nature scenes, nudes, and glorious victories in battle.  Strange scupltures rest on
    pedestals at each corner of the room and mirrors are placed in strategic locations so the viewer may see an
    entire sculpture at a glance.
  - Your eyes, however, are pulled towards a painting that dominates the far wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5579
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [painting]
    text: >
      The large painting on the west wall appears to be of the temple of New Thalos, and occupies the
      entire western wall of this room.

"tba:55:room:5581":
  name: A Guest Room
  description: >
    This is another room made up for visiting nobles.  There is a dresser up against the eastern wall
    with a mirror above it and a queen sized bed, made up in satin sheets, against the south wall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5582
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:55:room:5582":
  name: A Hall
  description: >
    You have reached the western end of the southern hallway.  The only exit is east except for the
    doors in the southern and western walls.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5577
    south:
      to: tba:55:room:5581
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:55:room:5587
      door:
        keywords: [door]
        kind: pickproof
        key: tba:54:obj:5401
        reset: locked

"tba:55:room:5583":
  name: The Garden Gazebo
  description: >
    Walking through the gardens you come across a small white wooden structure.  The sounds of birds,
    the smell of flowers, ahhh, paradise. You believe that you have never been in a more peaceful setting.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:55:room:5578

"tba:55:room:5584":
  name: A Hall
  description: >
    This is the western end of the northern hallway.  Two doors are set in the walls here, one to the
    north, another to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5585
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:55:room:5579
    west:
      to: tba:55:room:5589
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:55:room:5585":
  name: The Guard Room
  description:
  - >
    You stand in a barren chamber lined with nothing but cots and footlockers.  The guards come here
    when off duty to sleep, for they may only leave the Palace grounds with special permission.
  - The only exit is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5584
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:55:room:5586":
  name: The Guard Room
  description: >
    This is living quarters for the guards of the palace.  Barren compared to the rest of the Palace,
    you see only cots and footlockers here.  On the walls you see pictures of well known knights who have
    give a proud name to the Sultan's Guard.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5587

"tba:55:room:5587":
  name: The Harem
  description: >
    This is the room where the Sultan keeps the beautiful women of his Palace.  There are ten girls
    here lying about the room dressed in silks you can almost see through.  In the western end of the room
    stands a large mound of pillows and a beautiful young maiden sits perched atop. It is unfortunate for
    you that only the Sultan is allowed in here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5588
      door:
        keywords: [door, secret]
        kind: door
        reset: closed
    east:
      to: tba:55:room:5582
      door:
        keywords: [door]
        kind: pickproof
        key: tba:54:obj:5401
        reset: locked
    south:
      to: tba:55:room:5586

"tba:55:room:5588":
  name: A Small room
  description: >
    This is secret chamber allowing the Sultan direct access to his harem at any time he chooses.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5589
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:55:room:5587
      door:
        keywords: [door, secret]
        kind: door
        reset: closed

"tba:55:room:5589":
  name: The Throne Room
  description: >
    You stand in the throne room of the mighty Sultan of New Thalos.  Guards stand at attention near
    his side ready to make the ultimate sacrifice for their beloved leader.  The gold inlaid throne studded
    with jewels stands upon a mable dias.  The Sultan is not a man to be trifled with.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:55:room:5590
      door:
        keywords: [throne]
        kind: pickproof
        key: tba:54:obj:5400
        reset: locked
    east:
      to: tba:55:room:5584
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:55:room:5588
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:55:room:5590":
  name: The Treasure Room
  description: >
    You have somhow managed to gain access to the treaure vault of the Sultan.  The alarm sounding in
    the background tells you that you must have tripped off some kind of alarm system.  It might be
    adviseable to grab as much stuff as you possibly can and run for the door.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:55:room:5589
      door:
        keywords: [door]
        kind: pickproof
        key: tba:54:obj:5400
        reset: locked

"tba:55:room:5591":
  name: The Jailer's Room
  description: >
    Climbing down the old wooden ladder you enter a small cave like room.  There is a small bench with
    some old magazines and a low burning candle sitting off to one side.  A door is set into the stone on
    the north wall, and the steel grating opens up above.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:55:room:5592
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:55:room:5575
      door:
        keywords: [steel]
        kind: door
        reset: closed

"tba:55:room:5592":
  name: A Tunnel In The Dungeon
  description: >
    You stand in a roughly hewn stone tunnel with cells to the north and south.  The tunnel continues
    east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:55:room:5597
      door:
        keywords: [cell]
        kind: pickproof
        key: tba:54:obj:5493
