  long: "{bright_cyan}A pale queen{/bright_cyan}{cyan} gazes forlornly towards the east.{/cyan}"
  description: >
    Her smooth, delicate features were probably naturally pale, but now her skin is tinged with an
    eerie blue hue.  Her sorrowful eyes linger on the eastern side of the room as if she were longing for
