  description: >
    Tiny strands of frozen webbing decorate the black shimmering surface of this regal stair. Carved by
    some meticulous craftsman, its surface is perfectly smooth and its stone of the highest quality. Its
    dark presence stands out strikingly to the rest of the sparkling room, a solitary shadow amongst
    light and snow.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1135
    west:
      to: tba:11:room:1139
    down:
      to: tba:11:room:1114

"tba:11:room:1135":
  name: A Snow-covered Windlass
  description: >
    A large barrel-shaped contraption lies on its side, wound around with thick metal chain that
    extends to the drawbridge far below. A massive crank protrudes from the side, webbed with frost and ancient
    cobwebs, evidence of its neglect for many years.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1138
    east:
      to: tba:11:room:1136
    south:
      to: tba:11:room:1137
    west:
      to: tba:11:room:1134

"tba:11:room:1136":
  name: Sphalerite Stair
  description: >
    Sleek and dark as frozen oil, a tall stair swoops gracefully to the icy floor below, its black
    reflective surface contrasting with the purity of the ice and snow that coat the rest of the
    surroundings. A tiny tinkling sound echoes throughout the place, as small ice shards crack and shatter with the
    booms of outside thunder.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1151
    west:
      to: tba:11:room:1135
    down:
      to: tba:11:room:1116

"tba:11:room:1137":
  name: Freezing Balcony
  description: >
    Glassy and dangerous, the peril of remaining long on this high balcony is increased further by the
    angry winds that whip and howl against it, physical forces lashing at the castle as if an army of
    ghosts were battering to get in. The years of constant abuse are evidenced on the weary stone walls,
    which although sturdy, are cracked and broken in several places.  Far in the distance, a jagged mountain
    blazes with fire and smoke, a red glow facing the castle as if it were being watched.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1135
  triggers: [tba:11:trg:1100]

"tba:11:room:1138":
  name: A Chilly Oratory
  description: >
    Breathlessly cold, this room is gleaming with white marble tiles and sharp icicles.  A large altar
    stands in the center of the room, shrouded with a deep layer of snow, although shadows of books can
    be seen concealed beneath.  A low rhythmic sound of murmuring fills the room, as if ghosts still
    chanted their prayers here.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:11:room:1135

"tba:11:room:1139":
  name: Icicle-adorned Hall
  description: >
    Filled with light and a misty chill, this long hall extends to the north, a collection of doors
    visible along the western side. Large cones of ice hang suspended from the ceiling like glittering
    fangs, a cold feel of menace emanating from the very structure of the castle, as if it were laying
    deliberately and deceptively motionless.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1140
    east:
      to: tba:11:room:1134
    west:
      to: tba:11:room:1130
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1140":
  name: Icicle-adorned Hall
  description: >
    Long and forlorn, the size of this hall only emphasizes its emptiness. Clear jagged spikes of ice
    dangle from above, shimmering with light and vibration.  Sparkles of frost drift wearily in the air,
    settling on every surface like ancient dust.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1141
    south:
      to: tba:11:room:1139

"tba:11:room:1141":
  name: Icicle-adorned Hall
  description: >
    A thousand glassy spears protrude from the ceiling, poised as though about to strike.  The air is
    still, and yet the icicles seem to shiver tensely, their glistening surfaces cracking here and there. 
    Splinters break and fall, a perpetual rain of glass tinkling against the frozen floor.  Wooden doors
    stand against the north and west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1142
      look: A simple wooden door fits nicely into its stonework frame, offering privacy.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:11:room:1140
    west:
      to: tba:11:room:1153
      door:
        keywords: [door]
        kind: door

"tba:11:room:1142":
  name: The Lady's Sitting Room
  description: >
    Smooth and soft with layers of delicate puffy snow, this room looks as though it has been vacant
    for many years, an unnatural stillness suffocating the air, and the unblemished surfaces of snowflakes
    and dust betraying a long abandonment.  A few indiscernible pieces of furniture lie formless and
    frozen beneath the ice, and what once must have been magnificent tapestries hang stiff and glazed against
    the walls, watching forlornly over the place.  A wooden door stands to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1143
    south:
      to: tba:11:room:1141
      look: A simple wooden door fits nicely into its stonework frame, offering privacy.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1143":
  name: The Lady's Garderobe
  description: >
    Long, snow-covered shelves run along the walls of this room, stacked with piles of neatly folded
    clothing.  A few wooden mannequins stand half-dressed here and there, frozen in place and ghost-like in
    the eerie abandoned cold. Sequins and embroidered jewels glitter through the snow and ice as though
    the last flickering embers of a slow dying fire.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1144
    south:
      to: tba:11:room:1142
    west:
      to: tba:11:room:1133
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1144":
  name: The Lady's Bower
  description: >
    This entire spacious room is decorated with cool hues of cream and silver as if moonlit.  A slight
    frosting of ice adds to this illusion, making every regal surface glisten and twinkle as if
    bejewelled with stars.  Beautiful but sorrowful, the atmosphere is cold and haunted, filled with the
    murmurings of restless whispers.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1145
      look: A subtle crack along the wall reveals the outline of a hidden door.
      door:
        keywords: [hiddendoor, hid, hidden, door]
        kind: door
        key: tba:11:obj:1126
        reset: locked
    west:
      to: tba:11:room:1143
  triggers: [tba:11:trg:1118]

"tba:11:room:1145":
  name: A Glittering Secret Chamber
  description: >
    Frosty air circulates the room slowly, delicate snowflakes drifting aimlessly in through small
    slitted windows.  White candles line the ice-veined walls and frozen petals lie brittle on the floor,
    remnants of the romantic atmosphere that must have once existed here.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1146
      look: A subtle crack along the wall reveals the outline of a secret door.
      door:
        keywords: [secretdoor, door, secret, sec]
        kind: door
        key: tba:11:obj:1127
        reset: closed
    south:
      to: tba:11:room:1152
    west:
      to: tba:11:room:1144
      look: A subtle crack along the wall reveals the outline of a hidden door.
      door:
        keywords: [hiddendoor, hid, hidden, door]
        kind: door
        key: tba:11:obj:1126
        reset: closed
  triggers: [tba:11:trg:1118]

"tba:11:room:1146":
  name: The Lord's Solar
  description: >
    Large and forlorn, this room has been draped in earthy tones of green and russet brown.  The bright
    sheen of intruding snow seems an unnatural and unwelcome lightening of the place.  The solemn mood
    here almost calls for darkness, and the walls themselves seem to grumble with displeasure.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1147
    west:
      to: tba:11:room:1145
      look: A subtle crack along the wall reveals the outline of a secret door.
      door:
        keywords: [secretdoor, door, secret, sec]
        kind: pickproof
        key: tba:11:obj:1127
        reset: closed
  triggers: [tba:11:trg:1118]

"tba:11:room:1147":
  name: The Lord's Garderobe
  description: >
    Snow-capped spikes protrude from the walls, each hung with regal garments and robes.  Dark shadows
    cast eerily about from several wooden clothes dummies, each frozen in place as if dutifully guarding
    the room.  Lower shelves contain leather shoes and accessories, all protectively encased in thick ice.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1132
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:11:room:1148
    west:
      to: tba:11:room:1146

"tba:11:room:1148":
  name: The Lord's Study
  description: >
    Although whitewashed with snow, this room smells earthy and fresh, as if it were part of a forest,
    wet with dew.  Long-ingrained aromas of spice and smoked herb linger subtly in the air, mixed with
    animal musks.  Hunter's trophies line the walls, antlers reaching like icicle-covered trees from the
    periphery.  A wooden door stands to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1147
    south:
      to: tba:11:room:1149
      look: A simple wooden door fits nicely into its stonework frame, offering privacy.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1149":
  name: Hall of Stalactites
  description: >
    The ceiling here has sunk significantly, bowed low under the pressure of building snow.  As a
    result, the dangling icicles reach almost to the floor, making passage difficult, and causing it to seem
    as if the hall were literally gripped in winter's jaws.  Wooden doors stand to the north and east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1148
      look: A simple wooden door fits nicely into its stonework frame, offering privacy.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:11:room:1155
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:11:room:1150

"tba:11:room:1150":
  name: Hall of Stalactites
  description: >
    Coated with a moist sheen of frozen water, the entire hall shimmers slightly, glowing as if with an
    internal light. The surface of the walls and ceiling are smooth and blemish-free, the only thing of
    note being the spears of ice that dangle precariously from above, threatening to fall and shatter at
    any moment.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1149
    south:
      to: tba:11:room:1151

"tba:11:room:1151":
  name: Hall of Stalactites
  description: >
    High above the floor, a long ceiling stretches northward, curving gently where it meets the walls
    so that the entire corridor resembles an archway. The smooth design is strangely contrasted by the
    collection of sharp spikes that hang menacingly, quivering every now and again as if about to drop.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1150
    east:
      to: tba:11:room:1131
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:11:room:1136

"tba:11:room:1152":
  name: An Arctic Aumbry
  description: >
    Ancient prayers murmur softly in the echoing groans of this room, wooden beams creaking with age
    and the weight of falling snow.  Icicles hang tremulously from various cracks in the ceiling, drops of
    water dangling like tears from their frozen tips, suspended in time.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1145
    up:
      to: tba:11:room:1190

"tba:11:room:1153":
  name: Crystalline Chamber of the Princess
  description: >
    Smooth cascades of frozen water flow over every surface in this room, caught motionless and
    sparkling for indefinite time. Cool blue shadows shift in the darker recesses, reflective surfaces of ice
    throwing any speck of light into a thousand different dancing shards.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1141
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:11:room:1154

"tba:11:room:1154":
  name: Wintry Privy
  description: >
    A perpetual winter lingers here, soft white snowflakes twirling lazily in the air, mingling with
    sparkles of stirring dust.  Against the western side of the wall, low shelving holds a covered privy. 
    Fortunately, the murky water splashed around it has long since frozen.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1153
    south:
      to: tba:11:room:1130
      look: >
        A subtle tapestry guards the way, delicately hung and fitted so that upon closing the passage
        beyond cannot be seen.
      door:
        keywords: [tapestry]
        kind: door
        reset: closed

"tba:11:room:1155":
  name: A Glassy Guestroom
  description: >
    Elegant and airy, this large room has been decorated with crystal and silver birch.  The pale wood
    has been used to frame the room and fashion its furnishings, made even brighter by a soft carpetting
    of snow.  Slender candle-holders reach from the walls, offering warmth that no longer exists.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:11:room:1156
    west:
      to: tba:11:room:1149
      door:
        keywords: [door]
        kind: door

"tba:11:room:1156":
  name: A Bitterly Cold Privy
  description: >
    Of modest size, this room may have once felt cozy, its multiple candles and warm hues of wood
    overcome with thick blankets of snow.  Despite its clean apperance, an unpleasant smell wafts about the
    place.  This seems to emanate more strongly from a square block sitting against the eastern wall, a
    thick frozen board covering the hole on top of it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1155
    south:
      to: tba:11:room:1131
      look: >
        A subtle tapestry guards the way, delicately hung and fitted so that upon closing the passage
        beyond cannot be seen.
      door:
        keywords: [tapestry]
        kind: door
        reset: closed

"tba:11:room:1157":
  name: Lower Part of the Northeast Stair
  description: >
    Dank and dreary, the stones here creak as if weighed down with an unbearable burden.  Slivers of
    ice glisten here and there amongst the cobwebs like tears and a frozen spider hangs forlornly in the
    gloom, casting an eerie shadow against the wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1158
    up:
      to: tba:11:room:1122

"tba:11:room:1158":
  name: A Frozen Kitchen
  description: >
    Incandescent ice coats everything in this kitchen with a glossy shine, each crystalline surface
    twinkling blue and silver.  From the ceiling, large metal hooks hang ominously, probably once hung with
    spices and meats, now only cruel and glinting in the cold silence.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1159
    south:
      to: tba:11:room:1161
    west:
      to: tba:11:room:1157

"tba:11:room:1159":
  name: A Silver Scullery
  description: >
    All of the kitchen utensils and cutlery appear to be stored here, silver spoons and plates
    bejewelled with ice.  Pots and pans lie piled in rows on the wide wooden shelving, polished and gleaming.  A
    few unwashed pieces lie abandoned in the corner, frozen pieces of food stuck forever in place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1160
    west:
      to: tba:11:room:1158

"tba:11:room:1160":
  name: A Chilled Pantry
  description: >
    Lined with shelves and cobwebs, this large pantry is filled with all kinds of foodstuffs.  Apples,
    pears, and plums lie sugar-dusted with snow, breads and cheeses silver-shrouded and sparkling. 
    Onions and garlic hang frozen from the ceiling, and on the floor are piled turnips and potatoes.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1159

"tba:11:room:1161":
  name: A Frozen Kitchen
  description: >
    Eerie and silent, this large room is coated all around with ice, as if a flood cascaded through
    here at some point before freezing.  Every surface is gleaming and slippery, a large chopping counter
    extending from here into the east, its partially-chopped contents long since buried in snow.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1158
    east:
      to: tba:11:room:1162
    south:
      to: tba:11:room:1164
    west:
      to: tba:11:room:1187

"tba:11:room:1162":
  name: A Frozen Kitchen
  description: >
    Brutally cold, the air here is filled with a moist fog, swirling about the place as if stirred by
    ghosts.  A cold light fills the place, every icy surface giving off a lustrous hue, as if lit by some
    strange magic.  A long chopping counter extends from this room into the west, shrouded with snow and
    dust.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1163
    west:
      to: tba:11:room:1161

"tba:11:room:1163":
  name: A Blustery Buttery
  description: >
    A strange wind whips about this storage room, clinking and clanging against the bottles and barrels
    that lie here, as if a ghost was rattling its chains. Powdered butts of beer stand against the
    walls, shrouded in deep layers of snow, and scattered shards of glass lie sprinkled across the floor,
    along with frozen droplets of wine.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1162

"tba:11:room:1164":
  name: Collapsing Corridor
  description: >
    The ceiling of this corridor bows along the middle, stooped under the pressure of thick ice and
    snow.  The stone walls are silver-gray and coated with a fine sheen of dust, threads of spider webbing
    drifting like living tendrils from the walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1161
    south:
      to: tba:11:room:1165

"tba:11:room:1165":
  name: The Servants' Lounge
  description: >
    This room appears to have been quite cozy at one point, dark hues of wood and animal furs
    generously adorning the place.  The wood however, has become silver-veined with frost, overhead rafters hung
    with glittering stalactites. The furs that would have once been soft and warm, are frozen brittle,
    each fine hair a needle of ice.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1164
    east:
      to: tba:11:room:1166
    south:
      to: tba:11:room:1168

"tba:11:room:1166":
  name: Bards' Retreat
  description: >
    The resting place of the bards and poets, this room is filled with musical instruments and basic
    props.  A fine smattering of hay carpets the area, though the arctic temperature has frozen it, making
    it seem as if the floor was overlaid with sparkling gold.  Old scrolls and storybooks lie piled
    against the walls, their contents forever sealed in ice.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:11:room:1167
    west:
      to: tba:11:room:1165

"tba:11:room:1167":
  name: Seamstresses' Corner
  description: >
    Pieces of clothing and fabric are hung from clotheswires, making this little corner seem sheltered
    and private.  Here must have been where the women gathered to sew and gossip, small stools standing
    powdered with snow as if cushioned. Various knitting and sewing needles lie strewn about, glistening
    brightly amongst splinters of ice.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1166
    east:
      to: tba:11:room:1169
    west:
      to: tba:11:room:1168

"tba:11:room:1168":
  name: A Snowed-in Roasting Pit
  description: >
    Although bitterly cold now, this room shows all the signs of having once been filled with blasting
    heat.  Smoke and soot have been preserved in the ice-coated walls, making every surface black and
    glossy as ink.  A large firepit lies abandoned to snow and ash, an unidentifiable carcass still
    suspended on a spit above it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1165
    east:
      to: tba:11:room:1167
    west:
      to: tba:11:room:1180

"tba:11:room:1169":
  name: A Cracked Corridor
  description: >
    Ancient stone creaks and groans under the weight of the castle, the strain of it visibly cracking
    several of the bricks.  Bright blossoms of ice spring from the fissures, further compromising the
    strength of these corridors, a low painful moan echoing down its length.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1170
    west:
      to: tba:11:room:1167

"tba:11:room:1170":
  name: A Crumbling Corridor
  description: >
    Pieces of stonework are slowly crumbling from the ceiling and walls, piles of powdered brick
    mingling with the layers of snow and dust here.  Veins of ice run shimmering down the length of the
    corridor, filling the place with fragile incandescent light.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1171
    east:
      to: tba:11:room:1178
    west:
      to: tba:11:room:1169

"tba:11:room:1171":
  name: A Whispering Corridor
  description: >
    Hushed and dreary, this corridor flickers subtly as if lit with blue fire, sparkles of color
    reflecting in the solid ice that coats its walls. Whispering echoes travel down the length of this tunnel,
    stirring the few tufts of plant life that grow amongst the cracked stone, cobwebs fluttering
    forlornly.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1173
    east:
      to: tba:11:room:1177
    south:
      to: tba:11:room:1170
    west:
      to: tba:11:room:1172

"tba:11:room:1172":
  name: Steward's Room
  description: >
    Glistening wetly with frost and dewy moisture, the whole room glistens brightly.  This place is
    richly and regally decorated, only the finest woods and tapestries adorning the walls.  A dark crimson
    rug lays upon the stone floor, frozen into place with black glossy ice.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1171

"tba:11:room:1173":
  name: Corridor of Shadows
  description: >
    The dark walls bow low as if hunched, meeting together in the wide arching structure of this
    corridor.  Large tufts of moss and bracken spring out here and there from the fissures in the wall, their
    black shadows reaching like skeletal hands across the white carpetted snow.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1176
    south:
      to: tba:11:room:1171
    west:
      to: tba:11:room:1174

"tba:11:room:1174":
  name: Priest's Chamber
  description: >
    This pale, spacious room is filled with a holy glow, sparkling facets of ice casting rays of
    brightness about the place as if lit by celestial lights. Silver threads of cobweb and dust dance lazily in
    the breeze, catching the light and glimmering like strands of angel's hair.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1173
    west:
      to: tba:11:room:1175

"tba:11:room:1175":
  name: Treasury
  description: >
    Thick white snow shrouds this entire room, as if to conceal the treasures beneath.  Piles of gold
    and gems glint subtly beneath their icy veil, glowing warmly like dying embers.  Rich hues of ruby and
    emerald dance in the light, rays of prismic color washing over the walls.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1174

"tba:11:room:1176":
  name: Keeper of the Dungeon
  description: >
    This granite room glowers with a strange menace, as if an evil presence watched over it from the
    shadows.  Dark wood, and cruel glinting metal make up the furnishings, even darker shadows flickering
    from some unnatural light source.  The air is chill, but colder than one would expect from mere ice
    and snow.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1181
    west:
      to: tba:11:room:1173

"tba:11:room:1177":
  name: Healer's Abode
  description: >
    The air here is crisp and fresh, cool breezes subtly refreshing as they sigh through the room.  An
    azure glow fills the room with soothing light, frozen crystalline patterns decorating the walls and
    floor, traced with delicate, invisible fingers.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1171

"tba:11:room:1178":
  name: Servants' Sleeping Quarters
  description: >
    Piles of blankets and linen lie discarded here, fresh layers of white puffy snow making the place
    appear cozier than the chill air allows.  Feathery snowflakes drift lazily from the ceiling, an
    occasional glimmering shard of ice tinkling as it shatters on the floor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1179
    west:
      to: tba:11:room:1170

"tba:11:room:1179":
  name: Lower Part of the Southeast Stair
  description: >
    A chasm yawns blackly overhead, the stair winding around so that its destination cannot be seen. 
    An unnatural darkness seems to grip this little corner, as if it were bathed in the shadow of some
    unseen entity.  A faint breeze rustles uneasily around the walls, hushing and whispering through the
    crevasses.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1178
    up:
      to: tba:11:room:1120

"tba:11:room:1180":
  name: Lower Part of the Southwest Stair
  description: >
    Curving stone walls hide any view of the upper stair, only strange shadows can be seen casting
    their darkness upon the stone floor.  The creaking of the castle's foundation echoes loudly in this
    space, the stones gray and bent as old men, complaining at the weight and bitter cold.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1168
    up:
      to: tba:11:room:1119

"tba:11:room:1181":
  name: Misty Dungeon
  description: >
    The forlorn gray of this corridor is made even more despondent by the cool droplets of mist that
    float aimlessly here.  The ground is shiny with translucent puddles of ice, and specks of dust sparkle
    amongst the darkness like tiny stars in an ocean of cold, black hopelessness.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1183
    south:
      to: tba:11:room:1176
    west:
      to: tba:11:room:1182

"tba:11:room:1182":
  name: Blood-spattered Cell
  description: >
    Bright splatters of blood blossom from the walls and floor, preserved in sparkling ice as though
    the room was decorated with ruby gems.  Darker crimson and black stains underlay the red, evidence of
    many forgotten victims passing through here, lost to torture and grief.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1181
    down:
      to: tba:11:room:1186

"tba:11:room:1183":
  name: Dungeon of Tears
  description: >
    Sorrow weighs heavy in the air, low despairing moans rumbling through the stone, and a biting chill
    permeates the place.  Frozen icicles hang jagged from the ceiling, twinkling droplets dangling from
    their tips like everlasting tears. Subtle shudders rack the walls and floor every now and again, as
    if the place itself were weeping.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1185
    south:
      to: tba:11:room:1181
    west:
      to: tba:11:room:1184

"tba:11:room:1184":
  name: A Haunted Prison Cell
  description: >
    Soft whispering voices waft through the air here, stirring shadows and glimmers of light that
    writhe upon the icy walls as if trying to escape. Gentle breezes shift unnaturally in the near silence, as
    if ancient ghosts were still breathing in the darkness, or pacing away the time.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1183

"tba:11:room:1185":
  name: Lower Part of the Northeast Stair
  description: >
    The deepest part of a long winding stair, the atmosphere here is especially heavy, and the air
    numbingly cold.  Low creaks and groans echo overhead, as if someone were perpetually walking up and
    down.  Delicate tendrils of webbing flutter from the walls, grasping at anything that passes.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1183
    up:
      to: tba:11:room:1121

"tba:11:room:1186":
  name: The Oubliette
  description: >
    Cramped and dark, this room is a place where one could pass out of all memory.  It appears to be
    nothing more than a chasm in the earth, a yawning grave for the living.  Only damp, frozen soil closes
    in around, and above narrow iron grating offers the only glimpse of light.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:11:room:1182

"tba:11:room:1187":
  name: Underground Passage
  description: >
    Damp and dank with mildew, a thick mouldy smell clings to every surface of this miserable tunnel. 
    Sprouts of blue and green fungus blossom from the ice, continuing to thrive despite the biting
    chill.  The ground is dark with dirt and dust that has muddied, frozen into black slush.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1161
    south:
      to: tba:11:room:1189
    west:
      to: tba:11:room:1188

"tba:11:room:1188":
  name: The Well-House
  description: >
    This flimsy wooden shed creaks as the winds buffet it, swaying slightly from side to side in the
    perpetual storm.  A deep well is buried in the ground, surrounded with a low stone wall.  Within, the
    water has turned mostly to ice, but a shadowy stirring motion can still be seen beneath, as if
    something were moving in those dark waters.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1187
  triggers: [tba:11:trg:1100]

"tba:11:room:1189":
  name: Dove-Cote
  description: >
    A wirey cage stands hung with trembling cobwebs and icicles.  Inside, clusters of birds sit huddled
    together as if for warmth, although they have already been frozen solid.  Their glazed eyes are
    sorrowful and knowing, as if they have never accepted their fate.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1187
  triggers: [tba:11:trg:1100]

"tba:11:room:1190":
  name: High in a Castle Tower
  description: >
    This circular stone tower creaks and groans wearily, seeming almost to sway as the winds buffet it
    violently from outside.  A small oval window offers a bleak view over the wintry terrain, and
    overhead, tendrils of cobweb hang from a long-abandoned hatch.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:11:room:1191
      look: >
        This wooden hatch has been left to fall into disrepair, mould and ice rendering the wood almost
        rotten.
      door:
        keywords: [hatch]
        kind: pickproof
    down:
      to: tba:11:room:1152

"tba:11:room:1191":
  name: On Top of the Castle
  description: >
    This tower feels cold and dreary, unprotected from the elements that howl around the castle. 
    Continuous storms rage and clash overhead, casting the stone here in alternating hues of black and
    silver.  The wind wails loudly, making its presence unescapable as it whips frantically around.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:11:room:1190
      look: >
        This wooden hatch has been left to fall into disrepair, mould and ice rendering the wood almost
        rotten.
      door:
        keywords: [hatch]
        kind: pickproof
  triggers: [tba:11:trg:1100]

"tba:11:room:1199":
  name: Room for Trigs
  description: >
    This room is just to hold a mob that can put things into containers for certain quests.  Please
    don't edit or delete it as it will stop some of the triggers working or cause errors.
  sector: inside
  flags: [indoors]
