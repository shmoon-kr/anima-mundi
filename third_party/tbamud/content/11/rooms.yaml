# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 11.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:11:room:1100":
  name: Detta's [Frozen Castle] Description Room
  description:
  - >
    {bright_blue}Theme:{/bright_blue} The cliche fantasy castle with a curse. Am hoping to build a big
    stone fortress that is all frozen in ice, complete with its occupants. There will probably be a
    couple big specially-triggered mobs to defeat and some wandering salespeople around the permiter selling
    the spoils from the castle. There will be a couple secrets within the zone, and a tragic tale to
    uncover if the player is so inclined ;).
  - >
    {bright_green}Players:{/bright_green} Meant to be for players about level 15 to 20, with some of
    the perimeter mobs being lower level, and ones deeper and higher within the castle of higher level.
    Primarily an evil zone.
  - >
    {bright_red}Location:{/bright_red} The castle is set in the middle of a forest with a river running
    through it. Note that Indoor flags are deliberately set on outdoor rooms as the zone has its own
    trigger-run weather messages.
  - >
    {bright_magenta}Secrets:{/bright_magenta} None yet, but there will be ;). Will keep posted.
  - >
    {bright_cyan}Note:{/bright_cyan} If you have any suggestions, spot any typos, bugs, or weirdnesses,
    please mudmail me - Detta. :-) All input appreciated! You can also email me at
    detta@@builderacademy.net East takes you through the other zones I have built here. Down takes you to the starting room of
    this zone.
  sector: inside
  flags: [indoors, private]
  exits:
    east:
      to: tba:19:room:1900
    west:
      to: tba:118:room:11800
    down:
      to: tba:11:room:1101

"tba:11:room:1101":
  name: A Luminous Path
  description: >
    Startlingly white compared to the rest of the dark surroundings, this shining path flows like a
    glowing stream to a massive building of stone on the northern horizon.  Southward it winds deeper into
    the silent grasp of the trees, its path illuminating the forest gently like a ray of moonlight.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1102
  triggers: [tba:11:trg:1100]

"tba:11:room:1102":
  name: The White Drawbridge
  description: >
    This ancient drawbridge lies in the lowered position, covered with layers of fluffy white snow that
    swirl restlessly about.  A cool wind bites at the air, whipping against the stone blocks of the
    surrounding castle like an angry ghost, beating with futility upon the unyielding fortress walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1103
    south:
      to: tba:11:room:1101
  triggers: [tba:11:trg:1100]

"tba:11:room:1103":
  name: A Frozen Portcullis
  description: >
    A jagged toothy gate hangs suspended from the southern part of the ceiling, frozen in place and
    coated with layers of smooth glassy ice.  Spikes hang menacingly down, formed from the stalactites of
    slowly dripping water, every now and again trembling slightly with the rumbling of thunder outside.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1116
    south:
      to: tba:11:room:1102
    west:
      to: tba:11:room:1114

"tba:11:room:1104":
  name: Stalagmitic Armory
  description: >
    Various pieces of armor and weaponry lie embedded in the glassy walls, the metal and ice reflecting
    light from all around.  Frozen stalagmites protrude menacingly from the floor, formed from the
    dripping of hanging icicles which have since fallen and shattered, leaving tiny shards sprinkled
    throughout the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1105
    east:
      to: tba:11:room:1120
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:11:room:1116

"tba:11:room:1105":
  name: Hall of Legends
  description: >
    Colored murals adorn either side of this lengthy hall, their depictions those of fierce battles and
    strong warriors standing victorious over fallen foe. Amongst the faded illustrations are the
    likenesses of dragons as well as men, fighting together against some common enemy.  Once undoubtedly bright
    and glorious, the carefully crafted representations are now dull and worn, coated with spidery-thin
    strands of frost and snow, everything glazed and foggy as if part of some dream world.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1106
    south:
      to: tba:11:room:1104

"tba:11:room:1106":
  name: Lords' Chamber
  description: >
    Decorated with all the noblest of tapestries and furnishings, this room is sombre and dreary in
    feel.  All is covered in a sheen of white and frozen moisture, the effect being one of almost timeless
    age.  Various archaic board games and glasses of drink lie sculpted in place, cocooned within the same
    icy curse as the inhabitants themselves.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1117
    south:
      to: tba:11:room:1105
    west:
      to: tba:11:room:1125
      look: >
        Smooth and reflective, this perfectly sculpted door glistens with moisture like drops of dew, its
        delicate appearance and transparency providing a beautiful frame for the surroundings on the other
        side.
      door:
        keywords: [glassdoor]
        kind: door

"tba:11:room:1107":
  name: A Cold Throneroom
  description: >
    The air hangs damp and chill, heaving softly and whispering as with the breathing of lingering
    spirits.  The towering stone walls and smooth white marble floor can be seen to have given the place a
    cold regal air, long before its wintery fate.  Now only wisps of snow flicker here and there like
    tendrils of mist, all else still and undisturbed.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1121
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:11:room:1117
    west:
      to: tba:11:room:1108

"tba:11:room:1108":
  name: A Frosty Dining Hall
  description: >
    Stretching far to the west, this lengthy corridor is filled with a myriad of dancing colored lights
    from some nearby source.  The forlorn gray of the surroundings seems almost alive with the movement,
    flickering here and there as though lit with hundreds of tiny candles, each shimmering with a
    different hue of the rainbow.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:11:room:1107
    west:
      to: tba:11:room:1109
  triggers: [tba:11:trg:1102]

"tba:11:room:1109":
  name: A Frosty Dining Hall
  description: >
    A high gilded ceiling sparkles with prisms of light from a dazzling chandelier.  Emptied of
    candles, only the shards of crystal and glass remain, each dangling from delicate silver chains and
    shivering slightly every time the castle reverberates with thunder, tinkling lightly in a fragile contrast to
    the ominous booms, flooding the lengthy hall with a variety of speckled colors.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:11:room:1108
    west:
      to: tba:11:room:1118
  triggers: [tba:11:trg:1102]

"tba:11:room:1110":
  name: A Glacial Music Room
  description: >
    Bitterly cold, all that remains of melody in this room is the delicate chiming of ice crystals
    hitting the floor, and the mournful moan of a chill wind that stirs the atmosphere.  Miniscule sculpted
    snowflakes swirl restlessly about the place, making the air sparkle with thousands of frozen particles.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1118
    south:
      to: tba:11:room:1115
    west:
      to: tba:11:room:1122
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1111":
  name: Ladies' Chamber
  description: >
    A cool blue hue illuminates this room, every surface slick and shiny with icy wetness.  Elegant
    chairs stand about, coatings of fluffy snow giving the impression they are padded with cotton wool.  A
    desolate fireplace decorates the western wall, long frosted over and wailing eerily with every
    movement of the outside wind.  Within its recesses, clumps of coal sit never to be used, their dark surfaces
    speckled with snow as if they were powdered chocolates.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1115
    east:
      to: tba:11:room:1123
      look: >
        Smooth and reflective, this perfectly sculpted door glistens with moisture like drops of dew, its
        delicate appearance and transparency providing a beautiful frame for the surroundings on the other
        side.
      door:
        keywords: [glassdoor]
        kind: door
    south:
      to: tba:11:room:1112

"tba:11:room:1112":
  name: Hall of Forgotten Arts
  description: >
    The art of old magics and illusions seems to be the focus of this room's adornments.  Strange light
    flickers upon the walls and ceiling from tiny green candles that line the upper border, and yet
    strangely, the coating of ice and snow shows no sign of melting.  Grim eyes watch over the place from
    ancient tapestries that line either side of the hall, their icy glazed expressions seeming every now and
    again to shift in the shadows.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1111
    south:
      to: tba:11:room:1113

"tba:11:room:1113":
  name: Fissured Gallery
  description: >
    Some incredible heat has caused this room to completely splinter, several large spidery cracks
    sapnning the surfaces of the frozen stone walls and leaving a large crevass splitting its way along the
    floor.  A few masterful paintings remain hung here, but many been smashed upon the floor, pieces of
    broken silver and glass frames mingling with the shards of ice.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1112
    east:
      to: tba:11:room:1114
    west:
      to: tba:11:room:1119
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:11:room:1114":
  name: Sphalerite Stair
  description: >
    Made from a dark, glassy mineral, this elegant stair curves eastward, meeting a sister stair in the
    middle and ascending upward like a towering guardian shadow, its smooth surface covered with an
    intricate webwork of frost, giving it the appearance of white-veined marble.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1103
    west:
      to: tba:11:room:1113
    up:
      to: tba:11:room:1134
  triggers: [tba:11:trg:1136]

"tba:11:room:1115":
  name: Hall of Forgotten Arts
  description: >
    In a striking tribute to craftsmanship, beautifully cut gems and jewels of every description
    decorate the walls and silver-gilded ceiling of this hall. Sapphire and azure lend their regal blue hue to
    the surroundings, contrasting with the pure whiteness of the blanketing snow and creamy irridescent
    opals that line the length of the walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1110
    south:
      to: tba:11:room:1111

"tba:11:room:1116":
  name: Sphalerite Stair
  description: >
    Black and ominous, a tall metallic stair slopes gracefully westward, joining its path with another
    stair and continuing up into the high parts of the castle. Dark and metallic, the whole structure
    shimmers with tiny ice crystals, twinkling like a night sky full of shining stars.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1104
    west:
      to: tba:11:room:1103
    up:
      to: tba:11:room:1136

"tba:11:room:1117":
  name: Hall of Legends
  description: >
    Softly drifting flakes of snow cover every surface in this stretching corridor.  Beneath the layer
    of almost unblemished white glimpses of the original dark red carpeting can be seen, giving the
    illusion that the floor is stained with pools of spilt blood.  All around, images of fallen heroes glorify
    the walls, misted with a fine coat of ice that glazes the eyes of the watchful dead.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1107
    south:
      to: tba:11:room:1106

"tba:11:room:1118":
  name: A Frosty Dining Hall
  description: >
    Shimmering swirls of colored light twirl about the room like a flurry of snowflakes, filling the
    place with a sense of fragility despite the immovable presence of the stony walls and the dark brooding
    tones of the wooden beams high above.  An immense ceiling slopes up toward the east, illumination
    flooding the corridor from the peak of its height.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:11:room:1109
    west:
      to: tba:11:room:1110
  triggers: [tba:11:trg:1102]

"tba:11:room:1119":
  name: The Southwest Stair
  description: >
    Flickering shadows and the silent waving of long abandoned cobwebs are all that decorate this once
    well-used stair.  The frost-coated wood can be seen to be worn in places, from the long ago passing
    of servants' feet, from the lower staff quarters to the upper noble bedrooms.  A subtle wooden door
    stands settled into the eastern wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1113
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:11:room:1130
    down:
      to: tba:11:room:1180

"tba:11:room:1120":
  name: The Southeast Stair
  description: >
    Discreetly tucked away, this tiny winding stair is surrounded on all sides by the sombre gray of
    stonework, leading both up and down, nothing can be seen of the destination on either end.  Only black
    grasping shadows and bitter wind lead the way.  A subtle wooden door stands settled into the western
    wall.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1104
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:11:room:1131
    down:
      to: tba:11:room:1179

"tba:11:room:1121":
  name: The Northeast Stair
  description: >
    Hidden away from the nobler parts of the castle, this private little stair extends upward into the
    upper level, and downward into the lowest floor.  A biting breeze whirls its way around the circular
    chamber stirring the cobwebs and snow.  A subtle wooden door stands settled into the western wall.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:11:room:1107
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:11:room:1132
    down:
      to: tba:11:room:1185

"tba:11:room:1122":
  name: The Northwest Stair
  description: >
    Cold and gray, pieces of old dust and debris stir in the disturbed air, floating along with
    snowflakes down into the deeper parts of the stair. Darkness looms overhead as well, the spiralling wooden
    planks leading to a higher story of the castle, as well as a lower.  A subtle wooden door stands
    settled into the eastern wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1110
      look: >
        A subtle wooden door guards the way, delicately hinged and fitted so that upon closing it is almost
        seamless.
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:11:room:1133
    down:
      to: tba:11:room:1157

"tba:11:room:1123":
  name: Snowy Courtyard
  description: >
    Silent, and seemingly undisturbed, this entire courtyard is covered in a thick blanket of pure
    unblemished snow.  The skeletal branches of long dead trees reach wearily overhead, as if to catch the
    delicate snowflakes that flutter continuously down.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1126
    east:
      to: tba:11:room:1124
    south:
      to: tba:11:room:1127
    west:
      to: tba:11:room:1111
      look: >
        Smooth and reflective, this perfectly sculpted door glistens with moisture like drops of dew, its
        delicate appearance and transparency providing a beautiful frame for the surroundings on the other
        side.
      door:
        keywords: [glassdoor]
        kind: door
  triggers: [tba:11:trg:1100]

"tba:11:room:1124":
  name: Fountain of Light
  description: >
    A majestic fountain has been sculpted from a spiral of transluscent sparkling admantine, rising
    from the very center of the snow-covered grounds.  The water that once spilled freely from its pinnacle
    has frozen solid in place, leaving only shimmering cascades of light and ice, swooping and curving as
    if part of the sculputre itself, reflecting the wintry surroundings and filling the place with
    radiance.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:11:room:1125
    west:
      to: tba:11:room:1123
  triggers: [tba:11:trg:1100]

"tba:11:room:1125":
  name: Snowy Courtyard
  description: >
    Serene and hushed, only the restless whispering of long dead leaves stirs the respectful silence
    that preserves this place.  A smooth layer of glistening white snow covers everything as if thick cream
    had been poured over the entire yard, silver grasses protruding from the shadowed corners.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1128
    east:
      to: tba:11:room:1106
      look: >
        Smooth and reflective, this perfectly sculpted door glistens with moisture like drops of dew, its
