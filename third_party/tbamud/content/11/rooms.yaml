    south:
      to: tba:11:room:1129
    west:
      to: tba:11:room:1124
  triggers: [tba:11:trg:1100]

"tba:11:room:1126":
  name: A Forsaken Statuette
  description: >
    Sparkling citrine crystals cast a slight yellowish hue over the surrounding snow, their fragile
    beauty decorating the base of a curving amber sculpture that fills this corner of the courtyard.  Meant
    to represent air, one of the four locally worshipped elements, this artwork has no real concrete
    shape, abstract and formless in an intriguingly beautiful way.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:11:room:1123
  triggers: [tba:11:trg:1100]

"tba:11:room:1127":
  name: A Forsaken Statuette
  description: >
    Shimmering azurite, and the royal blue of sapphires decorate this prominent sculpture.  Towering
    proudly above the blanched snow and ice of the courtyard, this artwork almost resembles a giant wave. 
    A tribute to water, one of the four locally worshipped elements, a light coating of snowflakes has
    dulled it considerably, subtle patterns of silver frost weaving their way across its smooth surface.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1123
  triggers: [tba:11:trg:1100]

"tba:11:room:1128":
  name: A Smashed Statuette
  description: >
    An awesome sculpture once stood here, as evidenced by the smatterings of ruby and red beryl that
    still adorn the ground like drops of blood.  A round metal base stands in the midst of the snow, upon
    which the artwork would have once stood, apparently a tribute to one of the four locally worshipped
    elements. Completely destroyed now, only the tiniest scarlet gems remain frozen in the surrounding ice,
    evidence of the desecrated statue that once stood proudly here.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:11:room:1125
  triggers: [tba:11:trg:1100]

"tba:11:room:1129":
  name: A Forsaken Statuette
  description: >
    Smooth rocks of green malachite, and expertly cut emeralds make up the razor lines and geometric
    shapes of this large regal sculpture.  Fashioned as a tribute to earth and soil, one of the four
    locally worshipped elements, this artwork is still stunning despite the slight icy cracks that marr its
    surface like pale scars.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:11:room:1125
  triggers: [tba:11:trg:1100]

"tba:11:room:1130":
  name: Upper Part of the Southwest Stair
  description: >
    A chill air circulates slowly here, moaning as it brushes against the ice-frosted stone walls and
    creaking the cold wood of the stairs that descend below.  Only darkness can be seen, and the odd
    glimmer of a drifting snowflake. A subtle wooden door stands settled into the eastern wall, and a
