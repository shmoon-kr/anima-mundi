# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 106.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:106:room:10600":
  name: Elcardo Zone Description Room
  description:
    preformatted: |2
         Builder   : Daiko
      Zone         : 106 Elcardo
      Began        : 1999
      Player Level : 7-14
      Rooms        : 58
      Mobs         : 23
      Objects      : 41
      Shops        : 5
      Triggers     : 1
      Theme        : Elcardo, a small city, where the mayor has become ill. Suncas
         rebels are trying to take over the town. Their leader is sujin suncas.
      Notes        : Since the mayor of elcardo is very sick the citizens are not
         being looked after as they should, many rebel and start their own little
         groups within the city.
      Zone: 106 was linked to the following zones:
      200 Western Highway                at 10609 (south) ---> 20025
      175 The Cardinal Wizards           at 10613 (east ) ---> 17525
      125 Hannah                         at 10657 (north) ---> 12500
  sector: inside
  flags: [private]

"tba:106:room:10601":
  name: Cathedral Altar
  description: >
    This is the Cathedral of Elcardo.  The glowing altar stands before you.  The room is very dimly lit
    from the blood red candles which lie before you.  The candles appear to be made out of some sort of
    fat.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:106:room:10602

"tba:106:room:10602":
  name: Inside the Elcardo Cathedral
  description: >
    As you enter the Elcardo Cathedral a holy feeling enriches your body.  The room is well lit by over
    a thousand holy white candles.  On the far wall in front of you there hangs a large cross.  The
    friendly Healer stands here reading a book that appears to be the bible.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10601
    south:
      to: tba:106:room:10603

"tba:106:room:10603":
  name: Outside the Elcardorian Cathedral
  description: >
    You are at the main doors of the cathedral.  The doors are made out of a thick oak.  There are
    small designs all over the door, the designs appear to be from many years ago.  Standing right in front
    of the main doors is the Executioner guarding the door quite well and watching each and every person
    that is planning on entering the cathedral.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10602
    south:
      to: tba:106:room:10604

"tba:106:room:10604":
  name: Cathedral Square
  description: >
    This area of the cathedral is out in the open.  The nice fresh air blows by you.  You can hear the
    sound of trickling water from a few steps in front of you.  The big marble fountain flows crystal
    clear water right in front of you.
  sector: inside
  exits:
    north:
      to: tba:106:room:10603
    south:
      to: tba:106:room:10605

"tba:106:room:10605":
  name: Peddler's Square
  description: >
    People rush by you left and right as you stand in the intersection of Peddler's Way.  The smell of
    freshly baked bread breezes by your nose.  In the distance you can see the Executioner guarding the
    cathedral.  A panhandler begs the passersby for money.  Some actually feel sorry for the worthless bum.
  sector: inside
  exits:
    north:
      to: tba:106:room:10604
    east:
      to: tba:106:room:10610
    south:
      to: tba:106:room:10606
    west:
      to: tba:106:room:10614

"tba:106:room:10606":
  name: Intersection to the Guild Halls
  description: >
    You stand in the middle of Guild row, wondering which way to go, spell casters to the east or
    fighters to the west.  Mages and sorcerers of all kinds rush by.  A large hulky Barbarian almost knocks
    you over.  In the distance you see a strange glowing, It seems to be coming from the spell casting
    area.  To the east you feel a strong magical presence, and to the west you can smell the sweat of hard
    work.
  sector: inside
  exits:
    north:
      to: tba:106:room:10605
    east:
      to: tba:106:room:10618
    south:
      to: tba:106:room:10607
    west:
      to: tba:106:room:10621

"tba:106:room:10607":
  name: Citizens Square
  description: >
    This is the poor part of Elcardo.  Small dirty poor children run past you screaming their heads
    off.  Poor men sit all over the roads begging for money it really is a sin.  It is very strange, the
    rest of the city is well off money wise but as soon as you get here it is very poor.
  sector: inside
  exits:
    north:
      to: tba:106:room:10606
    east:
      to: tba:106:room:10627
    south:
      to: tba:106:room:10608
    west:
      to: tba:106:room:10623

"tba:106:room:10608":
  name: Inside the South Gate of Elcardo
  description: >
    The normal citizens aren't allowed in this part of the town unless they are leaving.  The gate is
    only available in the day time because it is always locked up for the night.  Two large Elcardo
    Knights stand here guarding the gate with their lives.  You can hear children playing from up the road. 
    The gate is made out of steel.  It looks almost impossible to break in to the city.
  sector: inside
  exits:
    north:
      to: tba:106:room:10607
    south:
      to: tba:106:room:10609

"tba:106:room:10609":
  name: Outside the South Gate of Elcardo
  description: >
    A massive steel gate rests just to the north.  The city of Elcardo held beyond the gate and walls. 
    You remember rumors of the city being overthrown by a new political faction.  But who listens to
    politics.  "Poli" meaning many, "tics" meaning blood sucking insects.
  sector: forest
  exits:
    north:
      to: tba:106:room:10608

"tba:106:room:10610":
  name: Peddler's Road
  description: >
    The streets are paved with a fine marble, much better looking then other city's that you've seen. 
    The clanging of metal rings in your ears, it seems to be comming from the north.  There is a bank
    close to the south.
  sector: inside
  exits:
    north:
      to: tba:106:room:10632
    east:
      to: tba:106:room:10611
    south:
      to: tba:106:room:10633
    west:
      to: tba:106:room:10605

"tba:106:room:10611":
  name: Peddler's Road
  description: >
    Tall strong men brush by you, swords hanging at their waists.  They must be going to the Armor Shop
    which is to the north of where you are standing.  To the south you see a strange hut.
  sector: inside
  exits:
    north:
      to: tba:106:room:10634
    east:
      to: tba:106:room:10612
    south:
      to: tba:106:room:10635
    west:
      to: tba:106:room:10610

"tba:106:room:10612":
  name: Inside the East Gate of Elcardo
  description: >
    The steel gates are held shut by two Elcardo Knights which are guarding the exit.  The Elcardorian
    leaders try to keep strict control through the use of the knights and soldiers.  But, with rumors of
    the Mayor falling ill many rebels have begun to combine forces within the city walls.
  sector: inside
  exits:
    east:
      to: tba:106:room:10613
    west:
      to: tba:106:room:10611

"tba:106:room:10613":
  name: Outside the East Gate of Elcardo
  description: >
    The city of Elcardo is to the west through a set of guarded steel gates. You have been told that
    the city is in turmoil and on the verge of a collapse, or possible overthrowing.  Many cunning
    politicians have plans for this city. A gravel path continues east out the gate.  The north is blocked by a
    tall cliff face.
  sector: forest
  exits:
    west:
      to: tba:106:room:10612

"tba:106:room:10614":
  name: Peddler's Road
  description: >
    A strong scent gets your attention right away.  The smell of biscuits, bread and home-made cookies
    comes from the north.  You definitely want to check this place out.  To the south you see a small
    shop and a sign with the words Elcaro Grocer on it.
  sector: inside
  exits:
    north:
      to: tba:106:room:10637
    east:
      to: tba:106:room:10605
    south:
      to: tba:106:room:10638
    west:
      to: tba:106:room:10615

"tba:106:room:10615":
  name: Peddler's Road
  description: >
    Little elf-like people walk by you left and right, You wonder why...  Then you realize that the
    Magic shop is directly in front of you to the north. There is a small sign here that says the words,
    Lara's Magic supplies.
  sector: inside
  exits:
    north:
      to: tba:106:room:10639
    east:
      to: tba:106:room:10614
    west:
      to: tba:106:room:10616

"tba:106:room:10616":
  name: Inside the West Gate of Elcardo
  description: >
    The whispers of treachery and deciept fill the city streets and every passerby looks at you
    warily.  Everyone in the city just wants peace, but the Mayor has failed to maintain order and the revolts
    have begun.  Revolutionists are coming forth.
  sector: inside
  exits:
    east:
      to: tba:106:room:10615
    west:
      to: tba:106:room:10617

"tba:106:room:10617":
  name: Outside the West Gate of Elcardo
  description: >
    Through the gates to the east you can see the infamous city of Elcardo. The city is known for its
    unstable government.  The current Mayor has fallen ill and rumors abound.  Everything from him being
    poisoned to an illness sent from the Gods because of the Mayor's betrayal to the upkeep of the
    citizens. A thick forest can be seen to the west.
  sector: forest
  exits:
    east:
      to: tba:106:room:10616
    west:
      to: tba:106:room:10655

"tba:106:room:10618":
  name: Guild Halls
  description: >
    This is the spellcaster side of the guild halls.  You will find no fighter guilds in this section. 
    To the north is the Cleric guildmaster and to the south is the Paladin guildmaster.  Signs are
    placed over both doors stating that the guilds are closed.
  sector: inside
  exits:
    east:
      to: tba:106:room:10619
    west:
      to: tba:106:room:10606

"tba:106:room:10619":
  name: Guild Halls
  description: >
    Continuing on the spellcaster side of the halls you see a dark dreary guild, it must be the Vampire
    guild that is to the north.  More elves walk in and out of the guild to the south, shall you take a
    closer look at the Mage guild. Signs are placed over both doors stating that the guilds are closed.
  sector: inside
  exits:
    east:
      to: tba:106:room:10620
    west:
      to: tba:106:room:10618

"tba:106:room:10620":
  name: Guild Halls
  description: >
    To the south you see a strange guild, its more like a Grove then a guild. You automatically assume
    that it is the Druid guild.  Meanwhile, to the north you hear strange sounds unlike the other
    guilds.  The Psionicist guild is to the north.  Signs are placed over both doors stating that the guilds are
    closed.
  sector: inside
  exits:
    west:
      to: tba:106:room:10619

"tba:106:room:10621":
  name: Guild Halls
  description: >
    You sense a strong presence of evil when you step in front of this guild. Shadows are everywhere
    and you can almost feel the fear rising in your throat. To the south you can make out the entrance to
    the Thieves guild in the dim light.  North of here is the Warriors Guild.  To the east is the safety
    and comfort of the Guild Halls.  Signs are placed over both doors stating that the guilds are closed.
  sector: inside
  exits:
    east:
      to: tba:106:room:10606
    west:
      to: tba:106:room:10622

"tba:106:room:10622":
  name: Guild Halls
  description: >
    The sounds of combat and training combined with yelling come all around you. It may be loud and not
    very peaceful but you feel strangly good that you are here.  The Barbarian guild is to the north. 
    But as you turn your head towards the south a peaceful feeling fills you body.  The Ranger guild is to
    the south. Signs are placed over both doors stating that the guilds are closed.
  sector: inside
  exits:
    east:
      to: tba:106:room:10621

"tba:106:room:10623":
  name: Citizens Street
  description: >
    The citizens of Elcardo have grown up in a very poor state.  But do not let their poverty fool you,
    they have spent much time training in combat since the city requires all citizens to serve in the
    army.  Decrepit looking shacks are closed and boarded up to the north and south of you.
  sector: inside
  exits:
    east:
      to: tba:106:room:10607
    west:
      to: tba:106:room:10624

"tba:106:room:10624":
  name: Citizens Street
  description: >
    Children run past you, high on sugar, or so you think.  It is very loud in this part of Elcardo,
    much louder then the other parts.  If it is not the screaming children that deafens you it is the
    mothers yelling for or at their children.  More shacks are to the north and south.
  sector: inside
  exits:
    east:
      to: tba:106:room:10623
    west:
      to: tba:106:room:10625

"tba:106:room:10625":
  name: Citizens Street
  description: >
    Children beg for money all around you.  It is not often they see someone as rich as you in their
    neighborhood.  You are quite annoyed that all these children are pulling at your clothes and digging in
    your pockets.  To the north and south are the shacks that these children live in.
  sector: inside
  exits:
    east:
      to: tba:106:room:10624
    west:
      to: tba:106:room:10626

"tba:106:room:10626":
  name: Dead End
  description: >
    To the north you see two teenage children guarding a shack which is reasonably nicer then the
    rest.  The children are each holding a spear and have body paint around their eyes and on their cheeks. 
    Each one with a look of hate and disgust on their face.  Shall you enter...
  sector: inside
  exits:
    north:
      to: tba:106:room:10641
    east:
      to: tba:106:room:10625

"tba:106:room:10627":
  name: Pathway to the Saloon
  description: >
    You are on the path towards the old Elcardo Saloon, a popular hangout for all those old Elcaro
    Knights.  But watch out, they are quite bitter with their old age.  The Saloon is a great place to glean
    the latest gossip from the locals.
  sector: inside
  exits:
    east:
      to: tba:106:room:10628
    west:
      to: tba:106:room:10607

"tba:106:room:10628":
  name: Entrance to the Saloon
  description: >
    A short, very short, man is here letting people in and tossing people out of the Saloon.  He doesnt
    look very intimidating at all.  But, he must be qualified or he wouldn't have the job and be able to
    handle the soldiers and rebels.
  sector: inside
  exits:
    east:
      to: tba:106:room:10629
    west:
      to: tba:106:room:10627

"tba:106:room:10629":
  name: Inside the Elcardo Saloon
  description: >
    The room is filled with the smell of old cigars and pipes.  You feel as if you were ten years old
    considering everyone in the room is at least twice your age.  It is quite hard to breathe in here but
    these old timers are very use to it.  You notice an odd back room with a sign on the door to the east
    saying Do Not Enter.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:106:room:10630
    west:
      to: tba:106:room:10628

"tba:106:room:10630":
  name: Center of the Saloon
  description: >
    An elderly man is playing a piano in the corner of the room.  Retired Elcardo knights and soldiers
    play cards all around you and reminisce about the olden days.  Not quite the spot you find exciting
    but you wonder what is going on in that back room.  An old veteran flashes his gums at you.  The back
    room is close to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10631
    west:
      to: tba:106:room:10629

"tba:106:room:10631":
  name: The Back Room
  description: >
    The room is very dim, A few candles are lit on the walls.  This is where many of the different
    rebellious factions in the city meet.  They sometimes work together, sometimes oppose each other.  It all
    depends which they think is most beneficial.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:106:room:10630

"tba:106:room:10632":
  name: The Armor Shop
  description: >
    The walls are tarnished black from soot.  The sounds of clanging metal comes from a large man
    perfecting a silver sword.  The smell of his sweat is enough to change your mind from entering this shop
    again, You should purchase your weapon and get out as fast as possible.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:106:room:10634
    south:
      to: tba:106:room:10610

"tba:106:room:10633":
  name: The Bank of Elcardo
  description: >
    The bank is very clean and it feels very peaceful.  There are many plaques on the walls all of
    which say something good about the city of Elcardo.  Quite the rich looking establishment it is.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10610

"tba:106:room:10634":
  name: The weapon shop
  description: >
    The armory has a wide assortment of armors on the walls and in the windows.  You see helmets,
    shields and chain shirts to name a few.  To the south is the main street.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:106:room:10611
    west:
      to: tba:106:room:10632

"tba:106:room:10635":
  name: Mayor's Hut
  description: >
    You are having a hard time believing that this little hut belongs to the Mayor of the city.  A
    middle-aged women informs you that the Mayor is sick in bed and is taking no visitors.  You should
    leave.  To the south is a closed wooden door with the words "Do Not Disturb" on it.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:106:room:10611
    south:
      to: tba:106:room:10636
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:106:room:10636":
  name: Inside the Mayor's room
  description: >
    The inside of the Mayor's room is quite impressive.  A tall four post bed fills the center of the
    room.  An ornately carved dresser and desk cover the western wall.  A light fragrance attempts to
    cover the smell of death in the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10635
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:106:room:10637":
  name: Grandma's Diner
  description: >
    This is a very small diner, but it is one of the most comfortable places you've ever been in your
    life.  Directly behind the counter you see an elderly man playing with an antique cash register.  In
    the kitchen you see a little old lady baking cookies and other goodies.  You know you wanna have some.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:106:room:10614

"tba:106:room:10638":
  name: Elcardo Grocer
  description: >
    You are inside the general store.  All sorts of items are stacked on shelves behind the counter,
    safely out of your reach.  None of the items seem to be of special interest, just your everyday
    requirements.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10614

"tba:106:room:10639":
  name: Lara's Magic Supplies
  description: >
    The shop is quite small compared to the others.  Shelves are filled with mason jars with pig eyes,
    cow tongues, and chicken brains.  It is not the most pleasant sight in the world.  Lara is quite the
    odd looking individual, wearing all black with the Skull of Hakanda around here neck.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:106:room:10615

"tba:106:room:10641":
  name: Inside the Shack
  description: >
    You are in the main entrance to the poor shack that was being guarded by two teenage kids.  What
    could they possibly be guarding you wonder.  There are doors to the west and east of you and also a
    large solid stone door to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10645
      look: A large solid stone door.
      door:
        keywords: [solid, stone, door]
        kind: door
    east:
      to: tba:106:room:10643
    south:
      to: tba:106:room:10626
    west:
      to: tba:106:room:10642

"tba:106:room:10642":
  name: Poor Barracks
  description: >
    There are bunk beds all around you.  Extra spears and other weapons lie in the corner of the room. 
    Some teenage children are sleeping in the bunks while some are choosing a weapon.  Should You really
    be here...
  sector: inside
  exits:
    east:
      to: tba:106:room:10641

"tba:106:room:10643":
  name: Poor Barracks
  description: >
    Bunk beds everywhere, clothes neatly folded in separate piles.  These children look very tired and
    look as though they are far over-worked.  A Young child quietly crys on a bunk to your left, all he
    really needs is some comfort. An open hatch leads down.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:106:room:10641
    down:
      to: tba:106:room:10644

"tba:106:room:10644":
  name: An Empty Room
  description: >
    The room is very VERY small and there is almost nothing in it.  The walls are very dirty and the
    floor is made of dirt.  A shudder goes through your spine, You can sense the hatred in this place.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:106:room:10643
    down:
      to: tba:106:room:10646

"tba:106:room:10645":
  name: Chambers of Sujin Suncas
  description: >
    The rebel headquarters run by Sujin Suncas is more run-down than would be expected.  It appears he
    lacks the financial support to carry out a successful rebellion.  Rebellions never last very long
    once people start starving. Perhaps that is the Mayor's strategy.  A few wooden chairs are placed around
    an empty table.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:106:room:10641
      look: A solid stone door.
      door:
        keywords: [door]
        kind: door

"tba:106:room:10646":
  name: Entrance to the Dungeon
  description: >
    The smell of old bones and rotting flesh fills your nose.  There are puddles of a brownish liquid
    on the floor and stains of blood on the walls.  The sound of moaning rings through-out the dungeon.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:106:room:10649
    east:
      to: tba:106:room:10648
    west:
      to: tba:106:room:10647
    up:
      to: tba:106:room:10644

"tba:106:room:10647":
  name: Death Chamber
  description: >
    This cramped room has a very strong odor of decay to it.  It is not pleasant at all.  You wonder
    why the citizens of Elcardo would allow people to be imprisoned down here in the dungeons.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:106:room:10646

"tba:106:room:10648":
  name: Torture Room
  description: >
    Strange devices used for torture are scattered all around the room.  Why would they torture people
    in a dungeon, Sick SICK people.  It appears that there are some bodies still alive in here.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:106:room:10646

"tba:106:room:10649":
  name: Dungeon Hallway
  description: >
    You do not feel safe at all when you are down here all alone.  There are a few small candles
    mounted on the dungeon walls just enough light to see your own hands but thats about the only thing
    visible.  A gaping hole in the dungeon floor to the west looks bottomless.
  sector: inside
  exits:
    north:
      to: tba:106:room:10651
    south:
      to: tba:106:room:10646
    west:
      to: tba:106:room:10650

"tba:106:room:10650":
  name: Body Count
  description: FALLING, FELL, NEAR-DEAD!  Should have read the room descriptions.
  sector: inside
  flags: [dark, no_mob, soundproof, no_magic]

"tba:106:room:10651":
  name: Dungeon Hallway
  description: >
    There are rooms and chambers to the left and right of you, this way and that way.  You do not feel
    safe at all when you are down here all alone.  There are a few small candles mounted on the dungeon
    walls just enough light to see your own hands but thats about the only thing visible.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:106:room:10654
    east:
      to: tba:106:room:10653
    south:
      to: tba:106:room:10649
    west:
      to: tba:106:room:10652

"tba:106:room:10652":
  name: A Black Cell
  description: >
    This is a the scariest room of all.  There is no light AT ALL.  You can feel your heart pounding as
    you look around the room trying to see if something is here...  Is alive.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:106:room:10651

"tba:106:room:10653":
  name: Suncas Jail Cell.
  description: >
    This large room with earthen walls has been equipped with shackles for both hands and feet.  They
    seem to have been driven into the walls on long steel poles.  A few leg shackles are scattered about
    the center of the room.  This appears to be a jail cell for prisoners.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:106:room:10651

"tba:106:room:10654":
  name: The Guard Room
  description: >
    Blood and guts are all over the floor and walls in this room.  It looks as though a few prisoners
    escaped and came after the guards.  It is even more gross that part of the guts have been eaten.  They
    must not feed the prisoners very well.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:106:room:10651

"tba:106:room:10655":
  name: A Path between Hannah and Elcardo
  description: >
    Forests surround you, but to the east you can just make out the city of Elcardo.  While to the west
    and north some you have heard lies the city of Hannah.  The path looks relatively empty, and unused
    here.
  sector: inside
  exits:
    east:
      to: tba:106:room:10617
    west:
      to: tba:106:room:10656

"tba:106:room:10656":
  name: A Path between Hannah and Elcardo
  description: >
    This well travelled path links the cities of Elcardo and Hannah.  The two cities were once strong
    allies until the City of Hannah started having problems with strange creatures storming the city
    walls.  All communication between the cities has been cut off for some time now.
  sector: inside
  exits:
    north:
      to: tba:106:room:10657
    east:
      to: tba:106:room:10655

"tba:106:room:10657":
  name: Before the City of Hannah
  description: >
    Just to the north can be seen a pair of barred and rusted gates, the gates have been closed for a
    long time and rumors of the city within being destroyed or deserted abound.  The city walls stretching
    to the east and west are crumbled in some places, even torn down.
  sector: inside
  exits:
    south:
      to: tba:106:room:10656
