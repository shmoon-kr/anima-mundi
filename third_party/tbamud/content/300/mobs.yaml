"tba:300:mob:30007":
  keywords: [hermit]
  short: the hermit
  long: A Hermit, starved for company, is here.
  description: >
    Although raving mad, the hermit has come out of his isolation since he has not spoken with anyone
    for ages.  The shaggy hermit draws you over and begins to tell a strange tale, 'Some 600 years ago,
    when I was but a lad, a great dragon ruled the land.  His name was Ancalador.  Many heroes came to do
    battle with him, but all failed and died, horribly, I imagine.  But one wizard challenged the Drake to
    a magic duel.  He too died, like the others, but with his last breath, the wizard turned the mighty
    Ancalador to stone!  Many believed the dragon's evil reign ended, but after the dancing and drinking
    were over, and life returned to its quiet pace, the people began to notice that the Dragon's presence
    could still be felt.  Ancalador did, in fact, continue to rule from his petrified prison through the
    manipulation of the minds of men. Indeed, he has done so to this day.  Many believe he is plotting
    the day he can return in the flesh, so to speak...  ' With that the Hermit begins to cackle madly,
  level: 10
  sex: neutral
  alignment: 500
  flags: [sentinel]
  combat:
    thac0: 17
    armor: 4
    hit_points: 2d2+100
    damage: 1d2+1
  gold: 100
  exp: 10000
  position:
    load: standing
    default: standing

