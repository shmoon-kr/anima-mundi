"tba:245:room:24510":
  name: Descent Into Darkness
  description: >
    You float in an open darkness, the immensity of the chamber so vast, so awe-inpsiring as to be
    terrifying.  The Entry Chamber lies to the north, complete with its host of horrifying inhabitants who
    feed off the unlucky ones, much like yourself.  Below you lies an open darkness, a chamber so wide that
    the north wall cannot be discerned - especially in this darkness.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:245:room:24506
    east:
      to: tba:245:room:24511
    down:
      to: tba:245:room:24514

