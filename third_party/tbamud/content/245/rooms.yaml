"tba:245:room:24565":
  name: Claustrophobia
  description: >
    There is just enough room for you and possibly one other person to squeeze through this small spout
    at the base of the Maw.  Above you lies the roiling black of the Maw, its creatures and its evil
    beckoning you back for more.  A large chamber lies just below, a maze of brickwork floors and rough
    stone walls.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track, tunnel]
  exits:
    down:
      to: tba:245:room:24566

"tba:245:room:24566":
  name: The Hall of the Damned
  description: >
    Could this be real?  The hall you stand within is enormous, strectching east to west as far as your
    eyes can fathom in the darkness of the chamber.  A host of undead beings scratch and claw their way
    about the hall, searching for any scrap of living flesh they might chew upon.  Looking about, you
    cannot find any sort of exit from this horrid chamber whatsoever.  Its fight or become one with these
    awful creatures of darkness.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:245:room:24567
    east:
      to: tba:245:room:24570
    south:
      to: tba:245:room:24568

