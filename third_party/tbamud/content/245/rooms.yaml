  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:245:room:24500
    east:
      to: tba:245:room:24506

"tba:245:room:24506":
  name: Entry Chamber
  description: >
    The southern edge of this stone platform drops away into another chamber far below.  It is a
    straight drop, the only way down is by flying down through a host of flying beasts which seem all to eager
    to receive a visit.  What lies below is mostly shadowed and dark, however movement can be seen all
    around the perimeter of the chamber - which itself is quite vast - and in the center... In the center
    lies nothing, only empty blackness.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:245:room:24501
    east:
      to: tba:245:room:24507
    south:
      to: tba:245:room:24510
    west:
      to: tba:245:room:24505

