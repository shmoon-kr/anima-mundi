"tba:245:room:24599":
  name: The Time of the Choosing
  description: >
    Hazy images waver and dance upon three of the four walls within this room. On the south wall is the
    image of the Hall of the Damned, the contorted visages of the creatures within searching for the
    place you vanished to - the scent of your blood still fresh in the air.  On the north wall is the image
    of a dark dock set at the west edge of a subterrainian lake.  Strange creatures rest upon their
    haunches upon the docks, mishappen figures of grotesque origin.  On the east wall is the image of a green
    field, the grass blowing freely in the wind, with the spires of a very familiar city within sight. 
    This is your last chance to escape the horrors of the Nether.  You may be able to overcome the Nether
    Lord, however you must ask yourself - right now - will it be worth it?
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:246:room:24600
    south:
      to: tba:245:room:24587
