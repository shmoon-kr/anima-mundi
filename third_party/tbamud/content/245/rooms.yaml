"tba:245:room:24513":
  name: Skirting the Maw
  description: >
    A solid layer of bricking makes a walkway around an opening in the floor of the chamber.  More of
    an enormous well than an opening, the gaping hole in the center of the chamber holds a broiling
    darkness which actually moves and writhes as if with its own inner life.  Hooting, howling creatures cavort
    about the walkway scavenging upon each other and any unwary visitors who might 'drop in'.
  sector: inside
  flags: [dark, indoors, soundproof, no_track]
  exits:
    east:
      to: tba:245:room:24514
    south:
      to: tba:245:room:24528

