  description: >
    You stand upon a flat surface of hard rock, smooth and open.  A solid wall of granite forms the
    northern boundary of the area you stand upon, the wall rising high into darkness, the heights
    unfathomable.  The eastern wall angles a bit here, cutting off any movement to the south, however just east of
