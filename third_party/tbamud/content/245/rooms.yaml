"tba:245:room:24529":
  name: The Gaping Darkness
  description: >
    The thickest, most vile darkness that could be imagined by the most evil being in this world or any
    other does not match up to what roils and writhes at your feet.  You float above a mass of dark,
    swirling energy which swallows all light, all sound - everything that is anything is absorbed into this
    Maw of Darkness and corrupted to add to its own evil.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track]
  exits:
    north:
      to: tba:245:room:24514
    east:
      to: tba:245:room:24530
    south:
