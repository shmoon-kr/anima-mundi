"tba:73:room:7304":
  name: The Cave Turning-Point
  description: >
    The mud is getting deeper.  You are wondering, 'Would it be an idea to leave, before I disappear?' 
    To the south you notice a flat round stone is blocking the way.  To the west you can see mud.
  sector: field
  flags: [dark, indoors]
  exits:
    south:
      to: tba:73:room:7305
      look: You can see an opening behind the stone.
      door:
        keywords: [stone, flat, round]
        kind: door
        reset: closed
    west:
      to: tba:73:room:7303
  extras:
  - keywords: [flat, round, stone]
    text: >
      The stone looks very uninteresting.  BUT as you are about to turn away, you see a strip of light
      coming through a small hole.  Conclusion: The stone is moveable.

"tba:73:room:7305":
  name: The Secret Room
  description: >
    There is dust all over the place.  It looks like nobody has been here for ages.  In the middle of
    the room you see a socket with a crystal globe. The globe glows with a pulsing light.  To the north
    you see a stone door. To the south you see a gray block.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:73:room:7304
      look: You see a round stone door.
      door:
        keywords: [door, round, stone]
        kind: door
        reset: closed
    south:
      to: tba:73:room:7306
      look: You see a gray block.
      door:
        keywords: [block, gray]
        kind: door
        reset: closed
  extras:
  - keywords: [crystal, globe]
    text: >
      The crystal globe is glowing with a pulsing light.  It looks like there is smoke inside it.
  - keywords: [socket]
    text: The socket looks like the work of a dwarf.  It is VERY beautiful.

