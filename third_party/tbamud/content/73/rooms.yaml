# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 73.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:73:room:7300":
  name: Cave Entrance
  description: >
    You are standing in the cave entrance.  It is very dark down here.  There is writing on the wall. 
    There is an exit to the north.  A stairway leads up.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:73:room:7301
      look: To the north you can see a small tunnel.
    up:
      to: tba:71:room:7102
      look: You can see the stairs going up into darkness.
      door:
        keywords: [door]
        kind: pickproof
  extras:
  - keywords: [writing, wall]
    text: The writing says 'BEWARE adventurer!  '

