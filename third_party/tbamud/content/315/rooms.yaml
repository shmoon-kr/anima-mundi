# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 315.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:315:room:31500":
  name: Western Bridge
  description: >
    This bridge spans for quite some distance over the length of space between the land and the plateau
    which McGintey Cove rests upon.  To the south the bridge leads the way into the city, to the north
    is a toll booth which sits on the side of McGintey Road.
  sector: inside
  exits:
    north:
      to: tba:258:room:25826
    south:
      to: tba:315:room:31501
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Kaan
           Zone 315 is linked to the following zones:
        258 Light Forest                   at 31500 (north) ---> 25828
        316 McGintey Guild Area            at 31510 (west ) ---> 31600
        317 Wharf                          at 31515 (east ) ---> 31700
        316 McGintey Guild Area            at 31565 (west ) ---> 31666
        317 Wharf                          at 31570 (east ) ---> 31732
        318 Dock Area                      at 31571 (south) ---> 31801
        318 Dock Area                      at 31573 (south) ---> 31804
        Links: 02n to McGintey Road

"tba:315:room:31501":
  name: Western Bridge
  description: >
    The bridge ends here, heading south into the main part of the city.  Looking down, you see that the
    bridge you stand upon must have been a huge undertaking, the anchors which hold the bridge to the
    cliff face are by themselves bigger than you.  You may enter into the city or head north back over the
    bridge into the wilderness.
  sector: inside
  exits:
    north:
      to: tba:315:room:31500
    south:
      to: tba:315:room:31505

"tba:315:room:31502":
  name: Eastern Bridge
  description: The bridge heads south toward the city entrance or leads the way north to McGintey Road.
  sector: inside
  exits:
    north:
      to: tba:258:room:25828
    south:
      to: tba:315:room:31503

"tba:315:room:31503":
  name: Eastern Bridge
  description: The bridge runs straight south into the city, or north twoard McGintey Road.
  sector: inside
  exits:
    north:
      to: tba:315:room:31502
    south:
      to: tba:315:room:31508

"tba:315:room:31504":
  name: Cliffside Inn
  description: >
    This inn looks to be one of the main rest spots for travellers who stay in McGintey Cove over
    night.  The place is not all that flashy, but it always has a warm fire at night, plenty of ale, and the
    beds upstairs are always very comfortable.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31505
    up:
      to: tba:315:room:31522

"tba:315:room:31505":
  name: West Main
  description: >
    The street heads south into the main part of the city or north onto the bridge which allows access
    to the outside world.  East of you is a small, tidy building with a sign out front proclaiming
    'INFORMATION'.  To the west is very nice looking inn, the Cliffside.
  sector: inside
  exits:
    north:
      to: tba:315:room:31501
    east:
      to: tba:315:room:31506
    south:
      to: tba:315:room:31511
    west:
      to: tba:315:room:31504

"tba:315:room:31506":
  name: Information
  description: >
    This small one room building is split in half by a long counter running north to south, from wall
    to wall.  On your side of the counter at the north end is a large rack full of maps and brochures
    which tell in great hype and detail all the wonders of McGintey Cove.  The exit to West Main lies just
    west of you.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    west:
      to: tba:315:room:31505

"tba:315:room:31507":
  name: Samuel Faarza's
  description: >
    This exclusively drunken brawling tavern looks to be a popular hangout for wayward travellers who
    need to shake the road dirt off their boots and take out any frustrations they may have felt in their
    travels on each other.  Samuel, the owner and operator, an ex-gladiator from the pits, never seems to
    mind any fights in his business.  It is even rumored that he sometimes starts them himself!
  sector: inside
  flags: [indoors, peaceful]
  exits:
    east:
      to: tba:315:room:31508

"tba:315:room:31508":
  name: East Main
  description: >
    The road leads south into the main section of McGintey Cove.  Shops line the way, both sides of the
    road, with the ocassional side street branching off.  To your west is a very loud and rustic looking
    tavern called Samuel Faarza's, and to your east is the post office.
  sector: inside
  exits:
    north:
      to: tba:315:room:31503
    east:
      to: tba:315:room:31509
    south:
      to: tba:315:room:31514
    west:
      to: tba:315:room:31507

"tba:315:room:31509":
  name: Post Office
  description: >
    This small room is all you may enter into, although you know it is a much larger building from what
    you saw outside.  You may either send mail to any player here or receive any mail you have been sent.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31508

"tba:315:room:31510":
  name: North St.
  description: >
    The road heads west into the guild areas, or east into the main section of McGintey Cove.  To your
    north is the southern wall of the Cliffside Inn, south is the wall of an unknown shop who's entrance
    must be on some other side.
  sector: inside
  exits:
    east:
      to: tba:315:room:31511
    west:
      to: tba:316:room:31600

"tba:315:room:31511":
  name: West Main and North St
  description: >
    The roads intersect here, heading in all four cardinal directions.  To the north the street heads
    toward the western bridge, one of the exits out of town. South, the street runs toward the bazaar. 
    North street runs west into the guild area or east deeper into the main section of town.
  sector: inside
  exits:
    north:
      to: tba:315:room:31505
    east:
      to: tba:315:room:31512
    south:
      to: tba:315:room:31517
    west:
      to: tba:315:room:31510

"tba:315:room:31512":
  name: North St.
  description: >
    The street heads east and west from here, leading into the main sections of town.  Shops line the
    south side of the street, their entrances facing out in another direction, because from this side all
    you see is their brick wall.  To the north is the Town Meeting Hall, a gloriously large place - built
    for a large town.
  sector: inside
  exits:
    north:
      to: tba:315:room:31579
    east:
      to: tba:315:room:31513
    west:
      to: tba:315:room:31511

"tba:315:room:31513":
  name: North St.
  description: >
    The street runs east and west from here.  To the east is the intersection of North and E.  Main. 
    West the street runs past the Town Meeting Hall, north of you is the entrance to the Teleport Shop.
  sector: inside
  exits:
    north:
      to: tba:315:room:31574
    east:
      to: tba:315:room:31514
    west:
      to: tba:315:room:31512

"tba:315:room:31514":
  name: Intersection
  description: >
    You stand at the meetings of E.  Main and North St.  The roads lead in every direction.  North
    leads to the Eastern Bridge out of town, while south leads deeper into town toward the bazaar.  Heading
    east on North St.  Takes you up hill into the Wharf, the high-class, prestigious section of McGintey
    Cove.
  sector: inside
  exits:
    north:
      to: tba:315:room:31508
    east:
      to: tba:315:room:31515
    south:
      to: tba:315:room:31520
    west:
      to: tba:315:room:31513

"tba:315:room:31515":
  name: North St.
  description: >
    The street heads east at an upward slant into the Wharf, a section of town known for it's high
    prices and high class people.  To the west the street runs into an intersection of two of the main roads
    of the city.
  sector: inside
  exits:
    east:
      to: tba:317:room:31700
    west:
      to: tba:315:room:31514

"tba:315:room:31516":
  name: Libation Station
  description: >
    It looks as if maybe a mad scientist lives here, from the way all the counters and shelves are
    filled with vials and beakers, all full of different colored fluids, some of which bubble, some of which
    fizz, some which steam.  If you need potions, it looks like you probably came to the right place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31517

"tba:315:room:31517":
  name: West Main
  description: >
    The street heads north toward the city gates and south toward the bazaar which is the center of the
    city.  East of you is the Jewelry shop and west is the local potion shop, the Libation Station.
  sector: inside
  exits:
    north:
      to: tba:315:room:31511
    east:
      to: tba:315:room:31518
    south:
      to: tba:315:room:31525
    west:
      to: tba:315:room:31516

"tba:315:room:31518":
  name: Jewelry Store
  description: >
    There are no items on display here, it looks as if maybe the clientele of this town might be a bit
    too rough.  Possibly you should ask if you would like to take a look at what the shopkeeper has to
    offer.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31517

"tba:315:room:31519":
  name: McGintey Bank and Depository
  description: >
    One must wonder why and how most banks come to receive such opulence.  True, there is a lot of
    money which passes through a bank's hands, but most of that money does not belong to the bank.  Wise
    investments and purchases do yield a profit over time, however all banks seem to have way more than
    enough money for themselves.  This bank is no exception.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31520

"tba:315:room:31520":
  name: East Main
  description: >
    The street heads south toward the bazaar or north toward the city gates and the Eastern Bridge. 
    The city bank is just west of here, and the armory is east.
  sector: inside
  exits:
    north:
      to: tba:315:room:31514
    east:
      to: tba:315:room:31521
    south:
      to: tba:315:room:31528
    west:
      to: tba:315:room:31519

"tba:315:room:31521":
  name: McGintey City Armory
  description: >
    Suits, vests, helms, and leg-wear litter this room, all in various states of repair or disrepair. 
    It doesn't look as if the armor here is of the absolute finest quality, however it does cover most of
    your major organs.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31520

"tba:315:room:31522":
  name: Top of the Stairs
  description: >
    A desk has been set here for the purpose of allowing your receptionist to find you a room which is
    vacant so that you may rest in comfort.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:315:room:31504

"tba:315:room:31523":
  name: The Pet Shop
  description: >
    A burst of noise and smell greets you as you enter this room.  The sound of dogs braking, cats
    meowing and birds chirping is enough to drive you crazy and you just got here.  How in the world does
    anyone stand all the racket long enough to actually work here?
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31525

"tba:315:room:31524":
  name: PETSHOP STOREROOM
  description: >
    Make two rooms and some pets.  The rooms MUST be sequential.  If the first room is 315 then the
    second must be 316.  The second room is known as the storeroom.  All that is required in the storeroom
    is to load one of each mob you wish to be a pet.  This room can not have any exits and will never be
    used by mortals.  Although a pet shopkeeper is not required it is recommended.  After all of this is
    done ask your coder to implement the petshop.  It will not work until the code is changed and the MUD
    is rebooted.  The cost of pets is 300 times their level.
  sector: inside
  flags: [godroom]

"tba:315:room:31525":
  name: West Main
  description: >
    Directly south of you is the bazaar, a huge, sprawling affair which dominates most of the city's
    center.  Vendors from all over the land come to buy, sell, and trade exotic goods of every kind.  The
    street also runs north toward the city gates.  East of you is the weapon shop, and to the west is the
    pet shop.
  sector: inside
  exits:
    north:
      to: tba:315:room:31517
    east:
      to: tba:315:room:31526
    south:
      to: tba:315:room:31531
    west:
      to: tba:315:room:31523

"tba:315:room:31526":
  name: The Weapon Shop
  description: >
    This is probably the worst place in town to buy weapons of any sort unless you don't care about
    your fighting skills or you are a mage (since they can't fight like real men, anyway).  The proprieter
    of the shop is a sniveling worm of a kid who's rich father bought him the shop only in an attempt to
    keep the kid occupied away from home.  Hence, the poor quality of weapon sold here, and the high
    prices, which are that way because of the low volume.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31525

"tba:315:room:31527":
  name: Traveller's Pitstop
  description: >
    This store sells all manner of goods which a traveller may need to keep him or her travelling in
    style, or at least in a semblance of style.  From lanterns to carrying cases, this store has it all.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31528

"tba:315:room:31528":
  name: East Main
  description: >
    The street heads north toward the city gates or south into the bazaar, the merchant's fair which
    runs all day and all night every day.  To the east is the local branch of law enforcement, and to the
    west is the town general store.
  sector: inside
  exits:
    north:
      to: tba:315:room:31520
    east:
      to: tba:315:room:31529
    south:
      to: tba:315:room:31534
    west:
      to: tba:315:room:31527

"tba:315:room:31529":
  name: Marshal Station
  description: >
    There are a few desks scattered throughout the room, most of which are empty at this time.  There
    are only a few officers on duty here, looks as if most of the officers spend their time patrolling the
    city rather than wasting it here in the office.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31528

"tba:315:room:31530":
  name: Bazaar
  description: >
    This huge stone court, roughly a mile square, is used to host the bazaar, an all day, all night
    affair full of noise and hubbub, all from the loud haggling of the merchants who offer their goods and
    any potential customers who walk by.
  sector: inside
  exits:
    east:
      to: tba:315:room:31531
    south:
      to: tba:315:room:31536

"tba:315:room:31531":
  name: The Bazaar
  description: >
    This is huge!  This wide splotch of stone in the middle of the city offers a spot for some of the
    strangest and most exotic goods to be sold by vendors who have travelled far and wide to claim their
    treasures.  North is the entrance onto West Main, the bazaar leads off in every direction.
  sector: inside
  exits:
    north:
      to: tba:315:room:31525
    east:
      to: tba:315:room:31532
    south:
      to: tba:315:room:31537
    west:
      to: tba:315:room:31530

"tba:315:room:31532":
  name: The Bazaar
  description: >
    Men and woman from every race and class brush shoulders here, some selling goods, some shopping for
    the hard-to-find goods that can only be found in places such as this.
  sector: inside
  exits:
    east:
      to: tba:315:room:31533
    south:
      to: tba:315:room:31538
    west:
      to: tba:315:room:31531

"tba:315:room:31533":
  name: The Bazaar
  description: >
    The bazaar heads off into the east, west and south.  To the north, it butts up against a shop's
    wall.
  sector: inside
  exits:
    east:
      to: tba:315:room:31534
    south:
      to: tba:315:room:31539
    west:
      to: tba:315:room:31532

"tba:315:room:31534":
  name: The Bazaar
  description: >
    This bazaar is known far and wide as the largest and most popular attraction in McGintey Cove, a
    real tourist attraction.  Vendors come from all over the world to sell their goods here, hoping to find
    an open spot on the stone to set up shop.  You may leave the bazaar to the north onto East Main, or
    head off into the bazaar in any other direction.
  sector: inside
  exits:
    north:
      to: tba:315:room:31528
    east:
      to: tba:315:room:31535
    south:
      to: tba:315:room:31540
    west:
      to: tba:315:room:31533

"tba:315:room:31535":
  name: The Bazaar
  description: >
    You stand at the northeast corner of the bazaar.  You may head south or west into the bazaar or
    browse the goods offered at this locale.
  sector: inside
  exits:
    south:
      to: tba:315:room:31541
    west:
      to: tba:315:room:31534

"tba:315:room:31536":
  name: The Bazaar
  description: The bazaar's noise and smells surround you, washing around you in an endless blur.
  sector: inside
  exits:
    north:
      to: tba:315:room:31530
    east:
      to: tba:315:room:31537
    south:
      to: tba:315:room:31542

"tba:315:room:31537":
  name: The Bazaar
  description: >
    It is easy see how one could spend a whole day in this one section of the city, browsing and
    shopping for goods which are offered by these fine men and woman from all corners of the land.
  sector: inside
  exits:
    north:
      to: tba:315:room:31531
    east:
      to: tba:315:room:31538
    south:
      to: tba:315:room:31543
    west:
      to: tba:315:room:31536

"tba:315:room:31538":
  name: The Bazaar
  description: The bazaar surrounds you in every direction, vendors call out to you from all sides.
  sector: inside
  exits:
    north:
      to: tba:315:room:31532
    east:
      to: tba:315:room:31539
    south:
      to: tba:315:room:31575
    west:
      to: tba:315:room:31537

"tba:315:room:31539":
  name: The Bazaar
  description: >
    You may head in any direction from here into more of the bazaar, or browse the good this fine
    merchant sells.
  sector: inside
  exits:
    north:
      to: tba:315:room:31533
    east:
      to: tba:315:room:31540
    south:
      to: tba:315:room:31576
    west:
      to: tba:315:room:31538

"tba:315:room:31540":
  name: The Bazaar
  description: >
    Bright colors, men and women calling their salespitches over the din, this place is enough to give
    the most stalwart man a headache.
  sector: inside
  exits:
    north:
      to: tba:315:room:31534
    east:
      to: tba:315:room:31541
    south:
      to: tba:315:room:31546
    west:
      to: tba:315:room:31539

"tba:315:room:31541":
  name: The Bazaar
  description: >
    You stand at far eastern side of the bazaar.  You may go south, north or west into more of the
    bazaar.
  sector: inside
  exits:
    north:
      to: tba:315:room:31535
    south:
      to: tba:315:room:31547
    west:
      to: tba:315:room:31540

"tba:315:room:31542":
  name: The Bazaar
  description: >
    You stand at the western side of the bazaar.  You may head east, north or south into the bazaar
    from here.
  sector: inside
  exits:
    north:
      to: tba:315:room:31536
    east:
      to: tba:315:room:31543
    south:
      to: tba:315:room:31548

"tba:315:room:31543":
  name: The Bazaar
  description: >
    The bazaar surrounds you on all sides.  You may head in any direction into this crazy managerie of
    goods.
  sector: inside
  exits:
    north:
      to: tba:315:room:31537
    east:
      to: tba:315:room:31544
    south:
      to: tba:315:room:31549
    west:
      to: tba:315:room:31542

"tba:315:room:31544":
  name: The Bazaar
  description: >
    Every size and shape of being is here, shopping in harmony.  Looks like maybe shopping is the
    universal language.  You may head in any direction from your current position.
  sector: inside
  exits:
    north:
      to: tba:315:room:31577
    east:
      to: tba:315:room:31545
    south:
      to: tba:315:room:31550
    west:
      to: tba:315:room:31543

"tba:315:room:31545":
  name: The Bazaar
  description: >
    All around are men and women trying their damndest to get you to buy their products.  This is quite
    an exciting place.
  sector: inside
  exits:
    north:
      to: tba:315:room:31578
    east:
      to: tba:315:room:31546
    south:
      to: tba:315:room:31551
    west:
      to: tba:315:room:31544

"tba:315:room:31546":
  name: The Bazaar
  description: >
    The bazaar, surrounding you from every side, seems to close in on you.  The people, the noise,
    smell, the colors all shifting, blazing, burning before you. All the people, they seem to be staring at
    you, they seem to be laughing.  Your arms!  Your arms seem to be growing, they begin to drag on the
    ground and your jaw - for the love of Pete!  You jaw has elongated to the point that it is resting on
    your chest even though your head is held high.  Now the whole bazaar is laughing, laughing,
    laughing...  Just kidding.  A bit of crowd claustrophobia there.
  sector: inside
  exits:
    north:
      to: tba:315:room:31540
    east:
      to: tba:315:room:31547
    south:
      to: tba:315:room:31552
    west:
      to: tba:315:room:31545

"tba:315:room:31547":
  name: The Bazaar
  description: The bazaar heads south, north and east from here.
  sector: inside
  exits:
    north:
      to: tba:315:room:31541
    south:
      to: tba:315:room:31553
    west:
      to: tba:315:room:31546

"tba:315:room:31548":
  name: The Bazaar
  description: >
    You stand at the far southwest edge of the bazaar.  A large, tall building's wall is just south of
    you, and the city wall is west of you.  You may head into the bazaar to the north and east.
  sector: inside
  exits:
    north:
      to: tba:315:room:31542
    east:
      to: tba:315:room:31549

"tba:315:room:31549":
  name: The Bazaar
  description: >
    The bazaar, probably one of the many reasons people visit McGintey Cove, heads off to the north,
    east and west.  You may exit the bazaar to the south onto West Main.
  sector: inside
  exits:
    north:
      to: tba:315:room:31543
    east:
      to: tba:315:room:31550
    south:
      to: tba:315:room:31555
    west:
      to: tba:315:room:31548

"tba:315:room:31550":
  name: The Bazaar
  description: >
    You stand at the southern end of the bazaar.  A building wall is to your south, the bazaar
    stretches out to the north, east and west.
  sector: inside
  exits:
    north:
      to: tba:315:room:31544
    east:
      to: tba:315:room:31577
    west:
      to: tba:315:room:31549

"tba:315:room:31551":
  name: The Bazaar
  description: >
    You are at the south end of the bazaar.  You may head in any direction but south, which is the
    north wall of a business facing Main St.
  sector: inside
  exits:
    north:
      to: tba:315:room:31545
    east:
      to: tba:315:room:31552
    west:
      to: tba:315:room:31550

"tba:315:room:31552":
  name: The Bazaar
  description: >
    The bazaar, home to more than twenty five different marchants from all corners of Dibrova is a
    twenty four hour, seven day a week managerie of sights and sounds, most of which coming from the colorful
    people who push their goods here.  You may exit onto East Main to the south or head out into the
    bazaar in any other direction.
  sector: inside
  exits:
    north:
      to: tba:315:room:31546
    east:
      to: tba:315:room:31553
    south:
      to: tba:315:room:31558
    west:
      to: tba:315:room:31551

"tba:315:room:31553":
  name: The Bazaar
  description: >
    Your stand at the far southeastern corner of the bazaar.  Looking north and west, it seems that the
    bazaar must go on forever.
  sector: inside
  exits:
    north:
      to: tba:315:room:31547
    west:
      to: tba:315:room:31552

"tba:315:room:31554":
  name: Harbor Cove Apartments
  description: >
    This small reception area is the leasing office for this complex.  Any player who wishes to rent a
    home here will need to fill out an application for lease and leave a deposit of one hundred fifty
    gold coins.  Type LEASE to fill out an application.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:315:room:31555

"tba:315:room:31555":
  name: West Main
  description: >
    The road heads north into the bazaar, a huge open court full of vendors from every part of the
    world, plying their goods.  To the south the road continues with shops on either side.  East of you is
    the Green Leaf, a local dining facility.
  sector: inside
  exits:
    north:
      to: tba:315:room:31549
    east:
      to: tba:315:room:31556
    south:
      to: tba:315:room:31560

"tba:315:room:31556":
  name: The Green Leaf
  description: >
    This large, clean restaurant offers a variety of foods, most of them the common fare most people
    from this area would be used to.  Looks as if the tourist trade does not touch this homey little place,
    and for that reason most locals like it here best.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31555

"tba:315:room:31557":
  name: The Parchment Place
  description: >
    This run-down, hole in the wall, flea bag dive is home to a failing business which is failing only
    because of it's lack of variety and it's competition located in the guild area.  The scrolls offered
    are of fine quality and work with almost every use, but the scrolls offered are not popularly needed.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31558

"tba:315:room:31558":
  name: East Main
  description: >
    The road heads north into the bazaar or south into the main section of town. To the west is a very
    ill-kept business with a faded and peeling sign hanging crooked over the door proclaiming it the
    Parchment Place.  The way is impassable to the east, a steep hill runs up for quite some distance to the
    Wharf, the high class section of town.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:315:room:31552
    south:
      to: tba:315:room:31563
    west:
      to: tba:315:room:31557

"tba:315:room:31559":
  name: Fatima's Footwear
  description: >
    Fatima seems to run a orderly, neat store.  All the shoes are kept clean and shined, all placed
    strategically on shelves so as to give the customer the best angle on them.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31560

"tba:315:room:31560":
  name: West Main
  description: >
    The road heads north and south from here.  In the distance to the north the road leads into the
    bazaar and south the road heads into an intersection with South St.  East of you is the jeweler and west
    is Fatima's Footwear.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:315:room:31555
    east:
      to: tba:315:room:31561
    south:
      to: tba:315:room:31566
    west:
      to: tba:315:room:31559

"tba:315:room:31561":
  name: The Jeweler
  description: >
    Many exotic jewels lay in glass displays on velvet cushions of contrasting color.  The colors are
    dazzling to the eye, and the temptation to rob this poor schmuck is almost overpowering.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    west:
      to: tba:315:room:31560

"tba:315:room:31562":
  name: Hospital
  description: >
    This small one room whitewashed building houses just enough equipment to heal any standard health
    issues.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:315:room:31568

"tba:315:room:31563":
  name: East Main
  description: >
    The road runs north toward the bazaar or south past an intersection with South St toward the Docks.
  sector: inside
  exits:
    north:
      to: tba:315:room:31558
    east:
      to: tba:315:room:31564
    south:
      to: tba:315:room:31569

"tba:315:room:31564":
  name: The Watering Hole
  description: >
    Barrels are stacked neatly along the north wall, canteens hang from straps along the south wall,
    and behind the counter are flasks and cups of varying shapes and colors.  Some kind of large machine,
    most probably used to distill sea water into drinking water sits back behind the counter.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:315:room:31563

"tba:315:room:31565":
  name: South Street
  description: >
    The street heads west into the guild area or east into the main business sections of McGintey Cove.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31566
    west:
      to: tba:316:room:31666

"tba:315:room:31566":
  name: West Main and South St
  description: >
    The streets head off in all directions.  To the eastand north, the street goes further into the
    business sections of McGintey Cove.  South of here begins the area of town known as the Docks, where all
    the sea vessels are built and most sailors stay when in port.  To the west the street heads into the
    Guild area.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:315:room:31560
    east:
      to: tba:315:room:31567
    south:
      to: tba:315:room:31571
    west:
      to: tba:315:room:31565

"tba:315:room:31567":
  name: South Street
  description: >
    The street heads east and west from here.  To the south is a small shop which sells all manner of
    hand wear.  The street here seems a bit dirtier, less kept up than the streets at the north end of
    town near the gates, almost dingy.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:315:room:31568
    south:
      to: tba:315:room:31572
    west:
      to: tba:315:room:31566

"tba:315:room:31568":
  name: South St
  description: >
    The road, seeming a bit dark and gloomy at this end of town, heads east and west from here.  To the
    north is a small hospital.
  sector: inside
  exits:
    north:
      to: tba:315:room:31562
    east:
      to: tba:315:room:31569
    west:
      to: tba:315:room:31567

"tba:315:room:31569":
  name: East Main and South St
  description: >
    The two main streets intersect here, heading off im every direction.  South lies the Dock area,
    east heads uphill into the high class area of town, the Wharf, and north and west lead deeper into the
    main business district.
  sector: inside
  exits:
    north:
      to: tba:315:room:31563
    east:
      to: tba:315:room:31570
    south:
      to: tba:315:room:31573
    west:
      to: tba:315:room:31568

"tba:315:room:31570":
  name: South St
  description: >
    You have begun your ascent into the upper reaches of the high status section of McGintey Cove,
    known as the Wharf.  A warning to all who come this way.  No thievery is allowed here, no crimes are
    allowed to be committed, and all prices are very high.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:317:room:31732
    west:
      to: tba:315:room:31569

"tba:315:room:31571":
  name: West Main
  description: >
    The street is definitely a bit less kept up than the streets to the north. The road leads generally
    downhill, sometimes down steps toward to the sea shore where sailors roam about, looking for food
    stuffs or women, as is their wont.
  sector: inside
  exits:
    north:
      to: tba:315:room:31566
    south:
      to: tba:318:room:31801

"tba:315:room:31572":
  name: Gloveworks
  description: >
    Racks are scattered throughout the room, all with various sizes and shapes of gloves hanging from
    them.  In cabinets and on shelves are many types of gauntlets and glaives which would be too heavy to
    hang from a hook on the racks. It smells of frehly oiled metal and leather in here, a delightful
    combination for any seasoned adventurer such as yourself.
  sector: inside
  exits:
    north:
      to: tba:315:room:31567

"tba:315:room:31573":
  name: East Main
  description: >
    The road heads downhill into a much more scented section of town, the Docks. It smells of sea weed,
    raw fish and dirty bodied men of the sea.  The roads are covered in dirt and grime and the farther
    south you get, the worse the roads get.  Hard to believe that some of more high class people actually
    come through here.
  sector: inside
  exits:
    north:
      to: tba:315:room:31569
    south:
      to: tba:318:room:31804

"tba:315:room:31574":
  name: McGintey Teleporters
  description: >
    This establishment runs in direct competition with the Boat Station, being that this is a seaport
    town and all.  The prices offered here are substantially less than those found in most other towns,
    and the choices of travel are much less limited than the other, smaller inland towns.
  sector: inside
  exits:
    south:
      to: tba:315:room:31513

"tba:315:room:31575":
  name: McGintey Center Square
  description: >
    This area has been set aside for patrons of the bazaar and the common citizens to have a place for
    a peaceful rest away from all the noise and hustle of the city.  Pity that so many of the less
    fortunate make it their permanent place of residence.  Ah well, it's still a fine place to relax.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:315:room:31538
    east:
      to: tba:315:room:31576
    south:
      to: tba:315:room:31577

"tba:315:room:31576":
  name: McGintey Center Square
  description: >
    This area has been set aside for patrons of the bazaar and the common citizens to have a place for
    a peaceful rest away from all the noise and hustle of the city.  Pity that so many of the less
    fortunate make it their permanent place of residence.  Ah well, it's still a fine place to relax.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:315:room:31539
    south:
      to: tba:315:room:31578
    west:
      to: tba:315:room:31575

"tba:315:room:31577":
  name: McGintey Center Square
  description: >
    This area has been set aside for patrons of the bazaar and the common citizens to have a place for
    a peaceful rest away from all the noise and hustle of the city.  Pity that so many of the less
    fortunate make it their permanent place of residence.  Ah well, it's still a fine place to relax.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:315:room:31575
    east:
      to: tba:315:room:31578
    south:
      to: tba:315:room:31544

"tba:315:room:31578":
  name: McGintey Center Square
  description: >
    This area has been set aside for patrons of the bazaar and the common citizens to have a place for
    a peaceful rest away from all the noise and hustle of the city.  Pity that so many of the less
    fortunate make it their permanent place of residence.  Ah well, it's still a fine place to relax.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:315:room:31576
    south:
      to: tba:315:room:31545
    west:
      to: tba:315:room:31577

"tba:315:room:31579":
  name: Town Meeting Hall
  description: >
    This Hall has been used for many years as the center for the development of McGintey Cove and its
    laws, plus as the shouting house for the people of the town.  Monthly meetings are still held by
    either the town mayor or the immortal sponsor for this town.  The upper reaches of this fine place hold
    the various board rooms for McGintey Cove.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:315:room:31512
    up:
      to: tba:315:room:31580

"tba:315:room:31580":
  name: Reading Room
  description: >
    This is the place where players may post messages to other players, or to the Gods or just post
    whatever might be on their mind in general.  This is not a board to be used to post flames, if a message
    is considered to be a flame it will be removed immediately.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    east:
      to: tba:315:room:31582
    west:
      to: tba:315:room:31581
    down:
      to: tba:315:room:31579

"tba:315:room:31581":
  name: Quest Room
  description: >
    This is where most quests will begin, unless a different room from another hometown is chosen
    instead.  The board here is intended to be used by players to talk about quests, request quests, or
    suggest new quests.  Feel free to post any suggestions you may have.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    east:
      to: tba:315:room:31580

"tba:315:room:31582":
  name: Suggestion Room
  description: >
    This is where players can post their wants, needs and desires in terms of additions to Dibrova.  We
    encourage all players to give input regarding any and all aspects of the game, we want to make this
    a game for everyone, so don't be shy!
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    west:
      to: tba:315:room:31580
