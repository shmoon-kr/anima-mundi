# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 54.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:54:room:5400":
  name: The Entrance To The Dancing Daemon Inn
  description: >
    You find yourself in an entrance foyer to the Dancing Daemon Inn. Chrome plated stairs spiral up to
    the reception area.  To the south you hear the sounds of merriment and drinking and from the west
    you hear the bustling activity of New Thalos.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:54:room:5402
      look: You see people dancing and drinking.
    west:
      to: tba:54:room:5420
      look: You see people walking by on Sultan's Walk.
    up:
      to: tba:54:room:5401
      look: The spiral stairs lead up to the reception area.

"tba:54:room:5401":
  name: The Reception Area
  description: >
    You are now standing in the reception of New Thalos.  A huge mahogany desk is here along with two
    sofas and a coffee table covered in magazines. The plush carpeting under your feet is a nice change
    from the rugged paths you are used to travelling.  A chrome stairway spirals downstairs to the tavern
    of the Dancing Daemon Inn, and your future adventures in New Thalos.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    down:
      to: tba:54:room:5400
      look: The stairs lead down to the Daemon.

"tba:54:room:5402":
  name: The Dancing Daemon Inn
  description: >
    A huge circling wet-bar takes up most of the east end of the Daemon.  An old mage reclines against
    the mirror behind the bar absentmindedly pouring several drinks at once with his refined
    telekinesis.  The Lokettes, a local band, are playing their usual gig on the stage.  The large booths along the
    all are filled with people drinking and having a grand time.  You feel like partying here. The only
    obvious exit is to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:54:room:5400
      look: You see the entrance to the Daemon.
  extras:
  - keywords: [bar]
    text: >
      The bar looks slightly out of place and you can only assume the powerful magic of the bartender
      allows it to revolve.

"tba:54:room:5403":
  name: The Medina
  description: >
    You stand on the Medina, on the larger open areas in New Thalos. People walk to and fro carrying on
    their day to day business.  The Common Square of the people opens up to the south and the Medina
    continues north.
  sector: city
  exits:
    north:
      to: tba:54:room:5404
      look: You see Medina.
    south:
      to: tba:54:room:5410
      look: You see the Common Square.

"tba:54:room:5404":
  name: The Medina
  description: >
    You are walking along a wide open expanse of road connecting Market Square to the Common Square. 
    Panhandlers, beggars, and other such riff-raff wander about hoping to catch those few who with open
    hearts.  The Medina continues to the south and the Market Square spreads out to the north.
  sector: city
  exits:
    north:
      to: tba:54:room:5405
      look: You see Market Square.
    south:
      to: tba:54:room:5403
      look: You see the Medina.

"tba:54:room:5405":
  name: Southern Market Square
  description: >
    The large square of markets fills your vision.  Strange sights and sounds, those known only to the
    New Thalos market, barrage your senses. The only hope of making any sense of what is going on here is
    to wander around.  Market Square continues north, west, and east, with the Medina trailing off th
    the south.
  sector: city
  exits:
    north:
      to: tba:54:room:5406
    east:
      to: tba:54:room:5407
    south:
      to: tba:54:room:5404
    west:
      to: tba:54:room:5408

"tba:54:room:5406":
  name: The Center Of Market Square
  description: >
    You are standing in the center of Market Square, the famous square of New Thalos.  A large,
    peculiar looking statue is standing in the middle of the square.  The square extends in every direction.
  sector: city
  exits:
    north:
      to: tba:54:room:5415
    east:
      to: tba:54:room:5417
    south:
      to: tba:54:room:5405
    west:
      to: tba:54:room:5409
  extras:
  - keywords: [statue]
    text: >
      Before you is a statue of the mighty beholder!  A great beast with multiple eyes and wicked... 
      Wicked...  Um....  Eyes...  The mighty beholder is in Excellent condition.

"tba:54:room:5407":
  name: Southeastern Market Square
  description: >
    In this corner of the market some of the largest warriors in the land tower over you.  It is easy
    to understand why they hang out here once you notice the weapon shop and the armory close by.  Perhaps
    you might stop in and take a look at the wares these shops have to offer.
  sector: city
  exits:
    north:
      to: tba:54:room:5417
    east:
      to: tba:55:room:5529
    south:
      to: tba:55:room:5536
    west:
      to: tba:54:room:5405

"tba:54:room:5408":
  name: Southwestern Market Square
  description:
  - >
    This area of the market seems relatively quiet, save the high pitch banter of the shopkeepers
    attempting to lure you into their stores. South you see the bread stand and west is the entrance to the
    general store.
  - The market's sprawl continues east and north of here.
  sector: city
  exits:
    north:
      to: tba:54:room:5409
    east:
      to: tba:54:room:5405
    south:
      to: tba:55:room:5535
      look: You see the grocer's.
    west:
      to: tba:55:room:5528
      look: You see the general store.

"tba:54:room:5409":
  name: Western Market Square
  description:
  - >
    This area of the square seems a bit more subdued than the rest. You notice that most of the outland
    adventurers mill around the southern end of the market, while the townfolk seem to keep their
    business in the northern end.
  - >
    West Main street begins here and heads for the gate, the market's expanse fills the other
    directions.
  sector: city
  exits:
    north:
      to: tba:54:room:5414
    east:
      to: tba:54:room:5406
    south:
      to: tba:54:room:5408
    west:
      to: tba:54:room:5426

"tba:54:room:5410":
  name: The Common Square
  description: >
    People pass by talking to each other, or rest their weary bones on this grassy field.  You can hear
    faint sounds of the river to the south of you as it passes through the city.  Ishtar drive heads
    east and west from here and the Medina is to the north.  South lies the River Ishtar Bridge and the
    southern gate.
  sector: city
  exits:
    north:
      to: tba:54:room:5403
      look: You see the medina.
    east:
      to: tba:54:room:5437
    south:
      to: tba:54:room:5412
      look: You see the bridge over the river.
    west:
      to: tba:54:room:5436

"tba:54:room:5411":
  name: Outside The Southern Gate Of New Thalos
  description:
  - >
    You see before you the expanse of the Great Eastern Desert. You have heard many tales of the Great
    Pyramid, the lost city of Old Thalos and the friendly brass dragon that lies under the desert.
  - To the south lies the desert and the city of New Thalos is to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:54:room:5413
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked
    south:
      to: tba:50:room:5039

"tba:54:room:5412":
  name: The Southern Bridge
  description: >
    Walking over the bridge you see the rushing waters of the River Ishtar.  To the south you see the
    Southern Gate of New Thalos and the Common Square stretches out to the north
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:54:room:5410
    south:
      to: tba:54:room:5413
    down:
      to: tba:54:room:5485

"tba:54:room:5413":
  name: Inside The South Gate Of New Thalos
  description: >
    Two large stone towers rise up to greet you with the massive iron gate swinging on ornately crafted
    hinges and emblazoned with the crest of New Thalos.  The makers of the city spared no expense in
    rebuilding the defenses or their home.  The River Ishtar bridge lies to the north and the desert to the
    south.
  sector: city
  exits:
    north:
      to: tba:54:room:5412
    south:
      to: tba:54:room:5411
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked

"tba:54:room:5414":
  name: Northwestern Market Square
  description: >
    This corner of the market contains some of the most civilized folk in New Thalos.  To the north
    lies the humble store of the merchant Ahkeem, his weavings known to be the best in the city.  West of
    here is the entrance to the First Royal Bank of New Thalos.
  sector: city
  exits:
    north:
      to: tba:55:room:5514
    east:
      to: tba:54:room:5415
    south:
      to: tba:54:room:5409
    west:
      to: tba:55:room:5521

"tba:54:room:5415":
  name: Northern Market Square
  description: >
    You stand in one of the most heavily used parts of town.  To the north lies the Palace of New
    Thalos and the Casbah, east west and south of here the busy market thrives with life.
  sector: city
  exits:
    north:
      to: tba:54:room:5418
    east:
      to: tba:54:room:5416
    south:
      to: tba:54:room:5406
    west:
      to: tba:54:room:5414

"tba:54:room:5416":
  name: Northeastern Market Square
  description: >
    Pandemonium.  Chaos.  Madness.  A few other choice words come to mind as you gaze into this corner
    of the market.  The vegetable stand seems quiet enough so you have to assume the noise comes from the
    Butchery. You have to think for a while before you muster the will to enter this shop.  The market
    continues to the south and west.
  sector: city
  exits:
    north:
      to: tba:55:room:5515
    east:
      to: tba:55:room:5522
    south:
      to: tba:54:room:5417
    west:
      to: tba:54:room:5415

"tba:54:room:5417":
  name: Eastern Market Square
  description: >
    You stand in the market of New Thalos, the gem of the desert.  The market is the hub of the city,
    all trade and commerce of any significance is carried on here.  The market spreads out in all
    directions save east, here Main Street heads for the easter gate.
  sector: city
  exits:
    north:
      to: tba:54:room:5416
    east:
      to: tba:54:room:5427
    south:
      to: tba:54:room:5407
    west:
      to: tba:54:room:5406

"tba:54:room:5418":
  name: Sultan's Walk
  description: >
    This cobblestone road aides your journey through town.  Traveling north will take you by the Palace
    and the Dancing Daemon Inn, and south will put you on Market Square.
  sector: city
  exits:
    north:
      to: tba:54:room:5419
    south:
      to: tba:54:room:5415

"tba:54:room:5419":
  name: Sultan's Walk
  description:
  - >
    This part of the road travels between one of the sturdy walls of the Palace and the Dancing
    Daemon.  To the east you peer through a small window into the Daemon, seeing many people dancing and
    drinking. After you tend to your other chores you plan on visiting the Daemon.
  - The walk continues north and south from here.
  sector: city
  exits:
    north:
      to: tba:54:room:5420
    south:
      to: tba:54:room:5418

"tba:54:room:5420":
  name: Sultan's Walk
  description: >
    The road here between the Palace and the Dancing Daemon Inn seems well worn by the travel of
    horses, carts, and leather boots.  From the west you hear the faint sound of trumpets announcing the
    arrival of some duke or duchess to the Palace.  Safe haven awaits you to the east in the halls of the
    Daemon, and Sultan's Walk continues north and south.
  sector: city
  exits:
    north:
      to: tba:54:room:5421
    east:
      to: tba:54:room:5400
    south:
      to: tba:54:room:5419
    west:
      to: tba:55:room:5558

"tba:54:room:5421":
  name: Sultan's Walk
  description: >
    The main road north from the square continues here, surrounded by the walls of the Palace and the
    Daemon.  To the north you see the heavily guarded gate and can make out faint sounds of trade to the
    south.
  sector: city
  exits:
    north:
      to: tba:54:room:5422
    south:
      to: tba:54:room:5420

"tba:54:room:5422":
  name: Inside The Northern Gate Of New Thalos
  description:
  - >
    Two large stone towers rise up to greet you with a massive iron gate swinging between on ornately
    crafted hinges and emblazend with the crest of New Thalos.  The makers of this city spared no costs in
    rebuilding the defenses of their home.
  - >
    Sultan's Walk runs to the south and the Casbah stretches out east and west.  To the north is
    wilderness.
  sector: city
  exits:
    north:
      to: tba:55:room:5567
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked
    east:
      to: tba:54:room:5449
    south:
      to: tba:54:room:5421
    west:
      to: tba:54:room:5448

"tba:54:room:5423":
  name: Inside The West Gate Of New Thalos
  description:
  - >
    Two large stone towers embedded in the wall loom over you.  The massive iron gate, emblazoned with
    the crest of New Thalos, swings easily on four ornately crafted hinges.  It is obvious the makers of
    this city spared no expense in protecting their home.
  - >
    Main street heads towards the market eastward and the wilderness beckons from the west.  To the
    south lies the entrance the Warriors' Guild.
  sector: city
  flags: [no_mob]
  exits:
    east:
      to: tba:54:room:5424
    south:
      to: tba:55:room:5526
    west:
      to: tba:55:room:5569
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked

"tba:54:room:5424":
  name: West Main Street
  description: >
    This is the main road traveling though the city.  To the south you hear the hammering of the repair
    shop and to the north is the grassy field known as Temple Square.  Main street continues east and
    west.
  sector: city
  exits:
    north:
      to: tba:55:room:5520
    east:
      to: tba:54:room:5425
    south:
      to: tba:55:room:5527
    west:
      to: tba:54:room:5423

"tba:54:room:5425":
  name: West Main Street
  description: >
    A foreman stands stand here watching over two construction workers fixing a pothole.  The road here
    branches off north and south into two alleys behind the stores of the market.  The main street
    continues east and west from here.
  sector: city
  exits:
    north:
      to: tba:54:room:5471
    east:
      to: tba:54:room:5426
    south:
      to: tba:54:room:5472
    west:
      to: tba:54:room:5424

"tba:54:room:5426":
  name: West Main Street
  description: >
    You are strolling on the street between the bank and general store. To the west you hear a roadcrew
    at work and to the east, the sounds of commerce taking place.  The air is filled with the smell of
    gold and riches. On the wall of the store is a poster.
  sector: city
  exits:
    east:
      to: tba:54:room:5409
    west:
      to: tba:54:room:5425
  extras:
  - keywords: [poster]
    text: >
      The poster is of a wealthy looking man in red robes smiling at you.  The caption reads: THE SULTAN
      REMINDS YOU TO PAY YOUR TAXES!

"tba:54:room:5427":
  name: East Main Street
  description: >
    Here on East Main, you smell the odor of freshly slaughtered meat and, hear the pounding of new
    metal from the armory.  The Square is to the west and a junction is to the East.
  sector: city
  exits:
    east:
      to: tba:54:room:5428
    west:
      to: tba:54:room:5417

"tba:54:room:5428":
  name: East Main Street
  description: >
    You are on East Main Street.  To the North is the beginning of Guildsman Row.  To the South is a
    dark alley.  The road also continues to the East. There is a small sign on a wire hanging across the
    junction.
  sector: city
  exits:
    north:
      to: tba:54:room:5464
    east:
      to: tba:54:room:5429
    south:
      to: tba:54:room:5465
    west:
      to: tba:54:room:5427
  extras:
  - keywords: [sign]
    text:
    - "The sign reads:"
    - NO LOITERING!
    - (by order of the Sultan of New Thalos)

"tba:54:room:5429":
  name: East Main Street
  description:
  - >
    As you walk by the mercenary guild a cold chill causes you to shiver uncontrollably.  You see some
    shady looking characters lurking about the entrance to this house of 'helpful' people.  Perhaps
    curiosity gets the best of you, but you wonder what could be going on inside.  To the north you see the
    open doors of the apothecary shop where one may buy many magical livations.
  - Main Street continues east and west from here.
  sector: city
  exits:
    north:
      to: tba:55:room:5523
    east:
      to: tba:54:room:5430
    south:
      to: tba:55:room:5530
    west:
      to: tba:54:room:5428

"tba:54:room:5430":
  name: East Main Street
  description: >
    The Main street through eastern New Thalos begins here and heads westward towards the marketplace. 
    One of the main gates can be seen to the east and Braheem's Magic Shop awaits your business to the
    north.
  sector: city
  exits:
    north:
      to: tba:55:room:5524
    east:
      to: tba:54:room:5431
    west:
      to: tba:54:room:5429

"tba:54:room:5431":
  name: Inside the Eastern Gate of New Thalos
  description:
  - >
    Two large stone towers imbedded in the wall loom over you.  The massive iron gate, emblazened with
    the crest of New Thalos, swings easily on four ornately crafted hinges.  It is obvious the makers of
    this city spared no expense in protecting their home.
  - >
    Main street heads towards the market westward and the wilderness beckons from the east.  To the
    north lies the entrance to the Mages' Guild.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:55:room:5525
    east:
      to: tba:55:room:5568
      door:
        keywords: [gate]
        kind: door
        key: tba:54:obj:5401
        reset: locked
    west:
      to: tba:54:room:5430

"tba:54:room:5432":
  name: Cassandra's Catch Of The Day
  description: >
    Nothing in your life has prepared you for the odor which fills your lungs.  Not wanting to offend
    the beautiful shopkeeper you hold your tongue and quietly look over her selection.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:54:room:5441

"tba:54:room:5433":
  name: West Ishtar Drive
  description: >
    This is the warehouse district of New Thalos.  Strong men walk back and forth from the docks to the
    warehouse carrying large crates loading and unloading the boats as they sail down the river.  To the
    north is one of the entrances of the warehouse and West Ishtar leads east.
  sector: city
  exits:
    north:
      to: tba:55:room:5540
    east:
      to: tba:54:room:5434

"tba:54:room:5434":
  name: West Ishtar Drive
  description: >
    A few men walk by almost pushing you out of the way as they go about their business of loading and
    unloading the boats.  An entrance to one of the huge warehouses of New Thalos is to the north and the
    River Ishtar quietly flows by to the south.  Ishtar Drive continues east and west.
  sector: city
  exits:
    north:
      to: tba:55:room:5541
    east:
      to: tba:54:room:5435
    west:
      to: tba:54:room:5433

"tba:54:room:5435":
  name: West Ishtar Drive
  description:
  - >
    The cobblestone road is moist here, the trail of water heading down to the boat ramp.  Catching
    your balance as you start to slide on the slick pavement you grab on to the handrail someone has
    conveniently placed here.
  - To the north is the Shipwright and Ishtar Drive continues east and west.
  sector: city
  exits:
    north:
      to: tba:55:room:5542
    east:
      to: tba:54:room:5436
    south:
      to: tba:54:room:5443
    west:
      to: tba:54:room:5434

"tba:54:room:5436":
  name: West Ishtar Drive
  description: >
    A cool breeze blows up off the river chilling the sweat otherwise present on your skin.  Orders and
    sometimes curses can be heard from the west in the direction of the warehouses.  The common square
    opens up to the east and Ishtar Drive continues west.
  sector: city
  exits:
    east:
      to: tba:54:room:5410
    west:
      to: tba:54:room:5435

"tba:54:room:5437":
  name: East Ishtar Drive
  description:
  - >
    Loud hammering and the sound of red hot iron cooling in water reaches your ears as you stand in
    front of the blacksmith.  A small boy runs up to you with big eyes and, as you return his gaze, runs off
    down the road.
  - The common square can be seen to the west and Ishtar Drive continues to the east.
  sector: city
  exits:
    north:
      to: tba:55:room:5544
    east:
      to: tba:54:room:5439
    west:
      to: tba:54:room:5410

"tba:54:room:5438":
  name: East Ishtar Drive
  description: >
    The wide road bordering the south of town continues to the east west here, bordered only by the
    hay-loft to the north and the River Ishtar to the south.
  sector: city
  exits:
    east:
      to: tba:54:room:5440
    west:
      to: tba:54:room:5439

"tba:54:room:5439":
  name: East Ishtar Drive
  description: >
    Small clumps of hay strewn about the ground alerts you to the fact that you have reached the
    stables.  Arabian stallions as well as many other  fine breeds of horses can be purchased for a price. 
    Ishtar Drive continues east and west.
  sector: city
  exits:
    north:
      to: tba:55:room:5545
    east:
      to: tba:54:room:5438
    west:
      to: tba:54:room:5437

"tba:54:room:5440":
  name: East Ishtar Drive
  description: >
    Even in broad daylight, you can hardly see into the back alley that begins here and heads north. 
    Sounds of loud drunken folk and the occasional screaming cat emenate from the direction.  Luckily you
    have the choice of going east or west down the drive as well.
  sector: city
  exits:
    north:
      to: tba:54:room:5468
      look: You see murky darkness.
    east:
      to: tba:54:room:5441
    west:
      to: tba:54:room:5438

"tba:54:room:5441":
  name: East Ishtar Drive
  description: >
    Your highly acute sense of smell reports you have reached the entrance to the fish market. 
    Although renowned for it fresh catches and wide selection of aquarian delicacies you wonder how much longer
    you can endure the smell!  The River Ishtar flows alongside to the south with the drive running along
    side it east to west.
  sector: city
  exits:
    north:
      to: tba:54:room:5432
    east:
      to: tba:54:room:5442
    west:
      to: tba:54:room:5440

"tba:54:room:5442":
  name: East Ishtar Drive
  description: >
    The sound of squawking gulls and the smell of rotting fish gives you a hint of your location.  The
    River Ishtar flows south of you, but looks crystal clear, so it cannot be the source of this putrid
    smell. Looking north you notice a small sign hanging over the dump.
  sector: city
  exits:
    north:
      to: tba:55:room:5547
    west:
      to: tba:54:room:5441
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           #====================================================# | | | THE DUMP OF NEW
        THALOS | | | | | | ----- | | | | Enter at your own risk.  | | -the management |
        | | #====================================================#

"tba:54:room:5443":
  name: The Boat Ramp
  description: >
    This sloped slab of stone allows easy passage to and from the River Ishtar.  Boats are moored to
    the docks here awaiting their masters to return from the warehouses and the pubs.  The waters of the
    River Ishtar lap at your feet to the south and Ishtar Drive is to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:54:room:5435
    south:
      to: tba:54:room:5486

"tba:54:room:5444":
  name: West Casbah
  description: >
    The air takes on a somber note as you stand before the entrance to the jailhouse of New Thalos. 
    Hopefully you won't ever see this structure from the inside.  The northwest tower stands here with a
    spiral staircase leading up.  The Avenue ends here, only exiting to the east.
  sector: city
  exits:
    east:
      to: tba:54:room:5445
    south:
      to: tba:55:room:5553
      door:
        keywords: [gate]
        kind: pickproof
        key: tba:54:obj:5493
        reset: locked
    up:
      to: tba:55:room:5559

"tba:54:room:5445":
  name: West Casbah
  description:
  - >
    You have almost reached the end of the Avenue in this direction, the number of guards in this part
    of town is nearly doubled.  To the north the familiar city wall protects you from the wilderness. 
    Looking south marble stairs rise towards the entrance of city hall surrounded by massive white pillars.
  - The Avenue continues east and west from here.
  sector: city
  exits:
    east:
      to: tba:54:room:5446
    south:
      to: tba:55:room:5554
    west:
      to: tba:54:room:5444

"tba:54:room:5446":
  name: The Casbah
  description:
  - >
    The wall of the Palace curves south from here, a darkened alley runs along it in that direction. 
    West of here you see the steps of the City Hall and notice the increase in the number of guards.
  - To the east the Avenue continues.
  sector: city
  exits:
    east:
      to: tba:54:room:5447
    south:
      to: tba:54:room:5458
    west:
      to: tba:54:room:5445

"tba:54:room:5447":
  name: The Casbah
  description: >
    As you travel down the road towards towards the City Hall you look up at the guards walking along
    the wall keeping watch.  South of you stands the great walls of the Palace and the Avenue goes east
    and west.
  sector: city
  exits:
    east:
      to: tba:54:room:5448
    west:
      to: tba:54:room:5446

"tba:54:room:5448":
  name: The Casbah
  description: >
    The cobblestone pavement runs along the north wall here.  South of you stand the great walls of the
    Palace and the Avenue goes east and west.
  sector: city
  exits:
    east:
      to: tba:54:room:5422
    west:
      to: tba:54:room:5447

"tba:54:room:5449":
  name: The Casbah
  description: >
    The activity here is only slightly less than chaotic.  Young boys run to and fro with stern intent,
    and older gentleman swagger down the street towards the Library.  To the west you can see the tall
    towers of the northern gate, and the Avenue continues east.
  sector: city
  exits:
    east:
      to: tba:54:room:5450
    west:
      to: tba:54:room:5422

"tba:54:room:5450":
  name: The Casbah
  description:
  - >
    Walking along the cobblestone path you feel secure with the walls of the city towering over you. 
    You hear the scraping sounds of metal on stone and look up to see a large, strong guard looking out to
    the north.
  - >
    To the east lies the intersection on Guildsman's Row and the northern gate is a short walk to the
    west.
  sector: city
  exits:
    east:
      to: tba:54:room:5451
    west:
      to: tba:54:room:5449

"tba:54:room:5451":
  name: The Casbah
  description: >
    The din of the guilds assaults your senses as you reach this intersection, the sound of hammering,
    the smell of tanned leather, and the smoke rising from the smithy all rush up to greet you. The
    Avenue continues east and west from here and the Row leads south.
  sector: city
  exits:
    east:
      to: tba:54:room:5452
    south:
      to: tba:54:room:5460
    west:
      to: tba:54:room:5450

"tba:54:room:5452":
  name: The Casbah
  description:
  - >
    You walk between the solid stone wall of the city and that of the Masons' Guild.  Young children
    with their nannies walk around enjoying the saftey of the city.
  - The Avenue runs east and west from here.
  sector: city
  exits:
    east:
      to: tba:54:room:5453
    west:
      to: tba:54:room:5451

"tba:54:room:5453":
  name: The Casbah
  description:
  - >
    You have almost reached the end of the Avenue in this direction. Walking towards the north-east
    corner of the city you notice the population density here is much less then the rest of the town.  A few
    old men hobbling on canes and young men intent on studies are the only travelers of the path to the
    library on a regular basis.
  - The Avenue continues east and west from here.
  sector: city
  exits:
    east:
      to: tba:54:room:5454
    west:
      to: tba:54:room:5452

"tba:54:room:5454":
  name: The Casbah
  description:
  - >
    The Avenue ends here, turning south to become Kali Row.  Traveling in that direction will take you
    to the Library and the grand dance hall of the city.
  - The northeast tower of the wall is accessible here up a spiral staircase.
  sector: city
  exits:
    south:
      to: tba:54:room:5455
    west:
      to: tba:54:room:5453
    up:
      to: tba:55:room:5562

"tba:54:room:5455":
  name: Kali Row
  description: >
    This is a small, newly added section of the town.  The city's Library can be entered through the
    door to the west and the Casbah begins its journey a little ways north of here.  The Row and the
    entrance to the dancehall is to the south.
  sector: city
  exits:
    north:
      to: tba:54:room:5454
    south:
      to: tba:54:room:5456
    west:
      to: tba:55:room:5551

"tba:54:room:5456":
  name: Kali Row
  description:
  - The short Row ends abruptly here at the entrance to the dance hall of New Thalos.
  - The entrance to the hall is to the west and the Row continues northward.
  sector: city
  exits:
    north:
      to: tba:54:room:5455
    west:
      to: tba:55:room:5552

"tba:54:room:5457":
  name: Underground
  description: The small passage continues north and south.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:54:room:5478
    south:
      to: tba:54:room:5480

"tba:54:room:5458":
  name: Alley
  description: >
    This is a dark alley running between the Palace and City Hall.  Not a lot here, unless you're
    partial to spiders and rats.
  sector: city
  exits:
    north:
      to: tba:54:room:5446
    south:
      to: tba:54:room:5459

"tba:54:room:5459":
  name: Alley
  description: The alley ends here.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:54:room:5458
    down:
      to: tba:54:room:5475
      look: You see a manhole covering an opening in the road.
      door:
        keywords: [manhole, hole, man]
        kind: door
        reset: closed

"tba:54:room:5460":
  name: Guildsman's Row
  description:
  - >
    This Row is a hive of activity second only to the actual Market Square itself.  Along this row
    stands all the guilds of the working class citizens of New Thalos, here all the items sold in the Square
    are made.  Along this particular stretch of the row lie the Boyer/ Fletcher to the west and the
    Masons' to the east.
  - The Row leads off to the south and East Casbah is to the north.
  sector: city
  exits:
    north:
      to: tba:54:room:5451
    east:
      to: tba:55:room:5556
    south:
      to: tba:54:room:5461
    west:
      to: tba:55:room:5555

"tba:54:room:5461":
  name: Guildsman's Row
  description: >
    The guilds continue here, to the west is the Weavers' Guild, and to the east stands the Craftsmans'
    Guild.  The row of guilds continues north and south from here.
  sector: city
  exits:
    north:
      to: tba:54:room:5460
    east:
      to: tba:55:room:5507
    south:
      to: tba:54:room:5462
    west:
      to: tba:55:room:5506

"tba:54:room:5462":
  name: Guildsman's Row
  description:
  - >
    Only one guild offers its door to this stretch of the Row, the Tanners' Guild, to the west.  To the
    east is a beautifully sculpted marble door allowing entrance to the Museum of the Greater Gods.
  - The Row of Guilds leads north and south.
  sector: city
  exits:
    north:
      to: tba:54:room:5461
    east:
      to: tba:55:room:5511
    south:
      to: tba:54:room:5463
    west:
      to: tba:55:room:5564

"tba:54:room:5463":
  name: Guildsman's Row
  description:
  - >
    After the guilds were built the people of the city used some of the extra space to erect a shrine
    to their patron saints.  The result of this labor became the Museum of the Greater Gods.
  - You may enter the sacred hall to the east.
  sector: city
  exits:
    north:
      to: tba:54:room:5462
    east:
      to: tba:55:room:5516
    south:
      to: tba:54:room:5464

"tba:54:room:5464":
  name: Guildsman's Row
  description:
  - >
    This small cramped road is worn with travel as apprentices to the guilds run merchandise from the
    guildhouses to the shops on Market Square.
  - The guildhouses lie to the north and Main street is to the south.
  sector: city
  exits:
    north:
      to: tba:54:room:5463
    south:
      to: tba:54:room:5428

"tba:54:room:5465":
  name: Alley
  description: >
    Even with your light you cannot seem to penetrate the magical cloak of darkness covering this alley.
  sector: city
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:54:room:5428
    south:
      to: tba:54:room:5466

"tba:54:room:5466":
  name: Alley
  description: >
    Even with your light you cannot seem to penetrate the magical cloak of darkness covering this alley.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:54:room:5465
    east:
      to: tba:54:room:5467
    west:
      to: tba:55:room:5537

"tba:54:room:5467":
  name: Alley
  description: >
    Even with your light you cannot seem to penetrate the magical cloak of darkness covering this alley.
  sector: city
  flags: [dark]
  exits:
    east:
      to: tba:55:room:5538
    south:
      to: tba:54:room:5468
    west:
      to: tba:54:room:5466

"tba:54:room:5468":
  name: Alley
  description: >
    Even with your light you cannot seem to penetrate the magical cloak of darkness covering this alley.
  sector: city
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:54:room:5467
    south:
      to: tba:54:room:5440

"tba:54:room:5469":
  name: Alley
  description: >
    This is a tiny corner in the alley.  The temple walls are north and west.  You notice a fair amount
    of footprints to the east.
  sector: city
  flags: [dark]
  exits:
    east:
      to: tba:54:room:5470
    south:
      to: tba:54:room:5471
  extras:
  - keywords: [footprint]
    text: Kind of looks like a yeti has been here...  Hmmmm.

"tba:54:room:5470":
  name: Alley
  description: >
    This is a dead end to the tiny alley.  There is an unusual amount of wear apparent on the ground.
  sector: city
  flags: [dark]
  exits:
    west:
      to: tba:54:room:5469
    down:
      to: tba:54:room:5478
      look: You see a small iron circle imbedded in the ground.
      door:
        keywords: [manhole, man, hole]
        kind: door
        reset: closed

"tba:54:room:5471":
  name: Alley
  description: >
    You are in a tiny ally between the temple and the bank.  You hear some shouting and general
    roadwork to the south.  The ground is rough and in need of repair.  In the road is a small pothole.
  sector: city
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:54:room:5469
    south:
      to: tba:54:room:5425
  extras:
  - keywords: [pothole]
    text: Why are you looking in a pothole?  Are you poor or something?

"tba:54:room:5472":
  name: Alley
  description: >
    You are on a small alley between the repair shop and the general store.  Nothing much here but
    small rodents and dust.
  sector: city
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:54:room:5425
    south:
      to: tba:54:room:5473

"tba:54:room:5473":
  name: Alley
  description: >
    This is a small corner in the alley behind the warehouses and the guild of warriors.  You notice
    some small scrapings to the west.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:54:room:5472
    east:
      to: tba:54:room:5474

"tba:54:room:5474":
  name: Alley
  description: The alley ends here as do the footprints you had noticed earlier.
  sector: city
  flags: [dark]
  exits:
    west:
      to: tba:54:room:5473
    down:
      to: tba:54:room:5481
      look: You see a small round iron plate set in the ground.
      door:
        keywords: [manhole, man, hole]
        kind: door
        reset: closed

"tba:54:room:5475":
  name: Underground
  description: >
    You are in a small underground passage beneath the city.  You see a small glint of light from above
    and the passage continues south.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:54:room:5476
    up:
      to: tba:54:room:5459
      door:
        keywords: [man, hole, manhole]
        kind: door
        reset: closed

"tba:54:room:5476":
  name: Underground
  description: The passage continues north and south.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:54:room:5475
    south:
      to: tba:54:room:5477

"tba:54:room:5477":
  name: Underground
  description: The tunnel branches here going north, east, and west.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:54:room:5476
    east:
      to: tba:54:room:5478
    west:
      to: tba:54:room:5479

"tba:54:room:5478":
  name: Underground
  description: >
    The alley turns again here and heads south and west.  You notice a small glint of light from above.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:54:room:5457
    west:
      to: tba:54:room:5477
    up:
      to: tba:54:room:5470
      door:
        keywords: [manhole, man, hole]
        kind: door
        reset: closed

"tba:54:room:5479":
  name: Underground
  description: >
    The passage ends here and you hear some low chanting from the west. You also notice the clearing of
    dust on the ground but can't seem to find any door in that direction.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5477

"tba:54:room:5480":
  name: Underground
  description: The small passage continues north and south from here.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:54:room:5457
    south:
      to: tba:54:room:5481

"tba:54:room:5481":
  name: Underground
  description: >
    The small passage heads north and east from here.  You here the sounds of the city above you.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:54:room:5480
    east:
      to: tba:54:room:5482
    up:
      to: tba:54:room:5474
      door:
        keywords: [manhole, man, hole]
        kind: door
        reset: closed

"tba:54:room:5482":
  name: Underground
  description: The tunnel continues you west and east.  Hopefully you have a good sense of direction.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5492
    west:
      to: tba:54:room:5481

"tba:54:room:5483":
  name: River Ishtar
  description: >
    High above you on the top of the city wall guards look down to see if you wish to exit the city via
    water.  To do so they must open the iron grating in front  of you from above.  The horrid smell of
    the dump wafts down from the shore.
  sector: water_noswim
  exits:
    east:
      to: tba:56:room:5624
    west:
      to: tba:54:room:5484
      door:
        keywords: [grating]
        kind: door
        reset: closed

"tba:54:room:5484":
  name: River Ishtar
  description: >
    The gentle flow of the river carries you eastward, looking up you see couples strolling along the
    road.  To the west you see the southern bridge and to the east you see the iron grating protecting the
    city from unwanted guests.
  sector: water_noswim
  exits:
    east:
      to: tba:54:room:5483
      door:
        keywords: [grating]
        kind: door
        reset: closed
    west:
      to: tba:54:room:5485

"tba:54:room:5485":
  name: River Ishtar
  description: >
    You hear your voice echo as you float under the bridge above.  The city construction crews have
    just recently finished the small ladder giving common-folk easy access to the river.  To the west and
    east you see the river flowing by the city.
  sector: water_noswim
  exits:
    east:
      to: tba:54:room:5484
    west:
      to: tba:54:room:5486
    up:
      to: tba:54:room:5412

"tba:54:room:5486":
  name: River Ishtar
  description: >
    This part of the river seems alive with activity.  Boats moored to the docks near the ramp north of
    here make navigation a bit more trying. As the river flows eastward you can see the southern bridge
    in that direction.
  sector: water_noswim
  exits:
    north:
      to: tba:54:room:5443
    east:
      to: tba:54:room:5485
    west:
      to: tba:54:room:5487

"tba:54:room:5487":
  name: River Ishtar
  description: >
    The river flows through a huge iron grating from the wilderness through the city.  Strong guards
    above await word to open the portal should any citizen require exit or entry.
  sector: water_noswim
  exits:
    east:
      to: tba:54:room:5486
    west:
      to: tba:56:room:5623
      door:
        keywords: [grating]
        kind: door
        reset: closed

"tba:54:room:5488":
  name: A Dark Passage
  description: >
    You seem to have stumbled into a small hand made passage.  The wall to the west doesn't look quite
    right but searching it reveals no secret doors.  The only exit it seems is east.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5489

"tba:54:room:5489":
  name: A Dark Passage
  description: >
    The small passage continues east and west from here.  Again you notice something peculiar about the
    wall, this time to the north, but you fail to find any secret doors.  Voices can be faintly heard
    from the north.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5490
    west:
      to: tba:54:room:5488

"tba:54:room:5490":
  name: A Dark Passage
  description: The small passage continues west and east from here.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5491
    west:
      to: tba:54:room:5489
  extras:
  - keywords: [boulder]
    text: A huge boulder stands here.  In its center someone has carved out a perfect round hole.

"tba:54:room:5491":
  name: A Dark Passage
  description: >
    The small passage ends here for no apparent reason.  Looking around you find a small ladder half
    buried in the dirt.  setting it up you find a trap door in the ceiling.  The passage continues west
    from here.
  sector: city
  flags: [dark, indoors]
  exits:
    west:
      to: tba:54:room:5490
    up:
      to: tba:55:room:5570
      door:
        keywords: [secret]
        kind: door
        reset: closed
  extras:
  - keywords: [fire]
    text: >
      Moving closer you see this fire is actually FROZEN in place.  The flames still radiate heat, but
      are not actually burning.  Looking around you notice a small hole about the size of a piece of charcoal
      at the base of the flames.

"tba:54:room:5492":
  name: Underground
  description: The small passage continues west and east.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:54:room:5493
    west:
      to: tba:54:room:5482

"tba:54:room:5493":
  name: Underground
  description: The small passage continues west and east.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:55:room:5500
    west:
      to: tba:54:room:5492
