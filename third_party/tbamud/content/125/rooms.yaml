"tba:125:room:12507":
  name: Intersection of Main Street and High Street
  description: >
    You have come upon yet another intersection.  To the south you see main street and the Temple of
    Hannah.  High Street runs east and west from here. You are still amazed at the carnage that must have
    taken place here a long time age as skeletal remains are shoveled up into large piles everywhere. 
    Someone or something must really care about this city to be working so hard to clean it.
  sector: inside
  exits:
    east:
      to: tba:125:room:12529
    south:
      to: tba:125:room:12506
    west:
      to: tba:125:room:12508

