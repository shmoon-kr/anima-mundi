"tba:125:room:12564":
  name: Temporary Housing
  description: >
    Since the city was ransacked everyone has taken up temporary refuge in the temple.  Bunks line the
    walls and mattresses litter the floors.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:125:room:12563

