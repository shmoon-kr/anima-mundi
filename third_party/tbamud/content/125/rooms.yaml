"tba:125:room:12562":
  name: Hannah Bakery
  description: >
    You have entered a nicely decorated bakery.  Loaves of breads are displayed around the bakery in a
    caring way.  You see a large case filled with cookies and other sweet baked goods.  Mikel the baker
    smiles at you and asks if he may help you.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:125:room:12561

