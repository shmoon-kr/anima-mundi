"tba:125:room:12567":
  name: Taber's Butcher Shop
  description: >
    Large cabinets display juicy cuts of the finest meats you've ever seen. You notice a short fat man
    with a bloodstained apron on put down a large cleaver and approach you smiling.  He uncovers another
    cabinet and asks if he may help you in any way.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:125:room:12566

"tba:125:room:12568":
  name: Temple of Hannah General Store and Goods
  description: >
    You have entered a large general store.  Lots of new equipment hangs about the walls as if begging
    you to buy it.  The shopkeeper turns and smiles at you then returns to his work.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:125:room:12566

"tba:125:room:12569":
  name: Temple of Hannah Health Services
  description: >
    You have entered a room full of sick and injured people.  Teams of doctors and nurses move about
    the room at a rapid pace trying to treat everyone.  It is very cool here and although it is hectic you
    feel like you start to relax a little.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:125:room:12566

"tba:125:room:12595":
  name: Check Station in the Temple
  description: >
    You have been stopped at a guard post.  Fierce looking warriors stand here checking people as the
    pass through.  You notice one poor soul who was trying to sneak a weapon in brutally beaten and slain
    before you.  Suddenly one of the warriors turn towards you and motions you forward.  Several more
    guards enter the room from the guard barracks to the east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:125:room:12597
    east:
      to: tba:125:room:12598
    south:
      to: tba:125:room:12528

"tba:125:room:12596":
  name: A hall in the Temple
  description: >
    Pictures of ex-mayors line the walls.  A few townspeople wonder around here chatting with one
    another.  You notice that the hallway ends in the next room and splits off into two directions.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:125:room:12535
    south:
      to: tba:125:room:12597

"tba:125:room:12597":
  name: A hall in the Temple
  description: >
    Large picture windows line this hallway.  This is the first time you've been able to see the
    destruction that has occurred in the city.  The town is in complete ruins.  As you look below you see
    Assassins attacking Korreds and orcs wondering aimlessly through out town.  You wonder to yourself if this
    town will ever be the way it once was.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:125:room:12596
    south:
      to: tba:125:room:12595

"tba:125:room:12598":
  name: Temple Guards' Barracks
  description: >
    Beds full of slumbering guards line the walls as several guards walk around tending to their daily
    business.  You notice an arena at the far end of the barracks where several guards are sparring with
    each other.  A guard notices you and start to move towards you.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:125:room:12595
