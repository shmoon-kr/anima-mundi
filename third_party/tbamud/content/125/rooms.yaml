# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 125.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:125:room:12500":
  name: At the gates of the Grand City of Hannah
  description: >
    You have come to the entrance of the Grand City of Hannah.  The iron gates are rusted but still
    look sturdy.  You hear grunting noises and high pitched shrills coming from within the city.  You think
    to yourself that you need to be ready for anything as you enter the gates.  An old sign is here,
    depicting a map of the city.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:125:room:12501
      look: Nothing.
      door:
        keywords: [gateway]
        kind: door
        key: tba:125:obj:12500
        reset: locked
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builders  : Rhunter
        Zone         : 125 Hannah
        Began        : 1999
        Player Level : 7-10
        Rooms        : 75
        Mobs         : 20
        Objects      : 22
        Shops        : 4
        Triggers     : 1
        Theme        : A city that was slaughtered by orcs, goblins, and trolls.
        Notes        : The remaining citizens are hiding out in the temple while the
                       city guards are trying to clean up the streets.
        
        Zone: 125 was linked to the following zones:
        106 Elcardo                        at 12500 (south) ---> 10657
  - keywords: [map, sign]
    text:
      preformatted: |2
           +---------------+
           |###############|
           |#------#------#|
           |#------#------#|
           |#------#------#|
           |########^######|
           |#------#------#|
           |#------#------#|
           |#------#------#|
           |###############|
           +-------#-------+

