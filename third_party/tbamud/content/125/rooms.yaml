"tba:125:room:12504":
  name: Temple Square
  description: >
    You have reached the center most part of the city of Hannah.  Beautifully designed shops and
    marketplaces line the streets.  Although they are in ruins you can tell that someone took a lot of time
    designing and building them.  As you sit back and sip the cool, clear water from the fountain you
    silently wonder to yourself what kind of barbarians would destroy such a lovely place.
  sector: inside
  exits:
    north:
      to: tba:125:room:12505
    east:
