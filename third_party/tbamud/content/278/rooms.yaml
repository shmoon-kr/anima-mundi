"tba:278:room:27808":
  name: The Impassible Current
  description: >
    Oh my!  The current here is dragging the boat extremely hard.  No matter what you try to do, it
    won't stop churning!  Oh NO!  The current drags you and the boat down.
  sector: city
  flags: [no_mob, private]

