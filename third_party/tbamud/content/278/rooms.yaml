# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 278.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:278:room:27800":
  name: Ocean Pier
  description: >
    You are on what once was a very busy ocean pier.  With the advent of tele- portation, however, it
    is seldom used.  Stacks of lobster crates and fishnets lie along the walk, and the cutting, salty
    smell of the ocean stings your nose. You feel a sense of rejuvenation as you stare out into the sea.  You
    know many adventures lie ahead.
  sector: city
  exits:
    north:
      to: tba:278:room:27802
      look: To your north you can see the deep, wide ocean.
    west:
      look: To your west you can see a dark alley with a fishery.
  extras:
  - keywords: [fishnets, nets]
    text: >
      The fishnets are old and are turning into dust; large holes open to the sides.  They don't look
      sturdy enough to use.
  - keywords: [lobster, crates]
    text: The lobster crates are old and rotting; they look as if they couldn't hold a sardine.
  - keywords: [credits, info]
    text: >
      This is Oceania Proper, part one of a 5-part area called Oceania General. I have completed 2 pars
      of this area, and am giving itto the general public. All I ask is that you give me proper credit you
      may make any changes you feel are necessary, but try to keep it in the general theme I gave it. :) I'm
      giving it to you to use, not to copy. Questor, Lord of Water, StrangeMUD, sleepy.cc.utexas.edu 9332
      Kenneth Cavness. Oceania Proper, part 1 of a 5 part area. By Questor of StrangeMUD. Links: 00w
      alley/fishery 01n island/ship, 13e white beach, 18s pier on stilts

"tba:278:room:27801":
  name: In the Ocean
  description: >
    You are on the ocean.  Large waves rock the boat, and you have a hard time keeping it from going
    off-course.  You realize that this will be hard work. Seagulls chirp above, and whales spurt water far
    off into the horizon.  The wind blows constantly here.  You can go your south.  To your north, you
    notice a small island with a ship that appears to have been moored.  It looks board- able.
  sector: water_noswim
  exits:
    north:
      look: To your north you can see the entrance to a pirate's ship.
    south:
      to: tba:278:room:27802
      look: To your south you can see the deep, wide ocean.

