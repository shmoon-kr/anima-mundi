"tba:243:room:24325":
  name: A Cold Room
  description: >
    You're in a dark, cold room. The walls are made of worn stone, and frost covers everything. The low
    hanging ceiling seems ready to collapse. Bits of straw and wood are scattered out on the stone
    floor, and a burned out torch is on the wall. This reminds you of a meat locker.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    east:
