"tba:243:room:24320":
  name: Ski Hill Road
  description: >
    You're on a wide shovelled road. To the west you can see a fairly high hill, which must be the
    Cooland Ski Hill. To the east you can see a log cabin.
  sector: field
  exits:
    east:
      to: tba:243:room:24321
      look: The cabin is East.
    west:
      to: tba:243:room:24392
      look: The ski hill entrance is West.

"tba:243:room:24321":
  name: Log Cabin
  description: >
    You're in a warm log cabin. A roaring fireplace is set into the northern wall, and it has several
    chairs set around it. This room has a fairly high ceiling, and you can see two large chandeliers
    hanging from the rafters. Two windows look out onto the dark snowy plains to the south. A wide set of
    double doors leads to Cooland Ski Hill to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:243:room:24322
      look: The main path is East.
    west:
      to: tba:243:room:24320
      look: The bar is West.

