"tba:243:room:24306":
  name: In the Hills
  description: >
    You find yourself on a narrow path in between two hills. A bit of snow covers the ground here, as
    well as the two hills. To the north you can see a wide expanse of deep snow. You can see a very small
    hole leading into the eastern hill. A short wooden sign has been shoved into the ground beside the
    hill.
  sector: hills
  exits:
    north:
      to: tba:243:room:24311
      look: The trail continues North.
    east:
      to: tba:243:room:24307
      look: A small hole leads East.
    south:
      to: tba:243:room:24303
      look: The trail continues South.
  extras:
  - keywords: [sign]
    text:
    - "The sign reads:"
    - x---------------------------------x
    - "|   Beware of the strange beast   |"
    - "|   who lives inside this hole!   |"
    - x---------------------------------x

