    cozy feeling to the room. A long glass countertop is against the western wall, where hamburgers,
    french fries, and potato chips are sold. Long, wide tables are lined up in the middle of the room, with
    about a dozen chairs around each one. A beautifully carved double width stairway leads up to the
    lounge.  Surprisingly, this place is fairly empty.
