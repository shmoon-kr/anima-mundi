"tba:243:room:24390":
  name: Start of the advanced ski trail
  description: >
    You're on the advanced ski trail. Icy patches abound, rocks stick out of the snow, and huge jumps
    and bumps sit right in the middle of the trail. The slope is very steep. This place is definitely not
    for beginners. A thick forest blocks your way west and south.
  sector: field
  exits:
    north:
      to: tba:243:room:24385
      look: The main path is North.
    west:
      to: tba:243:room:24389
      look: The advanced trail continues West.

"tba:243:room:24391":
  name: Steep Cliff
  description: >
    Oops. You didn't read the sign, did you? As you go south, your feet slip right off the edge of the
    cliff. Now you're plunging downward towards the forest below. Hey, now it doesn't look so far
    anymore. Oh, now you're impaled on a tall icy pine tree. Right before you black out, you feel the coldness
    of the wood in your chest.
  sector: forest
  flags: [no_mob]
  triggers: [tba:243:trg:24300]

"tba:243:room:24392":
  name: Ski Hill Entrance
  description:
  - >
    You're at the ski hill entrance. The snow is well packed down, and pine trees line the north and
    south sides of the road. A large plastic banner spans the entire width of the road exclaiming,
  - >
    "WELCOME TO THE COOLAND SKI HILL!" A small booth stands here, where people must buy their lift
    tickets to get in. A small wooden sign has been nailed to the booth. A steel gate lies west.
  sector: field
  flags: [no_mob, no_track]
  exits:
