"tba:243:room:24314":
  name: Frozen Shack
  description: >
    You're in an old wooden shack. The walls are covered in frost, and the roof is beginning to cave
    in. A crumbling stone fireplace is built into the northern wall, and a boarded up window faces south. A
    sturdy trapdoor with a rusting latch is located in the southeastern corner of the room.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:243:room:24313
      look: A narrow trail is west.
    down:
      to: tba:243:room:24315
      look: The trapdoor leads into darkness.
      door:
        keywords: [door, trapdoor, trap]
        kind: door
        reset: closed

