    theaters of old (like when they sat more than 10).  Its main purpose seems to exist and collect dust. 
    Maybe someone is doing some kind of study here.  There is a sign on the east wall near the front of the
    room.
  sector: forest
  flags: [dark, indoors]
  exits:
