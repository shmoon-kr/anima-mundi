"tba:302:room:30201":
  name: Reception Desk
  description: >
    This is the main reception desk for the Wally World residence.  You are able to see the incoming
    mail behind the desk as well as hooks for keys to hang upon.  To the east there is a door and just
    south of you is the lobby.
  sector: city
  flags: [indoors, no_magic]
  exits:
    east:
      to: tba:302:room:30202
      door:
        keywords: [door]
        kind: door
        key: tba:301:obj:30103
        reset: locked
    south:
      to: tba:301:room:30142
  extras:
  - keywords: [hooks, hook, key, keys]
    text: Unfortunately you don't see any keys hanging off of any of the hooks.
  - keywords: [mail]
    text: Why are you trying to look at the mail, it's private!

"tba:302:room:30202":
  name: Main Office
  description: >
    This is the main office associated with the Wally World residence.  There is a desk, chair and
    filing cabinet in the room.  There is only one exit from the room, west.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:302:room:30201
      look: This way leads back to the reception desk.
      door:
        keywords: [door]
        kind: door
        key: tba:301:obj:30103
        reset: locked
  extras:
  - keywords: [filing, cabinet, files]
    text: >
      Looking through the files you see that Wally World was originally slated to have at least eleven
      levels but the designers got sick and tired of it and gave up after just a few levels.
  - keywords: [desk]
    text: The desk, like the chair, is completely normal.  The desk is also in excellent condition.
  - keywords: [chair]
    text: The chair is not unusual in any way whatsoever.  The chair is in excellent condition.

