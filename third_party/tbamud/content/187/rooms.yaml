# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 187.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:187:room:18700":
  name: Circus Path
  description: >
    This well beaten path leads south through a field of tall grass.  The sounds of music and laughter
    can be heard off in the distance.  The top of a large tent can be seen to the south.  The path
    continues south with the western highway to the north.
  sector: field
  exits:
    south:
      to: tba:187:room:18701
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builders  : Wolfgaar Arina
        Zone         : 187 Circus
        Began        : 1999
        Player Level : 2-4
        Rooms        : 34
        Mobs         : 12
        Objects      : 10
        Shops        : 0
        Triggers     : 3
        Theme        : A circus.
        Links        : 00n
        Zone: 187 is linked to the following zones:
         200 Western Highway                at:  18700 (north) --->  20003

"tba:187:room:18701":
  name: Circus Path
  description: >
    This well travelled path continues off to the south.  The long grass of the field sways gently in
    the breeze.  The sounds of laughter and music can be heard to the west.  The path leads off to the
    north and continues to the south.
  sector: inside
  exits:
    north:
      to: tba:187:room:18700
    south:
      to: tba:187:room:18702

"tba:187:room:18702":
  name: Circus Path
  description: >
    This well travelled dirt path turns towards the west.  The sounds of the circus to the southwest
    can be heard.  The laughter of children can be heard over the sounds of the field.  A large colorful
    tent can be seen off in the distance to the southeast, with its multi-colored flags blowing in the
    wind. The path continues to the west and leads off to the north.
  sector: field
  exits:
    north:
      to: tba:187:room:18701
    west:
      to: tba:187:room:18703

"tba:187:room:18703":
  name: Circus Path
  description: >
    This well beaten path travels south towards the circus grounds.  The sounds can be heard a bit
    louder here.  A few people can be seen now as more of the circus comes into view.  The path leads south
    as well as to the east.
  sector: field
  exits:
    east:
      to: tba:187:room:18702
    south:
      to: tba:187:room:18704

"tba:187:room:18704":
  name: Circus Path
  description: >
    The path gets a little wider here as the circus grounds are coming closer. A small line can be seen
    to the south as people line up to enter the circus. The sounds of the circus are in full swing, 
    bringing a smile to your face. The path continues to the north as well as to the south.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:187:room:18703
    south:
      to: tba:187:room:18705

"tba:187:room:18705":
  name: Circus Entrance
  description: >
    The dirt path ends at the entrance to the circus.  A small arch has been built here to keep the
    line going in an orderly fashion.  There is a welcomer here, welcoming you to the Circus of Wonders. 
    The path continues to the north and west through the arch.
  sector: field
  exits:
    north:
      to: tba:187:room:18704
    west:
      to: tba:187:room:18706

"tba:187:room:18706":
  name: Circus Area
  description: >
    You are on the road of the circus.  There are a few people wandering to and fro from the many game
    stalls and stands that are set up along this path.  The the sounds of the circus are all around you. 
    There is a game stall directly to the north and a game stall to the south too.  The path continues
    to the west and to the east.
  sector: field
  exits:
    north:
      to: tba:187:room:18707
    east:
      to: tba:187:room:18705
    south:
      to: tba:187:room:18708
    west:
      to: tba:187:room:18709

"tba:187:room:18707":
  name: Circus Game Stall
  description: >
    You have entered a small game stall there is an attendant standing here. The attendant urges you to
    take a wack at the mole.  It's free so why not! The only way out is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:187:room:18706

"tba:187:room:18708":
  name: Circus Game Stall
  description: >
    You are standing in yet another game stall that seems to line this path. There is a attendent
    standing here, smiling at you.  She urges you to take you best shot at hitting the small chick.  It is
    free so why not give it a try. The only exit is to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:187:room:18706

"tba:187:room:18709":
  name: Circus Area
  description: >
    This path runs through the area of the circus.  There are stalls lining this well worn path. 
    Sounds of music can be heard from all around.  The path leads to a game stall to the north and continues
    east and west to other parts of the circus.
  sector: inside
  exits:
    north:
      to: tba:187:room:18710
    east:
      to: tba:187:room:18706
    west:
      to: tba:187:room:18711

"tba:187:room:18710":
  name: Circus Game Stall
  description: >
    This game stall features the game of The Game Beat the Old Man.  There is a wicked man standing
    watch over all that enter this stall.  Maybe this is not a game that one should be playing.  The only
    exit is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:187:room:18709

"tba:187:room:18711":
  name: Circus Area
  description: >
    The sounds of the circus are at full swing here, music and laughter filling the air.  To the north
    you see a dark colored tent with lights flickering inside.  A small sign hangs on the flap of the
    tent.  The path continues on to the south and east.
  sector: field
  exits:
    north:
      to: tba:187:room:18712
    east:
      to: tba:187:room:18709
    west:
      to: tba:187:room:18713
  extras:
  - keywords: [sign]
    text: The sign reads "Ventrella, Seer of the Future"

"tba:187:room:18712":
  name: Seer's Tent
  description: >
    Candle light dances on the walls giving an eerie feel to this tent. Looking around the room it is
    easy to tell that some sort of mystical activity goes on here.  In the center of the room you notice a
    small round table upon which a clear glass globe sits in the middle.  Strange cards are strewn over
    the table, the images on them are nothing you can recognize.  A sign hangs crookedly from the edge of
    the table.  The only way out is back to the south where you entered this tent.
  sector: inside
  exits:
    south:
      to: tba:187:room:18711
  extras:
  - keywords: [sign]
    text: The sign reads "I vill be back soon, dahling"

"tba:187:room:18713":
  name: Circus Area
  description: >
    The grass on each side of the path is rather tall, as the wind blows through it you could swear you
    hear a whisper of some sort.  The voice is indescribable, neither male or female and you can't make
    out what it is saying. The path continues on to the north and to the east you can make out a shape of
    a small tent.
  sector: inside
  exits:
    north:
      to: tba:187:room:18714
    east:
      to: tba:187:room:18711

"tba:187:room:18714":
  name: North of the Circus
  description: >
    The path is very narrow and the few people that are here have trouble passing without bumping each
    other.  You can hear faint animal noises that are carried along by the wind.  The path leads to the
    west and south.
  sector: field
  exits:
    south:
      to: tba:187:room:18713
    west:
      to: tba:187:room:18715

"tba:187:room:18715":
  name: Center of Freaks
  description: >
    Strange noises fill the air, such as you have never heard.  Directly north there is a run down
    shack, boards missing and windows broken.  The door is off its hinges and hangs precariously by what
    looks to be a nail.  The path continues on to the south from here.
  sector: field
  exits:
    north:
      to: tba:187:room:18716
    east:
      to: tba:187:room:18714
    south:
      to: tba:187:room:18718

"tba:187:room:18716":
  name: Old Shack
  description: >
    The shack is in a terrible mess.  There is broken furniture scattered across the floor and broken
    glass everywhere.  The floor is rotted and the smell of something that you can not place fills the
    air.  There is something here..... But where?  There is a small door leading west to a dark room and to
    the south you may leave back to the path.
  sector: inside
  exits:
    south:
      to: tba:187:room:18715
    west:
      to: tba:187:room:18717

"tba:187:room:18717":
  name: Old Shack
  description: >
    This cramped room is quiet a mess.  A faint smell of rot and decay lingers in the air held captive
    by the fact there is no window to release it.  A small cage has been toppled over in the corner,
    looking as if something just made an escape from its tiny confines.  The only way out is back to the east.
  sector: inside
  exits:
    east:
      to: tba:187:room:18716

"tba:187:room:18718":
  name: Circus Area
  description: >
    You are heading south on the circus path.  Off in the near distance you can see the Big Top and a
    few animal cages.  You can still hear the sounds of laughter and singing all around you.  The path
    continues to the south and north.
  sector: field
  exits:
    north:
      to: tba:187:room:18715
    south:
      to: tba:187:room:18719

"tba:187:room:18719":
  name: Circus Area
  description: >
    To the south one can see the Big Top much clearer now.  Off to the east one can see a few animal
    cages.  One hears the sounds of animals and the sounds of the Big Top.  The path continues to the south
    and north.
  sector: inside
  exits:
    north:
      to: tba:187:room:18718
    south:
      to: tba:187:room:18720

"tba:187:room:18720":
  name: Circus Area
  description: >
    A massive tent can be seen a short distance away.  Loud noises fill the air...  Laughter, singing
    and animals.  To the east you see some animal cages and to the southeast you see the massive tent with
    its banners flying wildly in the wind.  The path runs northerly from here.
  sector: field
  exits:
    north:
      to: tba:187:room:18719
    east:
      to: tba:187:room:18721

"tba:187:room:18721":
  name: Animal Cage Area
  description: >
    All around you are animal cages, evidence that the big top is close to you. Lions, elephants and
    monkeys can be heard though you are not certain where the sound comes from.  The sounds seem to echo
    and meld together creating a frightful noise.
  sector: field
  exits:
    north:
      to: tba:187:room:18722
    east:
      to: tba:187:room:18723
    west:
      to: tba:187:room:18720

"tba:187:room:18722":
  name: Monkey Cage
  description: >
    You have entered the monkey cage, their screeching is almost deafening. The cage is filled with
    vines and branches so that they can excersize and the monkies swing and hop from branch to branch above
    you.  A few sit lazily upon the ground stuffing their faces with food the keeper brought to them.
  sector: inside
  exits:
    south:
      to: tba:187:room:18721

"tba:187:room:18723":
  name: Animal Cage Area
  description: >
    Large animal cages are all around you here.  To the north kitten like mewlings can be heard while
    to the south the cage is quiet, only the stench catches your attention.  To the west you see the Big
    Top and westerly will take you further down the path.
  sector: field
  exits:
    north:
      to: tba:187:room:18724
    east:
      to: tba:187:room:18726
    south:
      to: tba:187:room:18725
    west:
      to: tba:187:room:18721

"tba:187:room:18724":
  name: Animal Cage
  description: >
    You are standing in the middle of a cage for small lion cubs.  There soft meows can be heard.  They
    are so cute but the looks in their eyes tell you that it would not be a good idea to pet them.  The
    only exit is to the south
  sector: inside
  exits:
    south:
      to: tba:187:room:18723

"tba:187:room:18725":
  name: Animal Cage
  description: >
    You are standing in the middle of the elephant cage.  Hay litters the floor as well as a few piles
    of fruits.  The smell here is not pleasant, but you imagine if the elephants were actually in the
    cage it would be worse.  A lone baby elephant is sleeping on one of the piles of hay waiting for its
    mother to return from the act in the circus.
  sector: inside
  exits:
    north:
      to: tba:187:room:18723

"tba:187:room:18726":
  name: Entrance to the Big Top
  description: >
    Before you stands an enormous tent that spans several hundred feet.  A colorful banner has been
    placed over the entrance and on each side of the banner red and white pennants flap wildly in the
    breeze.  Laughter and cheering fills the air as well as the occasional roar of lions.  You can enter the
    big top to the east and to the south you see an elaboratly decorated wagon.
  sector: field
  exits:
    east:
      to: tba:187:room:18727
    south:
      to: tba:187:room:18733
    west:
      to: tba:187:room:18723
  extras:
  - keywords: [banner]
    text: Welcome to the Circus of Wonders!

"tba:187:room:18727":
  name: Inside the Big Top
  description: >
    People abound here, laughing merrily and having a ball.  Clowns in funny costumes can be seen most
    everywhere handing out small trinkets to the children.  You can hear the ringmaster calling out the
    next act from here, looking closer a high wire is visible to the southeast.  The bleachers are to the
    south and the exit of the Big Top is to the west.
  sector: inside
  exits:
    south:
      to: tba:187:room:18728
    west:
      to: tba:187:room:18726

"tba:187:room:18728":
  name: Inside the Big Top
  description: >
    Rows of seats surround you, people filling almost every one.  Children sit on parents laps trying
    to catch a better view of what is going on in the three rings where the acts take place.  Vendors walk
    the aisles selling various novelties.  A few clowns have made their way up to the seating area to
    give the children a thrill.  Laughter sails through the air almost as gracefully as the man on the
    trapeze.  To the east you can see the main event in the center ring, while to the north will lead you
    back to the entrance.
  sector: inside
  exits:
    north:
      to: tba:187:room:18727
    east:
      to: tba:187:room:18729

"tba:187:room:18729":
  name: Inside the Big Top
  description: >
    This is the center ring where the lion act takes place.  Luckily no lions are present, you must
    have just missed them, or will that act be next?  Best not linger to find out!  To the north is another
    ring where you can see elephants parading around.  To the south you see a highwire with a man
    tottering upon it and back to the west is the seating area.
  sector: inside
  exits:
    north:
      to: tba:187:room:18731
    south:
      to: tba:187:room:18730
    west:
      to: tba:187:room:18728

"tba:187:room:18730":
  name: Inside the Big Top
  description: >
    A very tall highwire dominates this ring, a young man on a bicycle rides precariously on a thin
    rope as he holds a long rod in his hands for balance. One miscalculation and his fate is sealed, hence
    the look of extreme concentration on his face.  You can hear the crowd gasp for breath as he teeters
    back and forth.
  sector: inside
  exits:
    north:
      to: tba:187:room:18729

"tba:187:room:18731":
  name: Inside the Big Top
  description: >
    You step carefully here because there are large pachyderms romping around as if they were puppies
    that had yet to be house broken.  One elephant sits on a round object, its trunk held proudly in the
    air.  A group of them look as if they are playing follow the leader walking around the large circle. 
    While yet another has a young beautiful girl riding gingerly on its back.  To the south you can see
    the main ring and further south you can make out a highwire.
  sector: inside
  exits:
    south:
      to: tba:187:room:18729

"tba:187:room:18732":
  name: Inside the Big Top
  description: >
    You are standing inside the Big Top.  The sounds of the circus are in full swing here.  Laughing
    and cheer can be heard all around you.  There is an exit to the north.
  sector: inside
  exits:
    north:
      to: tba:187:room:18733

"tba:187:room:18733":
  name: Center of the Circus
  description: >
    This large wagon is decorated with beautiful furniture and expensive looking paintings.  A claw
    foot table drapped with a red silk table cloth stands in the middle of the floor.  A black velvet high
    back chair rests in the corner along side a small yet intricately carved table.  This must be the
    ringmasters private quarters for only he could afford such luxury in the circus.  The door to the north
    is the only exit.
  sector: inside
  exits:
    north:
      to: tba:187:room:18726
    south:
      to: tba:187:room:18732
