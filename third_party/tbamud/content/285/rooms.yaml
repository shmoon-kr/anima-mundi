"tba:285:room:28506":
  name: Blackened Hall
  description: >
    This hall looks as if it was burned out recently.  The walls are charred and smoking.  Ashes and
    bits of burnt timber crunch under your feet as you walk down the hall.  A sign on the wall reads, 'No
    Non-smoking Please'.  There are exits in all directions.
  sector: inside
  flags: [dark, indoors]
