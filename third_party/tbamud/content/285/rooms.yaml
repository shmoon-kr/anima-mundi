"tba:285:room:28517":
  name: The Office of Big Mouth
  description: >
    This is the office of Big Mouth, head demon of Hell's Administration.  The room is decorated
    posters of naked women and autographed pictures of famous tortured souls.  Behind a large oaken desk sleeps
    Big Mouth.  This mouth looks large enough to step into if it were open.  You wonder what this guy
    eats...
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:285:room:28516
      look: You see the hallways of the Mall from Hell.
    down:
      to: tba:285:room:28526
      look: You see Big Mouth's mouth.
      door:
        keywords: [mouth, big, mouth's]
        kind: door

