  name: Maintenance Walkway
  description: >
    This is a maintence accessway.  You walk on a metal catwalk hundreds of feet above the floor.  The
    catwalk sways unsteadily as you walk on it.  The catwalk continues to the south.  To the north is a
    steel door.
  sector: inside
  flags: [dark, indoors]
  exits:
