    curdling screams of the punished. You can't seem to find the Abyss...you seem to recall seeing a
    sign...now what did it say again?...
  sector: inside
  flags: [dark, indoors]

"tba:285:room:28537":
  name: Inside the Reactor Core
  description: >
    You are standing on the inside of the reactor core.  Actually you seem to be floating in the plasma
    energy of the reactor.  You can see the core chamber fall off into the distance as it seems to be
    bottomless.  Nuclear particles and other strange things whiz by you at blinding speeds.  You see a
    maintenance hatch to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28538
      look: You see a maintenance hatch.
      door:
        keywords: [hatch, maintenance, reactor, core]
        kind: door
        reset: closed

"tba:285:room:28538":
  name: Reactor Room Floor
  description: >
    The room is taken up almost entirely by the enormous reactor core.  The core pulses rhythmically as
    it generates the heat and power for the entire region of Hell.  Many workers in orange jumpsuits run
    frantically around with geiger counters and plasma torches fixing breaches in the core.  You see a
    reactor core maintenance hatch to the west.  A stairway to the control room is to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:285:room:28528
      look: You see the stairs to the control room.
    west:
      to: tba:285:room:28537
      look: You see a reactor core maintence hatch.
      door:
        keywords: [hatch, maintenance, reactor, core]
        kind: door
        reset: closed

"tba:285:room:28539":
  name: Secondary Control Room
  description: >
    This is the secondary control room for the reactor core.  It is usually used in emergencies when
    the primary control room is contaminated or damaged.  It isn't used very often since the primary
    control room is in perfect working order.
  sector: inside
  flags: [dark, indoors]
  exits:
