# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 285.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:285:room:28500":
  name: Administration of Hell
  description: >
    This is the entrance to the Administration offices of Hell.  The secretary's desk sits quietly in
    the middle of the room.  To the south is a metal door labeled, 'Authorized Personnel Only'.  To the
    west is a large glass door. There is a stairway down on the opposite side of the room.  There is a sign
    posted next to the stairs.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28690
      look: You see a marble hall.
    south:
      to: tba:285:room:28510
      look: You see a metal door.
      door:
        keywords: [door, metal]
        kind: door
        reset: closed
    west:
      to: tba:286:room:28699
      look: You see a glass door.
      door:
        keywords: [door, glass]
        kind: door
        reset: closed
    down:
      to: tba:285:room:28509
      look: You see a stairway down.
  extras:
  - keywords: [sign]
    text:
      preformatted: |
        ****ATTENTION***
        The Abyss is CLOSED for construction.
        
        We will open for your painful pleasures
        soon....
        
        -Strahd-
  - keywords: [credits, info]
    text:
      preformatted: |2
           Descent to Hell Zone.
        Originally written by Strahd
        Zone 285 is linked to the following zones:
        286 Descent to Hell II             at 28500 (north) ---> 28690
        286 Descent to Hell II             at 28500 (west ) ---> 28699
        286 Descent to Hell II             at 28502 (north) ---> 28692
        286 Descent to Hell II             at 28506 (north) ---> 28696
        286 Descent to Hell II             at 28508 (north) ---> 28698
        286 Descent to Hell II             at 28541 (east ) ---> 28673
        286 Descent to Hell II             at 28541 (south) ---> 28682
        286 Descent to Hell II             at 28541 (west ) ---> 28672

"tba:285:room:28501":
  name: Halls of Judgement
  description: >
    You are standing in the Halls of Judgement.  There are many alcoves which contain different methods
    of torture, each more grotesque than the one before it.  On the wall a plaque reads, 'If you are
    here...You are Guilty...You have been judged...sound fair?  Too bad...'  The hall continues to the east.
    The Courtroom is to the south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28502
      look: You see the Halls of Judgement.
    south:
      to: tba:285:room:28511
      look: You see the Court of Hell.

