"tba:285:room:28524":
  name: Stanley's Magical Steeds
  description: >
    This is the shop of Stanly.  He used to be an old mage selling cursed trinkets at the town of
    Solace.  He has recently set up shop in Hell selling magical figurines.  Each figurine is in the shape of
    some sort of steed.  Some are recognizable and some are not.  Rumor has it that Stanley made a deal
    with a devil...so I guess his lease is up in seven years...  A courtyard is to the west.  To the south
    you see the Mall from Hell.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:285:room:28534
