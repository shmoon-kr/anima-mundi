      look: You see a maintenance walkway.

"tba:285:room:28511":
  name: Court Room
  description: >
    This is the Courts of Hell.  Here you are convicted, sentenced and punished. And no...you don't get
    a trial.  You don't deserve one.  The courtroom is filled with spectators and jury members.  They
    seem to have no real reason to be here since there isn't going to be a trial.  They jeer and boo you as
    you stand in the middle of the courtroom.  To the north are the Halls of Judgement. Behind the
    judge's bench is a wooden door.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:285:room:28501
      look: You see the Halls of Judgement.
    south:
      to: tba:285:room:28521
      look: You see a large wooden door.

"tba:285:room:28512":
  name: Lawyer's Office
  description: >
    As you look around you, you realize you've entered a lawyer's office.  Now you know you are in
    Hell....  Everything in this office seems to be made of snakeskin.  This is the only lawyer's office in
    hell, so if you don't like them you're out of luck.  But then again...if you are in hell...you must've
    run out of luck a while ago.  To the east is the Office of Complaints.  To the south you see a
    courtyard.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28513
      look: You see the Office of Complaints.
    south:
      to: tba:285:room:28522
      look: You see a courtyard.

"tba:285:room:28513":
  name: Office of Complaints
  description: >
    This is a relatively small office.  There is a large hole in the wall where a clerk usually sits
    and takes complaints about hell.  As you peek behind the counter you see a large paper shredder and a
    lot of shredded complaints.  A sign over the clerks desk reads, 'Hours: 12:00am - 12:01am'.  To the
    west is a lawyer's office.  To the north you see the Halls of Judgement.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:285:room:28503
      look: You see the Halls of Judgement.
    west:
      to: tba:285:room:28512
      look: You see a lawyer's office.

"tba:285:room:28514":
  name: Pawn Shop
  description: >
    You are standing in Hiramoto's Buy & Sell.  This poor bastard has been damned to hell to serve the
    public for eternity.  He will buy almost anything you have, since business is slow.  Not many people
    visit Hell.  The store is filled with worthless junk.  Piles of aluminum balls and bottle cap
    collections fill the corners of the room.  Things of every description lie about the store.  To the east you
    see the Mall from Hell.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28515
      look: You see the Mall from Hell.

"tba:285:room:28515":
  name: Hallway of The Mall from Hell
  description: >
    This is definitely the Mall from Hell...there are no stores!  Only in Hell would they have a mall
    with no stores.  To the east you see the Mall from Hell. To the west you see Hiramoto's Buy & Sell. 
    The hall continues to the east and south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28516
      look: You see the Mall from Hell.
    south:
      to: tba:285:room:28525
