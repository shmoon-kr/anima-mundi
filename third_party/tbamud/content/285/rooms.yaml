"tba:285:room:28509":
  name: Stairs to the Abyss
  description: >
    These dark stairs are made out of the bones of the damned.  They rattle softly as you tread upon
    them as if to cry out in protest.  The air is filled with the wailing of lost souls and the blood
    curdling screams of the punished.
  sector: inside
  flags: [dark, indoors]
  exits:
    down:
      to: tba:285:room:28518
      look: You see the eternal darkness of the Abyss.

