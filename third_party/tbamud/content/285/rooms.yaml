"tba:285:room:28521":
  name: Judge's Chambers
  description: >
    These are the private chambers of the High Judge of Hell.  He has a cushy job and his office
    reflects that.  Golden torches light the walls with dancing blue and yellow flames.  The judge's black
    crystal desk sparkles in the torchlight.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:285:room:28511
      look: You see the Courtroom of Hell.

