"tba:285:room:28528":
  name: Reactor Control Room
  description: >
    This is the reactor control room of Hell.  From here the workers control the main reactor and power
    supply for all of Hell and the abyss.  Workers stroll back and forth, from station to station,
    monitoring the reactor core.  A large glass window looks out onto the reactor floor below.  There are some
    stairs down to the reactor floor to the south.  There is a maintenance room to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28529
      look: You see a maintenance room.
    south:
      to: tba:285:room:28538
      look: You see stairs down to the reactor floor.

"tba:285:room:28529":
  name: Maintenance Room
  description: >
    You are standing in the primary maintenance room of Hell.  Tools of all shapes and sizes are neatly
    hung on the walls, each with its own painted-on silhouette behind it.  To the west is the reactor
    control room.  To the east is the break room.  To the north is a maintenance walkway.  To the south is
    the secondary control room.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:285:room:28519
      look: You see a maintenance walkway.
    east:
      to: tba:285:room:28530
      look: You see a break room.
    south:
      to: tba:285:room:28539
      look: You see the secondary control room.
    west:
      to: tba:285:room:28528
      look: You see the reactor control room.

"tba:285:room:28530":
  name: Break Room
  description: >
    This is the break room for the maintenance workers.  Tables are filled with donuts and coffee.  As
    a cruel joke, the chief engineer has posted his guard dogs to guard the room so that no one can take
    a break.  To the west is the primary maintenance room.  To the south is the chief engineer's office.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:285:room:28540
      look: You see the chief engineer's office.
    west:
      to: tba:285:room:28529
      look: You see the primary maintenance room.

"tba:285:room:28531":
  name: Hell's Kitchen
  description: >
    Welcome to Hell's kitchen, where everything is delicious...you just can't have any...  This is
    where the many foods of the world of Farside are made. The chefs are usually very busy, but they always
    have extra time to torture a guest...  To the east is a courtyard.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
