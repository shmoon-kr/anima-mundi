"tba:303:room:30330":
  name: Hallway
  description: >
    This hallway leads through the darkness...  There seems to be some sort of conveyer belt under your
    feet, and you can see glinting objects ahead, and the way back east seems to have disappeared.  The
    pictures on the walls make you feel extremely comfortable.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    east:
      look: There isn't an exit in this direction, so don't even bother trying to go this way.
    west:
      to: tba:303:room:30331
      look: The hallway continues to the west.
  extras:
  - keywords: [wall, walls, pictures, picture]
    text: >
      The pictures on the wall make up a large mural depicting Mediterranean scenery and make you feel
      extraordinarily comfortable.

"tba:303:room:30331":
  name: Abattoir
  description: >
    The walls of this room are covered with rotating knives and seem to be heavily soundproofed.  There
    are chutes evenly spaced along the floor where it meets the wall, and there are several suction
    devices designed to suck your mangled flesh away....  Wait a minute....  This must be a Death Trap... 
    And so it is!  But, the system seems to work well, as the rotating knives cut you up into tiny little
    pieces of flesh and your blood drains down the chutes, and the suction devices casually suck what's
    left of your mangled flesh away....
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:303:room:30330
      look: Why even look...it won't halt the mangling?
  extras:
  - keywords: [monty, python]
    text: >
      This section of the area was designed in accordance with Monty Python guidelines in mind...  Thanx
      to Monty Python for their infamous "Architect's Sketch".
