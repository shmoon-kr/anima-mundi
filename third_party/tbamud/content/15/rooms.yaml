# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 15.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:15:room:1500":
  name: A Road Leading From The Bank
  description: >
    You find yourself on a small road leading away from the edge of the River of Lost Souls.  The dark
    waters of the River can be seen and heard just south of here.  Looking to the east and west, you see
    only the walls of the rocky cliffs.  Off to the north a strange path seems to lead straight into the
    depths of the mountain.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:15:room:1501
      look: A strange path leads northwards.
    south:
      to: tba:56:room:5619
      look: The River of Lost Souls flows just to the south of here.

"tba:15:room:1501":
  name: A Long Road
  description: >
    You stand here in spiritual emptiness, beginning a long and dangerous path.  Your honest submission
    has already been made, but the truth of your heart has yet to be told.  Leave here now, and do not
    come back until you have grown.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1502
    south:
      to: tba:15:room:1500

"tba:15:room:1502":
  name: A Long Road
  description: >
    You stop for a moment, screaming in frustration.  Surely it was that one sin that was avoidable, of
    all that you regret.  The hitting and the hurting flash briefly before you.  Moments later the pain
    passes, and the straight path reveals itself before you.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1503
    south:
      to: tba:15:room:1501

"tba:15:room:1503":
  name: A Long Road
  description: >
    The road clears, the fog and pain of the first few steps left behind you.  Despite the sudden
    clarity, your mind is still haunted, images of an old woman kneeling in prayer, eyes closing, smiling and
    crying.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1504
    south:
      to: tba:15:room:1502

"tba:15:room:1504":
  name: A Long Road
  description: >
    Looking ahead, you can see that the path you have been following will soon come to an end, but
    something in the cold and the breeze tells you that that will be only the beginning of the journey.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1505
    south:
      to: tba:15:room:1503

"tba:15:room:1505":
  name: A Test for the Faithful
  description: >
    It is here finally that decisions must be made.  The first one that confronts you is simple enough,
    to walk in the darkness, or to walk in the light.  Only the depths of your soul can decide, but
    remember this much: the same truth lies at the end of both paths.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:15:room:1507
    down:
      to: tba:15:room:1506

"tba:15:room:1506":
  name: Halls of the Forgotten
  description: >
    Even the darkest have a place on the road to the truth.  It is in this place, so empty and
    forgotten, that God has chosen the worst, and brought them close to Him for one last time.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:15:room:1513
    west:
      to: tba:15:room:1508
    up:
      to: tba:15:room:1505

"tba:15:room:1507":
  name: Shahadah
  description: >
    It was written once, on an ancient parchment in a curious and flowing script, that there is in fact
    no god but Allah, and that Muhammad was the last of His Prophets.  With this recognition, all else
    became empty and meaningless.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:15:room:1523
    west:
      to: tba:15:room:1518
    down:
      to: tba:15:room:1505

"tba:15:room:1508":
  name: Earthly Evil
  description: >
    Whatever it carries, that rage converts into a weapon.  Wrath supplies all with arms.  When an
    angry man thirsts for blood anything will serve him for a spear.  Fury turns a stick into a cudgel.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1509
    east:
      to: tba:15:room:1506

"tba:15:room:1509":
  name: Misguidance
  description: >
    Some have been brought here not for what they did, but what they failed to do.  It is these, the
    poor souls that were presented the fair evidence and rejected it with an honest mind, that deserve our
    pity the most of all.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1510
    south:
      to: tba:15:room:1508

"tba:15:room:1510":
  name: Temptation
  description: >
    Old tales tell of a conversation between the devil and the Prophet Jesus: the devil offered him a
    kingdom, vast riches, the temptation of a glorious near-death saved by his angels.  Even this
    Messenger of God was forced to stop and think.  Imagine how hard it could be for the rest.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1511
    south:
      to: tba:15:room:1509

"tba:15:room:1511":
  name: Hypocrisy
  description: >
    He called the populace to strict religious purity, rigidly enforcing the times of prayer and the
    most correct forms of the words of the Muezzin. All of this he strengthened by his most impeccable
    example, shunning all riches and riding in tattered rags through his capital on the back of a donkey. 
    Despite all this, remember.  Behind closed doors, all men are hypocrites.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1512
    south:
      to: tba:15:room:1510

"tba:15:room:1512":
  name: Hate
  description: >
    There is little in life much easier, and truthfully, little that is a quicker ticket to damnation. 
    You give brief thanks that you have come to the end of these trials, but your words are drowned out
    by something much louder, a mechanical preaching that drowns your ears in anger.  You hear a steady,
    repetitive litany of the same phrase, over and over again: "I go the way history dictates with the
    blind assurance of a sleep-walker."
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1528
    south:
      to: tba:15:room:1511

"tba:15:room:1513":
  name: Spiritual Danger
  description: >
    Some evils are tangible, solid, so evident that they spit you right in the face.  Others are more
    clever, more subtle, and it is these that present the greatest danger.  Looking down the hall before
    you, a great fear fills your heart, and a great, heavy longing.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1514
    west:
      to: tba:15:room:1506

"tba:15:room:1514":
  name: The Fall
  description: >
    In the beginning, he was the best, the most beautiful of all the angels, and God's most loved
    creation.  Look at your own beauty, human, and do what he could not.  Look at your beauty, and learn to
    kneel!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1515
    south:
      to: tba:15:room:1513

"tba:15:room:1515":
  name: Temptation
  description: >
    Temptation is the IF, the wondering, the second-guessing, the "I will be a better man... if..." 
    And that if is usually taken, sitting alone, listening to that voice, calling you, offering such an
    easy way, but such a crooked one.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1516
    south:
      to: tba:15:room:1514

"tba:15:room:1516":
  name: The Last Day
  description: >
    The din of a great battle shakes these halls, the moans of the earth erupting at the shakings of
    the End Time.  Be ready for that day, be very ready, for if you are not, he will claim you for one of
    his own.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1517
    south:
      to: tba:15:room:1515

"tba:15:room:1517":
  name: Flame
  description: >
    Undescribable horror and pain, a blackness drowned out only by the burning anguish, the
    inextinguishable fire coming not from some burning wood or molten lava but from the brightness and pain of the
    horrible, tortured souls that surround, everywhere you turn.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:15:room:1530
    south:
      to: tba:15:room:1516

"tba:15:room:1518":
  name: Earthly Light
  description: >
    To slip into evil is easy, but walking this path is the hardest of all.  Even the four you will
    find here today have strayed from the line at least once in their lives, and there are still some living
    who curse the very sound of their names.  Despite all this, confront them now, and let their actions
    serve as your example.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1519
    east:
      to: tba:15:room:1507

"tba:15:room:1519":
  name: The Light of the Rashidun
  description: >
    Many believed that the Prophet would never die, but when the stark evidence of his body confronted
    them, it soon became necessary to provide for the future.  The four that came after are called the
    Rashidun, the rightly-guided Caliphs that would spread the word and the light, and with it forge one of
    history's greatest empires.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1520
    south:
      to: tba:15:room:1518

"tba:15:room:1520":
  name: The Light of the Rashidun
  description: >
    The first Caliphs were chosen by consultation with a noble council of elders, each of whom, hoping
    to lead the world of Islam alone, voted to elect the one amongst them they thought was the weakest. 
    Each time, they were wrong.  Each one was more noble, more upright than the one before.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1521
    south:
      to: tba:15:room:1519

"tba:15:room:1521":
  name: The Light of the Rashidun
  description: >
    Every majestic and happy tale must end, usually all too soon, and thus it was with the golden age
    of the Caliphate.  The Rashidun were pure men, good men, true to the path, but their followers soon
    began to bicker, and civil war was on the horizon.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1522
    south:
      to: tba:15:room:1520

"tba:15:room:1522":
  name: The Light of the Rashidun
  description: >
    The end of the Rashidun was the beginning of Schism.  The memories of the Prophet and the living
    example of the Caliphs proved to be insufficient example to the faithful.  Ali died, and some say that
    with him the Caliphate died too, a martyr, his blood still flowing in the nameless river.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1531
    south:
      to: tba:15:room:1521

"tba:15:room:1523":
  name: Spritual Reward
  description: >
    Behold, Allah is the Provider, the most Generous.  He would not suffer his believers to walk the
    path of light without guidance.  He provided the Prophets, may peace be upon them, and in the examples
    of their own growth, we shall find the truth of our own.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1524
    west:
      to: tba:15:room:1507

"tba:15:room:1524":
  name: Creation
  description: >
    In the creation of the heavens and the earth, and in the alternation of night and day, there are
    signs for men of sense; those that remember Allah say: "Lord, You have not created this in vain!"
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1525
    south:
      to: tba:15:room:1523

"tba:15:room:1525":
  name: Revelation
  description: >
    The Angel Gabriel came to him and said: "Read!"  He replied: "But I cannot!"  The order was
    repeated three times, until the Angel himself said: "Read, in the name of your Lord who created man from
    clots of blood. Praise be to God, Lord of the Universe."
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1526
    south:
      to: tba:15:room:1524

"tba:15:room:1526":
  name: Conversion
  description: >
    Unbelievers, I do not worship what you worship, nor do you worship what I worship.  I shall never
    worship what you worship, nor will you ever worship what I worship.  You have your own religion, and I
    have mine.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1527
    south:
      to: tba:15:room:1525

"tba:15:room:1527":
  name: Deliverance
  description: >
    The balance had been made, the soul placed in readiness, and the final measurement taken.  For
    those that have come this far, surely this is the day of immortality!
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1533
    south:
      to: tba:15:room:1526

"tba:15:room:1528":
  name: Repentance
  description: >
    God forgives those who commit evil in ignorance, for He is all-knowing and wise.  But He will not
    forgive those who do evil, and when death comes to them, say: "Now we repent!"  For those We have
    prepared a woeful scourge.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:15:room:1529
    south:
      to: tba:15:room:1512
    up:
      to: tba:15:room:1534

"tba:15:room:1529":
  name: Pilgrimage
  description: >
    It is incumbent upon all Muslims to make the pilgrimage to Mecca once in their lifetime, if they
    are able, and for those unfortunate enough to follow the lives of the lower evils, such a pilgrimage
    with an open and contrite heart shall absolve them of all.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:15:room:1530
    west:
      to: tba:15:room:1528
    up:
      to: tba:15:room:1535

"tba:15:room:1530":
  name: Intercession
  description: >
    It is written that no one may intercede with God on behalf of another. No prayers from another may
    save the soul of a doomed man; his only hope is prayers of his own.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:15:room:1517
    west:
      to: tba:15:room:1529
    up:
      to: tba:15:room:1536

"tba:15:room:1531":
  name: The Upper Reaches
  description: >
    You have traveled the righteous path, and you have faced the examples of the true models of the
    Prophet.  Only the final journey awaits you; live like this and you shall live forever.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:15:room:1532
    south:
      to: tba:15:room:1522
    down:
      to: tba:15:room:1534

"tba:15:room:1532":
  name: The Upper Reaches
  description: >
    When the records of men's deeds are laid open, and heaven is stripped bare; when Hell burns
    fiercely and Paradise is brought near: then each soul shall know what it has done.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:15:room:1533
    west:
      to: tba:15:room:1531
    down:
      to: tba:15:room:1535

"tba:15:room:1533":
  name: The Upper Reaches
  description: >
    You have traveled the righteous path, and your own journey has imitated the evolution of the most
    perfect soul.  Only one final path awaits you; die as the one in the room before, and your death will
    mean nothing.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:15:room:1527
    west:
      to: tba:15:room:1532
    down:
      to: tba:15:room:1536

"tba:15:room:1534":
  name: The Final Facing
  description: >
    The last of the darkness lies behind you; only the straight path remains.  Go forth with a clean
    heart.  Only the penitent shall find what they seek. Continue to receive the reward you deserve.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:15:room:1535
    up:
      to: tba:15:room:1531
    down:
      to: tba:15:room:1528

"tba:15:room:1535":
  name: The Final Facing
  description: >
    The last of the darkness lies behind you; only the straight path remains.  Go forth with a clean
    heart.  Only the penitent shall find what they seek. Continue to receive the reward you deserve.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:15:room:1537
    east:
      to: tba:15:room:1536
    west:
      to: tba:15:room:1534
    up:
      to: tba:15:room:1532
    down:
      to: tba:15:room:1529

"tba:15:room:1536":
  name: The Final Facing
  description: >
    The last of the darkness lies behind you; only the straight path remains.  Go forth with a clean
    heart.  Only the penitent shall find what they seek. Continue to receive the reward you deserve.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:15:room:1535
    up:
      to: tba:15:room:1533
    down:
      to: tba:15:room:1530

"tba:15:room:1537":
  name: A Straight Path
  description: >
    The Compassionate, the Merciful, Sovereign of the Day of Judgment! You alone we worship, and to You
    alone we turn for help.  Guide us to the Straight Path, the path of those whom You have favored, not
    of those who have gone astray.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1538
    south:
      to: tba:15:room:1535

"tba:15:room:1538":
  name: Progression
  description: >
    Were We worn out by the First Creation?  Yet they are in doubt about a new creation.  WE created
    man.  We know the promptings of his soul, and are closer to him than his jugular vein.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1539
    south:
      to: tba:15:room:1537

"tba:15:room:1539":
  name: Judgment
  description: >
    Undoubtedly the shortest path is the straightest one.  Only one more step awaits before a final
    decision is made and a home given to you for all eternity.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:15:room:1540
    south:
      to: tba:15:room:1538

"tba:15:room:1540":
  name: The Utmost Throne
  description: >
    You have come at last to the resting place of the most holy.  Startling crystal clarity of vision
    has been granted to you; seven guardians rim the periphery of the throne and all is bathed in a warm
    and clean light. It is here that the final choice is to be made, and no defiance of yours can change
    the outcome.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:15:room:1539
