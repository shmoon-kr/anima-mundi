"tba:103:room:10301":
  name: Transportation Rooms
  description: >
    @gThis room does not look to interesting, with its gray walls and black floor and ceiling.  Two
    sets of stairs sit in the middle of the room, one goes up, the other down.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    up:
      to: tba:103:room:10302
    down:
      to: tba:103:room:10303

"tba:103:room:10302":
  name: Earth Teleporter
  description: >
    @gThis room looks just like the other, it has gray walls and a black ceiling and floor.  But there
    is one difference, in the middle of the room sits a teleporter, this device is giving off a strange
    light, hums constantly.  A sign is nailed onto the wall.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    down:
      to: tba:103:room:10301

"tba:103:room:10303":
  name: Namek Teleporter
  description: >
    @gThis room looks just like the other, it has gray walls and a black ceiling and floor.  But there
    is one difference, in the middle of the room sits a teleporter, this device is giving off a strange
    light, hums constantly.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    up:
      to: tba:103:room:10301

"tba:103:room:10304":
  name: Kami's Lookout
  description: >
    @gThe sun shines down on your face, warming up your whole body.  A short fat person is kneeling
    here tending to a well kempt flower garden whistling happily. Another person stands here, a tall green
    man with pointy ears.
  sector: city
  flags: [no_mob, peaceful]

"tba:103:room:10305":
  name: Start of Planet Namek
  description: >
    @gThe lush ground and the tall trees surround this area, small domed buildings are also here, and
    many green people are walking around working here.  Some tending to the gardens, others training their
    skills.  But one thing is certain, all of them look male.
  sector: city
  exits:
    north:
      to: tba:103:room:10346
    east:
      to: tba:103:room:10362
      door:
        keywords: [Gate]
        kind: door
        key: tba:103:obj:10362

"tba:103:room:10306":
  name: Base of Korins Tower
  description: >
    @gTrees cover this area, but at the base of Korins Tower is a clearing allowing the sun in. 
    Towards the east is a dirt path in which you cannot see the end of.
  sector: forest
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10307

"tba:103:room:10307":
  name: Forest path
  description: >
    @gA dirt path goes further towrds the west.  The smell of death is in the air.  @gTrees limit you
    to this single path, sounds come from the woods and area ahead.
  sector: forest
  exits:
    east:
      to: tba:103:room:10308
    west:
      to: tba:103:room:10306

"tba:103:room:10308":
  name: Forest Intersection
  description: >
    @gA small clearing is here, but the path continues towards the west.  And towards the north is
    another small clearing.  A large gaping hole is in the middle of the ground here.
  sector: forest
  exits:
    north:
      to: tba:103:room:10309
    east:
      to: tba:103:room:10312
    west:
      to: tba:103:room:10307
    down:
      to: tba:103:room:10310

"tba:103:room:10309":
  name: Gokus' House
  description: >
    @gA small cottage lies here, it is very small, and very broken looking. This is a cleared out space
    in the forest.  @gThe house seems to make everything feel good again, as if it has some magical
    feeling to it.
  sector: forest
  exits:
    south:
      to: tba:103:room:10308

"tba:103:room:10310":
  name: A Dark Hole
  description: >
    @gThe walls are covered in a thick slime, roots pop through the ground surrounding you.  @gThe
    walls are sleek, it seems that if one were to fall into this hole, they would not be able to escape
    easily.
  sector: forest
  flags: [dark]
  exits:
    up:
      to: tba:103:room:10308
    down:
      to: tba:103:room:10311

"tba:103:room:10311":
  name: The Base of the Dark Hole
  description: >
    @gThe floor is covered in dead animal bones, and a human skeleton every now and then, strange
    plants grow all over the walls here. @gIt is dark, almost so dark it makes it hard to see, the only light
    comes from above you.
  sector: forest
  flags: [dark]
  exits:
    up:
      to: tba:103:room:10310

"tba:103:room:10312":
  name: A Forest Path
  description: >
    @gA dirt path goes further towrds the west.  The smell of death is in the air.  @gThe trees still
    cover the area around the path, just limiting you to this one spot.
  sector: forest
  exits:
    east:
      to: tba:103:room:10313
    west:
      to: tba:103:room:10308

"tba:103:room:10313":
  name: The end of the Forest
  description: >
    @gThe forest is wide here, but trees are still lush and large.  Creatures still inhabbit this area,
    and the smell of death is still strong, but not as strong as it used to be.
  sector: forest
  exits:
    east:
      to: tba:103:room:10314
    west:
      to: tba:103:room:10312

"tba:103:room:10314":
  name: Forests end
  description: >
    @gA small clearing is here, a boat sits here.  The dock looks old and battered, like it has been
    through many storms.  Off to the east you see a small island with an even smaller house, to the south
    is a large dome building marked with a large black CC.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:103:room:10321
    east:
      to: tba:103:room:10324
    south:
      to: tba:103:room:10315
    west:
      to: tba:103:room:10313

"tba:103:room:10315":
  name: The Entrance to Capsul Corp
  description: >
    @gThe grass seems a little greener here, and the sun shines more brightly. To the south is a large
    entrance to the building marked with a CC.  This dome shaped building seems a lot bigger than it did
    before.
  sector: field
  exits:
    north:
      to: tba:103:room:10314
    south:
      to: tba:103:room:10316

"tba:103:room:10316":
  name: Capsul Corp Front Desk
  description: >
    @gThis is a small room, people are rapidly moving about here.  In the center of the room sits a
    small desk, a woman sits at this desk, a sign on the desk says that her name is Matilda.  Lots of chairs
    cover the wall of the room, it is clear that this is no ordinary place. @n
  sector: inside
  flags: [indoors, peaceful]
  exits:
    north:
      to: tba:103:room:10315
    south:
      to: tba:103:room:10317

"tba:103:room:10317":
  name: Entrance to the Battle Arena
  description: >
    @gHere lies an intersection, here it seems that even more comotion has come about, and the smell of
    death lingers in the air.  @qThe walls have a reddish liquid like substance splattered on them,
    making it kind of an uncomfortable room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10316
    east:
      to: tba:103:room:10318
    south:
      to: tba:103:room:10319
    west:
      to: tba:103:room:10320

"tba:103:room:10318":
  name: Th Newbie Arena
  description: >
    @gThe walls are covered in a thick pad, and the floors seem to be doubled with some strange type of
    materal.  The sounds of fighting echo around you. @gThis room also has a random blood splatter, but
    the splatter here seems to be more consistent then in the other room.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:103:room:10317

"tba:103:room:10319":
  name: Vegetas Atire
  description: >
    @gThis looks just like a regular room, besides the fact the it is the largest part of the
    building.  @gLarge brass statues cover the walls, and even more strange is the fact that not a single one
    seems to be touching the ground.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10317

"tba:103:room:10320":
  name: Teleportation Room
  description: >
    @gThis room looks just like the old teleportation rooms that took you to this planet.  @gOne
    difference is that the teleportation unit seems to be more technilogically advanced here, but it is hard to
    tell.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:103:room:10317
    south:
      to: tba:103:room:10334

"tba:103:room:10321":
  name: The Ocean Shore
  description: >
    @BThe ocean flows up onto the sandy shore, dampining the soft sand on the shore.  The smell of salt
    lingers in the air and the sun beats down hard on the sand.  The waves echo through the thick forest
    to the east, although there is no entrance here.  Seaguls fly overhead, adding to this beautiful
    scene.  Hermit crabs have made this area their home, digging holes in the sand.  A starfish lies amongst
    the sand here and there, and small birds chirp in the forest. This place seems to be perfect to just
    relax and take a break from the everyday life.  @n
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10322
    south:
      to: tba:103:room:10314

"tba:103:room:10322":
  name: The Mouth of the River
  description: >
    @BThe air seems to be a bit more soothing here, there are trees on both sides of the river, and the
    serene sun shining down into the river, making it so you can see the every little ripple in the
    water.  Magnificent fish add to the beautiful scene here,@n @Bswimming through the river distorting the
    image of the small pebbles on the bottom.  Leaves fall gently into the river and majesticly float down
    the stream.  This area looks to have been untouched by the destructive human hand,@n @Bthe trees to
    the northwest are to thick to see through much less walk through.  This also seems to be a perfect
    place to relax from the troubles of everyday.  @n
  sector: forest
  flags: [no_mob, peaceful]
  exits:
    south:
      to: tba:103:room:10321

