"tba:103:room:10327":
  name: Soaring Over the Ocean
  description: >
    @gLand seems to be coming into your line of vision, only about 25 feet. But the salt still lingers
    in the air and the Seaguls fly overhead.  @n @gThe sun seems to be harsher here then it is any other
    part of the ocean.
  sector: flying
  exits:
    east:
      to: tba:103:room:10328
    south:
      to: tba:103:room:10326

"tba:103:room:10328":
  name: In Shallow Water
  description: >
    @gYou are now in the shallow water in front of a small island, to the north is a house with 'KAMI'
    in large red letters.  A bald old man sits out front looking at a dirty magazine.  @n
  sector: flying
  exits:
    north:
      to: tba:103:room:10329
    west:
      to: tba:103:room:10327

"tba:103:room:10329":
  name: In front of Kami House
  description: >
    @gThe small house sits here, and the old man is more visible, he is bald with white facial hair and
    large sunglasses.  He wears a turtle shell on his back. @gWaves wash gentle up onto the shore, and a
    gentle breeze blows here.
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10330
    south:
      to: tba:103:room:10328

"tba:103:room:10330":
  name: Kami House
  description: >
    @gThe house seems larger on the inside then it did on the out side, its walls are an off white, and
    a large couch in the center of the room.  Off to the north seems to be the kitchin, and south is
    back to the shore.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10331
    south:
      to: tba:103:room:10329

"tba:103:room:10331":
  name: Kami Houses Kitchen
  description: >
    @gThe room smells of burnt food, a turtle is rummiging through the fridge, and whistling.  This
    room looks like the other but has a large table in the center of it, and counters around the edge.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:103:room:10330
    west:
      to: tba:103:room:10332

"tba:103:room:10332":
  name: Stair Closet
  description: >
    @gThis room is rather small, the walls are a dark red, and the ceiling is noticably low. There is a
    set stairs here leading up.  @gA light glows through a crack in the door at the top of the stairs.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:103:room:10331
    up:
      to: tba:103:room:10333

"tba:103:room:10333":
  name: Roshis' Room
  description: >
    @gThe walls are covered with dirty pictures and the bed is unkempt, clothes are covering the floor
    and you can barely make out the wood under them.  @gThe windows lie open, letting the gentle breeze
    into the room.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:103:room:10332

"tba:103:room:10334":
  name: A Small Hall
  description: >
    @gThe walls are close together, and the floor seems to be much nicer then the other areas of the
    building, it is a sleek marble and it has been freshly shined.  The hall continues to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10320
    south:
      to: tba:103:room:10335

"tba:103:room:10335":
  name: A Small Hall
  description: >
    @gThe walls are close together, and the floor seems to be much nicer then the other areas of the
