  name: Soaring Over the Ocean
  description: >
    @gThe sun shines down hard, and the air smells of salt, Seaguls are more abundant here then they
    were on the beach and this does place is not as soothing either.  @n
  sector: flying
  exits:
    east:
      to: tba:103:room:10325
    west:
      to: tba:103:room:10314

