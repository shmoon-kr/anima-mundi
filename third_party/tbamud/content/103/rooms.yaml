"tba:103:room:10327":
  name: Soaring Over the Ocean
  description: >
    {green}Land seems to be coming into your line of vision, only about 25 feet. But the salt still
    lingers in the air and the Seaguls fly overhead.  {/green} {green}The sun seems to be harsher here then
    it is any other part of the ocean.{/green}
  sector: flying
  exits:
    east:
      to: tba:103:room:10328
    south:
      to: tba:103:room:10326

"tba:103:room:10328":
  name: In Shallow Water
  description: >
    {green}You are now in the shallow water in front of a small island, to the north is a house with
    'KAMI' in large red letters.  A bald old man sits out front looking at a dirty magazine.  {/green}
  sector: flying
  exits:
    north:
      to: tba:103:room:10329
    west:
      to: tba:103:room:10327

"tba:103:room:10329":
  name: In front of Kami House
  description: >
    {green}The small house sits here, and the old man is more visible, he is bald with white facial
    hair and large sunglasses.  He wears a turtle shell on his back. {/green}{green}Waves wash gentle up
    onto the shore, and a gentle breeze blows here.{/green}
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10330
    south:
      to: tba:103:room:10328

"tba:103:room:10330":
  name: Kami House
  description: >
    {green}The house seems larger on the inside then it did on the out side, its walls are an off
    white, and a large couch in the center of the room.  Off to the north seems to be the kitchin, and south
    is back to the shore.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10331
    south:
      to: tba:103:room:10329

"tba:103:room:10331":
  name: Kami Houses Kitchen
  description: >
    {green}The room smells of burnt food, a turtle is rummiging through the fridge, and whistling. 
    This room looks like the other but has a large table in the center of it, and counters around the
    edge.{/green}
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:103:room:10330
    west:
      to: tba:103:room:10332

"tba:103:room:10332":
  name: Stair Closet
  description: >
    {green}This room is rather small, the walls are a dark red, and the ceiling is noticably low. There
    is a set stairs here leading up.  {/green}{green}A light glows through a crack in the door at the
    top of the stairs.{/green}
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:103:room:10331
    up:
      to: tba:103:room:10333

"tba:103:room:10333":
  name: Roshis' Room
  description: >
    {green}The walls are covered with dirty pictures and the bed is unkempt, clothes are covering the
    floor and you can barely make out the wood under them.  {/green}{green}The windows lie open, letting
    the gentle breeze into the room.{/green}
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:103:room:10332

"tba:103:room:10334":
  name: A Small Hall
  description: >
    {green}The walls are close together, and the floor seems to be much nicer then the other areas of
    the building, it is a sleek marble and it has been freshly shined.  The hall continues to the
    south.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10320
    south:
      to: tba:103:room:10335

"tba:103:room:10335":
  name: A Small Hall
  description: >
    {green}The walls are close together, and the floor seems to be much nicer then the other areas of
    the building, it is a sleek marble and it has been freshly shined.  The hall continues to the
    south.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10334
    south:
      to: tba:103:room:10336

"tba:103:room:10336":
  name: End of the Small Hall
  description: >
    {green}The walls are close together, and the floor seems to be much nicer then the other areas of
    the building, it is a sleek marble and it has been freshly shined.  The hall is now over, if you go
    west, there seems to be someone there.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10335
    west:
      to: tba:103:room:10337

"tba:103:room:10337":
  name: A Small Kitchen
  description: >
    {green}This is also one of the nicer parts of the building, the floor is marble with a rug here and
    there, a nice chandelier hangs from the ceiling, and the walls are covered in a nice flowered
    wallpaper.  A table only large enough for three sits here, and three chairs are placed comfortably around
    it.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10338
    east:
      to: tba:103:room:10336

"tba:103:room:10338":
  name: The Living Room
  description: >
    {green}This room looks nothing like the kitchen, it has a carpeted floor, a large couch, and a huge
    plasma TV on the wall.  Pictures of Vegeta, Bulma, and Truncks hang from the wall.  A faint
    whistling comes from the west, adding to the homely feeling.{/green}
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:103:room:10337
    west:
      to: tba:103:room:10339

"tba:103:room:10339":
  name: Play Room
  description: >
    {green}The ground is covered in explicite silver tiles, and on the wall is another TV like the one
    in the Living room, but this one has a game system connected to it, and a young child with purple
    hair sits here playing it while whistling.{/green}
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    east:
      to: tba:103:room:10338
    west:
      to: tba:103:room:10340

"tba:103:room:10340":
  name: The Garden
  description: >
    {green}A Large arch is here, it is positioned at the start of a garden.  Through the arch you are
    able to see a magnificent lush garden, anything you could possibly think of resides in this place, in
    the its center is a huge oak tree, it provides shade for anyone who sits under it.{/green}
  sector: forest
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10339
    west:
      to: tba:103:room:10341

"tba:103:room:10341":
  name: A Garden Path
  description: >
    {green}On either side of you huge plants grow, vegetables are here, and many other types of plants
    you have never seen before.  Large rocks separate plant rows, acting as stepping stones for someone
    to walk through.{/green}
  sector: inside
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10340
    west:
      to: tba:103:room:10342

"tba:103:room:10342":
  name: A Large Oak Tree
  description: >
    {green}This area has been cleared, nothing grows here but a comfortable lush grass, a large oak
    tree is growing here, shading everyone who comes into this area, the sun cannot get through the leaves
    of this tree, it seems to have been placed here on purpose, a magical feeling is coming from the tree,
    it makes your body tingle.{/green}
  sector: forest
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10343
    east:
      to: tba:103:room:10341

"tba:103:room:10343":
  name: A Garden Path
  description: >
    {green}On either side of you huge plants grow, vegetables are here, and many other types of plants
    you have never seen before.  Large rocks separate plant rows, acting as stepping stones for someone
    to walk through.{/green}
  sector: inside
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10344
    south:
      to: tba:103:room:10342

"tba:103:room:10344":
  name: A Garden Path
  description: >
    {green}On either side of you huge plants grow, vegetables are here, and many other types of plants
    you have never seen before.  Large rocks separate plant rows, acting as stepping stones for someone
    to walk through.{/green}
  sector: inside
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10345
    south:
      to: tba:103:room:10343

"tba:103:room:10345":
  name: The End of the Garden
  description: >
    {green}You come to a wall, the garden has come to an end.  The same plants grow here as they did on
    the path, the only exit is to the south.  {/green}{green}The smell of roses lingers about here,
    making it a warm relaxing place.{/green}
  sector: inside
  flags: [peaceful]
  exits:
    south:
      to: tba:103:room:10344

"tba:103:room:10346":
  name: Namekian Village
  description: >
    {green}Houses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top. There are also very few people in this village,
    and there are less children in this village, it seems to be a farming village.{/green}
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10347
    south:
      to: tba:103:room:10305

"tba:103:room:10347":
  name: Namekian Village
  description: >
    {green}Houses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village,
    and there are less children in this village, it seems to be a farming village.{/green}
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10348
    south:
      to: tba:103:room:10346

"tba:103:room:10348":
  name: Namekian Village
  description: >
    {green}Houses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village,
    and there are less children in this village, it seems to be a farming village.{/green}
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10349
    south:
      to: tba:103:room:10347

"tba:103:room:10349":
  name: Namekian Village
  description: >
    {green}Houses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village,
    and there are less children in this village, it seems to be a farming village.{/green}
  sector: city
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10350
    south:
      to: tba:103:room:10348

"tba:103:room:10350":
  name: Namekian Village
  description: >
    {green}Houses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village,
    and there are less children in this village, it seems to be a farming village.{/green}
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10351
    west:
      to: tba:103:room:10349

"tba:103:room:10351":
  name: Namek Road
  description: >
    {green}The village just comes to a complete stop and a long road starts up, the road seems to lead
    off to a tall mountain.  The trees here are even more scarce then in the village, on the side of the
    road, there are many large boulders on the side of the road.{/green}
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10352
    south:
      to: tba:103:room:10350

"tba:103:room:10352":
  name: Namek Road
  description: >
    {green}The road continues, as you near the mountain you notice it is still getting taller and
    taller.  You wonder what the significance of the mountain could be. The boulders still line the road and
    there are less and less trees, the ground seems to be harder here as well.{/green}
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10353
    south:
      to: tba:103:room:10351

"tba:103:room:10353":
  name: Namek Road
  description: >
    {green}The mountain is straight ahead of you, it seems to be huge now, you can barely see the top
    of it, and yet there is a tree here and there, and the boulders are still on the side of the
    road.{/green}
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10354
    south:
      to: tba:103:room:10352

"tba:103:room:10354":
  name: At the Foot of the Mountain
  description: >
    {green}At the base of this huge mountain there is no grass and no trees, the mountain seems to just
    go straight up for a ways, it seems unclimbable, for it is just like one jagged cylindrcal piller. 
    It seems you are able to fy to the top though.{/green}
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    south:
      to: tba:103:room:10353
    up:
      to: tba:103:room:10355

"tba:103:room:10355":
  name: Flying Up the Mountain
  description: >
    {green}The ground is a bit further down, but if you wish to reach the top it is still far away, it
    might be easier to go back down.  {/green}{green}It seems to be getting a little warmer the further
    you go up.{/green}
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10356
    down:
      to: tba:103:room:10354

"tba:103:room:10356":
  name: Flying Up the Mountain
  description: >
    {green}The top is coming into view, but it is still a bit blurry, birds fly at this height, cawing
    and fluttering about.  {/green}{green}It seems to be getting a little warmer the further you go
    up.{/green}
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10357
    down:
      to: tba:103:room:10355

"tba:103:room:10357":
  name: Flying Up the Mountain
  description: >
    {green}The ground gets farther and farther away, the top starts to come into view but is not fully
    visible yet, it is still a little bit away.  {/green}{green}It seems to be getting a little warmer
    the further you go up.{/green}
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10358
    down:
      to: tba:103:room:10356

"tba:103:room:10358":
  name: Flying at the Top of the Mountain
  description: >
    {green}The long flight comes to and end here, the heat is almost unbearable, and the sun pounds
    down on you.  Towards the north is a large house, with a strange picture on the side.{/green}
  sector: flying
  flags: [no_mob]
  exits:
    north:
      to: tba:103:room:10359
    down:
      to: tba:103:room:10357

"tba:103:room:10359":
  name: In front of the Elders House
  description: >
    {green}A large white building sits in front of you, it has a front door, and two large horns
    protruding off of the top of it.  Above the door is a large round glass window.  The sun shines down
    warming the area.{/green}
  sector: inside
  exits:
    north:
      to: tba:103:room:10360
    south:
      to: tba:103:room:10358

"tba:103:room:10360":
  name: Elders House
  description: >
    {green}The elders house is a really large house with a tall ceiling.  There is a platform towards
    the back that will take you up to see him.  {/green}{green}The walls are bare here, nothing but a few
    cobwebs here and there, but it seems to be kept rather neat.{/green}
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:103:room:10359
    up:
      to: tba:103:room:10361

"tba:103:room:10361":
  name: Elders Room
  description: >
    {green}This is a huge room, at the front of the room sits the large round window you saw outside. 
    In the back center of the room is the Elder.  He is huge, quite possibly the largest namek you have
    ever seen.  He sits in a huge white chair with a Dragon Ball atop it.{/green}
  sector: inside
  flags: [indoors, peaceful]
  exits:
    down:
      to: tba:103:room:10360

"tba:103:room:10362":
  name: Towns Entrance
  description: >
    {cyan}Two large pillars stand here, and connected within them is a large gate. On either side of
    the gate are two large Dragons, both look so real it is eerie. The sound of voices comes from the other
    side of the gate, it seems there is a town there.{/cyan}
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10363
    west:
      to: tba:103:room:10305
      door:
        keywords: [Gate]
        kind: door
        key: tba:103:obj:10363

"tba:103:room:10363":
  name: A Dirt Path
  description: >
    {green}The ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like
    it too.  {/green}{green}No creatures or people seem to come here anymore, it is just one deserted
    road.{/green}
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10364
    west:
      to: tba:103:room:10362

"tba:103:room:10364":
  name: A Dirt Path
  description: >
    {green}The ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like
    it too.  {/green}{green}No creatures or people seem to come here anymore, it is just one deserted
    road.{/green}
  sector: forest
  exits:
    south:
      to: tba:103:room:10365
    west:
      to: tba:103:room:10363

"tba:103:room:10365":
  name: A Dirt Path
  description: >
    {green}The ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like
    it too.  {/green}{green}No creatures or people seem to come here anymore, it is just one deserted
    road.{/green}
  sector: forest
  exits:
    north:
      to: tba:103:room:10364
    south:
      to: tba:103:room:10366

"tba:103:room:10366":
  name: A Dirt Path
  description: >
    {green}The long dirt path seems to be coming to an end, towards the east there is a large lake that
    seems to fill a large area.  {/green}{green}No creatures or people seem to come here anymore, it is
    just one deserted road.{/green}
  sector: forest
  exits:
    north:
      to: tba:103:room:10365
    east:
      to: tba:103:room:10367

"tba:103:room:10367":
  name: The Lake
  description: >
    {bright_blue}The ground here is soft, and seems to be very fertile.  The air has a strange smell to
    it, kind of sweet in nature yet powerful.  No creatures are here, not even a bird. {/bright_blue}
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10368
    west:
      to: tba:103:room:10366

"tba:103:room:10368":
  name: Dark Forest
  description: >
    {green}This is a total change from the area west of here, the trees just seem to grow here, all
    around there are trees as far as the eye can see.  But the eye cannot see in here because the tree cover
    is so thick the light cannot penetrate it.  The air here smells stagnant and cold.  Sounds fill the
    area, making it impossible to think.{/green}
  sector: forest
  flags: [dark]
  exits:
    east:
      to: tba:103:room:10369
    west:
      to: tba:103:room:10367

"tba:103:room:10369":
  name: A Small Clearing
  description: >
    {green}The trees seem to suddenly stop growing, not even grass grows here, a large cylindricle rock
    lies in the center of this area, it seems to be the cause of the clearing.{/green}
  sector: forest
  exits:
    east:
      to: tba:103:room:10370
    west:
      to: tba:103:room:10368

"tba:103:room:10370":
  name: A Short Forest Path
  description: >
    {green}Darkness crawls upon this are once more, the trees on either side of the path are thick,
    causing the area to be dark.  Sounds emit from this area, causing an eerie feeling.{/green}
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:103:room:10371
    west:
      to: tba:103:room:10369

"tba:103:room:10371":
  name: A Large Clearing
  description: >
    {green}The darkness overcomes you no more, it seems to have left this place now. The grass grows
    freely and stands about waist high on either side of a short dirt path leading to a large dark
    cave.{/green}
  sector: forest
  exits:
    east:
      to: tba:103:room:10372
    south:
      to: tba:103:room:10370

"tba:103:room:10372":
  name: Opening to a Large Cave
  description: >
    {green}A mild odor comes from the large opening of the cave.  Moss grows wildly from its sides, and
    many types of mushrooms grow here as well.  The inside of the cave looks dark and moist, it seems to
    not have been entered in years.{/green}
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:103:room:10393
    east:
      to: tba:103:room:10373
    west:
      to: tba:103:room:10371

"tba:103:room:10373":
  name: Entering The Cave
  description: >
    {green}The air stagnates more as you walk in to the entrance of the cave.  A torch presides on the
    wall here makeing only a little visible, further into the cave you cannot see though.{/green}
  sector: inside
  flags: [tunnel]
  exits:
    east:
      to: tba:103:room:10374
    west:
      to: tba:103:room:10372

"tba:103:room:10374":
  name: Dark Cave
  description: >
    {green}The floor seems to steepen here, causing water to trickle down it every now and then, it
    also begins to get slimier, causing your feet to slip.  {/green}{green}It seems rare that anyone would
    ever enter such a dark dank place.{/green}
  sector: inside
  flags: [dark, tunnel]
  exits:
    east:
      to: tba:103:room:10375
    west:
      to: tba:103:room:10373

"tba:103:room:10375":
  name: Caves Intersection
  description: >
    {green}This area seems to have a kinda of natural light to it, but it does not originate from this
    room, the light seems to come from the north where a large ball of light can be seen.{/green}
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10376
    south:
      to: tba:103:room:10377
    west:
      to: tba:103:room:10374

"tba:103:room:10376":
  name: A Brightly Lit Cavern
  description: >
    {green}The ground seems to level here, and the air in this room smells fresh and warm.  A small orb
    lies in the middle of the cavern giving off a strange amount of light.{/green}
  sector: inside
  flags: [tunnel]
  exits:
    south:
      to: tba:103:room:10375

"tba:103:room:10377":
  name: Leaveing Dark Cave
  description: >
    {green}The air becomes less stagnant and more breathable, light begins to crawl back into the cave
    making it easier to see.  {/green}{green}The sound of rabbits comes from the outside, and the smell
    of flowers fills your nostrils.{/green}
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10375
    south:
      to: tba:103:room:10378

"tba:103:room:10378":
  name: Dark Caves Exit
  description: >
    {green}Light pours into the room from the large hole in the wall leading to the outside.  The fresh
    air seems to come as a shock seeing as how there was none inside the cave.{/green}
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10377
    south:
      to: tba:103:room:10379

"tba:103:room:10379":
  name: A Flower Field
  description: >
    {green}The smell of flowers fills your nostrils, the ground is not visible throught the flowers yet
    it seems the there is a path to the south leading you away from the flowers.{/green}
  sector: field
  exits:
    north:
      to: tba:103:room:10378
    south:
      to: tba:103:room:10380

"tba:103:room:10380":
  name: Path To the Villa
  description: >
    {green}This path is different from any you have seen, the stones are golden and perfectly round,
    and they glow beautifully.  The path goes south towards a small Villa.{/green}
  sector: city
  exits:
    north:
      to: tba:103:room:10379
    south:
      to: tba:103:room:10381

"tba:103:room:10381":
  name: In front of the Villa
  description: >
    {green}A small building with what looks like graffiti on the door is here, the door is slightly
    ajar, the path you stand on has the same circular golden stones as to the north.{/green}
  sector: city
  exits:
    north:
      to: tba:103:room:10380
    south:
      to: tba:103:room:10382

"tba:103:room:10382":
  name: Center of the Building
  description: >
    {green}This room seems to be the exact center of the Villa, it has a tall ceiling and a wooden
    floor that looks to have been freshly polished.  {/green}{green}Although the room is kept neat, it seems
    that no one has lived here for quite some time.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    north:
      to: tba:103:room:10381
    east:
      to: tba:103:room:10384
    south:
      to: tba:103:room:10385
    west:
      to: tba:103:room:10383

"tba:103:room:10383":
  name: Piccolo's Bedroom
  description: >
    {green}This is a small room, with a bed only large enough for one person, there is a small mat in
    the center of the room, it looks to be used for meditation.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    east:
      to: tba:103:room:10382

"tba:103:room:10384":
  name: The Villas Kitchen
  description: >
    {green}The room is small, but well lit, counters line the walls and a table sits in the center of
    the room, one chair is off to the corner of the room.  This room seems to be well kempt.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    south:
      to: tba:103:room:10390
    west:
      to: tba:103:room:10382

"tba:103:room:10385":
  name: A Dimly Lit Room
  description: >
    {green}There seems to be little light, the only light coming in seems to be distorted by the
    outline of your body in the doorframe.  In the center of the room is a hole only large enough for one
    person to fit in at a time.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10382
    down:
      to: tba:103:room:10386

"tba:103:room:10386":
  name: A Rusty Ladder
  description: >
    {green}The ladder that leads downwards is old and rusty, it feels as if it could break at any
    time.  {/green}{green}The ladder creeks under the strain you are putting on it, flecks of rust fall to the
    ground as well.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    up:
      to: tba:103:room:10385
    down:
      to: tba:103:room:10387

"tba:103:room:10387":
  name: Bottom of the Ladder
  description: >
    {green}The ladder ends abruptly, this room has a small light hanging from the ceiling, casting
    shadows on the walls from the boxes that cover this area. {/green}{green}The exit to the south seems
    clear, but it also seems to be very small.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    south:
      to: tba:103:room:10388
    up:
      to: tba:103:room:10386

"tba:103:room:10388":
  name: A Small Hallway
  description: >
    {green}The hallway isn't long at all, it is rather skinny as well.  There is nothing lining the
    walls here, and if there were it would make it impossible to travel.  To the east is a room that seems
    to be full of junk.{/green}
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10387
    east:
      to: tba:103:room:10389

"tba:103:room:10389":
  name: Storage Room
  description: >
    {green}The walls of this room are covered with old robots and old weapons, along with items.  There
    seems to be no walking space in this area, but you can see clearly with the light hanging from the
    ceiling.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    west:
      to: tba:103:room:10388

"tba:103:room:10390":
  name: A Ruined Room
  description: >
    {green}This room seems to have been decimated by some sort of large energy. Rubble lies all over
    the ground here, and the stone that is actually standing has large scorch marks on it.{/green}
  sector: inside
  flags: [house]
  exits:
    north:
      to: tba:103:room:10384
    south:
      to: tba:103:room:10391

"tba:103:room:10391":
  name: A Dark Room
  description: >
    {green}This rooms electric supply seems to have been cut off by the destruction of the other room,
    but an exit to the east can still be seen.  {/green}{green}It is hard to see what is happening in
    there, but sounds of gears and electricity come from the room to the east.{/green}
  sector: inside
  flags: [indoors, house]
  exits:
    north:
      to: tba:103:room:10390
    east:
      to: tba:103:room:10392

"tba:103:room:10392":
  name: Teleportation Room
  description: >
    {green}The teleportation room sits here, the floor is made of concrete, and the walls are made of
    wood.  A large circular object sits in the middle of the room, glowing and humming.{/green}
  sector: inside
  flags: [indoors, house, house_crash]
  exits:
    west:
      to: tba:103:room:10391

"tba:103:room:10393":
  name: Going To the Cave
  description: >
    {green}The ground is soft and moist, it feels as though a gentle rain just fell here, it is a calm
    serene place, and the smell of apples lingers in the air all around you.{/green}
  sector: forest
  exits:
    north:
      to: tba:103:room:10394
    south:
      to: tba:103:room:10372

"tba:103:room:10394":
  name: An Apple Orchard
  description: >
    {green}The ground is moist here as well, and the air still smells of apples, but it is stronger
    here then it would be anywhere else.  Apple Trees grow wildly here, and there is no other tree to be
    seen.{/green}
  sector: forest
  exits:
    south:
      to: tba:103:room:10393
    west:
      to: tba:103:room:10395

"tba:103:room:10395":
  name: End of an Apple Orchard
  description: >
    {green}The ground is moist here as well, and the air still smells of apples, but it is stronger
    here then it would be anywhere else.  Apple Trees grow wildly here, and there is no other tree to be
    seen.  To the north is a lot of brush.{/green}
  sector: forest
  exits:
    north:
      to: tba:103:room:10396
    east:
      to: tba:103:room:10394

"tba:103:room:10396":
  name: Start of the Brush
  description: >
    {green}The orchards end marks the beginning of the brush, it is thick, but there seems to be a path
    leading straight through it, the sounds of people come from the other side of the brush.{/green}
  sector: forest
  exits:
    north:
      to: tba:103:room:10397
