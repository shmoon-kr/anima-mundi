"tba:103:room:10336":
  name: End of the Small Hall
  description: >
    @gThe walls are close together, and the floor seems to be much nicer then the other areas of the
    building, it is a sleek marble and it has been freshly shined.  The hall is now over, if you go west,
    there seems to be someone there.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10335
    west:
      to: tba:103:room:10337

"tba:103:room:10337":
  name: A Small Kitchen
  description: >
    @gThis is also one of the nicer parts of the building, the floor is marble with a rug here and
    there, a nice chandelier hangs from the ceiling, and the walls are covered in a nice flowered wallpaper. 
    A table only large enough for three sits here, and three chairs are placed comfortably around it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10338
    east:
      to: tba:103:room:10336

"tba:103:room:10338":
  name: The Living Room
  description: >
    @gThis room looks nothing like the kitchen, it has a carpeted floor, a large couch, and a huge
    plasma TV on the wall.  Pictures of Vegeta, Bulma, and Truncks hang from the wall.  A faint whistling
    comes from the west, adding to the homely feeling.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:103:room:10337
    west:
      to: tba:103:room:10339

"tba:103:room:10339":
  name: Play Room
  description: >
    @gThe ground is covered in explicite silver tiles, and on the wall is another TV like the one in
    the Living room, but this one has a game system connected to it, and a young child with purple hair
    sits here playing it while whistling.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    east:
      to: tba:103:room:10338
    west:
      to: tba:103:room:10340

"tba:103:room:10340":
  name: The Garden
  description: >
    @gA Large arch is here, it is positioned at the start of a garden.  Through the arch you are able
    to see a magnificent lush garden, anything you could possibly think of resides in this place, in the
    its center is a huge oak tree, it provides shade for anyone who sits under it.
  sector: forest
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10339
    west:
      to: tba:103:room:10341

"tba:103:room:10341":
  name: A Garden Path
  description: >
    @gOn either side of you huge plants grow, vegetables are here, and many other types of plants you
    have never seen before.  Large rocks separate plant rows, acting as stepping stones for someone to
    walk through.
  sector: inside
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10340
    west:
      to: tba:103:room:10342

"tba:103:room:10342":
  name: A Large Oak Tree
  description: >
    @gThis area has been cleared, nothing grows here but a comfortable lush grass, a large oak tree is
    growing here, shading everyone who comes into this area, the sun cannot get through the leaves of
    this tree, it seems to have been placed here on purpose, a magical feeling is coming from the tree, it
    makes your body tingle.
  sector: forest
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10343
    east:
      to: tba:103:room:10341

