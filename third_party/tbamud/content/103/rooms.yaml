    @gHouses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village, and
    there are less children in this village, it seems to be a farming village.
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10349
    south:
      to: tba:103:room:10347

"tba:103:room:10349":
  name: Namekian Village
  description: >
    @gHouses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village, and
    there are less children in this village, it seems to be a farming village.
  sector: city
  flags: [peaceful]
  exits:
    east:
      to: tba:103:room:10350
    south:
      to: tba:103:room:10348

"tba:103:room:10350":
  name: Namekian Village
  description: >
    @gHouses are scarce here, but by every house is a little farm, the trees here are tall with a
    little fluff of leaves and branches at the very top.  There are also very few people in this village, and
    there are less children in this village, it seems to be a farming village.
  sector: city
  flags: [peaceful]
  exits:
    north:
      to: tba:103:room:10351
    west:
      to: tba:103:room:10349

"tba:103:room:10351":
  name: Namek Road
  description: >
    @gThe village just comes to a complete stop and a long road starts up, the road seems to lead off
    to a tall mountain.  The trees here are even more scarce then in the village, on the side of the road,
    there are many large boulders on the side of the road.
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10352
    south:
      to: tba:103:room:10350

"tba:103:room:10352":
  name: Namek Road
  description: >
    @gThe road continues, as you near the mountain you notice it is still getting taller and taller. 
    You wonder what the significance of the mountain could be. The boulders still line the road and there
    are less and less trees, the ground seems to be harder here as well.
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10353
    south:
      to: tba:103:room:10351

"tba:103:room:10353":
  name: Namek Road
  description: >
    @gThe mountain is straight ahead of you, it seems to be huge now, you can barely see the top of it,
    and yet there is a tree here and there, and the boulders are still on the side of the road.
  sector: field
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:103:room:10354
    south:
      to: tba:103:room:10352

"tba:103:room:10354":
  name: At the Foot of the Mountain
  description: >
    @gAt the base of this huge mountain there is no grass and no trees, the mountain seems to just go
    straight up for a ways, it seems unclimbable, for it is just like one jagged cylindrcal piller.  It
    seems you are able to fy to the top though.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    south:
      to: tba:103:room:10353
    up:
      to: tba:103:room:10355

"tba:103:room:10355":
  name: Flying Up the Mountain
  description: >
    @gThe ground is a bit further down, but if you wish to reach the top it is still far away, it might
    be easier to go back down.  @gIt seems to be getting a little warmer the further you go up.
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10356
    down:
      to: tba:103:room:10354

"tba:103:room:10356":
  name: Flying Up the Mountain
  description: >
    @gThe top is coming into view, but it is still a bit blurry, birds fly at this height, cawing and
    fluttering about.  @gIt seems to be getting a little warmer the further you go up.
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10357
    down:
      to: tba:103:room:10355

"tba:103:room:10357":
  name: Flying Up the Mountain
  description: >
    @gThe ground gets farther and farther away, the top starts to come into view but is not fully
    visible yet, it is still a little bit away.  @gIt seems to be getting a little warmer the further you go
    up.
  sector: flying
  flags: [no_mob]
  exits:
    up:
      to: tba:103:room:10358
    down:
      to: tba:103:room:10356

"tba:103:room:10358":
  name: Flying at the Top of the Mountain
  description: >
    @gThe long flight comes to and end here, the heat is almost unbearable, and the sun pounds down on
    you.  Towards the north is a large house, with a strange picture on the side.
  sector: flying
  flags: [no_mob]
  exits:
    north:
      to: tba:103:room:10359
    down:
      to: tba:103:room:10357

"tba:103:room:10359":
  name: In front of the Elders House
  description: >
    @gA large white building sits in front of you, it has a front door, and two large horns protruding
    off of the top of it.  Above the door is a large round glass window.  The sun shines down warming the
    area.
  sector: inside
  exits:
    north:
      to: tba:103:room:10360
    south:
      to: tba:103:room:10358

"tba:103:room:10360":
  name: Elders House
  description: >
    @gThe elders house is a really large house with a tall ceiling.  There is a platform towards the
    back that will take you up to see him.  @gThe walls are bare here, nothing but a few cobwebs here and
    there, but it seems to be kept rather neat.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:103:room:10359
    up:
      to: tba:103:room:10361

"tba:103:room:10361":
  name: Elders Room
  description: >
    @gThis is a huge room, at the front of the room sits the large round window you saw outside.  In
    the back center of the room is the Elder.  He is huge, quite possibly the largest namek you have ever
    seen.  He sits in a huge white chair with a Dragon Ball atop it.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    down:
      to: tba:103:room:10360

"tba:103:room:10362":
  name: Towns Entrance
  description: >
    @cTwo large pillars stand here, and connected within them is a large gate. On either side of the
    gate are two large Dragons, both look so real it is eerie. The sound of voices comes from the other
    side of the gate, it seems there is a town there.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10363
    west:
      to: tba:103:room:10305
      door:
        keywords: [Gate]
        kind: door
        key: tba:103:obj:10363

"tba:103:room:10363":
  name: A Dirt Path
  description: >
    @gThe ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like it
    too.  @gNo creatures or people seem to come here anymore, it is just one deserted road.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10364
    west:
      to: tba:103:room:10362

"tba:103:room:10364":
  name: A Dirt Path
  description: >
    @gThe ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like it
    too.  @gNo creatures or people seem to come here anymore, it is just one deserted road.
  sector: forest
  exits:
    south:
      to: tba:103:room:10365
    west:
      to: tba:103:room:10363

"tba:103:room:10365":
  name: A Dirt Path
  description: >
    @gThe ground has been trodden flat, it no longer looks like dirt, but rock, and it feels like it
    too.  @gNo creatures or people seem to come here anymore, it is just one deserted road.
  sector: forest
  exits:
    north:
      to: tba:103:room:10364
    south:
      to: tba:103:room:10366

"tba:103:room:10366":
  name: A Dirt Path
  description: >
    @gThe long dirt path seems to be coming to an end, towards the east there is a large lake that
    seems to fill a large area.  @gNo creatures or people seem to come here anymore, it is just one deserted
    road.
  sector: forest
  exits:
    north:
      to: tba:103:room:10365
    east:
      to: tba:103:room:10367

"tba:103:room:10367":
  name: The Lake
  description: >
    @BThe ground here is soft, and seems to be very fertile.  The air has a strange smell to it, kind
    of sweet in nature yet powerful.  No creatures are here, not even a bird. @n
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:103:room:10368
    west:
      to: tba:103:room:10366

"tba:103:room:10368":
  name: Dark Forest
  description: >
    @T@gThis is a total change from the area west of here, the trees just seem to grow here, all around
    there are trees as far as the eye can see.  But the eye cannot see in here because the tree cover is
    so thick the light cannot penetrate it.  The air here smells stagnant and cold.  Sounds fill the
    area, making it impossible to think.
  sector: forest
  flags: [dark]
  exits:
    east:
      to: tba:103:room:10369
    west:
      to: tba:103:room:10367

"tba:103:room:10369":
  name: A Small Clearing
  description: >
    @gThe trees seem to suddenly stop growing, not even grass grows here, a large cylindricle rock lies
    in the center of this area, it seems to be the cause of the clearing.
  sector: forest
  exits:
    east:
      to: tba:103:room:10370
    west:
      to: tba:103:room:10368

"tba:103:room:10370":
  name: A Short Forest Path
  description: >
    @gDarkness crawls upon this are once more, the trees on either side of the path are thick, causing
    the area to be dark.  Sounds emit from this area, causing an eerie feeling.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:103:room:10371
    west:
      to: tba:103:room:10369

"tba:103:room:10371":
  name: A Large Clearing
  description: >
    @gThe darkness overcomes you no more, it seems to have left this place now. The grass grows freely
    and stands about waist high on either side of a short dirt path leading to a large dark cave.
  sector: forest
  exits:
    east:
      to: tba:103:room:10372
    south:
      to: tba:103:room:10370

"tba:103:room:10372":
  name: Opening to a Large Cave
  description: >
    @gA mild odor comes from the large opening of the cave.  Moss grows wildly from its sides, and many
    types of mushrooms grow here as well.  The inside of the cave looks dark and moist, it seems to not
    have been entered in years.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:103:room:10393
    east:
      to: tba:103:room:10373
    west:
      to: tba:103:room:10371

"tba:103:room:10373":
  name: Entering The Cave
  description: >
    @gThe air stagnates more as you walk in to the entrance of the cave.  A torch presides on the wall
    here makeing only a little visible, further into the cave you cannot see though.
  sector: inside
  flags: [tunnel]
  exits:
    east:
      to: tba:103:room:10374
    west:
      to: tba:103:room:10372

"tba:103:room:10374":
  name: Dark Cave
  description: >
    @gThe floor seems to steepen here, causing water to trickle down it every now and then, it also
    begins to get slimier, causing your feet to slip.  @gIt seems rare that anyone would ever enter such a
    dark dank place.
  sector: inside
  flags: [dark, tunnel]
  exits:
    east:
      to: tba:103:room:10375
    west:
      to: tba:103:room:10373

"tba:103:room:10375":
  name: Caves Intersection
  description: >
    @gThis area seems to have a kinda of natural light to it, but it does not originate from this room,
    the light seems to come from the north where a large ball of light can be seen.
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10376
    south:
      to: tba:103:room:10377
    west:
      to: tba:103:room:10374

"tba:103:room:10376":
  name: A Brightly Lit Cavern
  description: >
    @gThe ground seems to level here, and the air in this room smells fresh and warm.  A small orb lies
    in the middle of the cavern giving off a strange amount of light.
  sector: inside
  flags: [tunnel]
  exits:
    south:
      to: tba:103:room:10375

"tba:103:room:10377":
  name: Leaveing Dark Cave
  description: >
    @gThe air becomes less stagnant and more breathable, light begins to crawl back into the cave
    making it easier to see.  @gThe sound of rabbits comes from the outside, and the smell of flowers fills
    your nostrils.
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10375
    south:
      to: tba:103:room:10378

"tba:103:room:10378":
  name: Dark Caves Exit
  description: >
    @gLight pours into the room from the large hole in the wall leading to the outside.  The fresh air
    seems to come as a shock seeing as how there was none inside the cave.
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:103:room:10377
    south:
      to: tba:103:room:10379

"tba:103:room:10379":
  name: A Flower Field
  description: >
    @gThe smell of flowers fills your nostrils, the ground is not visible throught the flowers yet it
    seems the there is a path to the south leading you away from the flowers.
  sector: field
  exits:
    north:
      to: tba:103:room:10378
    south:
      to: tba:103:room:10380

"tba:103:room:10380":
  name: Path To the Villa
  description: >
    @gThis path is different from any you have seen, the stones are golden and perfectly round, and
    they glow beautifully.  The path goes south towards a small Villa.
  sector: city
  exits:
    north:
      to: tba:103:room:10379
    south:
      to: tba:103:room:10381

"tba:103:room:10381":
  name: In front of the Villa
  description: >
    @gA small building with what looks like graffiti on the door is here, the door is slightly ajar,
    the path you stand on has the same circular golden stones as to the north.
  sector: city
  exits:
    north:
      to: tba:103:room:10380
    south:
      to: tba:103:room:10382

"tba:103:room:10382":
  name: Center of the Building
  description: >
    @gThis room seems to be the exact center of the Villa, it has a tall ceiling and a wooden floor
    that looks to have been freshly polished.  @gAlthough the room is kept neat, it seems that no one has
    lived here for quite some time.
  sector: inside
  flags: [indoors, house]
  exits:
    north:
      to: tba:103:room:10381
    east:
      to: tba:103:room:10384
    south:
      to: tba:103:room:10385
    west:
      to: tba:103:room:10383

"tba:103:room:10383":
  name: Piccolo's Bedroom
  description: >
    @gThis is a small room, with a bed only large enough for one person, there is a small mat in the
    center of the room, it looks to be used for meditation.
  sector: inside
  flags: [indoors, house]
  exits:
    east:
      to: tba:103:room:10382

"tba:103:room:10384":
  name: The Villas Kitchen
  description: >
    @gThe room is small, but well lit, counters line the walls and a table sits in the center of the
    room, one chair is off to the corner of the room.  This room seems to be well kempt.
  sector: inside
  flags: [indoors, house]
  exits:
    south:
      to: tba:103:room:10390
    west:
      to: tba:103:room:10382

"tba:103:room:10385":
  name: A Dimly Lit Room
  description: >
    @gThere seems to be little light, the only light coming in seems to be distorted by the outline of
    your body in the doorframe.  In the center of the room is a hole only large enough for one person to
    fit in at a time.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10382
    down:
      to: tba:103:room:10386

"tba:103:room:10386":
  name: A Rusty Ladder
  description: >
    @gThe ladder that leads downwards is old and rusty, it feels as if it could break at any time. 
    @gThe ladder creeks under the strain you are putting on it, flecks of rust fall to the ground as well.
  sector: inside
  flags: [indoors, house]
  exits:
    up:
      to: tba:103:room:10385
    down:
      to: tba:103:room:10387

"tba:103:room:10387":
  name: Bottom of the Ladder
  description: >
    @gThe ladder ends abruptly, this room has a small light hanging from the ceiling, casting shadows
    on the walls from the boxes that cover this area. @gThe exit to the south seems clear, but it also
    seems to be very small.
  sector: inside
  flags: [indoors, house]
  exits:
    south:
      to: tba:103:room:10388
    up:
      to: tba:103:room:10386

"tba:103:room:10388":
  name: A Small Hallway
  description: >
    @gThe hallway isn't long at all, it is rather skinny as well.  There is nothing lining the walls
    here, and if there were it would make it impossible to travel.  To the east is a room that seems to be
    full of junk.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:103:room:10387
    east:
      to: tba:103:room:10389

"tba:103:room:10389":
  name: Storage Room
  description: >
    @gThe walls of this room are covered with old robots and old weapons, along with items.  There
    seems to be no walking space in this area, but you can see clearly with the light hanging from the
    ceiling.
  sector: inside
  flags: [indoors, house]
  exits:
    west:
      to: tba:103:room:10388

"tba:103:room:10390":
  name: A Ruined Room
  description: >
    @gThis room seems to have been decimated by some sort of large energy. Rubble lies all over the
    ground here, and the stone that is actually standing has large scorch marks on it.
  sector: inside
  flags: [house]
  exits:
    north:
      to: tba:103:room:10384
    south:
      to: tba:103:room:10391

"tba:103:room:10391":
  name: A Dark Room
  description: >
    @gThis rooms electric supply seems to have been cut off by the destruction of the other room, but
    an exit to the east can still be seen.  @gIt is hard to see what is happening in there, but sounds of
    gears and electricity come from the room to the east.
  sector: inside
  flags: [indoors, house]
  exits:
    north:
      to: tba:103:room:10390
    east:
      to: tba:103:room:10392

"tba:103:room:10392":
  name: Teleportation Room
  description: >
    @gThe teleportation room sits here, the floor is made of concrete, and the walls are made of wood. 
    A large circular object sits in the middle of the room, glowing and humming.
  sector: inside
  flags: [indoors, house, house_crash]
  exits:
    west:
      to: tba:103:room:10391

"tba:103:room:10393":
  name: Going To the Cave
  description: >
    @gThe ground is soft and moist, it feels as though a gentle rain just fell here, it is a calm
    serene place, and the smell of apples lingers in the air all around you.
  sector: forest
  exits:
    north:
      to: tba:103:room:10394
    south:
      to: tba:103:room:10372

"tba:103:room:10394":
  name: An Apple Orchard
  description: >
    @gThe ground is moist here as well, and the air still smells of apples, but it is stronger here
    then it would be anywhere else.  Apple Trees grow wildly here, and there is no other tree to be seen.
  sector: forest
  exits:
    south:
      to: tba:103:room:10393
    west:
      to: tba:103:room:10395

"tba:103:room:10395":
  name: End of an Apple Orchard
  description: >
    @gThe ground is moist here as well, and the air still smells of apples, but it is stronger here
    then it would be anywhere else.  Apple Trees grow wildly here, and there is no other tree to be seen. 
    To the north is a lot of brush.
  sector: forest
  exits:
    north:
      to: tba:103:room:10396
    east:
      to: tba:103:room:10394

"tba:103:room:10396":
  name: Start of the Brush
  description: >
    @gThe orchards end marks the beginning of the brush, it is thick, but there seems to be a path
    leading straight through it, the sounds of people come from the other side of the brush.
  sector: forest
  exits:
    north:
      to: tba:103:room:10397
    south:
      to: tba:103:room:10395

"tba:103:room:10397":
  name: Path Through the Brush
  description: >
    @gThe brush seems to have been cleared out in this area explicitly for walking, the brush on both
    sides of you looks to be dangerious.  @g It looks as if there are multiple animals caught in the brush
    on both sides.
  sector: forest
  exits:
    north:
      to: tba:103:room:10398
    south:
      to: tba:103:room:10396

"tba:103:room:10398":
  name: A Dangerous Path
  description: >
    @gThe large pile of brush seems to have not been placed there on purpose, it seems as though it has
    grown there over the years, and it grows here as well, but not as much, for it seems to have been
    trodden down by people.
  sector: field
  exits:
    south:
      to: tba:103:room:10397
    west:
      to: tba:103:room:10399

"tba:103:room:10399":
  name: Journeys End Inn
  description: >
    @gA large torn looking building cast shadows all over the place.  A sign on the door shows you that
    this place has been closed for many years.  The windows are broken, and a few are just missing.
  sector: city
  exits:
    east:
      to: tba:103:room:10398
