  name: Soaring Over the Ocean
  description: >
    {green}The sun shines down hard, and the air smells of salt, Seaguls are more abundant here then
    they were on the beach and this does place is not as soothing either.  {/green}
  sector: flying
  exits:
    east:
      to: tba:103:room:10325
    west:
      to: tba:103:room:10314

