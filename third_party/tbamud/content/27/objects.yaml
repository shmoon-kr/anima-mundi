"tba:27:obj:2706":
  type: other
  keywords: [ragged, diary, book, "1"]
  short: a ragged diary
  long: A ragged book has been left here.
  flags: [no_rent, no_sell]
  wear: [take]
  values:
    raw: [0, 0, 0, 0]
  weight: 5
  cost: 1
  rent: 0
  level: 0
  extras:
  - keywords: [ragged, diary]
    text:
    - >
      This dark leather book is almost falling apart, although there appears to be very little written
      inside it. The word {green}PRIVATE{/green} has been carefully carved into the cover.
    - (type look 1, 2, or 3 to view pages)
  - keywords: ["3"]
    text:
    - "{bright_green} {/bright_green}{green}Entry 3{/green}"
    - >
      Somehow I fear this may be my last entry.  I have been recruited, along with several others for a
      secret task by the sorceress' evil bird.  What the task is I do not yet know, but I know that the
      sorceress has a particular way of keeping her secrets, and it does not involve the survival of witnesses.
  - keywords: ["2"]
    text:
    - "{bright_green} {/bright_green}{green}Entry 2{/green}"
    - >
      Someone came to help us today, he told me he knew how to destroy the sorceress once and for all.  I
      thought he would be the one to succeed but he was killed by the toothy one.  Now the abominable
      creature has holed itself into a cave from which there is no return... or so it is claimed.
  - keywords: ["1"]
    text:
    - "{bright_green} {/bright_green}{green}Entry 1{/green}"
    - >
      I have lost all interest in keeping this diary.  Since the sorceress has taken over, life has not
      been worth writing about.  I shall instead record anything I observe that may aid in her demise,
      though it will mean my death should this book be found.

