"tba:27:obj:2774":
  type: note
  keywords: [folded, note]
  short: a folded note
  long: A folded note lies dropped here.
  action: |-
    Ah, I have a small task for you faithful one.
    
    No doubt you know of the Dynar scum that came here to kill me. Well, as
    expected he was of no match against my protector. Unfortunately, the
    wretched creature had a powerful weapon with him, infused with Dynar
    magic. It has utterly overcome my protector, poisoned him beyond the point
    of return, and although he remains loyal to me I cannot have an item of such
    power in the hands of one so corrupted.
    
    He no doubt knows this himself, for he has hidden himself away with the help
    of those worthless memlins. They call him the toothy one, and I have finally
    found the door to his hideout, although he has actually invoked some Dynar
    magic to keep me out.
    
    In any case, if I cannot break in, I shall make certain he never gets out. This
    is where your task comes in.
    
    Go into the heart of the mines, there in a niche to the east you will find a
    group of memlins digging at the southern wall. This is where the hidden
    ivorydoor lies, and no doubt they will have had no success at breaking
