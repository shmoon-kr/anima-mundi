# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 43.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:43:room:4300":
  name: Polar/Walrus Zone Description Room
  description:
    preformatted: |2
         This zone is made for leveling up and experience.  Because in CW there are
      little places to get good or even moderate exp.  This zone will have two
      halves.  In the first half there will be penguins on a large scale in a
      community in the northern wastes of Ilnyir.  The other half is the city of
      eskimos, Rankit.  Rankit is ruled by a gluttonus king, Glogtar, and does little
      for his kingdom.
      Rooms: 95
      Objs: 23
      Mobs: 17
      Location: Branching of west from 8601 to 4396 leading to the icy bridge
      Zone 43 was linked to the following zones:
      86 Duke Kalithorn's Keep          at  4396 (east ) --->  8601
  sector: inside
  flags: [indoors, private]

"tba:43:room:4301":
  name: An Ice Bridge
  description: >
    Standing on a bridge of ice you almost slip off into the gully below.  On a bridge made of ice. 
    Don't lose your balance!  To the north you see the end of the bridge, and past it is vast, white,
    nothing.  To the northwest you see smoke rising from an unknown village.
  sector: field
  exits:
    north:
      to: tba:43:room:4302
    south:
      to: tba:43:room:4399
  extras:
  - keywords: [north]
    text: More ice bridge.

"tba:43:room:4302":
  name: An Ice Bridge
  description: >
    Standing in the middle of an ice bridge.  It looks very slippery, don't fall off!  Beyond in the
    distance there is a large pillar of smoke rising of what seems to be rising from a small village in the
    northwest.  You stand there and think, Eskimos?
  sector: field
  exits:
    north:
      to: tba:43:room:4303
    south:
      to: tba:43:room:4301
  extras:
  - keywords: [south]
    text: More ice bridge.
  - keywords: [north]
    text: More ice bridge.

"tba:43:room:4303":
  name: An Ice Bridge
  description: >
    At the end of an ice bridge.  You didn't fall off.  It nows seems there really are eskimos in this
    barren land of snow and ice.  There are many black dots moving around aimlessly to the northeast.
  sector: field
  exits:
    north:
      to: tba:43:room:4304
    south:
      to: tba:43:room:4302
  extras:
  - keywords: [south]
    text: More ice bridge.

"tba:43:room:4304":
  name: An Icy Trail
  description: >
    While on this winding trail totally consumed by ice and unpacked snow you suddenly see a field to
    the north open up.  There are very few footprints in the snow.  To the north there is more nothing
    than you ever thought there could be.
  sector: field
  exits:
    north:
      to: tba:43:room:4305
    south:
      to: tba:43:room:4303

"tba:43:room:4305":
  name: An Icy Crossroads
  description: >
    The trail looks exactly the same as it did before except for the fact that there is a three way
    split in the trail.  To the north, snow, ice, and black figures wondering about.  To the west, a barely
    definable trail.
  sector: field
  exits:
    north:
      to: tba:43:room:4306
    south:
      to: tba:43:room:4304
    west:
      to: tba:43:room:4333

"tba:43:room:4306":
  name: An Icy Trail
  description: >
    The snow and ice on this path is not packed so it makes moving around difficult.  The trail
    continues to the north where there is a turn in the path leading to a wide open field.  Back to the south
    there is a split in the trail.
  sector: field
  exits:
    east:
      to: tba:43:room:4308
    south:
      to: tba:43:room:4305

"tba:43:room:4307":
  name: A Turn in an Icy Trail
  description: >
    The trail takes a turn here.  You stand and watch all the penguins wondering aimlessly in circles
    to the east.  Far to the east you see what seems to be a shoreline.  To the south a path of ice and
    snow.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:43:room:4308
    south:
      to: tba:43:room:4306

"tba:43:room:4308":
  name: The Beginning of a Snow Field
  description: >
    There is a fine layer of freshley fallen snow on the hard packed, very thick snow.  There are
    penguins all about you.  Way to the northeast there is a large structure made of ice.  The only thing you
    see for miles around is ice,penguins, and snow.
  sector: field
  exits:
    north:
      to: tba:43:room:4317
    east:
      to: tba:43:room:4309
    west:
      to: tba:43:room:4307

"tba:43:room:4309":
  name: Snow Field
  description: >
    It is still snowing in this baren, forsaken land of ice.  Only the penguins and a couple lumps of
    some sort of creature roam these lands.  The penguins are many and with their babies seem many more. 
    As you scan your surroundings you see a large hump of ice to the northeast.
  sector: field
  exits:
    north:
      to: tba:43:room:4316
    east:
      to: tba:43:room:4310
    west:
      to: tba:43:room:4308

"tba:43:room:4310":
  name: A Snow Field
  description: >
    This field is heavily trampled with tracks that have webbing in them.  The penguins are still
    waddling around seemingly mindless.  But as you look closer at the many tracks there are some that dont
    look like a bird.
  sector: field
  exits:
    north:
      to: tba:43:room:4315
    east:
      to: tba:43:room:4311
    west:
      to: tba:43:room:4309

"tba:43:room:4311":
  name: A Field of Packed Snow
  description: >
    The snow here is packed from constant use.  You can not distinguish one track from another. 
    Although it is very very cold the penguins are still out in full force.
  sector: field
  exits:
    north:
      to: tba:43:room:4314
    east:
      to: tba:43:room:4312
    west:
      to: tba:43:room:4310

"tba:43:room:4312":
  name: Into a Snow Field
  description: >
    You are now very far into this land of frozen nothing.  You see strait to the north a small hole in
    the ice.  Penguins still skid along their bellies and waddle around on their feet.  You now also see
    what the animal was that was making those tracks earlier.  They are walruses!
  sector: field
  exits:
    north:
      to: tba:43:room:4313
    west:
      to: tba:43:room:4311

