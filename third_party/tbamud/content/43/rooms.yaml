"tba:43:room:4328":
  name: Down the Ice Hole
  description: >
    As you look up through the hole you just came through you relize you can stand up and look out of
    it.  To the north is a long tunnel with a bright blue light coming out of it.  At the end of the
    tunnel it seems there is a very large room.
  sector: field
  flags: [tunnel]
  exits:
    north:
      to: tba:43:room:4330
    up:
      to: tba:43:room:4323

"tba:43:room:4329":
  name: Inside an Igloo
  description: >
    The interior of this igloo would make someone feel young again.  There are babies wailing about
    something, they must be orphans by the look of the adults. With only a couple adults to watch over them
    some of them seem to be very mischeivious.
  sector: inside
  exits:
    south:
      to: tba:43:room:4323

"tba:43:room:4330":
  name: Through an Ice Tunnel
  description: >
    This tunnel is big for a gaint!  You wonder how a penguin could possibly reach that high!  The
    walls are smootheed away from constant use and wearing. The ice here never seems to melt; for as you put
    your hand on it and take it of, there is no water.  To the north is a very large, cavernous room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:43:room:4331
    south:
      to: tba:43:room:4328

"tba:43:room:4331":
  name: Through an Ice Tunnel
  description: >
    The ice reflects a brilliant light that almost blinds you.  You don't know where the light is
    comeing from.  As you look around you are astonished that there aren't even any torches, lanterns, or
    anything that gives of any light at all.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:43:room:4332
    south:
      to: tba:43:room:4330

"tba:43:room:4332":
  name: Royal Penguins Chamber
  description: >
    This Room is enormous!  The walls are almost translucent as you look into them.  You see behind the
    Royal Penguin's throne, a chest implanted in the ice. The throne itself seems much to big for any
    penguin you have come across so far.  The ice on the ground on either side of the throne is well worn. 
    Those grooves in the ice may be the posts for the loyal guards of the royal penguin.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:43:room:4331
  extras:
  - keywords: [wall]
    text: >
      The walls in this room are perfectly smoothed away and still refecting that strange blue light. 
      You think the light must be coming from outside for there are no lights in here.
  - keywords: [throne, chair]
    text: >
      This chair made completly of ice is suberbly crafted and sqared away.  It seems to be made of one
      block of ice as you can see no grooves to mark that it is not.  The seat of the chair is very low in
      humanoid standards, but penguins see it not fit to be in high places.

"tba:43:room:4333":
  name: Snowy Trail
  description: >
    This trail seems not to be used very much if at all.  You can clearly see the village of eskimos
    now.  You see back to the east the trail that continues north.  To the west the trail seems very short,
    but all this white nay be affecting your sight.
  sector: field
  exits:
    east:
      to: tba:43:room:4305
    west:
      to: tba:43:room:4334

"tba:43:room:4334":
  name: Snowy Trail
  description: >
    Continuing along the trail it seems to become more used.  The tracks in the the snow here are
    deeper and there are more of them; but not many more. Coming closer to the eskimo village you see people
    bustling about in there everyday chores.
  sector: field
  exits:
    north:
      to: tba:43:room:4335
    east:
      to: tba:43:room:4333

"tba:43:room:4335":
  name: Above the Eskimo Village
  description: >
    On top of this hill looking down upon the village of eskimos there is an incredible view of the
    entire city.  Someone could come up here and look upon the entire workings of the city.  Far away to the
    east there is a large open field with many objects moving about.
  sector: inside
  exits:
    south:
      to: tba:43:room:4334
    down:
      to: tba:43:room:4336

"tba:43:room:4336":
  name: ICE!!!
  description:
  - As you walk down toward the eskimo's village you suddenly slip on a patch of ice and
  - F
  - A
  - L
  - L
  sector: field
  flags: [no_mob]
  exits:
    down:
      to: tba:43:room:4337

"tba:43:room:4337":
  name: Outside a Wall of Ice
  description: >
    Standing outside of a massive wall of glittering ice there is no crack of any kind to signify ot
    was built, but rather frozen out of the very air.  The wall stands close to twenty feet high and,
    through the large iron gate set in the ice, six feet thick.  In front of the gate stands an engraved
    sign.  Above is a steep icy path that dosen't seem to be possible to climb up.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:43:room:4338
      look: Nothing.
      door:
        keywords: [Gate]
        kind: door
        reset: closed

"tba:43:room:4338":
  name: Intersection of Whale Street and Arivat Avenue.
  description: >
    The beautiful city of Rankit opens up before you at full length from here.. The snow gleams in the
    sun and crunches under your feet.  People bundled in very warm clothes are hurrying about with there
    buissness.  To the north Arivat Avenue runs to a busy town square.  Whale Street runs east ans west. 
    To the south is the giant wall with the large gate set in the ice.
  sector: city
  exits:
    north:
      to: tba:43:room:4339
    east:
      to: tba:43:room:4373
    south:
      to: tba:43:room:4337
      door:
        keywords: [Gate]
        kind: door
        reset: closed
    west:
      to: tba:43:room:4374

"tba:43:room:4339":
  name: Arivat Avenue
  description: >
    The road here is made of ice on the bottom and snow on the top for traction. There are many sled
    tracks through the area along with many more dog tracks. To the south is the main gate of the city and
    to the north is a busy market place.
  sector: city
  exits:
    north:
      to: tba:43:room:4340
    south:
      to: tba:43:room:4338

"tba:43:room:4340":
  name: Avivat Avenue
  description: >
    This is the main street of the city of Rankit.  There are many igloos about, they all look the
    same.  The townspeople must be able to tell them apart some how.  There are many people going about their
    buissness about you.  To the west there is a sign with a tunic on it and to the east a sign with a
    butcher's knife.  Just to the north is a busy square.
  sector: city
  exits:
    north:
      to: tba:43:room:4341
    east:
      to: tba:43:room:4388
    south:
      to: tba:43:room:4339
    west:
      to: tba:43:room:4387

"tba:43:room:4341":
  name: Rankit Square
  description: >
    Standing by a large fountain in this extremly busy town square the snow starts falling very lightly
    and the townsfolk don't even care.  There are so many people in this little town it could be thought
    impossible by many in such a desolate place.  The snow glistings off of everything covered in it. 
    There is a small post by the fountain with many numbers on it measuring the snow. The snow reaches up
    to the 13' foot mark upon closer examination.  Also on the post there is a dark line at the 18.5 mark
    which must be the highest snow fall ever.  There are stairs going down from the south side of the
    fountain.
  sector: city
  exits:
    north:
      to: tba:43:room:4342
    east:
      to: tba:43:room:4345
    south:
      to: tba:43:room:4340
    west:
      to: tba:43:room:4349
    down:
      to: tba:43:room:4389

"tba:43:room:4342":
  name: Arivat Avenue
  description: >
    The town square is a busy place and so is this street there are many hunters returning from
    expeditions with many pelts of many different animals.  There is a fresh smell coming from the west and the
    clink of metal coming from the east. To the south is the fountain of clear water and to the north
    there is the north gate.
  sector: city
  exits:
    north:
      to: tba:43:room:4343
    east:
      to: tba:43:room:4386
    south:
      to: tba:43:room:4341
    west:
      to: tba:43:room:4385

"tba:43:room:4343":
  name: Arivat Avenue
  description: >
    The street here is just like the rest of it, icy with packed snow on the top.  The gurgling of the
    fountain at the square can be faintly heard from here.  There is nothing mush to see here but the
    igloo houses lining the streets.
  sector: city
  exits:
    north:
      to: tba:43:room:4344
    south:
      to: tba:43:room:4342

"tba:43:room:4344":
  name: Intersection of Arivat Avenue and Artic Street.
  description: >
    The intersection of the main road and the northern most road in town is not quite as busy as might
    have been guessed.  The northern gate here seems to be well barred and impassible.  What is out there
    to the very northern reaches of Illniyr?
  sector: city
  exits:
    east:
      to: tba:43:room:4353
    south:
      to: tba:43:room:4343
    west:
      to: tba:43:room:4357

"tba:43:room:4345":
  name: Nunavut Street
  description: >
    This street crosses with the main street at the square just to the west. The weapon shop and the
    butchery are to the north and south but the doors here say private only.  To the east is the east gate
    of Rankit.
  sector: city
  exits:
    east:
      to: tba:43:room:4346
    west:
      to: tba:43:room:4341

"tba:43:room:4346":
  name: Intersection of Nunavut Street and Ice Lane
  description: >
    This intersection doesn't have many people in it.  The roads have many igloos along the side of
