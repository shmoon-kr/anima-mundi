"tba:43:room:4323":
  name: On an Ice Slick
  description: >
    Standing on this very slippery section of ice you notice a hole in the ice. The hole is just large
    enough for a large dwarf through.  There is no snow at all around the hole so the ice is practically
    see through.  There is an igloo to the north which looks well tended for.  All around to the south
    and east is a very large field.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:43:room:4329
    south:
      to: tba:43:room:4322
    west:
      to: tba:43:room:4324
    down:
      to: tba:43:room:4328

"tba:43:room:4324":
  name: Into a Snow Field
  description: >
    Now you are very far into this field of frozen nothing.  The ice building you saw earlier is now
    much closer and strait to the east.  Penguins still skid along their bellies and waddle around on their
    feet.  You now also see what the animal was that was making those tracks earlier.  They are walruses!
  sector: field
  exits:
    east:
      to: tba:43:room:4323
    south:
      to: tba:43:room:4321
    west:
      to: tba:43:room:4325

