"tba:43:room:4385":
  name: Rankit Food Supply
  description: >
    The smell of freshly baked food eminates from this shop.  There is a list on the counter for all to
    see the contents of the shop.  There are four large ovens on the back wall releaseing heat that
    makes this room at least 20 degrees warmer than outside.
  sector: inside
  exits:
    east:
      to: tba:43:room:4342

"tba:43:room:4386":
  name: Rankit Weaponry
  description: >
    There is a large clamor of metal on heated metal as you enter.  The weapons lining the walls are
    all polished and shining waiting to be used for good or evil.  The heat here is unbearably hot as the
    room is stuffy and congested. The temperature outside must be at least 50 degrees lower than in here.
  sector: inside
  exits:
    west:
      to: tba:43:room:4342

"tba:43:room:4387":
  name: Rankit Tunic Fitter
  description: >
    While standing in this room with fur lined leather clothing upon every wall the young shopkeeper
    stands and greets you upon entering.  There are sewing needles and unfinished hides littering the
    floor, evidence of continued buissness.
  sector: inside
  exits:
    east:
      to: tba:43:room:4340
  extras:
  - keywords: [hides, skins]
    text: >
      The hides that line the walls are tanned and shaped.  They are just models for the sizing is
      different for different people.

"tba:43:room:4388":
  name: The Butchery
  description: >
    Blood stained snow seeps out onto the snow outside.  The odor is unbearable as you enter as it
    smells like long over due socks that need washing.  Other fouler smells are mixed throughout the area but
    none worse than the smell of dead animals.  No one seems to be able to cope with the smell except
    for the butcher himself as you see residents come in then run out.
  sector: inside
  exits:
    west:
      to: tba:43:room:4340

"tba:43:room:4389":
  name: Entrance to Glogtar's Throne Room
  description: >
    The steps leading back up to a hole in the snow emerges out in the air of the center of the city. 
    Nobody comes here from the outside for fear of seeing their dictator, Glogtar the Ruler of Ice.  To
    the north is a tunnel with a large light coming from the end.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:43:room:4390
    up:
      to: tba:43:room:4341

"tba:43:room:4390":
  name: A Tunnel Through the Snow
  description: >
    Walking along the tunnel under the snow you hear the sound of feet above you.  The light to the
    north is getting bigger if you continue northward.  Or the stairs are just to the south if you wish to
    leave the presense of Glogtar.
  sector: inside
  exits:
    north:
      to: tba:43:room:4391
    south:
      to: tba:43:room:4389

"tba:43:room:4391":
  name: A Tunnel Through the Snow
  description: >
    The stairs are away at the end of this tunnel with the sun filtering down through the hole that is
    continually cleared of snow.  Just to the north is the throne of Glogtar.  The light coming there is
    bright and does not flicker.  If there was a fire here it would melt and collapse the whole chamber
    and tunnel causing the raod below to cave in.
  sector: inside
  exits:
    north:
      to: tba:43:room:4392
    south:
      to: tba:43:room:4390

"tba:43:room:4392":
  name: Throne of Glogtar
  description: >
    Glogtar seems to be a very large man.  His throne, sitting here, is twice the size it should be for
    his size.  The snow is neatly packed around the chamber and dug out so you have to decend several
    steps to come upon the Ruler of the Ice.  Servants constantly coming in and out through a small entry
    way in the west side of the wall bring their king delicacies.  To the south is the exit and there is a
    small intricately carved door to te east.
  sector: inside
  exits:
    east:
      to: tba:43:room:4393
      door:
        keywords: [door]
        kind: door
        key: tba:43:obj:4322
        reset: locked
    south:
      to: tba:43:room:4391
    west:
      to: tba:43:room:4341
      door:
        keywords: [hidden]
        kind: door
        reset: closed
  extras:
  - keywords: [throne]
    text: >
      The throne is carved very delicately and very skillfully.  The carving in the wood has many curves
      and intricate lacings throughout the intirething from the legs to the head.

"tba:43:room:4393":
  name: Treasure Room
  description: >
    This room is lined with steel and looks like a prison cell.  The one exception to it being a prison
    is the HUGE amount of money sitting in the corner.  The only way out is the way you came in.
  sector: inside
  exits:
    west:
      to: tba:43:room:4392
      door:
        keywords: [door]
        kind: door
        key: tba:43:obj:4322
        reset: locked

"tba:43:room:4394":
  name: A Hunting Trail
  description: >
    You are on a game path.  Many animals have come by here to be attacked and killed to be eaten. 
    There are eskimo tracks everywhere heading to the east were the hunting trail leads on.
  sector: field
  exits:
    east:
      to: tba:43:room:4395
    west:
      to: tba:43:room:4348
      door:
        keywords: [gate]
        kind: door
        reset: closed

"tba:43:room:4395":
  name: A hunting Trail
  description: >
    The trail turns east and is quickly lost to the skill of eskimo hunters in snow.  Save the very
    fine foots prints hardly noticeable to the naked eye.  To the west is the gate of Rankit and to the
    south is barren lands of snow and ice.
  sector: field
  exits:
    south:
      to: tba:43:room:4335
    west:
      to: tba:43:room:4394

"tba:43:room:4396":
  name: A Mud Trail
  description: >
    The road becomes wet with melted water from the north.  The water seeps between your toes and is
    uncomfortably cold.  The trail continues west through more mud and back east to dry dirt.
  sector: field
  exits:
    west:
      to: tba:43:room:4397

"tba:43:room:4397":
  name: A Mud Trail
  description: >
    The surroundings are changing as the weather becomes colder and the ground begins to freeze.  The
    mud is becoming harder and a chill wind begins blowing from the north and west.  To the east is the
    warmth of the minotaur city, Dun Maura.  To the north is a wasteland of cold.
  sector: field
  exits:
    north:
      to: tba:43:room:4398
    east:
      to: tba:43:room:4396

"tba:43:room:4398":
  name: A Cold, Wet Trail
  description: >
    The trail is very wet and very cold now.  The mud has disappeared and the cold is all that is
    left.  There seems to be no trace of life anywhere around. To the south you must go through the mud and to
    the north is a sparkeling bridge.
  sector: field
  exits:
    north:
      to: tba:43:room:4399
    south:
      to: tba:43:room:4397

"tba:43:room:4399":
  name: A Trail of Snow
  description: >
    The temperature is now below freezing and the breath comes out of you in puffs of visible air.  The
    bridge to the north is madde of ice and the trail behind is wet.  The change of climates seems to be
    very dramatic for such a small distance traveled.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:43:room:4301
    south:
      to: tba:43:room:4398
