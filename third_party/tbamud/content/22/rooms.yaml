# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 22.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:22:room:2200":
  name: Entrance
  description: >
    A huge tower rises above you, the once massive portcullis has rusted away.  You wonder how this
    tower still stands after all these years.  High above in the tower a light flashes.  Do you dare enter? 
    Words are chiseled into a tablet beside the entrance.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:22:room:2201
    south:
      to: tba:16:room:1685
  extras:
  - keywords: [tablet, credits, info]
    text:
      preformatted: |2
           This area created by the demented imagination of Rumble.
        Builder      : Rumble
        Zone         : 22 Tower of the Undead
        Began        : 1997
        Player Level : 14-18
        Rooms        : 99
        Mobs         : 31
        Objects      : 23
        Shops        : 2
        Triggers     : 5
        Theme        : A tower of the undead.
        Plot         : An XP zone loaded with mobs. Several different levels with a
                       hidden dungeon and captured princess.
        Notes        : My FIRST zone!
        Links        : 00s
  triggers: [tba:22:trg:2203]

"tba:22:room:2201":
  name: A Dark Hallway
  description: >
    The passage almost immediately starts to slope upwards, You see strange drawings and symbols carved
    into the stone walls.  A sudden gust of wind carries the smell of rotting flesh to you.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2202
    south:
      to: tba:22:room:2200
  triggers: [tba:22:trg:2203]

"tba:22:room:2202":
  name: A Dark Hallway
  description: >
    The symbols and drawings continue along the stone wall, the dusty remains of what might have been
    paintings and tapestries cover the floor. The stench grows worse the deeper you enter, maybe you
    should turn back now.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2203
    west:
      to: tba:22:room:2201
  triggers: [tba:22:trg:2203]

"tba:22:room:2203":
  name: A Dark Hallway
  description: >
    More carvings symbols and even some crude drawings cover the stone block passageway top to bottom. 
    If only you could understand them.  The dark hallway curves to the east and south.  The walls made
    from mortar and stone crumble at the touch and are covered in dust and grime.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2204
    west:
      to: tba:22:room:2202

"tba:22:room:2204":
  name: A Dark Hallway
  description: >
    You finally find the source of that horrible stench, before you lays a maggot ridden half-eaten
    corpse.  Strange, you only see human footprints encircling it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2203
    south:
      to: tba:22:room:2205

"tba:22:room:2205":
  name: A Dark Hallway
  description: >
    The passage still slopes upward.  You begin to feel a little light headed and confused.  You think
    it might be the horrible stench or maybe it's the intracate carvings that seem to draw your eye.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2204
    west:
      to: tba:22:room:2206

"tba:22:room:2206":
  name: A Dark Hallway
  description: >
    More bodies litter the floor as you delicately step your way over and around them.  The smell is
    almost unbearable and you hardly even notice the symbols and carvings anymore.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2216
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:22:room:2205
    west:
      to: tba:22:room:2207

"tba:22:room:2207":
  name: A Dark Hallway
  description: >
    The hallway still climbs upward and it seems to be getting hotter the higher you go.  You feel the
    walls starting to close in on you.  You wonder whether or not it's a good idea to continue.  Another
    hallway leads to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2206
    south:
      to: tba:22:room:2225
    west:
      to: tba:22:room:2208

"tba:22:room:2208":
  name: A Dark Hallway
  description: >
    You stumble over yet another corpse and almost fall on a couple dozen rats having a feast on the
    unfortunate victim.  Far off in the distance you hear screams.  A passage also leads to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2207
    south:
      to: tba:22:room:2221
    west:
      to: tba:22:room:2209

"tba:22:room:2209":
  name: A Dark Hallway
  description: >
    Whoever carved all these symbols must have had a lot of time on his hands. The screams you heard
    earlier seem to intensify.  Upon closer examination those symbols don't seem to be carved, but
    scratched or clawed into the stone. Chunks of flesh and fingernails can be seen in the scratches, all oozing
    with blood.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2217
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:22:room:2208
    west:
      to: tba:22:room:2210

"tba:22:room:2210":
  name: A Dark Hallway
  description: >
    Still climbing upwards you start to wonder what could possibly be worth climbing to the top of this
    tower.  The screams stop with an unnatural abruptness.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2211
    east:
      to: tba:22:room:2209

"tba:22:room:2211":
  name: A Dark Hallway
  description: >
    The heat seems to be getting even worse the higher you climb.  Once again you hear screams, but a
    different voice this time.  A hot breeze carries with it the smell of smoke and something even more
    unpleasant.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2212
    south:
      to: tba:22:room:2210

"tba:22:room:2212":
  name: A Dark Hallway
  description: >
    A corpse that is in it's final state of decay tries reaching for your leg as you walk by.  One
    swift kick and it's head goes rolling away, but the hand still reaches for you.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2213
    south:
      to: tba:22:room:2211

"tba:22:room:2213":
  name: A Dark Hallway
  description: >
    The screams start up once again.  It sounds like someone is getting tortured.  That or they have
    simply gone mad.  The walls, floor, and ceiling seem to be getting closer together.  The darkness seems
    to deepen and cloak everything in shadows.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2214
    west:
      to: tba:22:room:2212

"tba:22:room:2214":
  name: A Dark Hallway
  description: >
    A part of the wall has collapsed here and you see a small hole in the outer wall.  Looking out you
    can see a city far below.  A fog has set in about the tower and the shrouds the city enough so you
    cannot name it.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2215
    west:
      to: tba:22:room:2213

"tba:22:room:2215":
  name: Stairs
  description: >
    A set of steep stairs lead upward with no apparent end.  The screams seem louder in that
    direction.  The stone and mortar walls are damp and small trickles of water run down from somewhere above.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2214
    up:
      to: tba:22:room:2242

"tba:22:room:2216":
  name: Hidden Room
  description: >
    You push aside a tapestry that is in your way and look at the room. Unlike the rest of this
    decrepit tower this room is in excellent shape and looks to be used as a study with books lining the walls.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2206
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:22:room:2217":
  name: Hidden Room
  description: >
    You push aside a tapestry and enter a room filled with scrolls, potions, books and other assorted
    items.  The smell of rot and decay is not evident here.  Instead, everything is covered in a fine
    layer of powdery dust.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2209
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:22:room:2218":
  name: Red Hallway
  description: >
    Several corpses are burning on the floor around you.  The smell is nauseating and your eyes water
    from the acrid smoke.  You become disorientated and can barely see any exits through the smoke.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2219
    south:
      to: tba:22:room:2226
  triggers: [tba:22:trg:2202]

"tba:22:room:2219":
  name: Red Hallway
  description: >
    Smoke fills this passage and you can only see a couple feet in front of you. The passage seems to
    glow a strange reddish color further to the west.  The red glow is scattered by the smoke and seems to
    pulse with a life of its own.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2220
    west:
      to: tba:22:room:2218
  triggers: [tba:22:trg:2202]

"tba:22:room:2220":
  name: Red Hallway
  description: >
    The smoke clears slightly but the heat is unbearable, you hear strange noises to the south or you
    can walk through the smoke to the west.  An eerie red glow is barely visible through the heavy smoke.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2228
    west:
      to: tba:22:room:2219
  triggers: [tba:22:trg:2202]

"tba:22:room:2221":
  name: Red Hallway
  description: >
    This is where all that heat is coming from.  The walls are warm to the touch and you feel a hot
    draft pushing you to the north.  You can continue into the heat to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2208
    south:
      to: tba:22:room:2229

"tba:22:room:2223":
  name: A Green Hallway
  description: >
    Something is amiss.  The walls are definitely alive and pulsing, you feel like you're being
    watched.  Will you go up to the south or down to the east. Either way the hall looks dangerous.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2224
    south:
      to: tba:22:room:2231

"tba:22:room:2224":
  name: A Green Hallway
  description: >
    The algae covered walls seem to glow even brighter in this area.  The Hallway continues east or
    west.  Movement in your periphery makes you look for something that is no longer there.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2225
    west:
      to: tba:22:room:2223

"tba:22:room:2225":
  name: A Green Hallway
  description: >
    The climb continues to the west or down to the south.  The walls almost seem to pulse with a life
    of their own.  The green fungus on the walls glows a strange lime-green color.  The smell of fresh cut
    flowers seems ironic in a place like this.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2233
    west:
      to: tba:22:room:2224

"tba:22:room:2226":
  name: A Red Hallway
  description: >
    The stench of burnt flesh and hair assails your nostrils.  You can continue north or go back south
    and flee this area.  The heat is still bareable, but is getting even worse.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2218
    south:
      to: tba:22:room:2234

"tba:22:room:2227":
  name: Stairs
  description: >
    A hot breeze blows into this otherwise cool room.  A set of stone stairs lead up to the next level
    of the tower.  The exit to the east is the source of the hot breeze and also an eerie red glow.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2228
    up:
      to: tba:22:room:2254

"tba:22:room:2228":
  name: A Red Hallway
  description: >
    The walls and floors glow from the heat they radiate.  How could anything live here.  You see a
    massive pile of bones against the wall.  The bones appear to be humanoid, but are scorched and scattered
    apart so it is difficult to tell.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2220
    west:
      to: tba:22:room:2227
    down:
      to: tba:22:room:2291
      door:
        keywords: [trapdoor]
        kind: door
        reset: closed
  triggers: [tba:22:trg:2201]

"tba:22:room:2229":
  name: A Red Hallway
  description: >
    Heat radiates from the stone hallway all around you.  It continues to the south or you can flee
    from the heat to the north.  A flickering glow that must come from an open flame somewhere further down
    the hall causes shadows to dance along the stone and mortar walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2221
    south:
      to: tba:22:room:2237

"tba:22:room:2230":
  name: A Green Hallway
  description: >
    The algae covered walls seem to glow and for the first time you can clearly see your surroundings. 
    The passage climbs to the south or heads back down to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2225
    south:
      to: tba:22:room:2238

"tba:22:room:2231":
  name: A Dead End
  description: >
    The algae and fungus is extremely thick in this area.  You keep thinking you see movement out of
    the corner of your eye.  You can only return to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2223

"tba:22:room:2232":
  name: Stairs
  description: >
    The strange glowing algae begins to recede here and you can begin to make out the stone walls,
    floor, and ceiling.  A stone staircase leads up to the second level of the tower.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2233
    up:
      to: tba:22:room:2259

"tba:22:room:2233":
  name: A Green Hallway
  description: >
    The hall continues up to the north or down to the south.  There is also an exit west but you can't
    see where it leads.  The slime of algea, fungus, and various other forms of mold make travel
    difficult and treacherous.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2225
    south:
      to: tba:22:room:2241
    west:
      to: tba:22:room:2232

"tba:22:room:2234":
  name: A Red Hallway
  description: >
    Small smokeless flames spurt from between cracks in the floor and walls.  To the north the heat and
    flames seem to intensify.  A cooler breeze to the east beckons you.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2226
    east:
      to: tba:22:room:2235

"tba:22:room:2235":
  name: A Red Hallway
  description: >
    The heat is starting to become bothersome, making it hard to move and breathe.  The red glow of
    what must be fire comes from the west.  Back east awaits a cooler and safer haven.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2236
    west:
      to: tba:22:room:2234

"tba:22:room:2236":
  name: A Red Hallway
  description: >
    The walls glow faintly and you see patches of fire to the west.  You can also leave to the east. 
    The strange fire does not seem to have any fuel and burns an even stranger blue green flame.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2237
    west:
      to: tba:22:room:2235

"tba:22:room:2237":
  name: A Red Hallway
  description: >
    The walls here are just starting to glow from the heat.  You hurry on since standing still would
    probably get you burned.  The heat continues from the west or you can get away from it to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2229
    west:
      to: tba:22:room:2236

"tba:22:room:2238":
  name: A Green Hallway
  description: >
    A decomposing human skull floats by as you climb upward.  You can continue up to the east or head
    back to the north.  The sound of running water echoes off the walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2230
    east:
      to: tba:22:room:2239

"tba:22:room:2239":
  name: A Green Hallway
  description: >
    More corpses lie everywhere.  Maybe it's your imagination but some of them seem to twitch or move
    slightly.  You can continue up to the east or go down to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2240
    west:
      to: tba:22:room:2238

"tba:22:room:2240":
  name: A Green Hallway
  description: >
    A decomposing corpse suddenly stands up and walks by you.  This is really unnerving.  The story
    behind this tower and its inhabitants is still a mystery. It will take a thorough search to root out the
    evil that caused this pitiful downfall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2241
    west:
      to: tba:22:room:2239

"tba:22:room:2241":
  name: A Green Hallway
  description: >
    More and more of the corpses begin to move the higher you climb.  You feel out of place with all of
    these undead creatures.  The climb continues to the north or you can head down to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2233
    west:
      to: tba:22:room:2240

"tba:22:room:2242":
  name: Bloody Stairs
  description: >
    Bodies are stacked along the walls and the floor is slick with blood.  You hear screams and groans
    of pain coming from the south.  Paintings line the stairwell, depicting scenes of a great battle with
    undead foes.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2243
    down:
      to: tba:22:room:2215

"tba:22:room:2243":
  name: Bloody Hallway
  description: >
    The floors are slick with blood and unidentifiable body parts.  Screams come from both east and
    west or you can flee to the north and south.  The once fine adornments to the hallway have all been torn
    down and shredded.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2242
    east:
      to: tba:22:room:2246
    south:
      to: tba:22:room:2251
    west:
      to: tba:22:room:2245

"tba:22:room:2244":
  name: Bloody Hallway
  description: >
    More prisoners are shackled everywhere.  A fire burns in a hearth with hot irons laid into it. 
    Various tools lay everywhere that make you cringe just thinking about their purpose.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2245

"tba:22:room:2245":
  name: Bloody Hallway
  description: >
    Prisoners are shackled to the walls all around you.  Most of them seem dead or at least
    unconscious.  Who could do such things?  You hear a death cry to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2244
    east:
      to: tba:22:room:2243

"tba:22:room:2246":
  name: Bloody Hallway
  description: >
    Screams seem to be echoing off the walls from the north and south.  Bodies are stacked everywhere
    continuing to the east and west.  The smell of death fills this part of the hallway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2247
    east:
      to: tba:22:room:2250
    south:
      to: tba:22:room:2248
    west:
      to: tba:22:room:2243

"tba:22:room:2247":
  name: Torture Chamber
  description: >
    Prisoners are shackled against the wall and various tools of torture are laid negligently on the
    floor.  You should leave back south.  But, something compels you to stay and see the atrocities
    performed on the helpless souls within.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2246

"tba:22:room:2248":
  name: Waiting Room
  description: >
    Dozens of prisoners are chained together, waiting for their turn.  They all look broken and death
    lingers in their eyes.  They look beyond hope and may as well already be dead.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2246

"tba:22:room:2249":
  name: Torture Chamber
  description: >
    Prisoners are shackled against the walls.  Most of them are dead.  Your only choice is to head back
    south.  Various body parts, intestines, and other unidentifiable body parts lay neatly at the
    prisoners feet.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2250

"tba:22:room:2250":
  name: Bloody Hallway
  description: >
    More bodies line the walls.  Screams and moans of eternal pain come from the north or the bodies
    continue to the west.  A once fine oaken table has been hacked to pieces and scattered about the room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2249
    west:
      to: tba:22:room:2246

"tba:22:room:2251":
  name: Empty Hallway
  description: >
    The floor and walls are layered in dust without any sign of disturbance for what must have been
    years.  You can exit north towards the screams or south into the abandoned hallway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2243
    south:
      to: tba:22:room:2256

"tba:22:room:2252":
  name: A Steel Ladder
  description: >
    A ladder goes straight up into blackness or you can go south into a dusty hallway.  The ladder is
    sloped at a very slight angle and looks sturdy enough to hold one person at a time.  The steel steps
    are extremely rusted, but very thick and wide.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2255
    up:
      to: tba:22:room:2268

"tba:22:room:2253":
  name: A Wooden Ladder
  description: >
    A wooden later leads up into darkness.  The rungs are dry and cracked, but still look strong.  An
    empty hallway to the south is the only other exit. Several paintings on the wall show the tower in its
    golden days.  It has fallen a long ways since then.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2258
    up:
      to: tba:22:room:2271

"tba:22:room:2254":
  name: Stairs
  description: >
    A constant draft of hot air rushes up the stairs.  The spiral stone steps make it difficult to see
    very far ahead.  An exit to the east opens into an empty hallway.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2255
    down:
      to: tba:22:room:2227

"tba:22:room:2255":
  name: Empty Hallway
  description: >
    Nothing living has been in these halls for a long time, yet you still feel like someone is watching
    you.  The hallway continues east and west or you can go north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2252
    east:
      to: tba:22:room:2256
    west:
      to: tba:22:room:2254

"tba:22:room:2256":
  name: Empty Hallway
  description: >
    The dust is thick and the air stale.  Nothing living has been through here in ages.  You can exit
    north towards the screams or follow the passage east or west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2251
    east:
      to: tba:22:room:2257
    west:
      to: tba:22:room:2255

"tba:22:room:2257":
  name: Empty Hallway
  description: >
    The hallway continues east and west.  The dust swirls up behind you as you walk, leaving a clear
    marking of your passage.  A few other traces of passage are marked by the scattered dust.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2258
    west:
      to: tba:22:room:2256

"tba:22:room:2258":
  name: Empty Hallway
  description: >
    The dust kicked up by your passage seems to find its way into everything. Your clothes have
    developed a fine layer of the dust and your throat, nose, and lungs seem filled with a chalky film.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2253
    east:
      to: tba:22:room:2259
    west:
      to: tba:22:room:2257

"tba:22:room:2259":
  name: Stairs
  description: >
    A crumbling stairwell leads down into darkness.  The steps are cracked and fall apart when you put
    any sizeable force upon them.  They seem treacherous, but passable.  An empty hallway to the west
    looks far more inviting.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:22:room:2258
    down:
      to: tba:22:room:2232

"tba:22:room:2260":
  name: A Dark Hallway
  description: >
    You try to look further ahead into the hallway but there is hardly any light.  You think it
    continues to the east and south.  The sound of echoing footsteps can be heard in the distance.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2261
    south:
      to: tba:22:room:2264

"tba:22:room:2261":
  name: A Dark Hallway
  description: >
    More bodies litter the floors here.  Strange they seem to be stacked neatly and inventoried.  The
    hall continues south and west.  You notice a small window in the east wall that looks out into a
    clouded valley.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2265
    west:
      to: tba:22:room:2260

"tba:22:room:2262":
  name: A Lighted Hallway
  description: >
    The spotless hallway continues both east and south.  A cold wind blows from the south.  Strange how
    this hallway seems so clean compared to the rest of the tower.  Maybe some life does exist within
    these walls.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2263
    south:
      to: tba:22:room:2266

"tba:22:room:2263":
  name: A Lighted Hallway
  description: >
    The floor and walls are spotless.  A cold draft comes from the west or you can go south.  The
    floor, walls, and ceilings are freshly cleaned.  Not a speck of dust can be seen anywhere.  A pristine
    white glow is reflected on every surface from an overhead lamp.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2267
    west:
      to: tba:22:room:2262

"tba:22:room:2264":
  name: A Dark Hallway
  description: >
    The walls around you seem to absorb light and sound.  Bodies are stacked neatly against both
    walls.  The hall continues north and south.  A small collapse in one of the walls shows nothing but
    darkness on the other side.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2260
    south:
      to: tba:22:room:2268

"tba:22:room:2265":
  name: A Dark Hallway
  description: >
    More bodies are stacked here neatly.  They each have a tag on their toe with a number written on it
    for identification.  The hall continues north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2261
    south:
      to: tba:22:room:2269

"tba:22:room:2266":
  name: A Lighted Hallway
  description: >
    The clean and bright hallway continues north and south.  A brisk breeze from the south seems very
    refreshing and out of place.  Paintings along the wall display a gathering, most likely a feast,
    within the tower centuries ago.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2262
    south:
      to: tba:22:room:2270

"tba:22:room:2267":
  name: A Lighted Hallway
  description: >
    This is a change.  Lamps line both walls and the floor is swept.  But who in their right mind would
    live here?  The hallway continues north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2263
    south:
      to: tba:22:room:2271

"tba:22:room:2268":
  name: Ladder
  description: >
    A ladder leads down into darkness and the hallway continues to the north. An entire section of the
    wall is missing and opens into a hidden inner wall of the tower.  Their is neither a floor nor
    ceiling within, just a long drop to whatever lay below.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2264
    down:
      to: tba:22:room:2252

"tba:22:room:2269":
  name: A Long Ramp
  description: >
    A long ramp leads up into the next level of the tower.  A wheelbarrow holds several corpses in it
    off to one side.  A hallway is to the north.  The barrow's front wheel is broken, making it unuseable.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2265
    up:
      to: tba:22:room:2280

"tba:22:room:2270":
  name: Spiral Staircase
  description: >
    Before you is an intricate spiral staircase that winds up.  A cold wind comes down from somewhere
    above.  To the north is a hallway.  The stairs are carved out of what appears to be granite and are
    still in excellent condition compared to the rest of the tower.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2266
    up:
      to: tba:22:room:2281

"tba:22:room:2271":
  name: A Wooden Ladder
  description: >
    A ladder leads down into darkness or you can exit north into a brightly lit hallway.  An old wooden
    ladder leads down into the darkness.  The remains of a stairway can be seen below.  The ladder must
    have been a substitute after a recent collapse of the stairs.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2267
    down:
      to: tba:22:room:2253

"tba:22:room:2272":
  name: A Hall of Corpses
  description: >
    The tracks continue to the south.  To the east more bodies are piled high. The walls here are
    paneled with what used to be polished pine boards.  Now they are warped and rotting, along with the rest
    of the tower.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2273
    south:
      to: tba:22:room:2276

"tba:22:room:2273":
  name: A Hall of Corpses
  description: >
    Wheelbarrow tracks weave around the bodies littering the floor towards the west.  Several of the
    corpses occasionally twitch or try to rise.  They seem to be transitioning from death to undeath.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2277
    west:
      to: tba:22:room:2272

"tba:22:room:2274":
  name: A Cold Hallway
  description: >
    You feel like you're being watched and that just makes you shiver even more. The hall continues
    south or east.  The feeling of unseen eyes comes from every direction.  The wooden paneling in this part
    of the tower has collapsed leaving dozens of possible unseen hideouts.  The hall continues south or
    east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2275
    south:
      to: tba:22:room:2278

"tba:22:room:2275":
  name: A Cold Hallway
  description: >
    You can't be sure but you think you hear someone singing to the south.  You could also go west but
    that sounds like such a pretty voice.  You seem to have heard stories about a tantalizing voice like
    this, but who cares.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2279
    west:
      to: tba:22:room:2274

"tba:22:room:2276":
  name: Ramp
  description: >
    The tracks lead up a steep ramp into the next level of the tower.  More bodies litter the floor and
    the hall to the north.  The wooden ramp sags slightly as you walk over it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2272
    up:
      to: tba:22:room:2282

"tba:22:room:2277":
  name: A Hall of Corpses
  description: >
    Bodies line both walls and are piled almost to the ceiling.  You see a trail of blood where someone
    must have used a wheelbarrow to move the corpses.  The tracks lead north, higher into the tower.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2273
    south:
      to: tba:22:room:2280

"tba:22:room:2278":
  name: A Cold Hallway
  description: >
    The wood panelled walls which were damp with dew are now covered in a light frost.  The unnatural
    chill in this area is unnerving.  The hallway continues north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2274
    south:
      to: tba:22:room:2281

"tba:22:room:2279":
  name: Ladder
  description: >
    A ladder leads up towards that beautiful singing.  You almost lose your balance and fall as you
    climb two rungs at a time.  Who cares where else you can go, just go up to that beautiful voice.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2275
    up:
      to: tba:22:room:2285

"tba:22:room:2280":
  name: Ramp
  description: >
    More bodies litter this room.  A ramp leads down or a corpse filled hallway is to the north.  The
    ramp is about ready to collapse.  The sagging wood creaks with the slightest pressure.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2277
    down:
      to: tba:22:room:2269

"tba:22:room:2281":
  name: Staircase
  description: >
    The stairs wind down out of sight below you leaving the only other exit to the north.  The wooden
    panels covering the stone walls has completely collapsed.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2278
    down:
      to: tba:22:room:2270

"tba:22:room:2282":
  name: Hall of Rebirth
  description: >
    Wheelbarrow tracks lead to the east.  The person pushing it must have been either drunk or
    incompetent.  The tracks veer back and forth running into the walls in several places.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2283
    down:
      to: tba:22:room:2276

"tba:22:room:2283":
  name: Hall of Rebirth
  description: >
    The wheelbarrow lays on it's side in front of you.  It's contents dumped negligently to mix with
    the rest of the corpses that lay everywhere.  You hear moaning and chanting to the south.  You can't
    see past the bodies to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2288
    south:
      to: tba:22:room:2286
    west:
      to: tba:22:room:2282

"tba:22:room:2284":
  name: A Hallway
  description: >
    The singing to the south brings tears to your eyes as it suddenly changes pitch to sorrow and
    grief.  You charge on hardly even noticing another room to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2289
    east:
      to: tba:22:room:2285
    south:
      to: tba:22:room:2287

"tba:22:room:2285":
  name: A Hallway
  description: >
    The singing is coming from the west.  How beautiful, it must be a damsel in distress, trapped in
    this tower against her will.  She must be awaiting rescue.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:22:room:2284
    down:
      to: tba:22:room:2279

"tba:22:room:2286":
  name: Hall of Rebirth
  description: >
    A man dressed all in black has his back turned to you and is chanting strange words and making wild
    gestures.  A corpse suddenly rises at his command.  You should flee to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2283

"tba:22:room:2287":
  name: A Damsel in Distress
  description: >
    Before you sits a long blonde-haired woman with her back turned to you.  You kneel behind her and
    tell her your name and that you will rescue her.  But then she turns towards you and you see the
    ugliest face to ever plague a human body.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2284

"tba:22:room:2288":
  name: Spiral Staircase
  description: >
    A staircase leads up and winds out of view far above.  You finally see that strange flickering
    light.  You can go up to investigate or return south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2283
    up:
      to: tba:22:room:2290

"tba:22:room:2289":
  name: A Collapsing Room
  description: >
    A strong wind blasts you as you enter an empty room.  The wind comes from the east where the entire
    wall and half the floor has fallen to the ground below.  This room is the highest in the tower that
    still remains.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2284

"tba:22:room:2290":
  name: Vampires Lair
  description: >
    A massive chamber opens up before you, the walls lined with torches are flickering from the wind
    blowing in through a gaping hole in the east wall.  A coffin lays in the middle of the room.  You hear
    a fluttering of wings to the east.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:22:room:2288

"tba:22:room:2291":
  name: Rumbles Dungeon
  description: >
    You stare up at the ladder that was retracted and is now about 10 feet above your head.  There is
    no turning back now.  The hall continues east and west. A large cell fills the entire room just to the
    north.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2298
    west:
      to: tba:22:room:2292

"tba:22:room:2292":
  name: Rumbles Dungeon
  description: >
    Your footsteps echo off the walls as you plod along.  This place is heavily guarded and looks to be
    impossible to escape from.  What kind of prisoner could need this much protection.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2293
    east:
      to: tba:22:room:2291

"tba:22:room:2293":
  name: Rumbles Dungeon
  description: >
    The smells of death and decay are not evident in the basement of the tower. This safe haven seems
    strangely peaceful, yet an evil presence can be detected through the cell to the east.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2294
    south:
      to: tba:22:room:2292

"tba:22:room:2294":
  name: Rumbles Dungeon
  description: >
    The walls here are newly reinforced by what appears to be a second layer of mortar and stone
    freshly laid.  The passage is clean and well kept.  Guards patrol these halls constantly.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2295
    south:
      to: tba:22:room:2293

"tba:22:room:2295":
  name: Rumbles Dungeon
  description: >
    To the south is a huge metal door.  A large lock and chains make it impossible to open.  The door
    glows with a faint aura.  There is also a sign here with crossed lightning bolts above it.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:22:room:2296
    south:
      to: tba:22:room:2299
      door:
        keywords: [lock]
        kind: door
        reset: closed
    west:
      to: tba:22:room:2294
  extras:
  - keywords: [sign]
    text: >
      Within this cell is the lord of this tower.  His powers are almost equal to that of the God's. 
      While within this warded room his powers are that of only a mortal.  But Beware, DO NOT let him escape
      his cell. RUMBLE

"tba:22:room:2296":
  name: Rumbles Dungeon
  description: >
    An unnerving feeling of evil eminates from the cell to the southwest.  A strange glow seems to be
    coming from within it.  Some form of magical enchantment maybe.  The walls are heavily reinforced and
    recently erected.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:22:room:2297
    west:
      to: tba:22:room:2295

"tba:22:room:2297":
  name: Rumbles Dungeon
  description: >
    To the west is a reinforced cell, with no door in evidence.  The cell seems to be the only other
    structure in this hidden basement and must contain someone of great importance to be so heavily guarded.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2296
    south:
      to: tba:22:room:2298

"tba:22:room:2298":
  name: Rumbles Dungeon
  description: >
    Guards pace back and forth around the cell.  Seemingly waiting for someone or something to break
    through those impenetrable walls.  The guards are heavily armored and look well trained.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:22:room:2297
    west:
      to: tba:22:room:2291

"tba:22:room:2299":
  name: Dungeon Cell
  description: >
    The cell is made completely of metal, a soft aura also surrounds it, extra protection to hold those
    with special powers within.  It looks impenetrable. The perfect prison for the worst type of
    prisoner.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    north:
      to: tba:22:room:2295
      door:
        keywords: [door]
        kind: door
        reset: closed
