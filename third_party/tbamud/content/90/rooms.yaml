# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 90.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:90:room:9000":
  name: In the Desert
  description: >
    You work your way through the golden dunes of sand.  The only evidence of life is the tracks you
    leave behind.  A gusting wind throws sand up into your face and makes you choke.  On the horizon you
    believe you can see a clump of trees.
  sector: field
  exits:
    east:
      to: tba:90:room:9001
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 90 Oasis
        Began        : 2001
        Player Level : 6-8
        Rooms        : 34
        Mobs         : 8
        Objects      : 6
        Shops        : 0
        Triggers     : 1
        Theme        : A connector zone with a Rangers Guild.
        Plot         : Nothing spectacular just a filler I did in a few days.
        Links        : 00w, 30s, 31e
        Zone 90 was linked to the following zones:
        170 South Pass                     at  9030 (south) ---> 17018
        140 Wyvern City                    at  9031 (east ) ---> 14000

"tba:90:room:9001":
  name: In the Desert
  description: >
    The world around you is obscurred by a small dust devil.  The blowing sand and slippery footing
    makes travel in this desert painful.  To the southeast you can make out a few trees and some small
    shrubbery.  A good sign of water.  You are thirsty.
  sector: field
  exits:
    east:
      to: tba:90:room:9002
    west:
      to: tba:90:room:9000

"tba:90:room:9002":
  name: Between Sand Dunes
  description: >
    You work your way between sand dunes.  As you climb the top of one you can see nothing but desert
    stretching for miles in every direction.  You find it very hard, if not impossible, to remember which
    direction you are heading.
  sector: field
  exits:
    north:
      to: tba:90:room:9007
    east:
      to: tba:90:room:9003
    south:
      to: tba:90:room:9010
    west:
      to: tba:90:room:9001

"tba:90:room:9003":
  name: Beside the Oasis
  description: >
    As you climb to the top of another dune you can see the small oasis just to the south.  A cluster
    of tall palm trees reach toward the sky.  It is the only landmark for miles around and it is from this
    landmark that many travellers find their way to the lost city and the south pass.  You can faintly
    make out a trail leading east and west.
  sector: field
  exits:
    north:
      to: tba:90:room:9008
    east:
      to: tba:90:room:9004
    south:
      to: tba:90:room:9011
    west:
      to: tba:90:room:9002

"tba:90:room:9004":
  name: Between Sand Dunes
  description: >
    You step into a valley between two large sand dunes, the wind here is bearable and you can breathe
    without swallowing a handful of sand.  The desert is very peaceful here.  You notice some bleached
    white bones half-buried in the sand.
  sector: field
  exits:
    north:
      to: tba:90:room:9009
    east:
      to: tba:90:room:9005
    south:
      to: tba:90:room:9012
    west:
      to: tba:90:room:9003

"tba:90:room:9005":
  name: On a Sand Dune
  description: >
    You can just barely make out a small path leading to the east.  The path seems to be the remains of
    a small stream that dried up years ago.  You have heard that you can follow a stream and it will
    eventually lead to civilization. Maybe this will lead to somewhere important.
  sector: field
  exits:
    east:
      to: tba:90:room:9006
    west:
      to: tba:90:room:9004

"tba:90:room:9006":
  name: A Sandy Path
  description: >
    The wind is calmer here, allowing you to discern the small trail a little better.  The sand you
    walk on seems to be firming up slightly and you can see a few cactii further to the east as you work
    your way out of the harshest part of the desert.
  sector: field
  exits:
    south:
      to: tba:90:room:9013
    west:
      to: tba:90:room:9005

"tba:90:room:9007":
  name: In the Desert
  description: >
    You become confused as to which direction you were heading.  You glance back to trace your
    footsteps, but the wind has already covered them over.  You get an uneasy feeling in your stomach as you
    realize how easily one could get lost here.
  sector: field
  exits:
    east:
      to: tba:90:room:9008
    south:
      to: tba:90:room:9002

"tba:90:room:9008":
  name: In the Desert
  description: >
    The wind and sand tear at every bit of your clothing and exposed flesh. You try to cover your face
    but the sand still finds its way in.  You remember stories of lost travellers entering the desert and
    never returning.  Will you be next?
  sector: field
  exits:
    east:
      to: tba:90:room:9009
    south:
      to: tba:90:room:9003
    west:
      to: tba:90:room:9007

"tba:90:room:9009":
  name: In the Desert
  description: >
    The golden sands of the desert would almost be peaceful if it wasn't for the extreme heat during
    the day and frigid cold at night.  It is a wonder that any animal could survive out here, but some do. 
    Most animals living in the desert are scavengers who prey on lost souls, like your own!
  sector: field
  exits:
    south:
      to: tba:90:room:9004
    west:
      to: tba:90:room:9008

"tba:90:room:9010":
  name: Beside the Oasis
  description: >
    You find yourself just west of the oasis.  It is from there that people travel between the lost
    city, south pass, and the Capital.  This is where the truly adventureous travelers roam in the search
    for fame and fortune.  Most never make it back.
  sector: field
  exits:
    north:
      to: tba:90:room:9002
    east:
      to: tba:90:room:9011

"tba:90:room:9011":
  name: The Oasis
  description: >
    A clump of palm trees surround a small desert spring.  This is where an underground river comes to
    the surface of the desert.  A tiny bit of dank water trickles through the center of the palms.  It is
    not very refreshing, but enough to support a flurry of plant and animal life.  From here paths
    continue north toward the Capital or the lost city, and south to the south pass.
  sector: field
  exits:
    north:
      to: tba:90:room:9003
    east:
      to: tba:90:room:9012
    south:
      to: tba:90:room:9017
    west:
      to: tba:90:room:9010

"tba:90:room:9012":
  name: Beside the Oasis
  description: >
    To the east you see the oasis where travellers can rest and drink from the small trickle of water
    that never runs dry.  This oasis is a safe haven for many lost travellers.  From the oasis a lost
    traveller can usually find his way back to safety.
  sector: field
  exits:
    north:
      to: tba:90:room:9004
    west:
      to: tba:90:room:9011

"tba:90:room:9013":
  name: A Sandy Path
  description: >
    Small Cactii flourish here.  You even see a few dried out shrubs that somehow survive without water
    for months at a time.  Small animals that have adapted to the extreme weather in the desert scurry
    away as you pass.  Tales of deadly scorpions make you watch where you step.
  sector: field
  exits:
    north:
      to: tba:90:room:9006
    east:
      to: tba:90:room:9014

"tba:90:room:9014":
  name: A Rocky Path
  description: >
    The path you are following is full of small pebbles and rocks.  The sand has been washed away in
    this area making a small ditch where a good sized stream must have once flowed.  The ground around the
    ditch is packed sand with cracks running through it.
  sector: field
  exits:
    south:
      to: tba:90:room:9018
    west:
      to: tba:90:room:9013

"tba:90:room:9015":
  name: The Desert
  description: >
    Dunes obscure your vision for more than fifty feet in any direction.  As you climb to the top,
    expecting to get a better view of your surroundins, you only see more dunes.  The dry air makes you wish
    you had remembered to bring more water.
  sector: field
  exits:
    east:
      to: tba:90:room:9016
    south:
      to: tba:90:room:9021

"tba:90:room:9016":
  name: The Desert
  description: >
    The sky above you is completely clear, no matter the time of day there is not enough moisture in
    the desert to form any clouds.  The area around you is barren, just sand, no sign of any life.  To the
    northeast you can see what looks like some trees in the distance.
  sector: field
  exits:
    east:
      to: tba:90:room:9017
    west:
      to: tba:90:room:9015

"tba:90:room:9017":
  name: The Desert
  description: >
    The heat is oppressive and drains all energy from your body.  The hot sand under your feet makes it
    difficult to even walk.  Just to the north is a small patch of palm trees.  A place of sanctuary in
    the middle of an ocean of sand.
  sector: field
  exits:
    north:
      to: tba:90:room:9011
    west:
      to: tba:90:room:9016

"tba:90:room:9018":
  name: A Rocky Path
  description: >
    The ditch is close to ten spans across now.  Large boulders litter the bottom of what must have
    once been an impressive river.  Skeletons of fish are half buried in the rubble.  It appears this stream
    ran dry from an unnatural cause.  The banks of the river reach up to about eye level.
  sector: field
  exits:
    north:
      to: tba:90:room:9014
    east:
      to: tba:90:room:9019

"tba:90:room:9019":
  name: A Dried Up River Bed
  description: >
    You find yourself trapped inside this natural canyon.  The banks tower above your head, actually
    slanting towards you, making them impossible to climb. The rocky river bed makes an unsure footing and
    you stumble along, trying not to twist an ankle.  The river bed leads in an east west direction.
  sector: field
  exits:
    east:
      to: tba:90:room:9020
    west:
      to: tba:90:room:9018

"tba:90:room:9020":
  name: A Dried Up River Bed
  description: >
    The steep walls of the river tower above you, blocking out what little light there was to begin
    with.  It feels as if the walls are closing in on you.  You begin to notice bones scattered among the
    rocks that don't look like fish bones.
  sector: field
  exits:
    south:
      to: tba:90:room:9022
    west:
      to: tba:90:room:9019

"tba:90:room:9021":
  name: The Desert
  description: >
    Heat rising from the hot sands into the air makes a shimmering image on the horizon.  Maybe it is
    just a mirage, or maybe it is something else.  The harder you look the more you begin to think that
    you might be reaching the southern end of the desert.
  sector: field
  exits:
    north:
      to: tba:90:room:9015
    south:
      to: tba:90:room:9025

"tba:90:room:9022":
  name: A Dried Up River Bed
  description: >
    The banks of the river bed are made of some type of solid sandstone, worn smooth from years of
    errosion from the river.  Now they are becoming pitted and cracked.  The river bed continues north and
    east.
  sector: field
  exits:
    north:
      to: tba:90:room:9020
    east:
      to: tba:90:room:9023

"tba:90:room:9023":
  name: A Dried Up River Bed
  description: >
    The wind howls as it gets caught in between the banks of what used to be a large river.  The banks
    reach up to just above your head, obscuring your view of what's above you.  The river bottom is
    layered in small round pebbles. This would be a great place to set up an ambush for unwary travellers.
  sector: field
  exits:
    west:
      to: tba:90:room:9022

"tba:90:room:9024":
  name: The Desert
  description: >
    The sky overhead is clear.  A strong wind from the south buffets you relentlessly.  You can make
    out what looks like a mountain range further to the south.  Perhaps this faded trail you are following
    leads to the south pass.
  sector: field
  exits:
    east:
      to: tba:90:room:9025
    south:
      to: tba:90:room:9028

"tba:90:room:9025":
  name: The Desert
  description: >
    You can begin to discern what looks look tracks in the sand leading to the north and west.  The
    remains of a trail being consumed by the desert sand.  To the south you can see somthing on the
    horizon.  Desert stretches as far as you can see in every other direction.
  sector: field
  exits:
    north:
      to: tba:90:room:9021
    west:
      to: tba:90:room:9024

"tba:90:room:9026":
  name: A Trail
  description: >
    To the north, east and west, a desert of shimmering sand stretches for as far as you can see.  To
    the south a jagged mountain range stretches to the sky. The mountains are tall enough to be barren of
    trees and some are even snow capped.
  sector: field
  exits:
    east:
      to: tba:90:room:9027
    south:
      to: tba:90:room:9029

"tba:90:room:9027":
  name: A Faded Trail
  description: >
    To the south you can see a tall, jagged mountain range.  The stories of the range are wild and
    undoubtedly false.  But one thing you know is true.  They are almost insurpassable unless you can find
    the south pass.  The trail leads east and west.
  sector: field
  exits:
    east:
      to: tba:90:room:9028
    west:
      to: tba:90:room:9026

"tba:90:room:9028":
  name: A Faded Trail
  description: >
    This trail you are on is slightly packed, easier to travel on than the desert sand.  Dunes of sand
    rise above you to the south and east.  The trail continues to the west.  This part of the desert is
    strangely quite and still.
  sector: field
  exits:
    north:
      to: tba:90:room:9024
    west:
      to: tba:90:room:9027

"tba:90:room:9029":
  name: Before the Mountains
  description: >
    Just to the south a wall of rock reaches up into the sky.  To the east and west the mountains look
    insurpassable.  A small trail continues south towards the base of the mountains or north into the
    desert.
  sector: field
  exits:
    north:
      to: tba:90:room:9026
    south:
      to: tba:90:room:9030

"tba:90:room:9030":
  name: Before the Mountains
  description: >
    You stand in the shadows of the intimidating mountains.  Just thinking about an avalanche or
    landslide gives you chills.  The safety of open ground is just to the north.  Anyone or anything could
    easily hide along the base of the mountains.  A small trail leads to the east.  An almost invisible trail
    leads south from here, toward the mountains.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:90:room:9029
    east:
      to: tba:90:room:9031
    south:
      to: tba:239:room:23904

"tba:90:room:9031":
  name: A Hidden Path
  description: >
    It is as if someone has taken the trouble to try and hide this small trail. It winds its way still
    further to the north along the base of the mountains. Small trees and even a small stream give this
    place a feeling of peace.
  sector: inside
  exits:
    north:
      to: tba:90:room:9032
    east:
      to: tba:140:room:14000
    west:
      to: tba:90:room:9030

"tba:90:room:9032":
  name: A Hidden Path
  description: >
    The path continues alond the base of the mountian.  A small stream flows beside you, the water
    looks very clean and refreshing.  You are surrounded by trees that block any good view of your
    surroundings.  There seems to be a clearing just to the north.
  sector: inside
  exits:
    north:
      to: tba:90:room:9033
    south:
      to: tba:90:room:9031

"tba:90:room:9033":
  name: A Secluded Grove
  description: >
    You find yourself in the middle of a small glade of elms.  The ground is covered in a spongy moss
    that makes you feel like you are walking on air. This area has a strangely serene feeling to it.  You
    suddenly get the feeling that you are not the only one enjoying this peaceful grove.
  sector: inside
  exits:
    south:
      to: tba:90:room:9032
