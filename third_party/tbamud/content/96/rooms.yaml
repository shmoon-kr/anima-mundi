"tba:96:room:9618":
  name: A turn in the path
  description: >
    The hard-packed earth takes a sharp turn, and the underbrush gets less dense.  The trees are more
    spread apart, and flowers come less often.  The smaller and weaker animals seem to have disappeared,
    but the bigger ones seem to have grown more plentiful.  The path turns south, and continues back east.
  sector: forest
  exits:
    east:
      to: tba:96:room:9617
    south:
      to: tba:96:room:9620

"tba:96:room:9619":
  name: The Entrance of the Forest Domiae
  description: >
    The entrance to the forest Domiae is forboding at first glance.  Tall oak trees block out most of
    the light, and the trail through the forest is cluttered with leafs and sticks.  However, looking
    again there are many things of beauty about it.  Small animals scurry about, and birdsong can be heard
    even at the threshold of the forest.  Flowers line the path north into the forest, which is the only
    visible exit.
  sector: forest
  exits:
    north:
      to: tba:96:room:9601
    east:
      to: tba:96:room:9655
  extras:
  - keywords: [tree, oak]
    text: >
      Large oaken trees block out most of the light, giving the everything in the forest a dim green
      appearance.

"tba:96:room:9620":
  name: Another turn in the path
  description: >
    The path turns back west, and the birdsong grows fainter.  Someone, or something, has ripped off
    the lower boughs to the trees.  That either means someone wants an unobstructed view or someone's
    property line is near.  Far in the distance a cave makes a gray splotch on the horizon.  Exits are west or
    back north.
  sector: forest
  exits:
    north:
      to: tba:96:room:9618
    west:
      to: tba:96:room:9621

"tba:96:room:9621":
  name: A path nearing the cave
  description: >
    The path continues west toward the cave.  Foxes and rabbits shoot through the underbrush
    constantly, and the birdsong grows even fainter.  Loud roars come from the west, and the unmistakeable sound of
    an animal getting ripped in half.  The path continues west and east.
  sector: forest
  exits:
    east:
      to: tba:96:room:9620
    west:
      to: tba:96:room:9622

"tba:96:room:9622":
  name: A path nearing the cave
  description: >
    Now only the smallest birds can be heard chirping, but the foxes and rabbits seem to thrive in the
    silence.  The inhuman roars from the west grow louder, and the squelching of dead animals
    intensifies.  The smell of excrement floats through the air.  The path continues west and east.
  sector: forest
  exits:
    east:
      to: tba:96:room:9621
    west:
      to: tba:96:room:9623

"tba:96:room:9623":
  name: A turn in the path
  description: >
    The path turns sharply yet again, but just around the bend the smell gets much worse.  The wind
    stops, the animals disappear, and the birds stop singing. The shrieks of a dying creature can be heard
    nearby, and the roaring stops momentarily, replaced by a sickening squelch.  The path returns west, or
    continues north.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:96:room:9624
    east:
      to: tba:96:room:9622

"tba:96:room:9624":
  name: In front of the cave
  description: >
    The roars here are almost deafening.  The smell of death and animal excrement floats through the
    air, in enough potency to make one vomit.  A pair of red eyes peer out of the shroud of darkness in the
    cave.  The path continues north, into the cave west, or returns south.
  sector: forest
  exits:
    north:
      to: tba:96:room:9625
    south:
      to: tba:96:room:9623
    west:
      to: tba:96:room:9626

"tba:96:room:9625":
  name: A refuse pit
  description: >
    The stench of excrement and death come from this pit.  Heaps of dead animals in various stages of
    decomposition, and piles of animal excrement.  Whether it's from what lives in the cave or from the
    dead animals isn't known.  The only exit is back south.
  sector: forest
  exits:
    south:
      to: tba:96:room:9624

"tba:96:room:9626":
  name: In the mouth of the cave
  description: >
    Just inside of the cave, the sickly-sweet odor of fresh blood can be detected.  Roars from inside
    the cave signifies that the cave isn't exactly empty.  The rest of the cave lies west, and one can
    exit east.
  sector: mountains
  flags: [indoors]
  exits:
    east:
      to: tba:96:room:9624
    west:
      to: tba:96:room:9627

"tba:96:room:9627":
  name: Inside the cave
  description: >
    The odor of blood gets stronger inside the cave.  Probably because of the strewn about corpses and
    the fresh blood staining the walls.  Claw marks on the floor tell that the dead animals put up quite
    a struggle.  Exits in all directions.
  sector: mountains
  flags: [dark, indoors]
  exits:
    north:
      to: tba:96:room:9628
    east:
      to: tba:96:room:9626
    south:
      to: tba:96:room:9629
    west:
      to: tba:96:room:9630

