"tba:96:room:9653":
  name: In front of the King's bedroom
  description: >
    The front of the king's bedroom is in a perfect state of preservation.  The door itself is made of
    marble, set on a cunningly made device that opens the door at the King's will.  The door is outlined
    in silver, and two statues in front of the door are made of solid gold.  Exits to the south, east,
    and west.
  sector: inside
  flags: [indoors]
  exits:
