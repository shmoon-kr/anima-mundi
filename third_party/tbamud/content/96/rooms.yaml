"tba:96:room:9651":
  name: The royal hallway
  description: >
    Along the hallway there is no noise whatsoever.  The walls are still crumbling, plants are still
    growing out of the ceiling, of which most of is laying on the floor.  The floor seems a little less
    eaten up.  The entrance to the King's bedroom lies east, or one may return west.
  sector: inside
  flags: [indoors]
