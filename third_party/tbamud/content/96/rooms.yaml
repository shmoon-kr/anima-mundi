"tba:96:room:9647":
  name: A holding chamber.
  description: >
    A steel barred window lets in light to the spartan room.  A bed and a chamberpot are all that are
    here.  The floor is of the same cracked marble, and the cold stone walls don't show the same cracking
    and falling that the other walls do.  The only exit is the way you came.
  sector: inside
