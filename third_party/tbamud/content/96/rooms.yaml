"tba:96:room:9633":
  name: Inside the outer gate
  description: >
    Green ivy grows up the walls of this once magnificent castle.  The inner gate is north, and two
    narrow towers protect the barbican.  The gate has rusted off of its hinges, and it lies on the ground
    near the entrance.  To the west and east are the stairways into the towers, and north lays the gate. 
    To the south a blue portal stretches between the walls.
  sector: mountains
  exits:
    north:
      to: tba:96:room:9638
    east:
      to: tba:96:room:9635
    south:
      to: tba:96:room:9619
    west:
      to: tba:96:room:9634

"tba:96:room:9634":
  name: A stairwell
  description: >
    A creaky wooden starway makes its way up the tower.  Many steps are missing, and most of them are
    rotten.  Small slits in the stone wall give room for archers to fire through in case of an attack, and
    a murder-hole halfway up the stairs give soldiers something to pour burning oil or drip heavy
    objects through.  East lies the outer gate and the top of the small tower is upward.
  sector: mountains
  exits:
    east:
      to: tba:96:room:9633
    up:
      to: tba:96:room:9637

"tba:96:room:9635":
  name: A stairwell
  description: >
    A creaky wooden starway makes its way up the tower.  Many steps are missing, and most of them are
    rotten.  Small slits in the stone wall give room for archers to fire through in case of an attack, and
    a murder-hole halfway up the stairs give soldiers something to pour burning oil or drip heavy
    objects through.  West lies the outer gate and the top of the small tower is upward.
  sector: mountains
  exits:
    west:
      to: tba:96:room:9633
    up:
      to: tba:96:room:9636

"tba:96:room:9636":
  name: A small tower
  description: >
    Moss and mildew grow on the walls, and slime lies on the floor.  Just below the tower is the gate
    area, where people would come in if the outer gate still existed.  There are broken pieces of bows and
    arrows, rusted sets of armor, and swords tarnished beyond recognition.  The only exit is back down.
  sector: inside
  exits:
    down:
      to: tba:96:room:9635

"tba:96:room:9637":
  name: A small tower
  description: >
    Moss and mildew grow on the walls, and slime lies on the floor.  Just below the tower is the gate
    area, where people would come in if the outer gate still existed.  There are broken pieces of bows and
    arrows, rusted sets of armor, and swords tarnished beyond recognition.  The only exit is back down.
  sector: inside
  exits:
    down:
      to: tba:96:room:9634

"tba:96:room:9638":
  name: Foyer
  description: >
    The cracked marble floor is covered in plants and grass, and rats scurry at the sound of
    footsteps.  A grand chandelier lies broken in several pieces on the floor, and the furniture reduced to dull
    colored rags.  All that remains of the fountain is the statue of the King, broken in half.  Exits are
    north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:96:room:9639
    south:
      to: tba:96:room:9633

"tba:96:room:9639":
  name: The throne room
  description: >
    The throne room of this secluded castle is surprisingly well kept.  Two thrones of solid gold and
    satin lay on the dais, and the exquisite silk tapestries on the walls are untouched by rats or other
    vermin.  The queens chair holds a skeleton, but the king's chair is strangely empty.  Exits are east
    and west along the hall, north to the dining area or south to the foyer.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:96:room:9640
    east:
      to: tba:96:room:9643
    south:
      to: tba:96:room:9638
    west:
      to: tba:96:room:9644

"tba:96:room:9640":
  name: Banquet hall
  description: >
    Contrary to the Throne Room, the hall lies in horrible disrepair.  The table itself seems sturdy
    enough, but those chairs remaining are in pieces or missing legs.  The ever-present sound of rat on
    stone can be heard.  Exits are north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:96:room:9641
      door:
        keywords: [door, kitchen, north]
        kind: door
        reset: closed
    south:
      to: tba:96:room:9639

"tba:96:room:9641":
  name: Kitchen
  description: >
    Massive iron-cast ovens occupy most of the room, and the remains of plain tables can be seen.  The
    smell of rat floats in the air, along with the smell of long spoiled food.  The cellar lies west, or
    one may exit south back into the dining hall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:96:room:9640
      door:
        keywords: [door, south, dining]
        kind: door
        reset: closed
    west:
      to: tba:96:room:9642
      door:
        keywords: [door, cellar]
        kind: door
        reset: closed

"tba:96:room:9642":
  name: Cellar
  description: >
    The cellar smells strongly of rotten food and filthy rats.  Eyes glare from the shelves where food
    use to be, and the sound of sniffing and fighting can be heard.  Human skeletons lie in a heap. 
    Perhaps this isn't the safest place to be?
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:96:room:9641
      door:
        keywords: [door, kitchen]
        kind: door
        reset: closed

"tba:96:room:9643":
  name: A hall
  description: >
    Chunks of ceiling and wall lay on the floor, blocking most of the entrances. Rats scurry around the
    hall, making clicking noises on the broken marble floor. Plants hang from the ceiling, and grow out
