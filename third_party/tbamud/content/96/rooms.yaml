      to: tba:96:room:9651

"tba:96:room:9654":
  name: The King's Bedroom
  description: >
    Quite the magnificent room, even for a King.  The bed takes up a full quarter of the room, and the
    walls are completely covered with carvings, depicting a mighty battle.  The ceiling is painted in the
    image of an angel and her followers, and the furniture is exquisite.  A desk made from the finest
    cedar is resting against the wall, with a matching chair.  Both are heavily cushioned with satin, and
    carved in strange and beautiful pictures.  The only exit is north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:96:room:9653
      door:
        keywords: [door]
        kind: door
        key: tba:96:obj:9652

"tba:96:room:9655":
  name: A Cleared Path
  description: >
    The freshly cut path is clearer to the east while to the west it looks like someone gave up on
    hacking through this dense woods.  The trees and brush are typical of any hardwood forest.
  sector: inside
  exits:
