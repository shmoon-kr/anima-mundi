"tba:96:room:9645":
  name: A stairwell
  description: >
    A metal stairwell leads to the upper levels.  Some of the stairs are lying on the ground here,
    having rusted off.  The rats seem to stay away from here. Perhaps it has something to do with the inhuman
    howls of rage that eminate from the room west of hear.  Or maybe it's that there's more food nearer
    the kitchen.  Exits are up, west, and east.
  sector: inside
  flags: [no_mob, indoors]
