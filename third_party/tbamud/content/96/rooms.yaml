    south:
      to: tba:96:room:9610

"tba:96:room:9612":
  name: A turn in the path
  description: >
    The path takes a turn here, the hard-packed dirt loping in a wide turn.  In many places the path is
    interrupted by small collapses, due to ants tunneling under.  In the underbrush nearby, an animal
    has burrowed a rather deep hole to make it's home.  Exits are west or back to the south.
  sector: forest
  exits:
    south:
      to: tba:96:room:9611
    west:
      to: tba:96:room:9613
  extras:
  - keywords: [den, hole, burrow]
    text: >
      Peering into the hole, it looks like a mole has chosen to make it's home here.  The soil inside the
      burrow is dry and grainy.

"tba:96:room:9613":
  name: A three-way intersection
  description: >
    Birds chirp merrily as the path splits into two trails.  Rabbits and other 'larger' animals seem to
    use the west path, while squirrels and birds - the 'smaller' animals - seem to keep to the east
    path.  The northern path, on the other hand, doesn't look like any animal uses it.  The path continues
    west and north, and back east.
  sector: forest
  exits:
    north:
      to: tba:96:room:9614
    east:
      to: tba:96:room:9612
    west:
      to: tba:96:room:9617

