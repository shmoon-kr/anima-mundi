# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 96.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:96:room:9600":
  name: The mad wizard's hut
  description: >
    The inside of the hut is deathly quiet, save for the breathing of the wizard and the bubbling of
    the cauldron.  Shelves along the walls are lined with vials and glasses, holding a variety of colored
    liquids.  Inside the cauldron is a purple-red liquid, bubbling and splashing all over the floor.  The
    only exit is back east, out of the hut.
  sector: inside
  flags: [no_mob, indoors, no_track]
  exits:
    east:
      to: tba:96:room:9602
      door:
        keywords: [door]
        kind: pickproof
        key: tba:96:obj:9603
        reset: locked
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Kas
        Zone         : 96 Domiae
        Began        : 2000
        Player Level : 7-10
        Rooms        : 57
        Mobs         : 12
        Objects      : 11
        Shops        : 1
        Triggers     : 13
        Theme        : Forest, Cave, Swamp, abandoned keep
        Notes        : A quest zone in which a player has to first go to the bear cave
           to get a key that allows entrance to the wizards hut. The wizard will then
           transport the players to domiae and then they must find the king and
           complete the quest to receive a sword.
        Links        : 03e
        Zone 96 was linked to the following zones:
         100 Northern Highway              at  9603 (east ) --->  10056
  - keywords: [tree, oak]
    text: >
      Large oaken trees block out most of the light, giving the everything in the forest a dim green
      appearance.

"tba:96:room:9601":
  name: On the Path into the forest
  description: >
    The path into Domiae is surprisingly well-lit, despite the image given at the threshold.  Dried
    leaves crackle underfoot, and the forest animals scurry a safe distance away before turning to regard
    this new invader.  Birds chirp their merry songs, voices intertangling into a mesh of sounds that
    faintly resembles a choir.  The path branches off to the west, but the main path continues north.
  sector: forest
  exits:
    north:
      to: tba:96:room:9604
    south:
      to: tba:96:room:9619
    west:
      to: tba:96:room:9602

"tba:96:room:9602":
  name: Path to a distant hut
  description: >
    The sounds of the forest grow strangely faint as the path gets closer to the hut.  The trees grow
    more crooked, and the leafs underfoot grow more plentiful and dry.  Most of the small animals are
    gone, and only the biggest predatory animals of the forest dare come this close to the hut.  The front of
    the hut is decorated with strange runes, and animal skulls hang from the eaves.  The doorknob is
    fashioned from a human thigh bone.  Exits are back to the main path, or into the hut.
  sector: forest
  exits:
    east:
      to: tba:96:room:9601
    west:
      to: tba:96:room:9600
      door:
        keywords: [door]
        kind: pickproof
        key: tba:96:obj:9603
        reset: locked
  extras:
  - keywords: [hut, house, hovel, home]
    text: >
      The hut is a crude one, fashioned of daub and mud.  Thatched straw serves as the roof, and the
      windows are mere holes in the cracked walls.

"tba:96:room:9603":
  name: A Cleared Path
  description: >
    The limbs and scrub brush have been hacked off and thrown to each side of this new path.  Very
    little traffic has passed this way, only a few plants and grass blades peeking up through the forest
    floor are trodden.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:96:room:9655

"tba:96:room:9604":
  name: A path through Domiae
  description: >
    The path goes on into deeper foliage, and it now sprouts grass and other greenery.  The dirt
    becomes slightly softer, and roots protude from the soil. The refreshing scent of life is in the air, and
    the birds sing it's praise. The forest animals seem to take no heed of anyone, travelling along the
    path as any human would.  Squirrels, rabbits, hares, foxes, and other animals can be seen scurrying
    about.  The path continues north and south.
  sector: forest
  exits:
    north:
      to: tba:96:room:9605
    south:
      to: tba:96:room:9601

"tba:96:room:9605":
  name: A four-way intersection
  description: >
    A small hole in the treetops forms a sunlit glade.  The animals of the forest are far more active
    here, and the ground is littered with evidence on their passing.  A bird chirps gleefully from a hole
    in a nearby tree, soon followed by a chorus of her chicks.  The path here splits in four directions.
  sector: forest
  exits:
    north:
      to: tba:96:room:9610
    east:
      to: tba:96:room:9607
    south:
      to: tba:96:room:9604
    west:
      to: tba:96:room:9606

"tba:96:room:9606":
  name: A dead end
  description: >
    The birds chirping intensifies greatly.  A massive tree has fallen over the path, blocking any
    further advance.  Many birds are nested in the falling tree, which accountrs for the increase in noise. 
    The tree itself is covered in moss and lichen, with violets and wildflowers shooting from the rotted
    wood.  The only exit is back to the intersection.
  sector: forest
  exits:
    east:
      to: tba:96:room:9605

"tba:96:room:9607":
  name: A path deeper into the forest
  description: >
    As the path into the forest gets deeper, the sounds get louder and more plentiful.  The squirrels
    tittering, the birds chirping, and the animals just generally scampering about.  The path is filled
    with less leaves, now, and the ground gets even softer.  Exits are to the east and west.
  sector: inside
  exits:
    east:
      to: tba:96:room:9608
    west:
      to: tba:96:room:9605

"tba:96:room:9608":
  name: A mushy path
  description: >
    The ground is completely devoid of leaves now, and the soil gets even softer.  The air is beginning
    to take on an unpleasant odor, but it's not quite placeable.  The birdsong is as loud as ever, but
    the other animals seem to be strangely quiet.  The path turns south, or back west.
  sector: forest
  flags: [no_track]
  exits:
    south:
      to: tba:96:room:9609
    west:
      to: tba:96:room:9607

"tba:96:room:9609":
  name: A swampy pit
  description: >
    The path ends here.  The dirt has turned to mud, and a large collection of water and muck is in
    resting in the middle of the path.  The forest is silent, except the occasional bird chirping.  The only
    exit is back north.
  sector: forest
  flags: [dark, no_track]
  exits:
    north:
      to: tba:96:room:9608

"tba:96:room:9610":
  name: A path into Domiae
  description: >
    Flowers line the path into Domiae.  Here, deeper in the great forest, different types of trees are
    flourishing.  Rowan, elm, pine, and cedar trees add themselves to the already plentiful oak.  The
    ever-present birdsong intertwines itself with the sounds of the animals going about their business. The
    moisture trapped by the trees coupled with the coolness of the air gives the forest a wet sheen.  The
    path continues north and south.
  sector: forest
  exits:
    north:
      to: tba:96:room:9611
    south:
      to: tba:96:room:9605

"tba:96:room:9611":
  name: A path into Domiae
  description: >
