# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 654.
# values are named per type (armor: armor; weapon: damage, attack; drinkcon: capacity, contains, liquid...).
# level: minimum level to use it. affects: apply + modifier while worn.
"tba:654:obj:65400":
  type: trash
  keywords: [graffiti, wall, south]
  short: graffiti
  long: Some graffiti is scrawled on the wall to the south.
  wear: []
  values:
    raw: [0, 0, 0, 0]
  weight: 0
  cost: 0
  rent: 0
  level: 0
  extras:
  - keywords: [graffiti, wall, south]
    text:
    - >
      This subdivision was built to use with the TBA housing code since the code needs rooms that have
      already been created.  It's a very simple plan with 38 houses, meant to simplify the placing of
      houses.  Feel free to make any changes. Look map for a better idea of the layout.
    - To assign the houses, stand in any main room with the player and use hcontrol.
    - >
      *WARNING* Before setting the first house, please check for the file lib/house. This will sometimes
      be deleted as an empty file.  The house contents will not save without this directory!
    - >
      If you want to use this subdivision but need more than 38 houses, First and Second Streets can be
      continued to the east by changing the room names and some of the exit descriptions.  First and Second
      Avenue would need to be changed to Third and Fourth Avenue.
    - >
      If you need more space, you might want to change #3 and #8 Second Street to continue the Avenues
      southward and change #3 and #8 First Street of the new section to match.  Of course, First and Second
      Street would become Third and Fourth Streets.
    - >
      Sorry for any errors.  Please wash this wall with zedit. Hugs, Parnassus for TBAmud December 12,
      2013

"tba:654:obj:65402":
  type: treasure
  keywords: [keychain, subdivision]
  short: a plain keychain
  long: Someone left a keychain lying here.
  flags: [glow]
  wear: [take, hold]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 1
  rent: 0
  level: 0
  extras:
  - keywords: [keychain, subdivision]
    text: >
      This keychain, when held in a room away from the subdivision, will bring you to the subdivision
      intersection of First Street and First Avenue to make it easier to find your way home.  If you hold it
      again, anywhere in the subdivision, it will take you back to where you came from.
  triggers: [tba:654:trg:65400]

