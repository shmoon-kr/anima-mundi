"tba:299:mob:29905":
  keywords: [wyrenthoth, dracolich, dragon, undead]
  short: Wyrenthoth
  long: It is on this ledge that Wyrenthoth sits, preening him... itself.
  description: >
    Hmmm...  Seems that you have managed to walk in on Wyrenthoth during one of his...  Its preening
    sessions.  You don't exactly understand what there is to see beyond the bones.  Oh, wait, you didn't
    even know what the thing in front of you was did you?  Well, you take the time to look, for once, and
    notice that it is a large collection of bones.  And it just so happens that this large collection of
    bones serves to form what looks to be a dragon, although the odd bone or two seems to be out of
    place.  It does appear that Wyrenthoth is a dracolich.
