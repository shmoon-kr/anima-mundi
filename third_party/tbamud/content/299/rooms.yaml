"tba:299:room:29947":
  name: The Inner Crypt
  description:
  - >
    You continue to wander through this inner crypt.  From past experience, you know that this is often
    where the nobility of the realm would be laid to rest after the elaborate ceremonies took place
    upstairs in the cathedral proper.
  - >
    The crypt continues east and south here but a strange wind seems to be coming from the south. 
    There is also a large stone door on the western side of the crypt.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29946
      look: The crypt continues off to the east.
    south:
      to: tba:299:room:29950
      look: Looking in this direction, you can tell that the crypt floor has caved in.
    west:
      to: tba:299:room:29948
      look: >
        A huge stone door sits to the west, blocking the doorway rather nicely. The door is covered with
        strange carvings.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:299:obj:29910
        reset: locked
  extras:
  - keywords: [door, runes, carvings]
    text: >
      The door on the western side of the crypt is covered with strange, yet elegant carvings.  Looking
      somewhat closer at the carvings, you notice that they appear to be runes of protection.  Mostly
      against rot and ruin, but there is one near the center of the design which looks to be for protection
      against the undead.

"tba:299:room:29948":
  name: The Tomb Of Princess Evalynn
  description: >
    This is the tomb in which the legendary Princess Evalynn has been entombed for years and years. 
    Looking about this tomb, you notice the numerous candles yet burning about an ebony coffin.  The room
    smells of flowers, roses and carnations to be precise.  A slight breeze makes the candles flicker
    momentarily.  The walls have been painted with a multitude of small paintings and designs, probably about
    the life of Princess Evalynn.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:299:room:29947
      look: >
        A large stone door stands just to the east, blocking all entrance into this wondrous place.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:299:obj:29910
        reset: locked
  extras:
  - keywords: [coffin]
    text: The coffin seems to be made of ebony and seems to be very much closed.
  - keywords: [walls, wall, painting, paintings]
    text: >
      The paintings on the walls show various events in Princess Evalynn's life. One shows her ill-fated
      wedding day, when the wedding party was attacked shortly before the ceremony and Prince Michael was
      carried off by a large golden dragon. Another shows her donning a suit of emerald armor in preparation
      of war.  She was forced to take the kingdom in hand and defend it against many attacks over the
      years by those who thought that Gildoria would fall easily without any solid male leadership.

"tba:299:room:29949":
  name: The Large Cavern
  description: >
    This room, er, cavern is quite large as it stretches to the north and east and looks to have be
    carved out of the stone below the cathedral's foundations.  Hundreds of thousands of bones lie about the
    cavern in small piles.  There is a rather large pile off in the northwestern corner of the cavern. 
    The stone of the floor has been shaped to create a ledge of sorts in the southeastern corner.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:299:room:29943
      look: >
        A small passageway opens up to the west, making you wonder just how anything bigger than an ogre
        could even get into this chamber.

"tba:299:room:29950":
  name: A Bottomless Pit
  description: >
    Neighbour, it appears that you have chosen the wrong path to continue your voyages.  It seems that
    this pit falls a long, long way, and falling to the bottom just might take forever...
  sector: underwater
  flags: [dark, indoors]
  exits:
    north:
      to: tba:299:room:29947
      look: Looking northwards, you notice that the crypt continues happily.
    down:
      to: tba:299:room:29951
      look: Further down the pit.  It goes on forever you know.

"tba:299:room:29951":
  name: Down The Bottomless Pit
  description: >
    You find yourself much, much further down the pit.  It doesn't seem like this is going to end
    anytime soon.  The sides of the pit are quite smooth making it obviously impossible to slow your fall.
  sector: underwater
  flags: [dark, indoors]
  exits:
    up:
      to: tba:299:room:29950
      look: The pit keeps going upwards as far as you can see.
    down:
      to: tba:299:room:29952
      look: >
        The pit is dropping away below you.  It looks to be very deep.  Well, then again, if you are going
        to fall forever, it has to be pretty deep.

"tba:299:room:29952":
  name: Falling Down The Bottomless Pit
  description: >
    You continue your passage down this really deep pit.  You begin to wonder just how far from the top
    you are, and then think to yourself, 'It doesn't really matter where the top is, I just want to know
    where the bottom is.'  The pit seems to go on in darkness for a good long way.
  sector: underwater
  flags: [dark, indoors]
  exits:
    up:
      to: tba:299:room:29951
      look: The pit keeps going upwards as far as you can see.
    down:
      to: tba:299:room:29953
      look: >
        The pit drops away below you, but you notice that there is a good deal of light coming from
        somewhere below.

"tba:299:room:29953":
  name: Above The Molten Lava
  description: >
    You are currently a short distance above the molten lava which just so happens to be below.  The
    walls of the pit are glassy smooth at this point, it is probably that the stone has been melted to that
    consistency. The pits continues upwards into the darkness and down a short distance into the lava.
  sector: underwater
  flags: [indoors]
  exits:
    up:
      to: tba:299:room:29952
      look: The pit keeps going upwards as far as you can see.
    down:
      to: tba:299:room:29954
      look: >
        There is scads of molten lava right below you.  Guess this means that the pit didn't fall forever
        doesn't it?

"tba:299:room:29954":
  name: Being Burnt Alive
  description: >
    Need I really say more?  Suffice to say, after being exposed to extremely high temperatures you are
    on the verge of death.  Better get out of here quick before there is nothing left of you but a pile
    of ash.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    down:
      look: >
        This looks like the bottom of the pit.  Oh well, I guess it doesn't go down forever after all.
  triggers: [tba:299:trg:29900]

"tba:299:room:29955":
  name: An Old Stone Road
  description: >
    You find yourself on an old stone road, leading away from a large building to the north.  Blocking
    the road directly to the north is a large stone wall with an iron wrought gate planted firmly where
    the road would pass through it.  The building to the north appears to be an old church or cathedral.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:299:room:29900
      look: >
        An iron wrought gate stands in the middle of the stone wall, and blocks the way northwards into the
        courtyard of the cathedral.
      door:
        keywords: [gate, iron, wrought]
        kind: door
        reset: closed
    south:
      to: tba:258:room:25872
