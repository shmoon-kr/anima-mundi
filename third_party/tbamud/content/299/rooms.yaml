# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 299.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:299:room:29900":
  name: The Cathedral Courtyard
  description:
  - >
    Leaves blown about by the wind of countless centuries fill this lonely empty courtyard with their
    dull hollow rustle.  As you look around an eerie feeling overcomes you, as if you are being watched.
  - >
    Just to the north, you see that the once beautiful double doors leading into the cathedral proper
    have been torn from their frames and left lying on the ground near the now open doorway.
  - >
    At the southern end of the courtyard, a large iron wrought gate can be seen, creaking in the wind. 
    On the other side of the gate, there seems to be an older road leading away from the cathedral.
  sector: field
  exits:
    north:
      to: tba:299:room:29901
      look: A large fountain of water can be seen inside the open doorway to the north.
    south:
      to: tba:299:room:29955
      look: >
        The iron wrought gate stands in the middle of the stone wall, and blocks the way southwards towards
        the old stone road.
      door:
        keywords: [gate, iron, wrought]
        kind: door
        reset: closed
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Cathedral
        by Matrix
        Copyright 1995 by Curious Areas Workshop
        *
        This area is an abandoned cathedral with a twist.  It has been
        overrun by evil and nasty undead but there are also good undead
        attempting to contain these nasties.  There are also a few good
        undead creatures deep in the catacombs below the cathedral.
        The area consists of 56 rooms, 15 mobiles, and 17 objects.
        N.B. The layout of the abandoned cathedral is loosely based upon
             an unfinished church created by CatsEye of VieMud 2.x
        *
        This area was built to conform to the standard Diku gamma 0.0
        release.  Along with all other changes you must make to change
        this area to your particular db flavor,
        *** also, edit the following room:
        #55 -- add an entrance/exit in a suitable direction and change
                the description to fit the surrounding area if neccessary.
        *** You may wish to check the following objects to ensure that their
        spells are the same as your Mud's spells:
        #06    sleep (38), cure critic (15)
        #07    sanctuary (36)
        *** Finally... you may wish to check this sector number...
        Since I couldn't find fly sectors in the original DikuMud, I used
        9 as a sector for them.  The rooms to which this applies are:
        #14, #50, #51, #52, #53
        *
        The mobs were built with a 'standard' 30-level, DikuMud in mind.
        Armor classes range from +10 (bad) to -10 (excellent).
        On VieMud, mobile ##05 (Wyrenthoth) was a snivelling excuse of a
        dracolich, always whining about how it hated cold, damp, and closed
        in spaces.  Also, if it was given object ##07 (the ivory staff),
        it would give the key it held (##10) to the player in question
        before crumbling to dust and bones.
        All of the mobs with the exception of #00, #03, and #04 are
        undead, and if possible, should be given some sort of undead
        special procedures as suited.  Mobs #03 and #04 are evil clerics,
        and if possible should be given specials to suit.
        The 'boss' mobs of this area are really #03 and #06, so should
        be suitably beefed up to suit.
  - keywords: [door, doors]
    text: >
      The remains of the two doors that served as the main entranceway to the cathedral are now lying in
      near ruins on the ground.  The doors are covered with scuff and scratch marks and are merely a shadow
      of their former glory.

"tba:299:room:29901":
  name: The Cathedral Entrance
  description:
  - >
    In this large open area just inside the cathedral doors, you can see the once beautiful font and
    the once pristine spring from which the holy waters were once drawn.  All that remains now is the
    result of the desolation, despair, and destruction caused by whatever turned this cathedral into the ruin
    it is now.  It seems as though everything here has been corrupted and spoiled.
  - >
    There are small alcoves to both the east and west.  The cathedral also continues northwards towards
    where the altar should be.  There is a large open doorway to the south, leading out to the courtyard.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29904
      look: >
        The way north looks to be almost blocked by numreous overturned pews, but passable all the same.
    east:
      to: tba:299:room:29902
      look: A small alcove opens up to the east.
    south:
      to: tba:299:room:29900
      look: The courtyard of the cathedral can be seen outside the doorway to the south.
    west:
      to: tba:299:room:29903
      look: A small alcove opens up to the west.

"tba:299:room:29902":
  name: An Alcove
  description: >
    This is a small alcove which stands just east of the main cathedral entrance.  Just to the west,
    you can see what is left of the font and spring in the cathedral.  Just to the east you can see a set
    of spiral stairs leading up and down.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29913
      look: There is a set of spiral stairs just to the east.
    west:
      to: tba:299:room:29901
      look: The cathedral entrance can be seen to the west.

"tba:299:room:29903":
  name: An Alcove
  description: >
    This is a small alcove which stands just west of the main cathedral entrance.  Just to the east,
    you can see what is left of the font and spring in the cathedral.  Just to the west you can see a set
    of spiral stairs leading up and down.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:299:room:29901
      look: The cathedral entrance can be seen to the east.
    west:
      to: tba:299:room:29912
      look: There is a set of spiral stairs just to the west.

"tba:299:room:29904":
  name: The Aisle Of Pews
  description:
  - >
    As you move through the cathedral, you find yourself fighting your way through the numerous
    overturned pews here.  Interspersed amongst the pews are mouldy remains of books.  Dust and decay covers
    everything here, giving you the impression that nothing has been touched for years.
  - >
    The cathedral entrance is off to the south, and the altar is surely located somewhere to the north.
  - You hear a quiet wail coming from somewhere below.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29905
      look: >
        The mess of pews ends just to the north where the cathedral opens up into a sort of worship
        chambers.
    south:
      to: tba:299:room:29901
      look: >
        The cathedral entrance and courtyard are off to the south.  A dry wind is blowing through the
        cathedral from the south.

"tba:299:room:29905":
  name: The Worship Hall
  description:
  - >
    This portion of the cathedral is an open area between the pews and the altar.  This would have been
    the location where many of the worshippers took their offerings.  But now only the decay of years
    remains.  Looking around you spot what appears to be a stain on the ground and another on the wall. 
    You also seem to hear louder wailings... or was it something else?
  - >
    To the east and west, you can see what appear to be confessionals. To the north there are some more
    pews, and to the south, you can see the destruction where numerous pews have been strew about.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29908
      look: >
        Just ahead of you are some more pews, but they are much nicer than normal pews would be.  Just
        beyond them, you can see what appears to be an altar.
    east:
      to: tba:299:room:29907
      look: There is a curtain hanging across the entrance to the confessional just to the east.
      door:
        keywords: [curtain]
        kind: door
        reset: closed
    south:
      to: tba:299:room:29904
      look: To the south you can see all of the pews scattered and strewn about the cathedral.
    west:
      to: tba:299:room:29906
      look: There is a curtain hanging across the entrance to the confessional just to the west.
      door:
        keywords: [curtain]
        kind: door
        reset: closed
  extras:
  - keywords: [wall, walls, floor, stain, stains]
    text: >
      The stains on the floor and wall look to be relatively recent as compared to the destruction that
      hit the cathedral.  You are uncertain as to what they could be, but they are fairly large.

"tba:299:room:29906":
  name: The Confessional
  description:
  - >
    In this dingy little room, you can tell that people used to make their most holy of confessions
    here.  There is no relief now, for, those who have have lost their souls.
  - A small and dingy curtain hangs in the entranceway to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29905
      look: >
        The curtain to the east is hanging raggedly from the bar along the top of the entranceway.  Looking
        through it you can see a fairly large open area just outside.
      door:
        keywords: [curtain]
        kind: door
        reset: closed

"tba:299:room:29907":
  name: The Confessional
  description:
  - >
    In this dingy little room, you can tell that people used to make their most holy of confessions
    here.  There is no relief now, for, those who have have lost their souls.
  - A small and dingy curtain hangs in the entranceway to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:299:room:29905
      look: >
        The curtain to the west is hanging raggedly from the bar along the top of the entranceway.  Looking
        through it you can see a fairly large open area just outside.
      door:
        keywords: [curtain]
        kind: door
        reset: closed

"tba:299:room:29908":
  name: The High Pews
  description:
  - >
    Standing amongst these pews, you notice that they appear to be in better shape than the ones
    farther to the south.  Another noticable thing is that the pews themselves seem to be of a much higher
    quality than the ones to the south.  Perhaps this is where the nobles used to worship.  Unfortunately,
    all has fallen into decay and neglect.
  - >
    The altar is located just to the north, but there is something ever so slightly suspicious about
    it.  There is an open area to the south just before the jumble of pews that can be seen there.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29909
      look: The altar stands right before you.
    south:
      to: tba:299:room:29905
      look: There is an open area just to the south, between these pews and the common peoples' pews.

"tba:299:room:29909":
  name: At The Altar
  description:
  - >
    You stand before the pews of the cathedral.  Standing before you is the altar.  The floor around
    the altar, including the steps leading up to it, is stained a deep brown that looks almost wet still. 
    There are some sticky footprints left on the floor.
  - >
    The cathedral continues southwards through the pews.  Just to the northwest there is a small
    curtain pulled across a doorway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29910
      look: >
        The curtain has been pulled to across the doorway, making it slightly awkward to see through.
      door:
        keywords: [curtain]
        kind: door
        reset: closed
    south:
      to: tba:299:room:29908
      look: Rows and rows of pews can be seen to the south.

"tba:299:room:29910":
  name: The Clergical Chambers
  description:
  - >
    These chambers are quite large and appear to be rather clean.  Looking about, you notice that the
    beds are made and clean robes are hanging on hooks by the heads of each one.  The beds are arranged so
    that the foot of each is in the middle of the room, whilst the heads are in small alcove in the
    wall.  There is a small chest at the foot of each, but a quick glance reveals nothing out of the ordinary.
  - >
    The thing that strikes you most oddly about this room however, is that there are no beds along the
    north wall, but there is a narrow door at the east end of it.  A small curtain is located at the
    southern end of the room and small windows line the east and west walls.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29911
      look: You see a narrow door at the eastern end of the north wall.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:299:obj:29903
        reset: locked
    south:
      to: tba:299:room:29909
      look: >
        There is a curtain pulled across the doorway here, but you surmise that it must lead out to the
        main nave of the cathedral.
      door:
        keywords: [curtain]
        kind: door
        reset: closed

"tba:299:room:29911":
  name: The Inner Sanctum
  description:
  - >
    This small room is hidden away at the back of the cathedral.  From the outside, you would never
    have known of its existence.  The walls are lined with shelves and racks.  The walls beneath the shelves
    are almost entirely lined with chests.  There are no lights visible in the room, and even the door
    to the south seems to have been a perfect fit in its frame.
  - A single door to the south blocks the entrance to this room.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:299:room:29910
      look: You see a door.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:299:obj:29903
        reset: locked

"tba:299:room:29912":
  name: A Spiral Stairway
  description: >
    You stand on a wooden landing.  Looking eastwards, you notice that a small stone hallway leads away
    from the staircase.  The wooden stairs continue above you and below you, leading up into the heights
    of the cathedral tower and down into the gloominess of what you suspect are the cathedral's crypts.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29903
      look: A small hallway leads away from the staircase towards the cathedral proper.
    up:
      to: tba:299:room:29916
      look: The wooden stairs lead upwards into what must be the bell tower of the cathedral.
    down:
      to: tba:299:room:29932
      look: The stairwell leads down into the gloomy darkness below.

"tba:299:room:29913":
  name: A Spiral Stairway
  description:
  - >
    You stand on a wooden landing.  Looking westwards, you notice that a small stone hallway leads away
    from the staircase.  The wooden stairs continue above you and below you, leading up into the heights
    of the cathedral tower and down into the gloominess of what you suspect are the cathedral's crypts.
  - >
    Looking above you, you notice that the stairwell is swaying dangerously and does not seem to be
    firmly attached to anything at all.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:299:room:29902
      look: A small hallway leads away from the staircase towards the cathedral proper.
    up:
      to: tba:299:room:29914
      look: Looking upwards, the stairs look very unsteady and definetely untrustworthy.
    down:
      to: tba:299:room:29934
      look: The stairwell leads down into the gloomy darkness below.

"tba:299:room:29914":
  name: A Spiral Stairway
  description: >
    You are climbing the wooden stairway and just happen to have arrived at a location where,
    coincidentally, there does not happen to be a floor at all.  However, the stairwell continues above you and
    below you, as it wanders merrily on its way.
  sector: underwater
  flags: [indoors]
  exits:
    up:
      to: tba:299:room:29915
      look: The wooden stairs continue as normal above you.
    down:
      to: tba:299:room:29913
      look: The staircase continues below you as it nears the ground level.

"tba:299:room:29915":
  name: The Bell Tower
  description:
  - >
    You stand in a small room at the top of the old wooden staircase.  An exit to the west leads into
    what must certainly be the main bell room. Loud chimes peal their solemn tones which, due to your
    certain proximity, leave your ears ringing.
  - >
    Even though you can hear the beautiful bell tones, the creaking of the stairs below is quite
    disturbing, as is the unsteady floor upon which you stand.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:299:room:29918
      look: >
        Looking westwards, you can see the dim light creating eerie shadows with the objects in the room.
    down:
      to: tba:299:room:29914
      look: >
        As you look down you can see that this stairway is swaying from side to side with every movement
        you make.  Surely that cannot be safe.

"tba:299:room:29916":
  name: A Spiral Stairway
  description: >
    You stand on a wooden landing.  Looking eastwards, you notice that through the stone doorway, a
    hallway leads northwards and southwards away from the staircase.  The wooden stairs continue above you
    and below you, continuing up into the heights of the cathedral tower and down into the gloom below as
    they probe towards the ground level.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29919
      look: A hallway opens up off of this landing on the staircase.
    up:
      to: tba:299:room:29917
      look: The stairs continue up into the tower.
    down:
      to: tba:299:room:29912
      look: The wooden stairs lead down towards the ground level.

"tba:299:room:29917":
  name: The Bell Tower
  description:
  - >
    You stand in a small room at the top of the old wooden staircase.  An exit to the east leads into
    what must certainly be the main bell room. Loud chimes peal their solemn tones which, due to your
    certain proximity, leave your ears ringing.
  - The wooden stairs lead down back towards the main section of the church proper.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29918
      look: >
        Looking eastwards, you can see the dim light creating eerie shadows with the objects in the room.
    down:
      to: tba:299:room:29916
      look: The stairs lead down towards ground level.

"tba:299:room:29918":
  name: The Bell Room
  description: >
    Standing in this tall room, you feel rather small.  You look up into the gloomy rafters above and
    you can see countless bells hanging up there, swinging to and fro lightly.  Every so often one peals
    out with its distinct ring.  The dim light in here is throwing strange shadows all over the place.
    Wait!  Did one just move?
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:299:room:29915
      look: Through the doorway, you can only see darkness.
    west:
      to: tba:299:room:29917
      look: Through the doorway, you can only see darkness.

"tba:299:room:29919":
  name: The Cloister Hall
  description: >
    You stand in the middle of a long stone hallway lined with wooden doors.  The hallway seems to
    extend farther northwards than southwards, but it would almost appear as if this was once the residence
    of the priests, monks, and nuns who looked after the cathedral.  A narrow hallway also made of stone
    leads westwards into the darkness.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:299:room:29923
      look: The hallway continues northwards from here.
    south:
      to: tba:299:room:29920
      look: >
        The southern end of the hall is surprisingly dark and shadowy, but you think nothing of it.
    west:
      to: tba:299:room:29916
      look: A narrow hallways leads off into the darkness.

"tba:299:room:29920":
  name: The End Of The Dark Hall
  description: >
    You find yourself at what appears to be the southern end of a rather long stone hallway lined with
    wooden doors from end to end.  Looking northwards you can see that something is lighting the hallway
    farther along, but insuffuicient light has penetrated the darkness here to help your visibility at
    all.  There is an open wooden door on the east side of the hallway here, and a closed one on the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:299:room:29919
      look: >
        The hallway leads off towards the north, where you can see that it is lit somewhat better than
        here.  Not a difficult task mind you.
    east:
      to: tba:299:room:29921
      look: >
        The doorway to the east looks to have been smashed in by something quite, uhm, large.  It looks as
        if there was a door there... once.
    west:
      to: tba:299:room:29922
      look: >
        The doorway to the west looks to be much sturdier than the one to the east, but that doesn't say
        very much for it.  It hangs from one hinge, and pieces of the door appear to be missing.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:299:room:29921":
  name: A Monk's Room
  description: >
    This room is a complete shambles.  What looks to have once been a bed of some sort is now lying in
    pieces which are scattered about the small room.  There is a shattered wooden door lying near the
    doorway to the west.  It almost looks as if the door was bashed in. Other than the shards of wood lying
    about the room, there is nothing else out of order, no blood, no material caught anywhere, just the
    broken wood.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:299:room:29920
      look: You can see darkness outside the door.  Not much of a change from what is in here.

"tba:299:room:29922":
  name: The Abbott's Room
  description: >
    This looks to be a step up from an ordinary monk's residence. The cot is still in fine condition in
    the corner underneath a narrow window and there is a small rug in the center of the floor. The
    doorway to the east is in shambles however and it looks as if whatever was trying to break through it got
    in without too much difficulty.  There does not seem to be any sign of a struggle, so it would seem
    that either the Abbott was not in his room or that he went along willingly with whomever (or whatever)
    broke in.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29920
      look: >
        The door, or better yet, what is left of it, is made of wood, and hangs from one hinge, blocking
        your way through it.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:299:room:29923":
  name: A Cloistered Hall
  description: >
    You stand in part of a long stone hallway lined on both the east and western sides with doorways. 
    In most of the doorways it appears that the wooden doors that were once there in their entirety are
    smashed and destroyed.  The doors on either side of the hallway here are no different.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:299:room:29926
      look: The hallway continues northwards.
    east:
      to: tba:299:room:29925
      look: >
        Yet another door in the long series has been smashed open on the eastern side of the hallway.
    south:
      to: tba:299:room:29919
      look: >
        To the south, you can see that the hallway continues, but you also notice that there aren't many
        lights down that way.
    west:
      to: tba:299:room:29924
      look: >
        Just like the doors on the eastern side of the hall, there is no longer a doorway here on the
        western side.

"tba:299:room:29924":
  name: A Monk's Room
  description: >
    This room is a complete shambles.  What looks to have once been a bed of some sort is now lying in
    pieces which are scattered about the small room.  There is a shattered wooden door lying near the
    doorway to the west.  It almost looks as if the door was bashed in. Other than the shards of wood lying
    about the room, there is nothing else out of order, no blood, no material caught anywhere, just the
    broken wood.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29923
      look: >
        The doorway to the east is clear for passage except for all of the shards of wood lying about the
        room.  The doorway appears to lead out into a hallway of sorts.

"tba:299:room:29925":
  name: A Monk's Room
  description: >
    This room is a complete shambles.  What looks to have once been a bed of some sort is now lying in
    pieces which are scattered about the small room.  There is a shattered wooden door lying near the
    doorway to the west.  It almost looks as if the door was bashed in. Other than the shards of wood lying
    about the room, there is nothing else out of order, no blood, no material caught anywhere, just the
    broken wood.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:299:room:29923
      look: >
        The doorway to the west is clear for passage except for all of the shards of wood lying about the
        room.  The doorway appears to lead out into a hallway of sorts.

"tba:299:room:29926":
  name: A Cloistered Hall
  description: >
    You stand in part of a long stone hallway lined on both the east and western sides with doorways. 
    In most of the doorways it appears that the wooden doors that were once there in their entirety are
    smashed and destroyed.  The doors on either side of the hallway here are no different.  You get a
    strange eerie feeling as you stand in this part of the hallway.  Perhaps it is from the strange light
    source that seems to be just to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:299:room:29927
      look: The hallway continues northwards towards the strange light source down there.
    east:
      to: tba:299:room:29929
      look: Another smashed open door can be seen on the east side of the hall.
    south:
      to: tba:299:room:29923
      look: The hallway continues southwards where it appears to be getting darker and darker.
    west:
      to: tba:299:room:29928
      look: >
        Is it just me, or are the smashed open doors on the west side of the hall becoming ever so slightly
        predictable?

"tba:299:room:29927":
  name: A Cloistered Hall
  description: >
    You stand in part of a long stone hallway lined on both the east and western sides with doorways. 
    In most of the doorways it appears that the wooden doors that were once there in their entirety are
    smashed and destroyed.  The doors on either side of the hallway here are no different.  An eerie
    feeling pervades your body and you notice that everything seems to be covered with a strange, yet bright,
    yellow glow.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:299:room:29931
      look: The doorway to the east is blocked by a wooden door that looks to be quite sturdy.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:299:room:29926
      look: Looking down the hallway to the south, you notice that it becomes darker and darker...
    west:
      to: tba:299:room:29930
      look: >
        The door on the western side of the hallway is broken open, just like almost every other door it
        seems.

"tba:299:room:29928":
  name: A Nun's Room
  description: >
    This once beautiful room has obviously been completely and utterly destroyed at some time in the
    past.  At least, everything between its four walls has.  Remenants of various articles of clothing and
    whatnot lie scattered around the room, all collecting mould.  There is a wide open doorway to the
    east where a wooden door once hung upon brass hinges. 'How did you know this?' you ask yourself... and
    then notice the wooden shards lying around the doorway and the remains of brass hinges sitting in the
    doorframe.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:299:room:29926
      look: The cloistered hallway lies just to the east through the open doorway.

