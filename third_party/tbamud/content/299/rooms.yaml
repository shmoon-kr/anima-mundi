"tba:299:room:29941":
  name: The Antechamber
  description: >
    This looks to be an antechamber of sorts, but an antechamber to what?  The walls have shelves upon
    them that are thick with dust. The floor is covered with footprints marring the unvisited look that
    this room seems to have been cultivating for quite a long time.  The thing that strikes you as most
    strange about this room is perhaps the almost new coffin sitting in one corner of the room.  The walls
    are covered with mosaics and there is an archway set in the northern wall.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:299:room:29939
      look: Through the archway to the north, you can see what looks to be a crypt.
    south:
      to: tba:299:room:29942
      look: >
        The mosaic to the south does not appear to be properly attached to the wall, perhaps you could open
        it...
      door:
        keywords: [mosaic]
        kind: pickproof
        key: tba:299:obj:29911
        reset: locked
  extras:
  - keywords: [mosaic, mosaics, walls]
    text: >
      The mosaics covering the walls of this room appear to be merely strange designs made of multitudes
      of small tiles.  The one to the south does not appear to be properly attached to the wall, perhaps
      you could open it...

"tba:299:room:29942":
  name: The Inner Crypt
  description:
  - >
    You continue to wander through this inner crypt.  From past experience, you know that this is often
    where the nobility of the realm would be laid to rest after the elaborate ceremonies took place
    upstairs in the cathedral proper.
  - >
    The only direction that the crypt leads is to the east.  The floor is rather worn down in a track
    leading from the eastern passage to the northern wall.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:299:room:29941
      look: >
        Looking carefully at the northern wall, you notice that something is quite out of place in it. 
        Staring at the worn down track in the floor where it meets the wall, you trace your eyes upwards, where
        they discover a well hidden door handle.
      door:
        keywords: [handle]
        kind: pickproof
        key: tba:299:obj:29911
        reset: locked
    east:
      to: tba:299:room:29943
      look: The crypt continues off to the east.
  extras:
  - keywords: [wall]
    text: >
      Looking carefully at the northern wall, you notice that something is quite out of place in it. 
      Staring at the worn down track in the floor where it meets the wall, you trace your eyes upwards, where
      they discover a well hidden door handle.
  - keywords: [floor, track]
    text: >
      The worn down track in the floor leads to the north wall.  It certainly seems to take a lot of
      hints to get this fact through to you, doesn't it?

