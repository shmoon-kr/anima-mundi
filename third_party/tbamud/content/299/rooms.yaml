"tba:299:room:29931":
  name: Mother Superior's Room
  description:
  - >
    This room is the same size as all of the others, but contains such luxeries as a writing desk and
    chair in addition to the cot on the northern wall.  A narrow window is located in the eastern wall,
    but merely presents a view of the black night outside.
  - A simple wooden door serves as the entrance to this room to the east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:299:room:29927
      look: >
        The wooden door to the west looks to be quite sturdy as compared to some of those that you have
        seen lately.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:299:room:29932":
  name: A Crypt
  description: >
    Standing in this part of the crypt, you notice that there is a set of wooden stairs set into the
    corner of the room, leading up to the floors above.  This small chamber has two other exits, one to the
    east and one to the south through a pair of archways.  Other things of note in here are the small
    metal plates in the walls with tiny brass plaques set into each one.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:299:room:29933
      look: The crypt continues through the archway to the east.
    south:
      to: tba:299:room:29935
      look: The crypt continues through the archway to the south.
    up:
      to: tba:299:room:29912
      look: A wooden staircase leads up to the floors above.
  extras:
  - keywords: [metal, plate, brass, plaque, wall, walls]
    text: >
      The small metal plates in the walls seem to be drawers of some sort.  Each one is inset with a
      small brass plaque.  Each plaque lists the name of the occupant, none of whom you recognize at all.

