# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 555.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:555:room:55500":
  name: Ultima Description Room
  description:
  - >
    A port of the Merc. Ultima area by Casret. It is mostly ported from a mostly finished port to
    Smaug. The area starts down in room 55685 and uses zone 555 and 556.
  - The area ranges through all levels.
  - >
    The two mazes (Desert and Whirlpool) may have to be adjusted. The maze progs of 130 (Welcor's Mist
    Maze) are much better but seemed a bit too strong for the area.
  - Edits made for tbaMUD by Parna.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:556:room:55685

"tba:555:room:55501":
  name: New Magincia Road
  description: >
    This is the main road of New Magincia.  To the south the dirt path continues and a huge gate lies
    to the north.
  sector: city
  exits:
    north:
      to: tba:556:room:55685
      look: There is a huge gate.
      door:
        keywords: [gate, "n", north]
        kind: door
    south:
      to: tba:555:room:55502
      look: A path leads to the south.

"tba:555:room:55502":
