  name: Cellar
  description: >
    There is a chair in the corner and plenty of empty bottles.  There is also the evidence of the
    green substance here as well.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:555:room:55551
    west:
      to: tba:555:room:55547

"tba:555:room:55549":
  name: Cellar
  description: >
    There is a slime trail here.  There seems to be much broken glass down here, some if it covered
    with slime.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55546
    east:
      to: tba:555:room:55550
      look: There is a shimmering to the east.
    south:
      to: tba:555:room:55552

"tba:555:room:55550":
  name: The Britain Moongate
  description: >
    The place around the moongate, as always, seems clean and neat.  The blue light of the moongate has
    become a comforting sight to you.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:555:room:55547
    east:
      to: tba:555:room:55551
    south:
      to: tba:555:room:55553
    west:
      to: tba:555:room:55549
    up:
      to: tba:555:room:55556
      look: Through the moongate there is a large courtroom.
      door:
        keywords: [moongate]
        kind: pickproof
        key: tba:555:obj:55510
        reset: locked

"tba:555:room:55551":
  name: Cellar
  description: >
    The walls are leaking here.  You hear the bang of feet and the shifting of chairs from above.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55548
    south:
      to: tba:555:room:55554
    west:
      to: tba:555:room:55550
      look: There is a shimmering to the west.

"tba:555:room:55552":
  name: Cellar
  description: >
    The damp walls of this corner bother you...  Not because it's damp.  Because it's not water!
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55549
    east:
      to: tba:555:room:55553

"tba:555:room:55553":
  name: Cellar
  description: The smells of this cellar are overpowering.  There doesn't seem to be much ventilation.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55550
      look: There is a shimmering light.
    east:
      to: tba:555:room:55554
    west:
      to: tba:555:room:55552

"tba:555:room:55554":
  name: Cellar
  description: >
    This corner of the cellar is the ugliest.  From the smell in the corner it is obvious where the
    Drunks clear their guts.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55551
    west:
      to: tba:555:room:55553

"tba:555:room:55555":
  name: The Yew Entrance
  description: >
    To the south you see a large courthouse and a small part of Yew.  Most of Yew is secretly hidden in
    the branches of the forest.  To the north you see one of the most dangerous parts of this same
    forest.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:555:room:55570
    south:
      to: tba:555:room:55556

"tba:555:room:55556":
  name: In Front of the Courthouse
  description: >
    The immense Courthouse faces this street.  All of Britania's crime comes here to be tried.  There
    is little crime anymore though, after the great enlightenment.  There is also a pub to the west.
  sector: city
  exits:
    north:
      to: tba:555:room:55555
    east:
      to: tba:555:room:55557
    south:
      to: tba:556:room:55685
      look: You can see dim shapes behind the moongate.
      door:
        keywords: [moongate]
        kind: door
        reset: closed
    west:
      to: tba:555:room:55562

"tba:555:room:55557":
  name: Justice Row
  description: >
    The cobblestone road leads into a clearing of the woods to the east and to a pub to the west.  To
    your south you see a great Courthouse, but its entrance is on the east.
  sector: city
  exits:
    east:
      to: tba:555:room:55558
    west:
      to: tba:555:room:55556

"tba:555:room:55558":
  name: Under the Stone Arch
  description: >
    You stand under a large stone arch.  To your east there is a bonfire. Around the bonfire are these
    same stone arches; they form a circle around the clearing.
  sector: forest
  exits:
    east:
      to: tba:555:room:55559
      look: There are chanting druids and a large bonfire to the east.
    west:
      to: tba:555:room:55557

"tba:555:room:55559":
  name: Bonfire
  description: >
    The heat from the bonfire warms you even at the fringe of the ceremony. Here, Druids form a circle
    and chant the sacred mantra.
  sector: forest
  exits:
    west:
      to: tba:555:room:55558

"tba:555:room:55560":
  name: Pub
  description: >
    You are in a happy little pub.  There are many little tables and citizens are talking here.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:555:room:55561

"tba:555:room:55561":
  name: Justice Row
  description: There are some citizens strolling along the road.  There is a Pub to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:555:room:55562
    west:
      to: tba:555:room:55560

"tba:555:room:55562":
  name: Justice Row
  description: >
    Perhaps the only real street in a city where all the citizens are nestled in trees, it leads east
    to west.
  sector: city
  exits:
    east:
      to: tba:555:room:55556
    west:
      to: tba:555:room:55561

"tba:555:room:55563":
  name: The Audience Room
  description: >
    This is where people would sit to see the cases and wait for the Judge.  To the North you see the
    actual Bench.  All around are the pew-like seats.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55556
      door:
        keywords: [door, "n", north]
        kind: door
        reset: closed
    south:
      to: tba:555:room:55564

"tba:555:room:55564":
  name: The Bench
  description: >
    The Bench is one of the most imposing things you've seen.  You have to crane your neck to even
    glimpse at the Judge.  There are no lawyers, there is only Justice.  To the east and west are the prisons.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55563
    east:
      to: tba:555:room:55565
      door:
        keywords: [door, e, east]
        kind: door
        reset: closed
    west:
      to: tba:555:room:55566
      door:
        keywords: [door, w, west]
        kind: door
        reset: closed

"tba:555:room:55565":
  name: Prison
  description: >
    To the north you see a cell.  Locks are unnecessary, because the prisoners are kept in their cells
    by magic.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55568
      look: The prisoner looks at you and growls.
    west:
      to: tba:555:room:55564
      door:
        keywords: [door, w, west]
        kind: door
        reset: closed

"tba:555:room:55566":
  name: Prison
  description: >
    To the north you see a cell.  Locks are unnecessary, because the prisoners are kept in their cells
    by magic.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:555:room:55567
      look: The prisoner is a small man.
    east:
      to: tba:555:room:55564
      door:
        keywords: [door, e, east]
        kind: door
        reset: closed

"tba:555:room:55567":
  name: Prison Cell
  description: >
    This is a cell where they keep dangerous prisoners.  You hope the magic barriers don't give out.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:555:room:55566

"tba:555:room:55568":
  name: Prison Cell
