    collapsed shelves?  ) so just pick a book and start reading.  The stacks continue to the east and west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:555:room:55517
    west:
      to: tba:555:room:55536
  extras:
  - keywords: [book, books, shelves]
    text: >
      These shelves deal with the fascinating letter A.  Among the more interesting books are,
      "Andersen's tips on Area Building."  "The Art of Spamming" and "Axes and You."

