"tba:555:room:55585":
  name: Dungeon Entrance
  description: >
    There is a huge maw of an entrance to one of the terrible Dungeons.  After the Age of Enlightenment
    only 8 sources of evil still survive in the world. These are the eight Dungeons.  Now they are being
    cleaned out.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:555:room:55587
      look: A cold draft pours out of the dungeon.

"tba:555:room:55586":
  name: The Dungeon
  description: These dungeon rooms seem all the same.  There are signs of recent battling everywhere.
  sector: inside
  flags: [dark, indoors]
  exits:
