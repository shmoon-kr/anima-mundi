                                                      South Gate
  - keywords: [portrait, painting]
    text: It is a picture of Claeregina Mahzi, queen of Adacaract.

"tba:287:room:28725":
  name: The Secret Library Vault
  description: >
    Wow!  There is enough dust here to grow a crop of corn on the shelves.  But there may be even more
    interesting things on the shelves than corn.  Why, on that shelf just out of reach, you see a book
    that has to be the Book of Dwarven Herblore.  Too bad you can't get it; it would be useful to a
    wizard.  A few torn off pages litter the lowest shelf, nearer at hand than the great dusty tome.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28724
      look: The public section of the library is to the north.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:287:obj:28708
  extras:
  - keywords: [blue, chewed, paper]
    text:
    - >
      It is a letter, or rather, half of a letter. has never done. I say more happily that your ring is
      finished. It is a work of great art, and no king wears its equal. Indeed, the stone quarried from the
      [dwarven?] mines of Holdraxe is said to have magical properties.  I know little of these.  But it is
      said that the right sort of opal makes the man invisible who wears it in a ring.  Sorcery or not, the
      ring is quite beautiful, and I will send it to you by courier as soon as the spring mires become
      roads once more.
    - Signed by my hand,
    - Rzesk Kural
  - keywords: [withered, curled, curling]
    text:
    - I.  O.  U.
    - For Groceries ...........................3 cr. 1 f. 3 1/2 d.
    - (Signed) Tim, son of Tom the Lifeguard.
    - (Signed) Maxtrum Holloknob
  - keywords: [papyrus, scroll, fragment]
    text: >
      Some ancient scribe has written a list of legendary weapons, of which only this tiny scrap remains.
      The great warrior Highlander, it is said, bore a mighty claymore, the equal of which is unknown to
      me.  I have heard it glowed brightly when drawn, but I see no way this would be useful. The great
      smith Durgandon forged it in the dwarven halls; its enchantment is opposed to any evil and protects its
      wearer from harm, it is said.  I know not if this is true. The blade is known to me only in legend; if
      indeed it ever was, it is now lost forever.  No word of Highlander has been heard for long. Zebenak
      Rykalp of Wazen bears a sword made by the smith Dorig, of the Foehammer clan.  Its name is Krat, or
      "Razor" in the Vallonian tongue, named for its thinness, and its renowned edge.  It is supple steel,
      but quite sturdy, and I have seen Zeb plunge it deep into an oak without injuring the blade. Dorig is
      truly a great craftsman. There are dark rumors of a scimitar borne by the Goblin King that, if Shoot!
      There is no more.
  - keywords: [small, vellum]
    text:
    - >
      Like the rest it is a fragment: The age of Iron came next; it is our present age. In these days men
      dwindled both in stature and nobility still further from the Bronze Age, so say the philosophers.
      They began forging their tools and blades of iron, and no longer wrote the great epics of the last Age.
      Death still reigned, and reigns, over the world of men, cutting short their little works. How large
      they seemed! Yet all is not lost. So says the philosopher:
    - To the world that stumbles lost and lone,
    - A king descends from heaven's throne.
    - Death by death is overthrown. Here the page has been torn off.
  - keywords: [pages]
    text: >
      One is a small vellum page, another is large, with red letters.  A third is a fragment of papyrus
      scroll.  Still another, very withered, curls as it dries. Tucked into a corner a piece of blue paper
      has been chewed by mice.
  - keywords: [book, herblore]
    text: >
      It lies open, and you may read part of one page: Long was this wisdom lost to men, and long did it
      lie deep, deep buried beneath the goblin caves.  But the brave Nambor did fetch back a tattered
      scroll, bearing a few runes of ancient Dwarven, who only I, Bog Grundelgrin, could read.  Now mark well my
      words, O enchanter, for if you take the leaf of the mevais plant ground to a paste with water from
      the Well of Jakur, you may make an ointment, which heals all wounds. But it is hard to prepare.  The
      ground leaves must have been picked under the dying moon of late November, when the mevais is dry, and
      browned.  Then they must be You can read no more, nor can you reach the book.

"tba:287:room:28726":
  name: The Eastern End of the Great Hall
  description: >
    Here is the end of the Great Hall.  Its size awes you.  The King, however, is not here, and his
    throne is dusty.  With his people he has taken up arms and marched forth to fight the evil armies that
    have lately assailed his kingdom. Long live King Korbor!  An ancient throne of carved walnut stands
    here, bright with gold.  On the wall a shield is hung.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:287:room:28723
      look: The hall extends west, as far as you can see.
    down:
      to: tba:287:room:28749
      look: You see a tile floor.
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:287:obj:28710
        reset: locked
  extras:
  - keywords: [shield, wall]
    text: The shield bears a cross and a stag, the arms of King Korbor.
  - keywords: [throne]
    text: >
      You had thought the glint you saw was gilt paint, but it was not.  The throne of carved black
      walnut is very beautifully crafted, with rather plain carving, just enough to be handsome without looking
      overly fancy.  Gold plates and brackets look lovely against the dark wood.  You need not read the
      engraved plate on its side to know the work of Joel Kreb.

"tba:287:room:28727":
  name: The Sheriff Office
  description: >
    The Sheriff of Brocdenborough has moved his office here, in a shed Joel the carpenter built of
    scrap on hand, after the goblins forced him to leave Brocdenborough.  In fact, many of the former
    citizens of that village now live here, or in Venango.  The Sheriff has not retired his post; no, he moved
    here because from here he now commands a small band of guards who go out hunting goblins, intending to
    free the countryside eventually.  A tattered sign and a newly printed poster hang on the inside wall
    of this shed.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28710
      look: You can only leave to the north.
  extras:
  - keywords: [tattered, sign]
    text:
    - W A N T E D !
    - Dead or Alive
    - Thrash the Ogre
    - "&"
    - Pippin the Hobbit
    - for
    - Disturbing the Peace
    - Inciting a Riot
    - "&"
    - Killing Dwarves
    - in the Dwarven Village.

"tba:287:room:28728":
  name: The Crossbow Inn
  description: >
    This is the famed Crossbow, known all over Korbor's kingdom, where the food is fine and the
    beverages more or less legal.  Reilly Morgan is the innkeeper, and his specialty is imported Scotch
    whiskey.  He would gladly let you sample the booze.  Or perhaps you prefer beer?  His brew is second to none,
    better than the Grunting Boar's swill.  The mounted head of a 12 point buck hangs over the
    fireplace, and two upturned deer feet and hooves support some strange object.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28709
      look: You can leave the inn, if you really want to.
      door:
        keywords: [door, oak]
        kind: door
  extras:
  - keywords: [object, strange, hooves, rifle, gun]
    text: >
      A long metal tube set into a carved handle of curly maple, with an odd sort of lever hanging from
      it, rests on the hooves.  Perhaps it is a magical token of some sort.  Carved into it is the
      inscription "Winchester Model 1889".  Odd.
  - keywords: [buck, head, trophy]
    text: >
      It is a magnificent whitetail buck, the kind native only to Ofingia in this part of the world.  The
      whitetail is the craftiest animal in the woods; if you can stalk one and bring it down with a bow,
      as Fred Bear used to say, you can stalk anything.

"tba:287:room:28729":
  name: D. Shattershock's Fine Armor.
  description: >
    Dek, the retired Elven ranger, now sells armor suitable for his fellow woodsmen.  Nothing he has is
    very heavy, but you don't want heavy armor if you are sneaking around the woods, hunting goblins.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28721
      look: South of here is the market square.

"tba:287:room:28730":
  name: Churt's Mortar and Pestle
  description: >
    The air is fragrant with sharp smells and pale colored smoke in this tiny shop.  Tiny motes of
    sparkling dust, perhaps from some arcane spell, fill the air.  It seems this is some sort of apothecary
    shop, for they have many preparations magical and medicinal.  Some complexity of glassware bubbles on
    a charcoal brazier behind the counter, and many bottles of colorful liquids stand within reach.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:287:room:28721
      look: You can leave this mysterious store to the west.
  extras:
  - keywords: [bottles, liquid]
    text: >
      Unfortunately, some sort of magical barrier prevents you from sampling the liquid in these bottles.
  - keywords: [glassware, still]
    text: An alembic bubbles and boils on a charcoal brazier, filled with sharp- smelling liquid.

"tba:287:room:28731":
  name: Marya Luzarna's Bakery
  description: >
    The aroma of freshly baked wheat bread fills this store, mingled with the sharper smell of
    sourdough rye.  No bakers anywhere in Midgaard, Thalos, or Rome can equal Marya Luzarna, who comes from a
    long line of bakers.  Her great-great-great-grandfather Ogann baked the great Rye Loaf of Ofingia, which
    could be carried in a pocket, and yet fed an army of Ofintines for thirty days.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:287:room:28722
      look: You can inhale deeply and leave west.

"tba:287:room:28732":
  name: Rzesk and Zykub, Jewelers.
  description: >
    There doesn't seem to be anyone in this dusty store.  The window in one wall is cracked, and a few
    pages torn from a ledger blow about.  Dimly you can see the glint of gold and gems through the dirty
    glass of a few display cases, but you can't break the glass- it seems to be some sort of gnomish
    material that can't be shattered.  The sign has been painted over in a strange way.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28722
      look: You can leave this shop and go to Market Square.
  extras:
  - keywords: [sign]
    text: >
      "Rzesk & Zykub" has been crossed out with a single line, and below it has been painted "Closed for
      the Duration".

"tba:287:room:28733":
  name: The Dog-Leg
  description: >
    This is a very odd cave.  It only ran west about twelve yards, smack against a flat stone wall.  Of
    all things, there is a DOOR in the west wall - what is that doing in a water-carved cave?  It has a
    sign on it that might explain who would put a door here.  The floor is quite flat, and the sand which
    covers it everywhere else is absent here.  Maybe it deserves a second look.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28701
      look: You may go back east. What a boring place.
    west:
      look: The door is a single polished limestone slab, balanced on steel posts.
    down:
      to: tba:287:room:28734
      look: Maybe you better have a really close look at that stone floor.
      door:
        keywords: [floor]
        kind: door
        reset: closed
  extras:
  - keywords: [sign]
    text: "It is carved into the door.  The sign says: A gnotiyen na purxe Grob."
  - keywords: [stone, floor]
    text: >
      It is certainly not natural.  There is a peculiar square crack, and you suspect it opens up.  Only
      one way to find out!

"tba:287:room:28734":
  name: Down, Down, to Goblin-Town!
  description: >
    The floor opened!  But sliding down a steep tunnel you realize you have shut yourself in.  There is
    no escape now but deeper in, and farther down.  There is a faint smell of goblins about this place.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28735
      look: You see a stone hallway.

"tba:287:room:28735":
  name: The Stone Hallway
  description: >
    The walls are carved from limestone, and drip water, so this cave is always very damp, and very
    cold.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28734
      look: The walls are just as damp to the north.
    west:
      to: tba:287:room:28736
      look: The walls are just as damp to the west.

"tba:287:room:28736":
  name: The Stone Hallway
  description: >
    The walls are carved from limestone, and drip water.  You are beginning to fear for your health,
    and cold is not your greatest worry.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28735
      look: The walls are just as damp to the east.
    west:
      to: tba:287:room:28737
      look: There used to be a door there, but it is broken now.

"tba:287:room:28737":
  name: The Stone Hallway
  description: >
    You hear a peculiar scratching and tapping coming from a hole in the cave floor.  A strong,
    foul-smelling draft rises from it.  To the west is a door.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28736
      look: The walls are just as damp to the east.
    south:
      to: tba:287:room:28739
      look: The hallway bends to the south, as damp as ever.
    west:
      to: tba:287:room:28738
      look: The door to the west is covered with obscure but evil-looking runes.
      door:
        keywords: [door, runed]
        kind: door
        reset: closed
  extras:
  - keywords: [runes]
    text: You do not understand much but the name Orfax is repeated often.

"tba:287:room:28738":
  name: The Guard Room
  description: >
    This is a small cave hollowed out for the use of the goblin doorwards. Often arms are also stored
    here, in case of an invasion.  The guards are so bad, however, that Goblin town places little trust in
    this, their first line of defense.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:287:room:28737
      look: You can only go east.
      door:
        keywords: [door, runed]
        kind: door
        reset: closed

"tba:287:room:28739":
  name: The Stone Hallway
  description: >
    There is no escaping this cold, damp cave.  The Grunting Boar comes to mind, but you can not reach
    its warm fires now.  Only through worse danger will you leave these caves.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28737
      look: The walls are just as damp to the north.
    east:
      to: tba:287:room:28740
      look: A stone door to the east is carved with leering faces and evil runes.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked

"tba:287:room:28740":
  name: The Stone Hallway
  description: >
    The limestone walls in this room are cracked and seep icy water.  Your boots are soaking wet by the
    time you have walked twenty-five yards.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28741
      look: The walls are just as damp to the east.
    west:
      to: tba:287:room:28739
      look: There is a door of stone to the west.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked
  extras:
  - keywords: [water]
    text: It is very cold, too cold to safely drink.

"tba:287:room:28741":
  name: The Stone Hallway
  description: >
    There is as much seepage here as anywhere else but you wrap your cloak tight around you and go on. 
    No turning back now!  The floor is drier here; the seepage drips around a square panel on the floor.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:287:room:28742
      look: A glowing stone door is balanced on posts of steel and bolted shut.
      door:
        keywords: [door, glowing]
        kind: door
        key: tba:287:obj:28701
        reset: locked
    west:
      to: tba:287:room:28740
      look: You hear water dripping throughout the tunnels.
    down:
      to: tba:287:room:28743
      look: A hole has been cut in the floor and fitted with a stone slab.
      door:
        keywords: [slab, stone]
        kind: door
  extras:
  - keywords: [door, stone]
    text: >
      Its glow lights this tunnel up somewhat, but it brings no pleasant recollection of daylight.  It is
      a sickly pale-green light, as if the lamps in dwarven mansions were stolen and ruined by the
      goblins.  Even in Moria some of the dwarf lights burn still with their old light.  If dwarves lived here
      once, they are long gone.

"tba:287:room:28742":
  name: A Small Chamber
  description: >
    This may also be a guard chamber, but you are not sure.  Perhaps it is a storehouse of some sort,
    for you see no guards.  It is a large room.  The door-light does not reach far, and your torch casts
    long shadows.  Plenty of room for creepy things to hide.
  sector: field
  flags: [dark, indoors]
  exits:
    west:
      to: tba:287:room:28741
      look: There is a glowing door to the west.
      door:
        keywords: [door, glowing]
        kind: pickproof
        key: tba:287:obj:28701
        reset: locked

"tba:287:room:28743":
  name: The Spiral Tunnel
  description: >
    This tunnel spirals slowly clockwise, delving deeper into the bowels of the mountain.  You must be
    very far down now.
  sector: forest
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28741
      look: Icy water seeps round this stone slab, soaking your jacket.
      door:
        keywords: [slab, stone]
        kind: door
    down:
      to: tba:287:room:28744
      look: Down slopes the tunnel, ever deeper, to the goblin town.

"tba:287:room:28744":
  name: The Spiral Tunnel
  description: >
    The tunnel slopes gradually down, turning round and round in its path to the goblin city.  Whatever
    madness brought you here, it is too late to curse your foolishness, for goblins lie both before you
    and behind.
  sector: forest
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28743
      look: A stream of water flows from this direction.
    down:
      to: tba:287:room:28745
      look: The tunnel spirals ever farther into the rock.

"tba:287:room:28745":
  name: The Spiral Tunnel
  description: >
    The stream of water seems to be your last friend.  Its water is muddy but it still tastes good
    after walking so far.  The gloom of these caverns is beginning to darken your mind, and you long for the
    common room of the Grunting Boar Inn.
  sector: forest
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28744
      look: The endless tunnel spirals upward.
    down:
      to: tba:287:room:28746
      look: The endless spiral runs deeper still into the earth.

"tba:287:room:28746":
  name: The Spiral Tunnel
  description: >
    The stream of water seems to be your last friend.  Its water is muddy but it still tastes good
    after walking so far.  The cavern-gloom is beginning to darken your mind, and you long for the common
    room of the Grunting Boar Inn.  Here the tunnel jogs to the east.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28747
      look: The endless spiral runs east.
    up:
      to: tba:287:room:28745
      look: The endless spiral climbs higher.

"tba:287:room:28747":
  name: The Spiral Tunnel
  description: >
    There is no use counting how far this tunnel has spiralled down.  Goblins must be near, though; you
    can smell it.  Here the tunnel jogs down and west.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:287:room:28746
      look: The endless spiral runs west.
    down:
      to: tba:287:room:28748
      look: The tunnel plunges steeply down now.

"tba:287:room:28748":
  name: The Spiral Tunnel
  description: >
    It is no use counting any more how many times this tunnel has wound around. You do not want to
    know.  The stench of goblin-caves is very bad here, but bearable.
  sector: forest
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28747
      look: The endless spiral climbs higher.
    down:
      to: tba:287:room:28750
      look: The endless spiral plunges still deeper.

"tba:287:room:28749":
  name: The Treasury
  description: Hey!  You're not supposed to be in here!  Get out!
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28726
      look: You better leave now!
      door:
        keywords: [door]
        kind: pickproof
        key: tba:287:obj:28710
        reset: locked

"tba:287:room:28750":
  name: The Spiral Tunnel's End
  description: >
    Whether it was that waybread you ate, or plain grit, you have found the strength to keep going and
    now found an exit from the horrible spiral tunnel. It is hotter here than it was higher up, and the
    filthy stench of goblin caves wafts from a hole in the floor.
  sector: field
  flags: [dark, indoors]
  exits:
    up:
      to: tba:287:room:28748
      look: The endless spiral climbs upwards.
    down:
      to: tba:287:room:28751
      look: A hole leads down to a lower level.

"tba:287:room:28751":
  name: Upper Goblin-Town
  description: >
    You reach the first level of the goblin city.  Now you must fight for your life, adventurer!  Draw
    your weapon and stay on your guard!
  sector: field
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28753
      look: A hallway leads south.
    west:
      to: tba:287:room:28752
      look: An iron door stands to the west.  It has an inscription.
      door:
        keywords: [door, iron]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked
    up:
      to: tba:287:room:28750
      look: A ladder leads up through a hole in the ceiling.
  extras:
  - keywords: [inscription]
    text:
    - Let the fate of he whose arms rest here
    - Warn the fool who follows him to Goblin Town

"tba:287:room:28752":
  name: A Small Armory
  description: The Goblins keep a few weapons here, perhaps those they do not like to use.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28751
      look: An iron door leads east.
      door:
        keywords: [door, iron]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked

"tba:287:room:28753":
  name: A Dark Hall in Goblin-Town
  description: >
    This hall is deadly dangerous.  The goblins try to chase you into a corner, but you dart from
    shadow to shadow.  You must escape!
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28751
      look: The hallway leads north.
    east:
      to: tba:287:room:28754
      look: There is a black door to the east.
      door:
        keywords: [door, black]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked
    south:
      to: tba:287:room:28755
      look: The hallway runs south.

"tba:287:room:28754":
  name: A Small Storeroom
  description: >
    You are not sure what is stored in this room, but there are plenty of crude chests to open.  Many
    appear to be of dwarven make; plunder, no doubt.
  sector: city
  flags: [dark, indoors]
  exits:
    west:
      to: tba:287:room:28753
      look: A black door leads back west.
      door:
        keywords: [door, black]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked

"tba:287:room:28755":
  name: A Dark Hall in Goblin-Town.
  description: >
    This passage is a dead end!  No, wait-there are doors to east and south. But they are locked-wait,
    perhaps you can pick them, or do you carry the keys? If not, stand and fight!  Hope is not lost.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28753
      look: A hallway continues north.
    east:
      to: tba:287:room:28757
      look: An iron door leads east.
      door:
        keywords: [door, iron]
        kind: door
        key: tba:287:obj:28700
        reset: locked
    south:
      to: tba:287:room:28756
      look: A stone door leads south.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:287:obj:28703
        reset: locked

"tba:287:room:28756":
  name: A Small Room
  description: >
    This is another storeroom, of some sort.  This entire level is, like a ship's hold, devoted to
    storage.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28755
      look: The only exit is a stone door to the north.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:287:obj:28703
        reset: locked

"tba:287:room:28757":
  name: A Guard Room
  description: >
    Not now!  Not another guard room!  But this is where one should be; after all, there hasn't been
    any other on this floor.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28758
      look: There is a steel door to the east.
      door:
        keywords: [door, steel]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked
    west:
      to: tba:287:room:28755
      look: An iron door opens to the west.
      door:
        keywords: [door, iron]
        kind: door
        key: tba:287:obj:28700
        reset: locked

"tba:287:room:28758":
  name: A Landing
  description: >
    A stairwell plunges down to the next level here.  To the west, a steel door forbids your passage.
  sector: city
  flags: [dark, indoors]
  exits:
    west:
      to: tba:287:room:28757
      look: A steel door blocks this way.
      door:
        keywords: [door, steel]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked
    down:
      to: tba:287:room:28759
      look: A trap door opens down.
      door:
        keywords: [trapdoor]
        kind: door

"tba:287:room:28759":
  name: The Barracks
  description: >
    Goblins roam this level freely, and the stench is ...  Like a hundred thousand years' supply of
    rotten orc meat.  This hall is no longer dark; the walls glow with a pale light, a foul magical
    imitation of the dwarvish secret lamp-light that still floods parts of Moria.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28760
      look: A glowing hall leads south.
    up:
      to: tba:287:room:28758
      look: A trap door leads up.
      door:
        keywords: [trapdoor]
        kind: door

"tba:287:room:28760":
  name: A Pale-Glowing Hall in Goblin-Town
  description: Not a pleasant place for a Sunday stroll!  Wonder how far down you are?
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28759
      look: The hall leads north.
    south:
      to: tba:287:room:28775
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28703
        reset: locked
    west:
      to: tba:287:room:28761
      look: The hall glows to the west.

"tba:287:room:28761":
  name: A Pale-Glowing Hall in Goblin-Town
  description: >
    The bizarre magical glow these walls have is unnerving.  These tunnels are certainly the kind of
    dank, filthy holes goblins like best.  Bones and rotten meat litter the floor, and strange crawling
    beasts live on the gathered garbage.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28762
      look: A bronze door leads north.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed
    east:
      to: tba:287:room:28760
      look: The hall glows to the east.
    south:
      to: tba:287:room:28774
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28703
        reset: closed
    west:
      to: tba:287:room:28763
      look: The hall glows to the west.

"tba:287:room:28762":
  name: A Barracks Room
  description: >
    Bunks hewn from the stone walls, stacked five or six high, line the granite walls of this room. 
    You are far below limestone, now.  The goblins sleep here. Some sleep now.  What extraordinary dreams
    they must be having, the foul creatures!
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28761
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed

"tba:287:room:28763":
  name: A Pale-Glowing Hall in Goblin-Town
  description: >
    The walls flash here a little, where metal veins come to the surface.  This is very unnerving, and
    it does not help that you are dodging goblins left and right.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28764
      look: There is a bronze door to the north.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed
    east:
      to: tba:287:room:28761
      look: The hall continues east.
    south:
      to: tba:287:room:28773
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed
    west:
      to: tba:287:room:28765
      look: The hall glows to the west.

"tba:287:room:28764":
  name: A Barracks Room
  description: >
    The goblins sleep in here, packed in like sardines in a can.  The rooms smell worse than week-old
    sardines, littered as they are with old hides and accumulated filth.  You had better be leaving.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28763
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed

"tba:287:room:28765":
  name: A Pale-Glowing Hall in Goblin-Town
  description: >
    Uh oh...  This passage seems to go to a large, well guarded room.  A shadow standing there is
    bigger than any goblin you have ever seen.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28766
      look: A bronze door leads north.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed
    east:
      to: tba:287:room:28763
      look: The hall glows to the east.
    south:
      to: tba:287:room:28767
      look: There is a large room with LOTS of guards far to the south.

"tba:287:room:28766":
  name: A Barracks Room
  description: >
    The room might suit goblins, but you would never sleep here, unless pressed by dire need.  Even
    then, it would be miserable.  Here weapons and battered armor lie discarded, but you could use little of
    it.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28765
      look: There is a bronze door to the south.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed

"tba:287:room:28767":
  name: A Glowing Hallway in Goblin-Town
  description: >
    Hurry up!  That hulking shadow nearby to the south might not have seen you running through the
    halls, but you probably won't get through unnoticed.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28765
      look: The walls seem to crackle in horror, casting a flashing light.
    south:
      to: tba:287:room:28768
      look: This leads to a large stone-hewn hall, crammed with goblins and worse.

"tba:287:room:28768":
  name: The Mess
  description: >
    And it really IS a mess, too.  Bones of all sorts lie tramped into the sandy clay floor.  Often
    they still have quite a lot of meat left on them.  Goblins are quite apt to bite something and throw it
    away, though it comes from a king's board.  Grotesque green-skinned warriors of all sizes and degrees
    of hideousness mill about, chewing on meat, whose origins you do not wish to know.  The east smells
    like a knacker's yard, when he is boiling down corpses.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28767
      look: You hear loud shrieks and running feet to the north.
    east:
      to: tba:287:room:28769
      look: A foul stench and steam rolls from the east.
    south:
      to: tba:287:room:28770
      look: More goblins eat to the south.
  extras:
  - keywords: [bones, meat]
    text: >
      These bones all look somewhat decayed and smell very bad.  They don't whet your appetite, that is
      certain.  Besides, they may be poisoned after sitting around for so long.

"tba:287:room:28769":
  name: The Mess
  description: >
    Here you see the goblins' cook - and you might make a good dinner.  Rather not have to take off
    your armor, but his pot always needs another chunk of meat, however it tastes.  Around him are stacked
    jars of strange substances to add to his pot, probably not tasty spices.  Dry, boiled bones are piled
    in the corner.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28771
      look: Another passage leaves this cave to the southeast.
    west:
      to: tba:287:room:28768
      look: Goblins gobble and drool to the west.
  extras:
  - keywords: [bones, pile, corner]
    text: >
      They are of all different sizes.  Some are only Deer or Rabbit bones, but too many are from
      creatures that walk on two legs.

"tba:287:room:28770":
  name: The Mess
  description: >
    This corner is a crude caricature of a homely Inn, like the good old Grunting Boar.  Fellowship and
    the enjoyment of good beer are unknown among these foul creatures, so they swallow some
    terrible-smelling concoction of cave molds until it kills them.  There is no such thing as a happy drunk here. 
    You remember the dwarven village fondly now.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28768
      look: You can leave this place, but northwards leads only to more trouble.
    east:
      to: tba:287:room:28771
      look: A ways to the east is a doorway.

"tba:287:room:28771":
  name: The Mess
  description: >
    And what a mess it is!  Here the hall is less full of goblins and more littered with rubbish.  A
    guarded door leads east; it is made of stone, and elaborately carved.  Some orcish runes are cut into
    the stone.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28769
      look: A fireplace with a bubbling cauldron emits a foul smell.
    east:
      to: tba:287:room:28772
      look: A carved stone door leads east.
      door:
        keywords: [door, carved, stone]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked
    west:
      to: tba:287:room:28770
      look: A smell like sour wine and musty wood wafts from there.
  extras:
  - keywords: [orcish, runes]
    text: "They say: Krsd be da hammer wieldn dwarfs"
  - keywords: [carved, carvings, stone, door]
    text: >
      Goblins never make anything beautiful, but this door is very well made.  You suspect this cave once
      had better occupants.  The door is in excellent condition (though scrawled on) ...  Glowing

"tba:287:room:28772":
  name: A Small Room
  description: >
    The door you entered through is certainly of dwarven make.  You can easily push it open, so
    well-balanced was its weight on steel posts, when unlocked. Some spell on it probably saved it from ruin. 
    This particular room might have once been a treasury or armory of the dwarves (or gnomes), with a lock
    like that, but now a rough hole in its floor leads downward.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:287:room:28771
      look: A stone door leads west.
      door:
        keywords: [door, carved, stone]
        kind: pickproof
        key: tba:287:obj:28700
        reset: locked
    down:
      to: tba:287:room:28776
      look: Rough handholds are cut on this tunnels' sides.

"tba:287:room:28773":
  name: The Barracks Room
  description: >
    Rough bunks are let into the walls here, so about fifty goblins can sleep in this rather large
    room.  If it was better kept up, this place might actually be comfortable, suggesting that it was not
    made by the goblins, who would not have made it so big.  As it is, they have crammed in the bunks as
    closely as possible, and you see a few which, because their walls were too thin, have collapsed on the
    bunk below.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28763
      look: A bronze door stands to the north.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed

"tba:287:room:28774":
  name: The Barracks Room
  description: >
    All of these barracks rooms are similar, with bunks carved out of the walls, much like a catacombs'
    tombs are.  In the middle of all these barracks rooms' floors are deep pits in the stone, and a foul
    stench streaming upward from them suggests their purpose and use.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28761
      look: A bronze door stands to the north.
      door:
        keywords: [door, bronze]
        kind: door
        key: tba:287:obj:28700
        reset: closed
  extras:
  - keywords: [pits, pit, hole, holes]
    text: They appear to be latrines.

"tba:287:room:28775":
  name: The Chieftain's Quarters
  description: >
    This is obviously the chamber of a goblin chief, but you still wouldn't want to live here.  A
    pallet of vermin-ridden furs is piled on a stone slab that serves as a bed.  Not even a dwarf would like
    such a life!  The walls are scrawn all over with orc-runes and signs, and decorated with scalps and
    skulls.  You would not live long if the chief found you here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28760
      look: A bronze door leads north. It has some symbols on it.
      door:
        keywords: [door, bronze]
        kind: pickproof
        key: tba:287:obj:28702
        reset: locked
  extras:
  - keywords: [scalps, skulls]
    text: Many are human, but a few are elven.
  - keywords: [door, symbols]
    text: >
      It is damaged, but still shows the star and anvil of the Dwarven king Bog Grundelgrin.  So these
      were once his halls.
  - keywords: [signs]
    text: >
      All have a shield with a cross and stag on it, splotched with black, and hacked with some
      instrument.
  - keywords: [wall, walls, orc, runes]
    text: "What you can read says: Dy kng Korbor!  Todstol lede sune!"

"tba:287:room:28776":
  name: A Rough Tunnel
  description: >
    Here the walls are roughly hewn; this is surely goblin-work through and through.  Rubble litters
    the floor.  This cave is dark, so you must light your lantern again.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28777
      look: The tunnel continues north.
    up:
      to: tba:287:room:28772
      look: You can climb up a hole to a pale glowing tunnel.
  extras:
  - keywords: [rubble, floor]
    text: >
      The rubble strewn on the floor has sharply broken edges.  This passage, then, is probably newly
      made, and still being enlarged.

"tba:287:room:28777":
  name: A Rough Tunnel
  description: >
    Here the walls are roughly hewn; this is surely goblin-work through and through.  Rubble litters
    the floor.  This cave is dark, so you must walk by lantern-light if you have not the ability to see in
    darkness.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28778
      look: The tunnel continues north.
    south:
      to: tba:287:room:28776
      look: A faint glow comes from the south.

"tba:287:room:28778":
  name: A Rough Tunnel
  description: >
    Here the walls are roughly hewn, where the goblins mine for iron.  Rubble and ore litters the
    floor.  This cave is still unlit.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28779
      look: The tunnel continues north.
    south:
      to: tba:287:room:28777
      look: A very faint glow comes from the south.

"tba:287:room:28779":
  name: A Rough Tunnel
  description: >
    Your lamp casts odd shadows on the rough-hewn walls of this passage.  The tapping of goblin miners
    at work can be heard here and there.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28781
      look: You hear rushing water to the north and feel a faint draft.
    east:
      to: tba:287:room:28780
      look: Flickering firelight glows beneath a wooden door.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    south:
      to: tba:287:room:28778
      look: The mine tunnel continues south.

"tba:287:room:28780":
  name: The Iron Foundry
  description: >
    Goblins dearly love smoking, noisy machinery, especially if it gets a job done poorly and with
    greater labor than without the smoke.  The iron furnace which lights this room is one of their proudest
    feats.  A blower which leaks air and blows sparks everywhere replaces the bellows which work so well
    for dwarves, and it is run by several sturdy trolls turning a horse-mill.  Slag heaps lie all about
    this huge cave, and glowing pig iron in trenches threatens to burn the soles off your shoes.
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28782
      look: A steel door leads north.
      door:
        keywords: [door, steel]
        kind: door
        reset: closed
    west:
      to: tba:287:room:28779
      look: A wooden door leads west.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:287:room:28781":
  name: A Corner In the Mines
  description: >
    It is very slow going here as you inch your way around a hole in the floor. If you wanted to, you
    could more easily dive in; your lantern glints off the surface of a lake not far below.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28782
      look: The tunnel continues east.
    south:
      to: tba:287:room:28779
      look: The tunnel runs south.
    down:
      to: tba:287:room:28785
      look: A ragged hole leads down to an underground lake.
  extras:
  - keywords: [hole]
    text: >
      This water is flowing towards some exit; perhaps it leads out of this mountain?  But once you dive
      down, you won't get back up here without wings.

"tba:287:room:28782":
  name: A Rough Tunnel
  description: >
    The walls become slightly smoother here long enough for someone to scratch a few words in the
    common speech into the stone.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28783
      look: The tunnel continues east.
    south:
      to: tba:287:room:28780
      look: A steel door leads south, where you hear a roaring noise.
      door:
        keywords: [door, steel]
        kind: door
        reset: closed
    west:
      to: tba:287:room:28781
      look: You hear rushing water to the west and feel a faint draft.
  extras:
  - keywords: [words, common, stone, wall]
    text: >
      They say: Ware traveller!  You think you have left the goblins but the worst lies still below! 
      Heed my warning!  A river runs from this mountain, its current fast and strong, but it is safer than
      these rat-holes!  Gloin

"tba:287:room:28783":
  name: A Corner in the Mines
  description: >
    Here a vein of iron ore is being dug from the mountain, and the tunnel is quite wide but still
    unlit.  Rubble is strewn everywhere and an acrid, sulfurous smoke hangs in the air.  No doubt the goblins
    have some strange magic to break the stony ore from the walls.  The walls are pockmarked with
    shallow holes, and the rubble is similarly marked.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28784
      look: A faint glimmer of light comes from the north.
    west:
      to: tba:287:room:28782
      look: The tunnel walls are somewhat smoother to the west.
  extras:
  - keywords: [walls, rubble, holes]
    text: There is an odd sulfurous-smelling residue in these holes.

"tba:287:room:28784":
  name: The Mine Shaft
  description: Here the mine passage ends.  A pale glow shines around a trapdoor in the floor.
  sector: field
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28783
      look: A rubble-strewn tunnel bends round a corner.
    down:
      to: tba:287:room:28794
      look: A trap door leads down. You feel very uneasy about opening it.
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:287:obj:28703
        reset: closed
  extras:
  - keywords: [trap, door, floor]
    text: >
      The trapdoor has some dwarf-runes scribbled on its edge.  They say: I, Gloin, warn you not to go
      this way unless you are a brave warrior, whose heart never fails him!

"tba:287:room:28785":
  name: On the Underground Lake
  description: >
    This small cave is lit very faintly by a glow from above, which is good because diving into the
    lake put out your light.  It is not very large; roughly a round inverted bowl, fifty feet across, and
    about 15 feet high.  To the north a small stream flows out through a tunnel.  Of all the numerous
    influences that feed this lake, none are large enough, or low enough, for you to leave through.
  sector: water_swim
  flags: [no_mob, indoors, no_track, no_magic]
  exits:
    north:
      to: tba:287:room:28786
      look: The stream flows fast, but not too much to swim in.

"tba:287:room:28786":
  name: On the Underground Stream
  description: >
    The stream flows south to east, where the roof seems to be much higher.  It is darker here, but
    since the current pushes you east, you don't much need to see.
  sector: water_swim
  flags: [dark, indoors, no_track, no_magic]
  exits:
    east:
      to: tba:287:room:28787
      look: The stream slows slightly to the east.

"tba:287:room:28787":
  name: The Stream at the Underground Cliff
  description: >
    Here the stream passes south of a gravelly ledge, and flows on east.  The cave is much narrower
    there, and the current roars as it rushes over some rocks. You had better leave the stream while you
    can.  As the walls narrow, the stream rushes faster and faster, and you hear a great thrashing noise
    like a mill wheel close by to the east.
  sector: water_swim
  flags: [dark, indoors, no_track, no_magic]
  exits:
    north:
      to: tba:287:room:28789
      look: Looks like gravel.
    east:
      to: tba:287:room:28788
      look: The roaring noise to the east sounds like rapids or worse, better stop.

"tba:287:room:28788":
  name: The Waterfall
  description: >
    For a few minutes you think you have discovered a new extreme sport; whitewater drowning.  There is
    no way to turn back now; the current is just too strong.  Then you see the ground drop away up
    ahead, and will soon discover how it feels to go over Niagara Falls without even a barrel.
  sector: water_swim
  flags: [indoors, no_track, no_magic]

"tba:287:room:28789":
  name: The Ledge
  description: >
    You may enter the creek to the south, or look for a way up the cliffs that flank this small
    stream.  A crevasse nearby looks like it could be chimneyed with a lot of effort.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28787
      look: The stream flows quickly east.
    up:
      to: tba:287:room:28790
      look: It won't be easy, but you think you can do it.

"tba:287:room:28790":
  name: The Crevasse
  description: >
    It is rough climbing, and you won't try to go down this way, but you have made good progress.
  sector: mountains
  flags: [dark, indoors, no_track, no_magic]
  exits:
    up:
      to: tba:287:room:28791
      look: You can keep climbing up.
    down:
      look: You really, really don't want to look down.

"tba:287:room:28791":
  name: The Crevasse
  description: >
    Tiring, you climb more slowly, but still go upwards at a good pace.  You are nearly half way up.
  sector: mountains
  flags: [dark, indoors, no_track, no_magic]
  exits:
    up:
      to: tba:287:room:28792
      look: You can keep climbing up, but you certainly won't do this again!
    down:
      look: You really, really don't want to look down.

"tba:287:room:28792":
  name: The Crevasse
  description: Tiring, you climb more slowly, but still go upwards at a good pace.
  sector: mountains
  flags: [dark, indoors, no_track, no_magic]
  exits:
    up:
