    down:
      look: You really, really don't want to look down.

"tba:287:room:28793":
  name: Up the Cliff We Go
  description: >
    Every move is sheer torture as you haul yourself up this rough crevasse in the cliff-face, but you
    are nearly to the top!
  sector: mountains
  flags: [dark, indoors, no_track, no_magic]
  exits:
    up:
      to: tba:287:room:28703
      look: You can keep climbing up, but you will NEVER do this again!
    down:
      look: You really, really don't want to look down.

"tba:287:room:28794":
  name: A Crossing of Tunnels
  description: >
    Four passages lead north, south, east, and west of here, but all are blocked by doors; a wooden
    door to north, a brass door to the east, an iron door to the south, and a western door of adamant.  You
    can also escape the way you came here.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28795
      look: The wooden door seems like the safest bet; probably nothing is there.
      door:
        keywords: [door, wooden]
        kind: door
        key: tba:287:obj:28700
        reset: locked
    east:
      to: tba:287:room:28796
      look: The brass door might hide something interesting.
      door:
        keywords: [door, brass]
        kind: pickproof
        key: tba:287:obj:28702
        reset: locked
    south:
      to: tba:287:room:28797
      look: The iron door looks very sturdy, and you had better leave it alone.
      door:
        keywords: [door, iron]
        kind: pickproof
        key: tba:287:obj:28703
        reset: locked
    west:
      to: tba:287:room:28798
      look: The adamant door looks almost unbreakable.
      door:
        keywords: [door, adamant]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked
    up:
      to: tba:287:room:28784
      look: A trap door leads up.
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:287:obj:28703
        reset: closed

"tba:287:room:28795":
  name: The Storeroom
  description: >
    This place is not very interesting; however, the wooden crates that are stacked about in this dusty
    cave do arouse your curiosity.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28794
      look: A wooden door leads south.
      door:
        keywords: [door, wooden]
        kind: door
        key: tba:287:obj:28700
        reset: locked

"tba:287:room:28796":
  name: The Guard Chamber
  description: >
    Behind that brazen door, the goblin's deadliest warriors wait until the Great Goblin sends them to
    ravage Lonoya.  Can you slay these foul creatures, or will you flee?
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:287:room:28794
      look: A crossing of passages lies west of here.
      door:
        keywords: [brass, door]
        kind: pickproof
        key: tba:287:obj:28702
        reset: locked

"tba:287:room:28797":
  name: The North End of a Hall
  description: >
    You have entered the halls of the Great Goblin.  South of here he sits on his great throne of
    carved bone.  The ceiling's barrel vault is cleverly made lopsided, but only enough to be disturbing
    without making itself obvious.  Bas reliefs adorn the walls which would be lovely, but for slightly
    distorted details.  You shudder involuntarily.  This place is evil.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28794
      look: It might be wise to leave, NOW, through that iron door.
      door:
        keywords: [door, iron]
        kind: pickproof
        key: tba:287:obj:28703
        reset: locked
    south:
      to: tba:287:room:28799
      look: Do you feel very brave?

"tba:287:room:28798":
  name: The Goblin Treasury
  description: >
    Well!  I don't know how you got the key, but you have broken into this vault at last.  Now you may
    plunder the gold, gems, and wonderful weapons which the goblins have stolen over these many years.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:287:room:28794
      look: Have you gathered it all? Then leave through the door of adamant.
      door:
        keywords: [door, adamant]
        kind: pickproof
        key: tba:287:obj:28705
        reset: locked

"tba:287:room:28799":
  name: The Throne Room
  description: >
    Here stands the Great Goblin's ugly throne of bones grotesquely carved.  He sits here among his
    bodyguards, ready to pound your skull in for entering his miserable halls!
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28797
      look: Run away north while you still can!
  extras:
  - keywords: [throne, bones, bone]
    text: >
      It is made, seemingly, of the bones of the many enemies that the Great Goblin killed.  All over it
      evil signs are carved; it glows with a pale, sickly light.
