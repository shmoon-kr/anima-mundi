# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 287.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:287:room:28700":
  name: A Narrow Crawlway
  description: >
    Ouch!  You can barely squeeze through this passage, which is only a foot and a half high.  It was
    also hidden behind a stone block; that is, no doubt, the reason the goblins have not tried to follow
    you, being too weak to move it. You, however, can still shove it aside, should you wish to slither
    north.  The wide passage to the south looks much, much more inviting, however.
  sector: mountains
  flags: [dark, indoors, peaceful, tunnel]
  exits:
    north:
      look: The crawlway opens into a large cave, crudely hewn from the stone.
      door:
        keywords: [breakdown, block]
        kind: door
        reset: closed
    south:
      to: tba:287:room:28701
      look: The crawlway is not really that long; it opens out to the south.
  extras:
  - keywords: [credits, info]
    text:
    - "* * * * The Land of Lonoya * * * *"
    - ----------------------------------
    - Made A. D. 1997 by Pippin
    - This zone contains a small town and a
    - rather large dungeon full of goblins.

"tba:287:room:28701":
  name: A Tunnel in the Mountains
  description: >
    It is very easy to walk here.  A forgotten river has carpeted this cave soft, sandy clay, and
    streaked the walls with frozen ripples.  The north wall has a small crack in it, and to the south this
    wide tunnel becomes higher, and slightly narrower.  A shadow on the west wall implies a tunnel mouth,
    leading out of your lantern's reach.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28700
      look: You look at the north wall.  Maybe you could fit through there.
    south:
      to: tba:287:room:28702
      look: It looks like a pleasant, though dark, walk to the south.
    west:
      to: tba:287:room:28733
      look: A small dog-leg branches off the cavern here.

"tba:287:room:28702":
  name: A Tunnel in the Mountains
  description: >
    What a lovely place!  It is not wide here - your shoulders fit, with little room for company.  You
    judge the cavern roof to be at least 70 feet above your head.  Crystal formations in the rippled
    walls split torchlight into countless sparks of flame, reflected from the quartz veins which embroider
    the stone in a timeless brocade.  The walls are mainly vertical, but taper outwards enough to support a
    block of breakdown, hanging like Damocles' sword, fifteen feet up.  I doubt it will fall, however. 
    The tunnel is lower but wider to the north.  A small stream trickles from a tiny hole, high up on the
    wall, to exit through a small tunnel to the south.  To the east, a larger cave continues to a bend.
    That boulder troubles you.  Anxiously you examine its support, and notice some writing on the wall. 
    There is a NEWLY CARVED SIGN here.  Read it!
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:287:room:28701
      look: The tunnel widens and lowers to the north, seemingly to a dead end.
    east:
      to: tba:287:room:28705
      look: Your light shows a bend, close by to the east.
    south:
      to: tba:287:room:28703
      look: The small stream trickles south.
  extras:
  - keywords: [new, sign]
    text:
    - Notice!
    - The eastern tunnel
    - Has been repaired.
    - It is now safe ;so
    - Thrash and Pippin
    - Won't die here again.
  - keywords: [writing, wall]
    text: >
      The runes are of a well-known mode, but you know not the tongue.  They say something like this: Tuo
      sdael lennut nretsae.  Retsasid ot sdael lennut htuos. Ekat ot eno eht si nretsae eht Htaed ylrae na
      diova ot tnaw uoy fi.  Nam Mooreeffoc Eht Morf.  What could it mean?

"tba:287:room:28703":
  name: A Narrow Ledge
  description: >
    The stream plunges downward, to join another, which foams and rages far below you in a deeply cleft
    canyon.  You hear nothing above the water's roar.  Like a cat you tread on a spray-wet ledge only
    six inches wide.  Not a nice place. You do not look down as you continue.  A traveler must count
    courage among his baggage, no?  Perhaps you will be repaid.  Through the mists to the south you glimpse a
    golden gleam.  To go there you must creep cautiously along a ledge too narrow for a surefooted cat,
    and slippery as fish skin.  It is not too late to turn back!  A narrow crevasse leads down the cliff,
    but only an acrobat could turn round and descend it.  Your nose brushes an inscription.
  sector: mountains
  flags: [dark, indoors, no_magic, tunnel]
  exits:
    north:
      to: tba:287:room:28702
      look: The wise (if poor) man may return north to a larger cave.
    south:
      to: tba:287:room:28704
      look: Your grandmother told you once of a lost gold mine in these mountains.
  extras:
  - keywords: [inscription]
    text: >
      It is in every known language, and some others: W A R N I N G ! ! ! The Ledge to the South is
      Unsafe!!

"tba:287:room:28704":
  name: The Fall is Fine but the Landing Hurts
  description: >
    You have found the lost mine!  Chunks of gold ore litter the ground, as large as your head!  Among
    them lie rough, long-ago mined rubies.  In haste to enter the mine, and gather the riches therein,
    you step from the tiny ledge to the broad flat table of stone near the mine entrance.  That is, you try
    to step that way...  Your feet slip.  Oh dear.
  sector: inside
  flags: [dark, indoors]

"tba:287:room:28705":
  name: A Short Tunnel
  description: >
    This tunnel does not go very far.  Soon it bends again to the south.  A strong draft blows from
    there.  The walls here are no longer rippled, but smooth, and covered with writing.  There are many
    small inscriptions, but you can only read three: one in orcish, another in common, and a third, written
    large by a firm hand, in the secret dwarven tongue.  Looking closer, you see another, in ogrish.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:287:room:28706
      look: You see a glimmer of daylight, not very far away.
    west:
      to: tba:287:room:28702
      look: You can go west, to examine that odd inscription.  Or that small cave.
  extras:
  - keywords: [ogrish]
    text: >
      Ugh...  Anyone...  Anyone pass this way...  Thrash need help...  Can anyone read this need to
      know....  Where Thrash buy torches...  ...  Ugh...  Thrash the Ogre
  - keywords: [dwarvish, secret]
    text: >
      Hmm...  It's common after all, though it uses the dwarf runes.  Good for you, if you are not a
      dwarf who knows the secret tongue.  It says: Went east from the cave to Sorvecgden town.  Passed this way
      Monday, fourth of Yule month.  Tell Gloin his wife is cheating on him.  I know because she cheats
      with me.  Dorig of the Foehammers.
  - keywords: [common]
    text: "This is easily read: O traveler!  Beware!  For goblins live near here!"
  - keywords: [orcish, inscription]
    text: >
      It says, more or less: Krsd be al tem blude noms Krsd be al tem blude dwrvs Krsd be al tem blude
      elfs Krsd be da hobits but tey tasty Haf ogrs aint bad fokes Rit by Orfax da orc

"tba:287:room:28706":
  name: The Tunnel's Entrance
  description: >
    O traveler from Midgard, your journey has not ended, but begun!  You are just inside a cave
    entrance.  It stretches far into mountain-darkness.  Just to your east, an underground stream leaves a lower
    cave.  If the the same water flows inside the cave, it must have passed under your feet at a lower
    level, for it is in a gorge seventy or more feet deep.  To your south you see the smooth line of a
    road cutting the woods.  A sign is carved into the stone here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28705
      look: You may go further into the dark cave.
    south:
      to: tba:287:room:28707
      look: The road looks like a good place to take a pleasant walk.
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
                                ___________________________
                                |This Cave in the Mountain|
                                |         -------         |
                                |  Was Delved by Pippin   |
                                |  Year of Our Lord 1997  |
                                |_________________________|

"tba:287:room:28707":
  name: The Old Plank Road
  description: >
    Your feet resound on the planks of this road, built for safe travel in times long past by Korbor
    the Fat, King of Lonoya.  The plank-paved road winds east and south.  A milestone stands near.  A sign
    stands at the intersection of this fine road, and the path to the mountain cave.  The dirt road to
    the south used to be blocked but now the way has been cleared.
  sector: city
  flags: [no_track]
  exits:
    north:
      to: tba:287:room:28706
      look: A grass-grown path leads to a cave in the north.
    east:
      to: tba:287:room:28708
      look: The road continues east to a city.
  extras:
  - keywords: [sign]
    text:
    - It has boards with fingers pointing north, south, and west.
    - EAST - Ofingia
    - SOUTH - Sorvecgden-Lacgorr
    - NORTH - Midgaard
    - Welcome, Stranger, to the Fiefdom of Lonoya.
    - You of good will may wander freely through
    - our kingdom.  Report all strange happenings
    - to Pippin, Emperor of the Lands of Eighty One.
  - keywords: [milestone, mile, stone]
    text: It says "Sorvecgden-Lacgorr 6 stadia"

"tba:287:room:28708":
  name: The Old Plank Road
  description: >
    A stone bridge crosses Snofur Creek here, which flows in a ravine about eighty feet deep, if only
    twenty-five yards wide, as it flows from a small cave in the mountains.  You would need wings to go
    down there.  This gorge certainly serves Ofingia well as a moat; the bridge has a wooden section that
    may easily be removed during a siege.
  sector: city
  flags: [no_track]
  exits:
    east:
      to: tba:287:room:28709
      look: Ofingia's gate is right across the river.
      door:
        keywords: [gate, wooden]
        kind: door
        key: tba:287:obj:28707
        reset: closed
    west:
      to: tba:287:room:28707
      look: You can still go back west.

"tba:287:room:28709":
  name: King's Way
  description: >
    If it annoyed you to journey so far to see such a tiny town as Ofingia, you are somewhat placated
    by the sight of a homely inn to your south.  It is not as large as the Grunting Boar, but as a sailor
    will take any port in a storm, you will drink anywhere after abstaining so long!  Though Ofingia is a
    city under siege nowadays, with all the goblin raids, still Reilly keeps the inn open.
  sector: inside
  exits:
    east:
      to: tba:287:room:28710
      look: The King's Way continues east.
    south:
      to: tba:287:room:28728
      look: A fine, homely inn lies south.  A sign stands there.
      door:
        keywords: [door, oak]
        kind: door
    west:
      to: tba:287:room:28708
      look: A great gate lies some yards west.  It is richly carved.
      door:
        keywords: [gate, wooden]
        kind: door
        key: tba:287:obj:28707
        reset: closed
  extras:
  - keywords: [sign]
    text:
    - The Crossbow Inn
    - By Reilly Morgan

"tba:287:room:28710":
  name: A Small Square
  description: >
    Once this small park was a restful place to spend a Sunday afternoon; now that almost all Ofintines
    have either left or taken up arms to defend their town, the only folk seen here are off-duty guards
    and those who come to draw water.  A shed stands to the south, and a tiny church to the north.
  sector: inside
  exits:
    north:
      to: tba:287:room:28718
      look: The church has a large sign hanging on its front wall.
      door:
        keywords: [churchdoor]
        kind: door
    east:
      to: tba:287:room:28711
      look: King's Way runs a little farther east.
    south:
      to: tba:287:room:28727
      look: There is a torn sign on the shed which says "Z. Rykalp, Sheriff"
    west:
      to: tba:287:room:28709
      look: What? Leaving town already?
  extras:
  - keywords: [church, sign]
    text: >
      It says: St.  John Nepomucene Church Today's Sermon: Ogres and the Gospel: Can they be saved?

"tba:287:room:28711":
  name: King's Way
  description: >
    Small stores lie north and south of you as you walk toward the market square of Ofingia.  The
    northern building is an open shed, where a blacksmith is busily pounding iron.  To the south, a
    carpenter's shop fills the air with the fragrance of wood smoke - and a lot of it; he's burning shavings.
  sector: inside
  exits:
    north:
      to: tba:287:room:28719
      look: You hear a hammer thumping on hot iron, and ringing on the anvil.
    east:
      to: tba:287:room:28712
      look: You hear the patter of hurrying feet, and knights' heavy tread.
    south:
      to: tba:287:room:28714
      look: A burly dwarf leaves that way, carrying a log on one shoulder.
    west:
      to: tba:287:room:28710
      look: What's the matter? Don't you like this town?

"tba:287:room:28712":
  name: The Market Square
  description: >
    The clink of mail and the tramp of marching feet fill the air of this once-peaceful square, as the
    citizens patrol their town, watching out for enemies.  A general store stands to the north.
  sector: inside
  exits:
    north:
      to: tba:287:room:28720
      look: You hear someone cursing shoplifters.
    east:
      to: tba:287:room:28721
      look: This market square is at least four times as large as Midgaard's.
    south:
      to: tba:287:room:28713
      look: This market square is at least four times as large as Midgaard's.
    west:
      to: tba:287:room:28711
      look: You really do hate Ofingia, don't you?

"tba:287:room:28713":
  name: Southwestern Market Square
  description: >
    You see the carpenter's yard behind several houses to the west, but a board fence prevents you from
    walking to it.  Someone has scrawled on the fence with chalk.  To the south a road runs through
    Ofingia.
  sector: inside
  exits:
    north:
      to: tba:287:room:28712
      look: The clamor of a market square echoes all around you.
    east:
      to: tba:287:room:28722
      look: Still a market square here.
    south:
      to: tba:287:room:28715
      look: This seems to be a better part of town.
    west:
      to: tba:287:room:28714
      look: You hear the thunk of an axe.
  extras:
  - keywords: [fence, chalk]
    text: It says, "Keep an eye peeled!  The goblins are crafty.  "

"tba:287:room:28714":
  name: Joel Kreb's Fine Woodbutchery
  description: >
    Joel is a very busy man.  He tells you so.  Only now he is sitting on a sawhorse with a mug of
    ale.  Well, all that sawdust makes a man thirsty, don't you know!  He can make just about anything you
    want, if it is wooden, but just now has only a few items in stock.  He might list them for you, if you
    asked really nicely.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28711
      look: A small street is north of here.
    east:
      to: tba:287:room:28713
      look: You can see a wide street past Joel's saw pit.

"tba:287:room:28715":
  name: Drovers' Street
  description: >
    Once farmers drove their herds of cattle through this now-fancy part of Ofingia, on the way to the
    Market Square.  No more.  It has been paved, and far fewer hogs roam here than on King's Way.
  sector: inside
  exits:
    north:
      to: tba:287:room:28713
      look: North leads you to the market square.
    east:
      to: tba:287:room:28723
      look: Eastwards is the Great Hall of Ofingia
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:287:room:28716
      look: Drovers' Street runs south.

"tba:287:room:28716":
  name: Inside the South Gate of Ofingia
  description: >
    Well, now you have reached the end of Ofingia's small noble district.  To your south is a great
    gate, and to your east, a strongly built stone house.
  sector: inside
  exits:
    north:
      to: tba:287:room:28715
      look: Why don't you go to City Hall and answer your 200 counts of burglary?
    east:
      to: tba:287:room:28717
      look: This appears to be a barracks of the town guards
      door:
        keywords: [door, strong, oak]
        kind: pickproof
        key: tba:287:obj:28709
        reset: locked

"tba:287:room:28717":
  name: The Guard Headquarters
  description: >
    This is where the men that guard Ofingia keep their dinner pails.  Look around!  You may find a
    dagger, but most of the weapons are in use.  Why would they leave them here while they were on patrol? 
    And as for finding money, don't bother!  Only in Midgaard do foolish guards keep 32000 gold coins
    where Pippin or any old thief can steal them.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:287:room:28723
      look: A red door leads north to the city hall.
      door:
        keywords: [door, red]
        kind: pickproof
        key: tba:287:obj:28709
        reset: locked
    west:
      to: tba:287:room:28716
      look: A strong oak door leads west to the street outside.
      door:
        keywords: [door, strong, oak]
        kind: pickproof
        key: tba:287:obj:28709
        reset: locked

"tba:287:room:28718":
  name: The Church of St. John Nepomucene.
  description: >
    It is small, but adequate, and defensible.  This last is the most important in these dangerous
    times.  You find no idols here, the Ofintines are a Christian nation.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:287:room:28710
      look: You can leave and go to the town square.
      door:
        keywords: [churchdoor]
        kind: door

"tba:287:room:28719":
  name: Dorig Foehammer's Smithy
  description: >
    You can only watch with awe as Dorig, the famed dwarven warrior-smith. Forges a bar of iron into a
    knife blade in fifteen minutes.  He makes some fine swords and chain mail, but good armor doesn't
    come cheap!  A battle axe hangs on the wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28711
      look: You can leave and avoid the sparks of molten iron that fly thick here.
  extras:
  - keywords: [axe, wall]
    text: The wall-hung axe is too high to reach, but you can see it is named "Lucille".

"tba:287:room:28720":
  name: Maxtrum Holloknob's Dry Goods
  description: >
    Max will buy anything low and sell it high, useful or not.  Most of it is useless to you, anyway. 
    Why would you want nails, or pots and pans, or tulip bulbs?  Horseshoes don't seem like a good thing
    to carry on a long journey, either.  Max also carries a few staple items for you fool adventurers,
    too, which he would gladly list.  A strange sign with darts stuck in it is hung on the wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:287:room:28712
      look: You can go find a cheaper store somewhere else in Market Square.
  extras:
  - keywords: [sign, wall, symbol]
    text: >
      There are also some crossbow quarrels driven into this picture of a leprechaun, who is grinning and
      holding a bag of gold.  It is not a great work of art; perhaps the shopkeeper has a grudge against
      leprechauns.

"tba:287:room:28721":
  name: Northeastern Market Square
  description: >
    Here is a quiet corner of the bustling square.  A wooden store to the north is busy enough, but
    nobody ever goes into the store to the east as you watch its door.  Maybe it is closed.
  sector: inside
  exits:
    north:
      to: tba:287:room:28729
      look: The smell of tanned leather comes from the north.
    east:
      to: tba:287:room:28730
      look: Tucked between two large houses is a tiny black granite building.
    south:
      to: tba:287:room:28722
      look: There is more of the square to the south.
    west:
      to: tba:287:room:28712
      look: There is more of the square to the west.

"tba:287:room:28722":
  name: Southeastern Market Square
  description: >
    The fragrance of fresh bread fills the air here.  Ofintine bread is considered the best in the
    world by those who know what REAL bread tastes like.
  sector: inside
  exits:
    north:
      to: tba:287:room:28721
      look: There is more of the square to the north.
    east:
      to: tba:287:room:28731
      look: A delicious smell of fresh bread comes from the east.
    south:
      to: tba:287:room:28732
      look: You have no idea what kind of store this is; it has no windows.
    west:
      to: tba:287:room:28713
      look: There is more of the square to the west.

"tba:287:room:28723":
  name: The Great Hall
  description: >
    Two rows of tall wooden pillars marching down this hall support its roof on their sturdy heads.  A
    central fireplace warms it, and the smoke rises to a louvre in the highest part of the tall gable. 
    This ancient hall reminds you of those described in the old tales of Midgaard, but here is one still
    standing, and used for its old purpose, for you see a great throne glittering in gold to the north. 
    Oh yes; a spiral iron stair leads down.  An inscription is carved into the wooden wall above it. 
    There is a door, and a sign, to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:287:room:28726
      look: You see more of the hall.
    south:
      to: tba:287:room:28717
      look: A red door has a sign posted on it.
      door:
        keywords: [door, red]
        kind: pickproof
        key: tba:287:obj:28709
        reset: locked
    west:
      to: tba:287:room:28715
      look: You can leave the hall to the west.
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:287:room:28724
      look: A stairway leads down.
  extras:
  - keywords: [sign]
    text: Guard Headquarters of Ofingia
  - keywords: [inscription]
    text:
    - Down:Ofingian Public Library
    - And Book Store.
    - Open 8 to 11 A.M.
    - And 5 to 9 P.M.

"tba:287:room:28724":
  name: The Ofintine Public Library
  description: >
    Here you may borrow, or buy, much of the great literature of Ofingia, which sadly does not fill
    very many of the shelves here.  Once this library had many more works, but the goblins have raided this
    town several times in the last few years and burned or stolen most of those that were reported to be
    magical.  One of the walls has a huge oil portrait hanging where there are no shelves. Looking about
    you, you are amazed at the number of books still left, but most are poorly written works of popular
    fiction.  Alas!  There are some exceptions; a map hangs on the wall, for instance.
  sector: inside
  flags: [indoors]
  exits:
    north:
      look: The wall is lined with bookshelves.
    east:
      look: The wall is lined with bookshelves.
    south:
      to: tba:287:room:28725
      look: The wall is lined with bookshelves.
      door:
        keywords: [bookshelves]
        kind: pickproof
        key: tba:287:obj:28708
    west:
      look: The wall is lined with bookshelves.
    up:
      to: tba:287:room:28723
      look: A spiral iron staircase leads up.
  extras:
