"tba:261:room:26110":
  name: Sitting Room
  description: >
    This large room looks to be the main room for entertaining guests.  Tables are scattered throughout
    the room, people seated here and there, enjoying the day, chatting away about everything and nothing.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26111
    east:
      to: tba:261:room:26100
    west:
      to: tba:261:room:26114

"tba:261:room:26111":
  name: Kitchen
  description: >
    You have entered into a very well-equipped kitchen, one which seems so well stocked a whole town
    could eat here for a month and never have to get any more food.  It seems strange that only one cook
    would be on staff for such a large facility.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26112
    south:
      to: tba:261:room:26110
    west:
      to: tba:261:room:26113
  extras:
  - keywords: [closet]
    text: Nice clothes, but not your size at all.
  - keywords: [desk]
    text: The desk is basically uninteresting, as are the papers on top of it...

"tba:261:room:26112":
  name: Pantry
  description: >
    This small space is cramped enough without this huge woman stuffing her face full of anything
    edible she can get her hands on.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:261:room:26111
  extras:
  - keywords: [book, books]
    text: There are lots of books about everything here!

"tba:261:room:26113":
  name: Dining Room
  description: >
    A table laden with food lies in the center of this room, inviting any and all to partake of this
    great bounty.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:261:room:26111
    south:
      to: tba:261:room:26114

"tba:261:room:26114":
  name: Portrait Studio
  description: >
    This room is filled with portaits of every size and shape imaginable. Hanging from every angle,
    every height, you can't help but stop and peruse all of this fine art.  A staircase leads up from here
    to another level.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26113
    east:
      to: tba:261:room:26110
    up:
      to: tba:261:room:26115

"tba:261:room:26115":
  name: A Stairwell
  description: >
    This stairwell continues up or down, you see no end or landing in your immediate line of sight.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:261:room:26116
    down:
      to: tba:261:room:26120

"tba:261:room:26116":
  name: Stairwell
  description: >
    This stairwell still continues up and down as far as your line of sight allows.  Strange, this
    building didn't seem this tall when you saw it from the outside.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:261:room:26117
    down:
      to: tba:261:room:26115

"tba:261:room:26117":
  name: Stairwell
  description: >
    Still you climb, up and up, or down and down, whichever as it may be in relation to the direction
    you're heading.
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:261:room:26118
    down:
      to: tba:261:room:26116

"tba:261:room:26118":
  name: Stairwell
  description: >
    The stairs do not seem to end, nor do they ever seem as if they will end. You must be in a tower on
    the backside of the building and that's why you never noticed this immense height from outside.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:261:room:26121
      door:
        keywords: [wall]
        kind: door
        reset: closed
    up:
      to: tba:261:room:26119
    down:
      to: tba:261:room:26117

"tba:261:room:26119":
  name: Stairwell
  description: >
    The gray stone and motar walls are getting just a bit old now.  Myabe if called out for help, or
    just sat and waited for someone to come along...?
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:261:room:26120
    down:
      to: tba:261:room:26118

"tba:261:room:26120":
  name: Stairwell
  description: >
    The stairwell still goes up as far as you can see.  It also still goes down as far as you can see. 
    It's been going up forever.  It's been going down forever.  Where is the top?  Where is the bottom? 
    Where?!
  sector: inside
  flags: [indoors]
  exits:
    up:
      to: tba:261:room:26115
    down:
      to: tba:261:room:26119

"tba:261:room:26121":
  name: Mountain Forest
  description: >
    You stand in a forest at a high altitude on a mountain.  Large trees, the size of three men side by
    side rise from the forest floor, towering high above you.  Birds sing, branches creak, and you have
    to wonder...  -What the Hell am I doing here?!  -
  sector: forest
  triggers: [tba:261:trg:26100]

"tba:261:room:26122":
  name: Bedroom
  description: >
    You land with a -THUMP!  - in the center of a huge feather bed which sits in the middle of an
    opulent bedroom.  It's a darn good thing you landed on the bed and not on the floor, or it might've hurt! 
    The only bad thing about this experience is that the man and woman who were in the bed seem to be
    just a bit perturbed that landed on them, too.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:261:room:26123
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26123":
  name: Spotless White Hallway
  description: >
    You have entered into a short hallway which runs east to west, but only for a short ways.  At the
    western end of the hallway there is a door and on the north and south sides there are doors spaced
    evenly apart three in each row.  >From some unknown source, a soft but bright light keeps this place lit
    up, and from the same source, soft orchestra music plays quietly.  The walls here are white as any
    you've ever seen, with not a mark or mar upon them.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26131
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:261:room:26130
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:261:room:26124
  extras:
  - keywords: [tapestry, tapestries, painting, paintings]
    text: >
      Many of these show scenes of high magic and heroism.  Just like almost every tapestry and painting
      you've seen.

"tba:261:room:26124":
  name: Hallway
  description: >
    The walls still glisten white, doors still line those walls, and the music plays on and on in
    accompaniment to the soft light all around you.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26132
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:261:room:26123
    south:
      to: tba:261:room:26129
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:261:room:26125

"tba:261:room:26125":
  name: Spotless White Hallway
  description: >
    You are at the western end of this spotlessly clean hallway.  The music really is getting on your
    nerves now, it sounds to be the same song being played over and over and over...  Who ARE these people
    who live here?
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26126
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:261:room:26124
    south:
      to: tba:261:room:26128
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:261:room:26127
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26126":
  name: Bathroom
  description: >
    You stand in a room whose only function is to house a shower stall.  Seems normal enough.  The only
    out-of-the-ordinary thing about there being a shower is the shower itself and the occupant within.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:261:room:26125
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [cell, cells]
    text: It is open, empty, and uninteresting.

"tba:261:room:26127":
  name: Dragon's Lair
  description: >
    You have to give a bit of a double-take as you enter into this room.  The spotlessly clean hallways
    you just left are replaced by cold gray walls of stone.  The chamber itself could easily house a
    full grown dragon, it is so big. As a matter of fact, it does house a full grown dragon.
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:261:room:26125
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [cell, cells]
    text: It is open, empty, and uninteresting.

"tba:261:room:26128":
  name: A Dark Room
  description: It is pitch black...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:261:room:26125
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26129":
  name: The Bar
  description: >
    Now this is your kind of place!  Neon lights light your way past the band to the Bar.  All your
    favorite drinks are on hand, anything you want, just ask Old Marty, the bartender, who is always more
    than happy to get you what you need.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26124
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26130":
  name: Martin's Rest
  description: >
    This room is completely empty save the man hanging by his neck from a rope tied to a support in the
    ceiling and the over-turned chair which you assume is the very chair he must have used to get
    himself into his current situation.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26123
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26131":
  name: Butler's Quarters
  description: >
    This must be the only normal room in the whole castle!  A tidy place, as only a butler's room could
    be, with the bed made without a wrinkle, clothing all hung neatly in a closet alcove.  Inna and Igor
    are lucky to have this man, this beacon of normalcy, on staff.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:261:room:26133
      door:
        keywords: [closet]
        kind: door
        reset: closed
    south:
      to: tba:261:room:26123
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26132":
  name: Ma & Pa's Home
  description: >
    This is a simply furnished room, with a fire crackling merrily in the fireplace, keeping time with
    Ma's knitting needles and Pa's wittlin' knife.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:261:room:26124
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26133":
  name: Waiting Room
  description: >
    This smallish room has two comfortable looking couches to wait on.  A small end table holds
    literature to read while passing time waiting for an audience with the master and mistress of this place.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26134
    west:
      to: tba:261:room:26110

"tba:261:room:26134":
  name: A Hallway
  description: >
    This small hallway runs north-south.  To the south is the waiting room that you came from.  To the
    north the hallway continues on, eventually opening up into a large room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26135
    south:
      to: tba:261:room:26133

"tba:261:room:26135":
  name: A Hallway
  description: >
    The small hallway continues here, north to south.  The waiting room lies a ways south of you and
    what you presume to be Inna and Igor's office or reception room lies north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26136
    east:
      to: tba:261:room:26141
      door:
        keywords: [wall]
        kind: door
        reset: closed
    south:
      to: tba:261:room:26134
    west:
      to: tba:261:room:26138
      door:
        keywords: [wall]
        kind: door
        reset: closed
  extras:
  - keywords: [sculpture, tapestry, sculptures, tapestries]
    text: They look nice, but aren't very valuable.

"tba:261:room:26136":
  name: A Hallway
  description: >
    The entance to a large room lies just north of you, while the length of the hallway runs south into
    the waiting room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26137
    east:
      to: tba:261:room:26139
      door:
        keywords: [wall]
        kind: door
        reset: closed
    south:
      to: tba:261:room:26135
    west:
      to: tba:261:room:26140
      door:
        keywords: [wall]
        kind: door
        reset: closed

"tba:261:room:26137":
  name: Den
  description: >
    This comfortable room hosts a large oak desk which sits before a huge stone fireplace.  The fire is
    currently lit, giving you warmth and comfort, even in this strange castle.  Pictures line the mantle
    of the fireplace, awards hang on the walls from various mage academies.  These people seem to have
    been socialites in their time.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:261:room:26136
  extras:
  - keywords: [picture]
    text: >
      This picture out of all of them, catches your eye the most.  It has a picture of a man dressed in a
      clown suit wearing a pointed hat.  He looks to be in the midst of a silly looking dance.  Curious,
      you turn the picture over and see that there are words scribbled on the back.  They read -Man, are you
      dumb!  How long you been waiting in this room?  Do you really think that we receive visitors?

"tba:261:room:26138":
  name: Igor's Office
  description: >
    This seems more like a play room than an office!  Lots of toys and dolls laying about, a couple of
    simple games on the shelves.  A great many books line the southern wall, but for the most part, they
    look as if they are usually unread.  Seems strange that a famous illiusionist would have these sorts
    of things on his office...
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:261:room:26135

"tba:261:room:26139":
  name: Inna's Office
  description: >
    This quaintly decorated room holds nothing more than a small desk and a chair.  Book shelves line
    the walls both to the south and the north.  A small window in the eastern wall affords a view of the
    forest outside.  Strangely enough, it seems you are still on the ground floor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:261:room:26136

"tba:261:room:26140":
  name: Inna & Igor's Bedroom
  description: >
    This seems to be your usual dark toned, wooden, old-person's bedroom set up. Lots of lace on the
    bed covers, pictures on the dressers of Ma and Pa, the whole normal old person's place.  Maybe these
    guys aren't so weird after all...
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:261:room:26136

"tba:261:room:26141":
  name: The Laboratory
  description: >
    This laboratory has lots of stuff in it.  Beakers, flasks, burners, tongs, mortars and pestles,
    jars filled with normal things, jars filled with abnormal things, jars filled with things you'd rather
    not think about...  A search could reveal many things...  Inna and Igor both seem surprised to see you.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:261:room:26135
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [mortar, mortars, pestle, pestles, jar, jars]
    text: Looks like normal, fragile lab equipment to you.
  - keywords: [beaker, beakers, flask, flasks, burner, burners, tong, tongs]
    text: Looks like normal, fragile lab equipment to you.

"tba:261:room:26142":
  name: Entrance to a Large Home
  description: >
    You stand at the entrance to a home that is not precisely huge, but definitely large by most
    standards.  The door lies directly west of you or you may head back along the path through the forest to
    the grasslands.
  sector: city
  exits:
    east:
      to: tba:261:room:26143
    west:
      to: tba:261:room:26100
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:261:room:26143":
  name: A Twisty Path
  description: >
    The path heads due west toward a large home.  You have heard of an old married couple who used to
    be Head Enchanter and Enchantress to the Lord at Lord's Keep, maybe this is it...  The path also heads
    north through the forest.
  sector: forest
  exits:
    north:
      to: tba:261:room:26144
    west:
      to: tba:261:room:26142

"tba:261:room:26144":
  name: Twisty Path
  description: >
    The path heads through this jumbled forest, not really seeming to lead anywhere.  There are a great
    many leaves strewn in the path, giving you the impression that not many people travel this way very
    often.
  sector: forest
  exits:
    east:
      to: tba:261:room:26145
    south:
      to: tba:261:room:26143

"tba:261:room:26145":
  name: Start of a Twisty Path
  description: >
    You stand at the edge of the field and the edge of a forest.  The way to the forest is west, and
    the grasslands spread out to your east.
  sector: forest
  exits:
    east:
      to: tba:260:room:26067
    west:
      to: tba:261:room:26144
