# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 261.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:261:room:26100":
  name: Foyer
  description: >
    You stand at the entrance to a large home, a home almost large enough to be called a castle.  To
    the west a hallway runs into the interior of the castle. North of you is a door which looks to house a
    coat closet.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26101
      door:
        keywords: [door, closet]
        kind: door
    east:
      to: tba:261:room:26142
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:261:room:26102
  extras:
  - keywords: [credits]
    text: >
      * The Castle * Written by Kaan for Dibrova Levels: 20 - 25 84 rooms 19 mobs 23 objs Connector
      Zone(s): The Light Forest This was a zone I had to sort of build off the cuff. It was when we started
      getting a larger influx of new players and needed this part- icular level range of eq. I slapped it
      together in less than a day and had it ready for play immediately. All things considered, its not a bad
      zone for what it was created for.

"tba:261:room:26101":
  name: Closet
  description: >
    Upon entering the closet, you immediately notice that it is much larger than you first thought it
    to be.  In fact, it is immense.  You cannot see the walls in any direction, nor the ceiling.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:261:room:26100

"tba:261:room:26102":
  name: Hallway
  description: >
    You have entered a room that, although from your first look from in the foyer looked to be a
    hallway, turns out to be a large room which has exits in all directions.  A hallway runs east from here,
    there are open doorways to the north and south, and west there is a closed door.  There is even a
    large, grand staircase leading to a higher level, not to mention a set of stairs leading downward into the
    basement.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:261:room:26103
    east:
      to: tba:261:room:26103
    south:
      to: tba:261:room:26103
    west:
      to: tba:261:room:26103
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:261:room:26103
    down:
      to: tba:261:room:26103

