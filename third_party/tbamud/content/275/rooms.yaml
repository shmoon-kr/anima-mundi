"tba:275:room:27572":
  name: The Museum Of National History
  description:
  - >
    You are standing in the cavernous lobby of the Museum of National History.  During your examination
    of the lobby, you are startled by the museum curator.  The curator whines to you about how the
    museum is still under renovations and how the lack of funds from the city is slowing the the museum's
    progress.  After a long and boring story, you jump at the chance to make a polite exit and quickly make
    your departure.
  - Broadway is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27571
      look: You see Broadway.

"tba:275:room:27573":
  name: The Lobby Of The Waldorf Astoria
  description:
  - >
    This is one of the most luxurious hotels you have ever seen. It makes the inn at Midgaard look like
    the Bates' Motel.  Pillars of gold tower above you to both your left and right.  You try to chip a
    piece off the towers, but you think twice when you see the large guards who would readily bite your
    head off if you even thought about trying.
  - To the east is Broadway.  Follow the stairs up to check in at the Reception.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27571
