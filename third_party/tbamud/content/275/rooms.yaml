"tba:275:room:27581":
  name: The Lobby To Goethe's Library
  description:
  - >
    You are totally consumed by the sheer power generated by the combined intelligence in this
    building.  This IS the library of the famed philosopher, Goethe.  Here, researchers and intellects gather to
    learn from the mass collections of knowledge.  The only problem is that recently the library has
    become overrun by cutthroat knowledge seekers.  The library also serves as the source of magic scrolls to
    adventurers in New Sparta.
  - Broadway continues to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27574
      look: You see Broadway.

"tba:275:room:27582":
  name: The Entrance To Cheers Bar
  description:
  - >
    Making your way in the world today takes everything you've got. Taking a break from all your
    worries sure would help a lot -- well, we think you know the rest.  Anyway, this is just a place where you
    can sit back and enjoy a drink with Norm and the guys.  And if that gets old, (it sure hasn't with
    Norm) you're sure to find something else to do.
  - The Main Bar is to the west, Broadway is to the east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:275:room:27574
      look: You see Broadway.
    west:
      to: tba:275:room:27583
      look: You see Woody, waiting to serve you.

"tba:275:room:27583":
  name: The Main Bar
  description:
  - >
    You step up to the bar and absorb the atmosphere of an old neighborhood tavern.  You're always
    certain to find a friendly face here.
  - >
    The bar continues north and west. To the south are the stairs to Melville's, to the east is the
    exit.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27585
      look: You see tables in the bar.
    east:
      to: tba:275:room:27582
      look: You see the entrance to Cheers.
    south:
      to: tba:275:room:27586
      look: You see the stairs to Melville's.
    west:
      to: tba:275:room:27584
      look: You see the stools on the other side of the bar.

"tba:275:room:27584":
  name: The Stools By The Bar
  description:
  - >
    This is where all the regulars reside.  You notice that the stools are personally melded to certain
    individuals' posteriors.
  - >
    The main bar is to the east. The pool room is to the west. The bar also continues north and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27587
      look: The bar continues.
    east:
      to: tba:275:room:27583
      look: You see the Main Bar.
    south:
      to: tba:275:room:27588
      look: The bar continues.
    west:
      to: tba:275:room:27589
      look: You see the famed pool room and not Rebecca's damned Tea Room.

"tba:275:room:27585":
  name: Inside The Bar
  description:
  - >
    You are standing inside Cheers.  Many customers are here, sitting at tables moving towards
    intoxication.
  - The bar continues to the west, to the south is the Main Bar.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:275:room:27583
      look: You see the Main Bar.
    west:
      to: tba:275:room:27587
      look: The bar continues.

"tba:275:room:27586":
  name: The Stairs To Melville's
  description:
  - >
    You stand at the stairs leading up to Melville's Restaurant, owned by that evil bald man, Jonathan
    Hill.  There is a very sturdy welcome mat at the bottom of the stairs with a picture of a duck on
    it.  The mat does not tear or burn, and beating it with a sledgehammer has no effect.  Keep in mind that
    if you want to go to Melville's, you need a coat and tie.  Oh, and don't forget to wipe your feet.
  - >
    The stairs lead up to Melville's, to the north is the Main Bar and to the west the bar continues.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27583
      look: You see the Main Bar.
    west:
      to: tba:275:room:27588
      look: The bar continues.
    up:
      to: tba:275:room:27590
      look: The stairs lead up to Melville's.

"tba:275:room:27587":
  name: Inside The Bar
  description:
  - >
    You are standing inside Cheers, right next to a multi-purpose bar table that has been used for
    everything from seances to Monopoly games with fuzzy dice.
  - The bar continues east, the bar stools are to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27585
      look: The bar continues east
    south:
      to: tba:275:room:27584
      look: You see the bar stools.

"tba:275:room:27588":
  name: Inside The Bar
  description:
  - >
    In this corner of the bar, you see a temperamental jukebox and a very old player piano.  On the
    wall you see a picture of Geronimo, hung here in loving memory of Coach Ernie Pantuzzo.
  - >
    To the north are the bar stools, to the west is the Office to Cheers, behind a door.  To the east,
    you see the stairs to Melville's Restaurant.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27584
      look: You see the bar stools (like duh!).
    east:
      to: tba:275:room:27586
      look: You see the stairs that lead to Melville's.
    west:
      to: tba:275:room:27591
      look: You see the entrance to the office of Cheers Bar.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [picture]
    text: >
      You see a picture of the famous Indian, Geronimo.  An inscription says in loving memory of Coach.

"tba:275:room:27589":
  name: The Pool Room
  description:
  - >
    As you look about the pool room, you think to yourself, gee, if only I could get Norm drunk enough
    to win money off of him.  Then you realize that 1) you couldn't afford the money it would take to get
    him drunk, and 2) you really don't think Norm would ever leave his stool unguarded.  You see a pool
    table and pool sticks.
  - The bar stools are to east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27584
      look: You see the bar stools.
  extras:
  - keywords: [table]
    text: This is your standard tournament pool table (would you expect anything less).

"tba:275:room:27590":
  name: Melville's Restaurant
  description:
  - >
    This is the famous restaurant upstairs from the Cheers bar.  It is currently owned by the evil bald
    man, Jonathan Hill.  Although the company might be bad, you are definitely assured to get a good
    meal. If you aren't wearing a jacket and tie, you'd better leave fast before Mr. Hill gets snotty and
    throws you out (but you can always steal their mints!).
  - The Cheers Bar is downstairs.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:275:room:27586
      look: You see Cheers Bar (wow!).

"tba:275:room:27591":
  name: Rebecca's Office
  description:
  - >
    As you enter the office, the first thing you notice is a very comfortable couch and you realize
    that it has been used for more than midday naps.  You also infer from the couch that the desk has been
    used for more than business work (well, maybe it's been used for a different kind of business).
  - The bar is to east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27588
      look: You see the door to the office.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [couch]
    text: This is one comfortable couch.
  - keywords: [desk]
    text: This is a large desk, good for doing many various things.

"tba:275:room:27592":
  name: City Hall
  description:
  - >
    This is your everyday bureau of red tape...which is why certain things in town don't get done. 
    Underworked and overpaid civil servants are everywhere, planning this year's family reunion.
  - Broadway is to the west, the Mayor's Office is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27593
      look: You see Mayor Abe's Office.
    west:
      to: tba:275:room:27580
      look: The red tape obstructs your view.

"tba:275:room:27593":
  name: Mayor Abe's Office
  description:
  - >
    This is the residence of one of the most uninspired and uninterested mayors since Maryon Barry
    (sorry, he's in the jail at the moment!).  The office makes you feel like your being watched and then you
    recall all the rumors you heard about the mayor's link to Satan himself (which would explain him
    damning everyone).
  - City Hall is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27592
      look: You see City Hall.

"tba:275:room:27594":
  name: The Reception In The Waldorf Astoria
  description:
  - >
    This is a very classy reception for a very classy hotel.  This fact is proven by the sheer beauty
    of the receptionist.  Hey, they can afford to pay for the high prices of supermodels and Playboy
    Playmates.
  - The lobby to the Waldorf is downstairs.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:275:room:27573
      look: You see the lobby.

"tba:275:room:27595":
  name: The Rogues' Bar
  description:
  - >
    This is a dark room full of shadows, but as a thief, it is just the way you like it.  This is the
    perfect place to hide from the local authorities or any other persons who are after your head!
  - The Entrance to the Thieves' Guild is to the north and the Secret Yard is to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27514
      look: You see the Entrance to the Guild of Thieves.
    west:
      to: tba:275:room:27596
      look: You see the Secret Yard.

"tba:275:room:27596":
  name: The Secret Yard
  description: >
    This is the secret practice yard of assassins and thieves.  The Rogues' Bar is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27595
      look: You see the bar.

"tba:275:room:27597":
  name: The Renaissance Department Store
  description:
  - >
    This is a modern department store full of items that the everyday adventurer can do without.
  - Broadway is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27580
      look: You see Broadway.

"tba:275:room:27598":
  name: Second Avenue
  description:
  - >
    This is a minor road that leads to the church and the fire station. From the condition of the
    street, it seems that the inhabitants haven't been paying their taxes lately.
  - Broadway is to the west and the end of Second Avenue is to the east.
  sector: city
  exits:
    east:
      to: tba:275:room:27599
      look: You see the east end of Second Avenue.
    west:
      to: tba:275:room:27570
      look: You see the intersection of Broadway and Second Avenue.

"tba:275:room:27599":
  name: The East End Of Second Avenue
  description: >
    This is the east end of the very short Second Avenue.  The Church is to the north and the fire
    station is to the south.
  sector: city
  exits:
    north:
      to: tba:276:room:27600
      look: You see the church.
    south:
      to: tba:276:room:27601
      look: You see the fire station.
    west:
      to: tba:275:room:27598
      look: You see Second Avenue.
