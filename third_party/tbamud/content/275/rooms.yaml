# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 275.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:275:room:27500":
  name: Naved's Zone Description Room
  description:
    preformatted: |2
         The city of New Sparta. By Naved.
      Dump: 27608
      Zone 275 is linked to the following zones:
      276 New Sparta II                  at 27516 (west ) ---> 27614
      276 New Sparta II                  at 27569 (east ) ---> 27616
      276 New Sparta II                  at 27570 (west ) ---> 27604
      276 New Sparta II                  at 27580 (north) ---> 27612
      276 New Sparta II                  at 27599 (north) ---> 27600
      276 New Sparta II                  at 27599 (south) ---> 27601
      guildmaster: 72, 73, 74, 75
  sector: inside

"tba:275:room:27501":
  name: The Port Of New Sparta
  description:
  - >
    You stare in astonishment at the modern metropolis of New Sparta... After examining the sky for a
    few minutes, you realize an old sailor has been staring at you the whole time.  As you gaze down at
    him, you notice a strange aura around him.  When you finally decide to speak, the strange sailor points
    to the city and says "With technology comes power and with power comes DANGER!!"
  - >
    You turn to look back at the sailor and notice he is no longer there! A feeling of hope and
    uneasiness pervades your body as you think about the city of New Sparta!
  sector: city
  exits:
    north:
      to: tba:275:room:27502
      look: You see a bustling harbourplace.

"tba:275:room:27502":
  name: Central Harbourplace
  description:
  - >
    As soon as you enter a large mob of salesmen with vendor carts rush up to you and push their cheap
    wares with inflated prices.  When they see you have no intention of buying any of their goods, they
    disappear as suddenly as they appeared.
  - >
    The harbourplace continues to the east and west.  To the north you see the downtown section of New
    Sparta.
  sector: city
  exits:
    north:
      to: tba:275:room:27503
      look: To the north lies Broadway, the main street of New Sparta.
    east:
      to: tba:275:room:27504
      look: The harbourplace continues to the east.
    south:
      to: tba:275:room:27501
      look: To the south lies the entrance to the city of New Sparta.
    west:
      to: tba:275:room:27505
      look: The harbourplace continues to the west.

"tba:275:room:27503":
  name: Broadway
  description:
  - >
    You are on Broadway, the main street of New Sparta.  Rows of stores line the sides of the street as
    far as you can see.  You are impressed by the modern technology and the sheer size of the
    buildings.  You are confident that this city is at least 1000 times better than Midgaard.
  - >
    To the east lies the Fishery.  The west leads to the Tin Can Alley, the economically challenged
    neighborhood (note the PC terminology). Broadway continues to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:275:room:27506
      look: You see Broadway continues.
    east:
      to: tba:275:room:27507
      look: You see the Fishery.
    south:
      to: tba:275:room:27502
      look: You see the bustling harbourplace.
    west:
      to: tba:275:room:27508
      look: You see Tin Can Alley.

"tba:275:room:27504":
  name: Harbourplace East
  description:
  - >
    You are now in the eastern section of the harbour. There are less of those annoying salespeople
    here, but there are more and more foreign tourists flashing their cameras.
  - The harbour continues to the south and west.
  sector: city
  exits:
    south:
      to: tba:275:room:27509
      look: You see the harbour continuing to the south.
    west:
      to: tba:275:room:27502
      look: You see the central harbourplace.

"tba:275:room:27505":
  name: Harbourplace West
  description:
  - >
    A thick population of tourists slows your progress.  One of the tourist families stops you and asks
    you to take their pictures.  The man hands you his camera, but you look at it in confusion when you
    realize it is more complex than a global optimizer.  You hand the camera back and the man yells
    expletives back at you in a strange tongue.
  - To the harbour continues to the south and east.
  sector: city
  exits:
    east:
      to: tba:275:room:27502
      look: You see the central harbourplace.
    south:
      to: tba:275:room:27510
      look: You see the harbour continuing to the south.

"tba:275:room:27506":
  name: Broadway
  description: >
    You are on the 200 block of Broadway.  To the east you see the entrance to the Cafe.  When you turn
    to face the west you see the entrance to the Pharmacy.
  sector: city
  exits:
    north:
      to: tba:275:room:27511
      look: Broadway continues.
    east:
      to: tba:275:room:27512
      look: You see the cheap, flimsy facade of the Sexy Seventies Cafe.
    south:
      to: tba:275:room:27503
      look: More Broadway.
    west:
      to: tba:275:room:27513
      look: You see Harry's Pharmacy.

"tba:275:room:27507":
  name: Charlie's Fish Store
  description:
  - >
    As you walk into the fish store, you are overwhelmed by the nasty smell of fish.  On the back wall
    you notice a large mounted fish.  After a while, you realize that the fish is Charlie Tuna.  You see
    one of those dusty chalk boards with a list of delectables from which you can choose.
  - Type <list> to see a list of products.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27503
      look: You can barely see Broadway through the dirty window.

"tba:275:room:27508":
  name: Tin Can Alley
  description:
  - >
    Be warned that this a part of the economically challenged portion of New Sparta.  The vermin and
    stuff you find in here will not be pleasant to you rich and sheltered people.
  - >
    You see the entrance to the thieves guild to the south.  The alley continues to the west.  Broadway
    lies to the east.
  sector: city
  exits:
    east:
      to: tba:275:room:27503
      look: You see Broadway.
    south:
      to: tba:275:room:27514
      look: A chill runs through your spine as you gaze upon the entrance to the thieves guild.
    west:
      to: tba:275:room:27515
      look: The Alley continues west.

"tba:275:room:27509":
  name: By The Shore
  description:
  - >
    You see the U.S.S. Constellation docked here by the shore, along with other various sea vessels. 
    To the south you can see the river.
  - To the north is the east end of the harbourplace.
  sector: city
  exits:
    north:
      to: tba:275:room:27504
      look: You see the east end of the harbour.

"tba:275:room:27510":
  name: By The Shore
  description:
  - >
    You are standing on a small public beach (unfortunately, it is NOT a topless beach) overlooking the
    river.  The Swedish Bikini Team is here shooting an Old Midgaard beer commercial (It is REALLY too
    bad it is not a topless beach!).
  - To the north is the west end of the harbourplace.
  sector: city
  exits:
    north:
      to: tba:275:room:27505
      look: You see the west end of the harbour.

"tba:275:room:27511":
  name: Broadway
  description:
  - >
    You are on the 300 block of Broadway, though you wouldn't be able to tell that because someone has
    stolen the street sign (probably a bunch of bored college students).
  - >
    To the east is the Weapons Shop, and to the west is the Seven- Eleven.  Broadway continues north
    and south of here.
  sector: city
  exits:
    north:
      to: tba:275:room:27516
      look: More Broadway.
    east:
      to: tba:275:room:27517
      look: You see the Weapons Shop.
    south:
      to: tba:275:room:27506
      look: Broadway continues.
    west:
      to: tba:275:room:27518
      look: You see a 7-11 convenience store.

"tba:275:room:27512":
  name: The Sexy Seventies Cafe
  description:
  - >
    No, this is not a place to find swinging septuagenarians.  This is a cafe commemorating that
    happening decade the Seventies.  Around you are people adorned in plaid shirts and bell-bottomed trousers.
    Pictures of John Travolta, Richard Nixon and the Bee-Gees hang on the walls.  You see what you think
    is a marijuana plant growing in the corner.
  - To the west, you can return to Broadway (and the real world).
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27506
      look: You can make out Broadway through the mass of bodies between you and the door.

"tba:275:room:27513":
  name: Harry's Pharmacy
  description:
  - >
    As you enter the room, you are overcome by the smell of incense. In the background, you can faintly
    hear the singing of religious ballads. As you walk towards the counter, you realize you will have to
    deal with a Hare Krishna (almost as bad as those guys who go door to door). A small price to pay for
    the goods you may obtain here.
  - The entrance to the Clerics' Guild is to the west.  Broadway is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27506
      look: You see Broadway.
    west:
      to: tba:275:room:27519
      look: You see the Clerics' Guild.

"tba:275:room:27514":
  name: The Entrance To The Thieves' Guild
  description: >
    This is the entrance to the Guild of Thieves.  The Rogues' Bar is south of here, and Tin Can Alley
    is to the North.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27508
      look: You see Tin Can Alley.
    south:
      to: tba:275:room:27595
      look: You see the Bar.

"tba:275:room:27515":
  name: Tin Can Alley
  description:
  - >
    You are walking along Tin Can Alley, which leads to the bad part of town.  Considering the
    situation here, you wonder how much worse it can get.
  - Tin Can Alley continues to the east and west.
  sector: city
  exits:
    east:
      to: tba:275:room:27508
      look: Still Tin Can Alley.
    west:
      to: tba:275:room:27522
      look: More Tin Can Alley.

"tba:275:room:27516":
  name: The Intersection Of First And Broadway
  description:
  - >
    Here Broadway crosses with another main street, First Avenue, which runs east and west through the
    city.  It is not as large as Broadway, but leads both to Hell's Kitchen and to the new sports stadium.
  - >
    Broadway continues north and south; First Avenue extends west towards Hell's Kitchen and east to
    the stadium.
  sector: city
  exits:
    north:
      to: tba:275:room:27566
      look: More Broadway.
    east:
      to: tba:275:room:27529
      look: You see First Avenue.
    south:
      to: tba:275:room:27511
      look: Broadway continues.
    west:
      to: tba:276:room:27614
      look: You see First Avenue.

"tba:275:room:27517":
  name: The Weapons Shop
  description:
  - >
    The Weapons Shop is self-explanatory -- this is a place to buy and sell weapons (what else would
    you expect?).
  - The Warriors' Guild is to the east and Broadway is to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27523
      look: You see the entrance to the Warrior's Guild.
    west:
      to: tba:275:room:27511
      look: You see Broadway through the window.

"tba:275:room:27518":
  name: The Seven-Eleven
  description: >
    Much to your surprise, there IS a friendly neighbourhood 7-11 in New Sparta.  Much like any other
    7-11, here you can purchase many necessities at inflated prices all hours of the night.  And what
    would a 7-11 be without a foreign clerk with a funny accent?
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27511
      look: It is Broadway.

"tba:275:room:27519":
  name: The Entrance To The Clerics' Guild
  description:
  - The entrance hall is a small modest room, reflecting the true nature of the Clerics.
  - Harry's Pharmacy is to the east and the bar is to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27513
      look: Harry's Pharmacy is there.
    west:
      to: tba:275:room:27520
      look: You see the Clerics' Bar.

"tba:275:room:27520":
  name: The Clerics' Bar
  description: >
    The Bar is one of the finest in the land, lucky for you it is members only.  Fine furniture is set
    all around the room.  A small sign is hanging on the wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27519
      look: Entrance to the Clerics' Guild.
    west:
      to: tba:275:room:27521
      look: The Inner Sanctum.

"tba:275:room:27521":
  name: The Inner Sanctum
  description:
  - >
    This is the holy ground for the Clerics.  You feel at peace with nature here as well as a strange
    sense of power.
  - The Clerics' bar is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27520
      look: The Clerics' Bar.

"tba:275:room:27522":
  name: Tin Can Alley
  description:
  - >
    The longer you stay in the alley, the more you realize that you don't want to be here.  Then you
    remember all the better things you have seen in New Sparta (like the public beach) and how much you'd
    rather be there!
  - To the south is Baltimore Ave. and Tin Can Alley continues east towards Broadway.
  sector: city
  exits:
    east:
      to: tba:275:room:27515
      look: You see Tin Can Alley.
    south:
      to: tba:275:room:27526
      look: You see Baltimore Avenue, the famed red light district.

"tba:275:room:27523":
  name: The Entrance To The Guild Of Swordsmen
  description:
  - >
    This is the entrance to the Guild of Swordsmen, a place where one has to be careful not to say
    something wrong (or right).
  - The Swordsmens' Bar is to the south and the Weapons Shop is to the west.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:275:room:27524
      look: You see the Bar of Swordsmen.
    west:
      to: tba:275:room:27517
      look: You see the Weapons Shop.

"tba:275:room:27524":
  name: The Bar Of Swordsmen
  description:
  - >
    The Bar of Swordsmen was once upon a time beautifully furnished, but now the furniture is all
    around you in small pieces (kind of like a Frat House).
  - >
    To the south you see the Tournament and Practice Yard and to the north is the Entrance to the Guild
    of Swordsmen.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27523
      look: You see the Entrance to the Guild of Swordsmen.
    south:
      to: tba:275:room:27525
      look: You see the Tournament and Practice Yard.

"tba:275:room:27525":
  name: The Tournament And Practice Yard
  description: The practice yard of the fighters.  To the north is the bar.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27524
      look: You see the Bar of Swordsmen.

"tba:275:room:27526":
  name: Baltimore Avenue
  description:
  - >
    You are in the famed red light district of New Sparta (hey, every town has one), a wonderful place
    to spend your money on a rainy day (an even better reason for learning Control Weather).
  - To the east is Pee Wee's Peep Show and to the south, Baltimore Avenue continues.
  sector: city
  exits:
    north:
      to: tba:275:room:27522
      look: You see Tin Can Alley.
    east:
      to: tba:275:room:27527
      look: You see Pee Wee's Peep Show.
    south:
      to: tba:275:room:27528
      look: You see more of Baltimore Avenue.

"tba:275:room:27527":
  name: Pee Wee's Peep Show
  description:
  - >
    Upon entering, your eyes immediately fixate upon the gorgeous dancers who are here for your
    amusement.  Pee Wee is busy in the corner doing something you would rather not think about.  Good thing
    there are no police here!
  - Baltimore Avenue is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:275:room:27526
      look: >
        Had you succeeded in removing your gaze from the gyrating women in front of you, you would have
        seen that Baltimore Avenue lies to the west.

"tba:275:room:27528":
  name: Baltimore Avenue
  description:
  - >
    This is a dead end (yes, we know Baltimore Avenue is a small red light district, but did you expect
    the good people of New Sparta to put up with anymore!!!).  There is some graffiti on the south wall.
  - Baltimore Avenue is to the north.
  sector: city
  exits:
    north:
      to: tba:275:room:27526
      look: You see Baltimore Avenue.
    south:
      look: "You see some graffiti that reads:  Try Peggy at Pee Wee's, She's da Best!"
  extras:
  - keywords: [graffiti]
    text: Try Peggy at Pee Wee's, She's da Best!

"tba:275:room:27529":
  name: First Avenue
  description: >
    You are on the west side of First Avenue.  In the distance to the east you can see the WarDome.
    Broadway is to the west.
  sector: city
  exits:
    east:
      to: tba:275:room:27530
      look: You see the entrance to the WarDome.
    west:
      to: tba:275:room:27516
      look: You see Broadway.

"tba:275:room:27530":
  name: The Entrance To The WarDome
  description:
  - >
    You gaze in awe at mammoth WarDome.  It is a masterpiece in modern architecture and technology,
    built of huge marble columns leading up to golden figures of typical stadium fans -- beautiful, but at
    the same time oddly grotesque.  An egg-shaped dome covers the stadium which has the ability to retract
    during ideal weather conditions (rain, sleet, wind and hail).  A large electronic screen adorns the
    side of the edifice, promoting today's event.
  - First street is to the west, east takes you into the WarDome.
  sector: city
  exits:
    east:
      to: tba:275:room:27531
      look: You see the inside of WarDome.
    west:
      to: tba:275:room:27529
      look: First Avenue continues.
  extras:
  - keywords: [screen]
    text:
      preformatted: |2
           **********************************************************
           *                                                        *
           *                        WarDome                         *
           *                        -------                         *
           *                    Capacity: 82,172                    *
           *                                                        *
           *       Today:     The Orcland Raiders                   *
           *                           vs.                          *
           *                The New Sparta Warriors                 *
           *                                                        *
           *       The Warriors host the Western-Division Champ     *
           *       Orcland team in the Conference Championship      *
           *       Game to determine which squad will meet the      *
           *       winner of the Dwarf Giants-Champions of Death    *
           *              match-up in Blood Bowl XII.               *
           *                                                        *
           *                   STANDING ROOM ONLY                   *
           **********************************************************

"tba:275:room:27531":
  name: Inside The WarDome
  description:
  - >
    The inside of the stadium offers a dramatic contrast.  Like the exterior, the stands offer the most
    luxurious accommodations for the spectators.  The field however, is a battleground composed of mud,
    turf and rock surrounded by an 8-foot high stone wall.  There are two entrances to the playing
    field--as audience participation is welcomed, though not strongly recommended.
  - >
    To the east are the Blue Seats, to the north are the West Stands. Going west, you exit the stadium.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:275:room:27532
      look: You see the West Stands.
    east:
      to: tba:275:room:27543
      look: You see the Blue Seats.
    west:
      to: tba:275:room:27530
      look: You see outside the WarDome

"tba:275:room:27532":
  name: The West Stands
  description:
  - >
    You are standing in the West Stands, the general admission section of WarDome.  Various spectators
    are here, viewing the game.  The stands overlook New Sparta's goal line.
  - The West Stands continue north, and the southwest corner of the stadium is to the south.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27533
      look: You see more of the West Stands.
    east:
      look: You see the action on New Sparta's goal line.
    south:
      to: tba:275:room:27531
      look: You see the southwest corner of WarDome.

"tba:275:room:27533":
  name: The West Stands
  description:
  - >
    You are standing in the West Stands, the general admission section of WarDome.  Various spectators
    are here, viewing the game.  The stands overlook New Sparta's defensive zone.
  - The West Stands continue north and south.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27534
      look: You see more of the West Stands.
    east:
      look: You see the action in New Sparta's defensive zone.
    south:
      to: tba:275:room:27532
      look: You see more of the West Stands.

"tba:275:room:27534":
  name: The West Stands
  description:
  - >
    You are standing in the middle of the West Stands, overlooking the center of the field.  You notice
    that below you, there are stairs pointing towards the playing field.  Given your sense of adventure,
    you wonder if you should go down....
  - The West Stands continue north and south, stairs go down to the field level.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27535
      look: You see more of the West Stands.
    east:
      look: You see the action on the 50-meter line.
    south:
      to: tba:275:room:27533
      look: You see more of the West Stands.
    down:
      to: tba:275:room:27546
      look: You see stairs leading to the field level... and almost INTO the action.

"tba:275:room:27535":
  name: The West Stands
  description:
  - >
    You are standing in the West Stands, the general admission section of WarDome.  Various spectators
    are here, viewing the game.  The stands overlook Orcland's defensive zone.
  - The stands continue north and south.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27536
      look: You see the West Stands.
    east:
      look: You see the action in Orcland's defensive zone.
    south:
      to: tba:275:room:27534
      look: You see the West Stands.

"tba:275:room:27536":
  name: The West Stands
  description:
  - >
    You are standing in the northern-most end of the West Stands. This is probably the worst location
    in WarDome to view the game, but the best place to eye the hometown cheerleaders.
  - The West Stands continue to the south, to the north is the northwest corner of WarDome.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:275:room:27537
      look: You see the northwest corner of WarDome.
    east:
      look: WOW!  Look at those gorgeous cheerleaders!
    south:
      to: tba:275:room:27535
      look: You see the West Stands.
  extras:
  - keywords: [cheerleaders]
    text: >
      This group of blondes, brunettes, and redheads is one of the most stunning you have ever seen. 
      These are the best that New Sparta has to offer.  It is just too bad you can't get a closer look (at
      least not from here).

"tba:275:room:27537":
  name: Northwest Corner Of The WarDome
  description:
  - >
    You are in perhaps the most quiet, desolate place in WarDome. Seldom does one come back here,
    except for the players and WarDome staff.
  - >
    The West Stands are to the south and to the east is WarVision, the stadium's extensive scoreboard.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:275:room:27538
      look: You see the back of the scoreboard.
    south:
      to: tba:275:room:27536
      look: You see the West Stands.

"tba:275:room:27538":
  name: Behind WarVision
  description:
  - >
    You stand, thoughtfully gazing at the incredible mass of electronic equipment composing WarVision,
    even though you are clueless to what any of it does.  To your north, you see the Home Locker room,
    which has been closed off to the public.
  - >
    The concourse behind the scoreboard continues east, to the west is the northwest corner of WarDome.
  sector: inside
  flags: [indoors]
  exits:
    north:
      look: You see the locked door to the Warriors' Locker room.  You do not see a keyhole.
      door:
        keywords: [door]
        kind: pickproof
        reset: locked
    east:
      to: tba:275:room:27539
      look: The concourse continues.
    south:
      look: >
        You see the intricate circuits of WarVision.  You realize you probably shouldn't touch them.
    west:
      to: tba:275:room:27537
      look: You see the northwest corner of WarDome.

"tba:275:room:27539":
  name: The Concourse Behind WarVision
  description: >
    You are walking behind WarVision in the vicinity of the players' locker rooms.  The concourse
    continues east and west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27540
      look: You see what you think is the end of the concourse.
    south:
      look: If only you were an electrical engineer!
    west:
      to: tba:275:room:27538
      look: The concourse continues.

"tba:275:room:27540":
  name: The End of the Concourse
  description:
  - >
    As you come to the end of the concourse, you find the entrance to the East Stands of WarDome -- the
    SuperBoxes.  Unfortunately, you are not permitted to go in as these are reserved for the very
    elite.  There is a sign on the door to the SuperBoxes.
  - >
    After getting over your disappointment (you always wanted to see the inside of a SuperBox), you
    notice that someone has rather carelessly left open the door to the Visitor's Locker room, just inviting
    someone to walk in.
  - The concourse runs west, to the north you may enter the locker- room.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:275:room:27541
      look: You see the open door to the Visitor's Locker room.
    east:
      look: You see a sign on the door to the SuperBoxes.
      door:
        keywords: [door]
        kind: pickproof
        reset: locked
    south:
      look: At this point, you are no longer impressed with WarVision.
    west:
      to: tba:275:room:27539
      look: The concourse continues.
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           ******************************************
           *                                        *
           *            WarDome SuperBoxes          *
           *            ------------------          *
           *    SuperBoxes reserved for only the    *
           *    very rich and privileged.  If you   *
           *    do not fall into these categories,  *
           *    then GET LOST!!!!!                  *
           *                       Thank you,       *
           *                       The Management   *
           *                                        *
           ******************************************

"tba:275:room:27541":
  name: The Visitor's Locker Room
  description:
  - >
    What you see (and smell) before you is the typical bloodball locker room, filled with tape, torn
    jerseys, mud, blood, and assorted pieces of equipment and body parts.
  - To the west is the shower room, to the south you exit onto the concourse.
  sector: inside
  flags: [indoors]
  exits:
    north:
      look: What a mess!
    east:
      look: What a mess!
    south:
      to: tba:275:room:27540
      look: You see the concourse.
    west:
      to: tba:275:room:27542
      look: You see the shower room.

"tba:275:room:27542":
  name: The Shower Room
  description: >
    You stand in a dim room that appears to be surprisingly decrepit for part of such a new building. 
    It seems doubtful that anyone actually showers here, as you'd probably only get more dirty attempting
    to. As you peer through what little light there is, you notice a loose grate in the far corner. 
    Letting curiosity get the best of you, you lift up the grate and find a long ladder descending into
    darkness.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:275:room:27541
      look: You see the locker room.
    down:
      look: You peer down into a dark, seemingly endless hole.

"tba:275:room:27543":
  name: The Blue Seats
  description:
  - >
    Ahh, the infamous Blue Seats.  These unrestricted stands are inhabited by the most loyal, die-hard
    fans you'll ever want to not meet.  Vile, sweaty, lewd, rude, crude, and usually drunk -- this is not
    the place to be for the faint of heart.
  - The Blue Seats continue to the east, to the west is the exit from WarDome.
  sector: city
  flags: [indoors]
  exits:
    north:
      look: You see the corner of the Warriors' end zone.
    east:
      to: tba:275:room:27544
      look: You see more Blue Seats.
    west:
      to: tba:275:room:27531
      look: You see the exit from WarDome.

"tba:275:room:27544":
  name: The Blue Seats
  description:
  - >
    You are in the middle of the Blue Seats--definitely dangerous territory.  But if you feel up for
    more of a challenge, you can climb down the steps leading towards the playing field.
  - The Blue Seats continue east and west, stairs go down to the field level.
  sector: city
  flags: [indoors]
  exits:
    north:
      look: You see the Warriors' end zone.
    east:
      to: tba:275:room:27545
      look: The Blue Seats continue.
    west:
      to: tba:275:room:27543
      look: The Blue Seats continue.
    down:
      to: tba:275:room:27547
      look: Steps lead down to the playing level.
  extras:
  - keywords: [steps]
    text: Many have ventured down these steps...  Not as many have returned.

"tba:275:room:27545":
  name: The Blue Seats
  description:
  - >
    You are standing in one of the raunchiest set of bleachers anyone has ever seen or heard.  You
    Clerics had better cover your ears.
  - The Blue Seats continue west.
  sector: city
  flags: [indoors]
  exits:
    north:
      look: You see the Warriors' end zone.
    west:
      to: tba:275:room:27544
      look: You see the Blue Seats.

"tba:275:room:27546":
  name: The Tunnel
  description:
  - >
    You stand at the end of a long tunnel, the long walk where the fearless gladiators collect their
    final thoughts before entering the battle zone.  There is a light at the end of the tunnel, beckoning
    you to enter.  You hear the roar or the crowd, and begin to feel your animalistic instincts rise
    inside of you. Can you take that long walk...?
  - Above you are the stands, to your east is the playing field.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:275:room:27548
      look: You see the gridiron awaiting you.
    up:
      to: tba:275:room:27534
      look: You see the stands above you.

