"tba:241:room:24114":
  name: Riker's Quarters
  description: >
    The room is very neat and tidy, with a couch and several chairs arranged around a coffee table by
    the eastern wall.  A small partition at the northern part of the room separates his sleeping area with
    the rest of the room.  Riker has been dimmed his room, making his romantic red lamps and purple
    cusions seems more exotic and appealing.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24113
      look: Cargo Bay 1 lies far to the west.
  triggers: [tba:241:trg:24111]

"tba:241:room:24115":
  name: Sick Bay
  description: >
    Here is the clinically clean sick bay.  About a dozen beds are arranged along the walls of the
    room, while several carts covered with medical supplies are scattered around the room.  A large glass
    window in the northern part of the room separates the doctor's office with the rest of the room.  Desite
    the seemingly random presentation of some of the equipment, Dr.  Crusher keeps everything well
    ordered and has a small well-trained medical staff at her disposal.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24116
      look: >
        Through the small glass windows in the automatical doors, you can see a plain-looking corridor.

"tba:241:room:24116":
  name: A Corridor
  description: >
    A long corridor reaches for quite some distance to the north and south, managing to look almost
    exactly like every other corridor on this ship.  The sick bay can be located to the west, and looking in
    an easterly direction can be seen the fourth holodeck.  These passages aren't very wide, and the
    light beige walls have been rounded, making the corridor an oval shape.  You see the holodeck's control
    panel beside the holodeck door, and it has some information on it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24119
      look: >
        The corridor continues North.  A pleasantly ordered corridor heads to the north and south.
    east:
      to: tba:241:room:24117
      look: Holodeck 4 lies to the east.
    south:
      to: tba:241:room:24113
      look: This corridor continues to the south.
    west:
      to: tba:241:room:24115
      look: >
        One of the most important parts of the ship lies in that direction.  How could a crew survive alien
        invasions without a sick bay?
  extras:
  - keywords: [holodeck, computer, control, panel, sign]
    text:
      preformatted: |2
           It looks like this:
        
            ***************************************************
            *                                                 *
            *            NCC-1701-D - "ENTERPRISE"            *
