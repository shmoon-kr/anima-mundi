"tba:241:room:24101":
  name: Geordi's Quarters
  description: >
    The most immediately noticable quirk of this chamber is the sparseness of its decorations. 
    Considering the fact that the owner is blind, it isn't at all strange to find that the room is almost
    completely bare, just the basics.  A small personal computer sits on a desk against the western wall, in
    between two windows that look out into space, not that it really matters.  A neatly made bed has been
    placed against the northern wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24102
      look: A well-lit corridor lies to the east.

"tba:241:room:24102":
  name: A Corridor
  description: >
    This is the southern end of a long hallway.  Like all of the ships internal passages, this one is
    well lit and pretty narrow.  To the south can be heard the continual rumbling of main engineering.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24105
      look: This corridor continues in a northernly direction.
    east:
      to: tba:241:room:24103
      look: >
        The android Data's quarters are located to the east, the almost constant home to his pet cat, Spot.
    south:
      to: tba:241:room:24100
      look: >
        Main engineering can be spotted to the south, one of the most important parts of a ship who's main
        mission is to explore.
    west:
      to: tba:241:room:24101
      look: Geordi's Quarters lie to the west, quite a simply decorated room, for obvious reasons.

"tba:241:room:24103":
  name: Data's Quarters
  description: >
    This room is fashioned in such a way that one would be almost unable to tell that it was designed
    by an android.  Some easels and paintings have been positioned along and on the northern wall,
    displaying Data's person expression of what he sees, which is mainly spacial phenomenon.  A huge computer
    screen showing a cross section of the Enterprise dominates the view to the south. In front of said
    screen is a large desk which boasts a wide array of computer controls.  What is quite perplexing is the
    lack of any sleeping facilities. Data apparently, does not need to sleep the same way we do.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24102
      look: An ordered-looking corridor lies to the west.

"tba:241:room:24104":
  name: The Brig
  description: >
    This area is very poorly lit.  The brig is where all of the criminals and prisoners are kept while
    onboard the Enterprise.  Three fairly large cells can been seen in the southern part of the room,
    defended with invisible laser bars. A computer control panel is situated in the northwestern corner of
    the room, which is where the force fields for the cells are controlled.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24105
      look: A long corridor can be spied to the east.

"tba:241:room:24105":
  name: A Corridor
  description: >
    The rest of this well-lit corridor stretches to the north and south with many doors to the east and
    west along it.  Very much like a tube, the light beige walls are narrow and have been rounded,
    throwing all memories of earth away. Right-angles are so 2020.  You notice a tiny computer panel embedded
    into the wall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24108
      look: The corridor heads northward, toward the turbolifts.
    east:
      to: tba:241:room:24106
      look: The transporter room can be found to the east.
    south:
      to: tba:241:room:24102
      look: This corridor continues to the south, leading eventually to main engineering.
    west:
      to: tba:241:room:24104
      look: The place where all criminals spend their time can be seen in that direction, the Brig.
  extras:
  - keywords: [control, panel, computer, screen, sign]
    text:
      preformatted: |2
           The panel says:
            ***************************************************
            *                                                 *
            *            NCC-1701-D - "ENTERPRISE"            *
            *                                                 *
            *              *****                              *
            *      **********************                     *
            *      ***********************  _________         *
            *              *****        ***(___  ____(        *
            *                            ***** \ \*           *
            *                             **********          *
            *                                                 *
            *          You are currently on deck 1            *
            *                                                 *
            ***************************************************

"tba:241:room:24106":
  name: Transporter Room
  description: >
    A computer terminal is sitting near the southern wall, where the transporter chief can control the
    multitude of machines that are used to give safe passage to those brave enough to risk using such an
    untested device.  Eight round transport pads have been arranged in a circle, on a raised platform
    just ot the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24142
      look: >
        The actual transporting chamber is located to the north.  Bright white and pale yellow lights pulse
        in from the north.
    west:
      to: tba:241:room:24105
      look: A corridor can be seen to the west, and beyond it, the Brig.
  extras:
  - keywords: [controls, computer, terminal, teleportor]
    text: >
      The teleportation console and controls look very complicated, but you can work out that you have to
      INPUT a locations co-ordinates and then ENERGIZE.
  triggers: [tba:241:trg:24100, tba:241:trg:24101]

"tba:241:room:24107":
  name: School
  description: >
    This is a relatively large room used for schooling the children onboard the ship.  There are a
    number of tables and chairs that have been positioned in an orderly fashion.  Several computer consoles
    with an interface specially designed for a childs use on them can be seen on the tables and some
    larger ones pertruding from the walls.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24108
      look: A corridor lies to the east, beyond it, the second holodeck.

"tba:241:room:24108":
  name: A Corridor
  description: >
    The corridor is heated at about room temperature, which is fitting for most of the species that
    live onboard.  Like all of the corridors, this one is well lit and not very wide.  You see the
    holodeck's control panel beside the holodeck door, and it has some information on it.  A computer screen with
    the map of the Enterprise on it is located next to the turbolift entrance.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24110
      look: >
        You can see the turbolift to the north.  New signs have been placed in all turbolifts to prevent
        improper use, this includes you Wesley.
    east:
      to: tba:241:room:24109
      look: A very empty-looking holodeck lies to the east, waiting for someon to program it.
    south:
      to: tba:241:room:24105
      look: This corridor continues to the south, eventually reaching main engineering.
    west:
      to: tba:241:room:24107
      look: Enterprise's school lies to the west, looking very neat and tidy.
  extras:
