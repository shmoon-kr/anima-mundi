"tba:241:room:24109":
  name: Holodeck 2
  description: >
    As soon as this room is entered, the enormity of it becomes very apparent. The room is just a large
    cube, with jet black walls and a yellow grid painted on the floors, the walls, and the ceiling. 
    This is where different programs can be loaded and experienced, which seem totally real.  A small
    instructional screen can be seen by the door.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:241:room:24108
      look: A corridor, and across the way, the school can be located to the west.
  extras:
  - keywords: [screen]
    text: >
      Holodeck Instructions: Holodecks work via vocal commands. They are as follows: Programs (will give
      you a list of programs) <name of program> (Will load up a pragram) Difficulty <difficulty> (Will set
      the difficulty to EASY, MEDIUM or HARD) Exit (Will make a door appear) (Note for some programs, there
      will be a limit of three credits which will restock every half hour or so)
  triggers: [tba:241:trg:24120, tba:241:trg:24127]

"tba:241:room:24110":
  name: Turbolift
  description: >
    A small screen above the door reads "Deck One".  The turbolift walls are a pleasant beige and have
    been rounded off, making it in the shape of a tube. Several vertical rows of lights make this place
    very well lit.  From here, you can access the other decks on the Enterprise.  There is a small
    instructional panel by the door.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:241:room:24108
      look: An automatic door opens to the south to reveal a long, sterile-looking corridor.
  extras:
  - keywords: [instructional, panel]
    text: >
      To operate the turbolift, say the name of the location you wish to get to: 'deck 1' (engineering,
      transporter, the brig and the school) 'deck 2' (Ten forward, sick bay and the security center) 'deck
      3' (the science labs, the gym and the main shuttle bay) 'deck 4' (The Bridge)
  triggers: [tba:241:trg:24102, tba:241:trg:24115]

"tba:241:room:24111":
  name: Turbolift
  description: >
    A small screen above the door reads "Deck Two".  The turbolift walls have been rounded off, making
    it in the shape of a tube.  Several vertical rows of lights make this place very well lit.  From
    here, you can access the other decks on the Enterprise.  There is a small instructional panel by the
    door.  Like a lot of the ship, the turbolift accepts vocal commands.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24113
      look: A corridor heads to the north, toward Ten Forward.
  extras:
  - keywords: [instructional, panel]
    text: >
      To operate the turbolift, say the name of the location you wish to get to: 'deck 1' (engineering,
      transporter, the brig and the school) 'deck 2' (Ten forward, sick bay and the security center) 'deck
      3' (the science labs, the gym and the main shuttle bay) 'deck 4' (The Bridge)
  triggers: [tba:241:trg:24102, tba:241:trg:24115]

"tba:241:room:24112":
  name: Cargo Bay 1
  description: >
    As to be expected, this bay is gigantic with a very high ceiling and a lot of floor space for the
    storage most various items, usually of the non-lethal kind. There are several plastic crates and
    barrels with the Starfleet insignia printed on their lids stacked up, almost right to the top.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24113
      look: A corridor can be seen to the east.

"tba:241:room:24113":
  name: A Corridor
  description: >
    The peaceful murmuring of the ships engines quietly resonate across the whole ship, not excluding
    this particular corridor.  It isn't very wide, and the light beige walls have been rounded, making the
    corridor an oval shape.  You notice a tiny computer panel embedded into the wall.  A computer screen
    with the map of the Enterprise on it is located next to the turbolift entrance.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24116
      look: A beige corridor continues to the north.
    east:
      to: tba:241:room:24114
      look: Commander Riker's private quarters are located to the east.
    south:
      to: tba:241:room:24111
      look: A high-tech looking turbolift glides effortlessly up and down the ship to the south.
    west:
      to: tba:241:room:24112
      look: A rather large cargo bay is to the west.
