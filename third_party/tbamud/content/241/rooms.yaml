"tba:241:room:24117":
  name: Holodeck 4 Entrance - A Narrow Alley
  description: >
    You emerge into a dark narrow alley. Tall dark brick buildings block your way north and south. You
    can see that the windows on the buildings are fairly high, and some have been boarded up. The smell
    from the rotting food and garbage mixing with the foul water on the ground is unbearable. You can hear
    the sounds of a bustling marketpace to the east. The archway leading out of the holodeck is west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24116
      look: >
        You think a corridor on the starship Enterprise lies to the west, but you can never be sure on a
        holodeck.

"tba:241:room:24118":
  name: Crusher's Quarters
  description: >
    This room is dimly lit and is decorated with red and pink cushions.  Several different paintings
    are attached to the walls and also quite a few sculptures are placed quite elegantly apon marble
    pillars.  A neatly made bed is located by the northern wall, in between two large windows looking out into
    space.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24119
      look: A slightly boring-looking corridor lies just to the east.

"tba:241:room:24119":
  name: A Corridor
  description: >
    The oval corridors flow into one another throughout the ship, allowing passage from deck to deck
    and room to room.  Unlike every other section of these stretches of well-lit, pale-colored hallways,
    one of the lights is on the blink and can't seem to decide whether it wants to be on or not.  The
    security station is location to the east where most of the ships weaponry is currently stored.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24121
      look: A wonderful place to relax and drink can be seen to the north, Ten Forward.
    east:
      to: tba:241:room:24120
      look: The security center is to the east.
    south:
      to: tba:241:room:24116
      look: This corridor leads to the south, toward a turbolift.
    west:
      to: tba:241:room:24118
      look: Dr.  Crusher's clean quarters are to the west.

"tba:241:room:24120":
  name: Enterprise Security
  description: >
    Like the brig, for a seeminly un-related reason, the heart of the Enterprise's security is a dimly
    lit room.  But, very much unlike anywhere else onboard, the whole chamber is surounded by weaponry
    lockers, except the northern wall.  A large glass window protects dozens of different phasers, blaster
    rifles and other high-tech devices of war.  Three long tables surrounded by chairs stretch across the
    room.  A top-privilege replicator stands to one side, only the memebers of security may use it.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:241:room:24119
      look: Beyond the red flashing lights by the entrance to this area can be seen, a corridor.
  triggers: [tba:241:trg:24119]

"tba:241:room:24121":
  name: Ten Forward
  description: >
    This is the center of the Enterprise's entertainment.  The entire northern wall is covered with
    windows looking out into space, while two large wooden doors with the Starfleet insignia stamped on them
    face south.  Many round metal tables are scattered around the room, surrounded by metal chairs.  A
    long bar spans almost the entire length of the southern part of the room, and about two dozen bar
    stools are sitting in front of it.  It's very noisy in here, due to all of the talking and laughing.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:241:room:24119
      look: A long corridor runs south from Ten Forward, through some wooden doors.

"tba:241:room:24122":
  name: Shuttle Bay
  description: >
    This is the main shuttle bay which is also used by the maintenance crew as a direct route to the
    ship's outer shell, when the ship is docked mind.  It's quite a large room, with a very high ceiling
    and a lot of floor space.  There are three different shuttle-crafts hovering just to the west, waiting
    to be flown into the very depths of space itself.  A large gray door leads into space, becareful
    about opening it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24124
      look: A corridor is North.
    south:
      to: tba:241:room:24139
      look: Some very large gray doors block the view north.
      door:
        keywords: [door, gray, doors]
        kind: door
        reset: closed
  extras:
  - keywords: [door]
    text: >
      The large gray shuttle bay door that leads into deep space.  Make sure you have a spacesuit in your
      inventory!
  triggers: [tba:241:trg:24121, tba:241:trg:24122, tba:241:trg:24123]

"tba:241:room:24123":
  name: Troi's Quarters
  description: >
    These quarters here have a calming and relaxing feel to them.  A great tranquil warmth pulses
    throughout the area, along with the sweet smell of herbs and scented candles.  Several different paintings
    have been hung from the walls, and a small couch and a recliner are positioned around a coffee
    table.  A neatly made bed is partially hidden behind a curtain at the northern part of the room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24124
      look: A normal-looking corridor is to the east.

"tba:241:room:24124":
  name: A corridor
  description: >
    The cylindrical corridors of this space vessel are all made from a plastic-like substance and are
    all colored in the same non-descript shade of beige.  A very war-like chamber can be spied to the
    east, whereas on the opposite side, a calming peace resides.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24127
      look: This corridor continues to the north, toward the turbolift.
    east:
      to: tba:241:room:24125
      look: Some very Klingon-like quarters can be seen to the east.
    south:
      to: tba:241:room:24122
      look: The main shuttle bay lies to the south.  Becareful.
    west:
      to: tba:241:room:24123
      look: Troi's peaceful quarters are to the west.
  extras:
  - keywords: [control, panel, computer, screen, sign]
    text:
      preformatted: |2
           The panel says:
        
            ***************************************************
            *                                                 *
            *            NCC-1701-D - "ENTERPRISE"            *
            *                                                 *
            *              *****                              *
            *      **********************                     *
            *      ***********************  _________         *
            *              *****        ***(___  ____(        *
            *                            ***** \ \*           *
            *                             **********          *
            *                                                 *
            *          You are currently on deck 3            *
            *                                                 *
            ***************************************************

"tba:241:room:24125":
  name: Worf's Quarters
  description: >
    These quarters belong to the wrathful presence of Worf, the ships only Klingon crew member.  A
    small table is sitting in the southeastern corner, and on it is a small potted plant.  An impressive
    selection of Klingon weapons have been mounted on the northern wall, and a partition splits this room
    with Worf's bedroom to the east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24124
      look: A gray-looking corridor is to the west.

"tba:241:room:24126":
  name: Enterprise Gym
  description: >
    You emerge into the Enterprise gym. The room is quite large, with a soft gray floor. A set of
    lockers against the southern wall contain all of the necessary equipment needed for using the gym. A thick
    stack of mats have been piled high in one corner, which can be used for different activities.
    Captain Picard likes to come here to practice his fencing.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24127
      look: >
        Captain Picard's quarters are position right next to the gym to take advantage of his enjoyment of
        fencing.

"tba:241:room:24127":
  name: A Corridor
  description: >
    You find yourself in the middle of a well lit corridor on the Enterprise. It isn't very wide, and
    the light beige walls have been rounded, making the corridor an oval shape.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24130
      look: A corridor continues to the north, before entering the tubolifts.
    east:
      to: tba:241:room:24128
      look: Captain Picard's quarters can be found to the east.
    south:
      to: tba:241:room:24124
      look: This corridor continues to the south.
    west:
      to: tba:241:room:24126
      look: >
        Enterprise's gym is to the west, slightly less used than would be expected. Why exercise here when
        you can get a good work-out in one of the holodecks?

"tba:241:room:24128":
  name: Picard's Quarters
  description: >
    It is clear by the orderly way everything has been arranged in the room that Captain Picard isn't
    very fond of visitors.  There are several different ancient artifacts on the shelves at the back of
    the room and on small pedestals near the entrance.  A large wardrobe, facing south contains his
    uniforms and general away-mission equipment.  A comfortable looking recliner with a matching footrest sits
    beside the door, along with a bright reading lamp and end table.  Two large windows offer a great view
    of space.  A small partition at the northern part of the room contains Picard's sleeping area.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24127
      look: You see a non-descript door that leads to a corridor no doubt.
  triggers: [tba:241:trg:24111]

"tba:241:room:24129":
  name: Science Lab
  description: >
    A strange looking machine sits in the middle of the room, up on a slightly raised platform.  It
    looks as though something (or someone) could be placed inside, hooked up to the multitude of wires and
    cables, and have scientific tests performed on it (or them).  A complex looking computer console is
    facing this machine.  Around the rest of the room are counterops with with the odd computer terminal.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24130
      look: A corridor lies to the east, through clear, bullet-proof plastic.

"tba:241:room:24130":
  name: A Corridor
  description: >
    This plain-looking and generally well-lit corridor stretches out of view in the northern and
    southern directions.  The main scientific laboratory is located to the west, caution is advised.  A massive
    cargo bay can be seen to the east, or would be if the doors were open.  A computer screen with the
    map of the Enterprise on it is located next to the turbolift entrance.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24132
      look: A turbolift is located to the north.
    east:
      to: tba:241:room:24131
      look: >
        Cargo Bay 2 can be seen to hte east as a vast room, filled almost to the ceiling with plastic
        crates.
    south:
      to: tba:241:room:24127
      look: A generally Star Trek-like corridor wanders southward.
    west:
      to: tba:241:room:24129
      look: The science lab can be seen to the west, through see-through doors.
  extras:
  - keywords: [map, screen]
    text:
      preformatted: |2
           STARSHIP ENTERPRISE
                                             |
                     Turbolift               |               Ten Forward
                         |                   |                    |
             School----****----Holodeck 2    |    Crusher's-----****----Security
                         |                   |    Quarters        |
                         |                   |                    |
               Brig----****---Transporter    |     Sick Bay-----****-----Holodeck 4
                         |       Room        |                    |
                         |                   |                    |
           Geordi's----****----Data's        |        Cargo-----****-----Riker's
           Quarters      |   Quarters        |         Bay        |     Quarters
                         |                   |                    |
                    Engineering              |                Turbolift
                                             |
                                             |
                      DECK 1                 |                DECK 2
        -------------------------------------+-----------------------------------------
                                             |
                                             |      Ready-----Bridge
                     Turbolift               |      Room          |
                         |                   |                    |
           Science-----****-----Cargo        |    Turbolift----Bridge-----Conference
             Lab         |       Bay         |                               Room
                         |                   |
               Gym-----****-----Picard's     |
                         |      Quarters     |
                         |                   |
            Troi's-----****-----Worf's       |
          Quarters       |     Quarters      |
                         |                   |
                     Shuttle Bay             |
                                             |
                                             |
                      DECK 3                 |                DECK 4

"tba:241:room:24131":
  name: Cargo Bay 2
  description: >
    You're in the cargo bay 2 of the Enterprise.  It's quite a large room, with a very high ceiling and
    a lot of floor space.  Several hundred plastic crates and barrels with the Starfleet insignia on
    them stacked right up to the ceiling.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24130
      look: The colorless doors of the science lab lie a sort distance to the west.

"tba:241:room:24132":
  name: Turbolift
  description: >
    A small screen above the door reads "Deck Three".  The turbolift walls have been rounded off,
    making it in the shape of a tube.  Several vertical rows of lights make this place very well lit.  From
    here, you can access the other decks on the Enterprise.  There is a small instructional panel by the
    door.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:241:room:24130
      look: A long corridor leads toward the main shuttle bay.
  extras:
  - keywords: [instructional, panel]
    text: >
      To operate the turbolift, say the name of the location you wish to get to: 'deck 1' (engineering,
      transporter, the brig and the school) 'deck 2' (Ten forward, sick bay and the security center) 'deck
      3' (the science labs, the gym and the main shuttle bay) 'deck 4' (The Bridge)
  triggers: [tba:241:trg:24102, tba:241:trg:24115]

"tba:241:room:24133":
  name: Turbolift
  description: >
    A small screen above the door reads "Deck Four".  The turbolift walls have been rounded off, making
    it in the shape of a tube.  Several vertical rows of lights make this place very well lit.  From
    here, you can access the other decks on the Enterprise.  There is a small instructional panel by the
    door.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24136
      look: >
        You can see the very respectable-looking main bridge.  It is forbidden for non-crew personnel or
        non-ambassadors to step past this threshhold.
  extras:
  - keywords: [instructional, panel]
    text: >
      To operate the turbolift, say the name of the location you wish to get to: 'deck 1' (engineering,
      transporter, the brig and the school) 'deck 2' (Ten forward, sick bay and the security center) 'deck
      3' (the science labs, the gym and the main shuttle bay) 'deck 4' (The Bridge)
  triggers: [tba:241:trg:24102, tba:241:trg:24115]

"tba:241:room:24134":
  name: Turbolift
  description: >
    The turbolift walls have been rounded off, making it in the shape of a tube. Several vertical rows
    of lights make this place very well lit.  From here, you can access theother decks on the Enterprise.
  sector: inside
  flags: [indoors]

"tba:241:room:24135":
  name: Picard's Ready Room
  description: >
    In Captain Picard's ready room, a long couch has been placed beside the door, while a large U
    shaped desk is located by the northern wall.  A small computer screen is sitting on the desk, as well as
    several other papers and documents. A single high window beside the desk looks into space, and a fish
    tank is located in the northwestern corner of the room.  This is where the Captain makes all of his
    important decisions.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:241:room:24138
      look: The main bridge lies to the east, where most of the action takes place.

"tba:241:room:24136":
  name: Main Bridge - Upper Half
  description: >
    You find yourself on the upper half of the main bridge of the USS Enterprise. Directly in front of
    you is a thick railing that contains many different computer panels used for the tactical systems of
    the ship. The entire southern wall is covered with computer consoles, where the ship's main systems
    are controlled. Two small curved ramps on either side of the room lead north to the lower part of the
    bridge, and a large circular skylight shows the space outside the ship.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24138
      look: The lower half of the main bridge is to the north.
    east:
      to: tba:241:room:24137
      look: >
        The conference room can be seen to the east.  Very important meetings take place there, obviously.
    west:
      to: tba:241:room:24133
      look: A smart-looking turbolift jets people all around the ship to the west.

"tba:241:room:24137":
  name: Conference Room
  description: >
    A large glass rectangular table sits in the middle of the room, surrounded by about a dozen
    comfortable looking office chairs, one for each member of the senior staff.  The entire eastern wall is
    covered with windows, looking out into space.  Because of the vast expanse of space which is viewed
    eastern wall, this room appears to be very dark, which is a good atmosphere for discussing the many
    important issues that are the everyday of the crew.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:241:room:24136
      look: The main bridge can be seen to the west.

"tba:241:room:24138":
  name: Main Bridge - Lower Half
  description: >
    You find yourself on the lower half of the main bridge of the USS Enterprise. An enormous view
    screen covers almost the entire northern wall, and is currently displaying a view of the stars rushing
    by. Three large chairs in the northern part of the room, in front of the railing, face the screen. This
    is where the Captain, Commander Riker, and Counselor Troi sit. Two computer consoles with built in
    chairs rest about ten feet in front of the chairs, also facing the view screen. This is where the
    ship's pilot and information officer sit.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:241:room:24136
      look: The upper half of the main bridge is to the south.
    west:
      to: tba:241:room:24135
      look: >
        Captain Picard's ready room is to the west.  Access is granted only on permission by the captain.

"tba:241:room:24139":
  name: Outer Space by the Enterprise
  description: >
    You are floating in outerspace, right beside the USS Enterprise.  Billions of stars glitter and
    sparkle from every direction, originating from the vast expanses of deep space.  Without a spacesuit,
    one would surely perish out here. A large gray door leads into the Enterprise's Shuttle Bay.
  sector: underwater
  exits:
    north:
      to: tba:241:room:24122
      look: The Shuttle Bay is North.
      door:
        keywords: [door, doors, gray]
        kind: door
        reset: closed
    up:
      to: tba:241:room:24140
      look: All you can see is the massive expanse of deep space.
  triggers: [tba:241:trg:24107]

"tba:241:room:24140":
  name: Outer Space
  description: >
    The USS Enterprise is a short distance away, slowly moving at a quarter-impulse.  Many thousand,
    thousand stars dominate the view in every direction apart from to the north, where a large red star is
    going super-nova.
  sector: underwater
  exits:
    up:
      to: tba:241:room:24141
      look: >
        Millions upon millions of stars slowly burn and radiate their light throughout the universe.
    down:
      to: tba:241:room:24139
      look: The USS Enterprise can be seen, a small distance away.
  triggers: [tba:241:trg:24107]

"tba:241:room:24141":
  name: Outer Space
  description: >
    You are nearing deep-space, the cold and desolate enormity that has boggled the minds of all
    sentient beings since the begining of time.  The USS Enterprise can be spied, some distance away.
  sector: underwater
  exits:
    down:
      to: tba:241:room:24140
      look: >
        Far away, the USS Enterprise can be spied.  A large red planet peacefully orbits it's dying sun.
  triggers: [tba:241:trg:24107]

"tba:241:room:24142":
  name: Transporter Beam
  description: >
    This section of the transportation deck is where the actual teleportation occurs.  The chamber is
    perfectly round and quite tall, to house the round pads on the floor.  Everything is the most
    brilliant of white, excepting the blinking red lights on the floor and the blue ones on the ceiling.  When
    activated, the whole area flashes the same color as the walls, which only server to intensify the
    bright beams.
  sector: underwater
  exits:
    south:
      to: tba:241:room:24106
      look: >
        The computers that give this machine life, live to the south.  Becareful with everything around
        this area, a transporter can be a very dangerous thing indeed!

"tba:241:room:24143":
  name: Alien World
  description: >
    This part of the alien world appears to be a clearing in the middle of a mutated forest.  What go
    for trees here are tall, circular pyramid type structures with three or four basin-like layers.  The
    grass is purple, the sky is a deep crimson and the clouds are a hideous yellow.  A small watch-tower
    stands just to the north, fallen into disrepair.
  sector: inside
  triggers: [tba:241:trg:24126, tba:241:trg:24125, tba:241:trg:24127]

"tba:241:room:24144":
  name: A Private Detective's Office
  description: >
    The wall is papered in a plain brown to match the shade of the polished wooden floor.  A large
    window is partially blinded to the south, and has a view of the streets below.  A hat-stand is positioned
    to the side of the door to the north, which has a small frosted-glass panel with an advertisement on
    the outside.  A large cluttered desk lies underneath the window facing the door with the chair quite
    some distance away, looking like it's used to lean back quite frequently.  A quaint little clock
    hangs on the wall.
  sector: inside
  flags: [indoors, peaceful]
  extras:
  - keywords: [desk]
    text: >
      The desk is pretty cluttered.  Among the many items on the desk is a name-plaque, a circular-dial
      telephone and a black ink-pen.
  triggers: [tba:241:trg:24124, tba:241:trg:24127, tba:241:trg:24128, tba:241:trg:24129]

"tba:241:room:24145":
  name: A Genetic Scientific Laboratory
  description: >
    Everything is white or silver and kept perfectly clean.  Many chemicals are layed out in a specific
    order all around the room on laboratory tables.  There is a large dentist-like chair in the center
    of the room.  It's slightly longer and is suited more for being left in a horizontal configuration. 
    There are loops of metal encircling it, each with complex computer circuits and scanning equipment. 
    To the east are four large, circular booths, about the size of a shower.  Three of them contain what
    appear to be half-human beings, the fourth is empty.
  sector: inside
  flags: [indoors, peaceful]
  triggers: [tba:241:trg:24124, tba:241:trg:24127]
