# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 241.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:241:room:24100":
  name: Main Engineering
  description: >
    The gentle murmur of the engine rumbles perpetually throughout these rooms. Various colored lights
    flash and blink on their respective panels, keeping track of things like the warp core temperature,
    current speed and the ship's shield specifications.  The room is longer than it is wide, and it has
    fairly low ceilings.  Computer terminals cover all the walls, and a large table built into the floor
    sits in the middle of the room.  Located at the far end of the room is the warp core, a large pulsating
    vertical tube.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:241:room:24102
      look: A non-descript corridor stretches far to the north.
  extras:
  - keywords: [maps]
    text:
      preformatted: |2
           STARSHIP ENTERPRISE
                     Turbolift               |                Ten Forward
                       1010                  |                  1021
                         |                   |                     |
              School---1008----Holodeck 2    |     Crusher's-----1019----Security
