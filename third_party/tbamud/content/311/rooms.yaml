"tba:311:room:31141":
  name: The Entry Into a Smaller Cave
  description: >
    The cave before you is by no means small, however it is smaller in size by far than the rest of the
    caves which dot this cliffside.  The entryway is blackened and scorched from DragonFire and
    extremely cluttered with old scales and sloughed skin.  The bones of old meals lie strewn about the entrance,
    looking as they were attempted to be pushed out to fall onto the plains below, but the effort was
    only half-attempted.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:311:room:31196
    south:
      to: tba:311:room:31142
    down:
      to: tba:311:room:31149

"tba:311:room:31142":
  name: Flying the Teeth
  description: >
    The cliff's base lies still far below, a considerable drop for even a winged creature.  The cliff
    is of the smoothest rock, as if carefully carved and sanded by an expert sculptor.  The entryways into
    the caves which dot this cliff face are easily found, from any vantage point.  Just north of here is
    the entrance into one of the caves.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31141
    south:
      to: tba:311:room:31143
    up:
      to: tba:311:room:31134
    down:
      to: tba:311:room:31150

