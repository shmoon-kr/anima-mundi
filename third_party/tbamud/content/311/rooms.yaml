"tba:311:room:31114":
  name: An Outcrop of Rock
  description: >
    A way up from here leads to what looks to be the perch and home of what could only be a dragon. 
    Sooty refuse spills from the opening of a cave just above you, a solid stain of black runing down the
    rock , dwindling into the cliff face below, soaking into the rock.
  sector: inside
  flags: [no_track]
  exits:
    up:
      to: tba:311:room:31115
    down:
      to: tba:311:room:31113

"tba:311:room:31115":
  name: An Entrance Into an Enormous Cavern
  description: >
    This is by far the largest and most intimidating cave along the Dragon's Teeth.  That is not to say
    that the rest of the caves which dot the cliffside are not fairly imposing and fearsome, but they
    most certainly pale in comparison to the amazing size of this cave.  The entrance is at least fifty
    feet in height and twice as wide, if not more.  A steady sound from within leads you to believe that
    someone is probably home.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:311:room:31168
    down:
      to: tba:311:room:31114

"tba:311:room:31116":
  name: An Opening in the Cliff Face
  description: >
    A dark cave leads away into the recesses of the mountain, one that is more than probably the home
    to a creature that is best left to itself.  A very warm and humid waft of air comes from the cave, a
    thick, breathy surge of air which does nothing to make the place seem any more welcoming.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:311:room:31176
    south:
      to: tba:311:room:31117
    down:
      to: tba:311:room:31125

"tba:311:room:31117":
  name: Along the Dragon's Teeth, Flying in Midair
  description: >
    The rock of the mountain is solid and unyielding, allowing for you to travel along its face but
    offering no spots upon which to rest or get your bearings. Just north of here is the entrance into an
    opening in the rock, but it does not look like the sort of place that you might be able to rest a spell.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31116
    south:
      to: tba:311:room:31118
    up:
      to: tba:311:room:31107
    down:
      to: tba:311:room:31126

"tba:311:room:31118":
  name: Along the Dragon's Teeth, Flying in Midair
  description: >
    The world appears very perfect and organized from this height - no signs of strife, war or trouble
    can be seen from this height, nor can the ordinary sounds of the world going by.  It would be a very
    peaceful place to be if you weren't flying hundreds of feet above the surface of the world snuggled
    against a cliff face which is riddled with Dragon Caves.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31117
    south:
      to: tba:311:room:31119
    up:
      to: tba:311:room:31108
    down:
