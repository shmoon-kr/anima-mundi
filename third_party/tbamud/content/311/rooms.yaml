"tba:311:room:31111":
  name: The Upper Reaches of the Dragon's Teeth at a Cave Entrance
  description: >
    Spendor of the vista below is instantly forgotten as you come to the entrance to this awful place. 
    A foul, foul stench billows forth in gusts from the interior to this cave, the walls and floor of
    the rock itself layered in a thick, oozing black goo.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31110
    east:
      to: tba:311:room:31180
