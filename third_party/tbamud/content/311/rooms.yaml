"tba:311:room:31133":
  name: At a Polished Cave Entrance
  description: >
    The entryway into this cave is not black and fire-ravaged as most of the other cave entrances on
    the Teeth are, but clear of debris and clean.  A slow trickle of water runs from the interior of the
    cave, a cold draft accompanying it.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31132
    east:
      to: tba:311:room:31184
    up:
      to: tba:311:room:31124

"tba:311:room:31134":
  name: Flying Along the Face of the Dragon's Teeth
  description: >
    The grassy plains below are still many hundreds of feet down from your current altitude, the
    castles and keeps of the land still but small dots, their features undescernable.  It is a steady climb
    down the cliff, one that would probably not take long . To the south is the entryway into a blackened
    cave.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31135
    up:
      to: tba:311:room:31126
    down:
      to: tba:311:room:31142

"tba:311:room:31135":
  name: Entryway Into a Dark Cave
  description: >
    The cave itself is extremely dark inside, not lights whatsoever shine from within.  The rock around
    the edges of the entrance are black and melted from countless bouts of DragonFire being blasted
    against it.
  sector: inside
  flags: [no_track]
