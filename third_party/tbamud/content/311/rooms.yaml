"tba:311:room:31157":
  name: Near Ground Level - in Midair
  description: >
    The details of what lies below are a bit more easily seen from this low height, the stone
    fortification below is a walled keep.  It doesn't look very large, however it does appear to be constructed
    for the purpose of defense. Defense against what?  Or who?
  sector: inside
  flags: [no_mob, no_track]
  exits:
    south:
      to: tba:311:room:31158
    up:
      to: tba:311:room:31151
