# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 311.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:311:room:31100":
  name: Behind the Waterfall
  description: >
    The water cascades down just south of here, pouring into the reservoir used by the farmers of the
    Ofingian farmlands.  A long, narrow tunnel heads straight west toward a very bright source of light,
    one which is blinding to look upon without shading one's eyes.
  sector: inside
  flags: [indoors, soundproof, tunnel]
  exits:
    west:
      to: tba:311:room:31101

"tba:311:room:31101":
  name: Through the Mountain
  description: >
    The weight of an entire mountain enfolds all about you, the immensity and sheer presence of such a
    sizable force as a mountain forces itself into your awareness.  The way west leads toward the bright
    light, an opening into another section of the world, cut off from the rest of the world by the
    impassable mountain which you currently travel through.  Just east of here is the falling water of the
    waterfall which runs down into the reservoir in the Ofingian farmlands.
  sector: inside
  flags: [indoors, soundproof, tunnel]
  exits:
    east:
      to: tba:311:room:31100
    west:
      to: tba:311:room:31102

"tba:311:room:31102":
  name: Halfway Through the Mountain
  description: >
    Squinting against the light coming from the western opening in this tunnel, you begin to finally
    get used to the dimness of the cavern combined with the glare from the light coming from the other
    opening.  Scorch-marks riddle the walls of the tunnel, a thick, black, phospherous soot glazes the walls,
    dwindling away to the east but getting quite thick closer toward the western exit.  Some sort of
    fire was blasted into this tunnel - and more than once.
  sector: inside
  flags: [indoors, soundproof, tunnel]
  exits:
    east:
      to: tba:311:room:31101
    west:
      to: tba:311:room:31103

"tba:311:room:31103":
  name: Just East of the Western Exit
  description: >
    The light blasting in from the opening just west of here is now not only bright, but warm as well -
    almost painfully so.  Shielding your eyes from the bright rays does not help to give you any more of
    a clear picture of what might lie beyond the exit of that blinding hole, it is much too bright.  The
    way to the east is dim, yet for some reason exudes much less of a dangerous vibe than the way west.
  sector: inside
  flags: [indoors, soundproof, tunnel]
  exits:
    east:
      to: tba:311:room:31102
    west:
      to: tba:311:room:31104

"tba:311:room:31104":
  name: The Northern Exit
  description: >
    There is absolutely no way to describe the feeling of coming to the opening of a cave to find
    yourself standing well over five hundred feet up from any sort of solid ground.  The cave 'entrance' is
    nothing more than a hole in a cliff face - a cliff which rises far above the green grasslands which it
    borders the east side of, very far.  Unless you can fly, the only way you might have the chance at
    getting down below into those grasslands is if you hitch a ride on a passing dragon - and that is just
    not likely to happen.  Looking directly down from where you perch, you see a small (or is it small,
    it could just appear that way from this height) fortress nestled quite close up to the cliff face.
  sector: inside
  flags: [indoors, soundproof, tunnel]
  exits:
    east:
      to: tba:311:room:31103
    west:
      to: tba:311:room:31105

"tba:311:room:31105":
  name: High Along the Dragon's Teeth - In Midair
  description: >
    A very large and very foreboding cave entrance lies to the south, the blackened rock which borders
    the entrance testament to what lives within.  This is the highest point that can be reached along the
    cliff face, the only way to go from here is horizontal or down.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31106
    down:
      to: tba:311:room:31108

"tba:311:room:31106":
  name: High Along the Dragon's Teeth - In Midair
  description: >
    The entrance to a cave lies to the east.  It is most certainly very solid ground upon which to
    tread, better than the hazardous way of travel which you currently employ, but the fact that the rock
    entryway into the cave is scorched and melted and strewn about with rotted dragonscales is a definite
    turn-off.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31105
    east:
      to: tba:311:room:31172
    down:
      to: tba:311:room:31109

"tba:311:room:31107":
  name: The Upper Reaches of the Dragon's Teeth
  description: >
    This is close to the highest point that this cliff face spans, the plains below a very
    well-organized place of sectioned farming areas and forests, the castles and keeps which dot the land mere
    specks.  Far away to the west is the glistening water of an ocean or sea, one which is as blue and clear as
    the sky above.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31108
    down:
      to: tba:311:room:31117

