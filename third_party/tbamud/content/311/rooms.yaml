"tba:311:room:31168":
  name: Entrance into a Black Cave
  description: >
    Everything instantly goes dark as you enter into this cave, even the glaring bright light of the
    sun just to the west is immediately shut out.  Feeling along the walls, you find that the cave
    continues westward, deeper into the hard rock of the mountain.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31169
    west:
      to: tba:311:room:31115

"tba:311:room:31169":
  name: In a Darkened Cave
  description: >
    Nothing can be seen, not the walls, nor the floor, nor you hand were you to hold it directly before
    your eyes.  It can only be that the darkness of this place is magical in nature, a cloak of
    obscurity maintained by the resident so that intruders might never have the upper hand.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31170
    west:
      to: tba:311:room:31168

"tba:311:room:31170":
  name: A Feeling of Immensity
  description: >
    Upon entering into this room, an immediate feeling of vast size seeps into your awareness.  You are
    no longer in a long tunnel but in a vast room with a great amount of space.  The steady sound of
    some sort of deep, heavy wind can be heard.  Or is that breathing?
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:311:room:31171
    west:
      to: tba:311:room:31169

"tba:311:room:31171":
  name: A Feeling of Immensity
  description: >
    Upon entering into this room, an immediate feeling of vast size seeps into your awareness.  You are
    no longer in a long tunnel but in a vast room with a great amount of space.  The steady sound of
    some sort of deep, heavy wind can be heard.  Or is that breathing?
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:311:room:31170

"tba:311:room:31172":
  name: Entrance to a Dragon's Cave
  description: >
    This can be nothing else than the home of a dragon.  The evidence is scattered all about your feet
    in the form of thick dragonscales and the shattered bones of animals and people which fell prey to
    the appetite of the monster within.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31173
    west:
      to: tba:311:room:31106

"tba:311:room:31173":
  name: A Hot, Humid Cave
  description: >
    The temperature inside this rough-hewn cavern is markedly higher in temperature than it is outside
    in the fresh, bright air.  It is not dark, although the light which permeates this place is a
    red-hued, onholy light which flickers and twists almost as if alive, like that of fire.  The passage runs
    deeper into the mountain or ends just west of here in open air.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:311:room:31174
    west:
      to: tba:311:room:31172

"tba:311:room:31174":
  name: Lair of the Red Dragon
  description: >
    This huge room is the antechamber to the main room in which resides a very large, and very
    mean-looking red dragon.  Its heaving flanks can be seen from this area of the cave, its deep, malevolent
    black eyes fixed squarely on you, bearing down into your soul.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:311:room:31173
    east:
      to: tba:311:room:31175

"tba:311:room:31175":
  name: Lair of the Red Dragon
  description: >
    The walls of this emormous room glow in amber hues, a reflecting light that makes concentration
    fairly difficult.  Most of the floor of the room is clear of any sort of debris, as the dragon which
    makes his home here needs a large amount of space to stretch out and relax when he is slumbering.  All
    along the edge of the floor lies strewn bits and pieces of old meals, bones, treasure and other
    various objects.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:311:room:31174

"tba:311:room:31176":
  name: A Humid Cave Entrance
  description: >
    Standing within the conifines of this wide, arched cave entrance you feel an immediate change in
    the quality of the air about you.  It has become thick, warm and heavy to breathe.  It almost seems as
    if you might be able to see your breath, so thick it feels as it issues from your mouth.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31177
    west:
      to: tba:311:room:31116

"tba:311:room:31177":
  name: A Humid Cave
  description: >
    There is an almost pleasant, steady light pervading the inner depths of this cave, one that does
    not really give off any uneasy or dangerous vibes.  The cavern slopes downward a bit before entering
    into a very large room just east of here.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31178
    west:
      to: tba:311:room:31176

"tba:311:room:31178":
  name: Lair of the Blue Dragon
  description: >
    All of the glory and majesty that is a dragon is personified by this enormous room which is the
    home of just such a creature.  The walls glow a strange, blue light which contrasts with the hot, thick
    air which infests this place.  Heaps of all manner of odds and ends, valuable and otherwise, litter
    the floors of the place.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:311:room:31179
    west:
      to: tba:311:room:31177

"tba:311:room:31179":
  name: Lair of the Blue Dragon
  description: >
    All of the glory and majesty that is a dragon is personified by this enormous room which is the
    home of just such a creature.  The walls glow a strange, blue light which contrasts with the hot, thick
    air which infests this place.  Heaps of all manner of odds and ends, valuable and otherwise, litter
    the floors of the place.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:311:room:31178

"tba:311:room:31180":
  name: Cave Entrance
  description: >
    A terribly nasty odor envelopes you as you step foot into the entryway to this place.  A thick,
    black goo covers the floor of the cave and sticks to your feet, making your footing treacherous to say
    the least.  Darkness and death lay within - beware.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31181
    west:
      to: tba:311:room:31111

"tba:311:room:31181":
  name: Slimy Cave
  description: >
    The denizen of this large cave has to be the most distusting form of life that this world could
    house.  The black goo which was only on the floor at the entryway now covers the walls and ceiling, as
    if spattered and splashed by something very large - and the smell, the smell is indescribable.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31182
    west:
      to: tba:311:room:31180

"tba:311:room:31182":
  name: A Slimy Bend
  description: >
    The cave makes a sharp bend, opening into a an enormous room within which lies the lair of a green
    dragon.  The oozing slime covers not only in a layer on the floor but covering everything in a thick,
    three to four inch pool of the stuff.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:311:room:31183
    west:
      to: tba:311:room:31181

"tba:311:room:31183":
  name: Lair of the Green Dragon
  description: >
    The smell of this room is repulsive, a fetid, old, nasty reek that assaults your nostrils and holds
    you hostage by its stench.  Your feet stick to the floor, mired down by a thick, black, gooey
    substance which coats the entire cavern.  Heaps of junk, treasure, and bones lie scattered and jumbled,
    covered in the goo all about the room.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:311:room:31182

"tba:311:room:31184":
  name: Cold, Wet Cave Entrance
  description: >
    A steady trickle of clear water runs from the interior of the cave, running down in a rivulet out
    the edge of the entrance and down the cliff face to the plains below.  Cold air blows from the depths
    of the cave, a frigid, odd air that smacks of the unnatural.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31185
    west:
      to: tba:311:room:31133

"tba:311:room:31185":
  name: A Cold Cave
  description: >
    As you get deeper into the cave, the air gets colder and colder.  Every step take the temperature
    down by at least ten degrees, making your face begin to numb.  Just ahead is a huge cavern room draped
    in icicles and frost.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31186
    west:
      to: tba:311:room:31184

"tba:311:room:31186":
  name: The Frost Cavern
  description: >
    This can only be the lair of a white dragon, a very feared predator who's anger and evil is matched
    only by a very select few of its cousins.  Frost coats the walls, iced over in many places to a
    thick, white sheen.  Stalagtites are replaced by sharp spikes of ice which have dripped to form gigantic
    icicles.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:311:room:31187
    west:
      to: tba:311:room:31185

"tba:311:room:31187":
  name: The Frost Cavern
  description: >
    This can only be the lair of a white dragon, a very feared predator who's anger and evil is matched
    only by a very select few of its cousins.  Frost coats the walls, iced over in many places to a
    thick, white sheen.  Stalagtites are replaced by sharp spikes of ice which have dripped to form gigantic
    icicles.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:311:room:31186

"tba:311:room:31188":
  name: Entrance to a Glowing Cave
  description: >
    An odd glow comes from the inside of the cave, a strange light that seems both steady and fragile,
    as it flickering but not really flickering.  The walls of the entrance are blackened and scorched,
    but only at this front area.  Just a bit further in, the walls of the cave are smooth and clean.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31189
    west:
      to: tba:311:room:31139

"tba:311:room:31189":
  name: A Glowing Cave
  description: >
    A huge, gleaming cave lies only a few steps from here, its walls covered in glowing, clear shards
    of crystal which are melted into the walls, embedded by the strong heat.  The exit to this place lies
    just to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:311:room:31190
    west:
      to: tba:311:room:31188

"tba:311:room:31190":
  name: Lair of the Crystal Dragon
  description: >
    The glow from the walls makes your vision swim a bit before coming into focus, the glimmer and
    gleam of so much clear crystal reflecting light from one wall to another.  The place is a wonder - the
    dragon which resides here must have spent many years collecting the shards to make this place
    completely enclosed in the glimmering glow of so much crystal.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:311:room:31191
    west:
      to: tba:311:room:31189

"tba:311:room:31191":
  name: Lair of the Crystal Dragon
  description: >
    The glow from the walls makes your vision swim a bit before coming into focus, the glimmer and
    gleam of so much clear crystal reflecting light from one wall to another.  The place is a wonder - the
    dragon which resides here must have spent many years collecting the shards to make this place
    completely enclosed in the glimmering glow of so much crystal.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:311:room:31190

"tba:311:room:31192":
  name: Entrance to the Emerald Cave
  description: >
    A green glow comes from the innards of the cave before you, a powerful emanation of strength and
    wealth.  All but the green glow is completely dark, the glow making the entire scene before you seem
    surreal, otherwordly.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31193
    west:
      to: tba:311:room:31135

"tba:311:room:31193":
  name: In an Emerald Cave
  description: >
    A huge chamber lies just to the east, the source of the green glow which could be seen from outside
    the cave.  All manner of treasure, mostly precious gems, lie scattered about in heaps all over the
    floor of the room.  This is obviously the home of a dragon - best to be extremely cautious.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31194
    west:
      to: tba:311:room:31192

"tba:311:room:31194":
  name: The Emerald Lair
  description: >
    This is the home of a great Emerald Dragon, one of very few still exist anywhere in the world.  The
    walls are aglow with a greenish light which comes mostly from the many emeralds which are embedded
    in the rock, melted and scorched there by the dragon's killing breath.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:311:room:31195
    west:
      to: tba:311:room:31193

"tba:311:room:31195":
  name: The Emerald Lair
  description: >
    This is the home of a great Emerald Dragon, one of very few still exist anywhere in the world.  The
    walls are aglow with a greenish light which comes mostly from the many emeralds which are embedded
    in the rock, melted and scorched there by the dragon's killing breath.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:311:room:31194

"tba:311:room:31196":
  name: A Smaller Cave Entrance
  description: >
    Smaller.  Smaller meaning only twenty feet high and thirty feet wide.  Do not be fooled.  The
    creature which resides within is no easy kill.  The scorch marks which riddle the walls of the cave all
    the way through give testament to the fact the caution would be well advised.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31197
    west:
      to: tba:311:room:31141

"tba:311:room:31197":
  name: A Scorched Cave
  description: >
    The blast marks from the fires that seem to be a common theme with all of these caves on the
    Dragon's Teeth seem to be much more pronounced in this cave, the scorchings running all the way back into
    the large room which is just to the east of here.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:311:room:31198
    west:
      to: tba:311:room:31196

"tba:311:room:31198":
  name: Fire-Blasted Cavern
  description: >
    From all appearances, this huge room has been the site of many ferocious battles.  The walls are
    scorched and covered in blackish soot, the floors a riddle of claws gouges and blood-stains.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:311:room:31199
    west:
      to: tba:311:room:31197

"tba:311:room:31199":
  name: Fire-Blasted Cavern
  description: >
    From all appearances, this huge room has been the site of many ferocious battles.  The walls are
