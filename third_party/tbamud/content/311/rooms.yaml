"tba:311:room:31163":
  name: Flying Just Above the Ground on the Cliff Face
  description: >
    There is only one area that looks any good at all to 'land' on the ground below, and it lies to the
    south a short distance.  Everything other place below is strewn with waste from the dragons which
    reside above, their old scales and the bones from meals long past lie in heaps upon the ground, not to
    mention a sickly black oozing substance - almost like tar - which coats much of the refuse and the
    ground.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31164
    up:
      to: tba:311:room:31157

