    south:
      to: tba:311:room:31165
    up:
      to: tba:311:room:31158

"tba:311:room:31165":
  name: In Midair Above a Guard Post
  description: >
    It seems that you are not the only one who might have occassion to explore this land, and it
    appears that many who have come before you might have been less than friendly.  Of course, it could be that
    the people below who the entry into their land might be the unfriendly ones.  Only one way to find
    out...
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:311:room:31164
    south:
      to: tba:311:room:31166
    up:
      to: tba:311:room:31159

