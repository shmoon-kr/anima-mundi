"tba:311:room:31125":
  name: In Midair, Skirting the Dragon's Teeth
  description: >
    The cliff face itself is far too sheer, too smooth to afford any sort of handholds or foot wedges. 
    Flying through the air, moving yourself with not only your will but your hands as you pull yourself
    along the cliff wall, you chance to look down and realize that its probably a good idea if the fly
    spell you make use of is regularly maintained.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31126
    up:
      to: tba:311:room:31116

