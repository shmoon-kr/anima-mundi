"tba:311:room:31149":
  name: In Midair Along the Cliff Face
  description: >
    The cliffs climb high above to heights which are dizzying.  There are cave entrances dotting the
    cliffside at irregular intervals, nearly every one of them marked by a blackening of the rock around
    their openings, a scorched, dirty look.  One of those very caves lies just above you.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:311:room:31150
    up:
      to: tba:311:room:31141

