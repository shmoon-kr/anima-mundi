"tba:256:room:25681":
  name: Along the Parapet
  description: >
    The parapet runs north to south here, connecting the northeast guard tower and the southeast guard
    tower.  The southeast tower is directly south of you.
  sector: city
  exits:
    north:
      to: tba:256:room:25680
    south:
      to: tba:256:room:25682

"tba:256:room:25682":
  name: Southeast Guard Tower
  description: >
    This guard tower looks as if it may have seen some action in times past. Small chunks of stone are
    missing around the arrow slits, and many nicks and chunks are missing from the walls themselves.
  sector: city
  exits:
    north:
      to: tba:256:room:25681
    west:
      to: tba:256:room:25683

"tba:256:room:25683":
  name: Along the Parapet
  description: >
    The parpet runs east to west here, connecting the southeast guard tower to the southwest guard
    tower.  The southeast tower is directly east of you.
  sector: city
  exits:
    east:
      to: tba:256:room:25682
    west:
      to: tba:256:room:25684

"tba:256:room:25684":
  name: Along the Parapet
  description: >
    The parapet runs east to west here, connecting the southeastern guard tower to the southwestern
    guard tower.
  sector: city
  exits:
    east:
      to: tba:256:room:25683
    west:
      to: tba:256:room:25685

"tba:256:room:25685":
  name: Along the Parapet
  description: >
    The parapet runs east to west here, connecting the southeastern guard tower to the southwestern
    guard tower.
  sector: city
  exits:
    east:
      to: tba:256:room:25684
    west:
      to: tba:256:room:25686

"tba:256:room:25686":
  name: Southwestern Guard Tower
  description: >
    This looks more like a break room than a guard tower.  A stack of old books are piled in one
    corner, and the remains of someone's lunch sits in another. The parapet continues to the east and to the
    north from here.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25687
    east:
      to: tba:256:room:25685

"tba:256:room:25687":
  name: Along the Parapet
  description: >
    The parapet continues north to south here, connecting the southeastern guard tower to the southern
    bridge guard tower.  The southeastern tower is directly south of you.
  sector: city
  exits:
    north:
      to: tba:256:room:25688
    south:
      to: tba:256:room:25686

"tba:256:room:25688":
  name: Along the Parapet
  description: >
    The parapet continues north to south here, connecting the southeastern guard tower to the south
    bridge guard tower.
  sector: city
  exits:
    north:
      to: tba:256:room:25689
    south:
      to: tba:256:room:25687

"tba:256:room:25689":
  name: Along the Parapet
  description: >
    The parapet runs north to south here, connecting the southeastern guard tower to the south bridge
    guard tower.  The south bridge guard tower is directly north of you.
  sector: city
  exits:
    north:
      to: tba:256:room:25690
    south:
      to: tba:256:room:25688

"tba:256:room:25690":
  name: South Drawbridge Guard Tower
  description: >
    You stand atop a vantage point looking down upon the entrance to the Keep. This is one of six
    towers which ring the Keep to allow for defense in times of war.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:256:room:25689
    down:
      to: tba:256:room:25602

"tba:256:room:25691":
  name: Wine Cellar
  description: >
    This room, though as cob-webby and musty as is earthly possible, seems clean enough.  The racks are
    dust free and the bottles are all tended.
  sector: inside
  flags: [indoors]
