"tba:256:room:25604":
  name: The Armory
  description: >
    All weapons used by the Lord's Guards are made, stored, and maintained here. Racks of weapons and
    armor line the walls in various states of repair.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25658
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [bed]
    text: >
      Ha!  Lucky, you were always lucky!  Under the pillow is a half-written letter, unaddressed.  The
      bits of text that aren't smudged, burnt, and smeared tell tale of the smith/mage Gabadiel's masterwork:
      a sword of unequalled power, and two swords that came before, discarded as 'Not quite what I was
      working towards'.  Looking around, you notice a distinct lack of any swords.  You think you may have a
      motive now...
  - keywords: [tracks, dust]
    text: Three sets of prints lead out where the back door used to stand.

