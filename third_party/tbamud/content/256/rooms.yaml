"tba:256:room:25635":
  name: Lord's Garden
  description: >
    The beautiful flora surrounding you makes you feel so glad, so peaceful, you wish that you could
    stay in its embrace forever.  Such care is given to these rows of life, the keeper of this garden must
    be almost fanactical in their attention.  The winding path conitinues north and east from here.
  sector: field
  exits:
    north:
      to: tba:256:room:25638
    east:
      to: tba:256:room:25639

"tba:256:room:25636":
  name: Lord's Reception
  description: >
    Fully expecting to see a grand throne upon a dias, you are surprised to find a comfortable chair
    sitting before a servicable desk.  Several couches sit along the walls along with luxurious chairs.  A
    fireplace crackles warmly in the eastern wall directly behind the Lord's desk.  A small door in the
    south wall sits closed at present.  Pleasantly surprised by the simplicity of this office, you feel
    that the Lord must be a kind and just man and deserves the priviledges his title offers.  A door to the
    west allows exit.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:256:room:25642
      door:
        keywords: [door]
        kind: door
        key: tba:256:obj:25625
        reset: locked
    west:
      to: tba:256:room:25631
      look: A doorway.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:256:room:25637":
  name: Lord's Garden
  description: >
    The center of this garden boasts a beautific statue of a woman dressed regally in gowns of state. 
    It almost seems life-like as you gaze upon it, such attention to detail the craftsmen put into it. 
    The statue sits in the center of a fountain upon a dias.  An inscription at the base reads; In loving
    memory The stone path continues to wend it's way north, south, and west.
  sector: field
  exits:
    north:
      to: tba:256:room:25654
    south:
      to: tba:256:room:25639
    west:
      to: tba:256:room:25638

"tba:256:room:25638":
  name: Lord's Garden
  description: >
    The garden continues to awe and inspire you as you walk along it's well tended paths.  Flowers of
    all shapes, size and color abound.  The stone path meanders east, south, and north from here.
  sector: field
  exits:
    north:
      to: tba:256:room:25653
    east:
      to: tba:256:room:25637
    south:
      to: tba:256:room:25635

"tba:256:room:25639":
  name: Lord's Gardens
  description: >
    This may very well be the most beautiful peace of land you ever have set foot upon.  Vibrant colors
    surround you, lending you a feeling of serenity and bliss. Knowing that such wonders can exist in
    nature lends you the realization that although at many times the world appears to be flawed, there is a
    balance of perfection that gives those flaws their very reason for existance.  A winding stone path
    wends it's way through the garden, heading north and west, and a door to your south allows entrance
    back into the keep.
  sector: field
  exits:
    north:
      to: tba:256:room:25637
    south:
      to: tba:256:room:25640
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:256:room:25635

"tba:256:room:25640":
  name: Library
  description: >
    Not as large as the library located in town, this library serves as more of a working library for
    the Lord and his retainers.  Dark oak shelves line all walls and two long tables sit side by side in
    the center of the room.  The north wall, mostly glass with a door set into the center, boasts a view
    of the Lord's garden.  You may leave to the south through the main door.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25639
      door:
