"tba:256:room:25606":
  name: Dining Hall
  description: >
    This huge room can seat up to one hundred people in one sitting alone.  A huge table dominates most
    of the room, benches running along two sides for seating.  Another table, also fairly large but
    smaller than the main table, sits high on a dias perpendicular to the long table.  This second table is
    most obviously the Lord's own dining table.  An enormous, ornate fireplace commands the eastern wall,
    sufficient to heat the entire room and then some.  You may leave through the main entrance to the
    north or through a set of swinging doors leading into the kitchen to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25641
    west:
      to: tba:256:room:25632
      door:
        keywords: [door]
