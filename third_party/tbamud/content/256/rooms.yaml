"tba:256:room:25641":
  name: Hallway
  description: >
    The short hallway ends here, opening south into a spacious dining hall.  A door to the north leads
    to the library, or you may go west into the hallway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25640
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:256:room:25606
    west:
      to: tba:256:room:25633

"tba:256:room:25642":
  name: Lord's Bedroom
  description: >
    This room, austere almost to the point of being monkish, boasts only the necessities for sleeping. 
    A bed, although large, sits in the center of the room looking as if its use is as minimal as its
    style.  The only other furnishings in the room are a dresser, a small wardrobe, and, curiously, a
    portrait delicately painted in soft hues of the Keep, sitting high upon Lord's Hill, proudly flying the
    standard for Jareth.  A closed door blocks the entrance to the south and an archway leading into the
    Lord's private dining room leads west, or you may exit the Lord's Suite to your north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25636
      door:
        keywords: [door]
        kind: door
        reset: locked
    south:
      to: tba:256:room:25643
    west:
      to: tba:256:room:25630

"tba:256:room:25643":
  name: Bathing Chambers
  description: >
    This private room is mostly one large pool of steaming water.  No fires burn here, so the water
    must be either kept warm underneath the pool, or must be kept hot through magical means.  Whatever the
    case, this hot tub looks more than inviting and if you have the guts, some casual bathing may be in
    order.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25642

"tba:256:room:25644":
  name: Courtyard
  description: >
    You stand in the Lord's Courtyard, a place of fun and merriment, open to all folk, be they Lord's
    guest or servant.  Trees dot the yard, all in full bloom, with a walk way made from red wood chips
    showing you the way through the trees to the west and south.
  sector: hills
  exits:
    south:
      to: tba:256:room:25645
    west:
      to: tba:256:room:25655

"tba:256:room:25645":
  name: Courtyard, at the pool
  description: >
    You stand in the Lord's Courtyard, a place of fun and merriment, open to all folk, be they Lord's
    guest or servant.  A small man made pool of clear blue water is here, stocked with imported golden
    fish.  A walk way made from red wood chips allows passage through the trees to the north, west and south.
  sector: hills
  exits:
    north:
      to: tba:256:room:25644
    south:
      to: tba:256:room:25646
    west:
      to: tba:256:room:25627

"tba:256:room:25646":
  name: Courtyard
  description: >
    You stand in the Lord's Courtyard, a place of fun and merriment, open to all folk, be they Lord's
    guest or servant.  Trees dot the yard, all in full bloom, with a walk way made from red wood chips
    showing you the way through the trees west, north, and south.
  sector: hills
  exits:
    north:
      to: tba:256:room:25645
    south:
      to: tba:256:room:25650
    west:
      to: tba:256:room:25626

"tba:256:room:25647":
  name: Guest Room
  description: >
    This beautifully furnished room features all the amenities.  Satin bedcovers, beautiful paintings
    of angels and wildlife, and an armoir are just some of the luxuries.  A window draped in silk curtains
    in the west wall allows a view of most of Jareth.  Your only exit is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25648
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:256:room:25648":
  name: Hallway
  description: >
    You stand at the end of a north-south running hallway.  Doors line the west wall, while a set of
    doors in the east wall allow entrance to the courtyard.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25625
    east:
      to: tba:256:room:25649
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:256:room:25647
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:256:room:25649":
  name: Courtyard
  description: >
    You stand in the Lord's Courtyard, a place for fun and merriment, open to all folk, be they Lord's
    guest or servant.  Beautiful trees dot the yard, all in full bloom.  A trail made from wood chips
    wends its way through the trees and around benches.
  sector: city
  exits:
    north:
      to: tba:256:room:25626
    east:
      to: tba:256:room:25650
    west:
      to: tba:256:room:25648
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:256:room:25650":
  name: Gazebo
  description: >
    You have entered into an octagonal gazebo made completely of white painted wood.  A low bench runs
    around the entire inside of the gazebo, looking very comfortable.  In the center of the gazebo is a
    piece of wood made in the shape of an octagon with long planks of flooring running outward from it
    like long spokes.  This looks as if it would be a good place to rest, if that is your inclination.  You
    may leave back into the courtyard to the west or north.
  sector: hills
  exits:
    north:
      to: tba:256:room:25646
    west:
      to: tba:256:room:25649

"tba:256:room:25651":
  name: Along the Parapet
  description: >
    You stand atop the parapet which runs east to west here connecting all the guard towers.  This
    narrow stone walkway also provides a means for defense in times of war.
  sector: city
  exits:
    east:
      to: tba:256:room:25661
      look: A normal, wooden front door to a normal looking home.  It is nothing to write home about.
    west:
      to: tba:256:room:25675

"tba:256:room:25652":
  name: Hallway
  description: >
    You stand at the northern end of a long hallway which runs north to south. Doors line the western
    wall, leading to what you assume would be apartments. To you east, a window offers a great view of the
    most fantastic garden you have ever seen.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:256:room:25615
    west:
      to: tba:256:room:25657
      look: There is a normal appearing door set in the western wall.
      door:
        keywords: [door, front]
        kind: door
        reset: closed

"tba:256:room:25653":
  name: Lord's Garden
  description: >
    The garden grows right to the Keep's outer walls and over.  Vines covered in beautiful flowers
    wreath the wall, lending a timeless look to these already beautiful gardens.  The stone path continues
    east and south from here.
  sector: field
  exits:
    east:
      to: tba:256:room:25654
    south:
      to: tba:256:room:25638

"tba:256:room:25654":
  name: Lord's Garden
  description: >
    The garden continues straight to the outer wall of the Keep here.  Looking up you can see the top
    of the wall where the Lord's Guard patrols the parapet. The winding stone path winds west and south
    here.
  sector: field
  exits:
    south:
      to: tba:256:room:25637
    west:
      to: tba:256:room:25653

"tba:256:room:25655":
  name: Courtyard
  description: >
    You stand in the Lord's Courtyard, a place of fun and merriment, open to all folk, be they Lord's
    guest or servant.  Trees dot the yard, all in full bloom, with a walk way made from red wood chips
    showing you the way through the trees to the south and east, or you may enter the Keep to the west.
  sector: hills
  exits:
    east:
      to: tba:256:room:25644
    south:
      to: tba:256:room:25627
    west:
      to: tba:256:room:25623
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:256:room:25656":
  name: Stanneg Inn
  description: >
    This is a plainly decorated room, the main room of the Stanneg Inn.  A large arch to the west leads
    to a common room where food and drink can be ordered, and a set of rickety wooden stairs lead up to
    the rooms are.  A thread- bare rug lies in the middle of the floor, evidently well- loved by a cat or
    two from the quantity of hair on it.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:256:room:25657

"tba:256:room:25657":
  name: Guest Room
  description: >
    This opulently furnished room offers all the amenities.  Double feathered bed, dark oak dresser,
    water basin, and even a mirror.  A window on the western wall offers a view of the River Alquandon and
    some of the northern reaches of Jareth.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25652
      door:
        keywords: [door, front]
        kind: door
        reset: closed

"tba:256:room:25658":
  name: Grand Reception Hall
  description: >
    The cathedral ceilings in this room give such an impression of majesty and power you feel both awed
    and comforted.  You feel that this was most probably a very proud and happy place, although for the
    life of you, you can't figure out what seems wrong now.  To your east the Grand Reception Hall
    continues, to your north a stable is provided, south you see a wooden door bound in iron, and to your west
    you may leave to the outside.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25609
      look: The stablehand will take your horse to the north.
    east:
      to: tba:256:room:25620
      look: More of this HUGE hall.
    south:
      to: tba:256:room:25604
      look: Closed door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:256:room:25667
      look: The portcullis.

"tba:256:room:25659":
  name: North Drawbridge Guard Tower
  description: >
    This is one of six guard towers which ring the upper ramparts of Lord's Keep. A parapet runs
    between each of the towers, encircling the Keep, and allowing for defense in times of war.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25660
    down:
      to: tba:256:room:25603

"tba:256:room:25660":
  name: Along the Parapet
  description: >
    You stand atop the parapet, which runs north to south here.  This narrow walkway connects all the
    guard towers to one another and allows the Lord's Guard to defend their Lord's home.
  sector: city
  exits:
    north:
      to: tba:256:room:25662
    south:
      to: tba:256:room:25659

"tba:256:room:25661":
  name: Northeast Guard Tower
  description: >
    You stand in the northeast guard tower.  A spectacular view of the forest can be seen through arrow
    holes in the north and east walls.  The parapet continues here to the west and south.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:256:room:25676
    west:
      to: tba:256:room:25651

"tba:256:room:25662":
  name: Along the Parapet
  description: >
    You stand atop the parapet, which runs north to south here.  This narrow walkway connects all the
    guard towers to one another and provides a defendable position for the Lord's Guard in times of war.
  sector: city
  exits:
    north:
      to: tba:256:room:25668
    south:
      to: tba:256:room:25660

"tba:256:room:25663":
  name: Cobbled Street
  description: >
    The street begins to widen slightly.  Flags from many of the noble houses begin at regular
    intervals along either side of the street.  The grass is still well-kept here, but not as many people lounge
    on it here as there were closer to the city.  Although not threatening in any way, the mood of this
    street seems to get a bit gloomier with each step you take toward the keep.
  sector: city
  exits:
    north:
      to: tba:256:room:25664
      look: The street continues.
    south:
      to: tba:256:room:25601
      look: The street continues.

"tba:256:room:25664":
  name: Cobbled Street
  description: >
    The street, wide enough now to fit five carriages side by side, continues north here toward the
    keep.  Just north of here, you see that the street opens into a large court and turns to the east, where
    it enters the majestic halls of Lord's Keep.  South of you the city awaits.
  sector: city
  exits:
    north:
      to: tba:256:room:25665
      look: The street opens into a wide court.
    south:
      to: tba:256:room:25663
      look: The street continues.

"tba:256:room:25665":
  name: Lord's Court
  description: >
    This court is an opulant place, reserved for the use of formally welcoming visiting royalty.  Flags
    from all royal and noble houses fly bravely here, welcoming all to the splendor and majesty that is
    Jareth and Lord's Keep.
  sector: city
  exits:
    east:
      to: tba:256:room:25666
      look: The Keep looms close by.
    south:
      to: tba:256:room:25664
      look: The street heads south towards town.

"tba:256:room:25666":
  name: On the Drawbridge
  description: >
    Standing in front of the keep, one cannot help but feel daunted to some degree.  Some of the
    feeling is due to the sheer immensity of this castle, it's powerful presence, but you also can't help but
    feel that something must be wrong here.  The guards standing at attention here are afraid to even look
    in any direction but straight ahead and from inside the castle you hear no sounds of merriment or
    laughter, as is usually the case in the entryway of the Lord's Keep.  The Lord's Court lies west of
    you, while the twin guard towers flank your entry to the east into Lord's Keep.
  sector: city
  exits:
    east:
      to: tba:256:room:25667
      look: You may enter the Keep to the east.
    west:
      to: tba:256:room:25665
      look: You see Lord's Court.

"tba:256:room:25667":
  name: Under the Portcullis
  description: >
    You stand in the entryway of the Keep.  On both the north and south walls, you see closed doorways
    which presumably lead into the guard towers.  Above you, the spiked bottom of the portcullis peeks
    out from its resting position, seeming almost threatening.  The Twin towers rising out of stone
    foundations as big as a house themselves seem to leer at you from their arrowholes inlaid in the walls. You
    can proceed into the Keep to the east or leave the Keep to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25603
      look: Closed door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:256:room:25658
      look: You may enter the reception hall.
    south:
      to: tba:256:room:25602
      look: Closed door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:256:room:25666
      look: You see the drawbridge.

"tba:256:room:25668":
  name: Along the Parapet
  description: >
    You stand atop the parapet, which runs north to south here.  This narrow walkway connects all the
    guard towers at Lord's Keep.  It also provides a defndable position for the Lord's Guard in times of
    war.
  sector: city
  exits:
    north:
      to: tba:256:room:25669
    south:
      to: tba:256:room:25662

"tba:256:room:25669":
  name: Northwest Guard Tower
  description: >
    You stand inside the northwest guard tower.  Narrow slits provide the means to fire arrows from
    this height at any would be aggressors in times of war. The parapet continues along to the east and
    south from here.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25672
    south:
      to: tba:256:room:25668

"tba:256:room:25670":
  name: A Sloping Tunnel
  description: >
    The tunnels slopes up to the north deeper into the mountain.  A rather gusty breeze riffles your
    clothing from ahead somewhere.  The claw marks in the stone floor continue up the passage, through the
    darkness.
  sector: inside
  flags: [dark, indoors, no_track, private]
  exits:
    north:
      to: tba:256:room:25673
    west:
      to: tba:256:room:25628

"tba:256:room:25671":
  name: A Sloping Tunnel
  description: >
    The tunnel continues its slope upwards, and the wind blows at you even stronger yet.  The claw
    tracks in the stone stop abruptly here, where there seems to be a lot of unearthed dirt and stone around,
    heaped upon the floor. You feel uneasy about this place.
  sector: hills
  flags: [dark, indoors, no_track, private]
  exits:
    south:
      to: tba:256:room:25674
  extras:
  - keywords: [dirt, stone]
    text: It has been dug from somewhere, but where?
  - keywords: [claw, claws, track, tracks, mark, marks]
    text: They stop very abruptly here, right where the piles of earth begin, it seems.
  - keywords: [floor]
    text: The floor up ahead looks...  Strange.  You don't think going ahead would be a good idea.

"tba:256:room:25672":
  name: Along the Parapet
  description: >
    You stand atop the parapet, which runs east to west here.  The parapet runs the entire perimeter of
    Lord's Keep, connecting all the guard towers.  It also supplies a defendable position for the Lord's
    Guard so that in times of war, they can protect their Lord and his home.
  sector: city
  exits:
    east:
      to: tba:256:room:25675
    west:
      to: tba:256:room:25669

"tba:256:room:25673":
  name: A Sloping Tunnel
  description: >
    This tunnel slopes deep, down into the mountain's heart.  The air feels still and uncomfortably
    warm, despite the closeness of the cave's entrance above you. There's a deep, musky odor in the air, and
    the giant claw marks continue downwards.
  sector: hills
  flags: [dark, indoors, no_track, private]
  exits:
    north:
      to: tba:256:room:25674
    south:
      to: tba:256:room:25670

"tba:256:room:25674":
  name: A Sloping Tunnel
  description: >
    A bright light greets your eyes from the north, in direct contrast to the darkness of the tunnel
    overhead.  You break out in a sweat due to the overwhelming warmth of the air.  The musky odor has
    grown quite intense, drowning out everything else in the air and making it hard to breathe. Something in
    your gut begins squirming uncomfortably as you wonder what's ahead...
  sector: hills
  flags: [dark, indoors, no_track, private]
  exits:
    north:
      to: tba:256:room:25671
    south:
      to: tba:256:room:25673

"tba:256:room:25675":
  name: Along the Parapet
  description: >
    You stand atop the parapet which runs east to west here.  This narrow walkway connects all the
    guard towers and provides a means for defense in times of war.
  sector: city
  exits:
    east:
      to: tba:256:room:25651
    west:
      to: tba:256:room:25672

"tba:256:room:25676":
  name: Along the Parapet
  description: >
    The parapet runs north to south here, connecting the northeast guard tower and the southeast guard
    tower.
  sector: city
  exits:
    north:
      to: tba:256:room:25661
    south:
      to: tba:256:room:25677

