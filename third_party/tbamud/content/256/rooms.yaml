"tba:256:room:25632":
  name: Kitchen
  description: >
    A hustle and bustle of constant activity, this huge kitchen services all of the Lord's guests and
    servants, and of course, the Lord himself.  Pots and pans hang everywhere overhead, fireplaces abound,
    and servants scurry to and fro in a seemingly mad and mindless frenzy.  A long table off to the side
    seats servants who are on their break, but currently there are none there.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25633
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:256:room:25606
      door:
        keywords: [door]
        kind: door
        reset: closed
