# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 256.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:256:room:25600":
  name: Lord's Keep Zone Description Room by Kaan
  description: >
    *Lord's Keep *Written by Kaan for Dibrova This is the ancestral home of the Lord of Jareth, who has
    governed the City of Freedom since the days when Jareth was but a vision in the first Lord's head. 
    Since then, a new Lord has always ascended to the position which keeps Jareth profitable and free, in
    Lord's Keep. This zone has a small quest written into it - the Lord's daughter, Penelope was
    abducted by Mordecai (another zone available) and now the Lord weeps in mourning for his beloved daughter. 
    Save the daughter from Mordecai and bring her back in one piece to her father, get a large pile of
    gold.  There is some mid- to upper-level eq and mobs here, as well as some fun areas to explore.  This
    zone is meant to connect to Jareth.
  sector: inside
  flags: [private]

"tba:256:room:25601":
  name: Cobbled Street
  description: >
    The street continues with parks and lush, well-kept grass on either side. To the north you see the
    Lord's Keep, to the south the city awaits.
  sector: city
  exits:
    north:
      to: tba:256:room:25663
      look: The street continues.
    south:
      to: tba:257:room:25771

"tba:256:room:25602":
  name: Guard Tower
  description: >
    This small room serves as a break room for the Lord's Guards who patrol the upper ramparts of Lords
    Keep.  A small, stone, spiral staircase leads up to the parapet from here, or you may leave through
    the door to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:256:room:25667
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:256:room:25690

