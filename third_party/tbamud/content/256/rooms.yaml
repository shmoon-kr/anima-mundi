"tba:256:room:25628":
  name: The Beginning of a Very Dark & Uncomfortable Passageway
  description: >
    You have entered a very cramped earthen passageway which is darker than darkest night.  You feel
    something skitter by you feet and give a small shudder at the thought of what it might be.  The walls
    seem to have been man made, dug out of hard clay, without supports.  You begin to feel a chill, and
    even a bit damp, although the walls themselves are not wet or even clammy, just cold.  The tunnel heads
    east into darkness or you may climb back out into the gazebo.
  sector: inside
  flags: [dark, indoors, tunnel]
  exits:
    east:
      to: tba:256:room:25670
    up:
      to: tba:256:room:25650
      door:
        keywords: [trap, door]
        kind: pickproof
        reset: locked

"tba:256:room:25629":
  name: Balcony
  description: >
    You stand on the balcony overlooking not only the courtyard, but also much of the lands which
    surround Jareth.  Most of what you see is forest, but some, to the southwest is beautiful rolling hills. 
    Looking down on the courtyard, you see guards on break, sweethearts strolling hand in hand, and
    common folk out enjoying the sunshine.
  sector: city
  exits:
    north:
      to: tba:256:room:25630

"tba:256:room:25630":
  name: Lord's Dining Room
  description: >
    A small table with six chairs, one at each head, and two on each side, sits in this room.  The
    south wall, mostly glass, offers a fabulous view of the courtyard and much of the land south and east of
    the Keep's walls.  You can exit south onto the balcony, or leave to the east into the bedroom.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25642
    south:
      to: tba:256:room:25629

"tba:256:room:25631":
  name: Reception Waiting Room
  description: >
    This small lounge was made for the express purpose of allowing those entering the Lord's presence
    to tidy themselves up a bit before presenting themselves to him.  A long mirror adorns the north wall,
    a small basin filled with water stands next to it, and a dust brush sits on a shelf next to the
    mirror.  Lounge chairs are resting along the south wall, although from the grooves worn in the wood from
    centuries of nervous pacing, most people who enter this room don't use the chairs very often.  Doors
    are to the east and west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25636
      look: Closed door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:256:room:25620
