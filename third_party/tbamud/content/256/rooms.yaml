"tba:256:room:25634":
  name: The Tea Room
  description: >
    This room is used as an informal social room for any of the Lord's guests. Comfortable divans and
    lounge chairs are scattered about the room, and a fireplace crackles warmly in the north wall.  Books
    lie on end tables at easy arm's length and servants enter at intervals to ask if any refreshment is
    desired.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:256:room:25640
      door:
        keywords: [door]
        kind: door
        reset: closed
