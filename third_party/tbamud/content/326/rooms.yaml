# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 326.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:326:room:32600":
  name: Trampled Dirt Highway
  description: >
    The road that led to McGintey Cove has been left behind, widened into what can only be called a
    highway.  From the amount of tracks made from countless wagon wheels, hooves of horses and mules and the
    boots of hundreds of feet you can see that all different sorts have passed this way, probably more
    than once. You follow your gaze eastward along the highway, but you cannot see its end from where you
    now stand.
  sector: inside
  exits:
    east:
      to: tba:326:room:32601
    west:
      to: tba:258:room:25828
  extras:
  - keywords: [info, credits]
    text:
      preformatted: |2
           Army Perimeter by Kaan
           Zone 326 is linked to the following zones:
        324 Army Encampment                at 32610 (east ) ---> 32400
        324 Army Encampment                at 32640 (west ) ---> 32414
        Links: 79e

"tba:326:room:32601":
  name: Trampled Dirt Highway
  description: >
    The highway continues its way eastward toward what must be a very highly populated area.  The cliff
    that the road ran along back near McGintey Cove has ended, the road veering slightly northward into
    the deep forest which will soon surround you.  You sense nothing threatening in the direction you
    travel, however one can never be too sure.
  sector: inside
  exits:
    east:
      to: tba:326:room:32602
    west:
      to: tba:326:room:32600

"tba:326:room:32602":
  name: Trampled Dirt Highway
  description: >
    You are now entered into a forest area, thick with trees and bracken which would bar your way
    through the forest should you attempt to cut through without following a path.  To the north of you is a
    trail into the forest, only visible because it is a break in the trees.  The trail itself is nearly
    completelt covered in leaves.  The highway continues to the east and west.
  sector: inside
  exits:
    north:
      to: tba:326:room:32611
    east:
      to: tba:326:room:32603
    west:
      to: tba:326:room:32601

"tba:326:room:32603":
  name: Trampled Dirt Highway
  description: >
    The highway heads east and west, veering slightly northward as it heads east. You are constantly
    amazed by the amount of traffic that passes by you, the dust from all the passing people almost
    annoying.  To the north is a small, leaf covered trail heading into the thick forest.
  sector: inside
  exits:
    north:
      to: tba:326:room:32612
    east:
      to: tba:326:room:32604
    west:
      to: tba:326:room:32602

"tba:326:room:32604":
  name: Trampled Dirt Highway
  description: >
    The highway veers sharply northward here, heading deeper into the forest, away from what you know
    as the civilized world.  There must be some sort of civilization, however, that this highway leads to,
    otherwise it would not be so well travelled.  To the south is a small path in through the trees of
    the forest.
  sector: inside
  exits:
    north:
      to: tba:326:room:32605
    south:
      to: tba:326:room:32621
    west:
      to: tba:326:room:32603

"tba:326:room:32605":
  name: Trampled Dirt Highway
  description: >
    You may continue your way north or south along the highway.  To the east is small dirt trail which
    runs in through the forest.
  sector: inside
  exits:
    north:
      to: tba:326:room:32606
    east:
      to: tba:326:room:32619
    south:
      to: tba:326:room:32604

"tba:326:room:32606":
  name: Trampled Dirt Highway
  description: >
    The way has been flooded over and turned to mud and sludge here, as a river flows through the
    center of the highway just north of here.  From all the hooves and boots which have passed through the
    river and head south, the water has saturated into hard packed dirt of the highway and turned it to
    slippery mud. Best to watch your step.
  sector: inside
  exits:
    north:
      to: tba:326:room:32607
    south:
      to: tba:326:room:32605

"tba:326:room:32607":
  name: Trampled Dirt Highway
  description: >
    A small branch of a local river runs through the highway, making it so that you will have to get
    your feet wet.  It is not deep in the slightest, only a couple feet at the deepest point, however is
    does make you have to watch your step.  The highway itself has been reinforced with a small stones so
    as not to wash out and turn into a gorge, however there are only so many stones and in many spots the
    road has turned to mud.  You may head east or south along the highway or west onto a barely visible
    trail through the forest.
  sector: inside
  exits:
    east:
      to: tba:326:room:32608
    south:
      to: tba:326:room:32606
    west:
      to: tba:326:room:32615

"tba:326:room:32608":
  name: Trampled Dirt Highway
  description: >
    The road is extremely wet and turned to mud in many places from the water which clings to most
    feet, wheels and hooves which pass this way and head east. Just to the west is a river crossing, north is
    a dirt trail through the forest, and east the highway continues.
  sector: inside
  exits:
    north:
      to: tba:326:room:32618
    east:
      to: tba:326:room:32609
    west:
      to: tba:326:room:32607

"tba:326:room:32609":
  name: Trampled Dirt Highway
  description: >
    You see a huge clearing in the forest just to east of here, what appears to be a valley, as you can
    see only blue sky past a certain point in that direction.  Some sort of gate has been erected over
    the highway, disallowing passage eastward, apparently unless permission is given by the one or both of
    the two guards which stand at post in front of the gate.  There is a small path through the forest
    just to the south of here.
  sector: inside
  exits:
    east:
      to: tba:326:room:32610
    south:
      to: tba:326:room:32620
    west:
      to: tba:326:room:32608

"tba:326:room:32610":
  name: Camp Perimeter
  description: >
    You stand at the crest of a large valley which is home to a huge military encampment.  It appears
    that this must be a well-funded installation as there are so many memebers of this army even at
    peace-time.  You might head east into the valley to see what sort of army this is, if not for the gate
    blocking your way and the two guards which stand solemnly at attention awaiting to see your pass.  You
    may walk the perimeter to the north or south, around the crest of the valley, but that might not be
    wise to pursue to any long-term degree as the archers towers that line the perimeter seem to have been
    designed for sight see-ers just like yourself.
  sector: inside
  exits:
    north:
      to: tba:326:room:32648
    east:
      to: tba:324:room:32400
    south:
      to: tba:326:room:32647
    west:
      to: tba:326:room:32609

"tba:326:room:32611":
  name: Leaf-Strewn Trail
  description: >
    You are on a small path heading through the trees of a thick wood, one which is impassable in every
    direction except the way of the trail.  You have this strange sensation of being watched, although
    how anyone could watch you through the tangled mess of these trees is beyond you.
  sector: inside
  exits:
    north:
      to: tba:326:room:32613
    east:
      to: tba:326:room:32612
    south:
      to: tba:326:room:32602

"tba:326:room:32612":
  name: Leaf-Strewn Trail
  description: >
    The forest seems to swallow you up alive, all sounds of wind and open air completely gone, just the
    creak and groan of the trees reach your ears now. You feel a strange presence, almost as if someone
    were watching you.  Quite creepy.
  sector: inside
  exits:
    north:
      to: tba:326:room:32615
    south:
      to: tba:326:room:32603
    west:
      to: tba:326:room:32611

"tba:326:room:32613":
  name: Leaf-Strewn Trail
  description: >
    You can't shake the feeling that you are being spied upon, somehow someone or something is out
    there watching you, maybe from the trees somewhere...
  sector: inside
  exits:
    north:
      to: tba:326:room:32614
    south:
      to: tba:326:room:32611
    up:
      to: tba:326:room:32627

"tba:326:room:32614":
  name: Leaf-Strewn Trail
  description: >
    The trail makes a turn here, heading south and east.  You look one way then another, trying figure
    out who it is that you feel watching you.
  sector: inside
  exits:
    east:
      to: tba:326:room:32615
    south:
      to: tba:326:room:32613

"tba:326:room:32615":
  name: Leaf-Strewn Trail
  description: >
    You are completely swallowed up by the forest, almost all sunlight blocked by the tangle of
    branches overhead.  Immediately upon entry into the trees, you sense a feeling of someone or something
    watching your every move.  Possibly from the trees.
  sector: inside
  exits:
    east:
      to: tba:326:room:32607
    south:
      to: tba:326:room:32612
    west:
      to: tba:326:room:32614
    up:
      to: tba:326:room:32626

"tba:326:room:32616":
  name: Narrow Forest Trail
  description: >
    The trail ends here, a huge tree blocking any further progress west and no other exits save the way
    you came apparent.  You still cannot shake the feeling that someone is watching you - possibly from
    the trees...
  sector: inside
  exits:
    east:
      to: tba:326:room:32617
    up:
      to: tba:326:room:32628

"tba:326:room:32617":
  name: Narrow Forest Trail
  description: >
    The path curves to the west, deadending just west of here at a large tree. To the south is the way
    back through the prickly bushes to the highway.
  sector: inside
  exits:
    south:
      to: tba:326:room:32618
    west:
      to: tba:326:room:32616

"tba:326:room:32618":
  name: Narrow Forest Trail
  description: >
    This slight trail through the forest would almost not be called a trail were it not for the
    half-foot wide swath of dirt that leads into the forest.  The bush and bracken grows over into the pathway,
    scratching at your arms and legs as you try and pass through.  You have this feeling, this sensation
    of being watched.
  sector: inside
  exits:
    north:
      to: tba:326:room:32617
    south:
      to: tba:326:room:32608

"tba:326:room:32619":
  name: Well Worn Path Through the Trees
  description: >
    The forest swallows up most of the light and all of the air movement that you were getting
    accustomed to on the highway.  The air now feels stagnant and claustrophobic, almost oppressive.  To make
    things that much the worse, you get the strange feeling that someone might be watching you from a place
    of concealment.
  sector: inside
  exits:
    east:
      to: tba:326:room:32620
    south:
      to: tba:326:room:32623
    west:
      to: tba:326:room:32605

"tba:326:room:32620":
  name: Well Worn Path Through the Trees
  description: >
    The forest swallows up most of the light and all of the air movement that you were getting
    accustomed to on the highway.  The air now feels stagnant and claustrophobic, almost oppressive.  To make
    things that much the worse, you get the strange feeling that someone might be watching you from a place
    of concealment.  Possibly from up in the trees.
  sector: inside
  exits:
    north:
      to: tba:326:room:32609
    west:
      to: tba:326:room:32619
    up:
      to: tba:326:room:32625

"tba:326:room:32621":
  name: Well Worn Path Through the Trees
  description: >
    This path seems to have been recently cleared and is well used by someone or maybe someones.  The
    trees immediately surroung you, cutting off all feeling of being out in the open.  You feel almost a
    presence, a sensation of being watched.
  sector: inside
  exits:
    north:
      to: tba:326:room:32604
    south:
      to: tba:326:room:32622

"tba:326:room:32622":
  name: Well Worn Path Through the Trees
  description: >
    The path makes a turn, heading north and east from here.  You still feel that strange feeling of
    being watched.  Possibly up in the trees...
  sector: inside
  exits:
    north:
      to: tba:326:room:32621
    east:
      to: tba:326:room:32623
    up:
      to: tba:326:room:32624

"tba:326:room:32623":
  name: Well Worn Path Through the Trees
  description: >
    The trail runs west and north from here through the thick forest.  You cannot seem to shake the
    feeling that you are being watched.
  sector: inside
  exits:
    north:
      to: tba:326:room:32619
    west:
      to: tba:326:room:32622

"tba:326:room:32624":
  name: Lookout Post
  description: >
    This is a small area, made from lengths of wood nailed into the tree limbs which support it.  The
    wood has been painted in shades of green and browns to match the forest around it - from the ground,
    no one can see you.
  sector: inside
  exits:
    down:
      to: tba:326:room:32622

"tba:326:room:32625":
  name: Lookout Post
  description: >
    The wood that makes up this small platform in the tree has been painted in hues of green and brown
    to match the forest colors around it.  From the ground, chances are that one would not be able to see
    this small post.
  sector: inside
  exits:
    down:
      to: tba:326:room:32620

"tba:326:room:32626":
  name: Lookout Post
  description: >
    This small wooden tree stand cleverly conceals the movement of the individual who rests up here. 
    It has been painted in the green and browns of the forest, covered over by branches and leaves.
  sector: inside
  exits:
    down:
      to: tba:326:room:32615

"tba:326:room:32627":
  name: Lookout Post
  description: >
    This small wood platform was certainly not made for comfort, but concealment. How anyone could
    spend more than an hour cooped up in this spot is beyond you. Must be that 'high intensity' military
    training these guys get.
  sector: inside
  exits:
    down:
      to: tba:326:room:32613

"tba:326:room:32628":
  name: Lookout Post
  description: >
    This small post allows sight to the highway, making it easy for the person posted here to catch
    sight of any would-be attackers long before they can reach the main camp.  The wood that this platform
    in the trees is made from has been painted brown and green to better blend in with the forest, making
    it virtually impossible for anyone to spot this post from the ground.
  sector: inside
  exits:
    down:
      to: tba:326:room:32616

"tba:326:room:32629":
  name: Camp Perimeter
  description: >
    You try to appear casual as you stroll around the perimeter, hoping that the guards in the turrets
    nearby don't decide to take you as a threat and use you for target practice.  There is a small trail
    leading off into the forest to the west from here.
  sector: inside
  exits:
    north:
      to: tba:326:room:32630
    south:
      to: tba:326:room:32648
    west:
      to: tba:326:room:32649

"tba:326:room:32630":
  name: Camp Perimeter
  description: >
    To continue along the edge of the camp, you will need to turn east or south from here.  To the
    north is a small trail into the surrounding forest and of course - although you cannot enter into it from
    here - there is one of the ever-present turrets just inside the barbed wire mesh .
  sector: inside
  exits:
    north:
      to: tba:326:room:32652
    east:
      to: tba:326:room:32631
    south:
      to: tba:326:room:32629

"tba:326:room:32631":
  name: Camp Perimeter
  description: >
    You continue along the rim of the valley, staying clear of the wicked looking barbed wire which
    threatens to snag your finery if you get too close.  You can head west or north along the perimeter.
  sector: inside
  exits:
    north:
      to: tba:326:room:32632
    west:
      to: tba:326:room:32630

"tba:326:room:32632":
  name: Camp Perimeter
  description: >
    You stand on the wagon trail which circles the entire valley - the barbed wire encircled camp and
    valley to the east and south, the forest to the north and west.  A trail leads off into the woods just
    west from here.
  sector: inside
  exits:
    east:
      to: tba:326:room:32633
    south:
      to: tba:326:room:32631
    west:
      to: tba:326:room:32653

"tba:326:room:32633":
  name: Camp Perimeter
  description: >
    You continue along the perimeter of the camp, trying to appear as nonchalant as possible so that
    the archers in the turrets do not take any true notice of you.  To the east there is some sort of
    activity, lots of noise and movement.
  sector: inside
  exits:
    east:
      to: tba:326:room:32634
    west:
      to: tba:326:room:32632

"tba:326:room:32634":
  name: Camp Perimeter
  description: >
    The wagon trail leads east along the rim of the valley, encircling the entire thing.  Just
    northeast of here you see an area which must be the logging crew's alotted space for supplying the troops
    with wood to build with, burn and use for general purposes.
  sector: inside
  exits:
    east:
      to: tba:326:room:32635
    west:
      to: tba:326:room:32633

"tba:326:room:32635":
  name: Camp Perimeter
  description: >
    You may follow the wagon trail along the perimeter of the camp or leave the trail to enter into the
    small logging area that the army uses to supply itself with wood.
  sector: inside
  exits:
    north:
      to: tba:326:room:32670
    south:
      to: tba:326:room:32636
    west:
      to: tba:326:room:32634

"tba:326:room:32636":
  name: Camp Perimeter
  description: >
    The wagon trail makes a bend here, following along the valley edge, the barbed wire as tall and
    wicked looking as ever.  You can see to the north and east entryways into the logging area for the army,
    where a frenzy of activity seems constant, foremen shouting orders of the hack and slash of axes.
  sector: inside
  exits:
    north:
      to: tba:326:room:32635
    east:
      to: tba:326:room:32637

"tba:326:room:32637":
  name: Camp Perimeter
  description: >
    The trail runs along the edge of the valley north to south.  You are continually amazed at the
    sheer immensity that this army exhibits, especially viewed from this height.  The forest surrounds the
    valley from every direction, small trails leading from this wagon trail every now and again.
  sector: inside
  exits:
    north:
      to: tba:326:room:32671
    south:
      to: tba:326:room:32638
    west:
      to: tba:326:room:32636

"tba:326:room:32638":
  name: Camp Perimeter
  description: >
    You may continue along the perimeter north to south or head off east into the woods, where a small
    trail cuts into the thick wood.
  sector: inside
  exits:
    north:
      to: tba:326:room:32637
    east:
      to: tba:326:room:32660
    south:
      to: tba:326:room:32639

"tba:326:room:32639":
  name: Camp Perimeter
  description: >
    You may continue north or south along the perimeter.  Beware the looming turrets which never seem
    far enough away...
  sector: inside
  exits:
    north:
      to: tba:326:room:32638
    south:
      to: tba:326:room:32640

"tba:326:room:32640":
  name: Camp Perimeter
  description: >
    It appears that the main highway simply left off at the valley's edge on the opposite side of here
    and started right back up on this side, heading off east into the forest, wide and hard packed as it
    is on the other end.  There is a gate here which would lead into the camp, however it appears to be
    in some disuse, locked and shackled so as not to allow a way through.
  sector: inside
  exits:
    north:
      to: tba:326:room:32639
    east:
      to: tba:326:room:32677
    south:
      to: tba:326:room:32641
    west:
      to: tba:324:room:32414
      door:
        keywords: [gate]
        kind: pickproof
        reset: locked

"tba:326:room:32641":
  name: Camp Perimeter
  description: >
    The wagon trail runs along north and south along the valley's edge, along the barbed wire which
    encircles the entire valley as well.  A small path leads off into the thick woods to the east.
  sector: inside
  exits:
    north:
      to: tba:326:room:32640
    east:
      to: tba:326:room:32663
    south:
      to: tba:326:room:32642

"tba:326:room:32642":
  name: Camp Perimeter
  description: >
    The wagon trail makes a turn - as does the barbed wire, following along the edge of the valley.  A
    small trail leads south from here into the woods.
  sector: inside
  exits:
    north:
      to: tba:326:room:32641
    south:
      to: tba:326:room:32659
    west:
      to: tba:326:room:32643

"tba:326:room:32643":
  name: Camp Perimeter
  description: >
    You may travel east or south along the wagon trail which encircles the camp. Caution is advised to
    a large degree along this pathway, as any lingering could result in the loosing of arrows from the
    guards in any of the many turrets which surround the camp.
  sector: inside
  exits:
    east:
      to: tba:326:room:32642
    south:
      to: tba:326:room:32644

"tba:326:room:32644":
  name: Camp Perimeter
  description: >
    The wagon trail curves north and west along the edge of the valley, giving you a wonderful vantage
    point to look at the whole of the army.  It is staggering, the number of men in this outfit, at least
    judging from the size of the encampment.
  sector: inside
  exits:
    north:
      to: tba:326:room:32643
    west:
      to: tba:326:room:32645

"tba:326:room:32645":
  name: Camp Perimeter
  description: >
    The wagon trail runs along east and west past one of the many guard turrets here.  The forest to
    the south of you is thick and impassable, at least through ordinary means, so your choices are limited
    to that which the road offers.
  sector: inside
  exits:
    east:
      to: tba:326:room:32644
    west:
      to: tba:326:room:32646

"tba:326:room:32646":
  name: Camp Perimeter
  description: >
    The wagon trail runs along the rim of the valley, turning north and east with the barbed wire.  To
    the south a small trail leads off into the thick woods, probably one of many which run through these
    thick woods.
  sector: inside
  exits:
    north:
      to: tba:326:room:32647
    east:
      to: tba:326:room:32645
    south:
      to: tba:326:room:32654

"tba:326:room:32647":
  name: Camp Perimeter
  description: >
    You follow along the perimeter of the camp, a wide wagon trail which encircles the entire valley. 
    A barbed wire mesh runs along the roadside, preventing entry into the valley through conventional
    means.  One could probably pass through the barbed wire with a small scattering of abrasions, but not
    before archers and crossbowmen from the guard turrets which also line the road, cut one down while
    flailing in the wire.  Probably it is best to follow along the road and seek other means of entry.
  sector: inside
  exits:
    north:
      to: tba:326:room:32610
    south:
      to: tba:326:room:32646

"tba:326:room:32648":
  name: Camp Perimeter
  description: >
    The barbed wire mesh which encircles the whole of the valley give you pause to think that maybe you
    had best gain entry through civilized means rather than trying to force your way through and risk
    getting cut or hurt on the wire.  Of course, getting cut on wire would actually pale in comparison to
    getting shot with an arrow or bolt from one of the guard turrets which line the crest of the valley.
  sector: inside
  exits:
    north:
      to: tba:326:room:32629
    south:
      to: tba:326:room:32610

"tba:326:room:32649":
  name: Forest Path
  description: >
    The forest cuts out all sounds of the army, immediately and completely.  The path heads north
    deeper into the forest or east back to the wagon trail.
  sector: inside
  exits:
    north:
      to: tba:326:room:32650
    east:
      to: tba:326:room:32629

"tba:326:room:32650":
  name: Forest Path
  description: >
    You stand in the depths of this forest with the oddest feeling that someone or something seems to
    be watching you.  Perhaps from the trees...
  sector: inside
  exits:
    north:
      to: tba:326:room:32651
    south:
      to: tba:326:room:32649
    up:
      to: tba:326:room:32669

"tba:326:room:32651":
  name: Forest Path
  description: >
    The trail turns east and south from here, the creak old branches and the sway of the leaves as they
    ride on the currents of the wind high above all you hear. You cannot shake the feeling of being
    watched, though.
  sector: inside
  exits:
    east:
      to: tba:326:room:32652
    south:
      to: tba:326:room:32650

"tba:326:room:32652":
  name: Forest Path
  description: >
    The path runs through the forest, branching in a number of directions here. The feeling that you
    are being watched is stronger than ever.  Possibly from the trees...
  sector: inside
  exits:
    east:
      to: tba:326:room:32653
    south:
      to: tba:326:room:32630
    west:
      to: tba:326:room:32651
    up:
      to: tba:326:room:32668

"tba:326:room:32653":
  name: Forest Path
  description: >
    The sounds of the army and the people in the valley are completely swallowed by the looming trees
    of this thick forest.  You feel immediately isolated and alone, and very vulnerable.  In fact, you
    could almost swear that you were being watched.
  sector: inside
  exits:
    east:
      to: tba:326:room:32632
    west:
      to: tba:326:room:32652

"tba:326:room:32654":
  name: Path Through the Trees
  description: >
    As you leave the open air of the wagon trail behind and enter into the forest, you are immediately
    struck by the silence that the forest has captured. With the foliage so thick, no sound travels
    through the trees at all, save for the occasional creak of a tree as it sways or the skitter of a
    chipmunk.  A strange feeling of being watched also pervades the area.
  sector: inside
  exits:
    north:
      to: tba:326:room:32646
    east:
      to: tba:326:room:32656
    south:
      to: tba:326:room:32655

"tba:326:room:32655":
  name: Path Through the Trees
  description: >
    This is a dead-end in the trail, best to just head back toward the wagon trail.  Especially now
    that the sensation of being watched is stronger than ever.  Kind of creepy.
  sector: inside
  exits:
    north:
      to: tba:326:room:32654
    up:
      to: tba:326:room:32665

"tba:326:room:32656":
  name: Path Through the Trees
  description: >
    The path heads east and west throught the trees, the feeling that someone is watching always just
    behind you or over your shoulder.
  sector: inside
  exits:
    east:
      to: tba:326:room:32657
    west:
      to: tba:326:room:32654

"tba:326:room:32657":
  name: Path Through the Trees
  description: >
    The path heads east and west throught the trees, the feeling that someone is watching always just
    behind you or over your shoulder.
  sector: inside
  exits:
    east:
      to: tba:326:room:32658
    west:
      to: tba:326:room:32656

"tba:326:room:32658":
  name: Path Through the Trees
  description: >
    The forest itself seems cheery enough, although a bit overgrown so as to prevent any progress save
    that offered by the trail.  However, you get the strangest feeling that you are being watched,
    perhaps from the trees...
  sector: inside
  exits:
    north:
      to: tba:326:room:32659
    west:
      to: tba:326:room:32657
    up:
      to: tba:326:room:32666

"tba:326:room:32659":
  name: Path Through the Trees
  description: >
    The path leads through the trees deep into the forest.  You may head south deeper into the trees or
    north back out onto the wagon trail.
  sector: inside
  exits:
    north:
      to: tba:326:room:32642
    south:
      to: tba:326:room:32658

"tba:326:room:32660":
  name: Faint Path Through the Forest
  description: >
    This seems to be more of a deer run than a path, although upon inspection of the trail, you do see
    the mark of booted feet having traveled this way.  The forest immediately surrounds you, placing you
    in an entirely different surrounding that of what you grew accustomed to along the wagon trail.
  sector: inside
  exits:
    east:
      to: tba:326:room:32661
    west:
      to: tba:326:room:32638

"tba:326:room:32661":
  name: Faint Path Through the Forest
  description: >
    The path turns south and east from here, south leading deeper into the forest.  You have the
    strangest feeling, almost as if you were being watched...
  sector: inside
  exits:
    south:
      to: tba:326:room:32662
    west:
      to: tba:326:room:32660

"tba:326:room:32662":
  name: Faint Path Through the Forest
  description: >
    The path branches here, heading north, south, and east.  The feeling of being watched is as strong
    as ever.
  sector: inside
  exits:
    north:
      to: tba:326:room:32661
    east:
      to: tba:326:room:32664
    south:
      to: tba:326:room:32663

"tba:326:room:32663":
  name: Faint Path Through the Forest
  description: >
    You are immediately swallowed up by the forest, all sound and feel of open air has been replaced by
    a stuffy, isolated feeling.  The trail heads north or back west onto the wagon trail.
  sector: inside
  exits:
    north:
      to: tba:326:room:32662
    west:
      to: tba:326:room:32641

"tba:326:room:32664":
  name: Faint Path Through the Forest
  description: >
    You have reached a dead-end in the path.  Your only choice is to turn back the way you came, the
    forest is just simply too thick to pass through without having a trail to follow.  You feel eyes upon
    you as you turn around and prepare to head back the way you came.  Perhaps someone in the trees...?
  sector: inside
  exits:
    west:
      to: tba:326:room:32662
    up:
      to: tba:326:room:32667

"tba:326:room:32665":
  name: Lookout Post
  description: >
    You stand in the tree on a small wood platform.  It has been painted and hidden so as to bland in
    with the forest surroundings, quite skillfully, actually.
  sector: inside
  exits:
    down:
      to: tba:326:room:32655

"tba:326:room:32666":
  name: Lookout Post
  description: >
    This small area in the tree has been painted and concealed to hide its location from any would-be
    attackers on the encampment.  It seems to work pretty well, too!
  sector: inside
  exits:
    down:
      to: tba:326:room:32658

"tba:326:room:32667":
  name: Lookout Post
  description: >
    This small wood platform has been concealed so as to blend in almost perfectly with the trees of
    the forest.  From below, no one would ever suspect that this small outpost existed.
  sector: inside
  exits:
    down:
      to: tba:326:room:32664

"tba:326:room:32668":
  name: Lookout Post
  description: >
    The boards of this small platform have been painted in forest hues to conceal it that much the
    better.  Branches and leaves have been draped over the tops of the post to give it a natural look.  From
    below, no one would suspect a thing.
  sector: inside
  exits:
    down:
      to: tba:326:room:32652

"tba:326:room:32669":
  name: Lookout Post
  description: >
    This small post has been cleverly painted in hues of green and brown so that passerbys in the
    forest below might not notice its existance.
  sector: inside
  exits:
    down:
      to: tba:326:room:32650

"tba:326:room:32670":
  name: Logging Area
  description: >
    You stand amidst an array of stumps and burnt grass, piles of timber lying everywhere.  At the
    edges of the area, where the army has not yet gone into to cut down these trees, lies stacks and stacks
    of shorn tree trunks, the limbs and bows all cut from them to form perfect logs.
  sector: inside
  exits:
    north:
      to: tba:326:room:32675
    east:
      to: tba:326:room:32671
    south:
      to: tba:326:room:32635

"tba:326:room:32671":
  name: Logging Area
  description: >
    You walk among the broken tree stumps, the idea that where you now stand was once a strong,
    thriving forest which towered high above your head only a vague realization.  It is almost impossible to
    believe that there were ever trees here, even though the litter of stumps all over the ground tells
    otherwise.
  sector: inside
  exits:
    north:
      to: tba:326:room:32674
    east:
      to: tba:326:room:32672
    south:
      to: tba:326:room:32637
    west:
      to: tba:326:room:32670

"tba:326:room:32672":
  name: Logging Area
  description: >
    You stand amidst an array of stumps and burnt grass, piles of timber lying everywhere.  At the
    edges of the area, where the army has not yet gone into to cut down these trees, lies stacks and stacks
    of shorn tree trunks, the limbs and bows all cut from them to form perfect logs.
  sector: inside
  exits:
    north:
      to: tba:326:room:32673
    west:
      to: tba:326:room:32671

"tba:326:room:32673":
  name: Logging Area
  description: >
    The trees here have been cut recently, you can still smell the drying sap in the air and the dust
    that the axes create when striking the trees so hard.  You see just north of here an area where it
    appears the army has cut into within the last month or less - it does not seem as finalized of an area
    as the rest of this does.
  sector: inside
  exits:
    north:
      to: tba:326:room:32676
    south:
      to: tba:326:room:32672
    west:
      to: tba:326:room:32674

"tba:326:room:32674":
  name: Logging Area
  description: >
    The neat rows of logs end just north of here, where the forest still stands strong and thick, where
    the army has not yet worked their way into.
  sector: inside
  exits:
    east:
      to: tba:326:room:32673
    south:
      to: tba:326:room:32671
    west:
      to: tba:326:room:32675

"tba:326:room:32675":
  name: Logging Area
  description: >
    You stand at the northwest corner of the area that has been cleared away from the forest by the
    army's loggers.  Neat rows of logs twice as tall as you line along the forest's edge to your west,
    unbroken forest to your north.
  sector: inside
  exits:
    east:
      to: tba:326:room:32674
    south:
      to: tba:326:room:32670

"tba:326:room:32676":
  name: A Large Stump
  description: >
    This small area holds only one single stump.  This would be odd in itself since the area al around
    it is so filled with trees, but the stump itself is as big around as a house.  It appears that the
    tree that used to stand here was most probably one of the oldest in the forest and because of its
    immensity kept the area around from growing up too much, its roots alone must have crowded any other
    growth away.
  sector: inside
  exits:
    south:
      to: tba:326:room:32673

"tba:326:room:32677":
  name: Wide Trail
  description: >
    The trail picks up from the wide trail at the other side of the valley, just as if there were no
    huge camp seperating the two sections of road.  This side seems just as well traveled as its western
    counterpart, wagon tracks and hoofprints galore.  The camp is off just west of here, the road follows
    through the forest to the east.
  sector: inside
  exits:
    east:
      to: tba:326:room:32678
    west:
      to: tba:326:room:32640

"tba:326:room:32678":
  name: Wide Road
  description: >
    The road continues through to the east and west.  Off to the east you see the faint sheen of smoke
    on the horizon, as is common with most large towns.  To the west is the encampment of the Eastern
    Army.
  sector: inside
  exits:
    east:
      to: tba:326:room:32679
    west:
      to: tba:326:room:32677

"tba:326:room:32679":
  name: Wide Road
  description: >
    The forest is beginning to thin somewhat, the trees becoming more sparse giving way to small fields
    of tall grass and sporatic copses of trees.  The signs of traffic are becoming more and more
    abundant the farther to the east that is traveled.
  sector: inside
  exits:
    west:
      to: tba:326:room:32678
