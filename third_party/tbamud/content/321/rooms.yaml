"tba:321:room:32100":
  name: Calm Waters
  description: >
    The waters of the sea are very still here, so still that they bring a feeling of peace and
    comfort.  They are not the dead calm that always is associated with dread in a sailor's heart but a slowly
    moving roll that promises a good day at sea.
  sector: inside
  exits:
    north:
      to: tba:321:room:32121
    east:
      to: tba:321:room:32195
    south:
      to: tba:321:room:32199
