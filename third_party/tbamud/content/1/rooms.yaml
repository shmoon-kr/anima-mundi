# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 1.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:1:room:100":
  name: Temple of Sanctum
  description: >
    This large room appears to be inside a massive temple dedicated to the gods of Sanctus.  The
    ceiling is supported by fluted columns and a main spiral stairwell that leads both up and down.  Small
    rooms adjoin this chamber in all four cardinal directions.  It is here mortals come to stay informed and
    discuss their adventures.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:1:room:113
    east:
      to: tba:1:room:117
    south:
      to: tba:1:room:120
    west:
      to: tba:1:room:116
    up:
      to: tba:1:room:101
    down:
      to: tba:2:room:251
  extras:
  - keywords: [info, credits]
