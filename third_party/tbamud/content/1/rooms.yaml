        Plot         : Fabric of time torn, world going to hell. Sanctus one of the few
                       safe havens remaining.
        Notes        : None
        Zone 1 is linked to the following zones:
          2 Sanctus II                     at   100 (down ) --->   251
          3 Sanctus III                    at   101 (south) --->   365
