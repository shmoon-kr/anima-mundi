"tba:1:obj:196":
  type: food
  keywords: [mistletoe, plant]
  short: some mistletoe
  long: A soft woody plant with green leaves and white berries is hanging over your head.
  wear: [take, hold]
  values:
    hours: 1
    poisoned: false
  weight: 1
  cost: 1
  rent: 0
  level: 0
  extras:
  - keywords: [plant, mistletoe]
    text: >
      The tradition of kissing under the mistletoe originated from the Druids who considered the
      mistletoe sacred.  They believed that it held magical virtue and was a remedy for evil.  The priests would
      cut pieces of the oak tree on which the mistletoe grew and offer them along with two white bulls as a
      sacrifice to pagan gods.  Twigs with berries were hung above doors to indicate that past grievance and
      hatreds were forgiven and it was used in amulets, bracelets and rings to ward off evil and protect
      against witchcraft and poisoning.  Mistletoe symbolizes peace and love.

