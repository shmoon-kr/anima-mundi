"tba:31:room:3104":
  name: The Northeast End Of The Concourse
  description: >
    You are at the Concourse.  The city wall is just east and a small promenade goes west.  Looking
    across the river you see a building that resembles a warehouse.  The Concourse continues south along the
    city wall.
  sector: city
  exits:
    south:
      to: tba:31:room:3130
      look: The Concourse continues south.
    west:
      to: tba:31:room:3103
      look: You see the promenade.
  extras:
  - keywords: [wall]
    text: >
      It is built from large gray rocks that have been fastened to each other with some kind of mortar. 
      It is far too high to climb.

