# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 31.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:31:room:3100":
  name: The Northwest End Of The Concourse
  description: >
    You are at the concourse, the city wall is just west.  A small promenade goes east, and the bridge
    is just north of here.  The concourse continues south along the city wall.
  sector: city
  exits:
    north:
      to: tba:30:room:3051
      look: You see the Bridge.
    east:
      to: tba:31:room:3101
      look: You see the promenade.
    south:
      to: tba:31:room:3127
      look: The promenade continues far south.

"tba:31:room:3101":
  name: The Promenade
  description: >
    The river gently flows westwards just north of here.  The promenade continues further east and to
    the west you see the city wall.  Park Road leads south from here.
  sector: city
  exits:
    east:
      to: tba:31:room:3102
      look: The promenade continues.
    south:
      to: tba:31:room:3131
      look: Park Road leads south.
    west:
      to: tba:31:room:3100
      look: You see the Concourse.

