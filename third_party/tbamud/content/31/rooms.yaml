"tba:31:room:3137":
  name: The Waiting Room
  description: >
    You are standing in the waiting room at the town hall.  Wooden chairs stand along the walls and a
    long desk with a typewriter is placed in the middle of the room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:31:room:3138
      look: It looks like some kind of office.
    west:
      to: tba:31:room:3117
      look: The exit west leads to Emerald Avenue.
  extras:
  - keywords: [chair, chairs]
    text: Not the very least comfortable.
  - keywords: [desk]
    text: >
      An extremely heavy desk.  It is so large that it doesn't even need drawers. Everything can be
      stored on its top.
  - keywords: [typewriter]
    text: >
      It is an ancient Quifatronic T-1000 mk I.  These machines are known for their incredible
      durability, and for their even more incredible weight.  They make a Cray II look like a laptop.

"tba:31:room:3138":
  name: The Mayor's Office
  description: >
    You are in the not very big office of the Mayor of Midgaard.  A large and polished but completely
    empty desk is standing in front of an armchair that looks so comfortable that it most of all resembles
    a bed with the head end raised slightly.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:31:room:3137
      look: The waiting room is to the west.
  extras:
  - keywords: [desk]
    text: This desk is obviously very old.  Nevertheless it looks as if has never been used.
  - keywords: [chair, armchair]
    text: >
      This chair is really a masterpiece.  A chair where one can sit as comfortably as in a bed.  All
      auditoriums should be equipped with these things.  A shame that there wouldn't be room for the students
      too, though.

