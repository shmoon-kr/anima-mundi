"tba:31:room:3120":
  name: The Road Crossing
  description: >
    You are in the middle of the road cross.  Roads lead in all directions. A huge black iron chain as
    thick as a tree trunk is fastened into the ground at the center of the road cross.  Its other end
    leads directly upwards towards the sky. A road sign is here.
  sector: city
  exits:
    north:
      to: tba:31:room:3133
    east:
      to: tba:31:room:3136
    south:
      to: tba:31:room:3134
    west:
      to: tba:31:room:3135
    up:
      to: tba:79:room:7914
      look: The chain disappears in the clouds.
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           The sign points in all directions:
           North - Emerald Avenue.
           East  - Park Road.
           South - Emerald Avenue.
           West  - Park Road.
        Someone has added the following with red paint:
           Up    - Redferne's Flying Citadel.
  - keywords: [chain]
    text: >
      The chain reaches the clouds high above you.  It must take some really powerful magic to hold such
      a chain in place.

