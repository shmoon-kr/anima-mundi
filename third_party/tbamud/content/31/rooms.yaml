"tba:31:room:3155":
  name: Inside The Chapel
  description: >
    You are in a small, dark chapel.  The dark brown glass in the tiny windows do not let much light
    through.  A few rows of worn wooden benches stand here and an ancient altar sits in the middle of the
    floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:31:room:3154
      look: The chapel door is made of dark wood.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [glass, windows]
    text: The windows must be meant to be dark.  At least they are completely clean.
  - keywords: [altar]
    text: >
      The altar looks very old...  You examine the floor around the altar and notice that it seems less
      dusty than the rest of the room...  Someone must clean here regularly...  Maybe that old guy in Park
      Cafe, he looked like that sort...
  - keywords: [benches, rows]
    text: The benches are not of the comfortable kind.
