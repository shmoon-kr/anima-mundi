"tba:251:room:25115":
  name: Grassy Field
  description: >
    You're on the northwestern edge of a large grassy field. Waist high grasses completely surround
    you. The back of a large sandy colored building is directly north of you.
  sector: field
  exits:
    east:
      to: tba:251:room:25116
      look: The Ape Village Entrance is East.
    south:
      to: tba:251:room:25110
      look: The field continues South.

"tba:251:room:25116":
  name: Ape Village Entrance
  description: >
    Just ahead you can see dozens of sandy colored rounded buildings. A small woooden guard booth has
    been errected on the eastern side of the road. A tall steel rod is attached to the side of the booth,
    and a large cloth flag attached to the top flaps in the wind. The flag has a picture of a monkey face
    on it, meaning that this place must be the APE VILLAGE!
  sector: field
  exits:
    north:
      to: tba:251:room:25122
      look: Ape Road continues North.
    east:
      to: tba:251:room:25117
      look: A grassy field is East.
    south:
      to: tba:251:room:25111
      look: The path continues South.
    west:
      to: tba:251:room:25115
      look: A grassy field is West.

