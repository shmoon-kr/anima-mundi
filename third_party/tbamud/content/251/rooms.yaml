# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 251.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:251:room:25100":
  name: Grassy Field
  description: >
    You're on the southwestern corner of a large grasy field. Waist high grasses completely surround
    you. You can see the odd willow tree growing amongst the grass. A dense forest is to the south and
    west. A dirt path is to the east.
  sector: field
  exits:
    north:
      to: tba:251:room:25105
      look: The field continues North.
    east:
      to: tba:251:room:25101
      look: A dirt path is to the East.
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           x---------------------------------------------------------------------x
           |                APE VILLAGE ZONE - FOR CIRCLEMUD 3.1                 |
           |                     Written in 2001 by Crazyman                     |
           x---------------------------------------------------------------------x
            This is the first zone I ever wrote. It's based on the original 1968
            Planet of the Apes movie. The zone is currently attached to the world
            north of room 6090, which is just before the forest west of Midgaard.
        
            Written entirely from scratch in WordPad. Feel free to edit, modify,
            and do what you want with this zone!
           x---------------------------------------------------------------------x
           Builder      : Crazyman
           Zone         : 251 Ape Village
           Player Level : 18-22
           Rooms        : 99
           Mobs         : 15
           Objects      : 9
           Shops        : 1
           Links        : 01s, 41d, 80n

