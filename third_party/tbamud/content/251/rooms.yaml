"tba:251:room:25196":
  name: Statue of Liberty Stairs
  description: >
    You're on a staircase leading up the Statue of Liberty. Back when this place wasn't wrecked, people
    used to come here to tour the statue and to get a nice view of New York. Now, the staircase is full
    of cobwebs and many large cracks can be seen along the walls.
  sector: inside
  exits:
    up:
      to: tba:251:room:25197
      look: The stairs continue Up.
    down:
      to: tba:251:room:25188
      look: The sandy beach is Down.

