"tba:251:room:25114":
  name: Grassy Field
  description: >
    You're on the eastern edge of a large grassy field. Waist high grasses completely surround you. A
    large sandy colored building is to the north. The grass has been cut around the building, and a small
    stack of firewood is resting beside the door.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25119
      look: A sandy colored building is North.
    south:
