"tba:251:room:25118":
  name: Grassy Field
  description: >
    You're on the northeastern edge of a large grassy field. Waist high grasses completely surround
    you. The back of a large sandy colored building is directly north of you, and another sandy colored
    building is east of you.
  sector: field
  exits:
    south:
      to: tba:251:room:25113
      look: The field continues South.
    west:
      to: tba:251:room:25117
      look: The field continues West.

"tba:251:room:25119":
  name: Ape Office
  description: >
    You're in a tidy office. Stacks of papers are neatly piled on a large wooden table, while
    bookshelves filled with books line the walls. A large shuttered window faces south onto the grassy plains.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:251:room:25125
      look: The Operating Room is North.
    south:
      to: tba:251:room:25114
      look: The Grassy Field is South.

"tba:251:room:25120":
  name: Wax Museum, Level Two
  description: >
    This is the second level of the wax museum. A few old human artifacts lie beneath glass
    countertops. More wax humans are positioned in various combat stances. A large dirt ramp leads down to the first
    level of the museum.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:251:room:25121
      look: First Level of the Wax Museum is Down.

"tba:251:room:25121":
  name: Wax Museum
  description: >
    What a crazy place! Wax statues of cavemen line the walls, and some are even set up in battle
    scenes. A large circular dirt ramp leads up to a second story.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:251:room:25129
      look: Ape Lane is to the North.
    east:
      to: tba:251:room:25122
      look: The Ape Village entrance is to the East.
    up:
      to: tba:251:room:25120
      look: Ape Museum, Level 2

"tba:251:room:25122":
  name: Ape Road South
  description: >
    You are on a well worn dirt road, in between two sandy colored buildings. The Wax Museum lies to
    the west, and the Weapons Shop is to the east. The Town Square is to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25130
      look: Ape Road continues North.
    east:
      to: tba:251:room:25123
      look: The Weapons Shop is to the East.
    south:
      to: tba:251:room:25116
      look: The Ape Village Entrance is to the South.
    west:
      to: tba:251:room:25121
      look: The Wax Museum is to the West.

"tba:251:room:25123":
  name: Ape Weapons Shop
  description: >
    This building is filthy. The dirt floors have bits of straw and leaves all over them, and old
    wooden barrels line the walls. A few "windows" (really just holes smashed into the walls) face the street
    to the north. A long counter spans the entire southern length of the room. Behind the counter lies an
    impressive selection of rifles and shotguns. These apes sure know their weapons!
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:251:room:25131
      look: Ape Lane is to the North.
    west:
      to: tba:251:room:25122
      look: Ape Road is to the West

"tba:251:room:25124":
  name: Ape Zoo
  description: >
    You're in the northern part of a small field. In the middle of the field is a huge bamboo cage.
    Inside this cage are several cavemen, who are all climbing, screaming, and fighting each other. The apes
    find this to be pretty exciting.
  sector: field
  exits:
    north:
      to: tba:251:room:25132
      look: Ape Lane is to the North.

"tba:251:room:25125":
  name: Operating Room
  description: >
    You're in a primitive operating room. Wooden tables are arranged in the middle of the room.
    Extremely primitive looking tools are stored in a glass cabinet on the western wall. You definetely wouldn't
    want to be a patient here!
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:251:room:25133
      look: The Ape Hospital is to the North.
    east:
      to: tba:251:room:25126
      look: A large cage is to the East.
    south:
      to: tba:251:room:25119
      look: The Hospital Office is to the South.

"tba:251:room:25126":
  name: Human Cage
  description: >
    You're in a large cage. The cage stinks of rotten food and urine. A narrow window looks out onto
    the grassy plains to the east. Straw covers the stone floor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:251:room:25125
      look: The Operating Room is to the West.

"tba:251:room:25127":
  name: Gorilla Bunkhouse
  description: >
    You're in a large stinky room. Around 20 beds are lined up neatly in the room. Several large
    lockers can been seen against the walls. This is where the gorilla soldiers live.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:251:room:25128
      look: Gorilla Training is to the East.

"tba:251:room:25128":
  name: Gorilla Training Center
  description: >
    You find yourself in a large, well lit gym. Exercise machines and weight benches are scattered
    around the room. Several straw dummies are positioned against the southern walls, with arrows and spears
    stuck in them. The Gorilla Soldiers train here.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:251:room:25129
      look: The eastern end of Ape Lane is to the East.
    west:
      to: tba:251:room:25127
      look: The Gorilla Bunkhouse is to the West.

"tba:251:room:25129":
  name: Western End of Ape Lane
  description: >
    Ape Lane is the main street of Ape Village. To the northwest is a large pond, which must be where
    the apes get their water. A small park lies North, and the Wax Museum is to the South.
  sector: city
  exits:
    north:
      to: tba:251:room:25137
      look: Ape Park is to the North.
    east:
      to: tba:251:room:25130
      look: The main square is to the East.
    south:
      to: tba:251:room:25121
      look: The Wax Museum is to the South.
    west:
      to: tba:251:room:25128
      look: The Gorilla training ground is to the West.

"tba:251:room:25130":
  name: Ape Village Square
  description: >
    This is the Ape Village Town Square. A large stone statue of the greatest Ape to ever live, the Law
    Giver, stands in the center of the square on a stone pedistal. The words "Ape will never kill ape!"
    are inscribed on the pedistal.
  sector: city
  exits:
    north:
      to: tba:251:room:25138
      look: Ape Road continues North.
    east:
      to: tba:251:room:25131
      look: Ape Lane continues East.
    south:
      to: tba:251:room:25122
      look: Ape Village Entrance is to the South.
    west:
      to: tba:251:room:25129
      look: Ape Lane continues West.

"tba:251:room:25131":
  name: Ape Lane East
  description: >
    You're on Ape Lane East.  Simian Public School is to the North, and the Weapons Shop is to the
    South.  The place looks like a typical human town, except for the inhabitants.
  sector: city
  exits:
    north:
      to: tba:251:room:25139
      look: Simian Public School is to the North.
    east:
      to: tba:251:room:25132
      look: Eastern End of Ape Lane is to the East.
    south:
      to: tba:251:room:25123
      look: The Weapons Shop is to the South.
    west:
      to: tba:251:room:25130
      look: Ape Road continues to the West.

"tba:251:room:25132":
  name: Eastern End of Ape Lane
  description: >
    This is where all the science facilities are located. The Ape Hospital is to the east, Cornelius
    and Zira's house is to the north, and the Ape Zoo is to the south.
  sector: city
  exits:
    north:
      to: tba:251:room:25140
      look: Cornelius and Zira's House is to the North.
    east:
      to: tba:251:room:25133
      look: The Ape Hospital is to the East.
    south:
      to: tba:251:room:25124
      look: The Ape Zoo is to the South.
    west:
      to: tba:251:room:25131
      look: Ape Lane contines West.

"tba:251:room:25133":
  name: Ape Hospital
  description: >
    The Ape Hospital is where the Apes perform experiments on the cavemen. Physical and psychological
    tests are conducted, and the Apes are particularly fond of lobotomies. Large cages are positioned
    against the eastern wall. The cages have some cavemen in them, and they also have beds of straw.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:251:room:25134
      look: A cage is to the East.
    south:
      to: tba:251:room:25125
      look: The Operating Room is to the South.
    west:
      to: tba:251:room:25132
      look: The Eastern End of Ape Lane is to the West.

"tba:251:room:25134":
  name: Human Cage
  description: >
    You are in a large cage.  The cage stinks of rotten food.  A narrow window looks out onto the
    grassy plains to the east.  Straw covers the stone floor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:251:room:25133
      look: The Ape Hospital is to the West.

"tba:251:room:25135":
  name: Ape Pond
  description: >
    You are swimming in a large pond.  The water is quite calm, and lilly pads are growing all around. 
    To the north you can see a dangerous raging whirlpool.
  sector: water_swim
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25141
      look: A raging whirlpool is North.
    east:
      to: tba:251:room:25136
      look: The pond continues East.

"tba:251:room:25136":
  name: Ape Pond
  description: >
    You find yourself wading in shallow water.  The water seems clean enough, but you probably would
    not want to drink from it.  To the east is a clearing leading to Ape Park.
  sector: water_swim
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25142
      look: The pond continues North.
    east:
      to: tba:251:room:25137
      look: Ape Park is East.
    west:
      to: tba:251:room:25135
      look: The pond continues West.

"tba:251:room:25137":
  name: Ape Park
  description: >
    Ape Park is popular with the Apes.  While here the Apes can swim or play games.  A large pond is to
    the west in the middle of the large clearing for swimming.
  sector: field
  exits:
    east:
      to: tba:251:room:25138
      look: Ape Road is to the East.
    south:
      to: tba:251:room:25129
      look: Ape Lane is to the South.
    west:
      to: tba:251:room:25136
      look: Ape Pond is West.

"tba:251:room:25138":
  name: Ape Road North
  description: >
    Ape Road North is the road that leads to the Forbidden Zone.  To the west is the Ape Park and what
    looks like a lake.  To the east is Simian Public School.
  sector: city
  exits:
    north:
      to: tba:251:room:25144
      look: Ape Road continues North.
    east:
      to: tba:251:room:25139
      look: Simian Public School is to the East.
    south:
      to: tba:251:room:25130
      look: Ape Village Square is to the South.
    west:
      to: tba:251:room:25137
      look: Ape Park is to the West.

"tba:251:room:25139":
  name: Simian Public School
  description: >
    Simian Public School is where the child apes go to school. The school room itself is round, and the
    teacher stands in the middle. A large statue of the Law Giver stands at the front of the room.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:251:room:25131
      look: Ape Lane is to the South.
    west:
      to: tba:251:room:25138
      look: Ape Road is to the West.

"tba:251:room:25140":
  name: Cornelius and Zira's House
  description: >
    This is actually a fairly tidy ape home. A large wooden table sits in the middle, and a large bed
    is at the back of the room. A large bookshelf contains hundreds of books dedicated to Archeology and
    Psychology.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:251:room:25132
      look: Ape Lane is to the South.

"tba:251:room:25141":
  name: Whirlpool
  description: >
    You find yourself struggling to keep your head above the water. You peer down into the water but
    all you can see is darkness. Maybe going down isn't such a good idea.
  sector: water_swim
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:251:room:25146
      look: The pond continues North.
    east:
      to: tba:251:room:25142
      look: The pond continues East.
    south:
      to: tba:251:room:25135
      look: The pond continues South.

"tba:251:room:25142":
  name: Ape Pond
  description: >
    You are swimming in a large pond.  The water is quite calm, and lilly pads are growing all around. 
    To the west you can see a dangerous raging whirlpool.
  sector: water_swim
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25147
      look: The pond contines North.
    east:
      to: tba:251:room:25143
      look: The pond shore is East.
    south:
      to: tba:251:room:25136
      look: The pond continues South.
    west:
      to: tba:251:room:25141
      look: A raging whirlpool is West.

"tba:251:room:25143":
  name: Ape Pond West Shore
  description: >
    You find yourself wading in shallow water. The water seems clean enough, but you probably wouldn't
    want to drink from it. To the south is Ape Park, while to the east is Ape Road North.
  sector: water_swim
  flags: [no_mob]
  exits:
    east:
      to: tba:251:room:25144
      look: Ape Road North is East.
    south:
      to: tba:251:room:25137
      look: Ape Park is South.
    west:
      to: tba:251:room:25142
      look: The pond continues West.

"tba:251:room:25144":
  name: Ape Road North
  description: >
    Ape Road North is the road that leads to the Forbidden Zone.  To the west is a large pond and a
    park.  To the east is the amphitheater with a few apes walking in and out.
  sector: city
  exits:
    north:
      to: tba:251:room:25149
      look: Ape Road continues North.
    east:
      to: tba:251:room:25145
      look: The amphitheater is to the East.
    south:
      to: tba:251:room:25138
      look: Ape Road continues South.
    west:
      to: tba:251:room:25143
      look: A large pond is to the West.

"tba:251:room:25145":
  name: Ape Amphitheater
  description: >
    You find yourself on the top level of a big amphitheater. It's rounded, with about 6 or 7 levels of
    seats. The bottom part is where Dr. Zaius and Ursus rally all the other apes.
  sector: city
  exits:
    west:
      to: tba:251:room:25144
      look: Ape Road is to the West.
    down:
      to: tba:251:room:25151
      look: The Amphitheater stage is Down.

"tba:251:room:25146":
  name: Ape Pond
  description: >
    You are swimming in a large pond.  The water is quite calm, and lilly pads are growing all around. 
    To the south you can see a dangerous raging whirlpool.
  sector: water_swim
  flags: [no_mob]
  exits:
    east:
      to: tba:251:room:25147
      look: The pond continues East.
    south:
      to: tba:251:room:25141
      look: A raging whirlpool is South.

"tba:251:room:25147":
  name: Ape Pond
  description: >
    You're swimming in a large pond.  The water is quite calm, and lilly pads are growing all around. 
    The water is clean and clear all the way to the bottom.
  sector: water_swim
  flags: [no_mob]
  exits:
    south:
      to: tba:251:room:25142
      look: The pond continues South.
    west:
      to: tba:251:room:25146
      look: The pond continues West.

"tba:251:room:25148":
  name: Dr. Zaius's House
  description: >
    Dr. Zaius's house is filled with books, scrolls, and maps. A large glass window looks out onto the
    Forbidden Zone to the north. A small neatly made bed is resting in the southwestern corner of the
    room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:251:room:25149
      look: Ape Road is to the East.

"tba:251:room:25149":
  name: Ape Road North
  description: >
    Ape Road North is the road that leads to the Forbidden Zone.  To the west Dr.  Zaius's house, and
    to the east is Dr.  Zaius's lab.  The buildings look rather mundane.
  sector: city
  exits:
    north:
      to: tba:251:room:25158
      look: Ape Road continues North.
    east:
      to: tba:251:room:25150
      look: Dr. Zaius's lab is to the East.
    south:
      to: tba:251:room:25144
      look: Ape Road continues South.
    west:
      to: tba:251:room:25148
      look: Dr. Zaius's house is to the West.

"tba:251:room:25150":
  name: Dr. Zaius's Lab
  description: >
    Dr. Zaius's Lab is fairly messy. Several rectangular tables are set against the walls, with test
    tubes and beakers littered all over. One of the tables appears to be used in surgery, as several
    medical tools can be seen on it. Dr. Zaius is fond of performing lobotomies, especially on humans.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:251:room:25149
      look: Ape Road is to the West.

"tba:251:room:25151":
  name: Amphitheater Stage
  description: >
    Two seats are mounted into the northern wall, where Dr. Zaius and Ursus sit. You never noticed it
    before, but on the floor a small rounded trapdoor is barely visible beside the two seats.
  sector: inside
  exits:
    up:
      to: tba:251:room:25145
      look: The amphitheater seats are Up.
    down:
      to: tba:251:room:25152
      look: The trapdoor leads into darkness Down.
      door:
        keywords: [door, trapdoor, trap]
        kind: door
        reset: closed

"tba:251:room:25152":
  name: Underground Cavern
  description: >
    You find yourself in a dark humid cave. The ceiling isn't very high, maybe 7 feet or so. A torch
    mounted on the eastern wall burns softly. An old iron ladder against the southern wall can be seen
    leading up to a small trap door.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:251:room:25153
      look: The cavern continues North.
    up:
      to: tba:251:room:25151
      look: The iron ladder leads Up.
      door:
        keywords: [door, trapdoor, trap]
        kind: door
        reset: closed

"tba:251:room:25153":
  name: Underground Cavern
  description: >
    You find yourself in a dark humid cave. The ceiling isn't very high, maybe 7 feet or so. A torch
    mounted on the eastern wall burns softly. You can see the cave turn to the east up ahead. A faint light
    is coming from around the bend, as well as quiet ocean waves. To the south you can see an old ladder.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:251:room:25154
      look: The cavern continues North.
    south:
      to: tba:251:room:25152
      look: The cavern continues South.

"tba:251:room:25154":
  name: Underground Cavern
  description: >
    You're at a turn in the cave. The cave goes south into darkness. To the east you can see a cave
    entrance, and beyond that a sandy beach beside the ocean. You notice several wide holes in the ground,
    which look like they've recently been dug up. Several old artifacts can be seen half buried in the
    holes.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:251:room:25155
      look: The cavern entrance is East.
    south:
      to: tba:251:room:25153
      look: The cavern continues South.

"tba:251:room:25155":
  name: Cavern Entrance
  description: >
    You're at the entrance to a small cave. The cave is only about 7 feet high, and about 5 feet
    across. A bit of moss is growing where the sunlight hits the cave walls. The cave enters into darkness to
    the west, while the sandy beach is to the east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:251:room:25191
      look: The beach is to the East.
    west:
      to: tba:251:room:25154
      look: The cave continues West.

"tba:251:room:25156":
  name: Forbidden Zone
  description: >
    You find yourself in the middle of a very hot desert. Sand dunes are scattered about, and you can
    see the odd dead shrub. A high cliff blocks your way west. The gusting winds blow sand all over you.
    You don't think anything could live out here.
  sector: field
  exits:
    north:
      to: tba:251:room:25159
      look: The Forbidden Zone continues North.
    east:
      to: tba:251:room:25157
      look: The Forbidden Zone continues East.

"tba:251:room:25157":
  name: Forbidden Zone
  description: >
    You find yourself in the middle of a very hot desert.  Sand dunes are scattered about, and you can
    see the odd dead shrub.  The gusting winds blow sand all over you.  You don't think anything could
    live out here.  You can see the Ape Village to the south.
  sector: field
  exits:
    north:
      to: tba:251:room:25160
      look: The Forbidden Zone continues North.
    east:
      to: tba:251:room:25158
      look: The Forbidden Zone continues East.
    west:
      to: tba:251:room:25156
      look: The Forbidden Zone continues West.

"tba:251:room:25158":
  name: Forbidden Zone Entrance
  description: >
    This is the entrance to the desert wasteland known as the Forbidden Zone. Ape Law decrees it to be
    illegal to enter without permission from the Ape Council. Sand dunes are scattered about, and you can
    see the odd dead shrub. A high cliff blocks your way to the east. The gusting winds blow sand all
    over you. You don't think anything could live out here. You can see the Ape Village to the south.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:251:room:25161
      look: The Forbidden Zone continues North.
    south:
      to: tba:251:room:25149
      look: Ape Village is South.
    west:
      to: tba:251:room:25157
      look: The Forbidden Zone continues East.

