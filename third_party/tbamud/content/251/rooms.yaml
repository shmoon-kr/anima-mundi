"tba:251:room:25198":
  name: Statue of Liberty - Main Observatory
  description: >
    You're in the main observatory of the Statue of Liberty. Several sets of coin operated binoculars
    look out onto the ocean through the long broken windows. Dirt and grime covers all of the walls. A
    heap of rags is on the floor towards the northern part of the room, which looks like it may be a bed. An
    old staircase leading down is built into the eastern wall.
  sector: inside
  exits:
    down:
      to: tba:251:room:25197
      look: The stairs lead Down.
