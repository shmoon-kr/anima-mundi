"tba:83:room:8309":
  name: The Sea
  description: >
    The crystal clear waters spread out as far as your eyes can carry your sight.  To the east, shore
    is just barely in sight.  Both to the north and south, nothing but water and sky can be seen except
    for the faint outline of the shore bordering the sea just under the horizon.  Below you, the deep blue
    sea looks very deep and formidable.  Not recommended for swimmers.
