      look: Rippling water is all that you can see in every direction.
    west:
      to: tba:83:room:8361
      look: Rippling water is all that you can see in every direction.

"tba:83:room:8363":
  name: The Sea
  description: >
    All around you, in every direction, you see nothing but the sea.  Even if the water seems peaceful,
    there is still danger lurking behind every wave. Below you, the water is a dark blue, indicating
    that it is very deep and extremely dangerous.
  sector: water_noswim
  exits:
    north:
      to: tba:83:room:8363
      look: Rippling water is all that you can see in every direction.
