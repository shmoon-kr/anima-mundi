"tba:83:room:8300":
  name: Glumgold's Sea [ INDEX ]
  description:
    preformatted: |
      
      {yellow}Builder      : {/yellow}{cyan}Meyekul
      {/cyan}{yellow}Zone         : {/yellow}{cyan}83 Glumgold's Sea
      {/cyan}{yellow}Player Level : {/yellow}{cyan}10-30
      {/cyan}{yellow}Rooms        : {/yellow}{cyan}96
      {/cyan}{yellow}Mobs         : {/yellow}{cyan}15
      {/cyan}{yellow}Objects      : {/yellow}{cyan}20
      {/cyan}{yellow}Shops        : {/yellow}{cyan}0
      {/cyan}{yellow}Triggers     : {/yellow}{cyan}22
      {/cyan}{yellow}Theme        : {/yellow}{cyan}An oceanic zone.  These waters are controlled by Glumgold the Pirate.
      {/cyan}{yellow}Notes        : {/yellow}{cyan}Players have the option of a sea battle with Glumgold, but his ship is
      {/cyan}{cyan}               extremely tough.  The best way to take him down is from the inside.
      {/cyan}{cyan}
      {/cyan}{cyan}               Originally written for {/cyan}{orange}Anywhere But Home - anywhere.wolfpaw.net:5555{/orange}
      {cyan}
      {/cyan}{yellow}Zone 83 is linked to the following zones:
      {/yellow}{cyan} ??                                 at  8301 (east) --->  ????
      {/cyan}
      Donateable
  sector: inside
  flags: [private]
  triggers: [tba:83:trg:8300]

"tba:83:room:8301":
  name: Near the Shore
  description: >
    The sea is calm near the shore, and it spreads out as far west as your eyes can see.  The sand
    beneath your feet is moist, perfect for making a sand castle if you wanted to.  To the east, there is a
    path that rims the shore around this part of the sea.
  sector: water_swim
  flags: [no_mob]
  exits:
    west:
      to: tba:83:room:8305
      look: The sea is all that you see to the west.

"tba:83:room:8302":
  name: The Sea
  description: >
    The sea spreads out as far as you can see to the west, but land is in plain sight north and east. 
    However, reefs, trees, and dense seaweed make it impossible to reach the shore from here.
  sector: water_noswim
  exits:
    north:
      look: You see land to the north, but you cannot climb up on the shore from here.
    east:
      look: You see land to the east, but you cannot climb up on the shore from here.
    south:
      to: tba:83:room:8303
      look: Rippling water is all that you see to the south.
    west:
      to: tba:83:room:8310
      look: Rippling water is all that you see to the west.

