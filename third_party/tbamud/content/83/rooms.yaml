"tba:83:room:8356":
  name: On a Small Island
  description: >
    You tie your boat up near the shore and explore the island a bit.  Most of the island is covered
    with a dense forrest.  Though it is very small, no more than a few hundred meters wide, there is a
    small hut almost in the direct center.  The hut is suspended about 3 meters from the ground by some
    wooden poles of some sort, the only means of entrance being the rope ladder hanging down from a hole in
    the center.
  sector: field
  exits:
    north:
      to: tba:83:room:8355
      look: Rippling water spreads out as far as you can see in every direction.
