    east:
      to: tba:72:room:7212
      look: You can see a sewer drain.
    south:
      to: tba:72:room:7215
      look: You can see a sewer drain.
    west:
      to: tba:72:room:7209
      look: You can see a narrow crawlway.

"tba:72:room:7211":
  name: The Small Cave
  description: You are in a collapsed sewer drain, which now is more like a small cave.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:72:room:7210
      look: You look back into the four-way junction.

