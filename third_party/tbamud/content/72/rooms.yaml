    south:
      to: tba:72:room:7212
      look: You can see the drain continuing south.

"tba:72:room:7214":
  name: The End Of The Drain
  description: >
    You are at the end of the drain around you the sewer has collapsed, the only exit is west.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:72:room:7213
      look: You see the sewer drain.

"tba:72:room:7215":
  name: The Half-Wet Drain
  description: >
    You are in a sewer drain where the floor is covered with water.  To the north it looks more dry,
    south however the drain runs down into some water.
  sector: hills
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7210
      look: To the north lies a dry four-way junction.
    south:
      to: tba:72:room:7216
      look: To the south you see a sewer drain filled with water.
  extras:
  - keywords: [water]
    text: The water is dirty but it looks like you would be able to swim in it.

"tba:72:room:7216":
  name: Under Water In The Sewer
  description: >
    You are swimming in some dirty water and are holding your breath.  You'd better continue onwards
    before you drown.  It is a good thing that you can hold your light above the water-level.
  sector: water_swim
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7215
      look: It is hard to see, but it looks like the drain runs slightly upwards.
    south:
      to: tba:72:room:7217
      look: It is hard to see, but it looks like the drain runs a little bit upwards.

"tba:72:room:7217":
  name: The Half-Dry Drain
  description: >
    You are in a half-dry sewer drain.  To the north the drain runs a little bit downwards into some
    water to the east you can see a small hole.  To the west you see another drain.
  sector: hills
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7216
      look: You see the drain running down into some water.
    east:
      to: tba:72:room:7218
      look: Through the hole you can just make out a very small room.
    west:
      to: tba:72:room:7219
      look: You see a drain running to the west.
  extras:
  - keywords: [water]
    text: The water is dirty but it looks like you would be able to swim in it.
  - keywords: [hole]
    text: Through the hole you can just make out a very small room.

"tba:72:room:7218":
  name: The Very Small Room
  description: You are in a very small room, it is pretty uninteresting.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:72:room:7217
      look: Through the little hole you can see a half-dry drain.

