# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 72.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:72:room:7200":
  name: The Treasury
  description: >
    You are in a small but well equipped treasury.  You can see some writing on the wall.  The ceiling
    has a funny glow, which enables you to see.  You can get back into the inner lair through the stone
    door which is east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:72:room:7201
      look: You look back through the opening into the inner lair.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:72:obj:7205
        reset: locked
  extras:
  - keywords: [door, stone]
    text: This is a heavy black stone door it looks very solid.
  - keywords: [writing]
    text: You read the number '666'.

"tba:72:room:7201":
  name: The Inner Lair
  description: >
    You are in a octagonal room with smooth purple stone walls.  The floor is made from black stone. 
    In the western wall you see a large black stone door.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:72:room:7202
      look: You look back through the door into the lair.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    west:
      to: tba:72:room:7200
      look: You see the treasury.
      door:
        keywords: [door, stone]
        kind: pickproof
        key: tba:72:obj:7205
        reset: locked

"tba:72:room:7202":
  name: The Lair
  description: >
    On the floor you see a lot of human decay, like bones and skulls.  You also see a lot of slime.  On
    the wall is a torch sitting in its sconce.  To the north is a wooden door.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:72:room:7201
      look: You can see the inner lair.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    east:
      to: tba:72:room:7205
      look: You see another part of the lair.
    south:
      to: tba:72:room:7203
      look: You see another part of the lair.
  extras:
  - keywords: [skull, skulls, bones, decay]
    text: >
      On all the skulls you notice that there is a three inch hole in the forehead. All the bones are
      broken and old.
  - keywords: [slime]
    text: The slime is slimy and uninteresting.
  - keywords: [torch, sconce]
    text: The torch is bolted to the sconce and the sconce to the wall.

