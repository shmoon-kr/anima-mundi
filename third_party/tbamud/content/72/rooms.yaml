  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7224
      look: You see a sewer drain.
    west:
      to: tba:72:room:7222
      look: You see a sewer drain.

"tba:72:room:7224":
  name: The Sewer Junction
  description: >
    You stand in a junction of three sewer drains.  You see some odd scratches on the pipe wall, as if
    from a gigantic rat.  North and south the sewer continues as usual, but west it looks a little
    strange.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7225
      look: You see nothing but a sewer drain.
    south:
      to: tba:72:room:7223
      look: You see nothing but a sewer drain.
    west:
      to: tba:72:room:7229
      look: You see a strange sewer pipe.

"tba:72:room:7225":
  name: The Sewer
  description: >
    You are in a sewer, where the slimy water runs down through a tiny hole. You see some odd scratches
    on the pipe wall, as from a gigantic rat.  There is a sewer drain south.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:72:room:7224
      look: You see a sewer drain.

"tba:72:room:7229":
  name: The Strange Sewer
  description: >
    You are in a very strange sewer indeed, there are some odd scratches on the pipe wall, as from a
    gigantic rat.  And you can see a lot of organic decay like bones from animals AND humans.  West the
    drain runs slightly upwards.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:72:room:7224
      look: You see a sewer junction.
    west:
      to: tba:72:room:7230
      look: You see a slimy sewer drain.

"tba:72:room:7230":
  name: The Damp Sewer
  description: >
    You are in a sewer drain with a funny damp substance on the floor, in the substance you see a lot
    of decay.  You see some odd scratches on the wall, as if from a gigantic rat.  Both to the east and
    west the pipe seems to run down.
  sector: forest
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:72:room:7229
      look: You see a sewer.
    west:
      to: tba:72:room:7231
      look: You see a sewer.

"tba:72:room:7231":
  name: The Strange Sewer
  description: >
    You are in an ordinary sewer except for a lot of scratches on the sewer wall, and a lot of debris
    on the floor.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:72:room:7230
      look: You see a sewer.
    west:
      to: tba:72:room:7232
      look: You see another sewer.
  extras:
  - keywords: [debris]
    text: You see a lot of organic decay on the floor.

"tba:72:room:7232":
  name: The Sewer
  description: >
    You are in a sewer with more scratches on the walls.  And of course a whole lot of decay.  The
    drain runs east and north.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7233
      look: You see yet another sewer line.
    east:
      to: tba:72:room:7231
      look: You see a sewer pipe.

"tba:72:room:7233":
  name: The Sewer Drain
  description: >
    You stand in a sewer drain, you are able to see some kind of cave-like room.  You see some odd
    scratches on the drain wall, as if from a gigantic rat.  The sewer leads south.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:72:room:7234
      look: You see a cave-like room.
    south:
      to: tba:72:room:7232
      look: You see a sewer.

"tba:72:room:7234":
  name: The Rat's Lair
  description: >
    You are in a little cave.  You are able to see quite a lot of debris on the floor.  There is a
    sewer drain west of here.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:72:room:7233
      look: You see the sewer system that way.

"tba:72:room:7279":
  name: The Wall Of The Abyss
  description: >
    You hang onto some steps leading down into utter darkness.  There is an exit leading up as well,
    though you'll have to open the tiny rock again to do so.
  sector: mountains
  flags: [dark, indoors]
  exits:
    up:
      to: tba:71:room:7111
      door:
        keywords: [rock]
        kind: door
    down:
      to: tba:72:room:7299

"tba:72:room:7280":
  name: The Entrance
  description: >
    You are in a very dark room.  You notice that some faces are staring at you from inside the walls. 
    In the middle of the room there is a small altar. To the north there is a small round door.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:72:room:7281
      look: A beam of red light seeps through a hole in the door.
      door:
        keywords: [door, small, round]
        kind: door
        reset: closed
    up:
      to: tba:71:room:7116
      door:
        keywords: [altar, secret]
        kind: door
  extras:
  - keywords: [altar]
    text: >
      This altar is very special.  Faces appear to be smiling from it.  There is a triangle engraved in
      the top of it.
  - keywords: [triangle]
    text: >
      The triangle is filled with small symbols.  They seem to be a language you have never seen before.

"tba:72:room:7281":
  name: The Corridor
  description: >
    The corridor is glowing oppressively in a red hue.  You can hear wailing through an open black hole
    to the east.  To the south there is a round door.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:72:room:7282
      look: >
        The hole seems more black than the night.  It is appears to be "eating" the red light around it.
    south:
      to: tba:72:room:7280
      door:
        keywords: [door, small, round]
        kind: door
        reset: closed
  extras:
  - keywords: [small, round, door]
    text: The door is completely round without a keyhole.
  - keywords: [red, light]
    text: The red light glows from the walls.
  - keywords: [walls]
    text: The walls look alive.

"tba:72:room:7282":
  name: The Realm Of Lost Souls
  description: >
    You are standing in nothing.  All around you there are stars. Sometimes a shadow flies closely by
    you, wailing very loudly.  To the north there is a small bright hole.  To the west there is a small
    red hole.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:72:room:7283
      look: You look into a very bright hole.
    west:
      to: tba:72:room:7281
      look: You look into a red hole.
  extras:
  - keywords: [shadow]
    text: The shadow looks like a man in great pain.

"tba:72:room:7283":
  name: The T-Crossing
  description: >
    You are in a small hallway.  There are doors to the east and to the west.  To the south there are a
    black hole.  There is writing in the wall.  Wails can be heard from the south.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:72:room:7286
      look: It is too dark to tell.
    south:
      to: tba:72:room:7282
      look: A black hole in the wall.
    west:
      to: tba:72:room:7284
      look: You can see a big fire to the west.  It looks like a unhealthy place to enter!
  extras:
  - keywords: [writing]
    text: >
      The writing says 'The one to the east, belongs to the beast.  To the west you will surely END your
      quest!  '.

"tba:72:room:7284":
  name: The Firedeath
  description: >
    This room is very hot.  There are flames surrounding you.  You can see no exits at all!  Skeletons
    are lying all over the floor.
  sector: city
  flags: [no_mob, indoors]
  extras:
  - keywords: [writing, wall]
    text: >
      The writing says 'A prayer to the GODS will not be heard, though the only exit is death...  Mother,
      I love you'.

"tba:72:room:7285":
  name: The Torture Room
  description: >
    You are standing in a middle of a square room.  Along the walls skeletons are hanging in rusty
    chains.  In the middle of the room there is a big metal box, covered with dust.  To the south you can
    just make out a small exit.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:72:room:7286
      look: It is too dark to tell.
      door:
        keywords: [door, iron]
        kind: door
        reset: closed
  extras:
  - keywords: [skeletons]
    text: >
      When you look at the skeletons, you can see that they once had been in great pain.  They are
      hanging in their arms, and some of them were killed with a sharp instrument.
  - keywords: [big, metal, box]
    text: >
      The metal box is covered with dust.  You notice that it was once filled with coal, as you see some
      small pieces of it.

"tba:72:room:7286":
  name: The Hell Yard
  description: >
    You are standing in a lot of mud.  A disgusting smell surrounds the place, and makes you feel
    sick.  Small flames sometimes shoot up from the hot mud.  To the west there is a small door.  To the north
    you can see an iron door.
  sector: mountains
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:72:room:7285
      look: It is too dark to tell.
      door:
        keywords: [door, iron]
        kind: door
        reset: closed
    west:
      to: tba:72:room:7283
      look: It is too dark to tell.

"tba:72:room:7299":
  name: On The Walls Of The Abyss
  description: >
    You are clutching the steps on the wall so that you don't fall to the ground down below.  You
