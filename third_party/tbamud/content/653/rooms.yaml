"tba:653:room:65301":
  name: The Elevator
  description:
    preformatted: |2
         It's your run-of-the-mill, everyday, totally normal looking, elevator.  The
      walls are plain metalic silver.  Soft Muzak plays through the speakers.
      
         A panel with five buttons is here.  Which floor are you looking for?
      
      PUSH       4
      PUSH       3
      PUSH       2
      PUSH       1
      PUSH       G
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:653:room:65306
      door:
        keywords: [door]
        kind: pickproof
        reset: locked
    up:
      to: tba:653:room:65302

