"tba:653:room:65398":
  name: Building Foyer
  description: >
    This is a basic apartment-type foyer.  Mailboxes line one wall.  Another wall has a bulletin board
    with various notes of interest for the tenants.  Hey, there's a tenant meeting on Tuesday!  The
    elevator takes up the south wall. There is a button beside the elevator and a display above it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:653:room:65397
    east:
      to: tba:653:room:65300
      look: Utility Room - Employees Only!
      door:
        keywords: [utility, door, east]
        kind: door
    south:
      to: tba:653:room:65399
      door:
        keywords: [elevator]
        kind: pickproof
  triggers: [tba:653:trg:65302, tba:653:trg:65302]

"tba:653:room:65399":
  name: Inside the Elevator
  description:
    preformatted: |2
         It's your run-of-the-mill, everyday, totally normal looking, elevator.  The
      walls are plain metalic silver.  Soft Muzak plays through the speakers.
      
         A panel with five buttons is here.  Which floor are you looking for?
      
      PUSH       4
      PUSH       3
      PUSH       2
      PUSH       1
      PUSH       G
  sector: inside
  flags: [indoors]
