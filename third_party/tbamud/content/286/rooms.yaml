"tba:286:room:28650":
  name: Hot Stairs
  description: >
    You are standing on a long stairway.  The air around you is heavy and hot. The stone walls are hot
    to the touch and your sweat sizzles as it hits the ground.  Cool air flows out from a crack in the
    wall to the east.  The smell of brimstone and smoke is all around you.  The stairs continue down.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:286:room:28639
      look: It is too dark to see.
    down:
      to: tba:286:room:28661
      look: It is too dark to see.

"tba:286:room:28651":
  name: Crack in Wall
  description: >
    This is a rather large crack in the wall.  On closer inspection it appears to be a passageway that
    was closed off long ago.  It was probably reopened by an earthquake or something.  An ancient
    passageway continues to the north. Hot gusts of air come from the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28641
      look: It is too dark to see.
    west:
      to: tba:286:room:28650
      look: It is too dark to see.

"tba:286:room:28652":
  name: Stone Arch
  description: >
    Before you stands the a large stone arch decorated with many runes you cannot decifer.  It looks as
    though it has been closed up for a long time.  To the east is a hallway of fire.  To the south you
    see a large metal door with the words, 'FOREMAN' written on the door.  There is a dark stairway down
    in the corner of the room.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28653
      look: You see a hall of fire.
    south:
      to: tba:286:room:28662
      look: You see the Foreman's office.
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:286:room:28663
      look: You see a dark stairway down.

"tba:286:room:28653":
  name: Hall of Fire
  description: >
    You are standing in a hallway made of fire.  The walls are ablaze with yellow and blue flames.  The
    smell of the hot air and sulfur burns your lungs as you inhale, and dry your mouth as you exhale. 
    The stone floor burns at your feet and hungrily drinks up every drop of sweat as they fall from your
    body. The hall of fire continues to the east.  You see a stone archway to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28654
      look: You see a hall of fire.
    west:
      to: tba:286:room:28652
      look: You see a stone archway.

