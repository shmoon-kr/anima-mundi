"tba:286:room:28655":
  name: Construction Area
  description: >
    This part of Hell seems to be under repair.  Workers are fixing and replacing what look like
    various gas mains and other pipework.  You can see many gas lines and electrical conduits within the
    dismantled walls.  Partially hidden fire sprinklers are being installed in the ceilings.  You see more
    contruction to the east and south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28656
      look: You see a construction area.
    south:
      to: tba:286:room:28665
      look: You see a construction area.

