"tba:286:room:28611":
  name: Mural of the Dead
  description: >
    You stand before a large mural.  The mural depicts mountains of dead bodies piled up to the sky. 
    The mural covers the whole north wall from floor to ceiling.  You can almost smell the stench of
    decaying flesh.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28612
      look: It's too smoky to see.
    south:
      to: tba:286:room:28610
      look: It's too smoky to see.

"tba:286:room:28612":
  name: Living Walls
  description: >
    The walls here actually consist of graying and sinewy flesh - faces, hands, broken bones, feet and
    toes jutting from the surface.  You hear low moans of horror, pain and sorrow issuing from the walls.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28613
      look: It's too smoky to see.
    south:
      to: tba:286:room:28609
      look: It's too smoky to see.
