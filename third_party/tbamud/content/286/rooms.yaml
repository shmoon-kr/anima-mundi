# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 286.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:286:room:28600":
  name: Strahd's Zone Description Room
  description:
    preformatted: |2
         Descent to Hell Zone.
      Originally written by Strahd
      Zone 286 is linked to the following zones:
      285 Descent to Hell                at 28672 (east ) ---> 28541
      285 Descent to Hell                at 28673 (west ) ---> 28541
      285 Descent to Hell                at 28682 (north) ---> 28541
      285 Descent to Hell                at 28690 (south) ---> 28500
      285 Descent to Hell                at 28692 (south) ---> 28502
      285 Descent to Hell                at 28696 (south) ---> 28506
      285 Descent to Hell                at 28698 (south) ---> 28508
      285 Descent to Hell                at 28699 (east ) ---> 28500
  sector: inside

"tba:286:room:28601":
  name: Stone Archway
  description: >
    This is a ancient stone archway.  Various faces of demons and other grim pictures are painted onto
    it.  Stone gargoyles and demons glare down at you from atop the arch.  There is a bronze plaque above
    the archway.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:286:room:28602
      look: It's too dark to see.
  extras:
  - keywords: [plaque]
    text:
      preformatted: |2
           Descent to Hell
        ************
        You just GO TO HELL!!!!
        *chuckle*
        Made for levels 50-85
        Brought to you by Strahd

"tba:286:room:28602":
  name: Ancient Room
  description: >
    You are standing in a large stone room.  Feels like a crypt.  Ancient murals of Hell and punishment
    cover the walls.  In the middle of the room are stairs that lead down in to the darkness.  From the
    stairway you can smell brimstone and sulfur.  To the west it looks as if there is a shrine.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28601
      look: It is too dark to see.
    west:
      to: tba:286:room:28618
      look: You see an ancient shrine.
    down:
      to: tba:286:room:28603
      look: You see a dark stairway.

"tba:286:room:28603":
  name: Dark Stairway
  description: >
    You are standing at the bottom of long dark stairway.  The smells of brimstone and sulfur choke
    you.  Screams of pain and terror fill the air. Stone faces carved into the walls seem to laugh at you. 
    Maybe this is not such a good idea after all...
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:286:room:28604
      look: Its too dark to see.
    up:
      to: tba:286:room:28602
      look: You see a dark stairway.

"tba:286:room:28604":
  name: Landing
  description: >
    This landing has been scorched as if a large brushfire had swept through it. Bits of ash and burnt
    vegetation cover everything.  The walls and floor are flawlessly smooth, and the ceiling is covered
    with carved faces and ancient symbols and runes.  Large, black iron gates tower over you to the west. 
    You see a large gateway to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28603
      look: Its too dark to see.
    west:
      to: tba:286:room:28605
      look: You see the Gates of Hell.
      door:
        keywords: [gates]
        kind: door
        reset: closed
  extras:
  - keywords: [gates]
    text: >
      These black iron gates are covered with grotesque faces and creatures in various poses and acts of
      violence and lust.  The gates seem to make your blood run cold...

"tba:286:room:28605":
  name: Gateway to Hell
  description: >
    You stand next to the very gateway of Hell.  You are surrounded by the sounds of torture and pain. 
    Screams pierce the air and rattle your nerves.  Displays of the treats of Hell are in all
    directions.  Large black iron gates tower over you to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28616
      look: It's too smoky to see.
    east:
      to: tba:286:room:28604
      look: The Gates of Hell.
      door:
        keywords: [gates]
        kind: door
        reset: closed
    south:
      to: tba:286:room:28626
      look: It's too smoky to see.
    west:
      to: tba:286:room:28606
      look: It's too smoky to see.
  extras:
  - keywords: [gates]
    text: >
      These black iron gates are covered with grotesque faces and creatures in various poses and acts of
      violence and lust.  The gates seem to make your blood run cold...

"tba:286:room:28606":
  name: Hall of the Damned
  description: >
    This hallway is a monument to the millions of damned souls in hell.  The walls are made up of
    various body parts and other unidentifiable things.  Many of the faces that make up the wall scream out to
    you for help.  Their arms desperately grasp at your clothing as you pass.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28615
      look: It's too smoky to see.
    east:
