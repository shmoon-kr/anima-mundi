      look: You see more of the Meat locker.

"tba:286:room:28676":
  name: Penguin Room
  description: >
    This is what appears to be a replica of an iceberg.  Penguins waddle about the room pecking at many
    poor souls half trapped in the icy floor.  You seem to be outside, as the walls are painted to seem
    as if you are standing on a vast icy slab with nothing but ocean around you.  The iceberg continues
    to the south and east.  There is a freezer door to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28677
      look: You see lots and lots of ice.
    south:
      to: tba:286:room:28686
      look: You see lots and lots of ice.
    west:
      to: tba:286:room:28675
      look: You see a freezer door.
      door:
