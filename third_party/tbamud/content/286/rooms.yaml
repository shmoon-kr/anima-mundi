"tba:286:room:28625":
  name: Pit of Fire
  description: >
    You enter a plain stone room with a large fire pit in the center of it.  As you look closer at the
    pit you realize that hundreds of people are being burned inside it.  They scream out to you.  The
    noise is deafening.  Several minor imps and workers push more people into the pit, whistling while they
    work.
  sector: inside
  flags: [indoors]
  exits:
