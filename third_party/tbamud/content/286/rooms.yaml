"tba:286:room:28660":
  name: Fire Pits of Hades
  description: >
    This room is filled with many small fire pits.  Countless damned souls are being burnt and roasted
    within the white flames that erupt from the many pits. Wailing and screams of pain chill your bones
    in this hot room.  To the south you see a lake of fire.  A fire hall lies to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:286:room:28670
      look: You see a lake of fire.
    west:
      to: tba:286:room:28659
      look: You see a hall of fire.

"tba:286:room:28661":
  name: Fire Mural
  description: >
    Upon all the walls of this room is an enormous mural.  Pictures of burning bodies and tortured
    souls seem to be the main theme of the art.  Bright reds and hot blues are enphasized throughout the
    mural.  As you stare at it, the characters within it seem to move and struggle in pain.  The hot air
    around you smells of sulfur and methane.  To the south you see a stone hallway.  Hot air blows in at you
    from the doorway.  The air stirs up the methane and steals your breath.  You choke and gag...
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:286:room:28671
      look: You see a stone hallway.

"tba:286:room:28662":
  name: Foreman's Office
  description: >
    You stand in a crudely constructed office.  Blueprints and change orders are scattered everywhere. 
    A metal filing cabinet stands in the corner.  Before you stands a stone table covered with
    blueprints.  On the wall is a construction plaque that reads, "4th DEMONsion Construction"
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28652
      look: You see the door to the office.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:286:room:28663":
  name: Cold Stairway
  description: >
    You stand upon a cold stone stairway.  Hot air blows down on you from higher up the stairwell. 
    From below you, freezing gusts bite at your skin and make you shiver.  Icicles drip slowly from the
    ceiling onto the frosted stone floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:286:room:28652
      look: It is too dark to see.
    down:
      to: tba:286:room:28676
      look: It is too dark to see.

