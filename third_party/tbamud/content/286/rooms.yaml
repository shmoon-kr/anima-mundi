      look: It's too smoky to see.

"tba:286:room:28613":
  name: Trapped souls
  description: >
    There are many souls trapped behind the walls of this room, almost as though they were trapped
    beneath the surface of a frozen lake.  Even the floor and ceiling show the screaming faces behind them.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28614
      look: It's too smoky to see.
    south:
      to: tba:286:room:28608
      look: It's too smoky to see.
    west:
      to: tba:286:room:28612
      look: It's too smoky to see.

"tba:286:room:28614":
  name: Tortured Beings
  description: >
    This room is filled with instruments of torture.  Beings of all shapes and sizes are being brought
    to the thresholds of pain and beyond.  Some are being sliced into thousands of pieces.  Others are
    being stretched as though they were made of rubber.  All are caught in an unending play of agony.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28615
      look: It's too smoky to see.
    south:
      to: tba:286:room:28607
      look: It's too smoky to see.
    west:
      to: tba:286:room:28613
      look: It's too smoky to see.

"tba:286:room:28615":
  name: Gluttony
  description: >
    Before you is a room filled with all sorts of food.  The smells of pastries and hamburger assault
    your senses.  All sorts of food lie everywhere you look. Cookies, twinkies, steak, prime rib, almost
    anything you can think of, call out to you.  You suddenly feel VERY hungry.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28616
      look: It's too smoky to see.
    south:
      to: tba:286:room:28606
      look: It's too smoky to see.
    west:
      to: tba:286:room:28614
      look: It's too smoky to see.

"tba:286:room:28616":
  name: Greed
  description: >
    What luck!  A room full of treasure.  Gold, diamonds, riches beyond imagination!  Wait!  You
    suddenly feel as if it is all slowly disappearing. Someone is taking your treasure.  They have no right! 
    It is yours!  You found it first.  Let them go get their own treasures!  You see a door to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28617
      look: You see a bedroom door.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:286:room:28605
      look: It's too smoky to see.
    west:
      to: tba:286:room:28615
      look: It's too smoky to see.

"tba:286:room:28617":
  name: Bedroom
  description: >
    This is a small bedroom.  It is well furnished and a drastic change from the room you just stepped
    out of.  A bed stands against the far wall.  Upon the headboard of the bed are carved two cherubic
    looking figures, with the words 'DEE & DEE' written below them.  The door to the bedroom is to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:286:room:28616
      look: You see a bedroom door.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:286:room:28618":
  name: Ancient Shrine
  description: >
    This is an ancient, abandoned shrine of some unknown god.  It has been vandalized and torn apart. 
    What used to be the shrine has been reduced to a large pile of stones and other debris.  Various
    runes and demonic faces have been spray-painted on the walls and floor.  Nailed to the ceiling are an
    assortment of skeletons.  All seem to have been dead for a very long time.  All surfaces of the room are
    covered with dried blood and dust.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28602
      look: It is too dark to see.

"tba:286:room:28619":
  name: Room full of Body Parts
  description: >
    The room is filled with piles of arms, legs, heads, and other, unidentifiable, parts of many
    different creatures.  The stench is overwhelming. The body parts seem to wiggle and scream as you get
    closer.  They are still alive!!
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28620
      look: It is too dark to see.
    south:
      to: tba:286:room:28629
      look: It is too dark to see.

"tba:286:room:28620":
  name: Fountain of Blood
  description: >
    This room is made of a rough black stone.  The walls seem to ooze black sludge.  In the middle of
    the room stands a stone fountain of a demon spitting blood.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:286:room:28630
      look: It is too dark to see.
    west:
      to: tba:286:room:28619
      look: It is too dark to see.

"tba:286:room:28621":
  name: Bloody Stairway
  description: >
    You are standing on a very slippery stairway.  The walls and stairs are covered with blood and
    gore.  Pieces of goo and ooze drip from the ceiling overhead.  You almost slip a couple times on the
    stairway.  The stench here is overwhelming.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:286:room:28609
      look: It is too dark to see.
    down:
      to: tba:286:room:28631
      look: It is too dark to see.

"tba:286:room:28622":
  name: Ancient Room
  description: >
    This is a very old and dusty room.  It looks empty except for a few shards of bone and flesh.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28609
      look: It is too dark to see.
    east:
