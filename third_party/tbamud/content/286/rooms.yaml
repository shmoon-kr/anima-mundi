  description: >
    You are standing at the bottom of a bloody stairway.  Or at least you thought it was a stairway. 
    It seems to be just a painting on the wall.  This is a roughly carved room with evil runes carved in
    to the stone floor.  There is a hallway to the east.
  sector: inside
  flags: [dark, indoors]
