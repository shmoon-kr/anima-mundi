"tba:286:room:28630":
  name: Skeleton Factory
  description: >
    This is probably where they make all the skeletons for nightmares and graveyards.  The room is
    simply littered with bones.  A poster on the wall reads, "Remember...the head bone is connected to the
    neck bone..."  The poster continues on...  But it seems to get very technical and boring.
