      look: It is too dark to see.

"tba:286:room:28623":
  name: Room of Lost Souls
  description: >
    This looks like a waiting room of sorts.  Dust and cobwebs are everywhere. Wooden benches line the
    walls.  A digital number sign is posted on the wall. It currently reads, 'Now Serving Number 1'.  A
    ticket dispenser is bolted to the wall.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28608
      look: It is too dark to see.
    east:
      to: tba:286:room:28624
      look: It is too dark to see.
    west:
      to: tba:286:room:28622
      look: It is too dark to see.
  extras:
  - keywords: [dispenser]
    text: This is one of those red ticket dispensers that never seem to work right.

