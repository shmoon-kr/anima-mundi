"tba:286:room:28669":
  name: Wall of Fire
  description: >
    This large room is cut into sections by small walls of fire.  The walls seem to move slowly,
    changing the layout of the room.  As you examine the room further you notice various posts around the room
    to which people are chained. The firewalls seem to move in patterns that leave the poor people
    directly in the path of the oncoming fire.  The walls seem to creep ever so slowly towards them.  The
    people blister and scream as the fire gets closer.  Their deaths seem like minutes of agony and pain, and
    even as they burst into flames they seem incapable of grasping the merciful attention of death...  To
    the north you see a hall of fire.  To the east you see a lake of fire.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28659
      look: You see a hall of fire.
    east:
      to: tba:286:room:28670
      look: You see a Lake of fire.

"tba:286:room:28670":
  name: Lake of Fire
  description: >
    You stand one the shore of a large lake of fire.  The smoke and heat fill this enormous room.  You
    can barely make out shapes of something moving within the dancing flames of blue and gold...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28660
      look: It is too smoky to see.
    east:
      to: tba:286:room:28671
      look: It is too smoky to see.
    west:
      to: tba:286:room:28669
      look: It is too smoky to see.

"tba:286:room:28671":
  name: Hot Hall
  description: >
    The stone floor below you heats your feet uncomfortably.  The ceiling and walls glow a dull red and
    you sweat uncomfortably under the heat.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:286:room:28661
      look: You see a Mural Room.
    west:
      to: tba:286:room:28670
      look: It is too smoky to see.

"tba:286:room:28672":
  name: Icy Landing
  description: >
    This landing is made entirely of ice.  Its walls bear carvings of battle and hunting scenes in
    bas-relief.  These carved scenes show ice devils slaying angels, hunting mortals and other gruesome
    pictures.  To the east you see a room of ice.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:285:room:28541
      look: You see a room of ice.

"tba:286:room:28673":
  name: Ice Room
  description: >
    You are standing in a room of ice.  Icicles of every size hang from the ceiling.  Some shake with
    every sound.  Your reflection off the ice walls seems to dance and wiggle as you move about.  To the
    south you see more of the frozen room.  To the west you see an Icy landing.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:286:room:28683
      look: You see a room of ice.
    west:
      to: tba:285:room:28541
      look: You see a room of ice.

"tba:286:room:28674":
  name: Meat Locker
  description: >
    You are standing in what looks like a meat locker.  Rows of beef and other meats hang from large
    steel hooks.  You also notice that many of the things hanging from the hooks are corpses of people. 
    They reach out to you as you pass them as if to plead for help from their frozen mouths.  The meat
    locker continues to the east and south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:286:room:28675
      look: You see more of the Meat locker.
    south:
      to: tba:286:room:28684
      look: You see more of the Meat locker.

