"tba:286:obj:28604":
  type: weapon
  keywords: [farslayer, sword]
  short: a black hilted sword called, "Farslayer"
  long: A black hilted sword with engravings on the blade lies here.
  flags: [no_donate, no_invis, magic, no_drop, anti_good, anti_mage, anti_cleric, anti_thief, no_sell]
  wear: [take, wield]
  values:
    damage: 1d20
    attack: pierce
  weight: 7
  cost: 1000
  rent: 0
  level: 0
  affects:
  - apply: hit
    modifier: -10
  - apply: move
    modifier: -20
  extras:
  - keywords: [sword]
    text:
    - >
      The blade of the sword is a full meter long, and straight as an arrow, with lightly fluted sides. 
      Both edges keened down to perfect lines, invisibly sharp. Perfection like this could of only been
      forged by a god.  The black hilt is contrasted only by the faint symbol of a white arrow.  Upon the
      blade is engraved a poem:
    - Farslayer howls across the world
    - For thy heart, for thy heart, who hast wronged me!
    - Vengeance is his who casts the blade
    - Yet he will in the end no triumph see.

