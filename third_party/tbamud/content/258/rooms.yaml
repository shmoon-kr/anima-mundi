# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 258.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:258:room:25800":
  name: A Well Travelled Road
  description: >
    This road still continues east to west, still an extremely wide road, made for heavy traffic.  To
    the east, the forest begins to close in on either side of the road, getting more and more thick the
    farther east you go.  A smaller road branches off to your north here, looking as if it is not a very
    popular road, probably made by some farmer or woodcutter who wanted easier access to his home. West you
    can see the walled city of Jareth, with majestic Lord's Keep sitting high atop the tallest hill,
    flying Jareth's standard proudly.
  sector: field
  exits:
    north:
      to: tba:258:room:25801
    west:
      to: tba:258:room:25802
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           *Light Forest
           Light Forest by Kaan for Dibrova
        This was originally the Miden'Nir, re-mapped and remobbed as a basic
        connector zone.  It is now fit to connect to 8 separate zones, more if
        desired, with low level mobs to populate it.  It would be my suggestion
        that, if you used this zone, take the mobs and junk them and make new
        ones.  The ones in this zone suck pretty bad - it has been on my list to
        redo them, but I have never actually gotten around to it - always have
        an excuse to do something else ;-) Enjoy!
        
        Replace XXXX with a town name of your choosing.
        
        Zone 258 is linked to the following zones:
        257 Jareth Main City               at 25803 (west ) ---> 25729
        289 Werith's Wayhouse              at 25805 (south) ---> 28900
        260 Grasslands                     at 25819 (east ) ---> 26001
        260 Grasslands                     at 25819 (west ) ---> 26020
        260 Grasslands                     at 25823 (east ) ---> 26031
        260 Grasslands                     at 25823 (west ) ---> 26050
        315 McGintey Business District     at 25826 (south) ---> 31500
        326 Army Perimeter                 at 25828 (east ) ---> 32600
        315 McGintey Business District     at 25828 (south) ---> 31502
        260 Grasslands                     at 25850 (east ) ---> 26061
        260 Grasslands                     at 25850 (west ) ---> 26080
        299 Abandoned Cathedral            at 25872 (north) ---> 29955
        265 Beach & Lighthouse             at 25874 (down ) ---> 26500
        
        TODO: several missing rooms/links from dibrova zone 35

"tba:258:room:25801":
  name: A Shady Lane
  description: >
    This small two track leads into the woods from here, twisting and turning its way through the
    forest.  To the south, you may enter onto a well travelled road which runs east and west.
  sector: city
  exits:
    north:
      to: tba:258:room:25804
    south:
      to: tba:258:room:25800

"tba:258:room:25802":
  name: A Well Travelled Road
  description: >
    The main part of this road runs east to west, being wide enough to fit two carts abreast.  It is
    obvious from the amount of cart and wagon tracks you see that this is one of the main roads in XXXX.
  sector: field
  exits:
    east:
      to: tba:258:room:25800
      look: You see a fairly large road leading towards a grand castle in the distance.
    west:
      to: tba:258:room:25803

"tba:258:room:25803":
  name: The City Entrance
  description: >
    You stand at the eastern gate of Jareth.  East leads you out into many uncharted and uncivilized
    lands, while to the west, the city awaits with all its splendor and majesty.
  sector: field
  exits:
    east:
      to: tba:258:room:25802
    west:
      to: tba:257:room:25729

"tba:258:room:25804":
  name: A Shady Lane
  description: >
    You are standing on a small, dusty path leading north into the forest. South of you, the forest
    lightens and gives way to an open area, while to the north, the forest only gets deeper and darker.
  sector: forest
  exits:
    north:
      to: tba:258:room:25811
    east:
      to: tba:258:room:25805
      look: You can see the walls of the South Gate.
    south:
      to: tba:258:room:25801
      look: If you go south, you will enter the Miden'Nir.

"tba:258:room:25805":
  name: Dirt Road
  description: >
    The road runs east into the wilderness.  Far off to the west you see the tops of the spires of the
    great city of Jareth.  A large house lies south of the path.  It looks very inviting.
  sector: forest
  exits:
    east:
      to: tba:258:room:25806
      look: More light forest.
    south:
      to: tba:289:room:28900
    west:
      to: tba:258:room:25804
      look: >
        The Woodsman's Inn can be seen a short distance to the west, it appears to be the source of the
        smoke.

"tba:258:room:25806":
  name: Dirt Road
  description: >
    The road runs east and west, with a branch going north as well.  The forest here seems more
    peaceful, more relaxing than the forest to the west.
  sector: forest
  exits:
    north:
      to: tba:258:room:25808
    east:
      to: tba:258:room:25807
      look: The mountains can be seen jutting up to the east.
    west:
      to: tba:258:room:25805
      look: The forest gets lighter as you go west.

"tba:258:room:25807":
  name: Dirt Road
  description: >
    The road bends here, turning south.  This road seems to branch in many places, leading to many
    different realms of XXXX.
  sector: forest
  exits:
    south:
      to: tba:258:room:25810
      look: More and darker woods.
    west:
      to: tba:258:room:25806
      look: There is a small path leading west.

"tba:258:room:25808":
  name: On a Wide Road
  description: >
    The section of road is a bit smaller and less travelled than the one you just left, but it is
    easily passable just the same.  The forest around you seems alive with sound and motion.  It is really
    quite enjoyable.
  sector: forest
  exits:
    north:
      to: tba:258:room:25815
    south:
      to: tba:258:room:25806
      look: To the south, the trail continues.

"tba:258:room:25809":
  name: Skirting the Clearing
  description: >
    The clearing still lies south of you, however the trail you follow leads away from clearing into
    deeper forest in an easterly direction.
  sector: forest
  exits:
    east:
      to: tba:258:room:25820
      look: Huge gray mountains lie in this direction.
    west:
      to: tba:258:room:25810

"tba:258:room:25810":
  name: Edge of a Clearing
  description: >
    Just to the south of you, the forest opens up into a large grassy field, it's size undeterminable.
  sector: forest
  exits:
    north:
      to: tba:258:room:25807
      look: Trees as far as the eye can see.
    east:
      to: tba:258:room:25809
      look: There is an especially dark part of the forest this way.
    south:
      to: tba:258:room:25819
      look: There is an especially dark section of forest this way.

"tba:258:room:25811":
  name: A Forest Trail
  description: >
    You stand on what is now just a trail through the deep dark forest.  You begin to hear the sound of
    animals making their way around you now that you are far away from any kind of civilization.
  sector: forest
  exits:
    north:
      to: tba:258:room:25812
      look: The trail bends to the north.
    south:
      to: tba:258:room:25804
      look: To the south, the path re-enters the forest.

"tba:258:room:25812":
  name: On the River
  description: >
    The river runs east to west here, the forest trail runs to the south.  To the north, you think you
    may see some sort of clearing, but no trail is visible form here.  South lies nothing but deep forest.
  sector: water_noswim
  exits:
    south:
      to: tba:258:room:25811
      look: A light section of forest.
    west:
      to: tba:258:room:25814
      look: The forest continues here.

"tba:258:room:25813":
  name: A Dark and Gloomy Trail
  description: >
    The forest is dark, and becomes even darker the further you go in.  You can hear the sound of
    running water to the south, possibly it leads to a place a bit more bright and cheery than this...?
  sector: forest
  exits:
    north:
      to: tba:258:room:25882
      look: There is a small clearing to the north.
    south:
      to: tba:258:room:25814

"tba:258:room:25814":
  name: On the River
  description: >
    It is quite dark here, with trees overhanging in many places.  The river continues east and west,
    with a bit more light to the east.  To the north, you think you may be able to see a trail, though
    from the looks of it, the trail is not used much at all.
  sector: water_noswim
  exits:
    north:
      to: tba:258:room:25813
      look: More forest.
    east:
      to: tba:258:room:25812
      look: Lighter forest and mountains in the distance.

"tba:258:room:25815":
  name: On a Wide Road
  description: >
    The road continues north and south, the traffic seeming much heavier here. You feel no menace to
    your surroundings whatsoever, as people walk by and wave cheerily at you.  Even all the little forest
    animals seem undisturbed and unafraid.
  sector: forest
  exits:
    north:
      to: tba:258:room:25816
      look: A trail leading north-south.
    south:
      to: tba:258:room:25808
      look: More trees and some small hills.

"tba:258:room:25816":
  name: On a Wide Road
  description: >
    The road makes a bend here, heading east and south.  The forest around you has been neatly cleared
    away from the path, all manner of obstruction removed. You must be near a large city.
  sector: forest
  exits:
    east:
      to: tba:258:room:25817
      look: More trees.
    south:
      to: tba:258:room:25815
      look: The trees get VERY thick to the south.  You can barely see...

"tba:258:room:25817":
  name: A Wide Bend
  description: >
    The road bends west, with another bend directly following.  It also heads north for quite some
    distance.  The road seems to be very well-kept, which makes the travelling light and enjoyable.
  sector: forest
  exits:
    north:
      to: tba:258:room:25833
      look: Many trees to the north.
    west:
      to: tba:258:room:25816
      look: There is a bit of a slope downward to the west.

"tba:258:room:25818":
  name: A Wide Road
  description: >
    The road heads straight north and south from here.  People pass you by almost constantly, a flurry
    of activity now that you near XXXX.  In fact, you can begin to see the spires of the city to
    northeast.
  sector: forest
  exits:
    north:
      to: tba:258:room:25851
      look: You can see a trail this way.
    south:
      to: tba:258:room:25831
      look: Dark forests.

"tba:258:room:25819":
  name: Large Field
  description: >
    You stand in a huge field of tall, brown grass.  The trail, still very discernable, heads in a
    southerly direction.  To the north, a large forest begins.  Under your feet, the road is very
    hard-packed, as if many heavy feet pass this way regularly.
  sector: field
  exits:
    north:
      to: tba:258:room:25810
      look: The forest gets lighter this way.
    east:
      to: tba:260:room:26001
    south:
      to: tba:258:room:25823
      look: There is a strong stench coming from this direction.
    west:
      to: tba:260:room:26020

"tba:258:room:25820":
  name: The Dark Forest
  description: >
    You stomp your way through the underbrush.  The dark forest gets pretty thick here, and the
    branches high above your head are so thick that they block out all direct sunlight.  While it is much too
    thick to go further east, you might be able to make your way though the forest to the south and west.
  sector: forest
  exits:
    east:
      to: tba:258:room:25822
    west:
      to: tba:258:room:25809
      look: The thick forest continues.

"tba:258:room:25821":
  name: Old Stone Road
  description: >
    The forest trail runs north to south here, a much more travelled road to the south.  Under the dirt
    and loose gravel you think you may be able to see some old stones which might have formed a well
    used road long ago.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:258:room:25870
      look: Darkness...
    south:
      to: tba:258:room:25852
  extras:
  - keywords: [carcass, body, corpse, carcasses, bodies, corpses]
    text: >
      The corpses looked as if they have been pierced by a large, jagged spear. The damage these people
      sustained is simply amazing.  Worse, the lips on the bodies are a light shade of blue, hinting at
      poison in their systems.

"tba:258:room:25822":
  name: Deep in the Forest
  description: >
    There is a sickening stench here.  It smells of blood and death.  To the north, you catch glimpses
    of daylight.  To the east, you simply cannot see. The trees are close and stifling.
  sector: forest
  exits:
    south:
      to: tba:258:room:25853
    west:
      to: tba:258:room:25820

"tba:258:room:25823":
  name: Grassy Field
  description: This field seems to go on forever.  The trail continues north and south of here.
  sector: field
  exits:
    north:
      to: tba:258:room:25819
      look: It appears to get much darker that direction.
    east:
      to: tba:260:room:26031
    south:
      to: tba:258:room:25850
    west:
      to: tba:260:room:26050

"tba:258:room:25824":
  name: Along the Cliff
  description: >
    The trail runs along the top of the cliff, east to west.  This seems to be an extremely
    well-travelled trail, so much that it could more correctly be called a road.  Most of the tracks seem to head
    east, so you must assume that there is something of interest in that direction, however it is hard to
    see over the hill which you are slowly climbing.
  sector: mountains
  exits:
    east:
      to: tba:258:room:25877
    west:
      to: tba:258:room:25873

"tba:258:room:25825":
  name: Near the Bridges
  description: >
    Your trek has brought you just west of the twin bridges which lead over the ocean into the great
    city so near.  You hear the sounds of a large city quite clearly from where you stand.  It seems almost
    out of place, standing here in the outdoor setting, hearing all the hustle and bustle of the city so
    near. You may head to the toll booths just east of here, or leave to the west into the wilderness.
  sector: hills
  exits:
    east:
      to: tba:258:room:25826
    west:
      to: tba:258:room:25881

"tba:258:room:25826":
  name: Toll Booth
  description: >
    You stand at the first of two toll booths which block the way onto the bridges leading into
    McGintey Cove.  The second, just east of you, looks just as busy as this one.  If you are not sure what to
    do next, possibly reading the sign on the outside of the booth may give you some idea.
  sector: hills
  exits:
    east:
      to: tba:258:room:25827
    south:
      to: tba:315:room:31500
    west:
      to: tba:258:room:25825

"tba:258:room:25827":
  name: Between the Booths
  description: >
    You stand between two toll booths, both of which block the way into the city. Take your pick, east
    or west.  There also seems to be some sort of park to the south, and to the north is an enormous
    stable, where alll steeds are kept, since none are allowed in the city.
  sector: hills
  exits:
    north:
      to: tba:258:room:25829
    east:
      to: tba:258:room:25828
    south:
      to: tba:258:room:25830
    west:
      to: tba:258:room:25826

"tba:258:room:25828":
  name: Eastern Toll Booth
  description: >
    You stand at the easternmost toll booth which allows access to the great seaport city, McGintey
    Cove.  If you are not quite sure how to gain access, just read the sign posted on the outer wall of the
    booth.
  sector: hills
  exits:
    east:
      to: tba:326:room:32600
    south:
      to: tba:315:room:31502
    west:
      to: tba:258:room:25827

"tba:258:room:25829":
  name: Stables
  description: >
    This building is so large, has so many rows of stalls running back into it's depths, you cannot
    imagine trying to find any one particular within this building.  A sign is posted to your left,
    explaining the stable rules.  The exit is to your south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:258:room:25827

"tba:258:room:25830":
  name: Memorial Park
  description: >
    This tranquil spot perched on the edge of the cliffside offers a beautiful vantage point from which
    to admire the city.  The grass is extremely well kept, the benches all freshly painted and clean.  A
    large sign dedicates this park to the founder of the city.  You may enter back onto McGintey Road to
    the north, or rest here for a while before continuing on your way.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:258:room:25827

"tba:258:room:25831":
  name: A Fork in the Road
  description: >
    You may head east, west, or north along trails that all look to be about the same in terms of ease
    of travel.  There looks to be a bit more traffic to the north, however the trails leading east and
    west don't exactly look unused themselves.
  sector: forest
  exits:
    north:
      to: tba:258:room:25818
    east:
      to: tba:258:room:25832
    west:
      to: tba:258:room:25833

"tba:258:room:25832":
  name: Forest Road
  description: >
    The road runs east into thick, green woodlands where it seems the trees are almost alive from the
    way the playful breeze ruffles through their branches. To the west the road splits to the north or
    continues its way west.
  sector: forest
  exits:
    west:
      to: tba:258:room:25831

"tba:258:room:25833":
  name: A Wide Road
  description: >
    The road turns here heading east and south.  It seems to run quite some way to the east, however to
    the south it makes another turn.
  sector: forest
  exits:
    east:
      to: tba:258:room:25831
    south:
      to: tba:258:room:25817

"tba:258:room:25850":
  name: Near a Cliff
  description: >
    You still stand in the grassy field, however directly south of you the world seems to end!  It
    looks as if there may be a large cliff to your south, and from the smell of things, it must lead down to
    the sea.  To the north, the field runs for some distance until reaching a far-off forest.
  sector: field
  exits:
    north:
      to: tba:258:room:25823
    east:
      to: tba:260:room:26061
    south:
      to: tba:258:room:25873
      look: The forest of Miden'nir spreads out before you.
    west:
      to: tba:260:room:26080

"tba:258:room:25851":
  name: A Wide Road Near the City
  description: >
    XXXX lies just northeast of you, a hop, skip, and jump away.  To the south is a long, wide road
    which is filled with traffic at all ours of the day and night, it being the main route from XXXX to
    Jareth, the Free City.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:258:room:25852
    south:
      to: tba:258:room:25818
      look: The tunnel leads into the mountainside.

"tba:258:room:25852":
  name: Just West of XXXX
  description: >
    Just east of you lie the gates to the city of XXXX.  To the south begins the way down a long, wide,
    and extremely well traveled road.  To the north you see a road made from aged cobblestones.
  sector: city
  exits:
    north:
      to: tba:258:room:25821
    south:
      to: tba:258:room:25851
      look: The tunnel continues to the south.

"tba:258:room:25853":
  name: A Tunnel In The Mountains
  description: >
    The tunnel gets lighter to the north, presumably leading out, while to the south the passage gets
    smaller and smaller.  A small alcove has been carved into the east wall.
  sector: city
  flags: [dark]
  exits:
    north:
      to: tba:258:room:25822
      look: The tunnel gets wider in this direction.
    south:
      to: tba:258:room:25854
      look: The tunnel gets smaller in this direction.

"tba:258:room:25854":
  name: Diminishing Trail
  description: >
    The trail looks like it may be bending here, however with the way all the vegetation is growing in
    on the trail, it is hard to tell.  It looks like the trail may head east and north from here.
  sector: forest
  exits:
    north:
      to: tba:258:room:25853
    east:
      to: tba:258:room:25855
  extras:
  - keywords: [twigs, leaves, bead]
    text: >
      The twigs and leaves have all been piled together as a makeshift bed for some small humanoid.

"tba:258:room:25855":
  name: Faint Trail
  description: >
    The trail is so faint now that you can barely see it.  You almost have to hope you are heading in
    the right direction, through openings in trees and such, so faint is the trail.
  sector: forest
  exits:
    east:
      to: tba:258:room:25856
    west:
      to: tba:258:room:25854

"tba:258:room:25856":
  name: Nearing the Maze
  description: >
    The trail leads east into a huge maze made of shrubbery easily 10 feet high. It runs north and
    south of the path you stand on as far as your eyes can see in either direction.  Looks like a fellow
    could get lost in there pretty easily.
  sector: forest
  exits:
    east:
      to: tba:258:room:25885
    west:
      to: tba:258:room:25855

"tba:258:room:25870":
  name: Old Stone Road
  description: >
    The road runs north and south still.  There is a large gate, closed, way off to the north, a large
    building just beyond the gates.
  sector: forest
  exits:
    north:
      to: tba:258:room:25872
    south:
      to: tba:258:room:25821
      look: You can go south around the Inn.
  extras:
  - keywords: [sign]
    text:
    - "The sign reads:"
    - The Woodsman

"tba:258:room:25871":
  name: Cliff's Edge
  description: >
    The trail still runs east to west here along the rim of the drop off, but in looking south over the
    edge, you see the someone has made some crude steps that run along the wall of the cliff.
  sector: field
  exits:
    east:
      to: tba:258:room:25873
    south:
      to: tba:258:room:25874
    west:
      to: tba:258:room:25875

"tba:258:room:25872":
  name: Old Stone Road
  description: >
    The road runs north up to a large iron gate, a gate which closes the way to what appears to be an
    old cathedral or church.  To the south the road heads back toward the main forest trail.
  sector: forest
  exits:
    north:
      to: tba:299:room:29955
    south:
      to: tba:258:room:25870

"tba:258:room:25873":
  name: Cliff's Edge
  description: >
    The trail runs right up to the edge of the cliff and T's off, running east and west from here. 
    Looking down and over the edge of the cliff, you find that you were right about what lies at the bottom
    of the cliff, the sea!  To the north the trail cuts through a huge grassy field.
  sector: field
  exits:
    north:
      to: tba:258:room:25850
    east:
      to: tba:258:room:25824
      look: You can go around the Inn this way.
    west:
      to: tba:258:room:25871
      look: Only rats and fool adventurers play in garbage.

"tba:258:room:25874":
  name: On a Rock Landing
  description: >
    This rudely carved rock landing marks the start of a long flight of steps leading down to the sea
    shore.  The footing looks to be treacherous at best, so be careful!
  sector: mountains
  exits:
    north:
      to: tba:258:room:25871
    down:
      to: tba:265:room:26500

"tba:258:room:25875":
  name: The Ambush Point
  description: >
    This is a overgrown foot-trail west of the Inn.  It leads west, but you would be hard pressed to
    follow it far.  A number of bushes are trampled on and some medium sized branches have been knocked
    down.  Obviously there has been a battle here rather recently.
  sector: forest
  exits:
    east:
      to: tba:258:room:25871
    west:
      to: tba:258:room:25876
      look: A trail through the woods.

"tba:258:room:25876":
  name: The Bar
  description: >
    This is where people use to come and enjoy the food, drink and hospitality of the Innkeeper, but as
    of late, he only serves the few adventurers that manage to survive a trip through the forest.
  sector: city
  flags: [indoors, soundproof]
  exits:
    east:
      to: tba:258:room:25875

"tba:258:room:25877":
  name: Along the Cliff
  description: >
    Heading east, the trail tops a large rise, continuing it's way toward whatever lies in that
    direction.  To the west, the trail heads it way along, not really seeming to head anywhere.
  sector: mountains
  exits:
    east:
      to: tba:258:room:25879
      look: You see the main floor of the Inn to the east.
    west:
      to: tba:258:room:25824

"tba:258:room:25879":
  name: Atop the Hill
  description: >
    Wonder of wonders!  You feel as if you could see the whole world from where you currently stand. 
    Just east of you, sitting proudly on a large rock, almost a plateau, is the huge seaport town of
    McGintey Cove.  The twin bridges which lead from the edge of the cliff to the city gate are the only
    entrance or exit from the town.  The trail also runs west far into the distance, skirting the southern
    edge of a huge field, which seems to go on forever.
  sector: hills
  exits:
    east:
      to: tba:258:room:25881
    west:
      to: tba:258:room:25877

"tba:258:room:25881":
  name: West of Town
  description: >
    The road runs east toward the huge seaport atop the plateau and west, topping a tall hill.
  sector: hills
  exits:
    east:
      to: tba:258:room:25825
    west:
      to: tba:258:room:25879
      look: The trail continues.

"tba:258:room:25882":
  name: A Dark and Gloomy Trail
  description: >
    The forest around you is so thick now that there is not enough light to see by.  The birds you
    heard singing before are now quiet, all you can hear now is the sound of your own heavy breathing.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:258:room:25883
    south:
      to: tba:258:room:25813
      look: The tracks lead south.

"tba:258:room:25883":
  name: A Dark and Gloomy Trail
  description: >
    Impenetrable is the only word you could use to describe the darkness surrounding you.  Trees brush
    against you on either side, feeling almost like they tug at your clothing.  The trail seems to
    continue north, although it seems much more sensible to go south.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:258:room:25884
      look: The trail continues.
    south:
      to: tba:258:room:25882

"tba:258:room:25884":
  name: A Dead End Trail
  description: >
    The path comes to an abrupt end here, as the trees close around you and make any further
    exploration impossible.  It does seem strange, though, that a trail through the woods would end so abruptly.
  sector: forest
  flags: [dark]
  exits:
    south:
      to: tba:258:room:25883

"tba:258:room:25885":
  name: Entrance to the Maze
  description: >
    You stand at the entrance to a hedge maze with walls twenty feet high. These walls run north and
    south from where you stand farther than you can see in either direction.
  sector: hills
  exits:
    west:
      to: tba:258:room:25856
