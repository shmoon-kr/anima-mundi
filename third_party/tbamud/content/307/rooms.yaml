"tba:307:room:30709":
  name: The Lord and Lady's Bedchamber
  description: >
    The first, and most odd, thing that strikes you upon entry into this room is that there is not one
    but two beds set apart from each other.  They are both quite comfortable seeming, but not anywhere
    near each other in the room. Possibly the Lord and his Lady do not enjoy each other's company as much
    as they show in public?
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:307:room:30708
      door:
        keywords: [door]
        kind: door
        reset: closed
