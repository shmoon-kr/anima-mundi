"tba:307:room:30772":
  name: Barn
  description: >
    It looks as if some of the more raggedy types are given housing out here in the hay barn - and on a
    regular basis - while their more affluent masters stay within the castle.  There is an enormous
    amount of hay and grain stacked neatly about the place, some of it made into comfortable beds.
  sector: inside
