"tba:307:room:30717":
  name: The Back Exit
  description: >
    The Lord - that sneaky bugger - has a nice in and out way for the ladies in waiting to come and
    visit him any time he pleases.  Must be that his State Room sees a bit more action than it appears - and
    that would explain the bed.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:307:room:30716

"tba:307:room:30718":
  name: Storage
  description: >
    All of the castle's dry goods are stored in this room, included the enormous amounts of alchohol
    that it takes to keep the continuous party going that the Lord and Lady perpetrate year round.  Through
    a door on the east wall is the kitchen.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:307:room:30719

"tba:307:room:30719":
  name: Kitchen
  description: >
    The cooks of the castle labor daily, round the clock, to keep good eats on the tables in the grand
    ballroom and here in the kitchen itself.  It is not uncommon for a stray guest to come shuffling on,
    half sleeping and drunk to grab something from the counter or out of the stove.  The cooks don't mind
    - that's what they are here for.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:307:room:30710
    south:
      to: tba:307:room:30783
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:307:room:30718

