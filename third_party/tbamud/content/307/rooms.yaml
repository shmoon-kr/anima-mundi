"tba:307:room:30710":
  name: The Main Hall
  description: >
    The ceiling of this enormous chamber rises high into the upper reaches of the castle, its domed
    roof at least a good hundred feet above your head.  To the north is the grand ballroom, a room used on
    an almost nightly basis where the Lord and Lady entertain their guests.  To the south is the kitchen. 
    A door lies in the west wall.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:307:room:30713
    east:
      to: tba:307:room:30703
    south:
      to: tba:307:room:30719
    west:
