"tba:307:room:30706":
  name: The Lord's State Room
  description: >
    As if the Lord of this manse would ever truly need a state room and truly - as if this could even
    fall under the category of a state room in any capacity. Either way, it is the Lord's retreat from his
    Lady and from all of the guests when he feels the need and he does feel the need often.  The fact
    that there is a small bed in the far corner means nothing at all...  Does it?
