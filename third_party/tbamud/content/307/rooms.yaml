"tba:307:room:30712":
  name: The Grand Ballroom
  description: >
    This wide open chamber is permanently festooned with all manner of decorations and party favors. 
    An attendant is always on hand, as is a musician for any who might wish to make merry - no matter what
    the time of day or night. The main hall lies to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:307:room:30713
