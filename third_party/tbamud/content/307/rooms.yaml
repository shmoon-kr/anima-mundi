"tba:307:room:30781":
  name: Wide Road Through the Foothills
  description: >
    The road continues on through the foothills to the east and the west.  On either side of the road
    are the rolling hills of the area, their grassy slopes broken only once in a while by trees and
    bushes.  Off to the west, the pennants of a castle can be seen poking above the hill lines which block your
    sight. Obviously, someone owns these lands upon which you travel and lives just west of here.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:307:room:30761
    east:
      to: tba:307:room:30701
    south:
      to: tba:307:room:30749
    west:
      to: tba:307:room:30782

"tba:307:room:30782":
  name: Wide Road Through the Foothills
  description: >
    You come round a slight curve in the roadway and get your first solid glimpse of the castle which
    lies only a short span away.  It is a well-kept place, one which appears to be frequented by many as
    the hedges are all neatly trimmed and the banners which fly from the tall masts on the ramparts and
    which hang from either side of the grand entry are fresh and clean.  The roadway runs east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:307:room:30760
    east:
      to: tba:307:room:30781
    south:
      to: tba:307:room:30748
    west:
      to: tba:307:room:30702

"tba:307:room:30783":
  name: Cold Storage
  description: >
    The costs involved in maintaining this room is really quite amazing.  Every single day, a man
    drives his cart out to the frozen sea at the fringes of the land where the minotaurs rule and brings back
    with him huge, solid chunks of ice which are kept here in this sealed room where all perishable items
    are kept.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:307:room:30719
      door:
        keywords: [door]
        kind: door
        reset: closed
