# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 307.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:307:room:30700":
  name: Wide Road Through the Foothills
  description: >
    A very well-used roadway leads west into the foothills.  It has been recently cleared and looks to
    be a fairly safe direction to take.  To the east lies the path back toward the main road near
    Midgaard and Jareth.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:307:room:30763
    south:
      to: tba:307:room:30751
    west:
      to: tba:307:room:30701
  extras:
  - keywords: [credits, info]
    text: >
      Castle * Written by Kaan for Dibrova Levels: 20 - 25 84 rooms 19 mobs 23 objs Connector Zone(s):
      The Light Forest This was a zone I had to sort of build off the cuff. It was when we started getting a
      larger influx of new players and needed this part- icular level range of eq. I slapped it together in
      less than a day and had it ready for play immediately. All things considered, its not a bad zone for
      what it was created for. Links: 80n

"tba:307:room:30701":
  name: Wide Road Through the Foothills
  description: >
    The road continues on through the foothills to the east and the west.  On either side of the road
    are the rolling hills of the area, their grassy slopes broken only once in a while by trees and
    bushes.  It is truly a beautiful area of the world here in the foothills of Jareth.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:307:room:30762
    east:
      to: tba:307:room:30700
    south:
      to: tba:307:room:30750
    west:
      to: tba:307:room:30781

"tba:307:room:30702":
  name: At the Castle Entry
  description: >
    The castle door lies west from you, the way in flanked by huge, proud banners of the Lord and Lady
    of this place.  Looking off to the east, you can see why this place might be a nice visit for some of
    the more affluent members of society - the rolling hills and the lush scenery give a very serene,
    peaceful feeling.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:307:room:30759
    east:
      to: tba:307:room:30782
    south:
      to: tba:307:room:30747
    west:
      to: tba:307:room:30703
      door:
        keywords: [door]
        kind: door
        reset: closed

