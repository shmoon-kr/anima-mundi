"tba:307:room:30716":
  name: Back Hall
  description: >
    This hall does not appear to be used very often, nor does it appear to be very well maintained by
    the staff of the castle.  Possibly this small, narrow passage is held a secret by the Lord himself? 
    It ends here without notice, small doors etched into the walls on the south and north side, both
    looking as if they havent been opened in years.
  sector: inside
