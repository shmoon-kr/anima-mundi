        reset: closed
    west:
      to: tba:289:room:28933

"tba:289:room:28933":
  name: Hallway
  description: >
    This is a plain hallway on the second floor.  The hall continues to the east, all the way down to
    where the stairs are.  On either side to the north and south are doors to private rooms.  You can hear
    a dull roar coming from below in the main room, but the thick wooden floorboards do a good job of
    blocking the majority of the noise out.
  sector: inside
  flags: [indoors]
  exits:
