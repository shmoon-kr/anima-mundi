# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 289.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:289:room:28900":
  name: Outside the Wayhouse
  description: >
    You are outside a large, two-story building which proports to be 'Werith's Wayhouse' on a brightly
    lettered sign out front.  You hear laughing and revelry from inside -- sounds like a lively place. 
    The main doors are directly south of you, and small paths lead east and west around the building. 
    Eastward is another smaller building; obviously a stable.  Northward is the main road, providing all the
    traffic and customers for this establishment.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:258:room:25805
    east:
      to: tba:289:room:28907
    south:
      to: tba:289:room:28915
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    west:
      to: tba:289:room:28901
  extras:
  - keywords: [credits, info]
    text: >
      Werith's Wayhouse by Builder_5 Copyright 1993 by Curious Areas Workshop * 'Werith's Wayhouse' is a
      high-mob population area, with 40 rooms, 19 different types of mobs and objects.  It was meant to be
      placed somewhere between two widely used towns as a rest stop area. We hope you like it. * #00 -- add
      entrance/exit to the north. The north exit is #00. A receptionist can be added to the upstairs area:
      around #30 would probably be the best area. Mob ##04 should have the standard spellcaster routine. *
      Credits A Big Thanks to Builder_5 for supporting C.A.W. Also, kudos to Tarkin of VieMud (viemud.org
      4000) for allowing us to use his mud for pre-release testing. This area was built with the aid of
      George Essl's Dikued program.  We would like to thank Mr. Essl for his time and determination to create
      and support Dikued. The following people have aided C.A.W. and Builder_5 in numerous ways, and all
      receive our deepest gratitude: Shane Finkel, Josh 'Champion of Bagels' Megerman, John D. Horner, and
      the System Adminstrators of ODU * Additionally, Builder_5 would like thank the following people. These
      people played several of the mobs included in this area in various role-playing games that Builder_5
      participated in: John D. Horner: Desslok, Michael Goodwin: Airden (the Wanderer), David "Big Guy"
      Burke: Seemie, Jordo, Chris Grove: Drogo, 'd.' Page: Eshiay, Farlenian (and Koofy!), Aaron Barrs: Alerka
  - keywords: [sign]
    text:
    - It says,
    - "\"WERITH'S WAYHOUSE\""
  - keywords: [stable]
    text: A place to keep your horses while you enjoy yourself inside...
  - keywords: [path, paths]
    text: Well-trodden paths around the sides of the building.  Not much of interest.

"tba:289:room:28901":
  name: Near a Large Building
  description: >
    You are north-west of the Wayhouse.  This section of the path seems less used, possibly because
    there's nothing really over here.  The trees crowd in towards the clearing, making the general area seem
    rather eerie somehow.  The voices coming from inside are clearly audible, and by listening hard you
    can almost make out the words.  The path around the building continues to the west and south.
  sector: field
  exits:
    east:
      to: tba:289:room:28900
    south:
      to: tba:289:room:28902

"tba:289:room:28902":
  name: Near a Large Building
  description: >
    You are standing on the path that runs around the Wayhouse to the west.  A window spills light onto
    the trees that block out all available light overhead. You hear general merryment and alcoholism
    from inside, and wonder if being inside would be more fun than walking around outside...
  sector: field
  exits:
    north:
      to: tba:289:room:28901
    south:
      to: tba:289:room:28903

"tba:289:room:28903":
  name: Near a Large Building
  description: >
    You are south-west of the main structure of the Wayhouse.  A lone rain barrel catches run-off from
    the roof eaves by the corner of the building, and you spy a small white fence cordoning off an herb
    garden nearby.  The path around the building leads to the north and east.
  sector: field
  exits:
    north:
      to: tba:289:room:28902
    east:
      to: tba:289:room:28904

"tba:289:room:28904":
  name: Outside the Wayhouse
  description: >
    You are standing just south of Werith's Wayhouse, right where the kitchen entrance is.  A well
    trodden path leads east, towards a small shack that is unmistakeably an outhouse.  You hear the
    unmistakeable sound of clanging pots and pans from the inside, the warning of an upcoming meal.  The path
    around the building here runs east, and west.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:289:room:28926
    east:
      to: tba:289:room:28905
    west:
      to: tba:289:room:28903

"tba:289:room:28905":
  name: Near a Large Building
  description: >
    The Wayhouse is just north-west of you here, and you are right by the facility's outhouse to the
    south.  The wooden planks of the stable form an alley to the north, with the path leading right
    in-between.  Westwards is the kitchen entrance to the Wayhouse, kept wide open to let the heat inside escape.
  sector: field
  exits:
    north:
      to: tba:289:room:28906
    south:
      to: tba:289:room:28940
    west:
      to: tba:289:room:28904

"tba:289:room:28906":
  name: Near a Large Building
  description: >
    This is a small, outdoors 'alley' formed by the Wayhouse's stone walls to the west, and the wooden
    planked walls of the stable to the east.  The path around the building leads north and south of here.
  sector: field
  exits:
    north:
      to: tba:289:room:28907
    south:
      to: tba:289:room:28905

"tba:289:room:28907":
  name: Near a Large Building
  description: >
    You are on a small, well-travelled path that leads between Werith's Wayhouse to the west, and the
    stables to the east.  Another path breaks off to the south, between the two buildings, towards what
    appears to be an outhouse.
  sector: field
  exits:
    east:
      to: tba:289:room:28908
    south:
      to: tba:289:room:28906
    west:
      to: tba:289:room:28900

"tba:289:room:28908":
  name: Just Outside the Stable
  description: >
    The stable of the Wayhouse is just south of you, its wooden doors spread open and inviting.  Inside
    you can hear the snorting of horses, and the occasional hoof scraping against the ground.  The path
    leads to the west, towards the Wayhouse.
  sector: field
  flags: [no_mob]
  exits:
    south:
      to: tba:289:room:28909
    west:
      to: tba:289:room:28907

"tba:289:room:28909":
  name: Inside the Stable
  description: >
    You are standing inside the dusty confines of the stable.  Stalls line the aisle, some with horses,
    some empty.  A pail filled with water and a stack of grain are heaped up against the interior wall,
    dimly illuminated by a lantern hanging from a rafter.  Seems rather quiet in here...
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:289:room:28908
    east:
      to: tba:289:room:28912
    south:
      to: tba:289:room:28910

