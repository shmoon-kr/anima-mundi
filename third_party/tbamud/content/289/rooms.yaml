      door:
        keywords: [door, south, wooden]
        kind: door
        reset: closed

"tba:289:room:28934":
  name: Private Room
  description: >
    This is a smallish private room, with an adequate bed with clean sheets, a rather
    beat-up-but-serviceable clothes chest, and a table and chair.  Plain and simple, yet nice in a strange sort of way.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:289:room:28933
      door:
        keywords: [door, south, wooden]
        kind: door
        reset: closed

