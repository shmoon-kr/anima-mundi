# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 240.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:240:room:24000":
  name: The Southern Gate of Dun Maura
  description: >
    As you walk into the shadows between the large steel gates you realize how insignificant you must
    look.  Minotaurs walk past, most several feet taller than you.  The guards here seem to be looking for
    an excuse to kill something, or someone.
  sector: city
  exits:
    north:
      to: tba:240:room:24005
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Rumble
        Zone         : 240 Dun Maura
        Began        : 2000
        Player Level : 5-10
        Rooms        : 88
        Mobs         : 34
        Objects      : 27
        Shops        : 1
        Triggers     : 10
        Theme        : A city of proud minotaurs.
        Links        : 00s, 37w, 47e, 84n
        
        Zone: 240 was linked to the following zones:
        100 The Northern Highway           at: 24000 (south) ---> 10096
         86 Duke Kalithorn's Keep          at: 24084 (north) --->  8660
  - keywords: [gate]
    text: >
      The large gates are made of wood, but are so heavily reinforced with stell that The large gates are
      made of wood, but are so heavily reinforced with steel that you can hardly tell.  It would take
      someone of inhuman strength to close them.

"tba:240:room:24001":
  name: Zyanya Way
  description: >
    You have heard stories that minotaurs like large buildings and open spaces which can accommodate
    their extended families.  They tend to get on well with anyone displaying similar qualities to their
    own.  You hope they will get along with you.
  sector: city
  exits:
    north:
      to: tba:240:room:24010
    east:
      to: tba:240:room:24002

"tba:240:room:24002":
  name: Zyanya Way
  description: >
    The minotaur is one of the most powerful races.  Some growing over eight feet tall.  Stories of
    minotaurs killing humans for sport abound.  But they were all just stories, right?
  sector: city
  exits:
    north:
      to: tba:240:room:24011
    east:
      to: tba:240:room:24003
    west:
      to: tba:240:room:24001

"tba:240:room:24003":
  name: Zyanya Way
  description: >
    You carefully work your way along the small side street.  Trying to stay out of the way of the
    minotaurs.  Their bodies are covered in a short dark fur. Minotaurs are not considered one of the smarter
    races, and tend be viewed as a race of bullies.
  sector: city
  exits:
    east:
      to: tba:240:room:24004
    west:
      to: tba:240:room:24002

"tba:240:room:24004":
  name: Zyanya Way
  description: >
    The minotaur is a tall muscular race.  Most Minotaurs average about 8 feet tall, and weigh in
    excess of 400 pounds.  You follow a small street along the southern wall.  To the north you see a large
    structure.
  sector: city
  exits:
    north:
      to: tba:240:room:24013
    east:
      to: tba:240:room:24005
    west:
      to: tba:240:room:24003

"tba:240:room:24005":
  name: Vassar Road
  description: >
    You stare around in amazement at this strange race, the Minotaur.  You know the stories well. 
    Generally sturdy, large and strong folk, they are mostly hard-working, assertive and uncompromising to
    the point of stubbornness, which can manifest as belligerence, boastful pride and a hot temper.
  sector: city
  exits:
    north:
      to: tba:240:room:24014
    east:
      to: tba:240:room:24006
    south:
      to: tba:240:room:24000
    west:
      to: tba:240:room:24004

"tba:240:room:24006":
  name: Zyanya Way
  description: >
    You have heard stories that minotaurs like large buildings and open spaces which can accommodate
    their extended families.  They tend to get on well with anyone displaying similar qualities to their
    own.  You hope they will get along with you.
  sector: city
  exits:
    east:
      to: tba:240:room:24007
    west:
      to: tba:240:room:24005

"tba:240:room:24007":
  name: Zyanya Way
  description: >
    Minotaurs are ancient creatures, dating back to the beginning of time. Human in body, these
    creatures have the heads of bulls, making them not very well suited towards beautypageants.
  sector: city
  exits:
    east:
      to: tba:240:room:24008
    west:
      to: tba:240:room:24006

"tba:240:room:24008":
  name: Zyanya Way
  description: >
    You remember the horrible stories about how a minotaur can become greatly enraged and wreak havoc
    if provoked.  You remind yourself to be very careful around these juggernauts.
  sector: city
  exits:
    east:
      to: tba:240:room:24009
    west:
      to: tba:240:room:24007

"tba:240:room:24009":
  name: Zyanaya Way
  description: >
    The average Minotaur tends to wear very little clothing because their fur provides quite a bit of
    warmth.  They trample past you with a certain determination that makes you feel uneasy.  They all look
    so...  Confident.
  sector: city
  exits:
    north:
      to: tba:240:room:24018
    west:
      to: tba:240:room:24008

"tba:240:room:24010":
  name: Whits Lane
  description: >
    Minotaurs are a very honorable race.  Unfortunately, they are also a violent race because of how
    they value strength.  This makes them very seclusive. Very rarely will a minotaur ever bee seen outside
    of the city.  Unless they are on a mission.
  sector: city
  exits:
    north:
      to: tba:240:room:24019
    south:
      to: tba:240:room:24001

"tba:240:room:24011":
  name: Minotaur Home
  description: >
    A large room lined with bunks stacked three high.  Several large tables are in the middle of the
    room without any chairs.  This must be where the minotaurs come to sleep and eat.  They must live a
    very mundane and dull life.
  sector: city
  exits:
    south:
      to: tba:240:room:24002
    up:
      to: tba:240:room:24085
  extras:
  - keywords: [table]
    text: The table is bare and in pretty rough shape.  Scratches mar the once smooth top.

"tba:240:room:24012":
  name: The Armory
  description: >
    You can hear the bellows pumping, the roar of the furnace where some of the finest weapons in the
    realm are made.  A huge minotaur with arms larger than your waist hammers away at some yet to be
    recognizable hunk of metal.  Many items lay about you, ready for sale
  sector: city
  exits:
    north:
      to: tba:240:room:24021

"tba:240:room:24013":
  name: Minotaur Home
  description: >
    This is where the minotaurs sleep and eat.  That is all.  A large table sits in the middle of the
    room and bunks line all the walls.  They have no need for luxuries.  A large family must live in this
    house.  A small staircase winds its way to the second floor.
  sector: city
  exits:
    south:
      to: tba:240:room:24004
    up:
      to: tba:240:room:24086
  extras:
  - keywords: [table]
    text: >
      The table spans about three quarters of the room.  Enough to seat at least 30 minotaurs.  Too bad
      there are no chairs.

"tba:240:room:24014":
  name: Vassar Road
  description: >
    From their birth, minotaurs are trained for strength, cunning, and intelligence.  They believe that
    the weak should perish and that might proves right.  It is to them, the natural process of life. 
    The street continues north and south.
  sector: city
  exits:
    north:
      to: tba:240:room:24023
    south:
      to: tba:240:room:24005

"tba:240:room:24015":
  name: Training Grounds
  description: >
    You remember the tales of battle how the Minotaurs fought ferociously and showed no mercy to their
    fallen adversaries, often stampeding over the dead and dying bodies to pursue a new enemy.
  sector: city
  exits:
    north:
      to: tba:240:room:24024
    east:
      to: tba:240:room:24016

"tba:240:room:24016":
  name: Training Grounds
  description: >
    Minotaurs view surrender as an admission of weakness, and are likely to fight to the death
    regardless of the circumstances.  Several minotaurs are here sparring with their deadly look axes and pole
    arms.
  sector: city
  exits:
    north:
      to: tba:240:room:24025
    east:
      to: tba:240:room:24017
    west:
      to: tba:240:room:24015

"tba:240:room:24017":
  name: Training Grounds
  description: >
    Minotaurs are powerfully built and tower more than eight feet in height, with the head of a bull
    and the body of a human male.  Minotaurs revere physical strength above all else, and they believe that
    the strong should naturally rule the weak.
  sector: city
  exits:
    north:
      to: tba:240:room:24026
    west:
      to: tba:240:room:24016

"tba:240:room:24018":
  name: Wasatch Lane
  description: >
    Minotaurs grow up in secluded towns only with other Minotaurs.  The city seems to be very chaotic
    and barbaric.  But, this is not the case.  They just have a very different way of approaching law
    enforcement and society.
  sector: city
  exits:
    north:
      to: tba:240:room:24027
    south:
      to: tba:240:room:24009

"tba:240:room:24019":
  name: Whits Lane
  description: >
    The stories you hear of the minotaurs are not always good ones, you remember one specifically. 
    Minotaurs believe themselves to be the "Master Race.  " They believe the gods chose them to control the
    weak and dishonorable.
  sector: city
  exits:
    north:
      to: tba:240:room:24028
    south:
      to: tba:240:room:24010

"tba:240:room:24020":
  name: Market Street
  description: >
    You recall the story how when provoked, these awesome warriors will fearlessly charge headlong into
    their foes, seeking to spill entrails with their devastating horns.  This power makes Minotaurs
    respected and revered fighters throughout all of the realm.
  sector: city
  exits:
    north:
      to: tba:240:room:24029
    east:
      to: tba:240:room:24021

"tba:240:room:24021":
  name: Market Street
  description: >
    The city around you is a wondrous city of buildings and cobblestone streets. Though crude and
    utilitarian.  Inhabited solely by minotaurs, it is ruled by Zarn, the minotaur Grand Master.
  sector: city
  exits:
    east:
      to: tba:240:room:24022
    south:
      to: tba:240:room:24012
    west:
      to: tba:240:room:24020

"tba:240:room:24022":
  name: Market Street
  description: >
    Many minotaurs are brutal savages, but they are not always mindless killers. They are ruthless,
    harsh, and stubborn, but they can be surprisingly intelligent.  As you enter the marketplace, you
    realize they are a society just like any other.
  sector: city
  exits:
    north:
      to: tba:240:room:24031
    east:
      to: tba:240:room:24023
    west:
      to: tba:240:room:24021

"tba:240:room:24023":
  name: Vassar Road
  description: >
    To the east you can hear the sounds of fighting.  To the west a small marketplace.  You remember
    more of the minotuar history.  They are intensely proud creatures, half-human and half-cow, "bovine" is
    just about the worst insult anyone can hurl at a minotaur
  sector: city
  exits:
    north:
      to: tba:240:room:24032
    east:
      to: tba:240:room:24024
    south:
      to: tba:240:room:24014
    west:
      to: tba:240:room:24022

"tba:240:room:24024":
  name: Training Grounds
  description: >
    You have entered into the minotaurs training area.  Here minotaurs practice their various fighting
    styles.  You could probably learn a thing or two by watching.  Because of their legendary stamina and
    massive builds most Minotaurs pursue a life of military service.
  sector: city
  exits:
    north:
      to: tba:240:room:24033
    east:
      to: tba:240:room:24025
    south:
      to: tba:240:room:24015
    west:
      to: tba:240:room:24023

"tba:240:room:24025":
  name: Training Grounds
  description: >
    Adventurer knows better then to get on the wrong side of a Minotaur. Minotaurs are a large strong
    race well known for their abillty to work days at a time with very little rest.  Though they are not
    among the smartest of races, they are regarded for their warrior skills and even the novice adventurer
    knows better then to get on the wrong side of a Minotaur.
  sector: city
  exits:
    north:
      to: tba:240:room:24034
    east:
      to: tba:240:room:24026
    south:
      to: tba:240:room:24016
    west:
      to: tba:240:room:24024

"tba:240:room:24026":
  name: Training Grounds
  description: >
    Minotaurs are great fighters, but they are limited in the other occupations. They mostly keep to
    themselves because of their superior beliefs except during war.  If you ever had to go to war, this
    would be who you want as any ally.
  sector: city
  exits:
    north:
      to: tba:240:room:24035
    south:
      to: tba:240:room:24017
    west:
      to: tba:240:room:24025

"tba:240:room:24027":
  name: Wasatch Lane
  description: >
    Minotaurs frequently prize strength and prowess, and tend to prefer simple, direct solutions to
    problems.  The majority of Minotaurs despise laziness and injustice.  You wonder exactly at what their
    definition of laziness and injustice would be.
  sector: city
  exits:
    north:
      to: tba:240:room:24036
    south:
      to: tba:240:room:24018

"tba:240:room:24028":
  name: Whits Lane
  description: >
    The small lane continues north and south from here.  You recall even more of the stories of the
    minotaur way of life.  The family is the blood of the culture.  Without a family a Minotaur has no
    source for nobility, honor, or pride.
  sector: city
  exits:
    north:
      to: tba:240:room:24038
    south:
      to: tba:240:room:24019

"tba:240:room:24029":
  name: Specialty Shop
  description: >
    This small shop has exotic items only made by minotaurs, for minotaurs. You have heard stories of
    some people being able to get these items through other hands, but no minotaur ever gives up these
    special items willingly.
  sector: city
  exits:
    south:
      to: tba:240:room:24020

"tba:240:room:24030":
  name: Minotaur House
  description: >
    There is something strange about this house.  You can't quite figure it out, but something disturbs
    you.  A staircase leads up.  The street is to the north. A large rug covers most of the floor here. 
    It is the first luxury you have seen in any minotuar home.
  sector: city
  exits:
    north:
      to: tba:240:room:24040
    up:
      to: tba:240:room:24087
    down:
      to: tba:240:room:24088
      door:
        keywords: [Grate]
        kind: door
        reset: closed
  extras:
  - keywords: [rug]
    text: >
      The rug seems to be covering a large grate in the floor.  You wonder if you could lift that heavy
      metal grate.
  - keywords: [grate]
    text: A small grate is partially hidden under some dirt and blankets.

"tba:240:room:24031":
  name: Supplies store
  description: >
    Shelves are everywhere in this small shope.  Crowded to overflowing, items lean against the walls,
    are stacked on the floor, and are even hanging from the ceiling.  You wonder what kinds of things
    might be for sale to you.  Most minotaurs only trade with their own kind.
  sector: city
  exits:
    south:
      to: tba:240:room:24022

"tba:240:room:24032":
  name: Vassar Road
  description: >
    Few other races are respected or feared more than the minotaurs of Dun Maura.  Their minds and
    bodies are powerful, and they radiate auras of command and authority.  No one in their right mind comes
    to this city with evil intentions.
  sector: city
  exits:
    north:
      to: tba:240:room:24042
    south:
      to: tba:240:room:24023

"tba:240:room:24033":
  name: Training Grounds
  description: >
    You stare at the minotaurs honrs, you start to feel sick to your stomach. Could you imagine what it
    would be like to be impaled by a minotaur?  The minotaurs ivory-colored horns reach up to two feet
    in length.  They adorn their horns with gold rings which represent the number of combats won in the
    Arena.
  sector: city
  exits:
    east:
      to: tba:240:room:24034
    south:
      to: tba:240:room:24024

"tba:240:room:24034":
  name: Training Grounds
  description: >
    Minotaurs are incredibly strong and powerful.  Their thick hide can take a strong beating in
    battle.  Due to their nature, they are disliked by many other races but are tolerated because of their
    fierce warlike attitudes.  Minotaurs make superb warriors.
  sector: city
  exits:
    east:
      to: tba:240:room:24035
    south:
      to: tba:240:room:24025
    west:
      to: tba:240:room:24033

"tba:240:room:24035":
  name: Training Grounds
  description: >
    Minotaurs are the largest of the races, ranging from 7-9 feet in height. They are stronger than any
    other race, and almost as durable as the dwarves. Minotaurs are very versatile.  They prefer to be
    what they were born to be: a Warrior!
  sector: city
  exits:
    south:
      to: tba:240:room:24026
    west:
      to: tba:240:room:24034

"tba:240:room:24036":
  name: Wasatch Lane
  description: >
    Minotaurs do not look down on other races, but they rarely understand the likes of the "higher",
    "civilized" species.  They are a very brusque and direct people and don't particularly enjoy the likes
    of those races that rely on diplomacy and subterfuge to exist.
  sector: city
  exits:
    north:
      to: tba:240:room:24046
    south:
      to: tba:240:room:24027

"tba:240:room:24037":
  name: The Western Gate of Dun Maura
  description: >
    This gate is rarely open.  Only the Southern and Eastern gates are kept open to allow travel
    between the city of the centaurs and the Capital.  The wilderness beyond these gate is wild and untamed.
  sector: city
  exits:
    east:
      to: tba:240:room:24038

"tba:240:room:24038":
  name: Whits Lane
  description: >
    You arrive at the intersection before the west gate.  The minotaurs around you have heads that are
    shaped like that of a bull and their bodies are covered with fur and their feet are cleft hooves. 
    They have horns that grow 3-24 inches.
  sector: city
  exits:
    north:
      to: tba:240:room:24048
    east:
      to: tba:240:room:24039
    south:
      to: tba:240:room:24028
    west:
      to: tba:240:room:24037

"tba:240:room:24039":
  name: VaQuero Road
  description: >
    Few other races are respected or feared more than the minotaurs of Dun Maura.  Their minds and
    bodies are powerful, and they radiate auras of command and authority.  No one in their right mind comes
    to this city with evil intentions.
  sector: city
  exits:
    east:
      to: tba:240:room:24040
    west:
      to: tba:240:room:24038

"tba:240:room:24040":
  name: VaQuero Road
  description: >
    To the north you see a large, crude building.  It seems that a lot of important minotaurs must
    reside there.  It must be where the city is run from. To the south a small stone building is heavily
    guarded.
  sector: city
  exits:
    north:
      to: tba:240:room:24050
    east:
      to: tba:240:room:24041
    south:
      to: tba:240:room:24030
    west:
      to: tba:240:room:24039

"tba:240:room:24041":
  name: VaQuero Road
  description: >
    The physical presence of a minotaur is awe-inspiring.  Powerful, eight-foot tall humanoids with the
    horned head of a bull, minotaurs have fur all over their bodies, ranging in color from red to brown
    and even black.
  sector: city
  exits:
    east:
      to: tba:240:room:24042
    west:
      to: tba:240:room:24040

"tba:240:room:24042":
  name: The Center of Dun Maura
  description: >
    You find yourself in the heart of the city.  Minotaurs are everywhere.  It seem like this city is
    overflowing, you wonder how so many can live in such a small city.  They seem oblivious to your
    presence, you are not sure if that is good or bad.
  sector: city
  exits:
    north:
      to: tba:240:room:24052
    east:
      to: tba:240:room:24043
    south:
      to: tba:240:room:24032
    west:
      to: tba:240:room:24041

"tba:240:room:24043":
  name: VaQuero Road
  description: >
    You stare at the minotaurs honrs, you start to feel sick to your stomach. Could you imagine what it
    would be like to be impaled by a minotaur?  The minotaurs ivory-colored horns reach up to two feet
    in length.  They adorn their horns with gold rings which represent the number of combats won in the
    Arena.
  sector: city
  exits:
    east:
      to: tba:240:room:24044
    west:
      to: tba:240:room:24042

