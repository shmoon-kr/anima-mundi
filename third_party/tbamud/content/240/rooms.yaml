  sector: city
  exits:
    north:
      to: tba:240:room:24056
    east:
      to: tba:240:room:24047
    south:
      to: tba:240:room:24036
    west:
      to: tba:240:room:24045

"tba:240:room:24047":
  name: The Eastern Gate of Dun Maura
  description: >
    This gate is heavily guarded by the minotaurs.  You can remember the huge battles between the
    minotaurs and centaurs.  Some of the greatest fighters ever to clash in the great wars.  Now a temporary
    truce has stopped the war, but how long will it last?
  sector: city
  exits:
    west:
      to: tba:240:room:24046

"tba:240:room:24048":
  name: Whits Lane
  description: >
    Minotaurs are a very honorable race.  Unfortunately, they are also a violent race because of how
    they value strength.  This makes them very seclusive. Very rarely will a minotaur ever bee seen outside
    of the city.  Unless they are on a mission.
  sector: city
  exits:
    north:
      to: tba:240:room:24057
    south:
      to: tba:240:room:24038

"tba:240:room:24049":
  name: Hall of Vardis
  description: >
    Despite their brutal appearance, Minotaurs possess good-natured dispositions and strive to uphold
    justice in the name of the Glorious Vardis, their only god.
  sector: city
  exits:
    north:
      to: tba:240:room:24058
    east:
      to: tba:240:room:24050

"tba:240:room:24050":
  name: Hall of Vardis
  description: >
    You stand in a massive stone building.  The hall continues north.  This seems to be some kind of
    place of worship.  A large statue dominates the center of the room.  It must be the minotuars sole god.
  sector: city
  exits:
    north:
      to: tba:240:room:24059
    east:
      to: tba:240:room:24051
    south:
      to: tba:240:room:24040
    west:
      to: tba:240:room:24049

"tba:240:room:24051":
  name: Hall of Vardis
  description: >
    Minotaurs are a secluded race and are fervently religious toward their god, Vardis.  Minotaurs
    possess good-natured dispositions and strive to uphold justice in the name of Glorious Vardis.
  sector: city
  exits:
    north:
      to: tba:240:room:24060
    west:
      to: tba:240:room:24050

"tba:240:room:24052":
  name: Vassar Road
  description: >
    The physical presence of a minotaur is awe-inspiring.  Powerful, eight-foot tall humanoids with the
    horned head of a bull, minotaurs have fur all over their bodies, ranging in color from red to brown
    and even black.
  sector: city
  exits:
    north:
      to: tba:240:room:24061
    south:
      to: tba:240:room:24042

"tba:240:room:24053":
  name: Vorn Estate
  description: >
    This is the estate of the famous minotaur Vorn.  He is in charge of the cities economic stature and
    has supposedly been doing a great job for over 30 years.  But, few minotaurs seem to respect him. 
    You wonder why.
  sector: city
  exits:
    north:
      to: tba:240:room:24062
    east:
      to: tba:240:room:24054
    up:
      to: tba:240:room:24098

"tba:240:room:24054":
  name: Main Chamber
  description: >
    You stand in a massive room, marble pillars support a high ceiling. Skylights and windows are
    carved intricately into the walls.  This estate is a relief compared to the crude buildings in the rest of
    the city.
  sector: city
  exits:
    north:
      to: tba:240:room:24063
    east:
      to: tba:240:room:24055
    west:
      to: tba:240:room:24053

"tba:240:room:24055":
  name: Waiting Room
  description: >
    This is where anyone seeking an audience with Vorn must wait until called upon.  The room is
    surprisingly empty.  Either Vorn runs a tight ship or the population must be scared of him.  The main
    chamber is to the west.
  sector: city
  exits:
    west:
      to: tba:240:room:24054

"tba:240:room:24056":
  name: Wasatch Lane
  description: >
    Minotaurs live by a Code of Honor.  A Minotaur would never break his word or cause dishonor to
    himself.  Minotaurs believe that "Might makes right.  " All legal cases are settled in the Arena.  The
    Arena is the heart of their culture.
  sector: city
  exits:
    north:
      to: tba:240:room:24065
    south:
      to: tba:240:room:24046

"tba:240:room:24057":
  name: Whits Lane
  description: >
    Minotaurs live by a Code of Honor.  A Minotaur would never break his word or cause dishonor to
    himself.  Minotaurs believe that "Might makes right.  " All legal cases are settled in the Arena.  The
    Arena is the heart of their culture.
  sector: city
  exits:
    north:
      to: tba:240:room:24066
    south:
      to: tba:240:room:24048

"tba:240:room:24058":
  name: Hall of Vardis
  description: >
    Minotaurs are a secluded race and are fervently religious toward their god, Vardis.  Minotaurs
    possess good-natured dispositions and strive to uphold justice in the name of Glorious Vardis.
  sector: city
  exits:
    east:
      to: tba:240:room:24059
    south:
      to: tba:240:room:24049

"tba:240:room:24059":
  name: Hall of Vardis
  description: >
    A huge statue dominates the center of this room.  Vardis, the god of minotaurs has been known by
    many names.  The god of war, death, or justice. All minotaurs revere him and wait for his return to
    finally overthrow the centaurs to the east.
  sector: city
  exits:
    north:
      to: tba:240:room:24068
    east:
      to: tba:240:room:24060
    south:
      to: tba:240:room:24050
    west:
      to: tba:240:room:24058
  extras:
  - keywords: [statue, vardis]
    text: >
      The statue depicts a giant centaur with horns covered with golden rings to portray an undefeated
      rein in the arena.  He holds a massive war axe and seems to be standing over the remains of a centaur.

"tba:240:room:24060":
  name: Hall of Vardis
  description: >
    Despite their brutal appearance, Minotaurs possess good-natured dispositions and strive to uphold
    justice in the name of the Glorious Vardis, their only god.
  sector: city
  exits:
    south:
      to: tba:240:room:24051
    west:
      to: tba:240:room:24059

"tba:240:room:24061":
  name: Vassar Road
  description: >
    To the east the entrance to a large fancy building is wide open.  You remember more of the minotuar
    history.  They are intensely proud creatures, half-human and half-cow, "bovine" is just about the
    worst insult anyone can hurl at a minotaur.
  sector: city
  exits:
    north:
      to: tba:240:room:24070
    east:
      to: tba:240:room:24062
    south:
      to: tba:240:room:24052

"tba:240:room:24062":
  name: Vorn Estate
  description: >
    Though most minotaurs would rather lead a life of battle and honor some have been persuaded by the
    ways of other races to live a more fertile and luxurious life.  This is frowned on by the society,
    but allowed by the Grand Master to allow for trade.
  sector: city
  exits:
    north:
      to: tba:240:room:24071
    east:
      to: tba:240:room:24063
    south:
      to: tba:240:room:24053
    west:
      to: tba:240:room:24061

"tba:240:room:24063":
  name: The Main Chamber
  description: >
    You work your way into the center of this fancy estate.  The exit seems to be to the west while
    Vorn himself should be in the audience chamber to the east.  This massive chamber continues north and
    south.
  sector: city
  exits:
    north:
      to: tba:240:room:24072
    east:
      to: tba:240:room:24064
    south:
      to: tba:240:room:24054
    west:
      to: tba:240:room:24062

"tba:240:room:24064":
  name: Audience Chamber
  description: >
    It is here that the cities financial matters are taken care of.  Vorn himself usually sits on top
    of a small platform at the back of the room to listen to anyone who has a reason to petition.  The
    room is lavishly decorated with curtains and a fine rug.
  sector: city
  exits:
    west:
      to: tba:240:room:24063
    up:
      to: tba:240:room:24097

"tba:240:room:24065":
  name: Wasatch Lane
  description: >
    The small lane continues north and south from here.  You recall even more of the stories of the
    minotaur way of life.  The family is the blood of the culture.  Without a family a Minotaur has no
    source for nobility, honor, or pride.
  sector: city
  exits:
    north:
      to: tba:240:room:24074
    south:
      to: tba:240:room:24056

"tba:240:room:24066":
  name: Whits Lane
  description: >
    Minotaurs do not look down on other races, but they rarely understand the likes of the "higher",
    "civilized" species.  They are a very brusque and direct towards people and don't particularly enjoy
    the likes of those races that rely on diplomacy and subterfuge to exist.
  sector: city
  exits:
    north:
      to: tba:240:room:24075
    south:
      to: tba:240:room:24057

"tba:240:room:24067":
  name: Zarn's Estate
  description: >
    Stairs lead up to the Grand Masters rooms.  He is the supreme power in the city.  Everyone except
    the War Master answer to him and him alone.  Only in the time of war can his word be overran by the
    War Master.
  sector: city
  exits:
    east:
      to: tba:240:room:24068
    up:
      to: tba:240:room:24089

"tba:240:room:24068":
  name: Zarn's Estate
  description: >
    You enter another small building attached to the end of Vardis Hall.  This is where the government,
    if you could call it that, of the minotaurs resides. Their is only one position.  The Grand Master. 
    He is the final say in all matters of the city.
  sector: city
  exits:
    east:
      to: tba:240:room:24069
    south:
      to: tba:240:room:24059
    west:
      to: tba:240:room:24067

"tba:240:room:24069":
  name: Zarn's Estate
  description: >
    Stairs lead up to Zarn's rooms where he runs the city.  The Grand Master is almost always
    accompanied by the War Master and a few advisors that help him make all the decisions for the city.
  sector: city
  exits:
    west:
      to: tba:240:room:24068
    up:
      to: tba:240:room:24090

"tba:240:room:24070":
  name: Vassar Road
  description: >
    From their birth, minotaurs are trained for strength, cunning, and intelligence.  They believe that
    the weak should perish and that might proves right.  It is to them, the natural process of life. 
    The street continues north and south.
  sector: city
  exits:
    north:
      to: tba:240:room:24079
    south:
      to: tba:240:room:24061

"tba:240:room:24071":
  name: Vorn Estate
  description: >
    Several minotaurs are actually wearing robes and some type of sandals here. They seem to have given
    up the normal minotaur life in order to pursue a more monetary lifestyle.  A spiral stairway leads
    up.
  sector: city
  exits:
    east:
      to: tba:240:room:24072
    south:
      to: tba:240:room:24062
    up:
      to: tba:240:room:24096

"tba:240:room:24072":
  name: Vorn Estate
  description: >
    You wonder how even a race of warriors must trade and have some sort of monetary system to keep the
    city healthy.  The occupants of this small estate must be in charge of all trade with the outsiders.
  sector: city
  exits:
    east:
      to: tba:240:room:24073
    south:
      to: tba:240:room:24063
    west:
      to: tba:240:room:24071

"tba:240:room:24073":
  name: Vorn Estate
  description: >
    This Vorn, the guy who owns this place must be rich.  You have heard that he controls all trade
    with the other cities.  He is well known as a conniving salesman who always gets the best of any deal.
  sector: city
  exits:
    west:
      to: tba:240:room:24072

"tba:240:room:24074":
  name: Wasatch Lane
  description: >
    The stories you hear of the minotaurs are not always good ones, you remember one specifically. 
    Minotaurs believe themselves to be the "Master Race.  " They believe the gods chose them to control the
    weak and dishonorable.
  sector: city
  exits:
    north:
      to: tba:240:room:24083
    south:
      to: tba:240:room:24065
    down:
      to: tba:240:room:24099
      look: A large metal cover blocks the entrance to the sewers below the city.
      door:
        keywords: [sewer, cover]
        kind: door
        reset: closed
  extras:
  - keywords: [sewer, cover]
    text: A large metal sewer cover is partially open.

"tba:240:room:24075":
  name: Zoa Way
  description: >
    You remember the horrible stories about how a minotaur can become greatly enraged and wreak havoc
    if provoked.  You remind yourself to be very careful around these juggernauts.  The road continues
    west or south.
  sector: city
  exits:
    east:
      to: tba:240:room:24076
    south:
      to: tba:240:room:24066

"tba:240:room:24076":
  name: Zoa Way
  description: >
    Minotaurs are ancient creatures, dating back to the beginning of time. Human in body, these
    creatures have the heads of bulls, making them not very well suited towards beautypageants.
  sector: city
  exits:
    east:
      to: tba:240:room:24077
    west:
      to: tba:240:room:24075

"tba:240:room:24077":
  name: Zoa Way
  description: >
    You have heard stories that minotaurs like large buildings and open spaces which can accommodate
    their extended families.  They tend to get on well with anyone displaying similar qualities to their
    own.  You hope they will get along with you.
  sector: city
  exits:
    east:
      to: tba:240:room:24078
    west:
      to: tba:240:room:24076

"tba:240:room:24078":
  name: Zoa Way
  description: >
    You carefully work your way along the small side street.  Trying to stay out of the way of the
    minotaurs.  Their bodies are covered in a short dark fur. Minotaurs are not considered one of the smarter
    races, and tend be viewed as a race of bullies.
  sector: city
  exits:
    east:
      to: tba:240:room:24079
    west:
      to: tba:240:room:24077

"tba:240:room:24079":
  name: Vassar Road
  description: >
    You stare around in amazement at this strange race, the Minotaur.  You know the stories well. 
    Generally sturdy, large and strong folk, they are mostly hard-working, assertive and uncompromising to
    the point of stubbornness, which can manifest as belligerence, boastful pride and a hot temper.
  sector: city
  exits:
    north:
      to: tba:240:room:24084
    east:
      to: tba:240:room:24080
    south:
      to: tba:240:room:24070
    west:
      to: tba:240:room:24078

"tba:240:room:24080":
  name: Zoa Way
  description: >
    You carefully work your way along the small side street.  Trying to stay out of the way of the
    minotaurs.  Their bodies are covered in a short dark fur. Minotaurs are not considered one of the smarter
    races, and tend be viewed as a race of bullies.
  sector: city
  exits:
    east:
      to: tba:240:room:24081
    west:
      to: tba:240:room:24079

"tba:240:room:24081":
  name: Zoa Way
  description: >
    The average Minotaur tends to wear very little clothing because their fur provides quite a bit of
    warmth.  They trample past you with a certain determination that makes you feel uneasy.  They all look
    so...  Confident.
  sector: city
  exits:
    east:
      to: tba:240:room:24082
    west:
      to: tba:240:room:24080

"tba:240:room:24082":
  name: Zoa Way
  description: >
    Minotaurs grow up in secluded towns only with other Minotaurs.  The city seems to be very chaotic
    and barbaric.  But, this is not the case.  They just have a very different way of approaching law
    enforcement and society.
  sector: city
  exits:
    east:
      to: tba:240:room:24083
    west:
      to: tba:240:room:24081

"tba:240:room:24083":
  name: Zoa Way
  description: >
    Minotaurs frequently prize strength and prowess, and tend to prefer simple, direct solutions to
    problems.  The majority of Minotaurs despise laziness and injustice.  You wonder exactly at what their
    definition of laziness and injustice would be.  Minotaurs frequently prize strength and prowess, and
    tend to prefer simple, direct solutions to problems.  The majority of Minotaurs despise laziness and
    injustice.  You wonder exactly what their definition of laziness and injustice would be.
  sector: city
  exits:
    south:
      to: tba:240:room:24074
    west:
      to: tba:240:room:24082

"tba:240:room:24084":
  name: The Northern Gate of Dun Maura
  description: >
    The gate stands wide open and leads into a peaceful looking woods.  A fresh breeze blows through
    the gate carrying with it the noise and smell of the forest.  A small path leads into the woods to the
    north.
  sector: city
  exits:
    south:
      to: tba:240:room:24079

"tba:240:room:24085":
  name: Bunk Room
  description: >
    Nothing but bunks crowd this room to the max.  Stacked one on top of the other you wonder how
    anyone could live in such cramped quarters.  About a quarter of the population could probably live in this
    one house.
  sector: city
  exits:
    down:
      to: tba:240:room:24011

"tba:240:room:24086":
  name: Bunk Room
  description: >
    Nothing but bunk after bunk lining the walls.  They are actually built right into the walls.  Three
    high, on right on top of the other.  At least 20 minotaurs could probably sleep in here.  You see no
    personal items at all.
  sector: city
  exits:
    down:
      to: tba:240:room:24013

"tba:240:room:24087":
  name: Bunk Room
  description: >
    This room also gives you a strange creepy feeling.  Nothing unusual about it though.  Just bunks
    lining the walls giving the minotaurs somewhere to sleep. The night shift is snoring, asleep until
    their next watch.
  sector: city
  exits:
    down:
      to: tba:240:room:24030

"tba:240:room:24088":
  name: Hidden Room
  description: >
    You thought minotaurs were very unsecretive and incapable of any mischief. Various implements of
    torture lie about the room.  This seems to be where the not so honorable minotaurs of the society
    reside.  You wonder how a society of such strict honor could allow something like this to go on.
  sector: inside
  exits:
    up:
      to: tba:240:room:24030
      look: A small grate blocks the exit up.
      door:
        keywords: [grate]
        kind: door
        reset: closed

"tba:240:room:24089":
  name: Zarn's Hall
  description: >
    Stairs lead down or the hall continues to the east towards the meeting room. Where Zarn runs the
    city.  The hierarchy of minatours is simple.  Their God, the Grand Master, and finally the War Master.
  sector: city
  exits:
    east:
      to: tba:240:room:24091
    down:
      to: tba:240:room:24067

"tba:240:room:24090":
  name: Zarn's Hall
  description: >
    Stairs lead down or the hall continues to the west towards the meeting room. Where Zarn runs the
    city.  The hierarchy of minatours is simple.  Their God, the Grand Master, and finally the War Master.
  sector: city
  exits:
    west:
      to: tba:240:room:24091
    down:
      to: tba:240:room:24069

"tba:240:room:24091":
  name: Zarn's Hall
  description: >
    Just to the south you can see the meeting room where the Grand Master resides.  To the east and
    west are stairways leading down to the Hall of Vardis.  Several minotaurs are lounging around, awaiting
    an audience with Zarn.
  sector: city
  exits:
    east:
      to: tba:240:room:24090
    south:
      to: tba:240:room:24093
    west:
      to: tba:240:room:24089

"tba:240:room:24092":
  name: Advisors Room
  description: >
    Several bunks line the walls where the advisors to the Grand Master sleep. Always within shouting
    distance they help Zarn run the city.  To many Zarn is just a figurehead while the advisors are the
    real brains.
  sector: city
  exits:
    east:
      to: tba:240:room:24093

"tba:240:room:24093":
  name: Meeting Room of the Grand Master
  description: >
    You step into a large room with windows cut into the high ceiling to allow light, and pillars to
    keep the ceiling from crashing down on your head.  In the center of the room is a pedestal where the
    grand master gives audience with his advisors.
  sector: city
  exits:
    north:
      to: tba:240:room:24091
    east:
      to: tba:240:room:24094
    south:
      to: tba:240:room:24095
    west:
      to: tba:240:room:24092

"tba:240:room:24094":
  name: War Masters Chambers
  description: >
    Easily the most respected of all the minotaurs, the War Master is admired almost as much as the war
    god himself.  The title War Master is the ultimate honor to be given to any minotaur.  It can only
    be given to a minotaur who has been a war hero and undefeated in the arena.
  sector: city
  exits:
    west:
      to: tba:240:room:24093

"tba:240:room:24095":
  name: Grand Masters Chamber
  description: >
    The Grand Master is the only political figure in the entire city.  Some minotaurs even despise him
    because of this, but it was agreed that a figurehead is necessary in order to run the city and trade
    with the other races.
  sector: city
  exits:
    north:
      to: tba:240:room:24093

"tba:240:room:24096":
  name: A Bedroom
  description: >
    This has to be one of the first liveable rooms you have seen in this city of stone.  A large bed
    fills the room and even some small furniture is scattered haphazardly in the corners.
  sector: city
  exits:
    down:
      to: tba:240:room:24071

"tba:240:room:24097":
  name: Vorn's Chamber
  description: >
    This is where the richest minotaur alive sleeps.  The minotaurs are well known for their honesty
    and word.  You wonder if it is possible for a minotaur to actually be evil.  If it is possible, Vorn
    would be a good place to start.
  sector: city
  exits:
    down:
      to: tba:240:room:24064

"tba:240:room:24098":
  name: Guest Room
  description: >
    This is where the special guests of the estate can stay if Vorn thinks it fit.  Many people of
    different races and from across the realm travel to this fabled city.  If they have the money Vorn is
    sure to swindle them out of it.
  sector: city
  exits:
    down:
      to: tba:240:room:24053

"tba:240:room:24099":
  name: The Sewers
  description: >
    Large Iron bars block any further entrance to the sewers.  A small rusty ladder leads back up into
    the city.  You guess the minotaurs did not want anyone wandering below them in their sewers.
  sector: inside
  exits:
    up:
      to: tba:240:room:24074
      look: A sewer cover leading up to the city and fresh air.
      door:
        keywords: [sewer, cover]
        kind: door
        reset: closed
