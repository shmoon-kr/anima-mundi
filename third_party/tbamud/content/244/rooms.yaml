"tba:244:room:24455":
  name: Prison Upper Level
  description:
  - >
    You're on the upper level of the Cooland Prison. A metal spiral staircase leads down into darkness.
    This is where the prisoners are kept.
  - A sign written in red lettering is attached to the wall.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:244:room:24456
      look: The hallway continues West.
    down:
      to: tba:244:room:24444
      look: The staircase leads Down into darkness.
  extras:
  - keywords: [sign, notice, red, lettering]
    text:
      preformatted: |2
           This sign looks like this:
            x-------------------------------------------------------x
            |              THIS IS YOUR FINAL WARNING!!!            |
            |                                                       |
            |   Cooland Prison is EXTREMELY dangerous! DO NOT go    |
            |   down this staircase if you wish to live.            |
            |                                                       |
            x-------------------------------------------------------x

"tba:244:room:24456":
  name: Prison Upper Level
  description: >
    You're on the upper level of the Cooland Prison. The walls are made of cinderblocks, and an
    immensely huge thick metal door leads west. This must be the main door that keeps the prisoners safely
    locked up. A small stool sits beside the door, which is where Joe the gateguard sits.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:244:room:24455
      look: The hallway continues East.
    west:
      to: tba:244:room:24457
      look: The hallway continues West.
      door:
        keywords: [door, metal, thick, huge]
        kind: pickproof
        key: tba:244:obj:24499
        reset: locked

"tba:244:room:24457":
  name: Cooland Prison
  description:
  - >
    You're in the main entrance of the Cooland Prison. The walls are made of thick cinderblocks, and
    the floor looks like it could support a freight train. The three windows looking out onto Midgaard have
    thick bars across them. An immensely huge thick metal door leads east. This must be the main door
    that keeps the prisoners safely locked up. A large desk sits along the northern wall, but it looks
    empty. Maybe this prison isn't maintained anymore.
  - A sign has been attached to the wall beside the door.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:244:room:24456
      look: The hallway leads East.
      door:
        keywords: [door, metal, thick, huge]
        kind: pickproof
        key: tba:244:obj:24499
        reset: locked
  extras:
  - keywords: [sign, notice]
    text:
      preformatted: |2
           The sign looks like this:
           x------------------------------------------------------------x
           |               C O O L A N D   P R I S O N                  |
           |                                                            |
           |  WARNING: Cooland Prison is an extremely dangerous place,  |
           |           filled with death traps, aggressive monsters,    |
           |           and a maze-like design. If you value your life,  |
           |           DO NOT enter!                                    |
           |                                                            |
           x------------------------------------------------------------x
