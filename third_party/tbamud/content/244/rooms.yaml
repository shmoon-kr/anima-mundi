"tba:244:room:24409":
  name: Cell B2
  description: >
    As soon as you enter the cell, the floor collapses, and you feel yourself falling, falling deep
    into the ground. You finally land, and you feel both of your legs snap under your weight. As you scream
    out in pain, the rest of the debris from the cement floor lands on you, crushing your body.
  sector: inside
  flags: [dark, indoors, soundproof, no_track, no_magic]
  exits:
    north:
      to: tba:244:room:24405
      look: The main hallway is North.
      door:
        keywords: [door, iron]
        kind: pickproof
        key: tba:244:obj:24499
