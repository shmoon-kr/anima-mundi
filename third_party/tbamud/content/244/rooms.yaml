"tba:244:room:24411":
  name: A Warm Room
  description: >
    As soon as you step through the door, you fall about twenty feet and land on a bed of red hot
    coals. Your body is engulfed in flames, and you quickly roast to death.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track, no_magic]

"tba:244:room:24412":
  name: A Prison Corridor
  description: >
    You're in a dark corridor in the Cooland Prison. The walls are quite damp, and the dark gray paint
    is flaking. You notice large cracks in the old cement floor, and you wonder if can support you. You
    see a small greasy rat scuttle through a small hole in the wall, while a long burnt out light bulb
    hangs from the ceiling. You can feel an intense heat coming from an iron door to the north, while you
    feel an extreme coldness coming from an iron door leading south.
  sector: inside
  flags: [dark, indoors, soundproof, no_track, no_magic]
  exits:
    north:
      to: tba:244:room:24411
      look: A hot room is North.
      door:
        keywords: [door, iron]
        kind: door
    east:
      to: tba:244:room:24414
      look: The corridor continues East.
    south:
      to: tba:244:room:24413
      look: A cold room is South.
      door:
        keywords: [door, iron]
        kind: door

"tba:244:room:24413":
  name: A Cold Room
  description: >
    As soon as you step through the door, you fall about twenty feet and land hard on a sheet of ice.
    The room is extremely cold, and your body quickly freezes solid.
  sector: inside
  flags: [dark, no_mob, indoors, soundproof, no_track, no_magic]

