"tba:244:room:24407":
  name: Cafeteria
  description: >
    You're overwhelmed by the stink of rotting food. Several long wooden tables stretch the entire
    length of the room, with many half destroyed chairs scattered around. At the far end of the room is a
    food counter, and several stainless steel food bowls are sitting on it. That must be where the stink is
    coming from. About a dozen rows of flickering lights hang from the ceiling.
  sector: inside
  flags: [dark, indoors, soundproof, no_track, no_magic]
  exits:
    west:
      to: tba:244:room:24406
      look: The cell hallway is West.

