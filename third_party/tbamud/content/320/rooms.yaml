"tba:320:room:32001":
  name: At the Shoreline
  description: >
    The calm sooth mind and body, lending a feeling of peace and comfort to any traveler who passes. 
    The waves roll gently by, the ocean seeming harmless and worry-free.  A rock littered shore lies to
    the north, so jumbled and covered in rock as to be unpassable.
  sector: inside
  exits:
    east:
      to: tba:320:room:32002
    south:
      to: tba:320:room:32006

"tba:320:room:32002":
  name: At the Shoreline
  description: >
    The water is a gently rolling calm here that seems to go on forever.  The sky and the water match
    almost exactly, so blue the water and so clear the sky.  A rock littered shore lies to the north, so
    jumbled and covered in rock as to be unpassable.
  sector: inside
  exits:
    east:
      to: tba:320:room:32003
    south:
      to: tba:320:room:32007
    west:
