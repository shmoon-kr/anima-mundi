"tba:320:room:32003":
  name: At the Shoreline
  description: >
    The water has grown tumultous and rough here, the waves not high but frequent.  Water splashes into
    the air as the small waves spalsh into each other.  A rock littered shore lies to the north, so
    jumbled and covered in rock as to be unpassable.
  sector: inside
  exits:
    east:
      to: tba:320:room:32004
    south:
      to: tba:320:room:32008
    west:
      to: tba:320:room:32002

"tba:320:room:32004":
  name: At the Shoreline
  description: >
    The wind has picked up a bit and has caused the sea to begin to churn a bit, the water bobbing and
    jumping rapidly.  Every now and again a small fish can be seen jumping up from the wake, searching
    for food on the surface.  A rock littered shore lies to the north, so jumbled and covered in rock as to
    be unpassable.
  sector: inside
  exits:
    east:
      to: tba:320:room:32005
    south:
      to: tba:320:room:32009
    west:
      to: tba:320:room:32003

"tba:320:room:32005":
  name: At the Shoreline
  description: >
    The sea has turned to calm that is almost unsettling.  Any sailor would bow their head and say a
    quick prayer to the Sea God at this time to pray for a wind of some sort.  Looking in all directions,
    the sea is still and quiet.  A rocky shore is to the north, its boulder riddled area too cluttered to
    be passed along.  A long jetty lies to the east running south into the ocean, a tall lighthouse at
    its end.
  sector: inside
  exits:
    east:
      to: tba:320:room:32026
    south:
      to: tba:320:room:32010
    west:
      to: tba:320:room:32004

"tba:320:room:32006":
