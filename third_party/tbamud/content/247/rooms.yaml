"tba:247:room:24704":
  name: In front of the Chapel
  description: >
    You are on an open space before a small chapel.  A gravel road leads north through the graveyard
    and the chapel entrance is to the south.  A few flowers have been trampled into the dirt.
  sector: city
  exits:
    north:
      to: tba:247:room:24703
      look: The gravel road continues northward.
    south:
      to: tba:247:room:24705
      look: The chapel door is made of dark wood.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:247:room:24705":
  name: Inside the Chapel
  description: >
    You are in a small, dark chapel.  The dark brown glass in the tiny windows does not let much light
    through.  A few rows of worn wooden benches stand here.
  sector: city
  exits:
    north:
      to: tba:247:room:24704
      look: The chapel door is made of dark wood.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [benches, rows]
    text: The benches are not of the comfortable kind.
  - keywords: [glass, windows]
    text: The windows must be meant to be dark.  At least they are completely clean.

