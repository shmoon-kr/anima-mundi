      look: The corridor continues in that direction.

"tba:247:room:24755":
  name: The Catacombs
  description: >
    There is a strong wind in this part of the corridor.  You stand in a long hall running east to
    west.  The west looks very dark ahead and you can no longer see the floor in that direction.  There is
    another passageway to the north.  The there are small cracks in the walls here and the floor is
    littered with debris from the ceiling.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24757
      look: The corridor continues in that direction.
    east:
      to: tba:247:room:24754
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24756
      look: The corridor continues in that direction but you can no longer see the floor.

"tba:247:room:24756":
  name: The Pit of Lost Souls
  description: >
    You step into the area and suddenly realize that there is no floor beneath your feet.  You are
    falling, and you think to yourself, "Oh, no, I hit a DT". However, moments before you would have
    splattered to your death, a decaying corpse breaks your fall.  Looking around, you see that corpses fill this
    room. There are no exits.
  sector: inside
  flags: [dark, no_mob, indoors, no_magic, private]
  extras:
  - keywords: [corpse, body]
    text: >
      They look like they've been here a while.  You hope you don't have to stay here with them much
      longer!

"tba:247:room:24757":
  name: The Catacombs
  description: >
    The corridor here stretches north to south.  This area looks extremely old and the ceiling seems to
    want to cave in.  There are larger and larger chunks of stone that have fallen in.  You wonder just
    how save this passageway is.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24758
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24755
      look: The corridor continues in that direction.

"tba:247:room:24758":
  name: The Catacombs
  description: >
    You have cone to a dead end.  Large block lie strewn around the ground here and you feel that if
    the passage did continue it wouldn't go much further without being blocked by rubble anyway.  The
    passageway heads south and there is a stone door to the west.  Looks like there is an inscription on the
    door.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:247:room:24757
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24759
      look: There lies before you a stone door.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24759
        reset: locked
  extras:
  - keywords: [writing, inscription]
    text:
    - "\"That is not dead"
    - Which can eternal lie,
    - Yet with strange aeons
    - Even death may die."
    - -H. P. Lovecraft

"tba:247:room:24759":
  name: The Ancient Tomb
  description: >
    You see before you an altar which rests on dais steps against the west wall. Upon the altar lies a
    skull on top of a pile of fine white dust.  Two large rubies are placed within its eye sockets and
    its teeth glint of sparkling diamonds.  You do not like the way it looks back at you and seems to grin.
    You feel a presence of great evil in this room and you feel that you should turn back, before
    something bad happens.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    east:
      to: tba:247:room:24758
      look: The only exit to this room lies in that direction.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24759
        reset: locked

"tba:247:room:24760":
  name: The Guardian Chamber
  description: >
    You have entered what looks like a waiting room.  There is a high vaulted ceiling here and an
    archway leads to the east.  There is a faint red light coming from the east and you hear what sounds like
    high voltage electricity.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    east:
      to: tba:247:room:24761
      look: You wonder what must lie beyond that archway.
    west:
      to: tba:247:room:24751
      look: The doorway leads back into the catacombs.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24760
        reset: locked

"tba:247:room:24761":
  name: The Death Master's Laboratory
  description: >
    You have entered the laboratory of the Death Master.  He was once a high level cleric, but laughed
    in the face of the gods, so we put him down here for you to try and kill.  Black candles provide
    light as the Death Master attempts to bring life back into a once dead corpse.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    west:
      to: tba:247:room:24760
      look: The waiting room from which you came.

"tba:247:room:24762":
  name: A Grave
  description: >
    The mist chills your bones as you enter this area, yet you feel a calm peace.  Figures move through
    the swirling fog.  The cemetery continues to the west east and south.
  sector: field
  exits:
