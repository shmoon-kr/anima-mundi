"tba:247:room:24714":
  name: The desecrated plot
  description: >
    This grave has been disturbed recently.  It looks as though something has dug it's way out from
    underneath.  The grave stone itself has been knocked over and where once an epitaph appeared, there is
    now only claw marks.  Dark evergreen trees grow to the south and east, although there is an opening to
    east where something has smashed through the tree limbs.  More plots lie to the north and west.
  sector: field
  exits:
    north:
      to: tba:247:room:24712
      look: To the north lies another cemetery plot.
    east:
      to: tba:247:room:24715
      look: To the east, a small path has been created through the trees.
    west:
      to: tba:247:room:24713
      look: To the west lies another cemetery plot.

"tba:247:room:24715":
  name: A makeshift trail
  description: >
    This trail seems to have been created recently.  There are claw marks on the trees and broken
    branches litter the ground.  Although the trail is dark, these markers clearly show you the path.  The
    trail continues to the east, the cemetery lies west.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:247:room:24716
      look: Without the broken branches to show you the way, the trail would be impossible to follow.
    west:
      to: tba:247:room:24714
      look: The cemetery lies back to the west.

"tba:247:room:24716":
  name: A small clearing
  description: >
    The trail opens up into a larger area.  The trees surrounding this area are all dead and bare earth
    covers the ground.  Several of the trees have fallen over creating impassable deadfalls to the north
    and east.  Similar dead trees have form what resembles a cave to the south.  The nauseating stench
    of decay drifts from somewhere and you sense a powerful evil nearby.
  sector: field
  exits:
    south:
      to: tba:247:room:24717
      look: It looks very dark and foreboding in there.
    west:
      to: tba:247:room:24715
      look: The path leading back to the cemetery.

"tba:247:room:24717":
  name: The barrow
  description: >
    You have stumbled into the lair of a barrow wight and his ghoul followers. This place reeks of
    decay.  Bones and decaying corpses are strewn about the place, and you really hope that you don't become
    part of this carnage.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24716
      look: The clearing lies back to the north.

