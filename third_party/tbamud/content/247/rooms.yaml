"tba:247:room:24730":
  name: The Great Tomb
  description: >
    The mausoleum is made of smooth marble.  It is quite cold in here but feels peaceful enough.  The
    very walls seem to glow blue and it showers the room in a ghostly light.  There is an iron vault
    embedded into the west wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:247:room:24726
      look: The iron door leads back out into the cemetery.
      door:
        keywords: [door]
        kind: door
        key: tba:247:obj:24730
        reset: locked
    west:
      to: tba:247:room:24731
      look: The vault is made of wrought iron.
      door:
        keywords: [vault]
        kind: door
        key: tba:247:obj:24731
        reset: locked
  extras:
  - keywords: [vault]
    text: It looks very solid.  You'd probably need something like a crowbar to open it.

"tba:247:room:24731":
  name: Inside the Vault
  description: >
    You climb inside the iron vault.  It is a very tight squeeze in here.  You rest your hand on the
    north wall of the vault for support, except that your hand disappears into the darkness.  This north
    wall must be only a clever illusion and not really exist at all!  You wonder what lies down there.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:247:room:24733
      look: Total darkness.
    south:
      to: tba:247:room:24730
      look: That way leads back into the main room of the mausoleum.
      door:
        keywords: [vault]
        kind: door
        key: tba:247:obj:24731
        reset: locked

"tba:247:room:24732":
  name: A very dark room
  description: >
    Your feeble light source does little to penetrate the darkness in here. Blackness surrounds you,
    you can't even see the walls in this room.  Even the doorway behind you seems to have disappeared. 
    Suddenly something occurs to you that sends chills up and down your spine.  You get a bad feeling that
    you are not alone in here!
  sector: inside
  flags: [dark, indoors, private]
  exits:
    east:
      to: tba:247:room:24733
      look: You can't see a blasted thing!
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:247:room:24733":
  name: Catacomb entrance
  description: >
    This stonework in this area looks quite a bit older than upstairs in the mausoleum.  You wonder
    when it was built, and why.  Small rodents (not worth killing) run around on the floor.  There is a door
    to the west which is pitch black in color.  The hallway continues to the east, you hear a faint
    moaning coming from that direction.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24735
      look: The hallway continues to the east.
    south:
      to: tba:247:room:24731
      look: A narrow crawlway leads back inside the vault.
    west:
      to: tba:247:room:24732
      look: The door is a dull black color.
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:247:room:24735":
  name: The Catacombs
  description: >
    The corridor continues both east and west.  It is very dirty in here, cobwebs hang from the ceiling
    corners and small bones litter the floor.  A faint moaning is coming from the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24736
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24733
      look: The corridor continues in that direction.

"tba:247:room:24736":
  name: A Split in the Corridor
  description: >
    There is a triple junction here, with the corridor running both east, west and south.  The passage
    way east looks as it hasn't been disturbed for some time and cobwebs seem to grow thick in that
    direction.  A faint moaning sound can be heard to the south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24737
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24742
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24735
      look: The corridor continues in that direction.

"tba:247:room:24737":
  name: The Catacombs
  description: >
    The corridor continues both east and west.  It is very dirty in here, cobwebs hang from the ceiling
    corners and small bones litter the floor.  A faint moaning is coming from the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24738
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24736
      look: The corridor continues in that direction.

"tba:247:room:24738":
  name: The Catacombs
  description: >
    The corridor continues both east and west.  It is very dirty in here, cobwebs are everywhere and
    seem to be getting thicker to the east.  You have a feeling that it's been a very long time since
    anyone has been in this part of the catacombs.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24739
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24737
      look: The corridor continues in that direction.

"tba:247:room:24739":
  name: The Catacombs
  description: >
    The corridor continues both east and west.  You are almost completely covered head to toe with
    cobwebs now.  They seem to cling to your body like glue and it is impossible for you to avoid them. 
    You've yet to notice a single spider, however.  The northern wall is in ruins as if something has broken
    it's way through.  Large blocks of stone litter the corridor.  You could probably squeeze through the
    hole if you so desired.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:247:room:24740
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24738
      look: The corridor continues in that direction.

"tba:247:room:24740":
  name: The Cobwebbed Catacomb
  description: >
    This area is almost solid cobwebs.  You trudge through them, trying to clear a path.  As you brush
    them aside you notice that you've come to a dead end. Closer examination reveals an archway to the
    south.  But so many cobwebs cover the archway that they've formed a completely opaque door.  The
    corridor continues back to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:247:room:24741
      look: The archway is blocked by a wall of cobwebs.
      door:
        keywords: [cobweb]
        kind: door
        reset: closed
    west:
      to: tba:247:room:24739
      look: The corridor continues in that direction.

"tba:247:room:24741":
  name: The Ancient Tomb
  description: >
    The air is very stale in here.  Cobwebs cover the walls and ceiling, however the middle of the room
    is relatively clear of them.  In each corner of this chamber, an ancient sarcophagus lies against
    the wall.  There is a low grinding noise as they all start to open.  The only exit is north.
  sector: inside
  flags: [indoors, private]
  exits:
    north:
      to: tba:247:room:24740
      look: A thick wall of cobwebs.
      door:
        keywords: [cobweb]
        kind: door
        reset: closed

"tba:247:room:24742":
  name: The Catacombs
  description: >
    The corridor continues both north and south.  The floor is littered with broken bits of bone and
    small scraps of burial wrappings.  You hear a distinct moaning sound coming from the south.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24736
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24743
      look: The corridor continues in that direction.

"tba:247:room:24743":
  name: The Catacombs
  description: >
    The corridor continues both north and east.  The floor is littered with broken bits of bone and
    small scraps of burial wrappings.  There is an iron door to the south and a loud moaning seems to be
    coming from the other side of it.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24742
      look: The corridor continues in that direction.
    east:
      to: tba:247:room:24745
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24744
      look: An iron door.
      door:
        keywords: [door]
        kind: door
        key: tba:247:obj:24744
        reset: closed

"tba:247:room:24744":
  name: The Chamber of Sorrow
  description: >
    This is the source of moaning.  The room is decorated with black curtains. They look very moth
    eaten and mildewed.  A black sarcophagus lies on the floor in the center of the room, and leaning over
    it, sobbing deeply, rests a banshee.  She seems to be too interested in crying and wailing than to
    notice you.  The door stands to the north and there are no other exits.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    north:
      to: tba:247:room:24743
      look: The catacombs are back to the north.
      door:
        keywords: [door]
        kind: door
        key: tba:247:obj:24744
        reset: closed

"tba:247:room:24745":
  name: The Catacombs
  description: >
    The corridor continues both east and west.  The floor is littered with broken bits of bone and
    small scraps of burial wrappings.  A distinct moaning sound can be heard back to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24746
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24743
      look: The corridor continues in that direction.

"tba:247:room:24746":
  name: The Catacombs
  description: >
    The corridor bends here and continues to the west and south.  A faint moaning sound can be heard to
    the west.  The air is very stale in here.  The floor is littered with the decaying corpses of small
    rodents and splinters of broken bones.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:247:room:24747
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24745
      look: The corridor continues in that direction.

"tba:247:room:24747":
  name: The Catacombs
  description: >
    The corridor splits here leaving exits to the north, east and south.  The air seems hot and dry and
    reeks of staleness.  Splinters of broken bone litter the floor and a few cobwebs hang from the
    ceiling.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24746
      look: The corridor continues in that direction.
    east:
      to: tba:247:room:24748
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24750
      look: The corridor continues in that direction.

"tba:247:room:24748":
  name: The Catacombs
  description: >
    The corridor here forms a small alcove with the passageway back to the west and a warped looking
    hardwood door to the east.  You fell chills up and down your spine as you approach the door.  You
    wonder what might lie behind it.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24749
      look: There lies before you a wooden door.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24749
        reset: locked
    west:
      to: tba:247:room:24747
      look: The corridor continues in that direction.

"tba:247:room:24749":
  name: The Coffers
  description: >
    The floor of this room is littered with coins.  Many of which have tarnished with age throughout
    the centuries.  There must be a fortune in here and you wonder who it once belonged to.  Transparent
    figures guard this treasure and they don't look happy that you have found it.
  sector: inside
  flags: [dark, indoors, private]
  exits:
    west:
      to: tba:247:room:24748
      look: The doorway leads back into the catacombs.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24749
        reset: locked

"tba:247:room:24750":
  name: The Catacombs
  description: >
    The corridor here continues north and south.  The air here is very stale and the smell of decay and
    dry rot reeks heavily.  You wonder where exactly these catacombs lead.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24747
      look: The corridor continues in that direction.
    south:
      to: tba:247:room:24751
      look: The corridor continues in that direction.

"tba:247:room:24751":
  name: The Catacombs
  description: >
    The corridor here bends and takes off to the north and west.  There is a golden door to the east
    with a flaming skull emblazoned on it.  The air is cold here and there is sort of a light draft.  The
    air seems to seep out from the cracks in the doorframe.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:247:room:24750
      look: The corridor continues in that direction.
    east:
      to: tba:247:room:24760
      look: The door is smooth, gold, and cold to the touch.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:247:obj:24760
        reset: locked
    west:
      to: tba:247:room:24752
      look: The corridor continues in that direction.

"tba:247:room:24752":
  name: The Catacombs
  description: >
    There is a slight breeze in this part of the corridor.  You stand in a long hall running east to
    west.  This corridor looks ancient.  Chunks of ceiling have fallen to the floor and there are small
    scraps of leather, bone, cloth, and other such items strewn about.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:247:room:24751
      look: The corridor continues in that direction.
    west:
      to: tba:247:room:24753
      look: The corridor continues in that direction.

