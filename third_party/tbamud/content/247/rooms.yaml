# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 247.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:247:room:24700":
  name: A Gravel Road on the Graveyard
  description: >
    You are on a well-kept gravel road that leads north-south through the graveyard.  On both sides of
    the road, grave markers poke up out of the ground. An iron grate is to the north.
  sector: city
  exits:
    east:
      to: tba:247:room:24706
      look: Headstones are arranged in neat rows to the east.
    south:
      to: tba:247:room:24701
      look: The gravel road continues southward.
    west:
      to: tba:247:room:24718
      look: The tombstones to the west look a bit older than the ones to the east.
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Graveyard by Rasta (Eric Pilcher) for KallistiMUD
        In spite of it being my first attempt at an area, it didn't turn out to bad.
        In fact, I was a bit shocked to receive praise now and then. The area connects
        to South Midgaard at the grate (sexton has key).  It includes, although they
        are modified, the original path amongst the evergreens and chapel that is found
        in stock diku.
        I recommend you do the following:
        Replace the name "Someone" on the tombstones (.wld file) with the names of some
        of your past players, gods, or your own creative names.  On Kallisti, I used
        the Gods.  The collesuim belonging to the Implementor. Vary the contents of the
        tombstones.  These are containers you can put small items in. If you have a
        problem with key hoarders, consider a second entrance to the catacombs.
        Perhaps through the sewers. Most of all, enjoy!
        Builder      : Rasta
        Zone         : 247 Graveyard
        Began        : 1996
        Player Level : 20-24
        Rooms        : 72
        Mobs         : 18
        Objects      : 34
        Links        : 00n

