"tba:279:room:27957":
  name: An Encampment of Gypsies
  description: >
    This small field is home to the covered wooden carriage of a gypsy encampment, the subdued talking
    and chattering of people can be heard within, high children's voices giggling and playing. Flickering
    fire lights the area, casting the surrounding dark trees of Champs Elysees in a welcoming, almost
    protective glow.
  sector: field
  exits:
    south:
      to: tba:279:room:27956
    down:
      to: tba:279:room:27996
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:279:obj:27955
        reset: locked

