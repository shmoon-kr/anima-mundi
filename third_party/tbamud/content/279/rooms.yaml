"tba:279:room:27998":
  name: A Small Miscellaneous Shop
  description: >
    Dark wooden walls support the thickly thatched roof of this little shop, various pieces of
    equipment and weapons hanging upon the walls. A long glass counter stands at the northern end, displaying
    various articles of clothing and jewellry.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    east:
      to: tba:279:room:27942

"tba:279:room:27999":
  name: Royal Hall
  description: >
    Massive and beautifully adorned this royal hall is where the king of France can usually be found.
    Gold ornaments and many bejewelled sculptures decorate the place, fine marble flooring polished and
    gleaming. Bright streams of light illuminate the place, cast from elegant candelabrums of gold
    suspended from the ceiling.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:279:room:27978
      door:
        keywords: [wall]
        kind: pickproof
        key: tba:279:obj:27992
        reset: locked
