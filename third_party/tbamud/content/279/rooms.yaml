# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 279.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:279:room:27900":
  name: The Entrance to France
  description: >
    This large street of France is flooded with candlelight from surrounding high lamps, the flickering
    glow adding an air of romance to the atmosphere. A large sign reminds visitors to be sure to visit
    the cathedral of Paris here. The street continues on to the east, the Champs Elysees lies to the
    north, and off to the south the town of Lyon can be seen.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:279:room:27950
    east:
      to: tba:279:room:27901
    south:
      to: tba:279:room:27937
  extras:
  - keywords: [credits, info]
    text: >
      An area based on the Notre Dame Cathedral in Paris and the Three Musketeers. By Apollo (modified by
      Detta) Links: 96-98ns portals

"tba:279:room:27901":
  name: The Beginning of Notre Dame Street
  description: >
    This beautiful street has been decorated with blossoming flowers and branching trees that grow on
    either side. Delicate flower petals drift lazily in the air, partially obscuring the more distant
    views of this continuing east to west path.
  sector: city
  exits:
    east:
      to: tba:279:room:27902
    west:
      to: tba:279:room:27900

"tba:279:room:27902":
  name: Notre Dame Street
  description: >
    This flower-strewn paved street continues on to either the east or the west. At the side an immense
    stone wall can be seen, a massive steeple rising from above it. No ordinary structure, it is
    beautifully designed and carefully decorated, obviously belonging to a very important cathedral of Paris.
  sector: city
  exits:
    east:
      to: tba:279:room:27903
    west:
      to: tba:279:room:27901

"tba:279:room:27903":
  name: The Entrance to the Cathedral
  description: >
    Here lies the entrance to the Cathedral of Notre Dame, the large door beautifully ornamented and
    decorated with representations of the four evangelists.  Above the door is a breathtakingly huge rose
    window, alight with flickering candlefire from the streets below.  The street continues on to the east
    and the west, the southern way leading into the cathedral.
  sector: city
  exits:
    east:
      to: tba:279:room:27904
    south:
      to: tba:279:room:27905
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
    west:
      to: tba:279:room:27902

"tba:279:room:27904":
  name: The End of Notre Dame Street
  description: >
    The street comes abruptly to a dead end, nothing but rising stone walls all around except for the
    large steeple visible to the east. Everything is still and quiet here, seemingly a way not travelled
    very often.
  sector: city
  exits:
    west:
      to: tba:279:room:27903

"tba:279:room:27905":
  name: The Atrium of the Cathedral
  description: >
    Awe-inspiringly beautiful, this massive gothic cathedral has obviously spared no expense. The high
    ceiling has been gilded and patterned with gold, imposing stone walls home to various carved statues,
    and the grand marble floor polished so that it shimmers with the surrounding candleglow. Two columns
    of doric design stand like guardians either side of the entranceway to the north.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:279:room:27903
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    east:
      to: tba:279:room:27907
    south:
      to: tba:279:room:27908
    west:
      to: tba:279:room:27906

"tba:279:room:27906":
  name: The Atrium of Notre Dame
  description: >
    This is the western side of the atrium, the intimidatingly large stone walls carved here and there
    into statues, golden representations of angels embedded along the bejewelled ceiling. Dazzlingly
    white, the smooth floor is made of pale marble, stretching like untouched snow off into the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27905

"tba:279:room:27907":
  name: The Atrium of Notre Dame
  description: >
    This appears to be the east end of the atrium, tall impressive sculptures placed like silent
    custodians throughout the room. Portrayals of Christ and some of his apostles can be recognized, carefully
    wrought from delicate red stone. Images of angels are inlaid into the ceiling with pure gold, amongst
    them the archangels; Raphael, Michael and Gabriel.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:279:room:27905

"tba:279:room:27908":
  name: The Central Corridor
  description: >
    This grand corridor lies at the center of the cathedral, a majestic altar rising from the marble
    floor to the south. Several wooden benches stand at either side of the corridor, places for people to
    sit and listen to the preachings of the Cardinal. A chapel lies to the east, and to the west, a
    corridor to the second floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27905
    east:
      to: tba:279:room:27909
    south:
      to: tba:279:room:27916
    west:
      to: tba:279:room:27912

"tba:279:room:27909":
  name: The Eastern Corridor
  description: >
    This corridor continues on to the east, a chapel visible ahead. Several carved benches lie to the
    left and right, the sounds of people's hushed whispering echoing along the walls like the murmurings
    of a subtle breeze.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27910
    south:
      to: tba:279:room:27917
    west:
      to: tba:279:room:27908

"tba:279:room:27910":
  name: The Waiting Room of the Cathedral
  description: >
    This small room is rather eerily cold and dark, a silent air of anticipation lingering in the air
    as visitors here wait for the priest to come. A long bench stands here, the rest of the room
    unremarkable and stone-gray, a single door lying to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:279:room:27911
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    west:
      to: tba:279:room:27909

"tba:279:room:27911":
  name: A Little Chapel
  description: >
    This humble chapel is the place where sinners amongst the local French population come to confess
    their wrongdoings. No windows are visible, leaving the room very dark indeed, only the dim glow of a
    solitary candle lighting the way. The only exit is the door to the west.
  sector: inside
  flags: [dark, indoors]
  exits:
    west:
      to: tba:279:room:27910
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27912":
  name: The Western Corridor
  description: >
    Many wood benches stand along this western corridor, seated French believers waiting patiently for
    the Cardinal to arrive. Several stained-glass windows stand along the wall, inscribed with passages
    from the bible and aglow as if with holy light. To the west, an old wooden door stands unobtrusively.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27908
    south:
      to: tba:279:room:27915
    west:
      to: tba:279:room:27913
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27913":
  name: A Small Room
  description: >
    This small stone room is cramped and covered with a layer of grime and dust, evidently no one has
    come here for a long time. There is hardly any light penetrating the gray darkness here, but what
    little there is allows for the sight of a small ladder within the northern room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27914
    east:
      to: tba:279:room:27912
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27914":
  name: The Way to the Steeple
  description: >
    Dark and sombre chill hanging heavy in the air, only the feeble flickerings of a single torch add a
    hue of warmth to these surroundings. A very old wooden ladder descends into the blackness below,
    patches of rot and decay fuelling obvious doubt as to its sturdiness.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:279:room:27913
    up:
      to: tba:279:room:27925

"tba:279:room:27915":
  name: Western Aisle
  description: >
    This long aisle lies to the western side of the cathedral, rays of natural light splaying through
    the large colored window, passages from the bible carefully scrawled into the glass, along with a
    representation of Christ's birthday; green pastures filled with shepherds and their flocks.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27912
    east:
      to: tba:279:room:27916
    south:
      to: tba:279:room:27920

"tba:279:room:27916":
  name: The Central Nave
  description: >
    Here, the glory of the surrounding cathedral seems to give way to a sombre gray cold, the veins of
    gold in the ceiling yielding to the bareness of stone, grave concrete walls bleak and unyielding.
    Even the warm wooden hues of the many benches have been dulled with time and dust.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27908
    east:
      to: tba:279:room:27917
    south:
      to: tba:279:room:27919
    west:
      to: tba:279:room:27915

"tba:279:room:27917":
  name: The Eastern Aisle
  description: >
    This long aisle runs along the eastern end of the cathedral, continuous rows of seating lining its
    length. In the eastern wall, a glass window stands aglow with candlefire and natural light from
    outside, its luminous surface portraying the last supper of Christ and his apostles.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27909
    south:
      to: tba:279:room:27918
    west:
      to: tba:279:room:27916

"tba:279:room:27918":
  name: Eastern Aisle
  description: >
    Lined with several glass artworks, this corridor is pierced through with many colored rays of
    light, apparently turning off to the north and south. Here, the largest of all the visible windows
    portrays a mosaical crucifixion of Christ, a small inscription reminding visitors to give tithe.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27917
    south:
      to: tba:279:room:27923
    west:
      to: tba:279:room:27919

"tba:279:room:27919":
  name: The Central Nave
  description: >
    This breathtakingly large corridor has been laid with a long blood-red carpet, seemingly dividing
    the medium class from the upper class society of France, the benches beyond the carpet more polished
    and padded. The roof looms far overhead, peaking in the middle so that it seems it must surely pierce
    the clouds.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27916
    east:
      to: tba:279:room:27918
    south:
      to: tba:279:room:27922
    west:
      to: tba:279:room:27920

"tba:279:room:27920":
  name: The Western Aisle
  description: >
    Lengthy and sombre with the hushed murmurings of visitors, this corridor is lined with the standard
    wooden benches that are prevalent in such cathedrals. A beautifully sculpted glass window shows the
    scene of Christ's debate with the powerful Scribes and Pharisees of the Sanhedrin.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27915
    east:
      to: tba:279:room:27919
    south:
      to: tba:279:room:27921

"tba:279:room:27921":
  name: The Western Aisle
  description: >
    Colored shafts of light dance along this long crimson-carpeted floor, streaming from a large
    stained-glass representation of Christ's submersion by John the Baptist in the Jordan River. Carved benches
    are lined orderly here, polished and cushioned for the French people of privileged social class.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27920
    east:
      to: tba:279:room:27922

"tba:279:room:27922":
  name: The Nave
  description: >
    This appears to be the principal nave of the cathedral, a massive domed roof rising above the
    glorious stone altar that rises from the floor here. The most intricate ornamentations and gildings line
    the walls here, cushioned benches and lush carpetting catering to the upper class visitors of France.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27919
    east:
      to: tba:279:room:27923
    south:
      to: tba:279:room:27924
    west:
      to: tba:279:room:27921

"tba:279:room:27923":
  name: Eastern Aisle
  description: >
    This seems to be the end of the eastern aisle, a luminous glass window flickering with candleglow,
    golden hues revealing the resurrection of Christ surrounded by depictions of heavenly creatures; holy
    angels and archangels in a state of joyous celebration and worship.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27918
    west:
      to: tba:279:room:27922

"tba:279:room:27924":
  name: The Cathedral Altar
  description: >
    Here lies the altar of Notre Dame, a massive cold table of green stone lined with glimmering blue
    marble. This is the place where the Cardinal of Paris gives mass, life-like statues of Mary and Joseph
    standing either side of the altar, and above it a carving of Christ crucified upon the cross.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27922

"tba:279:room:27925":
  name: The Second Floor of Notre Dame
  description: >
    Natural light streams in from the outdoors, cool breezes wafting fragrances of flowers and cooking
    food from the populated area below.  All around stretches the beautiful city of Paris, glorious
    houses breaking the horizon with their peaked roofs.  A wooden trapdoor lies above, apparently the way to
    the steeple.
  sector: inside
  exits:
    east:
      to: tba:279:room:27927
    up:
      to: tba:279:room:27926
      door:
        keywords: [trapdoor]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    down:
      to: tba:279:room:27914

"tba:279:room:27926":
  name: The Cathedral Steeple
  description: >
    The massive walls of this steeple loom proudly all around, rows of metal bars holding the many
    bronze bells that chime out the church calls. Only the rustling of resident birds and bats stirs the
    present silence, cold, crisp air blowing from the east and a glorious view of beautiful Paris lying
    breathtakingly below.
  sector: inside
  flags: [indoors, no_track]
  exits:
    down:
      to: tba:279:room:27925
      door:
        keywords: [trapdoor]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27927":
  name: A Corridor
  description: >
    This corridor lies completely open to outdoor temperatures and weather, no walls present at all.
    Only rows upon rows of doric columns supporting the weight of the ceiling, standing like watchful
    troops of stone sentinels.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27928
    south:
      to: tba:279:room:27931
    west:
      to: tba:279:room:27925

"tba:279:room:27928":
  name: The Central Corridor of the Second Floor
  description: >
    This large corridor runs through the center of Notre Dame, the open air of the outside rustles
    uneasily through this structure, stirring the resident animal life. Many stone columns loom from the
    shadows, casting bars of darkness over the gloomy concrete floor, a small unobtrusive room can be seen
    lying off to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27929
    south:
      to: tba:279:room:27930
    west:
      to: tba:279:room:27927

"tba:279:room:27929":
  name: The Room of Quasimodo
  description: >
    This small room is furnished only with a simple straw bed, scattered wooden figurines lie across
    the floor; the forms of different people. A little sculpture of the Cardinal is visible here, along
    with the carefully crafted figure of a dancing gypsy woman. Cold, crisp air hushes lazily around the
    place, wafting from a large arched window to the east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:279:room:27928

"tba:279:room:27930":
  name: The Central Corridor of the Second Floor
  description: >
    The cold is harsh and biting here, wind moaning as it whips through the stone pillars of the open
    corridor. The gray stone seems to absorb any traces of heat, actively chilling the place and making it
    seem even more eerie and deserted than it already is.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27928
    south:
      to: tba:279:room:27933
    west:
      to: tba:279:room:27931

"tba:279:room:27931":
  name: A Corridor in the Second Floor
  description: >
    All around are the harsh unyielding columns of concrete that support the weight of this place,
    rough cement flooring adding to the cold, almost tomb- like feeling here. Enhancing this feeling is the
    sound of the wind; howling wearily as it rushes here and there amongst the columns like a restless
    ghost.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27927
    east:
      to: tba:279:room:27930
    south:
      to: tba:279:room:27932

"tba:279:room:27932":
  name: The End of a Corridor
  description: >
    The corridor comes to an end here, many carriages passing through the street to the north, so many
    so that it appears to be a station of some sort; the sounds of people walking and chattering echoing
    down the walls. Another corridor stretches to the east, and a dark room opens to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27931
    east:
      to: tba:279:room:27933
    west:
      to: tba:279:room:27936

"tba:279:room:27933":
  name: The End of the Central Corridor
  description: >
    Here the corridor comes to an abrupt end, a vast mountain landscape stretching far to the north,
    snowy peaks glistening along the horizon. It looks as though a ladder once led the way down here, but
    it has been removed, leaving only a sheer drop... one that surely would prove fatal.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27930
    east:
      to: tba:279:room:27934
    west:
      to: tba:279:room:27932
    down:
      to: tba:279:room:27935

"tba:279:room:27934":
  name: The Eastern Room of the Second Floor
  description: >
    This large room has only a concrete floor and ceiling, doric columns standing between where
    ordinarily there would be walls. A vast city spreads below, though it does not appear to be Paris, the dress
    of the bustling people being completely different than what one would expect to find. Open breezes
    send a chill through this place, stone demons and snarling gargoyles leering from the darker corners.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:279:room:27933

"tba:279:room:27935":
  name: A Trap in Notre Dame
  description: You should watch where you are going.
  sector: inside
  flags: [no_mob]

"tba:279:room:27936":
  name: The Western Room of the Second Floor
  description: >
    This large room opens freely to the outside, no doors or walls shielding it from the outdoors. A
    large menacing statue of a winged demon hangs from the wall with fearsome stone claws. A view of the
    city lies below, partially obscured by the green canopy of a large southern forest.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:279:room:27932

"tba:279:room:27937":
  name: A Bridge In France
  description: >
    This graceful stone bridge is supported with slender curved arches, crystal waters rippling
    leisurely below. The river of Cena stretches lazily either side of the bridge, the water so calm and clean
    that it mirrors the surroundings perfectly. A large crossroads sign stands prominently here.
  sector: city
  exits:
    north:
      to: tba:279:room:27900
    south:
      to: tba:279:room:27938
  extras:
  - keywords: [read, sign]
    text: To the North lies the city of Paris and to the South; the city of Lyon.

"tba:279:room:27938":
  name: The Entrance to Lyon
  description: >
    The path opens here into the little town of Lyon, famed to be one of the most beautiful of all
    France, albeit one of the smallest. The sounds of trickling water and talking people fill the atmosphere,
    along with delicate birdsong. A large board welcomes visitors to this place, proclaiming the town as
    the best maker of wines in all France.
  sector: city
  exits:
    north:
      to: tba:279:room:27937
    south:
      to: tba:279:room:27939

"tba:279:room:27939":
  name: The Principal Street of Lyon
  description: >
    This is the entrance to the city of Lyon, small quaint houses standing in rows either side of the
    street, and a little green park lying to the west. People continue quietly about their normal daily
    living, working at their trade or simply bustling about on some errand. The heart of the city seems to
    stretch to the south, and the city of Paris lies to the north.
  sector: city
  exits:
    north:
      to: tba:279:room:27938
    east:
      to: tba:279:room:27940
    south:
      to: tba:279:room:27942
    west:
      to: tba:279:room:27941

"tba:279:room:27940":
  name: A Lyon House
  description: >
    This little house is simply designed and furnished, the basic wooden structure ornamented and hung
    with various pictures. The ceiling is thatched carefully with golden straw, a wooden bed lies tucked
    against the western wall, and a writing desk to the east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:279:room:27939

"tba:279:room:27941":
  name: The Lyon Park
  description: >
    This green park is small but pretty, swings and playground structures set up for the local
    children, benches for the parents and lazily strolling dogwalkers. Fragile flowers sway in the breezes,
    filling the atmosphere with a heady perfumed aroma and tall, leafy trees stand around, somewhat shielding
    this little grassy area from the paving and concrete of the city around.
  sector: forest
  exits:
    east:
      to: tba:279:room:27939

"tba:279:room:27942":
  name: Downtown
  description: >
    This is the downtown area of the city, colorful banners and posters advertising the various shops
    here. The lazy babbling of a fountain can be heard, along with the mellow sounds of chattering people.
    To the east a small magic shop displays its wares in the window, and to the west is a small
    miscellaneous shop.
  sector: city
  exits:
    north:
      to: tba:279:room:27939
    east:
      to: tba:279:room:27943
    south:
      to: tba:279:room:27944
    west:
      to: tba:279:room:27998

"tba:279:room:27943":
  name: The Magic Shop of France
  description: >
    This cozy tent is made of draping blue and purple cloth, various stands and shelving displaying
    powders and colored glass bottles of potion. A heady scent fills the air, as if concoctions have only
    recently been brewed, and the subtle sound of something bubbling away can be heard.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    west:
      to: tba:279:room:27942

"tba:279:room:27944":
  name: The End of the Principal Street
  description: >
    The street comes to an end here, houses of Lyon standing off to the east and the west. The
    clattering sound of carriages can be heard from the station that lies to the south, advertising trips to any
    city of France.
  sector: city
  exits:
    north:
      to: tba:279:room:27942
    east:
      to: tba:279:room:27945
    south:
      to: tba:279:room:27947
    west:
      to: tba:279:room:27946

"tba:279:room:27945":
  name: A Lyon Cabin
  description: >
    This little cabin is warm and homey, the scent of wood and flowers filling the air. Various
    paintings are hung around the walls, the scrawled signature 'Van Gogh' unobtrusively displayed in each
    corner. A wooden desk stands in the corner, covered with scattered papers and blots of ink, and a cool
    breeze flows through a broken glass window to the east.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:279:room:27944

"tba:279:room:27946":
  name: A House of Lyon
  description: >
    This modest house is typical of Lyon accomodation, the structure and walls made of warmly-hued
    wood, thatched straw making up the ceiling. Pretty paintings and sketches decorate the walls, a wooden
    table surrounded by artistically carved chairs. The smell of recently baked bread fills the air, along
    with crisp floral scents from the outdoors.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27944

"tba:279:room:27947":
  name: Carriage Station
  description: >
    This paved square seems to be where travelling passengers wait for transport, white metal benches
    placed here and there for the waiting French people. The clattering of the carriages can be heard
    echoing down the stone- paved streets, a small sign displaying local travel fares. A small dark tunnel
    lies ominously to the east.
  sector: inside
  exits:
    north:
      to: tba:279:room:27944
    east:
      to: tba:279:room:27948
  extras:
  - keywords: [read, sign]
    text: >
      PRICES FOR SERVICES To the downtown of Lyon: 50 gold coins. To the downtown of Paris: 85 gold coins

"tba:279:room:27948":
  name: A Dark Tunnel
  description: >
    This long tunnel is dark and smells horrendous enough to make anyone lose their breakfast. Damp and
    cold, the menacing shadows look like the perfect place for ambushers. Little rodents run here and
    there, beady eyes glistening in the dark, the ground wet and mushy with goodness knows what.
  sector: inside
  flags: [dark, indoors, soundproof, tunnel]
  exits:
    east:
      to: tba:279:room:27949
    west:
      to: tba:279:room:27947

"tba:279:room:27949":
  name: A Dead End
  description: >
    The tunnel comes to a black and filthy end, subtle murmurings from the shadows giving the
    impression that thieves and criminals are plotting an imminent attack. The smell too, is overpowering,
    stagnating in this airless part of the tunnel and decaying into an even fouler stench.
  sector: inside
  flags: [dark, indoors, soundproof, no_track, tunnel]
  exits:
    west:
      to: tba:279:room:27948

"tba:279:room:27950":
  name: The Entrance to Champs Elysees
  description: >
    Ahead lies the entrance to Champs Elysees, a large lush forest of the city of Paris. The tranquil
    singing of birds permeates the air, and the peaceful hush of the air passing through the leafy
    branches. The trees are so tall that their tops can hardly be seen, gigantic trunks planted in the ground
    like the columns of a grand hall. To the north lies a golden gate, a prominent notice fixed to the bars.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:279:room:27951
      door:
        keywords: [gate]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    south:
      to: tba:279:room:27900
  extras:
  - keywords: [read, notice]
    text: >
      Danger! Explore this forest at your own risk, we are not responsible for visitors who become lost
      whilst wandering about. If you dare to enter, we recommend a visit to the historical center of Paris,
      simply head N E N W S W N W.

"tba:279:room:27951":
  name: Champs Elysees
  description: >
    Faint glimmers of light are all that penetrate the thick, green canopy that covers this place. The
    chittering of squirrels and birds can be heard in the rustling overhead leaves, cold droplets of
    moisture glistening on every surface like dew. All around, everything appears the same, tall dark trunks
    and leafy plant life fading into darker shadows.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:279:room:27958
    east:
      to: tba:279:room:27952
    south:
      to: tba:279:room:27950
      door:
        keywords: [gate]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    west:
      to: tba:279:room:27954

