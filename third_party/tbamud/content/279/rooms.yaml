      to: tba:279:room:27960

"tba:279:room:27960":
  name: The Historical Center of France
  description: >
    A vast monument rises from the ground here, a depiction of Louie XIV grounded centrally before the
    plaza of the concorde that lies to the north. This is the entrance to the historical center of the
    city of Paris, where the revolution of France started in the XVIII century.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:279:room:27961
    east:
      to: tba:279:room:27959

"tba:279:room:27961":
  name: The Entrance to the Plaza Louis XIV
  description: >
    A little walkway winds through this mostly paved square, beautiful colored flowers carefully pruned
    and sculpted. Slender trees whisper quietly amongst themselves, cool leafy branches fanning the air
    as they sway. Two wooden benches stand either side of the square, painted a pale white, a little note
    pinned to each.
  sector: city
  exits:
    north:
      to: tba:279:room:27965
    east:
      to: tba:279:room:27962
    south:
      to: tba:279:room:27960
    west:
      to: tba:279:room:27963
  extras:
  - keywords: [read, note]
    text: The Plaza Louis XIV will soon be renamed to the Plaza of the Revolution. -Robespierre

"tba:279:room:27962":
  name: Plaza Louis XIV
  description: >
    This is the eastern part of the plaza, shrubs and brushes fencing most of it off from the
    surrounding houses.  Nearby revolutionaries can be seen running through the town, ducking inside open doorways
    or hiding within the alleyways.
  sector: city
  exits:
    north:
      to: tba:279:room:27966
    west:
      to: tba:279:room:27961

"tba:279:room:27963":
  name: Plaza Louis XIV
  description: >
    This area lies to the western side of the Plaza of Louis XIV, it is quiet here although there is an
    uneasy, almost angry stirring in the air, as if the people's anger toward the monarchy was
    expressing itself in the atmosphere. Fluttering of wings breaks the silence every now and again, pigeons
    landing to gobble dropped seeds before hurrying away.
  sector: city
  exits:
    north:
      to: tba:279:room:27964
    east:
      to: tba:279:room:27961

"tba:279:room:27964":
  name: Concorde Plaza
  description: >
    Tall candlelit lamps illuminate the granite paving here, scattered seeds and crumbs obviously left
    for the abundant bird population. Patches of neatly gardened grass lie here and there, sprinkled with
    droplets of moisture and vibrantly green.
  sector: city
  exits:
    north:
      to: tba:279:room:27969
    east:
      to: tba:279:room:27965
    south:
      to: tba:279:room:27963

"tba:279:room:27965":
  name: The Center of the Plaza
  description: >
    This main center of the plaza is sombre and dark, as though even the light from nearby candles
    avoids it.  A huge statue of the king stands proudly here, its once smooth surface worn with the
    scratchings of birds, one or two nests visible in the higher nooks and crannies.
  sector: city
  exits:
    north:
      to: tba:279:room:27968
    east:
      to: tba:279:room:27966
    south:
      to: tba:279:room:27961
    west:
      to: tba:279:room:27964

"tba:279:room:27966":
  name: Concorde Plaza
  description: >
    Metal benches stand either side of this large plaza, cold and shiny with a layer of perpetual
    moisture from the air. The gray granite paving adds to the feeling of discontent and misery that hangs in
    the air, flickering light from the candle lamps casting everything in dancing shadows.
  sector: city
  exits:
    north:
      to: tba:279:room:27967
    south:
      to: tba:279:room:27962
    west:
      to: tba:279:room:27965

"tba:279:room:27967":
  name: Revolution Plaza
  description: >
    This is the eastern part of the plaza, leading onto a large hotel. A prominent sign displays the
    notice 'Closed for remodelling, sorry for the inconvienience.' Tufts of grass sprout stubbornly here
    and there amongst the stone ground, creepings of moss beginning to grow like dark green veins along the
    paving. To the west stands a large building, apparently a large headquarters or school.
  sector: city
  exits:
    east:
      to: tba:279:room:27988
    south:
      to: tba:279:room:27966
    west:
      to: tba:279:room:27968

"tba:279:room:27968":
  name: The Entrance to Musketeer H.Q.
  description: >
    This area seems fairly deserted, the surrounding atmosphere very quiet and still. There appears to
    be no security at all, much of the place open to public exploration, a little unguarded door lies to
    the north.
  sector: city
  exits:
    north:
      to: tba:279:room:27970
      door:
        keywords: [door]
        kind: pickproof
        key: tba:279:obj:27968
        reset: locked
    east:
      to: tba:279:room:27967
    south:
      to: tba:279:room:27965
    west:
      to: tba:279:room:27969

"tba:279:room:27969":
  name: Revolution Plaza
  description: >
    This seems to be the western end of the plaza, an old building with large windows looming from the
    horizon to the east. Blossoming flowers and shrubbery border the paving here, natural hues of grassy
    green and the colorful splashes of red and purple blooms brightening the place.
  sector: city
  exits:
    east:
      to: tba:279:room:27968
    south:
      to: tba:279:room:27964

"tba:279:room:27970":
  name: The Entrance of Musketeer H.Q.
  description: >
    Large, and mostly unimpressive, the only thing noteworthy about this atrium is the glossy white
    marble floor.  The rest of the building is made of cold, sturdy stone; both the floor and ceiling
    painted blue.  A smell of cooking food wafts in the air, perhaps originating from the cafeteria that lies
    to the east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:279:room:27972
    east:
      to: tba:279:room:27971
    south:
      to: tba:279:room:27968
      look: <NOTHING>
      door:
        keywords: [door]
        kind: pickproof
        key: tba:279:obj:27968
        reset: locked

"tba:279:room:27971":
  name: The French Cafeteria
  description: >
    Little round tables stand scattered throughout this cafeteria, carved white chairs standing around
    each. It appears this place caters to many patrons, being of ideal location for the soldiers of the
    king to pause and relax in before going to work.
  sector: inside
  flags: [indoors, peaceful, no_magic]
  exits:
    west:
      to: tba:279:room:27970

"tba:279:room:27972":
  name: A Hall in the H.Q.
  description: >
    This large hall continues to the north, a roped chain blocking any passage forward however. A green
    marble sculpture here functions as a waterfall, lazy trickling water filling the place with tranquil
    echoes. A long corridor passes from the east to the west, the open entrance lying to the south.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27973
    south:
      to: tba:279:room:27970
    west:
      to: tba:279:room:27986

"tba:279:room:27973":
  name: The Eastern Passage
  description: >
    This lengthy eastern passage is liberally decorated with French artwork, beautiful and talented
    paintings adorning the walls. A large patio lies to the east but it has been closed off for some reason,
    prohibiting any access.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27974
    west:
      to: tba:279:room:27972

"tba:279:room:27974":
  name: The Eastern Passage
  description: >
    Dim and silent, this place appears to have hardly any windows at all, the long corridor almost
    completely shut off from the outside world. Despite this shelter, it is breathtakingly cold, the air
    crisp and biting as though the stone walls were breathing chill into the place.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27975
    south:
      to: tba:279:room:27973

"tba:279:room:27975":
  name: The Eastern Intersection
  description: >
    Three long passageways meet here at this intersection, each way looking as dark and cold as the
    other. Drab and dreary, only the occasional floral painting adding a touch of colur and warmth to the
    gray surroundings.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27976
    south:
      to: tba:279:room:27974
    west:
      to: tba:279:room:27979

"tba:279:room:27976":
  name: The Eastern Corridor
  description: >
    Formidable stone walls loom massively either side of this corridor, giving the impression that at
    one time this place could have been a fortress of the dark ages. Chilly air wafts continuously, though
    no windows are to be seen, as though invisible ghosts walked silently about stirring it.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27977
    west:
      to: tba:279:room:27975

"tba:279:room:27977":
  name: The Eastern End Of The Corridor
  description: >
    The corridor comes to a halt here, gray stone walls and ceiling yielding to the brighter hues of a
    large northern room. A massive arched window lies to the east, offering a spectacular view of the
    spread city below, curls of smoke rising into the air from distant flickering fires.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:279:room:27978
    west:
      to: tba:279:room:27976

"tba:279:room:27978":
  name: The Musketeer's Room
  description: >
    This large room is brightly lit, a place of rest for the Musketeers after a long day's work.
    Several chairs and beds stand throughout the room and against the walls, and a big wooden table holds a
    scattered deck of playing cards. Lush red carpeting pads the floor, and many colorful Van Gogh paintings
    decorate the walls.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27999
      door:
        keywords: [wall]
        kind: pickproof
        key: tba:279:obj:27992
        reset: locked
    south:
      to: tba:279:room:27977

"tba:279:room:27979":
  name: A Hall in the H.Q.
  description: >
    Long and dreary, this hall ends in a cold metal door; presumably the way to the dungeon where the
    thieves and revolutionaries rot in their cells. Dusty cobwebs flutter silently in the cool drafts
    here, the sound of hollow dripping echoing from far away.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27980
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    east:
      to: tba:279:room:27975
    west:
      to: tba:279:room:27981

"tba:279:room:27980":
  name: A Way to the Dungeon
  description: >
    This small room is damp and freezing, tufts of dust scurrying here and there over the gray concrete
    floor. A ladder descends down into the darkness, leading to the many cells, in these times probably
    more filled with revolutionaries than criminals.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:279:room:27979
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    down:
      to: tba:279:room:27989

"tba:279:room:27981":
  name: The Western Intersection
  description: >
    Bone-penetratingly cold, small green patches of mould and slime grown on the damper areas of the
    concrete walls. The mouths of three passages open here, an eastern, western, and southern way all
    joining at this point.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27979
    south:
      to: tba:279:room:27985
    west:
      to: tba:279:room:27982

"tba:279:room:27982":
  name: The Western Corridor
  description: >
    The dreary gray walls seem to stretch endlessly in either direction, damp and oozing with various
    fungal slimes, the clicking of insect legs can be heard wandering along the dark corners of the floor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27981
    west:
      to: tba:279:room:27983

"tba:279:room:27983":
  name: The Western End of the Corridor
  description: >
    The corridor comes to an abrupt end, a single arched window letting in streams of natural light and
    a refreshing breath of outside air. To the north, a long tower extends up into the ceiling, most
    likely leading into the tower.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27984
    east:
      to: tba:279:room:27982

"tba:279:room:27984":
  name: A Way to the Tower
  description: >
    An old ladder leads through the ceiling here. Made of stone, it is obviously strong and dependable
    but almost dangerously narrow. The dark interior of the tower lies above, the place where the
    Musketeers look out and watch over the city.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:279:room:27983
    up:
      to: tba:279:room:27995

"tba:279:room:27985":
  name: The Western Passage
  description: >
    The sound of trickling water echoes down this corridor, an open room visible to the west but
    blocked off with a roped chain. A feeling of dampness pervades the air, moisture condensing on the chilly
    gray walls and running in rivulets onto the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27981
    south:
      to: tba:279:room:27986

"tba:279:room:27986":
  name: The Western Passage
  description: >
    Concrete walls stretch either side of this passage, emanating an almost tomb-like cold. A big
    wooden door stands to the west, loud noises of movement coming from within along with the occasional
    whinneying of horses, a strong smell of straw and manure wafting in the air.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:279:room:27985
    east:
      to: tba:279:room:27972
    west:
      to: tba:279:room:27987
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27987":
  name: A French Stable
  description: >
    This must be the stable for the horses of the Musketeers, piles of velvety grass lying about for
    the horses to chew. An overpowering scent fills the air, of horses and sweat and rotting manure.
    Growing patches of black mould linger in the corners, adding to the lingering smell.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:279:room:27986
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27988":
  name: A French Hotel
  description: >
    This large French hotel looks as though it was once beautiful, a pair of beautiful candelabrums
    hanging from the ceiling, formed from pure gold. However the structure is in a sorry state of disrepair,
    pieces of rubble scattered on the floor where the walls and ceiling are beginning to crumble, a
    layer of dirt covering everything.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:279:room:27967

"tba:279:room:27989":
  name: A Corridor to the Cells
  description: >
    This dark corridor is wet and melancholy, black puddles collecting in the dips of the stone floor.
    This seems to lead deeper into the holding cell area, probably where the most dangerous of the
    revolutionaries are jailed.
  sector: inside
  flags: [dark, indoors, soundproof, no_magic]
  exits:
    south:
      to: tba:279:room:27990
    up:
      to: tba:279:room:27980

"tba:279:room:27990":
  name: A Corridor in the Dungeon
  description: >
    Frosty cold, it seems as though no one could survive in these corridors for long. Unfortunately the
    same cannot be said for the rodent population, various rat droppings lying about, and unmistakeable
    tufts of gray fur lying amidst what looks to be dried blood.
  sector: inside
  flags: [dark, indoors, soundproof, no_magic]
  exits:
    north:
      to: tba:279:room:27989
    south:
      to: tba:279:room:27991

"tba:279:room:27991":
  name: At the End of the Dungeon Corridor
  description: >
    Gray walls stand impassably here, marking the end of the corridor. Unnatural cold fills the place,
    the stone seeming to the strange ability to absorb both sound and magical arts alike, more than
    likely to hinder the escape of prisoners and those who would aid them.
  sector: inside
  flags: [dark, indoors, soundproof, no_magic]
  exits:
    north:
      to: tba:279:room:27990
    east:
      to: tba:279:room:27992
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed
    south:
      to: tba:279:room:27994
      door:
        keywords: [door]
        kind: pickproof
        key: tba:279:obj:27990
        reset: locked
    west:
      to: tba:279:room:27993
      door:
        keywords: [door]
        kind: pickproof
        key: tba:279:obj:27990
        reset: locked

"tba:279:room:27992":
  name: A Cell in the Dungeon
  description: >
    This forlorn little cell drips miserably with muddy water, fungi sprouting in the damp
    rat-fertilized corners. Cold stone and iron bars are all there are to be seen, dank air growing stagnant here,
    aging with the unfortunate prisoners that occupy these places.
  sector: inside
  flags: [dark, indoors, soundproof, no_magic]
  exits:
    west:
      to: tba:279:room:27991
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900

"tba:279:room:27993":
  name: A Tomb-Like Cell
  description: >
    This cell is apparently maximum security, the door instantly closing upon entry with a loud clang.
    Nothing is left to observe but the sound of echoing dripping water and the scurrying of rat claws
    upon jagged concrete.
  sector: inside
  flags: [dark, indoors, soundproof, no_magic]

"tba:279:room:27994":
  name: A Cell in the Dungeon
  description: >
    Iron bars stand like long black shadows at the end of this cell, probably the last thing many of
    the occupants here ever saw. Dripping water collects in filthy little puddles, the husky shells of long
    dead insects decaying in the corners like everything else that rots here.
  sector: inside
  flags: [dark, indoors, no_magic]
  exits:
    north:
      to: tba:279:room:27991
      door:
        keywords: [door]
        kind: door
        key: tba:279:obj:27900
        reset: closed

"tba:279:room:27995":
  name: A Tower in the H.Q.
  description: >
    High above the stretching landscape below, this small tower allows a beautiful view of the city to
    the east and the plaza to the south. Cool breezes rush in from every direction, stirring the stagnant
    air from below and rocking the little oil lamp that hangs here, providing the only light for the
    night guards.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:279:room:27984

"tba:279:room:27996":
  name: A Strange Passage
  description: >
    An eerie feeling fills this small corridor, a bright light illuminating the place although there
    are no candles or torches to be seen. To the north and south, swirling magical portals can be seen,
    probably leading to some strange place, though where cannot be guessed.
  sector: inside
  flags: [indoors, soundproof, no_track]
  exits:
    east:
      to: tba:279:room:27997
    west:
      to: tba:279:room:27996

"tba:279:room:27997":
  name: A Strange Passage
  description: >
    An eerie feeling fills this small corridor, a bright light illuminating the place although there
