# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 345.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:345:room:34500":
  name: Duluth's Zone Description Room
  description: >
    The Location is going to be an old insane asylum with a level range of 6 to 10. The whole zone is
    about 55 rooms large with three sections, the asylum, the asylum's cemetery, and the basement. It will
    have a horror theme so the alignment will be evil. As for the Plot, the player will have to make
    his/her way through the grounds to on a mini quest to find a piece of eq that will modify their strength
    up by three but lower their wisdom by three when they wear it. The quest will have one task that
    will need to be completed to get the piece of eq, but there is a quest just to get into the asylum as
    well. This is all in a modern day time period.
  sector: inside
  exits:
    down:
      to: tba:345:room:34501

"tba:345:room:34501":
  name: A Paved Road
  description: >
    The road has seen better days. It is doubtful that a car could even drive on it anymore. To the
    north the road is blocked by a fallen tree. To the south the road continues. A vine covered brick wall
    greets the eye to the east, effectively hiding what may lay beyond it.
  sector: city
  exits:
    south:
      to: tba:345:room:34502
  extras:
  - keywords: [brick, wall]
    text: >
      The wall is made of a crumbling red brick. Vines cover the bottom half of it and reach upwards.
      Lining the top of the wall are decorative black iron bars, to keep people out, or perhaps in.

"tba:345:room:34502":
  name: Before a Gate
  description: >
    The road is cracked and falling apart here. It continues that way to the north and south. There is
    a break in the wall to the east. A heavy iron bar gate stands there allowing a glimpse of what is
    behind the wall. Next to it is an old bronze plaque.
  sector: city
  exits:
    north:
      to: tba:345:room:34501
    east:
      to: tba:345:room:34504
      look: >
        Made from heavy black iron, the left side of the gate is only hanging by the bottom hinge. A large
        mansion can be seen through the bars.
      door:
        keywords: [gate, east]
        kind: door
        reset: closed
    south:
      to: tba:345:room:34503
  extras:
  - keywords: [plaque, sign]
    text:
      preformatted: |2
           {bright_yellow}
        {/bright_yellow}{yellow}
        **************************
        *    NEW YORK ASYLUM     *
        *                        *
        *        FOR THE         *
        *                        *
        *   CRIMINALLY INSANE    *
        ************************** {/yellow}
  - keywords: [iron, gate]
    text: >
      Made from heavy black iron, the left side of the gate is only hanging by the bottom hinge. A large
      mansion can be seen through the bars.

"tba:345:room:34503":
  name: A Broken Road
  description: >
    The road seems to be in disrepair here. It doesn't look like it gets much better to the north. To
    the south the road is so bad that its not usable. Your view to the east is blocked by a large vine
    covered wall.
  sector: city
  exits:
    north:
      to: tba:345:room:34502
    east:
      look: Your view is obstructed by a high wall.
  extras:
  - keywords: [brick, wall']
    text: >
      The wall is made of a crumbling red brick. Vines cover the bottom half of it and reach upwards.
      Lining the top of the wall are decorative black iron bars, to keep people out, or perhaps in.

"tba:345:room:34504":
  name: Inside the Gate
  description: >
    All about are the signs that this property is unused. To the west an iron gate hangs slightly. To
    the north and south overgrown bushes and tall grass seem to harbor unknown secrets. To the east a dirt
    road leads to do an old abandoned building, shrouded in a fog.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:345:room:34505
    west:
      to: tba:345:room:34502
      look: >
        Made from heavy black iron, the right side of the gate is only hanging by the bottom hinge. A
        crumbling old road can be seen through the bars.
      door:
        keywords: [gate, west]
        kind: door
        reset: closed
  extras:
  - keywords: [iron, gate]
    text: >
      Made from heavy black iron, the right side of the gate is only hanging by the bottom hinge. A
      crumbling old road can be seen through the bars.

"tba:345:room:34505":
  name: Before the Sanatorium
  description: >
    The dirt driveway coninutes east to the building and west towards the gates and saftey. A small
    over-grown path that leads to south, but its unclear where it heads. There is an unnatural fog in the
    air, making seeing very far difficult.
  sector: field
  exits:
    east:
      to: tba:345:room:34506
    south:
      to: tba:345:room:34507
    west:
      to: tba:345:room:34504
  triggers: [tba:345:trg:34508]

"tba:345:room:34506":
  name: At the Doors
  description: >
    An imposing building dominates the view. The brick walls showing signs of their age. While not yet
    falling out, it looks as if a strong wind could collapse the whole wall. To the south there appears
    to be headstones, with someone moving in among them... Or it could just be the swirling fog playing
    tricks.
  sector: hills
  flags: [no_mob]
  exits:
    east:
      to: tba:345:room:34508
      look: A heavy iron reinforced oak door.
      door:
        keywords: [door, east]
        kind: pickproof
        key: tba:345:obj:34500
        reset: locked
    west:
      to: tba:345:room:34505

"tba:345:room:34507":
  name: A Well Worn Path
  description: >
    The fog turns and swirls here, creating shapes and images of a most horrific nature. A black
    wrought iron fence with a gate leads to a path to the south. Northeast is a large building in disrepair.
    Faintly to west, you can make out a high wall.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:345:room:34505
    south:
      to: tba:345:room:34509
      look: A black wrought iron gate, hanging slightly off its hinges.
      door:
        keywords: [gate, south]
        kind: door
        reset: closed
  extras:
  - keywords: [wall]
    text: It is very hard to see from here.
  - keywords: [gate]
    text: A black wrought iron gate, hanging slightly from its hinges.

"tba:345:room:34508":
  name: Entrance to the Asylum
  description: >
    The is the entrance way to asylum. At one point in time it may have been grand, but now everything
    is covered in dust and cob webs. It appears that some animals have made a home here as well. There is
    a reception area at the northern end of the room with an old sign next to it telling the way to
    different sections of the compound.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:345:room:34520
    east:
      to: tba:345:room:34519
    south:
      to: tba:345:room:34526
    west:
      to: tba:345:room:34506
      look: A heavy iron reinforced oak door.
      door:
        keywords: [door, west]
        kind: pickproof
        key: tba:345:obj:34500
        reset: locked
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           
        *********************************
        *       Doctor Offices          *
        *          Upstairs             *
        *                               *
        *        Patient Rooms          *
        *    To the North or South      *
        *                               *
        *       Procedure Rooms         *
        *         Downstairs            *
        *********************************
  triggers: [tba:345:trg:34510]

"tba:345:room:34509":
  name: Entrance to the Cemetery
  description: >
    Headstones can be seen from here, to the east. The fog swirls low around them. A few trees can be
    seen about, looking as depressed as the area around them. The path continues east into the cemetery
    and north past an iron gate.
  sector: inside
  exits:
    north:
      to: tba:345:room:34507
