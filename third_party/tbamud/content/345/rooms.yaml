"tba:345:room:34527":
  name: A Patient's Room
  description: >
    This room is sparse with only a cot hanging from the wall. The walls appear to have been all white
    at one time, thought time has seen to the chipping of the paint. The stench of human and animal waste
    fills the air. The only place to retreat is to the south
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:345:room:34520
      door:
        keywords: [door, south]
        kind: door
        reset: closed

"tba:345:room:34528":
  name: A Padded Room
  description: >
    This room is sparse with only a cot hanging from the wall. The walls are padded, but most of the
    stuffing has been removed or is hanging out of gaping holes. The body of what can only be assumed to be
    a patient is in one corner as if the person had just died yesterday.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:345:room:34521
      door:
        keywords: [door, south]
        kind: door

"tba:345:room:34529":
  name: Community Room
  description: >
    This room has a few old couchs and seats. A table sits at the northern end next to a broken out
    window. This room looks as if it might have been for visitions or as a community room for the patients.
    The walls use to be a bright yellow and show signs that pictures use to hang on them. The only exit
    is to the south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:345:room:34522

"tba:345:room:34530":
  name: Staff Room
  description: >
    There are a few desks and a long table here. Along the north wall is a bank of filing cabinets.
    While the staff may have all left their work area remains along with all the files of the patients.
    Paper litters the floor like a carpet. The only entrance or exit is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:345:room:34523

