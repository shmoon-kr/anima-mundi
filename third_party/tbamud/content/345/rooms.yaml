"tba:345:room:34552":
  name: A Secret Room
  description: >
    Unlike the rest of the building this room is in remarkable shape. There is blood red carpet on the
    floor and a few disturbing paintings on the walls. In the center of the room is wooden table. Even
    though this room is in good shape there is still an uneasy feeling. Maybe its from the low lighting.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:345:room:34537
  extras:
  - keywords: [table]
    text: >
      The table is about waist high and made from a rich mahogany. It has many dents and ding's in it
      from years of use. The most interesting thing about it is its lack of dust.
  - keywords: [paintings]
    text: >
      The paintings are of morbid landscapes or of hell it. They are both beautiful and disturbing. They
      are framed in thick mahogany.
