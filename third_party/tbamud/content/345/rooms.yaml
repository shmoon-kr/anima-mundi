  description: >
    This area is set up much like the Insulin shock treatment room to the west. There is a large bed
    with restraints. An electrical device sits behind it. At the top of the bed is an object that looks as
    if it is suppose to fit over the head of the patient. Funny... The piece of electrical equipment
    doesn't have any dust build up on it.
