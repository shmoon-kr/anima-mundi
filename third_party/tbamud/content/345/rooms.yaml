"tba:345:room:34546":
  name: Insulin Shock Room
  description: >
    The most dominate piece of equipment seen is a large bed with restraining straps. Next to it is a
    drip apparatus and a stainless steel work try on the other side of the bed. There is still a needle
    and syringe on the try. The visions of people convulsing and having seizures cross your vision for a
    brief moment.
  sector: inside
