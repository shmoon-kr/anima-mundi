"tba:345:room:34535":
  name: A Hallway
  description: >
    The most notable thing about this hallway is that there are still pictures hanging on the walls.
    They are worn and dusty but they seem like they might have been placed here after the asylum closed. To
    the east is a door.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:345:room:34536
      door:
        keywords: [door, east]
        kind: door
        reset: closed
    south:
      to: tba:345:room:34534
  extras:
  - keywords: [pictures]
    text: >
      The pictures are not anything special. They look to be past doctors that had worked here or perhaps
      ran the asylum.

"tba:345:room:34536":
  name: A Red Office
  description: >
    This room has the look and feel of a an office. Everything in here is red making it seem a little
    unnerving. Its a wonder why anyone would ever decorate an office in all the same color. There is an
    old wooden desk dominating the center of the room and a filing cabinet in one corner. The only exit is
    to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:345:room:34535
      door:
        keywords: [door, west]
        kind: door
        reset: closed

"tba:345:room:34537":
  name: A Green Office
  description: >
    This room has the look of a an office. The over all color is green. Everything about this room
    seems to reflect that from the carpet to the window curtains to other varies odds and ends that adorn the
    room. There is an old wooden desk dominating the center of the room and a filing cabinet in one
    corner. On the desk is some yellowed paper. Against one wall is a book case that still has a few books on
    it. The only exit is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:345:room:34534
      door:
        keywords: [door, west]
        kind: door
        reset: closed
  extras:
  - keywords: [bookcase]
    text: >
      Old and dusty like the rest of the room the book case only house a few books now. Interestingly
      enough they are all by or about the same person... Edgar Allen Poe. What an curious thing that is.
  - keywords: [paper]
    text: >
      The paper, yellowed with age, has only one simple line on it: If one is seeking true enlightenment,
      one must first learn the correct words.

"tba:345:room:34538":
  name: A Hallway
  description: >
    The most notable thing about this hallway is that there are still pictures hanging on the walls.
    They are worn and dusty but they seem like they might have been placed here after the asylum closed. To
    the east is a door.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:345:room:34534
    east:
      to: tba:345:room:34539
      door:
        keywords: [door, east]
        kind: door
        reset: closed
  extras:
  - keywords: [pictures]
    text: >
      The pictures are not anything special. They look to be past doctors that had worked here or perhaps
      ran the asylum.

"tba:345:room:34539":
  name: A Purple Office
  description: >
    This room has the look and feel of a an office. Everything in here is purple from the carpet to the
    wall coverings. It gives the room a dark and depressing feeling. There is an old wooden desk
    dominating the center of the room and a filing cabinet in one corner. The only exit is to the west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:345:room:34538
      door:
        keywords: [door, west]
        kind: door
        reset: closed
  triggers: [tba:345:trg:34510]

"tba:345:room:34540":
  name: In the Basement
  description: >
    This is a dark musty place. Old hospital beds and other equipment line the walls. The lights
    flicker every now and then, throwing shadows along the wall. The faint sounds of screams can be heard but
    its difficult to tell from what direction. From here you can go up to the courtyard or continue you
    along to the north or east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:345:room:34541
    east:
      to: tba:345:room:34551
    up:
      to: tba:345:room:34519

"tba:345:room:34541":
  name: A Crumbling Hallway
  description: >
    This is just one of the many hallways that make up this maze called a basement. Old rusted pipes
    and wires can be seen running above into the dark ahead of you. Lining the walls are all sorts of
    equipment. One thing that catches the eyes is a rack with some straight jackets in it, dirty and tan from
    years of use and storage.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:345:room:34540
    west:
      to: tba:345:room:34542

