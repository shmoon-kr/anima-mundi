  description: >
    The first sight of this room assaults the eyes. In the center is a large table with a light hanging
    over head. The tile walls and floor are covered in blood, some of which looks recent. The smell of
    death is heavy in the air here. The only way to escape this room is to the north and west.
  sector: inside
  flags: [indoors]
  exits:
