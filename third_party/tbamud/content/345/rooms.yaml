"tba:345:room:34534":
  name: Second Floor Landing
  description: >
    The landing on the second level, while still as dark as the ground level, seems to be in better
    upkeep. Strange since no one is suppose to be living or working in the building. This area looks as if
    it was kept up better and looks nicer than the rest of the building. There is a room to the east and a
    hallway that runs from north to south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:345:room:34535
    east:
      to: tba:345:room:34537
      door:
