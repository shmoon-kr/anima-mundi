"tba:345:room:34519":
  name: A Courtyard
  description: >
    The courtyard is overgrown with weeds just like the grounds outside. There once was a glass dome
    covering the open space, but that has since been broken exposing the it to the elements. To the north,
    south, east, and west are entry ways into the main building. There are benches, in various states of
    disrepair, scattered throughout the space.
