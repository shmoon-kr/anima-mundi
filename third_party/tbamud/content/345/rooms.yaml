    text: A black wrought iron gate, hanging slightly from its hinges.
  triggers: [tba:345:trg:34508]

"tba:345:room:34510":
  name: Among Crumbled Stone
  description: >
    In amongst the headstones and tombs, the fog swirls creating the illusion that there are creatures
