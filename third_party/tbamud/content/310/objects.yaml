  short: a hastily scrawled note
  long: A hastily scrawled note lies here.
  wear: [take]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 1
  rent: 0
  level: 0
  extras:
  - keywords: [note, hastily, scrawled]
    text:
    - "The note reads:"
    - >
      Thank you kind adventurer!  I heard the sound's of your battle with Scrytin, and while he was
      distracted I was able to cast a powerful spell.  You will find a magical key on the ground here, disguised
      as a rock, and you will also find that I have magically formed an exit back to my study from here. 
      The key will unlock some secret floorboards, and what you find under there will be your reward.  I
      must stay here and help my countrymen from their chains.  Thank You for what you have done.
    - Signed,
    - King Relnar

