"tba:310:room:31020":
  name: The Cliff Wall
  description: >
    You inch your way upwards, hand over hand, searching out more footholds. Sweat stings your eyes,
    and your breathing becomes ragged.  You can still drop safely to the forest floor, or madly continue
    upwards.
  sector: mountains
  exits:
    up:
      to: tba:310:room:31021
    down:
      to: tba:310:room:31017

"tba:310:room:31021":
  name: The Overhang
  description: >
    You progress upwards is stopped by what appears to be an overhang.  It would be a nice place to
    stop an rest..  If you weren't underneath it.  You glance around for an alternate path..
  sector: mountains
  exits:
    east:
      to: tba:310:room:31022
    down:
      to: tba:310:room:31020

"tba:310:room:31022":
  name: Hanging By a Thread
  description: >
    As you reach for your next handhold, the rock comes loose and tumbles down, down, down to the
    ground.  You barely manage to save yourself by clinging desperately to the rock face with your other
    hand.  Returning back west is out of the question, but you might be able to pull yourself upwards onto a
    very thin ledge.
  sector: mountains
  exits:
    up:
      to: tba:310:room:31023
  extras:
  - keywords: [ledge, thin]
    text: The ledge is very narrow, perhaps two feet at it's widest part.

"tba:310:room:31023":
  name: The Thin Ledge
  description: >
    You are standing on a very thin ledge, just wide enough for your feet to stand on it widthwise. 
    The ledge widens to the west and east.
  sector: mountains
  exits:
    east:
      to: tba:310:room:31025
      look: The rocks look kinda unstable over there.
    west:
      to: tba:310:room:31024
      look: The ledge widens considerably over there.
    down:
      to: tba:310:room:31025
      look: I wouldn't try it...

"tba:310:room:31024":
  name: The Ledge
  description: >
    You find yourself on a very wide ledge.  You could stretch out here and take a nap if you wanted
    too.  To the south you get a fantastic view of the entire forest.  There is perhaps another forty feet
    to the top of the cliff, all of which appears to be an easy climb.
  sector: mountains
  exits:
    east:
      to: tba:310:room:31023
    up:
      to: tba:310:room:31026

"tba:310:room:31025":
  name: Oops.
  description: >
    "Aaarrrggg!  ", you scream as you plummet toward the earth.  The ground rushes up at you at a
    dizzying pace, and you prepare for impact.  Suddenly, there is a flash of blinding light, and you feel
    yourself floating in white light.  You notice a glint in Aten's eye.  "Your time has not yet come..  ",
    he utters.
  sector: inside

"tba:310:room:31026":
  name: Top of the Cliff
  description: >
    You reach the top of the cliff and struggle to your feet.  You spend several moments just turning
    around, taking in all that you see.  To the south and east you see the forest sweeping outwards from
    the cliff wall, and to the north you see a clearing surrounding a small town.
  sector: field
  exits:
    north:
      to: tba:310:room:31028
    down:
      to: tba:310:room:31024

"tba:310:room:31027":
  name: The Clearing
  description: >
