"tba:310:room:31037":
  name: The City Street
  description: >
    Simple houses line both sides of the street, and guards are posted at every junction.  There is a
    castle to the north, and more streets to the east and west.  There is a large sign posted on a wall
    here.
  sector: city
  exits:
    north:
      to: tba:310:room:31041
      look: You see the castle.
    east:
      to: tba:310:room:31039
    west:
      to: tba:310:room:31038
  extras:
  - keywords: [sign, large]
    text:
    - "There is a sign posted here, it says:"
    - >
      ATTENTION CITIZENS OF GRAYE! Due to the demons beseiging our city, their night-time raids, and
      their recent kidnapping of King Relnar, we ask all citizens to observe the 7 pm curfew!  Those out on the
      streets after dark run the risk of being mistaken for the enemy and killed! signed, The Graye Guard

"tba:310:room:31038":
  name: The City Streets
  description: >
    Small houses line both sides of the street, and armed guards are posted at every junction.  You see
    a small poster pasted to the wall here.
  sector: city
  exits:
    east:
      to: tba:310:room:31037
  extras:
  - keywords: [poster, small]
    text: >
      The poster reads: Great rewards will be given to anyone who can rescue the benevolent King Relnar.

"tba:310:room:31039":
  name: The City Streets
  description: >
    Small houses line both sides of the street, and armed guards are posted at every junction.
  sector: city
  exits:
    west:
      to: tba:310:room:31037

"tba:310:room:31040":
  name: Inside the Castle
  description: >
    Everything here is a mess.  Furniture has been overturned, paintings slashed, even the gold inlaid
    tiles have been torn up.
  sector: city
  exits:
    east:
      to: tba:310:room:31041

"tba:310:room:31041":
  name: Entrance to Relnar's Castle
  description: >
    You stand before the ajar gate of the castle.  You here complete silence from inside.  City life
    continues to bustle around you.
  sector: city
  exits:
    north:
      to: tba:310:room:31044
    east:
      to: tba:310:room:31042
    south:
      to: tba:310:room:31037
    west:
      to: tba:310:room:31040

"tba:310:room:31042":
  name: Inside the Castle
