"tba:310:room:31060":
  name: The Catacombs
  description: >
    You walk along the passage, and notice the remains of all the previous kings of Graye are buried on
    either side of you.  You can see in the room, but there is no discernable source of light.  The
    passage continues on to the north and south.
  sector: inside
  exits:
