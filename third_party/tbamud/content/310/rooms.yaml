    tiles have been torn up.
  sector: inside
  exits:
    west:
      to: tba:310:room:31041

"tba:310:room:31043":
  name: Relnar's Study
  description: >
    As soon as you enter this room, you feel it.  A magical aura of goodness fills this room, and
    everything is in a neat and tidy condition.
  sector: inside
  exits:
    east:
      to: tba:310:room:31044
    down:
      to: tba:310:room:31059
      look: You see some loose floorboards.
      door:
        keywords: [floorboards, secret]
        kind: pickproof
        key: tba:310:obj:31023
        reset: locked

"tba:310:room:31044":
  name: The Throne Room
  description: King Relnar's throne sits here, empty.  There are rooms to the east and west.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:310:room:31045
    south:
      to: tba:310:room:31041
    west:
      to: tba:310:room:31043
    down:
      to: tba:310:room:31046
      look: Aha! a secret door!
      door:
        keywords: [secret]
        kind: pickproof
        key: tba:310:obj:31001
        reset: locked

"tba:310:room:31045":
  name: Rymat's Chamber
  description: >
    You find yourself in a small undecorated chamber.  There is a bed, desk, and finely crafted
    washbasin.
  sector: inside
  exits:
    west:
      to: tba:310:room:31044
  extras:
  - keywords: [bed]
    text: It is a tidy, well made bed.
  - keywords: [desk]
    text: It is a bare desk, no drawers or anything.
  - keywords: [basin, wash, washbasin]
    text: It is a very nice washbasin.

"tba:310:room:31046":
  name: The Tunnel
  description: >
    The tunnel has a bare dirt floor, and its sides are of rough-hewn rock. Magical torches are set in
    each side of the tunnel wall, providing light.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:310:room:31047
    up:
      to: tba:310:room:31044
      look: Aha! a secret door!
      door:
        keywords: [secret]
        kind: pickproof
        key: tba:310:obj:31001
        reset: locked
  extras:
  - keywords: [torch, torches, magical]
    text: They provide light with a soft magical glow.

"tba:310:room:31047":
  name: The Tunnel
  description: The tunnel begins to curve upwards.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:310:room:31048
    south:
      to: tba:310:room:31046

"tba:310:room:31048":
  name: Tunnel's End
  description: >
    You reach the end of the tunnel.  Just above you, sunlight peeks around the edge of a trapdoor.
  sector: inside
  flags: [no_mob]
  exits:
    south:
      to: tba:310:room:31047
    up:
      to: tba:310:room:31049
      look: It is a trapdoor, cleverly hidden.
      door:
        keywords: [door, trap, trapdoor]
        kind: pickproof
        key: tba:310:obj:31002
        reset: locked

"tba:310:room:31049":
  name: The Valley of Demons
  description: >
    You emerge from the tunnel, and take a look around you.  To the far south you can just barely see
    one of the castle's towers over the trees.  To the north, the land sloped downward, and thick, gnarled
    thorn trees prevent movement to the east or west.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:310:room:31050
    down:
      to: tba:310:room:31048
      look: It is a trapdoor, cleverly hidden.
      door:
        keywords: [door, trap, trapdoor]
        kind: pickproof
        key: tba:310:obj:31002
        reset: locked

"tba:310:room:31050":
  name: The Valley of Demons
  description: >
    You are heading deeper and deeper into a valley.  The walls climb up on either side of you, soon
    becoming nearly vertical.  Your path is slowed by thick choking vegetation grabbing your boots.  The
    path back to the south disappears in darkness, and your path continues to dip as you head to the north.
  sector: hills
  exits:
    north:
      to: tba:310:room:31051
    south:
      to: tba:310:room:31049

"tba:310:room:31051":
  name: The Valley Floor
  description: >
    You have reached the very bottom of the valley.  The hills climb steeply to the east and west.  A
    sudden gust of wind brings you the smell of sulphur from the north.
  sector: hills
  exits:
    north:
      to: tba:310:room:31052
    south:
      to: tba:310:room:31050

"tba:310:room:31052":
  name: The Rift
  description: >
    A great yawning rift breaks the earth's surface here.  Tendrils of smoke waft their way upwards,
    stinging your nose sharply.  You sense that a great evil is near.
  sector: hills
  exits:
    south:
      to: tba:310:room:31051
    down:
      to: tba:310:room:31053
      look: You can't see much..climable though.

"tba:310:room:31053":
  name: Inside the Rift
  description: >
    There is a ledge here, and a tunnel which leads into the earth.  Far below you, lava churns and
    bubbles.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:310:room:31054
    up:
      to: tba:310:room:31058
      look: I wouldn't try to climb that! What if you fell?!

"tba:310:room:31054":
  name: The Tunnel
  description: >
    The tunnel leads north and south, and to either side of you are great cells. Peeking in a smudged
    window, you see human prisoners, many of them wearing the uniform of the Graye Guard.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:310:room:31055
    south:
      to: tba:310:room:31053

"tba:310:room:31055":
  name: Irgon's Guard Room
  description: >
