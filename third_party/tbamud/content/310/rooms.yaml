"tba:310:room:31061":
  name: The Tomb of Graye
  description: >
    You enter a huge circular room.  A guilded gold coffin rests in the center atop at stone tablet. 
    Treasure is piled high against all the walls.  You have found the final resting place of the paladin
    knight Graye.
  sector: inside
  exits:
    south:
      to: tba:310:room:31060
  extras:
  - keywords: [coffin]
    text: The coffin holds the remains of Graye.  His gift to you is not within it.
  - keywords: [stone, tablet]
    text: It is a giant stone tablet supporting the coffin of Graye.
