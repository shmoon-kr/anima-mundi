# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 310.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:310:room:31000":
  name: Aten's Zone Description Room
  description:
  - >
    Graye Area Written March 1994 Graye consists of a forested area, a cliff to scale, a small wooded
    area around a town, a small town, a small castle, some underground passageways, and a bunch of
    mid-level mobs and eq.
  - >
    Enclosed is an area I wrote back in my mudding days; they are designed for circle code, but with
    some modifications can probably be integrated into whatever kind of mud you're running.
  - >
    These areas are FREE- however, if you use them: 1. Feel free to make whatever modifications you
    need, change mobs, objects, room descriptions etc.- but please make sure that signs and author
    references are unmodified and readable by players. 2. Please send me an e-mail message if you do use them, I'd
    just like to have some idea of where they end up (please include mud site)- my address is
    wjp@hopper.unh.edu until Sept 1996 3. If you redistribute these areas, please make sure this README file goes
    with them :)
  - Bill Pelletier wjp@hopper.unh.edu Aten/Talisman of GenericMUD
  sector: inside

"tba:310:room:31001":
  name: The attachment room
  description: This room can be used to attach this area to da mud.
  sector: inside

"tba:310:room:31002":
  name: The Great Field
  description: >
    You are standing in a great field of tall grass.  The smell of fresh dirt and sunlight surrounds
    you.  The air is filled with the sound of chirping birds happily building their nests in the depths of
    the knotted grass.  A wagon trail runs in an east-south direction.
  sector: field
  exits:
    west:
      to: tba:310:room:31003

"tba:310:room:31003":
  name: The Forest's Edge
  description: >
    The grassland fades to spotted scrub here, and finally merges into a great line of trees.  To the
    far north a stormcloud hangs in the air ominously, but strangely enough it is still quite pleasant
    out.  Crickets chirp merrily, and the sun's rays warm your skin.  The wagon trail leads eastwards back
    into the grassland, and dissapears westwards into the forest.
  sector: forest
  exits:
    east:
      to: tba:310:room:31002
    west:
      to: tba:310:room:31004

"tba:310:room:31004":
  name: Entrance to the Forest of Graye
  description: >
    The trail passes into the shade here, and the temperature drops quite suddenly.  Great broad leaf
    trees gather the descending sunlight, and cover the leaf-strewn forest floor with dappled sunlight. 
    The wagon trail becomes much wider here, showing signs of recent heavy use.  The wagon trail runs from
    west to east here, and it looks possible to venture into the forest to the north and south.
  sector: forest
  exits:
    north:
      to: tba:310:room:31006
    east:
      to: tba:310:room:31003
    south:
      to: tba:310:room:31007
    west:
      to: tba:310:room:31011

"tba:310:room:31005":
  name: The Forest of Graye
  description: You in a hardwood forest, walking through noisy leaves.
  sector: forest
  exits:
    south:
      to: tba:310:room:31006
    west:
      to: tba:310:room:31009

