# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 233.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:233:room:23300":
  name: Dragon Plains
  description: >
    A huge outstretch of sand is before you.  You notice a few scattered trees and plants that should
    have been dead long ago.  A lot of the leaves on the trees are missing.  They appear to have been torn
    off.  Several large foot prints linger in the sand.
  sector: field
  flags: [no_mob, no_magic]
  exits:
    east:
      to: tba:233:room:23301
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   :
        Zone         : 233 Dragon Plains
        Began        : 1998
        Player Level : 15-17
        Rooms        : 100
        Mobs         : 24
        Objects      : 28
        Shops        : 0
        Triggers     : 0
        Theme        :
        Plot         :
        Links        : 00
        Map          : 02

"tba:233:room:23301":
  name: Dragon Plains
  description: >
    As you continue walking through the dry plains, you feel your feet sinking into the sand, making it
    difficult for you to walk.  You can see a small stream to the south.  But is it really there, or is
    it a mirage?
  sector: field
  flags: [no_track]
  exits:
    east:
      to: tba:233:room:23303
    south:
      to: tba:233:room:23302
    west:
      to: tba:233:room:23300

"tba:233:room:23302":
  name: A Small Stream
  description: >
    You have come to a small stream filled with crystal blue water.  You look into the water and see
    several small pebbles drifting through the current of the stream.  You look ahead to see where the
    stream ends, and notice that it disappears into the ground.
  sector: water_noswim
  flags: [tunnel]
  exits:
    north:
      to: tba:233:room:23301

"tba:233:room:23303":
  name: Dragon Plains
  description: >
    You hear a few twigs crunch under your feet.  You look down just in time to see the sand swallow
    the wood.  There is a slight incline here, causing some drifts of sand to roll across your feet.  You
    feel the wind pick up as you continue on your way.
  sector: field
  exits:
    north:
      to: tba:233:room:23304
    east:
      to: tba:233:room:23305
    west:
      to: tba:233:room:23301

"tba:233:room:23304":
  name: A Huge Footprint
  description: >
    You have stepped inside the footprint of a very large creature!  You see sand begin to fill in the
    large hole, threatening to trap you inside.  The sides of the huge hole are sturdy enough to climb
    out of, but you'd better hurry before you get burried alive.
  sector: field
  flags: [no_track]
  exits:
    south:
      to: tba:233:room:23303

"tba:233:room:23305":
  name: Sand Drift
  description: >
    You find yourself standing on a small sand drift.  It's almost as big as a hill, but not as steep. 
    Some dried up leaves lay at your feet, waiting to be blown away in the wind.  You hear some birds
    singing in the distance.
  sector: field
  flags: [no_mob]
  exits:
    east:
      to: tba:233:room:23307
    south:
      to: tba:233:room:23306
    west:
      to: tba:233:room:23303

"tba:233:room:23306":
  name: Dragon Plains
  description: >
    Sand dances around before you, almost hypnotizing you.  You feel some grains blow through your
    hair, making your head tingle with relaxation.  There is a large tumbleweed being blown around by the
    breeze.
  sector: field
  exits:
    north:
      to: tba:233:room:23305
    south:
      to: tba:233:room:23308

"tba:233:room:23307":
  name: Dragon Plains
  description: >
    You feel a light mist of sand hit your face.  You close your eyes, shielding yourself from the
    flying grains.  You notice some small footprints in the sand. They are much too small to be ones of a
    dragon.  What could they be from?
  sector: field
  flags: [no_magic]
  exits:
    east:
      to: tba:233:room:23310
    west:
      to: tba:233:room:23305

"tba:233:room:23308":
  name: Skeleton Shack
  description: >
    You have come to a small shack made from bones of several creatures that are long dead.  The smell
    of decay fills your nostrils, almost making you gag.  A light covering of animal skin is on the the
    roof to help keep the rain out.
  sector: field
  exits:
    north:
      to: tba:233:room:23306
    east:
      to: tba:233:room:23309

"tba:233:room:23309":
  name: Skeleton Shack
  description: >
    As you enter the horrid smelling shack, you look at your surroundings. There is not much here to
    look at.  Just some broken furniture and scattered bones laying about the floor.  There are no windows,
    just beams of light creeping in through the cracks between the bones.
  sector: inside
  flags: [no_track, tunnel]
  exits:
    west:
      to: tba:233:room:23308

"tba:233:room:23310":
  name: An Abandoned Well
  description: >
    An old rusted up well stands before you.  There is no possible way that you could get any water out
    of here, not that anyone would want to.  The bottom of the well is crawling with large black
    beetles.  Watch out, one might escape!
  sector: field
  exits:
    east:
      to: tba:233:room:23311
    west:
      to: tba:233:room:23307

"tba:233:room:23311":
  name: Dragonscale Tunnel
  description: >
    You have entered a straight tunnel made from the scales of a dragon.  The tunnel holds in a lot of
    heat, making it difficult for you to breathe.  The tunnel continues to the east.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:233:room:23312
    west:
      to: tba:233:room:23310

"tba:233:room:23312":
  name: Dragonscale Tunnel
  description: >
    As you step further into the tunnel, the smell of mildew fills your lungs. The stench almost knocks
    you over.  You look down at your feet and notice that you are walking on hollowed out skulls.  They
    crunch and crackle under your weight.
  sector: inside
  exits:
    east:
      to: tba:233:room:23313
    west:
      to: tba:233:room:23311

"tba:233:room:23313":
  name: Dragonscale Tunnel
  description: >
    The feeling of death creeps over you as you continue walking on the skull path through the hot,
    sticky tunnel.  Sweat begins to drip off your face.  A tall glass of water would be great right about
    now.
  sector: inside
  exits:
    east:
      to: tba:233:room:23314
    west:
      to: tba:233:room:23312

"tba:233:room:23314":
  name: Dragonscale Tunnel
  description: >
    As you continue walking, horrible images fill your mind.  You look around at all the bones around
    you and you begin to wonder how all these creatures died, and if any of them were human.  The tunnel
    continues to the east.
  sector: inside
  exits:
    east:
      to: tba:233:room:23315
    west:
      to: tba:233:room:23313

"tba:233:room:23315":
  name: Dragonscale Tunnel
  description: >
    You can see the end of the tunnel just up ahead to the east.  You feel a bit relieved as you feel
    the temperature begin to drop, and you are able to breathe once again.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:233:room:23316
    west:
      to: tba:233:room:23314

"tba:233:room:23316":
  name: Dragonscale Tunnel
  description: >
    You have reached the end of the tunnel.  Feeling a bit overwhelmed, you stumble out of the tunnel
    and fall onto the sand.  You feel your body begin to sink into the sand.  Struggling would do you no
    good.
  sector: field
  exits:
    south:
      to: tba:233:room:23317
    west:
      to: tba:233:room:23315

"tba:233:room:23317":
  name: Sand Warp
  description: >
    You begin to feel your body falling through the sand.  Numerous sticks scratch at you, leaving
    swelling marks on your skin.  Grains of sand slip through your fingers, giving you nothing to hold on to.
  sector: inside
  flags: [no_track, tunnel]
  exits:
    north:
      to: tba:233:room:23316
    south:
      to: tba:233:room:23318

"tba:233:room:23318":
  name: Sand Warp
  description: >
    As your helpless body continues to fall, images of death scream through your mind.  You begin to
    wonder whats at the end of the sand warp.  Dust from the sand fills your lungs, almost choking you.
  sector: inside
  exits:
    north:
      to: tba:233:room:23317
    south:
      to: tba:233:room:23319

"tba:233:room:23319":
  name: Sand Warp
  description: >
    You're falling through the air at a tremendous speed.  All of a sudden you begin to slow down.  You
    feel yourself hit a hard metal floor.  A very loud banging sound echos throughout the room.  Where
    could you have gone?
  sector: inside
  exits:
    north:
      to: tba:233:room:23318
    west:
      to: tba:233:room:23320

"tba:233:room:23320":
  name: Dragon Cave
  description: >
    As you stand up and brush layers of sand off yourself, you look around at your surroundings.  You
    appear to be in some sort of cave.  You'd better be careful.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:233:room:23319
    west:
      to: tba:233:room:23321

"tba:233:room:23321":
  name: Dragon Cave
  description: >
    Several small lights have been attatched to the cold stone walls, enabling you to see.  The floor
    at your feet is damp, making you feel cold.  You begin to feel that you're not alone.
  sector: inside
  exits:
    east:
      to: tba:233:room:23320
    south:
      to: tba:233:room:23322

"tba:233:room:23322":
  name: Dragon Cave
  description: >
    As you continue making your way through the cave, you begin hearing scratching noises coming from a
    narrow tunnel in the ceiling.  Several images pass through your mind as you wonder whats causing the
    loud scratching sound.
  sector: inside
  flags: [no_magic]
  exits:
    north:
      to: tba:233:room:23321
    west:
      to: tba:233:room:23323

"tba:233:room:23323":
  name: Dragon Cave
  description: >
    An enormous nest of spiders blocks your way!  They cover the ceiling and walls.  As you look up at
    the tunnel you se more spiders entering the cave. Maybe you'd better turn back while you still can.
  sector: inside
  exits:
    east:
      to: tba:233:room:23322
    south:
      to: tba:233:room:23324

"tba:233:room:23324":
  name: Dragon Cave
  description: >
    One getting past the nest, you breathe a sigh of relief.  That was a close call.  Maybe it would be
    wise to turn around and leave before you get killed. Only the bravest of adventurers dare go on from
    here.
  sector: inside
  flags: [tunnel]
  exits:
    north:
      to: tba:233:room:23323
    south:
      to: tba:233:room:23325

"tba:233:room:23325":
  name: Dragon Cave
  description: >
    The light before you slowly starts to fade.  Your shadow dances on the wall around you, making you
    look somewhat deformed.  You hear a soft ticking noise to the south.
  sector: inside
  exits:
    north:
      to: tba:233:room:23324
    south:
      to: tba:233:room:23326

"tba:233:room:23326":
  name: Dragon Cave
  description: >
    As the ticking noise gets louder, you being searching for an exit out the cave.  Maybe you
    shouldn't have come here.  A cold chill rushes down your back, almost paralyzing you.
  sector: inside
  exits:
    north:
      to: tba:233:room:23325
    west:
      to: tba:233:room:23327

"tba:233:room:23327":
  name: Dragon Cave
  description: >
    You're standing on the bottom of an old crumbling staircase.  There isn't much light here, so be
    careful.  The stairs lead up into the darkness.  Who knows whats lurking up there, waiting to attack
    you.
  sector: inside
  exits:
    north:
      to: tba:233:room:23328
    east:
      to: tba:233:room:23326

"tba:233:room:23328":
  name: Crumbling Staircase
  description: >
    You begin walking up the crumbling staircase.  Theres an old rotted railing here, but it most
    likely wouldn't support your weight.  Everything around you suddenly goes quiet.  Maybe too quiet.
  sector: inside
  exits:
    south:
      to: tba:233:room:23327
    west:
      to: tba:233:room:23329

"tba:233:room:23329":
  name: Crumbling Staircase
  description: >
    Flickering lights dance over the walls all around you, making you feel like you're in a dream.  The
    soft ticking noise that once left has returned.  The ticking sound fills your ears.  A strange
    coldness comes over your body.
  sector: inside
  exits:
    north:
      to: tba:233:room:23330
    east:
      to: tba:233:room:23328

"tba:233:room:23330":
  name: An Empty Room
  description: >
    As you reach the top of the stairs, you look around to find yourself in a small room.  Several
    inches of sand covers the ground, making the room very dusty.  You see a small beam of light coming from
    a narrow hole in the floor. It may be big enough for you to fall through.  Watch your step.
  sector: inside
  flags: [no_track]
  exits:
    south:
      to: tba:233:room:23329
    west:
      to: tba:233:room:23331

"tba:233:room:23331":
  name: A Hole
  description: >
    Oops!  You obviously weren't watching where you were going.  You have fallen into the hole!  Shards
    of wood poke at your sides, causing you to freeze in pain.  A large cloud of dust looms over your
    head.
  sector: inside
  exits:
    east:
      to: tba:233:room:23330
    west:
      to: tba:233:room:23332

"tba:233:room:23332":
  name: A Hole
  description: >
    You stand up, struggling to get out of the hole.  You're able to grab onto a large board and pull
    yourself out.  Maybe from now on you'll pay closer attention to where you're walking.
  sector: inside
  flags: [tunnel]
  exits:
    east:
      to: tba:233:room:23331
    south:
      to: tba:233:room:23333

"tba:233:room:23333":
  name: Secret Passage
  description: >
    You found a secret passageway tucked into a wall.  You push on the door, allowing it to open.  You
    see a narrow set of wooden steps leading downwards. You wonder where they go.  Theres only one way to
    find out.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:233:room:23332
    south:
      to: tba:233:room:23334

"tba:233:room:23334":
  name: Secret Passage
  description: >
    You begin decending down the rickety stairs, hoping you don't fall through some of the rotted
    wood.  You can see your breath in front of you, but for some odd reason, the air doesnt feel the slightest
    bit cold.
  sector: inside
  exits:
    north:
      to: tba:233:room:23333
    west:
      to: tba:233:room:23335

"tba:233:room:23335":
  name: Secret Passage
  description: >
    As you step off the last step, you look around at your surroundings. Everything is covered in a
    thick layer of dust.  You see a broken table stashed away under the stairs.  The only things its good
    for now is the fire.  There is a small walkway to the west.
  sector: inside
  exits:
    east:
      to: tba:233:room:23334
    west:
      to: tba:233:room:23336

"tba:233:room:23336":
  name: A Narrow Walkway
  description: >
    The walkway is just barely big enough for one person to squeeze through. As you push yourself
    through the narrow opening, a small pile of dust falls into your hair and around your face, making you
    sneeze.  You seem to have entered a long hallway, but where does it lead?
  sector: inside
  exits:
    east:
      to: tba:233:room:23335
    west:
      to: tba:233:room:23337

"tba:233:room:23337":
  name: Hall of Lost Souls
  description: >
    As you step into the hallway, a weird feeling takes over your body.  You are suddenly frozen in
    terror as your ears are filled with screams.  Just ahead of you, you begin to see an apparition appear. 
    You can see right through it. Maybe you are imagining its presence.
  sector: inside
  exits:
    east:
      to: tba:233:room:23336
    south:
      to: tba:233:room:23338

"tba:233:room:23338":
  name: Hall of Lost Souls
  description: >
    Several images fill your mind.  You begin to wonder where all the screaming is coming from, or if
    its really even there.  You can hear the echo of your footsteps ricochetting down the long hallway.
  sector: inside
  exits:
    north:
      to: tba:233:room:23337
    south:
      to: tba:233:room:23339

"tba:233:room:23339":
  name: Hall of Lost Souls
  description: >
    As you step down into the hard floor, you hear a splashing sound.  You look down and see that you
    are standing in a puddle, but it doesn't look like water. It almost looks like blood.  You suddenly
    feel disgusted.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:233:room:23338
    south:
      to: tba:233:room:23340

"tba:233:room:23340":
  name: Hall of Lost Souls
  description: >
    You sense that the hall will soon come to an end.  The thick dark puddle remains on the floor,
    sticking to your feet.  You pick up the pace and start walking a little faster, in a hurry the leave this
    horrid place.
  sector: inside
  exits:
    north:
      to: tba:233:room:23339
    south:
      to: tba:233:room:23341

"tba:233:room:23341":
  name: Hall of Lost Souls
  description: >
    As you had expected, the hall comes to an end here.  You stand at yet another stairway leading
    down.  As you look down the stairs, you see some torches attached to the wall.  A few of them look about
    ready to burn out.
  sector: inside
  exits:
    north:
      to: tba:233:room:23340
    east:
      to: tba:233:room:23342

"tba:233:room:23342":
  name: A Darkened Stairwell
  description: >
    A feeling of lonliness comes over you as you walk down the steps.  There is nothing for you to hold
    onto if the stairs decided to give way.  There are several cobwebs above you, some getting into your
    hair.  The stairs moan under your weight.  You'd better move a little faster unless you want to fall
    to your death.
  sector: inside
  exits:
    south:
      to: tba:233:room:23343
    west:
      to: tba:233:room:23341

"tba:233:room:23343":
  name: A Darkened Stairwell
  description: >
    A feeling of lonliness comes over you as you walk down the steps.  There is nothing for you to hold
    onto if the stairs decided to give way.  There are several cobwebs above you, some getting into your
    hair.  The stairs moan under your weight.  You'd better move a little faster unless you want to fall
    to your death.
  sector: inside
  exits:
    north:
      to: tba:233:room:23342
    south:
      to: tba:233:room:23344

"tba:233:room:23344":
  name: A Darkened Stairwell
  description: >
    As you continue walking down the stairs, you begin feeling the temperature drop.  You can see your
    breath in front of you, then watch it disappear into the darkness.  You begin to wonder if you're all
    alone in here.
  sector: inside
  flags: [no_track, tunnel]
  exits:
    north:
      to: tba:233:room:23343
    east:
      to: tba:233:room:23345

"tba:233:room:23345":
  name: A Darkened Stairwell
  description: >
    As you get closer to the bottom of the stairs you notice there is a large gap in the stairwell. 
    You might be able to jump across it, but if for some reason you don't make the jump, you might not
    survive to try again.
  sector: inside
  flags: [no_track]
  exits:
    east:
      to: tba:233:room:23346
    west:
      to: tba:233:room:23344

"tba:233:room:23346":
  name: A Darkened Stairwell
  description: >
    As you get closer to the bottom of the stairs you notice there is a large gap in the stairwell. 
    You might be able to jump across it, but if for some reason you don't make the jump, you might not
    survive to try again.
  sector: inside
  exits:
    east:
      to: tba:233:room:23347
    west:
      to: tba:233:room:23345

"tba:233:room:23347":
  name: A Hole in the Stairs
  description: >
    You have come to a large hole in the stairwell.  There seems to be atleast six steps missing.  You
    look into the hole, but see the darkness that awaits your arrival.  You take a deep breath and get
    ready for the jump.
  sector: inside
  exits:
    east:
      to: tba:233:room:23348
    west:
      to: tba:233:room:23346

"tba:233:room:23348":
  name: A Hole in the Stairs
  description: >
    As you begin feeling yourself flying through the air, you keep your eyes on the bottom section of
    the stairs.  They are slowly coming closer to you. Maybe you'll make the jump after all!
  sector: inside
  exits:
    east:
      to: tba:233:room:23349
    west:
      to: tba:233:room:23347

"tba:233:room:23349":
  name: A Hole in the Stairs
  description: >
    You feel your body crash onto the first step that comes into view.  Your legs fall from the
    stairwell and hang in the emptiness below you.  You feel your heart pounding in your chest as you struggle
    to pull yourself up.  The step your holding onto begins to move!
  sector: inside
  exits:
    east:
      to: tba:233:room:23351
    south:
      to: tba:233:room:23350
    west:
      to: tba:233:room:23348

"tba:233:room:23350":
  name: Darkness
  description: >
    You feel your fingers slipping away from the board as your helpless body begins falling through the
    air.  You are too frozen by terror to scream.  Is this the end?
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:233:room:23349
    south:
      to: tba:233:room:23352

"tba:233:room:23351":
  name: A Darkened Stairwell
  description: >
    You made the jump!  Your head spins, making you feel quite dizzy.  Maybe it would be wise to sit
    here for a moment and rest.  A strange noise fills the room as if a swarm of insects is nearby.
  sector: inside
  exits:
    east:
      to: tba:233:room:23353
    west:
      to: tba:233:room:23349

"tba:233:room:23352":
  name: Darkness
  description: >
    You continue falling through the air, but you seem to be slowing down.  A bunch of cobwebs surround
    you, almost swallowing you.  A light suddenly comes on, showing you your surroundings.  The walls
    around you are made from skeletons.  Not just humans, but creatures as well.  You begin feeling sick to
    your stomach, wishing you never would have come here.
  sector: inside
  exits:
    north:
      to: tba:233:room:23350
    west:
      to: tba:233:room:23355

"tba:233:room:23353":
  name: A Large Empty Room
  description: >
    As you take your last step off the stairwell you find yourself standing in a large empty room with
    nothing inside of it.  You scratch your head in confusion, wondering why you havent seen anyone else
    around.
  sector: inside
  exits:
    north:
      to: tba:233:room:23354
    west:
      to: tba:233:room:23351

"tba:233:room:23354":
  name: A Large Empty Room
  description: >
    You walk deeper into the room, looking for any sign of life.  You see nothing but dust.  It's
    remarkable how large this room is.  You see a small walkway to the east.
  sector: inside
  exits:
    north:
      to: tba:233:room:23357
    south:
      to: tba:233:room:23353

"tba:233:room:23355":
  name: Skeleton Tunnel
  description: >
    As your body is gently set onto the ground, you find yourself standing in a small skeleton tunnel. 
    Several lights shine through the empty eye sockets of the creatures that once were.  You take a deep
    breath and continue on your way.
  sector: inside
  exits:
    east:
      to: tba:233:room:23352
    west:
      to: tba:233:room:23356

"tba:233:room:23356":
  name: Skeleton Tunnel
  description: >
    Some small bones line the floor beneath you.  You hear them snap and crackle under your weight. 
    You begin to shiver from the cold.  Maybe if you could find a torch, you could use it to warm yourself
    up.
  sector: inside
  exits:
    east:
      to: tba:233:room:23355
    west:
      to: tba:233:room:23359

"tba:233:room:23357":
  name: A Large Empty Room
  description: >
    You walk deeper into the room, looking for any sign of life.  You see nothing but dust.  It's
    remarkable how large this room is.  You see a small walkway to the east.
  sector: inside
  exits:
    east:
      to: tba:233:room:23358
    south:
      to: tba:233:room:23354

"tba:233:room:23358":
  name: A Small Walkway
  description: >
    The walkway is very well lit.  You can see that it leads back out into the plains.  You suddenly
    feel relieved, knowing you made it out of the cave alive.
  sector: inside
  exits:
    east:
      to: tba:233:room:23360
    west:
      to: tba:233:room:23357

"tba:233:room:23359":
  name: Skeleton Tunnel
  description: >
    As you continue walking through the tunnel, you notice a small window. It's barely large enough for
    a small child to squeeze through.  The light of the day streams down into the tunnel, showing you
    more of whats ahead.
  sector: inside
  exits:
    east:
      to: tba:233:room:23356
    west:
      to: tba:233:room:23361

"tba:233:room:23360":
  name: A Small Walkway
  description: >
    The walkway is very well lit.  You can see that it leads back out into the plains.  You suddenly
    feel relieved, knowing you made it out of the cave alive.
  sector: inside
  exits:
    south:
      to: tba:233:room:23363
    west:
      to: tba:233:room:23358

"tba:233:room:23361":
  name: Skeleton Tunnel
  description: >
    Some small bones line the floor beneath you.  You hear them snap and crackle under your weight. 
    You begin to shiver from the cold.  Maybe if you could find a torch, you could use it to warm yourself
    up.
  sector: inside
  exits:
    east:
      to: tba:233:room:23359
    west:
      to: tba:233:room:23362

"tba:233:room:23362":
  name: Skeleton Tunnel
  description: >
    You have come to the end of the tunnel.  It was much shorter than you had expected it to be.  There
    is a small door way to the south.  It appears to be leading outside.
  sector: inside
  exits:
    east:
      to: tba:233:room:23361
    south:
      to: tba:233:room:23371

"tba:233:room:23363":
  name: Dragon Plains
  description: >
    You find yourself back in the plains.  Numerous sticks are scattered around in the dirt here. 
    There might be enough to gather and make a small fire.  It even looks as if other travellers have camped
    out here before.
  sector: field
  exits:
    north:
      to: tba:233:room:23356
    south:
      to: tba:233:room:23360

"tba:233:room:23364":
  name: Dragon Plains
  description: >
    Miles of sand stretch out before you.  You see several small trees that should have been dead long
    ago.  The land here is very dry and humid.  You begin to wonder how anything could possibly grow here.
  sector: field
  flags: [no_magic]
  exits:
    north:
      to: tba:233:room:23363
    south:
      to: tba:233:room:23365

"tba:233:room:23365":
  name: Dragon Plains
  description: >
    Miles of sand stretch out before you.  You see several small trees that should have been dead long
    ago.  The land here is very dry and humid.  You begin to wonder how anything could possibly grow here.
  sector: field
  exits:
    north:
      to: tba:233:room:23364
    south:
      to: tba:233:room:23366

"tba:233:room:23366":
  name: Dragon Plains
  description: >
    Miles of sand stretch out before you.  You see several small trees that should have been dead long
    ago.  The land here is very dry and humid.  You begin to wonder how anything could possibly grow here.
  sector: field
  exits:
    north:
      to: tba:233:room:23365
    south:
      to: tba:233:room:23367

"tba:233:room:23367":
  name: Dragon Plains
  description: >
    Miles of sand stretch out before you.  You see several small trees that should have been dead long
    ago.  The land here is very dry and humid.  You begin to wonder how anything could possibly grow here.
  sector: field
  exits:
    north:
      to: tba:233:room:23366
    west:
      to: tba:233:room:23368

"tba:233:room:23368":
  name: Dragon Plains
  description: >
    The plains seems to stretch out forever.  You begin to wonder if the endless amounts of sand will
    ever cease.  You feel a small breeeze pick up, threatening to blow some sand in your eyes.
  sector: field
  exits:
    east:
      to: tba:233:room:23367
    west:
      to: tba:233:room:23369

"tba:233:room:23369":
  name: Sand Drift
  description: >
    You have stepped into a rather large drift of sand.  The pile comes up to your knees, making it
    very difficult for you to walk.  It will take a bit of a struggle to get free.
  sector: field
  exits:
    east:
      to: tba:233:room:23368
    south:
      to: tba:233:room:23370

"tba:233:room:23370":
  name: Sand Drift
  description: >
    You continue tredging through the rather large drift.  Inching along, you feel your legs begin to
    itch.  Your feet seem to be going deeper into the sand. How is that possible?
  sector: field
  exits:
    north:
      to: tba:233:room:23369
    west:
      to: tba:233:room:23377

"tba:233:room:23371":
  name: A Small Path
  description: >
    The path leads into a doorway that is almost completely buried in the sand. No tracks are visible
    along the beaten path and there is nothing but sand as far as the eye can see.
  sector: field
  exits:
    north:
      to: tba:233:room:23362
    south:
      to: tba:233:room:23372

"tba:233:room:23372":
  name: A Small Path
  description: >
    The path begins to narrow, making it difficult to keep your footing.  Maybe you would be better off
    walking through the sand.  The sand on both sides is very fine and makes strange sounds as you walk
    on it.
  sector: field
  exits:
    north:
      to: tba:233:room:23371
    east:
      to: tba:233:room:23373

"tba:233:room:23373":
  name: A Small Path
  description: >
    There are several sticks on the ground beneath your feet.  You hear many of them snapping and
    crunching under your weight.  Many of the sticks have large thorns that look dangerous.  Be careful not to
    fall.
  sector: field
  exits:
    east:
      to: tba:233:room:23374
    west:
      to: tba:233:room:23372

"tba:233:room:23374":
  name: A Small Path
  description: >
    You have come to a small path in the sand.  It doesn't appaear to lead anywhere special, but it
    sure beats walking through the sand.  The path is out of place amongst the sand dunes.
  sector: field
  exits:
    east:
      to: tba:233:room:23375
    west:
      to: tba:233:room:23373

"tba:233:room:23375":
  name: Dragon Plains
  description: >
    The sand seems to find its way into everything.  The small grains seem to vary in color and texture
    from almost white to a light brown.  Strange bits of scales seem to be intermixed.
  sector: field
  exits:
    east:
      to: tba:233:room:23376
    south:
      to: tba:233:room:23378
    west:
      to: tba:233:room:23374

"tba:233:room:23376":
  name: Sand Drift
  description: >
    As you make your way through the last of the drift, you lose your balance and fall to the ground. 
    Grains of sand get shoved into your teeth, making you feel sick to your stomach.  Maybe you should
    start watching where you're walking.
  sector: field
  exits:
    east:
      to: tba:233:room:23377
    west:
      to: tba:233:room:23375

"tba:233:room:23377":
  name: Sand Drift
  description: >
    You continue tredging through the rather large drift.  Inching along, you feel your legs begin to
    itch.  Your feet seem to be going deeper into the sand. How is that possible?
  sector: field
  exits:
    east:
      to: tba:233:room:23370
    west:
      to: tba:233:room:23376

"tba:233:room:23378":
  name: Dragon Plains
  description: >
    You decide to start heading in a new direction, in hopes to find other beings, like yourself,
    creeping around.  It would be easy to become lost or disoriented.
  sector: field
  exits:
    north:
      to: tba:233:room:23375
    south:
      to: tba:233:room:23379

"tba:233:room:23379":
  name: Dragon Plains
  description: >
    As you continue walking, you begin to see some sand lifting up from the ground, swirling around in
    the wind.  It appears to be almost dancing.  The rumors about dust devils may be true.
  sector: field
  exits:
    north:
      to: tba:233:room:23378
    west:
      to: tba:233:room:23381

"tba:233:room:23380":
  name: Dragon Plains
  description: >
    The sand feels squishy under your feet.  The heat seems to penetrate everything to its core.  The
    parched and dreary land is barren and scarred. It hardly seems able to support any life.
  sector: field
  exits:
    south:
      to: tba:233:room:23387

"tba:233:room:23381":
  name: Dragon Plains
  description: >
    As you continue walking through the plains, you look around at your surroundings.  To the west you
    can see some sort of burial ground.  Maybe you should go have a look.
  sector: field
  exits:
    east:
      to: tba:233:room:23379
    west:
      to: tba:233:room:23382

"tba:233:room:23382":
  name: Indian Burial Ground
  description: >
    You have entered an old indian burial ground.  You suddenly feel light headed and not quite
    yourself.  Many small pebbles are on the ground, marking grave sites.  Be careful not to step on one!
  sector: field
  exits:
    east:
      to: tba:233:room:23381
    west:
      to: tba:233:room:23383

"tba:233:room:23383":
  name: Indian Burial Ground
  description: >
    As you walk deeper into the grounds, you begin seeing several scattered bones lying around.  You
    wonder how they could have gotten here.  You begin looking around, then you see the reason.  Numerous
    footprints from several large dragons have been smashed into the dirt, crushing some of the graves.
  sector: field
  exits:
    east:
      to: tba:233:room:23382
    south:
      to: tba:233:room:23384

"tba:233:room:23384":
  name: Indian Burial Ground
  description: >
    You begin to feel like your no longer alone.  In the distance you can hear the thundering footsteps
    of a very large dragon.  Maybe it would be best to leave before you turn into someones lunch.
  sector: field
  exits:
    north:
      to: tba:233:room:23383
    east:
      to: tba:233:room:23385

"tba:233:room:23385":
  name: Indian Burial Ground
  description: >
    You are coming towards the exit of the burial grounds.  You begin to wonder where all the dragons
    are.  The exit is coming up to the east.  Strange piers and poles stick up out of the ground in the
    distance.
  sector: field
  exits:
    east:
      to: tba:233:room:23386
    west:
      to: tba:233:room:23384

"tba:233:room:23386":
  name: Gates leading out of the Burial Grounds
  description: >
    You have come to the exit of the burial grounds.  Just up ahead to the east you can see a large
    water hole.  You begin to wonder if its really there. Stories of mirages abound in the taverns.
  sector: field
  exits:
    east:
      to: tba:233:room:23387
    west:
      to: tba:233:room:23385

"tba:233:room:23387":
  name: Dragon Plains
  description: >
    You once again find yourself walking through the plains.  Just up ahead to the east you can see a
    fairly large water hole.  Maybe you could get a drink there.
  sector: field
  exits:
    north:
      to: tba:233:room:23380
    east:
      to: tba:233:room:23388
    west:
      to: tba:233:room:23386

"tba:233:room:23388":
  name: Water Hole
  description: >
    You have come to a large water hole.  It's almost the size of a small pond. The water looks clean
    and drinkable.  Sparse vegetation surrounds the limited water supply.
  sector: field
  exits:
    south:
      to: tba:233:room:23389
    west:
      to: tba:233:room:23387

"tba:233:room:23389":
  name: Water Hole
  description: >
    As you stand at the side of the water hole, you look into the depths of the water thinking about
    yout long lost childhood.  So many old memories flood your mind, making you feel light headed.
  sector: field
  exits:
    north:
      to: tba:233:room:23388
    east:
      to: tba:233:room:23390

"tba:233:room:23390":
  name: Water Hole
  description: >
    You have come to the end of the water hole.  The water on this end looks rather murky and wouldn't
    be very good for drinking.  Something must have stirred it up recently.
  sector: field
  exits:
    east:
      to: tba:233:room:23391
    west:
      to: tba:233:room:23389

"tba:233:room:23391":
  name: Dragon Plains
  description: >
    As you walk away from the hole, you look around at your surroundings.  In the distance you can see
    a few buildings.  What are buildings doing here? They appear to have been destroyed.
  sector: field
  exits:
    north:
      to: tba:233:room:23392
    west:
      to: tba:233:room:23390

"tba:233:room:23392":
  name: Dragon Plains
  description: >
    You continue making your way through the plains.  To the north you can see the remains of a
    ransacked village.  Wisps of smoke still rise up from the charred remains of what must have been houses.
  sector: field
  exits:
    north:
      to: tba:233:room:23393
    south:
      to: tba:233:room:23391

"tba:233:room:23393":
  name: Ransacked Village
  description: >
    As you enter the remains of a village, you look around at the damage.  You can see several large
    footprints in the dirt, most likely from a dragon. Piles of rubble are everywhere.  You can see a
    skeleton under one of the piles.
  sector: field
  exits:
    north:
      to: tba:233:room:23394
    south:
      to: tba:233:room:23392

"tba:233:room:23394":
  name: Ransacked Village
  description: >
    As you continue walking through the remains of the village, horrid visions race through your mind. 
    You see several people, probably ones who lived in this village, being eaten by the dragons.  You
    begin feeling sick to your stomach.
  sector: field
  exits:
    east:
      to: tba:233:room:23395
    south:
      to: tba:233:room:23393

"tba:233:room:23395":
  name: Ransacked Village
  description: >
    You walk past several small buildings that have been smashed into dust. You feel that you're at the
    end of the village.  You can see the plains to the east.
  sector: field
  exits:
    east:
      to: tba:233:room:23396
    west:
      to: tba:233:room:23394

"tba:233:room:23396":
  name: Dragon Plains
  description: >
    Feeling exhausted from your long journey, you begin day dreaming.  Thoughts of battles that took
    place here fill your mind.  You realize how lucky you are to still be alive.
  sector: field
  exits:
    east:
      to: tba:233:room:23397
    west:
      to: tba:233:room:23395

"tba:233:room:23397":
  name: Dragon Plains
  description: >
    You see some small footprints in the sand by your feet.  Maybe you are not here alone.  No other
    signs of life exist and the footprints are quickly being covered by the blowing sand.
  sector: field
  exits:
    south:
      to: tba:233:room:23398
    west:
      to: tba:233:room:23396

"tba:233:room:23398":
  name: Dragon Plains
  description: >
    The plains seem to be ending and the sand a sparse grass is now broken by small trees and shrubs. 
    The heat seems to lessen and a cooler breeze rustles through the vegetation.
  sector: field
  exits:
    north:
      to: tba:233:room:23397
    south:
      to: tba:233:room:23399

"tba:233:room:23399":
  name: Dragon Plains
  description: >
    As you enter the last bit of the plains, you turn around and look at how far you've come.  You feel
    a great sense of accomplishment.  Maybe the journey wasn't so bad after all.
  sector: field
  exits:
    north:
      to: tba:233:room:23398
