# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 4.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:4:room:400":
  name: Jade Forest (Description Room)
  description: >
    The Jade Forest is a simple zone, laid out for levels 10-15 approximately. The majority of it is
    forest, with a small village, some trails, and a river. There are a couple of shops, but these need
    stocking with items really. Descriptions are very basic and could do with fleshing out.
  sector: forest
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   :
        Zone         : 4 Jade Forest
        Began        : 1999
        Player Level : 10-25
        Rooms        : 100
        Mobs         : 31
        Objects      : 15
        Shops        : 3
        Triggers     : 0
        Theme        :
        Plot         :
        Links        : none, Start room 99

"tba:4:room:401":
  name: The Jade Forest
  description: >
    The shadows of the trees seem to engulf their surroundings.  The light in here is extremely scarce,
    allowing very little to be visible.  Tall blades of grass wave drearily back and forth, lushly
    coating the ground as if this were swampland.
  sector: forest
  exits:
    north:
      to: tba:4:room:404
    east:
      to: tba:4:room:499
    west:
      to: tba:4:room:402

"tba:4:room:402":
  name: The Jade Forest
  description: >
    Several colorful plants blossom prettily, their vibrant hues only visible now and again from their
    hiding place in the grass.  The plant life here is so abundant that it completely obscures any trail,
    making it very easy for a traveler to become lost.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:4:room:403
    east:
      to: tba:4:room:401

"tba:4:room:403":
  name: The Jade Forest
  description: >
    A large patch of weeds grows here, their thick stems and leaves covered with a fine coating of
    hairy bristles.  They loom high into the air, creating an ideal hiding spot for creatures or lost
    travelers.
  sector: forest
  exits:
    east:
      to: tba:4:room:404
    south:
      to: tba:4:room:402
    west:
      to: tba:4:room:424

"tba:4:room:404":
  name: The Jade Forest
  description: >
    Weeds cover the ground in a thick entwined tangle, their vine-like stems weaving around each other
    as if laying a netted trap.  It would be very easy to become ensnared here, and lingering is probably
    not the wisest of ideas.
  sector: forest
  exits:
    north:
      to: tba:4:room:405
    south:
      to: tba:4:room:401
    west:
      to: tba:4:room:403

"tba:4:room:405":
  name: The Jade Forest
  description: >
    Stepping out from the weeds, a large clearing opens up, pale trees standing sentry around its
    borders.  High above, beams of sunlight can be seen making their way through the branches of the trees. 
    The song of some nearby birds fills the air with joyful sound.
  sector: forest
  flags: [no_track]
  exits:
    north:
      to: tba:4:room:406
    south:
      to: tba:4:room:404

"tba:4:room:406":
  name: The Jade Forest
  description: >
    This appears to be the beginning of a rather large looking path.  There is no indication of where
    it might lead, the darkness at its edges obscuring any vision of what lies beyond.
  sector: forest
  exits:
    east:
      to: tba:4:room:407
    south:
      to: tba:4:room:405

"tba:4:room:407":
  name: Rocky Path
  description: >
    The sound of scuffing and shuffling can be heard as the rocks on the path are disturbed by
    movement.  In patches over the ground, several spots of blood can be seen covering the rocks with a sickly
    sheen of moisture.
  sector: forest
  exits:
    east:
      to: tba:4:room:408
    west:
      to: tba:4:room:406

"tba:4:room:408":
  name: Rocky Path
  description: >
    The path seems to grow more cramped, becoming slightly narrower here.  Off to the side, the path
    can be seen lined with a bunch of dead twigs.  They seem to have been laid there deliberately, though
    there is no sign of who or what may have done so.
  sector: forest
  exits:
    east:
      to: tba:4:room:409
    west:
      to: tba:4:room:407

"tba:4:room:409":
  name: Rocky Path
  description: >
    There seems to be a large gaping crack in the path.  It is only possible to pass by taking a giant
    step over it.  The blackness within it is total, and seems to stretch deeply down into the earth,
    offering no glimmer of light or what may lie inside.
  sector: forest
  exits:
    north:
      to: tba:4:room:419
    east:
      to: tba:4:room:410
    south:
      to: tba:4:room:418
    west:
      to: tba:4:room:408

"tba:4:room:410":
  name: Rocky Path
  description: >
    The path looks though it is coming to its end.  There is no sign of what it may give way to,
    whether a clearing, or even deeper darker forest.  It can be seen growing steadily narrower, though its
    edge dips just over the horizon and out of view.
  sector: forest
  exits:
    east:
      to: tba:4:room:411
    west:
      to: tba:4:room:409

"tba:4:room:411":
  name: Rocky Path
  description: >
    At the end of a long winding path, the south opens up into a what appears to be a small garden,
    though its foliage is too deep to see clearly inside.  To the north the forest grows thickly and
    menacingly dark.
  sector: forest
  exits:
    east:
      to: tba:4:room:412
    west:
      to: tba:4:room:410

"tba:4:room:412":
  name: The Jade Forest
  description: >
    The forest seems to get thicker here.  The trees are much more fuller, sheltering the ground from
    the light of the day.  Since the light here is scarce, its not possible to see the source of several
    scuffling noises just off the side of the path.  The south way appears to lead into the start of a
    garden.
  sector: forest
  exits:
    north:
      to: tba:4:room:416
    south:
      to: tba:4:room:413
    west:
      to: tba:4:room:411

"tba:4:room:413":
  name: Garden
  description: >
    This isn't exactly a carefully groomed garden.  Wild and untamed, it is more tangles of greenery
    and shrubs than any kind of flower arrangement.  The ground is littered with loose rocks and pebbles,
    making it difficult to walk on without tripping.
  sector: forest
  exits:
    north:
      to: tba:4:room:412
    east:
      to: tba:4:room:415
    south:
      to: tba:4:room:414

"tba:4:room:414":
  name: Garden
  description: >
    The rocks on the ground seem to get larger the deeper the garden becomes. It seems chaotic, and yet
    somehow strangely designed.  Between a particularly large set of boulders can be seen the yellowing
    bones of a skeleton.  It appears to have been crushed by one of the huge stones.
  sector: forest
  exits:
    north:
      to: tba:4:room:413

"tba:4:room:415":
  name: Dead End
  description: >
    This appears to be a total dead end.  The outside world has been blocked off by a huge wall of
    towering jagged rocks.  There is no way a person could get over or around it.
  sector: forest
  exits:
    west:
      to: tba:4:room:413

"tba:4:room:416":
  name: The Jade Forest
  description: >
    The trees seem to get taller and taller as the forest deepens, their massive looming trunks
    standing ominously close to the border of the path, as if daring a traveler to set one foot over the edge.
  sector: forest
  flags: [no_track]
  exits:
    north:
      to: tba:4:room:417
    south:
      to: tba:4:room:412

"tba:4:room:417":
  name: The Jade Forest
  description: >
    The trees seem to get taller and taller as the forest deepens, their massive looming trunks
    standing ominously close to the border of the path, as if daring a traveler to set one foot over the edge.
  sector: forest
  exits:
    north:
      to: tba:4:room:441
    south:
      to: tba:4:room:416
    west:
      to: tba:4:room:434

"tba:4:room:418":
  name: Toppled Tree House
  description: >
    An old abandoned tree house sits broken and battered on the ground.  It appears that the tree that
    it was once in has long since toppled and rotted away.  This house would be better off as kindling,
    rather than a place to play.
  sector: forest
  flags: [indoors]
  exits:
    north:
      to: tba:4:room:409

"tba:4:room:419":
  name: The Jade Forest
  description: >
    The forest grows lush and damp, its dark greenery dripping with moisture and dewdrops as the light
    from above becomes dimmer and more diffuse.  The sounds of creatures battling can be heard, evidence
    of previous fights lying on the ground in streaks of blood and tufts of fur.
  sector: forest
  exits:
    north:
      to: tba:4:room:420
    south:
      to: tba:4:room:409

"tba:4:room:420":
  name: Intersection
  description: >
    This small intersection is unmarked and gives no indication of which would be the safest way to
    turn.  Narrow paths lead off in all directions, each equally shrouded in shadows from the leafy canopy.
  sector: forest
  exits:
    north:
      to: tba:4:room:432
    south:
      to: tba:4:room:419
    west:
      to: tba:4:room:421

"tba:4:room:421":
  name: Tunnel of the Dead
  description: >
    This mysterious looking tunnel appears to have been fashioned together from logs and leaves.  Small
    beams of light shine through the roof of the tunnel, allowing some glimpse of the many insects and
    worms that reside here, burrowing silently through the decaying pieces of wood.
  sector: forest
  exits:
    east:
      to: tba:4:room:420
    west:
      to: tba:4:room:422

"tba:4:room:422":
  name: Tunnel of the Dead
  description: >
    As the tunnel leads deeper, it begins echoing with a faint crying sound. There doesn't seem to be
    anywhere in particular that it is coming from though stories have often been told of this tunnel being
    haunted by the spirits who died in the great battles that were held here.
  sector: forest
  exits:
    north:
      to: tba:4:room:431
    east:
      to: tba:4:room:421
    west:
      to: tba:4:room:423

"tba:4:room:423":
  name: Tunnel of the Dead
  description: >
    The gruesome surroundings are impossible to ignore, the stench of death still lingering heavy in
    the air.  Blood stains the walls and floor.  Several skeletons are scattered about the floor,
    threatening to trip anyone who passes through.
  sector: forest
  exits:
    east:
      to: tba:4:room:422
    west:
      to: tba:4:room:430

"tba:4:room:424":
  name: The Jade Forest
  description: >
    The forest here is relatively light and thin, ample light still trickling in from the open land at
    the woodland edges.  It soon appears to grow deeper and darker however, the sounds of large creatures
    can be heard crashing through the thickest parts of the brush.
  sector: forest
  exits:
    east:
      to: tba:4:room:403
    west:
      to: tba:4:room:425

"tba:4:room:425":
  name: A Hole
  description: >
    The sudden appearance of this large hole just highlights the need to be especially cautious here. 
    It is almost impossible to avoid stepping into this deep well of mud until immediately upon it, due
    to the dark shadows obscuring its visibility.
  sector: forest
  exits:
    north:
      to: tba:4:room:426
    east:
      to: tba:4:room:424

"tba:4:room:426":
  name: A Hole
  description: >
    The forest continues on to the north, but the weight of the mud and clay from this hole is becoming
    ever more insistent.  Extremely sticky and clinging, it seems to clump together and dry, making exit
    from the hole much harder than passage into it.
  sector: forest
  exits:
    north:
      to: tba:4:room:427
    south:
      to: tba:4:room:425

"tba:4:room:427":
  name: The Jade Forest
  description: >
    At last, a larger section of the forest looms darkly ahead on the path.  It seems the forest is
    much bigger than it appears from the outside.  Just up ahead to the north can be seen a bridge made from
    logs bound together with twine. Maybe there is a stream underneath it.
  sector: forest
  exits:
    north:
      to: tba:4:room:428
    south:
      to: tba:4:room:426

"tba:4:room:428":
  name: A Log Bridge
  description: >
    A large bridge stands immediately ahead.  The long rotting logs that have been bound together, are
    suspended precariously above a fungating swamp.  The bubbling fumes waft into the air, filling it
    with an overpowering stench.  As the murky water bubbles past, it can be seen to be green and as thick
    as pudding.
  sector: forest
  exits:
    north:
      to: tba:4:room:429
    south:
      to: tba:4:room:427

"tba:4:room:429":
  name: A Log Bridge
  description: >
    The fragile nature of this bridge becomes more and more apparent, the further one walks upon it. 
    Any motion or breeze causes it to sway slowly back and forth, threatening to plummet itself and anyone
    on it into the festering slime of the underlying swamp.
  sector: forest
  exits:
    north:
      to: tba:4:room:433
    east:
      to: tba:4:room:430
    south:
      to: tba:4:room:428

"tba:4:room:430":
  name: Tunnel of the Dead
  description: >
    This appears to be the end of a tunnel, a few streams of light from the forest allowing more to be
    visible than most would wish to see.  The tunnel itself is made up mostly of fungus and rotting bark,
    its surfaces literally crawling with squirming insects and decay.
  sector: forest
  exits:
    east:
      to: tba:4:room:423
    west:
      to: tba:4:room:429

"tba:4:room:431":
  name: Marsh
  description: >
    The ground here becomes wet and slippery, easily giving way to any pressure. Its submission is
    misleading however, as the mud quickly closes in again, an insistent sucking pressure threatening to suck
    any travelers down into its deathly depths.
  sector: forest
  exits:
    north:
      to: tba:4:room:435
    south:
      to: tba:4:room:422

"tba:4:room:432":
  name: The Jade Forest
  description: >
    As the forest becomes deeper and thicker, the ground can be noticed becoming darker and more
    moist.  What was once hard and dry is now soft and wet.  It seems the forest is giving way to a more swampy
    marshland.
  sector: forest
  exits:
    north:
      to: tba:4:room:436
    south:
      to: tba:4:room:420

"tba:4:room:433":
  name: A Log Bridge
  description: >
    The smell of the swamp bubbles up sickeningly, filling the air with a green gaseous cloud.  The
    bridge continues shuddering dangerously, its logs beginning to separate with wear and age, the slimy
    water visible through the opening cracks.
  sector: forest
  exits:
    north:
      to: tba:4:room:438
    south:
      to: tba:4:room:429

"tba:4:room:434":
  name: The Jade Forest
  description: >
    The trees seem to get taller and taller as the forest deepens, their massive looming trunks
    standing ominously close to the border of the path, as if daring a traveler to set one foot over the edge.
  sector: forest
  exits:
    east:
      to: tba:4:room:417

"tba:4:room:435":
  name: Marsh
  description: >
    The water rises ankle-deep, becoming more sticky and smelly the deeper it grows.  A thick cloud of
    stench rises into the air as bubbles form and pop, the heat of the air increasing with the humidity.
  sector: forest
  exits:
    east:
      to: tba:4:room:437
    south:
      to: tba:4:room:431
    west:
      to: tba:4:room:440

"tba:4:room:436":
  name: Marsh
  description: >
    The ground here begins slowly sinking, threatening to swallow anyone or anything standing here
    alive.  It probably wouldn't be very wise to stand here for too long.  The mud gurgles insistently,
    almost as if hungry for a new meal.
  sector: forest
  exits:
    south:
      to: tba:4:room:432
    west:
      to: tba:4:room:437

"tba:4:room:437":
  name: Marsh
  description: >
    The water rises ankle-deep, becoming more sticky and smelly the deeper it grows.  A thick cloud of
    stench rises into the air as bubbles form and pop, the heat of the air increasing with the humidity.
  sector: forest
  exits:
    east:
      to: tba:4:room:436
    west:
      to: tba:4:room:435

"tba:4:room:438":
  name: A Log Bridge
  description: >
    This appears to be the edge of a rickety log bridge, a small, sparse forest scattered around its
    edges.  The air is warm and wet, and the slurping sounds of a bubbling swamp can be heard nearby.
  sector: field
  exits:
    east:
      to: tba:4:room:439
    south:
      to: tba:4:room:433

"tba:4:room:439":
  name: Marsh
  description: >
    The borders of a wet marshland stretch out ahead, long grasses and boulders obscuring much of the
    view.  Swarms of mosquitoes buzz heavily in the air, dipping in and out of the murky puddles.  To the
    north is a small dirt path.
  sector: forest
  exits:
    north:
      to: tba:4:room:456
    east:
      to: tba:4:room:440
    west:
      to: tba:4:room:438

"tba:4:room:440":
  name: Marsh
  description: >
    The marsh becomes thicker and more dangerous, the mud pulling more insistently at anything touching
    it.  Nothing grows here except algae and moulds, blue-green swirls of color bubbling on the surface
    of the mud.
  sector: forest
  exits:
    east:
      to: tba:4:room:435
    west:
      to: tba:4:room:439

"tba:4:room:441":
  name: The Jade Forest
  description: >
    The grass on the forest floor begins getting taller the deeper the forest becomes.  The thickness
    of it would make it difficult for even experienced travelers to pass.  A small hole can be just barely
    seen to the north, its relative obscurity making it very easy to stumble into.
  sector: forest
  exits:
    north:
      to: tba:4:room:442
    south:
      to: tba:4:room:417

"tba:4:room:442":
  name: The Jade Forest
  description: >
    The edges of a small hole lie jagged in the ground, making it very easy for a distracted passer to
    trip and hurt themselves.  Its not clear how the hole got there in the first place, but a few jagged
    rocks lie scattered around, distinctly out of place as if carried here.
  sector: forest
  exits:
    east:
      to: tba:4:room:443
    south:
      to: tba:4:room:441

"tba:4:room:443":
  name: The Jade Forest
  description: >
    The trees seem to be getting closer together, their thick trunks huddling closely to each other,
    making passage between them tight and difficult.  The grass on the ground is gradually disappearing and
    giving way to what appears to be a dusty path.
  sector: forest
  exits:
    north:
      to: tba:4:room:444

"tba:4:room:444":
  name: The Jade Forest
  description: >
    The ground becomes dusty and bare, trees receding at the growth of what appears to be a populated
    area.  In the open clearing, a large village can be seen to the north, its peaceful atmosphere seeming
    friendly enough.
  sector: forest
  exits:
    south:
      to: tba:4:room:443
    west:
      to: tba:4:room:445

"tba:4:room:445":
  name: Cobblestone Road
  description: >
    The dusty ground merges into the edge of a very well made cobblestone road. It seems to be leading
    into the village.  The trees seem to be more scarce here, allowing more of the surroundings to be
    visible.
  sector: forest
  exits:
    east:
      to: tba:4:room:444
    west:
      to: tba:4:room:446

"tba:4:room:446":
  name: Cobblestone Road
  description: >
    As the road grows larger, and less well traveled, everything around it seems to get quiet.  The
    creatures in the forest must sense the presence of intruding passage.  The road is very smooth and
    flawless.  It seems a very fine piece of work for such a remote and abandoned area.
  sector: forest
  exits:
    east:
      to: tba:4:room:445
    west:
      to: tba:4:room:450

"tba:4:room:447":
  name: Hidden Village
  description: >
    Following the cobblestone road towards the center of the village, various modest homes can be seen
    standing around in small clusters.  Several people are distractedly and busily working on what seem
    to be newer homes.  Leaves fall gently from the trees and carpet the winding path.
  sector: forest
  exits:
    north:
      to: tba:4:room:449
    west:
      to: tba:4:room:448

"tba:4:room:448":
  name: Hidden Village
  description: >
    The path has led right into the entrance of the village.  Everything looks so peaceful here, so
    quiet and cozy.  The smell of fresh cut flowers fills the air, making it sparkle with particles of
    dancing pollen.
  sector: forest
  exits:
    east:
      to: tba:4:room:447
    south:
      to: tba:4:room:450
    west:
      to: tba:4:room:454

"tba:4:room:449":
  name: Jedidiah's Armor Shop
  description: >
    A sign hangs in one of the windows that reads "Welcome to Jedidiah's Armor Shop!"  Here it is
    possible to buy or sell items for a fair price.  In some cases, Jedidiah may even accept trade.  His shop
    appears to be well stocked with various leather and metal armors, although why they would be needed
    in such a quiet place as this is not clear.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:4:room:471
    east:
      to: tba:4:room:451
    south:
      to: tba:4:room:447

"tba:4:room:450":
  name: Cobblestone Road
  description: >
    The road turns here, heading directly into the village.  Several shops and homes can be seen lining
    either side of the path, showing no signs yet of the people who could be living there.  The
    chittering of people can be heard talking in the distance.
  sector: forest
  exits:
    north:
      to: tba:4:room:448
    east:
      to: tba:4:room:446

"tba:4:room:451":
  name: Cobblestone Road
  description: >
    This road appears to be leading up to the entrance of a modest shop.  A few flower boxes decorate
    the outside of the building, their colorful heads bobbing in the wind, filling the air with a delicate
    perfume.  All around can be seen many beautiful houses, flowers and plants.
  sector: forest
  exits:
    east:
      to: tba:4:room:452
    west:
      to: tba:4:room:449

"tba:4:room:452":
  name: Cobblestone Road
  description: >
    As the village continues on, the shadows grow darker and longer as more and more trees begin to
    appear.  The trees seem to be leaning to one side, almost as if they were creating a path for passage. 
    The pawn shop can be seen to the north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:4:room:453
    west:
      to: tba:4:room:451

"tba:4:room:453":
  name: Village Pawn Shop
  description: >
    A banner hangs from the ceiling that reads "Welcome to the Village Pawn Shop! " It looks possible
    to find almost anything here.  Several old, and mostly junky items can be seen hanging from the wall,
    collecting layers of dust and cobwebs. A thick, wooden counter bows slightly, its surface cracked
    with use and age.
  sector: forest
  flags: [indoors]
  exits:
    south:
      to: tba:4:room:452

"tba:4:room:454":
  name: Hidden Village
  description: >
    Hundreds of leaves are falling from the trees all around, making the place look as if its in the
    middle of a tornado.  A slight breeze picks up, blowing some of the leaves swirling into the air.  The
    road immediately ahead is covered in a carpet of green.
  sector: forest
  exits:
    north:
      to: tba:4:room:455
    east:
      to: tba:4:room:448

"tba:4:room:455":
  name: Hidden Village
  description: >
    The road is hardly visible, as it has been covered in a thick carpet of dried leaves.  They can be
    heard crunching underfoot as small creatures scamper amongst the trees.  The center of the village
    can be seen lying open in the distance.
  sector: forest
  exits:
    south:
      to: tba:4:room:454
    west:
      to: tba:4:room:460

"tba:4:room:456":
  name: A Dirt Path
  description: >
    The land appears to have turned off onto a small dirt path.  Its not immediately visible where it
    leads, but the view here is beautiful!  Several small plants can be seen all around you, and in full
    bloom!  The wondrous blossoms fill the air with rich fragrance.
  sector: forest
  exits:
    north:
      to: tba:4:room:457
    south:
      to: tba:4:room:439

"tba:4:room:457":
  name: A Dirt Path
  description: >
    As the small dusty path continues on, some small holes can be seen lying dented into the ground. 
    They are much too large to be ant holes, but nothing can be seen that might have caused them.
  sector: forest
  exits:
    north:
      to: tba:4:room:458
    south:
      to: tba:4:room:456

"tba:4:room:458":
  name: A Dirt Path
  description: >
    The path comes to an end here, surrounded by a field of tall green grass. The grass comes up to
    almost the full height of a man, making it very difficult to see much beyond it.  Trees tower high
    above, watching over the landscape like dormant guardians.
  sector: forest
  exits:
    east:
      to: tba:4:room:459
    south:
      to: tba:4:room:457
    west:
      to: tba:4:room:461

"tba:4:room:459":
  name: Cobblestone Road
  description: >
    Stepping out from the gigantic field of swaying grass, a long cobblestone road becomes immediately
    visible.  It appears to be going directly into the village.  There is a small house lying off to the
    east.
  sector: forest
  exits:
    east:
      to: tba:4:room:460
    west:
      to: tba:4:room:458

"tba:4:room:460":
  name: Hidden Village
  description: >
    A dusty patch of tangled weeds makes up the entrance to a small house.  It appears to have been
    abandoned some time ago.  The windows and the door have been boarded up, keeping people from entering,
    or even peering inside.
  sector: forest
  exits:
    east:
      to: tba:4:room:455
    west:
      to: tba:4:room:459

"tba:4:room:461":
  name: A Stream
  description: >
    The sound of rushing water fills the air, spray misting up from a rather large looking stream.  The
    water swirls chaotically with foam and mud, several small fish can be seen swimming about just
    beneath its surface.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:4:room:458
    west:
      to: tba:4:room:462

"tba:4:room:462":
  name: A Stream
  description: >
    Just beneath the glittering surface of the water can be seen a layer of smooth white pebbles being
    hit by the sunlight.  The light reflects from the rocks, making small rainbows in the water.
  sector: forest
  exits:
    north:
      to: tba:4:room:464
    east:
      to: tba:4:room:461
    south:
      to: tba:4:room:463

"tba:4:room:463":
  name: A Stream
  description: >
    Just beneath the glittering surface of the water can be seen a layer of smooth white pebbles being
    hit by the sunlight.  The light reflects from the rocks, making small rainbows in the water.
  sector: forest
  exits:
    north:
      to: tba:4:room:462

"tba:4:room:464":
  name: A Stream
  description: >
    The stream begins to get shallow here.  The tops of large pebbles that were once submerged under
    the water are now out in the open, being dried by the sun. A soft scratching noise can be heard close
    by.
  sector: forest
  exits:
    north:
      to: tba:4:room:465
    south:
      to: tba:4:room:462

"tba:4:room:465":
  name: A Stream
  description: >
    There is a slight bend in the stream here.  It begins heading off to the east.  It appears to be
    almost at an end.  The beginning of a dusty dirt trail can be seen stretching straight ahead to the
    east.
  sector: forest
  exits:
    east:
      to: tba:4:room:466
    south:
      to: tba:4:room:464

"tba:4:room:466":
  name: A Stream
  description: >
    The stream comes to a softly babbling end, giving way to a muddy riverbank filled with grassy
    rushes.  Off to the east can be seen a large trail, it seems particularly well-traveled as if a large city
    or town lay nearby.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:4:room:475
    east:
      to: tba:4:room:467

"tba:4:room:467":
  name: Sanctus Trail
  description: >
    The trail ahead of looks well-maintained and decorated.  Many beautiful plants line the sides of
    the trail, making it look as if it passes through a large flower garden.  The trail continues to the
    east.
  sector: forest
  exits:
    east:
      to: tba:4:room:468
    west:
      to: tba:4:room:466

"tba:4:room:468":
  name: Sanctus Trail
  description: >
    The trail curves here, heading towards the north.  It appears to remain straight for quite some
    time.  There are some large rocks sitting in the side of the trail.  They look rather out of place, as
    if somebody carried them and left them there.
  sector: forest
  exits:
    north:
      to: tba:4:room:486
    east:
      to: tba:4:room:469
    west:
      to: tba:4:room:467

"tba:4:room:469":
  name: Cobblestone Road
  description: >
    This old cobbled road stands on the edge of a village.  To the west is a large trail, possibly
    leading into the city of Sanctus, which can be seen looming over the horizon.  The center of the village
    stretches out to the east.
  sector: forest
  exits:
    east:
      to: tba:4:room:470
    west:
      to: tba:4:room:468

"tba:4:room:470":
  name: Cobblestone Road
  description: >
    As the village deepens, the houses grow larger and more intricate.  To the west can be seen a
    rather large looking trail, although it is not clear where it leads.  Off in the distance to the north can
    be seen an inn.  It appears to be offering rooms for rest.
  sector: forest
  exits:
    north:
      to: tba:4:room:473
    east:
      to: tba:4:room:474
    west:
      to: tba:4:room:469

"tba:4:room:471":
  name: Cobblestone Road
  description: >
    An enormous tree stands stretching into the sky.  It's branches are full with fluttering green
    leaves, offering plenty of shelter from the sun.  The road continues to the west, heading directly into
    the center of the village.
  sector: forest
  exits:
    south:
      to: tba:4:room:449
    west:
      to: tba:4:room:472

"tba:4:room:472":
  name: Cobblestone Road
  description: >
    The road makes a sharp turn here, heading to the north.  A village can be seen nearby, the sound of
    friendly chattering filling the air.  Now and again, the glimpse of people can be seen busily
    shuffling around.  A few of them pause and speak to each other before going about their business.
  sector: forest
  exits:
    north:
      to: tba:4:room:474
    east:
      to: tba:4:room:471

"tba:4:room:473":
  name: Cobblestone Road
  description: >
    The road seems to come to an end here, leaving nothing but open grassy ground to walk on.  To the
    east can be seen an old shop, but it doesn't appear to be open, its windows and door carefully nailed
    shut.
  sector: forest
  exits:
    east:
      to: tba:4:room:479
    south:
      to: tba:4:room:470

"tba:4:room:474":
  name: Center of the Village
  description: >
    This appears to be close to the center of town, and several beautiful houses can be seen lined up,
    hidden in the trees.  Children play happily in the grass, squealing with laughter or running about,
    giving the place a carefree, joyful feel.
  sector: forest
  exits:
    north:
      to: tba:4:room:479
    south:
      to: tba:4:room:472
    west:
      to: tba:4:room:470

"tba:4:room:475":
  name: Sanctus Trail
  description: >
    This is a very smooth and well made trail.  It appears its heading into the entrance of a large
    city.  Some trees are scattered around the sides of the trail, sheltering the path in gentle shadow. 
    The road continues to the north.
  sector: forest
  exits:
    north:
      to: tba:4:room:476
    south:
      to: tba:4:room:466

"tba:4:room:476":
  name: Sanctus Trail
  description: >
    The trail begins to turn here, heading to the west.  A small breeze cascades over the land,
    stirring little dust clouds into the air.  Leaves flutter lazily as they fall from the trees and onto the
    ground, carpeting it with a layer of earthy colors.
  sector: forest
  exits:
    south:
      to: tba:4:room:475
    west:
      to: tba:4:room:477

"tba:4:room:477":
  name: Sanctus Trail
  description: >
    The city is not too far away now.  Its gleaming stone wall can be seen looming in the distance. 
    Several tall buildings are visible here and there, their tiled roofs peeking just over the edges of the
    wall.
  sector: forest
  exits:
    north:
      to: tba:4:room:478
    east:
      to: tba:4:room:476

"tba:4:room:478":
  name: Sanctus Trail
  description: >
    The city is not too far away now.  Its gleaming stone wall can be seen looming in the distance. 
    Several tall buildings are visible here and there, their tiled roofs peeking just over the edges of the
    wall.
  sector: forest
  exits:
    south:
      to: tba:4:room:477

"tba:4:room:479":
  name: Abandoned Shop
  description: >
    This old shop appears long-abandoned, its broken windows covered in a layer of sticky dust and
    cobwebs.  A few planks have been placed over top, although these too are old and rotted.  Insects buzz
    lazily around, humming contentedly as if not often disturbed.
  sector: forest
  flags: [indoors]
  exits:
    east:
      to: tba:4:room:480
    south:
      to: tba:4:room:474
    west:
      to: tba:4:room:473

"tba:4:room:480":
  name: Hidden Village
  description: >
    To the east can be seen a weapons shop, although it seems distinctly out of place in such a
    peaceful place as this.  To the north lies a small inn, its flowered windows open, and a welcoming smell of
    home cooking wafting from its direction.
  sector: forest
  exits:
    north:
      to: tba:4:room:482
    east:
      to: tba:4:room:481
    west:
      to: tba:4:room:479

"tba:4:room:481":
  name: Zachary the Weaponsmith
  description: >
    A sign hangs swinging in the doorway that reads "Welcome to Zachary's Weapon;Shop!"  A few plain
    weapons lie bundled on the floor, wrapped in cloth as if there is little use for them.  The shop itself
    appears in a state of disrepair, a few long cracks splitting the wooden structure, allowing green
    moulds to grow in the damp recesses.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:4:room:480

"tba:4:room:482":
  name: Inn Entrance
  description: >
    The entrance to the inn smells like baking bread and fresh flowers.  It looks like a marvelous
    place to stay.  To the west is the front desk, a list of rooms hanging on the wall, along with various
    sets of keys.  A little fireplace flickers against one wall, filling the room with a homey warmth and
    light.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:4:room:484
    south:
      to: tba:4:room:480
    west:
      to: tba:4:room:483

"tba:4:room:483":
  name: Front Desk
  description: >
    A large mahogany desk fills most of this part of the room, draped with a lacey cover.  The room
    itself is beautiful.  Some painted pictures and portraits hang from several places on the walls.  The
    carpet looks brand new, a deep forest green and fluffy.  The smell of fresh cut flowers fills the air.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:4:room:482

"tba:4:room:484":
  name: Room 1
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:4:room:485
    south:
      to: tba:4:room:482
    west:
      to: tba:4:room:490

"tba:4:room:485":
  name: Room 2
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:4:room:484

"tba:4:room:486":
  name: Sanctus Trail
  description: >
    The road ahead looks long and dusty, its borders half claimed by the wilderness surrounding it.  A
    very large city looms in the distance, a large wall obscuring most of the view, but its very possible
    it could be the city of Sanctus.
  sector: forest
  exits:
    north:
      to: tba:4:room:487
    south:
      to: tba:4:room:468

"tba:4:room:487":
  name: Sanctus Trail
  description: >
    The road ahead looks long and dusty, its borders half claimed by the wilderness surrounding it.  A
    very large city looms in the distance, a large wall obscuring most of the view, but its very possible
    it could be the city of Sanctus.
  sector: forest
  exits:
    north:
      to: tba:4:room:488
    south:
      to: tba:4:room:486

"tba:4:room:488":
  name: Sanctus Trail
  description: >
    As the trail continues on, the sight of a far off village comes into view, as well as an extremely
    large city.  The village looks tiny compared to the city that looms on the horizon.  The trail
    continues to the north.
  sector: forest
  exits:
    north:
      to: tba:4:room:495
    south:
      to: tba:4:room:487

"tba:4:room:489":
  name: Room 4
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:4:room:498
    east:
      to: tba:4:room:490

"tba:4:room:490":
  name: Room 3
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:4:room:484
    west:
      to: tba:4:room:489

"tba:4:room:491":
  name: Sanctus Trail
  description: >
    Several large boulders surround the trail, almost creating a wall.  To the east can be seen a
    rather large looking well.  The trail continues north and south.
  sector: forest
  exits:
    north:
      to: tba:4:room:492
    east:
      to: tba:4:room:496

"tba:4:room:492":
  name: Sanctus Trail
  description: >
    The city of Sanctus can be seen lying on the horizon, its large stone walls obscuring much of what
    lays within.  The trail grows wider and better traveled as it approaches the city, its borders
    pushing back the waving grasses that encroach all around.
  sector: forest
  exits:
    east:
      to: tba:4:room:493
    south:
      to: tba:4:room:491

"tba:4:room:493":
  name: Sanctus Trail
  description: >
    The air stirs gently, rippling over the grasses and causing them to wave gently as if greeting any
    travelers that pass through here.  The occasional sound of birdsong drifts down from above, the lazy
    hum of bees and insects droning continually in the background.
  sector: forest
  exits:
    east:
      to: tba:4:room:494
    south:
      to: tba:4:room:496
    west:
      to: tba:4:room:492

"tba:4:room:494":
  name: Sanctus Trail
  description: >
    The trail continues on, heading straight for the city.  The sound of civilization grows louder,
    gentle chattering and the scuffling of footsteps echoing from within the large surrounding walls of
    Sanctus.  The trail here has become more grooved and worn with heavy passage.
  sector: forest
  exits:
    east:
      to: tba:4:room:495
    west:
      to: tba:4:room:493

"tba:4:room:495":
  name: Sanctus Trail
  description: >
    As the trail continues on, the sight of a far off village comes into view, as well as an extremely
    large city.  The village looks tiny compared to the city that looms on the horizon.  The trail
    continues to the north.
  sector: forest
  exits:
    south:
      to: tba:4:room:488
    west:
      to: tba:4:room:494

"tba:4:room:496":
  name: Sanctus Trail
  description: >
    A large stone well stands here, the ground around it cast in shadow and moist with the water that
    has been spilled through use.  Dark green mosses and small nodding mushrooms take refuge in the shade,
    small insects scuttling busily around them.
  sector: forest
  exits:
    north:
      to: tba:4:room:493
    west:
      to: tba:4:room:491

"tba:4:room:497":
  name: Room 6
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  exits:
    west:
      to: tba:4:room:498

"tba:4:room:498":
  name: Room 5
  description: >
    The room is wide and spacious, painted with neutral hues of ivory and beige. There is a large bed
    sitting in the corner of the room next to a large window with what appears to be a beautiful view! 
    The carpeting is plush and warm, giving the place a welcoming feel.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:4:room:497
    south:
      to: tba:4:room:489

"tba:4:room:499":
  name: The Jade Forest
  description: >
    This appears to be the entrance of a thick forest.  Numerous trees tower high into the air, making
    everything else look quite small.  In the distance birds can be heard chirping.
  sector: forest
  exits:
    west:
      to: tba:4:room:401
