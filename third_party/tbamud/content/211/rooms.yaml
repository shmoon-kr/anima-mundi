# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 211.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:211:room:21100":
  name: Parna's Tarot Zone Description Room
  description:
  - >
    This area is trying to recreate the Tarot zone I built for Smaug.  The purpose is to have a way of
    Tarot fortune-telling online.  It has been repeated twice to allow different people to have their
    futures told at the same time. It's a specialized sort of area that, in my experience, most people will
    stay away from, some people will visit occasionally and a few people may visit constantly.  There is,
    of course, no way of telling what the ratio will be on any given mud.
  - >
    If you have diagonal exits, please remove the corner rooms and use the diagonal exits instead.
  - >
    There are a lot of triggers to try to keep people from blocking the zone. Please adjust these to
    your own mud.
  - >
    The food and drink in room 21102 are self replicating.  For each bokolyi or glass taken, another
    one appears.  If you don't like this, just take them out. This is mainly for zone testers so they won't
    starve or dehydrate while they're reading the cards but it's a convenience to low-levels with no
    money, too.
  - >
    I think it should be attached to the main town.  Since Midgaard is the recall town here, room 3121
    heading north into 22001 seems like a reasonable spot with perhaps an addition of the mention of a
    house to the north.
  - November 25, 2013 for tbamud.com - Parnassus
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:211:room:21101
      look: This way to Tarot!

"tba:211:room:21101":
  name: Outside a small building
  description: >
    A tidy-looking three-story building made of red brick waits invitingly for customers.  The yard is
    a peaceful square space with a neat picket fence protecting the green lawn from the street while not
    blocking the view of the house.  Bright flowerbeds snuggle against the foot of the fence.  A bright
    brass sign is placed near the door.
  sector: inside
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:211:room:21102
      look: The door is rounded on the top instead of the usual rectangle.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [fence, picket]
    text: >
      It's a normal-looking, pointed-slat fence covered with fresh white paint. The entrance is an open,
      oval trellis, covered with red roses.
  - keywords: [yard]
    text: The yard is neatly manicured, looking like a bright green carpet.
  - keywords: [door]
    text: The door is rounded on the top instead of the usual rectangle.
  - keywords: [flowers, flowerbeds]
    text: Beautiful bright flowers in all colors, but mostly reds, decorate well-kept flowerbeds.
  - keywords: [sign, brass, bright]
    text:
      preformatted: |2
           {white}
        {/white}{white}       Sibyl, Esmerelda and Jaelle
        {/white}{white}
        {/white}{white}              Tarot Readings
        {/white}

"tba:211:room:21102":
  name: A Room For Waiting
  description: >
    {bright_red} {/bright_red} A receptionist dressed in brightly colored clothes sits at a desk,
    dispensing information and appointments.  The room is lined with seats.  Low tables are covered with
    magazines and newspapers for the entertainment of those waiting.  A few paintings decorate the walls. 
    Doors lead in all directions.  {bright_red} {/bright_red} Refreshments are available for the comfort of
    the clients.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:211:room:21110
      look: Sibyl's Office
      door:
        keywords: [door]
        kind: door
        reset: locked
    east:
      to: tba:211:room:21150
      look: Jaelle's Office
      door:
        keywords: [door]
        kind: door
        reset: locked
    south:
      to: tba:211:room:21101
      look: This way out.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:211:room:21130
      look: Esmerelda's Office
      door:
        keywords: [door]
        kind: door
        reset: locked
  extras:
  - keywords: [paintings]
    text: >
      These are the sort of pictures with a young woman standing, looking pensively at a forest, field or
      ocean.  She wears a long dress that blows in the wind. Her long hair, covered with a floppy hat,
      blows around also.
  - keywords: [seats]
    text: >
      These seats look very comfortable for a waiting room.  There are nicely padded armchairs and
      couches, upholstered in a tasteful flowered motif.
  - keywords: [newspapers]
    text: >
      There are a few copies of today's editions of various papers, including the Sanctus Times and the
      daily Sanctus.  There's even a copy of your favorite hometown paper.
  - keywords: [magazines]
    text: >
      Except for the copies of Tarot World Magazine, these mostly the same magazines that you'd find in a
      doctor's office waiting room.  There are issues Reader's Digest, Sports Illustrated, Entertainment
      Weekly and a few other familiar names.  Are Time and Fortune here because they're popular or are they
      some sort of joke?

"tba:211:room:21103":
  name: A Brightly-Lit Corridor
  description: >
    This is a bright white hallway with large representations of the cards you've seen in the previous
    rooms placed at neat intervals to provide color.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_track, no_magic]
  exits:
    down:
      to: tba:211:room:21102
      look: This way out.  The door you came in by seems to have disappeared.
  extras:
  - keywords: [representations, cards, pictures]
    text: >
      If you didn't look before but wanted to see the cards now:
      http://en.wikipedia.org/wiki/Rider-Waite_tarot_deck

"tba:211:room:21110":
  name: Sibyl's office
  description: >
    Sibyl sits behind a large table, running a deck of cards through her hands. A large plaque is on
    the wall behind her and bright pictures cover the other walls.  On closer look, the pictures seem to be
    large representations of some of the cards in her hands.  She starts to lay the cards out in a
    design of a circle and a line.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_track, no_magic]
  exits:
    south:
      look: The door is closed and can't be opened.
    up:
      to: tba:211:room:21111
      door:
        keywords: [door, stairs, up]
        kind: pickproof
        reset: locked
  extras:
  - keywords: [plaque]
    text: >
      Sibyl uses the Rider-Waite tarot deck in the Keltic Cross layout.  If you would like to see the
      cards that have been dealt to you, representations can be found at:
      http://en.wikipedia.org/wiki/Rider-Waite_tarot_deck

