# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 293.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:293:room:29300":
  name: Entrance to the Blue Trials
  description:
  - >
    You enter the musty area beneath the blue temple and stop in awe. The stonework here is simply
    incredible--a combination of dwarven stonemanship and elven artistry.  On the wall there is an
    inscription: 'Only those who brave the elder beasts may arrive safely at the orb.'
  - There is a door to the east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:293:room:29301
      door:
        keywords: [door]
        kind: door
        reset: closed
    up:
      to: tba:292:room:29202
  extras:
  - keywords: [info, credits]
    text: See KEROFK zone description room.

"tba:293:room:29301":
  name: Passageway
  description:
  - >
    It seems that door you just passed through disappeared behind you! The only way to go is forward,
    then, deeper into the passages.  You're not sure if you feel comfortable about this...
  - The passage continues south.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29302

"tba:293:room:29302":
  name: Passageway
  description: >
    Blank passageway, with bricks set so close together that any mason spotting such work would keel
    over in disbelief.  The passage continues westwards, and back to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29301
    west:
      to: tba:293:room:29303

"tba:293:room:29303":
  name: Passageway
  description: >
    Another door is here, and you have a sneaking suspicion this one might disappear as well once you
    pass through.  The passageway leads east back the way you came, and the door is to your south.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:293:room:29302
    south:
      to: tba:293:room:29304
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29304":
  name: Octagonal Room
  description: >
    As you enter, you see a bright light spinning in the center of this octagonal room.  Also, there
    are many bones of prior adventurers strewn about.  Unfortunately, the door DID disappear behind you
    again...  the only way out is east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29305
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29305":
  name: Passageway
  description: >
    Back into passageway, and, once again, the door has disappeared behind you.  The only way to go is
    north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29306

"tba:293:room:29306":
  name: Passageway
  description: >
    Once again you find yourself up against a normal-seeming door in the north wall.  The passageway
    leads a little way south, and then runs up against a dead end.  One way to go, again.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29307
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:293:room:29305

"tba:293:room:29307":
  name: Trial
  description: >
    This is a large rectangular room with three exits, doors to the north, east and west.  The door
    you've come from has...disappeared! You are not surprised, however.  There are some strange scuff marks
    on the floor, and you'd swear that discoloration is an old bloodstain.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29311
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:293:room:29309
      door:
        keywords: [east]
        kind: door
        reset: closed
    west:
      to: tba:293:room:29308
      door:
        keywords: [west]
        kind: door
        reset: closed

"tba:293:room:29308":
  name: Passageway
  description: >
    The door behind you has disappeared, and you sigh.  This is getting old.  This is just a tiny room
    with a door to the south.  You feel you know that door already.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29301
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29309":
  name: Passageway
  description:
  - >
    The door behind you melds into the stone walls without a trace. Whomever wasted the magical
    energies to these doors certainly had flair, if not a sense of humor.
  - The passage continues southward.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29310

"tba:293:room:29310":
  name: Passageway
  description: >
    You've come to the end of the passage here.  But, instead of a door, its a trapdoor!  The
    excitement is palpable; a change of pace, perhaps?
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29309
    down:
      to: tba:293:room:29302
      door:
        keywords: [trapdoor]
        kind: door
        reset: closed

"tba:293:room:29311":
  name: Passageway
  description: >
    Here the passageway has two alcoves on the sides, each with a statue of some forgotten god.  The
    plaques have rusted away so you can't even read the names. Probably these were devotions to Gods whose
    time was over and whose followers deserted.  There is a trapdoor in the floor beyond them: the only
    way to go.
  sector: inside
  flags: [dark, indoors]
  exits:
    down:
      to: tba:293:room:29312
      door:
        keywords: [trapdoor]
        kind: door
        reset: closed

"tba:293:room:29312":
  name: Passageway
  description: >
    You drop from the now-vanishing trapdoor above to this new passage. It runs to the east.  You begin
    to wonder if you'll ever see Kerofk again...  this maze is awful!
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:293:room:29313

"tba:293:room:29313":
  name: Passageway
  description: >
    The passage continues to the east and west out of your small circle of light in either direction. 
    There seems to be nothing interesting here, just stonework and you.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:293:room:29314
    west:
      to: tba:293:room:29312

"tba:293:room:29314":
  name: End of the Passageway
  description: >
    The passageway ends here, with a door in the northern wall.  The passage seems still and eerie.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29315
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:293:room:29313

"tba:293:room:29315":
  name: Second Trial
  description: >
    Here are two doors, north and east.  The door you came through is gone like chaff in the wind. 
    There's no clue as to which door is the correct one to exit by, and you wonder if this is merely a test
    of guess.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29317
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:293:room:29316
      door:
        keywords: [east]
        kind: door
        reset: closed

"tba:293:room:29316":
  name: Passageway
  description: >
    You feel this was the wrong decision, somehow.  There are two 'nests' here, for the lack of a
    better word, looking recently used.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29301
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29317":
  name: Passageway
  description: >
    You feel you have made the right decision, somehow.  The door behind you has vanished, but the
    passageway leads away to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29318

"tba:293:room:29318":
  name: Passageway
  description: >
    Here is a door to the north.  A plaque next to it reads, 'The Trial of Defense!  '.  You get a BAD
    feeling about this room ahead.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29319
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:293:room:29317

"tba:293:room:29319":
  name: Trial of Defense!
  description: >
    This is a small close room, with a door exact opposite from where you entered.  The door behind you
    is conveniently gone.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29320
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29320":
  name: Passageway (Again!)
  description: >
    You feel relief pass over you for a moment.  This place looks to be a nice, safe place to rest if
    you've ever seen one.
  sector: inside
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:293:room:29321

"tba:293:room:29321":
  name: Passageway
  description: Now you are in a twisty set of passageways, and feel rather lost!
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29322
    west:
      to: tba:293:room:29320

"tba:293:room:29322":
  name: Passageway
  description: Now you are in a twisty set of passageways, and feel rather lost!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29321
    east:
      to: tba:293:room:29323

"tba:293:room:29323":
  name: Passageway
  description: Now you are in a twisty set of passageways, and feel rather lost!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29324
    west:
      to: tba:293:room:29322

"tba:293:room:29324":
  name: Passageway's End
  description: >
    You seem to have come to the end of the twisty passageways, with no discernable exit.  Could there
    be something hidden here?
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:293:room:29325

"tba:293:room:29325":
  name: Trial of Persistence
  description: >
    In this plain, square room, there are four doors, each at a corner of the compass.  They all look
    exactly the same, and for a moment you feel confused.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29327
      door:
        keywords: [north]
        kind: door
        reset: closed
    east:
      to: tba:293:room:29326
      door:
        keywords: [east]
        kind: door
        reset: closed
    south:
      to: tba:293:room:29326
      door:
        keywords: [south]
        kind: door
        reset: closed
    west:
      to: tba:293:room:29326
      door:
        keywords: [west]
        kind: door
        reset: closed

"tba:293:room:29326":
  name: Passageway
  description: >
    You feel you have chosen the wrong exit, but there seems to be a hole in the floor as the only
    exit.  Odd...
  sector: inside
  flags: [dark, indoors]
  exits:
    down:
      to: tba:293:room:29320

"tba:293:room:29327":
  name: Passageway
  description: >
    The passageway leads away to the north, and you feel you have chosen correctly again.  What luck!
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29328

"tba:293:room:29328":
  name: Passageway
  description:
  - There is a door to your north, with a plaque that says,
  - "'The Trial of Death!'"
  - Uh-oh.  You wonder if you've a scroll of recall...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:293:room:29329
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:293:room:29327

"tba:293:room:29329":
  name: Killed by Arrow Traps!
  description:
  - >
    Suddenly thousands of arrows pepper your body...turning you into a giant pincushion!!!! YOU ARE
    DEAD (R.I.P.!) Welcome to The Builder Academy (TBA)! 0) Exit from TBA. 1) Enter TBA. 2) Enter
    description. 3) Read the background story. 4) Change password. 5) Delete this character.
  - "Make your choice: (and then, the illusion and shock slowly fades away.)"
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29330

"tba:293:room:29330":
  name: Alcove
  description: >
    Up ahead, you see a bright light, much brighter than most mundane light sources you've seen.  It
    seems to be coming from a small globe in the next room, resting on a pedestal.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29331

"tba:293:room:29331":
  name: Pedestal of the Orb!
  description: >
    This is a large square room.  All around on the walls there are friezes of dwarves and elves,
    pictured worshiping the very orb that hovers above the pedestal in the middle of this very room.  The
    pedestal is pure gold, and the orb hovers above it, humming and glowing with such radiance you can barely
    see its form.  This, then, is the object of your quest.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:293:room:29332
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29332":
  name: Temple of MouseRider
  description:
  - >
    Here you are again at the Temple of MouseRider, through a bizarre twist of space.  The main
    entrance seems to be gone, however...
  - >
    MouseRider is clutching one of the shards of the destroyed orb.  He laughs evilly as he takes a
    vicious dagger and disembowls himself, spilling organs all over his feet and the floor.
  - >
    'Fools!'  he cries, 'I am now an immortal, I am now a liche!!'  He laughs, and directs his minions
    to attack!
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:293:room:29333
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:293:room:29333":
  name: Void
  description:
  - >
    Mouserider's bedroom is gone.  You float in space, and several objects wink into being around you. 
    A reward from the gods, perhaps?
  - >
    A rift opens in space below you, and you spot the street outside the White Temple in Kerofk.  A
    voice booms around you:
  - >
    "Take these toys, and remember this:  don't expect plot continuity from a mud!"  You feel relief.
  sector: inside
  flags: [no_mob, indoors]

"tba:293:room:29334":
  name: View of a City
  description: >
    Incredible! From this vantage point you see a huge city to your east, large enough to hold
    thousands of people.  Great walls encircle the city, no doubt to keep the marauding monsters at bay.  The
    city is in a VERY defensible spot in that over half its length is sprawled along the edge of a cliff. 
    Beyond the cliff you see a dark ocean, reflecting the starlight above very feebly.  The road continues
    west down the rise, and east, towards the city on the edge.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29335
    west:
      to: tba:293:room:29341

"tba:293:room:29335":
  name: Near the City
  description: >
    You are very near the city now.  There is a great gate to your east, with guards slowly letting
    people in and out.  The walls surrounding the city seem impassable, but several scorch marks along its
    length tells a different stories about war and raids.  To your west is a rise where you may get a
    better vantage point of the city.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:292:room:29277
    west:
      to: tba:293:room:29334

"tba:293:room:29336":
  name: Dirt Road
  description: >
    The road travels north-south here along the side of the mountains. To the north you see some
    cultivated fields, and to the south a fork in the road.  The sky above seems eerie, especially to the west
    where the glow of the normal sky brightens the horizon...
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29337
    south:
      to: tba:293:room:29341

"tba:293:room:29337":
  name: Turn in the Road
  description: >
    The road turns here to the east.  Around you you see small cultivated fields, tended by farmers who
    seem paranoid and quick.  The vegetables they are harvesting seem pale and lifeless by your
    standards, with a few you've never seen the likes of before.  From several burned out shells of houses you
    guess the farmers just try to grow what they can before the city is put under siege again.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29338
    south:
      to: tba:293:room:29336

"tba:293:room:29338":
  name: A City on the Edge
  description: >
    From here you see a great walled city from the side.  Only half is walled, the other half sprawled
    directly on the edge of a great cliff which drops down into a dark ocean below.  To the east you see
    a small gate in the city, which farmers are going into and out of sporadically.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29339
    west:
      to: tba:293:room:29337

"tba:293:room:29339":
  name: Fields near a City
  description: >
    There are some more small fields here, and more burned out houses. From the smell of charred wood
    and the sounds of fresh construction, you guess that the last raze didn't happen long ago...
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29340
    west:
      to: tba:293:room:29338

"tba:293:room:29340":
  name: Near a City
  description: >
    There is small gate to your east where guards let farmers into and out of the city with their
    produce.  The walls seem indestructible, but scorch marks along its length tell a different story...
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:292:room:29276
    west:
      to: tba:293:room:29339

"tba:293:room:29341":
  name: Dirt Road
  description:
  - >
    The road you stand on forks several directions here, one leading to the north out of sight in the
    starlit sky, one leading up a hill to the east, and towards the mountains to the west.
  - It seems very quiet and peaceful here.  A breeze caresses your face.
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29336
    east:
      to: tba:293:room:29334
    west:
      to: tba:293:room:29342

"tba:293:room:29342":
  name: Dirt Road
  description: >
    The road continues east and west from here.  To the west you see brightness seeping over and
    between the mountains.  Eastwards the strange, unnatural night sky spreads over anything, its permanent
    stars lighting the landscape with an eerie glow.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:293:room:29341
    west:
      to: tba:293:room:29343

"tba:293:room:29343":
  name: Dirt Road
  description: >
    You are standing in the foothills before the mountains.  A road leads away under the starry sky to
    the east, and a mountain pass heads up and through to the north.  The scenery on this side of the
    mountains seems bleak and lifeless, probably due to the lack of sun.
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29344
    east:
      to: tba:293:room:29342

"tba:293:room:29344":
  name: Mountain Pass
  description: >
    The mountain pass leads up to the west, and downwards to the south. There seems to be a strange
    half twilight farther to the west, casting an eerie glow over the stones and shrubberies around.  You
    can see a large dark plain to the east that the sun never seems to have shone upon, making it appear to
    be otherworldly somehow...
  sector: hills
  flags: [indoors]
  exits:
    south:
      to: tba:293:room:29343
    west:
      to: tba:293:room:29345

"tba:293:room:29345":
  name: Mountain Pass
  description: >
    You are standing at the apex of the mountain pass, the normal sky to your west, and the strange
    night sky to your east.  The edge of the night is clearly delineated above you...a sharp edge separating
    night from normal, as it were.  Very odd...you wonder what could be causing this unnatural darkness.
  sector: hills
  exits:
    east:
      to: tba:293:room:29344
    south:
      to: tba:293:room:29346

"tba:293:room:29346":
  name: Mountain Pass
  description: >
    The mountains rise up here, the small pass you are on wending its way up to the north.  The sky
    seems dark above the mountains, as if the mountains were a dividing line keeping back the night. The
    pass also leads back down to the
  sector: hills
  exits:
    north:
      to: tba:293:room:29345

"tba:293:room:29347":
  name: Fleecem and Son
  description: >
    This is a small, hole in the wall office, lined with boxes and crates of paper and files.  An old,
    beaten-up desk stands near the door, very much on its last legs.  The air is thick and humid, the
    decorations too garish, the space is too crowded. A name plaque on the desk says 'Bungle Fleecem, Esq.'
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:292:room:29230

"tba:293:room:29348":
  name: Graveyard Entrance
  description: >
    You stand on a path in an eerie graveyard.  An archway leads north to Moon Gate Road, and the path
    continues to the east and south.  In the gloom of night and the twinkling stars above, the tombstones
    seem to take a life of their own in a storybook way.  You don't think it would be the kind of
    storybook you would be interested in...
  sector: city
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:292:room:29228
    east:
      to: tba:293:room:29349
    south:
      to: tba:293:room:29351

"tba:293:room:29349":
  name: Graveyard
  description: >
    This path leads through the graveyard south and west.  You notice several graves have been
    disturbed here, and one grave has been entirely dug up.  The bones of a dead dwarf lie exposed at the bottom
    of the grave, its hands seemingly to clutch at the sky.  The tombstone at the head of the grave is
    completely unreadable.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:293:room:29350
    west:
      to: tba:293:room:29348

"tba:293:room:29350":
  name: Graveyard
  description: >
    You stand in the south-east corner of the graveyard.  The tombstones here are old and weathered by
    age and elements.  Some are toppled over. Some grass grows sparsely around the rocks, paled by the
    lack of sun. In this area, you feel the peace of death, instead of the decay usually associated with
    graveyards.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29349
    west:
      to: tba:293:room:29351

"tba:293:room:29351":
  name: Graveyard
  description: >
    The earth here has been freshly turned up, the graves recent. The headstones tell tale of faithful
    wives and brave husbands, meeting their ends with dignity and aplomb.  Two pits are dug near the wall
    for a burial yet to take place.  You feel strangely chilled by the night air...
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:293:room:29348
    east:
      to: tba:293:room:29350

"tba:293:room:29352":
  name: Farmer's Stand
  description: >
    A few wooden stands here are filled with fruits and vegetables grown under this endless night sky. 
