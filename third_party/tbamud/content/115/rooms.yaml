  description: >
    The tall black metal fence to the east and west look insurmountable.  The trampled grass is
    splotched with blood, and even some body parts.  A few corpses line the fence to the west.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11558
    south:
      to: tba:115:room:11560

"tba:115:room:11560":
  name: A Fenced in Path
  description: >
    A wailing cry of someone in anguish, or the last throes of life pierces the chill air.  Everything
    goes deathly silent afterwards, the cry echoes off the monastery and small building to the east over
    the fence.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11559
    south:
      to: tba:115:room:11561

