    south:
      to: tba:115:room:11583
  extras:
  - keywords: [look, blood]
    text: The trail can still be distinguished from the dirt, and seems to be running south.

"tba:115:room:11583":
  name: Behind the Monastery
  description: >
    A trail of footprints and hoofprints have pounded the ground into a nice trail here.  An assortment
    of garden tools are lined up against the eastern wall of the Monastery.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11582
    east:
      to: tba:115:room:11594
    south:
      to: tba:115:room:11584
  extras:
  - keywords: [look, blood]
    text: The trail has been lost and it is not known which way it runs.

"tba:115:room:11584":
  name: Behind The Monestary
  description: >
    An orchard opens up to the east while the Monastery wall hugs close to the west.  A small path
    travels north and south along the wall.  Tools of gardening are scattered about the ground in disorder.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11583
    east:
      to: tba:115:room:11586
    south:
      to: tba:115:room:11585

"tba:115:room:11585":
  name: Behind The Monestary
  description: >
    This room contains little signs of life, there are no flowers or trees just menacing grass
    scattered all about . The room itself seems to be moving but after examining it closely the cause is known,
    the grass itself is moving about the room.  The church is directly to the west, and the blood trail
    runs to the east.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11584
    east:
      to: tba:115:room:11587
  extras:
  - keywords: [look, grass]
    text: The grass here is very odd it moves around and seems to shift right under your feet.

"tba:115:room:11586":
  name: An Apple Orchard
  description: >
    Apple trees in distinct rows fill this part of the garden.  Although they are small and young they
    still bear fruit.  Several baskets of apples lay about, full of rotting apples.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11594
    east:
      to: tba:115:room:11589
    south:
      to: tba:115:room:11587
    west:
      to: tba:115:room:11584

"tba:115:room:11587":
  name: Behind The Monestary
  description: >
    The church lies directly to the south.  There are small roses and daisies scattered about uprooted
    as if someone drug something about the room.  The blood trail is lying on the ground pointing to the
    east.  The smell here is of death, there is a foul odor that occupies this room.  There are no signs
    of what could be causing the smell here.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11586
    east:
      to: tba:115:room:11588
    west:
      to: tba:115:room:11585

"tba:115:room:11588":
