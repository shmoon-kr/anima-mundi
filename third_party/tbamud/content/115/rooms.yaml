  name: A Fenced in Path
  description: >
    The smell of a recent battle fills this path although a stiff breeze is desperately trying to
    dissipate it.  The tall black fence on both sides looks to have been the last attempted escape of a few
    soon to be corpses.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11560
    south:
      to: tba:115:room:11562

"tba:115:room:11562":
