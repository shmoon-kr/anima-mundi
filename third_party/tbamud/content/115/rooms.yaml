  description: >
    To the west is the monestary.  There is a strong fragrance of earth and flowers upon entering this
    room.  A small trail of blood leading to the south. There are many different plants here and a few
    animals rummaging for food.
  sector: inside
  flags: [bfs_mark]
  exits:
