"tba:115:room:11581":
  name: Behind The Monestary
  description: >
    A row of corn to the west blocks out the rest of the garden.  The wall to the east leaves a narrow
    path to walk upon.  Small drops of blood can be seen on some dead leaves and grass.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11580
    east:
