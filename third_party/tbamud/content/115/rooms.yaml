# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 115.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:115:room:11500":
  name: A Forested Path
  description: >
    There are many different and lovely plants around you here, there are tall trees, plump bushes, and
    an assortment of fine flowers And grass.  But to the north there is a building that looks almost
    like an old church.  There is also a faint sound of water running near by . Here lies a dirt path
    leading to the north.  To the east is a small garden.  To the west there are trees and a forested path.
  sector: forest
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11501
      door:
        keywords: [door]
        kind: door
    east:
      to: tba:115:room:11534
    west:
      to: tba:115:room:11515
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builders  : Polar
        Zone         : 115 Monastery Omega
        Began        : 1999
        Player Level : 3-7
        Rooms        : 100
        Mobs         : 43
        Objects      : 24
        Shops        : 0
        Triggers     : 1
        Theme        : A monastery being attacked by monsters, monks attempt to defend themselves.
        Notes        : From room 11500 to the north is the monestary/church, to the east is a small
                       garden with a stream. To the west there is a forest until about room 11547
                       which north of that lies the battlegrounds. Path going all the way around the
                       monastery. This zone includes a link to the Doom Priest Guild with guildmaster
                       and guildguard.
        
        Zone: 115 was linked to the following zones:
        200 Western Highway                at 11500 (south) ---> 20003

