      There is a very large creature sitting about the clouds blowing ice down on you and the surrounding
      area.

"tba:115:room:11582":
  name: Behind The Monestary
  description: >
    A brush pile of twigs and dead leaves has been stacked against the Monastery wall to the west.  A
    pile of the leaves are matted down and covered in blood as if a wounded animal rested there.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11581
    east:
