  name: Behind The Monestary
  description: >
    Here lies a small area of grass and small flowers to the east of the church. This appears to be a
    private place for the people that occupied the monestary. There are parts of gardens mix matched
    around as if someone has been looking for something.  There are small gardening tools scattered about as
    if everyone left in a rush.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:115:room:11590
    south:
      to: tba:115:room:11580
    west:
      to: tba:115:room:11545
  extras:
  - keywords: [gardening, tools]
    text: >
      There is blood on the tip of one of the tools, it seems that someone attacked the people that were
      here.  There is also a small trail of blood leading to the south .

"tba:115:room:11547":
  name: Entrance to the Battlegrounds
  description: >
    This area seems to be an entrance to a very old building ressembling the monastery but older in
    many ways.  It looks as if this building wasn't quite completed before it was ransacked by someone.
  sector: field
  flags: [no_mob, bfs_mark]
  exits:
    north:
      to: tba:115:room:11550
    east:
      to: tba:115:room:11548
    south:
      to: tba:115:room:11529

"tba:115:room:11548":
  name: A Turn in the Path
  description: >
    A large building to the northwest looks like it may have been built at the same time as the
    monastery to the west.  Except, it is much smaller and in even worse condition.  The path forks here going
    east, west, and south.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:115:room:11549
    south:
      to: tba:115:room:11527
    west:
      to: tba:115:room:11547

"tba:115:room:11549":
  name: Path To The East
  description: >
    A metal fence runs east and west before a large open field to the north. It seems to stretch to an
    old building to the west.  The open field beyond is littered with objects that are not quite
    discernable from here.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:115:room:11532
    south:
      to: tba:115:room:11528
    west:
      to: tba:115:room:11548

"tba:115:room:11550":
  name: Entering the Battlegrounds
  description: >
    You work your way into a collapsed building.  The roof and walls have all collapsed, leaving only
    the frame and part of the southern wall and roof standing.  What looks like a trampled battlefield can
    be seen to the north, east, and west.
  sector: inside
  flags: [no_mob, indoors, bfs_mark]
  exits:
    north:
      to: tba:115:room:11557
    east:
      to: tba:115:room:11551
    south:
      to: tba:115:room:11547
    west:
      to: tba:115:room:11558

"tba:115:room:11551":
  name: Along the Southern Fence
  description: >
    The corpse of a monk is impaled upon the black steel fencing to the south. Several other
    unidentifiable corpses litter the grassy field.  A few rats scatter as you disturb their eating.  The battle
    must have been recent since none of the corpses have yet begun to bloat.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:115:room:11556
    east:
      to: tba:115:room:11552
    west:
      to: tba:115:room:11550

"tba:115:room:11552":
  name: Along the Southern Fence
  description: >
    Among the corpses of monks lays a few other humanoids.  Upon closer examination you can see the
    remains of a troll, riddled with makeshift spears that seem to have been crafted from gardening tools.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11555
    east:
      to: tba:115:room:11553
    west:
      to: tba:115:room:11551

"tba:115:room:11553":
  name: The Southeastern Corner of the Battlefield
  description: >
    The monks have quite a body count here.  Corpses litter the grassy field. Several vultures hiss and
    take flight at your disturbance.  The cool air mists over several of the bodies that are still warm.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11554
    west:
      to: tba:115:room:11552

"tba:115:room:11554":
  name: Along the Eastern Fence
  description: >
    A large corpse of a centaur is surrounded by a dozen dead monks.  It looks like a lucky monk
    managed inflict a mortally wounding blow with a shovel to the head of the giant beast.  The shovel is still
    embedded in the centaurs head.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11569
    south:
      to: tba:115:room:11553
    west:
      to: tba:115:room:11555

"tba:115:room:11555":
  name: The Battlegrounds
  description: >
    Corpses of monks lay about the field, several renderred limb from limb by a very powerful foe.  A
    few makeshift weapons lay scattered uselessly about. The monks of Omega never were known for their
    fighting abilities.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11568
    east:
      to: tba:115:room:11554
    south:
      to: tba:115:room:11552
    west:
      to: tba:115:room:11556

"tba:115:room:11556":
  name: The Battlegrounds
  description: >
    The grassy field has been trampled and plowed into an earthen mess.  Large hoofprints and
    unnaturally large footprints are evident in the freshly turned earth.  Some outlined in blood.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11567
    east:
      to: tba:115:room:11555
    south:
      to: tba:115:room:11551
    west:
      to: tba:115:room:11557

"tba:115:room:11557":
  name: The Battlegrounds
  description: >
    The corpses of a few slimy green or yellow orcs are scattered among the monk corpses.  It seems the
    monks were able to hold their own against the smaller and less intelligent orcs.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11566
    east:
      to: tba:115:room:11556
    south:
      to: tba:115:room:11550
    west:
      to: tba:115:room:11564

"tba:115:room:11558":
  name: The Western Fence
  description: >
    The remains of several monks lay dismembered and still steaming in the cool air.  One monk twitches
    occasionally.  Seemingly to deny his fate.  More death and murder is everwhere except to the west
    where a tall metal fence blocks the way.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:115:room:11564
    east:
      to: tba:115:room:11550
    south:
      to: tba:115:room:11559

"tba:115:room:11559":
