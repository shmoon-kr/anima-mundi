# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 263.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:263:room:26300":
  name: Outside the West Gate
  description: >
    You stand just outside the west gate of Jareth, fabled city of freedom and equality.  The Western
    Road runs west from here into farmlands.  To the north is a deep, tangled forest.
  sector: field
  exits:
    east:
      to: tba:257:room:25756
    west:
      to: tba:263:room:26301
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           *Farmlands of Jareth - by Kaan for Dibrova
        This zone was made as a connector to other zones, a basic filler zone full
        of low level mobs and eq.  DragonSpyre, the Corn Maize, the Sinister Forest,
        Jher, and Ofingia all connect off this zone on Dibrova.  It is not a
        particularly stand-out zone, but is a decent enough connector zone.
        Links: 00n, 15e, 32e, 49n, 95s
        Zone 263 is linked to the following zones:
        257 Jareth Main City               at 26300 (east ) ---> 25756

"tba:263:room:26301":
  name: Western Road
  description: >
    Just west of you is a fork in the road, which splits northwest and southwest from the main road. 
    East of you is the entrance to the city of Jareth.
  sector: field
  exits:
    east:
      to: tba:263:room:26300
    west:
      to: tba:263:room:26302

"tba:263:room:26302":
  name: Western Fork
  description: >
    The road forks here, heading north and south, both directions turning west again immediately.  It
    looks as if the northern path heads toward the mountains and some deep forest, while the southern road
    heads deep into the farmlands outside Jareth.  East is the entrance to the city.
  sector: inside
  exits:
    north:
      to: tba:263:room:26349
    east:
      to: tba:263:room:26301
    south:
      to: tba:263:room:26304

"tba:263:room:26303":
  name: DragonTooth Road
  description: Currently under construction - comr bsck soon!
  sector: inside
  exits:
    south:
      to: tba:263:room:26302

"tba:263:room:26304":
  name: Western Road
  description: >
    The road heads west into the farmlands which feed most of Jareth.  Northeast from here, you see the
    gates to the city of Jareth.  To the south begins a long, dusty trail which heads out into a very
    desolate looking plains area.
  sector: field
  exits:
    north:
      to: tba:263:room:26302
    west:
      to: tba:263:room:26305

"tba:263:room:26305":
  name: Western Road
  description: >
    The road runs east and west from here, with farmsteads lying to the west. It seems that this road
    must be a well policed area, judging from the traffic passing you by, all with almost no regard for
    their safety, as if the last thing on their mind would be that they might be waylaid or attacked. 
    Northeast from here, you see the gates to Jareth, west the road continues toward a large lake and the
    many farms of this area.
  sector: field
  exits:
    east:
      to: tba:263:room:26304
    west:
      to: tba:263:room:26306

"tba:263:room:26306":
  name: Western Road
  description: >
    The road runs east and west from here.  To the north, a small farm lies nestled in a large
    pasture.  From the smell of it, it must be a dairy farm.
  sector: field
  exits:
    north:
      to: tba:263:room:26307
    east:
      to: tba:263:room:26305
    west:
      to: tba:263:room:26310

"tba:263:room:26307":
  name: Dairy Farm
  description: >
    As you enter through the wood gates which keeps the cows from running away, you realize that if you
    plan to stay here for any length of time, you will need to watch your step very carefully.  A barn
    lies to your north, to the south is the main Western Road.
  sector: inside
  exits:
    north:
      to: tba:263:room:26308
    south:
      to: tba:263:room:26306

"tba:263:room:26308":
  name: Hay Barn
  description: >
    Aaaahhh-Chooo!  The hay from this place makes your eyes itch and your nose run.  A few stalls lie
    along the east wall for milking, and a ladder leads up into the loft.
  sector: inside
  exits:
    south:
      to: tba:263:room:26307
    up:
      to: tba:263:room:26309

"tba:263:room:26309":
  name: Hay Loft
  description: >
    The hay and dust and heat of this room makes it almost hard for you to breathe.  Hay lies stacked
    neatly on the west side of this room, ready to feed the cows with.
  sector: inside
  exits:
    down:
      to: tba:263:room:26308

"tba:263:room:26310":
  name: Western Road
  description: >
    The roads runs east and west throught the many farmsteads of this area.  To the west, you see a
    large lake, and to the south a dirt driveway leads to a large farmhouse.
  sector: field
  exits:
    east:
      to: tba:263:room:26306
    south:
      to: tba:263:room:26311
    west:
      to: tba:263:room:26318

"tba:263:room:26311":
  name: Driveway
  description: >
    This dirt drive leads south to a huge horse farm.  This must be where all the horses for the city
    are raised, bred and sold at market.  The drive leads south to the farm itself or you may head north
    onto the Western Road.
  sector: inside
  exits:
    north:
      to: tba:263:room:26310
    south:
      to: tba:263:room:26312

"tba:263:room:26312":
  name: Driveway
  description: >
    The drive leads south to a large dirt court in front of the home and barn of Girschwyn the
    Horseman.  To the north drive continues until it T's off on the Western Road.
  sector: inside
  exits:
    north:
      to: tba:263:room:26311
    south:
      to: tba:263:room:26313

"tba:263:room:26313":
  name: Dirt Court
  description: >
    This dirt court is used mainly for the loading and unloading of the many fine steeds Girschwyn
    sells to his customers.  A large barn lies to the north, Girschwyn's home lies to the west and the fields
    lie directly south.
  sector: inside
  exits:
    north:
      to: tba:263:room:26312
    east:
      to: tba:263:room:26314
    south:
      to: tba:263:room:26316
    west:
      to: tba:263:room:26317

"tba:263:room:26314":
  name: Barn
  description: >
    This huge edifice holds stall upon stall for the many horses Girschwyn and his team of professional
    stablemen raise and train.  To the south is the entrance to the fields, and west leads out into the
    dirt court.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:263:room:26315
    west:
      to: tba:263:room:26313

"tba:263:room:26315":
  name: Pasture
  description: >
    This pasture seems to go on forever.  All around you horses graze or sleep, almost all of them seem
    to be of fine, quality stock.  Better watch out, though, if Farmer Girschwyn finds you here, he may
    get the wrong idea.  To the east is a huge field of corn which you may enter into.  Be careful,
    though, it looks like it would be pretty easy to get lost in there.
  sector: field
  exits:
    north:
      to: tba:263:room:26314
    west:
      to: tba:263:room:26316

"tba:263:room:26316":
  name: Pasture
  description: >
    This field is so immense, you cannot see the end of it to the south.  Horses graze or sleep
    everywhere and anywhere.  To the north is the dirt court, and east is more field.
  sector: field
  exits:
    north:
      to: tba:263:room:26313
    east:
      to: tba:263:room:26315

"tba:263:room:26317":
  name: Girschwyn's Home
  description: >
    This house is not the opulent horse baron's house you would have expected from a rich horse trader
    like Girschwyn.  Instead, it is a comfortable country home, complete with worn couches and an old
    fireplace, which is currently not lit.  The exit from this fine home is to the east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:263:room:26313
  extras:
  - keywords: [play]
    text: You punch out an old tune about a boy named Johnny B Good.  You rock!

"tba:263:room:26318":
  name: Western Road
  description: >
    The road heads east through the many farms of Jareth city limits.  To the west is the shore of a
    huge lake.  The path seems to split, heading around the lake in both directions.
  sector: field
  exits:
    east:
      to: tba:263:room:26310
    west:
      to: tba:263:room:26319

"tba:263:room:26319":
  name: Lake's Edge
  description: >
    The road splits off here, going it's separate ways around the lake, one split heading north, one
    heading south.  The trail also heads east through the fertile farmlands of Jareth.
  sector: field
  exits:
    north:
      to: tba:263:room:26336
    east:
      to: tba:263:room:26318
    south:
      to: tba:263:room:26320

"tba:263:room:26320":
  name: Lake's Edge
  description: >
    The road heads west and north from here, around the lake.  You see a farm to the southwest.
  sector: field
  exits:
    north:
      to: tba:263:room:26319
    west:
      to: tba:263:room:26321

"tba:263:room:26321":
  name: Lake's Edge
  description: >
    The road heads east and west from here.  Just west of you, a dock juts out into the lake.  Across
    the road from the dock is farmstead, with rows upon rows of wheat and corn growing in the fields just
    south of here.
  sector: field
  exits:
    east:
      to: tba:263:room:26320
    west:
      to: tba:263:room:26322

"tba:263:room:26322":
  name: Lake's Edge at the Dock
  description: >
    A dock runs out into the water just north of you, most probably used for fishing.  Just south of
    you is a moderate-sized farmstead.  The road runs east and west from here.
  sector: field
  exits:
    north:
      to: tba:263:room:26323
    east:
      to: tba:263:room:26321
    south:
      to: tba:263:room:26324
    west:
      to: tba:263:room:26328

"tba:263:room:26323":
  name: Dock
  description: >
    This small wooden dock seems just a bit too rickety for you to feel all that comfortable.  Doesn't
    seem to bother Erik, though, the little guy seems perfectly content here, swaying on this old
    construct.
  sector: field
  exits:
    south:
      to: tba:263:room:26322

"tba:263:room:26324":
  name: Farmstead
  description: >
    This average sized, fenced-in farm yard holds the machinery and animals needed to plow, plant, mow
    the fields which this farm is responsible for maintaining.  South and east of you are wheat and corn
    fields, respectively. Just west of you is a house.  The road is just north of you.
  sector: field
  exits:
    north:
      to: tba:263:room:26322
    east:
      to: tba:263:room:26325
    south:
      to: tba:263:room:26326
    west:
      to: tba:263:room:26327

"tba:263:room:26325":
  name: Corn Field
  description: >
    Row upon row of corn surrounds you.  The leaves tickle you as you brush by them, the stalks swaying
    gently with the breeze.
  sector: field
  exits:
    west:
      to: tba:263:room:26324

"tba:263:room:26326":
  name: Wheat Field
  description: >
    Looks as is the wheat crop has already been harvested for this year.  The ground, strewn with mud
    and leaves, looks as if it has seen some large machinery come through lately.
  sector: field
  exits:
    north:
      to: tba:263:room:26324

"tba:263:room:26327":
  name: Farm House
  description: >
    This single story, one room home holds the main dining table, bunks, and cooking facilities for
    Krandle and all of his farmhands.  Looks as if the wheat and corn industry may not be the most
    profitable one in Jareth.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:263:room:26324

"tba:263:room:26328":
  name: Lake's Edge
  description: >
    The road runs east and west from here, around the lake.  A farm lies just southeast of you, to the
    northeast you see a dock which leads out into the lake.
  sector: field
  exits:
    east:
      to: tba:263:room:26322
    west:
      to: tba:263:room:26329

"tba:263:room:26329":
  name: Lake's Edge
  description: >
    The road turns here, heading north and east around the lake.  Just north of here, the road splits
    off from the lake and heads west into the farmlands.
  sector: field
  exits:
    north:
      to: tba:263:room:26330
    east:
      to: tba:263:room:26328

"tba:263:room:26330":
  name: Lake's Edge
  description: >
    The road splits here, heading north and south around the lake, but also heading off west into more
    farmland.
  sector: field
  exits:
    north:
      to: tba:263:room:26331
    south:
      to: tba:263:room:26329
    west:
      to: tba:263:room:26337

"tba:263:room:26331":
  name: Lake's Edge
  description: >
    The road makes a turn, following the lake shore, heading east and south.  To the south you see that
    the road splits away from it's course around the lake and heads west out into farmland.
  sector: field
  exits:
    east:
      to: tba:263:room:26332
    south:
      to: tba:263:room:26330

"tba:263:room:26332":
  name: Lake's Edge
  description: >
    The road continues to twist and turn it's way around the lake shore.  You may continue north and
    west from here.  Strangely enough, a path seems to lead right into the water, and it looks as if the
    path continues on into the depths of the lake.
  sector: field
  exits:
    north:
      to: tba:263:room:26333
    west:
      to: tba:263:room:26331

"tba:263:room:26333":
  name: Lake's Edge
  description: >
    The road turns again, running along the lake's edge.  You may head east or south from your current
    locale.
  sector: field
  exits:
    east:
      to: tba:263:room:26334
    south:
      to: tba:263:room:26332

"tba:263:room:26334":
  name: Lake's Edge
  description: >
    The road makes another turn here, allowing passage west and south from here. You think you may see
    a small path leading north throught the high grass and into the forest, but you can't be sure.
  sector: field
  exits:
    north:
      to: tba:263:room:26348
    south:
      to: tba:263:room:26335
    west:
      to: tba:263:room:26333

"tba:263:room:26335":
  name: Lake's Edge
  description: >
    The road turns again, heading north and east.  The lake you are following along seems quite large,
    and across on the opposite shore, you think you may see a bit of aqueduct work.  This lake is most
    probably the water source for most of the farmers in the area.
  sector: field
  exits:
    north:
      to: tba:263:room:26334
    east:
      to: tba:263:room:26336

"tba:263:room:26336":
  name: Lake's Edge
  description: >
    The road follows the shore of this large lake, twisting and turning as the lake's edge demands. 
    You may head west or south from here.  To the south, you see that the road splits away from it's
    travels around the lake and heads east into the country.
  sector: field
  exits:
    south:
      to: tba:263:room:26319
    west:
      to: tba:263:room:26335

"tba:263:room:26337":
  name: Western Road
  description: >
    The road runs west, heading out of the farmlands and into a more damp climate region.  East of you,
    the road splits, following around a large lake's edge. To the north, you see the last farmstead on
    this western edge of Jareth's City Limits.
  sector: field
  exits:
    north:
      to: tba:263:room:26338
    east:
      to: tba:263:room:26330
    west:
      to: tba:263:room:26342

"tba:263:room:26338":
  name: Farm
  description: >
    The rickety, unpainted wooden fence surrounding this yard looks as if it has seen better days,
    assuredly.  The yard is littered with debris, some of which you probably should not even try guessing
    it's origin, and the smell - whoa. There is a barn north of here, it's rickety walls barely standing.
  sector: field
  exits:
    north:
      to: tba:263:room:26339
    south:
      to: tba:263:room:26337

"tba:263:room:26339":
  name: Smelly Barn
  description: >
    Better hope you didn't wear you blue suede shoes, pal, because they are now black suede shoes if
    you did.  The amount of excrement piled everywhere in this barn makes keeping your feet clean an
    impossibility.  West of you is a pig yard and east is the chicken yard.  South exits into open, clean air.
  sector: field
  exits:
    east:
      to: tba:263:room:26340
    south:
      to: tba:263:room:26338
    west:
      to: tba:263:room:26341

"tba:263:room:26340":
  name: Chicken Yard
  description: >
    The yard here is so cluttered with chickens clucking around your feet, you almost trip and fall. 
    All the chickens cluster around you, waiting for you to throw them some seeds.
  sector: field
  exits:
    west:
      to: tba:263:room:26339

"tba:263:room:26341":
  name: Pig Wallows
  description: >
    This disgusting, soupy mess that is called a pig's home is beyond gross. The pigs here roll on
    their back in shallow puddles, looking as pigs in... Well, you know.  Kind of makes you glad you never
    decided to be a farmer, eh?
  sector: field
  exits:
    east:
      to: tba:263:room:26339

"tba:263:room:26342":
  name: Western Road
  description: >
    The road heads east and west.  To your east, Jareth's many farmlands can be entered, leading
    eventually the city itself.  West of you the unknown begins. The land on either side of the road seems to
    be getting a bit more soft and wet, as if you may be coming into a swampy region.
  sector: field
  exits:
    east:
      to: tba:263:room:26337
    south:
      to: tba:253:room:25317
    west:
      to: tba:263:room:26343

"tba:263:room:26343":
  name: Western Road
  description: >
    The road still heads to the east and west from here, however there is a small path leading through
    some twisty, gnarled trees to your north.
  sector: field
  exits:
    north:
      to: tba:263:room:26345
    east:
      to: tba:263:room:26342
    west:
      to: tba:263:room:26344

"tba:263:room:26344":
  name: Western Road
  description: >
    The road runs east to west from you.  To the east you can see a few farmsteads dotting the
    countryside, where the land flattens out and allows for that sort of work to be done.  The way west leads
    toward the ever-present Dragon Tooth Mountains, which seem to surround this whole land.
  sector: field
  exits:
    east:
      to: tba:263:room:26343
    west:
      to: tba:263:room:26346

"tba:263:room:26345":
  name: Murky Path
  description: >
    This path does not seem all too dry or friendly, nor do the trees which begin to be more prevalent
    the farther north you go.  The way becomes darker from the trees that seem to close in around the
    path and your senses scream at you to go back.
  sector: forest
  exits:
    south:
      to: tba:263:room:26343

"tba:263:room:26346":
  name: Western Road
  description: >
    Further and further into the mountains you travel, the maples and oaks of the farmlands giving way
    to evergreens and more versatile shrubbery.  The path continues it's way west and east from you and a
    small offshoot heads south as well.
  sector: mountains
  exits:
    east:
      to: tba:263:room:26344
    south:
      to: tba:263:room:26350
    west:
      to: tba:263:room:26352

"tba:263:room:26347":
  name: Gnarled and Twisty Path
  description: This zone not yet complete - come again soon!
  sector: forest
  exits:
    south:
      to: tba:263:room:26345

"tba:263:room:26348":
  name: Small Dark Path
  description: >
    The path immediately leaves behind the cheery farmland and lake area to the south, becoming
    completely enclosed by trees and tall growth.  It heads north deeper into the dark forest, but a word to the
    wise, south looks much more safe and inviting.
  sector: forest
  flags: [dark, no_track]
  exits:
    south:
      to: tba:263:room:26334

"tba:263:room:26349":
  name: Thinning Trail
  description: >
    The trail all but disappears almost immediately as you begin your way north toward the forest just
    ahead.  You begin to feel the beginnings of a very bad feeling in your gut, one that can only be
    described as terror, the kind of terror that only nameless, faceless unknowns can inspire.  Your gut
    tells you that ahead lies trouble, pain, and possibly death.  The lake and the farmlands south of you
    begin to look very friendly through the trees, now.  This is your chance to turn back...
  sector: forest
  exits:
    south:
      to: tba:263:room:26302

"tba:263:room:26350":
  name: Rocky Path
  description: >
    This is barely sutable to be called a path at all, as you can hardly make it through the jumble of
    rocks and boulder which litter the way.  Just south of you it looks as if the path may come to a dead
    end.  The mountain wall rises alongside you to the east high into the clouds.  There is a crack in
    the mountain face just east of here.
  sector: mountains
  exits:
    north:
      to: tba:263:room:26346
    east:
      to: tba:263:room:26301
    south:
      to: tba:263:room:26351

"tba:263:room:26351":
  name: A Dead End Path
  description: >
    The path has come to a dead end before a huge boulder set into the side of a tall rocky cliff.  The
    only apparent way out of here is north, the way you came from .
  sector: mountains
  exits:
    north:
      to: tba:263:room:26350
    south:
      to: tba:263:room:26300
      door:
        keywords: [boulder]
        kind: door
        reset: closed

"tba:263:room:26352":
  name: Western Road
  description: >
    More and more, evidence of mountain country becomes evident the farther west you travel.  The road
    is now more loose stones and pebbles scattered over large rocks and boulders rather than the hard
    packed dirt that was the road back in the farmlands.  You see that the road crosses a natural bridge to
    the west, both sides of the road sloping steeply down in forestlands.  There have been no rails
    erected so you probably should watch your step.  And watch for loose gravel!
  sector: mountains
  exits:
    east:
      to: tba:263:room:26346
    west:
      to: tba:263:room:26353

"tba:263:room:26353":
  name: Western Road
  description: >
    You stand at the eastern end of the long natural bridge that spans either side of a deep, dark
    forest.  A forest who's floor lies close to five hundred feet below where you now stand.  The way to the
    west looks precarious, at best, the east looks much more safe.  Do you REALLY think you need to go
    west?
  sector: mountains
  exits:
    east:
      to: tba:263:room:26352
    west:
      to: tba:263:room:26354

"tba:263:room:26354":
  name: Western Road
  description: >
    You stand on this sliver of rock jutting up from the forest floor, the road just wide enough for
    one cart.  You look to either side and try and suppress the shiver that threatens to run through your
    body and knock your balance off kilter.  Of course, most of the terror you feel is in your head, you
    have a good three feet of width, you still feel very uneasy about your current location and
    situation.  Amazingly, you see that there is some sort of trail leading down the north and south sides of the
    cliff, way down deep into the dark forests below. You would have to be insane to try and climb down
    that 'trail'!
  sector: mountains
  exits:
    north:
      to: tba:266:room:26600
    east:
      to: tba:263:room:26353
    west:
      to: tba:263:room:26355

"tba:263:room:26355":
  name: Western Road
  description: >
    You stand high above the rest of the world, or so it seems, standing here on this jut of rock that
    rises up from the forests below.  To the east the rock walkway heads toward safe, lush ground which
    heads toward Jareth's farmlands. To the west the walkway leads you deeper into a mountainous region, a
