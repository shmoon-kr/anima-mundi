"tba:263:room:26356":
  name: Western Road
  description: >
    Just west of you is solid, safe ground, but here, where you now stand, is definitely NOT solid safe
    ground.  You stand on a tall rock walkway which spans between two cliff faces roughly five hundred
    feet apart.  The walkway runs east toward the far face which seems lush with vegetation and life.  The
    western face, which you stand very close to now, seems to be the exact opposite of the eastern
    face.  Jumbled rock and scree litter the ground near the walkway's start, but no trace of greenery can you
    see anywhere.  Looking down, you see that the walkway spans over very large and very dark forests,
    one on either side.  Caution might be advised when crossing this bridge.
