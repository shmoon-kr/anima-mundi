    south:
      to: tba:322:room:32235
    west:
      to: tba:322:room:32251

"tba:322:room:32253":
  name: The End of Dock 3
  description: >
    The folk at the end of the dock who are not workers for one of the many travel agencies recline
    lazily in brightly painted benches or tap their feet impatiently while waiting for their ship to
    arrive.  It seems the travel industry booms mightily in McGintey!
  sector: inside
  exits:
    north:
      to: tba:322:room:32269
    east:
      to: tba:322:room:32254
    south:
      to: tba:322:room:32236
    west:
      to: tba:322:room:32252

"tba:322:room:32254":
  name: Dock Area
  description: >
    The water splashes against the wood slats of the docks, muffled by the enclosure of the docks
    themselves and the shops which are parked here. Seagulls swoop and dive at the dead fish that might have
    been caught on a ship's rudder or keel.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32270
    east:
      to: tba:322:room:32255
    south:
      to: tba:322:room:32237
    west:
      to: tba:322:room:32253

