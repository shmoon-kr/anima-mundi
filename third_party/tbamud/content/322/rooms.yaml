"tba:322:room:32246":
  name: Nearing the Docks of McGintey
  description: >
    The water here is still deep, but much more calm as it reaches closer to the docks of the city. 
    The steep rock walls of McGintey Rock rises on the east side, the Rock being the foundation which
    McGintey Cove rests upon.
  sector: inside
  exits:
    north:
      to: tba:322:room:32263
    south:
      to: tba:322:room:32229
    west:
      to: tba:322:room:32245

"tba:322:room:32247":
  name: Dock Area
  description: >
    The water is quite calm here, as it laps gently against the rock face of McGintey Rock, the rock
    which the seaport city of McGintey rests upon.  The docks of the city lie to the east, full of ships
    and people.
  sector: inside
  exits:
    east:
      to: tba:322:room:32248
    south:
      to: tba:322:room:32230

"tba:322:room:32248":
  name: Dock Area
  description: >
    The calm, still waters of the Bay are only broken when a ship comes or goes from the docks to the
    east.  Most of the ships docked along this area appear to be cargo haulers, the type to carry large
    amounts of goods over long distances.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32264
    east:
      to: tba:322:room:32249
    south:
      to: tba:322:room:32231
    west:
      to: tba:322:room:32247

"tba:322:room:32249":
  name: The End of Dock 1
  description: >
    If it is possible, the hustle and bustle of this dock seems even more pronounced here at the end. 
    The workers seem almost frantic to unload the ships which seem to come and go in nonstop motion from
    the Bay.
  sector: inside
  exits:
    north:
      to: tba:322:room:32265
    east:
      to: tba:322:room:32250
    south:
      to: tba:322:room:32232
    west:
      to: tba:322:room:32248

"tba:322:room:32250":
  name: Dock Area
  description: >
    The water is constantly being churned about by rowers and ships' rudders as they negotiate their
    way into the docks on either side.  Off to the south, beyond the dock area is the Bay and beyond that
    the huge expanse of the Yllythad Sea, its broad borders some say might never be charted by man.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32266
    east:
      to: tba:322:room:32251
    south:
      to: tba:322:room:32233
    west:
      to: tba:322:room:32249

"tba:322:room:32251":
  name: The End of Dock 2
  description: >
    Ships move their way in and out of docking unceasingly, shipping passengers and cargo alike on and
    off their decks.  Crewmembers of ships shout out orders, captains curse and dockmen grunt and sweat
    their way through just another day on the docks.
  sector: inside
  exits:
    north:
      to: tba:322:room:32267
    east:
      to: tba:322:room:32252
    south:
      to: tba:322:room:32234
    west:
      to: tba:322:room:32250

