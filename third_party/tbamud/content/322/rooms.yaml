"tba:322:room:32244":
  name: Nearing the Docks of McGintey
  description: >
    The docks of McGintey lie just north of here, a bustle of sea travel all around as ships nudge
    their way in past each other in an attempt to get to dock first.  The water here is much more calm than
    that to the south which is closer to the open sea.  The current here does not pull and tug quite so
    much.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32261
    east:
      to: tba:322:room:32245
    south:
