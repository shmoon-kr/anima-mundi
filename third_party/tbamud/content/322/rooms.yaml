"tba:322:room:32230":
  name: Nearing the Docks of McGintey
  description: >
    The dock area lies to the north, ships moving in and out constantly.  The sea has lost its
    influence over the waters here, the only waves from that of passing ships.  The rocky face of McGintey hems
    in on the west and south sides, forming the natural walls of the bay.
  sector: inside
  exits:
    north:
      to: tba:322:room:32247
    east:
