"tba:322:room:32275":
  name: Dock 6
  description: >
    These are the private docks of the wealthy citizens of McGintey.  Space on these docks can be
    rented for a nominal fee in order that a resident of McGintey might keep their craft close by and in good
    order.  Indeed, many of the owners of the craft docked here live aboard them as well.
  sector: inside
  exits:
    north:
      to: tba:318:room:31843
    east:
      to: tba:322:room:32276
    south:
      to: tba:322:room:32259
    west:
      to: tba:322:room:32274

