"tba:322:room:32264":
  name: Dock Area
  description: >
    The main docks to McGintey Cove lie east of here, the machinery used for unloading the cargo of the
    commercial business crafts hanging over the sides of the dock and the street itself.  There are many
    ladders which climb the docks, all spaced at even intervals.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:322:room:32265
    south:
      to: tba:322:room:32248

"tba:322:room:32265":
  name: Dock 1
  description: >
    With all the hustle and bustle of this dock, it is hard to see how any sort of order is kept at
    all.  Workermen bump and muscle their way past you in attempts to get cargo unloaded and ships on their
    way.
  sector: inside
  exits:
    north:
      to: tba:318:room:31849
    east:
      to: tba:322:room:32266
    south:
      to: tba:322:room:32249
    west:
      to: tba:322:room:32264

"tba:322:room:32266":
  name: Dock Area
  description: >
    The commercial docks of McGintey loom above, the business docks to the west and the commercial
    travel docks to the east.  There are small ladders built against the framework of the docks allowing
    access to the top of the docks. The smell here is something beyond awful, the layers of goo and grime in
    the water so close to the city almost untolerable.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:322:room:32267
    south:
      to: tba:322:room:32250
    west:
      to: tba:322:room:32265

"tba:322:room:32267":
  name: Dock 2
  description: >
    This dock is almost as confused as the people who walk upon it.  The west side, used for the
    loading and unloading of precious cargos from around the world, is a bustle of frantic activity and
    motion.  The east side, used to dock the commercial sea crafts of the travel agencies in McGintey, is a
    serene, comfortable area where travelers stroll along nonchalantly, boarding their craft leisurely as
    most of them are on vacation.
  sector: inside
  exits:
    north:
      to: tba:318:room:31848
    east:
      to: tba:322:room:32268
    south:
      to: tba:322:room:32251
    west:
      to: tba:322:room:32266

"tba:322:room:32268":
  name: Dock Area
  description: >
    The docks above are bustling with activity, ropes hanging down from the sides of the docks and
    ships alike.  The yellig and cursing and general movement can be heard all about as sea craft move in and
    out of the port.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:322:room:32269
    south:
      to: tba:322:room:32252
    west:
      to: tba:322:room:32267

"tba:322:room:32269":
  name: Dock 3
  description: >
    This dock is dedicated solely to the commercial travel business of McGintey and as such is clean
    and opulent.  The nasty sea smell that is so frequent at large city's docks is gone, replaced by a pine
    scented clean smell that is applied hourly.  The docks themselves are painted with and green to
    compliment the color of the sea.
  sector: inside
  exits:
    north:
      to: tba:318:room:31847
    east:
      to: tba:322:room:32270
    south:
      to: tba:322:room:32253
    west:
      to: tba:322:room:32268

"tba:322:room:32270":
  name: Dock Area
  description: >
    The sounds of midshipsmen calling out departure times and the tromp of feet on the docks to either
    side assail the senses.  McGintey's commercial travel docks lie to the east and west.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:322:room:32271
    south:
      to: tba:322:room:32254
    west:
      to: tba:322:room:32269

"tba:322:room:32271":
  name: Dock 4
  description: >
    This is a commercial travel dock for the various travel agencies which operate out of McGintey. 
    Ships are docked all along the length of the dock, their bright streamers and colorful banners riding
    high above their decks.
  sector: inside
  exits:
    north:
      to: tba:318:room:31846
    east:
      to: tba:322:room:32272
    south:
      to: tba:322:room:32255
    west:
      to: tba:322:room:32270

"tba:322:room:32272":
  name: Dock Area
  description: >
    The greasy smell of water tainted by city folk and their dumping of garbage is the smell that fills
    the air.  The water here has a slight sheen to it, almost an oily tint that is layer on top of the
    water itself.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:322:room:32273
    south:
      to: tba:322:room:32256
    west:
      to: tba:322:room:32271

"tba:322:room:32273":
  name: Dock 5
  description: >
    This dock is the last, or first - depending on the way one is traveling, in a row of docks devoted
    solely to the moving of commercial travel ships in and out of the Bay.  The wood of the dock is
    painted with fresh bright paint, the men and women who work along it all dressed in finery and ready to
    tend to any customer's whim.
  sector: inside
  exits:
    north:
      to: tba:318:room:31842
    east:
      to: tba:322:room:32274
    south:
      to: tba:322:room:32257
    west:
      to: tba:322:room:32272

