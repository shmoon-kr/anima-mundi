    west:
      to: tba:322:room:32231

"tba:322:room:32233":
  name: Nearing the Docks of McGintey
  description: >
    The docking area lies just north from here, constant motion and tumult in the sea as ships push
    their way past each other in attempts to unload passenger or cargo first.  The water only swells now
    from passing ships, the roll of the high waves almost completely gone so close to shore.
  sector: inside
  exits:
    north:
      to: tba:322:room:32250
    east:
      to: tba:322:room:32234
    south:
      to: tba:322:room:32216
    west:
      to: tba:322:room:32232

"tba:322:room:32234":
  name: Nearing the Docks of McGintey
  description: >
    The dock area of McGintey lies just north of here, ships running in and out of docking in constant
    motion.  The immensity of the docking area alone is enough to stagger any sailor, besides the fact
    that it represents only a tiny fraction of the size of McGintey Cove.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32251
    east:
      to: tba:322:room:32235
    south:
      to: tba:322:room:32217
    west:
      to: tba:322:room:32233

"tba:322:room:32235":
  name: Nearing the Docks of McGintey
  description: >
    The docking area lies just north from here, constant motion and tumult in the sea as ships push
    their way past each other in attempts to unload passenger or cargo first.  The occasional ship that
    passes by hosts a deck of cheering sailors as they end what is assumed to be a long journey over the seas
    to a place where they might rest their sea legs for a day or two before once again heading out
    toward a foreign port.
  sector: inside
  exits:
    north:
      to: tba:322:room:32252
    east:
      to: tba:322:room:32236
    south:
      to: tba:322:room:32218
    west:
      to: tba:322:room:32234

"tba:322:room:32236":
  name: Nearing the Docks of McGintey
  description: >
    The docks of McGintey lie just north of here, a bustle of sea travel all around as ships nudge
    their way in past each other in an attempt to get to dock first.  The docks lie just north of here, the
    waves gently lapping against their wood planking.
  sector: inside
  flags: [no_mob]
  exits:
