"tba:322:room:32258":
  name: Dock Area
  description: >
    This section of the dock area is relatively quiet, as quiet as an dock area can be, anyway.  The
    boats here are not near as large as the ones docked off to the east, most of the ones here belonging to
    individual owners who pay a rent to keep their boats here.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32274
    east:
      to: tba:322:room:32259
    south:
      to: tba:322:room:32241
    west:
      to: tba:322:room:32257

"tba:322:room:32259":
  name: The End of Dock 6
  description: >
    The quiet rocking of the boats docked here and the occasional bump of a ships side against the
    padded sides of the docks are all that can be heard from this dock.  The men and women who walk along it
    share a mutual respect for the others who use it, as most are private owners of sea craft that get
    docked here by paying a rental fee.  Loud raucous noise can be heard almost in a quiet roar from the
    west where the commercial boating companies ply their trade.
  sector: inside
  exits:
    north:
      to: tba:322:room:32275
    east:
      to: tba:322:room:32260
    south:
      to: tba:322:room:32242
    west:
      to: tba:322:room:32258

"tba:322:room:32260":
  name: Dock Area
  description: >
    The boats that are docked here are more permanent fixtures than those to the west that ride in and
    out of port usually within a day or less.  As such, the water here much more calm and much more
    clean, the smell almost tolerable.
  sector: inside
  flags: [no_mob]
  exits:
