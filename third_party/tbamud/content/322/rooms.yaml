"tba:322:room:32200":
  name: Breakwaters of McGintey Bay
  description: >
    The water of the bay and the water from the Yllythad meet each other in protesting currents, making
    the water here a constant roil of unpredictable motion.  Sailors that move past this area do so in a
    hurried manner, making sure that their ships are not dashed against the cliff face the encloses the
    bay.
  sector: inside
  exits:
    north:
      to: tba:322:room:32207
    east:
      to: tba:322:room:32201
    south:
      to: tba:319:room:31903
