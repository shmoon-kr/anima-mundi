"tba:322:room:32232":
  name: Nearing the Docks of McGintey
  description: >
    The western end of McGintey's docks lie just north from here, a great commotion of movement visible
    upon the docks as workers haul and grunt the loads off of the ships carrying it into port.  The wide
    open expanse of McGintey Bay lies to the north, opening up into the immense Yllythad Sea and beyond.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:322:room:32249
