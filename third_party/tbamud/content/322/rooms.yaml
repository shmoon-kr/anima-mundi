"tba:322:room:32205":
  name: Near the Breakwaters
  description: >
    The cove walls come to a last curve before opening up into the waters of the Yllythad.  McGintey
    Cove lies to the north, its walls high above the sea on McGintey Rock, the dock area at sea level,
    allowing sailors to load and unload their cargo.
  sector: inside
  exits:
    north:
      to: tba:322:room:32217
    east:
      to: tba:322:room:32206

"tba:322:room:32206":
