"tba:242:room:24208":
  name: Razor's Square
  description: >
    Razor's Square is the southernmost square in Midgaard. South of you is wall road, while to the
    north you can see most of the city of Midgaard. You can see some street vendors here, standing inside
    small kiosks. You can see everything from cheap jewelry to leather jackets for sale.
  sector: city
  exits:
    north:
      to: tba:242:room:24202
    east:
      to: tba:242:room:24209
    south:
      to: tba:242:room:24214
