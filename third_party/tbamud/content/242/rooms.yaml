"tba:242:room:24201":
  name: Emerald Avenue
  description: >
    You are on Emerald Avenue. The road looks brand new, as do the shops and buildings that line the
    road. This is obviously the newer part of Midgaard. People are bustling about, while street vendors are
    trying hard to sell hotdogs and other less legal merchandise. Streetlights can be seen along the
    road, and you also notice the odd tree.
  sector: city
  exits:
    north:
      to: tba:242:room:24219
    east:
      to: tba:242:room:24202
    south:
      to: tba:242:room:24223
    west:
      to: tba:242:room:24200

"tba:242:room:24202":
  name: The Southern Square
  description: >
    You find yourself in the middle of the Southern Square. Tall buildings stand all around you,
    blocking out much of the sunlight. A twenty foot high stone statue of a man stands here, surrounded by a
    ring of bushes and flowers. From all around you, you can hear the bustle of daily city life in
    Midgaard. The central bridge is north, leading to the old part of Midgaard.
  sector: city
  exits:
    north:
      to: tba:242:room:24218
    east:
      to: tba:242:room:24203
    south:
      to: tba:242:room:24208
    west:
      to: tba:242:room:24201
  extras:
  - keywords: [stone, statue, man]
    text:
      preformatted: |2
           The statue is of a man, looking up to the sky. He's dressed in a
        suit, and he's wearing a top hat. At the base of the statue is
        a plaque, which looks like this:
             x-----------------------------------------------x
             | . SOUTHERN MIDGAARD RECONSTRUCTION MONUMENT . |
             |                                               |
             |      Completed on Friday, March 29, 2002.     |
             |                                               |
             |          "The old south was a mess,           |
             |            this one is the best!"             |
             | .                                           . |
             x-----------------------------------------------x

