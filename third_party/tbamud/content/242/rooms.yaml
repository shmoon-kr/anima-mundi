      to: tba:242:room:24207

"tba:242:room:24209":
  name: Razor's Road
  description: >
    You are on Razor's Road. The road looks brand new, as do the shops and buildings that line the
    road. This is obviously the newer part of Midgaard. People are bustling about, while street vendors are
    trying hard to sell hotdogs and other less legal merchandise. A portion of the roof juts out from the
    northern building, just above the door. The overhang sticks out about ten feet from the building, and
    is about twenty feet wide. All along the bottom edge of it are lightbulbs. A double glass door leads
    north, while a few signs have been set up here on the sidewalk. You recognize this as the entrance
    to the Midgaard Theater.
  sector: city
  exits:
    north:
      to: tba:242:room:24226
    east:
      to: tba:242:room:24210
    south:
      to: tba:242:room:24229
    west:
      to: tba:242:room:24208
  extras:
  - keywords: [sign, signs]
    text:
      preformatted: |2
           The signs are all the same, and they look like this:
