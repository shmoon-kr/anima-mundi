"tba:242:room:24212":
  name: Southwest Gate
  description: >
    You are walking next to the western city wall, at the southwest gate. The gate is currently up,
    allowing people to freely pass. A dusty path leads south to the forest of Miden'Nir (Goblinic for 'Green
    Blood'). You can still see the city to the east, but if you go south, there is fresh air and
    greenery.
  sector: city
  exits:
    north:
      to: tba:242:room:24206
    east:
      to: tba:242:room:24213

