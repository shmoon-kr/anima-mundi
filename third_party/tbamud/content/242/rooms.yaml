"tba:242:room:24276":
  name: Curling Club Coffee Shop
  description: >
    You're inside the Midgaard Curling Club Coffee Shop. A rounded wooden bar sits along the eastern
    wall, and behind it you see several tables covered with glasses, and a large stove. About a dozen
    tables are here, waiting for people to sit at them. Several thickly plated windows look out onto the
    street to the south. The actual building looks very solid, as if it was made to withstand an earthquake.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:242:room:24275

"tba:242:room:24277":
  name: Spectator's Area
  description: >
    You find yourself at the far left end of the spectator's area of the curling club. An enormous
    window looks south onto the curling rink. Many wooden chairs are here, lined up facing the window. Behind
    you, a large bulletin board has been attached to the wall. It's covered with posters and
    advertisements. At the top of the wall is a railing. A set of doors leads north onto the ice.
  sector: inside
  flags: [indoors]
