"tba:242:room:24217":
  name: Southeast Gate
  description: >
    You are walking next to the western city wall, at the southeast gate.  The gate is closed and seems
    to have been that way for a long time.  You are walking next to the western city wall, at the
    southeast gate.  The gate is closed, blocking all passage and seems to have been that way for a long time.
  sector: city
  exits:
    north:
      to: tba:242:room:24211
    west:
      to: tba:242:room:24216

"tba:242:room:24218":
  name: On the Central Bridge
  description: >
    The central bridge is the main connection between northern and southern Midgaard. The bridge is
    constructed from iron support beams and concrete. It looks very solid. From below, you can see the
    swiftly flowing river, leading east and west. The tall buildings of southern Midgaard dominate the
    southern skyline, while you can see the huge temple of Midgaard off in the north.
  sector: city
  exits:
    south:
      to: tba:242:room:24202

"tba:242:room:24219":
  name: The Bank of Midgaard
  description: >
    You enter the doors and you find yourself in the bank of Midgaard. It's a very large room, with
    high ceilings and a shiny polished floor. Large windows let in light, giving the bank a bright glow. A
    long desk spans the entire western wall, and behind it stand several tellers, looking bored. An
    immensely thick steel door leads north, to the vault.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24234
      door:
        keywords: [door]
        kind: pickproof
        key: tba:242:obj:24298
        reset: locked
    south:
      to: tba:242:room:24201

"tba:242:room:24220":
  name: The Cooland Press Office
  description: >
    You find yourself in a quiet newspaper office. A row of darkly tinted windows look out onto the
    street, making this place fairly dark. A high desk stands directly in front of you, and from behind it
    you can see many desks with computers on them. Journalists are seated, typing up stories for the
    Cooland Press.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:242:room:24203

"tba:242:room:24221":
  name: The Southern Docks
  description: >
    You're on the docks on the southern side of the river. The wooden docks have been built fairly high
    off the river, making it impossible to access the river from here. Several large crates and barrels
    are scattered around here. Across the river, you can see the levee.
  sector: city
  exits:
    east:
      to: tba:242:room:24222
    south:
      to: tba:242:room:24204

"tba:242:room:24222":
  name: The Southern Docks
  description: >
    You're on the docks on the southern side of the river. The wooden docks have been built fairly high
    off the river, making it impossible to access the river from here. Across the river, you can see a
    building that looks like an old warehouse.
  sector: city
  exits:
    south:
      to: tba:242:room:24205
    west:
      to: tba:242:room:24221

"tba:242:room:24223":
  name: The Computer Store
  description: >
    The computer store is the only one of its kind in Cooland. This store is very large, with very high
    ceilings and bright lights. Wide shelves, twenty feet high, run the entire length of the store.
    Aisles run in between them. Computer parts of all kinds are neatly stacked on the shelves. Several
    checkouts are located beside the door.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24201

"tba:242:room:24224":
  name: Clothing Store
  description: >
    You're in the Midgaard clothing store. It's a fairly small shop, with rather low ceilings. Racks of
    clothing totally fill the store, making it almost impossible to move. You can faintly hear some
    classical music being played.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24204

"tba:242:room:24225":
  name: South Gardens
  description: >
    You leave the street and enter a beautiful garden. Tall trees of all kinds are growing here, and a
    winding gravel path leads to a set of benches in the middle. You can see flowers growing along the
    path. Even though you're in the middle of the city, you feel as though you're in a deep forest. As your
    eyes adjust to the lower light, you notice a rope softly swaying in the wind, behind a thick tree.
  sector: city
  exits:
    south:
      to: tba:242:room:24207
    up:
      to: tba:242:room:24235

"tba:242:room:24226":
  name: Midgaard Theater
  description: >
    You find yourself inside the lobby of the Midgaard Theater. A rich navy blue carpet covers the
    floor, while expensive looking wallpaper covers the walls. An elaborate chandelier hangs from the
    ceiling. A small ticket booth is located near the front door.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:242:room:24238
    south:
      to: tba:242:room:24209
    west:
      to: tba:242:room:24236

"tba:242:room:24227":
  name: City Hall
  description: >
    You're inside the Midgaard City Hall. It's a large domed room, almost circular in shape, with a
    round skylight at the top, looking to the sky. The walls are all solid wood. A large U shaped desk sits
    in the middle of the room, where the secretary usually sits. A beautifully carved staircase leads up
    to the mayor's office.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:242:room:24210
    up:
      to: tba:242:room:24298

"tba:242:room:24228":
  name: An Empty Room
  description: >
    You're inside a completely empty room.  The walls are barren and the floor is covered in dust.  A
    few small tracks, most likely from rodents or cockroaches, can be seen in the dust.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24207

"tba:242:room:24229":
  name: An Empty Room
  description: >
    You're inside a completely empty room.  The walls are barren and the floor is covered in dust.  A
    few small tracks, most likely from rodents or cockroaches, can be seen in the dust.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24209

"tba:242:room:24230":
  name: Midgaard Public School
  description: >
    You're inside the main lobby of Cooland's only school (no, we're not counting that monkey school in
    Ape Village). Everything looks neat and tidy, which is surprising for a public school. You notice
    the odd student walking past you, giving you funny looks.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24210

"tba:242:room:24231":
  name: The Midgaard Cafe
  description: >
    The Midgaard Cafe is a nice little place, where people can come to eat lunch or have snacks. The
    entire southern wall is covered in windows, looking out onto Wall Road. Many round tables are scattered
    throughout the room, with people seated around many of them. Plants and small potted shrubs are also
    scattered around.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:242:room:24213

"tba:242:room:24232":
  name: The Cityguard Headquarters
  description: >
    You're in the cityguard headquarters. It's a large room, completely filled with desks and filing
    cabinets. Guards are here, talking on the phones and writing down stuff in books. They're ready to be
    dispatched to whoever needs help.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:242:room:24215

"tba:242:room:24234":
  name: The Bank of Midgaard - Vault
  description: >
    You find yourself inside the bank vault. Row upon row of stainless steel safety deposit boxes cover
    the walls. Three rows of extremely bright lights shine down on you, making everything completely
    visible. It would be impossible to hide in here.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:242:room:24219
      door:
        keywords: [door]
        kind: pickproof
        key: tba:242:obj:24298
        reset: locked

"tba:242:room:24235":
  name: The top of the Tree
  description: >
    You climb the rope, and find yourself on a wooden platform at the top of the tree. From here, you
    have an excellent view of Midgaard. From out of nowhere, a thick chain falls out of the sky, right in
    front of your face. It leads up into the clouds above.
  sector: city
  exits:
    down:
      to: tba:242:room:24225

"tba:242:room:24236":
  name: Theater Office
  description: >
    You're in the theater office. Posters from past performances cover the walls, and a thick dark
    carpet covers the floor. An ancient looking wooden desk sits in far end of the room, covered with papers
    and old documents. Only a single reading lamp is on, making this room fairly dark.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:242:room:24226

"tba:242:room:24237":
  name: Theater Corridor
  description: >
    You're in the main theater corridor. The walls and ceiling have been painted black, and the floor
    is also black. A dark wooden door leads south to the main part of the theater.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:242:room:24241
    east:
      to: tba:242:room:24238

"tba:242:room:24238":
  name: Snack Booth
  description: >
    You're in the main theater corridor, at the snack booth. A bar has been built into the northern
    wall, and behind it a glass-doored fridge and a selection of snacks can been seen. In between scenes,
