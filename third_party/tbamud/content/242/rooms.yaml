"tba:242:room:24290":
  name: Locker Room
  description: >
    You're in a locker room. Blue lockers run the entire length of the room, and benches sit in front
    of them. You notice the odd gym bag sitting on top of the lockers. At the back of the room you notice
    a door, leading north.
