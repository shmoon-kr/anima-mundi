"tba:242:room:24291":
  name: Passageway
  description: >
    You're in an old dark passageway. The paint is peeling off the walls, and a single light bulb hangs
    from the ceiling. The floor is cement, and has scuff marks all over it. The passage is quite wide.
    It seems as though this hall used to be used for hauling equipment and goods. A rough wooden door here
    leads south.
