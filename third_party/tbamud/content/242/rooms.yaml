"tba:242:room:24271":
  name: Midgaard Curling Club Entrance Hall
  description: >
    You're in the entrance hall of the Midgaard Curling Club. A gray carpet runs down the hallway,
    where it ends at a set of stairs leading up and to the east. The walls are a pale beige color, and an
    ancient looking tile ceiling is slowly rotting away. This place looks like it's at least fifty years old.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:242:room:24272
    south:
      to: tba:242:room:24216

"tba:242:room:24272":
  name: Curling Club Entrance Stairs
  description: >
    You're in the far end of the Midgaard Curling Club entrance hall. The gray carpet ends here, and a
    short set of stairs leads up to east. A large wooden door leads north, but it's blocked off.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:242:room:24271
    up:
      to: tba:242:room:24273

"tba:242:room:24273":
  name: Curling Club
  description: >
    You're inside the Midgaard Curling Club. A bar is located along the western wall, and several large
    round tables are scattered around. Each table has an ash tray on it, filled with ashes and cigarette
    butts. A railing runs across the northern part of the room, and ten feet below it is the spectators
    area. The wall in front of the spectators area is an enormous window, looking out onto the curling
    rink. A small green safe with a beer sticker on it sits in front of the railing, by the stairs leading
    down to the hallway.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:242:room:24274
    down:
      to: tba:242:room:24272

"tba:242:room:24274":
  name: Curling Club
  description: >
    You're inside the Midgaard Curling Club. Directly behind you, on a table, sits a 60" TV. Several
    large round tables are scattered around, and an ash trays sit on each one. A railing runs across the
    northern part of the room, but it curves downwards here opening up to a staircase. The wall in front of
    the spectators area is an enormous window, looking out onto the curling rink.
