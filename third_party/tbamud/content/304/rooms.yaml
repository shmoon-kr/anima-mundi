"tba:304:room:30410":
  name: The Stairwell
  description: >
    There is a beautiful curving stairwell leading upwards.  It seems to have been carved directly from
    stone.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:304:room:30407
      look: You see a room in the temple.
    up:
      to: tba:304:room:30413
      look: You can't really see much up those stairs.
  extras:
  - keywords: [stairwell]
    text: A work of great craftmanship!

