# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 304.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:304:room:30400":
  name: Aten's Zone Description Room
  description:
  - Temple of the Bull Written March 1994 22 rooms 7 mobs 10 regular objs 4 god objs
  - >
    These areas are FREE- however, if you use them: 1. Feel free to make whatever modifications you
    need, change mobs, objects, room descriptions etc.- but please make sure that signs and author
    references are unmodified and readable by players. 2. Please send me an e-mail message if you do use them, I'd
    just like to have some idea of where they end up (please include mud site)- my address is
    wjp@@hopper.unh.edu until Sept 1996 3. If you redistribute these areas, please make sure this README file goes
    with them :)
  - Bill Pelletier wjp@@hopper.unh.edu Aten/Talisman of GenericMUD
  sector: inside

"tba:304:room:30401":
  name: A Grassy Field
  description: >
    You are travelling across a great grassy field.  The wind blows softly, causing the ripe ends of
    the grass stalks to bob lazily back and forth.  To the north you spy what appears to be some sort of
    temple, its great white walls blazing with the light of the sun.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:304:room:30402
      look: You see the entrance to the temple.
  extras:
  - keywords: [grass]
    text: Looks like an average grass stalk.  You pluck one and put it in your mouth.

"tba:304:room:30402":
  name: Before the Temple
  description: >
    The dazzling white stone walls of the temple momentarily blind you.  Great columns are spaced
    evenly around the perimeter of the temple, and an arch beckons you inside.
  sector: field
  flags: [no_mob]
  exits:
    north:
      to: tba:304:room:30403
      look: There is an arch to the north.
    south:
      to: tba:304:room:30401
      look: Looks like a field back there.

"tba:304:room:30403":
  name: Under the Arch
  description: >
    Your eyes slowly adjust to the level of darkness under the protective shade of the arch.  To the
    north is a great marble door, which seems to be the best way to get inside the temple.  "Why the heck
    to I want to go in there ?", you think to yourself.  You shrug your shoulders and suddenly get the
    feeling that you are being watched.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:304:room:30405
      look: You see a great marble door.  It has a VERY nice polish.
      door:
        keywords: [door, marble]
        kind: pickproof
        key: tba:304:obj:30405
        reset: locked
    south:
      to: tba:304:room:30402
      look: You see a spot to stand before the temple.
  extras:
  - keywords: [marble]
    text: It is a remarkably well polished marble door.

"tba:304:room:30404":
  name: The Temple
  description: >
    The echo of your footsteps reverberates through the temple.  Everything is white, the tiled floor,
    the walls, the ceiling.....
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:304:room:30407
      look: You see a room in the temple.
    east:
      to: tba:304:room:30405
      look: You see a room in the temple.

