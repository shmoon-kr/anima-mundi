"tba:304:room:30408":
  name: The Atrium and Gardens
  description: >
    Beautiful green plants wind around bamboo poles here, leaves outfolded to catch the sun's rays
    coming in from the open sky.  The smell of rich dark earth overwhelms your senses, and a small brook
    winds beneath your feet.
  sector: field
  exits:
    north:
      to: tba:304:room:30411
      look: You see a room in the temple.
    east:
      to: tba:304:room:30409
      look: You see a room in the temple.
    west:
      to: tba:304:room:30407
      look: You see a room in the temple.
  extras:
  - keywords: [brook]
    text: What a nice little bubbling brook!
  - keywords: [plants]
    text: They seem to be doing very well, someone around here has a green thumb.

