      to: tba:304:room:30409
      look: You see a room in the temple.
    up:
      to: tba:304:room:30415
      look: You can't really see much up those stairs.

"tba:304:room:30413":
  name: The Upper Temple
  description: >
    You find yourself in a small room atop the stairs.  Strangely enough, this part of the temple has
    decorations.  The walls are covered with murals and furs.  A corridor leads off the the south, and the
    stairs offer a retreat downwards.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:304:room:30416
      look: You see a corridor.
    down:
      to: tba:304:room:30410
      look: You see the bottom of the stairs.
  extras:
  - keywords: [mural]
    text: The mural shows a great shaggy beast with two pointed horns.
  - keywords: [fur]
    text: The fur is brown, short, and coarse.

"tba:304:room:30414":
  name: Mateon's Chamber
  description: >
    You find yourself in a small, cramped chamber.  A window is set in the north wall, and a sturdy oak
    door is to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:304:room:30415
      look: There is an oak door there.
      door:
        keywords: [door, oak]
        kind: pickproof
        key: tba:304:obj:30406
        reset: locked
  extras:
  - keywords: [window]
    text: The window overlooks a grassy field.

"tba:304:room:30415":
  name: The Upper Temple
  description: >
    You find yourself atop a flight of stairs.  A sturdy oak door is to the west, a corridor leads
    south, and the stairs offer a path downwards.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:304:room:30418
      look: Looks like a corridor.
    west:
      to: tba:304:room:30414
      look: There is an oak door there.
      door:
        keywords: [door, oak]
        kind: pickproof
        key: tba:304:obj:30406
        reset: locked
    down:
      to: tba:304:room:30412
      look: You see the bottom of the stairs.

"tba:304:room:30416":
  name: The Corridor
  description: >
    You are standing in a drafty corridor.  There is a window set in the west wall, and a balcony to
    the east protects you from falling down into the gardens.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:304:room:30413
      look: You see the stairway.
    south:
      to: tba:304:room:30419
      look: Woah..looks like a dead end.  You get the chills.
  extras:
  - keywords: [balcony]
    text: Its a simple piece of polished wood.  You can see the gardens below.
  - keywords: [window]
    text: The window overlooks a grassy field.

"tba:304:room:30417":
  name: Aten's Chamber
  description: >
    You are standing in a comfortable chamber.  Sunlight streams in the the open windows, and a warm
    spring breeze ruffles your hair.  Thick furs cover the stone walls and floor.  A stained oak table
    dominates the center of the room, and couches line the walls.  You look out the window and are vaguely
    surprised that you can't see the ground.
  sector: inside
  flags: [indoors]

"tba:304:room:30418":
  name: The Corridor
  description: >
    You are standing in a drafty corridor.  There is a window set in the east wall, and a balcony to
    the west protects you from falling into the gardens.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:304:room:30415
      look: You see the stairway.
    south:
      to: tba:304:room:30421
      look: Can't really see much..its rather dark over there.
  extras:
  - keywords: [window]
    text: The window looks down upon a grassy field.
  - keywords: [balcony]
    text: Its a simple piece of polished wood.  You can see the gardens below.

"tba:304:room:30419":
  name: The Cul-de-Sac
  description: >
    The corridor comes to an abrupt halt here, and the only exit appears to be back the way you came.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:304:room:30416
      look: You see the corridor.

"tba:304:room:30420":
  name: The Bull's Chamber
  description: >
    This room is in TOTAL dissaray.  Items seem to have been swept of the room's numerous shelves and
    just dumped on the floor.  The room has an unfamiliar smell, and you wrinkle your nose in disgust.  An
    great sliding window is open to the south and leads to the balcony, and a heavy iron door is to the
    east.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:304:room:30421
      look: A heavy iron door is there.
      door:
        keywords: [door, heavy, iron]
        kind: pickproof
        key: tba:304:obj:30407
        reset: locked
    south:
      to: tba:304:room:30422
      look: You see the balcony over there.
  extras:
  - keywords: [shelves]
    text: The shelves have been swept clean.
  - keywords: [window]
    text: Its a great, big walk-through window.

"tba:304:room:30421":
  name: The Dark Chamber
  description: >
    You are in a shadowy chamber, and the hairs at the back of your neck begin to rise.  There is so
    little light in this room that you start to imagine things..  Or do you?  You know for certain that you
    spotted a door to the west when you first entered.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:304:room:30418
      look: You see the corridor.
    west:
      to: tba:304:room:30420
      look: A heavy iron door is there.
      door:
        keywords: [door, heavy, iron]
        kind: pickproof
        key: tba:304:obj:30407
        reset: locked

"tba:304:room:30422":
  name: The Balcony
  description: >
    You sense that you have reached journey's end.  The balcony overlooks a great grassy field.  The
    sun's rays blind you, and you hear a snort.
  sector: city
  exits:
    north:
      to: tba:304:room:30420
      look: You see the Bull's Chamber.
