"tba:40:room:4072":
  name: The Tunnel
  description: >
    You stand in a narrow tunnel.  It makes a turn from east to south here as it heads through the rock
    of the mountain.  The western wall of the tunnel looks to have broken through a small, natural crack
    in the rock to lead into what appears to be a fairly large cave.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4073
    south:
      to: tba:40:room:4074
    west:
      to: tba:40:room:4071

"tba:40:room:4073":
  name: The End Of The Tunnel
  description: >
    The tunnel comes to a sudden halt here.  How very bizarre.  The only exit is back to the west,
    where the tunnel leads back through the mountain.  There is absolutely nothing of any interest down at
    the end of this passageway either.  How odd.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:40:room:4072

"tba:40:room:4074":
  name: The Hole
  description: >
    You are at a small hole in the floor.  Alas, you can only leave north because to leave down into
    the unknown, you must be able to fit through the hole, which is far too small for you!
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4072
    down:
      look: The small hole in the floor refuses to give up its secrets about what can be found below.
  extras:
  - keywords: [hole, floor]
    text: The small hole in the floor refuses to give up its secrets about what can be found below.

"tba:40:room:4075":
  name: The Copse Of Trees
  description: >
    Standing in this copse of trees gives you an eerie feeling.  Off to the east you can see the
    plains, and just to the north a strange shadow seems to be changing shape constantly and almost seems to
    beckon you to enter it.
  sector: hills
  exits:
    north:
      to: tba:25:room:2500
      look: There is a strange shadow forming before you.
    east:
      to: tba:40:room:4036

"tba:40:room:4076":
  name: On A Mountain Trail
  description: >
    You find yourself on a mountain trail twisting down towards a small hidden valley located in the
    shadow of another mountain a short distance to the east.  The trail is fairly rough going and looks to
    dip down into the small valley before climbing up the side of the other mountain.  As you look at the
    valley from a closer vantage point, you realize that it is much smaller than you had expected, being
    maybe thirty feet long.  It is quite surprising how deceptive distances can be this high up in the
    mountains, isn't it?
  sector: mountains
  exits:
    west:
      to: tba:40:room:4040
    down:
      to: tba:40:room:4077

"tba:40:room:4077":
  name: In The Hidden Valley
  description: >
    This valley seems to be a complete waste of a climb down the mountainside.  Of course, there is
    always the carefully hidden trail that you just noticed on the eastern side of the valley, leading up
    the eastern mountain that is blocking most of the sky from you.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6400
    up:
      to: tba:40:room:4076

"tba:40:room:4078":
  name: In The Hidden Valley
  description: >
    This small valley is hidden away in the shadow of the large mountain to the east.  The trail
    leading up it to the east seems to vanish before your eyes, but you are quickly able to find it once
    again.  A trail leads up the mountain to the west as well.
  sector: mountains
  exits:
    east:
      to: tba:64:room:6400
    up:
      to: tba:40:room:4076
