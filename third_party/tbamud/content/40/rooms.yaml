# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 40.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:40:room:4000":
  name: The Hills
  description: >
    You are on a path leading north, small hills surround you. You feel the forces of evil approach you
    from the north.  Off in the distance to the northeast you can see the beginning of a large mountain
    range.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:40:room:4001
    south:
      to: tba:35:room:3500

"tba:40:room:4001":
  name: The Hills
  description: >
    You are on a small path leading north, dark threatening hills surround you on almost all sides.  A
    fair distance off to the north, you can see the enormous shadow of a strangely solitaire mountain.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:40:room:4002
    south:
      to: tba:40:room:4000

"tba:40:room:4002":
  name: The End Of The Path
  description: >
    The path stops here, to the north is a single mountain and around you are some threatening hills. 
    A small trail leads up the hillside through the rocks to a dark cave located to the north.  Off to
    the northeast, you can see the southern end of what appears to be a large mountain range.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:40:room:4010
    south:
      to: tba:40:room:4001

"tba:40:room:4010":
  name: The Cave
  description: >
    You are standing in a small cave, about fifteen feet across at the widest point and about forty
    feet long.  Off to the south you sense fresh air and you surmise that the entrance must be located off
    in that direction.  To the north a small tunnel continues into the mountain.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4011
    south:
      to: tba:40:room:4002

"tba:40:room:4011":
  name: The Tunnel
  description: >
    You force your way into a narrow tunnel, aided by the wet walls which help you slide through the
    passageway.  The smell of mouldy moss is growing greater the farther north you head, but you can smell
    fresh air off to the south as a light breeze wafts past you.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4014
    south:
      to: tba:40:room:4010

"tba:40:room:4012":
  name: The Tunnel
  description: >
    You find yourself at a turn in this narrow tunnel.  The tunnel appears to open up to the north into
    a cave of some sort while to the east it leads onwards through the mountain.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4016
    east:
      to: tba:40:room:4013

"tba:40:room:4013":
  name: The Tunnel
  description: >
    Standing in the middle of the dusty floor of this tunnel, you can see that it is not a highly
    travelled passageway.  It looks to lead in an east-west direction.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4014
    west:
      to: tba:40:room:4012

"tba:40:room:4014":
  name: The Tunnel
  description: >
    You find yourself at a small intersection of sorts in this tunnel. The main tunnel appears to curve
    from south to west but there is an entrance into a cave to the north.  The entrance itself looks to
    be unnatural and much more recent than the tunnel or even the cave.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4018
    south:
      to: tba:40:room:4011
    west:
      to: tba:40:room:4013

"tba:40:room:4015":
  name: The Tunnel
  description: >
    You clamber on through this narrow tunnel.  The walls are damp with condensation and the weight of
    the rock above you is beginning to make you feel almost claustrophobic.  The tunnel makes a jagged
    turn from west to north here.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4019
    west:
      to: tba:40:room:4014

"tba:40:room:4016":
  name: The Large Cave
  description: >
    You find yourself in a fairly large cave.  Large enough that the eastern and western ends are
    almots completely shrouded in darkness. A small tunnel breaks through the southern wall, and it too is
    full of shadows.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4017
    south:
      to: tba:40:room:4012
    west:
      to: tba:40:room:4023

"tba:40:room:4017":
  name: The Large Cave
  description: >
    You move along the cave to the west end of it and find that there appears to be no other exit from
    here.  The walls are fairly smooth and look to have been naturally carved out of the rock by the
    passage of water.
  sector: field
  flags: [dark, indoors]
  exits:
    west:
      to: tba:40:room:4016

"tba:40:room:4018":
  name: The Cave
  description: >
    You find yourself at the southern end of a cave as it begins to turn into a tunnel which leads off
    to the south.  The cave continues northwards deeper into the darkness. You notice a large pile of
    bones in the corner.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4025
    south:
      to: tba:40:room:4014
  extras:
  - keywords: [pile, bones]
    text: You had better watch out - some of the bones are human!

"tba:40:room:4019":
  name: The Tunnel
  description: >
    You stand in the middle of a fairly wide passageway that leads in a north-south direction.  The
    walls are quite smooth, almost as if a river had gouged them out of the earth.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4026
    south:
      to: tba:40:room:4015

"tba:40:room:4020":
  name: The Hole
  description: >
    You are standing in a small alcove off the main tunnel.  There is a fairly wide hole broken through
    the floor of the alcove.  The only other exit is to the north.
  sector: forest
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:40:room:4027
    down:
      to: tba:40:room:4064

"tba:40:room:4021":
  name: The Hole
  description: >
    As you stand at the end of this tunnel, you notice a large hole sitting in the floor by the
    northwestern corner of the walls.  The tunnel itself leads off towards the east.  The air here feels very
    damp and you feel like your clothes are becoming sticky with sweat.
  sector: forest
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:40:room:4022
    down:
      to: tba:41:room:4115

"tba:40:room:4022":
  name: The Damp Tunnel
  description: >
    You are standing in the middle of a damp tunnel.  The moisture in the air is so thick that you can
    almost seem it seeping into your clothes.  The tunnel continues to the north and west.  A large cave
    opens up to the east.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4024
    east:
      to: tba:40:room:4023
    west:
      to: tba:40:room:4021

"tba:40:room:4023":
  name: The Large Cave
  description: >
    You are in the western part of the large cave, to the east you can see a tunnel.  The air near the
    tunnel entrance is heavy with moisture, giving you a feeling as if you were standing in the rain. 
    The walls of the cave are almost totally shrouded in darkness and shadow as is the southern end of the
    cavern.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4016
    west:
      to: tba:40:room:4022

"tba:40:room:4024":
  name: The Damp Tunnel
  description:
  - >
    The tunnel you are in now is very humid, and the air seems to almost hang with moisture.  The walls
    drip with an almost constant water flow, and the ground is covered with small pools of stagnent
    water.
  - >
    The tunnel leads away to the south, and to the west you can feel that the air is even damper than
    here.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:40:room:4022
    west:
      to: tba:40:room:4059

"tba:40:room:4025":
  name: The Cave
  description: >
    You find yourself standing in the northern end of a reasonably large cave.  The cave wall to the
    east has an opening that appears to lead to a junction of several tunnels.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4026
    south:
      to: tba:40:room:4018

"tba:40:room:4026":
  name: The Many Tunnels
  description: >
    You find yourself standing in the midst of an intersection of numerous tunnels.  There is a musty
    smell emanating from the tunnel to the north, whilst the one to the west appears to open up almost
    immediately into a cave.  The tunnels to the south and east are totally shrouded in darkness.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4028
    east:
      to: tba:40:room:4027
    south:
      to: tba:40:room:4019
    west:
      to: tba:40:room:4025

"tba:40:room:4027":
  name: The Tunnel
  description: >
    You find yourself at an elbow turn in the tunnel as it turns to the west and north.  You spot a
    small alcove hidden in the shadows just to the south of you, and you can feel a breeze coming from
    somewhere to the north you believe.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4029
    south:
      to: tba:40:room:4020
    west:
      to: tba:40:room:4026

"tba:40:room:4028":
  name: The Smelly Tunnel
  description: >
    You are in a fairly small north-south leading tunnel.  There is a a small light visible off to the
    north.  As you stop for a moment, you notice a strange smell from the north.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4030
    south:
      to: tba:40:room:4026

"tba:40:room:4029":
  name: The Cave
  description: >
    You are in a cave that is filled with fresh air, you sense the wind blowing from the north.  To the
    south you see a small tunnel continue into the mountain.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4031
    south:
      to: tba:40:room:4027

"tba:40:room:4030":
  name: The Light Cave
  description: >
    You are in a light cave, through a hole large above you, you see the sky.  A small tunnel to the
    south is the only way out. You notice the source of the strange smell, all around you there are corpses
    of several monsters.
  sector: field
  flags: [indoors]
  exits:
    south:
      to: tba:40:room:4028
  extras:
  - keywords: [corpse, corpses]
    text: >
      Looking at the corpses lying around the cave, they all appear to have been torn to shreds by some
      large creature.  As a further not too unexpected point to note, they all smell terrible.

"tba:40:room:4031":
  name: The Valley
  description: >
    You are in a small valley, surrounded by hills and a mountain to the south.  In the mountain there
    is a cave.  To the north you can enter the hills.  There is a small trail leading up a steep hill to
    the east.
  sector: field
  exits:
    north:
      to: tba:40:room:4032
    east:
      to: tba:40:room:4045
      look: You spot a small trail leading into the hills to the east.
    south:
      to: tba:40:room:4029

"tba:40:room:4032":
  name: The Foothills
  description: >
    You are on a winding path that leads through the foothills on the north side of Mount Moria.  The
    path continues north.
  sector: hills
  exits:
    north:
      to: tba:40:room:4033
    south:
      to: tba:40:room:4031

"tba:40:room:4033":
  name: The Intersection In The Foothills
  description: >
    You stand at a point by a small path that splits off here.  The path continues north and south
    while a rough trail leads east into the mountains.
  sector: hills
  exits:
    north:
      to: tba:40:room:4034
    east:
      to: tba:40:room:4037
    south:
      to: tba:40:room:4032

"tba:40:room:4034":
  name: The Grassy Area In The Foothills
  description: >
    The grass here is unusually high.  You notice several areas where someone or something large has
    crushed spots of it down.  Several very large rocks litter this area.  You can go north towards the end
    of the foothills, west to go deeper into the foothills, or south to a small path intersection.
  sector: field
  exits:
    north:
      to: tba:40:room:4035
    south:
      to: tba:40:room:4033
    west:
      to: tba:40:room:4042

"tba:40:room:4035":
  name: At The Foothills' End
  description: >
    You find yourself standing at the northern edge of the foothills where they meet the plains which
    lie to the north.  You can head back into the foothills to the south or the plains to the north.
  sector: hills
  exits:
    north:
      to: tba:40:room:4036
    south:
      to: tba:40:room:4034

"tba:40:room:4036":
  name: The Plains
  description: >
    You are in the plains.  The path leads to the south.  As you look around you notice a small almost
    invisible trail leading away to the west towards a copse of trees.
  sector: field
  exits:
    south:
      to: tba:40:room:4035
    west:
      to: tba:40:room:4075

"tba:40:room:4037":
  name: The Path Through The Foothills
  description: >
    You stand on a path that leads through the foothills in an east-west direction.  Some distance off
    to the west you can see a small intersection of paths and off to the east you see that the path seems
    to come to an end as part of the mountain chain juts out of the ground, blocking your view of the
    sky.
  sector: hills
  exits:
    east:
      to: tba:40:room:4038
    west:
      to: tba:40:room:4033

"tba:40:room:4038":
  name: The Base Of The Mountain
  description: >
    You find yourself standing at the bottom of a large mountain in the mountain chain which begins at
    Mount Moria and stretches north towards the top of the world.  A small path leads off through the
    foothills towards the west, where you can see plains quite a ways away.  To the east you spot a small
    worn trail leading up the side of the mountain.
  sector: mountains
  exits:
    east:
      to: tba:40:room:4039
    west:
      to: tba:40:room:4037

"tba:40:room:4039":
  name: A Trail Up The Mountain
  description: >
    You stand partway up the mountainside on a narrow yet well worn trail.  The trail curves its way up
    the side of the mountain towards the top and westwards down the mountain into the foothills below.
  sector: mountains
  exits:
    west:
      to: tba:40:room:4038
    up:
      to: tba:40:room:4040

"tba:40:room:4040":
  name: The Mountain Top
  description: >
    You find yourself at what is essentially the summit of this mountain. It certainly seemed taller
    from the ground didn't it?  The plateau you stand on is close to thirty metres across and a small gouge
    in the north side of it looks to lead to a small cavern.  A small trail leads down towards a valley
    that was hidden away on the east side of the mountain.
  sector: mountains
  exits:
    north:
      to: tba:40:room:4041
    east:
      to: tba:40:room:4076
    down:
      to: tba:40:room:4039

"tba:40:room:4041":
  name: The Lion's Den
  description: >
    Following the gouge down to the cave entrance, you clamber through the small entranceway only to
    find yourself in what appears to be the living den of a large carnivorous animal!
  sector: field
  flags: [dark, indoors]
  exits:
    south:
      to: tba:40:room:4040

"tba:40:room:4042":
  name: The Level Foothills
  description: >
    You continue to move through the foothills and notice that off in the distance to the west, you can
    see a rather large cave entrance in the side of a large hill.  The hill seems to jut up from the
    rest of the foothills quite unnaturally.  A path leads off towards the east as it seems to begin from
    nothing here.
  sector: field
  exits:
    east:
      to: tba:40:room:4034
    west:
      to: tba:40:room:4043

"tba:40:room:4043":
  name: The Cave Entrance
  description: >
    You stand in a large tunnel, much larger than it seemed from the outside.  The ceiling is at least
    twenty feet above, and the width of the tunnel runs at least fifteen feet.  You can feel the fresh
    air coming from the east, and off to the west, it looks to lead into darkness.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:40:room:4042
    west:
      to: tba:40:room:4044

"tba:40:room:4044":
  name: The Hill Giant Cave
  description: >
    You find yourself inside a rather large cavern.  The ceiling stands at least twenty five feet above
    you, if not more.  The walls are so far away, that the shadows of the room obscure them almost
    completely.  Out of all of the grandeur in this cave however, nothing seems to catch your eye quite as
    much as the enormous table standing in the middle of the sandy floor.  It stands tall enough for you to
    walk under it without the need to hunch over.  A large tunnel leads out of the eastern wall of the
    cavern.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4043

"tba:40:room:4045":
  name: The Steep Trail
  description: >
    This trail leads up a steep hill to a point where it levels out as it begins to pass between the
    mountains that surround you.  It continues through the hills to the east and heads down to the valley
    to the west.
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:40:room:4046
      look: The rocky trail continues.
    west:
      to: tba:40:room:4031
      look: The valley lies at the bottom of the steep trail.

"tba:40:room:4046":
  name: Between The Mountains
  description: >
    The trail between the mountains seems almost endless as you continue to trek along it.  It
    continues to both the east and west.
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:40:room:4047
      look: The trail continues eastwards.
    west:
      to: tba:40:room:4045
      look: The trail continues westwards.

"tba:40:room:4047":
  name: The Foothills
  description: >
    After a long trek, you find yourself in the foothills again.  You spot a narrow trail leading away
    to the northwest not too far distant to the west.
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:40:room:4049
      look: You can head towards the narrow trail this way.
    west:
      to: tba:40:room:4046
      look: The trail leading back through the mountains seems to go on forever.

"tba:40:room:4048":
  name: The Foothills
  description: >
    A short trek through the foothills and you find yourself facing a trail that leads between the
    mountains to the west.  The trail through them looks to be very long and probably quite tiring.  You spot
    a narrow trail leading away to the northwest not too far distant to the west.
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:40:room:4049
      look: You can head towards the narrow trail this way.
    west:
      to: tba:40:room:4046
      look: The trail leading through the mountains seems to go on forever.

"tba:40:room:4049":
  name: The Foothills
  description: >
    You are at a point on the trail where it turns slowly from an almost straight westwards trail into
    a trail meandering towards the northwest.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:56:room:5628
      look: A small trail leads away to the northwest.
    west:
      to: tba:40:room:4048
      look: A trail heads towards the mountains to the west.

"tba:40:room:4050":
  name: The Tunnel
  description: >
    You are at a bend in the tunnel here.  It turns from an eastwards heading to a southwards one.  The
    walls are cold and seem to be damp with moisture.  you can see some greenish moss growing up near
    the roof of the passageway on the northern wall.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4051
    south:
      to: tba:40:room:4053

"tba:40:room:4051":
  name: The Tunnel
  description: >
    Standing in this part of the tunnel, you notice that not only does the tunnel get suddenly
    narrower, but the floor does not seem to be nearly as smooth as it was before.  In fact, the floor drops
    almost five feet in jagged steps as you look eastward.  The western path seems to be quite smooth however.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4052
    west:
      to: tba:40:room:4050

"tba:40:room:4052":
  name: The Tunnel
  description: >
    Continuing along the tunnel, you find that the floor has begun to smooth itself out once more. 
    Looking about, you notice a small spring of water bubbling up near the southern wall.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:41:room:4100
    west:
      to: tba:40:room:4051

"tba:40:room:4053":
  name: The Tunnel
  description: >
    You continue along the tunnel to find yourself at a right angle turn.  The passage leads north and
    east from here.  The way to the north seems to be a longer tunnel which continues on through the
    gloom of the underearth.  The way to the east is a fresh change from what would normally be found this
    far underground in that the tunnel seems to open  up into a fairly large and well lit cave.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4050
    east:
      to: tba:40:room:4054

"tba:40:room:4054":
  name: The Light Cave
  description: >
    The cave you stand in now is lit by an eerie flickering light, which probably comes from the
    enormous fire which is burning a short distance to the south in what looks to be the middle of the cave. 
    The flickering light creates some really strange and almost frightening shadows on the walls, almost
    hiding the two tunnels that lead away from here, one to the east and one to the west.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:40:room:4055
    south:
      to: tba:40:room:4056
    west:
      to: tba:40:room:4053

"tba:40:room:4055":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exit from here looks to be off to the west.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:40:room:4054

"tba:40:room:4056":
  name: The Light Cave
  description: >
    The cave you stand in now is lit by an eerie flickering light, which comes from the enormous fire
    which is burning right in front of you in the middle of this large cave.  The fire gives off more than
    enough light to see both the north and south ends of the cave.
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:40:room:4054
    south:
      to: tba:40:room:4061
  extras:
  - keywords: [fire]
    text: >
      The fire seems to have been burning for quite a long time.  The ceiling is covered with soot from
      the smoke, and ashes are littered all over the floor of the cave.

"tba:40:room:4057":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the north and south.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4055
    south:
      to: tba:40:room:4062

"tba:40:room:4058":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the south and west.
  sector: forest
  flags: [dark, indoors]
  exits:
    south:
      to: tba:40:room:4063
    west:
      to: tba:40:room:4057

"tba:40:room:4059":
  name: The Tunnel
  description:
  - >
    You are standing in a tunnel deep inside the heart of Mount Moria.  A small rivulet of water runs
    alongside the wall to the north as the tunnel seems to lead slightly down towards the east.
  - >
    The tunnel continues on to the east as it plunges deeper into the earth, and upwards a bit towards
    the west where the air seems to be quite damp.
  sector: forest
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:40:room:4060
    west:
      to: tba:40:room:4024

"tba:40:room:4060":
  name: The Tunnel
  description:
  - >
    You stand in a section of this small tunnel which seems to be almost level.  There is a small pool
    of water collecting beside the north wall indicating perhaps a low spot on the floor.  The pool is
    being fed by a small rivulet which is coursing along the northern wall from the west, but yet the water
    level in the pool does not seem to be changing.
  - >
    Looking either way down the tunnel, you can see that the tunnel climbs to the west, and to the
    east, a strange flickering light shows that the tunnel opens up into a cave of sorts.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4061
    west:
      to: tba:40:room:4059

"tba:40:room:4061":
  name: The Light Cave
  description: >
    The cave you stand in now is lit by an eerie flickering light, which probably comes from the
    enormous fire which is burning a short distance to the north in what looks to be the middle of the cave. 
    The flickering light creates some really strange and almost frightening shadows on the walls, almost
    hiding the two tunnels that lead away from here, one to the west and one to the south.
  sector: field
  flags: [indoors]
  exits:
    north:
      to: tba:40:room:4056
    south:
      to: tba:40:room:4065
    west:
      to: tba:40:room:4060

"tba:40:room:4062":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the east and west.
  sector: forest
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4063
    west:
      to: tba:40:room:4061

"tba:40:room:4063":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the east and north.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4058
    east:
      to: tba:40:room:4064

"tba:40:room:4064":
  name: The Tunnel
  description: >
    You stand in a small chamber beneath the earth.  The chamber closes down to tunnel size to the west
    as the only obvious exit leads away in that direction.  Before heading off that way, you decide to
    look around the cave.  The walls are slightly damp to the touch, and the ceiling is very smooth. 
    Almost right in the center of the ceiling, a well rounded hole has been made.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:40:room:4063
    up:
      to: tba:40:room:4020

"tba:40:room:4065":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the east and north.  To the
    north, you can see the entrance to what looks to be a large and well lit cave.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4061
    east:
      to: tba:40:room:4066

"tba:40:room:4066":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the east, south, and north. 
    To the south, the tunnel looks to open up into a cavern.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4062
    east:
      to: tba:40:room:4067
    south:
      to: tba:40:room:4069

"tba:40:room:4067":
  name: The Maze
  description: >
    You stand in yet another small and damp tunnel.  The ceiling hangs quite low overhead and the
    passage twists off into darkness.  The only exits from here look to be off to the west and north.
  sector: forest
  flags: [dark, indoors]
  exits:
    north:
