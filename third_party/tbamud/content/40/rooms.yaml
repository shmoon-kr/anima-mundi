    west:
      to: tba:40:room:4066

"tba:40:room:4068":
  name: The Large Cave
  description: >
    You find yourself in what is perhaps the largest cave you have ever been in.  It stretches through
    the darkness to the east and south.  The cave is nigh filled with echoes created by the sound of your
    breathing.  Stalactites and stalagmites hang down from the ceiling and climb upwards from the ground
    of the cavern respectively.
  sector: field
  flags: [dark, indoors]
  exits:
    east:
      to: tba:40:room:4069
    south:
      to: tba:40:room:4070

"tba:40:room:4069":
  name: The Large Cave
  description: >
    You find yourself in what is perhaps the largest cave you have ever been in.  It stretches through
    the darkness to the west and south.  The cave is nigh filled with echoes created by the sound of your
    breathing.  Stalactites and stalagmites hang down from the ceiling and climb upwards from the ground
    of the cavern respectively.  A narrow tunnel leads away from the cave to the north.
  sector: field
  flags: [dark, indoors]
  exits:
    north:
      to: tba:40:room:4066
    south:
      to: tba:40:room:4071
    west:
      to: tba:40:room:4068

