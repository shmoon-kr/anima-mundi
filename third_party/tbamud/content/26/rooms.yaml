"tba:26:room:2624":
  name: A Dark Room
  description:
  - >
    You are in a large dark room.  The stench here makes you gag and retch. There are body parts and
    half rotted corpses strewn about with complete abandon.  Several operating tables with still forms that
    resemble nothing you have ever seen alive are here.
  - Tortured screams can be heard from the north.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    north:
      to: tba:26:room:2625
      look: Gazing northwards, you are filled with deep dread.
    south:
      to: tba:26:room:2623

"tba:26:room:2625":
  name: The Necromancer's Lair
  description: >
    You are in the lair of the evil Necromancer.  Undead minions of all types, human and otherwise
    stand here waiting to do their master's bidding. Some glowing arcane sigils have been etched into walls
    and floor, no doubt to protect the evil master from his own ungodly creations.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    south:
      to: tba:26:room:2624

