"tba:26:room:2635":
  name: The Scrying Chamber
  description: >
    You are in the scrying chamber of the high tower of sorcerery.  It is here that arcane rituals are
    performed to enable those of the art to look in upon denizens throughout the world and spy out their
    darkest secrets. A huge black cauldron is in the center of the room, bubbling and gurgling, it pours
    forth a constant stream of smokey fog into the air about you.  Here and there on stands of different
    sizes are crystal balls and oddly shaped mirrors.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
