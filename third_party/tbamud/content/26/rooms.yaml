"tba:26:room:2637":
  name: The Entrance To The Library
  description: >
    You are in the entrance to the great library of magic.  A giant desk is here, covered with books
    parchments and scrolls.  Long shelves loaded with row upon row of books stretch out in every direction
    as far as the eye can see.
  sector: inside
  flags: [indoors, no_track]
  exits:
