  name: A Long Corridor
  description: >
    The corridor is wide and leads north and south.  Torches line the wall giving enough light to see
    that the corridor is completly empty.  To the south is a very long corridor and to the north is the
    end.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7553
      look: A Corridor.
    south:
      to: tba:75:room:7555
      look: A Corridor.

