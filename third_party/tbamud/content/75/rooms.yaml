"tba:75:room:7581":
  name: A Sandy Beach
  description: >
    To the west the ocean rolls in and out on to the beach carrying off the top layer of sand and
    leaving behind shells of various sizes most of which are just broken pieces.  The air is salty and warm as
    it blows in from the west.  The sand continues to the north and south.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7580
      look: A Sandy Beach.
    south:
      to: tba:75:room:7582
