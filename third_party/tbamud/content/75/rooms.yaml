"tba:75:room:7585":
  name: A Sandy Haven
  description: >
    The sandy beach drops off into a gentle slope.  The white sand is littered with footprints and
    various pieces of clothing.  To the south the sand comes to a drop off overlooking jagged rocks.  West
    the ocean rolls in onto the sand gently washing away several of the footprints.  East is a large
    cluster of trees.  To the north a sandy path out.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7584
      look: A Sandy Beach.
  extras:
  - keywords: [beach, sand]
    text: >
      This area of the beach appears to be private because of the ocean to the west, jagged rocks to the
      south, trees to the east and the only way out a sandy hill north.

"tba:75:room:7586":
  name: Market Row
  description: >
    The small road is well traveled with a few shops to each side.  Noise echos out from the shops from
    all the activity around them.  To the north stands a large building made of wood and large stones. 
    The road leads east and west.
  sector: city
  flags: [no_mob, bfs_mark]
  exits:
    north:
      to: tba:75:room:7590
      look: A Magic Shop.
    east:
      to: tba:75:room:7587
      look: A Path.
    west:
      to: tba:75:room:7577
      look: A Sandy Beach.

"tba:75:room:7587":
  name: Market Row
  description: >
    The ground of the road is packed firm from many travelers.  Noise echos out from the shops from all
    the activity around them.  To the south a native fruit stand sits.  To the east stands a small
    shop.  To road leads west.
  sector: city
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7588
      look: A Path.
    south:
      to: tba:75:room:7589
      look: A Fruit Stand.
    west:
      to: tba:75:room:7586
      look: A Path.

"tba:75:room:7588":
  name: A Small Shop
  description: >
    The small shop is clutted with all sorts of items.  The tables and shelves are overflowing with
    books, flasks, bags and other things.  A thick layer of dust covers everything.  Many of the books are
    old and in bad shape.  A door to the west leads out.
  sector: inside
  flags: [bfs_mark]
  exits:
    west:
      to: tba:75:room:7587
      look: A path
  extras:
  - keywords: [room, shop, floor, wall]
    text: It doesn't look like this shop has been cleaned in a very long time.

"tba:75:room:7589":
  name: A Fruit Stand
  description: >
    The stand is small and made of wood.  A young native man is standing behind the display of fruit he
    has for sale.  A small sign posted above him reads "Fresh Fruit."
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7587
      look: A Path.
  extras:
  - keywords: [fruit, stand, display]
    text: >
      Small baskets line the stand containing different types of fruit.  The different fruits all look
      very tasty and juicy.

"tba:75:room:7590":
  name: A Magic Shop
  description: >
    The small building is very clean and brightly lit.  To the north a long counter sits with a huge
    shelf behind it.  The shelf has several rows of flasks, vials, and small pouches of magic potions and
    powders.  On the counter displayed are cloth dolls, wooden figures, bones, feathers, different color
    candles and jars.
  sector: inside
  flags: [bfs_mark]
  exits:
    south:
      to: tba:75:room:7586
      look: A path.
  extras:
  - keywords: [jars, counter]
    text: The jars contain eyeballs, animal organs, herbs, and what resembles blood.

"tba:75:room:7591":
  name: Deep in the Forest
  description: >
    The forest is vibrant with the chirping and singing of several species of birds nestled in the
    trees.  A warm breeze gently blows in.  Not very many trees are here, but the ones that are have many
    wild flowers growing around them.  The trail leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7592
      look: The Forest.
    west:
      to: tba:75:room:7500
      look: The Forest.
  extras:
  - keywords: [forest, wood, tree]
    text: >
      To the west side of the forest the trees are full of song birds singing and chirping, to the east
      the trees are empty and quite.

"tba:75:room:7592":
  name: Deep in the Forest
  description: >
    The forest holds a bone chilling cold.  A thick layer of fog clings to everything making the forest
    gloomy and distorts the trees.  A gust of wind blows a patch of dead leaves all around.  The trail
    leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7593
      look: The Forest.
    west:
      to: tba:75:room:7591
      look: The Forest.
  extras:
  - keywords: [tree, forest, woods, fog]
    text: >
      A thick layer of fog seems trapped in this part of the forest.  Although the wind is blowing the
      fog doesn't appear to be moving only the dry leaves and small limbs of the trees seem to feel the wind.

"tba:75:room:7593":
  name: Deep in the Forest
  description: >
    The forest is dark and chilling as a stronger wind blows growing strong with every second.  The
    trees here are not very colorful with drab brown leaves. Somewhere deep in the forest a howl begins
    growing louder as the wind grows stronger.  The trail leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7594
      look: The Forest.
    west:
      to: tba:75:room:7592
      look: The Forest.
  extras:
  - keywords: [wolf, howl, tree, forest]
    text: >
      Everything seems frozen in place, nothing is moving or making a sound except for the distant
      howling.

"tba:75:room:7594":
  name: Deep in the Forest
  description: >
    The forest is darker with an eerie chill in the air.  The songs of the birds and the buzzing of
    insects are not here.  The forest is quite but not in a peaceful way.  This is too dreary a place
    perhaps for normal woodland creatures.  The trail lead east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7595
      look: The Forest.
    west:
      to: tba:75:room:7593
      look: The Forest.
  extras:
  - keywords: [tree, forest, wood]
    text: >
      The cold and quiteness the forest has taken on is very odd.  It is as if nothing living is here.

"tba:75:room:7595":
  name: Deep in the Forest
  description: >
    The trees take on a gloomy presence as they stretch their branches high into the sky.  Many of the
    branches are lost in a thick fog overhead.  The forest grows darker with a slight chill in the air. 
    The trail leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7596
      look: The Forest.
    west:
      to: tba:75:room:7594
      look: The Forest.
  extras:
  - keywords: [tree, forest, sky]
    text: An owl sits high in one of the trees.  Its large yellow eyes seems to see everything.

"tba:75:room:7596":
  name: A Forest Trail
  description: >
    The trees begin to block out the sky as they stretch high overhead.  The top of the trees are lost
    in the distance.  The forest is alive with chirping and singing from birds nestled in the trees.  The
    trail leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7597
      look: The Forest.
    west:
      to: tba:75:room:7595
      look: The Forest.
  extras:
  - keywords: [bird, tree]
    text: >
      Several different types of bird are scattered about the many trees singing, chirping and some
      resting.

"tba:75:room:7597":
  name: The Forest Trail
  description: >
    The forest is full of rich colors from the various trees and flowers growing here.  In the not so
    far distance the sounds of buzzing insects fill the forest.  The trail leads east and west.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7598
      look: The Forest.
    west:
      to: tba:75:room:7596
      look: The Forest.
  extras:
  - keywords: [tree, trail]
    text: A squirrel quickly scurries up the nearest tree.

"tba:75:room:7598":
  name: The Forest
  description: >
    The forest contains many different types of trees all quite beautiful. There are some trees with
    large pink flowers, trees with small blue blossoms, even the trees with no blossoms are eye catching. 
    A group of trees covered in huge leaves that change in a variety of shades from a golden yellow to a
    crimson red are the main species here.  The trees open into a wide gap large enough for a row of
    wagons.  The ground is clear of rocks but show no sign of wagon wheels.  The trail leads west into the
    forest.
  sector: inside
  flags: [bfs_mark]
  exits:
    west:
      to: tba:75:room:7597
      look: The Forest.
  extras:
  - keywords: [trail, road, path]
    text: >
      The trail is a hard, dry, firmly, packed dirt that looks easy to haul a large wagon on.  Perhaps at
      one time it had been a main road but now it is void of any type of tracks other than a few animal
      tracks.
