# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 75.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:75:room:7500":
  name: The Forests Edge
  description: >
    The forest appears calm and peaceful as the leaves and branches sway softly in the wind.  The trees
    almost appear to dance to the songs of the birds singing in them.  North the forest is darker and
    the trees much larger.  To the south the forest comes to an end and expands into a large open field.  A
    trail leads east and south.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7591
      look: Deep in the Forest.
    south:
      to: tba:75:room:7501
      look: An Open Field.
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Shimmer
        Zone         : 75 Zamba
        Began        :
        Player Level : 14-18
        Rooms        : 100
        Mobs         : 36
        Objects      : 53
        Shops        : 5
        Triggers     : 12
        Plot         : The town once thrived on tourism and had many profitable items.
           But a group of evil mages or clerics started going too far and rumors of
           evil things like sacrifices cause people to stop coming.  Many shopkeepers
           left when business died.  The ones that stayed learned to do without and
           went back to a more natural lifestyle, even in the fortress there were
           changes that could not be helped such as a more native attire or wearing
           things still around from the past, but where the fortress could continue as
           they did in the past they do.  Most of the people now don't even remember
           other towns and live a normal peaceful life.  The change was generations
           ago.  The order that was following the evil worship are still hidden but
           seem to be more acepted and beginning to blend into the normal lifestyle of
           many of the villagers.
        Links        : 80n, 85s, 98nse
        Notes        : The first room , becuase of needing more forest area, is 7598 it
           only leads west.  It needs to connect to something to the east to fit on the
           map.  A lot of my area is outside, but the town is considered secluded so
           other junctions need to not be too close to the town.  The town ends at the
           coast line and if someone makes an underwater ocean area it would fit in
           perfect to my coast.  The numbers of my coast are 74-85, but in order it
           goes from the north to south 80 79 78 77 76 75 74 81 82 83 84 85.

"tba:75:room:7501":
  name: An Open Field
  description: >
    To the north a forest sets over the horizon.  To the east, west, and south tall green grass and
    wild flowers grow freely only stopping short at a trail that runs north and south.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7500
      look: The Forest Edge.
    south:
      to: tba:75:room:7502
      look: An Open Field.
  extras:
  - keywords: [grass, flower, field]
    text: >
      A gentle breeze sweeps across the fields.  The smell of wild flowers sweetens the air around you.

"tba:75:room:7502":
  name: An Open Field
  description: >
    To the east and west a gentle breeze causes the tall grass to ripple the way a calm pool does when
    disturbed.  The trail disappears under patches of grass, it doesn't appear to have been traveled
    recently.  The trail here runs north and south, large enough for a small wagon.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7501
      look: An Open Field.
    south:
      to: tba:75:room:7503
      look: An Open Field.
  extras:
  - keywords: [grass, flower, field]
    text: >
      A gentle breeze sweeps across the fields.  The smell of wild flowers sweetens the air around you.

"tba:75:room:7503":
  name: An Open Field
  description: >
    To the east and west tall green grass and wild flowers grow freely by the side of the trail. 
    Various areas of the trail are covered with small plants and weeds.  The trail here runs north and south,
    just wide enough for a small wagon or a horse and rider.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7502
      look: An Open Field.
    south:
      to: tba:75:room:7504
      look: An Open Field.
  extras:
  - keywords: [grass, flower, field]
    text: >
      A gentle breeze sweeps across the fields.  The smell of wild flowers sweetens the air around you.

"tba:75:room:7504":
  name: An Open Field
  description: >
    The flowers and plants growing here are less familar, but quite beautiful. In the northern distance
    the plants growing are more familar.  Something beside the road looks out of place.  To the south
    the trail begins to get thinner.
  sector: field
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7503
      look: An Open Field.
    south:
      to: tba:75:room:7506
      look: A Narrow Path.
    down:
      to: tba:75:room:7505
      look: A Trap Door.
      door:
        keywords: [trap, door, leaves]
        kind: door
        reset: closed
  extras:
  - keywords: [road, trail, leaves, leaf, trap]
    text: You see several large leaves gathered together, they seem to be a door or hatch.

"tba:75:room:7505":
  name: A Trap
  description: >
    This is a large pit thats been dug at the edge of the road.  The walls have been smoothed and are
    muddy.  There is nothing for you to grasp in order to get out.  This pit has been dug out to catch
    something, something very big.
  sector: inside
  flags: [dark]
  exits:
    up:
      to: tba:75:room:7504
      look: A Trap Door.
      door:
        keywords: [trap, door, leaves]
        kind: door
  extras:
  - keywords: [walls, pit, mud]
    text: >
      Straining your eyes to see clearly for a brief second two red orbs of some sort shined.  Were those
      eyes?

"tba:75:room:7506":
  name: A Narrow Path
  description: >
    The trail now has become nothing more than a narrow path.  Peculiar plants and flowers grow
    everywhere some reaching heights that are as large as trees. Perhaps they are trees.  Unusual sounds can be
    heard in the distance.  The path runs north and south.
  sector: forest
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7504
      look: An Open Field.
    south:
      to: tba:75:room:7507
      look: A Narrow Path.

"tba:75:room:7507":
  name: A Narrow Path
  description: >
    The narrow path is disappearing under the large amount of plants and flowers.  Song birds can be
    heard in the distance but the songs are not ones you have heard before.  The path twists and leads to
    the north and west.
  sector: forest
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7506
      look: A Narrow Path.
    west:
      to: tba:75:room:7508
      look: Trail to Zamba.

"tba:75:room:7508":
  name: The Trail to Zamba
  description: >
    The plants here have been cut back and a trail made of large flat stones has been built here.  The
    stones of the path are old and broken.  The strange noises seem to be getting louder.  The air grows
    thick from the sweet smell of the flowers.  The old, stone path leads east and west.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7507
      look: A Narrow Path.
    west:
      to: tba:75:room:7509
      look: The Trail to Zamba.
  extras:
  - keywords: [tree, flower, noise]
    text: >
      Glancing around you find the sourse of the noise, at least some of it. From what you can tell a
      very large bird of many colors, mostly red, is perched and screeching from high up in the trees.

"tba:75:room:7509":
  name: The Trail to Zamba
  description: >
    Many noises are heard from every direction.  The birds with their wide range of singing,
    screeching, and calling are becoming familiar.  But there is still a bizarre chatter, where it comes from is
    still unknown.  The stone path runs east and west.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7508
      look: The Trail to Zamba.
    west:
      to: tba:75:room:7510
      look: The Gates of Zamba.

"tba:75:room:7510":
  name: The Gates of Zamba
  description: >
    To the west the stone path leads to a massive wooden gate.  The gate looks to have been made of
    living trees grown standing side by side with thick trunks and branches that weave back and forth from
    one trunk to the next.  In the center of the massive gate the trail leads to a small opening.  The air
    is cool and gentle, the strong floral smell begins to weaken.  Several noises escape the gate,
    sounds of civilization.  A small path leads east and west.
  sector: forest
  flags: [no_mob, bfs_mark]
  exits:
    east:
      to: tba:75:room:7509
      look: The Trail to Zamba.
    west:
      to: tba:75:room:7511
      look: Inside the Gates of Zamba.
  extras:
  - keywords: [gate, tree]
    text: >
      The gate of trees stands over 50 feet tall.  Look at each tree you notice each one looks the same
      size and condition of the other ones.  The trunk of each tree is extremely hard and looks more like
      rock than wood.

"tba:75:room:7511":
  name: Inside the Gates of Zamba
  description: >
    The sounds of crashing water can be heard off in the distance.  The people here look at you
    curiously for a moment before returning to their duties.  To the east stands the gates of Zamba.  The stone
    path leads east and west with many straw huts scattered about.
  sector: city
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7512
      look: A Straw Hut.
    east:
      to: tba:75:room:7510
      look: The Gates of Zamba.
    south:
      to: tba:75:room:7513
      look: A Straw Hut.
    west:
      to: tba:75:room:7518
      look: A Small Street.

"tba:75:room:7512":
  name: A Straw Hut
  description: >
    Sand covers the ground inside this small hut.  Lining the far wall straw mats are neatly stacked
    together.  In the center of this one room home a circle of stones, blackened by smoke, lie cold.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:75:room:7511
      look: A Small Street.

"tba:75:room:7513":
  name: A Straw Hut
  description: >
    This one room hut seems to have been built around a small group of trees used for support.  A well
    crafted net stretches from one tree to a second. The net is held open by two long even branches woven
    at the ends of the net before being tied to the trees.  A blanket is folded and is setting in the
    middle of the net.  In the center of the room a small cluster of stones, blackened by smoke, surrounds
    a small fire.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:75:room:7511
      look: A Small Street.
  extras:
  - keywords: [shelf, tall, wall]
    text: >
      A tall shelf sets against the wall.  One row seems to be clothing, another seems to be dishes while
      the next has clay figures and little things shaped out of what appears to be bone.

"tba:75:room:7514":
  name: A Straw Hut
  description: >
    This small room has one window that has been covered with a large piece of cloth on the east wall. 
    A smell of rotten fish lingers everywhere.  A straw mat with several dirty blankets sets to the
    north.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:75:room:7518
      look: A Small Street.
  extras:
  - keywords: [floor, room]
    text: >
      Scattered about the room as if just thrown anywhere when finished is several different types of
      half devoured foods.

"tba:75:room:7515":
  name: A Straw Hut
  description: >
    This straw hut is quite large.  The floor has been covered with straw.  To the south a large window
    sets open with a gentle breeze blowing in.  Outside the window you can see several pieces of cloth
    hanging on a line swaying gently in the wind drying.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:75:room:7518
      look: A Small Street.

"tba:75:room:7516":
  name: A Straw Hut
  description: >
    The floor is covered in sand and the walls look like they have been caked with mud and let dry. 
    Other than a few footprints in the sand the room is completely empty.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    north:
      to: tba:75:room:7519
      look: A Small Street.
  extras:
  - keywords: [wall]
    text: >
      The walls are a rich clay being used to make the straw hut more durable. It appears to be under
      repairs or has been rebuilt.

"tba:75:room:7517":
  name: A Straw Hut
  description: >
    This one room hut is large with an opening to the west for a window. Lining the far wall is a stack
    of straw mats neatly put together.  In the center of the room is a circle of black stones
    surrounding small twigs and sticks, but no fire.
  sector: inside
  flags: [indoors, bfs_mark]
  exits:
    south:
      to: tba:75:room:7521
      look: A Small Street.
  extras:
  - keywords: [shelf, tall, wall]
    text: >
      A tall shelf sets against the wall.  One row seems to be clothing, another seems to be dishes while
      the next has clay figures and little things shaped out of what appears to be bone.

"tba:75:room:7518":
  name: A Walkway in Zamba
  description: >
    The people of this small village seem to be peaceful but only slightly civilized from their half
    naked appearance.  The stone walkway begins to be buried under white sand.  Straw huts continue in all
    directions.  Although you still hear the sound of rushing water you also hear the faint sounds of
    music further west.
  sector: city
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7514
      look: A Straw Hut.
    east:
      to: tba:75:room:7511
      look: A Small Street.
    south:
      to: tba:75:room:7515
      look: A Straw Hut.
    west:
      to: tba:75:room:7519
      look: A Small Street.

"tba:75:room:7519":
  name: A Walkway in Zamba
  description: >
    At this part of the street it is difficult to tell if the stone path is buried under the white sand
    or if it ended because the sand here is so thick. Straw huts stand to the north and south the huts
    walls look covered in mud. To the east and west is a sandy path.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7520
      look: A Straw Hut.
    east:
      to: tba:75:room:7518
      look: A Small Street.
    south:
      to: tba:75:room:7516
      look: A Straw Hut.
    west:
      to: tba:75:room:7521
      look: A Small Street.
  extras:
  - keywords: [boy, group, play]
    text: >
      The small boys are looking around trying to find something to practice their skills with the bow on.

"tba:75:room:7520":
  name: A Straw Hut
  description: >
    The small hut appears to be empty of anything but trash, but further observation shows a straw mat
    in the corner of the room.  Broken pieces of pottery are scattered about the floor.
  sector: inside
  flags: [no_mob, indoors, bfs_mark]
  exits:
    south:
      to: tba:75:room:7519
      look: A Small Street.
    down:
      to: tba:75:room:7532
      look: A Secret Passage.
      door:
        keywords: [mat, door]
        kind: door
        reset: closed
  extras:
  - keywords: [mat, floor, broken, pottery]
    text: >
      Looking closer to the floor and the broken pieces of pottery you notice what appears to be dried
      blood caked all over. The straw mat looks to be covering something.

"tba:75:room:7521":
  name: A Walkway in Zamba
  description: >
    The white sand seems to lead in every direction.  Straw huts are scattered about but to the south
    instead of a straw hut there is a large building made of wood, perhaps not as grand as you are familar
    with but a much more attractive building compared to the small huts.  To the west appears to be the
    formation of mountains.
  sector: city
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7517
      look: A Straw Hut.
    east:
      to: tba:75:room:7519
      look: A Small Street.
    south:
      to: tba:75:room:7522
      look: The Tiki Lounge.
    west:
      to: tba:75:room:7523
      look: A Small Street.
  extras:
  - keywords: [sound, music, noise]
    text: >
      To the south you hear music coming from inside the Tiki Lounge.  Although you have never heard this
      type of music before it is very pleasent and uplifting.

"tba:75:room:7522":
  name: The Tiki Lounge
  description: >
    As your eyes adjust to the dim torch lights, you see this is a large building made of wood. 
    Torches line all the walls but only give off a dim light.  To the south wall stands a large, well stocked
    bar.  Loud music comes from the eastern part of the room.
  sector: inside
  flags: [no_mob, indoors, bfs_mark]
  exits:
    north:
      to: tba:75:room:7521
      look: A Small Street.
  extras:
  - keywords: [band, wall, noise, music]
    text: >
      Glancing to the east you see several natives playing odd looking instruments, the only instrument
      that looks slightly familar is what appears to be a drum.  Young native women are dancing to the
      music.  To the west older people sit enjoying drinks.

"tba:75:room:7523":
  name: A Walkway in Zamba
  description: >
    To the southwest what had looked to be a moutain in the distance can now be seen more clearly.  It
    seems like someone carved a fortress right out of the mountain or had built a fortress on the surface
    to appear as a mountain.  The huge stone building rises high into the sky, a long set of steps lead
    upward. To the north and south the sand continues.
  sector: city
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7525
      look: A Sandy Clearing.
    east:
      to: tba:75:room:7521
      look: A Small Street.
    south:
      to: tba:75:room:7524
      look: A Sandy Clearing.
    up:
      to: tba:75:room:7540
      look: Stone Steps.

"tba:75:room:7524":
  name: Southern Clearing
  description: >
    The ground here is firm but still sandy.  A large circle of stones entraps a roaring fire, set on
    the fire is a gigantic black pot.  To the east of the fire a primitive machine used to weave cloth has
    been positioned under a shaded tree.  The sounds of crashing water is loud.  The air smells salty
    with a slight aroma of cooked fish.  The sandy track leads north, south and west.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7523
      look: A Small Street.
    south:
      to: tba:75:room:7531
      look: Foliage.
    west:
      to: tba:75:room:7580
      look: A Sandy Beach.
  extras:
  - keywords: [tree, machine]
    text: >
      It seems that the women come together in this area working together to accommodate most of the
      needs of the village.

"tba:75:room:7525":
  name: Northern Clearing
  description: >
    The sounds of rushing water comes from the west.  The white sand is slightly littered with broken
    shells.  A thick string runs between two trees to the north, on the string hang several fish of
    various shapes and sizes.  To the west, east and south stands an open sandy path.  North a small path leads
    into a group of large trees with huge wide leaves centered to the tops of the trees.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7526
      look: A Cluster of Fruit Trees.
    south:
      to: tba:75:room:7523
      look: A Small Street.
    west:
      to: tba:75:room:7574
      look: A Sandy Beach.

"tba:75:room:7526":
  name: Monkey Madness
  description: >
    Tall thin fruit trees are bunched together tightly.  As you stare up into the trees you notice the
    chattering is now gone and everything is totally silent.  The silence is strange.  There are no
    beautiful birds here.  Suddenly the silence is replaced by loud frantic chattering from all around you
    high in the trees.  A large sandy path leads south.  To the east a narrow path full of thick vines leads
    deeper into the trees.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7527
      look: Jungle Passage.
    south:
      to: tba:75:room:7525
      look: A Sandy Clearing.
  extras:
  - keywords: [monkey, creature]
    text: >
      Watching the creatures on the ground you see some are still hidding and appear to be working their
      way behind you.

"tba:75:room:7527":
  name: The Jungle
  description: >
    A low chatter can be heard off in the distance.  Large trees grow tall, stretching toward the sky
    in a oddly tilted fashion.  Other types of trees grow here that have sharp pointy bark.  Thick vines
    twist and turn clinging to everything.  A small path leads off to the east and west.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7528
      look: Jungle Passage.
    west:
      to: tba:75:room:7526
      look: Jungle Passage.
  extras:
  - keywords: [jungle, tree]
    text: >
      This area is rich with wild flowers and oddly shaped trees.  Almost all the trees here seem to grow
      fruit.

"tba:75:room:7528":
  name: The Jungle
  description: >
    Trees and vines mesh together in a wild struggle against each other for growing space.  Bright,
    colorful butterflies flutter high in the trees.  A small path leads off to the east and west.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7529
      look: Jungle Passage.
    west:
      to: tba:75:room:7527
      look: Jungle Passage.
  extras:
  - keywords: [tree, vine, jungle]
    text: Although many trees grow here the amount of vines well exceeds the tree population.

"tba:75:room:7529":
  name: The Jungle
  description: >
    There is almost no ground without some sort of plant growing out of it.  A slight wind catches the
    small leaves of the vines making them appear to grow as they sway in the wind.  A small path leads
    west.  Further to the east there seems to be a clearing.
  sector: forest
  flags: [bfs_mark]
  exits:
    east:
      to: tba:75:room:7530
      look: A Clearing in the Jungle.
    west:
      to: tba:75:room:7528
      look: Jungle Passage.
  extras:
  - keywords: [tree, vine, jungle]
    text: >
      The vines here are smothering out the life of the surrounding trees.  It seems that nothing but
      vines will inhabit this area before to much longer.

"tba:75:room:7530":
  name: The Black Alter
  description: >
    The jungle here is pushed back in a perfect circle, in the middle is a large black stone cut into a
    perfect rectangle.  Behind the stone stands a gruesome stone statue.  It appears to be cut from the
    same stone but is much larger, as you stare up at it you notice it has large green gems for eyes, its
    mouth open as if ready to bite.  In one of its clawed hands it holds a twisted dagger. The dagger is
    of fine steel and appears to have been placed in the claw after the statue was made.
  sector: forest
  flags: [bfs_mark]
  exits:
    west:
      to: tba:75:room:7529
      look: Jungle Passage.
  extras:
  - keywords: [stone, altar, dagger, statue, rectangle, blood]
    text: >
      Studying the area around the stones you notice lying at each corner of the stone block are large
      iron rings with leather straps.  The stone block and the mouth of the statue is covered with dry
      blood.  The daggers twisted blade also is bloody, except it is not dry blood, the blood is fresh and slowly
      drips from the blade.

"tba:75:room:7531":
  name: The Silhouette
  description: >
    Green plants of all shapes and sizes are growing here cramped together struggling for space.  The
    canopy of the trees almost totally block out the sky, only small patches of light are able to sneak
    in.  The air here is moist and thick.  A small group of butterflies busily flutter about in a cluster
    of flowers.  A large yellow flower silhouettes one of the patches of light, for some reason it stands
    alone as if the other plants fear to grow beside it.
  sector: forest
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7524
      look: A Sandy Clearing.

"tba:75:room:7532":
  name: The Taboo Way
  description: >
    This tunnel is very cramped and just tall enough to stand in.  The earthy walls are cold and
    clammy.  An eerie wind whispers to you from further below. The tunnel slopes downward.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7520
      look: A bright light.
      door:
        keywords: [mat, door, up]
        kind: door
    down:
      to: tba:75:room:7533
      look: To dark to tell.
  extras:
  - keywords: [wall, dirt, earth]
    text: As you look closer to the tunnel you can see worms wiggling in the moist dirt.

"tba:75:room:7533":
  name: The Taboo Way
  description: >
    This part of the tunnel is barely tall enough to stand in.  The earthy walls are moist and cold.  A
    foul smell seeps in from further below.  The tunnel leads up and down.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7532
      look: To dark to tell.
    down:
      to: tba:75:room:7534
      look: To dark to tell.
  extras:
  - keywords: [wall, dirt, earth]
    text: As you look closer to the tunnel you can see worms wiggling in the moist dirt.

"tba:75:room:7534":
  name: The Taboo Way
  description: >
    Large wooden beams have been set in place to keep the tunnel from collapsing.  The walls of the
    tunnel are wider from mud dripping off the walls. The floor is covered in slimy mud.  The tunnel leads
    up and down.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7533
      look: To dark to tell.
    down:
      to: tba:75:room:7535
      look: To dark to tell.
  extras:
  - keywords: [dirt, earth, mud, floor, ground]
    text: >
      Looking closer you see the muddy floor is covered in worms.  Scattered throughout the mud and worms
      are hordes of small rat skeletons, clean completely to the bone.

"tba:75:room:7535":
  name: The Taboo Way
  description: >
    This tunnel is large but just tall enough to stand in.  The earthy walls are moist, cold, and stink
    of death.  An eerie wind whispers to you from further below.  Is the wind getting louder?  Is the
    smell worse?  Are the walls getting closer together?  Perhaps, it might be a good idea to turn back and
    breathe fresh air again.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7534
      look: To dark to tell.
    down:
      to: tba:75:room:7536
      look: To dark to tell.
  extras:
  - keywords: [wall, dirt, earth]
    text: The moist dirt is crawling with worms.

"tba:75:room:7536":
  name: The Taboo Way
  description: >
    The tunnel is cold and confining.  The dirt walls give off a stale musty odor.  A faint mutter
    seems to echo from everywhere.  The tunnel tilts up and down.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7535
      look: To dark to tell.
    down:
      to: tba:75:room:7537
      look: To dark to tell.
  extras:
  - keywords: [wall, dirt, earth]
    text: The moist dirt is crawling with worms.

"tba:75:room:7537":
  name: The Taboo Way
  description: >
    The tunnel opens up to a much larger room.  Large wooden beams have been placed in the four corners
    of the room for support.  The walls and ground are just slightly moist.  A tunnel leads up and down.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:75:room:7536
      look: To dark to tell.
    down:
      to: tba:75:room:7538
      look: To dark to tell.
  extras:
  - keywords: [wall, dirt, earth]
    text: The ground is only slightly moist and appears to not have any worms wiggling about.

"tba:75:room:7538":
  name: The Taboo Way
  description: >
    Deep within the earth the ground is soft and murky.  There are only two ways to go, the dark tunnel
    up or the tunnel north, they are the only visible routes of travel.  A small light flickers in from
    the north tunnel.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:75:room:7539
      look: A Lighted Tunnel.
    up:
      to: tba:75:room:7537
      look: To dark to tell.
  extras:
  - keywords: [torch, light, wall]
    text: A burning torch is mounted to the wall.

"tba:75:room:7539":
  name: The Taboo Way
  description: >
    This chamber is fairly large.  The hard earth is dark with spilled blood and evil invocation.  The
    walls are made of smooth black marble which shimmer as the light hits it from a torch.  Painted on
    the floor is a huge pentagram inside a circle.  Black and crimson candles burn at each point of the
    pentagram.  Inside the center of the pentagram is a pewter bowl.  A whisp of smoke spirals out of the
    bowl carrying a foul odor.  The only exit visible is the tunnel south.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:75:room:7538
      look: To dark to tell.
  extras:
  - keywords: [wall, room, floor]
    text: This room appears to be old but used quite often by some sort of magic user.

"tba:75:room:7540":
  name: A Stone Stairway
  description: >
    The stone stairs are wide and appear easy to climb as they expand upward. At this close a distance
    looking upward all you can see are rows and rows of steps all identical as they spirial upward. 
    Glancing downward there is but one step then the sandy ground.
  sector: mountains
  flags: [no_mob, bfs_mark]
  exits:
    up:
      to: tba:75:room:7541
      look: Stone Steps.
    down:
      to: tba:75:room:7523
      look: The Bottom Step.
  extras:
  - keywords: [stairs, steps]
    text: >
      Each step seems to lead off to another step that looks exactly as the one before it.  Even the side
      of the mountain with its unusual symbols seems to repeat in order the unusual markings over and over.

"tba:75:room:7541":
  name: A Stone Stairway
  description: >
    The stone steps extend upward spiraling into the side of the mountain toward the southwest.  Much
    work has been put into this passage.  The steps have been smoothed and widened for easy climbing. 
    Handcarved into the side of the mountain are strange symbols and beasts.  The steps lead up and down,
    you can go no other way.
  sector: mountains
  flags: [no_mob, bfs_mark]
  exits:
    up:
      to: tba:75:room:7542
      look: Stone Steps.
    down:
      to: tba:75:room:7540
      look: Stone Steps.
  extras:
  - keywords: [step, stair, mountain]
    text: >
      Each step leads off to another step that looks exactly as the one before it. Even the side of the
      mountain with its unusual carvings of symbols and beast seem to repeat in an order the same markings
      over and over.

