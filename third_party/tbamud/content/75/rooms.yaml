      to: tba:75:room:7556
      look: A Corridor.

"tba:75:room:7556":
  name: A Long Corridor
  description: >
    This part of the corridor is unfunished.  Large golden candleholders are mounted to the walls,
    white candles burn brightly, to show off a tremendous painting of a elegant lady.  The corridor is wide
    and leads north and south.
  sector: inside
  exits:
    north:
      to: tba:75:room:7555
      look: A Corridor.
    south:
      to: tba:75:room:7557
      look: A Corridor.
  extras:
  - keywords: [plaque]
    text:
    - This portrait of the Empiress Kiona was dedicated to her from her friend and mentor.
    - Shimmer
  - keywords: [painting, woman]
    text: >
      The woman in the painting is wearing a large crown and elegant golden robes. She is adorned in
      several expensive pieces of jewerly.  Her features are soft under her black hair and tan skin.  She has
      striking blue eyes unlike the other natives with their dark brown eyes.  A gold plaque is mounted to
      the wall under the painting.

"tba:75:room:7557":
  name: A Long Corridor
  description: >
    Torches line the walls giving off enough light to see the corridor is empty. The corridor leads
    north and south.  To the south you can see the corridor is opening up into other directions.
  sector: inside
  exits:
    north:
      to: tba:75:room:7556
      look: A Corridor.
    south:
      to: tba:75:room:7558
      look: A Split in the Corridor.

"tba:75:room:7558":
  name: A Split in the Corridor
  description: >
    The corridor here leads north and south, to the north the way is much brighter.  Doors are to the
    east and west.  Much noise can be heard coming from the east and south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7557
      look: A Corridor.
    east:
      to: tba:75:room:7561
      look: A Swinging Door.
      door:
        keywords: [door, swinging, east]
        kind: door
    south:
      to: tba:75:room:7559
      look: A Bright Room.
    west:
      to: tba:75:room:7562
      look: A Thick Door.
      door:
        keywords: [door, thick, west]
        kind: door

"tba:75:room:7559":
  name: The Gathering Room
  description: >
    The bright lights make it difficult to see for a moment, but as your vision clears you see the room
    is enormous.  Several large chandeliers hang from the ceiling.  The floor, walls, and ceiling are
    white as snow.  Gigantic pillars stand at each end of the room.  To the west the room is open stepping
    out onto a balcony.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7558
      look: A Corridor.
    west:
      to: tba:75:room:7560
      look: The Balcony.
  extras:
  - keywords: [pillar]
    text: >
      The pillars at each corner of the room is a massive white stone that has been sculpted into the
      shape of a muscular man wearing a short toga, sandels, and armbands on his upper arm.  The man is
      standing with his hands upward holding up the ceiling.  The sculpture is very realistic and almost looks
      alive.
  - keywords: [wall, room, floor]
    text: >
      The room is bright and airy.  Everything around the room and the room itself is a snow white giving
      the room an aura of purity.

"tba:75:room:7560":
  name: The Balcony
  description: >
    This large balcony is decorated with a few large potted flowers.  The wind is strong and carries a
    salty smell.  Standing here is almost like standing on a large ship.  Looking out over the balcony
    above you is the sky in full display of its grand splendor, and below the ocean, rushing toward the
    cliffs below you crashing loudly against the stones, both stretching as far as you can see.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:75:room:7559
      look: The Gathering Room.
  extras:
  - keywords: [balcony]
    text: >
      The balcony is made of solid stone with a waist high stone rail.  A large canopy hangs over the
      balcony for protection.

"tba:75:room:7561":
  name: The Kitchen
  description: >
    The room is busy with activity.  The walls are lined with pots and pans. Many tables are in this
    room all cluttered with food and dishes.  The air is warm and fragrant from all the delicious food
    being cooked.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:75:room:7558
      look: A Swinging Door.
  extras:
  - keywords: [table]
    text: >
      Bowls filled with fruit, cooked meats, and many other delicious foods are neatly placed here being
      arranged on silver platters and in exquisite bowls.

"tba:75:room:7562":
  name: The Pantry
  description: >
    The pantry walls are full of shelves neatly stacked with various foods.  On the floor huge barrels
    are clustered together.  Although the shelfs are clean, the floor is covered in dust.
  sector: inside
  flags: [dark]
  exits:
    east:
      to: tba:75:room:7558
      look: A Thick Door.

"tba:75:room:7563":
  name: A Tiny Hall
  description: >
    The hall has no decorations hanging on the walls, just a few wooden torches for light.  The air
    here is damp and cold.  The hall continues east.  To the west you see a door.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:75:room:7564
      look: A Tiny Hall.
    west:
      to: tba:75:room:7555
      look: A Wooden Door.
      door:
        keywords: [door]
        kind: door

