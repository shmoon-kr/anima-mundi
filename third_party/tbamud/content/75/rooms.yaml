"tba:75:room:7576":
  name: A Sandy Beach
  description: >
    The white sand is flat and smooth with a few bird trails leading to the north.  White waves roll in
    onto the sand washing away some of the bird prints. To the east a few small buildings can be seen in
    the distance..  The sand extents off to the north and south.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7577
      look: A Sandy Beach.
    south:
      to: tba:75:room:7575
