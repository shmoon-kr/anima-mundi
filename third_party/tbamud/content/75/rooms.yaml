"tba:75:room:7550":
  name: The Top of Mount Zamba
  description: >
    The stone steps extending upward finally stop at a set of double doors. The doors are made of thick
    iron mounted into the side of the mountain.  In the center of each door is the face of a black
    panther snarling.  Its mouth holds a loose iron ring.  Looking to the north and east you see the ground
    far below . To the west below are jagged rocks jutting out from the side of the mountain ending at a
    large body of water crashing against the side of the mountain. The sounds of the water roars as it
    echos up the mountain side.  A strong wind from the west threatens to push you over the side.  Should you
    climb down or should you brave the unknown and enter the doors to the south?
  sector: mountains
  flags: [no_mob, bfs_mark]
  exits:
    south:
      to: tba:75:room:7551
      look: Iron Doors.
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:75:room:7549
      look: Stone Steps.

"tba:75:room:7551":
  name: The Fortress Foyer
  description: >
    You are standing in a large entryway.  It is well developed and lavishly decorated.  Beautiful
    paintings cover the stone walls.  Giant statues of unusual beasts stand in a row on both the east and
    west side of the room.  To the north double doors made of iron.  An open archway leads south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7550
      look: Iron Doors.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:75:room:7552
      look: An Archway.
  extras:
  - keywords: [statue]
    text: >
      The statues are quite unique and look to of been crafted by the hands of a maste sculptor.

"tba:75:room:7552":
  name: A Small Parlor
  description: >
    The room is of average size with a large fireplace centered on the west wall.  A warm fire burns in
    the hearth as flickering light dances on the floor in front of it.  Centered on the room are many
    comfortable looking chairs and a long moon shaped sofa.  To the north and south ends of the room stands
    an open archway.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7551
      look: An Archway.
    south:
      to: tba:75:room:7553
      look: A Corridor.
  extras:
  - keywords: [fireplace]
    text: >
      The fireplace is quite large.  The mantle is decorated with a large golden candelabra.  The front
      of the fireplace is covered with a mess screen.
  - keywords: [sofa, chair]
    text: >
      The chairs and sofa are thick with padding and made of a brown leather that has been treated to
      make it soft and smooth.

"tba:75:room:7553":
  name: A Long Corridor
  description: >
    The corridor is wide and leads north and south.  Torches line the walls giving off enough light to
    see that the corridor is empty.  An open archway leads to the west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7552
      look: An Archway.
    south:
      to: tba:75:room:7554
      look: A Corridor.
    west:
      to: tba:75:room:7570
      look: To dark to tell.

