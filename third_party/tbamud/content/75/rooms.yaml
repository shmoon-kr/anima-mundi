      to: tba:75:room:7569
      look: A Wooden Door.
      door:
        keywords: [door, south]
        kind: door
    west:
      to: tba:75:room:7563
      look: A Tiny Hall.

"tba:75:room:7565":
  name: A Tiny Hall
  description: >
    The hall is plain with no decorations.  To the east wall sits an empty fireplace.  To the north and
    south closed doors.  The hall continues to the west.
  sector: inside
  exits:
    north:
      to: tba:75:room:7567
      look: A Wooden Door.
      door:
        keywords: [door, north]
        kind: door
    south:
      to: tba:75:room:7568
      look: A Wooden Door.
      door:
        keywords: [door, south]
        kind: door
    west:
      to: tba:75:room:7564
      look: A Tiny Hall.

"tba:75:room:7566":
  name: A Black Room
  description: >
    The walls of the room are solid black.  To the east and west several rows of shelves line the
    walls.  On the shelves are several sizes of white candles burning brightly.  At the far end of the room to
    the north sets an altar.  A long red carpet leads from the door to the altar.  The door leading out
    is on the south wall.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:75:room:7564
      look: A Wooden Door.
  extras:
  - keywords: [alter]
    text: The alter is made of a black stone.  The alter is empty.

"tba:75:room:7567":
  name: A Small Bedroom
  description: >
    The room is small and cold.  A bed, small table, and a trunk are the only furniture here.  The room
    is cluttered and in disarray.  Black candles are lit on the table.
  sector: inside
  exits:
    south:
      to: tba:75:room:7565
      look: A Wooden Door.
      door:
        keywords: [door, south]
        kind: door
  extras:
  - keywords: [candle, table]
    text: Several black candles sit here on the table lit leaving a trail of foul smoke.
  - keywords: [trunk]
    text: The wooden trunk is plain except for having a large lock holding it shut.

"tba:75:room:7568":
  name: An Office
  description: >
    The room is small but pleasent.  A leather chair, small desk, and a bookshelf are arranged in an
    orderly fashion.  The room is neat and clean.  A few pieces of paper sit on top of the desk.
  sector: inside
  exits:
    north:
      to: tba:75:room:7565
      look: A Wooden Door.
      door:
        keywords: [door, north]
        kind: door
  extras:
  - keywords: [paper, desk]
    text: >
      A few papers sit here on the desk.  Each having the seal of the royal crest of Empress Kiona.
  - keywords: [shelf, wall]
    text: >
      The shelf is a display case of many unique weapons.  It is made of a strong oak wood.  The front of
      the shelf is a glass door.

"tba:75:room:7569":
  name: A Small Bedroom
  description: >
    The room is small but pleasent.  A bed, small table, and a wardrobe are the only furniture here. 
    The room is very neat and clean.  Lying on the table is a match set made up of a hairbrush, comb, and
    hand mirror.
  sector: inside
  exits:
    north:
      to: tba:75:room:7564
      look: A Wooden Door.
  extras:
  - keywords: [brush, comb, mirror, table]
    text: >
      The table has lying on it neatly a hairbrush, comb, and a hand held mirror. The items are carved
      from a dark wood and skillfully crafted.

"tba:75:room:7570":
  name: A Dark Corridor
  description: >
    The corridor is decorated with several colorful tapestries.  To the west the corridor ends at a
    large set of double doors.  To the east lies an open archway.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:75:room:7553
      look: A Corridor.
    west:
      to: tba:75:room:7571
      look: An Oak Door.
      door:
        keywords: [door, iron]
        kind: door
        reset: closed
  extras:
  - keywords: [seal]
    text: >
      The seal is of a shield containing a pair of crossed swords with the face of a panther growling
      from above the wicked looking blades.
  - keywords: [door]
    text: The double doors are encraved with the image of a royal seal.

"tba:75:room:7571":
  name: The Throne Room
  description: >
    The walls of this room are covered with mosaics depicting natural scenes. The floor is polished
    marble.  A long carpet leads from the eastern doors to a large throne.  The throne sits atop a raised
    dias near the western wall.  The room is lightly decorated with colorful flowers.  The fresh scent of
    flowers fill the room.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:75:room:7570
      look: An Oak Door.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:75:room:7572
      look: A Small Keyhole.
      door:
        keywords: [keyhole, secret, passage, south]
        kind: pickproof
        key: tba:75:obj:7571
        reset: locked
  extras:
  - keywords: [flower]
    text: >
      The beautiful golden pots hardly compare to the wonderful flowers each one contains.  A mixture of
      colors blended together well in each floral arrangement.

"tba:75:room:7572":
  name: A Grand Bedchamber
  description: >
    This is the private bedchambers of Empress Kiona.  The air is warm, steamy, and has a strong floral
    scent.  The room is only partially lit from candles placed in different areas of the room.  You see
    on the east side of the room a soft bed with many pillows.  The room has a soothing peace about it,
    almost embracing you into a gentle sleep.  Suddenly you realize you are not alone, at the other end of
    the room a huge bath sits, someone is sitting at the far end of the bath.  At the bath thin lines of
    steam rises and disappear.  The sounds of gentle splashing can be heard.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7571
      look: A Secret Door.
      door:
        keywords: [door, secret]
        kind: door
        key: tba:75:obj:7571
        reset: locked
    south:
      to: tba:75:room:7573
      look: An Open Curtain.

"tba:75:room:7573":
  name: A Huge Bath
  description: >
    This small room holds a large stone bath.  Surrounding the bath are many flowers and candles.  The
    air is hot and thick from the steam as it rises from the bath.  The strong scent of flowers cling to
    everything.  At the other end of the bath you can make out the shape of a woman leaning over, her
    hand testing the water.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:75:room:7572
      look: An Open Curtain.

"tba:75:room:7574":
  name: A Sandy Beach
  description: >
    White sand extends far to the north and south.  Small birds dig about the sand looking for their
    next meal.  To the west the ocean washes up to the beach washing away the sand under it.  The wind
    blows in softly across the waves carrying with it the salty smell of the ocean.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7575
      look: A Sandy Beach.
    east:
      to: tba:75:room:7525
