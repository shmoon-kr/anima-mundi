"tba:75:room:7577":
  name: A Sandy Beach
  description: >
    The white sand holds many sets of footprints and animal trails.  Most of the footprints seem to
    come and go from the south and east direction.  To the north many bird shaped prints seem to run back
    and forth to the edge of the ocean. To the east stands several small buildings made of wood.  The sand
    leads off to the north, south, and east.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7578
      look: A Sandy Beach.
    east:
      to: tba:75:room:7586
      look: A Path.
    south:
      to: tba:75:room:7576
      look: A Sandy Beach.

"tba:75:room:7578":
  name: A Sandy Beach
  description: >
    The white sand rises and falls in small dunes scattered all about.  Small patches of wild grass
    grows scantly around.  Several trees grow to the north and east of the sand.  To the west the ocean
    spreads far into the distance.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7579
      look: A Sandy Beach.
    south:
      to: tba:75:room:7577
      look: A Sandy Beach.

"tba:75:room:7579":
  name: A Sandy Beach
  description: >
    Large trees enclose this narrow strip of beach from the north around to the east.  To the west the
    ocean washes up the beach and crash onto a group of jagged rocks clustered below the trees.  To the
    south the sandy trail leads off to a wider strip of beach.
  sector: hills
  flags: [bfs_mark]
  exits:
    south:
      to: tba:75:room:7578
      look: A Sandy Beach.

