"tba:75:room:7583":
  name: A Sandy Beach
  description: >
    The sand of the beach has been dug out in several areas.  In other parts farther away from the
    waters edge mounds of dirt have been packed and odd animal tracks lead away from the mounds toward the
    coast disappearing into the water.  The current here is gentle and softly caresses the edge of the
    bank. The sand leads off to the north and south.
  sector: hills
  flags: [bfs_mark]
  exits:
    north:
      to: tba:75:room:7582
      look: A Sandy Beach.
    south:
      to: tba:75:room:7584
      look: A Sandy Beach.

