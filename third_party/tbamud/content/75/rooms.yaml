  name: A Tiny Hall
  description: >
    The hall has no decorations hanging on the walls, just a few wooden torches for light.  The air
    here is damp and cold.  Closed doors line the north and south wall.  The hall continues east and west.
  sector: inside
  exits:
    north:
      to: tba:75:room:7566
      look: A Wooden Door.
      door:
        keywords: [north, door]
        kind: door
    east:
