    raw: [0, 0, 0, 0]
  weight: 5
  cost: 550
  rent: 55
  level: 0
  extras:
  - keywords: [bookmarked, page, writing]
    text: >
      Today many of the merchants left to find a better location for their wares. I have decided to stay
      here despite the evil gossip of black magic and human sacrifice.  I understand their leaving, so much
      business came from the other towns I can't blame them for staying away when our own people fear the
      rumors. I think in time everyone will grow use to going without some of the finer things from the
      other towns and enjoy living apart from the other towns.  The common people have always had to make do. 
      I think Zamba is better off without all the tourist and having to follow the laws of all the
      surrounding town.  We are much better off being apart from outsiders.
  - keywords: [book, journal]
    text: >
      The large book is quite heavy and made of leather.  On the front the embossed letters are too faded
      to read.  But a bookmark page at the end of the book looks readable.

