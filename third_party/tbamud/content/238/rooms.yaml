"tba:238:room:23880":
  name: A Clearing Before the Lake
  description: >
    You stand here in front of a massive lake.  There are many small animals scattered about looking as
    if they want to get out but cannot.  There are many different smells surrounding the area.
  sector: inside
  exits:
    north:
      to: tba:238:room:23801
      look: Looking north you see the area before the lake.
    west:
      to: tba:238:room:23879
      look: Looking west you see into the fog.

"tba:238:room:23881":
  name: Dragons Lair
  description: >
    You have entered a large room with very little decorations and no kind of art.  There are claw
    marks and very large holes in the walls and ceiling around.  The floor is very hard and seems to be
    composed of crystal.  The roof is also made of the same materials.
  sector: inside
  exits:
    down:
      to: tba:238:room:23846
      look: Looking down you see the rocks in front of the castle.
  extras:
  - keywords: [scratches]
    text: Looking in for a closer look you see that these scratches are from some kind of animal.
