  sector: inside
  flags: [indoors, private]

"tba:238:room:23801":
  name: Before the lake
  description: >
    This small patch of land lies before a grand lake.  A large crystal castle can be seen far in the
    distance towards the middle of the lake.  Many small footprints can be seen laying about the trail
    that has lead you to this marvel of castles.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:238:room:23802
      look: As you look north you notice that there is nothing but water.
    south:
      to: tba:238:room:23880
      look: Looking south you see an area leading into the fog.
  extras:
  - keywords: [look, footprints]
    text: >
      You notice that these prints are different creatures.  It appears that they were drug or have drug
      themselves into this room and and then walked out.

"tba:238:room:23802":
  name: In the lake
  description: >
    There is a fine layer of film that rests upon the top of the lake. Under the lake can be seen small
    fish and a few pieces of garbage but nothing important.  Also the sand at the bottom of the lake is
    not quite sand rather busted up crystal making it imposable to walk on the bottom of the lake.  Also
    algae floats towards the top of the lake making it hard to see up from the bottom of the lake.
  sector: water_swim
  flags: [no_track]
  exits:
    north:
      to: tba:238:room:23817
      look: Looking north is nothing but water.
    east:
      to: tba:238:room:23803
      look: As you look east you see water.
    south:
      to: tba:238:room:23801
      look: >
        Upon looking south you notice a large patch of ground.  Scattered about are many small footprints
        and claw marks.

