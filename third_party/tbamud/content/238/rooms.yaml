"tba:238:room:23833":
  name: Before the castle
  description: >
    You find yourself standing before a massive crystal castle.  It seems to be flawless and very
    delicate yet very strong in design.  There are many small crystals poking out from the sides of the castle
    making it impossable to scale the wall.  There is a large gate leading into the castle directly to
    the north.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:238:room:23832
    south:
      to: tba:238:room:23818

"tba:238:room:23834":
  name: Under the sand
  description: >
    There are large spider webs and dead insects scattered about.  There is also a fowl stench that has
    completely closed you in.  Many nasty bugs crawl around looking for a crumb of food here . There is
    a small tunnel leading off into the north leading you into darkness.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:238:room:23835
      look: Looking north there is a small tunnel leading north
    up:
      to: tba:238:room:23809
      look: Leading up is a small patch of land.
      door:
        keywords: [patch]
        kind: door
  extras:
  - keywords: [look, spider, web]
    text: There are many small spiders around the room looking for a bite to eat.

"tba:238:room:23835":
  name: Through the tunnel
  description: >
    This is a very small tunnel barely big enough for one person.  It seems to have not been used for a
    very long time . It looks like it was used for an escape route or maybe for someone to sneak in or
    out.  There are many carvings in the wall nothing special but just notches.  Also there are still
    spide webs linning the walls.
  sector: inside
  flags: [bfs_mark]
  exits:
    north:
      to: tba:238:room:23836
    south:
      to: tba:238:room:23834
      look: Looking south you see a small area under a patch of grass.

