  name: In the fog
  description: >
    Here it is hard to see anything besides what is in the area with you. There is thick gray fog
    around everything leaving you wandering where you are and where to go.  This must be some kind of magic
    because the fog seems to not be moving any and it has a strange glow to it.
  sector: inside
  flags: [bfs_mark]
  exits:
    east:
      to: tba:238:room:23828
    south:
      to: tba:238:room:23822
    west:
      to: tba:238:room:23830

