"tba:238:room:23809":
  name: Patch of land
  description: >
    Here lies a small patch of land in the middle of the lake.  There is a small mist that covers the
    outside of the lake making it unreachable.  You cannot even see where you come from on the shore side
    of the lake.  It may be too late to turn back.  Sand covers the ground here with a small patch of
    square shaped grass in the center of the small island.
  sector: inside
  flags: [no_mob, bfs_mark]
  exits:
    north:
      to: tba:238:room:23810
      look: As you look north you see nothing but nasty water.
    west:
      to: tba:238:room:23808
      look: As you look west you see more sickening water.
    down:
