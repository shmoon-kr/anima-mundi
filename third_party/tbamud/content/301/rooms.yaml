  description: >
    As you walk through the entrance of the cafeteria, your appetite suddenly disappears.  In this
    entrance, you'll normally find long line-ups to get into the cafeteria, but it's incomprehensible why. 
    The only safe exit is to the north, but if you feel courageous enough, you can venture south.  There
    is a door to the west.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    north:
      to: tba:301:room:30103
      look: You long to go north.
    south:
      to: tba:301:room:30145
      look: The dining hall lies to the south... Beware!
    west:
      to: tba:301:room:30143
      look: There is a doorway leading to the kitchen.
      door:
        keywords: [door, doorway]
        kind: door
        reset: closed
  extras:
