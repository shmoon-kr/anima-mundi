      look: The dining hall lies to the west... Beware!
  extras:
  - keywords: [door, doorway]
    text: >
      You believe that the doorway leads to the kitchen.  Let's give our compliments to the chef... 
      *grin*
  - keywords: [cafeteria, caf]
    text: Yes, this is the cafeteria.

"tba:301:room:30129":
  name: Morris House
  description: >
    This large building seems to be another dormitory...  Of sorts.  It is built is a style combining
    Neo-Georgian features with all the advantages of modern design.  A hallway shrouded in darkness leads
    off to the west, and the road is to the east.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:301:room:30109
      look: University Avenue lies to the east.
    west:
      to: tba:303:room:30330
      look: This hallway leads into the depths of Morris.

"tba:301:room:30130":
  name: The Entrance To Sterling Hall
  description: >
    This is the entrance to the famed circular building, Sterling Hall. Supposedly, if you walk in one
    direction long enough, you will get to where you want to be.  Exits lead in all cardinal directions. 
    A footnote has been attached to this description.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:301:room:30106
      look: Campus Crescent can be seen through the glass doors.
    east:
      to: tba:303:room:30320
      look: The hallway continues east.
    south:
      to: tba:303:room:30325
      look: An opening to the south brings you to the center of the building.
    west:
      to: tba:303:room:30324
      look: The hallway continues west.
  extras:
  - keywords: [footnote]
    text: >
      Yes, believe it or not, this is a reasonably accurate representation of the Physics building,
      Stirling Hall at our university.  The lecture halls are numbered in the same manner as represented and it
      is in fact round, so that you can walk in one direction all the way around the building.
  - keywords: [round, circle, circular]
    text: Yes, it's round.

"tba:301:room:30131":
  name: The Student Health Services Entrance
  description: >
    This nice and inviting building does not seem quite so nice and inviting anymore now that you can
    smell the Formeldehyde.  But life has brightened substantially, there is a Birth Control Center to the
    east and a De-Tox unit to the south.  To the north lies a tempting exit to a cobblestone covered
    street.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:301:room:30105
      look: Back to cobblestones, eh?
    east:
      to: tba:301:room:30172
      look: The Birth Control Center looks mighty inviting doesn't it?
    south:
      to: tba:301:room:30173
      look: The De-Tox unit to the south looks like a good place to rest.

"tba:301:room:30132":
  name: Entrance To Ellis Hall
  description: >
    This entrance is covered in finely wrought carvings depicting great engineering events (like the
    construction of this area) that have taken place in XXX's history.  There are two exits, east to the
    street and west further inside the building.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:301:room:30110
      look: University Avenue lies to the east.
    west:
      to: tba:301:room:30174
      look: It is too dark to tell what the next room is.
  extras:
  - keywords: [carvings]
    text: >
      These carvings depict the heroic deeds of Matrix and the Wandering Bard. Here they have just
      defeated the creature known as the Zon File.

"tba:301:room:30133":
  name: Corry-Mack Building
  description: >
    The Arts faculty building was obviously the brain child of a maze enthusiast.  Its twisting halls
    have absolutely boggled the greatest minds of Vernmot...  As well as the not so great minds.  The
    halls beckon you to the east.  University Avenue lies to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:302:room:30274
      look: The twisting halls of Corry-Mack call from the east.
    west:
      to: tba:301:room:30110
      look: University Avenue lies to the west.
  extras:
  - keywords: [minds, mind, great, greatest]
    text: All of whom were probably smarter than you.
  - keywords: [halls, hallways, hall, hallway]
    text: They are twisting alright.

"tba:301:room:30134":
  name: Corry-Mack Hall
  description: >
    The Arts faculty building was obviously the brain child of a maze enthusiast.  Its twisting halls
    have absolutely boggled the greatest minds of XXX...  As well as the not so great minds.  The halls
    beckon you to the north.  Campus Crescent is south of here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:302:room:30276
      look: The twisting halls of Corry-Mack lie ahead.
    south:
      to: tba:301:room:30105
      look: Campus Crescent lies to the south.
  extras:
  - keywords: [minds, mind, great, greatest]
    text: All of whom were probably smarter than you.
  - keywords: [halls, hallways, hall, hallway]
    text: They are twisting alright.

"tba:301:room:30135":
  name: Dunning Hall Lobby
  description: >
    This is the nerve center of the Commerce Department at UNX (University of North XXX).  There are
    two exits.  One to the north which seems to lead to a hall of some sort, and on to the west which leads
    into a large room.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:302:room:30292
      look: A hall leads off to the north.
    east:
      to: tba:301:room:30111
      look: University Avenue lies to the east.
    west:
      to: tba:302:room:30291
      look: A large room stands to the east.  What else would it do, sit?

"tba:301:room:30136":
  name: Frosty Annex Entrance Hall
  description: >
    As you walk off the street, you begin to notice how old and decrepit this building is.  If
    perchance you are passing through this room on your way out of the building you noticed how old this building
    seemed quite a long time ago. There are two exits.  One to the road, which happens to lie to the
    west and the exit to the east leads to a long hallway.
  sector: field
  flags: [indoors]
  exits:
    east:
      to: tba:302:room:30266
      look: A long hallway leads off in this direction.
    west:
      to: tba:301:room:30111
      look: University Avenue lies immediately to your west.

"tba:301:room:30137":
  name: The Central Annex
  description: >
    This nicely decorated, cavernous room resembles a large meeting hall.  To the east you can see the
    Infobank, and to the west, you can see the Tuck Shoppe.  North of you is the back hall with its bank
    machines, and south is the exit to Union Street.  This area is usually rather busy with students as
    this is the University Student Center.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:301:room:30138
      look: >
        To the north you can see the back hall, complete with numerous bank machines, but of course you
        already knew that, didn't you?
    east:
      to: tba:301:room:30167
      look: To the east you can see the Infobank of the University.
    south:
      to: tba:301:room:30114
      look: To the south is the exit onto the street.
    west:
      to: tba:301:room:30169
      look: The Tuck Shoppe is located to your west.
  extras:
  - keywords: [prawn]
    text: You see nothing even remotely resembling that here.

"tba:301:room:30138":
  name: The Back Hall
  description: >
    This is the back hall of the Student Center.  You can see a Post Office to the north, and a games
    room to the east.  The Central Annex is located to the south whilst the street is located directly to
    your west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      look: >
        You can distinctly see a post office here, it might have a message in it, but you are not quite
        sure.
    east:
      to: tba:301:room:30168
      look: There are electronic sounds coming from the east.
    south:
      to: tba:301:room:30137
      look: The large central annex lies to the south.
    west:
      to: tba:301:room:30113
      look: University Avenue is located just to the west.

"tba:301:room:30139":
  name: Jock Hardy Lobby
  description: >
    Several plaques line the walls, commemorating the great athletic achievements of the students and
    alumni.  Exits branch off in many directions. There is a sign here.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:301:room:30152
      look: There is a stairway to the north.
    east:
      to: tba:301:room:30160
      look: A long hallway lies to the east.
    south:
      to: tba:301:room:30115
      look: Union Street lies to the south.
    west:
      to: tba:301:room:30153
      look: A long hallway lies to the west.
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           The sign says:
        	n
            Gym           -> North
            Arena         -> East
            Locker Rooms  -> West
            Exit          -> South
  - keywords: [plaque, plaques]
    text: They are rather boring.  A bunch of people you don't know.

"tba:301:room:30140":
  name: The Grant Hall Building
  description: >
    This is the entry hall of the Grant Hall Building.  This building is lavishly furnished (with only
    chairs) and is used for important assemblies. The auditorium lies to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:301:room:30115
      look: Union Street lies to the north.
    south:
      to: tba:302:room:30260
      look: The auditorium lies to the south.

"tba:301:room:30141":
  name: Campus Bookstore
  description: >
    This shop is filled with over-priced items that every university student would want for his, her,
    or its own home.  Such items as sweatshirts, pants, T-shirts, and, of course, over-priced books that
    can do for presents to the rest of the family.  There are two exits, one to the south and one to the
    east. Both exits are well guarded by security to prevent stolen goods from leaving the store before
    being (over-) priced.
  sector: inside
  flags: [no_mob, indoors, no_magic]
  exits:
    east:
      to: tba:301:room:30118
      look: Outside you can see Division Road.
    south:
      to: tba:301:room:30165
      look: To the south you can see the entrance to the Campus Pub.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [sweatshirt, sweatshirts, pants, t-shirt, t-shirts, books]
    text: >
      There is absolutely no point in looking at anything because the prices are almost like paying two
      or three arms and legs to buy something to cover them...

"tba:301:room:30142":
  name: Wally World Reception Area
  description: >
    This is the entrance to the fabulous Wally World, located soulfully on East Campus, miles away from
    everything else.  There are three exits from here, west to the street and main campus, east to
    explore the depths of Wally World, and north to visit the front office and reception desk.
  sector: forest
  flags: [indoors]
  exits:
    north:
      to: tba:302:room:30201
      look: This way leads to the reception desk.
    east:
      to: tba:302:room:30203
      look: This leads to the lounge.
    west:
      to: tba:301:room:30121
      look: This leads back to Division Road and the main campus.

"tba:301:room:30143":
  name: The Kitchen
  description: >
    The kitchen is filled with a light mist of smoke rising from the stoves. The food here is
    mass-produced and cheaply made.  After watching how they cook this food you are glad you do not normally eat
    at the cafeteria.  There is a door to the east.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:301:room:30127
      look: The doorway leads back out of the kitchen.
      door:
        keywords: [door, doorway]
        kind: door
        reset: closed
    south:
      to: tba:301:room:30144
      look: The kitchen continues south.
  extras:
  - keywords: [food]
    text: Believe me, you don't want to look at that!
  - keywords: [door, doorway]
    text: You stare intently at the door.  Its wooden frame enthrals you.

