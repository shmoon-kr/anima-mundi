"tba:301:room:30165":
  name: Campus Pub Stairwell
  description: >
    This stairwell leads up to the ever popular (and ever-loud) Campus Pub. There are also exits to the
    north and south leading to the Campus Bookstore and University Crescent respectively.  The stairwell
    is quite worn in from all the boots trampling up and down it all day (and night).  The exit to the
    north is much less worn but the path to the south has been worn right down.  There is a small sign
    partway up the stairwell.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:301:room:30141
      look: The Campus Bookstore is located to the north.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:301:room:30106
      look: Campus Crescent, and its cobblestones, is just to the south.
    up:
      to: tba:301:room:30166
      look: >
        The Campus Pub is just above your head...just go up the stairs...if you can stand the noise that is.
  extras:
  - keywords: [small, sign]
    text: "The sign reads: NO minors allowed."

"tba:301:room:30166":
  name: Campus Pub
  description: >
    This is your everyday campus pub with loud music, lots of underagers, lots of beer, and the
    perennial favorite, Moshing.  You find it very difficult to move around, so decide to limit yourself to the
    bar.  There is only one exit... The one you entered by (down if you can't remember).
  sector: mountains
  flags: [indoors]
  exits:
    down:
      to: tba:301:room:30165
      look: The only way out is down.
  extras:
  - keywords: [moshing, mosh]
    text: All you can see is a mass of bodies moving up and down, up and down...
  - keywords: [zorpa]
    text: You see nothing special.  Now what is a zorpa anyways?

"tba:301:room:30167":
  name: The Infobank
  description: >
    This is the Infobank of the university.  From previous experience you realize that any information
    will be grossly inaccurate, if truthful at all. You can see a map of the university on the wall as
    well as a list of the student government.  The only exit is the way you came in, but with student
    governments you never know...
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:301:room:30137
      look: Back to the Central annex.
    down:
      to: tba:301:room:30171
      door:
        keywords: [plank]
        kind: door
        reset: closed
  extras:
  - keywords: [list]
    text:
      preformatted: |2
           The list reads:
                <name scratched out>    President
                <name scratched out>    Vice-President
        Seems as though everyone is claiming ignorance today.
  - keywords: [map]
    text: >
      This map shows absolutely nothing, further proving the value of student governments to you.

"tba:301:room:30168":
  name: The Games Room
  description: >
    In this room you see many arcade style games, none of which are plugged in. In one corner you can
    see a girl playing the Addams Family Pinball Game. There is only one exit.  (Guess where it is).
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:301:room:30138
      look: You can still see the central annex from here, there seems to be no getting away from it.
  extras:
  - keywords: [girl, pinball, addams, family]
    text: You can see a girl playing the Addams Family Pinball Game in one corner.

"tba:301:room:30169":
  name: The Tuck Shoppe
  description: >
    This is the place to buy whatever kind of food you are looking for, according to the sign all types
    of food are sold here, all you need to do is ask...
  sector: inside
  flags: [no_mob, indoors, no_magic]
  exits:
    east:
      to: tba:301:room:30137
      look: You can see the central annex to the east.

"tba:301:room:30170":
  name: The Post Office
  description: >
    This seems to be the standard post office given to any university by the wonderful XXX government. 
    You can tell that it is a university post office because of the surplus amount of obscene graffiti
    upon the walls.  The back hall is south of here.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:301:room:30138
      look: You can see the back hall from here complete with humming bank machines.
  extras:
  - keywords: [graffiti]
    text: You really don't want to read this!  (if you want to continue reading type "look wirt")
  - keywords: [wirt]
    text: >
      You really are a sucker for punishment now aren't you?  If you still want to read it type "look
      prawn"
  - keywords: [prawn]
    text: You see nothing special.  The Prawn is in excellent condition.

"tba:301:room:30171":
  name: The Special Hidden Room
  description: >
    This room is completely empty except for the things you can see in it.  The only thing of real
    importance you can see is the plank in the ceiling.
  sector: mountains
  flags: [indoors]
  exits:
    up:
      to: tba:301:room:30167
      look: Back to the Infobank we go.
      door:
        keywords: [plank]
        kind: door

"tba:301:room:30172":
  name: Birth Control Center
  description: >
    This room is literally plastered with photographs, leaflets, and other birth control
    paraphernalia.  On the table for instance is a stack of pamphlets to be handed out to any students who wish to read
    them.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    west:
      to: tba:301:room:30131
      look: To the west you can see the entrance to the building.
  extras:
  - keywords: [pamphlet, leaflet, photograph, photo]
    text: >
      This portrays various bodily functions and things vaguely related that turn even your stomach... 
      Blech!

"tba:301:room:30173":
  name: De-Tox Unit
  description: >
    This room seems to be the place where people get "detoxified".  Although it smells pretty bad, it
    wouldn't be a bad idea to remember where this is so that you can rest here later.  You find it rather
    difficult to manoeuvre in here because of the large number of drunks on the floor.  The only exit is
    north.
  sector: hills
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:301:room:30131
      look: Back to the entrance...  out of the bad smells here...

"tba:301:room:30174":
  name: Ellis Hall Lobby
  description: >
    This large room seems to serve as a display area for neat engineering devices and awards.  There
    are four exits.  The east exit will take you out towards the street whilst the north and west exits are
    too dark to see the ends of.  The stairs on the south side of the room lead up to the second floor
    and whatever might be up there...
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:301:room:30175
      look: You can't tell, it's too dark.
    east:
      to: tba:301:room:30132
      look: The street entrance to the building.
    west:
      to: tba:301:room:30177
      look: You can't tell, it's too dark.
    up:
      to: tba:301:room:30180
      look: >
        You aren't quite sure what could be at the top of the stairs, but it could be interesting.
  extras:
  - keywords: [award, awards]
    text: >
      These are awards for various Engineering competitions which the university entered at one time or
      another.
  - keywords: [neat, engineering, devices]
    text: >
      You see lots of neat engineering devices which were used in the real world at some point or
      another.  At least you think they were.

"tba:301:room:30175":
  name: Hallway
  description: >
    This hallway is non-descript and has two exits.  The eastern exit seems to lead into a large room
    while the southern exit leads, well, south.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:301:room:30176
      look: There seems to be a large room to the east.
    south:
      to: tba:301:room:30174
      look: What did you expect? This exit leads south.
  extras:
  - keywords: [hallway]
    text: The hallway is non-descript, ie it has NO description, so why are you looking at it?

"tba:301:room:30176":
  name: Auditorium
  description: >
    This is the large room you probably saw from the hallway attached to its only exit (west).  There
    are numerous seats arranged like a theater would be. There is a large stage at the east end of the
    room.
  sector: forest
  flags: [dark, indoors]
  exits:
    west:
      to: tba:301:room:30175
      look: The hallway you probably entered from is handily located to the west.
  extras:
  - keywords: [goalie]
    text: How did you know it was a goalie stick?  Have you been reading the keywords?
  - keywords: [crest]
    text: The crest seems to be the crest belonging to the class of `97.
  - keywords: [hockey, stick]
    text: >
      This is a hockey stick with illegible writing on it.  On one side there is a crest prominently
      displayed.
  - keywords: [stage]
    text: >
      The stage is located at the west end of the room.  In one corner of the stage, there is a hockey
      stick lying on the ground.

"tba:301:room:30177":
  name: Hallway
  description: >
    This non-descript hallway has an exit to the east and one to the west. Unfortunately, you can't see
    what the exits lead to.  Just before you finish looking, you notice a door to the north.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:301:room:30179
      look: This seems to lead to a library.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:301:room:30174
      look: You still can't see where this leads.
    west:
      to: tba:301:room:30178
      look: You can't see where this exit leads so stop trying to get a sneak preview.
  extras:
  - keywords: [door]
    text: It looks just like every other door you've seen.

"tba:301:room:30178":
  name: The Back Exit
  description: >
    This corridor comes to a sudden halt here as a door seems to be blocking the way to the west.  If
    you were to go east, though, you would not have a problem as the corridor seems to continue that way.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:301:room:30177
      look: The hallway looks to continue in this direction.
    west:
      to: tba:301:room:30187
      look: This leads to a back pathway.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:301:obj:30101
        reset: locked

"tba:301:room:30179":
  name: Library
  description: >
    This library is full of incomprehensible engineering texts.  Included in the selection here are
    textbooks dealing with Geology, Calculus, and Mechanics. What fun it would be to spend an entire day
    just reading these books! Fortunately you won't be disturbed because there is one exit.  To the south
    there is a door.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:301:room:30177
      look: A hallway lies to the south.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [calculus, geology, mechanics, text, textbook, texts, textbooks]
    text: These exciting books are sure to fill one of your days with joy!

"tba:301:room:30180":
  name: Upper Lobby
  description: >
    This lobby has four exits, East and West, North and the stairwell to the south which leads down. 
    You can't see where the stairwell leads.  For that matter you can't see where any of the exits lead.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:301:room:30183
      look: It's too dark to see.
    east:
      to: tba:301:room:30181
      look: It's too dark to see.
    west:
      to: tba:301:room:30182
      look: It's also too dark to see.
    down:
      to: tba:301:room:30174
      look: This, like all the other exits, is to dark to tell what it is.

"tba:301:room:30181":
  name: A Classroom
  description: >
    This classroom is completely deserted.  There are no desks, no chairs, no tables, no nothing... 
    Wait, that would mean something is here, wouldn't it? Alright, there is something, there is an exit to
    the west.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    west:
      to: tba:301:room:30180
      look: This leads back to the upper lobby.

"tba:301:room:30182":
  name: A Classroom
  description: >
    This classroom is completely deserted.  There are no desks, no chairs, no tables, no nothing... 
    Ok, you caught me again, there is an exit to the east.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:301:room:30180
      look: This leads back to the upper lobby.

"tba:301:room:30183":
  name: Hallway
  description: >
    This hallway has three conventional exits and a door.  East, south and west are conventional whilst
    the north wall holds a door.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:301:room:30186
      look: This seems to be an office.
      door:
        keywords: [door]
        kind: door
        key: tba:301:obj:30100
        reset: locked
    east:
      to: tba:301:room:30184
      look: It's too dark to see.
    south:
      to: tba:301:room:30180
      look: It's too dark to see.
    west:
      to: tba:301:room:30185
      look: It's too dark to see.

"tba:301:room:30184":
  name: A Classroom
  description: >
    This classroom is completely deserted.  There are no desks, no chairs, no tables, no nothing... 
    Except the typical exit to the west of course.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    west:
      to: tba:301:room:30183
      look: This leads back to the hallway.

"tba:301:room:30185":
  name: A Classroom
  description: >
    This classroom is completely deserted.  There are no desks, no chairs, no tables, no nothing... 
    Not even an exit to the north, good thing since the actual exit is to the east.
  sector: city
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:301:room:30183
      look: This leads back to the hallway.

"tba:301:room:30186":
  name: Faculty Office
  description: >
    This room seems to be in shambles, as security has recently apprehended a student trying to break
    in.  A huge desk has been toppled over and now rests against a wall.
  sector: city
  flags: [dark, indoors]
  exits:
    south:
      to: tba:301:room:30183
      look: This door leads to the hall.
      door:
        keywords: [door]
        kind: door
        key: tba:301:obj:30100
        reset: locked
  extras:
  - keywords: [desk, huge]
    text: It rests against the wall.

"tba:301:room:30187":
  name: Back Path
  description: >
    This pathway leads off into the distance.  You find yourself wondering what could be at the end of
    it.  To the north the path continues, to the east, a door graces the building next to you.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:301:room:30188
      look: The pathway continues.
    east:
      to: tba:301:room:30178
      look: This leads into the building.
      door:
        keywords: [door]
        kind: pickproof
        key: tba:301:obj:30101
        reset: locked
  extras:
  - keywords: [building]
    text: This is the back side of Ellis Hall, the Engineering building.
  - keywords: [pathway]
    text: The path is well worn, but there are no discernible footsteps upon it.

"tba:301:room:30188":
  name: A Pathway
  description: The path continues north-south.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:301:room:30189
      look: The path continues.
    south:
      to: tba:301:room:30187
      look: The path approaches a building.
  extras:
  - keywords: [building]
    text: Wait until you can see it better.

"tba:301:room:30189":
  name: A Pathway
  description: >
    The pathway continues north-south.  To the north you can see a tall, thin structure sticking up
    from the ground.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:301:room:30190
      look: The pathway continues.
    south:
      to: tba:301:room:30188
      look: The pathway continues.

"tba:301:room:30190":
  name: Approach To The Greasepole
  description: >
    The path seems to be taking a direct route to the needle-like structure just to the north.  To the
    south the path continues.
  sector: hills
  flags: [no_mob]
  exits:
    north:
      to: tba:301:room:30191
      look: The path begins to lead to a large pit.
    south:
      to: tba:301:room:30189
      look: The path continues.

"tba:301:room:30191":
  name: The Greasepit
  description: >
    The tall, needle-like structure stands right in front of you.  There are two ways you can go: to
    the south on the path, or up the greasepole.
  sector: hills
  flags: [no_mob]
  exits:
    south:
      to: tba:301:room:30190
      look: The path leads off to the south.
    up:
      to: tba:301:room:30193
      look: The pole looms tall in front of you.  The only way up it is obvious... Up.
  extras:
  - keywords: [pole, grease, greasepole]
    text: This pole is covered with grease and looks horrendously hard to climb.

"tba:301:room:30192":
  name: The Greasepole
  description: >
    SPLASH!!!  Down the pole you slide...  You arrive at the bottom again... As usual the exits are to
    the south and up.
  sector: mountains
  flags: [no_mob]
  exits:
    south:
      to: tba:301:room:30190
      look: The path leads off to the south.  It looks like a good place to go.
    up:
      to: tba:301:room:30193
      look: The pole looms tall in front of you.
  extras:
  - keywords: [pole, grease, greasepole]
    text: This pole is covered with grease and looks even worse than it did before.

"tba:301:room:30193":
  name: The Greasepole
  description: The only exits are up and down.
  sector: mountains
  flags: [no_mob]
  exits:
    up:
      to: tba:301:room:30194
      look: The pole looms ever high above you.
    down:
      to: tba:301:room:30192
      look: It's a long slide down.
  extras:
  - keywords: [pole, greasepole, grease]
    text: The pole still looks pretty bad, and things don't seem to be getting better.

