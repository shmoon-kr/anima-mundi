  description: >
    You stand just inside the front door to this stone dwelling.  A short hallway leads west from you. 
    A door is set in the south wall right next to you and another door is set in the north wall just
    west from here.  You may depart the building to the east.
  sector: inside
  flags: [dark]
  exits:
