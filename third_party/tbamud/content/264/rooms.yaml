"tba:264:room:26408":
  name: At the Base of a Huge Tree
  description: >
    The tree you stand next to is so large, so immense that you could not even wrap your arms halfway
    around it's trunk.  It soars high into the darkness of the forest roof and beyond, still as thick as
    four men at that point.  You hold your light a little closer to the tree and see that it has some sort
    of markings on it.  Off to the west, you can see some sort of glow.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26419
    east:
      to: tba:264:room:26428
    south:
      to: tba:264:room:26420
    west:
      to: tba:264:room:26438
  extras:
  - keywords: [tree]
    text: >
      The Markings read: -Beware the cold Embrace of the Banshee. There appears to be some sort of stain
      just below that, as well. It almost looks like dry blood.

"tba:264:room:26409":
  name: On Some Tangled Roots
  description: >
    You stand atop a large tangle of roots which extend out from a gigantic tree, one which looks to be
    the oldest in this forest, if size is any indicator.  You look down into the vines.  It almost looks
    as if something is moving down there. In fact, it appears that something is glowing to the south.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26400
    east:
      to: tba:264:room:26420
    south:
      to: tba:264:room:26430
    west:
      to: tba:264:room:26419

"tba:264:room:26410":
  name: Across a Log
  description: >
    This log traverses a deep ditch, one that looks like would prevent you from further travel in any
    direction.  Down in the ditch, you see something small and shiny, although from here you cannot see
    exactly what the item is.  Is that some sort of glow to the east?
  sector: forest
  flags: [dark]
  exits:
    north:
