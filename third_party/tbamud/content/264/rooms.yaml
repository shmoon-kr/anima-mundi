  description: >
    This large tree looks to have struck by lightning right dead in it's center. The huge trunk is
    blasted in half about twenty feet above your head.  The tree was so large that when it fell, one of it's
    branches fell to make a natural bridge across a large ditch.
  sector: forest
  flags: [dark]
