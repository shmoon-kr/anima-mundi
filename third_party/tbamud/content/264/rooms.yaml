    west:
      to: tba:264:room:26419

"tba:264:room:26411":
  name: Through the Tree Roots
  description: >
    You are now deep in the roots of the giant tree.  All around you, thick roots dig into the soil of
    the forest feeding out it's life.  Shining your light ahead, you think you may see furtive movement
    behind one of the vines.  You may even see some kind of light off to the north.
  sector: forest
  flags: [dark]
  exits:
    north:
