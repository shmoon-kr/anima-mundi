"tba:264:room:26435":
  name: Voce Lane
  description: >
    The lane runs north and south through the village.  A strange, singing sound comes from the
    northwest.  It would be quite a beautiful sound were it not coming from somewhere in this dark and gloomy
    village deep in this dark and sinister forest.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26434
    south:
      to: tba:264:room:26436

"tba:264:room:26436":
  name: Voce Lane
  description: >
    You stand near the southern end of the lane, a low stone home to your east. To the north the lane
    runs through the center of the village, south the lane leads out into the forest, sloping upward out
    of this hollow.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26435
    east:
      to: tba:264:room:26445
    south:
      to: tba:264:room:26437

"tba:264:room:26437":
  name: Voce Lane
  description: >
    You enter just inside a small village on a lane which runs north through the main part.  There is a
    small sign here, one which catches your eye.  You look ahead into the village and notice, to your
    alarm, that there seems to be no inn or tavern of any kind.  Strange that a village, even a small one
    like this, would have no place to rest.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26436
    south:
      to: tba:264:room:26438
    west:
      to: tba:264:room:26439

"tba:264:room:26438":
  name: At the Fringes of Civilization
  description: >
    You stand at the outskirts of a small village tucked away deep in the bottom of this hollow.  The
    strange glow you saw from the forest was a small lantern mounted on a post which, although by normal
    standards, would be considered dim at best, seems to blaze with light down here in the darkest realms
    of the forest.  You may climb back up the slope or investigate this small forest village.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26437
    east:
      to: tba:264:room:26408
    south:
      to: tba:264:room:26411

