"tba:264:room:26430":
  name: At the Fringes of Civilization
  description: >
    You step through the trees and out of the darkness into an open glade nestled deep in this hollow. 
    A small lane stretches south into a tiny village, lined by low, stone and mortar homes.  The source
    of the glow you saw from back in the forest is a small street lantern mounted on a post.  Although
    it's light would be considered meager at best out in the world above, here it seems to burn with a
    fierce light, one that makes you squint.  You see that all along the lane there are similiar lanterns on
    posts as well.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26409
    south:
      to: tba:264:room:26431
    west:
      to: tba:264:room:26410

"tba:264:room:26431":
  name: Voce Lane
  description: >
    The lane stretches south into the village, past many low homes.  You peer out along the street, but
    try as you might, you cannot see a single business or tavern of any sort.  Strange that a village,
    even one in the middle of nowhere, would not have an inn or something.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26430
    south:
      to: tba:264:room:26432
    west:
      to: tba:264:room:26457

"tba:264:room:26432":
  name: Voce Lane
  description: >
    The lane continues south through the village past many low stone homes . There is one, in fact,
    just east of you now.  To the north is a small bit of the lane that leads back out into the forest and
    back up the hill.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26431
    east:
      to: tba:264:room:26455
    south:
      to: tba:264:room:26433

"tba:264:room:26433":
  name: Voce Lane
  description: >
    You travel through this strange village, past all the homes and wonder what sort of folk could live
    in such seclusion.  You think you may hear a bit of singing off to the southwest.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26432
    south:
      to: tba:264:room:26434

"tba:264:room:26434":
  name: Voce Lane
  description: >
    A smaller lane branches off to the east, one that leads to the largest building you have seen thus
    far in this village.  The singing you have been hearing comes from that building, or at least from
    that general direction.  The road runs north and south from you as well.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26433
    south:
      to: tba:264:room:26435
    west:
