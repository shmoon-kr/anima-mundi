"tba:264:room:26419":
  name: Hanging Vines
  description: >
    These thick, brown, peeling vines hang down from the tree limbs high above your head.  You notice
    that although they are peeling quite badly, the peeling seems to have been scuffed or pulled off in
    some spots.  What kind of animal could climb vines that high and that thin?
  sector: forest
  flags: [dark]
  exits:
