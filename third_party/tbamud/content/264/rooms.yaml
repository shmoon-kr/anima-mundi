"tba:264:room:26413":
  name: Near a Fox's Den
  description: >
    You stand near a small hole dug into the hillside.  It appears that there is no one home right now,
    or if there is anyone home, they are being very quiet and very still.  Looking around you, you
    realize that you may be just a little lost. Make that a lot lost.
  sector: forest
  flags: [dark]
