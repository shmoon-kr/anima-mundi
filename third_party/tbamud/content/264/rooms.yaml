    west:
      to: tba:264:room:26401

"tba:264:room:26417":
  name: On a Large Boulder
  description: >
    You come to a rest atop a huge boulder which rises up from the forest floor. It reminds you that
    just west of you is the cliff face which leads up to where the sun is still shining, where you do not
    have to fear for your life every step of the way.  It is easy to forget there are still places like
    that - at least while you are down here.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26429
    east:
      to: tba:264:room:26416
    south:
      to: tba:264:room:26402
    west:
      to: tba:264:room:26407

"tba:264:room:26418":
  name: Just Below a Large Boulder
  description: >
    A large boulder rises up out of the ground, high into the air.  It seems that if you could get up
    on the boulder, you might get a good view of the way downhill.  The only other option is to just
    continue down hill and hope for the best.
  sector: forest
  flags: [dark]
  exits:
