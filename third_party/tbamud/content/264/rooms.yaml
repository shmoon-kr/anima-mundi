"tba:264:room:26426":
  name: The Dark Forest
  description: >
    Travelling through this dark and mysterious realm, you cannot help but wonder what was your
    foolhardy reason for making the trek down that cliff face in the first place.  Most people with some shred
    of common sense wouldn't even have given it a second thought when they saw those rungs in the stone,
    they would've turned right around.  Maybe you should've, too.
  sector: forest
  flags: [dark]
  exits:
