"tba:264:room:26463":
  name: The Temple Blvd
  description: >
    This short street leads directly west to a temple where a beautiful, hypnotic melody can be heard,
    softly soothing your tired muscles and relaxing your guard. To the northwest there is another large
    building of some sort, it almost looks to be a temple itself.  Voce Lane, the main street through the
    village, is just east of you.
  sector: field
  flags: [dark]
  exits:
    east:
      to: tba:264:room:26434
    west:
      to: tba:264:room:26464

"tba:264:room:26464":
  name: The Temple Blvd
  description: >
    You stand before the large doors to the temple.  The song from within seems so calming, so loving,
    that you almost tear the doors open without a thought. But then you think - why in the world would
    anyone come through a terrible and evil forest, almost get killed, search their way into this village
    through the hollow, and then start singing?  Maybe it would be best not to open those doors, after all.
  sector: field
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26465
    east:
      to: tba:264:room:26463
    west:
      to: tba:264:room:26466

"tba:264:room:26465":
  name: The Home of the Father
  description: >
    This place, more a mausoleum than a home of any kind, house a large open room which holds a huge
    four posted bed, which dominates most of the space the room offers.  Thin, white sheets enclose the bed
    and it's occupants, however the sheets are so thin that you can see that they are lying perfectly
    still, hands clasped over their breast, eyes open and staring into space.  The exit lies south.
  sector: inside
  exits:
    south:
      to: tba:264:room:26464

"tba:264:room:26466":
  name: Temple of the Voce
  description: >
    This large, open room is one huge set of stands with progressly get higher and higher until they
    touch the far wall.  A great many banshee, many of differing disciplines, come together here to sing
    for the Father, the Mother, and the Goddess Cathari, who sits on her throne here, enjoying the music.
    Although most of the banshee here seem to notice your presence, none of them seem at all threathened
    or even bothered by your presence in their temple. Some even smile kindly at you.  What the Hell is
    going on here?
  sector: inside
  exits:
    east:
      to: tba:264:room:26464
