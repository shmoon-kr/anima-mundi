"tba:264:room:26416":
  name: Near a Stand of Evergreens
  description: >
    This small stand of pine trees seems to be the only trees here that boast any sort of life. 
    Although the greenery is only needles, it still gives you pause and makes you glad that at least in one
    part of this awful place, something lives in accordance with nature.
  sector: forest
  flags: [dark]
