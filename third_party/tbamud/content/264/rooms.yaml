# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 264.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:264:room:26400":
  name: On a Forest Slope
  description: >
    Not much here.  The forest slopes downward into am even darker region of forest which at this point
    is not in sight.  To the east is a more level section of forest where you at least have a better
    fighting chance.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:264:room:26420
    east:
      to: tba:266:room:26655
    south:
      to: tba:264:room:26428
    west:
      to: tba:264:room:26401
  extras:
  - keywords: [credits, info]
    text: >
      *Banshide - by Kaan for Dibrova This zone was written using a smattering of information found on
      various websites regarding the mysterious Banshee and their traditional home, Banshide. We implemented
      a new attack type for the mobs in this zone called EMBRACE since a banshee's way of killing their
      victim is to embrace them and drain their life. There is some kick ass eq in there that shouldn't be
      easy to get and a Fountain of Eternal Life that we made to contain a neverending supply of healing water
      - water that cast cure light with every drink.  By making the village so difficult to find, we felt
      it would keep this fountain from being abused. Entrance/Exit: 00E, 28N

"tba:264:room:26401":
  name: On a Forest Slope
  description: >
    The forest slopes gently downhill toward an unknown destination, if there even is one at the bottom
    of this hill.  You realize that although you haven't been in the forest that long, you are
    hopelessly lost.
  sector: forest
  exits:
    north:
      to: tba:264:room:26429
    east:
      to: tba:264:room:26416
    south:
      to: tba:264:room:26402
    west:
      to: tba:264:room:26429

"tba:264:room:26402":
  name: In a Quiet Forest
  description: >
    All around you the forest leans in and forces you to be aware of it's size and strength - it's
    immensity.  Not a bird calls, not a creature skitters, just the wind, creaking through the dark branches
    overhead.
  sector: forest
  exits:
    north:
      to: tba:264:room:26417
    east:
      to: tba:264:room:26419
    south:
      to: tba:264:room:26403
