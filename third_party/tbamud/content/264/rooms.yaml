    south:
      to: tba:264:room:26413
    west:
      to: tba:264:room:26422

"tba:264:room:26415":
  name: A Faint Path
  description: >
    Finally!  Through the darkness and the cover of leaves which coat the entire floor of this forest,
    you think you see some sort of trail.  It appears that the trail leads east and west, toward
    something...
  sector: forest
  flags: [dark]
