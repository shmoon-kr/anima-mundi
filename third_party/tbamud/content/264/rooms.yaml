"tba:264:room:26414":
  name: Lost in the Forest
  description: >
    You turn slowly in a long circle, trying to locate something, antything that gives some sort of
    reminder to you where you are, but all you can see in any direction is dark, twisted trees and the hill,
    always leading down.
  sector: forest
