# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 101.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:101:room:10100":
  name: South Road Zone Description Room
  description:
    preformatted: |2
         Builder   :
      Zone         : 101 South Road
      Began        : 1999
      Player Level : 6-8
      Rooms        : 38
      Mobs         : 13
      Objects      : 17
      Shops        : 0
      Triggers     : 0
      Theme        : The zone is a basic highway filler to link other zones.
      Notes        : Meant to connect a main city, Haven, and Iuel.Plains/fields
         with the desert and mountains to the east. A river runs through it ;-).
      Replace all XXXX with a name of a major city.
      Links        : 01n to a city, 10s, 37s to Haven
      Zone: 101 was linked to the following zones:
       107 Realms of Iuel                 at  10131 (west ) ---> 10740
  sector: inside
  flags: [private]

"tba:101:room:10101":
  name: The South Road
  description: >
    You are just south of the gates to a city.  A gust of warm wind blows in from the east warning you
    that the desert isn't far off in that direction.  The road leads off to the south, and north into the
    capital.  To the east and west farmland stretches as far as you can see.
  sector: field
  exits:
    south:
      to: tba:101:room:10102
  extras:
  - keywords: [gates]
    text: >
      You are looking at the great gates of XXXX.  The citywall towers before you, there is no way you
      could get in, save through these huge gates.

"tba:101:room:10102":
  name: The South Road
  description: >
    You are walking on the south road which connects to the city of Haven. Fields stretch to the east
    and west while the road continues north toward the southern gate of the capital, which you can just
    barely see from here, and south through the farmland.  A warm wind from the east reminds you of the
    desert.
  sector: field
  exits:
    north:
      to: tba:101:room:10101
    south:
      to: tba:101:room:10103

