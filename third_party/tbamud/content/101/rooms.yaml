  exits:
    north:
      to: tba:101:room:10130
    east:
      to: tba:101:room:10128

"tba:101:room:10130":
  name: A Small Trail
  description: >
    You are on a small trail which continues south and uphill to the west from here.  To the west you
    can see the trail getting wider as it continues toward what seems to be smoking chimneys.  Maybe there
    is a village near here.
  sector: field
  exits:
    south:
      to: tba:101:room:10129
    west:
      to: tba:101:room:10131

"tba:101:room:10131":
  name: The Top of The Hill
  description: >
    You are standing on a small hilltop.  The trail you have followed here leads off to the east, where
    it makes a turn southward.  To the west, it turns toward an eerie looking village.  An uneasy
    feeling comes over you as your gaze returns to the village.
  sector: field
  exits:
    east:
      to: tba:101:room:10130
    west:
      to: tba:107:room:10740

"tba:101:room:10132":
  name: The South Road
  description: >
    You are walking on the south road connecting Haven and the city.  The mountains are dominating your
    view to the southeast while a large forest rises to the southwest.  You feel the warm wind from the
    desert, almost taunting you with its presence.  The road continues to the north where you can just
    barely make out a small trail leading west and to the south, closer to the mountains and Haven.
  sector: field
  exits:
    north:
      to: tba:101:room:10124
    south:
      to: tba:101:room:10133

"tba:101:room:10133":
  name: The South Road
  description: >
    You are on the south road, somewhere between Haven and the city.  A warm wind blows in from the
    desert in the east where you see a yellow streak on the horizon revealing the desert to you.  The road
    continues south toward Haven, where a dense forest forces it to make a turn eastward, and north,
    through the open land towards the city.  The great southern mountain range towers before you in the
    southeast.
  sector: field
  exits:
    north:
      to: tba:101:room:10132
    south:
      to: tba:101:room:10134

"tba:101:room:10134":
  name: The South Road
  description: >
    You are on the south road somewhere in between the city and Haven.  A dense forest towers before
    you just south of here while to the north there is nothing but open land on both sides of the road.  To
    the east you see the road turn south again as to avoid getting too close to the mountains not far
    off in the distance.  The mountains provide some cover for the desert winds but you can just feel them
    here, warm winds blowing in from the east as if to remind you of the mysteries hidden there.
  sector: field
  exits:
    north:
      to: tba:101:room:10133
    east:
      to: tba:101:room:10135

"tba:101:room:10135":
  name: The South Road
  description: >
    The road leads off to the south like a giant snake eating its way through the hills in between a
    dense forest to the west and the mountains to the east. Sounds from unseen, and probably even unknown,
    animals can be heard from the forest to the west but at this point you see no way of entering the
    dense shrubs and woods preventing entrance to the adventures which are likely to be within. The wind
    here is a strange blend of hot dry desert air and biting cold from the mountain glaciers.
  sector: field
  exits:
    south:
      to: tba:101:room:10136
    west:
      to: tba:101:room:10134

"tba:101:room:10136":
  name: The South Road
  description: >
    The road continues to the north, where it makes a turn west, and to the south, through the
    foothills between the mountains to the east and a dense forest to the west.  Animal sounds can be heard from
    the forest, which at this point is too dense to enter.
  sector: hills
  exits:
    north:
      to: tba:101:room:10135
    south:
      to: tba:101:room:10137

"tba:101:room:10137":
  name: The South Road
  description: >
    You are on the south road which continues north and south, through hills between a dense forest to
    the west, and the mountains towering over you to the east, gusts of cold wind comes in from the
    mountains to the east, strangling the sounds from the forest.  You barely notice the small trail leading
    east from here towards the mountains.
  sector: hills
  exits:
    north:
      to: tba:101:room:10136
    south:
      to: tba:39:room:3900
