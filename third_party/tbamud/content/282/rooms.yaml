# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 282.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:282:room:28200":
  name: The pit of Kerjim
  description: >
    You stand at the edge of a pit, you can hear screams of death, violence that make your blood
    curdle.  This is the pit of Kerjim, an ancient demon able to slay any mortal.  It is pitch black, and there
    are prying eyes all around. There is an engraving on the wall here.
  sector: inside
  exits:
    south:
      to: tba:265:room:26536
    down:
      to: tba:282:room:28201
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           ===========================================================================
                                 The Infernal Pit of Kerjim
        ------------------------------------------------------------------------------
        By: Raf & Blizzard
        
        Description:
        Kerjim is an evil monster who has been trapped far beneath the Earth's
        surface for centuries. Now, his demonic minions have burrowed a tunnel
        up into our world, causing chaos where ever they are encountered.
        
        Requirments for using this area:
        [1] You include the authors in your HELP ZONE files, or the equivilant
        [2] You send an email to Raf (picard@indigo.ie), saying you use this,
            what your mud is, etc.
        ==============================================================================
        
        The Authors can be reached at their email addresses quoted below, or on
           Burning MUD - burning.stacken.kth.se 4000
        --Raf                                        --Blizzard
          picard@indigo.ie                            purcellc@post.queensu.ca
        Zone 282 is linked to the following zones:
        265 Beach & Lighthouse             at 28200 (south) ---> 26536
  - keywords: [engraving, wall]
    text:
      preformatted: |2
           **********************************
           *             BEWARE!!!          *
           *       Here Dwells Kerajim,     *
           *       King of the Balrogs.     *
           *       Die at your own risk,    *
           * We very much doubt the chances *
           *     of any Corpse Retrieval    *
           *                                *
           *         Raf & Blizzard         *
           **********************************

"tba:282:room:28201":
  name: In the pit
  description: >
    Smells of blood saunter through the air, making your stomach turn.  Fear creeps through you as you
    climb down the side of this endless pit.
  sector: inside
  exits:
    up:
      to: tba:282:room:28200
    down:
      to: tba:282:room:28202

"tba:282:room:28202":
  name: In the pit
  description: >
    The ashfrom the side of the rock wall dismays you and irritates your skin. You can sense the
    presence of pure evil as you climb down.
  sector: inside
  exits:
    up:
      to: tba:282:room:28201
    down:
      to: tba:282:room:28203

"tba:282:room:28203":
  name: In the pit
  description: >
    You are in the center of the chasme, the screams and desperate cries of loss cause an avalance to
    fall.  There is no longer an escape upwards.
  sector: inside
  exits:
    down:
      to: tba:282:room:28204

"tba:282:room:28204":
  name: Nearing the bottom
  description: >
    The pit is nearing the bottom, you can see a large throne down below.  It is made with fine
    obsidian, and bejeweled with golden stones.
  sector: inside
  exits:
    up:
      to: tba:282:room:28203
    down:
      to: tba:282:room:28205

"tba:282:room:28205":
  name: Nearing the bottom
  description: >
    The base of the pit is close, your hands tremble and make it hard for you too get a good grip of
    the firm stone side.
  sector: inside
  exits:
    up:
      to: tba:282:room:28204
    down:
      to: tba:282:room:28206

"tba:282:room:28206":
  name: Nearing the bottom
  description: >
    You have made it past most of the dreaded creatures, but more still awaits you at the bottom.  Odd
    looking creatures surrond you, wielding anything from daggers to stone clubs.  Fear sweeps the eye of
    the enemy it looks as if they have been under an enchantement.
  sector: inside
  exits:
    up:
      to: tba:282:room:28205
    down:
      to: tba:282:room:28207

"tba:282:room:28207":
  name: At the base of the pit
  description: >
    A large throne scales the room, it's black obsidian laced with golden jewels adds an enchanting and
    soothing affect to the murky hell hole.  In the throne sits Kerjim, the ancient demon, king to the
    Balrogs.  The power he wields overwhelmes you.
  sector: inside
  exits:
    north:
      to: tba:282:room:28217
    east:
      to: tba:282:room:28221
    south:
      to: tba:282:room:28211
    west:
      to: tba:282:room:28208
    up:
      to: tba:282:room:28206

"tba:282:room:28208":
  name: A cavern
  description: >
    A long cavern continues to the west, at the end of it is a bright glowing statue, you can not make
    out any of it's features but it looks magnificent.
  sector: inside
  exits:
    north:
      to: tba:282:room:28227
    east:
      to: tba:282:room:28207
    south:
      to: tba:282:room:28230
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:282:room:28209

"tba:282:room:28209":
  name: Nearing the statue
  description: >
    You can beging to make out the features on it, it is made of solid opal which is gleaming in the
    light.  It appears to be a statue of some great god or creature.
  sector: inside
  exits:
    east:
      to: tba:282:room:28208
    west:
      to: tba:282:room:28210

"tba:282:room:28210":
  name: Upon the heathe
  description: >
    The floor of the cavern quickly fades into a muddy liquid and the surronding walls beging to melt. 
    You are in a swampy cavern, a heathe.  The statue is in the middle of the heathe, on a standing
    platform.
  sector: inside
  exits:
    east:
      to: tba:282:room:28209
    south:
      to: tba:282:room:28231

"tba:282:room:28211":
  name: A fathomless room
  description: >
    This most be the biggest room you have ever seen, it appears to be a type of barracks where the
    creatures sleep.  There are cots all over the ground, and an oil lamp hanging on the wall.
  sector: inside
  exits:
    north:
      to: tba:282:room:28207
    east:
      to: tba:282:room:28215
    south:
      to: tba:282:room:28212
    west:
      to: tba:282:room:28214

"tba:282:room:28212":
  name: A fathomless room
  description: >
    There barracks continues, there are more cots lined up on the marshy ground. The room smells of
    dead corpses and other foul smelling things.
  sector: inside
  exits:
    north:
      to: tba:282:room:28211
    south:
      to: tba:282:room:28213

"tba:282:room:28213":
  name: A fathomless room
  description: >
    A murky dust fills the air and makes it hard for you to breath, and the ash off the walls makes
    your eyes squint.
  sector: inside
  exits:
    north:
      to: tba:282:room:28212
    east:
      to: tba:282:room:28216

"tba:282:room:28214":
  name: A fathomless room
  description: >
    The longer you stay down here, the more you wish to see the sun and the clouds once again, but
    gloom rests upon your soul and makes sorrow fill your emotions.
  sector: inside
  exits:
    east:
      to: tba:282:room:28211

"tba:282:room:28215":
  name: A fathomless room
  description: >
    A demonic presence states this territory, you have the urge to run and scream, but your better
    judgement prevents that from happening.
  sector: inside
  exits:
    west:
      to: tba:282:room:28211

"tba:282:room:28216":
  name: A fathomless room
  description: >
    Gloom clouds your better judgement and you begin to saunter around the room. It slowly drives you
    insane.
  sector: inside

"tba:282:room:28217":
  name: A tight cavern
  description: >
    This cavern is very tight, you can barely fit inside it.  It doesn't appear to be leading anywhere
    special.  It just continues to the north.
  sector: inside
  exits:
    north:
      to: tba:282:room:28218
    south:
      to: tba:282:room:28207

"tba:282:room:28218":
  name: A tight cavern
  description: >
    The cavern keeps going north, and keeps getting tighter and tighter.  This tunnel might have been
    caused by an underground earthquake.
  sector: inside
  exits:
    north:
      to: tba:282:room:28219
    south:
      to: tba:282:room:28217

"tba:282:room:28219":
  name: A tight cavern
  description: >
    You are almost at the end of the cavern.  A hazy mist surrounds you, maybe this cavern is going
    somewhere improtant.
  sector: inside
  exits:
    north:
      to: tba:282:room:28220
    south:
      to: tba:282:room:28218

"tba:282:room:28220":
  name: A small temple
  description: >
    This is a small temple, there is a table in the center of the room covered with plates and
    utensils.  Everything here is black, there is are curtains all around covering the burnt walls.  The floor
    has runes encrusted into them, you can make out some of them, they are markings of the devil.
  sector: inside
  exits:
    south:
      to: tba:282:room:28219

"tba:282:room:28221":
  name: A trail of blood
  description: >
    A small pebble trail leads into the inpending darkness, it is covered with blood.  The trail leads
    on into the darkness.
  sector: inside
  exits:
    east:
      to: tba:282:room:28222
    west:
      to: tba:282:room:28207

"tba:282:room:28222":
  name: A bend in the trail
  description: >
    There is blood leaking off the trail, there seems to have been a lot of combat in this area, the
    trail winds now to the north.
  sector: inside
  exits:
    north:
      to: tba:282:room:28223
    west:
      to: tba:282:room:28221

"tba:282:room:28223":
  name: Another bend in the trail
  description: >
    This tunnel seems to have a lot of twists and turns to it.  It makes another sharp turn to the east
    and continues onward.
  sector: inside
  exits:
    east:
      to: tba:282:room:28224
    south:
      to: tba:282:room:28222

"tba:282:room:28224":
  name: A straight path
  description: >
    The path continues to the east without any turns, you can not see very far in for it is so dark. 
    The blood is now around your ankles and still climbing.
  sector: inside
  exits:
    east:
      to: tba:282:room:28225
    west:
      to: tba:282:room:28223

"tba:282:room:28225":
  name: A straight path
  description: >
    The path is nearing an end, the blood is no longer a dark red color, but instead has become a light
    bluish color, perhaps he blood of a Balrog.
  sector: inside
  exits:
    east:
      to: tba:282:room:28226
    west:
      to: tba:282:room:28224

"tba:282:room:28226":
  name: The end of the path
  description: >
    The long tunnel has finally ended, corpses are lying dead on the surronding gravel, both human and
    balrog.  Smells of blood fill your nostrils and make you sick.
  sector: inside
  exits:
    north:
      to: tba:282:room:28235
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:282:room:28225

"tba:282:room:28227":
  name: A cavern
  description: >
    A cavern continues along north, leading to a small pit used for burial reasons.  A putrid smell
    fills the clean air.
  sector: inside
  exits:
    north:
      to: tba:282:room:28228
    south:
      to: tba:282:room:28208

"tba:282:room:28228":
  name: Beside the burial pit
  description: >
    The things you see inside the pit are, obscene and horrid.  It is disgusting how they treat there
    dead, all piled up to be burnt in a whole.
  sector: inside
  exits:
    north:
      to: tba:282:room:28229
    south:
      to: tba:282:room:28227
      door:
        keywords: [door]
        kind: door

"tba:282:room:28229":
  name: In the burial pit
  description: >
    You are amongst a pile of dead bodies, flees and other deseases are swarming around, attracted to
    the smell of the dead.
  sector: inside
  exits:
    south:
      to: tba:282:room:28228

"tba:282:room:28230":
  name: A secret chamber
  description: >
    You are in a chamber filled with howling balrogs.  There are many different items of toture here,
    the rack, the vise and others.
  sector: inside
  exits:
    north:
      to: tba:282:room:28208
      door:
        keywords: [door]
        kind: door

"tba:282:room:28231":
  name: In the heathe
  description: >
    The marshy swamp fills the cavern, mud is up to your knees.  The top of the cavern is made of dirt
    and looks like it could fall at anytime.  Small chunks of weeds moss float through the mud ever so
    slowly.
  sector: inside
  exits:
    north:
      to: tba:282:room:28210
    east:
      to: tba:282:room:28232

"tba:282:room:28232":
  name: In the heathe
  description: >
    The underground heathe continues to the east, filled with small winged creatures that flutter
    around for the sole purpose of annoyance.
  sector: inside
  exits:
    east:
      to: tba:282:room:28233
    west:
      to: tba:282:room:28231

"tba:282:room:28233":
  name: The end of the heathe
  description: >
    You have reached the end of the heathe, you can here an insane cackle coming from within the
    walls.  The heathe conjures magic that can elude the mind, turning one, insane.
  sector: inside
  exits:
    west:
      to: tba:282:room:28232

"tba:282:room:28235":
  name: The maze of Kerjim
  description: >
    You stand at the entrance to an enormous maze, in the distance you can hear footsteps.  The maze is
    made of stone walls and has a lot of twists to it.
  sector: inside
  exits:
    north:
      to: tba:282:room:28236
    south:
      to: tba:282:room:28226
      door:
        keywords: [door]
        kind: door

"tba:282:room:28236":
  name: In the maze
  description: >
    The maze is an enourmous labrynth of rooms all connected together, it continues on to the west and
    east.
  sector: inside
  exits:
    south:
      to: tba:282:room:28235
    west:
      to: tba:282:room:28237

"tba:282:room:28237":
  name: Dead end of the maze
  description: This part of the maze goes no further, it is a dead end.  The only exit out is east.
  sector: inside
  exits:
    east:
      to: tba:282:room:28236

"tba:282:room:28238":
  name: In the maze
  description: >
    The maze continues further into the darkness of the east.  You can hear some sort of music being
    played, it is very faint yet very enchanting.
  sector: inside
  exits:
    east:
      to: tba:282:room:28239
    west:
      to: tba:282:room:28236

"tba:282:room:28239":
  name: In the maze
  description: >
    The sounds of music sooth your body, making you shiver with delight.  You forget all your worries
    and fade into a different reality.  The music stops and you feel the harsh realities of the world once
    again.
  sector: inside
  exits:
    north:
      to: tba:282:room:28240
    west:
      to: tba:282:room:28238

"tba:282:room:28240":
  name: In the maze
  description: >
    The maze continues, the darkness makes your soul cringe in terror.  There are exits to the north,
    west and south.
  sector: inside
  exits:
    north:
      to: tba:282:room:28241
    south:
      to: tba:282:room:28239
    west:
      to: tba:282:room:28242

"tba:282:room:28241":
  name: Dead end in the maze
  description: >
    There is a large pile of rubble blocking your way, you cannot journey any further.  The only way
    back out is to the south.
  sector: inside
  exits:
    south:
      to: tba:282:room:28240

"tba:282:room:28242":
  name: In the maze
  description: >
    The maze continues onward to the west and east, the enchanting music has begun playing again.  You
    cannot make out the melody, but it sounds like it is a harp.
  sector: inside
  exits:
    east:
      to: tba:282:room:28240
    west:
      to: tba:282:room:28243

"tba:282:room:28243":
  name: Turn in the maze
  description: >
    The maze makes a sharp turn to the north and continues on.  The music seems to make you saunter
    slowly towards it, almost as if you were drawn to the sound.
  sector: inside
  exits:
    north:
      to: tba:282:room:28244
    east:
      to: tba:282:room:28242

"tba:282:room:28244":
  name: In the maze
  description: >
    The maze continues along, leading to the south and east.  The smell of lucious fruits and roasted
    meat accompanies the music.
  sector: inside
  exits:
    east:
      to: tba:282:room:28245
    south:
      to: tba:282:room:28243

"tba:282:room:28245":
  name: In the maze
  description: The maze seems to last forever, it continues to the south and north, and the west.
  sector: inside
  exits:
    north:
      to: tba:282:room:28246
    south:
      to: tba:282:room:28242
    west:
      to: tba:282:room:28244

"tba:282:room:28246":
  name: In the maze
  description: >
    The sweat and fresh smells of gormey foods fill the air, cleansing your lungs and making your
    emotions turn to happiness, the beautifully strummed harp makes all the hatred and disgust of the Lair of
    Kerjim go away.
  sector: inside
  exits:
    north:
      to: tba:282:room:28247
    south:
      to: tba:282:room:28245

"tba:282:room:28247":
  name: A three exit junction
  description: >
    There are three exits, your can go every direction but north.  There seems to have been a cave in
    to the north, and you can no longer enter there.
  sector: inside
  exits:
    east:
      to: tba:282:room:28251
    south:
      to: tba:282:room:28246
    west:
      to: tba:282:room:28248

"tba:282:room:28248":
  name: In the maze
  description: >
    The music fades away into the distance, as does the smells.  It seems that you are walking away
    from the direction intended.
  sector: inside
  exits:
    north:
      to: tba:282:room:28249
    east:
      to: tba:282:room:28247
    west:
      to: tba:282:room:28250

"tba:282:room:28249":
  name: Another dead end in the maze
  description: >
    This maze must be ancient, there have been so many caved in spots.  The only exit is back to the
    south.
  sector: inside
  exits:
    south:
      to: tba:282:room:28248

"tba:282:room:28250":
  name: Another dead end in the maze
  description: Another cave in blocks the original path to the west, the only way back is to go east.
  sector: inside
  exits:
    east:
      to: tba:282:room:28248

"tba:282:room:28251":
  name: Another turn in the maze
  description: The maze now routes off to the north and south, and there is an exit to the west.
  sector: inside
  exits:
    north:
      to: tba:282:room:28254
    south:
      to: tba:282:room:28252
    west:
      to: tba:282:room:28247

"tba:282:room:28252":
  name: Nearing a dead end in the maze
  description: You make a sharp turn and look around, to the east is another dead end.
  sector: inside
  exits:
    north:
      to: tba:282:room:28251
    east:
      to: tba:282:room:28253

"tba:282:room:28253":
  name: A dead end in the maze
  description: >
    You have reached a dead end in the maze, a large pile of rusted armor blocks your way.  The only
    exit is to the west
  sector: inside
  exits:
    west:
      to: tba:282:room:28252

"tba:282:room:28254":
  name: In the maze
  description: >
    Of all the corridors, rooms and turns in the maze, this room has to be the strangest.  It seems
    that the walls have been pasted over with some sort of eligant plaster that has peeled off in places. 
    The ground is cold, and your feet freeze, it seems to made of a thick titanium substance.
  sector: inside
  exits:
    east:
      to: tba:282:room:28255
    south:
      to: tba:282:room:28251

"tba:282:room:28255":
  name: Another junction in the maze
  description: >
    The music that was once heard no longer exists, every thing is silent. There are exits to the east,
    west and north.
  sector: inside
  exits:
    north:
      to: tba:282:room:28257
    east:
      to: tba:282:room:28256
    west:
      to: tba:282:room:28254

"tba:282:room:28256":
  name: A dead end in the maze
  description: >
    This dead end is blocked off by an enormous statue of a warrior balrog gripping a scythe covered in
    blood.
  sector: inside
  exits:
    west:
      to: tba:282:room:28255

"tba:282:room:28257":
  name: Nearing a large door
  description: >
    In the distance you can see an enourmous door swept with the finest emeralds and bejeweled with
    gold.
  sector: inside
  exits:
    north:
      to: tba:282:room:28258
    south:
      to: tba:282:room:28255

"tba:282:room:28258":
  name: At the door
  description: >
    You stand in front of a collosel door.  Its covered with emeralds and gold. From within you can
    here the faint sound of music, and the smell of great good.
  sector: inside
  exits:
    north:
      to: tba:282:room:28259
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:282:room:28257

"tba:282:room:28259":
  name: The temple of Lilith
  description: >
    You are in a remarkable splender, the walls elegantly carved with marble and bejeweled with the
    finest of emeralds, opals, sapphires and more.  The table is covered with fresh fruits, vegetables,
    loaves of wholesome wheat bread and the smell if magnificent.  At the head of the table is a large chair
    encrusted with the name Lilith.  In it sits a beautiful woman covered in solemn clothing.
  sector: inside
  exits:
    north:
      to: tba:282:room:28260
    south:
      to: tba:282:room:28258
      door:
        keywords: [door]
        kind: door

"tba:282:room:28260":
  name: The bedroom of Lilith
  description: >
    There is a large sized bed in the center of the room with green curtains. On the left side of the
    room is a small table, and on it a lamp.  Lilith was the prisoner of Kerjim, he loved her.  She was
    forced to be locked in this room until she agreed to bewed him.  She has reached immortality and spends
    all of eternity in this room.
  sector: inside
  exits:
    south:
      to: tba:282:room:28259
