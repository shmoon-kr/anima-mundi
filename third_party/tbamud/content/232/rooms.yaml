  extras:
  - keywords: [mural, murals]
    text: >
      You see pictures of great Dragons killing horrible monsters.  You also see Warriors and Thieves
      killing monsters that attacked some town.  The Wizards and Clerics are behind the warriors, casting
      their spells.  They glow as they attempt to cast.  You see in small writing, the words Bellau wood.

