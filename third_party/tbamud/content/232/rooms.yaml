  name: The armory
  description: >
    You see manaquines wearing all different kinds of armor.  They range from leather to full plate. 
    If you need a special item, you have to ask for it.  It is not displayed in the open.
  sector: city
  flags: [indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:232:room:23256

"tba:232:room:23258":
  name: Terringham street
  description: >
    This room has a certain glow about it, it seems to show it has some importance.  To the South you
    see a sign over the exit that says Board room. You can see a large fountain to the east.
  sector: city
  exits:
    east:
      to: tba:232:room:23200
    south:
      to: tba:232:room:23253
    west:
      to: tba:232:room:23259

"tba:232:room:23259":
  name: Terringham street
  description: >
    The road here leads east and west.  The walls to the north and south, sport some fabulous pictures.
  sector: city
  exits:
    north:
      to: tba:232:room:23281
    east:
      to: tba:232:room:23258
    west:
      to: tba:232:room:23260
  extras:
  - keywords: [wall, picture]
    text: >
      You see fabulous pictures of dragons in flight and a group of people in full armor gear.  You
      notice some of these people..  You spot out Springfire, Gunthar, Buffy, Lilly, Angel, and Blaze.

"tba:232:room:23260":
  name: Terringham street
  description: >
    The road here continues to the east and west.  The walls seem to be untouched, and the lighting
    here seems to be a bit poor.  It looks as if someone tried to rush their job.
  sector: city
  exits:
    east:
      to: tba:232:room:23259
    west:
      to: tba:232:room:23230

"tba:232:room:23261":
  name: Terringham avenue
  description: >
    This room glows with a brilliant bright light.  The walls here have beautiful paintings on them. 
    To the south you notice a large fountain.  To the west you see the Bank of Terringham.
  sector: city
  exits:
    north:
      to: tba:232:room:23263
    south:
      to: tba:232:room:23200
    west:
      to: tba:232:room:23262
  extras:
  - keywords: [wall, walls, paintings]
    text: >
      The pictures here are of great warriors trying to guard a city from a band of orcs.  The orcs out
      number the warriors, but the warriors are putting up a good fight.

"tba:232:room:23262":
  name: Terringham Bank
  description: >
    There is an Atm here where you can store your gold.  The Gods recommend that you use this bank
    often.  We would hate to see an accident and you rejoin the game with no money.  The commands are easy. 
    Dep $$$$.  With $$$$.  Or Bal.
  sector: city
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:232:room:23261

"tba:232:room:23263":
  name: Terringham avenue
  description: >
    You walk along a finely made road.  The surface of the road is very smooth. The road looks like
    someone took their time to make travelling easy.  To the south is the bank and to the east you can smell
    the scents of leather and oils.
  sector: city
  exits:
    north:
      to: tba:232:room:23264
    east:
      to: tba:232:room:23280
    south:
      to: tba:232:room:23261

"tba:232:room:23264":
  name: Terringham avenue
  description: >
    The smooth easy going road continues north to south.  You notice exits to the east and west.  Which
    path shall you take?
  sector: city
  exits:
    north:
      to: tba:232:room:23265
    east:
      to: tba:232:room:23266
    south:
      to: tba:232:room:23263
    west:
      to: tba:232:room:23275

"tba:232:room:23265":
  name: Terringham avenue
  description: >
    You are travelling down a granite paved street.  The surrounding buildings have paintings of the
    towns greatest heros.  The only visible exits are to the north and south.
  sector: city
  exits:
    north:
      to: tba:232:room:23217
    south:
      to: tba:232:room:23264

"tba:232:room:23266":
  name: An Alley
  description: >
    You hear something moving behind you, but cannot see anything or anyone. You hear noises coming
    from the east.
  sector: city
  exits:
    east:
      to: tba:232:room:23267
    west:
      to: tba:232:room:23264

"tba:232:room:23267":
  name: Guild row
  description: >
    You see a bright blue light coming from the north.  There is emptiness coming from the south.  You
    can guess that these are the cleric guilds and the thieves guild.
  sector: city
  exits:
    north:
      to: tba:232:room:23268
    south:
      to: tba:232:room:23269
    west:
      to: tba:232:room:23266

"tba:232:room:23268":
  name: Entrance to the Cleric Guild
  description: >
    The clerics may come here to practice their skills when they have the need to expand their skills. 
    The guildmaster awaits your arrival, please don't hesitate.
  sector: city
  exits:
    south:
      to: tba:232:room:23267
    up:
      to: tba:232:room:23276

"tba:232:room:23269":
  name: Entrance to the Thieves Guild.
  description: >
    The Thieves may come here to practice their skills when they have the need to expand their skills. 
    The guildmaster awaits your arrival, please don't hesitate.
  sector: city
  exits:
    north:
      to: tba:232:room:23267
    up:
      to: tba:232:room:23277

"tba:232:room:23270":
  name: Guild row
  description: >
    You have found the path to the warriors guild and the mages guild.  Which path do you take to reach
    your guildmaster?
  sector: city
  exits:
    north:
      to: tba:232:room:23271
    east:
      to: tba:232:room:23275
    south:
      to: tba:232:room:23272

"tba:232:room:23271":
  name: Entrance to the Warriors Guild
  description: >
    The warriors may come here to practice their skills when they have the need to expand their
    fighting skills and swordmanship.  The guildmaster awaits your arrival, please don't hesitate.
  sector: city
  exits:
    south:
      to: tba:232:room:23270
    up:
      to: tba:232:room:23278

"tba:232:room:23272":
  name: Entrance to the Mage Guild
  description: >
    Mages may come here to practice their skills when they have the need to expand their knowledge in
    the lores of Arcane.  The guildmaster awaits your arrival, please don't hesitate.
  sector: city
  exits:
    north:
      to: tba:232:room:23270
    up:
      to: tba:232:room:23279

"tba:232:room:23273":
  name: Bread crumb road
  description: >
    Your mind is pulled away from the look of the granite street and is pulled to the east where you
    can smell the best baked goods you can remember.  The only other way to go is to the south.
  sector: inside
  exits:
    east:
      to: tba:232:room:23274
    south:
      to: tba:232:room:23201

"tba:232:room:23274":
  name: The Bakery
  description: >
    You have entered the right room, if you are hungry.  There is a large glass counter, surrounding
    this place.  You see all sorts of breads, pies and cakes. Which would you like for your travel.
  sector: city
  flags: [indoors, no_magic]
  exits:
    west:
      to: tba:232:room:23273

"tba:232:room:23275":
  name: An Alley
  description: >
    You enter a very clean alley.  There is nothing here polluting the roads. You hear faint noises
    coming for the west.  To the east is Terringham road.
  sector: city
  exits:
    east:
      to: tba:232:room:23264
    west:
      to: tba:232:room:23270

"tba:232:room:23276":
  name: Clerics Guild
  description: >
    The Cleric Guildsmaster is here waiting to help you.  This room has a very peaceful feeling about
    it.  You feel enlightened when you enter here.
  sector: city
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    down:
      to: tba:232:room:23268

"tba:232:room:23277":
  name: Thieves Guild
  description: >
    You enter a room and notice it is empty.  You walk around with caution, knowing that something is
    afoot.  You listen carefully and Turn about real fast....  Your Guildmaster slips out of the Darkness.
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    down:
      to: tba:232:room:23269

"tba:232:room:23278":
  name: Warriors guild
  description: >
    There are a lot of training dummies in this room.  You see a very large warrior practicing on these
    dummies.  He does not look like the type to be messed with.  The Warrior stops his training and
    advances towards you with a friendly smile, "Fresh meat" he says calmly.
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    down:
      to: tba:232:room:23271

"tba:232:room:23279":
  name: Mages Guild
  description: >
    This room is filled with books.  The air smells of different reagants, and mixed components.  This
    is a mage's dream house.  Your guild master sits behind a large desk studying a book.
  sector: city
  flags: [no_mob, indoors, peaceful]
  exits:
    down:
      to: tba:232:room:23272

"tba:232:room:23280":
  name: General Store
  description: >
    Ahhh, this is a great place to be for everyone.  Almost everything you need to go adventuring with
    is in here.  You have your sacks and bags and lanterns all right here.  Please come in and shop
    around.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:232:room:23263

"tba:232:room:23281":
  name: The Pet shop
  description: >
    This room is full of different animals and beasts.  They range from all different sizes and
    prices.  All the pets seem to be very well trained.  A large muscular man is going around feeding all of the
    pets.
  sector: inside
  flags: [no_mob, indoors, peaceful, no_magic]
  exits:
    south:
      to: tba:232:room:23259

"tba:232:room:23282":
  name: PETSHOP STOREROOM
  description: >
    Make two rooms and some pets.  The rooms MUST be sequential.  If the first room is 315 then the
    second must be 316.  The second room is known as the storeroom.  All that is required in the storeroom
    is to load one of each mob you wish to be a pet.  This room can not have any exits and will never be
    used by mortals.  Although a pet shopkeeper is not required it is recommended.  After all of this is
    done ask your coder to implement the petshop.  It will not work until the code is changed and the MUD
    is rebooted.  The cost of pets is 300 times their level.
  sector: inside
  flags: [private, godroom]
