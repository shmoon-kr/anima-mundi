# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 232.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:232:room:23200":
  name: Terringham
  description: >
    You have entered the town center of Terringham.  This center is large enough to hold hundreds of
    people.  In the center of the square is a large fountain with a large dolphin statue coming out of the
    fountain.  The dolphin is spitting water out of its mouth, which trickles down into the fountain
    below.  The ground is made of red brick, which circles around the fountain and pans out until it gets to
    the buildings.  The directions north, south, east, and west, been marked with a different shade of
    brick as it looks like it cuts into the pie of bricks. Near the buildings, you see statues of many
    forms, these statues seem to be untouched by time.  At a close glance of the statues, you can make out
    the Gods Rumble, Welcor, Ferret, Detta, Heiach, Shamra, Relsqui, Elaseth, and Fyre.
  sector: city
  flags: [peaceful, no_magic]
  exits:
    north:
      to: tba:232:room:23261
    east:
      to: tba:232:room:23201
    south:
      to: tba:232:room:23254
    west:
      to: tba:232:room:23258
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Builder   : Ferret
        Zone         : 232 Terringham
        Began        : 2001
        Player Level : 21-24
        Rooms        : 84
        Mobs         : 9
        Objects      : 26
        Shops        : 7
        Triggers     :
        Theme        :
        Plot         :
        Links        : 18n, 31w, 43s

