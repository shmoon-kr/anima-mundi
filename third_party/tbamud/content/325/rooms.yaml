"tba:325:room:32566":
  name: Tent
  description: >
    This small tent looks to have been hastily erected with no real regard for any comfort in living. 
    The user must spend only sleeping moments here, no time for relaxing.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:325:room:32560

