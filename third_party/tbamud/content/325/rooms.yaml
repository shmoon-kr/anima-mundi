# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 325.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:325:room:32500":
  name: Matted-down Grass
  description: >
    The yellow grass here has been trampled through, most of it smooshed to the ground from passing
    feet and wagon wheels.  The tracks lead south toward an open area where a fairly large number of people
    are milling about.  Just south of here are a couple of wagons pulled up close by the side of the road.
  sector: inside
  exits:
    south:
      to: tba:325:room:32501
  extras:
  - keywords: [credits, info]
    text: "Encampment by Kaan Links: 04s"

"tba:325:room:32501":
  name: Matted-down Grass
  description: >
    The way is fairly well traveled for not being a road, the amount of traffic which has headed in
    this direction has made the way very passable.  Just to the east is a colorful wagon with a man sitting
    inside, waving at you.
  sector: inside
  exits:
    north:
      to: tba:325:room:32500
    east:
      to: tba:325:room:32503
    south:
      to: tba:325:room:32502

"tba:325:room:32502":
  name: A Beaten Grassy Path
  description: >
    Another wagon sits beside the road, this one just to the west side.  The grasses have been walked
    upon so much here that there are patches where it has been completely worn away.  Directly south from
    here is a huge, wide open area where large numbers of odd looking men and women dance, cavort and
    tease their way through the people who walk through the area.
  sector: inside
  exits:
    north:
      to: tba:325:room:32501
    south:
      to: tba:325:room:32505
    west:
      to: tba:325:room:32504

"tba:325:room:32503":
  name: At the Tonic Wagon
  description: >
    The colorful wagon which rests beside the road boasts travel in all the exotic areas of the world. 
    Small silver bells hang off of the awnings from strings, the bells twinkling and ringing as the wind
    carries them.
  sector: inside
  exits:
    west:
      to: tba:325:room:32501

"tba:325:room:32504":
  name: At a Bright Wagon
  description: >
    This wagon is much like everything in sight in this wild and exciting place. It is painted in
    bright, garish colors with terrible landscapes and beautiful waterfalls abounding.  It certainly is a
    wagon that attracts a great deal of attention.
  sector: inside
  exits:
    east:
      to: tba:325:room:32502

"tba:325:room:32505":
  name: Festival Grounds
  description: >
    A perpetual festival is in affect here, day in and day out.  Whenever a caravan of gypsies or
    performers leaves, it always seems that another takes its place.  A panorama of spectacles and wonders
    await in every direction.
  sector: inside
  exits:
    north:
      to: tba:325:room:32502
    east:
      to: tba:325:room:32506
    south:
      to: tba:325:room:32509
    west:
      to: tba:325:room:32507

"tba:325:room:32506":
  name: Festival Grounds
  description: >
    Smiling folk fill this large open area where all sorts of merry men and women amaze and delight any
    who will watch.  This is the northeast corner of the area - most of the activity is off to the south
    and west.
  sector: inside
  exits:
    south:
      to: tba:325:room:32510
    west:
      to: tba:325:room:32505

"tba:325:room:32507":
  name: Festival Grounds
  description: >
    This was, up until recently, a simple open field devoid of anything unique at all.  The yellowish
    grass underfoot crunches unerfoot, still a bit springy when stepped upon.  All sorts of curiousities
    fill this area, most of it off to the south and east.
  sector: inside
  exits:
    east:
      to: tba:325:room:32505
    south:
      to: tba:325:room:32508

"tba:325:room:32508":
  name: Festival Grounds
  description: >
    A open swath through the trees leads off to the west, more of the same delights that fill this area
    in that direction.
  sector: inside
  exits:
    north:
      to: tba:325:room:32507
    east:
      to: tba:325:room:32509
    south:
      to: tba:325:room:32511
    west:
      to: tba:325:room:32535

"tba:325:room:32509":
  name: Festival Grounds
  description: >
    The sounds of the people who mill about this clearing are almost incomprehensible as they mingle in
    with the shouts of vendors, the cries of the performers and the general hubbub of a place like
    this.  The strangest sights abound in every direction, one need only to around to see a new miracle or
    feat at every turn.
  sector: inside
  exits:
    north:
      to: tba:325:room:32505
    east:
      to: tba:325:room:32510
    south:
      to: tba:325:room:32512
    west:
      to: tba:325:room:32508

"tba:325:room:32510":
  name: Festival Grounds
  description: >
    A wide open area to the east leads past more of the same delights that fill this clearing.  Off to
    the south, performance of some sort is in progress.
  sector: inside
  exits:
    north:
      to: tba:325:room:32506
    east:
      to: tba:325:room:32518
    south:
      to: tba:325:room:32513
    west:
      to: tba:325:room:32509

"tba:325:room:32511":
  name: Festival Grounds
  description: >
    The clearing comes to the edge of the forest at this point, however there is a small pathway
    through the trees to the west.
  sector: inside
  exits:
    north:
      to: tba:325:room:32508
    east:
      to: tba:325:room:32512
    south:
      to: tba:325:room:32514
    west:
      to: tba:325:room:32545

"tba:325:room:32512":
  name: Festival Grounds
  description: >
    You are dead smack in the center of this place full of gaiety and fun, people moving all about you
    jostling and bumping elbows.  In any direction is something new, something wonderful.
  sector: inside
  exits:
    north:
      to: tba:325:room:32509
    east:
      to: tba:325:room:32513
    south:
      to: tba:325:room:32515
    west:
      to: tba:325:room:32511

"tba:325:room:32513":
  name: Festival Grounds
  description: >
    With all of the people who move past you in such an unhurried manner, its hard not to relax a bit
    in this place and drop a bit of coin.  This place must be a traveling affair, as the ground underfoot
    still seems to be alive even through all the feet that tromp over it.
  sector: inside
  exits:
    north:
      to: tba:325:room:32510
    east:
      to: tba:325:room:32517
    south:
      to: tba:325:room:32516
    west:
      to: tba:325:room:32512

"tba:325:room:32514":
  name: Festival Grounds
  description: >
    This is western edge of the clearing - most of the goings-on are to the north, south and east.  It
    really is amazing how so many folk can come through this area, all of them of different race, size
    and stature and yet all of them can mingle peacefully - even happily.
  sector: inside
  exits:
    north:
      to: tba:325:room:32511
    east:
      to: tba:325:room:32515
    south:
      to: tba:325:room:32549

"tba:325:room:32515":
  name: Festival Grounds
  description: >
    Just to the south is a small stage where a group of performers are acting out some sort of skit. 
    The north, east and west are many other attractions as well.
  sector: inside
  exits:
    north:
      to: tba:325:room:32512
    east:
      to: tba:325:room:32516
    south:
      to: tba:325:room:32550
    west:
      to: tba:325:room:32514

"tba:325:room:32516":
  name: Festival Grounds
  description: >
    This is the eastern edge of the clearing, most of the action is to the east and north.  To the
    south is the southern boundary of the clearing where a small path has been cleared through the woods.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:325:room:32513
    south:
      to: tba:325:room:32551
    west:
      to: tba:325:room:32515

"tba:325:room:32517":
  name: Road
  description: >
    A wide section of the clearing opens out east into another open area where more gaming and fun are
    being had.  There are wagons parked alongside the grassway at intervals, each one filled with exotic
    goods for sale to sale who pass.
  sector: inside
  exits:
    north:
      to: tba:325:room:32518
    east:
      to: tba:325:room:32521
    west:
      to: tba:325:room:32513

"tba:325:room:32518":
  name: Eastern Grassway
  description: >
    A wide swath of grass heads east into another open area where more people gather about watching
    shows and buying goods.  Wagons are parked alongside this grassway, one of which is parked just north of
    where you stand.
  sector: inside
  exits:
    north:
      to: tba:325:room:32519
    east:
      to: tba:325:room:32520
    south:
      to: tba:325:room:32517
    west:
      to: tba:325:room:32510

"tba:325:room:32519":
  name: Clothing Wagon
  description: >
    The large wagon that rests in this small niche in the treeline is strewn over with colorful cloths
    and tapestries, all of which seem like they compete with another in terms of garishness.  Most
    obviously, the owner of this wagon makes his living selling clothing and cloth.
  sector: inside
  exits:
    south:
      to: tba:325:room:32518

"tba:325:room:32520":
  name: Eastern Grassway
  description: >
    The oddities just keep coming as the people who ply their trade of entertainment pass by, doing
    whatever it is that they are good at.  A large gathering of people are centered to the east, watching
    some kind of act or play.
  sector: inside
  exits:
    east:
      to: tba:325:room:32523
    south:
      to: tba:325:room:32521
    west:
      to: tba:325:room:32518

"tba:325:room:32521":
  name: Eastern Grassway
  description: >
    People move and jostle past in a constant movement, most of all them happy and having fun.  To the
    south is a brightly-colored wagon selling some sort of wearable, looks like jewelry.
  sector: inside
  exits:
    north:
      to: tba:325:room:32520
    east:
      to: tba:325:room:32524
    south:
      to: tba:325:room:32522
    west:
      to: tba:325:room:32517

"tba:325:room:32522":
  name: Costume Jewelry
  description: >
    The wagon is decorated with painted pictures of queens and kings festooned in regal robes and
    draping jewelry.  Close up pictures of hands wearing glistening rings and sparkling bracelets draw
    attention to the sale of items in the wagon's sale-window.
  sector: inside
  exits:
    north:
      to: tba:325:room:32521

"tba:325:room:32523":
  name: Eastern Grassway
  description: >
    To the east is a wide open area where a large stage has been erected for acting troops to enact
    intricate plays and skits which involve deep story lines and thick plots.  A large crowd has gathered
    before the stage to watch the plays.
  sector: inside
  exits:
    east:
      to: tba:325:room:32526
    south:
      to: tba:325:room:32524
    west:
      to: tba:325:room:32520

"tba:325:room:32524":
  name: Eastern Grassway
  description: >
    Just to the east is a large clearing.  It is not quite as large as the one for the main festival
    grounds, but it gives a good fight.  A stage is set up at the eastern edge of the clearing, constant
    skits and acts being played out to the delight and wonder of the crowd watching.
  sector: inside
  exits:
    north:
      to: tba:325:room:32523
    east:
      to: tba:325:room:32527
    west:
      to: tba:325:room:32521

"tba:325:room:32525":
  name: Court
  description: >
    The stage lies to the southeast from here, where a play is being carried out, watched by a large
    crowd of people in the area to the south.  To the north is an open-air restaurant - the frangrant smell
    of gypsy food filling the air.
  sector: inside
  exits:
    north:
      to: tba:325:room:32531
    east:
      to: tba:325:room:32573
    south:
      to: tba:325:room:32526

"tba:325:room:32526":
  name: The Gypsys' Court
  description: >
    The stage to the east is a constant flurry of activity, actors constantly going on or coming off
    the stage from playing their parts.  North of here is an area filled with people seated on comfortable
    picnic-type tables partaking of food which is sold nearby.
  sector: inside
  exits:
    north:
      to: tba:325:room:32525
    south:
      to: tba:325:room:32527
    west:
      to: tba:325:room:32523

"tba:325:room:32527":
  name: The Gypsys' Court
  description: >
    The stage to the east is in constant activity - the actors and musicians involved in the play a
    neverending flurry of movement.  To the south is a huge tent which men stand under, holding mugs of beer
    while watching the play .
  sector: inside
  exits:
    north:
      to: tba:325:room:32526
    south:
      to: tba:325:room:32528
    west:
      to: tba:325:room:32524

"tba:325:room:32528":
  name: The Gypsys' Court
  description: >
    Just south of here is the Ale Tent, where a large number of people - mostly men - stand drinking
    among their fellows, enjoying the day's festivities.  The main stage is to the northeast, a side area
    lies just to the east.
  sector: inside
  exits:
    north:
      to: tba:325:room:32527
    east:
      to: tba:325:room:32572
    south:
      to: tba:325:room:32529

"tba:325:room:32529":
  name: Ale Tent
  description: >
    Men stand elbow-to-elbow drinking their ale and talking about whatever it is they have a mind to
    speak of.  The important thing is that they are all drinking great-tasting gypsy ale.  So - really -
    they could be talking about birthing a baby gnat and it wouldn't matter.  Its the drink that counts.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:325:room:32528
    east:
      to: tba:325:room:32530

"tba:325:room:32530":
  name: A Gypsy Wagon
  description: >
    This is a very comfortable, brightly colored wagon where the gypsy from the Ale Tent makes his
    home.  Whenever the festival moves or ends, he simply hitches the horses and finds a new home where he
    can brew his ale and sell it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:325:room:32529

"tba:325:room:32531":
  name: Food Cart
  description: >
    A haphazard slew of picnic tables have been set up for people to sit at while they partake of the
    food being sold at the vending stand here.  The smell of the food is mouthwatering, the frangrance
    alone enough to make anyone immediately hungry.
  sector: inside
  exits:
    east:
      to: tba:325:room:32532
    south:
      to: tba:325:room:32525

"tba:325:room:32532":
  name: Gypsy Wagon
  description: >
    This is the home of the gypsy acting troop.  A large number of them all bunk together in the small
    confines of this wagon.  Turns are taken at night for who sleeps outside and who enjoys the indoor
    comfort of the wagon.  Why anyone would ever want to live in that fashion...  Who can know?
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:325:room:32531

"tba:325:room:32533":
  name: Stage
  description: >
    Ahem...  You are on a professional's turf.  Please exit down to the left or right, but GET OFF THE
    STAGE!!
  sector: inside
  exits:
    south:
      to: tba:325:room:32534
    down:
      to: tba:325:room:32573

"tba:325:room:32534":
  name: Stage
  description: >
    Ahem...  You are on a professional's turf.  Please exit down to the left or right, but GET OFF THE
    STAGE!!
  sector: inside
  exits:
    north:
      to: tba:325:room:32533
    down:
      to: tba:325:room:32572

"tba:325:room:32535":
  name: Grassy Walkway
  description: >
    The forest gives way on either side to allow access to yet another open area to the west.  The same
    sort of merriment and festival-type atmosphere that lies to the east seems to carry on over to the
    west as well.
  sector: inside
  exits:
    east:
      to: tba:325:room:32508
    west:
      to: tba:325:room:32536

"tba:325:room:32536":
  name: Grassy Walkway
  description: >
    A wide open field lies to the west, some very temporary looking structures ringing the field.  This
    area caters more toward the families who might visit Revelry, as there are a great many attractions
    for the children in this area.
  sector: inside
  exits:
    east:
      to: tba:325:room:32535
    west:
      to: tba:325:room:32537

"tba:325:room:32537":
  name: Grassy Court
  description: >
    A large pavilion lies to the west, the smell of steam and grilled food wafting from that
    direction.  To the north and south are extensions of this court where all sorts of activities are constantly
    going on.
  sector: inside
  exits:
    north:
      to: tba:325:room:32539
    east:
      to: tba:325:room:32536
    south:
      to: tba:325:room:32538
    west:
      to: tba:325:room:32544

"tba:325:room:32538":
  name: Grassy Court
  description: >
    A line of children await the face painter who paints children's faces into semblances of creatures
    of the wild just south of here.  To the east is a small area where a woman reads from a thick tome,
    relating an adventurer to a crowd of wide-eyed kids.
  sector: inside
  exits:
    north:
      to: tba:325:room:32537
    east:
      to: tba:325:room:32577
    south:
      to: tba:325:room:32543

"tba:325:room:32539":
  name: Grassy Court
  description: >
    Just north of here is a small wooden castle about five feet high.  It is painted in bright, garish
    colors that bring immediate attention to it.  Inside of it, puppets dance and cavort to the squeals
    of delight from the children seated on the ground before the castle.  To the east is a small area
    where caged animals pace in their cages, a place where rare animals can be seen and in some instances -
    touched.
  sector: inside
  exits:
    north:
      to: tba:325:room:32540
    east:
      to: tba:325:room:32541
    south:
      to: tba:325:room:32537

"tba:325:room:32540":
  name: Puppet Show
  description: >
    A miniature castle made of thin wood but cleverly painted to look like stone and mortar has been
    erected here, a large open window cut into the top section where a puppet master causes his small cloth
    and wood men to dance, sing, fight and laugh - all amid the uproarious peels of laughter from the
    children gathered around the castle.
  sector: inside
  exits:
    south:
      to: tba:325:room:32539

"tba:325:room:32541":
  name: Petting Zoo
  description: >
    Small and large cages lie situated around this area, each one with a very unique and interesting
    animal.  To the north are more of the cages and animals.
  sector: inside
  exits:
    north:
      to: tba:325:room:32542
    west:
      to: tba:325:room:32539

"tba:325:room:32542":
  name: Petting Zoo
  description: >
    Small animals mew in sadness, others growl or even sleep - depending on their wont.  The area does
    not smell all that nice - most every breath is filled with a bit of foul fragrance, but then the
    beautiful animals make up for that bit of nastiness...  Well, mostly anyway.
  sector: inside
  exits:
    south:
      to: tba:325:room:32541

"tba:325:room:32543":
  name: Face Painting
  description: >
    Children line up one after another to get a scary monster face, a happy clown face or even a silly
    one painted over their own.  One after another, they take turns ooing and awing over a new face
    turned out by the Painter here.
  sector: inside
  exits:
    north:
      to: tba:325:room:32538

"tba:325:room:32544":
  name: Open Air Restaurant
  description: >
    There are no walls on this place, only a set of four poles which hold up a thin wooden roofing.  A
    grill with steaming meats and a keg filled with pleasant juices lies at one end of the structure,
    tended by workers.  This would certainly be a relaxing place to sit down, eat and rest a while.
  sector: inside
  exits:
    east:
      to: tba:325:room:32537

"tba:325:room:32545":
  name: Path
  description: >
    By the looks of the ground, some sort of large wheeled object such as a wagon or a cart has been
    pushed through.  The grass is matted down in two straight, flat lines which head south into the woods. 
    The main festival grounds are just to the east.
  sector: inside
  exits:
    east:
      to: tba:325:room:32511
    south:
      to: tba:325:room:32546

"tba:325:room:32546":
  name: Path
  description: >
    The path heads straight south into the woods, small trees and bushes crunched down or pushed to the
    side by whatever vehicle came through.  The way out back into the main area is to the north.
  sector: inside
  exits:
    north:
      to: tba:325:room:32545
    south:
      to: tba:325:room:32547

"tba:325:room:32547":
  name: Path
  description: >
    It appears that the end of the way is near - quite near indeed.  Just to the south is a
    drab-looking wagon with a crescent moon painted on the right side of the door.  No sound comes from within, the
    drapes are all closed - from the looks of it, the thing may have been abandoned by some gypsy from
    the festival who decided they didn't want it anymore.
  sector: inside
  exits:
    north:
      to: tba:325:room:32546
    south:
      to: tba:325:room:32548
      door:
        keywords: [wagon]
        kind: door
        reset: closed

"tba:325:room:32548":
  name: Madame Zayla's Wagon
  description: >
    Looking about this wagon's small interior room, it is easy to mistake it for an abandoned wagon. 
    Everything in this wagon is very old and rotted, the smell of the place is enough to make most
    seasoned fair-goers turn tail.  And that is saying a lot.  A small, round table sits in the center of the
    room, a glowing ball resting dead center on the table.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:325:room:32547
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:325:room:32549":
  name: Festival Grounds
  description: >
    This is farthest southwestern corner of the clearing, all of the action lies to the northeast.  A
    small portable stage lies just east of here, upon which a small troop of actors enact a skit.
  sector: inside
  exits:
    north:
      to: tba:325:room:32514
    east:
      to: tba:325:room:32550

"tba:325:room:32550":
  name: At the Performance
  description: >
    A small acting troop acts out the Great Fall of Cyrrian, the story of how one man's selfish choices
    affected the course of an entire city's existance.  The main festival area lies to the north.
  sector: inside
  exits:
    north:
      to: tba:325:room:32515
    east:
      to: tba:325:room:32551
    west:
      to: tba:325:room:32549

"tba:325:room:32551":
  name: Festival Grounds
  description: >
    A small path has been pushed through the forest, leading south away from this main area.  Just to
    the west is a small portable stage where a small troop of actors perform a skit.
  sector: inside
  exits:
    north:
      to: tba:325:room:32516
    south:
      to: tba:325:room:32552
    west:
      to: tba:325:room:32550

"tba:325:room:32552":
  name: Beaten Trail
  description: >
    The way through to the south has not been very well marked, finding a good path through takes a bit
    of concentration.  Because of the slow going, you are able to hear the reason that others may had
    reason to travel in the same direction - the sound of running water.
  sector: inside
  exits:
    north:
      to: tba:325:room:32551
    south:
      to: tba:325:room:32553

"tba:325:room:32553":
  name: Beaten Trail
  description: >
    Finding a way through the tangle is quite difficult here, the best way is to try and follow the
    pushed-aside grasses and the broken twigs and saplings. Looks like you could go one of three directions
    at this point west, south or north.
  sector: inside
  exits:
    north:
      to: tba:325:room:32552
    south:
      to: tba:325:room:32554
    west:
      to: tba:325:room:32576

"tba:325:room:32554":
  name: Beaten Trail
  description: >
    The sound of the running water is much clearer now, it is not the sound of a great amount of water,
    just the twinkling of a stream.  There is a way through the forest to the north, east and south.
  sector: inside
  exits:
    north:
      to: tba:325:room:32553
    east:
      to: tba:325:room:32555
    south:
      to: tba:325:room:32574

"tba:325:room:32555":
  name: Forest Trail
  description: >
    The path leads east into a small clearing where people can be seen moving about.  Structures of
    some sort have been erected or placed there as well.  The way back to the festival grounds lies to the
    west.
  sector: inside
  exits:
    east:
      to: tba:325:room:32556
    west:
      to: tba:325:room:32554

"tba:325:room:32556":
  name: Forest Trail
  description: >
    This trail looks almost like it may have been a deer run or something before the gypsies came
    through.  Possibly they parked their many wagons and tents here for just that reason, in hopes of catching
    a little bit of dinner.  The wagons and tents lie to east surrounding a clearing in the woods.
  sector: inside
  exits:
    east:
      to: tba:325:room:32557
    west:
      to: tba:325:room:32555

"tba:325:room:32557":
  name: Open Clearing
  description: >
    Trees ring this small clearing, tents and wagons set up just at the edge of the treeline.  A huge
    bonfire burns in the center where most of the people who sleep in this area lounge during their breaks
    or late at night when the festivities have slowed a bit.
  sector: inside
  exits:
    north:
      to: tba:325:room:32559
    east:
      to: tba:325:room:32558
    south:
      to: tba:325:room:32561
    west:
      to: tba:325:room:32556

