"tba:325:room:32569":
  name: Teepee
  description: >
    There is another small firepit in this dwelling, the top of which allows smoke to drift out and
    into the air above.  This looks like it would sleep a good six or so people comfortably - and from the
    number of blankets strewn about the ground, that number is pretty accurate.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:325:room:32562

