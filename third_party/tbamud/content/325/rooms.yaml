"tba:325:room:32563":
  name: Wagon
  description: >
    This covered wagon holds a rough area of wood planking that is at this time very empty save for a
    small pad of blankets to sleep in.  The top is made of a strong fabric that keeps rain from falling
    into the interior with flaps at both ends that can tie closed for privacy.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:325:room:32559

