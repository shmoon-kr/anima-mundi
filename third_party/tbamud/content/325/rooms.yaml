"tba:325:room:32572":
  name: Side Stage Left
  description: >
    This is where the actors exit the stage, where they rest a bit or have a drink from the ale tent
    before resuming a part or heading to their home for the night.  The stage itself lies just to the north.
  sector: inside
  exits:
    west:
      to: tba:325:room:32528
    up:
      to: tba:325:room:32534

"tba:325:room:32573":
  name: Side Stage Right
  description: >
    This is the area where the actors and actresses prepare for their time on the stage, rehearsing
    lines or simply waiting quietly.  A lot of nervous titter and adjustment of costume goes on here before
    the scenes are enacted.
  sector: inside
  exits:
    west:
      to: tba:325:room:32525
    up:
      to: tba:325:room:32533

"tba:325:room:32574":
  name: At the Riverbank
  description: >
    A small brook flows by over the smooth rocks in its bed.  Its deepest point could not be more than
    three or four feet, it couldnt be any wider than eight feet.  The sounds of the water is very
    soothing, this is the sort of place to inspire works of art.
  sector: inside
  exits:
    north:
      to: tba:325:room:32554
    south:
      to: tba:325:room:32575

"tba:325:room:32575":
  name: In the Brook
  description: >
    Well, your feet have certainly gotten wet now!  The water is cold and clear and certainly good
    enough to drink.  The forest path lies to the north.
  sector: inside
  exits:
    north:
      to: tba:325:room:32574

"tba:325:room:32576":
  name: The Bard's Stump
  description: >
    The way is impassable in any direction except that which you came from, however the stump of the
    huge oak that rests in this space appears to be one heck of a place to rest for a spell, or even for
    the night.
  sector: inside
  exits:
    east:
      to: tba:325:room:32553

"tba:325:room:32577":
  name: The Storyteller's Stump
  description: >
    This small area is where, at the top of every hour, a new tale is told to the children (and adults
    in many cases) who gather around the Stump to hear a tale spun from the Great Tome of Adventures. 
    Wide-eyed and completely quiet as they sit enraptured, the children chew their bottom lips, exchange
    frightened or excited looks - but never leave until the end.
  sector: inside
  exits:
    west:
      to: tba:325:room:32538
