"tba:220:room:22020":
  name: "@WLair of the @CIce@Dm@Bo@Dn@Bs@Dt@Be@Dr@n"
  description: >
    @yThe temperature is freezing, and even the icicles around you seem to shiver amidst the cold. 
    @DBoxes @yof frozen dinners long past their expiration date are piled about, and an @Cice rack @ysits
