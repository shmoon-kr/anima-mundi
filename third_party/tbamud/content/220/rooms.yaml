# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 220.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:220:room:22000":
  name: "@nZone Description Room for the @REnchanted @WKitchen@n"
  description:
    preformatted: |2
         @n
      @WZone name@n : An Enchanted Kitchen
      @WLocation@n  : It should probably be part of an enchanted house.
      @WLevel@n     : 10-20
      @WRooms@n     : Approximately 24
      @WMobs@n      : 9 unique mobs
      @WObjects@n   : 4
      @WAlignment@n : All mobs will have a good alignment, except for the
                  icemonster and Oreo the cat.
      @WTheme@n     : Imagine a huge, giant-sized kitchen, in which utensils are
                  about as tall as the average man. Its complete with a fridge
                  and oven to explore, counters, and even a mouse hole.
      @WPlot@n      : Snuffins the mouse is sick of being tormented by his rival,
                  Oreo the cat. It's the player's job to help save Snuffins.
                  Other than that, there isn't much. It's a big kitchen with
                  kitchen-like things. :)
  sector: inside
  flags: [indoors, private]
  extras:
  - keywords: [theme]
    text: >
      Imagine a huge, giant-sized kitchen, in which utensils are about as tall as the average man.  Its
      complete with a fridge and oven to explore, counters, and even a mouse hole.

"tba:220:room:22001":
  name: "@WThe Open Doorway@n"
  description: >
    @yThe gigantic door is, thankfully, already wide open.  Smells wafting in from the north are highly
    @Gun@gpl@Gea@gsa@Gnt@y, and everything around is tremendous in size.  The temperature is agreeable,
    though definitely on the @rwarm@y side.  The cavernous room looks to be some sort of...@Wkitchen@y.@n
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:220:room:22002
      look: "@DTo the north, a large chair is pulled out from under a table.  @n"

"tba:220:room:22002":
  name: "@WBeneath the Big Chair@w"
  description: >
    @yA gigantic chair with black, @Dsteel legs @ystands here.  It is pulled away from the table
    slightly, and you can hardly see over the @cpale blue @ycushion.  A refrigerator is visible to the east, as
    well as an enormous table to the north.  Also, ominous clouds of dust seem to stir, almost as if
    they were alive...@n
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:220:room:22003
      look: "@DNothing can be made out in the darkness under the table to the north.  @n"
    east:
      to: tba:220:room:22010
      look: "@DThe fridge door to the east is pulled open.  @n"
    south:
      to: tba:220:room:22001
      look: "@DA doorway lies to the south.  @n"
    west:
      to: tba:220:room:22009
      look: "@DA phone has fallen off the hook to the west.  @n"
    up:
      to: tba:220:room:22011
      look: >
        @DRivets on the chair's legs are great for climbing down, but the height is staggering!  @n
  extras:
  - keywords: [steel, legs]
    text: >
      There are colossal nailheads riveted into each of the four legs.  If one was very, very careful, it
      looks as though he might be able to climb up...

"tba:220:room:22003":
  name: "@WUnderneath the Table@w"
  description: >
    @yLooking up, the kitchen table forms a ceiling high above.  It blocks all light, and even with a
    lantern, the strange shadows lurking about are scarcely visible.  Whispers seem to come from all
    directions, while clouds of dust dance noxiously by.  To the east, the oven door is left open.  It looks
    like an easy climb from here.@n
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:220:room:22004
    east:
      to: tba:220:room:22008
    south:
      to: tba:220:room:22002

"tba:220:room:22004":
  name: "@WOutside the Mouse Hole@w"
  description: >
    @yAn over-sized mousetrap with a piece of @yrotted @Ycheese@y sits just outside a large hole about
    as tall as a human man.  A tiny @wg@yl@Yo@Ww@y is coming from the inside, though it is impossible to
    make anything out. To the west, a monstrous looking cat watches the space you occupy intently, as if
    it were waiting for something or someone to appear.@n
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:220:room:22005
      look: There is a flame dancing inside, but nothing else is visible.
    east:
      to: tba:220:room:22007
    south:
      to: tba:220:room:22003
    west:
      to: tba:220:room:22006
      look: A large cat prowls, guarding its space.

"tba:220:room:22005":
  name: "@WSnuffins' Dwelling@n"
  description: >
    @yEverything inside is, refreshingly, average-sized.  A spartan twin bed covered in thick blankets
    is pushed to the side, while a large, cherrywood desk dominates most of the room.  Candles burning
    atop it give off an aesthetic vanilla scent and just enough heat to keep the room at a comfortable
    temperature.  One of the walls is decorated with family @Dphotos @yportraying a happy group of mice.  The
    presence of numerous @Wbooks@y, @Ymaps @yand @gglobes @yhints at a person who enjoys travel.@n
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:220:room:22004
  extras:
  - keywords: [books]
    text: >
      The books laying around are all thick and ancient looking.  Upon closer inspection, it seems like
      they're all books on history or geography.  There are several atlases, as well.
  - keywords: [diary]
    text: >
      @WDay @W39 : @n@n I am trapped.  My punishment for leaving home so early to travel the world has
      come back to bite me in the butt.  I had only planned to stay in this place for a night, merely to rest
      before I continued my journey, but it seems as if I've met my match in the devilcat named
      @DO@Wre@Do@n.
  - keywords: [desk]
    text: >
      This desk is cluttered with paperwads and chewed-up pens.  A thick book is pulled open, and looks
      to be a kind of @Ddiary@n.
  - keywords: [photos, walls, pictures]
    text: >
      A happy mouse family is depicted in the many pictures along the walls.  One of the most
      @Ceye-catching@n is the image of a young mouse at a theme park, wearing what looks to be a set of plastic
      @yhuman ears@n over his head. @WStr@wan@Dge@n...
  - keywords: [maps, globes]
    text: >
      Several different-size globes sit around the room, and maps are spread out in various places. 
      Comically large thumbtacks are placed on random locations over the world.  Cities like @CVe@cni@Cce@n,
      @RNe@Ww Yo@Brk@n, @yR@Yom@ye@n and @GTo@gky@Go@n are circled in bold @Rred@n.

"tba:220:room:22006":
  name: "@WThe Cat Corner@n"
  description: >
    @yThis corner of the kitchen is littered with tell-tale furballs and pieces of kitty kibble.  A
    plush @rred @Rcushion @ylies in the furthest corner of the room, and a collection of multi-colored
