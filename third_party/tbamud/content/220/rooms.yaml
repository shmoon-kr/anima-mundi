    light blinks angrily.  The @Wcord@y is very thick and spirals upward.@n
  sector: inside
  exits:
    east:
      to: tba:220:room:22002
      look: "@DTo the east, a large chair is pulled out from under a table.  @n"
    up:
      to: tba:220:room:22013
      look: "@DThe phone cord looks climbable.  @n"
  extras:
  - keywords: [cord]
    text: >
      The pale @Wwhite@n cord is thick and springy.  If a person grabbed on, he could probably climb it
