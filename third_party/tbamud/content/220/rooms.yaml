    @ycreeping over it.@n
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:220:room:22004
  extras:
  - keywords: [pendant, collar]
    text: The name @DO@WRE@DO@n is engraved into a silver pendant.

"tba:220:room:22007":
  name: "@WThe Back Door@n"
  description: >
    @yThe dust settled on the ground here is thick, so much that you can see deep paw prints smudged
    into the layer of muck.  Pieces of kitty kibble are thrown randomly, and a ray of @Yl@yi@wg@ch@Ct@y
    falls curiously over this spot.  A mousehole is nearby to the west.  Paint peels off the door, which is
    blocked by a heavy @Dpackage@y.@n
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:220:room:22008
    west:
      to: tba:220:room:22004
  extras:
  - keywords: [package]
    text: "@n @RKrazy @BKitty @GKibble@c, for the @CKrazy@c in your Kitty@n"

"tba:220:room:22008":
  name: "@WOn the Oven Door@n"
  description: >
    @yThe oven door has been left open, and bits of @Dfilth @ycrawl along the steel.  An unpleasant
    smell fills the stuffy air, and heat waves blow in from the east.  A string of @Rspaghetti @yis dangling
    from the top of the oven.  @GGross!@n
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:220:room:22007
      look: "@DPaw prints mar the layer of dust to the north.  @n"
    east:
      to: tba:220:room:22012
      look: "@DGlowing bars pulse ominously to the east.  @n"
    south:
      to: tba:220:room:22010
      look: "@DThe fridge door is open to the south.  @n"
    west:
      to: tba:220:room:22003
      look: "@DDark dust clouds curl underneath the table to the west.  @n"
    up:
      to: tba:220:room:22021
      look: "@DA spaghetti noodle leads upwards.  @n"
  extras:
  - keywords: [spaghetti, string]
    text: >
      A wet spaghetti noodle swings back and forth.  It is pretty thick, and doesn't look like it would
