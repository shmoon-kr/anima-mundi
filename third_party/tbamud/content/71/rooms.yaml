# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 71.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:71:room:7100":
  name: The Edge Of The Water
  description: >
    The pool side is dimly lit up by your light.  You can see absolutely nothing else nearby.  The
    darkness her seems enormously oppressive here. The air is damp and the rock on which you stand is
    slippery.  The pool seems too dark to make anything clear.  The pool seems to extend to the east.  The rock
    can be climbed upwards from here.
  sector: mountains
  flags: [dark, no_mob, indoors]
  exits:
    east:
      look: The pool extends eastwards, but you cannot find enough room to move in that direction.
    up:
      to: tba:70:room:7000

"tba:71:room:7101":
  name: Under The Mudhole
  description: >
    You stand in a small room with a great big opening in the ceiling.  From this opening there is mud
    dripping down in large lumps.  >YUCK<.  You can smell the foul stench of the slimy sediment as you
    try not to get covered by the falling sludge.  To the east there is an entryway leading out from here
    and it seems absolutely impossible to force the muddy descent.
  sector: mountains
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:71:room:7103
      look: East.  You see nothing of interest.
  extras:
  - keywords: [mud]
    text: You never saw such disgusting matter before, it nearly makes you puke.

"tba:71:room:7102":
  name: Under The Dark Pit
  description: >
    Nice place you found yourself in.  You stand in the middle of a room with only two exits, up and
    east.  A tall ladder has been left here so that you can climb up through the pit without the use of a
    rope.
  sector: city
  flags: [dark, indoors]
  exits:
    east:
      to: tba:71:room:7104
    up:
      to: tba:70:room:7004
      look: Up.  You can't see a thing up there, it is way too dark.
    down:
      to: tba:73:room:7300
      door:
        keywords: [trapdoor]
        kind: door
  extras:
  - keywords: [ladder]
    text: >
      This is funny enough a wooden ladder and, after closer inspection, you discover it is magically
      held to the wall!  You can't, even with your greatest effort, move it at ALL!

"tba:71:room:7103":
  name: A Muddy Bend In The Sewer System
  description: >
    You are standing in what looks like a bend in the pipe system of the sewer.  The 'floor' is covered
    completely by mud!  This includes covering your legs up to your knees as well.  The pipe leads west
    and south.
  sector: hills
  flags: [dark, indoors]
  exits:
    south:
      to: tba:71:room:7104
      look: >
        To the south there is less mud than here!  It actually seems to end there! You have a felling it
        would be nice to have your feet free from mud again.
    west:
      to: tba:71:room:7101
      look: >
        You can see a room in which mud drips from the roof onto the floor in great cakes of sludge.  There
        doesn't seem to be any exits from that room apart from in you direction.
  extras:
  - keywords: [mud]
    text: You never saw such disgusting matter before, it nearly makes you puke.

"tba:71:room:7104":
  name: A Junction In The Sewer Pipes
  description: >
    You stand in the middle of what looks like a triple junction of pipes going east, west and north.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:71:room:7103
      look: You can see a mud area starting in that direction.
    east:
      to: tba:71:room:7112
      look: East.  You can't even make out what it might look like, it is just too dark.
    west:
      to: tba:71:room:7102
      look: West.  There is a room with a ladder leading up.

"tba:71:room:7105":
  name: Down The Old Well
  description: >
    You are dangling on the slippery sides of the old well leading down and up.  The only secure point
    here is the metal bars that are cemented into the sides, the ones that you cling frantically to so
    that you don't fall.  Who knows how deep this well is?  The bars lead down and up and nowhere else.
  sector: mountains
  flags: [dark, indoors]
  exits:
    up:
      to: tba:70:room:7015
      look: >
        There is a slight, dim light from above, or maybe it is just your imagination. Anyway it SEEMS
        darker down here than up there, if that is possible.
    down:
      look: >
        Down there nothing at all can be spotted.  The darkness that engulfs this decent seems utterly
        impossible in a mortal world.  It is so thick that a torch down there would be utterly useless... or so
        it seems to you.  Not the kind of thing to cheer you up on this voyage, Eh?
  extras:
  - keywords: [bars]
    text: >
      These look like they're pretty slippery, and not very safe, but perhaps safe enough for you to
      climb down, WITH both hands on them.

"tba:71:room:7106":
  name: The Northwestern Corner Of The Ledge
  description: >
    You stand, swaying out from the ledge, with only a couple of inches of safe, solid ledge under your
    feet.  The ledge continues to the east but not back south.  It seems that the ledge is too narrow to
    turn on so you'll have to continue forward.
  sector: mountains
  flags: [dark, no_mob, indoors]
  exits:
    east:
      to: tba:71:room:7113
      look: The ledge continues east.
    south:
      to: tba:71:room:7107
      look: The ledge continues south.
    down:
      to: tba:72:room:7279
      look: The Abyss lies down there.  Who knows what might lurk down there?
      door:
        keywords: [rock, step, edge]
        kind: door
        reset: closed
  extras:
  - keywords: [rock]
    text: >
      It looks as if it can be opened in a door-like fashion.  Maybe this will lead the way down.
  - keywords: [step]
    text: A small rock sticks out right under it, otherwise the way is DOWN, DOWN, and SPLAT!!!
  - keywords: [edge, odd-looking]
    text: >
      This is truly a weird piece of craftsmanship in your eyes.  The edge seems to form a step leading
      down, but WHAT a STEP DOWN.  The Abyss opens down there leading to seemingly total destruction.

"tba:71:room:7107":
  name: The Narrow Ledge
  description: >
    You are in the process of walking all the way around the ledge since there is no way of turning
    around on this all too narrow path.  There IS another exit from here but that leads right into mid-air
    and with high probability of a free fall session afterwards.
  sector: mountains
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:71:room:7106
      look: North.  The ledge leads into a corner and turns eastward.
    east:
      to: tba:71:room:7190
      look: >
        You stare into mid-air, and right under there is absolutely nothing but darkness.  You shiver by
        the thought of falling an utterly unknown distance.
    south:
      to: tba:71:room:7108
      look: South.  The ledge leads further south into utter darkness.

