"tba:71:room:7114":
  name: Mid-Air
  description: >
    You've just stepped into the most unlucky position in the whole of CircleMUD.  The result of such a
    foolish act should be punished with death, you know.  With an acceleration of approximately 9.82
    meters per second squared, you are now descending the Abyss.  What awaits you at the bottom will
    continue to be a mystery.  Good-bye cruel world.
  sector: inside
  flags: [no_mob, indoors]

"tba:71:room:7115":
  name: The Broad Ledge
  description: >
    You are standing on a ledge that seems quite a lot larger than the rest of the ledges.  This one
    leads to the west and the east, plus it has an exit going to the south.  Though you could jump into
    mid-air, but it probably wouldn't be such a good idea.  The way south is in utter darkness.
  sector: hills
  flags: [dark, no_mob, indoors]
  exits:
    north:
      to: tba:71:room:7114
    east:
      to: tba:71:room:7121
    south:
      to: tba:71:room:7129
    west:
      to: tba:71:room:7111

