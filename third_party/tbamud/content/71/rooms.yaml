"tba:71:room:7112":
  name: An Odd Intersection
  description: >
    You stand in a rather odd intersection of pipes.  The pipes actually don't resemble pipes anymore. 
    They look more like a real stone tunnel, or a passageway hewn directly into the rock.  The ways from
    here lead north, east and west.
  sector: city
  flags: [dark, indoors]
  exits:
    north:
      to: tba:71:room:7111
      look: North.  You see a ledge to something that looks like an abyss.
    east:
      to: tba:71:room:7122
    west:
      to: tba:71:room:7104

