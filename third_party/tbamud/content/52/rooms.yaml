# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 52.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:52:room:5200":
  name: The Grand Gate Of Thalos
  description: >
    You stand in the archway of a gigantic stone archway.  The two steel gates have been forced open
    and have rusted in place.  A hollow gust of wind blows by you into the deserted, and seemingly
    destroyed, city.
  sector: city
  exits:
    east:
      to: tba:50:room:5044
      look: The desert sands stretch on for miles and miles.
    west:
      to: tba:52:room:5201
      look: >
        You see devastation everywhere.  Houses lie in ruin and skeletons litter the streets.  You see
        strange beasts stalking the shadows.

"tba:52:room:5201":
  name: Main Street
  description: >
    This was once a magnificent street, but now is in total ruin.  The streets are barren and windswept
    and the silence is unending.  To the south you see a ruined cottage while north leads into a dark
    back alley.  Howls and screams echo through the deserted city.
  sector: city
  exits:
    north:
      to: tba:52:room:5239
      look: It seems to be a dark alley.
    east:
      to: tba:52:room:5200
      look: The entrance to the city lies this way.
    south:
      to: tba:52:room:5235
      look: A ruined shack lies to the south.
    west:
      to: tba:52:room:5202
      look: Main Street lies this way.

"tba:52:room:5202":
  name: Main Street
  description: >
    This was once a magnificent street, but now is in total ruin.  The streets are barren and windswept
    and the silence is unending.  On one side is a collapsed house while on the other is the entrance to
    a large ruined mansion.  Eerie sounds echo within the mansion.  Near the center of town you see a
    large domed building, relatively intact.
  sector: city
  exits:
    north:
      to: tba:52:room:5236
      look: The remnants of a store lie this way.
    east:
      to: tba:52:room:5201
    south:
      to: tba:52:room:5232
      look: It looks like what used to be the main building in the city.
    west:
      to: tba:52:room:5203
      look: A withered garden path lies this way.

"tba:52:room:5203":
  name: A Garden Path
  description: >
    A circular path surrounds a magnificent domed temple in the center of the city.  Flowers have
    withered away and the once lush trees are bare. Vines and ivy snake up the sides of the temple and
    entangle themselves around your feet.  A sudden volley of howls pierces the air.
  sector: city
  exits:
    north:
      to: tba:52:room:5204
      look: The garden path continues around the building.
    east:
      to: tba:52:room:5202
      look: This is the main street leading to the city's entrance.
    south:
      to: tba:52:room:5206
      look: The garden path continues around the building.
    west:
      to: tba:52:room:5250
      look: >
        Inside the temple, small patches of light shoot through each doorway as well as a few holes in the
        ceiling.

"tba:52:room:5204":
  name: A Garden Path
  description: >
    A circular path surrounds a magnificent domed temple in the center of the city.  Flowers have
    withered away and the once lush trees are bare. Vines and ivy snake up the sides of the temple and
    entangle themselves around your feet.
  sector: city
  exits:
    north:
      to: tba:52:room:5211
      look: A side street leads of to the northern half of the city.
    east:
      to: tba:52:room:5203
      look: The garden path continues around the building.
    south:
      to: tba:52:room:5250
      look: >
        Inside the temple, small patches of light shoot through each doorway as well as a few holes in the
        ceiling.
    west:
      to: tba:52:room:5205
      look: The garden path continues around the building.

"tba:52:room:5205":
  name: A Garden Path
  description: >
    A circular path surrounds a magnificent domed temple in the center of the city.  Flowers have
    withered away and the once lush trees are bare. Vines and ivy creep up the sides of the temple and
    entangle themselves around your feet.
  sector: city
  exits:
    north:
      to: tba:52:room:5204
      look: The garden path continues around the building.
    east:
      to: tba:52:room:5250
      look: >
        Inside the temple, small patches of light shoot through each doorway as well as a few cracks in the
        ceiling.
    south:
      to: tba:52:room:5206
      look: The garden path continues around the building.
    west:
      to: tba:52:room:5207
      look: What looks like a market place lies this way.

"tba:52:room:5206":
  name: A Garden Path
  description: >
    A circular path surrounds a magnificent domed temple in the center of the city.  Flowers have
    withered away and the once lush trees are bare. Vines and ivy creep up the sides of the temple and
    entangle themselves around your feet.
  sector: city
  exits:
    north:
      to: tba:52:room:5250
      look: >
        Inside the temple, small patches of light shoot through each doorway as well as a few cracks in the
        ceiling.
    east:
      to: tba:52:room:5203
      look: The garden path continues around the building.
    south:
      to: tba:52:room:5212
      look: A small side street leads to the southern half of the city.
    west:
      to: tba:52:room:5205
      look: The garden path continues around the building.

"tba:52:room:5207":
  name: The Market Place
  description: >
    You stand in the middle of a large square lined on each side with baskets, carts, and stands of all
    shapes and sizes.  Abandoned, these little shops still contain some of their goods once sold to a
    demanding public.
  sector: city
  exits:
    north:
      to: tba:52:room:5225
      look: A small table has been toppled over, spilling fine jewellery and gems onto the ground.
    east:
      to: tba:52:room:5205
      look: A small garden path encircles a large domed temple in the center of the city.
    south:
      to: tba:52:room:5220
      look: Rotted remains of fruits and vegetables lie strewn about.
    west:
      to: tba:52:room:5208
      look: The market place continues.

"tba:52:room:5208":
  name: The Market Place
  description: >
    You stand at the end of the market square.  Stands and carts line each side, filled with remnants
    of fine foods and exquisite goods.
  sector: city
  exits:
    north:
      to: tba:52:room:5222
      look: Tattered carpets and ruined bales of silk sit idly by a run down stand.
    east:
      to: tba:52:room:5207
      look: The center of the market lies this way.
    south:
      to: tba:52:room:5217
      look: >
        From the massive stench, this must have been a meat and poultry stand. It lies totally bare.

"tba:52:room:5209":
  name: A Side Street
  description: >
    This small side street leads east and west into back alleys while to the south you see the temple. 
    The incessant howling tears at your mind.
  sector: city
  exits:
    east:
      to: tba:52:room:5243
    south:
      to: tba:52:room:5210
    west:
      to: tba:52:room:5228

"tba:52:room:5210":
  name: A Side Street
  description:
  - >
    You are in the common section of the city.  Ruined buildings made of clay and stone is all the view
    has to offer.  Most of these homes are nothing but piles of rubble, but some look almost safe enough
    to venture into.
  - The street continues north and south and buildings line the street.
  sector: city
  exits:
    north:
      to: tba:52:room:5209
    east:
      to: tba:52:room:5244
      look: A small doorway leads into a partially collapsed house.
      door:
        keywords: [door]
        kind: door
    south:
      to: tba:52:room:5211
    west:
      to: tba:52:room:5226
      look: A small clay dwelling sits here.

"tba:52:room:5211":
  name: A Side Street
  description: >
    This small side street leads away from the garden path to the south. Around you stand large piles
    or rubble where the houses of commoners used to be.  A lone howl makes you worry greatly about your
    safety here.
  sector: city
  exits:
    north:
      to: tba:52:room:5210
    east:
      to: tba:52:room:5237
      look: An unusually tall dwelling stands looming over you.
    south:
      to: tba:52:room:5204
      look: A garden path circles around the temple.
    west:
      to: tba:52:room:5227
      look: Here lies a small stone house with a thatched roof.

"tba:52:room:5212":
  name: A Side Street
  description: >
    This small side street leads south away from the temple into the business section of town.  The
    destruction that leveled this city was not biased; these important looking buildings have been almost
    totally destroyed.  There is a hole in the wall of a very large structure to the east.
  sector: city
  exits:
    north:
      to: tba:52:room:5206
      look: A small garden path encircles the temple.
    east:
      to: tba:52:room:5232
      look: This possibly could be the city hall.
    south:
      to: tba:52:room:5213
    west:
      to: tba:52:room:5221
      look: Inside the building you see long pieces of metal, an oven, and some anvils.

"tba:52:room:5213":
  name: A Side Street
  description: >
    This small side street is lined with the remains of once great buildings.  To the west is a dark,
    foreboding structure while to the east lies the entrance to a small tavern.  The street continues
    north and south.
  sector: city
  exits:
    north:
      to: tba:52:room:5212
    east:
      to: tba:52:room:5230
      look: >
        From the looks of it, this was once a two story abode.  The entire second floor has collapsed
        leaving a very little part of the bar still free from debris.
    south:
      to: tba:52:room:5214
    west:
      to: tba:52:room:5219
      look: >
        This seems to be the only guild house in the entire city.  Its dark nature makes you wonder about
        its origins.

"tba:52:room:5214":
  name: A Side Street
  description: >
    You are at the end of a long street leading to the center of the city. A long dark alley runs east
    and west.
  sector: city
  exits:
    north:
      to: tba:52:room:5213
    east:
      to: tba:52:room:5229
    west:
      to: tba:52:room:5218

"tba:52:room:5215":
  name: Under A Ruined Watchtower
  description: >
    You stand at the base of a tall watchtower built to protect the city from invaders.  From the looks
    of things, it did not do a good job.
  sector: city
  exits:
    north:
      to: tba:52:room:5216
    east:
      to: tba:52:room:5218
    up:
      to: tba:52:room:5247

"tba:52:room:5216":
  name: A Back Alley
  description: >
    This alley leads to the rear of what used to be a meat stand.  You wince at the stench.  South is
    one of the city watchtowers.
  sector: city
  exits:
    north:
      to: tba:52:room:5217
      look: You see the back-side of the market place meat stand.
    south:
      to: tba:52:room:5215
      look: A tall watchtower stands a silent vigil over the city.

"tba:52:room:5217":
  name: The Meat Stand
  description: >
    A large stand has been set up here with metal hooks and wooden racks in the background.  Hanging on
    the hooks are very small scraps of meat and other game.  This stand is relatively empty, and a
    sudden burst of howling and screaming makes you realize why this is so.
  sector: city
  exits:
    north:
      to: tba:52:room:5208
      look: The market place lies this way.
    east:
      to: tba:52:room:5220
      look: This is a cart full of rotted vegetables and fruits.
    south:
      to: tba:52:room:5216

"tba:52:room:5218":
  name: A Back Alley
  description: A narrow alley leads east to a wider street and west to one of the city watchtowers.
  sector: city
  exits:
    east:
      to: tba:52:room:5214
      look: A small side street greets you.
    west:
      to: tba:52:room:5215
      look: A tall watchtower stands a silent vigil over the city.

"tba:52:room:5219":
  name: The Guild House
  description: >
    You are standing in what once was this city's ONLY guild house. Tables and chairs have been smashed
    and broken weapons lie strewn about the floor as if some massive battle had taken place here. 
    Draped along the back wall is a tattered, jet-black banner with the symbol of the Darkside set upon it.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:52:room:5213
      look: A small side street runs past the building.

"tba:52:room:5220":
  name: The Produce Stand
  description: >
    A large cart sits here carrying rotted fruit and vegetables.  Flies swarm all about what seems to
    be the last remaining bits of food left in the city.
  sector: city
  exits:
    north:
      to: tba:52:room:5207
      look: The market place is deserted.
    west:
      to: tba:52:room:5217
      look: A strong stench emanates from the meat stand next to you.

"tba:52:room:5221":
  name: The Smithy
  description: >
    In here you find tools and anvils used to make various weapons and items.  The walls have been
    stripped clean and only a few incomplete pieces of armor and weaponry are left.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:52:room:5212
      look: A small side street runs past the building.

"tba:52:room:5222":
  name: The Tapestry Stand
  description: >
    Tattered and torn tapestries and rugs lie heaped in piles.  Fancy robes and various articles of
    clothing are now just rags.  You stare at the strange piles for a long time until a piercing howl makes
    you think these might be beds.
  sector: city
  exits:
    north:
      to: tba:52:room:5223
    east:
      to: tba:52:room:5225
      look: A fine jewellery stand lies in ruin next to you.
    south:
      to: tba:52:room:5208
      look: The market place is deserted.

"tba:52:room:5223":
  name: A Back Alley
  description: >
    A narrow alley leads north to one of the city watchtowers while to the south there lies a market
    stand full of torn clothes and rugs.
  sector: city
  exits:
    north:
      to: tba:52:room:5224
      look: A tall watchtower stands a silent vigil over the city.
    south:
      to: tba:52:room:5222

"tba:52:room:5224":
  name: Under The Watchtower
  description: >
    You stand under one of the city watchtowers built to protect the city from invaders.  Obviously, it
    failed.
  sector: city
  exits:
    east:
      to: tba:52:room:5228
    south:
      to: tba:52:room:5223
    up:
      to: tba:52:room:5246
      look: Above you looms a tall watchtower.

"tba:52:room:5225":
  name: The Jewellery Stand
  description: >
    A table has been tipped over, spilling fine jewellery and gems across the market place.  Most of
    these trinkets are battered and tarnished and few would have any value anymore.
  sector: city
  exits:
    south:
      to: tba:52:room:5207
      look: The market place is deserted.
    west:
      to: tba:52:room:5222
      look: Next to you is a stand full of ruined clothes and rugs.

"tba:52:room:5226":
  name: A Ruined Clay Dwelling
  description: >
    This was once a very plain house with nothing more than a few chairs and a bed.  A cold fireplace
    suggests that the city has been abandoned for quite a while.  Almost nothing remains of this humble
    abode.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:52:room:5210
      look: Outside is a small side street.

"tba:52:room:5227":
  name: A Collapsed Stone Dwelling
  description: >
    This small house has completely collapsed upon itself leaving piles of debris here and there.  A
    few rafters still stand with thatched straw hanging down and a hot wind gusts through the hollow
    dwelling.
  sector: city
  exits:
    east:
      to: tba:52:room:5211
      look: A small side street runs past the house.

"tba:52:room:5228":
  name: A Back Alley
  description: A narrow alley leads west to one of the city watchtowers and east to a small side street.
  sector: city
  exits:
    east:
      to: tba:52:room:5209
    west:
      to: tba:52:room:5224

"tba:52:room:5229":
  name: An Abandoned Shop
  description: >
    From the outside this place looks like an ordinary pile of rubble, but inside these cramped
    quarters you discover what used to be a shop filled with armor, weapons, and various other goods.  A small
    sign flutters in the wind.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:52:room:5214
      look: A small side street runs past the shop.

"tba:52:room:5230":
  name: The Tavern Of The Sun
  description: >
    A glorious place in its prime, this tavern now lies in ruin; tables and chairs are broken
    scattered, bottles and glasses shattered, and a small performance stage crushed.  Musical instruments and
    personal belongings lie under the rubble, but the people they once belonged to are not with them. 
    Looking up you see that the entire second floor and roof has fallen in, leaving a gaping hole above.
  sector: city
  exits:
    west:
      to: tba:52:room:5213
      look: A small side street runs past the tavern.

"tba:52:room:5231":
  name: The South Wing Of The City Hall
  description: >
    You stand in a large room attached to this end of the hallway which leads back north to the
    reception area.  Pedestals and columns have fallen and most of the valuable items have been taken, leaving
    worthless debris. A few chairs have survived, as well as a large curved desk.  To the east is a
    vine-covered archway leading out into a private courtyard.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:52:room:5232
      look: The long hallway leads back to the main reception area of the city hall.
    east:
      to: tba:52:room:5234

"tba:52:room:5232":
  name: The City Hall
  description: >
    This is the main reception area of Thalos' city hall.  The walls have been charred and scored
    massively and debris is spread from wall to wall. A large gaping hole in the west wall allows you to see
    out to one of the city's side streets.  Obviously no one will be seeing you through today. Hallways
    lead south and east.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:52:room:5202
      look: Main street runs past the city hall.
    east:
      to: tba:52:room:5233
      look: A hallway leads to the east wing of the city hall.
    south:
      to: tba:52:room:5231
      look: A hallway leads to the south wing of the city hall.
    west:
      to: tba:52:room:5212

"tba:52:room:5233":
  name: The East Wing Of The City Hall
  description: >
    Here lies the remnants of a fancy office, possibly the mayor's.  A few withered plants and broken
    pieces of furniture make this place anything but fancy, though.  The only thing remaining intact here
    is a large glass cabinet.  A long hallway leads west back to the reception area and an ivy-covered
    archway leads south into a private courtyard.
  sector: city
  flags: [indoors]
  exits:
    south:
      to: tba:52:room:5234
    west:
      to: tba:52:room:5232

"tba:52:room:5234":
  name: The Private Gardens And Courtyard Of Thalos
  description: >
    What a shame that this mass destruction also touched this once beautiful place.  The temple's
    garden path has nothing on this garden. Flowers and trees have been smashed into the ground and lawn
    benches thrown through walls.  A large marble fountain in the center of the courtyard still stands,
    though, defying any attempts to destroy its beauty.  Above stands the remnants of one of the watchtowers. 
    Archways north and west lead back into the city hall.
  sector: city
  exits:
    north:
      to: tba:52:room:5233
    west:
      to: tba:52:room:5231

"tba:52:room:5235":
  name: A Small Guard House
  description: >
    This was once the barracks for Thalos' Cityguards.  Now just an empty shell, this small shack still
    stands guarding the entrance both to the city and to the city hall.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:52:room:5201
      look: Main street runs by this building.

"tba:52:room:5236":
  name: A Collapsed Home
  description: >
    All that's left of this house is a few scattered piles of rubble and a very large blast crater. 
    Obviously someone or something important was once housed here.  A shrieking howl chills your blood.
  sector: city
  exits:
    south:
      to: tba:52:room:5202
      look: Main street runs past this ruined home.

"tba:52:room:5237":
  name: A Tall Dwelling
  description: >
    This seems to be the tallest structure remaining in the city.  At one time this could have been an
    inn of some sort, but now it is just a mess.  The back wall as been completely knocked down revealing
    an entrance into another building through yet another collapsed wall. Between the two buildings are
    a few blast craters and boulders.  An old set of wooden steps leads up to a creaking second floor.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:52:room:5238
    west:
      to: tba:52:room:5211
      look: A small side street winds past the dwelling.
    up:
      to: tba:52:room:5245
      look: >
        The stairs and even the entire second floor itself looks very unsafe for travel.  Gusts of wind
        make them creak and shudder.

"tba:52:room:5238":
  name: A Small Shack
  description: >
    This cramped dwelling could not have housed more than one person.  Now with the back wall missing,
    it could hold many more.  Looking around you find broken shelves and workbenches with various vials
    and pouches spilling contents all across the floor.  This was possibly the magic shop of the city. 
    The doorway to the east is blocked, making the only exit back west.
  sector: city
  flags: [indoors]
  exits:
    west:
      to: tba:52:room:5237

"tba:52:room:5239":
  name: A Back Alley
  description: >
    A narrow back alley goes south to main street and north towards a watchtower.  A mass of howls
    catches you of guard.
  sector: city
  exits:
    north:
      to: tba:52:room:5240
    south:
      to: tba:52:room:5201
      look: Main street runs past here.

"tba:52:room:5240":
  name: A Back Alley
  description: >
    A narrow back alley leads north to one of the city watchtowers and south towards main street.  To
    the west is a doorway to a small house blocked by debris.
  sector: city
  exits:
    north:
      to: tba:52:room:5241
      look: A tall watchtower stands a silent vigil over the city.
    south:
      to: tba:52:room:5239

"tba:52:room:5241":
  name: Under A Watchtower
  description: >
    You stand under a tall watchtower.  Narrow back alleys lead west and south and a very weak looking
    ladder leads up into the tower.  Above you, you hear the screams of tens of starving lamias!  Beware!
  sector: city
  exits:
    south:
      to: tba:52:room:5240
    west:
      to: tba:52:room:5243
    up:
      to: tba:52:room:5248
      look: >
        Winds howl high above your head in the tower above.  You hear the screams of tens of howling lamias
        above you!

"tba:52:room:5242":
  name: A Bath House
  description: >
    This was once the bath house for the commoners of the city.  Hot steamy water still wells up from a
    hole in the floor.  Obviously there is a hot spring located under the city (making the decision to
    put a city here seem much more reasonable).  Closer inspection of the water yields a dead body
    floating around in it, skin melted away from months of floating in there.  The west wall has collapsed
    revealing another collapsed house.
  sector: city
  flags: [indoors]
  exits:
    north:
      to: tba:52:room:5243
    west:
      to: tba:52:room:5244
      look: The wall has collapsed on the adjoining house, creating a new opening in it.

"tba:52:room:5243":
  name: A Back Alley
  description: >
    A narrow back alley leads west to a small side street and east to one of the city watchtowers. 
    Great amounts of steam issue forth from the building to the south.
  sector: city
  exits:
    east:
      to: tba:52:room:5241
      look: A watchtower stands a silent vigil over the city.
    south:
      to: tba:52:room:5242
    west:
      to: tba:52:room:5209
      look: A side street runs by here.

"tba:52:room:5244":
  name: An Upright House
  description: >
    This home is practically the only one around that is still standing. Except for the massive hole in
    the east wall, everything else looks intact, including the windows.  Great amounts of steam issue
    forth from the hole in the east wall.
  sector: city
  flags: [indoors]
  exits:
    east:
      to: tba:52:room:5242
    west:
      to: tba:52:room:5210
      look: A small side street runs past the house.

"tba:52:room:5245":
  name: On The Second Floor
  description: >
    The minute you step off onto this floor you realize it was a mistake. The old rotted floorboards
    suddenly give way and you fall down, impaling yourself on jagged boards below.
  sector: city
  flags: [no_mob, indoors]

"tba:52:room:5246":
  name: The North-West Watchtower
  description: >
    You stand atop one of the city watchtowers.  The view is magnificent from here and you can see all
    the way to the western mountains.  No wonder this place stood for so long.
  sector: city
  exits:
    down:
      to: tba:52:room:5224
      look: The city lies below.

"tba:52:room:5247":
  name: The South-West Watchtower
  description: >
    You stand atop one of the city watchtowers.  The view is magnificent from here and you can see all
    the way to the western mountains.  To the south the desert stretches to the horizon.  No wonder this
    place stood for so long.
  sector: city
  exits:
    down:
      to: tba:52:room:5215
      look: The city lies below.

"tba:52:room:5248":
  name: The North-East Watchtower
  description: >
    You stand atop one of the city watchtowers.  The view is magnificent from here and you the desert
    sand stretches to the horizon.  No wonder this place stood for so long.  The ladder leading down seems
    rotted in some places!
  sector: city
  flags: [no_mob]
  exits:
    down:
      to: tba:52:room:5249
      look: The city lies below... far, far below.

"tba:52:room:5249":
  name: Under A Watchtower
  description: >
    As you descend the ladder, the rotted rungs break, sending you quickly to your demise far below. 
    Splat.
  sector: city
  flags: [no_mob, indoors]

"tba:52:room:5250":
  name: The Temple Of Thalos
  description:
  - >
    You stand within one of the most holy places in the realm.  This stunning domed temple once housed
    the city's worshipers en masse. Unfortunately, it succumbed to the destruction brought on this city.
    Long benches lie toppled and the altar desecrated.  Large chunks of stone have fallen from the walls
    and roof, sending sunlight streaming in on you.  A few books lie about, conveying to you a holy
    message in a strange tongue.
  - >
    Wind gusts through the four archways and howls and screams can be heard from all parts of the city.
  sector: city
  flags: [no_mob, indoors, no_magic]
  exits:
    north:
      to: tba:52:room:5204
      look: A side street leads to the northern half of the city.
    east:
      to: tba:52:room:5203
      look: Main street leads out to the main gate of the city.
    south:
      to: tba:52:room:5206
      look: A side street leads to the southern part of the city.
    west:
      to: tba:52:room:5205
      look: The market place lies this way.
