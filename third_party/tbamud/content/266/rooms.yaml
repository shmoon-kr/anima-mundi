"tba:266:room:26660":
  name: Halfway Up a 'Trail'
  description: >
    You find your arms are getting way too tired to keep up the climbing the way you've been.  The top
    of the cliff still seems miles away from where you are now, and there is no spot on this cliff to
    just stop and take a break.  It might be a good idea to climb back down, and take your chances in the
    forest.
  sector: inside
