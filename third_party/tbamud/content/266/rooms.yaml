"tba:266:room:26692":
  name: Dark Tunnel
  description: >
    As your eyes adjust to the darkness, you see that you are in a tunnel hewn out of the cliff
    rockbed.  A feeling in your gut tells you that this tunnel was not made by ordinary creatures.  Little
    tracks lead to and from a crude nest near the tunnel entrance.  A sudden movement catches your eye and you
    see the fleeing form of some small creature dashing outside through the rockfall.  You can explore
    the tunnel more to the north or head back outside.
  sector: inside
  flags: [dark, no_mob, no_track, tunnel]
  exits:
    north:
      to: tba:266:room:26693
    up:
      to: tba:266:room:26686
      door:
        keywords: [rock]
        kind: door

"tba:266:room:26693":
  name: Dark Tunnel
  description: >
    A think layer of dust covers the hewn floor.  The undisturbed state of things in the tunnel show
    that no one has passed through this way in ages.  The stone walls become more polished and smoother as
    one progresses northwards.  A faint odor of incense and spices lingers in the air.
  sector: inside
  flags: [dark, no_track, tunnel]
  exits:
    north:
      to: tba:266:room:26694
    south:
      to: tba:266:room:26692

"tba:266:room:26694":
  name: Dark Chamber
  description: >
    The tunnel opens up into a small chamber.  The polished walls reflect the torchlight in an eerie
    way.  The smell of incense and spices hang heavily in the air, stiffling you.  A stone slab sits in the
    middle of the chamber.  Strange runes adorn the stone slab.  A faded trail of blood upon the slab
    catches your eye and you follow the trail to the floor.  There you see that you are standing in the
    middle of a pentagram inscribed into the stone floor.  Repressing a feeling of dread, you get on your
    knees to study a small indentation in the middle of the pentagram....
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    south:
      to: tba:266:room:26693
    down:
      to: tba:266:room:26695
      door:
        keywords: [pentagram]
        kind: door
  extras:
  - keywords: [slab]
    text: It is encrypted with strange runes.
  - keywords: [runes]
    text: >
      The runes depict what appears to be the very same stone slab that they are inscribed upon.  The
      runes show a manlike being standing before the runes, the runes glowing fiercely, and then the man gone.

"tba:266:room:26695":
  name: Entrance to another Dimension
  description: >
    - The walls of the chamber begin to shimmer brightly.  The outline of the pentagram catches fire
    and burns brightly.  The runes on the slab begin to glow fiercely.  A droning sound begins and
    intensifies painfully.  Reality seems to slip away as the room begins to spin around you.  Trying to get a
    grip on yourself in this maddening scene, you notice an entryway opening up before you.
  sector: inside
