# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 266.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:266:room:26600":
  name: Edge of the Walkway
  description: >
    You have skirted your way right to edge of the path and are now able to get a good look at what
    lies below.  Way below.  The 'path' that you thought might lead down in a zig zag or perhaps in steps is
    actually a set of stone rungs notched into the cliff face.  The forest, so far below where you stand
    looking down upon it, seems strangely dark, strangely forbidding and very far away. Maybe it would
    just be best to forget climbing this ledge.  After all, isn't Thursday?  Seems like Grainy's in Jareth
    had a really good dinner special on Thursdays...  Yeah, that's it.
  sector: mountains
  exits:
    south:
      to: tba:263:room:26354
    down:
      to: tba:266:room:26601
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           The Realm of Lord Ankou by Kaan for Dibrova
        aka The Dark and Sinister Forest
        This is a forest zone surrounded on all four sides by an unscalable cliff
        face.  It is meant to hold four zones Banshide, the Haunted House and the
        Castle of the Vampyre.  This is an extremely high level zone, meant for
        groups, the mobs are often aggro, Lord Ankou himself drives a band of
        spectral minions before his cart which he rides throught the forest, so
        players not only have to contend with Ankou as the highest level mob, but
        also his minions who will fight for their Lord to the death.  The code for
        the minions to follow Ankou can be found on the snippets page. This was
        originally intended to connect to the farmlands, at their western-most side
        at the chasm.  The lack of a way out of this zone is intentional, just a
        little thing to get players stark raving mad when visiting here if they forget
        to bring a recall.
        
        Zone 266 is linked to the following zones:
        263 Farmlands                      at 26600 (south) ---> 26354
        252 Castle of the Vampyre          at 26633 (east ) ---> 25200
        252 Castle of the Vampyre          at 26634 (south) ---> 25200
        259 Haunted Mansion                at 26643 (west ) ---> 25900
        259 Haunted Mansion                at 26647 (south) ---> 25902
        259 Haunted Mansion                at 26649 (north) ---> 25906
        264 Banshide                       at 26655 (west ) ---> 26400
        259 Haunted Mansion                at 26657 (east ) ---> 25904
        264 Banshide                       at 26664 (south) ---> 26428
        264 Banshide                       at 26665 (north) ---> 26419
        
           * In room 26659, the reset has moved object 26604 to neck, since there is no
        face slot here.  If you have a face slot, this should be moved back to face.

"tba:266:room:26601":
  name: Climbing down the Cliff
  description: >
    Standing so near to the top of the walkway, hanging on for dear life, you realize what a follhearty
    decision this was to climb this rocky face.  You can see birds playing below you, almost DIRECTLY
    below you in the treetops of the forest so far beneath your feet.  One wrong step, one slip of the hand
    on the tenuous handhold you already maintain, and you are birdfeed in the treetops. Maybe you should
    just climb up one more step, get off this walkway and call it all good.
  sector: mountains
  exits:
    up:
      to: tba:266:room:26600
    down:
      to: tba:266:room:26602

"tba:266:room:26602":
  name: Climbing down the Cliff
  description: >
    This climb is going to take forever!  You are still not even halfway down the cliff and it seems
    like the closer to the forest you get, the darker and more forboding it gets.  Not to mention every
    time you look down, a wave of nausea racks your body, making you almost lose your grip on the rungs.
  sector: inside
  exits:
    up:
      to: tba:266:room:26601
    down:
      to: tba:266:room:26603

"tba:266:room:26603":
  name: Halfway down a 'Trail'
  description: >
    Well, here you are - halfway up or down depending on how you look at it. Your situation has
    improved a little bit.  It looks like if you fell now, you would only break a great many bones, rather than
    just die.  Of course, maybe dying would be preferable.  You see that the trees below are twisted and
    gnarled, all of them seeming more dead than alive.  Sure is encouraging.
  sector: mountains
  exits:
    up:
      to: tba:266:room:26602
    down:
      to: tba:266:room:26604

"tba:266:room:26604":
  name: Nearing the Forest Floor
  description: >
    The forest looms ever closer, ever more dark and sinister.  You can now see that the birds you saw
    from up above playing in the treetops were actually buzzards which seem to constantly circle the
    treetops everywhere, fighting each other and anything that trys to get past them.  Looking up, you
    realize that the climb ahead would be a real bitch, maybe even impossible.
  sector: inside
  exits:
    up:
      to: tba:266:room:26660
    down:
      to: tba:266:room:26605

"tba:266:room:26605":
  name: Tree Top Level - Almost to the Ground
  description: >
    The trees that you have begun to descend through seem to try to grab your feet as you climb down
    the cliff.  The branches all snag your clothing, sharp and piercing as you climb down.  The buzzards
    won't seem to leave you alone and fighting here is just not what you had in mind when you began your
    descent. The forest floor below you, all covered in shadows and mystery, is just a long jump down, but
    still a far enough jump that a broken leg or ankle would almost certainly result in a jumping attempt.
  sector: mountains
  exits:
    up:
      to: tba:266:room:26604
    down:
      to: tba:266:room:26606

"tba:266:room:26606":
  name: Dark and Sinister Forest
  description: >
    The forest around you seems dead, all the trees and their branches seem withered and brittle. 
    Strangely enough, with all the lingering death around you, there seems to be a great deal of movement
    around you, but always out of the corner of your eye.  Always just out of sight.  The cliff face runs
    along to your south, the forest growing right up to the edge and up the edge in some spots.  There is a
    set of rungs grooved into the cliff face here.  It looks as if you may be able to climb up!
  sector: forest
  flags: [dark, no_mob]
  exits:
    north:
      to: tba:266:room:26607
    east:
      to: tba:266:room:26619
    west:
      to: tba:266:room:26639
    up:
      to: tba:266:room:26605

