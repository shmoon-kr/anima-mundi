"tba:60:room:6008":
  name: The Forest Clearing
  description: >
    You are in a clearing in the forest.  Lots of fresh stumps of varying sizes protrude from the
    ground and heavy logs are stacked neatly in a big pile supported by stakes set into the ground.  Paths
    lead north, east and west.
  sector: forest
  exits:
    north:
      to: tba:60:room:6011
      look: The small path leads north through the trees.
    east:
      to: tba:60:room:6009
      look: The small path leads east through the trees.
    west:
      to: tba:60:room:6007
      look: The small path leads west through the trees.
  extras:
  - keywords: [tree, trees]
    text: The trees are mostly old beeches and oaks.
  - keywords: [stump, stumps]
    text: There are more stumps than logs and some of the stumps are partly covered in moss.
  - keywords: [stake, stakes]
    text: The stakes keep the logs from rolling down.
  - keywords: [path, paths]
    text: The narrow path is probably used by the animals living in the forest.
  - keywords: [log, logs]
    text: >
      Even though the logs have been chopped to shorter pieces, they are quite heavy as they are fresh
      and still filled with sap.

"tba:60:room:6009":
  name: Outside A Small Cabin In The Forest
  description: >
    You are outside a small cabin built entirely from heavy logs.  There is a wooden door to the north
    and small paths lead west and south through the trees.
  sector: forest
  exits:
    north:
      to: tba:60:room:6010
      look: The wooden door is quite sturdy but does not appear to be equipped with a lock.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    south:
      to: tba:60:room:6014
      look: The small path leads south through the dense forest.
    west:
      to: tba:60:room:6008
      look: The small path leads west through the light forest.
  extras:
  - keywords: [tree, trees]
    text: The trees are fairly young, not much more than a hundred years or so.
  - keywords: [path, paths]
    text: The path is probably used by the cabin's inhabitants.
  - keywords: [cabin, logs, log]
    text: >
      It looks simple but comfortable and the slender trees make the whole place seem pretty idyllic.  It
      is a cabin built from wooden logs.

"tba:60:room:6010":
  name: Inside The Cabin
  description: >
    You are inside a small one-room cabin made entirely from heavy logs. It is very sparsely furnished,
    containing only the most basic housekeeping equipment, such as a bed, a chair and a table.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:60:room:6009
      look: The wooden door leads south.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
  extras:
  - keywords: [carving, carvings, carved]
    text:
      preformatted: |2
           On the table is carved :
                                                          /) /)
                  Danny and Mari, Oct 31, 1991           ( o o )
                                                          = x =
                                                         m     m
                                                      ***(========-
  - keywords: [table]
    text: A heavy table that doesn't even appear to rock.  It seems to have something carved on it.
  - keywords: [chair]
    text: It is made from oak and looks strong and sturdy.
  - keywords: [bed]
    text: It is definitely not the most comfortable bed you have seen in your life.

