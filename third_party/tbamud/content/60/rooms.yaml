"tba:60:room:6022":
  name: Inside The Cave
  description: >
    You are in a natural cave.  Various sorts of debris cover the stone floor, emitting a rather
    unpleasant smell that makes the air thick and hard to breathe.  The only obvious exit is east.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:60:room:6021
      look: The cave opening is to the east.
  extras:
  - keywords: [air, smell]
    text: Kind of transparent, but quite noticeable nevertheless.
  - keywords: [cave, walls, floor, stone]
    text: Quite uninteresting.
  - keywords: [debris]
    text: It consists mostly of gnawed bones mixed with small pieces of torn fur.

"tba:60:room:6023":
  name: A Grassy Field
  description: >
    You are in a grass covered field somewhere in the forest.  The tall grass nearly reaches your
    waist, and the surrounding oaks and beeches form an almost wall-like thicket on the east side of the
    field.  To the northeast you can see a small lake.  A small path leads south through the trees, and the
    field opens up to the north and west.
  sector: field
  exits:
    north:
      to: tba:60:room:6026
      look: >
        Wind blowing in from the north carries with it the smell of a newly killed animal, as well as the
        noise of many birds, which you can see circling there.
    east:
      to: tba:60:room:6024
      look: The ground slopes gently downward to the eastern tree line.
    south:
      to: tba:60:room:6018
      look: The small path leads south in between the trees.
  extras:
  - keywords: [birds, bird, circling]
    text: >
      Many carrion birds are circling to the north, you presume they are waiting for their turn to feast
      on a corpse.
  - keywords: [tree, trees, thicket]
    text: The trees form a close thicket, blocking any exit to the west.
  - keywords: [path]
    text: The narrow path is probably used by the animals living in the forest.
  - keywords: [grass]
    text: The tall grass makes a nice hiding place for animals.

"tba:60:room:6024":
  name: The Lower Part Of The Grassy Field
  description: >
    You are in a lower part of the grassy field, south of a small lake.  The grass here has been
    trampled by the many animals coming here for water, leaving the ground covered in tracks of different
    types.  To the west you see a break in the wall of trees surrounding the field, and to the north is a
    small lake.
  sector: field
  exits:
    north:
      to: tba:60:room:6025
      look: The animal tracks lead off to the north, and around the lake there.
    west:
      to: tba:60:room:6023
      look: To the south-west you see a break in the tree line, leading back to the forest path.
  extras:
  - keywords: [tree, trees, thicket]
    text: The trees form a close thicket, blocking any exit to the south and east.
  - keywords: [path, trampled]
    text: The trampled grass path leads to the lake north of here.
  - keywords: [grass]
    text: The tall grass makes a nice hiding place for animals.

"tba:60:room:6025":
  name: Beside The Lake In A Grassy Field
  description: >
    The grass stops shortly before the lake, replaced by mud covered in tracks from the local animals. 
    When you come close many animals scatter into the tall grass and some even into the forest.  To the
    west you see birds circling in the high in the air, and to the north you see a small lake, surrounded
    by tall reeds.  The field continues to the south, and the forest blocks passage to the east.
  sector: field
  exits:
    north:
      to: tba:60:room:6027
      look: >
        The lake looks inviting, and you can see some sort of water fowl floating around among the reeds.
    south:
      to: tba:60:room:6024
      look: To the south an animal trail leads of towards a the other side of the lower field.
    west:
      to: tba:60:room:6026
      look: The smell of carrion drifts down to you from higher on the field to the west.
  extras:
  - keywords: [track, tracks, mud]
    text: >
      You see tracks of both hooved and other sorts of animals.  Evidence of all sizes of animals is here
      in the mud, showing just how lively the forest is.
  - keywords: [birds, bird, circling]
    text: >
      Many carrion birds are circling to the west, you presume they are waiting for their turn to feast
      on a corpse.
  - keywords: [tree, trees, thicket]
    text: The trees form a close thicket, blocking any exit to the north or east.
  - keywords: [lake]
    text: >
      Animals from all around come here to drink.  The lake itself is not very big, but it stretches off
      to the north from here.
  - keywords: [grass]
    text: The tall grass makes a nice hiding place for animals.

"tba:60:room:6026":
  name: The Northern Section Of A Grassy Field
  description: >
    As you come close, scavenging animals and birds of all sorts scatter, leaving only the boldest and
    stupidest encircling the carcass of a large boar. Carrion birds circle overhead, and smaller animals
    stare out of the tall grass at you.  The grass here has been trampled, and a large area around the
    carcass is stained by blood.  A trail leads down the sloping field to a lake, and to the south you see
    the path back to the forest.
  sector: field
  exits:
    east:
      to: tba:60:room:6025
      look: >
        A small lake lies down the sloping field to the east.  Some of the animals that fled from here have
        gone there, and are watching, waiting for you to leave so they can resume their feasting.
    south:
      to: tba:60:room:6023
      look: The field continues to the south, and you can see the path back to the forest there.
  extras:
  - keywords: [animal, animals, small]
    text: >
      Several pairs of eyes peer out at you, urging you to leave.  The just might decide that en masse
      they could kill you, so you probably don't want to tarry here.
  - keywords: [birds, circling]
    text: >
      Many birds of varying size circle overhead, waiting for you to leave.  You hope they don't decide
      that you could be a corpse with just a little effort.
  - keywords: [tree, trees, thicket]
    text: The trees form a close thicket, blocking any exit to the north and west.
  - keywords: [path]
    text: The narrow path is probably used by the animals living in the forest.
  - keywords: [grass]
    text: >
      The tall grass makes a nice hiding place for animals.  You see some of the animals you frightened
      away peeking furtively out at you.

"tba:60:room:6027":
  name: On The Lake
  description: >
    You are in the middle of a small lake, fed from a small stream coming through the forest from the
    northwest.  The water is not that clear, but you can see fish swimming around below you.  The bank is
    clear to the south, providing a safe place to get back to the field.
  sector: water_noswim
  exits:
    south:
      to: tba:60:room:6025
      look: Some animals have gathered on the bank to watch you, curious about what you are doing.
  extras:
  - keywords: [reed, reeds]
    text: >
      Reeds grow up around the edges of the lake, providing cover for the small water fowl that live here.
  - keywords: [tree, trees, thicket]
    text: Trees cover the bank on most sides, preventing you from docking there.
  - keywords: [lake]
    text: >
      Animals from all around come here to drink.  The lake itself is not very big, but it stretches off
      to the north from here.
  - keywords: [fish]
    text: Trout and perhaps a catfish or two swim about below you, totally ignoring your presence.

