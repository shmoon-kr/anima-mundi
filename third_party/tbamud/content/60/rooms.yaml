# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 60.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:60:room:6000":
  name: The Edge Of The Forest
  description: >
    You are standing at the end of a dusty road, near the eastern edge of the large forest of
    Haon-Dor.  To the east you see the road heading back to the walled city, Midgaard, and to the west is a narrow
    trail leading through the forest.
  sector: field
  exits:
    east:
      to: tba:60:room:6090
      look: >
        To the east a dusty road takes you back to the walls of Midgaard, and its large west gate.
    west:
      to: tba:60:room:6001
      look: You see a narrow forest trail winding westward in between the trees.
  extras:
  - keywords: [tree, trees]
    text: >
      The trees are quite tall considering most of them appear to be quite young. On one of the trees,
      crude letters forming the word 'Haon-Dor' have been carved into the bark.
  - keywords: [trail]
    text: The forest trail winds westwards through the trees.

"tba:60:room:6001":
  name: A Trail Through The Light Forest
  description: >
    You are on a trail leading through the forest.  There seems to be a small path leading north into
    the shadows.  To the east is the forest edge and to the west the trail leads further into the forest.
  sector: forest
  exits:
    north:
      to: tba:60:room:6060
      look: You see evidence of a small path leading through a break in the trees to the north.
    east:
      to: tba:60:room:6000
      look: The trail continues eastwards out of the forest.
    west:
      to: tba:60:room:6002
      look: You see the narrow forest trail winding westwards in between the trees.
  extras:
  - keywords: [birds, insects, animals]
    text: Very cute little creatures, they seem to enjoy life.
  - keywords: [tree, trees]
    text: >
      The trees here are quite young and fresh.  They seem to accommodate many kinds of birds, insects
      and other small animals.
  - keywords: [trail]
    text: The forest trail winds east-west through the trees.

"tba:60:room:6002":
  name: A Trail Through The Light Forest
  description: >
    You are on a narrow trail winding east and west through the forest.  To the west, the forest
    gradually becomes more dense.  A small forest path leads off to the south.
  sector: forest
  exits:
    east:
      to: tba:60:room:6001
      look: The trail continues eastwards through the young trees.
    south:
      to: tba:60:room:6011
      look: The small path leads south through the young trees.
    west:
      to: tba:60:room:6003
      look: You see the narrow forest trail winding westwards into the dense forest.
  extras:
  - keywords: [tree, trees]
    text: >
      The young, slender trees look beautiful, their fresh, green leaves moving lightly in the wind.
  - keywords: [trail]
    text: The forest trail winds east-west through the trees.
  - keywords: [path, paths]
    text: The narrow path is probably used by the animals living in the forest.

"tba:60:room:6003":
  name: A Trail Through The Dense Forest
  description: >
    You are on a trail winding east and west through the dense forest.  To the east, the forest
    gradually seems to become lighter.
  sector: forest
  exits:
    east:
      to: tba:60:room:6002
      look: The trail continues eastwards to the younger part of the forest.
    west:
      to: tba:60:room:6004
      look: You see the narrow trail winding westwards through the dense forest.
  extras:
  - keywords: [tree, trees]
    text: >
      The dense crowns of the mature trees leave only a fraction of the sky to be seen through the leaves.
  - keywords: [trail]
    text: The forest trail seems almost fragile compared to the massive trunks.

