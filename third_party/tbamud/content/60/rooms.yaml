"tba:60:room:6029":
  name: Near A Large Tree In The Dense Forest
  description: >
    You are at the end of a small path leading through the dense forest.  The crowns of the old trees
    leave the forest in an unreal twilight illumination. This rough clearing is dominated by a very large
    oak tree, probably the largest in this part of the forest.  The path leads back to the north.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:60:room:6028
    up:
      to: tba:60:room:6030
      look: You see the lower branches of the towering oak.
  extras:
  - keywords: [top, highest, high]
    text: >
      You could probably see most of the forest, and perhaps even the city from the top of the tree... 
      Of course, you'd have to deal with whatever that shape is pacing on one of the upper limbs.
  - keywords: [limb, limbs]
    text: >
      They look quite sturdy, certainly capable of holding your weight should you decide to climb up the
      tree using them.
  - keywords: [animal, shape]
    text: >
      From here it looks vaguely feline, though you could get a much better view from in the tree.  You
      are not sure if it has seen you yet.
  - keywords: [large, oak, tree]
    text: >
      It has some lower branches that you think you could reach if you stretched. You might even be able
      to climb all the top, though from here it looks like something else had that idea before you.  There
      is a faint animal shape pacing on one of the highest branches.
  - keywords: [trees]
    text: The trees are mostly old beeches and oaks, with one large oak off to your right.
  - keywords: [path, paths]
    text: The narrow path is probably used by the animals living in the forest.

"tba:60:room:6030":
  name: In The Lower Branches Of A Large Oak
  description: >
    You are in a huge oak, about one third of the way to the top.  The branches above you block out
    much of the light, but enough filters through for you to see.  Small animals and birds scatter at your
    approach, rustling the leaves all about you.  You could easily climb back down to the ground, or
    continue up the tree.  One large branch juts outward to the west, possibly providing a third choice of
    exit.
  sector: mountains
  exits:
    west:
      to: tba:60:room:6031
      look: >
        This limb looks large and strong enough for you to walk most of the way along its length to the
        west.
    up:
      to: tba:60:room:6032
      look: More large branches spread out from the tree above you.
    down:
      to: tba:60:room:6029
      look: The rough clearing is just a quick climb and jump below you.
  extras:
  - keywords: [top, highest, high]
    text: >
      You could probably see most of the forest, and perhaps even the city from the top of the tree... 
      Of course, you would have to deal with whatever that shape is that you see pacing on one of the upper
      limbs.
  - keywords: [limb, limbs]
    text: >
      They look quite sturdy, certainly capable of holding your weight should you decide to climb around
      in the tree using them.
  - keywords: [pacing, pace, animal, shape]
    text: >
      From here it looks feline.  You still don't think it has noticed you, despite the noise you made
      while climbing up here.
  - keywords: [feline]
    text: >
      The shape above you moves with definite grace and confidence.  You think that it must be a Bobcat,
      stalking smaller tree-dwelling animals.
  - keywords: [animals, bird, birds]
    text: >
      A variety of squirrels, chipmunks, and birds make their homes in this and the surrounding trees. 
      If you look closely you may be able to see some of their rapidly emptying nests.
  - keywords: [nest, nests]
    text: >
      After a short period of looking, you notice a bird's nest on a limb not far above you, and a large
      squirrel's nest in the crook of a large limb that stretches out towards the west.

"tba:60:room:6031":
  name: Out On A Limb In A Large Oak
  description: >
    This sturdy branch hangs far out over a path to the west, which you might be able to jump down to. 
    Several squirrels scamper into hiding as you approach, leaving you alone and swaying slightly with
    the wind.  To your north you can see a small log cabin through the trees, and to the southeast there
    seems to be some sort of clearing, with many birds circling above it.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:60:room:6030
      look: >
        Back to the east you see the tree trunk.  It is much less precarious there compared to here...
        perhaps you should go back.
    down:
      to: tba:60:room:6016
      look: >
        Below you is a small path, probably used by the forest animals.  You think that you could jump down
        with a little effort.
  extras:
  - keywords: [top, highest, high]
    text: >
      You could probably see most of the forest, and perhaps even the city from the top of the tree... 
      Of course, you would have to deal with whatever that shape is that you see pacing on one of the upper
      limbs.
  - keywords: [limb, limbs]
    text: >
      The limbs look quite sturdy, certainly capable of holding your weight should you decide to climb
      around in the tree using them.
  - keywords: [pacing, pace, animal, shape]
    text: >
      From here it looks feline.  You still don't think it has noticed you, despite the noise you made
      while climbing up here.
  - keywords: [feline]
    text: >
      The shape above you moves with definite grace and confidence.  You think that it must be a Bobcat,
      stalking smaller tree-dwelling animals.
  - keywords: [animals, bird, birds]
    text: >
      A variety of squirrels, chipmunks, and birds make their homes in this and the surrounding trees. 
      If you look closely you may be able to see some of their rapidly emptying nests.
  - keywords: [nest, nests]
    text: >
      You notice that several of the squirrels sought refuge in a large nest that is well within your
      reach.  Looking into the nest, you see two pairs of eyes staring back at you.

"tba:60:room:6032":
  name: Midway To The Top Of The Large Oak
  description: >
    You are in a huge oak, about midway to the top.  The branches above you block out much of the
    light, but enough filters through for you to see.  A few birds have remained to watch you from the fringe
    branches, well out of your reach.  Scratches mar the tree here, and torn bark is scattered near you
    on the branch.  It would seem some large forest cat lives nearby, so you had better be careful!  You
    can continue a bit farther up the tree, or descend to limbs that don't sway so much.
  sector: mountains
  exits:
    up:
      to: tba:60:room:6033
      look: >
        Above you the tree narrows farther, but it still looks like you could climb up there.  A feline
        shape is pacing about above you, trying to get to a large wounded bird.  Perhaps you should try to see
        what sort of cat this is before you interrupt its hunt... it might eat you instead of the bird.
    down:
      to: tba:60:room:6030
  extras:
  - keywords: [top, highest, high]
    text: >
      You could probably see most of the forest, and perhaps even the city from the top of the tree... 
      Of course, you would have to deal with whatever that shape is that you see pacing on one of the upper
      limbs.
  - keywords: [limb, limbs]
    text: >
      They look quite sturdy, certainly capable of holding your weight should you decide to climb around
      in the tree using them.
  - keywords: [feline, cat, pacing, pace, shape]
    text: >
      It looks like a Bobcat, and it seems quite intent on getting to a large bird that it has wounded. 
      It has not seen you yet, or perhaps just thinks you are too easy a meal.
  - keywords: [animal, animals, bird, birds]
    text: >
      A variety of squirrels, chipmunks, and birds make their homes in this and the surrounding trees. 
      If you look closely you may be able to see some of their rapidly emptying nests.
  - keywords: [nest, nests]
    text: >
      A medium sized bird's nest is close to you here, and it looks like it has some nice looking eggs in
      it too!

"tba:60:room:6033":
  name: High In The Large Oak
  description: >
    The tree top gently sways in the wind, and you think you are as high as you can safely go in the
    tree.  The limbs here show evidence of a small battle, with ripped bark and loose feathers scattered
    everywhere.  Looking around, you can see the forest stretching out below you in all directions.  To the
    east you see Midgaard, and to the south the river runs through a deep chasm.  North and west of here
    you can see another small village, and on the western horizon you see a large mountain.
  sector: mountains
  exits:
    down:
      to: tba:60:room:6032
      look: >
        Below you many of the animals you frightened earlier have returned to their various nests and
        homes.  You can see a small hint of the path far below you through the branches.
  extras:
  - keywords: [river, chasm]
    text: >
      To the south you see a river flowing roughly from the northeast to the west. It emerges from a dark
      opening in the side of a mountain and flows through Midgaard, and on into the forest.  It has eroded
      a deep chasm in the soft stone under the forest floor, and is not visible for long after it enters
      the forest proper.
  - keywords: [mountain, range, northeast]
    text: >
      A long mountain range stretches across the horizon to the north and northeast.  You have heard
      rumors of many different sorts of creatures living there, varying from Dwarves and Humans to Ogres and
      various humanoid creatures. Some say that evil Dark Elves dwell in the underworld deep below the lands
      of the Dwarves.  The caves of Moria also are found there, populated by all sorts of evil creatures.
  - keywords: [around, trees, everywhere, woods, forest]
    text: >
      Off to the southwest you can see a grass covered field, and a small lake; nortwest of you is a
      small cabin and a large pile of wood.  Far to west the treetops form a tight canopy, blocking out almost
      all sunlight and your view. It is said that large wolves live there.  You've also heard rumors of
      horrible spiders and drow living there.  You'd be best off leaving that area to more experienced
      adventurers.

