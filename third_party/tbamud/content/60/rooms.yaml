      the form of what you believe to be a Badger resting inside of the den.
  - keywords: [clearing, clear]
    text: >
      When the large tree fell it must have brought a few of the smaller trees down with it in order to
      make a clearing like this.
  - keywords: [fallen, rotten, decomposed, tree]
    text: >
