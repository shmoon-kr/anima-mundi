"tba:274:room:27426":
  name: Saint Brigid-Furze Road
  description: >
    The road junctions here, not officially, but there is a path that leads off to the north into the
    forest from the road.  And looking closer you can see the remains of what was a house build there.  It
    seems there was a road to it but it got overgrown through the years of lack of use.  The road
    continues east or the west top the Western Saint Brigid Gate.
  sector: field
  exits:
    north:
      to: tba:274:room:27428
    east:
      to: tba:274:room:27427
    west:
      to: tba:274:room:27414

"tba:274:room:27427":
  name: Saint Brigid-Furze Road
  description: >
    The road begins to slope to the south east here and it continues onto around the edge of the forest
    to the north through meadows and groves of trees where the forest spreads out across the land like a
    snake with a thick emerald green folage.  The road seems to go west too toward civilization and
    toward a gate nearby.
  sector: forest
  exits:
    west:
      to: tba:274:room:27426

"tba:274:room:27428":
  name: Narrow Forest Path
  description: >
    The path is pretty narrow but you manage to squeak through the trees and undergrowth to the north
    through the foliage toward the structure.  The only way back to the road is to the south.
  sector: forest
  exits:
    north:
      to: tba:274:room:27429
    south:
      to: tba:274:room:27426

"tba:274:room:27429":
  name: Narrow Forest Path
  description: >
    Outside the old house of the Leather Woman's Hut.  An outcast of Saint Brigid who was said to weave
    magic of wicca and powers of black hearts.  She worked leather mending for a living and made a
    meagre living but she was feared by all. The path leads south toward the road or you can enter the home
    north.
  sector: forest
  exits:
    north:
      to: tba:274:room:27430
    south:
      to: tba:274:room:27428

"tba:274:room:27430":
  name: Inside Leatherwoman's Hut
  description: >
    The house is half dilapadated, and falling apart, the ceiling is crumbling and there was holes int
    he walls, but they looks like they were patched at one time.  It is a wreck.  There is nothing here,
    but memories and no evil as it was said by the populace of Saint Brigid.  The only exit is south into
    the forest.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:274:room:27429

"tba:274:room:27431":
  name: Saint Brigid Jeweler
  description: >
    The Jewelry shoppe and appraiser works ehind a fortified steel cage as you walk in and everything
    is in glass cases.  That includes glass cases for even mediocre stuff in middle of the shop is under
    glass.  It looks like a bank or a keep than a regular store.  The only exit is south onto the main
    street.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:274:room:27409

"tba:274:room:27432":
  name: A Residence
  description: >
    The residences are simple shacks with a large cooking area on one end and a sleeping arragement of
    folding beds on the other, the shacks are dingy with dirt floors, and have a warm stone hearth in the
    center of it to heat it.  The only exit is north onto the street.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:274:room:27409

"tba:274:room:27433":
  name: A Residence
  description: >
    The residences are simple shacks with a large cooking area on one end and a sleeping arragement of
    folding beds on the other, the shacks are dingy with dirt floors, and have a warm stone hearth in the
    center of it to heat it.  The only exit is south onto the street.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:274:room:27407

"tba:274:room:27434":
  name: Saint Brigid Bread Market
  description: >
    The break market has a wonderful smell as you walk in and the store is setup where everything is in
    baskets to shop for or just examine.  A large counter is to the south where the keeper works and
    takes purchases and behind it you can see the huge ovens in which the bread is baked.  MMM Delicious. 
    The only exit is north onto the street.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    north:
      to: tba:274:room:27407

"tba:274:room:27435":
  name: Apothecary/Magic Shoppe
  description: >
    A foul stench waifs through the air as you step in and you try not to wrench onto the floor from
    the awful stench that you could smell outside.  It is an array of chaos in this store.  It has aisles
    upon aisels of potions of every sort and count, but they are all mixed up and out of order.  The only
    escape is the shop keeper who works behind her counter on the north wall, where her assistants work
    behind a cauldron that brew some sort of noxious potion.  They sell water here, and you wonder if it
    was could be tained from all the chemicals they used in these awful potions.  The only exit out of the
    smell is to the south onto the street.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:274:room:27406

"tba:274:room:27436":
  name: A Residence
  description: >
    The residences are simple shacks with a large cooking area on one end and a sleeping arragement of
    folding beds on the other, the shacks are dingy with dirt floors, and have a warm stone hearth in the
    center of it to heat it.  The only exit is north into the street.
  sector: inside
  exits:
    north:
      to: tba:274:room:27406

"tba:274:room:27437":
  name: Saint Brigid Training
  description: >
    The room is open and airy with racks, mats and practice dummys that indicate this area is for
    training for levels of all classes.  The room seems to have sparring areas, and a work out area with
    weights and you get the feeling that Ulysess is not here for his health.  The only exit is south into the
    street.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:274:room:27411

"tba:274:room:27438":
  name: Bottom of Belltower
  description: >
    Standing at the bottom of the narrow tower that makes up the belltower.  The only way is to the
    north to the main street or climbing the ladder to the top of the tower itself.
  sector: city
  exits:
    north:
      to: tba:274:room:27411
    up:
      to: tba:274:room:27441

"tba:274:room:27439":
  name: A Residence
  description: >
    The residences are simple shacks with a large cooking area on one end and a sleeping arragement of
    folding beds on the other, the shacks are dingy with dirt floors, and have a warm stone hearth in the
    center of it to heat it.  The onl exit is north onto the street.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:274:room:27412

"tba:274:room:27440":
  name: Saint Brigid General Store
  description: >
    The General Store is setup the same way as many of the other shops, in a neat and orderly fashion. 
    Rows of shelves house the equipment to be sold and a counter where purchases to be made is to the
    south.  A glass counter in the front of the store depict hot items for sale or newly arrived.  The only
    exit is south onto the street.
  sector: inside
  flags: [no_mob, indoors, peaceful]
  exits:
    south:
      to: tba:274:room:27412

"tba:274:room:27441":
  name: Top of Bell Tower
  description: >
    This is the top of the bell-tower.  You stand inside the large massive bell that now hangs here and
    covered by the roof over it which makes up the steeple of the tower.  The only way down is the
    ladder to the bottom.  From here is a pretty good view of everything around the village in the distance.
  sector: city
  flags: [dark, no_mob, indoors, soundproof, tunnel]
  exits:
    down:
      to: tba:274:room:27438

"tba:274:room:27442":
  name: Foyer to Brodericks Tavern
  description: >
    Inside the foyer to Broderick's place.  It has an archway to the west leading into the main hall
    where laughter and chatter echo loudly in the room.  There is a staircase here leading upward to the
    upper floor that is open and can look down over the main hall.  It is where the Hotel bedrooms and the
    working girls are located.  The exit to the street is to the east.  The foyer here is dity and dusty
    and barren of any furnishings because of the many fights that break out usually outside the Inn.  A
    dangerous place here.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    east:
      to: tba:274:room:27415
    west:
      to: tba:274:room:27458
    up:
      to: tba:274:room:27460

"tba:274:room:27443":
  name: A Residence
  description: >
    The residences are simple shacks with a large cooking area on one end and a sleeping arragement of
    folding beds on the other, the shacks are dingy with dirt floors, and have a warm stone hearth in the
    center of it to heat it.  The only exit is west to the main street.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:274:room:27415

"tba:274:room:27444":
  name: Francis' Blacksmith Shoppe/Forge
  description: >
    The forge area is very hot here, an array of vices, benches, tools, presses, andother tools that
    are setup throughout the whole room.  His main fire forge dominates the center of the room with a stack
