    huge wooden gate that is fortified with sentery posts on top and arrow slits on the sides of the
    gate, all built over the roaring Rhillion River that seems run from underground into the open air.  The
    street continues east through the gate to the east or west into the mountains.
  sector: mountains
  exits:
