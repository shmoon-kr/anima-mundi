  description: >
    As you step into the forest, the ominous silence echoes around you with the form of rustling in the
    undergrowth, birds chirping, and even the occasional snap of the twig.  The road snakes onward north
    and south it comes to a clearing among the forest to civilization in the form of Saint Brigid.
  sector: forest
  exits:
    south:
      to: tba:274:room:27420

