# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 274.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:274:room:27400":
  name: Inside Southern Gate
  description: >
    The Southern Gate is here, The road abruptly ends south, but begins north as it leads off into the
    village.  It is a street of dirt with a few stray cobbles, dating back when the Roman's conquered
    this land.  There are buildings on each side of the street.  A guard gate post is to the east here,
    where it is manned twenty-four by seven days a week.
  sector: city
  flags: [no_mob, peaceful]
  exits:
    north:
      to: tba:274:room:27403
    east:
      to: tba:274:room:27402
    south:
      to: tba:274:room:27422
      look: >
        The gate is forged of iron, and it has spikes on the outside ] making it formidable as it is
        attached to the six foot wall./fi
      door:
        keywords: [gate]
        kind: door
        reset: closed
  extras:
  - keywords: [credits]
    text: >
      This Zone was created by Brett Lynnes and Andy McLeod We're just some bored college students from
      Montana...  So you don't need to credit us for it. Besides, I sorta stole the idea off of a mud I
      played a while back. Smurfville is an anooying place with lots of do-gooder smurfs and (of course)
      Gargamel's castle.  ** added bonus- Barney's playland I made the entrance on wld ##00

"tba:274:room:27401":
  name: Inside Southern Gate
  description: >
    You stand in and at the main southern gate of Saint Brigid.  It is the southern most village and
    free town of the realm knwon as Adria.  The street is dirt here, mud when it rains, but it continues to
    the north deeper into the small village.  To the east is a guard gate here and south is the gate
    itself that leaves this place.
  sector: city
  exits:
    east:
      to: tba:274:room:27402

"tba:274:room:27402":
  name: Inside Guard Gate
  description: >
    The inside of the guard gate is empty, except for a desk, a lantern or two to light it at night and
    a chair.  There is a small cot in the corner for the guard to sleep, usually this is a two man job
    to guard the gates here.
  sector: inside
  flags: [indoors, tunnel]
  exits:
    west:
      to: tba:274:room:27400

