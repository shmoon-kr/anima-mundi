  name: Outside Southern Gate
  description: >
    You stand on the southern road outside the south gate of Saint Brigid.  It is the farmlands here on
    this side with rich fertile land and ripe crops that grow abundantly here.  The road continues off
    between the many crops that are growing here as far as the eye can see until it reaches forest far in
    the distance.
  sector: city
