"tba:309:obj:30910":
  type: other
  keywords: [paper, wadded, piece]
  short: a wadded up piece of paper
  long: A wadded up piece of paper lies on the ground.
  flags: [hum]
  wear: [take, hold]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 10
  rent: 0
  level: 25
  affects:
  - apply: con
    modifier: 3
  - apply: wis
    modifier: 1
  extras:
  - keywords: [paper]
    text:
    - To you my love, my dear Landestine -
    - >
      I have written you this very same letter a thousand times, rewriting and throwing away the same
      words time after time. I do not know why I find myself always writing the same thing over and over,
      knowing that our love is as futile as the attempted peace talks which go on between the Barons.
    - >
      I know that you have your realm and your people to consider, and I realize who I am - naught but a
      lowly servant, and an old one now - but even so, I cannot stop the hunger for your touch which still
      burns as strong as it did so many years ago.
    - >
      One day, when all is settled and no one can get hurt anymore, our love will have its chance and you
      and I will live in blissful peace. I know it in my heart.
    - Yours -
    - Gilsby

