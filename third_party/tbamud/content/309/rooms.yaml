"tba:309:room:30987":
  name: South Stables
  description: >
    This is the stables where the more difficult steeds are kept until broken. The steeds which are
    kept in this stable are considered to be of the finest quality, but have the worst attitude of the
    steeds that Westlawn owns, and so are separated from the general population.  The noise in here is
    tremendous, as are the steeds which stand proudly behind the stall doors.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30975
      door:
        keywords: [door]
        kind: door
