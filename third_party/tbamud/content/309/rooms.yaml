"tba:309:room:30971":
  name: Training Fields
  description: >
    This area is used as a dual-purpose spot where the soldiers of the Baron's army are trained in the
    arts of battle and as a place where the legendary steeds raised by the Baron are trained and tamed. 
    A stable lies to the north of you, the entrance a bit to the west.  To the far east is another field
    where more horses can be seen grazing and idling.
  sector: inside
  exits:
    east:
      to: tba:309:room:30972
    south:
      to: tba:309:room:30974
    west:
      to: tba:309:room:30970

"tba:309:room:30972":
  name: Training Fields
  description: >
    This is the training field for the troops and mounts of the army that Westlawn commands.  The fence
    which rings this place runs along north to south on your east side, another smaller fenced in area
    over there.
  sector: inside
  exits:
    south:
      to: tba:309:room:30973
    west:
      to: tba:309:room:30971

"tba:309:room:30973":
  name: Training Fields
  description: >
    At this east end of the training field, the fence block the way east.  A gate allows entry east
    into a larger, more open field that appears less used - or at least less trampled.  The keep entrance
    lies straight west.
  sector: inside
  exits:
    north:
      to: tba:309:room:30972
    east:
      to: tba:309:room:30980
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30977
    west:
      to: tba:309:room:30974

"tba:309:room:30974":
  name: Training Fields
  description: >
    You stand in the center of a fair-sized field used for the training of Westlawn's many steeds and
    the men who ride them.  The ground is quite trampled and free of grass for the most part, only patches
    of green can be seen here.
  sector: inside
  exits:
    north:
      to: tba:309:room:30971
    east:
      to: tba:309:room:30973
    south:
      to: tba:309:room:30976
    west:
      to: tba:309:room:30969

