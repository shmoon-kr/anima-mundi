# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 309.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:309:room:30900":
  name: Guard Post
  description: >
    The wooden barrier that bars progress south along the road to Westlawn's is not formidable enough
    to truly keep people off Westlawn's property.  Indeed - were it not for the guards which are stationed
    here, one could easily ride off the road and go around.
  sector: inside
  exits:
    south:
      to: tba:309:room:30901
  extras:
  - keywords: [credits]
    text: >
      Keep of Baron Westlawn by Kaan for Dibrova Level: 25-30 90 rooms 42 mobs 40 objs Connector zones:
      The King's Highway This is one of eight main baronies that lie within the open plains area that the
      King's Highway runs through. The main exports of this Baron's land are beer and horses. He is a warrior
      baron to the core, his soldiers finely tuned and he himself a fine warrior who could drink any man
      under the table.

"tba:309:room:30901":
  name: Road Through Westlawn's Fields
  description: >
    Tall, waving crops line both sides of the road, the main export of this area being grain, since it
    is so easy to grow.  Westlawn is a known brawler and tactician, farming is not exactly his strong
    point - the running part of his estate that he leaves to be tended by his servants.
  sector: inside
  exits:
    north:
      to: tba:309:room:30900
    south:
      to: tba:309:room:30902

"tba:309:room:30902":
  name: Road Through Westlawn's Fields
  description: >
    The road runs through the center of Westlawn's property which is mainly used for the growing of
    grains and barley.  Not only are these two crops easy to grow for a man who knows next to nothing about
    farming, but they are essential to two parts of Baron Westlawn's life that he does know quite a lot
    about - horses and drinking.  The King's Highway lies north of here, the way into Westlawn's estate
    lies south.
  sector: inside
  exits:
    north:
      to: tba:309:room:30901
    south:
      to: tba:309:room:30903

"tba:309:room:30903":
  name: Road Through Westlawn's Fields
  description: >
    Just to the south lies the area of Westlawn's property which he has given over to the servants he
    employs which work his fields.  They are the common folk of the area, the people who scratch a bare
    living from the coffers of the Baron, but are not in any way mistreated and of course may leave of
    their own volition at any time.  To the north is the main highway.
  sector: inside
  exits:
    north:
      to: tba:309:room:30902
    south:
      to: tba:309:room:30904

"tba:309:room:30904":
  name: A Muddy, Rutted Section of the Road
  description: >
    The homes of the many common folk who live here on Westlawn's estate lie to the west, their shoddy
    hovels and crude huts looking dirty and ill-kept.  The road also takes a turn for the worse at this
    point, the evidence of much traffic and little upkeep obvious due to the many potholes and ruts in
    it.  The road travels north and south.
  sector: inside
  exits:
    north:
      to: tba:309:room:30903
    south:
      to: tba:309:room:30905
    west:
      to: tba:309:room:30917

"tba:309:room:30905":
  name: Rutted Roadway
  description: >
    The road continues north and south, the ruts of wagons and horse hooves making it very bumpy and
    hard to travel.  The road is also perpetually wet from the slops and waste of the folk who live in the
    area on the west side of the road.  The road runs south toward a large barn or north toward the
    highway.
  sector: inside
  exits:
    north:
      to: tba:309:room:30904
    south:
      to: tba:309:room:30906
    west:
      to: tba:309:room:30918

"tba:309:room:30906":
  name: Muddy Roadway
  description: >
    The mud from the yards of the huts and shacks which lie west of here has spilled out into the
    roadway, making it very soft and hard to travel upon.  It does not appear that any effort is taken in the
    upkeep of the road or the hovels which lie to the west.  The road continues north and south.
  sector: inside
  exits:
    north:
      to: tba:309:room:30905
    south:
      to: tba:309:room:30907
    west:
      to: tba:309:room:30919

"tba:309:room:30907":
  name: Worn Roadway
  description: >
    The road continues past the homes of the less fortunate in this area, the hovels and shacks of the
    poor folk who work dawn until dusk to keep the crops plentiful.  To the south is a large red barn, is
    paint flaking away, the walls partially askew from poor craftsmanship.
  sector: inside
  exits:
    north:
      to: tba:309:room:30906
    south:
      to: tba:309:room:30908
    west:
      to: tba:309:room:30920

"tba:309:room:30908":
  name: Worn Roadway
  description: >
    It seems that you stand in the middle of 'town'.  On the east side of the road is a shoddy
    building, its walls made from scrap wood, the windows paneless and barely square by any means.  Continuous
    sound comes from the inside of the building, though, suggesting it to be an inn or tavern for the
    locals.  On the west side are more of the homes of the commoners and to the south the road bends to the
    east.
  sector: inside
  exits:
    north:
      to: tba:309:room:30907
    east:
      to: tba:309:room:30916
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30909
    west:
      to: tba:309:room:30921

"tba:309:room:30909":
  name: Muddy Bend
  description: >
    The road bends to the east around the inn to the northeast and the barn to the south.  Entrance
    into the barn lies just to the south, the large front door slightly crooked on its slider.  To the west
    is a fenced in pasture where a few sickly-looking cows wander about.
  sector: inside
  exits:
    north:
      to: tba:309:room:30908
    east:
      to: tba:309:room:30910
    south:
      to: tba:309:room:30927

"tba:309:room:30910":
  name: Twisting Road
  description: >
    The road angles west and south through the Baron's estate, the keep now visible to the southeast. 
    To the west is the place of the common folk, where they live and work.  There is a rackety wooden
    door in the wall of the inn on the north side of the road.
  sector: inside
  exits:
    north:
      to: tba:309:room:30916
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30911
    west:
      to: tba:309:room:30909

"tba:309:room:30911":
  name: Twisting Road
  description: >
    The road twists and turns through the land which is owned by Baron Westlawn. Exits lie to the north
    and east.  To the east, the road runs over a bridge which spans a small river.
  sector: inside
  exits:
    north:
      to: tba:309:room:30910
    east:
      to: tba:309:room:30912

"tba:309:room:30912":
  name: Rickety Bridge
  description: >
    The bridge which crosses the water below is certainly wide enough to accomodate heavy traffic, but
    whether or not it could hold the heavy traffic which might cross over it is another story.  It groans
    and creaks with your crossing, slightly shaking as you move about on it.  The road bends to the
    south and west.
  sector: inside
  exits:
    south:
      to: tba:309:room:30913
    west:
      to: tba:309:room:30911

"tba:309:room:30913":
  name: Muddy Road Before the Keep
  description: >
    The keep of Baron Westlawn lies to the east, a crudely imposing structure which does not appear to
    be in any sort of disrepair but is certainly not pleasing to the eye.  It is one of those great
    examples of function over form. To the north is a bridge and the road which leads back to the main highway.
  sector: inside
  exits:
    north:
      to: tba:309:room:30912
    east:
      to: tba:309:room:30914

"tba:309:room:30914":
  name: Before the Keep
  description: >
    The tall, wood-timbered walls which surround the keep look extremely strong and rough.  The entire
    feel to this place is one of raw strength, of bold valor. Quite fitting for the home of the warrior
    Baron.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:309:room:30915
    west:
      to: tba:309:room:30913

"tba:309:room:30915":
  name: Inner Yard
  description: >
    People move and bustle all about this place in a general buzz of activity. Westlawn must not be
    much of a fan of lazy or slow movers because no one looks as if they are taking their time, but walking
    about with a steady stride, with purpose.  This inner yard is completely walled in, the only doors
    are the one which lies just to the west, the exit, and one other which is built into the eastern wall a
    short distance away.
  sector: inside
  exits:
    north:
      to: tba:309:room:30931
    east:
      to: tba:309:room:30933
    south:
      to: tba:309:room:30934
    west:
      to: tba:309:room:30914

"tba:309:room:30916":
  name: The Fireside Inn
  description: >
    This is one of the most nasty smelling inns you ever have had occasion to visit.  There is a layer
    of grime, mud and grease on the floor which makes footing relatively dangerous and a coating of dirt
    on every table.  A bar lies on the east wall, behind which a man in a grubby smock serves drinks and
    food.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:309:room:30910
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:309:room:30908
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30917":
  name: Mud Yard
  description: >
    The entire row of homes which lie here and to the south are fronted by a muddy, sludged-out yard
    where the children can play.  Most of the time for these folk is spent harvesting or doing the general
    labor of the fields, however there are some days when Westlawn declares a free day and then the fun
    begins.  This small area - this place of mud and grime - is where that fun is had.
  sector: inside
  exits:
    east:
      to: tba:309:room:30904
    south:
      to: tba:309:room:30918
    west:
      to: tba:309:room:30922
      door:
        keywords: [door]
        kind: door
        reset: closed

