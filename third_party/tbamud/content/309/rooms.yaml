    nothing more than narrow wooden planking hammered down on top of the thick timbers which are the walls
    of the keep.
  sector: inside
  exits:
    north:
      to: tba:309:room:30965
    west:
      to: tba:309:room:30967

"tba:309:room:30967":
  name: On the Battlements
  description: >
    Just to the west is a guard's post where there is always someone on duty. To the east is the long
    wooden walkway which spans the upper level of the keep.
  sector: inside
  exits:
    east:
      to: tba:309:room:30966
    west:
      to: tba:309:room:30968

"tba:309:room:30968":
  name: At a Guard Post on the Battlements
  description: >
    This is nothing more than a cleared space of about four foot by four foot which affords a generous
    view of the lands in every direction.  A huge gong has been hung on the south wall of the place, to
    be rung in times of danger so that the population of the keep may know to mobilize.
  sector: inside
  exits:
    east:
      to: tba:309:room:30967

"tba:309:room:30969":
  name: Training Fields
  description: >
    This area is used as a dual-purpose spot where the soldiers of the Baron's army are trained in the
    arts of battle and as a place where the legendary steeds raised by the Baron are trained and tamed. 
    The entire place is ringed by a clean white-painted fence, stables lie on the north and south sides
    of the field, another field lies to the east.
  sector: inside
  exits:
    north:
      to: tba:309:room:30970
    east:
      to: tba:309:room:30974
    south:
      to: tba:309:room:30975
    west:
      to: tba:309:room:30954
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30970":
  name: Training Fields
  description: >
    This area is used as a dual-purpose spot where the soldiers of the Baron's army are trained in the
    arts of battle and as a place where the legendary steeds raised by the Baron are trained and tamed. 
    To the north is the entrance into one of the Baron's stables, the field lies wide open to the east
    and south.
  sector: inside
  exits:
    north:
      to: tba:309:room:30984
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:309:room:30971
    south:
