"tba:309:room:30948":
  name: The Head of the Table
  description: >
    This is the Baron's spot at the table.  He had it purposely designed that he could make a grand
    entrance to his seat of honor on a nightly basis, walking slowly and deliberately past all who would
    dine at his table.  His chair is, of course, slightly raised from the rest of the chairs at the table -
    not that he needs the height.  Rumor has it, the baron is close to seven feet in height.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30947

"tba:309:room:30949":
  name: The Kitchen
  description: >
    This huge room is in a perpetual state of panic, what with the known appetite of Baron Westlawn and
    all.  There are three separate brick ovens which are always lit and running, always cooking
    something at all times - even in the dead of night.  Cooks run here and there, constantly making sure that
    nothing burns and nothing spoils.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:309:room:30944
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30950":
  name: Soldier's Barracks
  description: >
    All of the single men who are part of the Baron's barbaric fighting force are given quarters in
    this large room.  There are bunks lined in straight, perfect rows, all of them clean and crisp.  The
    baron always makes it a point to stop into this room at least once a day so that he might make sure that
    no soldier of his lives like a pig.  There are severe penalties for slovenly behavior.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30943
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:309:room:30951

