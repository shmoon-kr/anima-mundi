"tba:309:room:30978":
  name: Outpasture
  description: >
    Most of Westlawn's steeds are kept here for the length of their stay on his estates.  It is a vast
    field, lush with thick grass, and well-tended by Westlawn's servants so that the steeds never run
    short on food.  The keep lies to the west, through another field.  To the east is the long, open fields
    which Westlawn farms to keep his estate financially sound.  Beyond those fields are the tall, dark
    trees of the Kailaani Forest - the place from where they say no man ever returns.
  sector: inside
  exits:
    east:
      to: tba:309:room:30979
    south:
      to: tba:309:room:30980

