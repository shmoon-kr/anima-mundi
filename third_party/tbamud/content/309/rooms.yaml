"tba:309:room:30961":
  name: Watch Post on the Battlements
  description: >
    A spot for a sentry to view the land of the Baron has been made upon these upper rampartes, a great
    line of visibility in every direction.  A large gong has been placed here to be sounded during times
    when enemies are spotted.
  sector: inside
  exits:
    east:
      to: tba:309:room:30962

"tba:309:room:30962":
  name: On the Battlements
  description: >
    You stand atop the thick wooden wall of the keep, high above the ground.  A guard post lies just
    west of here, the battelments allow access to the east and west.
  sector: inside
  exits:
    east:
      to: tba:309:room:30963
    west:
      to: tba:309:room:30961

"tba:309:room:30963":
  name: On the Battlements
  description: >
    Paths along the top of the wall of the keep lie to the west and south from here.  They are really
    nothing more than narrow wooden planking hammered down on top of the thick timbers which are the walls
    of the keep.
  sector: inside
  exits:
    south:
      to: tba:309:room:30964
    west:
      to: tba:309:room:30962
    down:
      to: tba:309:room:30944
      door:
        keywords: [door]
        kind: door
        reset: closed

