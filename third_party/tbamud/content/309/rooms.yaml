  name: Training Fields
  description: >
    You stand in a fair-sized field used for the training of Westlawn's many steeds and the men who
    ride them.  The ground is quite trampled and free of grass for the most part, only patches of green can
    be seen here.  The door to one of Westlawn's stables lies to the south.
  sector: inside
  exits:
    north:
