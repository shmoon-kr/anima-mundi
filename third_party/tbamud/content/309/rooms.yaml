"tba:309:room:30953":
  name: Arms Cache and Smithy
  description: >
    Donld works tirelessly, day after day making sure that all existing weapons and armor are kept in
    perfect condition.  On top of that chore, he crafts all metal-work within the keep, shoes horses and
    new weapons for the Baron to test out.  Donld is not Westlawn's right-hand man but he is damn near
    close.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:309:room:30943
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30954":
  name: Outer Antechamber
  description: >
    Strange that guards would be posted here, already within the keep and at a place which a person
    must already have made through all others in the keep. The general's horses are a matter of pride for
    him, such strong pride that he guards them jealously from intruders.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30969
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:309:room:30940
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30955":
  name: Cellar
  description: >
    All manner of dry storage is kept deep within the lower reaches of the Baron's keep.  The ground
    down here is damp and earthy, the smell of the entire place musty and raw.  There is not much light
    except that which you may have brought with you.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:309:room:30956
    west:
      to: tba:309:room:30960
    up:
      to: tba:309:room:30943
      door:
        keywords: [door]
        kind: door
