"tba:309:room:30921":
  name: Mud Yard
  description: >
    The entire row of homes which lie here and to the south are fronted by a muddy, sludged-out yard
    where the children can play.  Most of the time for these folk is spent harvesting or doing the general
    labor of the fields, however there are some days when Westlawn declares a free day and then the fun
    begins.  This small area - this place of mud and grime - is where that fun is had.  A fenced-in area
    to the south is where the cows are kept.  They provide the milk not only for the keep, but for these
    folk as well.
  sector: inside
  exits:
    north:
      to: tba:309:room:30920
    east:
      to: tba:309:room:30908
    west:
      to: tba:309:room:30926

"tba:309:room:30922":
  name: Hovel
  description: >
    This small, one room home holds all that a family might own within.  The floors are of wood
    planking, rough hewn and full of potential splinters and covered in the mud that gets tracked in from the
    yard outside.  A small table is pushed against the far wall, rows of low cots line the floors along the
    opposite wall.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30917
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30923":
  name: Hut
  description: >
    The walls of this crude shelter are made from the leftovers of the crops which are grown about the
    area.  There is not much in the way of woodlands, as most the wooded areas have been cut down to
    provide more room for growing crops for the Barons.  Gaps in the walls and ceiling make it only slightly
    better than being outside - a steady breeze flows through.
  sector: inside
  exits:
    east:
      to: tba:309:room:30918

"tba:309:room:30924":
  name: Shack
  description: >
    This small wooden home is actually considered to be of high standards for this area.  The walls are
    all quite solid and without gaps, the flooring is smooth and covered in wood.  There are even
    sections where private areas can be had by the people who live here.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30919
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30925":
  name: Canvas and Straw Hut
  description: >
    This is almost more of tepee than a hut at all, but it does serve its purpose quite well.  The
    walls are all covered in thick canvas which holds out against wind and rain and provides adequate cover
    for privacy.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30920

"tba:309:room:30926":
  name: Hovel
  description: >
    This is the home of all the men of the area with no families who have no other place to go.  There
    are no beds, just open floor space.  The only piece of furniture in the room is a low table which may
    be used by sitting on the floor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30921

"tba:309:room:30927":
  name: Barn
  description: >
    The musty smell of the place assaults your nostrils immediately upon entry, the old, open smell of
    a barn so distinct as to be a scent all its own. Harnesses and tools for harvesting lie about the
    place, all in surprising order. The main exit lies to the north, a wide set of double doors open to the
    west.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30909
    west:
      to: tba:309:room:30928

"tba:309:room:30928":
  name: Hay Barn
  description: >
    Piles of tight bales lie in neat stacks all about this section of the barn. A door leads east into
    the main section of the barn, another leading north out into the cow pasture.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:309:room:30929
    east:
      to: tba:309:room:30927

"tba:309:room:30929":
  name: Cow Pasture
  description: >
    This is a small area where the few cows that are used specifically for milking are kept.  It would
    be a good idea to watch your step here, as there are quite a few small greenish-brown piles laying
    about.  To the east of this pasture is the roadway, a fence blocking the way onto the road and to the
    north is the common folks' area where their homes and muddy yards lay.
  sector: inside
  exits:
    south:
      to: tba:309:room:30928
    west:
      to: tba:309:room:30930

"tba:309:room:30930":
  name: Cow Pasture
  description: >
    This is a small area where the few cows that are used specifically for milking are kept.  It would
    be a good idea to watch your step here, as there are quite a few small greenish-brown piles laying
    about.  To the east of this pasture is the roadway, a fence blocking the way onto the road and to the
    north is the common folks' area where their homes and muddy yards lay.
  sector: inside
  exits:
    east:
      to: tba:309:room:30929

"tba:309:room:30931":
  name: Inner Yard
  description: >
    All manner of activities go on in this main outer section of the keep. Children play in the
    relative safety of the walls of the keep, men and women go about their business and the higher nobles of the
    area talk business amongst themselves in what they feel is a sort of seclusion in the southeast
    corner.
  sector: inside
  exits:
    east:
      to: tba:309:room:30932
    south:
      to: tba:309:room:30915

"tba:309:room:30932":
  name: Inner Yard
  description: >
    All manner of activities go on in this main outer section of the keep, the place where most of
    those who live within these walls come to stretch out or take a break.  Most of the comings and goings
    within the keep require travel through this section, so traffic is usually quite brisk.
  sector: inside
  exits:
    east:
      to: tba:309:room:30936
    south:
      to: tba:309:room:30933
    west:
      to: tba:309:room:30931

"tba:309:room:30933":
  name: Inner Yard
  description: >
    The Baron's people hustle about you, doing their daily tasks or enjoying some spare time in the
    outdoors.  Exits from the yard lie directly east and directly west from where you stand.
  sector: inside
  exits:
    north:
      to: tba:309:room:30932
    east:
      to: tba:309:room:30937
    south:
      to: tba:309:room:30935
    west:
      to: tba:309:room:30915

"tba:309:room:30934":
  name: Inner Yard
  description: >
    The rough wooden outer wall of the keep runs along the west side of the courtyard and meets with a
    very solid and well-constructed wall of stone and mortar on the south side.  There is no door in the
    wall, but it is obvious that beyond that mortar wall lies the innards of the keep.
  sector: inside
  exits:
    north:
      to: tba:309:room:30915
    east:
      to: tba:309:room:30935

"tba:309:room:30935":
  name: Inner Yard
  description: >
    The entire inner yard is surrounded by the walls of the keep, a protective barrier against
    marauders and the possibility that another baron might try to attack Westlawn to gain control of his land and
    holdings.  This yard is where all the people who live on Westlawn's land come in times of strife or
    bad weather, to stay together in number and relative safety.
  sector: inside
  exits:
    north:
      to: tba:309:room:30933
    east:
      to: tba:309:room:30938
    west:
      to: tba:309:room:30934

"tba:309:room:30936":
  name: Inner Yard
  description: >
    The entire inner yard is surrounded by the walls of the keep, a protective barrier against
    marauders and the possibility that another baron might try to attack Westlawn to gain control of his land and
    holdings.  This yard is where all the people who live on Westlawn's land come in times of strife or
    bad weather, to stay together in number and relative safety.
  sector: inside
  exits:
    south:
      to: tba:309:room:30937
    west:
      to: tba:309:room:30932

"tba:309:room:30937":
  name: Inner Yard
  description: >
    A set of double doors lead east into the main section of the keep, the only doors which allow
    access as far you can see from looking around at the walls of this yard.  The exit to the keep lies
    directly west, a short walk across the yard from you.
  sector: inside
  exits:
    north:
      to: tba:309:room:30936
    east:
      to: tba:309:room:30939
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30938
    west:
      to: tba:309:room:30933

"tba:309:room:30938":
  name: Inner Yard
  description: >
    This is the southeastern corner of the yard, where most of major business deals are made by the
    local nobles of the area.  It is said that any word uttered within the confines of the inner keep can be
    and are heard by Westlawn, so most of the bargains which are made are done outdoors in this very
    area.
  sector: inside
  exits:
    north:
      to: tba:309:room:30937
    west:
      to: tba:309:room:30935

"tba:309:room:30939":
  name: Wide Hallway
  description: >
    The hallway is a high, arched affair made from stone and mortar.  It rises at least fifteen feet at
    its highest point, twelve at the lowest along the walls. The floor is dented and gouged from the
    tread of many hooves upon it - it seems that the Baron has no qualms about leading his fine steeds
    through this section of his home.  The hall meets with another hall just to the east, the courtyard lies
    to the west through a set of heavy double doors.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30940
    west:
      to: tba:309:room:30937
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30940":
  name: The Main Hall
  description: >
    This is a wide, clean area of the keep which runs north to south through the largest section of the
    keep.  A door lies to the east, leading into the Baron's stable area.  A hall lies to the west
    leading toward the courtyard.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30941
    east:
      to: tba:309:room:30954
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30942
    west:
      to: tba:309:room:30939

"tba:309:room:30941":
  name: The Main Hall
  description: >
    The hall runs north to south past doors in the center and in the north and south ends.  At either
    end of the hall, it curves westward, out of sight.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30944
    south:
      to: tba:309:room:30940

"tba:309:room:30942":
  name: The Main Hall
  description: >
    The hall runs north to south past doors in the center and in the north and south ends.  At either
    end of the hall, it curves westward, out of sight.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30940
    south:
      to: tba:309:room:30943

"tba:309:room:30943":
  name: South End of the Main Hall
  description: >
    There are thick wooden doors set into the east and south walls, doors bound by lengths of iron
    which look as strong as any piece of rough iron.  On the western wall is another wooden door, hoever it
    does not appear to hold behind it anything of true worth, as it is not as thick and strong-looking as
    the other two doors.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:309:room:30942
    east:
      to: tba:309:room:30953
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:309:room:30950
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:309:room:30955
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30944":
  name: Entrance into the Dining Hall
  description: >
    Just west of here is the start of an enormous feastng hall, or more aptly what would be called a
    mess hall in this place.  A thick, wooden table runs the entire length of the hall, one which could
    easily seat a score and a half of men at dinner and then some.  There are nightly feasts here at this
    table, feasts that everyone in the keep is invited to and usually attend.  Much revelry, singing and
    baudy jokes are told throughout the evenings - a favorite past time of the Baron's.  On the east wall
    is the door into the kitchen, where wonderful smells emanate all day long - there is always something
    cooking in this place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30949
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:309:room:30941
    west:
      to: tba:309:room:30945
    up:
      to: tba:309:room:30963
      door:
        keywords: [door]
        kind: door
        reset: closed

