"tba:309:room:30984":
  name: North Stables
  description: >
    The most valuable steeds are kept here, the ones which have been trained, broken and are ready for
    either battle or market.  The Baron keeps all of his steeds in perfect health, all of them ready to
    be either sold to highest bidder or rode into battle at a moment's notice.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30985
    south:
      to: tba:309:room:30970
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:309:room:30985":
  name: North Stables
  description: >
    Stalls line the walls on both the north and south walls, horses tethered within.  Sacks of grain
    and brushes for combing lie on the ground in neat piles just outside the doors - all of which are used
    daily.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:309:room:30986
    west:
      to: tba:309:room:30984

