      to: tba:254:room:25446
    south:
      to: tba:254:room:25444
    west:
      to: tba:254:room:25436

"tba:254:room:25446":
  name: A Dusty Trail
  description: >
    The trail leads north and south from here.  North you see what appear the main buildings for this
    village, possibly even Mordecai's place of dwelling. South of you are the many huts and tents which
    serve as homes for Mordecai's people.
  sector: field
  exits:
    north:
      to: tba:254:room:25447
    east:
      to: tba:254:room:25437
    south:
      to: tba:254:room:25445
    west:
      to: tba:254:room:25439

"tba:254:room:25447":
  name: A Dusty Trail
  description: >
    Here you stand at the top of a large sloping hill, which slopes downward to the east.  It appears
    as if a temple or place of worship has been erected there, you may enter it to the east.  North of you
    are the main buildings for Mordecai, south are the many huts and tents of the village people.
  sector: field
  exits:
    north:
      to: tba:254:room:25448
    east:
      to: tba:254:room:25449
    south:
      to: tba:254:room:25446

"tba:254:room:25448":
  name: The End of the Road
  description: >
    Directly north of you looms Mordecai's home, a tall stone structure with a sloping peaked roof.  It
    appears that he fears none of his people, for the door to his home is wide open.  To the east you
    see another stone house, this one a bit smaller than Mordecai's, and west of you is yet another stone
    house.
  sector: field
  exits:
    north:
      to: tba:254:room:25452
    east:
      to: tba:254:room:25450
    south:
      to: tba:254:room:25447
    west:
      to: tba:254:room:25451

"tba:254:room:25449":
  name: Outdoor Temple
  description: >
    This small basin, set in an almost tranquil setting, has been fashioned into a place of worship by
    the people of the village.  Wooden benches serving as pughs have been set into side of the hill.  At
    the bottom of the basin, a stage with a podium has been erected, obviously for Mordecai and his
    sermons.
  sector: forest
  exits:
    west:
      to: tba:254:room:25447

"tba:254:room:25450":
  name: Lieutenant Caspan's Home
  description: >
    Lieutenant Caspan, Mordecai's most trusted advisor and soldier, has been granted this home in
    recognition of his extreme loyalty, and he doesn't appear at all pleased to see that you have invaded his
    sanctuary.
  sector: city
  exits:
    west:
      to: tba:254:room:25448

"tba:254:room:25451":
  name: The Wives
  description: >
    The interior of this home smells of both stale perfume and rotten fish. Mordecai keeps his
    favorites for the month in this home, in apparent 'luxury', treating them well for the services they render. 
    Heaps of stained bedding lie in disarray all over the floor.  Pillows, torn and in some places,
    bloodstained, lie in heaped in different corners.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:254:room:25448

"tba:254:room:25452":
  name: Mordecai's Home
  description: >
    This is the home of the Great Mordecai?  One cot, one wash basin (dry and apparently unused for the
    most part), and a wardrobe on the east wall are all that occupy this place.  One would think a man
    of Mordecai's stature would have just a bit more in the way of luxuries.
  sector: inside
  exits:
    east:
      to: tba:254:room:25454
      door:
        keywords: [wardrobe]
        kind: pickproof
        reset: locked
    south:
      to: tba:254:room:25448

"tba:254:room:25453":
  name: Penelope's Cell
