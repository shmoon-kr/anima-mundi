"tba:254:room:25442":
  name: The Trail Out of Town
  description: >
    This trail leads south into the wilderness, even now the way becomes a bit more choked with trees. 
    To the north you see the main part of the village.
  sector: city
  exits:
    north:
      to: tba:254:room:25441
    east:
      to: tba:254:room:25438
    south:
      to: tba:254:room:25443

"tba:254:room:25443":
  name: The Trail Out of Town
  description: >
    You are now at the outskirts of the village.  You may leave it to the south or go back into the
    main section to the north.
  sector: forest
  exits:
    north:
      to: tba:254:room:25442

"tba:254:room:25444":
  name: A Dusty Trail
  description: >
    This trail north and south of you.  South it leads to the meeting of this trail and another running
    west.  To the north there are some tents and huts and farther north, upon a hill, you see a few more
    permanent looking structures.
  sector: city
  exits:
    north:
      to: tba:254:room:25445
    east:
      to: tba:254:room:25435
    south:
      to: tba:254:room:25432
    west:
      to: tba:254:room:25440

"tba:254:room:25445":
  name: A Dusty Trail
  description: The trail leads north to south, huts and tents spaced out at intervals.
  sector: field
  exits:
