      to: tba:254:room:25444
    south:
      to: tba:254:room:25441
    west:
      to: tba:254:room:25431

"tba:254:room:25433":
  name: Tent Dwelling
  description: >
    This tent, roughly 10x10, serves as the primary dwelling for one of the families under Mordecai's
    'care'.  Four cots sit side by side along one wall and a leather chest sits in a corner, holding what
    you assume would be all of their wordly belongings.
  sector: inside
  exits:
    east:
      to: tba:254:room:25441

