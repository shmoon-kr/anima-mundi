# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 62.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:62:room:6200":
  name: In The Forest
  description: >
    The trail ends here where the mountains begin abruptly. Looking up, you note that the climb would
    be rough, hazardous, and probably not worth the effort; the energy barrier continues up the mountain
    side out of sight.  The only exit is back to the east.
  sector: forest
  exits:
    east:
      to: tba:62:room:6201
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6201":
  name: In The Forest
  description: >
    To the west the mountains rise high up, rocky and lifeless.  The trail you are walking on heads
    west to the end of the forest, and back east.  Each way the strange energy barrier stands just to the
    north, inscrutable, magical, and impenetrable.
  sector: forest
  exits:
    east:
      to: tba:62:room:6202
    west:
      to: tba:62:room:6200
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6202":
  name: In The Forest
  description: >
    This trail runs parallel to the energy barrier to your north, seemingly all the way up to the
    mountains to the west that form the boundries of this valley.  Walking along, you scare a small squirrel,
    which leaps through the barrier without a second thought!  Your hand is still repulsed by the magical
    field, however.
  sector: forest
  exits:
    east:
      to: tba:62:room:6203
    west:
      to: tba:62:room:6201
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6203":
  name: In The Forest
  description: >
    The northern pathway stops abruptly here, halted by some sort of glowing energy barrier running
    through the woods.  A game trail, seemingly well traveled, runs east- west along the magical barrier's
    length.  Very strange.
  sector: forest
  exits:
    east:
      to: tba:62:room:6204
    south:
      to: tba:61:room:6139
    west:
      to: tba:62:room:6202
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6204":
  name: In The Forest
  description: >
    The energy barrier runs through the woods on its east- west course here, just north of the trail
    you are walking on.  A faint humming seems to eminate from the glowing field, pushing the normal sounds
    of the forest into the background.  For a short moment, you wonder if the field is keeping something
    in, or you out.  It makes you wonder...
  sector: forest
  exits:
    east:
      to: tba:62:room:6205
    west:
      to: tba:62:room:6203
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6205":
  name: In The Forest
  description: >
    The energy field makes a sudden ninety-degree turn here, running to the north and west out of sight
    through the thickening woods.  The trail you are on curves to skirt the edge of the magical barrier
    in either direction. Curious... who or what is keeping this field in place, and for what purpose?
  sector: forest
  exits:
    north:
      to: tba:62:room:6206
    west:
      to: tba:62:room:6204
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6206":
  name: In The Forest
  description: >
    The woods thicken here, and surpisingly, you see a tree completely cut in half by the magical
    barrier running north-south here.  The tree looks healthy and unaffected by the energy field passing right
    through its center. Odd...
  sector: forest
  exits:
    north:
      to: tba:62:room:6207
    south:
      to: tba:62:room:6205
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6207":
  name: In The Forest
  description: >
    The magical energy barrier runs straight north-south, unaffected by dips in the grounds,
    intervening rocks and trees, everything.  From the north, you hear a faint rushing noise above the humming of
    the field.  The trail you are on continues to the north and south, only a few feet away from the
    barrier it follows.
  sector: forest
  exits:
    north:
      to: tba:62:room:6208
    south:
      to: tba:62:room:6206
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6208":
  name: In The Forest
  description: >
    Here the field changes color, becoming almost transparent.  Beyond, you think you can make out a
    few shapes, but nothing too terribly distinct.  From the north comes the rushing sound of water, and
    through the trees you believe you can see a river cutting through the forest.  The trail you are on
    leads north-south through the woods, following the energy barrier all along its length.
  sector: forest
  exits:
    north:
      to: tba:62:room:6209
    south:
      to: tba:62:room:6207
    west:
      to: tba:62:room:6210
  extras:
  - keywords: [barrier, energy]
    text: >
      You can see a clearing beyond, the barrier not fully blocking out the area behind.  You think it
      might be possible to push your way through, if the damn thing doesn't kill you first.

"tba:62:room:6209":
  name: The River's Edge
  description:
  - >
    A river flows through the forest here, its water clean and clear.  The energy barrier runs right
    out into the middle of the river, and then makes another ninety-degree turn to the west.  The water
    seems to have no problem penetrating the magical field, however.
  - >
    The river seems too wide and too swift to cross here. It appears the only way to go is back to the
    south.
  sector: forest
  exits:
    south:
      to: tba:62:room:6208
  extras:
  - keywords: [barrier, energy]
    text: >
      You can faintly see the woods continue beyond it, but it seems there's no way through.  The field
      rises high up into the air, and seems to form a ceiling above the woods, preventing a flying
      entrance.  You'd also bet it extends deep into the ground.

"tba:62:room:6210":
  name: Just Passing Through...
  description: >
    The energy barrier seems to push against you ineffectively as you shove your way through it.  All
    your hairs stick up on your body from the static electricity, and electric shocks sting your body from
    every metallic piece of equipment you are carrying.  You think with a final shove, you can break
    through to the other side...
  sector: mountains
  flags: [no_mob]
  exits:
    east:
      to: tba:62:room:6208
    west:
      to: tba:62:room:6211

"tba:62:room:6211":
  name: By The Barrier
  description: >
    To the west the magical energy barrier crackles and hums to itself, almost looking harmless. 
    Almost -- all around on the ground are charred corpses and bodies. Several poles with skulls on top face
    to the west, warning travellers on the forest paths away from here.  The air smells of death and
    decay, and the air is very still.  You feel uncomfortable.
  sector: forest
  flags: [no_mob]
  exits:
    east:
      to: tba:62:room:6210
    west:
      to: tba:62:room:6212
  extras:
  - keywords: [corpse, body, bodies, corpses, skull, skulls]
    text: >
      Demi-human, from the size.  The foreheads slop down to a blocky brow, and the braincase seems
      rather small.  On a hunch, you check one of the feet of a torched body.  Cloven, like a pig's...  Orcs.

"tba:62:room:6212":
  name: A Clearing In The Forest
  description:
  - >
    Several trails in the forest intersect here in a small clearing.  The dirt seems matted down, and
    you see many footprints in the soil.   Nearby you hear a bird's chirp abruptly cut off in a loud
    squawk, and then silence.  The paths seem well-traveled, the undergrowth matted down and the foliage
    hacked away to leave plenty of room or a traveller to pass in every cardinal direction, excepting the west
    path seems fairly overgrown...
  - You feel watched.
  sector: forest
  exits:
    north:
      to: tba:62:room:6213
    east:
      to: tba:62:room:6211
    south:
      to: tba:62:room:6217
    west:
      to: tba:62:room:6228
  extras:
  - keywords: [foot, footprint, footprints, print, prints]
    text: Cloven hoofs, two feet...  They walk erect whatever they are.

"tba:62:room:6213":
  name: A Forest Trail
  description: >
    The northern trail winds through the trees, heading from a forest clearings to the south to where
    there appears to be a river's edge to the north.  This trail appears to be well-used and you spot many
    tracks in the earth.  Again the hairs on the back of your neck stand up, and you wonder if you're
    being spied upon.
  sector: forest
  exits:
    north:
      to: tba:62:room:6214
    south:
      to: tba:62:room:6212

"tba:62:room:6214":
  name: The River's Edge
  description: >
    A beautiful river flows swiftly by, the current looking quite dangerous in fact.  Out in the center
    of the river you spot the energy barrier enclosure... no way out here. Looking up, you see a bird
    fly right through the barrier overhead and wonder as to the force field's nature.  This path leads
    south into the forest, and westwards along the river's edge.
  sector: field
  exits:
    south:
      to: tba:62:room:6213
    west:
      to: tba:62:room:6215

"tba:62:room:6215":
  name: The River's Edge
  description: >
    The river flows on its course, unhampered by the energy barrier passing right down its center for
    as far as you can see in both directions.  The path you are on travels along the length of the river
    to the east and west in between the water and the forest's edge.  Once again you shiver and feel that
    unmistakeable sense that you are being watched.  Disturbing.
  sector: field
  exits:
    east:
      to: tba:62:room:6214
    west:
      to: tba:62:room:6216

"tba:62:room:6216":
  name: The River's Edge
  description: >
    A large out-cropping of rock blocks this path along the river to the west, and you don't spot any
    way around it; the woods are too thick to the south, the river too swift to the north, the magical
    barrier above you.  This is a nice area, however, as evidenced by the amount of traffic this path gets. 
    From the marks in the grass, you guess that this is a favored resting spot.
  sector: field
  exits:
    east:
      to: tba:62:room:6215

"tba:62:room:6217":
  name: A Forest Trail
  description:
  - >
    This well-used forest trail leads south.  Among the foot-tracks in the dirt, you spot a few animal
    tracks as well, leading you to believe that these trails are used by hunters.  Why would they be
    enclosed in this manner, however?
  - There is a clearing to the north, and the path continues to the south.
  sector: forest
  exits:
    north:
      to: tba:62:room:6212
    south:
      to: tba:62:room:6219

"tba:62:room:6218":
  name: A Forest Trail
  description:
  - >
    This trail leads north-south... obviously a gaming trail.  The woods, mostly deciduous trees with
    the accompanying ground foliage, crowd in to either side. A shrub to your left shows a fresh cutting
    wound... looks like a sharp object like a knife or machete did the damage.
  - >
    A crackle in the leaves spins you around, to see nothing.  Something is watching you, you feel it.
    Where?
  sector: forest
  exits:
    north:
      to: tba:62:room:6233
    south:
      to: tba:62:room:6226

"tba:62:room:6219":
  name: A Forest Trail
  description: >
    The trail changes direction here, turning to the north and west.  A large tree to your south bears
    an interesting artifact; a rusty arrowhead embedded in the wood.  It looks as if the arrow had been 
    broken off at the head, the wood scratched at, and the arrowhead left behind. Otherwise, there
    doesn't seem to be much of interest in this particular section of the woods.
  sector: forest
  exits:
    north:
      to: tba:62:room:6217
    west:
      to: tba:62:room:6220

"tba:62:room:6220":
  name: A Forest Trail
  description:
  - >
    This is a winding east-west path through the thickening forest.  The grass along the path is matted
    down from frequent traffic.  The path continues to the east, and there seems to be a small clearing
    to the west.
  - >
    A faint noise makes you stand stock still.  You could have sworn you heard a voice nearby. 
    Whatever it was, it wasn't speaking common.
  sector: forest
  exits:
    east:
      to: tba:62:room:6219
    west:
      to: tba:62:room:6221

"tba:62:room:6221":
  name: A Small Clearing
  description: >
    In the middle of this small clearing in the forest is a fairly large rock sticking up out of the
    ground.  Paths lead away to the east, west, and south from here.  The trees above block out the sky
    fairly effectively, also blotting out the glowing energy barrier above your head.
  sector: forest
  exits:
    east:
      to: tba:62:room:6220
    south:
      to: tba:62:room:6222
    west:
      to: tba:62:room:6227
  extras:
  - keywords: [rock, boulder]
    text: There is dried blood on it.

"tba:62:room:6222":
  name: A Forest Trail
  description: >
    A smaller northern path leads away from the main east- west trail here towards a clearing.  The
    main path leads windingly around the trees to the east and west, the woods blocking out whatever may be
    ahead.  Again you get that strange feeling of being watched.
  sector: forest
  exits:
    north:
      to: tba:62:room:6221
    east:
      to: tba:62:room:6223
    west:
      to: tba:62:room:6225

"tba:62:room:6223":
  name: A Forest Trail
  description: >
    The trail leads east and west here through the forest.  To the west you spot an area where a
    smaller path breaks off from the main track.  Eastwards seems to be another small clearing that seems to be
    well used; there are many tracks leading in that direction.
  sector: forest
  exits:
    east:
      to: tba:62:room:6224
    west:
      to: tba:62:room:6222

"tba:62:room:6224":
  name: The Dead End
  description: >
    The ground has been cleared of vegetation in this small clearing, and several large, man-made salt
    licks lie on the ground and stand on poles here.  There are many animal tracks in the earth -- the
    salt licks must attract wildlife for miles around.  You think this would be a good place to hide and
    wait for dinner if you were a hunter...
  sector: forest
  exits:
    west:
      to: tba:62:room:6223

"tba:62:room:6225":
  name: A Forest Trail
  description: >
    This trail leads east-west through the forest foliage, around the trees and up and down the slight
    rises.  The area is quiet and serene, except for the energy barrier keeping you in to the south.  For
    just a moment, you wonder if you're still being watched...
  sector: forest
  exits:
    east:
      to: tba:62:room:6222
    west:
      to: tba:62:room:6226

"tba:62:room:6226":
  name: A Forest Trail
  description: >
    The trail bends here, leading away to the north and east.  Far off the the distance you hear the
    squawk of a large bird-of-prey searching the skies for a meal.  The ferns around you rustle gently in
    the light breeze. Somehow, the threatening aura that pervades over the rest of the area seems absent
    here.  You feel almost relaxed...
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:62:room:6218

"tba:62:room:6227":
  name: A Forest Trail
  description: >
    A bend in the forest trail allows you to go east and north here.  To the east you spot a small
    clearing, while northwards this trail seems to join a much larger one leading through the woods.  On the
    ground is half of a broken knife handle, made of bone and dried leather, useless now.  You wonder if
    the owner is watching you now -- something certainly is.
  sector: forest
  exits:
    north:
      to: tba:62:room:6232
    east:
      to: tba:62:room:6221

"tba:62:room:6228":
  name: A Forest Trail
  description: >
    This path leads from the main clearing to the west to intersect with a north-south path just to the
    east.  A small sapling on the north side of the trail has a rope tied around one of its top
    branches; an unused snare evidently.  You still feel as if you're being watched in the back of your mind, and
    adrenaline pumps into your brain like a lightning fuzz.
  sector: forest
  exits:
    east:
      to: tba:62:room:6212
    west:
      to: tba:62:room:6229

"tba:62:room:6229":
  name: A Forest Trail
  description: >
    A north-south trail leads through the woods here, with a small side trail leading off to the east. 
    The trees provide adequate cover from the sky, but through a few holes in the foliage you spot the
    magical barrier above you, keeping you from escaping by flight.  You feel slightly captured.
  sector: forest
  exits:
    east:
      to: tba:62:room:6228
    south:
      to: tba:62:room:6230

"tba:62:room:6230":
  name: A Forest Trail
  description: >
    Two trails come together here, a large northern path heading away from tracks leading to the east
    and west. The western path seems to be the most traveled, and the east hardly at all.  There seems to
    be less trees around here... it seems as if many have been cut down by some sort of crude tools. 
    This land clearing appears to be especially true to the east.
  sector: forest
  exits:
    north:
      to: tba:62:room:6229
    east:
      to: tba:62:room:6231
    west:
      to: tba:62:room:6232

"tba:62:room:6231":
  name: A Clearing
  description: >
    The trees have been cut down around here, and many of the trunks hollowed out with sharp stones and
    lined with treated leather to make almost-waterproof tubs.  A foul smelling brown fluid, tannin
    evidently, fills many of these, soaking into various bits and pieces of animal hides.  Crude, but
    workable.
  sector: forest
  exits:
    west:
      to: tba:62:room:6230

"tba:62:room:6232":
  name: A Forest Trail
  description: >
    The trail is widening to the west, where the path leads all the way up to the side of the mountains
    that enclose this valley.  Many of the trees have been cut down around here, and it definitely looks
    as if the forest is ending. Eastwards the trail leads on into the thick of the forest. A small split
    off trail leads away to the south here.
  sector: forest
  exits:
    east:
      to: tba:62:room:6230
    south:
      to: tba:62:room:6227
    west:
      to: tba:62:room:6233

"tba:62:room:6233":
  name: A Forest Trail
  description: >
    The ground is growing more rocky here.  The trees and other foliage in the forest grow sparse here,
    finding it hard to find purchase in the soil.   The forest ends just to the west, with the trail you
    are on leading right on up to the side of the mountains.  A side trail leads south here, and the
    trail also leads back into the thick of the forest to the east.
  sector: forest
  exits:
    east:
      to: tba:62:room:6232
    south:
      to: tba:62:room:6218
    west:
      to: tba:62:room:6234

"tba:62:room:6234":
  name: A Rocky Trail
  description: >
    The ground is getting very rocky here, causing the trees of the woods to become more sparse. 
    Several bushes have found purchase in the soil, but not near enough to block free movement in this area. 
    The trail leads on up to what appears to be a cave in the side of the mountain to the west, and a
    side trail runs along the forest's edge to the north.  To the east, the trail runs deep into the forest
    out of sight.
  sector: hills
  exits:
    north:
      to: tba:62:room:6241
    east:
      to: tba:62:room:6233
    west:
      to: tba:62:room:6242

"tba:62:room:6235":
  name: A Forest Trail
  description: >
    The trail you are on bends around a large double- trunked tree and leads away to the north and
    west.  The green canopy of leaves overhead make this area fairly dark and ominous, and that creepy
    'watched' feeling returns to hit you with full force.
  sector: forest
  exits:
    south:
      to: tba:62:room:6229
    west:
      to: tba:62:room:6236

"tba:62:room:6236":
  name: A Forest Trail
  description: >
    The trail continues here to the east and west, with a small trail splitting off towards a large
    clearing to the south.  Two wooden poles with skulls on top warn you away from the south, and succeed in
    making you feel quite uncomfortable.  Strange...
  sector: forest
  exits:
    east:
      to: tba:62:room:6235
    south:
      to: tba:62:room:6237
    west:
      to: tba:62:room:6238

"tba:62:room:6237":
  name: A Large Clearing
  description:
  - >
    The earth has been upturned many times here, and several white rocks stick up from the ground in
    odd positions.
  - Graveyard.
  - >
    This must be where they bury their dead -- just dig a hole and throw the corpse inside, ignoring
    any previous occupants in the ground.  How uncivilized... you hope you aren't taken care of in this
    matter when your time comes...
  sector: field
  exits:
    north:
      to: tba:62:room:6236

"tba:62:room:6238":
  name: A Forest Trail
  description:
  - >
    The trail splits here, one fork heading north towards the rushing sounds of a river, and west where
    the forest seems to be thinning out a lot.  A sudden motion out of the corner of your eye catches
    your eyes, and you turn your head.  Nothing, there's nothing there at all.
  - You wonder if you're being stalked.
  sector: forest
  exits:
    north:
      to: tba:62:room:6239
    east:
      to: tba:62:room:6236
    west:
      to: tba:62:room:6241

"tba:62:room:6239":
  name: A River's Edge
  description: >
    The river flows swiftly on its course to the north. The trail you are on leads on by the water's
    edge to the west, and back into the forest to the south.  A large boulder is just to the west, blocking
    all travel in that direction.  Out in the center of the river, the 'roof' of the energy field meets
    the northern 'wall'.  The water passes right on through the magical barrier, however... the barrier
    is obviously porous to some materials.
  sector: field
  exits:
    south:
      to: tba:62:room:6238
    west:
      to: tba:62:room:6240

"tba:62:room:6240":
  name: A River's Edge
  description: >
    The river pours down the side of the mountains to the west, originating from a large hole in the
    face of one of the sheer rock protuberances.  The energy barrier climbs right up the mountain, and
    seals off any means of escape by that means.  The trail you are on runs by the side of the river to the
    east, and a path leads by the forest side to the south.
  sector: field
  exits:
    east:
      to: tba:62:room:6239
    south:
      to: tba:62:room:6241

"tba:62:room:6241":
  name: A Rocky Trail
  description: >
    The forest is just to your west, with a side trail leading deep inside from here.  The main trail
    you are on, however, heads north towards the river, and south near where a trail leads up to a cave in
    the mountain side. There doesn't seem to be a whole lot to capture your attention here...
  sector: hills
  exits:
    north:
      to: tba:62:room:6240
    east:
      to: tba:62:room:6238
    south:
      to: tba:62:room:6234

"tba:62:room:6242":
  name: A Cave Entrance
  description: >
    You are half blinded by the differences of the outdoors illumination and the pure darkness of the
    cave.  A deep, cloying stench flows out from the cave mouth; the smells of decay, unwashed bodies, and
    sickness in one roiling odor.  Your stomach turns involuntarily, and you wonder about going back
    down the hill to the east, instead of going even further down the western tunnel.
  sector: mountains
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6234
    west:
      to: tba:62:room:6243

"tba:62:room:6243":
  name: A Tunnel Forking
  description:
  - >
    The tunnel forks here, one branch leading north, the other west.  Additionally, you can head back
    outside to the east, which seems like a very good idea to your tortured nasal passages.  Your eyes
    water from the stench, and you clench your left hand tightly to keep control of your bile.
  - >
    Forcing your eyes open, you notice the warning signs painted around the tunnel to the north.
  sector: hills
  flags: [dark, indoors]
  exits:
    north:
      to: tba:62:room:6255
    east:
      to: tba:62:room:6242
    west:
      to: tba:62:room:6244
  extras:
  - keywords: [painting, sign, signs]
    text: They are orcish, and you could swear they were all warning symbols.

"tba:62:room:6244":
  name: A Tunnel
  description: >
    The floor is slick with the humidity that boils out of the lower reaches of this cave, bringing
    that most awful smell with it.  Again, you consider saving your nose the trip west and down the tunnel,
    and heading back east to the cave entrance.
  sector: hills
  flags: [dark, indoors]
  exits:
    east:
      to: tba:62:room:6243
    west:
      to: tba:62:room:6245

"tba:62:room:6245":
  name: A Tunnel
  description: >
    The tunnel takes a deep dip here, and opens up into a largish cave to the west.  There seems to be
    a few faint lights from inside, and you hear some heavy breathing and low grunts from that
    direction.  The cave entrance to the east seems far too far away for your comfort...
  sector: mountains
  flags: [dark, indoors]
  exits:
    east:
      to: tba:62:room:6244
    west:
      to: tba:62:room:6251

"tba:62:room:6246":
  name: A Cave
  description: >
    Heaps of rotting meat and cups of near-drinkable water sit here; the orc food stores.  You stand
    here and wonder in near-disbelief at how the orcs could find this stuff palatable.  They're orcs; its
    their nature and their stomachs you guess.  Oddly enough, you don't even care to catalog what they
    have available -- there's no chance you're going to take any of this...
  sector: hills
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6247
    south:
      to: tba:62:room:6249

"tba:62:room:6247":
  name: A Cave
  description: >
    A single corpse lies here, well away from a pile of similars to the east.  There are several
    sharpened stakes and rocks sitting about conveniently.  The way the corpse is lying, the stone next to its
    hand... this is a suicide area!  You look down upon the orc and comprehend its suffering in its
    twisted form.  How sad.
  sector: hills
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6248
    south:
      to: tba:62:room:6250
    west:
      to: tba:62:room:6246

"tba:62:room:6248":
  name: A Cave
  description: >
    There are bodies here... corpses.  Orcs, the lot of them, every single one of them horribly
    disfigured in some senseless way; one whose arms were removed, another who lacks anything that could
    sensibly be called a face. A few twitch feebly with the last remains of life, the rest just decompose.  The
    dim sense of horror budding in your head blossoms as you realize the pile in the corner consists of
    dead orc children awaiting burial.
  sector: hills
  flags: [no_mob, indoors]
  exits:
    south:
      to: tba:62:room:6251
    west:
      to: tba:62:room:6247

"tba:62:room:6249":
  name: A Cave
  description: >
    A few sleeping pallets, made of moldy straw and stinking furs are arranged around a small firepit
    here. A wooden cup, carved by a crude tool and cruder hands sits near the ashes filled with water you
    consider undrinkable.  Somewhere to the east you hear an orc child's whining cry, and a voice hushes
    it urgently. Beware, orcs!  Adventurers are here!  Hide your children!
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6246
    east:
      to: tba:62:room:6250
    south:
      to: tba:62:room:6252

"tba:62:room:6250":
  name: A Cave
  description: >
    Several grass sleeping pallets are here, clustered around the remains of an old fire.  The sloping
    of the cave's ceiling allow for smoke ventilation towards the surface in here you note, lucky for the
    orcs.  A few strings of burnt meat still hang over the fire, untended and uneaten.  On the floor
    near your feet you spy a small, twisted piece of wire... one orc's idea of a treasured ring, no doubt. 
    Kicking the trinket away, you try to push the pity out of your heart for these wretches.
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6247
    east:
      to: tba:62:room:6251
    south:
      to: tba:62:room:6253
    west:
      to: tba:62:room:6249

"tba:62:room:6251":
  name: A Cave
  description: >
    You are standing just inside a largish cave, about a hundred feet in diameter.  A few dim
    make-shift lanterns burning animal fat illuminate the area, just enough so you can see the rotted food on the
    floor, and a few bodies sprawled throughout the whole area.  Your disgust quickly turns to horror as
    you see a horrible creature, half... well, half something and half orc dash between two stalagmites.
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6248
    east:
      to: tba:62:room:6245
    south:
      to: tba:62:room:6254
    west:
      to: tba:62:room:6250

"tba:62:room:6252":
  name: A Cave
  description:
  - >
    This must be the orc chief's area.  There's an old prize -- a stolen timeworn human armchair
    sitting near the south wall as a throne.  A mammoth sleeping pallet made of piled furs is nearby.  Next to
    that is the pile of orc treasure; a pile of well-polished coppers.  You look at the pile of worthless
    coins and wonder at the image of orcish raiders.
  - These orcs aren't raiders, they are victims.
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6249
    east:
      to: tba:62:room:6253

"tba:62:room:6253":
  name: A Cave
  description: >
    Many sleeping pallets are arranged near the walls, each made of heavy fur padding for comfort and
    warmth.  Many are covered with blood and other, unidentifiable substances.  Looking around, your only
    coherent thought is, 'Don't want to know... don't want to know...'
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6250
    east:
      to: tba:62:room:6254
    west:
      to: tba:62:room:6252

"tba:62:room:6254":
  name: A Cave
  description:
  - >
    This area of the cave is one vast orc sickroom. Mutated and mangled orcs lie on the floor, seeming
    quiet, lifeless.  They're not even worth your time, you think, unless you've the mercy to put them
    out of their misery.
  - >
    You look at the corruption of nature's design and wonder what forces are at work here... the
    barrier, the orcs...  What's going on here?
  sector: hills
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6251
    west:
      to: tba:62:room:6253

"tba:62:room:6255":
  name: A Tunnel
  description: >
    This forking off from the mail tunnel seems odd; the walls are strangely smooth, as if they were
    carved out by forces unknown.  The end is abrupt and short, but there is a steel door inset in the wall
    of the west side of the tunnel.  The smell from the lower tunnel doesn't seem nearly as bad here...
    this might be a good place to rest and catch your breath.
  sector: hills
  flags: [dark, no_mob, indoors]
  exits:
    south:
      to: tba:62:room:6243
    west:
      to: tba:62:room:6256
      look: >
        A large steel door.  There seems to be no hinges or knob, but there is a small keyhole in the exact
        center of it.
      door:
        keywords: [door, steel]
        kind: pickproof
        key: tba:62:obj:6200
        reset: locked

"tba:62:room:6256":
  name: A Tunnel
  description: >
    This section of man-made tunnel heads north from here, doors on either side.  A few glowing spots
    on the ceiling illuminate the area to almost a daylight level.  From the north you hear some horrible
    cries of pain and anguish that make you cringe inside and think twice about heading in that direction.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6258
    east:
      to: tba:62:room:6255
      door:
        keywords: [door, steel]
        kind: pickproof
        key: tba:62:obj:6200
        reset: locked
    west:
      to: tba:62:room:6257
      look: This is a normal, wooden door.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:62:room:6257":
  name: A Bedroom
  description: >
    This is a bedroom, catered to someone with a definite sense of taste.  There's a chest of drawers
    made of a solid section of oak tree.  In fact, most of the furniture here has that 'natural look'
    about it.  The bed is filled with soft down with an ornate table lamp close by.  Nice place.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6256
      look: A normal, wooden door.
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:62:room:6258":
  name: A Tunnel
  description: >
    This tunnel opens up into a large room to the north, and to the south, leads towards a set of
    doors.  The light is crisp and bright, clearly showing the lack of tool marks on the hewn walls... magic? 
    The room just ahead is large, and also well-lighted, giving it an almost clinical atmosphere. 
    Somewhere in the recesses of that room something cries out in a horrible crackling voice.  Not good.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6266
    south:
      to: tba:62:room:6256

"tba:62:room:6259":
  name: The Laboratory
  description: >
    A full fledge operating table is set up here, outfitted with a full set of restraints.  A ledge
    nearby has a whole array of sterile medical equipment on it, covered over by a clear lid.  There's a
    drain in the floor with gradients leading to it to carry away the blood.  For some reason, you don't
    imagine this as a voluntary operating theater...
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6260
    south:
      to: tba:62:room:6262

"tba:62:room:6260":
  name: The Laboratory
  description: >
    Another table is set up will all sorts of alchemical apparatus here, vials and beakers,
    distillation equipment and et cetera.  The stuff looks expensive, but bulky and fragile; not good treasure to
    cart away with you at all.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:62:room:6261
      look: A steel cell door.
      door:
        keywords: [door, steel]
        kind: door
        key: tba:62:obj:6200
        reset: closed
    south:
      to: tba:62:room:6263
    west:
      to: tba:62:room:6259

"tba:62:room:6261":
  name: A Cage
  description: >
    This is a small, dirty cage, with only a bucket for wastes, another bucket for food, and a dirty
    towel for a bed.  The whole room has a terrible stench about it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:62:room:6260
      look: A steel cell door.
      door:
        keywords: [door, steel]
        kind: door
        key: tba:62:obj:6200
        reset: closed

"tba:62:room:6262":
  name: The Laboratory
  description: >
    Some small cages sit here, containing many different types of rodents.  Leaning down to look
    better, you are very surprised as a tiny, common garden mouse growls at you and tries to rip your face off
    through the bars. There are some bulges on its back, and it doesn't seem to be in a very good mood. 
    It quivers some, not fully in control of its motor functions.  Poor thing.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6259
    east:
      to: tba:62:room:6263
    south:
      to: tba:62:room:6265

"tba:62:room:6263":
  name: The Laboratory
  description: >
    A rack stands near the cages on the eastern wall, filled with shackles and manacles, bullwhips and
    worse. They all look well-used.  You give a shiver, and carry on.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6260
    east:
      to: tba:62:room:6264
      look: A steel cell door.
      door:
        keywords: [door, cell]
        kind: door
        key: tba:62:obj:6200
        reset: closed
    south:
      to: tba:62:room:6266
    west:
      to: tba:62:room:6262

"tba:62:room:6264":
  name: A Cage
  description: >
    This is a small, dirty cage, with only a bucket for wastes, another bucket for food, and a dirty
    towel for a bed.  The whole room has a terrible stench about it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:62:room:6263
      look: A steel cell door.
      door:
        keywords: [door, steel]
        kind: door
        key: tba:62:obj:6200
        reset: closed

"tba:62:room:6265":
  name: The Laboratory
  description: >
    This is the southwest corner of the lab.  There's no equipment here, merely several pairs of heavy
    steel shackles on the southern wall.  There's also some a few small bloodstains on the floor beneath
    the shackles.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6262
    east:
      to: tba:62:room:6266

"tba:62:room:6266":
  name: The Laboratory
  description: >
    This is a fairly roomy laboratory that extends to the north, with cages set on the east side of the
    room.  A metal table here is empty, although you can see some outlines in the dust that suggest
    books had laid here once.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:62:room:6263
    east:
      to: tba:62:room:6267
      look: A steel cell door.
      door:
        keywords: [cell, door]
        kind: door
        key: tba:62:obj:6200
        reset: closed
    south:
      to: tba:62:room:6258
    west:
      to: tba:62:room:6265

"tba:62:room:6267":
  name: A Cage
  description: >
    This is a small, dirty cage, with only a bucket for wastes, another bucket for food, and a dirty
    towel for a bed.  The whole room has a terrible stench about it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:62:room:6266
      look: A steel cell door.
      door:
        keywords: [door, cell]
        kind: door
        key: tba:62:obj:6200
        reset: closed
