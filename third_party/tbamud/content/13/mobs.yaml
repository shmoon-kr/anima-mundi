"tba:13:mob:1318":
  keywords: [groundhog, hog]
  short: the groundhog
  long: A small brown furry groundhog sticks its head out of the ground.
  description:
  - >
    Groundhog Day, a Canadian and American tradition, the day (February 2) that the groundhog, or
    woodchuck, comes out of his hole after winter hibernation to look for his shadow; foretells six more weeks
    of bad weather if he sees it; spring is coming if he cannot see his shadow because of clouds;
    supposedly goes back into his hole if more bad weather is coming and stays above ground if spring is near;
    statistical evidence does not support this tradition.
  - >
    This tradition is from a old European belief that if it is sunny on Candlemas Day, then the winter
    would remain another six weeks. Candlemas Day was celebrated on February second and commemorated the
    purification of the Virgin Mary. Candles for sacred uses were blessed on this day.
  - Six more weeks of winter for 2003!
