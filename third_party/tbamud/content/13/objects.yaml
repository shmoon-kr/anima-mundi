      enemy.
    - >
      Article IV If I become a prisoner of war, I will keep faith with my fellow prisoners. I will give
      no information or take part in any action which might be harmful to my comrades. If I am senior, I
      will take command. If not, I will obey the lawful orders of those appointed over me and will back them
      up in every way.
    - >
      Article V When questioned, should I become a prisoner of war, I am required to give name, rank,
      service number, and date of birth. I will evade answering further questions to the utmost of my ability.
      I will make no oral or written statements disloyal to my country and its allies or harmful to their
      cause.

