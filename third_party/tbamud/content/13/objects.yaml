"tba:13:obj:1370":
  type: other
  keywords: [flag, american, mast, half]
  short: the American flag
  long: An American flag is hung at half mast to mourn the World's loss.
  wear: [take]
  values:
    raw: [0, 0, 0, 0]
  weight: 1
  cost: 1
  rent: 0
  level: 0
  extras:
  - keywords: [flag, american, mast, half, 1FEB03]
    text:
    - >
      The flag hangs limp and still unstirred by the wind. As if it mourns along with the rest of the
      world at the loss of the Columbia and crew.
    - >
      Rick Husband paid tribute to fallen astronauts from space, just four days before he died. "They
      made the ultimate sacrifice, giving their lives and service to the country and for all mankind," the
      Texas native said Jan. 28, on the 17th anniversary of the Challenger explosion. The 45-year-old former
      Air Force test pilot was selected as an astronaut in 1994 on his fourth try. Space flight was his
      lifelong passion, along with singing. This was his second space flight. Personal data: Married, two
      children.
    - >
      William McCool was an experienced Navy pilot with more than 2,800 hours in flight. But two weeks
      into his first trip into space, the 41-year-old astronaut was bursting with amazement. "There is so
      much more than what I ever expected," McCool told NPR on Jan. 30. "Its beyond imagination, until you
      actually get up and see it and experience it and feel it." The former Navy test pilot grew up in
      Lubbock, Texas, and became an astronaut in 1996. Personal data: Married, three children.
    - >
      Michael Anderson accepted the risks of space flight willingly. "I take the risk because I think
      what were doing is really important. If you look at this research flight ... the potential yield that we
      have is really tremendous," he said. Anderson, 43, was born in New York and grew up on military
      bases. He was flying for the Air Force when NASA chose him in 1994 as one of only a handful of black
      astronauts. He traveled to Russias Mir space station in 1998. Personal data: Married.
    - >
      Kalpana Chawla wanted to design aircraft when she emigrated to the United States from India in the
      1980s. The space program was the furthest thing from her mind. But "one thing led to another," the
      41-year-old engineer said, and she was chosen as an astronaut in 1994. Chawla was the first native of
      India to fly on a space shuttle but the second in space, after Rakesh Sharma, who flew on an
      Indo-Soviet mission in 1984. This was Chawla's second space flight. Personal data: Married.
    - >
      David Brown was a Navy novelty: a jet pilot as well as a doctor. He was also probably the only NASA
      astronaut to have worked as a circus acrobat. (It was a summer job during college.) He said what he
      learned about "the teamwork and the safety and the staying focused" carried over to his space job. He
      joined the Navy after his medical internship, and held a captain's rank. NASA chose him as an
      astronaut in 1996. This was the 46-year-old Virginia native's first space flight. Personal data: Single.
    - >
      Laurel Clark was a diving medical officer aboard submarines and then a flight surgeon before she
      became an astronaut in 1996. This was her first space flight. She had been on board Columbia to help
      with more than 80 science experiments. "She was doing something that she cared deeply about, that she
      was very good at," said her father, Robert Salton. In fact, he said, "she was pretty good at
      everything." The 41-year-old's hometown was Racine, Wis. Personal data: Married, one child.
    - >
      Ilan Ramon, a colonel in Israels air force, was the first Israeli in space. His mother and
      grandmother survived the Auschwitz death camp. Like his Zionist father, the astronaut fought for his country,
      in the Yom Kippur War in 1973 and the Lebanon War in 1982. He took part in the 1981 air strike that
      destroyed an Iraqi nuclear reactor. Ramon, 48, was selected as an astronaut in 1997 and moved to
      Houston in 1998 for training. He called Tel Aviv home. Personal data: Married, four children.

