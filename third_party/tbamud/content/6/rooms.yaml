  name: Forgotten Island
  description: >
    You find yourself standing on the edge of the island, looking out into the sea.  You feel a sudden
    sense of freedom come over you.  A small breeze picks up, blowing warm air across your face.
  sector: field
  exits:
    east:
      to: tba:6:room:660
    west:
      to: tba:6:room:658

"tba:6:room:660":
  name: Sea of Souls
  description: >
    You feel your boat gently sway back and forth from the waves of the sea. You can see a small island
    to the west.  It appears to be abandoned.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:653
    east:
      to: tba:6:room:661
    south:
      to: tba:6:room:666
    west:
      to: tba:6:room:659

"tba:6:room:661":
  name: Sea of Souls
  description: >
    You find yourself in the middle of nowhere, floating in between two islands. One to the west and
    one to the southeast.  The one to the southeast is rather large.  What could be over there?
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:652
    east:
      to: tba:6:room:663
    west:
      to: tba:6:room:660

"tba:6:room:662":
  name: Sea of Souls
  description: >
    You feel your ship being carried with the current of the sea.  You can see several large boulders
    sticking up from the depths of the water.  Where could these enormous rocks have come from?  Be
    careful not to hit one, you wouldn't be likely to survive.
  sector: water_noswim
  exits:
    south:
      to: tba:6:room:663
    west:
      to: tba:6:room:652

"tba:6:room:663":
  name: Sea of Souls
  description: >
    As you continue floating across the vast sea, you spot an island not to far off to the south.  The
    island looks bigger than the rest that you have seen. What could be there?
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:662
    south:
      to: tba:6:room:664
    west:
      to: tba:6:room:661

"tba:6:room:664":
  name: Dragon Isle
  description: >
    Dragons roam this island.  It's a known fact that people who enter this island never leave it. 
    Maybe you should leave before you are spotted as someone's lunch.
  sector: field
  exits:
    north:
      to: tba:6:room:663
    east:
      to: tba:6:room:665
    south:
      to: tba:6:room:671

"tba:6:room:665":
  name: Dragon Isle
  description: >
    As you risk your life and walk further into the island, you see enormous footprints in the sand. 
    You step inside of one, and suddenly feel very scared. You're not alone here.
  sector: field
  exits:
    south:
      to: tba:6:room:670
    west:
      to: tba:6:room:664

"tba:6:room:666":
  name: Sea of Souls
  description: >
    The waves begin to get rougher, causing your boat to rock.  Be careful not to tip over.  You can
    hear some birds singing in the distance.  You feel very peaceful here.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:660
    south:
      to: tba:6:room:667

"tba:6:room:667":
  name: Sea of Souls
  description: >
    As you continue your long journey across the rippling sea, you look around and see a large island
    to the east.  You can see that several large trees have been knocked down.  What could have caused
    something like this?
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:666
    east:
      to: tba:6:room:673
    west:
      to: tba:6:room:674

"tba:6:room:668":
  name: Sea of Souls
  description: >
    The waves begin to get rougher, causing your boat to rock.  Be careful not to tip over.  You can
    hear some birds singing in the distance.  You feel very peaceful here.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:658
    south:
      to: tba:6:room:669

"tba:6:room:669":
  name: Sea of Souls
  description: >
    The open sea is before you.  You can feel a slight chill coming off from the water.  The water must
    be very deep here.  As you look over the side of your boat, into the water you see nothing but
    blackness.  It makes you think of death.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:668
    east:
      to: tba:6:room:674
    west:
      to: tba:6:room:675

"tba:6:room:670":
  name: Dragon Isle
  description: >
    As you continue on, you pass an old crumbled cave.  It was most likely crushed by one of the
    dragons while removing its prey from the cave.
  sector: field
  exits:
    north:
      to: tba:6:room:665
    west:
      to: tba:6:room:671

"tba:6:room:671":
  name: Dragon Isle
  description: >
    As you stand on the edge of the island, you check out your surroundings. To the east, the island
    continues.  To the west is the sea.  Maybe you had better leave the island while you still can.
  sector: field
  exits:
    north:
      to: tba:6:room:664
    east:
      to: tba:6:room:670
    west:
      to: tba:6:room:672

"tba:6:room:672":
  name: Sea of Souls
  description: >
    As you continue sailing along, you spot a large island to the east.  The island looks to have been
    left in ruins.  Maybe shouldn't go there.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:671
    west:
      to: tba:6:room:673

"tba:6:room:673":
  name: Sea of Souls
  description: >
    As you continue your long journey across the rippling sea, you look around and see a large island
    to the east.  You can see that several large trees have been knocked down.  What could have caused
    something like this?
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:672
    west:
      to: tba:6:room:667

"tba:6:room:674":
  name: Sea of Souls
  description: >
    The open sea is before you.  You can feel a slight chill coming off from the water.  The water must
    be very deep here.  As you look over the side of your boat, into the water you see nothing but
    blackness.  It makes you think of death.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:667
    west:
      to: tba:6:room:669

"tba:6:room:675":
  name: Sea of Souls
  description: >
    The open sea is before you.  You can feel a slight chill coming off from the water.  The water must
    be very deep here.  As you look over the side of your boat, into the water you see nothing but
    blackness.  It makes you think of death.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:669
    south:
      to: tba:6:room:676

"tba:6:room:676":
  name: Sea of Souls
  description: >
    As you continue floating along the sea, everthing gets quiet.  Maybe too quiet.  You can see a
    small island in the distance to the southeast.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:675
    south:
      to: tba:6:room:677

"tba:6:room:677":
  name: Sea of Souls
  description: >
    The water is quite calm here, letting you relax in the light of the day. You can see a small island
    to the east.  This is perhaps the smallest island you have encountered so far.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:676
    east:
      to: tba:6:room:678

"tba:6:room:678":
  name: Ice Isle
  description: >
    The island you have stepped on is covered in snow and ice!  How could this be possible?  The
    climate is much too warm for there to be snow.  All the plants have died and shrivled up, leaving you as
    the only living thing on this island.
  sector: field
  exits:
    east:
      to: tba:6:room:680
    south:
      to: tba:6:room:679
    west:
      to: tba:6:room:677

"tba:6:room:679":
  name: Ice Isle
  description: >
    The ground is very slippery here, better watch your step!  You can see the remains of an old ice
    fort.  The sun has melted quite a bit of it down, leaving nothing but a mound of ice.
  sector: field
  exits:
    north:
      to: tba:6:room:678

"tba:6:room:680":
  name: Sea of Souls
  description: >
    The water here is quite cold.  You can see small chunks of ice floating past you.  To the west is a
    small island covered in snow.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:681
    west:
      to: tba:6:room:678

"tba:6:room:681":
  name: Sea of Souls
  description: >
    The water here is quite cold.  You can see small chunks of ice floating past you.  To the west is a
    small island covered in snow.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:686
    south:
      to: tba:6:room:682
    west:
      to: tba:6:room:680

"tba:6:room:682":
  name: Sea of Souls
  description: >
    You feel yourself begin to drift off to sleep, when all of a sudden a huge waves crashes against
    your boat, almost tipping you over!  You're sprayed with a light mist, leaving your clothes drenched.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:681
    east:
      to: tba:6:room:685
    south:
      to: tba:6:room:683

"tba:6:room:683":
  name: Forest Island
  description: >
    The island before you is a forest!  Numerous trees are cluttered together, leaving almost no room
    for you to walk.  You see some wild flowers and weeds growing through the tall grass.
  sector: field
  exits:
    north:
      to: tba:6:room:682
    east:
      to: tba:6:room:684

"tba:6:room:684":
  name: Forest Island
  description: >
    The grass gets much taller here, making it hard to see anything.  The grass is up to your chin. 
    You begin to feel like you're in the jungle.  Several bugs zoom past your ear, making a soft buzzing
    sound.
  sector: field
  exits:
    east:
      to: tba:6:room:689
    west:
      to: tba:6:room:683

"tba:6:room:685":
  name: Sea of Souls
  description: >
    You continue sailing through the chopping waters.  In the distance to the south you can see an
    island filled with trees.  The shore is not to far off to the southeast.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:686
    east:
      to: tba:6:room:688
    west:
      to: tba:6:room:682

"tba:6:room:686":
  name: Sea of Souls
  description: >
    The waves ripple softly, splashing against the side of your boat.  It rocks gently, threatening to
    put you to sleep.  You feel very relaxed here.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:687
    south:
      to: tba:6:room:685
    west:
      to: tba:6:room:681

"tba:6:room:687":
  name: Sea of Souls
  description: >
    The waves ripple softly, splashing against the side of your boat.  It rocks gently, threatening to
    put you to sleep.  You feel very relaxed here.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:690
    south:
      to: tba:6:room:688
    west:
      to: tba:6:room:686

"tba:6:room:688":
  name: Sea of Souls
  description: >
    You continue sailing through the chopping waters.  In the distance to the south you can see an
    island filled with trees.  The shore is not to far off to the southeast.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:687
    west:
      to: tba:6:room:685

"tba:6:room:689":
  name: Forest Island
  description: >
    The ground at your feet begins to get mushy, making it hard for you to walk. It almost feels as if
    you're in quicksand.  The grass is much shorter here, showing you the sea to the north and south.
  sector: field
  exits:
    south:
      to: tba:6:room:695
    west:
      to: tba:6:room:684

"tba:6:room:690":
  name: Sea of Souls
  description: >
    You begin sailing into the unknown.  What things will you encounter?  Will you even survive?  Luck
    doesn't appear to be on your side.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:691
    west:
      to: tba:6:room:687

"tba:6:room:691":
  name: Private Island
  description: >
    You're standing on the edge of a beautiful island.  The shore is surrounded with wild flowers,
    giving off a sweet scent.  You can see a small house to the east.
  sector: field
  exits:
    east:
      to: tba:6:room:692
    west:
      to: tba:6:room:690

"tba:6:room:692":
  name: Private Island
  description: >
    A beautiful brick house stands before you.  By the looks, it hasn't been here very long.  There
    doesn't appear to be anyone home.  Maybe you should leave before someone sees you.
  sector: field
  exits:
    south:
      to: tba:6:room:693
    west:
      to: tba:6:room:691

"tba:6:room:693":
  name: Private Island
  description: >
    You seem to have stepped onto an island that is owned by someone.  You can see a small house to the
    north.  It's constructed of bricks and is by far the most beautiful house you have ever seen!
  sector: field
  exits:
    north:
      to: tba:6:room:692
    south:
      to: tba:6:room:694

"tba:6:room:694":
  name: Sea of Souls
  description: >
    The water seems to calm down some, allowing you to let go of the boat.  To the north you can see an
    island.  It doesn't appear to be very big, but it might be a good place to stop and rest.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:693
    south:
      to: tba:6:room:696

"tba:6:room:695":
  name: Sea of Souls
  description: >
    The water here is quite calm, making you feel very relaxed.  Don't get too relaxed.  You may fall
    sleep and tip over!
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:689
    east:
      to: tba:6:room:697

"tba:6:room:696":
  name: Sea of Souls
  description: >
    Your boat gently begins to rock back and forth.  You feel a slight wind pick up, causing the sea to
    become wavy.  You grab on to the sides of the boat, trying to hang on.
  sector: water_noswim
  exits:
    north:
      to: tba:6:room:694
    west:
      to: tba:6:room:698

"tba:6:room:697":
  name: Sea of Souls
  description: >
    As you set sail and begin drifting into the depths of the sea, you spot a small island off to the
    west.  It looks nice enough, but looks can be deceiving.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:698
    south:
      to: tba:6:room:699
    west:
      to: tba:6:room:695

"tba:6:room:698":
  name: Sea of Souls
  description: >
    Your boat gently begins to rock back and forth.  You feel a slight wind pick up, causing the sea to
    become wavy.  You grab on to the sides of the boat, trying to hang on.
  sector: water_noswim
  exits:
    east:
      to: tba:6:room:696
    west:
      to: tba:6:room:697

"tba:6:room:699":
  name: Shore
  description: >
    As you stand on the shore, you look out the the beautiful sea before you. What mysteries could it
    hold?  Would you survive a journey across it?  You hear some birds chirping in the distance.
  sector: field
  exits:
    north:
      to: tba:6:room:697
