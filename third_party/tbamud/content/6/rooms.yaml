"tba:6:room:600":
  name: Shore
  description: >
    The sea that sits before your eyes is beautiful!  Soft waves of blue ripple all the way up to the
    shore, splashing some rocks.  The water looks perfect for traveling on.  What kind of neat things
    could this sea hold?
