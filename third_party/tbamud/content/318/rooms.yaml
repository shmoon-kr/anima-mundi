# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 318.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:318:room:31800":
  name: Dock Area Zone Description Room
  description:
    preformatted: |2
         Kaan
         Zone 318 is linked to the following zones:
      315 McGintey Business District     at 31801 (north) ---> 31571
      315 McGintey Business District     at 31804 (north) ---> 31573
      322 McGintey Bay                   at 31842 (south) ---> 32273
      322 McGintey Bay                   at 31843 (south) ---> 32275
      322 McGintey Bay                   at 31844 (south) ---> 32277
      322 McGintey Bay                   at 31846 (south) ---> 32271
      322 McGintey Bay                   at 31847 (south) ---> 32269
      322 McGintey Bay                   at 31848 (south) ---> 32267
      322 McGintey Bay                   at 31849 (south) ---> 32265
  sector: inside

"tba:318:room:31801":
  name: West Main
  description: >
    The road continues downhill to the south, toward wine, women and drunken brawls.  The stench fish
    and sea-goers gets stronger and stronger with each step you take down toward the docks.  To the north
    is the way into the main business section of the City.
  sector: inside
  exits:
    north:
      to: tba:315:room:31571
    south:
      to: tba:318:room:31802

"tba:318:room:31802":
  name: West Main
  description: >
    You are nearing sea level, which is just south and downhill from where you stand.  The repugnant
    smell of fish and guts, sailors and sweat is still all around you, but to your shame you find that you
    are beginning to get a bit used to it.  North leads the way uphill into McGintey's business district.
  sector: inside
  exits:
    north:
      to: tba:318:room:31801
    south:
      to: tba:318:room:31803

"tba:318:room:31803":
  name: West Main
  description: >
    You have come to the southern end of West Main, where the street stops it's travel downhill and
    south, allowing the Dock Road to take over, which is just west from here.  The road heads north, uphill
    toward the main city section of McGintey Cove, or east into a tightly packed alley where a sizable
    crowd of people seem to be gathered around, watching something.
  sector: inside
  exits:
    north:
      to: tba:318:room:31802
    east:
      to: tba:318:room:31807
    west:
      to: tba:318:room:31824

"tba:318:room:31804":
  name: East Main
  description: >
    The road heads south at a steep downhill angle, making travel a bit difficult, especially with the
    poor condition if the roads.  To the north is the main business section of McGintey Cove.
  sector: inside
  exits:
    north:
      to: tba:315:room:31573
    south:
      to: tba:318:room:31805

"tba:318:room:31805":
  name: East Main
  description: >
    The road heads steeply downhill toward the docks and all the mariad life which seems to frequent
    that area.  Just south of you is the final step where you reach sea level and what looks to be the
    grubbiest section of any town you have ever seen begins.  To the north, the road heads uphill toward the
    main business area for the Cove.
  sector: inside
  exits:
    north:
      to: tba:318:room:31804
    south:
      to: tba:318:room:31806

"tba:318:room:31806":
  name: East Main
  description: >
    You have reached the bottom of the large hill which runs north from here into the main business
    area.  South of you is mroe of the road, which runs along side a very large building, presumably the
    Boat Station, where one may book passage to any of the islands of Dibrova.  West of you is an alley
    where it looks like a sizable crowd has gathered, all intent and yelling at something in their center.
  sector: inside
  exits:
    north:
      to: tba:318:room:31805
    south:
      to: tba:318:room:31808
    west:
      to: tba:318:room:31807

"tba:318:room:31807":
  name: Alley at the Cock Fights
  description: >
    You stand in a cramped alley which is made all the more cramped by all the people who have crowded
    together to watch and bet on these beasts which battle on the ground in the center of this man-made
    ring.  The exits lead east and west.
  sector: inside
  exits:
    east:
      to: tba:318:room:31806
    west:
      to: tba:318:room:31803

"tba:318:room:31808":
  name: East Main
  description: >
    The road runs north and south here.  On your west is the wall of the enormous boat station here in
    McGintey Cove.  The entrance looks to be just south of here.  To the east is an old, three story
    building which looks from this angle to be completely abandoned.
  sector: inside
  exits:
    north:
      to: tba:318:room:31806
    east:
      to: tba:318:room:31850
    south:
      to: tba:318:room:31809

"tba:318:room:31809":
  name: East Main
  description: >
    You stand on before a huge concrete building which holds the Boat Station here in McGintey Cove. 
    This Boat Station is said to be the largest commercial outlet for personal travel overseas in
    Dibrova.  A great number of people go in and come out of this place, many obviously foreigners.  The entrance
    to the Boat Station is to the west and the road runs north and south.
  sector: inside
  exits:
    north:
      to: tba:318:room:31808
    south:
      to: tba:318:room:31810
    west:
      to: tba:318:room:31813

"tba:318:room:31810":
  name: East Main
  description: >
    The road continues north and south, a small shop lies just east of you.  To the south you can see
    the very tops of ships' masts that are docked in the harbor.  The shop east of here looks to be that
    of a netweaver's.
  sector: inside
  exits:
    north:
      to: tba:318:room:31809
    east:
      to: tba:318:room:31812
    south:
      to: tba:318:room:31811

"tba:318:room:31811":
  name: East Main
  description: >
    Still heading north and south, this road has turned from the easily traveled paving to the north to
    a muddy, sludgy mess that you must literally make an effort each time you take a step to lift your
    foot high enough to clear the mud that threathens to ruin your footwear and bog you down.  To the east
    is a very crude looking building, a sign hanging out front with no writing, just a badly painted
    picture of a cracked beer mug on it.  To the west, a narrow, dark alley allows limited access.
  sector: inside
  exits:
    north:
      to: tba:318:room:31810
    east:
      to: tba:318:room:31831
    south:
      to: tba:318:room:31832
    west:
      to: tba:318:room:31820

"tba:318:room:31812":
  name: Netweaver
  description: >
    This small shop is festooned with nets of assorted size, color and shape. Most are made for
    fishing, for those commercial fisherman who supply the town with fish to eat.  Some, however, are made for a
    more deadly purpose, one which a player may find quite useful....
  sector: inside
  exits:
    west:
      to: tba:318:room:31810

"tba:318:room:31813":
  name: McGintey Boat Station
  description: >
    Upon entering into this huge hall, the first thing you notice is the rush of sound that comes at
    you from every side.  It seems everyone is trying desperately to yell over everyone else to make sure
    they get the right ticket to the right destination.  The next thing you notice is the amount of people
    who seem to have found a home here at the station, on the benches which are rowed neatly in the
    center of the floor.  These benches were obviously intended for use by the customers who await the
    arrival of their boat, but it seems that some the lower class, possibly less fortunates have decide that
    these benches work very well as a bed, too.  There are ticket booths to the north and south.  The exit
    is east.
  sector: inside
  exits:
    north:
      to: tba:318:room:31817
    east:
      to: tba:318:room:31809
    south:
      to: tba:318:room:31815
    west:
      to: tba:318:room:31814

"tba:318:room:31814":
  name: McGintey Boat Station
  description: >
    This part of the station is no different from the front section.  Bums and screaming people. 
    Everywhere.  Love it here, yep!  (That WAS sarcasm) There are more ticket booths to the north, the south,
    and the west.  The exit is off to the east.  Past more bums.
  sector: inside
  exits:
    north:
      to: tba:318:room:31818
    east:
      to: tba:318:room:31813
    south:
      to: tba:318:room:31816
    west:
      to: tba:318:room:31819

"tba:318:room:31815":
  name: Dibrova Travels
  description: >
    You stand at a glass window with a small hole cut in the bottom center.  A sign hangs behind the
    receptionist, detailing the ports of call for this particular travel company.
  sector: inside
  exits:
    north:
      to: tba:318:room:31813

"tba:318:room:31816":
  name: Travels Abroad
  description: >
    You stand at a glass window with a small hole cut in the bottom center.  A sign hangs behind the
    receptionist, detailing the ports of call for this particular travel company.
  sector: inside
  exits:
    north:
      to: tba:318:room:31814

"tba:318:room:31817":
  name: Island Escapes
  description: >
    You stand at a glass window with a small hole cut in the bottom center.  A sign hangs behind the
    receptionist, detailing the ports of call for this particular travel company.
  sector: inside
  exits:
    south:
      to: tba:318:room:31813

"tba:318:room:31818":
  name: Ocean Adventures
  description: >
    You stand at a glass window with a small hole cut in the bottom center.  A sign hangs behind the
    receptionist, detailing the ports of call for this particular travel company.
  sector: inside
  exits:
    south:
      to: tba:318:room:31814

"tba:318:room:31819":
  name: Hodges Travel, Inc.
  description: >
    You stand at a glass window with a small hole cut in the bottom center.  A sign hangs behind the
    receptionist, detailing the ports of call for this particular travel company.
  sector: inside
  exits:
    east:
      to: tba:318:room:31814

"tba:318:room:31820":
  name: Narrow Alley
  description: >
    With the Boat Station wall to your north and the wall of a two story brothel to your south, this
    alley is so covered in shadows as to be dark.  It continues west into more darkness or allows entrance
    back onto East Main to the east.
  sector: inside
  flags: [dark, tunnel]
  exits:
    east:
      to: tba:318:room:31811
    west:
      to: tba:318:room:31821

"tba:318:room:31821":
  name: Narrow Alley
  description: >
    The alley stills seems to lead somewhere to the west, but still without enough light to see by.  A
    faint trickle of light comes from the east, where the alley opens up into the main street.
  sector: inside
  flags: [dark, tunnel]
  exits:
    east:
      to: tba:318:room:31820
    west:
      to: tba:318:room:31822

"tba:318:room:31822":
  name: Dead End in Narrow Alley
  description: >
    Ahhh, finally some light!  Although, with the light that is available here, you may have been
    better off not seeing.  There is a small, hooded lantern casting light on the alley floor where five large
    punks huddle around a craps game they were gambling on.  Notice the word 'WERE' there.  See, you
    have interrupted their game, and they don't seem pleased.  No, not at all.
  sector: inside
  flags: [dark]
  exits:
    north:
      to: tba:318:room:31823
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:318:room:31821

"tba:318:room:31823":
  name: The HQ of the Bloody Scythe Gang
  description: >
    This place, what appears to be an abandoned warehouse, is home to one of the deadliest gangs of
    thugs in McGintey Cove.  All crime, all prostitution, and all illegal gambling activities are controlled
    from this room.  Well, that is all crime, prostitution and gambling that the Dead Boys (McGintey's
    other gang) don't control is controlled from here.  Seems that the Bloody Scythes don't take a shine
    to having unexpected company, either.  Better duck!
  sector: inside
  exits:
    south:
      to: tba:318:room:31822
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:318:room:31824":
  name: Dock Road
  description: >
    You are at the northern end of Dock Road which at this point, isn't anywhere near the docks, but
    leads to them directly.  To the east is West Main street and to the south is the way leading to the
    docks.
  sector: inside
  exits:
    east:
      to: tba:318:room:31803
    south:
      to: tba:318:room:31825

"tba:318:room:31825":
  name: Dock Road
  description: >
    The road heads south toward the docks where all vessels commercial and private are kept when in
    port.  The sound of the sea begins to be much more prevalent as you make your way toward the docks.  The
    sounds, the smell, and the excitement of a busy seaport seems to call to you as you hurry along.
  sector: inside
  exits:
    north:
      to: tba:318:room:31824
    south:
      to: tba:318:room:31826

"tba:318:room:31826":
  name: Dock Road
  description: >
    The Dock Road continues south toward the docks or north toward a large hill which leads up into the
    main business section of McGintey Cove.
  sector: inside
  exits:
    north:
      to: tba:318:room:31825
    south:
      to: tba:318:room:31827

"tba:318:room:31827":
  name: Dock Road
  description: >
    Dock Road comes to an intersection on itself just south of you, where it splits east and west and
    runs along the docks where all of the many ships are kept while in port.  To the east is a small dirt
    trail.  It looks to be fairly well used, however there is something about it, something slightly
    unsettling that makes you think maybe you'd better not head that way.  Don't you have a ship to catch
    anyway?
  sector: inside
  exits:
    north:
      to: tba:318:room:31826
    east:
      to: tba:318:room:31828
    south:
      to: tba:318:room:31848

"tba:318:room:31828":
  name: Dirt Trail
  description: >
    The trail makes a turn to the north, where it leads up to a small wooden shack, sittig all by
    itself in the shadow of this big city.  How in the world did this little shack go unnoticed by you when
    you walked by on Dock Road?
  sector: inside
  exits:
    north:
      to: tba:318:room:31829
    west:
      to: tba:318:room:31827

"tba:318:room:31829":
  name: In Front of a Shack
  description: >
    You stand before the shack, wondering if it would be a good idea to knock, or just walk right in. 
    There is definitely someone home from the sounds you can from out here, there are probably quite a
    few someones home.  They are making a loud-assed racket.  You may head south away from the shack or
    north into it.
  sector: inside
  exits:
    north:
      to: tba:318:room:31830
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:318:room:31828

"tba:318:room:31830":
  name: HQ for the Dead Boys
  description: >
    These boys are, of course, not dead.  In fact, they are far from it.  They seem to have a non-stop
    party that goes on and on and on.  Almost makes you want to join them, but just as you begin to think
    these party animals might be cool to hang out with for a few drunken hours, they turn as one and
    decide that kicking your ass would be more fun than the beer for a while.  Hey, you know, You Gotta
    Fight...  For Your Right...
  sector: inside
  exits:
    south:
      to: tba:318:room:31829
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:318:room:31831":
  name: The Cracked Mug
  description: >
    A gaggle of sailors all huddle around an old battered piano, most of them drunker than drunk can
    be.  They all sing along in off-keys to an off-key tune played by a sailor who probably has never
    touched a piano before in his life. Seems like a harmless enough place to come in and have a drink or
    two...
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:318:room:31811

"tba:318:room:31832":
  name: East Main
  description: >
    East Main heads south toward the docks, which you can faintly see in the distance now.  A wide road
    heads off to your east, past a bar and a warehouse. To the west is nicely kept house decorated in
    pastel colors.  For some reason, there are a number of women leaning on the front balcony, smiling and
    waving. Hm, you must look extra good today or something!
  sector: inside
  exits:
    north:
      to: tba:318:room:31811
    east:
      to: tba:318:room:31834
    south:
      to: tba:318:room:31839
    west:
      to: tba:318:room:31833

"tba:318:room:31833":
  name: Myra's House of Ill Repute
  description: >
    Madame Myra hosts the only business of this nature in this town, thereby granting her the luxury of
    picking and choosing her custom, not to mention her price.  A sign on the wall catches your eye.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:318:room:31832

"tba:318:room:31834":
  name: Warehouse Road
  description: >
    The road runs along a couple of large warehouses which seem for the most part unused or at least,
    unguarded.  One lies directly south from you and the other just northeast.  To the west is East Main.
  sector: inside
  exits:
    east:
      to: tba:318:room:31835
    south:
      to: tba:318:room:31840
    west:
      to: tba:318:room:31832

"tba:318:room:31835":
  name: Warehouse Road
  description: >
    The road runs east and west from here, dead ending just east at a large, empty looking house.  To
    the north is the entrance to a large warehouse.
  sector: inside
  exits:
    north:
      to: tba:318:room:31838
    east:
      to: tba:318:room:31836
    west:
      to: tba:318:room:31834

"tba:318:room:31836":
  name: Warehouse Road
  description: >
    The road ends here, warehouse walls to the north and south with no entrances, and an old, empty
    looking house to the east.  To the west the street heads toward East Main and the docks.
  sector: inside
  exits:
    east:
      to: tba:318:room:31837
    west:
      to: tba:318:room:31835

"tba:318:room:31837":
  name: Abandoned Building
  description: >
    This ransacked home must have been the home of either the owner of these warehouses or the place
    where the guard lived who watched over them.  It makes little difference who lived here then, because
    the house has been completely gutted by the various hoodlums and punks of the town.  It also looks as
    if it could be a favorite of some of the squatters of this town.  The exit lies west.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:318:room:31836

"tba:318:room:31838":
  name: Warehouse
  description: >
    A few crates lay scattered throughout the room, all of them seem to have the appearance of having
    been left here for quite some time.  Never hurts to check, though...
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:318:room:31835

"tba:318:room:31839":
  name: East Main
  description: >
    East Main runs south into Dock Road, the road which runs east to west along the docks where all
    vessels are required to tie up when in port.  To the west is a small motel which offers vacancy, however
    it does look as if it would most probably be a favorite hangout for sailors and call girls, not the
    affluent qworld traveller type like yourself.
  sector: inside
  exits:
    north:
      to: tba:318:room:31832
    south:
      to: tba:318:room:31842
    west:
      to: tba:318:room:31841

"tba:318:room:31840":
  name: Warehouse
  description: >
    Boxes and crates litter the floor.  Your footsteps echo hollowly in this huge building, convincing
    you that you are most probably alone in this place.  A quick search might reveal a prize or two.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:318:room:31834

"tba:318:room:31841":
  name: Roach Motel
  description: >
    There is a door in the east wall, presumably leading to the rooms where one might rest for the
    night.  A man sits behind a thick plate of glass reading a small pamphlet and ignoring you.  It seems if
    you want any help, you'll have to ask for it.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:318:room:31839

"tba:318:room:31842":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east to west along McGintey's docks. To the south is Dock 5,
    designated for pleasure crafts and commercial travel. To your north East Main heads up toward the
    main business district of McGinety Cove.
  sector: inside
  exits:
    north:
      to: tba:318:room:31839
    east:
      to: tba:318:room:31843
    south:
      to: tba:322:room:32273
    west:
      to: tba:318:room:31846

"tba:318:room:31843":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east to west along McGintey's docks. To the south is Dock 6,
    designated for pleasure crafts only.  To your north is the wall of a large warehouse, the entrance to
    which must be on another side.
  sector: inside
  exits:
    east:
      to: tba:318:room:31844
    south:
      to: tba:322:room:32275
    west:
      to: tba:318:room:31842

"tba:318:room:31844":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east to west along McGintey's docks. To the south is Dock 7,
    the last of seven docks, this one designated as pleasure crafts only.  The shipyard lies to the east
    or you may head west back along the Dock Road.
  sector: inside
  exits:
    east:
      to: tba:318:room:31845
    south:
      to: tba:322:room:32277
    west:
      to: tba:318:room:31843

"tba:318:room:31845":
  name: Shipyard
  description: >
    This is where the boats of McGintey Cove are made and repaired.  Hard working men work round the
    clock to make sure that the commerce and trade which this great city depends so much on does not come
    to a halt.
  sector: inside
  exits:
    west:
      to: tba:318:room:31844

"tba:318:room:31846":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east and west along McGintey's docks. To the south is Dock 4
    which is designated as commercial travel only.
  sector: inside
  exits:
    east:
      to: tba:318:room:31842
    south:
      to: tba:322:room:32271
    west:
      to: tba:318:room:31847

"tba:318:room:31847":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east and west along McGintey's docks. To the south is Dock 3
    which is designated as commercial travel only.
  sector: inside
  exits:
    east:
      to: tba:318:room:31846
    south:
      to: tba:322:room:32269
    west:
      to: tba:318:room:31848

"tba:318:room:31848":
  name: Dock Road
  description: >
    You stand on the Dock Road which runs east and west along McGintey's docks. To the south is Dock 2
    which is designated as commercial travel and commercial business.  To the north, Dock Road runs
    toward a large hill that leads up into the main business section of the Cove.
  sector: inside
  exits:
    north:
      to: tba:318:room:31827
    east:
      to: tba:318:room:31847
    south:
      to: tba:322:room:32267
    west:
      to: tba:318:room:31849

"tba:318:room:31849":
  name: Dock Road
  description: >
    You have come to the western end of Dock Road, where the only exit besides the way you came is
    south, onto Dock 1, designated as commercial business crafts only.
  sector: inside
  exits:
    east:
      to: tba:318:room:31848
    south:
      to: tba:322:room:32265

"tba:318:room:31850":
  name: A Garbage Littered Hallway
  description: >
    You stand just inside a building that appears to have been some sort of housing project in it
    heyday.  There are doors both north and south of you - both of them are closed at this time.  Of course,
    the doors don't look like they would do much to keep anyone in or out of the rooms beyond.  They are
    all nasty and corroded, most of the wood peeling away in strips.  The hallway heads east into more
    filth, best to watch your step, there is no light and you could trip on some garbage.
  sector: inside
  flags: [indoors]
  exits:
    east:
