# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 100.
# keywords: words to name it in commands; short: in sentences ("the pit beast"); long: its line in a room.
# combat.armor is tbaMUD's armor class / 10 (lower is better); hit_points and damage: a number, or dice NdS+B when rolled.
"tba:100:mob:10000":
  keywords: [hermit]
  short: the hermit
  long: A hermit is standing here, oblivious to you and the rest of the world.
  description: >
    This recluse has been living outside of the city for too long.  He is disheveled and in desperate
    need of a bath and clean clothes.  He must be strong and determined to survive out here on his own.
  level: 3
  sex: male
  alignment: 0
  flags: [scavenger, stay_zone, memory]
  affects: [sense_life]
  combat:
    thac0: 19
    armor: 8
    hit_points: 30
    damage: 1d2
    bare_hand_attack: punch
  gold: 30
  exp: 900
  position:
    load: standing
    default: standing

