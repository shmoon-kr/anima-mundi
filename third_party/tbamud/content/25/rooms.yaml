"tba:25:room:2511":
  name: A Small Clearing
  description:
  - >
    You are in a small clearing in the shadow grove.  There is charred grass underfoot, and the signs
    of fire here and there.  It is almost as if the plant life shuns this spot.  The shadowy mist hovers
    all around, obscuring your view into the grove.
  - >
    A small path leads north to some shadowy structure.  All other exits are shrouded in shadowy mist.
  sector: forest
  flags: [dark, no_track]
  exits:
    north:
      to: tba:25:room:2512
      look: You can barely make out some sort of building to the north.
    east:
      to: tba:25:room:2506
      look: The shadows obscure your vision.
    south:
      to: tba:25:room:2502
      look: The shadows obscure your vision.
    west:
      to: tba:25:room:2510
      look: The shadows obscure your vision.

"tba:25:room:2512":
  name: The Entrance To The High Tower
  description:
  - >
    You have reached the entrance to the High Tower of Sorcery.  The tower looms above you at an
    incredible height.  It seems to disappear into the storm clouds above.
  - A diamond gate is to the north, whilst the trail back south has disappeared behind you.
  sector: inside
  flags: [no_track]
  exits:
    north:
      to: tba:25:room:2513
      look: The diamond gate looks incredibly strong.
      door:
        keywords: [gate, diamond]
        kind: pickproof
        key: tba:25:obj:2500
        reset: locked

"tba:25:room:2513":
  name: Inside The High Tower Of Sorcery
  description:
  - >
    You are inside the High Tower of Sorcery.  The sight is truly amazing. From here, it is obvious
    that somehow, the tower is much larger on the inside than it is on the outside.  Young mages walk about,
    completely oblivious to your presence.
  - >
    Exits lead north to the common room, west to the dinning room, east to a plain hallway and back
    south through the gate.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2514
      look: The common room looks quite busy and noisy.
    east:
      to: tba:25:room:2515
    south:
      to: tba:25:room:2512
      door:
        keywords: [gate, diamond]
        kind: pickproof
        key: tba:25:obj:2500
        reset: locked
    west:
      to: tba:25:room:2516

"tba:25:room:2514":
  name: Common Room
  description:
  - >
    You are in the common room.  There are many apprentice warlocks here talking and resting, playing
    games, comparing notes.  Obviously they are taking a break from their rigorous studies.  There are
    benches, tables and a small water fountain here, otherwise the room is quite unremarkable.
  - Exits lead off in all directions.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2517
    east:
      to: tba:25:room:2518
      look: The mages' bar can be seen to the east.
    south:
      to: tba:25:room:2513
    west:
      to: tba:25:room:2519

"tba:25:room:2515":
  name: The Hallway
  description: >
    You are in a long hallway, it seems rather unremarkable.  The hallway continues east and back west.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:25:room:2530
    west:
      to: tba:25:room:2513

"tba:25:room:2516":
  name: The Dining Room
  description:
  - >
    You are in the dining area of the student mages.  From the number of tables and chairs here, you
    can see that this room could easily seat several hundred people.  It is oddly deserted here, obviously
    not meal time.
  - Exits lead west to the kitchen, and back east.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:25:room:2513
    west:
      to: tba:25:room:2520
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2517":
  name: A Dark Hallway
  description:
  - >
    You are in a dark hallway.  It is apparent that this area is seldom used by the regular occupants
    of the tower.  Dust covers the floors here.
  - The faint outline of a trapdoor can be seen in the dust.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    south:
      to: tba:25:room:2514
    down:
      to: tba:25:room:2521
      door:
        keywords: [trapdoor]
        kind: door
        reset: closed

"tba:25:room:2518":
  name: The Mages' Tavern
  description:
  - >
    You are in the mages' tavern.  The air is smokey and filled with the smells of foreign food and
    drink.  The other patrons pay you little heed, as they obviously have more interesting things to
    contemplate.
  - The only exit leads back west.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:25:room:2514

"tba:25:room:2519":
  name: The Magic Shop
  description:
  - >
    You are in the High Tower's store of magic.  This place sells all sorts of herbs, parchment and
    other reagents used in magical studies.
  - The only exit leads back east to the common room.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:25:room:2514

"tba:25:room:2520":
  name: The Kitchen
  description:
  - >
    You are in a small kitchen.  All the usual kitchen type utensils and equipment is here, including
    some not so usual ones.  Among the later, a huge black oven against one wall, it must be at least 12
    feet high.
  - >
    Opposite the oven is an equally enormous meat locker, large enough to comfortably store several
    hapless adventurers no doubt.  In the middle of the room, hanging in mid-air is a spice rack.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:25:room:2516
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2521":
  name: Below The Trapdoor
  description:
  - >
    You are below the trapdoor.  It is very dark and dusty here, very little light filters through from
    above.  A faint sound of dripping water can be heard in the distance below.
  - A rope ladder leads down.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    up:
      to: tba:25:room:2517
      door:
        keywords: [trapdoor]
        kind: door
        reset: closed
    down:
      to: tba:25:room:2522

"tba:25:room:2522":
  name: A Damp Intersection
  description:
  - >
    You are in a damp intersection of what seems to be the basement of the tower.  The sound of running
    water can be heard coming from the south, other than that, an almost tangible stillness fills the
    air.
  - Passages lead off in all directions, and a ladder leads up.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    north:
      to: tba:25:room:2523
    east:
      to: tba:25:room:2524
      look: A faint light can be seen in the distance up the east passage.
    south:
      to: tba:25:room:2525
    west:
      to: tba:25:room:2526
    up:
      to: tba:25:room:2521

"tba:25:room:2523":
  name: A Dark Passage
  description: >
    You are at the end of a dark passage which ends in a stout wooden door. Other then through the
    door, the only apparent exit is back the way you came.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    north:
      to: tba:25:room:2527
      door:
        keywords: [door, oak]
        kind: pickproof
        key: tba:25:obj:2522
        reset: locked
    south:
      to: tba:25:room:2522

"tba:25:room:2524":
  name: A Dark Passage
  description:
  - >
    You are at the end of a dark passage.  A half opened door is to the east, shedding soft light
    around the edges.  Faint snoring sounds can be heard behind the door.
  - Exits lead east through the door, or back west.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    east:
      to: tba:25:room:2528
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:25:room:2522

"tba:25:room:2525":
  name: The Stagnant Pool
  description:
  - >
    You are at the edge of a stagnant pool of water.  The smell here is quite nauseating.  This is
    apparently where the denizens of the tower dispose of their garbage.  Faint gurgling can be heard from
    beneath the surface of the pool.
  - Exits lead back north, or perhaps for the very adventurous, down into the pool.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    north:
      to: tba:25:room:2522
    down:
      to: tba:25:room:2529
      look: No light penetrates the gloom of the stagnant pool.

"tba:25:room:2526":
  name: A Dark Passage
  description:
  - >
    You are in a dark passage, which comes to an abrupt stop at what appears to be a cave-in to the
    west.  It is certainly unpassable, and perhaps quite dangerous just being this close.
  - The only exit leads back east.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    east:
      to: tba:25:room:2522

"tba:25:room:2527":
  name: A Dark Cell
  description:
  - >
    You are in a dark cell.  Straw and dirt cover the floors here, it is very dark.  Someone, or
    something seems to be chained to the far wall.
  - The only exit is back south.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    south:
      to: tba:25:room:2523
      door:
        keywords: [door, oak]
        kind: pickproof
        key: tba:25:obj:2522
        reset: locked

"tba:25:room:2528":
  name: The Jailor's office
  description:
  - >
    You are in the Jailor's office.  It is rather messy here.  Judging by the sleeping form of the
    Jailor on duty, you can surmise that very few, if any prisoners survive long enough to spend much time in
    these dank dungeons.
  - The only exit leads back west.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:25:room:2524
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:25:room:2529":
  name: Below The Stagnant Pool
  description: >
    As you dive beneath the putrid waters, you feel a strong tug and a whirlpool drags you under.  You
    are sucked into blackness.  You feel your lungs burst from lack of oxygen.  Just as you feel your
    life fading, you notice a change in direction... and are sucked under by a rip tide.
  sector: inside
  flags: [dark, no_mob, indoors, no_track]

"tba:25:room:2530":
  name: The Hallway
  description: >
    You are in a long hallway leading east and west.  The walls emit a faint magical glow which
    provides enough light to see by.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2532
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    east:
      to: tba:25:room:2531
    south:
      to: tba:25:room:2533
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    west:
      to: tba:25:room:2515

"tba:25:room:2531":
  name: A Bend In The Hallway
  description: >
    You are at a bend in the hallway.  The walls emit a faint magical glow which provides enough light
    to see by.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2534
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    east:
      to: tba:25:room:2536
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    south:
      to: tba:25:room:2535
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    west:
      to: tba:25:room:2530

"tba:25:room:2532":
  name: A Store Room
  description:
  - >
    You are in a small store room.  Assorted junk is piled on shelves or leaning against walls.
  - The only apparent exit it back south.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    south:
      to: tba:25:room:2530
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2533":
  name: A Broom Closet
  description:
  - >
    You are in a dark broom closet.  Many straw brooms and other cleaning instruments have been left
    here, apparently unused (perhaps the maid quit?).
  - The only exit leads back north to the hallway.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    north:
      to: tba:25:room:2530
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2534":
  name: A Hallway
  description: >
    You are in a long hallway leading north and south.  The walls emit a faint magical glow which
    provides enough light to see by.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2538
    east:
      to: tba:25:room:2537
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    south:
      to: tba:25:room:2531
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
  extras:
  - keywords: [walls, wall]
    text: The walls shed a warm light

"tba:25:room:2535":
  name: The Guardians' chamber
  description: >
    You are in the chamber of the tower guardians.  It is rather sparsely furnished, but then again the
    odd occupants don't look to need furniture. Here and there a disembodied pair of hands or eyes flits
    about.
  sector: inside
  flags: [indoors, no_track]
  exits:
    north:
      to: tba:25:room:2531
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2536":
  name: A Guest Bedroom
  description:
  - >
    You are in a small guest bedroom.  A small cot is in one corner, and a dusty mirror on one wall,
    other than that the room looks quite bare, and unused.
  - The only apparent exit leads back west to the hallway.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:25:room:2531
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
  extras:
  - keywords: [mirror]
    text: Why, someone seems to be looking back at you from the other side!

"tba:25:room:2537":
  name: A Guest Bedroom
  description:
  - >
    You are in a comfortable looking bedroom.  A small globe of magical energy floats overhead,
    providing light.  A small cot is in one corner looking ever so comfortable, so comfortable in fact...
    someone is sleeping in it.
  - The only apparent exit leads back west to the hallway.
  sector: inside
  flags: [indoors, no_track]
  exits:
    west:
      to: tba:25:room:2534
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed

"tba:25:room:2538":
  name: A hallway
  description:
  - >
    You are in a long hallway leading from the south.  The walls emit a faint magical glow which
    provides enough light to see by.
  - Stairs lead up to the next level and the hallway leads back south.
  sector: inside
  flags: [indoors, no_track]
  exits:
    east:
      to: tba:25:room:2539
      door:
        keywords: [door, wooden]
        kind: door
        reset: closed
    south:
      to: tba:25:room:2534
    up:
      to: tba:25:room:2540

"tba:25:room:2539":
  name: The Burnt Room
  description:
