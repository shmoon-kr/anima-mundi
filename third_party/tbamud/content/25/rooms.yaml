# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 25.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:25:room:2500":
  name: The Entrance To The Shadow Grove
  description:
  - >
    Before you, the grove of shadows lies.  Giant gray trees are all that can be seen through the thick
    shadows.  A great sense of both power and menace permeates the surrounding area.  You have a strange
    urge to turn back and go back the way you've come.
  - A small path leads north into the shadows and back south to the plains.
  sector: forest
  flags: [no_mob, no_track]
  exits:
    north:
      to: tba:25:room:2508
      look: The shadows obscure your vision.
    south:
      to: tba:40:room:4075
      look: The copse of trees and plains are back to the south.
  extras:
  - keywords: [info, credits]
    text: "DT: 2529"

"tba:25:room:2501":
  name: The Shadow Grove
  description:
  - >
    You are inside the shadow grove.  Giant trees seem to glare at you from all sides.  The shadowy
    mist obscures most of your vision.  Strange sounds of moaning and growling come from all directions.
  - All exits lead into shadows, you are very confused.
  sector: forest
  flags: [dark, no_mob, soundproof, no_track]
  exits:
    north:
      to: tba:25:room:2507
      look: The shadows obscure your vision.
    east:
      to: tba:25:room:2502
      look: The shadows obscure your vision.
    south:
      to: tba:25:room:2504
      look: The shadows obscure your vision.
    west:
      to: tba:25:room:2503
      look: The shadows obscure your vision.

