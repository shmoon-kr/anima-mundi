# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 117.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:117:room:11700":
  name: Dysprosic's Zone Description Room
  description:
  - "Zone name: Los Torres"
  - "Location: City"
  - "Levels: 10-15"
  - "Alignment: mostly neutral (:200 thorugh 200)"
  - >
    Theme: a community made of two towers (not based on LOTR :P) with one building containing shops,
    apartments for the members of the government and the supreme council and the other containing
    apartments for citizens.
  - >
    Plot: The government of Lost Torres is being unusually corrupt and ruthless to its citizens.  You
    must meet with a councillor and free the people of Los Torres.
  - There will be about 60 rooms in the area, around 30 mobs and approximately 40 objects.
  - Dysprosic
  sector: inside
  flags: [no_mob, peaceful, no_track, private]

"tba:117:room:11701":
  name: Pathway
  description: >
    This pathway leads to Los Torres.  It is laid with white stone and is lined with flowers of all
    colors.  The path takes you through a small forest of red leaved trees.  The towers are visible to the
    north.
  sector: forest
  flags: [no_mob]
  exits:
    north:
      to: tba:117:room:11702
  extras:
  - keywords: [trees, tree]
    text: The trees are skinny with beautiful red leaves.
  - keywords: [flowers, flower, path]
    text: >
      The path is lined with exotic flowers planted in the ground.  There seems to be something
      glimmering in the soil.
  - keywords: [soil, ground]
    text: The soil is a nice dark brown for all the flowers.  A ring is laying in the dirt.

"tba:117:room:11702":
  name: "Entrance to Tower #1(Shops and Executive Offices)"
  description: >
    The entrance to the first tower lies here.  It is a large archway where guards seem to be checking
    citizens as they enter.  There is a pathway that leads east to the second and seemingly taller
    tower.  This tower seems to be much wider than the other tower though.
  sector: city
  exits:
    north:
      to: tba:117:room:11703
    south:
      to: tba:117:room:11701
    west:
      to: tba:117:room:11705
  extras:
  - keywords: [tower]
    text: >
      The tower is very large, standing about 7-10 stories high as it looks from the ground.  Inside it
      are many people scuttling around the shops and restaurants.

"tba:117:room:11703":
  name: Lobby
  description: >
    The lobby of the tower is packed with shoppers.  To the west lies 'The Turkey's Gobble', a
    restaurant famous for it's broiled turkey.  To the north . is 'Defender's Dream', an armor shop with strong
    looking protective gear on display.  There is an orchestra playing in the center of the lobby, with
    many people sitting down at benches to listen to the majestic music.  Up above are the houses and
    offices of the members of the community government There are some pews lined around the center where the
    Orchestra plays.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11706
    east:
      to: tba:117:room:11751
    south:
      to: tba:117:room:11702
    west:
      to: tba:117:room:11704
    up:
      to: tba:117:room:11707
  extras:
  - keywords: [display]
    text: There are many fancy armors on display at 'Defender's Dream'.
  - keywords: [orchestra]
    text: >
      There is a full orchestra at the center of the lobby.  They are playing a song that seems to relax
      the soul and fit the scenery quite well.

"tba:117:room:11704":
  name: The Turkey's Gobble
  description: >
    The restaurant is very busy, most of the tables there are filled with customers.  The room is
    filled with decorations that look like they should be used for thanksgiving.  The walls are painted a dark
    brown and the ceiling is painted with a spiral that surrounds an enormous chandelier.  The
    chandelier seems out of place but still it is very pretty.  The man at the counter seems very pleasant as he
    takes orders from the customers and brings them their food.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    east:
      to: tba:117:room:11703
    down:
      to: tba:117:room:11758
      door:
        keywords: [floor]
        kind: door
        key: tba:117:obj:11700
        reset: locked
  extras:
  - keywords: [chandelier]
    text: >
      The chandelier is humongous and made of diamonds with brass candle holders. It illuminates the room
      with a pretty patterned shadow.
  - keywords: [table, tables]
    text: >
      The tables are round and are suitable for 4 people to sit at.  Theyr rather boring at the top but
      are very intricately cut at the bottim, making it look like a roman column.

"tba:117:room:11705":
  name: Pathway
  description: >
    The white path continues onward just outside of the red forest.  It leads from one tower of Los
    Torres to the next.  The path has been travelled on by numerous people though it is still in very good
    shape.  The forest seems endless when peered into from here.  This area seems like a nice place to
    relax.
  sector: city
  exits:
    east:
      to: tba:117:room:11702
    west:
      to: tba:117:room:11721
  extras:
  - keywords: [Path]
    text: >
      The white path has been kept up nicely for it's usage.  There are some spots from people walking on
      it repeatedly.  The brick is nicely layed in a diagonal fashion.
  - keywords: [towers]
    text: >
      The towers are tall and they seem to overlook all of the red forest surrounding it.  They are made
      of a gray stone and have many windows in the walls.
  - keywords: [forest]
    text: >
      The forest is seemingly endless from here.  The creatures make all sorts of pleasant noises and
      rustle around in the foliage.

"tba:117:room:11706":
  name: Lacela's Winery
  description: >
    Lacela's Winery is decorated elaborately with lace.  Lace, lace, lace.  Lace for drapes, lace for
    carpet and red stained lace for the countertop where Cassandra Lacela stands.  She probably has a
    drink or two when no one is looking.  In the back of the room is a large wine rack in which all her stock
    is kept.  She seems to have a lot of wines.  There is a lace rug laid on the floor in a sloppy
    manner.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    south:
      to: tba:117:room:11703
    down:
      to: tba:117:room:11752
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:117:obj:11718
        reset: locked
  extras:
  - keywords: [lace]
    text: It's everywhere!  Ahhh!!!!
  - keywords: [wine, rack]
    text: >
      The wine rack in the back of the room is huge.  It contains a lot of wines that are cooled by a
      large vent at the top.  It is sealed off with a glass door.

"tba:117:room:11707":
  name: Entrance to Council Officing
  description: >
    The platform above the lobby marks the entrance to the offices to all of the government officials. 
    The echoing marble floor leads to a large marble staircase that will take you up even further into
    the governmental section.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    north:
      to: tba:117:room:11708
    east:
      to: tba:117:room:11709
    west:
      to: tba:117:room:11710
    up:
      to: tba:117:room:11711
    down:
      to: tba:117:room:11703
  extras:
  - keywords: [marble, floor, staircase]
    text: >
      The floor is made with a black marble that echoes when walked on.  It sort of leads people to the
      large marble staircase leading upward.

"tba:117:room:11708":
  name: Gertrude's Office
  description: >
    The office reeks of an overwhelming perfume stench, probably caused by the open perfume bottle on
    the desk.  Papers on the desk are all messed up and the telephone is making a beeping noise because
    its off the hook.  Apparently the person who works here has no intention of being disturbed.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:117:room:11707
  extras:
  - keywords: [perfume, desk, papers, telephone]
    text: >
      The desk contains an open bottle of perfume, a messy pile of papers, and a telephone that is off
      the hook.

"tba:117:room:11709":
  name: Lesalie's Office
  description: >
    This room has been kept tidy and clean despite Lesalie's absence from office. The large desk in one
    corner has papers stacked all nice and neat, and the computer on the desk of highest quality.  The
    floor is a peach colored carpet immediately after the wooden door.  The wall is painted an off white
    color, with pictures of people hanging in various places.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:117:room:11707
  extras:
  - keywords: [door]
    text: >
      The door is made of wood and has been left open for people to come in and out as they please.
  - keywords: [wall, pictures]
    text: >
      The wall has been painted a nice off-white color all around the square room. It is dotted with
      hanging framed pictures of people that Lesalie knows.
  - keywords: [desk, computer]
    text: >
      The desk has papers neatly stacked papers in one corner, and a high quality computer on one side. 
      The desk seems larger than most other desks.

"tba:117:room:11710":
  name: Phel's Office
  description: >
    This room is extremely fancy looking.  Its walls are painted tan with a dark green border at the
    ceiling.  The ceiling has an elaborate fan which blows a nice breeze.  The desk in the center of the
    room is circular, complete with a nice computer, a telephone, some paperwork, and decorations.  The
    floor is made of marble just like the corridor.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:117:room:11707
  extras:
  - keywords: [celing, fan]
    text: >
      The smooth celing has an elaborate fan in the center which blows a soothing breeze in the room.
  - keywords: [desk, paperwork, decorations, computer, telephone]
    text: >
      The desk in the center of the room is circular, complete with a nice computer, a telephone, some
      paperwork, and decorations.
  - keywords: [wall, border]
    text: The wall is painted tan with a dark green border around the celing.

"tba:117:room:11711":
  name: Council Corridor
  description: >
    The room has a constant echoing sound due to people walking up and down the black marble stairs. 
    The side by side staircases lead both up a floor and down a floor.  There are wooden doors here that
    lead to some of the officials offices.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11712
    east:
      to: tba:117:room:11713
    west:
      to: tba:117:room:11714
    up:
      to: tba:117:room:11715
    down:
      to: tba:117:room:11707
  extras:
  - keywords: [doors]
    text: The doors in the room lead to some of the officials' offices.
  - keywords: [stairs, marble]
    text: >
      The black marble tiling echoes as people walk on it.  It sort of makes a path to two marble
      staircases that lead both up and down.

"tba:117:room:11712":
  name: Miranda's Office
  description: >
    The room is totally out of order.  It looks like there was some sort of struggle here!  The desk is
    broken in half, with papers scattering all over the floor.  The wall has been beaten in and cracked,
    with the window in the back being broken as well.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:117:room:11711
  extras:
  - keywords: [window]
    text: >
      The window has been broken, making a cold breeze swift in.  Shards of glass hang around its edges.
  - keywords: [desk]
    text: The desk has been ripped apart!
  - keywords: [wall]
    text: The walls have been beaten and cracked for some unknown reason
  - keywords: [papers]
    text: The papers are scattered across the floor in a disastrous manner.

"tba:117:room:11713":
  name: Cecille's Office
  description: >
    The first notable thing about this office is that it is unusually dark. There are no windows to
    give light, so all that is there to brighten up is a small lamp on the corner of the desk.  The drawers
    of the desk are open and contain a small amount of stacked papers.  The walls are painted a dark
    cobalt blue and the floor is of a green thick carpeting.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:117:room:11711
  extras:
  - keywords: [desk, lamp, drawers, papers]
    text: >
      On the desk is a small lamp that provides little light to this dark room. The drawers are partially
      filled with neatly stacked papers and folders.

"tba:117:room:11714":
  name: Johanes's Office
  description: >
    The room is very small compared to the other offices in the tower. Actually, its quite cramped in
    here!  The desk is hardly a desk at all; it has papers stuffed messily into files on one side and a
    tiny work space on the other side.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:117:room:11711
  extras:
  - keywords: [desk, papers, files]
    text: >
      The tiny desk has papers stuffed into files in a disorganized manner, and minimal work space.

"tba:117:room:11715":
  name: Upper Council Corridor
  description: >
    This is the area where the big shots of the council do their work.  They usually have a bigger say
    in what happens to the city, but not nearly as a powerful judgment as the Empress, who is above.  The
    marble pathway ends halfway through here and changes instantly into an ivory pathway, and the
    staircase leading up is ivory, unlike the marble staircase leading down.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11716
    east:
      to: tba:117:room:11717
    west:
      to: tba:117:room:11718
    up:
      to: tba:117:room:11719
    down:
      to: tba:117:room:11711
  extras:
  - keywords: [marble, ivory, stairs, staircases]
    text: >
      The psort of path is made of marble and ivory, with a marble staircase leading down and an ivory
      staircase leading up.

"tba:117:room:11716":
  name: Luther's Office
  description: >
    The room is surprisingly bare minus a desk and some governmental paperwork. Most of Luthers
    belongings are in cardboard boxes and suitcases as if he were to leave.  Everything else is totally bare. 
    The walls are white, the ceiling is white and bumpy, and the window isn't anything special.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:117:room:11715
  extras:
  - keywords: [desk, papers]
    text: The desk is bare minus a few articles of paperwork.
  - keywords: [suitcases, boxes]
    text: >
      The boxes and suitcases in the corner of the room are all packed with Luther's belongings.

"tba:117:room:11717":
  name: Visconti's Office
  description: >
    A really, really big desk is the most profound thing about the room.  It has intricately cut
    patterns on the sides and contains many drawers, filled with papers galore!  There is an extremely cool
    looking imperial tiling, and the walls are painted white, except for one red wall which gives a major
    accent. This guy has style!
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:117:room:11715
  extras:
  - keywords: [desk, papers]
    text: >
      The desk is very large and it has exquisite carved patterns on the sides. It is filled with
      paperwork galore!
  - keywords: [walls]
    text: >
      The walls are painted white, except for a dark red wall that gives a really nice accent into the
      room.

"tba:117:room:11718":
  name: Thedoric's Office
  description: >
    Red scrolls containing the writings and beliefs of Thedoric the powerful adorn the walls.  The
    paper filled desk is colored red and so are the curtains that shade the rather large window.  The floor
    is also made of a red wood like the desk, or maybe like the trees...
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:117:room:11715
  extras:
  - keywords: [desk, papers, floor]
    text: >
      The floor is made of the same red wood as the paper filled desk is.  It's also quite similar to the
      wood that the trees outside give...
  - keywords: [curtains, window]
    text: The rather large window has been shaded with grand red curtains.
  - keywords: [scrolls]
    text: The wall is adorned with red scrolls containing the writings and beliefs of Thedoric.

"tba:117:room:11719":
  name: Empress's Corridor
  description: >
    The room is made with ivory tiling, ivory celing and ivory walls.  The Empress must have some
    fondness for ivory!  There is a red carpet path leading to a very large and exquisite door.  The carped
    has been barricaded by gold posts dotting the edges linked with a rope made of velvet.  The corners of
    the room are filled in with quarters of Mediterranean columns.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11720
      door:
        keywords: [grand, doors]
        kind: door
        key: tba:117:obj:11700
    down:
      to: tba:117:room:11715
  extras:
  - keywords: [carpet, velvet, posts]
    text: The red carpet is barred off by golden posts linked together with velvet rope.
  - keywords: [doors]
    text: >
      The doors to the north are very large, exquisitely styled and make a huge creaking sound when
      opened.  A creaking sound that echoes throughout the entire tower.
  - keywords: [corners, colums]
    text: The corners are filled in with Mediterranean sytled column quarters.

"tba:117:room:11720":
  name: Empress Leraillia's Office
  description: >
    The room is completely covered in ivory!  Its actually quite pretty.  The tile surprisingly doesnt
    make a sound when it is walked on.  The ceiling is strangely high compared to the ceiling in the
    corridor.  The walls are draped with tapestries and beam lights that blare down and make a circle of
    light around the ivory desk in the middle.  The desk is accompanied by a very large ivory colored swivel
    chair.
  sector: inside
  flags: [indoors, peaceful]
  exits:
    south:
      to: tba:117:room:11719
  extras:
  - keywords: [ceiling]
    text: The ceiling is strangely high, almost out of sight!
  - keywords: [desk, chair]
    text: >
      The ivory desk is very nice, and so is the ivory colored chair.  It's only ivory colored, though. 
      It wouldn't be very comfy to sit in an ivory chair now, would it?
  - keywords: [walls, tapestries]
    text: The walls are draped with tapestries showing strange pictures and patterns.
  - keywords: [lights]
    text: >
      The lights are scattered at the top edges of the walls and point down to make a circle of light
      around the desk and the chair.

"tba:117:room:11721":
  name: Pathway
  description: >
    The pathway continues between the towers.  It seems to be cracked a lot more than the other parts
    of the path.  The sides are spruced with red trees like the ones in the forest.  The sounds of animals
    rustling in foliage is louder for some strange reason.  Citizens continue to walk past doing their
    own things and occasionally tripping on the various cracks in the path.  There seems to be a path to
    the south past the trees.
  sector: city
  exits:
    east:
      to: tba:117:room:11705
    south:
      to: tba:117:room:11753
      door:
        keywords: [forest]
        kind: door
        key: tba:117:obj:11700
        reset: closed
    west:
      to: tba:117:room:11722
  extras:
  - keywords: [trees, forest]
    text: >
      The forest is seemingly endless from here.  The sound of animals rustling in the forest is
      obscenely louder here.
  - keywords: [path, cracks]
    text: >
      The pathway that is usually nicely tidy isn't so much over here.  There are cracks in the path that
      are making the citizens unwillingly trip.

"tba:117:room:11722":
  name: The Town Plaza
  description: >
    The white path leads here, into a large circular park with large stumps people can sit on around
    the edge and a huge water fountain in the center that citizens are drinking from.  The most noticeable
    thing about the plaza is the gigantic tree in the northeast corner.  It is no ordinary tree around
    here, for the leaves are green!  The people gather around this mysterious tree and wonder why it could
    be such a bizarre color.  There are many brown footprints along the white tile, and the forest is
    still visible from here.  The sound of rummaging animals has been greatly overpowered by the sound of
    chatting people.
  sector: city
  exits:
    north:
      to: tba:117:room:11723
    east:
      to: tba:117:room:11721
  extras:
  - keywords: [tree]
    text: >
      The green tree in the northeast corner attracts many people.  They gather around it, sit next to
      it, they have lunch, all sorts of stuff.  The leaves are a strange color of green and the bark is
      brown.  It is extremely large even compared to the trees in the Red Forest.  It seems to be about half the
      height of the tower to the north.
  - keywords: [stumps]
    text: There are stumps along the edge of the park that are made so people can sit on them.
  - keywords: [citizens, tourists]
    text: There are many gathering citizens and tourists of Los Torres in the plaza.
  - keywords: [tile, footprints, path]
    text: >
      The white tile path is covered in brown footprints from the dirty boots and shoes of people.

"tba:117:room:11723":
  name: Pathway
  description: >
    This pathway is the junction between the plaza and the second tower.  The forest is only slightly
    visible from here, and the tile of the path is clean and beautiful flowers line the sides.  The
    looming gray stone tower is to the north and the town plaza is to the south.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:117:room:11724
    south:
      to: tba:117:room:11722
  extras:
  - keywords: [path, flowers]
    text: >
      The white tile path is clean swept and lined with gorgeous exotic flowers, including some
      {red}red{/red}, some {yellow}yellow{/yellow}, and some {green}green{/green} and a small amount of
      {blue}blue{/blue} ones.

"tba:117:room:11724":
  name: "Entrance to Tower #2 (Housing)"
  description: >
    The mediocre archway made of stone bears the gate to the domestic lives of Los Torres.  The tower
    stretches far up, though not so far as to drive anyone living at the top insane from vertigo.  It is
    made of dark gray stone and is spruced here and there with windows made of crystal clear glass.  The
    white pathway is kept nice and tidy for the citizens passing through.  The forest of red continues
    north even though the path ends here.
  sector: city
  exits:
    north:
      to: tba:117:room:11725
    south:
      to: tba:117:room:11723
  extras:
  - keywords: [tower, windows]
    text: >
      The tower stands high and is made of a dark gray colored stone.  Windows made of crystal clear
      glass appear occasionally on the wall.
  - keywords: [path]
    text: The white path ceases here, looking neat and tidy.
  - keywords: [archway]
    text: >
      The archway is made of a dark gray stone and isn't to impressive.  The gate underneath it leads
      into all the houses of the citizens of Los Torres.

"tba:117:room:11725":
  name: A Comfortable Lobby
  description: >
    A warm glow from this room makes it relaxing and comfortable to even look at. The floor is covered
    with a nice and soft red carpet with some strange square pattern along the sides. There are soft and
    squishy armchairs around tables and near a large stone fireplace. There is a brown wooden check in
    desk at the far side of the room, below a tan painted flat ceiling, with lights that blare and make the
    room bright.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11726
      door:
        keywords: [wall]
        kind: door
        key: tba:117:obj:11700
        reset: locked
    south:
      to: tba:117:room:11724
    west:
      to: tba:117:room:11727
  extras:
  - keywords: [carpet, pattern]
    text: The plush carpet is red with a bizarre pattern along the edges.
  - keywords: [celing, lights]
    text: >
      The celing is smoothed nicely and painted a nice tan that miixed well with the red carpet.  There
      are circular lights scattered across that blare making this room very, very bright.
  - keywords: [desk]
    text: >
      The desk on the far side is made of wood and very big.  It has brochures on a small rack
      advertising the shops of the other tower, and a broken silver bell marked "Ring for service.  "
  - keywords: [armchairs, tables]
    text: >
      There are very comfortable looking armchairs colored red that sircle around small wooden tables and
      the grand fireplace on the north wall.
  - keywords: [fireplace]
    text: >
      The fireplace is large and made of a tan colored stone, like the walls and the celing.  The fire
      roars and crackles warming the entire room.  One of the tiles on the side of the fireplace is kind of
      loose.

"tba:117:room:11726":
  name: Behind the Fireplace
  description: >
    The fireplace opened up and made a small passageway!  It's pretty bare made of gray stone, and it
    has a bunch of ash particles in the air.  It looks like the outside is just to the north.
  sector: inside
  flags: [indoors, tunnel]
  exits:
    north:
      to: tba:117:room:11748
    south:
      to: tba:117:room:11725

"tba:117:room:11727":
  name: Bottom of the Staircase
  description: >
    The staircase in the middle of the room spirals upward throughout the edge of the tower, leading to
    several platforms along the way to the top.  There are some exits to residences on this floor as
    well.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11746
    east:
      to: tba:117:room:11725
    south:
      to: tba:117:room:11747
    up:
      to: tba:117:room:11728
  extras:
  - keywords: [Staircase]
    text: The staircase spirals up to the top of the tower.

"tba:117:room:11728":
  name: Second Floor
  description: >
    The staircase continues upward throughout the edge of the tower.  The staircase continues both
    upwards and downwards.  There is a large round rug spread over the center of the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11729
    south:
      to: tba:117:room:11730
    up:
      to: tba:117:room:11731
    down:
      to: tba:117:room:11727
  extras:
  - keywords: [staircase]
    text: The spiral staircase continues up a floor and down a floor.
  - keywords: [rug]
    text: The rug is spread over the center of the floor, giving the room some atmosphere.

"tba:117:room:11729":
  name: Laundry Room
  description: >
    This is where most of the citizen's laundry is done.  There is a large washer and dryer set next to
    an even bigger pile of bagged clothes.  Each bag has their own tag showing where the laundry should
    go when it's finished.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:117:room:11728
  extras:
  - keywords: [bags, tags]
    text: The bags of laundry have tags saying where they go when they are done.
  - keywords: [washer, dryer]
    text: There is a large rumbling washer and dryer set.

"tba:117:room:11730":
  name: Chef's Room
  description: >
    The room has the heavy stench of onions and peppers to it.  There is an unusually large kitchen
    area totally stocked with pots, pans, and cooking ingredients.  There is a sofa outside of the kitchen,
    where the chef probably sleeps.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11728
  extras:
  - keywords: [kitchen, pots, pans, ingredients]
    text: >
      The kitchen area is very abnormally large and is filled with pots and pans. There are also some
      cooking ingredients visible in open cupboards.
  - keywords: [sofa]
    text: There is a big sofa soutside of the kitchen, where the chef presumably sleeps.

"tba:117:room:11731":
  name: Third Floor
  description: >
    The staircase continues upward once more, and still goes.  There are some ceiling lights here as it
    is rather dark.  There is a square rug in the middle of the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11732
    south:
      to: tba:117:room:11733
    up:
      to: tba:117:room:11734
    down:
      to: tba:117:room:11728
  extras:
  - keywords: [rug, floor]
    text: The square rug in the muddle of the floor gives the room a chic look.
  - keywords: [lights]
    text: The lights on the ceiling light the room up quite a bit.

"tba:117:room:11732":
  name: Dojo
  description: >
    This room has been fashioned into a Martial Arts training area.  There is a large mirror on the far
    wall and railings on the side walls.  There is a large mat on the ground where pupils can practice
    and stretch.  There are long flourescent lights lining the ceiling that make a slight humming sound.
  sector: inside
  exits:
    south:
      to: tba:117:room:11731
  extras:
  - keywords: [mat]
    text: This is a large yellow mat that students can practice what they know on.
  - keywords: [lights]
    text: >
      Large flourescent lights line the ceiling and make a quiet humming noise as they light the room.
  - keywords: [mirror]
    text: There is a really big mirror that stretches all across the far wall of the room.
  - keywords: [railing]
    text: Railings are on the side walls so that students can stretch easily.

"tba:117:room:11733":
  name: Standard Residence
  description: >
    This is just a plain old regular residence.  There is a bed in the corner, a living area with some
    sofas, and a kitchen area that has a few pots and pans in the sink.  This is pretty standard living.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11731
  extras:
  - keywords: [bed]
    text: The bed is made nicely and tucked away in the corner of the room.
  - keywords: [sofas, living]
    text: >
      There is a cozy looking living area with a couple of sofas gathered around a coffee table.
  - keywords: [kitchen, pots, pans]
    text: The kitchen area is fairly dirty, with some pots and pans lying in the sink.

"tba:117:room:11734":
  name: Fourth Floor
  description: >
    Yet again, the stairs lead upward.  This is the fourth floor, and there are an unusually large
    amount of windows in this room.  There is another circular rug in the center of the room.
  sector: inside
  exits:
    north:
      to: tba:117:room:11735
    south:
      to: tba:117:room:11736
    up:
      to: tba:117:room:11737
    down:
      to: tba:117:room:11731
  extras:
  - keywords: [rug]
    text: The people in this tower must like their rugs.
  - keywords: [staircase]
    text: More stairs, more stairs...  The stairs can take you down or up.

"tba:117:room:11735":
  name: Classroom
  description: >
    This is a standard school classroom for the children here.  There currently are no kids in here at
    the moment, though it is still very messy.  There is a chalk covered green chalkboard and there are
    turned over desks.  There are also a ton of muddy footprints leading to the exit.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:117:room:11734
  extras:
  - keywords: [footprints]
    text: A ton of muddy children's footprints lead to the exit.
  - keywords: [chalkboard]
    text: >
      The chalkboard is green and covered with chalk.  In some spots, there are crude drawings of flowers
      and clouds, and in others it's just a scribble.
  - keywords: [desks]
    text: Some of the desks in the classroom have been chaotically trned over for some reason.

"tba:117:room:11736":
  name: Playpen
  description: >
    Little kids...  Everywhere!  Little kids here, little kids there, they're running around and being
    really chaotic!  Somebody, make them stop!  Lots of them are tackling each other to the ground or
    playing tag.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11734
  extras:
  - keywords: [children, kids]
    text: The kids are behaving chaotically and are pretty much everywhere you look.

"tba:117:room:11737":
  name: Fifth Floor
  description: >
    This is a very tall tower!  The end must be near, for there is a small amount of light coming from
    the exit up.  Yet another square rug is placed in the center of the floor.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11738
    south:
      to: tba:117:room:11739
    up:
      to: tba:117:room:11740
    down:
      to: tba:117:room:11734
  extras:
  - keywords: [rug]
    text: Hmm, a square rug on the floor...  How original...
  - keywords: [staircase]
    text: >
      The stairway seems to be getting lighter as it goes upward.  Perhaps the top of the tower is near?

"tba:117:room:11738":
  name: Library
  description: >
    The library is kept very clean, and there doesn't seem to be a trace of dust in here.  There are
    books stacked on wooden shelves all over the place, and there are some people browsing through them.  A
    wooden desk near the exit is where people bring their books to check out of the library, though they
    should be brought back.
  sector: inside
  exits:
    south:
      to: tba:117:room:11737
  extras:
  - keywords: [bookshelves, citizens]
    text: >
      The wooden bookshelves all over the place hold a ton of books.  Citizens are browsing through them,
      looking for what they want.
  - keywords: [desk]
    text: Citizens bring books they've found here to check out and read for a bit.
  - keywords: [dust]
    text: Amazingly, there isn't any!

"tba:117:room:11739":
  name: Bathroom
  description: >
    This could possibly be the worst location for the bathroom in the world... There are urinals on the
    left wall with dividers in between them, and there are toilet stalls at the rear with blue paint. 
    There are sinks on the east wall, though most of them have an 'out of order' sign attached to them.
  sector: inside
  exits:
    north:
      to: tba:117:room:11737
  extras:
  - keywords: [sinks]
    text: >
      There are sinks on the east wall, some of them have yellow pot-it-notes with 'out of order' written
      on them attached.
  - keywords: [stalls, toilet]
    text: Toilet stalls are on the rear wall with blue paint on them.
  - keywords: [urinals, dividers]
    text: >
      On the west wall are urinals with dividers in between them, so nobody can sneak a peek, even if
      they wanted to.

"tba:117:room:11740":
  name: Sixth Floor
  description: >
    This is the final floor inside the tower, the top is just above.  Light pours in from the exit up. 
    There isn't a rug in the center of the floor, but instead, a small statue dedicated to Thedoric, of
    all people.
  sector: inside
  exits:
    north:
      to: tba:117:room:11741
    south:
      to: tba:117:room:11742
    up:
      to: tba:117:room:11743
    down:
      to: tba:117:room:11737
  extras:
  - keywords: [light, stairway]
    text: >
      The stairway up leads to the top, where all the light is coming from. Downstairs the rooms are a
      bit darker.
  - keywords: [statue, thedoric]
    text: >
      In the center of the room is a small statue dedicated to Thedoric, who is doing a dramatic pose. 
      By the looks of it, he hasn't really done anything.

"tba:117:room:11741":
  name: Standard Residence
  description: >
    This is just a plain old regular residence.  There is a bed in the corner, a living area with some
    sofas, and a kitchen area that has a few pots and pans in the sink.  This is pretty standard living.
  sector: inside
  exits:
    south:
      to: tba:117:room:11740
  extras:
  - keywords: [bed]
    text: The bed is made nicely and tucked away in the corner of the room.
  - keywords: [kitchen, pots, pans]
    text: The kitchen area is fairly dirty, with some pots and pans lying in the sink.
  - keywords: [sefas, living]
    text: >
      There is a cozy looking living area with a couple of sofas gathered around a coffee table.

"tba:117:room:11742":
  name: Empty Room
  description: >
    Strange...  This room is totally empty...  The walls are painted white along with the ceiling and
    the floor, and there isn't anything special about the window...  Maybe someone is going to move in
    soon?
  sector: inside
  exits:
    north:
      to: tba:117:room:11740
  extras:
  - keywords: [walls, ceiling, floor]
    text: The walls, ceiling and floor are all painted white.
  - keywords: [window]
    text: There isn't anything special about this window...

"tba:117:room:11743":
  name: Top of the Tower
  description: >
    The top of the tower was recently made usable courtesy of Government Official Visconti's planning,
    though Thedoric takes all the credit.  That must be what the statue downstairs is for.  There are
    little extended balconies to relax on to the north and to the south.  Other than that, the only place
    left to go is all the way back down.
  sector: city
  exits:
    north:
      to: tba:117:room:11744
    south:
      to: tba:117:room:11745
    down:
      to: tba:117:room:11740
  extras:
  - keywords: [balconies]
    text: To the north and the south are extended balconies to the tower.
  - keywords: [stairs]
    text: The stairs only lead back down into the tower.

"tba:117:room:11744":
  name: North Balcony
  description: >
    The balcony is a stone extension of the top of the tower.  This place is very calm and there is an
    endless view of red trees from here.  The forest seems like it has so many mysteries...
  sector: city
  exits:
    south:
      to: tba:117:room:11743
  extras:
  - keywords: [view, forest, trees]
    text: There is an endless view of the Red Forest from here.  It is extremely relaxing
  - keywords: [balcony]
    text: >
      The balcony is a stone extension of the tower.  It is made of pewter and has a large railing
      surrounding it to prevent anyone from falling.

"tba:117:room:11745":
  name: South Balcony
  description: >
    The south balcony is an extension from the top of the tower.  From here the town below is visible. 
    Citizens are talking, though the noise doesn't seem to echo all the way up to here.  There are a
    couple chairs here so that people can relax in them and take in the view.
  sector: city
  exits:
    north:
      to: tba:117:room:11743
  extras:
  - keywords: [view, citizens, town]
    text: >
      The the entire outside town of Los Torres is visible from here.  Talking citizens are noticable,
      but the sound doesn't reach up this far.
  - keywords: [chairs]
    text: There are metal chairs places here so that citizens can look down and relax.

"tba:117:room:11746":
  name: Standard Residence
  description: >
    This is just a plain old regular residence.  There is a bed in the corner, a living area with some
    sofas, and a kitchen area that has a few pots and pans in the sink.  This is pretty standard living.
  sector: inside
  exits:
    south:
      to: tba:117:room:11727
  extras:
  - keywords: [bed]
    text: The bed is made nicely and tucked away in a corner of the room.
  - keywords: [living, sofas]
    text: There is a cozy looking living area with a couple sofas gathered around a coffee table.
  - keywords: [kitchen, pots, pans]
    text: The kitchen area is fairly dirty, with some pots and pans laying in the sink.

"tba:117:room:11747":
  name: Artist's Residence
  description: >
    This is obviously where an artist lives.  There are paintings and empty canvases hung up everywhere
    within the room.  The room itself isn't painted much except for paint splashes from mistakes.  The
    bed in the corner of the room is rather small but it seems cozy.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:117:room:11727
  extras:
  - keywords: [paintings, canvases]
    text: >
      There are paintings and canvases along the walls.  There are splashes of paint behind the art that
      are the wall's only decorations.
  - keywords: [bed]
    text: The bed is very small, though it looks very cozy.

"tba:117:room:11748":
  name: Path Behind the Tower
  description: >
    This is a hidden path behind the tower!  To the north you can see a bit more path, and to the south
    is the small opening that the firelace opened up.  The forest continues indefinitely in all
    directions otherwise
  sector: forest
  exits:
    north:
      to: tba:117:room:11749
    south:
      to: tba:117:room:11726

"tba:117:room:11749":
  name: End of Secret Path
  description: >
    The little path behind the tower stops here.  Red trees surround everywhrere except for the tiny
    row to the south.  The light is totally blocked out from the thick canopy, and so is any vision
    upward.  It is now clear why this spot isn't visible from the towers.
  sector: forest
  exits:
    south:
      to: tba:117:room:11748

"tba:117:room:11751":
  name: Defender's Dream
  description: >
    Defender's Dream is a store dealing with armor and weapons.  There are all sorts of things on
    display from a large gray sword to a blue helm with a face mask.  There is a sign that says 'Items on
    display are for DISPLAY ONLY, DO NOT TOUCH' The floor is a white tile which has been stained with many
    footprints from all the shoppers.  The ceiling is painted a rather alarming shade of red that makes
    people jump when they see it for the first time.  The walls are painted of a scene as if the room is at
    the top of a mountain and all below and around is a large green forest and a blue sky with clouds.
  sector: inside
  flags: [indoors, no_magic]
  exits:
    west:
      to: tba:117:room:11703
  extras:
  - keywords: [display, sign]
    text: >
      The weapons and armor on display are rather nice.  A sign hangs near the display that says 'Items
      on display are for DISPLAY ONLY, DO NOT TOUCH'.
  - keywords: [celind]
    text: >
      The celing is painted a shade of red that is way too bright for it's own good.  It makes most
      people jump when they see it.
  - keywords: [floor, footprints]
    text: >
      The white tile floor has been stained with muddy footprints from all the shoppers that have browsed
      around the store.

"tba:117:room:11752":
  name: Wine Cellar
  description: >
    The wine cellar smells like expired wine like nobody could believe!  There are barrels that were
    supposed to be used for wine, but apparently have never been used since last year!  The stone walls are
    all wet and moldy, and there is fingus growing on some patches of the floor.  Cobwebs are present in
    every nook and cranny of the room.  It seems like nobody has kept this place tidy in quite some time!
  sector: inside
  flags: [dark, indoors, private]
  exits:
    up:
      to: tba:117:room:11706
      look: Lacela's Winery is above you.
      door:
        keywords: [trapdoor]
        kind: pickproof
        key: tba:117:obj:11718
  extras:
  - keywords: [barrels]
    text: >
      The wooden barrels are the source of the wine like stench in the room.  At first glance they seemed
      empty, though since it's so dark it's hard to see anything.  The barrels are actually filled with a
      dark red blood!
  - keywords: [cobwebs]
    text: >
      The amount of cobwebs in the room is ridiculous!  They are present in every nook and cranny you can
      see.
  - keywords: [mold, walls]
    text: The walls are filthy and covered in mold.
  - keywords: [fungus, fungi, floors]
    text: The floos have patches of fungi growing on them.

"tba:117:room:11753":
  name: Inside the Forest
  description: >
    The path does not follow into the forest and all that shows you a way are torn down red trees and
    flattened red grass with leaves and twigs crunching on the ground.  The noises of animals running
    around are now followed by noises of things attacking animals, and making them run around.  One stump off
    of the 'path' is rather large compared to the other tree stumps.  There is a blockade of trees that
    seems to block any further movement.
  sector: forest
  flags: [no_mob, no_track]
  exits:
    north:
      to: tba:117:room:11721
      door:
        keywords: [forest]
        kind: door
        key: tba:117:obj:11700
        reset: closed
    south:
      to: tba:117:room:11754
      door:
        keywords: [blockade]
        kind: door
        key: tba:117:obj:11700
        reset: locked
  extras:
  - keywords: [stump]
    text: >
      The stump is rather grand in comparison with the other stumps on the trail. It is wide and has
      thousands of little rings signifying that it was very old. The tree that was cut down must have been just
      as obscure as this stump.
  - keywords: [foliage, twigs, leaves, trees]
    text: >
      The scenery is completely filled with twigs, trees, stumps, leaves and other foliage.  All of which
      seem to have an appropriate shade of red to them.

"tba:117:room:11754":
  name: The Red Forest
  description: >
    The path continues into the vast forest.  It is more defined than the path before the blockade. 
    This seems to be some sort of hideout for a faction within the community.  A sign etched into a tree
    trunk reads 'Red Assassins'.  The tree trunks stretch up for a long distance and suddenly disappear
    within an impossibly thick canopy.
  sector: forest
  flags: [dark]
  exits:
    north:
      to: tba:117:room:11753
    east:
      to: tba:117:room:11757
    west:
      to: tba:117:room:11755
  extras:
  - keywords: [trees]
    text: >
      The trees stretch up for a really long distance.  The red canopy of leaves suddenly swallows them
      up without a trace.  One of the trees is engraved with 'Red Assassins' in the bark.
  - keywords: [path]
    text: >
      The path is scattered with red stumps, broken trigs and red leaves.  It is more visible than the
      path outside the blockade of trees.

"tba:117:room:11755":
  name: A Sudden End
  description: >
    The path in the forest comes to another end.  There aren't any more stumps in the path and the
    forest seems to be getting somewhat darker.  The trees on the side of the path are withered away and a
    bit dead but the source of the problem is not clear.  There is a small squirrel's nest in the branches
    of a lively tree placed over a peculiar patch of yellow sand on the ground.
  sector: forest
  flags: [dark, no_track]
  exits:
    east:
      to: tba:117:room:11754
    down:
      to: tba:117:room:11756
      door:
        keywords: [sand]
        kind: door
        key: tba:117:obj:11700
        reset: locked
  extras:
  - keywords: [path]
    text: >
      The path is stumpless and clear, except when it comes to a rather sudden end. It leads to the
      peculiar patch of sand below a lively tree.
  - keywords: [sand]
    text: >
      There is a small and out of place patch of yellow sand at the end of the path.  It seems to have no
      important purpose here.
  - keywords: [nest]
    text: >
      The nest is made of tiny leaves and placed cutely in the brances of a still living tree.  It is so
      close you could reach out and touch it.
  - keywords: [trees]
    text: The trees are somewhat withered away and dead.  The source of this is unclear.

"tba:117:room:11756":
  name: Under the Forest
  description: >
    The forest leads down into this mysterious cave.  There are no clues around here as to what this
    place is.  The pile of sand in the back of the room leads up to the forest, or the path in the cave
    continues on east into the darkness.
  sector: inside
  flags: [no_mob]
  exits:
    east:
      to: tba:117:room:11759
    up:
      to: tba:117:room:11755
  extras:
  - keywords: [sand]
    text: The pile of sand in the back leads to a hole which can be used to exit the cave.

"tba:117:room:11757":
  name: Alcove in the Forest
  description: >
    This is a small alcove of the lively red forest.  There are trees and hedges blocking the way
    forth, except for a small hole in the 'wall'.  The pathway outside Los Torres is visible from here!  The
    'wall' is enforced with rocks and covered with leaves to hide it from anyone seeing it.  The hole is
    strategically placed to maybe spy on anyone walking past.
  sector: forest
  exits:
    west:
      to: tba:117:room:11754
  extras:
  - keywords: [wall, trees, hedges, hole]
    text: >
      The passage is stopped by a wall of trees.  Or more like leaves and trees covering a stone wall
      with a hole in it.  The hole seems like it would be used to spy on people or maybe fire something at
      them!

"tba:117:room:11758":
  name: The Basement
  description: >
    This hidden and dark room almost seems like it has never been opened before. The only light that
    the room has is from the gaping hole made in the floor of The Turkey's Gobble by the chandelier.  The
    floor is dry, though rough and there are cobwebs EVERYWHERE from the celing to the foor.  The room is
    totally bare otherwise.
  sector: inside
  flags: [no_mob, indoors]
  exits:
    up:
      to: tba:117:room:11704
  extras:
  - keywords: [cobwebs]
    text: >
      Cobwebs are in every direction of the room, I mean, everywhere.  It is impossible to move without
      touching 20 cobwebs.  It's that bad.
  - keywords: [hole]
    text: >
      There is a large hole in the celing from the Chandelier breaking through the floor of The Turkey's
      Gobble.

"tba:117:room:11759":
  name: In a Mysterious Cave
  description: >
    The cave leads in further and the light gets dimmer and dimmer with each foot inward.  There isn't
    much here to look at other than a gray rock wall and a couple of stalactices.  There is a wooden wall
    with a door that has a barred window to the east.  There are moaning sounds coming from inside the
    door. There is a putrid smell of urine in this room.
  sector: inside
  flags: [dark, indoors, no_track]
  exits:
    east:
      to: tba:117:room:11760
      door:
        keywords: [door]
        kind: pickproof
        key: tba:117:obj:11734
        reset: locked
    west:
      to: tba:117:room:11756
  extras:
  - keywords: [wall, door]
    text: >
      The wall to the east is made of splintery dark wood.  There is a door in the wall that has barred
      windows and a rusty looking handle.  There is a smell of urine and excrement...  Also the bitter smell
      of blood!
  - keywords: [stalactices]
    text: The stalactites drip water from the celing making an annoying sound with each drop.

"tba:117:room:11760":
  name: Prison Cell
  description: >
    Smells of urine and excrement coming from a small pile in the corner fill the room.  There is a
    machine here that is pumping blood from the ground!  There are barrels of blood stacked next to it in a
    pyramid-like fashion.  The room is formed by an ending in the cave with the wall to separate it from
    the rest. From the celing to the floor is a damp solution, making the entire room slippery.  There
    are some stray red roots protruding from the celing, giving a clue that this place must be fairly close
    to the ground.
  sector: inside
  flags: [no_mob]
  exits:
    west:
