# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 312.
# keywords: words to name it in commands; short: in sentences ("the pit beast"); long: its line in a room.
# combat.armor is tbaMUD's armor class / 10 (lower is better); hit_points and damage: a number, or dice NdS+B when rolled.
"tba:312:mob:31200":
  keywords: [alain, longstride, man]
  short: Alain Longstride
  long: Alain Longstride strides about the area, protecting the innocent lepers.
  description: >
    Alain is probably the only man on the island who is not a leper himself. His mother was sent here
    when he was a baby.  When he became old enough, he journied for many months to get to this place. 
    Upon arrival, he found that she had already submitted to the Eternal Flame.  Heartbroken, he wept for
    days. When he finially came to his senses, he vowed that no leper would ever again be prosecuted, and
    so he set about protecting them and their awful home as best he could.
  level: 30
  sex: male
  alignment: 800
  flags: [aware, stay_zone, memory, helper]
  affects: [no_track]
  combat:
    thac0: 10
    armor: -8
    hit_points: 6d6+300
    damage: 5d5+5
  gold: 300
  exp: 90000
  position:
    load: standing
    default: standing

