    place a terrible adventuring spot.  Soft walls of this sink hole crumbles slowly expanding it's diameter
    century over century.  Absolutely no light penetrates into this cavern trapping humid coldness in
    the air and a nerve racking silence.
  sector: inside
  exits:
    south:
      to: tba:107:room:10770
