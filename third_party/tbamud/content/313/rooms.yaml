"tba:313:room:31384":
  name: Blackened Battleground
  description: >
    This may have once been a verdant field, full of greenery and bloom of whatever crop a farmer might
    choose.  That was before.  Being that this is the most centrally located field in the farmlands, the
    defenders chose this place for their major battles.  Many of the raiders have been defeated in this
    area but as of yet the foe is still not vanquished for good.
  sector: inside
  exits:
