"tba:313:room:31351":
  name: A Crude Barricade
  description: >
    The heaped remains of the farmhouse and barn - that which hasn't been burned to ash - has been
    erected into a barricade against goblin intrusion.  A large hole has been dug in the earth to accomodate
    more space and protection from the cold nights.  All of this is butt up against the rock wall of the
    valley on the east side.  To north and west are the burnt and scorched fields.
  sector: inside
  exits:
    north:
      to: tba:313:room:31350
