# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 313.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:313:room:31300":
  name: At the South Gate to Ofingia
  description: >
    Looking south toward what should be the farming capitol of Dibrova, an intense weight of sorrow for
    the men and women who farmed there, lived there, loved there, and died there staggers you with the
    sheer immensity of the crimes done them.  The sky which once was nearly always blue and clear is
    filled now with char and soot, carried upon winds of smoke and ash from the goblin raids which took this
    peaceful community by surprise.  The gate to the north always stays closed and barred from the inside,
    vigilant guards on the ramparts watching for any signs of trouble and bidding you a safe journey.
  sector: inside
  exits:
    east:
      to: tba:313:room:31301
    south:
      to: tba:313:room:31306
    west:
      to: tba:313:room:31304
  extras:
  - keywords: [credits]
    text: >
      *Shattered Farmlands of Ofingia *Written by Kaan for Dibrova Level: 8 - 15 94 rooms 13 mobs 27 objs
      Connector Zones: Ofingia After making Ofingia a Hometown on Dibrova and having it basically in the
      middle of BFE, I decided it might be a good idea to stick a zone in that would be close in proximity
      to Ofingia and have some mobs available that were low level, made just for players fresh out of the
      Newbie Zones. This is not a very exciting area, I will be the first to admit. There are a number of
      same-room descrips in this one that make the zone slightly blah. The objs are all intended to be for
      lower level players, same as the mobs. The plot is supposed to feed off the already existing plot that
      Ofingia had from the start: The goblins have the town under seige, they have ransacked these farmlands
      in an attempt to prohibit the town from having any food supplies. They constantly come in and loot
      and burn everything they can find to further the town's losses. The Lord of Jareth has sent in a
      retinue of his finest to help quell the threat, however they are unaffective against the numbers of
      goblins in the area. Hope you like it. Exits: 07s, 16s Links: 00n cave, 33w cave

"tba:313:room:31301":
  name: The Rocky Flatlands at the City Wall
  description: >
    Jagged rocks rise from their resting places in the earth the solid rock formations being what
    Ofingia was built upon.  Just to south a ways, the rocks taper off and open up a small valley where one of
    the many farmland fields of this area are.  Of course, the fields are no longer as cared for as they
    once were, being that every time any farmer makes an attempt at replanting a field, a band of
    goblins come along and burn it to ash and kill the farmer.  The city wall lies to the north - a tall, thick
    obstuction which is the town's only defense against the goblin hoardes which attempt to overrun the
    town daily.
  sector: inside
  exits:
    east:
      to: tba:313:room:31302
    south:
      to: tba:313:room:31307
    west:
      to: tba:313:room:31300

"tba:313:room:31302":
  name: At the Wall of Ofingia
  description: >
    The southern wall of Ofingia stands tall and impregnable on the north side. To the east, the
    jumbled upon which you stand drops off into a large field which may once have been growing tall with corn
    but now only boasts a few scorched stalks.  South is much the same, a steep drop off down into the
    burnt-out field. It does not appear that the way down in either direction is safe - it is recommended
    that another way be found.
  sector: inside
  exits:
    west:
      to: tba:313:room:31301

"tba:313:room:31303":
  name: Rocky Flatlands at the City Wall
  description: >
    On the north side the south wall of Ofingia rises thirty feet up, solid and unyielding.  Stolid
    faces look down upon you from the ramparts, faces of men and women who have known much pain and
    injustice from the goblins who continually raid this town.  To the south and west are steep rocky drop-offs,
    too steep for climbing.  They lead down into the farming area, where the soil is rich and strong when
    its not being burnt by goblins or trampled by the feet of marching soldiers.
  sector: inside
  exits:
    east:
      to: tba:313:room:31304

"tba:313:room:31304":
  name: At the City Wall
  description: >
    The wall of Ofingia rises high on the north side, the way kept blocked by the impenetrable wall
    which the citizens have fortified and refortified against goblin intrusion.  The ground here is rocky
    and without growth, the rock bed which Ofingia was built upon stands higher than the rest of the land
    around it.
  sector: inside
  exits:
    east:
      to: tba:313:room:31300
    south:
      to: tba:313:room:31305
    west:
      to: tba:313:room:31303

"tba:313:room:31305":
  name: The Outer Rocklands of Ofingia
  description: >
    This is the far southwest edge of the rocklands which Ofingia was built upon. To the south and west
    the rocklands drop steeply away down into the farming land which Ofingia is so famous for.  Stone
    causeways riddle passage on higher ground through the farmlands, seperating each field with a solid
    wall of rock and scree which is used as the main roadway.  The town of Ofingia lies to the north.
  sector: inside
  exits:
    north:
      to: tba:313:room:31304
    east:
      to: tba:313:room:31306

"tba:313:room:31306":
  name: The Outer Rocklands of Ofingia
  description: >
    This is the far southwest edge of the rocklands which Ofingia was built upon. To the southeast and
    southwest the rocklands drop steeply away down into the farming land which Ofingia is so famous for. 
    Stone causeways riddle passage on higher ground through the farmlands, seperating each field with a
    solid wall of rock and scree which is used as the main roadway.  The town of Ofingia lies to the
    north, the beginning of the causeway lies south.
  sector: inside
  exits:
    north:
      to: tba:313:room:31300
    east:
      to: tba:313:room:31307
    south:
      to: tba:313:room:31308
    west:
      to: tba:313:room:31305

"tba:313:room:31307":
  name: The Outer Rocklands of Ofingia
  description: >
    This is the far southeast edge of the rocklands which Ofingia was built upon. To the south and east
    the rocklands drop steeply away down into the farming land which Ofingia is so famous for.  Stone
    causeways riddle passage on higher ground through the farmlands, seperating each field with a solid
    wall of rock and scree which is used as the main roadway.  The town of Ofingia lies to the north.
  sector: inside
  exits:
    north:
      to: tba:313:room:31301
    west:
      to: tba:313:room:31306

"tba:313:room:31308":
  name: A Breathtaking View
  description: >
    The start of the walkway begins here, the tall manmade rock causeway that spans over most of the
    farming area of Ofingia.  From this height, most of the farmlands and the small homes within those
    areas can be seen.  At one time, an artist could probably have been struck with wonder and awe at the
    beauty of this vast, organized farming area.  Now the fields - once green and verdant with life - are
    burnt and smoking.  Farmhouses have been all but erradicated by the roving hoardes of giblins from the
    mountain caverns to the north.  The causeway leads south into the smoke and soot or north toward the
    city.
  sector: inside
  exits:
    north:
      to: tba:313:room:31306
    south:
      to: tba:313:room:31309

"tba:313:room:31309":
  name: On the Causeway
  description: >
    To the east and west the rock slopes downward into farming areas, where the field are burnt and
    twisted from the ravages of battle.  Occasionally in the fields below, a figure or two can be seen
    running crouched over from one spot to another trying not be seen.  Small pockets of fighting can be heard
    if not seen in the areas below.  It is rumored that the Lord of Jareth sent reinforcements for the
    town to try and eliminate the threat of the goblins, maybe that is what the sounds are from.
  sector: inside
  exits:
    north:
      to: tba:313:room:31308
    south:
      to: tba:313:room:31310

"tba:313:room:31310":
  name: High Upon the Causeway
  description: >
    All of the smoke and ash from the burnt-out fields has risen into the air, rising to this higher
    elevation where it has made breathing almost difficult. The causeway runs north and south with the
    fields below on the east and west.
  sector: inside
  exits:
    north:
      to: tba:313:room:31309
    south:
      to: tba:313:room:31311

"tba:313:room:31311":
  name: Stone Causeway
  description: >
    The causeway splits off to the east at this point, also continuing south and north.  The high wall
    of Ofingia can be seen off to the north, fields full of charred and smoking crops lie northeast, west
    and souteast from here.
  sector: inside
  exits:
    north:
      to: tba:313:room:31310
    east:
      to: tba:313:room:31312
    south:
      to: tba:313:room:31330

"tba:313:room:31312":
  name: Narrow Causeway
  description: >
    This section of the causeway narrows somewhat, only wide enough for one cart to pass at this
    point.  It continues far to the east, heading over many fields which lie in smoky ruins.  To the west, the
    causeway comes to a juncture where it splits north and south.
  sector: inside
  exits:
    east:
      to: tba:313:room:31313
    west:
      to: tba:313:room:31311

"tba:313:room:31313":
  name: Narrow Causeway
  description: >
    This section of the causeway narrows somewhat, only wide enough for one cart to pass at this
    point.  It continues far to the east, heading over many fields which lie in smoky ruins.  Far to the west,
    the causeway comes to a juncture where it splits north and south.
  sector: inside
  exits:
    east:
      to: tba:313:room:31314
    west:
      to: tba:313:room:31312

"tba:313:room:31314":
  name: A Split in the Causeway
  description: >
    A small, almost unfinished section of the causeway runs off to the east running through a smaller
    set of fields.  It appears that maybe this fields were just recently cultivated before the raids
    began.  Now, of course, they are in ruin - smoking and burnt almost beyond repair.  To the south, a wider
    stretch of the causeway runs south through some of the larger and more profitable fields of the area.
  sector: inside
  exits:
    east:
      to: tba:313:room:31315
    south:
      to: tba:313:room:31319
    west:
      to: tba:313:room:31313

"tba:313:room:31315":
  name: Poorly-made Section of the Causeway
  description: >
    This area of the farmlands appears to either have been very new during the time when the raids
    began or else it was destroyed by the raids, broken down into its current state by goblins intent on
    destroying everything in their path.
  sector: inside
  exits:
    north:
      to: tba:313:room:31316
    west:
      to: tba:313:room:31314

"tba:313:room:31316":
  name: Strewn Rubble Causeway
  description: >
    The causeway barely affords any travel to the north.  It has been left either unfinished or has
    been broken down to the point of almost unusability.  Small fields lie to the north and south, burnt and
    ravaged just like the rest of this area.
  sector: inside
  exits:
    north:
      to: tba:313:room:31317
    south:
      to: tba:313:room:31315

"tba:313:room:31317":
  name: The End of the Causeway
  description: >
    It appears that it may be possible to climb east down the rubble onto the flat farmlands from this
    elevated position, however if you wish to stay upon the causeway with a good vantage point you will
    have to head back to the west.  As it is now, the causeway has broken down to the point where it is
    only five feet higher at the most than the fields it runs through.
  sector: inside
  exits:
    east:
      to: tba:313:room:31318
    south:
      to: tba:313:room:31316

"tba:313:room:31318":
  name: The Base of the Causeway
  description: >
    Chunks of stone and rubble lie scattered, as if someone were still working on extending this
    section of the causeway further into the fields to make room for more farming.  To the south, an enormous
    field of scorched earth strectches toward the horizon, the same true of the blackened fields to the
    north.  You may climb back up onto the causeway to the west if that is your intent.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:313:room:31374
    south:
      to: tba:313:room:31339
    west:
      to: tba:313:room:31317

"tba:313:room:31319":
  name: The Eastern Causeway
  description: >
    This small section of causeway, called the Eastern Causeway because it runs at the farmlands'
    farthest east section, runs through area splitting the main field to the west from the Eastern Field to
    the east.  Just north of here is where the Eastern Causeway meets another, splitting off to the east
    and west.
  sector: inside
  exits:
    north:
      to: tba:313:room:31314
    south:
      to: tba:313:room:31320
    down:
      to: tba:313:room:31385

"tba:313:room:31320":
  name: The Eastern Causeway
  description: >
    This small section of causeway, called the Eastern Causeway because it runs at the farmlands'
    farthest east section, runs through area splitting the main field to the west from the Eastern Field to
    the east.
  sector: inside
  exits:
    north:
      to: tba:313:room:31319
    south:
      to: tba:313:room:31321

"tba:313:room:31321":
  name: The Eastern Causeway
  description: >
    You stand atop the center of the Eastern Causeway, the causeway that separates the far Eastern
    Field from the rest of the farmlands.  The top of this stone walkway is clear and wide, large enough to
    accomodate a couple of wagons side by side.  The only obstruction is the occasional body part or stray
    piece of armor that has fallen from the battles fought through this area.
  sector: inside
  exits:
    north:
      to: tba:313:room:31320
    south:
      to: tba:313:room:31322

"tba:313:room:31322":
  name: South End of the Eastern Causeway
  description: >
    A great amount of fighting must have been centered in this area, as the whole top of the causeway
    here is strewn with body parts, stained in blood and littered with crude weapons and armor.  The
    fields below - on every side - still smoke in places, with the occasional clang of armor and weapons
    reaching your ears.
  sector: inside
  exits:
    north:
      to: tba:313:room:31321
    south:
      to: tba:313:room:31323

"tba:313:room:31323":
  name: The Southeastern Corner
  description: >
    The Eastern Causeway ends at this point, another section of it heading west through more of the
    farmlands.  To the south is a fairly large plot of land owned and farmed - until recently - by Jon
    Boggins, the first farmer in this area.  His land is now scorched and ruined with no hope of a crop for at
    least a couple more years until the soil repairs itself.  The folk of Ofingia have only seen Jon
    once since the raids began, when he came into town to ask for military help from the mayor.  Jon's farm
    was the first hit by the raids, and the mayor thought that it would be a one-time occurance.  Since
    the town forces were already fighting in the caverns east of town and were few in number to start
    with, the mayor refused Jon his help.  Jon spit in the mayor's face and vowed never to pay another dime
    in taxes.  The only communication from Jon was a cart bearing his farm's crest sent into town bearing
    the remains of Jon's son.
  sector: inside
  exits:
    north:
      to: tba:313:room:31322
    west:
      to: tba:313:room:31324

"tba:313:room:31324":
  name: Stone Causeway
  description: >
    The causeway runs along high above the farming lands east to west.  To the north and south are the
    scorched fields which used to supply the main farming products for most of Dibrova.
  sector: inside
  exits:
    east:
      to: tba:313:room:31323
    west:
      to: tba:313:room:31325

"tba:313:room:31325":
  name: Stone Causeway
  description: >
    The red blood of humans is mixed with the thick, green slimy blood of goblins on these rocks. 
    Looking down into the fields below, it makes you wonder if through the smoke and ash drifting in the wind
    if there isn't some goblin or even a band of them waiting for you to descend.  Waiting so that they
    might tear you throat out and eat you whole.
  sector: inside
  exits:
    east:
      to: tba:313:room:31324
    west:
      to: tba:313:room:31326

"tba:313:room:31326":
  name: A Wide Crossroads
  description: >
    The causeway opens up and bcomes extremely wide here to allow for the increased traffic of wagons
    and carts that would normally flow through here. The causeway branches off to the east as well as
    running north and south.
  sector: inside
  exits:
    north:
      to: tba:313:room:31327
    east:
      to: tba:313:room:31325
    south:
      to: tba:313:room:31336

"tba:313:room:31327":
  name: Wide Causeway
  description: >
    This main elevated road through the fields runs north and south for quite some distance.  To the
    south are a couple of offshoots which head in other directions.
  sector: inside
  exits:
    north:
      to: tba:313:room:31328
    south:
      to: tba:313:room:31326
    down:
      to: tba:313:room:31390

"tba:313:room:31328":
  name: Wide Causeway
  description: >
    This main elevated road through the fields runs north and south for quite some distance.  On either
    side, to the east and west, are the charred remains of the fields that once bore the fruit of this
    realm.
  sector: inside
  exits:
    north:
      to: tba:313:room:31329
    south:
      to: tba:313:room:31327

"tba:313:room:31329":
  name: Rocky Causeway
  description: >
    The causeway runs north and south for a long distance through the center of the farmlands. 
    Smoking, ruined fields lie to the east and west - some of them still on fire.  Far to the north, the tall
    wall of Ofingia rises up high, protecting the town from the many raids.
  sector: inside
  exits:
    north:
      to: tba:313:room:31330
    south:
      to: tba:313:room:31328

"tba:313:room:31330":
  name: Intersection on the Causeway
  description: >
    This area is a crux where the causeway runs north to south, with a small offshoot to the west.  The
    way west appears little traveled, it is not as wide as this main section by half.
  sector: inside
  exits:
    north:
      to: tba:313:room:31311
    south:
      to: tba:313:room:31329
    west:
      to: tba:313:room:31331

"tba:313:room:31331":
  name: A Short Section
  description: >
    This short stub of causeway runs west for a very short distance with a small section bending north
    at the end.  To the east is the main causeway which runs smack dab through the center of the farming
    area.
  sector: inside
  exits:
    east:
      to: tba:313:room:31330
    west:
      to: tba:313:room:31332

"tba:313:room:31332":
  name: Private Causeway
  description: >
    At one time - not too long ago - this section of the farming area was owned and kept by Scorfahr,
    the richest of the farmers in the Ofingian farmlands due to the immense size of his fields and the
    quality of the soil with which he produced the most plentiful crops year after year.  Scorfahr was
    killed right at the outset of the raids by a roaving band, his farm burnt to the ground.
  sector: inside
  exits:
    north:
      to: tba:313:room:31333
    east:
      to: tba:313:room:31331

"tba:313:room:31333":
  name: The End of a Private Causeway
  description: >
    This small section of additional causeway was built by Scorfahr so he could have his own ingress
    and egress to his home without having to deal with the common farmhands who frequented the main
    causeway.  A sloping path leads down to the north into the field and homestead where Scorfahr used to
    reside.  His home, once the largest and most opulent home in the farmlands, is now no more than a burnt out
    shell - still smoking.
  sector: inside
  exits:
    south:
      to: tba:313:room:31332
    down:
      to: tba:313:room:31369

"tba:313:room:31334":
  name: A Short Causeway
  description: >
    This short section ends here, a small path leading west and down into the fields below.  To the
    east is the path back along the crest of the causeway back to the main path.  To the south is the
    reservoir, the man-made basin of water which was used to irrigate all of the land in this area.  A small
    waterfall falls gently into the basin on its western end, the water originating from somewhere up in
    the mountains.
  sector: inside
  exits:
    east:
      to: tba:313:room:31335
    down:
      to: tba:313:room:31357

"tba:313:room:31335":
  name: A Short Causeway
  description: >
    This small sections ends just west of here, the personal causeway for some farmer or another who
    might have once used it to get down into his fields and his home.  To the south is the reservoir, the
    man-made basin of water which was used to irrigate all of the land in this area.  A small waterfall
    falls gently into the basin on its western end, the water originating from somewhere up in the
    mountains.
  sector: inside
  exits:
    east:
      to: tba:313:room:31336
    west:
      to: tba:313:room:31334

"tba:313:room:31336":
  name: Nearing the End of the Causeway
  description: >
    The end of this main section of the causeway is in sight, just south from here.  A small section of
    the causeway leads off to the west, the reservoir for the farmlands lapping gently against its
    southern side.
  sector: inside
  exits:
    north:
      to: tba:313:room:31326
    south:
      to: tba:313:room:31337
    west:
      to: tba:313:room:31335

"tba:313:room:31337":
  name: Nearing the End of the Causeway
  description: >
    The end of this main causeway ends just to the south.  Below, to the west is the man-made reservoir
    which supplied water to all of the fields, keeping the soil fresh and strong.  A gentle waterfall
    splashes down into the reservoir from the mountains above, keeping it full.
  sector: inside
  exits:
    north:
      to: tba:313:room:31336
    south:
      to: tba:313:room:31338
    down:
      to: tba:313:room:31392

"tba:313:room:31338":
  name: The End of the Main Causeway
  description: >
    The causeway dead ends at this area, a paht sloping down the side of the rock walkway into the
    fields below to the east.  Below, to the west is the man-made reservoir which supplied water to all of
    the fields, keeping the soil fresh and strong.  A gentle waterfall splashes down into the reservoir
    from the mountains above, keeping it full.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:313:room:31337
    down:
      to: tba:313:room:31354

"tba:313:room:31339":
  name: Scorched Earth
  description: >
    The earth is blackened, damaged beyond repair in any time coming soon.  The goblins come and raid
    the area, killing off any resistance and burning anything that might burn - over and over again.
  sector: inside
  exits:
    north:
      to: tba:313:room:31318
    south:
      to: tba:313:room:31340

"tba:313:room:31340":
  name: Burnt Field
  description: >
    The land lies clear and black, smooth as if it had been rolled over with a giant roller.  Bits and
    pieces of wood give testament to the fact there once was a home or structure of some size here before
    the raids began.  The materials must all have been scavenged or burnt to ash - there are only
    splinters and scraps here now.
  sector: inside
  exits:
    north:
      to: tba:313:room:31339
    south:
      to: tba:313:room:31341

"tba:313:room:31341":
  name: Scorched Earth
  description: >
    All around are the burnt, scorched, blistered remains of what was once a wonderful field of sown
    wheat.
  sector: inside
  exits:
    north:
      to: tba:313:room:31340
    south:
      to: tba:313:room:31342
    west:
      to: tba:313:room:31346

"tba:313:room:31342":
  name: Burnt Field
  description: >
    All around are the burnt, scorched, blistered remains of what was once a wonderful field of sown
    wheat.
  sector: inside
  exits:
    north:
      to: tba:313:room:31341
    south:
      to: tba:313:room:31343
    west:
      to: tba:313:room:31347

"tba:313:room:31343":
  name: Scorched Earth
  description: >
    All around are the burnt, scorched, blistered remains of what was once a wonderful field of sown
    wheat.
  sector: inside
  exits:
    north:
      to: tba:313:room:31342
    south:
      to: tba:313:room:31344
    west:
      to: tba:313:room:31348

"tba:313:room:31344":
  name: Burnt Field
  description: >
    All around are the burnt, scorched, blistered remains of what was once a wonderful field of sown
    wheat.  To the south is a small wooden structure, still standing unscathed in this field of death and
    fire.  The entrance must lie on its west side, the door is not on this side.
  sector: inside
