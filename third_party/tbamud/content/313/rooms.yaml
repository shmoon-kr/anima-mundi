"tba:313:room:31379":
  name: Northern Fields
  description: >
    The charred and smoking stalks of corn which still stand in many places afford a great many hiding
    spots for raiders who may still be in the area. Just to the south are the ruins of a fenceline where
    the boundaries of a barnyard began.  All that are left now are a few charred timbers scattered on the
    ground like large toothpicks.
  sector: inside
  exits:
    north:
      to: tba:313:room:31376
    south:
      to: tba:313:room:31380
    west:
      to: tba:313:room:31378

"tba:313:room:31380":
  name: Ruined Barnyard
  description: >
    Even the ground here, where there were no crops, is blackened and scorched beyond repair.  To the
    south is the barn - or what is left of it - a shell of blackened wood and shingles.
  sector: inside
  exits:
    north:
      to: tba:313:room:31379
    south:
      to: tba:313:room:31381
    west:
      to: tba:313:room:31383

"tba:313:room:31381":
  name: Burnt Shell of a Barn
  description: >
    The sight and the smell of charred horse flesh induces a feeling of nausea, the wood of the walls
    and work equipment are still smoking from the fires that are lit over and over again every time a
    raiding party comes through.
  sector: inside
  exits:
    north:
      to: tba:313:room:31380
    west:
      to: tba:313:room:31382

"tba:313:room:31382":
  name: Ruined Barnyard
  description: >
    The small area of this place where plow horses could graze and machinery was kept has been destroy,
    looted and burned like the rest of the farmlands around. To the east is the burnt-out shell of the
    barn that used to house the work animals for this field.  North is the smouldering fields filled with
    smoking stalks of corn.
  sector: inside
  exits:
    north:
      to: tba:313:room:31383
    east:
      to: tba:313:room:31381

