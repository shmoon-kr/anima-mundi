"tba:313:room:31367":
  name: Scorfahr Farms
  description: >
    This area was at one time the most fertile of the fields in the area.  After the raids, the goblins
    came and dumped gallons of their dead's blood all over the fields to insure that no crop would ever
    grow again.  The goblins' plan is simple - starve the inhabitants out.
  sector: inside
  exits:
    north:
      to: tba:313:room:31368

"tba:313:room:31368":
  name: The Remains of an Opulent Farmhouse
  description: >
    Standing amid the wreckage and ruin of what was once an enormous home filled with all sorts of
    finery and goods, you must wonder what Scorfahr thought in his last moments.  All of his wordly goods,
    all of his wealth meant nothing as the goblins ransacked his home, killed his family and ate chunks of
    his flesh as he watched himself die.  Only a few timbers and stone remain of this once-awesome place.
  sector: inside
  exits:
    north:
      to: tba:313:room:31371
    south:
      to: tba:313:room:31367
    west:
      to: tba:313:room:31369

