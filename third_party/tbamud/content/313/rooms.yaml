    The charred and smoking stalks of corn which still stand in many places afford a great many hiding
    spots for raiders who may still be in the area. Bits of rubble from the broken-down causeway lie
    strewn about, a small bit of pleasure for the raiders to destroy something.
  sector: inside
  exits:
