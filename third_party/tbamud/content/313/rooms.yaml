"tba:313:room:31392":
  name: The Reservoir
  description: >
    Amazingly, the water still seems in fine condition even through the constant ash and soot that
    drifts through the air into it.  Off the west is the waterfall which feeds this small pool.
  sector: inside
  exits:
    west:
      to: tba:313:room:31393
    up:
      to: tba:313:room:31337

"tba:313:room:31393":
  name: Reservoir at the Waterfall
  description: >
    The waterfall splashes down into the sooty water, the crystal-clear mountain stream mixing in with
    the reservoir's ash covered water.  The water flows down from high above on the mountain, not a wide
    flow but a steady stream just the same.
  sector: inside
  exits:
    east:
      to: tba:313:room:31392
