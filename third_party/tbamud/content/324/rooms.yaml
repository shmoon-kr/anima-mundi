# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 324.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, several paragraphs are a list, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
"tba:324:room:32400":
  name: The Guard Walk
  description: >
    This is the outer ring of the Army's main encampment where patrols keep a constant vigil, watching
    for signs of hostile intruders.  At regularly spaced intervals, there are guard towers for lookout
    purposes which are manned twenty-eight hours a day.  The main section of the camp lies east of here
    along a roadway, the main highway through the gates to the west.
  sector: inside
  exits:
    north:
      to: tba:324:room:32401
    east:
      to: tba:324:room:32440
    south:
      to: tba:324:room:32427
    west:
      to: tba:326:room:32610
  extras:
  - keywords: [credits, info]
    text:
      preformatted: |2
           Army Encampment by Kaan
           Zone 324 is linked to the following zones:
        326 Army Perimeter                 at 32400 (west ) ---> 32610
        326 Army Perimeter                 at 32414 (east ) ---> 32640

