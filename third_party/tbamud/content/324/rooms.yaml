    holes cut and left open at eye level.  The entire space is roughly five foot by five foot, tightly
    cramped and uncomfortable.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:324:room:32408
  extras:
  - keywords: [desk]
    text: >
      The desk is made of solid walnut and gold inlay.  It is exquisitely carved with superior
      craftsmanship, the likes of which has rarely been seen.  It was probably brought to Rome from Gaul.
  - keywords: [documents, decrees, paperwork, document, decree, papers, paper]
    text: >
      The documents are all written on reed scrolls made in Egypt and have been sealed with wax.
  - keywords: [bookcase, books]
    text: >
      The books are very old and contain the wisdom of wise men from throughout the entire Roman empire. 
      They appear to be collecting dust.
  - keywords: [flowers, plants, flower, plant]
    text: The plants contribute to a very relaxing atmosphere.

"tba:324:room:32437":
  name: Guard Tower
  description: >
    There is little in the way of comfort here.  The walls are made of thick wood slats, arrow and peep
    holes cut and left open at eye level.  The entire space is roughly five foot by five foot, tightly
    cramped and uncomfortable.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:324:room:32406

"tba:324:room:32438":
  name: Guard Tower
  description: >
    There is little in the way of comfort here.  The walls are made of thick wood slats, arrow and peep
    holes cut and left open at eye level.  The entire space is roughly five foot by five foot, tightly
    cramped and uncomfortable.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:324:room:32404

"tba:324:room:32439":
  name: Guard Tower
  description: >
    There is little in the way of comfort here.  The walls are made of thick wood slats, arrow and peep
    holes cut and left open at eye level.  The entire space is roughly five foot by five foot, tightly
    cramped and uncomfortable.
  sector: inside
  flags: [indoors]
  exits:
    down:
      to: tba:324:room:32402
  extras:
  - keywords: [crowds, people]
    text: >
      It looks like some kind of bizarre or festival is occurring to the west. There are hundreds of
      people of all classes shopping, talking or eating.

"tba:324:room:32440":
  name: Roadway
  description: >
    This hard-packed road runs into the center of the camp, which branches leading north and south
    toward the smithy and the farming area.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:324:room:32443
    east:
      to: tba:324:room:32441
    south:
      to: tba:324:room:32454
    west:
      to: tba:324:room:32400
      look: You can see a busy street in that direction.
  extras:
  - keywords: [telescope]
    text: >
      If it were operational, it would offer a spectacular view of the Mountain of the Gods. 
      Unfortunately, it appears to have been vandalized.
  - keywords: [aqueduct]
    text: >
      The aqueduct is a massive stone structure that channels water into Rome from the Mountain of the
      Gods.  During the rainy season, it is filled to the top. However, due to recent drought, the water
      level appears to be very low.
  - keywords: [sign]
    text:
      preformatted: |2
           ********************************************
           *                                          *
           *      The Roman Aqueduct and Mountain     *
           *           Observation Platform           *
           *                                          *
           *       Designed and built by the Froboz   *
           *            Magic Platform Company        *
           *                                          *
           ********************************************

"tba:324:room:32441":
  name: Roadway
  description: >
    The roadway continues its way deeper into the main area of the encampent, running east for some
    ways.  There is a large hay barn just to the south, fenced off so that entry must be from another
    direction.  A small wooden hut lies just north of here, its door also on another side.
  sector: inside
  exits:
    east:
      to: tba:324:room:32442
      look: You see more aqueduct.
    west:
      to: tba:324:room:32440
      look: You see more aqueduct.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:324:room:32442":
  name: Roadway
  description: >
    Just east of here is the Parade Grounds where the troops march on days of graduation, tradition, or
    other such ceremony.  The trail sections off to the north and south, heading toward the barracks
    area and the mess tent.
  sector: inside
  exits:
    north:
      to: tba:324:room:32445
    east:
      to: tba:324:room:32467
    south:
      to: tba:324:room:32456
    west:
      to: tba:324:room:32441
      look: You see the south gate through the door.
  extras:
  - keywords: [fog, mist]
    text: >
      This is some really strange stuff!  You have never seen anything this color before.  Your legs are
      totally obscured from the knee down.
  - keywords: [sign]
    text:
      preformatted: |2
           The sign has a note posted on it.  It reads:
             List   - Tells you what I have to sell.
             Buy    - Tells me what you want to buy.
             Value  - Tells you what I will pay for an item.
             Sell   - Tells me you will sell that item, to me.

"tba:324:room:32443":
  name: Roadway
  description: >
    The road is a bit more narrow here, but still certainly wide enought to accomodate a wagon's
    width.  To the east is a small wood hut with smoke rising from a thin chimney along the side.  North is
    another wood building, but one which is somewhat larger than the hut to the east.  A large amount of
    ringing noise can be heard from that building, where smoke also rises from.
  sector: inside
  exits:
    north:
      to: tba:324:room:32446
    east:
      to: tba:324:room:32444
      look: "There is a sign on the door that says:  MUNICIPAL COURT OF ROME.  It appears to be open."
    south:
      to: tba:324:room:32440
      look: The foyer is directly to the south.

"tba:324:room:32444":
  name: The Tanner
  description: >
    Hides from various beasts, mostly deer and cow, are stretched out on tanning rods being cured for
    use as armor or clothing.  The place is intensely warm due to the fact that it is so small an area and
    a fire blazes in a wood stove constantly.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32443

"tba:324:room:32445":
  name: Roadway
  description: >
    The soldiers' main barracks lies north from here, the trail well tended and free of debris.  The
    higher ranking officers must be big sticklers for the troops to keep their area clean.
  sector: inside
  exits:
    north:
      to: tba:324:room:32449
    south:
      to: tba:324:room:32442
  extras:
  - keywords: [stairs, stairway, steps]
    text: The stairs are immaculately polished and made of white marble.
  - keywords: [statue, statues]
    text: There is really nothing noteworthy about them.

"tba:324:room:32446":
  name: Smithy
  description: >
    This large room houses the main smithy and armory for the entire army.  A team of smiths work daily
    to keep armor and weapons in good condition, not to mention making new items for new recruits.  A
    fire blazes in a huge fireplace, various implements of the trade inside.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:324:room:32447
      look: The general store lies in that direction.
    east:
      to: tba:324:room:32448
      look: There is what appears to be a large gate in that direction.
    south:
      to: tba:324:room:32443
  extras:
  - keywords: [stone, structure, aqueduct]
    text: >
      You see a massive stone structure, built several centuries ago, that is used to channel water into
      the city.
  - keywords: [mountain]
    text: >
      Off to the southwest, you can see a huge mountain that is partially obscured by the haze.  It is
      rumored that the gods reside there and protect the city.

"tba:324:room:32447":
  name: Armor Cache
  description: >
    This is where the smiths which the Army has trained keep their surpus goods and dented or broken
    pieces of armor.  Most of the items here are in fine shape, there are not many broken pieces due to the
    fact that it is peace-time.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:324:room:32446

"tba:324:room:32448":
  name: Weapon Cache
  description: >
    This is where the smiths which the Army has trained keep their surpus goods and dented or broken
    weapons.  Most of the items here are in fine shape, there are not many broken pieces due to the fact
    that it is peace-time.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32446
      look: The aqueduct continues.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:324:room:32449":
  name: Roadway
  description: >
    The main fire pit and social area for the soldiers of the army lies just north, encircled by rows
    and rows of long gray tents where the soldiers sleep. To the south is the main road through the camp.
  sector: inside
  exits:
    north:
      to: tba:324:room:32451
    south:
      to: tba:324:room:32445
  extras:
  - keywords: [workbench, workbenches, tubes, beakers, crucibles, dishes]
    text: >
      These are all tools of great power.  You cannot even begin to understand what any of this stuff
      does.
  - keywords: [cinders, ashes, pile]
    text: >
      The ashes are a very fine grayish white powder that seems to be the only worldly remains of
      Froboz's "test specimens".

"tba:324:room:32450":
  name: Barracks Tent
  description: >
    This tent holds row upon row of single beds, more aptly called cots, where the lower rank soldiers
    of the camp make their home.  A footlocker stands at the foot of each bed, everything inside of the
    tent, including the dirt floor, is spotlessly clean.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:324:room:32451
  extras:
  - keywords: [bench, stand, box, jury]
    text: >
      You see large wooden structures that are designed to separate the judge, jury and witnesses from
      the rest of the courtroom.  They are made of polished oak and are strictly functional.
  - keywords: [seal]
    text: The seal of the emperor is mounted above the judge's stand.

"tba:324:room:32451":
  name: Fire Pit
  description: >
    This is the main area of the soldiers' section of the camp.  It is kept relatively free of debris
    or grunge, the pit always fresh dug, the ground raked and smooth.  Long gray barracks tents lie to the
    north, east and west.
  sector: inside
  exits:
    north:
      to: tba:324:room:32453
    east:
      to: tba:324:room:32452
    south:
      to: tba:324:room:32449
    west:
      to: tba:324:room:32450
      look: The clay street leads into the city.
  extras:
  - keywords: [spires, towers]
    text: >
      There are two tall spires on either side of the gate and are constantly manned by the city guards. 
      They are made of stone and stand about 40 feet tall.
  - keywords: [gate]
    text: The gate is fabricated from iron and has been designed to keep intruders out of the city.

"tba:324:room:32452":
  name: Barracks Tent
  description: >
    This tent holds row upon row of single beds, more aptly called cots, where the lower rank soldiers
    of the camp make their home.  A footlocker stands at the foot of each bed, everything inside of the
    tent, including the dirt floor, is spotlessly clean.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32451
  extras:
  - keywords: [trail]
    text: The mountain trail is a little muddy, due to the recent rains.

"tba:324:room:32453":
  name: Barracks Tent
  description: >
    This tent holds row upon row of single beds, more aptly called cots, where the lower rank soldiers
    of the camp make their home.  A footlocker stands at the foot of each bed, everything inside of the
    tent, including the dirt floor, is spotlessly clean.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:324:room:32451

"tba:324:room:32454":
  name: Roadway
  description: >
    The road is still wide here, bit a bit less solid as it leads the way into the farming area.  There
    is a large hay barn packed to the rafters to the east - the army must keep it in high supply during
    times of peace.  The road continues to the south toward a large circular, fenced area where warhorses
    neigh and whinny, tossing their mighty heads.
  sector: inside
  exits:
    north:
      to: tba:324:room:32440
      look: The aqueduct continues.
    east:
      to: tba:324:room:32455
      look: The aqueduct continues.
    south:
      to: tba:324:room:32457
      look: The aqueduct continues.
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered the
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:324:room:32455":
  name: Hay Barn
  description: >
    There is not much to say about this large, open sided barn.  Tall poles run up roughly thirty feet
    into the air supporting a tin ceiling which serves to keep the hay beneath dry.  The hay reaches all
    the way to the ceiling and would undoubtedly reach beyond were it given the opportunity.
  sector: inside
  exits:
    west:
      to: tba:324:room:32454
      look: The courtroom lies in that direction.
  extras:
  - keywords: [tombs, books]
    text: The books are very large and filled with Roman legal precedent.
  - keywords: [papers, documents]
    text: >
      There are hundreds of pages of petitions, lawsuits and court orders sitting on the desk.  One
      particularly interesting case involves a nobleman, a slave and a roll of toilet paper.

"tba:324:room:32456":
  name: Mess Tent
  description: >
    This large, open-sided tent houses rows of long wooden tables used by the soldiers during meal
    times.  The tent itself sits dead center of the roadway, the road picking up again just south of the
    tent, ending at a couple of decent-sized wood outbuildings.
  sector: inside
  exits:
    north:
      to: tba:324:room:32442
    south:
      to: tba:324:room:32462
  extras:
  - keywords: [tree, trees, vegetation]
    text: >
      All of the vegetation is lush, green and in full bloom.  You wish that you could take the time to
      stop and enjoy it properly.
  - keywords: [trail, path]
    text: The path is a little muddy, possibly due to a recent thundershower.

"tba:324:room:32457":
  name: Roadway
  description: >
    The roadway ends at a gate which separates the corral from the open area of the camp.  The mighty
    steeds inside neigh and whinny in protest, running in circle and tossing their heads.  To the east is
    a large barn.
  sector: inside
  exits:
    north:
      to: tba:324:room:32454
      look: The aqueduct continues.
    east:
      to: tba:324:room:32458
      look: The aqueduct continues.
    south:
      to: tba:324:room:32459
      look: You see a gorgeous valley.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [slime, algae]
    text: >
      Due to the availability of moisture and nutrients, a green, viscous slime has grown and covered
      everything with a slippery coating.  It seems to go out of its way to drip on you.

"tba:324:room:32458":
  name: Barn
  description: >
    This place is full of various implements for caring for the steeds of the cavalry and for doing the
    work that the cowboys of the army are responsible for. There are a few stalls off in the far east
    corner of the barn where it appears the best of the best of the Army's steeds are kept.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32457
  extras:
  - keywords: [stream, brook]
    text: >
      A stream of the clearest, cleanest water that you have ever seen winds its way through the valley.
  - keywords: [fish]
    text: A variety of species swims peacefully in the cool, clear water.
  - keywords: [trees, fruit]
    text: >
      The fruit trees, nourished by the fertile ground at the edge of the stream and sustained by the
      brilliant sunshine, line the banks of the stream and are laden with fruit.

"tba:324:room:32459":
  name: Corral
  description: >
    Horses run around you in a frenzy, their trained senses to first lash out and kick any man who is
    not their usual rider.  Best to get out of this area quickly before you get trampled!
  sector: inside
  exits:
    north:
      to: tba:324:room:32457
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:324:room:32460
    south:
      to: tba:324:room:32461
  extras:
  - keywords: [trees]
    text: >
      The trees are old and tower hundreds of feet above the ground.  If you stand still and listen
      carefully, you can hear the birds singing.

"tba:324:room:32460":
  name: Branding Block
  description: >
    There is a large firepit here, irons laying with their business ends in the pit.  A large wooden
    block is here to aid the branders in keeping the animals still while branding them with the mark of the
    Eatern Army/f
  sector: inside
  exits:
    west:
      to: tba:324:room:32459
  extras:
  - keywords: [cells, cell]
    text: >
      You can see small and very cramped cells which are filthy.  You shiver and vow to never do anything
      that would cause you to become a resident.

"tba:324:room:32461":
  name: Livestock Pasture
  description: >
    This area is fenced in as well, but not as potentially hazardous as that just north of here.  The
    animals here are all cow, well fed and lazy.  They are the main meat, milk and leather supply for the
    army and so are well tended.  The ground is strewn with all sorts of surprises - it might be best to
    watch one's step!
  sector: inside
  exits:
    north:
      to: tba:324:room:32459

"tba:324:room:32462":
  name: Roadway
  description: >
    The road ends here at a couple of wooden buildings.  There are rickety doors on both, one to the
    east and one south, neither of them appear to be locked.
  sector: inside
  exits:
    north:
      to: tba:324:room:32456
    east:
      to: tba:324:room:32463
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:324:room:32464
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [sign]
    text: >
      The sign has a note posted on it.  It reads: List - Tells you what I have to sell.  Buy - Tells me
      what you want to buy.  Value - Tells you what I will pay for an item.  Sell - Tells me you will sell
      that item, to me.

"tba:324:room:32463":
  name: Dry Storage
  description: >
    This is where all non-perishable foodstuffs are kept by the Army.  Sacks of flour, loads of dried
    fruits and canned goods are stacked neatly on shelves and on pallets all over the floor.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32462
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [sign]
    text:
      preformatted: |2
           The sign has a note posted on it.  It reads:
        
             List   - Tells you what I have to sell.
             Buy    - Tells me what you want to buy.
             Value  - Tells you what I will pay for an item.
             Sell   - Tells me you will sell that item, to me.

"tba:324:room:32464":
  name: Cold Storage
  description: >
    The foodstuffs stored in this building are those which must be kept chilled - milk from the cattle,
    meats which are kept cold until consumed by the soldiers are all kept on ice here.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:324:room:32462
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:324:room:32465":
  name: Footman's Training Grounds
  description: >
    Soldiers in the Eastern Army get to know this field well, indeed.  Whether a footman or member of
    the cavalry, every soldier learns to march here in formation and does horrendous hours of physical
    training which is required of every soldier in the army.  To the east is the cavalry fields where the
    cavalry officers might train in their riding and horseman's skills to better their performance on the
    field of battle.
  sector: inside
  exits:
    east:
      to: tba:324:room:32479
    south:
      to: tba:324:room:32466

"tba:324:room:32466":
  name: Grandstands
  description: >
    The stands rise close to forty feet into the air, rows and rows of bleacher seats available for
    spectators to sit and watch any ceremony or event which may be taking place in the Parade Grounds just
    south of here.  To the north behind the stands is the practice field, a much less used place where
    trainees go through their drills in hopes of perfection when marching on the opulent Parade Grounds.
  sector: inside
  exits:
    north:
      to: tba:324:room:32465
    south:
      to: tba:324:room:32467

"tba:324:room:32467":
  name: Parade Grounds
  description: >
    The grass here is well kept, tended by the newer recruits so that when they obtain rank and become
    recognized as more than just pukes they might have a place where they can proudly march for their
    superiors.  A large grandstands lies just north of the grounds where spectators may view events which
    take place and the higher ranks may give praise to those who have done a job well.
  sector: inside
  exits:
    north:
      to: tba:324:room:32466
    east:
      to: tba:324:room:32469
      look: You see a great desert.
    west:
      to: tba:324:room:32442
      look: The might clay road leads off in this direction.

"tba:324:room:32468":
  name: Strategies
  description: >
    A long, low table spreads out the length of the room with low stools all around it.  Maps and
    charts are stacked in neat piles in corners of the table, writing implements before each stool.
  sector: inside
  flags: [indoors]
  exits:
    south:
      to: tba:324:room:32469

"tba:324:room:32469":
  name: Roadway
  description: >
    The roadway bends a bit here, heading south and then east toward the eastern perimeter of the
    camp.  To the north is a large blue tent, the banner of the Eastern Army proudly flying from its summit. 
    To the east is an even larger tent of the same blue fabric, the flag of the Army also atop its summit
    along with the crest of the General.
  sector: inside
  exits:
    north:
      to: tba:324:room:32468
    east:
      to: tba:324:room:32476
    south:
      to: tba:324:room:32470
    west:
      to: tba:324:room:32467

"tba:324:room:32470":
  name: Roadway
  description: >
    The main roadway twists back east toward the eastern-most exit of the camp. To the south is another
    section of the roadway where you can see a few small wood huts, presumably outhouses, along the side
    of the road before it ends at a stream.
  sector: inside
  exits:
    north:
      to: tba:324:room:32469
    east:
      to: tba:324:room:32475
    south:
      to: tba:324:room:32471

"tba:324:room:32471":
  name: Roadway
  description: >
    There are a row of smelly wooden huts along the east side of the trail, to the south is a stream
    roughly two feet in width, maybe two feet deep. Obviously, this where the army gets its main water
    supply.
  sector: inside
  exits:
    north:
      to: tba:324:room:32470
    east:
      to: tba:324:room:32480
    south:
      to: tba:324:room:32472

"tba:324:room:32472":
  name: Roadway
  description: >
    One of the latrines stands open to the east, the stream itself just to the south.  The fresh, cool
    scent of the water running over the rocks constrasts so strongly with the smell of the latrine that
    it almost seems an affront to nature.
  sector: inside
  exits:
    north:
      to: tba:324:room:32471
    east:
      to: tba:324:room:32474
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:324:room:32473

"tba:324:room:32473":
  name: Stream
  description: >
    The water is very cold, so cold as to numb flesh.  It is very pure and crisp, however, which is the
    main reason why the army chose this valley over many others that they might have picked.
  sector: inside
  exits:
    north:
      to: tba:324:room:32472

"tba:324:room:32474":
  name: Latrines
  description: >
    This is more or less a three foot by three foot box with a small wooden platform built at the east
    side.  A hole has been cut into the top of the platform allowing soldiers a place to rest their rump
    where they may relieve any excess bowel pressures.  It truly stinks like shit in here.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32472
      door:
        keywords: [door]
        kind: door
        reset: closed

"tba:324:room:32475":
  name: Roadway
  description: >
    The roadway runs east toward the east gate of the encampment.  You may exit the camp just east of
    here or head into the main camp area to the west.
  sector: inside
  exits:
    east:
      to: tba:324:room:32477
    west:
      to: tba:324:room:32470

"tba:324:room:32476":
  name: General's Tent
  description: >
    The accomodations of this tent are luxurious compared to that of the common foot soldier's tents. 
    It is not, however, a place which one might call comfortable.  There is a bed here, only slightly
    larger than those found in the barracks tents and the small table which doubles as a desk is only large
    enough for two men at the most to eat upon it.
  sector: inside
  flags: [indoors]
  exits:
    west:
      to: tba:324:room:32469

"tba:324:room:32477":
  name: Roadway
  description: >
    The eastern gate to the army is just east of here.  To the north is a tremendous wood pile which is
    fed daily by the logging teams of the army. Soldiers work constantly at cutting and shaping the wood
    for whatever needs the Army may have.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:324:room:32478
    east:
      to: tba:324:room:32414
    west:
      to: tba:324:room:32475

"tba:324:room:32478":
  name: Lumber Yard
  description: >
    This huge pile of wood holds all manner of shapes, types and sizes of wood which has been cut by
    the logging crews for the army.  Soldiers work around the clock at keeping enough wood available for
    the cook fires and the tents where soldier sleep.
  sector: inside
  exits:
    south:
      to: tba:324:room:32477

"tba:324:room:32479":
  name: Cavalry Fields
  description: >
    The ground beneath your feet is trampled and wet, strewn with divots ripped from the earth by the
    thundering hooves of warhorses.  To the west is the footman's training area, a large blue tent blocks
    any passage south.
  sector: inside
  exits:
    west:
      to: tba:324:room:32465

"tba:324:room:32480":
  name: Medical Tent
  description: >
    A piece of strong fabric covers the floor of this tent to keep germs at bay, all linens are clean
    and sanitary.  For being in the middle of a camp, having only this tent for shelter, this is quite a
    facility.
  sector: inside
  exits:
    west:
      to: tba:324:room:32471
