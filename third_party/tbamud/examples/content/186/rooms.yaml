# tbaMUD-derived (third_party/tbamud/NOTICE.md). Converted from tbaMUD zone 186.
# Entries by ID, in vnum order. Prose is folded (>): wrapped here, one paragraph per blank line, the
# renderer wraps it per language. exits.<dir>: to (room ID), look (what `look <dir>` shows), door
# (keywords, kind door|pickproof, key, reset: the state the zone reset puts it in).
tba:186:room:18600:
  name: The Entrance To The Newbie Zone
  description: >-
    Ahhh... the entrance to the newbie zone!  Just the place you have been looking for.  Well, when you've
    readied yourself you can enter to the north.
  sector: city
  flags: [no_mob]
  exits:
    north:
      to: tba:186:room:18601
      look: You see the start of the newbie zone.
    west:
      to: tba:30:room:3061
      look: Back to the road that way... chickening out already?

tba:186:room:18601:
  name: The Beginning Of The Passage
  description: >-
    You find yourself entering a long corridor.  You can hear the sound of creatures roaming about, but
    you can't tell where the sound emanates from exactly.

    Exits lead to the east along the hallway, and south back to the entrance.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:186:room:18602
      look: More of the hallway there... how exciting!
    south:
      to: tba:186:room:18600
      look: The entrance to the newbie zone... how dull

tba:186:room:18602:
  name: The Dirty Hallway
  description: >-
    You continue wandering down the hallway.  Nothing much different here, but you are positive you here
    noises behind the door to the south, and coming from the east.  The walls are a bit slimy and moldy
    here... yeech, couldn't they hire someone to clean this place?  What will the newbies think?  Oh well,
    you can continue along the hallway to the east or west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:186:room:18603
      look: More of the hallway there... how exciting!
    south:
      to: tba:186:room:18606
      look: A small room lies to the south... you hear something moving about inside.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:186:room:18601
      look: More of the hallway there... how exciting!

tba:186:room:18603:
  name: A Nexus
  description: >-
    Well... you've reached an intersection of two passages, to the north and east, the passage brightens,
    while the darker hallway continues to the south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:186:room:18644
      look: A brighter hallway leads off that way.
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:186:room:18646
      look: A brighter hallway leads off that way.
      door:
        keywords: [door]
        kind: door
        reset: closed
    south:
      to: tba:186:room:18607
      look: More of the hallway there... how exciting!
    west:
      to: tba:186:room:18602
      look: More of the hallway there... how exciting!

tba:186:room:18604:
  name: A Narrow Passage
  description: >-
    The thin passage is plain and undecorated, but still clean.  It ends abruptly to the south at a small
    oak door, behind which you hear movement...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18647
      look: A large domed room.
    south:
      to: tba:186:room:18612
      look: A small cluttered room.
      door:
        keywords: [door]
        kind: door
        reset: closed

tba:186:room:18605:
  name: The Dark Pit
  description: >-
    Ick... a dark damp dirty pit.  Even worse, what is that dark damp dirty thing looking at you from
    the corner?  Ewww... maybe you should go back up where it is a bit safer, unless you think you can
    tackle that thing in the corner.
  sector: inside
  flags: [dark, indoors]
  exits:
    up:
      to: tba:186:room:18606
      look: You see a ladder leading up
      door:
        keywords: [grate]
        kind: door
        key: tba:186:obj:18608
        reset: locked

tba:186:room:18606:
  name: A Small Room
  description: >-
    Hmmm... this is an interesting little room.  Ack, and there is an interesting little creature staring
    at you too.  He looks a bit surprised at your intrusion.  You can leave via the doors north or east,
    or you can stay and annoy him a bit more.  There also appears to be some type of well down here also,
    but it has a rather secure grate covering it.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:186:room:18602
      look: More of the hallway there... how exciting!
      door:
        keywords: [door]
        kind: door
        reset: closed
    east:
      to: tba:186:room:18607
      look: More of the hallway there... how exciting!
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:186:room:18605
      look: A ladder leads down into darkness.
      door:
        keywords: [grate]
        kind: door
        key: tba:186:obj:18608
        reset: locked

tba:186:room:18607:
  name: More Of The Hallway
  description: >-
    Oh joy!  More of this annoying passage.  Perhaps there is something more exciting through that door
    to the west?  Or you can keep searching the hallways to the north or south.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:186:room:18603
      look: More of the hallway there... how exciting!
    south:
      to: tba:186:room:18611
      look: More of the hallway there... how exciting!
    west:
      to: tba:186:room:18606
      door:
        keywords: [door]
        kind: door
        reset: closed

tba:186:room:18608:
  name: An Open Field By The Great Field
  description: >-
    Finally, you are in an open field... it is so nice to breathe fresh air again!  You can return to
    that dank, smelly place to the east, or take the exit to the north which appears to lead into a large
    field.
  sector: inside
  flags: [no_mob]
  exits:
    north:
      to: tba:30:room:3061
      look: There appears to be a field road to the north.
    east:
      to: tba:186:room:18609
      look: The end of that darn hallway lies back to the east.

tba:186:room:18609:
  name: The End Of The Passage
  description: >-
    Ahhh... at last, the end of the hallway... you can exit into open air to the west,or return to the
    east and make sure you didn't miss anything.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:186:room:18610
      look: More of the hallway there... how exciting!
    west:
      to: tba:186:room:18608
      look: An open field near The Great Field of Midgaard can be seen.

tba:186:room:18610:
  name: A Brighter Hallway
  description: >-
    The hallway continues on in a east-west direction... and it seems to be brightening up to the west.
  sector: inside
  flags: [indoors]
  exits:
    east:
      to: tba:186:room:18611
      look: A corner in the passage lies to the east.
    west:
      to: tba:186:room:18609
      look: More of the hallway there... how exciting!

tba:186:room:18611:
  name: Another Corner
  description: >-
    Another corner of the passage, and just as untidy as the rest of this place (maybe more so?).  There
    is a door to the east though... wonder where that leads?  Oh, and the hallway continues west and north.
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:186:room:18607
      look: More of the hallway there... how exciting!
    east:
      to: tba:186:room:18612
      look: You peer into a cluttered little room to the east.
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:186:room:18610
      look: More of the hallway there... how exciting!

tba:186:room:18612:
  name: The Alchemist's Room
  description: >-
    Lots of bottles and flasks lie about this room, but it all looks like worthless clutter.  It appears
    whatever alchemist has been working here is really very adept at his art.  There are a lot of formulae
    and spells written on the walls too... couldn't he buy some paper?  There is a door to the north,
    and also a dark stairway in the corner leading down, with a large sign next to it that you probably
    should read...
  sector: inside
  flags: [indoors]
  exits:
    north:
      to: tba:186:room:18604
      look: A nice shiny hallway!
      door:
        keywords: [door]
        kind: door
        reset: closed
    west:
      to: tba:186:room:18611
      look: A corner in the passage lies to the west.
      door:
        keywords: [door]
        kind: door
        reset: closed
    down:
      to: tba:186:room:18632
      look: A shadowed stairway leading down.
  extras:
  - keywords: [sign, stairs, stairway]
    text: >-
      The sign next to the stairs says: If you are below level 7 and alone, or below level 4 then bugger
      off!  Or else don't blame me if you die...

tba:186:room:18620:
  name: A Turn In The Passage
  description: >-
    This corner is much like all the others... except you see a strange glow coming from the south.  Could
    be an exit... you hope.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18621
      look: The passage continues east quite a ways.
    south:
      to: tba:186:room:18629
      look: You see an odd red glow from that direction.

tba:186:room:18621:
  name: A T-Intersection In The Passage
  description: >-
    This is an intersection of a long east-west passage with a corridor leading south.  The air seems
    a bit clearer here though, as if you were approaching an exit.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18622
    south:
      to: tba:186:room:18633
    west:
      to: tba:186:room:18620

tba:186:room:18622:
  name: Another Corner
  description: >-
    The passage turns from north to west here.  The walls are still covered with the same disgusting green
    fungus you have seen all along, and you hear sounds of creatures moving all around you...
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:186:room:18628
    west:
      to: tba:186:room:18621

tba:186:room:18623:
  name: A Corner In The Hallway
  description: >-
    You can hear creatures moving all around you... and it is not a comforting sound at all.  The furnishing
    is nothing to speak of either, plain gray brick walls with green fungus (or something) growing on
    them.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18624
    south:
      to: tba:186:room:18627

tba:186:room:18624:
  name: Another Turn
  description: >-
    Hmmm... the passage turns south here.  You beginning to realize you can easily lose your bearings
    if you aren't careful, and you don't think you would like spending too much time here...
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:186:room:18630
    west:
      to: tba:186:room:18623

tba:186:room:18625:
  name: A Large Room
  description: >-
    The passage opens into a large oval room.  There really isn't much of interest here though.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18626
    south:
      to: tba:186:room:18631

tba:186:room:18626:
  name: A Long East-West Passage
  description: >-
    This is a long, narrow passage leading east and west.  The walls are damp and covered with mildew
    and fungus.  There is a very unhealthy air about this place and you're beginning to want out of here...
    soon.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18627
    west:
      to: tba:186:room:18625

tba:186:room:18627:
  name: A Crossing Of Corridors
  description: >-
    Here a narrow east-west passage crosses with a wider passage to the north and south.  The air is dank,
    and has an odor of decay and debris. Not a nice place at all really...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18623
    east:
      to: tba:186:room:18628
    south:
      to: tba:186:room:18632
    west:
      to: tba:186:room:18626

tba:186:room:18628:
  name: A Corner Room
  description: >-
    This room is hardly more than a crossing of passages.  You do sense a slight breeze wafting down the
    passage to the north though, but it smells altogether bad...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18622
    west:
      to: tba:186:room:18627

tba:186:room:18629:
  name: The Red Room
  description: >-
    It takes you a moment to realize that the red glow here is coming from a round portal on the floor.  It
    looks almost as if someone had painted a picture of a dirt running through a field on the floor of
    this room.  Oddly enough, it is so realistic you can feel the wind in the field coming out of the
    picture.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18620
    east:
      to: tba:186:room:18630
    down:
      to: tba:30:room:3061
  extras:
  - keywords: [portal, floor]
    text: >-
      It looks as if you could go down into it...  But you can't be sure of where you will end up, or
      if you can get back.

tba:186:room:18630:
  name: A Branching Passage
  description: >-
    The north-south passage branches to the east here.  There is a queer red glow coming from that way
    as well, along with a faint breeze.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18624
    south:
      to: tba:186:room:18634
    west:
      to: tba:186:room:18629
      look: A very odd red glow emanates from that direction.

tba:186:room:18631:
  name: A Passage
  description: >-
    Ick... this place is just disgusting.  You try and stay clear of the walls, but the passage is so
    narrow you keep bumping them anyway.  You are almost convinced that the fungus coating the walls is
    grabbing at you too.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18625
    east:
      to: tba:186:room:18632
    south:
      to: tba:186:room:18638

tba:186:room:18632:
  name: The Entrance
  description: >-
    It is dark, dank, disgusting and cold up here.  Plus you here the sounds of creatures all around you...
    and somehow they don't sound friendly.  It is probably wise to exercise some degree of caution here...
    no telling what you may run into here.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18627
    south:
      to: tba:186:room:18635
    west:
      to: tba:186:room:18631
    up:
      to: tba:186:room:18612

tba:186:room:18633:
  name: Another Corner
  description: >-
    Well... what is there to say.  More fungus, more weird sounds, and a slight breeze from the north.  Bet
    you want to sign a lease, don't ya...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18621
    east:
      to: tba:186:room:18634

tba:186:room:18634:
  name: An Intersection Of Passages
  description: >-
    Cold, smelly, and coated with green fungus... just like last week's left-overs.  Furthermore you want
    nothing to do with either, you just want out right now.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18630
    south:
      to: tba:186:room:18637
    west:
      to: tba:186:room:18633

tba:186:room:18635:
  name: A Turn In The Passage
  description: >-
    This place is just plain nauseating... it certainly smells as if something (or someone) died in here.  You
    hope you aren't next, but from the sounds you hear all around you, it seems as if something has other
    ideas about that.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18632
    east:
      to: tba:186:room:18636

tba:186:room:18636:
  name: A Branch To The South
  description: >-
    The east-west passage branches of to the south here.  All around you is the odour of death.  Actually,
    the mold and fungus on the walls is doing great, but otherwise... well... you don't want to think
    about what else lives here.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18637
    south:
      to: tba:186:room:18639
    west:
      to: tba:186:room:18635

tba:186:room:18637:
  name: Yet Another Corner
  description: >-
    The passage turns here and heads north.  You sense something up ahead that way, but you aren't sure
    what.  You aren't sure if you want to know what either at this point.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18634
    west:
      to: tba:186:room:18636

tba:186:room:18638:
  name: A Large Room
  description: >-
    You almost stumble as you enter this room... the sudden feeling of no walls on either side of you
    makes you a bit nervous.  Suddenly you are vulnerable on all sides.  You can't even tell how big a
    room this is, because it extends to the east farther than your light will reach...
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18631
    east:
      to: tba:186:room:18639
      look: The room extends into shadows...

tba:186:room:18639:
  name: A Large Room
  description: >-
    As you enter, you light glints of the wall to the east.  There appears to be words scrawled on the
    wall, and a crude picture.  To the west the room extends beyond the reach of your light, and the dark
    shadows make you paranoid... anything could be hiding there.  You are painfully aware of how exposed
    you are without walls around you.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18636
    west:
      to: tba:186:room:18638
      look: The room extends as far as (and farther than) you can see...
  extras:
  - keywords: [writing, words]
    text: The writing appears to say 'beware the Minotaur...  '
  - keywords: [wall]
    text: There is a crude picture of a man with the head of a bull with some writing next to it.

tba:186:room:18640:
  name: The Statue's Room
  description: >-
    Here, the passage enters a small room.  Exits lead to the east and south, and you notice a wonderful,
    large (and tastefully done) statue to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18641
      look: A long hallway, ending in a set of steps.
    south:
      to: tba:186:room:18644
      look: The hall extends to the south where it seems to lighten somewhat.
  extras:
  - keywords: [statue]
    text: >-
      Upon closer inspection you see that the statue has a small plaque affixed to it.  The face looks
      remarkably familiar also.
  - keywords: [plaque, nameplate, name]
    text: 'It says: Maynard, Death Jester of the Harlequins'

tba:186:room:18641:
  name: The Hallway
  description: >-
    As you continue wandering down the hallway, you notice banners, pictures, and other fine decorations
    adorning the walls all along this passage.  It seems very different from the dismal passage where
    you entered.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18642
      look: The hallway ends at a grand marble staircase.
    west:
      to: tba:186:room:18640
      look: The passage leads into a small room.

tba:186:room:18642:
  name: The North Stairs
  description: >-
    Here, the hall opens into a wide room, with a high domed roof.  Now that that you have come clear
    of the enclosed passage, you can see that the stair leads upward to an open air balcony overlooking
    the area.  To the south the room continues, and another stair is visible matching the one in front
    of you.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:186:room:18647
      look: You see another staircase and two passages leading west and south.
    west:
      to: tba:186:room:18641
      look: An entrance to a bright passage.
    up:
      to: tba:186:room:18643
      look: An open air balcony.
  extras:
  - keywords: [staircase, stair, stairs]
    text: They are constructed of smooth, beautiful marble

tba:186:room:18643:
  name: The Balcony
  description: >-
    Here you can look out and observe the world around.  Constructed in a semi-circle around the dome
    of the room, the balcony allows you to look out in almost any direction.  Wandering to the north end,
    you can see that the Great Fields north of Midgaard continue off towards the Dragonhelm Mountains
    to the north.
  sector: inside
  flags: [dark, indoors]
  exits:
    south:
      to: tba:186:room:18645
      look: The south end of the balcony.
    down:
      to: tba:186:room:18642
      look: Down the stairs to a large, domed room.
  extras:
  - keywords: [staircase, stair, stairs]
    text: They are constructed of smooth, beautiful marble

tba:186:room:18644:
  name: A Bright Hallway
  description: >-
    Wow!  What a change from the dismal passage to the south.  Whoever keeps this room up must really
    like newbies.  The walls and floor are clean, and tastefully decorated.  You also notice an interesting
    design on the floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18640
      look: A small room with a statue in it.
    south:
      to: tba:186:room:18603
      look: A intersection of passages.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [floor, design]
    text: It appears to be the Crest of the Harlequin Guild.

tba:186:room:18645:
  name: The Balcony
  description: >-
    Here you can look out and observe the world around.  Constructed in a semi-circle around the dome
    of the room, the balcony allows you to look out in almost any direction.  Wandering to the south end,
    you can see the great city of Midgaard off to the south-west.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18643
      look: The north end of the balcony.
    down:
      to: tba:186:room:18647
      look: Back down the south staircase.
  extras:
  - keywords: [staircase, stair, stairs]
    text: They are constructed of smooth, beautiful marble.

tba:186:room:18646:
  name: A Bright Hallway
  description: >-
    Wow!  What a change from the dismal passage to the west.  Whoever keeps this  room up must really
    like newbies.  The walls and floor are clean, and tastefully decorated.  You also notice an interesting
    design on the floor.
  sector: inside
  flags: [dark, indoors]
  exits:
    east:
      to: tba:186:room:18647
      look: The passage opens into a domed room with a grand marble staircase.
    west:
      to: tba:186:room:18603
      look: A dark intersection of passages.
      door:
        keywords: [door]
        kind: door
        reset: closed
  extras:
  - keywords: [floor, design]
    text: It appears to be the crest of the Harlequin Guild.

tba:186:room:18647:
  name: The South Stairs
  description: >-
    Here, the hall opens into a wide room, with a high domed roof.  Now that that you have come clear
    of the enclosed passage, you can see that the stair leads upward to an open air balcony overlooking
    the area.  to the north the room continues, and another stair is visible matching the one in front
    of you.
  sector: inside
  flags: [dark, indoors]
  exits:
    north:
      to: tba:186:room:18642
      look: Another stairway is to the north, as well as a passage to the west.
    south:
      to: tba:186:room:18604
      look: A narrow passage to the south, ending in a wood door.
    west:
      to: tba:186:room:18646
      look: Back down the bright hallway.
    up:
      to: tba:186:room:18645
      look: An open air balcony.
  extras:
  - keywords: [staircase, stair, stairs]
    text: They are constructed of smooth, beautiful marble.
