# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:37, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:37:room:3700:
  name: 수도 하수 시스템 구역 설명 방

tba:37:room:3701:
  name: 하수구 진입
  description: >-
    도시의 가장 아래쪽, 이 악취가 진동하고 진흙이 가득한 늪으로 내려오면서, 수많은 사람들이 얼마나 많은 폐기물을 만들어 내는지 자못 놀라지 않을 수 없다. 그것들은 모두 당신의
    발밑에 - 그리고 당신의 부츠 안에! - 있다. 동쪽과 서쪽에서 온갖 불결한 것들로 가득 찬 물이 흘러들어와 여기서 북쪽으로 흘러가 보인다.
  exits:
    north:
      look: 북쪽으로 이어지는 배관이 있다. 그 안에는 진흙이 가득 차 있다.
    east:
      look: 여기 배관이 하나 있다.
    south:
      look: 맨홀 아래.
    west:
      look: 터널 교차로.

tba:37:room:3702:
  name: 배수관 아래
  description: >-
    당신은 거대한 배수관의 끝자락에 서 있다. 이 배수는 완만한 경사로 위로 이어지며, 하수는 느릿느릿 북쪽으로 흘러간다. 그 배관의 끝에는 어떤 도시가 있는지 모르겠지만, 그곳의
    하수구로 더 깊이 들어가는 것이다. 이 난장판 속에서 당신에게 제시되는 선택지는 많지 않다. 무릎까지 차오른 하수 속에서 당신은 두 가지 선택지밖에 없다. 북쪽으로 나아가 하수구
    더 깊은 곳으로 들어가 이 꼬질이한 곳에 살 수 있는 어떤 생물들과 마주치거나, 그 배관을 통해 위로 올라가 이 어둡고 음침한 곳을 빠져나갈 기회를 잡으려 하는 것이다.
  exits:
    north:
      look: 하수구 입구가 보인다.

tba:37:room:3703:
  name: 북쪽과 서쪽으로 꺾이는 배관
  description: >-
    당신은 북쪽과 서쪽으로 이어지는 배관 안에 있다. 배관은 당신이 똑바로 설 수 있을 만큼 넓고, 이 지점에서는 충분히 마른 상태라 발을 적시지 않고 걸을 수 있다. 그래도 배관
    안으로 하수가 줄줄 흘러내리고 있어, 당신이 건기에 이곳을 방문하기로 한 것이 다행이라고 결론을 내린다.
  exits:
    north:
      look: 당신의 빛이 닿는 한계까지, 배관은 북쪽으로 이어진다.
    west:
      look: 하수구 입구가 보인다.

tba:37:room:3704:
  name: 지하 깊은 곳의 배관
  description: >-
    당신은 수도의 하수도에 있는, 사람보다 훨씬 큰 배관 안을 걷고 있다. 북쪽에서 긁는 소리와 작은 동물들의 소리가 들린다. 조금 전에는 쥐 발자국을 보았는데, 당신의 취향에는
    좀 너무 컸다.
  exits:
    north:
      look: 배관이 계속 이어진다.
    south:
      look: 배관이 꺾이는 곳이다.

tba:37:room:3705:
  name: 지하 깊은 곳의 배관
  description: >-
    쥐 소리를 더 이상 무시할 수 없다. 큰 배관에는 최근의 발톱과 이빨 자국이 남아 있다. 여기서 사는 것이 평범한 쥐보다 훨씬 크다는 것은 분명하다. 여기서 북쪽으로 가면 교차로가
    희미하게 보이고, 남쪽으로는 배관이 계속 이어진다.
  exits:
    north:
      look: 삼거리이다.
    south:
      look: 당신의 빛이 닿는 곳보다 더 멀리 배관이 이어진다.

tba:37:room:3707:
  name: 삼거리 교차로
  description: >-
    당신은 한때 북동쪽으로 꺾이던 배관 안에 서 있다. 그러나 서쪽에는 배관에 큰 구멍이 있어 그쪽으로 갈 수도 있다. 구멍을 살펴보니 인공적으로 만든 것이 아니다. 가장자리에 꽤
    큰 이빨 자국이 있어, 하수도에 사는 어떤 설치류가 만든 것으로 보인다. 쥐가 기어다니는 소리가 동쪽과 서쪽에서 모두 크게 들린다.
  exits:
    east:
      look: 터널이 계속 이어지며 북쪽으로 꺾인다.
    south:
      look: 배관이 여기서 남쪽으로 이어진다.
    west:
      look: 여기 벽을 뚫어 구멍이 뚫려 있다. 그 너머로 흙벽이 보인다.
  extras:
  - text: 물린 자국이 깊고, 대략 8인치(약 20센티미터) 정도 넓다.
  - text: 구멍은 높이가 90센티미터쯤 되는데, 큰 쥐들이 파낸 것이 틀림없다. 구멍 안은 온통 이빨 자국투성이다.

tba:37:room:3708:
  name: 터널의 굽은 곳
  description: >-
    배관이 북쪽과 서쪽으로 꺾여 있다. 북쪽에는 배관을 막고 있는 격자가 있다. 누군가 오래전부터 이곳에 내려와 격자를 청소한 적이 없는 듯, 현재 위치에서 움직이지 않고 있다.
    넘어갈 수 없는 상황이다. 그 너머에서 동물들의 소리가 들린다. 또다시 쥐를 떠올리지만, 소리가 너무 크다!
  exits:
    north:
      look: 격자는 분명히 경첩이 녹슬어 움직이지 않고, 오물로 뒤덮여 있다.
    west:
      look: 삼거리 교차로가 여기 있다.

tba:37:room:3709:
  name: 격자 남쪽
  description: >-
    당신은 매우 더러운 격자의 남쪽에 서 있다. 주위에는 당신이 평생 볼 수 있는 모든 사람의 부재의 증거가 널려 있다 - 무릎 높이까지 차오른 진흙, 벽에서 떨어지는 초록색 점액,
    진한 쥐 냄새, 천장에 자라는 곰팡이. 여기 있는 것만으로도 당신은 매우 더럽다고 느낀다. 또한 북서쪽에서 나는 수많은 소리를 무시할 수 없다. 마치 무언가가 잔치를 벌이는 것
    같다.
  exits:
    north:
      look: 파이프가 굽어 있다.
    south:
      look: 매우 더럽고 녹슨 격자가 여기 있다. 제자리에 고정되어 있다.

tba:37:room:3710:
  name: 북쪽 배수구 근처
  description: >-
    배관이 여기서 남쪽과 서쪽으로 꺾인다. 서쪽에 배수구가 보이고, 발목께로 물이 그쪽을 향해 흘러가는 것이 느껴진다. 벽에 핀 곰팡이가 빛을 내고 있어서 더러운 천장과 초록색 점액,
    큰 쥐들을 마음껏 살펴볼 수 있다. 서쪽에서 커다란 생물들이 무언가를 먹는 소리가 들린다. 아니, 작은 것들이 여럿인 걸까?
  exits:
    south:
      look: 파이프가 남쪽으로 이어진다.
    west:
      look: 배수구가 여기 있다.

tba:37:room:3711:
  name: 북쪽 배수구
  description: >-
    당신은 중앙에 배수구가 있는 돔형 방 안에 있다. 원래 이 방은 동쪽에서 오는 파이프의 끝으로 설계되었지만, 쥐들은 동의하지 않는 것 같다. 그들은 여기서 남쪽에 둥지를 틀었고,
    서쪽으로 터널을 뚫었다. 방은 매우 더럽고, 원래 그렇게 의도되었더라도 공무원이 여기까지 들어올 리는 없다고 당신은 추측한다. 천장은 발광하는 곰팡이로 뒤덮여 방이 낮처럼 밝다.
    생물들이 먹고 뼈를 부수는 소리가 들린다. 소리의 원천은 여기서 남쪽인 것 같다.
  exits:
    east:
      look: 파이프가 동쪽으로 뻗어 있다.
    south:
      look: 쥐의 굴이 보인다. 여기서 보면 약간 흐릿하다.
    west:
      look: 많은 이빨로 갈아 만든 구멍이 흙 터널로 이어진다.
  extras:
  - text: 격자가 덮인 구멍, 즉 배수구는 수도의 오염된 물을 강으로 바로 흘려보내기 위해 있다. 물론 하류로.

tba:37:room:3712:
  name: 흙 터널
  description: >-
    이 낮은 터널은 많은 발톱으로 파서, 벽이 매끄럽지는 않지만 적어도 만져질 때 부드럽고, 당신은 여기서 매우 안전하다고 느끼지 못한다. 기어가는 당신으로서는 터널이 성인 한 명을
    감당할 수 있을지 걱정된다. 여기서 동쪽에는 돔형 방이 보이며, 당신이 기어가는 흙과는 전혀 다르지만, 남쪽으로는 더 많은 흙만 보인다. 또한 동쪽에서 큰 소리가 들린다 - 거의
    씹는 소리 같다.
  exits:
    east:
      look: 북쪽 배수구.
    south:
      look: 흙 터널이 이어진다.

tba:37:room:3713:
  name: 흙 터널 안
  description: >-
    멀리까지 보이는 한계까지 시선을 던져도 상황은 더 나빠질 수 없을 것 같다. 당신은 손과 무릎으로 기어 흙바닥을 지나고 있으며, 시야에 들어오는 구석구석에서 뚜렷한 탈출구는 보이지
    않는다. 당신 주위에는 발톱 자국이 여기저기 남아 있어, 개 크기쯤 되는 쥐 떼가 바로 근처에 서식하고 있음을 암시한다. 게다가 북쪽에서 이상한 소리가 들려온다.
  exits:
    north:
      look: 흙 터널이 이어진다.
    south:
      look: 흙 터널이 이어진다.

tba:37:room:3714:
  name: 흙 터널
  description: >-
    이 터널은 크지 않다. 손과 무릎으로 기어야 겨우 들어갈 수 있을 정도라, 전체 상황을 파악하기가 어렵다. 하지만 벽에 남은 흔적들을 보면 이 터널이 자주 사용되고 있는 것이
    분명하므로, 어딘가로 이어져 있을 것이라는 데에는 의심의 여지가 없다. 당신은 북쪽으로 기어갈 수도 있고, 동쪽의 삼거리로 향할 수도 있다.
  exits:
    north:
      look: 흙 터널이 이어진다.
    east:
      look: 삼거리가 보인다.

tba:37:room:3715:
  name: 쥐 왕의 소굴
  description: >-
    당신은 벽을 파서 만든 동굴 안에 있다. 가장 먼 구석에는 잔해가 쌓여 둥지 모양을 이루고 있고, 출구 쪽에 가까워질수록 오래된 뼈더미가 쓰레기 더미를 형성하고 있다. 적어도
    당신의 추측으로는 그렇다. 사실 정확히 말하기는 어렵다. 이 방은 나머지 쥐들보다 훨씬 크고, 적어도 어느 정도의 지능을 가진 것으로 보이는 거대한 쥐의 소굴이다. 발광하는 균류에서
    나오는 어두운 빛을 반사하는 반짝이는 물건들이 둥지 여기저기에 흩어져 있다. 쥐 왕이 다른 쥐들이 떨어뜨린 것들을 모아둔 것 같다.
  exits:
    north:
      look: 북쪽 배수구.
  extras:
  - text: 반짝이는 것이 다 금이 아니야 - 보석도 아니고!

tba:37:room:3716:
  name: 북쪽 배수관
  description: >-
    큰 배수관 안에 서 있으니, 발목 주변에 있는 진흙이 북쪽으로 흘러가는 것이 느껴진다. 당신은 이 방에서 곧게 설 수 있으며, 당신이 판단하기로는 북쪽에 큰 배수구가 있는 것
    같다.
  exits:
    north:
      look: 배수구가 있는 돔형 방이 보인다.
    south:
      look: 하수구 입구가 보인다.

tba:37:room:3717:
  name: 구덩이 가장자리
  description: >-
    당신은 거대한 돔형 방 한가운데, 바닥에 난 약 60센티미터 너비의 구멍 가장자리에 서 있다. 찝찝한 오물이 구멍 가장자리에서 똑똑 떨어지고, 냄새는 참을 수 없을 정도로 역겹다.
    구멍 가장자리에 다가가 아래를 내려다보니, 바닥까지 약 6미터 정도 되는 깊이가 보인다. 내려갈 수 있을지 시험해 볼 생각은 들지 않고, 구멍 벽면에 새겨진 사다리를 발견한다.
    구멍을 더 자세히 살펴보니, 더 아래쪽에는 격자가 설치되어 있다.
  exits:
    south:
      look: 커다란 배관이 남쪽으로 이어진다.

tba:37:room:3718:
  name: 서쪽 분기점
  description: >-
    방에 들어서니 서쪽, 북쪽, 동쪽으로 이어지는 터널이 보인다. 이 방은 그저 배관이 만나는 분기점에 불과하다. 역한 물이 서쪽과 북쪽에서 흘러들어와 동쪽으로 빠져나간다. 여기의
    냄새는 코를 찌르는 고문과도 같지만, 다행히 당신은 이제 그 냄새에 익숙해지기 시작하고 있다.

tba:37:room:3719:
  name: 북-남 배관
  description: >-
    여기는 거대한 관이다. 남쪽의 분기점에서부터 북쪽으로 곧장 이어지며, 양쪽에서 수많은 작은 배관이 합류한다. 이 작은 배관들은 들어갈 수 없을 정도로 좁고, 오물이 당신의 길을
    가로막으며 무작정 쏟아진다. 당신의 빛이 닿는 한도 내에서, 이 배관은 북쪽으로 끝없이 이어진다.
  extras:
  - text: 이 작은 배관들에서 오물이 거대한 관으로 쏟아져 들어와, 여기서 더 큰 배관을 통해 여정을 시작한다.

tba:37:room:3720:
  name: 북-남 배관
  description: >-
    여기는 거대한 관이다. 남쪽과 북쪽으로 이어지며, 양쪽에서 수많은 작은 배관이 합류한다. 이 작은 배관들은 들어갈 수 없을 정도로 좁고, 오물이 당신의 길을 가로막으며 무작정
    쏟아진다. 이 배관은 작은 구멍이 뚫린 매우 튼튼한 격자로 막혀 있는 것 같다. 작은 구멍을 통해 수많은 박쥐가 보인다. 이 격자가 설치된 데는 분명 이유가 있는 듯하다.

tba:37:room:3721:
  name: 격자 남쪽
  description: >-
    당신은 냄새의 변화를 즉시 알아차린다. 배설물이다. 박쥐들이 이 하수구 일부를 자신들의 영역으로 삼은 것이다. 분명히 남쪽에 있는 격자는 박쥐들이 하수구 전체로 번지지 못하도록
    막기 위한 것이다. 격자를 통해 파이프가 보인다. 서쪽이나 북쪽으로 가면 박쥐들의 영역으로 들어갈 수 있다.

tba:37:room:3722:
  name: 궁륭형 동굴
  description: >-
    당신은 큰 궁륭형 방 안에 있다. 하수구를 지은 사람들이 여기서 생활하고 물건을 보관했던 곳이었음을 깨달았다. 덕분에 북쪽에서 느껴지는 신선한 공기의 냄새가 이해가 된다. 천장에
    붙어 있는 수백만 마리의 박쥐가 당신을 완전히 무시하고 있는 것도 설명이 된다. 날카로운 틈으로 북쪽으로 계속 갈 수 있고, 남쪽으로 가면 파이프 쪽으로 이어진다.
  extras:
  - text: 처음에는 바위의 얼굴이라고 생각했던 것이, 갑자기 천장 전체에 나란히 앉아 있는 박쥐들이라는 것을 깨닫는다.

tba:37:room:3723:
  name: 바깥 근처
  description: >-
    여기서 북쪽 벽 위쪽의 구멍을 통해 바깥을 볼 수 있다. 구멍 아래에는 오래된 나무 사다리가 놓여 있어 발로 오를 수 있게 되어 있다. 구멍을 통해 박쥐들이 들락날락하고 있다.
    당신이 판단하기로는 위로 올라가면 수도 밖으로 나가게 될 것이다. 남쪽으로 가면 큰 방으로 갈 수도 있다.

tba:37:room:3724:
  name: 옆 터널
  description: >-
    이 터널은 박쥐들로 가득 차 있다. 일부는 날아다니며 길을 아는 것 같고, 일부는 당신이 지나갈 때 그저 천장에 매달려 있을 뿐이다. 박쥐가 희생자의 피를 빨아먹는다는 이야기를
    떠올리며 등줄기가 서늘해진다. 동쪽으로 나가 이 옆 터널을 벗어날 수 있고, 터널은 북쪽으로 이어진다.

tba:37:room:3725:
  name: 옆 터널
  description: >-
    옆 터널이 계속 이어진다. 여전히 박쥐가 여기저기 가득하다. 천장에 달라붙은 박쥐에 머리를 부딪지 않으려면 거의 허리를 숙여야 하고, 어디를 보아도 더 많은 박쥐가 있는 것 같다.
    하지만 이 박쥐들은 당장 당신에게 해를 끼치려 하지 않는다. 터널은 여기서 북쪽과 남쪽으로 이어진다.

tba:37:room:3726:
  name: 옆 터널의 굽이
  description: >-
    여전히 더 많은 박쥐가 보인다. 천장에 자리를 잡기 위해 서로 기어오르고 있다. 몇 마리는 당신의 존재에 대해 약간 적대적인 태도를 보인다. 터널은 여기서 방향을 바꿔 서쪽과
    남쪽으로 이어진다.

tba:37:room:3727:
  name: 서쪽 터널
  description: 터널은 끝없이 이어지는 것 같다. 벽의 작은 구멍에서 점액이 바닥으로 떨어지고, 박쥐가 여기저기 가득해 거의 미칠 것 같다. 터널은 서쪽에서 동쪽으로 뻗어
    있다.

tba:37:room:3728:
  name: 서쪽 터널
  description: 터널은 끝없이 이어지는 것 같다. 벽의 작은 구멍에서 점액이 바닥으로 떨어지고, 박쥐가 여기저기 가득해 거의 미칠 것 같다. 터널은 서쪽에서 동쪽으로 뻗어
    있다.

tba:37:room:3729:
  name: 서쪽 배관의 굽은 곳
  description: >-
    여기서는 무릎까지 오는 물이 북쪽에서 흘러들어온다. 하수 냄새가 코를 찌를 정도로 심하고, 물이 너무 더러워서 그 위에 걸어서 걸을 수 있을 정도라면 놀라지 않을 것이다. 불행히도
    물은 당신을 떠받쳐 주지 않고, 그저 부츠 안으로 스며들 뿐이다. 서쪽 벽의 높은 곳에 작은 구멍 하나가 보인다. 못으로 박은 판자 몇 장으로 막아 놓은 듯하다. 하지만 당신에게는
    너무 높아 닿을 수 없다. 배관은 북쪽으로 이어지고, 동쪽에는 분기점이 있다.
  extras:
  - text: 직경이 약 90센티미터인 구멍으로, 나무 판자로 못질하여 막아 놓았다.

tba:37:room:3730:
  name: 지루한 배관
  description: >-
    여기서는 무릎까지 오는 물이 북쪽에서 흘러들어온다. 하수 냄새가 코를 찌를 정도로 심하고, 물이 너무 더러워서 그 위에 걸어서 걸을 수 있을 정도라면 놀라지 않을 것이다. 불행히도
    물은 당신을 떠받쳐 주지 않고, 그저 부츠 안으로 스며들 뿐이다. 여기에는 별다른 흥미로운 것이 없다. 배관은 북쪽과 남쪽으로 이어진다.

tba:37:room:3731:
  name: 지루한 배관의 굽은 곳
  description: >-
    여기서는 무릎까지 오는 물이 서쪽에서 흘러들어온다. 하수 냄새가 코를 찌를 정도로 심하고, 물이 너무 더러워서 그 위에 걸어서 걸을 수 있을 정도라면 놀라지 않을 것이다. 불행히도
    물은 당신을 떠받쳐 주지 않고, 그저 부츠 안으로 스며들 뿐이다. 벽에서 나온 작은 배관들이 당신 주위의 하수구로 진흙을 흘려보낸다. 서쪽으로는 물이 조금 더 깨끗해 보인다.
    남쪽으로 지루한 배관이 이어진다.

tba:37:room:3732:
  name: 지루한 배관
  description: >-
    여기서는 무릎까지 오는 물이 북쪽에서 흘러들어온다. 하수 냄새가 코를 찌를 정도로 심하지만, 동쪽보다 물이 조금 덜 오염되어 있다. 불행히도 여전히 물은 당신을 떠받쳐 주지 않고,
    그저 부츠 안으로 스며들 뿐이다. 벽에서 나온 작은 배관들이 당신 주위의 하수구로 진흙을 흘려보낸다. 서쪽과 동쪽 모두에서 배관의 굽은 곳이 보인다.

tba:37:room:3733:
  name: 지루한 배관의 굽은 곳
  description: >-
    여기서는 무릎까지 오는 물이 남쪽에서 흘러들어온다. 하수 냄새는 여기가 덜하고, 물은 동쪽보다 조금 더 맑아 보인다. 하지만 여전히 오염되어 있다. 벽에서 나온 작은 파이프들이
    주위 하수에 오물을 새우고 있다. 남쪽으로는 물이 더 맑아 보인다. 동쪽으로는 지루한 파이프가 이어진다.

tba:37:room:3734:
  name: 지루한 배관
  description: >-
    여기서는 무릎까지 오는 물이 남쪽에서 흘러들어온다. 하수 냄새는 여기가 아주 강하지 않고, 물은 북쪽보다 조금 더 맑아 보인다. 하지만 여전히 조금 오염되어 있다. 벽에서 나온
    몇 개의 작은 파이프들이 주위 물에 오물을 새우고 있다. 남쪽으로는 물이 더 맑아 보인다. 북쪽으로는 파이프가 굽어 있다.

tba:37:room:3735:
  name: 이상한 멈춤
  description: >-
    터널이 갑자기 끝난다. 당신이 서 있는 방은 인간 손으로 만든 것이 아니다. 흐르는 물이 깎아 만든 자연의 작품이다. 분명 하수를 파던 사람들이 갑자기 이 방에 도달했고, 다시
    막을 방법을 찾지 못했던 것이다. 동쪽 벽에서는 어떤 자연 동굴에서 맑은 물이 들어와, 들어갈 수 없을 정도로 작은 구멍을 지나 대부분이 여기서 동쪽으로 더 큰 구멍을 통해 이어진다.
    하지만 남쪽으로는 무거운 자물쇠가 채워진 금속 문이 당신의 통행을 막고 있다. 문의 일부 철창 너머로 고요한 물과 계류된 배가 보인다. 일부 물은 당신의 북쪽 파이프를 통해 흐르며
    자연스러운 흐름을 만든다.
  exits:
    south:
      look: 당신을 밖으로 내보내기 위해 자물쇠가 채워진 무거운 강철 문.

tba:37:room:3736:
  name: 구멍 옆
  description: >-
    벽을 따라 선반이 있는 작은 방에 들어선다. 방 중앙 근처에는 흐르는 물에 의해 침식된 큰 구멍이 있다. 당신이 아무리 오래 숨을 참아도, 그 구멍은 물의 압력으로 인해 분명
    당신을 죽일 것임을 깨닫는다. 또한 누군가가 이 곳이 안전하다고 생각하여 숨겨둔 여러 상자들이 보인다. 구멍에 빠질 위험을 감수하지 않고는 물과 싸울 수 없으므로, 당신은 동쪽
    벽 위쪽에 있는 작은 구멍으로만 나갈 수 있다.

tba:37:room:3737:
  name: 지하 낚시 연못 옆
  description: >-
    당신은 고요한 지하 연못 옆에 서 있다. 이곳은 거의 지하 호수라 할 만하다. 여기에는 배를 묶어둘 수 있는 계류 시설이 있고, 물속을 헤엄치는 물고기들이 보인다. 물고기들은
    당신의 빛에 이끌려 온다.

tba:37:room:3738:
  name: 연못
  description: >-
    잡기만 하면 되는 물고기들이 가득한 지하 호수다. 동쪽으로는 절벽이 물 위로 솟아 올라 당신의 길을 막고 있다. 남쪽과 서쪽으로는 연못이 이어지고, 북쪽으로는 계류 시설이 보인다.

tba:37:room:3739:
  name: 연못
  description: >-
    잡기만 하면 되는 물고기들이 가득한 지하 호수다. 남쪽과 동쪽으로는 절벽이 물 위로 솟아 올라 당신의 길을 막고 있다. 북쪽과 서쪽으로는 연못이 이어지고, 동쪽으로는 계류 시설이
    보인다.

tba:37:room:3740:
  name: 물웅덩이
  description: 잡기만 하면 되는 물고기들이 가득한 지하 호수다. 남쪽과 서쪽으로는 절벽이 물 위로 솟아 올라 당신의 길을 막고 있다. 북쪽과 동쪽으로는 연못이 이어진다.

tba:37:room:3741:
  name: 연못
  description: >-
    지하 호수. 물고기들이 잡히기만을 기다리고 있다. 서쪽으로는 절벽이 물 위로 솟아 올라 당신의 길을 막고 있다. 북쪽, 동쪽, 남쪽으로는 물이 이어진다. 이곳의 물은 꽤 깊어
    보인다.

tba:37:room:3742:
  name: 연못
  description: >-
    지하 호수. 물고기들이 잡히기만을 기다리고 있다. 북쪽과 서쪽으로는 절벽이 물 위로 솟아 올라 당신의 길을 막고 있으며, 남쪽으로는 물이 이어지고 동쪽으로는 계류장이 보인다.

tba:37:room:3743:
  name: 구멍을 통해
  description: >-
    구멍 가장자리에 서서 바깥쪽의 것들을 보고 있다. 아래를 내려다보니 거친 틈이 보이며, 낡은 나무 사다리를 타고 들어가 볼 수 있을 것 같다. 박쥐 떼가 당신 주위를 날아다니며
    거의 패닉에 빠지게 만든다.
  exits:
    north:
      look: 음, 물론 바깥이 보인다.

tba:37:room:3744:
  name: 동굴 밖
  description: >-
    당신은 음침한 동굴 밖에 서 있다. 가끔 박쥐 한 마리가 당신 주위로 날아나온다. 남쪽으로 가면 동굴로 들어갈 수 있지만, 여기서 서쪽으로 가면 도시 쪽으로 돌아갈 수 있다.
  exits:
    south:
      look: 동굴 입구는 유혹적으로 보인다 - 마치 먹이를 기다리는 입처럼..
    west:
      look: 자갈길이 도시 쪽으로 이어진다..

tba:37:room:3745:
  name: 수도 밖
  description: >-
    수도 바로 바깥이 이렇게 황량할 줄 누가 알았을까. 당신은 동쪽 바위투성이 지형 근처의 낮은 구릉지대에 서 있다. 여기서 남쪽으로 자갈길이 서부 대로 방향으로 이어진다.
  exits:
    east:
      look: 자갈길이 끝나고 지면이 바위투성이로 변한다.
    south:
      look: 자갈길이 남쪽으로 이어진다.

tba:37:room:3746:
  name: 자갈길 위
  description: 당신은 자갈길을 따라 걷고 있다. 여기서 북쪽으로 자갈길이 이어지고, 남쪽으로는 서부 대로의 번잡함 속으로 들어간다.
  exits:
    north:
      look: 자갈길이 이어진다...
    south:
      look: 당신은 서부 대로 바로 북쪽, 서문 바로 바깥에 있다.

tba:37:mob:3700:
  short: 큰 쥐
  long: 큰 쥐 한 마리가 여기저기 뛰어다니며 당신이 다가오자 지그재그로 움직인다.
  description: 가까이서 보니 쥐의 이빨에 핏자국이 보인다. 당신의 따뜻한 살갗에 그 이빨을 박으려다시피 하므로, 그 핏자국이 더욱 선명하게 드러난다.

tba:37:mob:3701:
  short: 큰 쥐
  long: 큰 쥐 한 마리가 여기 있다. 먹이를 찾고 있다.
  description: 이 쥐는 그렇게 위협적으로 보이지 않지만, 심하게 몰아붙이면 분명히 반격할 것이다.

tba:37:mob:3702:
  short: 수호자 쥐
  long: 거대한 쥐가 여기 있다. 당신이 가까워지자 으르렁거린다. 조심해 - 물면 큰일이다!
  description: 이 전투의 상처로 뒤덮인 쥐는 어디로도 가지 않을 것이다. 하지만 당신은 죽은 뒤 이 쥐의 배속으로 들어갈 운명이다. 여기서 빨리 벗어나는 게 낫다.

tba:37:mob:3703:
  short: 쥐 왕
  long: 거대한 쥐가 반짝이는 돌더미 위에 서 있다.
  description: >-
    쥐 왕은 너무 커서 마법이 유일한 설명이 될 수 있다. 마법사들이 하수구의 동물들을 실험에 사용한다는 소문이 오래전부터 돌았다. 이것이 그 최종 증거다. 쥐를 더 자세히 살펴보니,
    그 눈 속에 지능의 작은 빛이 반짝이는 듯하다.

tba:37:mob:3704:
  short: 박쥐
  long: 박쥐가 여기 천장에 매달려 있다.
  description: 작은 박쥐가 하루 종일 푹 자고 있다.

tba:37:mob:3705:
  short: 박쥐
  long: 박쥐가 여기 있다. 빠르게 날아다니고 있다.
  description: 작은 박쥐가 동굴 밖으로 나가 먹이를 구하러 나갈 준비를 하고 있다.

tba:37:mob:3706:
  short: 거대 박쥐
  long: 거대한 박쥐가 당신을 먹잇감으로 삼을지 고민하고 있다.
  description: 이 거대 박쥐를 보니 소름이 돋는다. 그저 당신 주위를 맴돌기만 해도 등골이 오싹하다.

tba:37:mob:3707:
  short: 흡혈 박쥐
  long: 거대한 박쥐가 있다. 얼굴에 신선한 피가 묻어 있다.
  description: 이 거대 박쥐를 보니 소름이 돋는다. 곧 당신의 피도 맛보게 될 것임을 깨닫는다.

tba:37:mob:3708:
  short: 송어
  long: 송어 한 마리가 여기에서 즐겁게 헤엄치고 있다.
  description: 지하 호수는 바깥 강과 이어져 있는 모양이다. 이 물고기는 건강하고 신선해 보인다.

tba:37:mob:3709:
  short: 눈먼 물고기
  long: 눈먼 물고기가 있다. 온통 하얗다.
  description: 평생을 이 동굴에서 살아온 탓에 이 물고기는 눈을 한 번도 써 본 적이 없다. 당신의 횃불 빛에 그만 눈이 멀어 버렸다.

tba:37:mob:3710:
  short: 거대 굴
  long: 여기 바닥에 거대한 굴이 놓여 있다.
  description: 당신은 굴에 아주 가까이 다가가지만, 갑자기 굴이 쾅 하고 닫혀 안쪽을 볼 수 없게 된다.

tba:37:mob:3711:
  short: 작은 토끼
  long: 작은 토끼 한 마리가 여기서 풀을 뜯어먹고 있다.
  description: >-
    당신은 이 녀석들을 전에 본 적이 있다. 그리고 어릴 때 쥐처럼 쫓아다녀 잡기도 했다. 이 녀석들은 작고 털북숭이며, 어디를 가든 엄청난 양의 작은 검은 진주를 만들어 낸다...

tba:37:mob:3712:
  short: 작은 고양이
  long: 작은 회색과 검은색 줄무늬 고양이가 새를 잡으려 기다리고 있다.
  description: 매우 친절하고 달콤해 보인다. 하지만 손을 내밀어 쓰다듬으려 하면, 이 녀석은 물고 할퀴어 당신의 손가락 절반이 없어진 채로 끝나게 된다...

tba:37:mob:3713:
  short: 여우
  long: 작은 여우 한 마리가 여기서 기웃거리고 있다.
  description: 붉은색, 그리 크지 않은 육식동물로, 귀와 코가 뾰족하다 - 물론 이빨도 뾰족하다...

tba:37:obj:3700:
  short: 반짝이는 물건 더미
  long: 반짝이는 물건들이 여기 한 무더기로 쌓여 있다.
  extras:
  - text: 왕 쥐는 반짝이는 물건을 좋아하는 것 같다. 이 더미에는 작은 유리 조각, 깨진 거울 조각, 예쁜 자갈, 그리고 가끔 잃어버린 금화가 들어 있다.

tba:37:obj:3701:
  short: 송어 필렛
  long: 송어 필렛이 여기 놓여 있다. 누가 배가 고프지 않았을까..

tba:37:obj:3702:
  short: 생선 필렛
  long: 어떤 낯선 생선의 필렛이 여기 있다.

tba:37:obj:3703:
  short: 진주
  long: 크고 반짝이는 진주 한 알이 여기 놓여 있다.

tba:37:obj:3704:
  short: 철사슬로 묶인 상자
  long: 여기 상자가 하나 있다. 안에 무엇이 숨겨져 있는지 지키고 있다.
  extras:
  - text: 상자는 강제로 열리지 못하도록 철사슬로 묶여 있다. 당신에게 다행인 것은 자물쇠가 단순한 구조라는 점이다.

tba:37:obj:3705:
  short: 아름다운 체인메일
  long: 여기 바닥에 아주 좋은 체인메일이 던져져 있다.
  extras:
  - text: 이 체인메일에 연결된 사슬은 품질이 좋아, 매우 아름답고 튼튼한 갑옷을 만들어 준다.

tba:37:obj:3706:
  short: 긴 단검
  long: 여기 행동에 대비된 긴 단검이 하나 있다.

tba:37:obj:3707:
  short: 낚시배
  long: 여기 작은 낚시배 한 척이 정박해 있다.
  extras:
  - text: 배는 매우 가벼운 종류의 나무로 만들어져 있어 들고 다닐 때 극도로 수월하다.

tba:37:obj:3708:
  short: 곰팡이 조각
  long: 천장에서 곰팡이가 매달려 있다.
  extras:
  - text: 거미줄 위에 자란 초록색 곰팡이 - 역겨워!

tba:37:obj:3709:
  short: 낡은 책상
  long: 여기에는 배설물로 뒤덮인 낡은 책상이 있다.
  extras:
  - text: >-
      세하 건설자들이 여기 남겨둔, 세월이 많이 지난 낡은 책상이다. 그리고 배설물도 잔뜩 묻어 있다. 전에 여기에 흥미로운 물건이 있었다면, 이제는 천장의 박쥐들이 남긴 수톤의
      배설물에 덮여 있을 것이다.

tba:37:obj:3710:
  short: 더러운 열쇠
  long: 여기에는 매우 더러운 열쇠가 놓여 있다.
  extras:
  - text: 낡고 매우 더러운 열쇠다. 자물쇠에서 꺼낸 자물쇠 열쇠가 어떤 모습일지 상상해 보라. 그리고 당연히 주변 진흙탕 때문에 더럽혀져 있다.
