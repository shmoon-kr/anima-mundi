# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:35, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:35:room:3500:
  name: 평원
  description: >-
    당신은 평원 위에 서 있다. 이곳은 바람이 아무런 방해 없이 울부짖을 수 있는 광활하고 황량한 곳이다. 당신을 제외하고는 그 길을 막는 것이 아무것도 없기 때문이다. 하지만 이곳을
    방황한 것은 당신만이 아니다. 당신 앞에 누군가가 작은 길을 남겨두었다. 그 길은 다소 어리둥절해 보이는 모양새로, 특별하거나 중요한 곳으로 이어지는 종류의 길은 아니지만, 멀리
    북쪽의 언덕으로 들어가기로 마음먹은 듯하다. 좁은 오솔길이 동쪽으로 뻗어 나가며 언덕 위로 이어진다.

tba:35:room:3501:
  name: 소로
  description:
  - 당신은 상쾌하고 그늘진 소로를 거닐고 있다. 길 양쪽에는 높고 우아한 나무들이 줄지어 서 있어, 이 풍경에 고요한 평온함을 더해주고 있다.
  - 당신은 길을 따라 북쪽이나 남쪽으로 갈 수 있다.

tba:35:room:3502:
  name: 나무 사이 길
  description:
  - >-
    여기서는 나무들이 빽빽하게 서 있고, 높고 무성한 잡초들이 동쪽과 서쪽을 제외한 모든 방향으로 멀리 볼 수 없게 막고 있다. 동쪽으로는 넓은 길이 멀리까지 이어져 있고, 서쪽으로는
    같은 길이 꽤 큰 도시로 이어져 보인다. 도시의 소란스러운 소리가 멀리서 당신의 귀에 들린다. 떠돌이 개들의 짖음, 아이들의 울음소리, 길거리 상인들의 외침이 들린다.
  - 가파른 길이 여기서 북동쪽으로 내려가며 난쟁이 마을로 이어지고, 작은 오솔길이 나무 사이를 지나 북쪽 언덕으로 이어진다.
  exits:
    east:
      look: 거대한 성이 보이는 방향으로 뻗어 나가는 상당히 넓은 길이 보인다.
    down:
      look: 사람들이 많이 밟아 만든 길이 북동쪽으로 내려가며 번화한 작은 마을로 이어진다.

tba:35:room:3503:
  name: 도시 입구
  description: >-
    당신은 큰 도시, 이 땅의 수도인 미드가르드의 외곽에 서 있다. 길은 동쪽으로 숲의 평화와 고요 - 그리고 위험 - 속으로 이어지고, 서쪽으로는 마을의 큰길이 되어 상점, 술집,
    시장이 뒤섞인 혼란스러운 풍경 속에 둘러싸여 있다.

tba:35:room:3504:
  name: 남쪽 문
  description: >-
    당신은 미드가르드 남쪽 문에서 벗어나 미덴니르 숲(고블린어로 '푸른 피'라는 뜻)으로 이어지는 좁고 먼지 낀 길을 걷고 있다. 동쪽으로는 아직 도시가 보이지만, 남쪽으로 가면
    신선한 공기와 초록빛이 펼쳐진다.
  exits:
    east:
      look: 남쪽 문의 성벽이 보인다.
    south:
      look: 남쪽으로 가면 미덴니르에 들어간다.

tba:35:room:3505:
  name: 미덴니르로 가는 길
  description: >-
    당신은 밝은 숲속에 있다. 남쪽으로 길이 이어지지만, 동쪽으로도 쉽게 나아갈 수 있다. 서쪽으로는 나무 꼭대기 위로 연기가 피어오르는 것이 보인다. 미드가르드 도시가 여기에서
    북쪽에 펼쳐져 있다.
  exits:
    north:
      look: 북쪽으로는 미드가르드의 남쪽 문이 보인다.
    east:
      look: 더 밝은 숲이 이어진다.
    south:
      look: 이 길은 미덴니르의 어둠을 관통한다.
    west:
      look: 서쪽 가까운 곳에 나무꾼의 여관이 보인다. 연기의 원천이 그곳인 것 같다.

tba:35:room:3506:
  name: 미덴니르
  description: 당신은 어두운 숲속에 있다. 동쪽으로는 산이 길을 막고 있다. 여기서 이동할 수 있는 길은 서쪽이나 남쪽의 더 밝은 숲뿐이다.
  exits:
    east:
      look: 동쪽으로는 솟아오른 산들이 보인다.
    south:
      look: 남쪽으로 갈수록 숲은 더 어두워진다.
    west:
      look: 서쪽으로 갈수록 숲은 밝아진다.

tba:35:room:3507:
  name: 미덴니르
  description: >-
    여기서는 숲이 깊고, 바람이 나무 사이로, 그리고 당신의 머리칼 사이로 불어온다. 북쪽으로 갈수록 숲은 밝아진다. 그러나 남쪽과 서쪽의 길은 당신을 더 깊은 숲속으로 데려간다.
  exits:
    north:
      look: 이 방향으로 숲은 더 밝다.
    south:
      look: 더욱 깊고 어두운 숲이 이어진다.
    west:
      look: 서쪽으로 이어지는 작은 길이 있다.

tba:35:room:3508:
  name: 작은 오솔길 위
  description: 미덴니르 숲의 어두운 숲을 관통하여 동쪽과 남쪽으로 이어지는 오솔길이 있다. 이곳 서쪽으로는 산맥이 지형을 가르고 있다.
  exits:
    east:
      look: 바람에 휩쓸리는 숲.
    south:
      look: 남쪽으로, 오솔길이 계속된다.

tba:35:room:3509:
  name: 미덴니르
  description: >-
    미덴니르의 나무들은 무성하고 초록빛이 짙으며, 이 숲에 도사린 악을 감추고 있다. 서쪽으로는 나무가 너무 빽빽해지지만, 당신은 북쪽이나 남쪽으로 갈 수도 있고, 이곳 동쪽에 있는
    산맥 쪽으로 이동할 수도 있다.
  exits:
    north:
      look: 이쪽으로는 나무가 조금 더 드물다.
    east:
      look: 이 방향에는 거대한 회색 산들이 솟아 있다.
    south:
      look: 숲이 계속된다.

tba:35:room:3510:
  name: 삼거리
  description: >-
    여기서 발이 닳도록 밟힌 오솔길들이 북쪽, 남쪽, 동쪽으로 이어지며 만난다. 이 지점에서 나무들이 당신을 에워싸는 듯하며, 머리 위 빽빽한 가지 사이로 하늘을 거의 볼 수 없다.
  exits:
    north:
      look: 눈에 보이는 곳까지 나무가 가득하다.
    east:
      look: 이쪽으로는 숲의 특히 어두운 부분이 있다.
    south:
      look: 이쪽으로는 숲의 특히 어두운 구역이 있다.

tba:35:room:3511:
  name: 산길
  description: 당신은 숲을 관통하는 북-남 방향의 산길 위에 있다. 서쪽으로는 넘을 수 없는 산들이 당신을 노려보고 있으며, 빽빽한 숲과 덤불이 서쪽 방향의 이동을 막고
    있다.
  exits:
    north:
      look: 산길이 북쪽으로 굽어진다.
    south:
      look: 남쪽으로, 오솔길이 다시 숲 안으로 들어간다.

tba:35:room:3512:
  name: 미덴니르
  description: >-
    미덴니르의 나무들은 무성하고 초록빛이 짙어, 이 숲속에 도사린 악을 가리고 있다. 북쪽으로는 산맥을 향해, 서쪽으로는 숲속으로 갈 수 있지만, 가파른 산 때문에 동쪽으로는 이동할
    수 없다.
  exits:
    north:
      look: 북쪽으로는 산맥이 보인다.
    south:
      look: 빛이 잘 드는 숲 한 구간이다.
    west:
      look: 숲이 이쪽으로 이어진다.

tba:35:room:3513:
  name: 미덴니르
  description: >-
    숲은 어둡고, 서쪽으로 갈수록 더욱 어두워진다. 이 숲속에 악한 무언가가 숨어 있다는 것을 당신은 감지한다. 북쪽으로는 숲이 밝아진다. 선택지를 고민하는 동안 바람이 거세게 불어온다.
  exits:
    north:
      look: 북쪽에는 작은 공터가 있다.
    west:
      look: 이쪽으로 갈수록 더 어둡고 짙어진다.

tba:35:room:3514:
  name: 깊은 숲
  description: >-
    여기는 매우 어둡고, 숲이 당신을 둘러싸고 있다. 한 걸음씩 내딛을 때마다 숲이 당신을 감싸며 더 어둡고 불길해진다. 이제 안전한 곳으로 돌아가는 때가 된 것 같다.
  exits:
    north:
      look: 숲이 더 이어진다.
    east:
      look: 밝은 숲과 멀리 보이는 산맥이다.
    south:
      look: 나무들이 더 이어진다.
    west:
      look: 숲이 이어진다.

tba:35:room:3515:
  name: 밝은 숲
  description: 여기서는 숲이 밝아 오솔길을 쉽게 따라갈 수 있다. 동쪽으로는 숲이 짙어지고 어두워진다. 남쪽으로는 오솔길이 이어진다.
  exits:
    north:
      look: 북남 방향으로 뻗은 오솔길이다.
    east:
      look: 동쪽으로 갈수록 나무들이 짙어진다.
    south:
      look: 나무들과 작은 언덕들이 있다.

tba:35:room:3516:
  name: 진흙투성이 땅
  description: >-
    여기 바닥은 꽤나 진흙투성이이며 사방에 웅덩이가 가득하다. 당신이 걸을 때마다 부츠에서 역겨운 쪼그락거리는 소리가 난다. 여기서는 네 방향 중 어느 쪽으로든 갈 수 있다.hopefully,
    더 마를 것이다.
  exits:
    north:
      look: 미덴니르 숲이 계속된다.
    east:
      look: 더 많은 나무들.
    south:
      look: 남쪽으로 갈수록 나무가 매우 짙어진다. 거의 보이지가 않는다...
    west:
      look: 나무가 드문드문하고 햇빛이 들어온다.

tba:35:room:3517:
  name: 산 근처
  description: 여기서 가장 두드러지는 특징은 동쪽에 펼쳐진 산이다. 바위 때문에 다른 방향으로는 갈 수 없으므로, 여기서는 북쪽과 서쪽만 갈 수 있다.
  exits:
    north:
      look: 북쪽으로 많은 나무들.
    west:
      look: 서쪽으로 약간 경사가 내려간다.

tba:35:room:3518:
  name: 사라지는 길
  description: 여기서 길은 거의 통행이 불가능할 정도로 험해진다. 숲이 비교적 드문드문하므로 북쪽으로 갈 수 있다. 남쪽으로는 길이 보인다.
  exits:
    north:
      look: 이쪽으로 길이 보인다.
    east:
      look: 이쪽으로 갈수록 나무 줄기가 거의 맞닿아 있다.
    south:
      look: 어두운 숲.

tba:35:room:3519:
  name: 어두운 길
  description: 당신은 양옆으로 나무에 둘러싸여 있다. 길은 북쪽과 남쪽으로 이어지며, 서쪽은 너무 짙어 탐험하기 어렵지만, 서쪽으로 숲속으로 들어갈 수는 있다.
  exits:
    north:
      look: 이쪽으로 갈수록 숲이 밝아진다.
    east:
      look: 숲이 계속된다.
    south:
      look: 이 방향에서 강한 악취가 난다.
    west:
      look: 이쪽으로 갈수록 나무 줄기가 거의 맞닿아 있다.

tba:35:room:3520:
  name: 어두운 숲
  description: >-
    당신은 덤불 사이를 힘차게 밟으며 나아간다. 미덴니르의 어두운 숲은 이곳에서 꽤 짙어지고, 머리 위 높은 나뭇가지들이 너무 빽빽해 직사광선을 완전히 가린다. 동쪽으로는 더 이상
    나아갈 수 없을 만큼 짙지만, 남서쪽으로 숲을 통해 길을 낼 수 있을지도 모른다.
  exits:
    south:
      look: 짙은 숲이 계속된다.
    west:
      look: 짙은 숲이 계속된다.

tba:35:room:3521:
  name: 학살의 현장
  description: >-
    여기서 당신은 끔찍한 광경을 목격한다. 온통 피투성이... 나무에도, 땅에도 스며들었다. 당신의 앞에 두 구의 시체가 놓여 있어 마치 당신을 올려다보는 듯하다. 남쪽으로는 숲이
    통행할 수 없지만, 다른 방향들은 괜찮아 보인다.
  exits:
    north:
      look: 어둠...
    east:
      look: 당신의 빛은 그 멀리까지 닿지 않는다.
    west:
      look: 더 어두운 숲.
  extras:
  - text: >-
      시체들은 크고 거친 창에 관통당한 것처럼 보인다. 이 사람들이 입은 상처의 정도는 정말 놀라울 따름이다. 더 나쁜 것은, 시체의 입술이 연한 파란색을 띠고 있어 체내에 독이
      들어간 것을 암시한다.

tba:35:room:3522:
  name: 미덴니르 숲의 깊은 곳
  description: >-
    여기서는 구역질 나는 악취가 난다. 피와 죽음의 냄새다. 북쪽으로는 햇빛이 스며드는 모습이 보인다. 동쪽으로는 아예 볼 수가 없다. 나무들이 가깝고 숨이 막힐 듯하다.
  exits:
    north:
      look: 날빛과 따라갈 수 있는 무늬가 보인다.
    east:
      look: 악취가 이쪽에서 나는 것 같다.

tba:35:room:3523:
  name: 어두운 숲
  description: >-
    머리 위의 나뭇가지들이 직사광선을 모두 가려 이 지역의 숲은 상당히 어둡다. 숲은 동쪽으로 계속되며, 그곳에서 산맥에 이른다. 공기는 고요하고 답답하다 - 서쪽에서 악취가 올라오고,
    불쾌한 기운이 목 뒤의 소름을 돋게 만든다!
  exits:
    north:
      look: 그 방향으로 훨씬 더 어두워지는 것 같다.
    east:
      look: 이 방향으로 숲이 훨씬 더 어두워지는 것 같다.
    west:
      look: 이 방향으로 하늘이 밝아진다.

tba:35:room:3550:
  name: 산의 발치
  description: 당신은 산발에 서 있다. 북쪽과 동쪽으로 더 가지 못할 정도로 급경사다. 남서 쪽으로는 미덴니르 숲의 무성한 초록이 보인다.
  exits:
    south:
      look: 미덴니르 숲이 당신 앞에 펼쳐져 있다.
    west:
      look: 미덴니르 숲이 당신 앞에 펼쳐져 있다.

tba:35:room:3551:
  name: 미덴니르 숲의 깊은 곳
  description: >-
    머리 위 나뭇가지들이 모든 직사광선을 가려 이 지역의 숲은 매우 어둡다. 서쪽으로는 숲이 이어지지만, 남쪽으로 산속에 파인 작은 터널을 제외하면 모든 방향은 산에 막혀 더 이상
    탐험할 수 없다.
  exits:
    south:
      look: 터널은 산속으로 이어진다.
    west:
      look: 숲은 계속되지만 점점 밝아지는 것 같다.

tba:35:room:3552:
  name: 산속의 터널
  description: 이 터널 벽은 이 숲의 고블린들이 수년 전에 파낸 것이다. 바닥은 닳았으며 남쪽으로 산속으로, 또는 북쪽으로 숲 밖으로 이어진다.
  exits:
    north:
      look: 밖으로 나가면 미덴니르 숲이 보인다.
    south:
      look: 터널은 남쪽으로 이어진다.

tba:35:room:3553:
  name: 산속의 터널
  description: 터널은 북쪽으로 갈수록 밝아져 밖으로 나갈 것 같고, 남쪽으로는 통로가 점점 좁아진다. 동쪽 벽에 작은 아치형 구멍이 파여 있다.
  exits:
    north:
      look: 이 방향으로 터널은 넓어진다.
    east:
      look: 작은 아치형 구멍이 보인다.
    south:
      look: 이 방향으로 터널은 좁아진다.

tba:35:room:3554:
  name: 작은 구석
  description: 여기에 작은 골짜기가 파여 있다. 나뭇가지와 잎사귀가 한 무더기로 쌓여 있어, 아마도 잠자리로 쓰고 있는 모양이다.
  exits:
    west:
      look: 주요 통로가 보인다.
  extras:
  - text: 나뭇가지와 잎사귀는 모두 작은 humanoid의 임시 침대로 쓰이기 위해 한데 모아서 쌓여 있다.

tba:35:room:3555:
  name: 산속의 터널
  description: >-
    산악 지대를 더 깊이 탐험할수록 남쪽의 터널은 점점 좁아진다. 이 지역을 통과하려면 거의 몸을 구부려야만 한다. 남쪽의 작은 아치형 통로는 넓고 큰 방으로 이어진다.
  exits:
    north:
      look: 터널은 북쪽으로 이어진다.
    south:
      look: 작은 동굴이 보인다.

tba:35:room:3556:
  name: 고블린 본거지
  description: >-
    터널이 넓어지며 고블린들에게는 큰 편인 동굴로 이어진다. 이곳은 미덴니르의 고블린들이 사는 곳이다. 방 안에는 최근의 식사 잔재로 보이는 수많은 숲 속 동물들의 뼈가 여기저기
    흩어져 있다.
  exits:
    north:
      look: 터널이 북쪽으로 이어진다.

tba:35:room:3570:
  name: 여관 앞
  description: >-
    당신은 닳아진 길을 따라 걷다가 빈터에 서 있다. 여기에는 굴뚝에서 연기가 피어오르는 낡은 목조 건물이 있다. 서쪽 현관에는 그림이 그려진 간판이 보인다. 건물을 북쪽이나 남쪽으로
    돌아갈 수도 있고, 이 곳을 떠나 숲으로 돌아갈 수도 있다.
  exits:
    north:
      look: 여관을 북쪽으로 돌아갈 수 있다.
    east:
      look: 나무들 사이를 지나 미덴니르로 돌아간다.
    south:
      look: 여관을 남쪽으로 돌아갈 수 있다.
    west:
      look: 여관 앞문이 당신을 부른다.
  extras:
  - text: '간판에는 이렇게 적혀 있다: 목수'

tba:35:room:3571:
  name: 여관 북쪽
  description: >-
    당신은 여관 북쪽에 서 있다. 이 각도에서는 풍경이 크게 달라 보이지 않는다. 여기 공기는 연기와 요리 냄새로 가득 차 있다. 남쪽으로는 앞 현관이 당신을 기다리고 있다...
    혹은 뒷문이 있는지 확인할 수도 있다.
  exits:
    south:
      look: 여관 앞이 보인다.

tba:35:room:3572:
  name: 여관 남쪽
  description: >-
    당신은 여관 남쪽에 서 있다. 북쪽으로 가서 앞문으로 들어갈 수도 있고, 서쪽으로 가서 건물 뒤로 갈 수도 있다. 여기에서 남쪽으로 이어지는 좁은 길에서 희미한 비명 소리가 들린다.
  exits:
    north:
      look: 이 길은 여관 앞으로 이어진다.
    south:
      look: 길이 남쪽으로 이어진다.
    west:
      look: 이 길은 여관 뒤로 이어진다.

tba:35:room:3573:
  name: 여관 뒤
  description: >-
    당신은 여관 뒤에 서 있다. 여관주인과 그의 하인들이 이곳에 많은 쓰레기를 버리기 때문에 냄새가 그리 상쾌하지 않다. 서쪽에는 쓰레기 더미가 몇 개 쌓여 있지만, 그곳을 뒤지다
    보면 더 심한 냄새를 맡게 될 것이다. 깔끔한 대안으로, 여관을 동쪽으로 돌아갈 수 있다.
  exits:
    east:
      look: 이쪽으로 가면 여관을 돌아갈 수 있다.
    west:
      look: 쓰레기 더미에서 노니는 것은 쥐와 어리석은 모험가들뿐이다.

tba:35:room:3574:
  name: 나무꾼 여관
  description: >-
    당신은 나무꾼 여관의 공용실에 있다. 공중에는 연기가 희미하게 피어오르고 있다. 최근 숲이 고블린으로 뒤덮여 이 일대가 더 이상 안전하지 않기 때문에 여관은 종종 텅 비어 있다.
    바는 바로 북쪽에 있다. 만약 당신만의 테이블을 원한다면, 남쪽에는 빈 테이블이 하나 있다.
  exits:
    north:
      look: 여관주인이 지키는 바가 여기 있다.
    east:
      look: 이제 나가서 더 신선한 공기를 쐬러 갈 수 있다.
    south:
      look: 빈 테이블은 희귀한 물건이다.
    west:
      look: 남쪽에는 술꾼이 차지하고 있는 테이블이 있다.

tba:35:room:3575:
  name: 매복 지점
  description: >-
    여기는 여관 남쪽에 있는 잡초가 무성한 오솔길이다. 서쪽으로 이어지지만, 멀리까지 따라가기는 어려울 것이다. 덤불들이 짓밟혀 있고 중간 크기의 나뭇가지들이 쓰러져 있다. 분명
    최근 이곳에서 전투가 있었음이 분명하다.
  exits:
    north:
      look: 북쪽에 여관이 있다.
    west:
      look: 숲을 관통하는 오솔길이 보인다.

tba:35:room:3576:
  name: 바
  description: >-
    과거에는 사람들이 여관주인의 음식, 술, 그리고 환대를 즐기러 이곳에 왔지만, 최근에는 숲을 통과해 살아남는 몇 안 되는 모험가들에게만 술을 서빙한다. 남쪽으로 나가면 공용실로
    돌아갈 수 있다.
  exits:
    south:
      look: 남쪽으로 물러나 공용실로 돌아갈 수 있다.

tba:35:room:3577:
  name: 시인의 테이블
  description: 당신은 여관의 어두운 구석에 있다. 여기에는 나무 의자 몇 개가 둘러진 큰 원형 테이블이 놓여 있다. 테이블에는 엎질러진 음료가 남긴 큰 얼룩이 있다.
  exits:
    east:
      look: 여관의 1층 홀이 보인다.

tba:35:room:3578:
  name: 쓰레기 더미
  description: 당신은 무릎 높이까지 쌓인 쓰레기 더미에 서 있다. 역겹다!!! 냄새가 끔찍하고, 이 더러운 더미 속에 어떤 해충이 살고 있는지 알 수 없다...
  exits:
    east:
      look: 이쪽으로 가면 더 깨끗한 곳으로 돌아갈 수 있다.

tba:35:room:3579:
  name: 여관의 조용한 구역
  description: 목수길 여관의 이 끝에는 아무도 없는 것 같다. 아마도 쉬고 상처를 치유하기에 안전한 장소일 것이다...
  exits:
    north:
      look: 공용 홀이 보인다.

tba:35:room:3581:
  name: 기수들의 길 위
  description: 길은 여기서 동서로 이어진다. 당신은 부드러운 땅 위에 남은 신선한 발자국을 발견한다. 기수들이 서쪽으로 도망쳤음을 보여주는 발자국이다.
  exits:
    east:
      look: 매복 지점으로 돌아간다.
    west:
      look: 길이 이어진다.

tba:35:room:3582:
  name: 기수들의 길 위
  description: 길은 동쪽과 남쪽으로 이어진다. 당신은 부드러운 땅 위에 새겨진 신선한 발자국을 발견한다. 기수들이 방향을 틀어 남쪽으로 도망친 흔적이다.
  exits:
    east:
      look: 길이 이어진다.
    south:
      look: 발자국이 남쪽으로 이어진다.

tba:35:room:3583:
  name: 기수들의 길 위
  description: 기수들의 길은 숲을 관통하는 이 길을 따라 동쪽과 북쪽으로 이어진다. 발자국이 아직 선명하니, 그들은 분명 근처에 있을 것이다.
  exits:
    north:
      look: 길이 이어진다.
    west:
      look: 발자국이 동쪽으로 이어진다.

tba:35:room:3584:
  name: 막다른 길
  description: >-
    나무들이 당신을 에워싸며 더 이상의 탐험을 불가능하게 만들며, 길은 여기서 갑자기 끝난다. 신선한 발자국이 지면을 뒤덮고 있으며, 정확히 여기서 끝난다. 기수들은 분명 근처에
    있을 것이다.
  exits:
    east:
      look: 길로 돌아가는 곳.

tba:35:mob:3500:
  short: 와이번
  long: 거대한 와이번이 당신의 머리 바로 위에서 천천히 원을 그리며 날고 있다.
  description: 이 거대한 날개 달린 생물체는 당신의 머리 위 약 25센티미터 높이에서 원을 그리며 날아다니며 날개를 퍼덕이고 매우 큰 소리로 지저귀어 정말로 위협적으로 보인다.

tba:35:mob:3501:
  short: 고블린
  long: 산 고블린이 혼자 중얼거리며 어슬렁거리고 있다...
  description: 당신 앞에 근육이 뭉쳐 있고 역겨울 정도로 초록색 피부를 가진 작고 기형적인 생물이 보인다. 저녁 식사에 초대할 타입은 아닌 것 같다.

tba:35:mob:3502:
  short: 고블린 중대장
  long: 고블린 중대장이 여기 서서 부하들을 질서 있게 만들려고 애쓰고 있다.
  description: 고블린 중대장은 꽤 화가 나 있으며, 때려줄 부하 한 명을 찾고 있지만, 아마 당신도 딱 좋을 것 같다...

tba:35:mob:3503:
  short: 고블린 지도자
  long: 고블린 지도자가 방을 둘러보고 있다.
  description: 지도자는 당신이 여기에서 그를 발견한 것에 대해 너무 기뻐 보이지 않는다. 그는 짧은 검을 움켜쥐고 당신의 목을 향해 돌진한다.

tba:35:mob:3504:
  short: 작은 소년
  long: 작은 소년이 여기 앉아 상처를 핥고 있다.
  description: 가엾은 소년은 수많은 베인 상처와 긁힌 자국이 있지만, 괜찮아 보인다. 그는 아마도 매복의 유일한 생존자인 것 같다.

tba:35:mob:3505:
  short: 주인
  long: 주인이 여기 서서 잔을 닦고 있다.
  description: 주인은 이제 대부분의 낮 시간을 손님을 기다리며 보내고, 밤에는 고블린을 경계하며 지낸다. 그의 여관은 예전의 그 즐거운 곳이 더 이상 아니다.

tba:35:mob:3506:
  short: 시인
  long: 우울한 시인이 여기 앉아 고민을 술로 달래고 있다.
  description: 방 건너편에서도 그의 입에서 술 냄새가 난다. 이 불쌍한 시인은 꽤 오래 여기 앉아 술에 취해 의식을 잃어가고 있다.

tba:35:mob:3507:
  short: 검은 기수
  long: 검은 기수가 여기 서 있다. 그는 검은 말에 올라타 있다.
  description: 그 남자는 분명 무법자이며, 당신을 조각조각 베어내도 된다는 듯 아무 거리낌이 없다.

tba:35:obj:3500:
  short: 소검
  long: 소검이 여기 놓여 있다.

tba:35:obj:3501:
  short: 훌륭한 긴 검
  long: 긴 검이 여기 놓여 있다.

tba:35:obj:3502:
  short: 나무 몽둥이
  long: 단순해 보이는 나무 몽둥이가 여기 있다.

tba:35:obj:3503:
  short: 스터드 가죽 재킷
  long: 스터드가 박힌 가죽 재킷이 바닥에 놓여 있다.

tba:35:obj:3504:
  short: 작은 창
  long: 작은 창이 여기 놓여 있다.

tba:35:obj:3505:
  short: 훼손된 시체
  long: 훼손된 시체가 여기 바닥에 버려져 있다.
  extras:
  - text: 이 학살을 일으킨 것이 남긴 흔적으로 보인다.

tba:35:obj:3506:
  short: 훼손된 사체
  long: 훼손된 사체가 여기 바닥에 버려져 있다.
  extras:
  - text: 이 학살을 일으킨 것이 남긴 흔적으로 보인다.

tba:35:obj:3507:
  short: 화려한 단검
  long: 아름다운 단검이 땅에 꽂혀 있다.
  extras:
  - text: 이 단검의 손잡이는 두 마리의 뱀이 서로 감겨 있는 모양이다. 끝에는 작은 붉은 루비가 박혀 있다.

tba:35:obj:3508:
  short: 자이로스코프
  long: 작은 장난감이 여기 바닥에서 빙글빙글 회전하고 있다.
  extras:
  - text: 자이로스코프가 빙글빙글 돌자, 당신은 그 움직임에 거의 홀린 듯이 빠져든다.
