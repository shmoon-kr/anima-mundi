# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:65, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:65:room:6500:
  name: 드워프 마을로 가는 길
  description: 당신은 드워프 마을로 이어지는 길을 걷고 있다. 위쪽으로는 회전이 보이는가 하면, 북쪽으로는 산맥을 향해 길이 계속된다.
  exits:
    north:
      look: 길이 계속된다.
    up:
      look: 미드가르드 도시가 보인다.

tba:65:room:6501:
  name: 산기슭의 길
  description: 이제 당신은 험준한 산의 밑에 서 있다. 주위의 숲은 매우 짙으며, 북쪽은 매우 어둡게 보인다.
  exits:
    north:
      look: 길이 산 위로 계속 이어진다.
    south:
      look: 길이 미드가르드 중심 도시로 향한다.

tba:65:room:6502:
  name: 산중턱의 길
  description: 산중턱에 서 있으니 남쪽의 도시는 쉽게 보이며, 북쪽의 산봉우리는 매우 가깝게 느껴진다.
  exits:
    north:
      look: 여기서 산봉우리가 쉽게 보인다.
    south:
      look: 산기슭이 가깝다.

tba:65:room:6503:
  name: 산봉우리
  description: 이제 당신은 산봉우리에 서 있다. 남쪽으로는 산 아래로 내려가는 길이 보인다. 동쪽과 서쪽으로는 광산으로 보이는 입구가 보인다.
  exits:
    east:
      look: 지하로 이어지는 것으로 보이는 산의 입구.
    south:
      look: 길이 산 아래로 내려가 미드가르드 중심 도시로 이어진다.
    west:
      look: 산의 입구가 있다.

tba:65:room:6504:
  name: 좁은 길
  description: 드워프 왕국으로 이어지는 좁은 길이다. 다른 길들보다 덜 다닌 흔적이 보이며, 매우 섬뜩한 분위기다. 남쪽으로 길이 열려 있고, 북쪽으로 이어진다.

tba:65:room:6505:
  name: 산 입구
  description: 여기에는 산으로 들어가는 입구가 있다. 문은 매우 튼튼하게 만들어져 보이며, 안에서 소리가 들려온다.

tba:65:room:6506:
  name: 좁은 길의 굽이
  description: 여기서 동쪽으로 굽어지는 좁은 길이다. 나무들이 길 위로 드리워져 있고, 잡초가 무성하게 자라 있다. 좁은 길은 남쪽과 동쪽으로 이어진다.
  extras:
  - text: 나무들은 가장 불길한 방식으로 도로 위로 드리워져 있다.

tba:65:room:6507:
  name: 좁은 길
  description: 이 길은 매우 좁으며, 북쪽과 서쪽으로 이어진다.

tba:65:room:6508:
  name: 좁은 남북 길
  description: 이 길은 북쪽과 남쪽으로 이어진다. 북쪽에는 문이 보이고, 남쪽으로는 길이 계속된다.

tba:65:room:6509:
  name: 왕국으로 가는 문
  description: 여기서 길은 서쪽으로 꺾인다. 당신 앞에 문이 보이고, 길은 서쪽과 남쪽으로 계속 이어진다.

tba:65:room:6510:
  name: 성으로 가는 길 위
  description: 당신은 결국 성으로 이어지는 길 위에 있다. 북쪽으로는 성으로 이어지고, 남쪽 벽에는 문이 있다.

tba:65:room:6511:
  name: 여전히 성으로 가는 길 위
  description: 당신은 여전히 성으로 가는 길, 혹은 원한다면 난쟁이 마을로 돌아가는 길 위에 있다. 길은 북쪽과 남쪽으로 계속 이어진다.

tba:65:room:6512:
  name: 성으로 가는 문

tba:65:room:6513:
  name: 입구 안쪽
  description: 여기 있는 모든 것이 그을음으로 뒤덮여 있고 매우 더럽다. 동쪽과 북쪽으로 길이 이어지며, 서쪽에는 문이 있다.
  exits:
    north:
      look: 작은 지하 통로가 북쪽으로 이어진다.
    east:
      look: 길이 입구 밖으로 이어진다.
    west:
      look: 여기서는 어떤 종류의 창고로 들어가는 입구처럼 보인다.

tba:65:room:6514:
  name: 길
  description: 당신은 난민 마을의 길 위에 서 있다. 이 길은 북쪽으로 상점가로, 남쪽으로 지역 구석으로 이어진다.

tba:65:room:6515:
  name: 길의 굽이
  description: 당신은 서쪽으로 '가죽과 이빨' 상점으로, 남쪽으로 이어지는 길 위에 서 있다.
  exits:
    west:
      look: 서쪽으로 '가죽과 이빨' 상점이 보인다.

tba:65:room:6516:
  name: 가죽과 이 가게
  description: 당신은 가죽과 이 가게 안에 있다. 여기서 도워프의 최고급 무기와 갑옷을 살 수 있다. 길은 북쪽과 동쪽으로 이어진다.

tba:65:room:6517:
  name: 가게 북쪽의 길
  description: 당신은 가죽과 이 가게 북쪽의 길 위에 있다. 길은 북쪽으로 이어지며, 서쪽에는 그라나이트 헤드 베이커리가 있다.

tba:65:room:6518:
  name: 가게들 북쪽
  description: 여기서 길은 병영 쪽으로 동쪽으로 꺾인다. 남쪽으로는 가게들이 보인다.

tba:65:room:6519:
  name: 병원 옆의 길
  description: 여기서 길은 북쪽의 병원을 지나간다. 동쪽으로는 병영으로, 서쪽으로는 이어진다.

tba:65:room:6520:
  name: 병영 옆의 길
  description: 여기서 길은 서쪽으로 이어지고, 동쪽으로는 병영으로 통한다.

tba:65:room:6521:
  name: 병영 입구
  description: 남쪽에는 병영으로 들어가는 입구가 있고, 길은 서쪽으로 이어진다.

tba:65:room:6522:
  name: 경비초소
  description: 당신은 성 입구 서쪽의 경비초소에 있다. 벽에는 누드 포스터가 가득 붙어 있다.
  extras:
  - text: 미네 피얼의 누드 벽보가 하나 있다.

tba:65:room:6523:
  name: 첫 번째 병영 방
  description: 여기는 병영의 두 개의 주요 방 중 첫 번째 방이다. 병영은 남쪽으로 이어지며, 북쪽으로 방을 나갈 수 있다.

tba:65:room:6524:
  name: 병영 뒤쪽
  description: 여기는 난민 병영의 뒤쪽이다. 여기에는 침대가 줄지어 놓여 있고, 견딜 수 없는 악취가 난다.

tba:65:room:6525:
  name: 스트레인지러브 성 내부
  description: 당신은 성 안쪽에 있다. 성은 매우 튜브 모양이며, 특징이 거의 없다. 위로 올라가는 계단이 있고, 문은 성 밖 서쪽으로 나 있다.

tba:65:room:6526:
  name: 창고
  description: 바닥에는 최소한 약 8센티미터 두께의 먼지가 덮여 있다! 수개월 동안 거의 아무도 여기 들어오지 않은 것으로 보인다.
  exits:
    east:
      look: 빛이 들어오는 곳이 보인다. 닳은 길처럼 보인다.
    down:
      look: 바닥의 먼지를 모두 불어낸 후, 당신은 숨겨진 문을 발견한다!
  extras:
  - text: 바닥의 먼지를 모두 불어낸 후, 당신은 숨겨진 문을 발견한다!

tba:65:room:6527:
  name: 와인 지하실
  description: 이 방에서는 와인 냄새가 나며, 한때 와인 지하실이었을 것이라고 짐작할 수밖에 없다.

tba:65:room:6528:
  name: 스트랭글러브 성의 계단 위
  description: 여기서 계단은 계속 위로도, 아래로도 나선형으로 이어진다.

tba:65:room:6529:
  name: 계단 위
  description: 당신은 여전히 계단 위에서 빙글빙글 돌고 있다. 계속 돌고 돌고 돌고 돌고 돌고 있으니 어지러움이 밀려온다. 계단은 계속 위로도, 아래로도 이어진다.

tba:65:room:6530:
  name: 계단 꼭대기
  description: 당신은 성 안 계단의 꼭대기에 있다. 동쪽으로 나가는 출구가 있고, 계단은 아래로 이어진다.

tba:65:room:6531:
  name: 여왕의 대기실
  description:
  - 여기서 남자들은 여왕을 위해 문자 그대로 '기다린다'. 여왕이 성경적 의미에서 백성들을 정말로 '알아주는' 것을 좋아한다는 소문을 들은 적이 있다.
  - 여왕의 침실은 북쪽에 있고, 서쪽으로는 계단이 보인다.

tba:65:room:6532:
  name: 여왕의 침실
  description:
  - >-
    이곳은 여왕의 침실이다. 이불은 흐트러져 있고, 구석에는 더러운 시트가 쌓여 있다. 성 밖으로 내려가는 사다리가 있으며, 남쪽으로 방을 나갈 수 있다. 서쪽에는 작은 나무 문도
    하나 있다. 다음과 같은 간판이 붙어 있다:
  - '-------------------------'
  - '|  지금은 바빠서,      |'
  - '|  언제 돌아올지 모    |'
  - '|  르지만, 여기 키가   |'
  - '|  있으면 가져가고 제    |'
  - '|      부탁이야, 출산   |'
  - '     조절약 좀 다시    '
  - '|  데려다줘! 어딘가,      |'
  - '     광산 깊은 곳에서  '
  - '|  찾을 수 있다고 들었    |'
  - '     어.                  |'
  - '-------------------------'

tba:65:room:6533:
  name: 캐슬 스트레인저브의 북쪽
  description:
  - 당신은 캐슬 스트레인저브의 북쪽에 서 있다. 더 이상 산속이 아니라는 것도 알아차린다. 남쪽 지평선 너머로 웅장한 산맥이 솟아 있다.
  - 그러나 유일한 출구는 왕비 침실로 올라가는 사다리뿐이다.

tba:65:room:6534:
  name: 병원
  description: 당신은 도워프 병원 안에 있다. 소독약 냄새가 나고, 벽 여기저기에 피가 묻어 있다.

tba:65:room:6535:
  name: 그라나이트 헤드 베이커리
  description: 이 방에서 풍겨 나오는 향기가 놀랍다. 거의 입안에서 녹아내리는 페이스트리의 맛을 느낄 수 있을 정도다.

tba:65:room:6540:
  name: 어두운 길
  description: 이 길은 매우 닳아 있고, 동쪽에는 광산 입구가 있으며, 길은 북쪽과 서쪽으로 이어진다.

tba:65:room:6541:
  name: 광산 입구
  description: 여기서 작은 길은 광산 쪽으로 내려가고, 닳은 길은 서쪽으로 이어진다.

tba:65:room:6542:
  name: 광갱도 바닥
  description: 당신은 광갱도 바닥에 있다. 여기 공기는 매우 매연이 짙고, 숨 쉬기가 매우 어렵다. 광갱도는 위쪽과 동쪽으로 이어진다.

tba:65:room:6543:
  name: 광산 내부의 길
  description: 당신은 광산 깊은 곳에 있으며, 매우 불편함을 느낀다. 길은 동쪽으로 이어지고, 서쪽으로는 광갱도로 이어진다.

tba:65:room:6544:
  name: 광산 갈림길
  description: 당신은 광산의 갈림길에 서 있다. 북쪽에는 문이 있고, 남쪽, 동쪽, 서쪽으로 길이 이어진다.

tba:65:room:6545:
  name: 석탄 저장소
  description: 당신은 이 지하에서 채굴되는 원자재의 저장 구역 안에 있다. 지지대가 매우 부실해서 방 전체가 불안정해 보인다.

tba:65:room:6546:
  name: 광산 미로
  description: 당신은 광산의 미로에 들어섰다. 동쪽에는 몇 개의 비문이 보이고, 남쪽으로 나갈 수 있다.

tba:65:room:6547:
  name: 미로의 새긴 글 앞

tba:65:room:6548:
  name: 미로
  description: 당신은 미로 안에 있다.

tba:65:room:6549:
  name: 미로
  description: 당신은 미로 안에 있다.

tba:65:room:6550:
  name: 미로
  description: 당신은 미로 안에 있다.

tba:65:room:6551:
  name: 채굴 장비 보관실
  description: 여기는 난쟁이 광부들이 사용하는 장비를 보관하는 방이다. 방은 매우 작고, 실제로 장비를 사용하는 광부가 많지 않다는 것을 알 수 있다.

tba:65:room:6552:
  name: 미로의 끝
  description: >-
    당신은 미로를 풀었다. 마지막 몇 수를 보면, 멍청한 노동자가 그걸 알아맞힐 리가 없다는 것을 알 수 있다. 여기는 꽤 황량해 보인다. 남쪽에는 을씨년스러운 방이 있다. 북쪽으로는
    미로가 보인다. 남쪽 출구 위에는 간판이 걸려 있다: 들어가는 자는 제때 죽음을 각오하라. (특히 왕비에 충성하는 자라면 더더욱)

tba:65:room:6553:
  name: 미로지기 방
  description: >-
    당신은 미로지기의 방에 들어섰다. 왕비의 사진이 벽에 걸려 있고, 그 사진에는 화살이 꽂혀 있다. 벽에는 '왕비는 고통을 겪을 것이다'나 '가톨릭이 지배한다' 같은 문구들이 스프레이로
    칠해져 있다.

tba:65:room:6554:
  name: 보물창고
  description: 이 방은 왕비의 보물창고로 보인다. 동쪽으로 돌아가는 출구 하나만 있다.

tba:65:mob:6500:
  short: 드워프 경비병
  long: 드워프 경비병이 여기 있다.
  description: 경비병은 매우 거칠고 사나워 보인다. 그는 수염을 길게 기르고 있으며, 한 달 이상 목욕을 하지 않은 듯한 냄새가 난다.

tba:65:mob:6501:
  short: 드워프 광부
  long: 드워프 광부가 여기 있다.
  description: 그는 매우 더럽고, 극도로 과로한 것처럼 보인다.

tba:65:mob:6502:
  short: 레이스
  long: 레이스가 당신의 첫 번째 움직임을 여기에서 기다리고 있다.
  description: 거의 투명할 정도로 검은 레이스.

tba:65:mob:6503:
  short: 가죽과 이 상점의 점원
  long: 가죽과 이 상점의 점원이 여기 서서 인내심을 갖고 기다리고 있다.
  description: 점원은 매우 통통하지만, 컨디션이 아주 좋아 보인다.

tba:65:mob:6504:
  short: 제빵사 그라나이트 헤드
  long: 제빵사 그라나이트 헤드가 여기에서 손님을 기다리고 있다.
  description: 그라나이트 헤드는 밀가루와 곡물로 뒤덮여 있다.

tba:65:mob:6505:
  short: 거대 도마뱀
  long: 거대 도마뱀이 동굴 바닥을 따라 먹이를 찾아 헤매고 있다.
  description: 비늘이 덮인 이 생명체는 지하 서식지에 잘 적응한 것처럼 보인다. 매우 강해 보인다.

tba:65:mob:6506:
  short: 거인
  long: 거인이 산비탈을 어슬렁거리고 있다.
  description: 거인은 약 5.5미터 키에 강철 같은 팔을 지니고 있으며, 신체 상태가 매우 좋다.

tba:65:mob:6507:
  short: 드워프 광부
  long: 드워프 광부가 여기 있다.
  description: 광부는 매우 피곤해 보이고 더러우며, 근육이 부풀어 있다.

tba:65:mob:6508:
  short: 광산 책임자
  long: 드워프 광산 책임자가 여기 있어 작업을 감독하고 있다.
  description: 광산 책임자는 매우 크고 강하지만, 이 직업을 얻었다는 점에서 꽤 똑똑할 것이다.

tba:65:mob:6509:
  short: 드워프 의사
  long: 드워프 의사가 여기 있다. 그는 자신의 종족 중 병든 이들을 돕고 있다.
  description: 그는 매우 숙련된 치유사이며, 자신의 신에게 극도로 충실하다.

tba:65:mob:6510:
  short: 드워프 하인
  long: 드워프 하인이 여기에서 도움을 기다리고 있다.
  description: 이 드워프는 스스로 아무것도 할 수 없는 상태이며, 완전히 길을 잃은 채 명령을 기다리고 있다.

tba:65:mob:6511:
  short: 드워프
  long: 드워프가 여기 있다.
  description: 그는 자신의 종족이 유명하듯 키가 작고 단단한 체구를 하고 있다.

tba:65:mob:6514:
  short: 병영 경비병
  long: 병영 경비병이 여기 있다. 그는 근무가 끝난 후 여기저기 돌아다니며 시간을 보내고 있다.
  description: 이 중년 남성은 경비를 맡을 대상이 없으니 길을 잃은 것처럼 보인다.

tba:65:mob:6516:
  short: 미로지기
  long: 미로지기가 여기 있다.
  description: 그는 매우 강해 보인다.

tba:65:mob:6517:
  short: 거대한 뱀
  long: 거대한 뱀이 여기 있다.
  description: >-
    뱀은 몸을 단단히 말고, 조금이라도 위험한 기미가 보이면 즉시 공격할 태세를 갖추고 있다. 비늘이 덮은 피부는 주변 지형과 어우러지는 얼룩덜룩한 갈색, 검은색, 회색을 띠고 있다.

tba:65:obj:6500:
  short: 보물창고 열쇠
  long: 보물창고 열쇠가 여기 놓여 있다.

tba:65:obj:6501:
  short: 여왕의 보물
  long: 여기에는 큰 보물 더미가 남겨져 있는데, 분명 여왕의 것이어야 한다.

tba:65:obj:6502:
  short: 광산 열쇠
  long: 여기 광산 열쇠가 놓여 있다.

tba:65:obj:6503:
  short: 반짝이는 금빛 열쇠
  long: 여기 반짝이는 금빛 열쇠가 놓여 있다.

tba:65:obj:6504:
  short: 드워프 망치
  long: 여기 드워프 망치가 놓여 있다.

tba:65:obj:6505:
  short: 드워프 판금 갑옷
  long: 여기 드워프 판금 갑옷이 놓여 있다.

tba:65:obj:6506:
  short: 긴 검은 막대
  long: 여기에 긴 검은 막대가 놓여 있다.

tba:65:obj:6507:
  short: 긴 검은 막대
  long: 여기에 긴 검은 막대가 있다.

tba:65:obj:6508:
  short: 드워프 몽둥이
  long: 여기에 드워프 몽둥이가 놓여 있다.

tba:65:obj:6509:
  short: 양손 드워프 도끼
  long: 여기에 양손 드워프 도끼가 있다.

tba:65:obj:6510:
  short: 드워프 투구
  long: 드워프 투구가 여기 있다.

tba:65:obj:6511:
  short: 황금 드워프 반지
  long: 황금 드워프 반지가 여기 놓여 있다.

tba:65:obj:6512:
  short: 드워프 장갑 한 쌍
  long: 두꺼운 드워프 장갑 한 쌍이 여기 놓여 있다.

tba:65:obj:6513:
  short: 석탄 덩어리
  long: 석탄 덩어리가 여기 있다.

tba:65:obj:6514:
  short: 채굴용 곡괭이
  long: 여기 채굴용 곡괭이가 있다.
  extras:
  - text: 거의 축복받은 것처럼 보인다!

tba:65:obj:6515:
  short: 진한 초록색 열쇠
  long: 여기 진한 초록색 열쇠가 놓여 있다.

tba:65:obj:6516:
  short: 낡은 열쇠
  long: 누군가 낡은 열쇠를 떨어뜨린 것 같다.

tba:65:obj:6517:
  short: 긴 검
  long: 긴 검이 여기 놓여 있다.

tba:65:obj:6518:
  short: 나무통
  long: 나무통 하나가 여기 놓여 있다.

tba:65:obj:6519:
  short: 병
  long: 파이어브레스 병이 여기 버려져 있다.

tba:65:obj:6520:
  short: 빵
  long: 여기에 빵 한 덩이가 놓여 있다.

tba:65:obj:6521:
  short: 데니시 페이스트리
  long: 맛있어 보이는 데니시 페이스트리가 여기에 놓여 있다.

tba:65:obj:6522:
  short: 등
  long: 황동으로 만든 등이 여기 있다.

tba:65:obj:6523:
  short: 나무통
  long: 나무통 하나가 여기 놓여 있다.
