# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:41, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:41:room:4100:
  name: 터널
  description: >-
    지하로 점점 더 깊숙이 이어지는 이 터널을 따라가다 보니, 터널 한쪽 벽면으로 작은 물줄기가 쏟아져 내리는 것을 보며, 터널의 경사가 이전에 예상했던 것보다 훨씬 가팔라야 한다는
    사실을 깨닫는다. 터널은 동쪽 방향으로 꽤 먼 거리까지 곧게 뻗어 있는 것으로 보인다.

tba:41:room:4101:
  name: 긴 터널
  description: >-
    터널은 동서로 이어지며 이 지점에서 약간 경사져 있는 듯하다. 터널 벽 사이가 꽤 넓어서 네 명이 거의 나란히 걸을 수 있을 정도다. 벽면은 그리 축축해 보이지 않지만, 터널
    북쪽 벽을 따라 작은 물줄기가 흐르고 있다.

tba:41:room:4102:
  name: 긴 터널
  description: >-
    이 긴 터널을 따라 걷다 보니 터널이 대체 얼마나 길지 궁금해진다. 벽면은 꽤 멀리 떨어져 있지만, 동쪽 방향으로 갈수록 벽이 상당히 빠르게 좁아지는 것을 볼 수 있다. 사실
    벽이 좁아지는 모양새는 마치 깔때기를 연상케 한다.

tba:41:room:4103:
  name: 긴 터널
  description: >-
    당신은 동서 방향으로 뻗은 긴 터널 안에 서 있다. 이 지점에서는 터널이 그리 넓지 않아, 두 사람이 나란히 서서 서로를 방해하지 않을 정도다. 서쪽으로는 터널이 조금 더 넓어지는
    것으로 보이며, 동쪽으로는 지하로 더 깊이 내려간다. 남쪽 벽면에는 허리 높이쯤에 지름 약 60센티미터인 작은 구멍이 하나 보인다.

tba:41:room:4104:
  name: 긴 터널
  description: >-
    당신은 작은 구형 동굴의 끝자락에 서 있다. 다소 원형에 가까운 이 '방'은 지름이 약 9미터 정도이며, 서쪽 벽에서 급하게 위로 뻗어 나가는 터널이라는 출구 하나만 보인다.
    이 동굴의 벽은 상당히 흐릿하고, 이끼나 습기 같은 것은 전혀 보이지 않는다.

tba:41:room:4105:
  name: 황금의 동굴
  description: >-
    당신은 이 거대한 동굴의 북동쪽 구석으로 보이는 곳에 서 있다. 동굴은 벽 자체에서 뿜어져 나오는 것처럼 보이는 기이하고 부드러운 황금빛으로 비추어진다. 동굴 자체는 거대하여
    서쪽과 남쪽으로 상당히 멀리까지 이어진다.
  extras:
  - text: 보기는 좋지만, 자세히 살펴보니 아무런 가치도 없다는 것을 알게 된다.

tba:41:room:4106:
  name: 황금의 동굴
  description: >-
    당신은 이 거대한 동굴의 북서쪽 구석으로 보이는 곳에 서 있다. 동굴은 벽 자체에서 뿜어져 나오는 것처럼 보이는 기이하고 부드러운 황금빛으로 비추어진다. 동굴 자체는 거대하여
    동쪽과 남쪽으로 상당히 멀리까지 이어진다. 북쪽 벽에 지름 약 60센티미터 정도의 구멍이 하나 있다. 구멍 너머로 보이는 것은 어둠뿐이다.
  extras:
  - text: 보기는 좋지만, 자세히 살펴보니 아무런 가치도 없다는 것을 알게 된다.

tba:41:room:4107:
  name: 통로
  description: >-
    당신은 작은 통로가 꺾이는 모퉁이에 서 있다. 통로는 남쪽과 서쪽으로 상당히 급하게 꺾여 있다. 남쪽으로는 통로가 계속 이어지는 듯하지만, 서쪽으로는 황금빛에 가까운 빛이 보인다.

tba:41:room:4108:
  name: 황금의 동굴
  description: >-
    당신은 이 거대한 동굴의 남동쪽 구석으로 보이는 곳에 서 있다. 동굴은 벽 자체에서 뿜어져 나오는 듯이 보이는 기이하고 부드러운 금빛으로 비추어진다. 동굴은 그 규모가 엄청나며
    서쪽과 북쪽으로 꽤 먼 거리까지 뻗어 있다. 동쪽 벽의 균열은 어딘가로 이어지는 통로로 보인다.
  extras:
  - text: 보기는 좋지만, 자세히 살펴보니 아무런 가치도 없다는 것을 알게 된다.

tba:41:room:4109:
  name: 황금의 동굴
  description: >-
    당신은 이 거대한 동굴 서쪽 벽의 한가운데쯤에 서 있다. 동굴은 벽 자체에서 뿜어져 나오는 듯이 보이는 기이하고 부드러운 금빛으로 비추어진다. 동굴은 그 규모가 엄청나며, 동쪽,
    남쪽, 북쪽으로 상당히 멀리까지 뻗어 있다.
  extras:
  - text: 보기는 좋지만, 자세히 살펴보니 아무런 가치도 없다는 것을 알게 된다.

tba:41:room:4110:
  name: 구멍
  description:
  - >-
    당신은 작은 구석진 공간에 서 있다. 터널이 다소 갑작스럽게 끝나기 때문이다. 주위를 둘러보다 보니 터널 바닥에 꽤 큰 구멍이 하나 뚫려 있는 것을 문득 발견한다. 사실 한 발짝만
    더 앞으로 나갔다면 그 구멍으로 떨어져 들어갔을 것이다.
  - >-
    터널 자체는 서쪽으로 이어지며, 바닥의 구멍 안을 내려다봐도 매우 깊고 어둡다는 사실 외에는 거의 아무것도 보이지 않는다. 구멍에서 매우 이상한 냄새가 풍겨 나온다. 마치 아래
    어딘가에서 무언가가 썩어가는 냄새와 비슷하다.
  exits:
    down:
      look: >-
        아래로 내려가기 전에 구멍이 얼마나 깊은지 알아보기 위해 돌멩이를 하나 떨어뜨려 본다... 약 5분 정도가 지났는데도 아직 바닥에 닿지 않았다. 따라서 정신 건강을 위해
        당신은 이쪽으로 가지 않기로 결정한다.
  extras:
  - text: >-
      아래로 내려가기 전에 구멍이 얼마나 깊은지 알아보기 위해 돌멩이를 하나 떨어뜨려 본다... 약 5분 정도가 지났는데도 아직 바닥에 닿지 않았다. 따라서 정신 건강을 위해 당신은
      이쪽으로 가지 않기로 결정한다.

tba:41:room:4111:
  name: 터널
  description: >-
    이 작은 터널의 벽은 거의 온통 이상한 주황색 이끼로 뒤덮여 있다. 손이 닿으면 가루처럼 벗겨진다. 터널은 동서 방향으로 뻗어 있으며 안쪽 공기는 매우 습하고 고인 냄새가 난다.
    바람은 전혀 느껴지지 않지만, 동쪽에서 이상한 냄새가 풍겨온다. 남쪽 벽에는 거의 눈에 띄지 않을 정도로 작은 구멍이 하나 나 있다.
  exits:
    south:
      look: 구멍은 매우 작아 보인다. 기어 들어가야 할 것 같다.
  extras:
  - text: 벽에 붙은 이끼는 주황색이다. 만져보면 거칠고 손에 닿으면 가루처럼 벗겨져 손가락 끝이 살짝 주황빛으로 물든다.

tba:41:room:4112:
  name: 터널
  description: >-
    당신이 서 있는 이 터널은 꽤 넓다. (주변의 다른 터널들과 비교하면 유난히 넓어 보인다.) 그런데도 공기는 꽤 습하다. 벽에는 얇은 습기층이 덮여 있는데, 보기도 만져지기도
    약간 기름기 있는 느낌이다. 터널은 동서 방향으로 뻗어 있다.
  extras:
  - text: 벽의 습기층에는 이상한 작은 무늬들이 엮여 있다. 마치 누군가 수평인 물 표면에 기름을 쏟은 것처럼 보인다.

tba:41:room:4113:
  name: 통로
  description: >-
    이 남북 방향의 통로는 자연적으로 형성된 것처럼 보이지만, 통행을 좀 더 쉽게 하려고 벽을 대충 다듬어 매끈하게 만든 흔적이 보인다. 통로가 땅속 깊은 곳으로 이어지면서 벽은
    여전히 굽이친다. 동쪽 벽에 있는 기이한 그림자가 그곳에 작은 통로가 이 터널과 이어져 있음을 암시한다.

tba:41:room:4114:
  name: 황금의 동굴
  description: >-
    당신은 이 거대한 동굴의 남서쪽 구석에 서 있는 것 같다. 동굴은 벽 자체에서 뿜어져 나오는 것처럼 보이는 기이하고 부드러운 금빛으로 비추어진다. 동굴 자체는 엄청나게 넓어 북쪽으로
    꽤 멀리 뻗어 있으며, 서쪽에는 통로 입구가 있는 것처럼 보이는 기이한 그림자 형성이 보인다.
  extras:
  - text: 보기는 좋지만, 자세히 살펴보니 아무런 가치도 없다는 것을 알게 된다.

tba:41:room:4115:
  name: 어두운 통로
  description: >-
    당신은 작은 통로의 끝자락에 서 있다. 여기는 꽤 어둡다. 습한 벽을 둘러보던 당신은, 통로가 천장 쪽으로 거의 위로 휘어 올라가는 것처럼 보이는 것을 알아차린다. 위를 올려다보니,
    겨우 통과할 수 있을 정도로 작은 구멍이 하나 있다. 벽의 휘어진 부분을 자세히 살펴보니, 누군가(또는 무언가) 위로 올라가기 쉽게 벽에 작은 손잡이를 새겨 놓은 것처럼 보인다.
    터널 자체는 동쪽으로 이어져 있다.

tba:41:room:4116:
  name: 통로
  description: >-
    당신은 북쪽과 남쪽으로 이어지는 아주 평범한 통로 안에 서 있다. 두 명이 나란히 걸어도 넉넉할 만큼 넓어 보인다. 통로는 거의 사각형 형태다. 멀리 남쪽 끝에서 빛 한 점 같은
    것이 보인다.
  extras:
  - text: 음, 그 빛이 어디서 나오는 건지는 보이지 않는다...

tba:41:room:4117:
  name: 비밀 터널
  description: 당신은 좁고, 언제인지 모르게 발길이 거의 닿지 않은 듯한 통로 안에 서 있다. 북쪽으로는 불이 켜진 방으로, 남쪽으로는 어떤 방처럼 보이는 곳으로 이어져
    있다.

tba:41:room:4118:
  name: 동굴
  description:
  - >-
    이 꽤 넓은 동굴은 의외로 매우 밝다. 약 20개의 횃불이 방 안 곳곳에 설치된 촛대 모양의 거치대에 꽂혀 머리 위 약 30센티미터쯤 되는 높이에 매달려 있다. 번들거리는 화염이
    만드는 춤추는 그림자들이 몇 분간 시선을 빼앗고, 넋을 잃게 만들 듯하다.
  - 동굴 안을 둘러보니 서쪽과 남쪽으로 이어지는 것으로 보인다. 북쪽 벽에 있는 기이한 수직 균열은 어딘가로 이어질 것처럼 보인다.
  exits:
    north:
      look: 꽤나 좁아 보인다.

tba:41:room:4119:
  name: 동굴
  description:
  - >-
    이 꽤 넓은 동굴은 의외로 매우 밝다. 약 20개의 횃불이 방 안 곳곳에 설치된 촛대 모양의 거치대에 꽂혀 머리 위 약 30센티미터쯤 되는 높이에 매달려 있다. 번들거리는 화염이
    만드는 춤추는 그림자들이 몇 분간 시선을 빼앗고, 넋을 잃게 만들 듯하다.
  - 동굴 안을 둘러보니 동쪽과 남쪽으로 이어지는 것으로 보인다.
  exits:
    west:
      look: 서쪽의 바위 벽은 모를 이유로 이상해 보인다.

tba:41:room:4120:
  name: 통로
  description: >-
    당신은 꽤 평범한 통로에 서 있다. 한 사람이 지나갈 정도로는 약간 넓지만, 두 사람이 지나갈 정도로는 아직 부족한 너비다. 천장이 여기에서 의외로 낮게 처져 있거나, 아니면
    바닥이 천장 쪽으로 올라와 있어서 그런 걸까? 남쪽을 바라보면 터널이 약간 더 좁아지는 것처럼 보이고, 북쪽을 바라보면 다소 넓어진다. 남쪽에서 오는 불빛이 계속 깜빡인다.
  extras:
  - text: 통로를 거의 밝힐 수 있을 정도다.

tba:41:room:4121:
  name: 비밀 터널
  description: >-
    당신은 매우 인공적인 복도에 서 있다. 너비가 약 3미터, 높이가 약 3에서 4미터 정도 된다. 통로는 서쪽으로 갈수록 좁아지며, 약 1.5미터 너비의 문으로 이어진다. 터널의
    동쪽 끝은 매우 매끄러운 바위벽에 의해 갑자기 막혀 있다.
  exits:
    east:
      look: 동쪽의 바위벽은 움직일 수 있을 것처럼 보인다.
  extras:
  - text: 동쪽의 바위벽은 움직일 수 있을 것처럼 보인다.

tba:41:room:4122:
  name: 비밀의 방
  description: >-
    당신은 존재할 것이라고는 꿈에도 생각하지 못했던 작은 방에 서 있다. 이 작고 거의 완벽한 원형의 동굴은 벽이 너무 매끄럽고, 북쪽과 동쪽의 문이 모두 거의 정확히 1.5미터
    너비, 3.3미터 높이이므로 자연적으로 형성된 것이 아니라는 인상을 준다.

tba:41:room:4123:
  name: 동굴
  description:
  - >-
    이 꽤 큰 동굴은 놀랍도록 밝게 비추어져 있다. 방 곳곳에 약 20개의 횃불이 벽걸이 촛대에 꽂혀 있으며, 당신의 머리 위로 몇 피트(약 1미터 이상) 높이에서 매달려 있다.
    깜빡이는 불꽃이 만드는 춤추는 그림자가 몇 분간 당신의 시선을 사로잡으며, 당신을 홀리게 만들려는 듯하다.
  - 동굴을 둘러보니 서쪽과 북쪽으로 이어지는 것으로 보인다.

tba:41:room:4124:
  name: 동굴
  description:
  - >-
    이 꽤 큰 동굴은 놀라울 정도로 밝게 비추어져 있다. 약 20개의 횃불이 머리 위로 약 1.2미터 높이에서 매달린 벽걸이 촛대에 꽂혀 방 안 곳곳에 배치되어 있다. 흔들리는 불꽃이
    만들어내는 춤추는 그림자가 몇 분간 당신의 시선을 사로잡으며 넋을 잃게 만들려는 듯하다.
  - 동굴 주위를 둘러보니 동쪽과 북쪽으로 이어지는 것으로 보인다. 동굴 서쪽 벽면에서 나가는 통로가 있는데, 북쪽으로 꺾여 나가는 것처럼 보인다.

tba:41:room:4125:
  name: 통로
  description: >-
    당신은 여기서 북쪽으로 이어지는 좁은 통로의 끝자락에 서 있다. 남쪽 벽은 맨바닥 그대로인데, 동쪽 동굴에서 흘러나오는 흔들리는 빛이 만들어낸 그림자가 마치 춤추는 것처럼 보인다.

tba:41:room:4126:
  name: 좁은 통로
  description: >-
    당신은 매우 좁은 기어가는 통로 안에 있다. 여기서 뒤로 빠져나오려면 천장과 벽면에서 돌출된 바위에 걸리지 않도록 조심스럽게 움직여야 한다. 통로의 지름은 약 60센티미터로,
    꽤 빡빡한 공간이다. 이쪽 아래에 벌레나 비슷한 생물체가 없기를 바라는 게 좋을 것이다. 여기서는 자위하기가 어려울 테니까.
  exits:
    north:
      look: 통로의 북쪽 출구를 표시하는 작은 구멍이 보인다.
    south:
      look: 통로의 남쪽 출구에서 흘러나오는 빛이 보인다.

tba:41:mob:4100:
  short: 마법사
  long: 작고 지적으로 보이는 마법사가 여기 서 있다.
  description: 그의 지능은 거의 모든 일반인을 멍청하게 보이게 한다... 마법을 잘 다루는 것 같다.

tba:41:mob:4101:
  short: 트롤
  long: 거대하고 사나워 보이는 트롤이 여기 있다.
  description: 흠, 위험해 보인다!

tba:41:mob:4102:
  short: 뱀
  long: 거대한 녹색 뱀이 여기 있다. 악의 세력을 지키는 수호자처럼 보인다.
  description: 당신은 악한 생물체를 본다. 뱀은 길이가 최소 약 150센티미터는 되어 보이며, 몸을 빽빽이 감아 당신을 향해 시끄럽게 날카로운 소리를 내고 있다.

tba:41:mob:4103:
  short: 도적
  long: 온통 검은 옷을 입은 도적이 여기 있다.
  description: 그는 한 줌의 동전을 세고 있는 것 같다. 당신도 당신의 금화를 세어 볼 필요가 있겠다...

tba:41:mob:4104:
  short: 오르크
  long: 못생긴 오크가 여기 서 있다.
  description: 보는 것만으로도 꽤 역겹다.

tba:41:mob:4105:
  short: 지네
  long: 작고 해롭지 않은 지네가 여기 있다.
  description: 당신에게 아무런 관심을 보이지 않는 것 같다.

tba:41:mob:4106:
  short: 전사
  long: 인간 전사가 여기 있다. 그의 얼굴에는 악한 미소가 번져 있다.
  description: 전혀 우호적이지 않아 보인다...

tba:41:mob:4107:
  short: 코볼드
  long: 초록색 코볼드가 여기 있다.
  description: 미끄러져 보인다.

tba:41:obj:4100:
  short: 검은 악마의 검
  long: 검은 악마의 검이 여기 있다.
  extras:
  - text: 당신이 이 무기를 악의 힘에 의해 통제되고 있다고 느끼며 사용한다면, 당신은 이 무기만큼 사악해질 것이다...

tba:41:obj:4101:
  short: 전사용 장갑 한 쌍
  long: 정교하게 만들어진 장갑 한 쌍이 여기 바닥에 놓여 있다.
  extras:
  - text: 전투 시 착용하기에 적합한 장비처럼 보인다.

tba:41:obj:4102:
  short: '''ysafg''라고 적힌 두루마리'
  long: '''ysafg''라고 적힌 두루마리로, 매우 연약해 보이고 꽤 오래된 것 같다.'
  extras:
  - text: 정보를 담고 있을 것 같다.

tba:41:obj:4103:
  short: 초록색 점액 균
  long: 초록색 점액 균이 여기 있다. 믿을 수 없을 정도로 악취가 난다!
  extras:
  - text: 이것은 먹으라고 만든 것이 아니다 -- 적어도 인간이 먹을 것은 절대 아니다.

tba:41:obj:4104:
  short: 초록색 점액 균
  long: 초록색 점액 균이 여기 있다. 믿을 수 없을 정도로 악취가 난다!
  extras:
  - text: 이것은 음식으로 만들어지지 않았다 -- 적어도 인간을 위한 것은 확실히 아니다.
