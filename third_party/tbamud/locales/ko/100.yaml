# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:100:room:10000:
  name: 작은 오두막 안
  description: >-
    당신이 허름한 오두막으로 들어서자 코를 찌르는 냄새에 구역질이 난다. 옅은 연기에 눈이 따갑다. 이곳에 사는 이는 청결 따위는 아랑곳하지 않는 모양이다. 여기저기 헝겊 더미가
    쌓여 있다.
  extras:
  - {}
  - text: 난로는 몇 년 동안 쓰지 않은 것처럼 보인다. 난로 바닥에는 재가 두껍게 쌓여 있다. 재 속에서 무언가 반짝이는 것이 눈에 띈다.
  - text: 침상을 더 자세히 살펴보니, 헝겊 가운데 몇 개는 처음 생각했던 것만큼 낡지는 않은 것 같다. 좀 가져간다고 아무도 모르지 않을까?

tba:100:room:10001:
  name: 은둔자의 오두막 앞
  description: >-
    당신은 멈추어 서서, 아마도 어떤 은둔자가 살고 있을 법한 낡고 초라한 나뭇가지 더미를 바라본다. 도시 성벽의 안전 밖, 이런 곳에서 살아가는 상상을 할 수 없다. 북쪽으로는
    나가는 길을 막는 울창한 숲이 펼쳐져 있고, 남쪽으로는 도시의 성벽이 보인다.

tba:100:room:10002:
  name: 도시 성벽을 따라
  description: >-
    성벽을 따라 걷다 보니 숲이 점점 울창해진다. 숲의 이 일대에는 어렴풋한 음산함이 감돈다. 당신은 저도 모르게 걸음을 재촉한다. 서쪽으로 더 가면 오두막처럼 보이는 무언가가 있는
    작은 빈터가 보인다.

tba:100:room:10003:
  name: 도시 성벽을 따라
  description: >-
    당신이 지나가자 이 근방 숲에 있던 몇 안 되는 짐승들이 흩어진다. 숲이 조금씩 짙어져, 숲 바닥까지 닿는 햇살이 조금 줄어든다. 머리 위에서 새들이 지저귀고 다람쥐들이 재잘거리는
    소리가 들린다. 이곳은 무척 평화롭게 느껴진다.

tba:100:room:10004:
  name: 북쪽 길
  description: >-
    당신은 미노타우르스의 도시, 둔모라로 향하는 길의 시작점에 서 있다. 이 야만적인 짐승들에 대한 수많은 소문이 돌지만, 도시 성벽을 벗어나 탐험하는 사람은 드물다. 북쪽으로는
    울창한 숲이 보인다. 동쪽과 서쪽으로는 도시 성벽을 따라 작은 오솔길이 나 있다.

tba:100:room:10005:
  name: 도시 성벽을 따라
  description: >-
    이 성벽 일대의 숲은 점점 옅어진다. 더 동쪽으로 가면 숲이 아예 사라져 풀이 우거진 평원으로 변하는 것처럼 보인다. 이 건강한 숲에는 무해한 작은 숲속 생물들이 많다.

tba:100:room:10006:
  name: 도시 성벽을 따라
  description: >-
    숲은 이제 거의 완전히 사라져, 눈이 닿는 곳까지 키 큰 풀로 뒤덮인 들판으로 바뀌어 있다. 동쪽에서 기이하게 차가운 바람이 불어온다. 당신은 문득 안전한 숲으로, 아니 차라리
    도시로 돌아가고 싶은 충동을 느낀다.

tba:100:room:10007:
  name: 막다른 길
  description: >-
    키 큰 풀 때문에 당신은 거의 동쪽의 거대한 균열에 발을 걸을 뻔했다. 건너갈 수 없을 것 같다. 서쪽으로 되돌아갈 수밖에 없다. 어차피 이 평원은 으스스한 느낌을 준다.

tba:100:room:10008:
  name: 깊은 숲
  description: >-
    숲이 너무 빽빽해서 나무에 가리지 않고 볼 수 있는 거리가 고작 열 자 남짓이다. 누군가, 혹은 무언가가 이곳에서 당신에게 몰래 다가오기란 아주 쉬울 것이다. 숲을 지나 북쪽이나
    동쪽으로 계속 갈 수 있다.

tba:100:room:10009:
  name: 깊은 숲
  description: >-
    숲은 무척 평화롭고 조용하다. 아니, 조금 지나치게 조용하다. 동물들은 다 어디로 갔을까? 키 큰 나무들이 햇빛을 상당히 가리고 있다. 서쪽으로는 숲이 더 짙어 보인다. 숲은
    사방으로 이어진다.

tba:100:room:10010:
  name: 북쪽 길에서 벗어난 곳
  description: >-
    북쪽 길에서 서쪽으로 조금 벗어난 이곳의 숲은 매우 평화롭고 조용하다. 자연의 소리에 당신은 저도 모르게 거짓된 안도감에 젖어 든다. 당신은 높이 솟은 나무들과 풍부한 야생동물에
    감탄한다.

tba:100:room:10011:
  name: 북쪽 길
  description: >-
    북쪽 길은 단단한 흙길이다. 여행객, 상인, 행상들의 수년간의 사용으로 단단하게 다져져 있다. 수레 자국이 길 위에 작은 자국을 남겼다. 서쪽에는 짙은 숲이 있고, 동쪽으로는
    멀리 평원이 희미하게 보이는 듯하다. 길은 여기서 북쪽과 남쪽으로 이어진다.

tba:100:room:10012:
  name: 북쪽 길에서 벗어난 곳
  description: >-
    잘 닦인 길을 벗어나 평원이 시작되는 곳으로 들어서니, 이곳의 나무들은 더 낮고 서로 더 멀찍이 떨어져 있다. 동쪽으로는 숲이 차츰 옅어지다가 평원으로 바뀐다. 어느 방향으로든
    탐험할 수 있다.

tba:100:room:10013:
  name: 평원의 시작
  description: >-
    드디어 평원의 끝자락에 이르렀는데, 동쪽으로 더 나아갈 길을 막고 있는 큰 협곡을 보며 실망한다. 이 자연적인 장벽이 어떻게 생겨났을지 궁금해진다. 북쪽이나 동쪽으로 계속 나아갈
    수 없다.

tba:100:room:10014:
  name: 깊은 숲
  description: >-
    숲이 너무 울창해서 몇 걸음 앞도 보이지 않는다. 나무와 덤불이 북쪽과 동쪽으로 가는 길을 막고 있다. 누군가 당신을 몰래 지켜보고 있는 건 아닐까 하는 생각이 들기 시작한다.
    이 거대한 나무들 중 어느 뒤에 누가 서 있어도 당신은 결코 알아차리지 못할 것이다.

tba:100:room:10015:
  name: 깊은 숲
  description: >-
    북쪽과 동쪽으로 숲이 트여 있다. 북쪽 길에 가까이 온 것 같다. 당신이 지나가자 작은 동물들이 흩어지고, 발밑에서 나뭇잎과 잔가지가 바스락거린다. 십 리 밖에서도 당신이 오는
    소리가 들릴 것이다.

tba:100:room:10016:
  name: 북쪽 길에서 벗어난 곳
  description: 북쪽 길이 이제 바로 동쪽에 있다. 길은 북쪽으로 휘어 도는 듯하다. 이곳의 나무들은 몇 걸음씩 간격을 두고 서 있어, 멀리서 야생동물이 움직이는 모습이 보인다.

tba:100:room:10017:
  name: 북쪽 길
  description: >-
    당신은 북쪽 길 한가운데 서 있다. 길에는 인적이 거의 없다. 남쪽 멀리, 도시 가까이에 사람 몇이 보인다. 북쪽 멀리로는 호수 같은 넓은 물이 어렴풋이 보인다. 서쪽에는 숲이
    있고, 동쪽 멀리에는 평원이 펼쳐져 있다.

tba:100:room:10018:
  name: 성긴 숲
  description: 숲이 서서히 평원으로 바뀌기 시작한다. 동쪽에서 강한 바람이 불어온다. 이맘때 날씨치고는 조금 춥다. 북쪽에서는 흐르는 물소리가 들리는 것 같다.

tba:100:room:10019:
  name: 평원 앞
  description: 평원으로 가는 길은 거대한 협곡에 막혀 있다. 한때 강이 흘렀던 것처럼 보인다. 하지만 어찌된 일인지 말라 버린 듯하다. 멀리서 흐르는 물소리가 들린다.

tba:100:room:10020:
  name: 깊은 숲
  description: >-
    여기 숲은 무척 빽빽하다. 서쪽과 남쪽 출구는 무성한 덤불에 막혀 있다. 북쪽에서 세차게 흐르는 물소리가 우렁차게 들려온다. 이 숲에는 동물이 무척 많은 것 같다. 녀석들 때문에
    자꾸만 정신이 흐트러진다.

tba:100:room:10021:
  name: 깊은 숲
  description: >-
    북쪽과 남쪽의 울창한 숲은 건너갈 수 없다. 거대한 나무들 사이로 동쪽이나 서쪽으로 계속 나아가는 수밖에 없다. 북쪽 길의 안전하고 편한 여정은 바로 동쪽에 있다.

tba:100:room:10022:
  name: 북쪽 길의 굽이
  description: >-
    북쪽 길이 여기서 호숫가를 따라 굽어진다. 호수는 안개에 뒤덮여 있다. 건너편에 무엇이 있는지 알아볼 수 없다. 북쪽에서 큰 강이 호수로 흘러들고 있다. 길을 따라 북쪽으로 가거나,
    동쪽의 도시 쪽으로 되돌아갈 수 있다.

tba:100:room:10023:
  name: 북쪽 길
  description: 북쪽 길은 광활한 호수 가장자리까지 곧장 이어진다. 물은 맑고 상쾌해 보인다. 자욱한 안개가 건너편을 가리고 있다. 길은 호수를 돌아 동서로 계속 이어진다.

tba:100:room:10024:
  name: 북쪽 길의 굽이
  description: >-
    길이 호숫가에서 갑자기 끊긴다. 당신은 멍하니 바라보다가, 길이 서쪽으로 휘어 이어지는 것을 깨닫는다. 호수 위에는 안개층이 깔려 있다. 동쪽으로는 멀리 평원이 보인다.

tba:100:room:10025:
  name: 호숫가
  description: >-
    당신은 호숫가를 따라 걷기 시작한다. 북쪽에서 물이 세차게 흐르는 소리가 들린다. 호수가 무척 고요해 보여 잠깐 물에 몸을 담그고 싶어지지만, 무엇이 당신을 지켜보고 있을지 누가
    알겠는가.

tba:100:room:10026:
  name: 성긴 숲
  description: >-
    당신은 숲속을 터벅터벅 걸어간다. 숲 바닥에 걸리적거리는 것이 없어 걷기 좋다. 제법 빠르게, 실제로 어딘가에 다가가고 있다는 느낌이 든다. 서쪽과 북쪽으로는 숲이 빽빽해져,
    나갈 길은 남쪽과 동쪽뿐이다.

tba:100:room:10027:
  name: 평원 앞
  description: 동쪽의 평원은 큰 협곡으로 막혀 있다. 그곳을 건너갈 수는 없을 것 같다. 계속 나아갈 길은 서쪽이나 북쪽뿐이다. 북쪽에서 흐르는 물소리가 들린다.

tba:100:room:10028:
  name: 강가
  description: >-
    거대한 강이 굉음을 내며 당신 곁을 흘러간다. 폭이 족히 스무 걸음은 된다. 다리 없이는 건널 방법이 없다. 서쪽으로는 울창한 숲이 도저히 뚫고 들어갈 수 없을 것처럼 보인다.
    동쪽으로 길이 보이는 것 같다.

tba:100:room:10029:
  name: 강가
  description: 당신의 북쪽에서 강물이 굉음을 내며 흘러간다. 당신은 동쪽이나 서쪽으로만 나갈 수 있다. 동쪽으로는 북쪽 길과 강을 건너기 위한 것으로 보이는 다리가 보인다.

tba:100:room:10030:
  name: 강 다리
  description: >-
    바로 북쪽에서 큰 돌다리가 강을 건너고 있다. 돌로 쌓은 이 다리는 짓는 데만 수년은 걸렸을 것이다. 강은 바로 동쪽에서 거대한 호수로 흘러들고 있다. 북쪽 길은 다리를 건너
    이어진다.

tba:100:room:10031:
  name: 호숫가
  description: >-
    호숫가를 따라 걷다 보니 호수 물이 흘러 나가는 어귀에 이른다. 작은 강이 북쪽으로 가는 길을 가로막고 있다. 작긴 해도 물살이 빠르고 거세 보인다. 걸어서 건너려 했다가는 하류로
    떠내려갈 것만 같다.

tba:100:room:10032:
  name: 성긴 숲
  description: >-
    강가를 따라 걷다 보니 주변에 문명의 흔적이 전혀 없는 이유가 궁금해진다. 자연에서 나는 것만으로 살아가기에 더없이 좋은 곳일 텐데. 강을 따라 동쪽이나 서쪽으로 계속 나아갈
    수 있다.

tba:100:room:10033:
  name: 평원 앞
  description: >-
    강물이 떨어지며 웅장한 폭포를 이루고, 동쪽의 작은 호수로 흘러든다. 협곡 건너편에는 풀밭이 펼쳐져 있다. 북쪽으로는 작고 삐걱거리는 밧줄 다리가 강을 가로지른다. 한 번에 한
    사람 정도는 버틸 수 있을 것 같다.

tba:100:room:10034:
  name: 깊은 숲
  description: >-
    숲이 여기 강기슭 바로 앞까지 이어져 있다. 강물이 나무 밑의 흙을 쓸어가는 탓에 나무들이 위험하게 강 위로 기울어져 있다. 숲은 북쪽이나 서쪽으로 계속 이어진다.

tba:100:room:10035:
  name: 북쪽 길의 굽이
  description: >-
    강 바로 북쪽에서 북쪽 길을 걷고 있자니, 누군가 지켜보는 듯한 기분이 든다. 이런 숲속이라면 누구든 쉽게 숨을 수 있겠다. 길은 북쪽으로 계속 이어지거나, 다리를 향해 동쪽으로
    꺾인다.

tba:100:room:10036:
  name: 북쪽 길의 굽이
  description: 바로 남쪽에는 거대한 돌다리가 강 위로 놓여 있다. 동쪽 땅은 늪이 시작되는 곳처럼 보인다. 호수에서 피어오른 짙은 안개가 길을 가로질러 느릿느릿 밀려든다.

tba:100:room:10037:
  name: 호수 북쪽
  description: >-
    이곳 땅은 확실히 질척해지고 있다. 발이 무른 흙에 들러붙기 시작한다. 호수에서 밀려오는 안개가 점점 짙어진다. 고요함이 거의 무서울 정도다. 늪에는 대체 어떤 생물들이 살고
    있을까 궁금해진다.

tba:100:room:10038:
  name: 호수 북쪽
  description: 발이 진흙과 펄에 발목까지 가라앉기 시작한다. 썩고 부패한 냄새가 안개와 함께 짙게 퍼져 있다. 호수에서 불어오는 바람은 전혀 도움이 되지 않는다.

tba:100:room:10039:
  name: 성긴 숲
  description: >-
    늪이 조금 잦아들고, 키 크고 튼튼한 나무들 덕분에 발밑의 땅이 단단하다. 남쪽의 강은 거대한 호수에서 흘러나가는 물줄기임이 틀림없다. 북쪽이나 서쪽으로만 나갈 수 있다. 두
    방향 모두 늪지대처럼 보인다.

tba:100:room:10040:
  name: 늪
  description: >-
    당신은 늪 한가운데로 튀어나온, 자연적으로 생긴 작은 둑 위로 걸어 나간다. 썩은 물이 사방을 에워싸고 있어 나갈 길은 북쪽뿐이다. 무언가가 물에 파문을 일으키지만, 그것이 무엇이었는지
    알아볼 새도 없이 사라져 버린다.

tba:100:room:10041:
  name: 평원 앞
  description: >-
    당신은 밧줄 다리의 바로 북쪽, 평원의 가장자리에 서 있다. 동쪽의 늪은 위험해 보인다. 북쪽으로는 평원 안쪽으로 계속 나아갈 수 있다. 동쪽으로는 강 때문에 길이 막혀 있다.

tba:100:room:10042:
  name: 북쪽 길
  description: >-
    북쪽 길은 여기서 북쪽으로 둔모라, 동쪽으로 도시 쪽으로 이어진다. 미노타우르스의 도시로 불리는 전설의 둔모라가 궁금하다. 그곳에 관한 이야기가 무척 많지만, 그중 절반은 사실이
    아닐 것 같다. 남쪽으로는 울창한 숲으로 들어갈 수 있다.

tba:100:room:10043:
  name: 북쪽 길의 굽이
  description: >-
    길은 작은 연못을 끼고 서쪽으로 꺾이거나, 남쪽의 도시로 되돌아간다. 바로 북쪽의 연못은 연못이라기보다는 늪에 가깝다. 늪 곳곳에 병들어 죽어 가는 나무들이 흩어져 있다. 최근에
    이 일대가 물에 잠겼던 것 같다.

tba:100:room:10044:
  name: 늪
  description: >-
    당신은 연못의 남동쪽 끝에 서 있다. 남쪽과 서쪽을 제외한 사방이 늪으로 둘러싸여 있는데, 남쪽과 서쪽은 북쪽 길이 이 습지를 돌아 지나가는 곳인 듯하다. 여기서는 썩는 냄새가
    강하게 풍긴다.

tba:100:room:10045:
  name: 늪
  description: >-
    당신은 늪 한가운데 서서, 진흙 속으로 발을 디딜 때마다 조심스럽게 발밑을 살핀다. 여기서부터는 늪이 점점 깊어지는 듯하다. 이따금 발이 발목 위까지 푹 빠진다. 야생 동물은
    드물어 보인다. 대체 무엇이 이런 곳에 살려고 할까 싶다.

tba:100:room:10046:
  name: 늪
  description: >-
    당신은 이 음침한 습지에서 길을 잃을까 두렵다. 이제 발이 거의 무릎까지 빠지기 시작한다. 혹시 유사가 있는 건 아닐까, 이런 늪에서 사람들이 사라졌다는 온갖 이야기가 떠오른다.

tba:100:room:10047:
  name: 늪
  description: >-
    발을 한 번 잘못 디뎌 그대로 가라앉아 죽을지도 모른다는 생각에 걸음이 조금 느려진다. 서쪽으로 좀 더 마른 땅이 보이는 것 같다. 당신은 하늘의 신들께 감사한다.

tba:100:room:10048:
  name: 늪
  description: >-
    발밑의 늪이 점점 단단해진다. 북쪽으로는 땅에 커다란 구덩이가 보인다. 누가 불운하게도 그 위를 걷다가 땅이 꺼지는 바람에 그 구덩이에 빠졌을지 궁금하다. 남쪽과 서쪽으로는 늪이
    더 나빠 보인다. 동쪽으로는 평원의 시작이 보인다.

tba:100:room:10049:
  name: 평원의 가장자리
  description: >-
    북쪽과 동쪽으로 평원이 눈길이 닿는 데까지 펼쳐져 있다. 남쪽에서는 세차게 흐르는 물소리가 들린다. 서쪽으로는 을씨년스러운 늪지대가 보인다. 그 평원에서 길을 잃었다는 이야기들을
    들은 탓에, 당신은 문명권에서 더 벗어나지 않기로 마음먹는다.

tba:100:room:10050:
  name: 북쪽 길
  description: 북쪽 길은 동쪽의 연못 가장자리를 끼고 이어진다. 서쪽 숲은 너무 울창해서, 굳이 편한 이 길을 벗어날 마음이 들지 않는다. 길은 북쪽과 남쪽으로 이어진다.

tba:100:room:10051:
  name: 연못 곁
  description: >-
    바로 서쪽에 작은 연못이 있다. 물은 탁하고 더러운 것처럼 보인다. 북쪽으로는 숲이 계속 이어지고, 동쪽과 남쪽으로는 약간 늪지대처럼 보인다. 당신이 영역을 침범하자 작은 동물들이
    흩어진다.

tba:100:room:10052:
  name: 늪
  description: 이곳의 냄새는 숨이 막힐 지경이다. 고인 물과 썩은 것의 악취에 눈물이 날 정도다. 늪은 남쪽으로 이어진다. 서쪽으로는 넓은 물이 보인다.

tba:100:room:10053:
  name: 작은 다리
  description: 누군가 생각이 있었는지 여기에 다리를 놓아 두어, 진흙투성이 늪을 걷지 않아도 된다. 오랜만에 마른 땅을 밟으니 기분이 좋다. 다리는 북쪽이나 남쪽으로 이어진다.

tba:100:room:10054:
  name: 싱크홀의 가장자리
  description: >-
    당신이 커다란 구덩이 쪽으로 다가가자 발밑의 땅이 꺼지기 시작한다. 다행히도 당신은 이 자연적인 덫에 빠지기 전에 뒤로 점프한다. 함몰된 구덩이 안을 내려다보니 시체 같은 것이
    어렴풋이 보인다.
  extras:
  - text: >-
      분명히 시체다. 하지만 인간은 아니다. 더 가까이 들여다보니 미노타우로스였던 것 같다. 뿔 몇 개를 겨우 알아볼 수 있고, 진흙탕에 떠 있는 한쪽 다리에는 발굽이 달려 있다.

tba:100:room:10055:
  name: 평원의 가장자리
  description: >-
    남쪽에는 늪, 북쪽과 동쪽에는 평원이 펼쳐져 있어 당신은 신선하고 깨끗하며 탁 트인 공기를 만끽한다. 바로 서쪽에는 싱크홀이 있다. 누군가가 그 위를 지나가다 무너뜨린 것이 틀림없다.
    당신은 그 불쌍한 모험가를 가엾게 여긴다.

tba:100:room:10056:
  name: 북쪽 길
  description: >-
    북쪽 길은 여기서 급히 동쪽으로 꺾인다. 둔모라 시에 점점 가까워지고 있는 것 같다. 남쪽 길을 따라가면 안전한 도시로 돌아갈 수 있다. 북쪽으로는 숲이 더 울창하다. 서쪽으로는
    숲을 베어 내고 새로 낸 길이 나 있다.

tba:100:room:10057:
  name: 북쪽 길의 굽이
  description: >-
    북쪽 길은 또다시 북쪽으로 굽어진다. 당신은 왜 그냥 곧은 길을 내지 않았는지 궁금해진다. 그러다 아마 늪 때문에 그럴 수 없었으리라는 것을 깨닫는다. 남쪽에는 연못이 있고,
    동쪽은 늪처럼 보인다.

tba:100:room:10058:
  name: 늪
  description: >-
    이 늪을 질척질척 건너가며 당신은 역겨워 얼굴을 찌푸린다. 오늘은 더 이상 좋은 날이 아닌 것 같다. 습지는 음산하고 냄새가 난다. 북쪽 길은 서쪽에 있다. 북쪽이나 동쪽으로는
    마른 숲이 이어진다.

tba:100:room:10059:
  name: 깊은 숲
  description: >-
    숲의 이 지역에는 작은 동물들이 많다. 대부분 너무 빠르고 경계심이 강해서 당신 눈에 보이지 않는다. 그저 당신을 피해 숨으며 나뭇잎이 바스락거리는 소리만 들릴 뿐이다. 숲은
    모든 방향으로 이어진다.

tba:100:room:10060:
  name: 깊은 숲
  description: >-
    바로 남쪽으로는 늪을 건너는 다리가 보인다. 나머지 모든 방향으로는 숲이 당신을 둘러싸고 있다. 숲의 이쪽은 평온해 보인다. 새들이 지저귀고 작은 동물들이 웅성거린다.

tba:100:room:10061:
  name: 성긴 숲
  description: >-
    여기서는 숲이 서서히 평원으로 변하고 있다. 동쪽으로는 끝없이 펼쳐진 거대한 풀밭이 보인다. 눈이 닿는 한, 수킬로미터나 되는 평탄한 땅이다. 남쪽에는 자연적으로 생긴 듯한 커다란
    구덩이가 있다. 땅이 최근에 무너진 것처럼 보인다.

tba:100:room:10062:
  name: 성긴 숲
  description: >-
    이곳의 나무는 모두 키 큰 활엽수인데, 서로 멀리 떨어져 있어 꽤 먼 곳까지 시야가 트인다. 동쪽으로 갈수록 나무가 더 드물어지다가 결국 평원으로 이어진다. 서쪽으로는 울창한
    숲 안으로 들어간다.

tba:100:room:10063:
  name: 평원의 가장자리
  description: 숲은 여기서 마침내 평원으로 이어진다. 평원은 완벽하게 평평해서 몇 킬로미터 앞까지 내다볼 수 있지만, 일단 숲이 시야에서 사라지면 그곳에서 길을 잃기 쉽다.

tba:100:room:10064:
  name: 깊은 숲
  description: >-
    당신은 울창한 숲 한가운데에 서 있다. 활엽수들이 머리 위로 높이 솟아 있고, 작은 소나무와 전나무가 땅에 바짝 붙어 자라 시야를 가린다. 북쪽 길은 여기서 바로 남쪽과 동쪽에
    있다.

tba:100:room:10065:
  name: 북쪽 길
  description: >-
    당신은 북쪽 길을 따라 걷고 있다. 길이 잘 닦여 있어 걷기가 수월하다. 북쪽과 남쪽으로 길이 이어진다. 동쪽과 서쪽으로는 울창한 숲이 펼쳐져 있다. 북쪽 어딘가에 길의 갈림길이
    보인 것 같다.

tba:100:room:10066:
  name: 깊은 숲
  description: >-
    숲의 이쪽은 온통 소나무와 전나무다. 나무들 사이로 북쪽과 남쪽으로 이어지는 오솔길 같은 것을 찾은 듯하다. 당신은 나무들을 스치며 지나간다. 발소리를 죽여 주는 푹신한 솔잎
    바닥이 고마울 따름이다.

tba:100:room:10067:
  name: 깊은 숲
  description: 소나무, 전나무, 삼나무가 더 많아져 나뭇가지를 밀어내며 덤불 사이로 몸을 밀어 넣어야 한다. 거미줄이 얼굴에 달라붙고, 잔가지가 자꾸 눈에 찔리려 든다.

tba:100:room:10068:
  name: 성긴 숲
  description: 당신은 나무들이 더 이상 빽빽이 에워싸지 않는 작은 빈터에 이른다. 숲은 사방으로 이어진다. 북쪽으로 북쪽 길이 보이는 것 같다. 남쪽은 늪이 계속되는 듯하다.

tba:100:room:10069:
  name: 성긴 숲
  description: >-
    야생동물들의 소리에 자꾸 신경이 쓰인다. 이 숲에 위험한 짐승이 있지는 않을까 궁금해진다. 사나운 미노타우로스에 관한 어린 시절의 이야기가 떠올라 문득 두려움이 솟는다. 그건
    그저 아이들을 도시 성벽 안에 붙잡아 두려고 지어낸 이야기였을 뿐이다, 그렇지 않은가?

tba:100:room:10070:
  name: 성긴 숲
  description: >-
    여기 숲은 밝고 경쾌하다. 당신은 모든 걱정을 잊고 아름다운 경치를 즐긴다. 여기서는 걱정할 것이 없다. 그저 무해한 작은 숲속 동물들뿐이다. 그런데 어쩌면 이 동물들 가운데
    몇몇은 그리 무해하지 않을지도 모른다.

tba:100:room:10071:
  name: 평원의 가장자리
  description: >-
    서쪽의 숲을 제외하고 모든 방향으로 평원이 이어진다. 당신은 잃어버린 영혼들의 평원에 대한 이야기를 떠올리며, 그것이 그저 이야기인지 아니면 실제로 사실인지 궁금해한다.

tba:100:room:10072:
  name: 깊은 숲
  description: >-
    숲에는 거대한 느릅나무와 단풍나무가 빽빽하다. 바로 북쪽으로 작은 길 같은 것이 어렴풋이 보인다. 그 길은 분명 북쪽 길이 아니다. 북쪽 길은 이곳에서 정동쪽에 있을 것이다.

tba:100:room:10073:
  name: 북쪽 길의 굽이
  description: >-
    북쪽 길은 여기서 동쪽이나 남쪽으로 꺾인다. 북쪽으로 뻗어 나간 좀 더 작은 길이 하나 눈에 띈다. 사람이 거의 다니지 않은 듯하다. 어느 쪽으로 갈까? 사람들이 덜 다닌 길은
    어떨까?

tba:100:room:10074:
  name: 북쪽 길
  description: >-
    북쪽 길은 여기서 동서로 이어진다. 동쪽으로 가면 언젠가는 다시 북쪽으로 꺾여 미노타우로스의 도시에 닿을 것이다. 서쪽으로는 도시로 되돌아간다. 북쪽과 남쪽으로는 숲이 계속 이어진다.

tba:100:room:10075:
  name: 북쪽 길
  description: >-
    길이 동쪽과 서쪽으로 뻗어 있다. 북쪽과 남쪽으로는 울창한 숲이 있다. 이 구간은 조금 덜 다닌 것 같다. 수레가 지나간 자국이 더 적고, 사람도 훨씬 적게 보인다.

tba:100:room:10076:
  name: 작은 길
  description: 작은 길이 여기서 동쪽으로 이어진다. 큰길은 서쪽에 있으며, 숲은 나머지 모든 방향으로 펼쳐져 있다. 이 길은 수년 동안 사용되지 않은 것처럼 보인다.

tba:100:room:10077:
  name: 작은 길의 굽이
  description: >-
    길이 여기서 북쪽이나 서쪽으로 꺾인다. 남쪽에는 숲이 있고, 동쪽에서는 평원이 시작된다. 길은 풀로 덮여 있고 작은 나무 몇 그루까지 자라 있다. 수년 동안 아무도 이 길을 지나다니지
    않은 것처럼 보인다.

tba:100:room:10078:
  name: 성긴 숲
  description: >-
    바로 서쪽에는 작은 길이 있고, 동쪽에는 평원이 펼쳐져 있다. 북쪽과 남쪽으로도 숲이 계속 이어진다. 이렇게 깊은 숲속까지 들어오는 이는 아무도 없는 듯하다. 모든 동물들이 당신을
    뚫어지게 쳐다보는 것 같다.

tba:100:room:10079:
  name: 평원의 가장자리
  description: >-
    평원이 몇 킬로미터나 펼쳐져 있다. 이렇게 사방이 트여 무방비한 곳에 서 있으니 오히려 답답하던 숲이 그리워진다. 북쪽으로는 작은 길이 보인다. 이따금 무언가, 혹은 누군가가
    몰래 지나가는지 평원의 풀이 흔들린다.

tba:100:room:10080:
  name: 작은 길
  description: 여기서는 길이 완전히 잡초에 덮여 있어 원래 어디로 이어졌는지 알 수 없다. 동쪽으로 이어지는 것 같기도 하다. 아니면 남쪽 숲으로 들어갈 수도 있다.

tba:100:room:10081:
  name: 작은 길
  description: 여기서는 길이 다시 주변 땅에 묻혀 희미해지기 시작한다. 어디로 이어지는지 가늠할 수 있는 흔적은 거의 남아 있지 않다. 서쪽과 남쪽으로 이어지는 것 같다.

tba:100:room:10082:
  name: 깊은 숲
  description: >-
    숲은 울창하고 음산하다. 동쪽에는 북쪽 길이 있고, 서쪽에는 그보다 작은 길이 하나 있다. 작은 동물들은 도망치지 않고 앉아 당신을 빤히 쳐다본다. 무단 침입자를 보는 데 익숙하지
    않은 모양이다.

tba:100:room:10083:
  name: 북쪽 길
  description: >-
    북쪽 길이 여기서 북쪽이나 남쪽으로 이어진다. 이제 둔모라에 거의 다다랐을 것이다. 당신은 영원히 여행하고 있는 것 같다. 길 위의 사람들이 점점 줄어든다. 그것이 좋은 징조인지
    나쁜 징조인지 확신할 수 없다.

tba:100:room:10084:
  name: 성긴 숲
  description: >-
    숲이 트이며 작은 들판이 나타난다. 동쪽으로는 작은 길이 보인다. 이 길은 남쪽으로 휘어지는 것 같다. 서쪽은 둔모라로 가는 큰길이거나, 안전한 도시로 돌아가는 길이다.

tba:100:room:10085:
  name: 작은 길
  description: >-
    길이 여기서 동쪽이나 남쪽으로 꺾인다. 서쪽으로는 북쪽 길이 보이는 듯하다. 당신은 생명의 흔적을 찾아보지만 아무것도 찾지 못한다. 당신은 아무도 감히 들어가지 않는 황야의 깊은
    곳에 있는 것 같다.

tba:100:room:10086:
  name: 작은 길
  description: >-
    이곳의 길은 풀이 무성하게 자라 완전히 뒤덮여 있다. 길이 어디로 이어지는지 놓치지 않으려면 슬슬 정신을 바짝 차려야 한다. 길은 동쪽 평원 쪽으로 향하는 듯하다. 서쪽으로는
    큰길로 이어진다.

tba:100:room:10087:
  name: 평원으로 이어지는 작은 길
  description: 이 작은 길은 평원을 가로지르거나, 미노타우로스 도시로 향하는 북쪽 길로 되돌아간다. 평원의 탁 트인 풍경에 비해, 숲의 울창함이 당신을 부르는 듯하다.

tba:100:room:10088:
  name: 깊은 숲
  description: >-
    이곳의 숲은 어둡고 고요하다. 동물들의 모습이나 소리를 거의 찾아볼 수 없다. 남쪽으로는 작은 길이 희미하게 보인다. 북쪽으로는 어떤 종류의 벽이 있는 것 같다. 마침내 미노타우로스들의
    도시를 발견한 것인가?

tba:100:room:10089:
  name: 깊은 숲
  description: >-
    울창한 숲이 당신을 에워싸고 있다. 숨이 막힐 것 같고, 혹시 좁은 공간 공포증을 느끼기 시작한 건 아닌지 걱정된다. 남쪽으로는 북쪽 길이 어렴풋이 보인다. 북쪽으로는 벽 같은
    것이 간신히 보인다. 분명 자연의 손길이 닿지 않은 것이다.

tba:100:room:10090:
  name: 북쪽 길의 끝 근처
  description: >-
    드디어 거대한 북쪽 길의 끝자락에 거의 다 왔다. 바로 북쪽으로는 미노타우로스의 도시가 보인다. 거대한 성벽이 도시 전체를 둘러싸고 있다. 안전한 남쪽으로 되돌아갈지 고민이 된다.

tba:100:room:10091:
  name: 성긴 숲
  description: >-
    북쪽 길은 바로 서쪽에 있다. 북쪽으로는 유명한 미노타우로스들의 도시가 보인다. 이곳의 숲은 매우 어둡고 고요하다. 이 일대에 사는 생물은 거의 없는 듯하다. 이 숲에는 음울한
    기운이 드리워져 있는 것 같다.

tba:100:room:10092:
  name: 성긴 숲
  description: >-
    이쪽 숲은 비교적 듬성듬성한데도, 당신은 음울함과 절망감을 느끼기 시작한다. 숲은 시시각각 더 어두워지는 것 같다. 숲의 이 일대에는 분명 뭔가 잘못된 것이 있지만, 그것이 무엇인지
    당신은 알 수 없다.

tba:100:room:10093:
  name: 평원의 가장자리
  description: >-
    여기서 동쪽과 남쪽으로 척박한 평원이 펼쳐져 있다. 바로 북쪽으로는 도시의 성벽이 보인다. 서쪽으로는 어두운 숲으로 들어갈 수 있다. 동쪽에서 바람이 불어와 철 이른 한기를 몰고
    온다.

tba:100:room:10094:
  name: 둔모라의 성벽 옆
  description: 당신은 높이 솟은 미노타우로스들의 도시 성벽 앞에 서 있다. 방어할 때 시야를 확보하려고 성벽 주변의 숲을 베어 냈다. 도시의 성문은 동쪽에 있을 것이다.

tba:100:room:10095:
  name: 둔모라의 성벽 옆
  description: >-
    도시의 성벽은 화강암 같은 거대한 돌덩이로 쌓은 듯하다. 그런 돌을 들어 올릴 수 있는 인간이 있으리라고는 상상하기 어렵다. 성벽은 분명 흉물스럽지만, 제 역할만큼은 훌륭히 해내고
    있다.

tba:100:room:10096:
  name: 둔모라 도시 앞
  description: >-
    당신은 미노타우로스 도시의 성문 앞에 서 있다. 안타깝게도 성문은 닫혀 있고, 꽤 오래전부터 그대로였던 것 같다. 동쪽이나 서쪽으로 성벽을 따라 살펴보거나, 남쪽으로 집을 향해
    돌아갈 수 있다.

tba:100:room:10097:
  name: 둔모라의 성벽 옆
  description: >-
    성벽이 당신을 압도하듯 솟아 있다. 위쪽에서는 아무것도 움직이지 않는 것 같지만, 혹시 누군가 위에서 당신에게 활을 겨누고 있는 것은 아닌지 마음이 쓰인다. 직접 알게 되기 전에,
    성벽에서 떨어져 숲 안쪽으로 조금 더 들어가는 편이 좋겠다.

tba:100:room:10098:
  name: 둔모라의 성벽 옆
  description: >-
    미노타우로스 도시의 성벽이 북쪽으로 더 나아갈 길을 막고 있다. 도시의 성문은 여기서 서쪽 어딘가에 있을 것이다. 남쪽의 숲은 매우 음산해 보인다. 동쪽으로는 성벽이 평원 쪽으로
    계속 뻗어 나간다.

tba:100:room:10099:
  name: 둔모라의 성벽 옆
  description: 평원이 남쪽과 동쪽으로 수 킬로미터나 펼쳐져 있다. 둔모라의 성벽은 바로 북쪽에 있다. 서쪽으로는 성긴 숲이 있고, 멀리 북쪽 길인 듯한 것도 보인다.

tba:100:mob:10000:
  short: 은둔자
  long: 은둔자 하나가 당신에게도, 세상 일에도 아랑곳하지 않은 채 여기 서 있다.
  description: >-
    이 은둔자는 너무 오랫동안 도시 밖에서 살아왔다. 몰골이 엉망이라 목욕을 하고 깨끗한 옷으로 갈아입는 일이 시급해 보인다. 이런 곳에서 혼자 살아남았으니 강인하고 의지가 굳은
    사람임이 틀림없다.

tba:100:mob:10001:
  short: 보브캣
  long: 보브캣 한 마리가 여기 웅크리고 앉아 새끼들을 보호하듯 지키고 있다.
  description: >-
    보통 이 동물은 인간의 기척만으로도 도망치지만, 새끼들이 곁에 있어 떠나지 않는다. 새끼를 지키는 동물이 얼마나 사납게 변하는지 들어본 적이 있다. 이제 당신이 직접 그 경험을
    하게 될 것이다.

tba:100:mob:10002:
  short: 줄다람쥐
  long: 귀여운 줄다람쥐 한 마리가 여기저기 뛰어다니며 견과류를 모으고 있다.
  description: >-
    볼이 한껏 부풀어 금방이라도 터질 것 같다. 비상시에 대비해 먹이를 모아 두려는 모양이다. 머리 꼭대기부터 꼬리까지 검고 흰 줄무늬가 길게 이어진, 작은 갈색 털북숭이 짐승이다.

tba:100:mob:10003:
  short: 여우
  long: 붉은 여우 한 마리가 눈에 띄지 않으려 애쓰며 당신에게서 슬금슬금 멀어진다.
  description: >-
    붉은색이라기보다 갈색에 가깝다. 여우는 귀를 뾰족하게 세우고 위험을 알리는 작은 소리 하나도 놓치지 않으려 바짝 경계하고 있다. 털이 풍성한 큰 꼬리를 보면 건강한 것이 틀림없다.
    한참 멀리서부터 당신이 오는 것을 보고 있었는지, 별로 겁먹은 기색이 없다.

tba:100:mob:10004:
  short: 코요테
  long: 당신이 다가가자 마른 회색 코요테 한 마리가 나무 사이로 사라진다.
  description: >-
    코요테는 조금 지나치게 말라 보이지만, 몸 상태는 분명 아주 좋다. 이 청소동물은 땅에서 나는 것으로 먹고사는 법을 익혀, 이 지역 농부들에게 흔한 골칫거리가 되었다. 무리 전체가
    달려들어 무리에서 떨어진 소 한 마리를 쓰러뜨린 일도 있다고 알려져 있다.

tba:100:mob:10005:
  short: 암사슴
  long: 우아한 암사슴 한 마리가 당신을 향해 하얀 꼬리를 홱 흔든다.
  description: >-
    암사슴이 당신을 조심스럽게 바라본다. 다른 사슴들에게 당신이 있다고 알리려는 듯, 꼬리 밑의 하얀 털이 번쩍인다. 몹시 겁에 질린 모습이라 당장이라도 달아날 것만 같다.

tba:100:mob:10006:
  short: 수사슴
  long: 크고 풍성한 뿔을 가진 수사슴이 당신을 바라본다.
  description: 이 수사슴이 가진 인상적인 뿔에는 최소 12개의 가지가 있을 것이다. 그 뿔에 들이받히면 어떤 느낌일지 궁금해진다. 아마 곧 알게 될지도 모른다.

tba:100:mob:10007:
  short: 상인
  long: 수도에서 둔모라로 이동 중인 상인이 여기 있다.
  description: >-
    이 상인은 꽤 오랫동안 도시와 도시 사이를 떠돌아 온 것 같다. 아무도 딱히 필요로 하지 않는 쓸모없는 잡동사니를 파는 재주는 확실히 타고났다. 노련해 보이는 그를 보니, 이런
    황야를 떠돌며 몇 번이나 스스로를 지켜야 했을지 궁금해진다.

tba:100:mob:10008:
  short: 행상인
  long: 행상인 하나가 도시에 내다 팔 물건을 지고 가고 있다.
  description: >-
    이 행상인은 도시의 호구들에게 이문을 남기고 팔 수 있기를 바라며 쓸모없는 잡동사니를 잔뜩 지니고 있다. 그는 전혀 믿음직해 보이지 않는다. 당신은 그 곁을 지나가며 지갑을 조금
    더 꽉 쥔다.

tba:100:mob:10009:
  short: 주머니쥐
  long: 주머니쥐 한 마리가 꼬리로 나무에 매달려 있다.
  description: 이 기이한 동물의 눈은 어둠 속에서 보기 알맞게 생긴 듯하다. 털 없는 꼬리까지 합쳐 길이가 60센티미터쯤 된다. 멍청하고 굼떠 보인다.

tba:100:mob:10010:
  short: 악어
  long: 악어가 당신을 향해 느릿느릿 기어온다.
  description: 이 큰 비늘을 가진 생물의 거대한 턱을 보자 당신은 몇 걸음 뒤로 물러난다. 매우 단단해 보이며, 그 두꺼운 가죽을 뚫을 수 있는 무기가 많지 않을 것 같다.

tba:100:mob:10011:
  short: 라쿤
  long: 당신 머리 바로 위, 나무에 라쿤 한 마리가 앉아 있다.
  description: >-
    이 작은 산적은 당신이 하는 일에 매우 관심이 있는 듯하다. 두려움의 기색 없이 당신을 지켜보고 있다. 사람과 닮은 손으로 나무 사이를 기어 다닌다. 몸은 회색과 검은색이며,
    눈 주위의 잊을 수 없는 가면이 인상적이다.

tba:100:mob:10012:
  short: 스컹크
  long: 스컹크 한 마리가 느릿느릿 지나간다.
  description: >-
    등과 꼬리에 흰 줄무늬가 난 낯익은 검은 고양잇과 동물을 보자 당신은 그 자리에 얼어붙는다. 이 동물은 누구도 두려워하지 않는다. 바보가 아니고서야 이 녀석을 공격했다가 지독한
    냄새를 뒤집어쓸 위험을 무릅쓰지 않기 때문이다.

tba:100:mob:10013:
  short: 어린 보브캣
  long: 작은 새끼 보브캣 한 마리가 여기서 놀고 있다.
  description: >-
    이 귀여운 작은 짐승은 애완동물처럼 보인다. 다만 이제 막 쓰는 법을 배우고 있는 듯한 날카로운 발톱과 이빨만 빼면 말이다. 이 귀여운 녀석을 그냥 쓰다듬어 보고 싶은 마음이
    든다.

tba:100:mob:10014:
  short: 스라소니
  long: 당신이 지나가자 스라소니 한 마리가 쉭쉭거린다.
  description: >-
    작고 단단한 체구의 이 고양이과 동물은 분명 이 숲에 적응했다. 귀 끝에서 작은 털 뭉치가 삐죽 나와 있다. 당신이 지금까지 본 어떤 고양이보다도 두세 배는 크다. 뚜렷한 목적이
    있는 듯 민첩하게 걷는다.

tba:100:mob:10015:
  short: 사냥꾼
  long: 사냥꾼 한 명이 큰 수사슴을 쫓으며 이 숲을 배회한다.
  description: 최근에 잡은 짐승들의 가죽을 걸친, 황야에서 잔뼈가 굵은 이 자는 소리 없이 사냥감을 뒤쫓으며 덮칠 기회를 노리고 있다.

tba:100:mob:10016:
  short: 여사냥꾼
  long: 여사냥꾼은 숙련된 솜씨와 굳은 의지로 자신의 사냥감을 추적한다.
  description: 과거 사냥감의 가죽과 털로 뒤덮여 있어, 매우 숙련되고 능숙해 보인다.

tba:100:obj:10000:
  short: 더러운 침상
  long: 한쪽 구석에 벼룩이 들끓는 침상이 놓여 있고, 그 위에 헝겊이 가득하다.
  extras:
  - text: 침상을 더 자세히 살펴보니, 헝겊 몇 장은 처음 생각했던 것만큼 낡지 않은 것 같다. 없어져도 아무도 모르지 않을까?

tba:100:obj:10001:
  short: 난로
  long: 낡은 난로 하나가 이곳에서 서서히 녹슬어 사라져 가고 있다.
  extras:
  - text: 난로는 몇 년 동안 쓰지 않은 것처럼 보인다. 바닥에는 재가 두껍게 쌓여 있다. 재 속에서 무언가 반짝이는 것이 눈에 띈다.

tba:100:obj:10002:
  short: 강
  long: 맑은 강물이 흐르고 있으며, 작은 송어들이 느긋하게 물살을 타고 헤엄치고 있다.
  extras:
  - text: 여기 강물은 잔잔하게 흐르고 있다. 작은 송어들이 수면 바로 아래를 떠다니고 있다. 당신은 그중 한 마리를 낚을 수 있을지 궁금해진다.
  - text: 어떤 종류의 작은 송어다. 매우 맛있어 보인다.

tba:100:obj:10003:
  short: 호수
  long: 아름답고 고요한 호수가 여기 반짝이고 있다.
  extras:
  - text: 호수는 더없이 잔잔하다. 물결 하나 일지 않아 수면이 마치 유리 같다. 물은 깨끗해서 마셔도 될 것 같다.

tba:100:obj:10004:
  short: 연못
  long: 물이 고여 썩어 가는 탁한 연못이 여기 있다.
  extras:
  - text: 연못은 짙은 갈색을 띠고 이상한 냄새가 난다. 이 물을 마셔도 될지 망설여진다.

tba:100:obj:10005:
  short: 강
  long: 빠르게 흐르는 강이 굉음을 내며 당신 곁을 지나간다.
  extras:
  - text: 여기서는 강이 매우 넓다. 건너기 어려울 것 같다. 물은 매우 상쾌해 보인다.

tba:100:obj:10006:
  short: 작은 송어
  long: 작은 송어가 당신의 손 안에서 꿈틀거린다.
  extras:
  - text: 이 불쌍한 작은 녀석은 죽기 전에 물속으로 돌아가고 싶어 한다. 꽤 맛있어 보인다.

tba:100:obj:10007:
  short: 바지
  long: 더러운 바지 한 벌이 바닥에 구겨져 놓여 있다.
  extras:
  - text: 이 바지는 몹시 더럽다. 몇 년째 빨지 않은 것 같다. 때와 냄새만 빼면 그런대로 멀쩡하다.

tba:100:obj:10008:
  short: 셔츠
  long: 더러워 보이는 셔츠 한 벌이 여기 놓여 있다.
  extras:
  - text: 셔츠는 더럽지만 매우 쓸 만해 보인다. 원단은 고품질 양모로 되어 있어 상당한 마모에도 견딜 수 있을 것이다.

tba:100:obj:10009:
  short: 동전 몇 닢
  long: 동전 몇 닢이 여기 놓여 있다.
  extras:
  - text: 무더기가 반짝인다. 백금, 금, 은, 청동 동전이다.

tba:100:obj:10010:
  short: 참나무
  long: 거대한 참나무가 당신 위에 우뚝 솟아 있다.
  extras:
  - text: >-
      이 장엄한 나무는 당신 키보다 굵다. 나무 꼭대기 높은 곳에 많은 동물들이 둥지를 틀고 있다. 일부는 속이 비어 있는 것처럼 보이며, 아마도 다람쥐와 라쿤의 굴일 것이다.

tba:100:obj:10011:
  short: 단풍나무
  long: 여기서 단풍나무 한 그루가 바람에 나긋이 흔들리고 있다.
  extras:
  - text: >-
      이 거대한 나무는 바람에 나긋이 흔들리고 있다. 주변 다른 모든 나무보다 훨씬 높이 솟아 있다. 꼭대기까지 올라갈 수만 있다면 이 일대를 잘 내려다볼 수 있을 것이다. 하지만
      당신이 닿을 수 있을 만한 가지는 보이지 않는다.

tba:100:obj:10012:
  short: 느릅나무
  long: 거대한 느릅나무가 하늘을 향해 뻗어 있다.
  extras:
  - text: >-
      당신이 지금껏 본 나무 중에서도 손꼽히게 큰 나무임이 틀림없다. 밑동의 너비는 족히 세 걸음은 되어 보이고, 가지가 워낙 무성해서 나무 꼭대기는 아예 보이지도 않는다.

tba:100:obj:10013:
  short: 물푸레나무
  long: 키가 크고 곧은 물푸레나무 한 그루가 하늘을 향해 뻗어 있다.
  extras:
  - text: >-
      이 나무는 껍질이 거칠고, 작은 나무들을 모두 뛰어넘을 때까지 가지가 하나도 없이 완벽하게 곧게 뻗어 있다. 그 위쪽에는 건강하고 모양이 특이한 잎이 무성한 거대한 가지들이
      뻗어 있어 숲의 나머지 부분에서 햇빛을 모두 가로채고 있다.

tba:100:obj:10014:
  short: 황동 랜턴
  long: 꺼진 황동 랜턴 하나가 여기 놓여 있다.
  extras:
  - text: 황동 덮개를 여닫을 수 있어, 불을 완전히 끄지 않고도 불빛을 어둡게 줄일 수 있다. 유리구는 더럽지만, 빛이 꽤 새어 나올 만큼은 맑다.

tba:100:obj:10015:
  short: 털가죽 배낭
  long: 끈이 달린 털가죽 더미가 배낭인 것 같다.
  extras:
  - text: 이 배낭은 사슴 가죽으로 만들어져 매우 튼튼하다. 몸에 둘러멜 수 있다.

tba:100:obj:10016:
  short: 사슴고기
  long: 이 사슴 고기 덩어리는 크고 살이 통통한 사슴에서 나온 것이다.
  extras:
  - text: 이 큰 고기 덩어리는 최근에 구워졌으며, 비록 건조해 보이지만 꽤 맛있어 보인다.
