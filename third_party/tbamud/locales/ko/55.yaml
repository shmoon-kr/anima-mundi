tba:55:room:5500:
  name: 지하
  description: 작은 통로가 서쪽과 동쪽으로 이어진다.

tba:55:room:5501:
  name: 지하
  description: 작은 통로가 서쪽과 동쪽으로 이어진다.

tba:55:room:5502:
  name: 지하
  description: 작은 통로가 서쪽과 동쪽으로 이어진다.

tba:55:room:5503:
  name: 성직자의 성소
  description: >-
    당신은 계단을 내려와 고요한 내면의 성소에 들어선다. 여기에는 때가 되면 당신을 돕기 위해 대기 중인 길드장이 앉아 있다. 방 안은 완전히 고요하다. 유일한 명백한 출구는 계단을
    따라 올라가 넥타르로 나가는 곳이다.
  exits:
    east:
      look: 당신은 동쪽 벽 아래 바닥에 희미한 긁힌 자국이 몇 군데 있는 것을 알아채는다.

tba:55:room:5504:
  name: 대제사장실
  description:
  - >-
    당신은 뉴탈로스에서 가장 신성한 인물의 방에 들어섰다. 대제사장은 신성한 세계의 모든 사안에 대해 술탄에게 조언을 한다. 그러나 당신이 들은 바로는, 이 신성한 인물은 성격이
    좀 급하고, 당신의 기도에 방해가 된 것을 매우 불쾌해하는 것 같다.
  - 유일한 명백한 출구는 남쪽이다.

tba:55:room:5505:
  name: 제단 곁
  description: >-
    당신은 뉴탈로스 신전의 북쪽 끝, 신전 제단 곁에 있다. 당신 앞에 곱게 광을 낸 검은 오닉스로 만든 거대한 제단이 서 있다. 이 제단 뒤에는 모든 땅에서 가장 높은 신인 악발의
    약 3.7미터 높이의 동상이 놓여 있다.
  extras:
  - text: 거대한 동상을 올려다보니, 악발이 자신의 땅을 향해 차분히 시선을 던지고 있는 것이 보인다. 그는 만족해하는 것 같다.

tba:55:room:5506:
  name: 직조공 길드
  description: >-
    자른 적 없는 천이 줄줄이 쌓여 있어, 맞춤 옷으로 다듬어지기를 기다리고 있다. 시골에서 가져온 면화실을 실어 천을 짜고 다양한 색으로 염색한다. 어린 소년이 들어와 옷 더미를
    집어 들고 나간다.

tba:55:room:5507:
  name: 장인 길드
  description: >-
    당신은 온갖 도구와 자재를 들고 정신없이 뛰어다니는 사람들로 북적이는 작업장에 들어섰다. 여러 프로젝트와 창작물을 서둘러 완성해야 한다는 긴장감이 공기 중에 감돌고 있다.

tba:55:room:5508:
  name: 사원 내부
  description: >-
    사원은 여기서도 이어지지만, 그 규모는 그리 크지 않다. 여전히 이곳은 깔끔하게 정돈되어 보인다. 북쪽으로는 대주교의 방이 보이고, 문에는 '방해 금지'라고 큼직하게 적힌 표지가
    붙어 있다. 남쪽으로는 성직자 길드의 입구가 있다.

tba:55:room:5509:
  name: 사원 내부
  description: >-
    거대한 대리석 기둥이 당신 양옆에서 솟아 올라 천장을 움켜쥐고 있다. 기둥 사이사이에는 뉴탈로스의 종교적 역사를 묘사한 정교한 부드러운 돌벽화가 새겨져 있다. 앞을 향한 의자
    행렬은 높은 곳에 솟은 강단에만 온통 주의를 기울이고 있다. 발밑의 짙은 붉은색 카펫에는 마모나 흙 한 점도 보이지 않는다. 뉴탈로스 사람들이 종교를 얼마나 진지하게 여기는지
    분명하다.

tba:55:room:5510:
  name: 기부실
  description: >-
    이 방은 사원에 새로 생긴 곳으로, 최근 몇십 년간 도시를 강타했던 어려운 시기에 만들어졌다. 다행히도 술탄은 바로 이런 상황을 대비해 일부 필수 물자를 비축해 두었다. 요즘에는
    이 기부실이 부유한 모험가들의 관대함에 의존하고 있으며, 들어와서 모든 것을 가져가려는 자에게는 저주가 내려진다.

tba:55:room:5511:
  name: 대신들의 박물관
  description:
  - 박물관 안에는 네 개의 거대한 석상이 서 있다. 뉴탈로스 사람들은 자신들의 생명을 구했다고 믿는 성자들에 대한 경의를 표하기 위해 이 석상들을 세웠다.
  - 박물관은 남쪽으로 이어진다.

tba:55:room:5512:
  name: 성직자 길드 입구
  description: >-
    이 홀은 본당에 비하면 초라해 보이지만, 그 자체로 아름답다. 삭발한 머리들과 갈색 로브를 입은 사람들이 조용히 서로 이야기를 나누며 어슬렁거리는 모습이 보인다. 북쪽은 본당
    안쪽이고, 남쪽은 성직자들의 술집 입구이다.

tba:55:room:5513:
  name: 신전 문
  description: >-
    당신은 뉴탈로스 신전의 입구 앞에 서 있다. 두 개의 거대한 주철 문이 당신 앞에 활짝 열려 있다. 이 문들이 실제로 사용될 일은 없을지 모르지만, 신전의 사제들은 도시가 다시
    포위공격을 당할 경우를 대비해 방어 태세를 갖추고 있다.

tba:55:room:5514:
  name: 아킴의 가게
  description: 당신은 연기가 자욱한 가게 안으로 발을 들여놓는다. 아킴은 이 세상의 것이 아닌 것들에 대한 취향이 있는 것 같다... 정말로 기이한 물건들이다.

tba:55:room:5515:
  name: 베라의 채소 가게
  description: >-
    여기는 분주한 곳이다. 손님들이 넓은 종류의 채소를 더 싸게 사기 위해 흥정하며 이리저리 움직인다. 아직도 어머니가 '채소를 먹어라'라고 말씀하시던 소리가 들린다. 아마 그래서
    뉴탈로스라는 도시에서 시간을 보내고, 어머니 곁에 있지 않는 것이겠지. 하지만 잠깐... 베라는 어머니와 똑같이 생겼어!

tba:55:room:5516:
  name: 대신들의 박물관
  description:
  - 박물관 안에는 네 개의 거대한 석상이 놓여 있다. 뉴탈로스 사람들이 자신들의 생명을 구했다고 믿는 성자들에 대한 경의를 표하기 위해 만든 것이다.
  - 박물관은 북쪽으로 이어진다.

tba:55:room:5517:
  name: 탑의 기둥
  description: >-
    당신은 차가운 방 안으로 들어선다. 벽을 따라 위로 올라가는 오래된 나무 나선계단이 유일한 특징이다. 이 계단을 오르면, 당신의 연구에 도움을 줄 수 있는 옛 마법사가 기다리고
    있다고 한다.
  exits:
    south:
      look: 벽 아래 바닥에 작은 긁힌 자국이 보인다.

tba:55:room:5518:
  name: 마법사들의 마당
  description: >-
    당신은 작은 타일로 깔린 마당으로 들어선다. 한가운데에는 작은 분수가 있다. 주변에는 쿠션이 놓인 네 개의 주철 벤치가 있어, 이 땅의 마법사들이 앉아 생각을 나누는 곳이다.
    서쪽에는 마법사 길드의 수장이 실험을 하는 2층짜리 탑이 서 있다.

tba:55:room:5519:
  name: 신들의 꿀
  description: >-
    당신은 이 곳의 호화로운 분위기에 깜짝 놀란다. 성직자에 대해 아는 바로는, 그들은 모든 재물을 사명에게 바치는 겸손한 사람들이어야 한다. 아마도 이 술집에는 성직자만 출입할
    수 있기 때문에, 최대한 편안하게 꾸며도 된다고 용인한 모양이다. 구석에는 명상실로 내려가는 계단이 놓여 있다.

tba:55:room:5520:
  name: 신전 광장
  description: >-
    당신은 신성한 뜻을 가진 이들의 모임 장소 위에 서 있다. 수도사, 음유시인, 성기사, 성직자들이 여기저기 돌아다니며 설교를 하거나 동료들의 설교를 듣고 있다. 거대한 대리석
    계단이 신전 문으로 이어져 있고, 남쪽으로는 큰길이 뻗어 있다.

tba:55:room:5521:
  name: 은행
  description: >-
    당신은 검은 대리석과 붉은 벨벳으로 장식된 큰 건물 안에 서 있다. 거대한 기둥들이 머리 위 높은 곳에 있는 아치형 천장을 받치고 있다. 장식을 살펴보니, 왜 왜인들이 디테일에
    능숙한지 궁금해진다. 바닥을 이룬 광택을 낸 블록 사이를 은으로 된 가느다란 선이 구분하고 있다.

tba:55:room:5522:
  name: 도축장
  description: >-
    이 가게에는 방금 도축된 짐승들의 냄새가 난다. 당신은 왠지 익숙한 기분이 든다. 꽤 단순한 구조를 보고 있다. 시체... 아니... 고기들이 후크에 걸려 있고, 여전히 피를
    흘려 받침 접시로 떨어지며, 그 접시들은 지하의 하나의 큰 통으로 배수된다. 그 통이 어디로 이어지는지 궁금해진다...
  extras:
  - text: 당신은 통에서 소리가 나는 것 같다고 생각한다... 아니야.

tba:55:room:5523:
  name: 마녀의 양조장
  description: >-
    이 넓은 상점에 들어서면 가장 먼저 눈에 들어오는 것은 선반을 따라 늘어선 수백 개의 촛불이다. 발밑을 감싸는 소용돌이치는 안개 덕분에 마치 다른 차원으로 이어지는 관문에 발을
    들인 것 같다. 문과 정반대편, 가장 안쪽 벽 근처에는 어지럽게 물건이 놓인 테이블이 하나 서 있다.

tba:55:room:5524:
  name: 브라힘의 마법 상점
  description: 책장이 빼곡히 들어차고 두루마리가 어지럽게 널린 상점에 들어선다. 주인은 최신 마법 창작물에 몰두해 있는 듯하다. 벽에 작은 간판이 하나 걸려 있다.

tba:55:room:5525:
  name: 마법사들의 탑 입구
  description: 입구 홀은 조명이 어두운 작은 방이다. 이곳의 유일한 용도는 입구를 지키고 서 있는 강력한 주술사를 위한 것인 듯하다.

tba:55:room:5526:
  name: 전사 길드 입구
  description: 이 작은 홀은 원치 않는 자들을 막아내는 검문소일 뿐이다.

tba:55:room:5527:
  name: 수리점
  description: >-
    뉴탈로스에서 가장 인기 있는 상점 중 하나인 이곳은 항상 분주하다. 한 사람이 혼자서 모든 종류의 갑옷을 수리하는 방식은 거의 인간이 할 수 있는 일이 아니다. 수리가 필요한
    물건이 있다면 카운터 뒤의 남자에게 그냥 넘기면 된다. 카운터에는 작은 간판이 하나 붙어 있다.
  extras:
  - text: '간판에는 이렇게 적혀 있다: 리모델링으로 휴업 중'

tba:55:room:5528:
  name: 잡화점
  description: >-
    이 아름다운 도시의 새로 얻은 부는 여기에서 판매되는 이국적인 물건들에서 분명히 드러난다. 만약 당신이 ...LIST...를 입력하면 무슨 일이 일어날지 궁금해진다.

tba:55:room:5529:
  name: 압둘의 갑옷점
  description: >-
    방어구점에 들어서자 금속을 두드리는 소리가 점점 커진다. 어린 소년들이 물과 석탄이 든 양동이를 들고 이리저리 뛰어다닌다. 상점 뒤쪽에서 몇몇 난쟁이들이 갑옷의 일부 작업을 하고
    있는데, 그들의 망치는 따라갈 수 없을 정도로 빠르게 움직인다. 벽에는 압둘의 자랑스러운 창작품들이 모두 걸려 있다. 여기서는 괴물들이 당신을 조각조각으로 썰어 놓지 못하도록
    만들어 둔 갑옷을 구매할 수 있다. 벽에 붙은 쪽지가 당신의 주의를 끈다.
  extras:
  - text:
    - >-
      쪽지에는 이렇게 적혀 있다: LIST  : 판매 중인 물건 목록을 보여준다. VALUE : 물건이 압둘에게 얼마나 가치가 있는지 알려준다 SELL  : 물건을 압둘에게 넉넉한
      가격에 판다 BUY   : 압둘의 가장 좋아하는 명령어로, 그의 낮은,
    - 낮은 가격에 물건을 살 수 있다.

tba:55:room:5530:
  name: 용병 길드
  description: >-
    뉴탈로스 대부분의 주민들은 이 길드를 눈총으로 바라본다. 하지만 공급과 수요의 법칙은 거부할 수 없는 법이다. 사람들은 스스로 싸울 수 없거나 싸우기를 꺼릴 때 이곳을 찾는다.
    소액의 비용을 지불하면 하인을 고용할 수 있다.
  exits:
    east:
      look: 동쪽 벽 근처 바닥에 작은 긁힘 자국이 몇 개 있는 것을 발견한다.

tba:55:room:5531:
  name: 용병 길드
  description: 여기는 고용될 용병들을 위한 저장실이다.

tba:55:room:5532:
  name: 도적 길드 입구
  description: >-
    작고 어두운 이 방에는 벽에 하나 달린 횃불만이 빛을 비춘다. 작은 나무 벤치가 하나 있고, 그 위에 책이 놓여 있다. '외부인'으로부터 입구를 지키는 암살자가 당신이 들어오자
    일어서 있다.

tba:55:room:5533:
  name: 갈바위
  description:
  - >-
    매우 큰 체구의 남성들이 매우 큰 검을 들고, 매우 큰 맥주잔으로 맥주를 마신다. 이 방 안의 모든 것이 크다. 큰 둥근 테이블들은 수많은 술집 난투극으로 인해 긁히고 깨져 있다.
    분위기를 음미하는 동안 잠시 말을 삼가는 것이 좋을지도 모른다.
  - 동쪽에는 제자들과 훈련할 준비를 하고 있는 검술 대사가 기다리는 출구가 있다.

tba:55:room:5534:
  name: 시합·연습장
  description: >-
    여기는 허수아비, 샌드백, 그리고 검술 제자들로 가득한 넓은 잔디밭이다. 북쪽에는 검은 로브를 입은 남자가 보인다. 철갑을 두른 동료들과는 달리, 당신은 그를 당신의 스승으로
    추정한다.
  exits:
    east:
      look: 여기 벽 기슭 근처의 잔디가 약간 찢어져 있다.

tba:55:room:5535:
  name: 빵 노점
  description: 여기 작은 노점이 하나 차려져 있어, 가게 주인 겸손한 재고품이 진열되어 있다. 당신은 그가 목록에 몇 가지 품목을 추가한 것을 알아차린다.

tba:55:room:5536:
  name: 이고르의 파괴 도구점
  description: >-
    잔인한 무기들의 진열장을 바라보며 당신은 어쩔 수 없이 소름이 돋는다. 거대한 검들과 사나워 보이는 도끼들이 방 안 벽의 못에 걸려 있다. 뒤쪽 작업대에는 난장이 앉아 최신 창작물에
    망치를 두드리고 있다. 여기서는 세계의 다른 어디서도 찾아볼 수 없는 희귀하고 이국적인 물건을 살 수 있다. 당신의 시선이 쪽지에 꽂힌다.
  extras:
  - text:
    - '쪽지에는 이렇게만 적혀 있다: 방어구점의 쪽지를 읽어라 @'
    - 이 고르.

tba:55:room:5537:
  name: 오래된 가죽 가게
  description: >-
    당신은 두꺼운 동양식 카펫 위에 서 있으며, 사방으로 수많은 가죽 제품 진열대가 둘러싸고 있다. 몇몇 여자들이 가죽 쿠션에 앉아 주문 제작 재킷의 세부 공예를 바느질하고 있다.

tba:55:room:5538:
  name: 밀수꾼의 여관
  description: >-
    당신은 꼬질이 여관 안에 있다. 이 여관은 수십 년간 청소된 적이 없는 것처럼 보인다. 벽을 따라 포커 테이블이 줄지어 있고, 당신이 들어오자 모든 사람이 당신을 쳐다본다. 당신은
    별로 환영받는 기분이 들지 않는다. 바에는 수많은 칼 자국이 나 있고, 바텐더가 몸을 숙여 당신의 주문을 기다리고 있다.

tba:55:room:5539:
  name: 꼬질이 유니콘
  description: >-
    문을 열자 뼈가 시릴 정도로 차가운 바람이 스며든다. 창문이나 열린 문은 보이지 않는다. 모자를 눌러쓴 사람들이 그림자 속에 웅크리고 낮게 속삭인다. 칼날이 번쩍이며 이 군중
    속에 무기가 넘쳐남을 알린다. 허리에 차고 있는 주머니를 재빨리 확인하는 사이, 아래로 내려가는 작은 계단이 눈에 들어온다.

tba:55:room:5540:
  name: 창고
  description: 당신은 도시에서 만든 상품을 출하하기 전에 보관하는 넓은 방에 서 있다. 이곳의 모든 물품은 뉴탈로스에서 만들어져 땅의 다른 지역으로 보내진다.

tba:55:room:5541:
  name: 창고
  description: >-
    남자들이 이리저리 돌아다니며 상자를 세고 조사 결과를 적어 내려간다. 창고의 이 구역은 도시 밖 지역에서 들여온 원자재를 보관하는 데 사용된다. 이 물품들은 나중에 각 길드에
    전달된다. 창고의 수출 구역은 남쪽에 있다.

tba:55:room:5542:
  name: 조선소
  description: >-
    당신 발밑의 나무 바닥은 해수에 흠뻑 젖어 수년간 방치된 탓에 삐걱거린다. 곱슬곱슬한 회색 수염을 기른 노인이 작은 계산대 뒤에 서서 당신의 주문을 기다리고 있다. 그의 뒤에는
    다양한 모형 범선과 큰 물고기들이 걸려 있다.

tba:55:room:5543:
  name: 도면실
  description: 벽면에는 선체 설계 도면이 가득 붙어 있다. 이 방은 목재에 첫 칼질을 내기 전에, 배를 만드는 장인이 자신의 창작물을 종이에 먼저 그려보는 데 쓰인다.

tba:55:room:5544:
  name: 대장간
  description: >-
    무기 장인과 마찬가지로, 이 사람은 금속을 다듬는 일을 한다. 그의 작품 대부분은 말과 관련이 있는 것 같다. 벽에는 철로 만든 말굽이 여러 개 걸려 있다. 방 안은 덥다. 바로
    남쪽에 있는 사막보다 더 덥다. 대장장이가 어떻게 이 열기를 견디는지 궁금해진다.

tba:55:room:5545:
  name: 왕실 마구간
  description: >-
    기대하는 것 이상도 이하도 아니다. 여러 마구간에는 술탄이 고른 아라비아산 수말들이 들어 있고, 각각 자기만의 물통이 있다. 가끔 작은 소년이 삽을 들고 들어와 이런 짐승들이
    남긴 불쾌한 부산물을 치운다.

tba:55:room:5546:
  name: 비밀 마당
  description:
  - 뉴탈로스에서 소수의 사람들만 아는 숨겨진 마당이다. 여기서 도둑질, 자물쇠 따기, 그리고 거의 보이지 않는 법을 익힐 수 있다.
  - 작은 계단이 유니콘으로 다시 올라간다.
  exits:
    south:
      look: 남쪽 벽에 작은 긁힌 자국이 보인다.

tba:55:room:5547:
  name: 쓰레기장
  description: 이곳은 도시 사람들이 쓰레기를 버리는 장소다. 산에서 불어오는 끊임없는 바람 덕분에 냄새는 보통 성벽 밖으로, 사막 쪽으로 날려 버린다.

tba:55:room:5548:
  name: 마법사의 실험실
  description: >-
    당신은 오래된 돌탑 꼭대기에 서 있다. 벽을 따라 수백 개의 포션, 스크롤, 지팡이가 어지럽게 널려 있다. 눈앞에 보이는 남자는 작은 나무 책상 앞에 구부정한 자세로 앉아 있고,
    그의 앞에는 거품이 오르는 액체가 담긴 두 개의 비커가 놓여 있다. 당신이 들어오자 그는 고개를 들고 활짝 웃는다.

tba:55:room:5549:
  name: 건초 창고
  description: 시골 농장에서 보는 것들만큼 크지는 않지만, 이 건초 창고는 마구간의 말들을 위한 저장 공간으로 쓰인다. 삽을 들고 본 소년이 2층에 자리를 잡은 것 같다.

tba:55:room:5550:
  name: 대정문
  description: >-
    당신이 이런 노골적인 부의 과시를 본 곳은 이 복도가 처음이다. 발밑의 거친 카펫 덕분에 구름 위를 걷는 것 같다. 백금 촛대가 천장에서 섬세하게 매달려 벽을 장식한 오래된 타피스트리에
    빛을 비춘다. 목이 뻐근해서 더 이상 넋을 잃고 바라볼 때가 아니라는 것을 알려 준다. 서쪽으로는 궁전의 수많은 홀이 시작되고, 동쪽에는 문이 있다.

tba:55:room:5551:
  name: 도서관
  description: >-
    이 건물에는 탈로스의 잃어버린 지식을 회복하기 위해 임명된 위원회가 가져온 방대한 책과 문서들이 보관되어 있다. 벽을 따라 책장이 줄지어 서 있고, 그 안에는 상태가 제각각인
    책들이 꽂혀 있다. 공기에는 오래된 양피지와 풀 냄새가 배어 있다.

tba:55:room:5552:
  name: 무도회장
  description: >-
    당신은 거대한 파티를 놓친 것 같다. 청소부들이 색종이 조각과 음식 찌꺼기를 치우고 있다. 무대 주변 테이블에 놓인 빈 맥주잔 수백 개는 시민들이 술을 얼마나 사랑하는지 보여
    준다. 벽에는 여전히 현수막이 걸려 있다.

tba:55:room:5553:
  name: 감옥
  description: 당신은 감옥에 있다. 무슨 이유인지는 모르겠지만, 누군가는 당신이 아주 큰 잘못을 저질렀다고 여기고 한동안 안전하게 격리해야 한다고 생각하는 모양이다.

tba:55:room:5554:
  name: 시청
  description: >-
    당신은 도시의 행정 중심지 안쪽에 서 있다. 여기서 도시 정책에 관한 결정이 내려진다. 술탄의 말씀이 곧 법이지만, 그는 보통 성벽 밖의 사정에 시간을 보내는 편이다.

tba:55:room:5555:
  name: 궁수/활장 길드
  description: >-
    이 방의 벽에는 다양한 종류의 활을 걸어둘 수 있는 못들이 빼곡히 박혀 있다. 여기서 일하는 사람은 몇 명 되지 않아, 일반 대중 사이에서 이런 기술은 드물다는 사실을 방증한다.
    구석에서는 몇 명의 소년이 화살을 만들 때 사용하는 정교한 화살대용 깃털을 준비하느라 분주하다. 몇몇 엘프 장인들은 완성된 활 하나하나를 신중하게 검수하고 있다.

tba:55:room:5556:
  name: 석공 길드
  description: >-
    여기 있는 드워프들이 무엇을 하는지 잘 알고 있다는 것은 의심의 여지가 없다. 그들은 이 아름다운 도시를 건설하는 데 없어서는 안 될 존재였다. 여기서는 그들이 가장 잘하는 일에
    몰두해 열심히 일하고 있다. 재능 있는 장인들은 망치를 눈부시게 휘두르며 돌을 화려한 벽돌, 기둥, 장식물, 그리고 수많은 다른 형태로 다듬어 내고 있다.

tba:55:room:5557:
  name: 근위대 본부
  description: >-
    당신은 두 개의 주요 근위대 본부 중 남쪽에 있는 곳 안에 서 있다. 석재로 된 내부는 검소해 보이며, 최소한의 필수품만 갖추어져 있다. 필요할 경우를 대비해 몇몇 무기가 벽에
    걸려 있다.

tba:55:room:5558:
  name: 궁전 정문
  description: >-
    당신은 단단한 금으로 정교하게 만들어진 웅장한 문 앞에 서 있다. 문 너머로 솟아오르는 나선형 탑들의 화려함에 입을 벌리고 경탄한다. 동쪽 땅 전체의 통치자는 이 훌륭한 궁전에
    거주하며, 그는 가난한 사람이 아니다. 웅장한 입구는 이 문을 지나 있으며, 동쪽으로는 술탄의 길이 있다.

tba:55:room:5559:
  name: 북서쪽 망루
  description: >-
    당신은 도시를 지키는 네 개의 망루 중 하나 위에 서 있다. 여기서 내려다보는 경치는 훌륭하다! 서쪽으로는 이곳과 미드가르드를 가르는 높은 산맥이 보인다. 이슈타르 강은 그쪽에서
    천천히 흘러온다. 남쪽으로는 뉴탈로스 도시 전체와 그 너머의 동쪽 대사막이 한눈에 들어온다.

tba:55:room:5560:
  name: 근위대 본부
  description:
  - >-
    당신은 두 개의 주요 경비대 본부 중 북쪽에 있는 곳 안에 서 있다. 무장한 경비대원들이 여기 앉아 카드놀이를 하고 있다. 돌로 된 내부는 깨끗하지만, 벽에 걸린 무기와 갑옷을
    제외하면 텅 비어 있다.
  - 출구는 남쪽 하나뿐이다.

tba:55:room:5561:
  name: 주방
  description:
  - >-
    당신의 발소리가 부엌의 돌 바닥 타일 위로 울려 퍼진다. 남쪽 벽에는 큰 벽난로와 거대한 구리 냄비가 보이며, 그 안의 국물이 신나게 끓어오르고 있다. 요리사는Tonight의
    식사를 위해 나무 테이블에서 채소와 다른 야채를 바쁘게 썰고 있다. 하인들은 부엌 도구를 집어 들고 신선한 토끼를 손질하러 바쁘게 뛰어다닌다.
  - 작은 문 하나가 북쪽으로 홀로 나 있고, 식당으로 통하는 문은 서쪽에 있다.

tba:55:room:5562:
  name: 북동쪽 망루
  description: 당신은 도시를 지키는 네 개의 망루 중 하나 위에 서 있다. 북쪽으로는 넓은 평원과 그 너머의 숲이 보인다. 남쪽으로는 도시와 그 너머의 동쪽 대사막이 보인다.

tba:55:room:5563:
  name: 회랑
  description: 당신은 남쪽 복도의 동쪽 끝에 있다. 작은 하인용 입구가 부엌으로 이어지며, 복도는 서쪽으로 계속된다.

tba:55:room:5564:
  name: 속피조합
  description: >-
    이 기이한 곳에 발을 들이자마자 먼저 느껴지는 것은 갓 무두질한 가죽 제품에서 풍기는 진한 냄새다. 그다음 당신의 시선을 사로잡는 것은, 이 사람들이 아름다운 가죽을 얼마나 다채로운
    색으로 변형시켰는지를 보여주는 무지갯빛이다. 사람들은 가죽을 늘리고 필요한 모양으로 자르고 있다. 벽에 작은 쪽지 하나가 붙어 있는 것을 발견한다.
  extras:
  - text:
    - '쪽지에는 이렇게 적혀 있는 것 같다:'
    - 속피공이 되는 것을 증오한다

tba:55:room:5565:
  name: 회랑
  description: 당신은 북쪽 복도의 동쪽 끝에 왔다. 북쪽의 단순한 나무 문 외에 유일한 출구는 서쪽이다. 문 위에는 금색 현판이 달려 있다.
  extras:
  - text:
    - '현판에는 다음과 같은 글자가 새겨져 있다:'
    - 알라의 신성한 신전

tba:55:room:5566:
  name: 알라의 신전
  description: >-
    이 방으로 발을 들여놓는 순간, 당신은 물질계를 떠나는 듯한 느낌을 받는다. 여기 벽은 아름다운 다채로운 타일로 장식되어 있다. 공기에는 이상한 고요함이 감돈다. 전능한 존재의
    기운을 감지할 수 있다.

tba:55:room:5567:
  name: 뉴탈로스 북문 밖
  description: 당신은 뉴탈로스 성문 밖에 서 있다. 남쪽에는 도시가, 북쪽에는 황야가 펼쳐져 있다.

tba:55:room:5568:
  name: 뉴탈로스 동문 밖
  description: 당신은 도시의 방어벽 밖에 서 있다. 거대한 철제 성문은 서쪽에 있고, 동쪽으로는 미지의 세계가 당신을 기다리고 있다.

tba:55:room:5569:
  name: 뉴탈로스 서문 밖
  description: 당신은 성벽 밖에 서 있으며, 철제 성문은 동쪽에 있다. 그 방향에 도시가 있고, 미드가르드로 가는 길은 서쪽에 있다.

tba:55:room:5570:
  name: 성벽 밖
  description: 당신은 도시 동쪽 성벽 바깥의 작은 빈터에 있다. 바닥은 많이 밟혀 보이지만, 북쪽 출구 외에 다른 뚜렷한 출구는 보이지 않는다.

tba:55:room:5571:
  name: 대연회장
  description:
  - >-
    은식기, 접시, 그리고 금박 장식이 된 테이블보로 덮인 긴 참나무 식탁이 방을 가득 채우고 있다. 아직 식사하는 사람은 없지만, 하인들은 식탁을 차리고 양념통을 놓느라 바쁘게
    뛰어다닌다.
  - 주방 입구는 동쪽에 있고, 북쪽으로는 복도로 통하는 거대한 이중 문이 열려 있다.

tba:55:room:5572:
  name: 회랑
  description: 당신은 긴 복도의 T자형 갈림길에 서 있다. 남쪽으로는 거대한 이중 문이 두 개 있다.

tba:55:room:5573:
  name: 회랑
  description: 당신은 복도의 교차로에 서 있다. 서쪽을 제외한 모든 방향으로 나무 복도가 이어지며, 서쪽으로는 궁전의 정원으로 들어갈 수 있다.

tba:55:room:5574:
  name: 회랑
  description: 당신은 복도의 T자형 갈림길에 도착했다. 나무 복도는 동쪽, 서쪽, 남쪽으로 이어진다. 북쪽에는 거대한 철문이 하나 있다.

tba:55:room:5575:
  name: 지옥문
  description:
  - 당신은 차갑고 습한 방에 들어선다. 벽은 거칠게 다듬은 맨돌로 되어 있다. 궁전의 나머지 부분의 화려함과 비교하면 이 방은 매우 이질적으로 느껴진다.
  - 거대한 강철 격자창이 어둠 속으로 내려가 있고, 철문은 복도로 돌아가게 한다.

tba:55:room:5576:
  name: 손님 방
  description: >-
    귀족들이 방문할 때 사용하는 단순한 방이다. 동쪽 벽에 작은 장롱이 서 있고, 바로 위에는 거울이 걸려 있다. 남쪽 벽 아래 창문 아래, 방 한가운데에는 사틴 시트로 치장된 퀸사이즈
    침대가 놓여 있다. 눈에 띄는 출구는 북쪽 복도로 나가는 곳뿐이다.
  extras:
  - text: 무기를 든 갑옷을 입은 인간형 존재의 전투 모습이 보인다.
  - text: 이 창문 밖을 내다보면 궁전 건물과 궁전 담장 사이를 구분하는 궁전 마당이 보인다.

tba:55:room:5577:
  name: 회랑
  description: 긴 복도가 여기까지 이어지며 남쪽 벽에 나무 문이 하나 나 있다. 북쪽 벽에는 한때 이 땅을 다스렸던, 지금은 잊혀진 귀족의 초상이 걸려 있다.

tba:55:room:5578:
  name: 술탄의 정원
  description:
  - >-
    당신은 술탄의 사적 정원에 들어섰다. 이곳의 습기 때문에 피부에 얇은 땀이 배어 나온다. 사방에는 이국적인 식물과 꽃이 수천 가지나 피어 있다. 자스민과 honeysuckle의
    달콤한 향기가 고향에서의 행복한 날들을 떠올리게 한다. 북쪽, 야자수 사이로 섬세한 흰색 정자가 보인다.
  - 복도로 나가는 길과 정자로 향하는 서쪽 길이 있다. 오른쪽에는 금색 표지판이 서 있다.

tba:55:room:5579:
  name: 회랑
  description: >-
    긴 복도가 여기서 동서로 이어진다. 중앙을 따라 깔린 작은 붉은 카펫은 항상 발밑에 깔려 있고, 벽을 따라 간간히 벤치나 화분이 놓여 있다. 북쪽에는 문이 하나 나 있고, 그
    위에는 명판이 달려 있다.
  extras:
  - text:
    - '문에 달린 명판에는 이렇게 적혀 있다:'
    - 뉴탈로스
    - 의
    - 미술 전시회
    - '- 관리 측에서는 분실물에 대해 책임을 지지 않습니다.'

tba:55:room:5580:
  name: 미술 전시실
  description:
  - >-
    당신은 술탄이 고상한 미덕에 바치는 공간에 서 있다. 벽에는 자연 풍경, 누드, 그리고 전투에서의 영광스러운 승리를 그린 대형 그림들이 걸려 있다. 방의 네 모서리에는 기이한
    조각상이 받침대 위에 놓여 있고, 거울은 관람객이 조각상을 한눈에 온전히 볼 수 있도록 전략적인 위치에 배치되어 있다.
  - 그러나 당신의 시선은 벽 너머를 지배하는 한 폭의 그림으로 끌려간다.
  extras:
  - text: 서쪽 벽에 걸린 대형 그림은 뉴탈로스의 신전을 묘사한 것으로 보인다. 이 그림은 이 방의 서쪽 벽면을 가득 채우고 있다.

tba:55:room:5581:
  name: 손님 방
  description: >-
    여기 또한 귀족들이 방문할 때 쓰이는 방이다. 동쪽 벽에 화장대가 놓여 있고 그 위에는 거울이 걸려 있으며, 남쪽 벽에는 새틴 시트가 깔린 퀸 사이즈 침대가 놓여 있다.

tba:55:room:5582:
  name: 회랑
  description: 당신은 남쪽 복도의 서쪽 끝까지 왔다. 남쪽과 서쪽 벽의 문을 제외하면 동쪽이 유일한 출구다.

tba:55:room:5583:
  name: 정원 정자
  description: 정원을 거닐다 작은 하얀 목조 건물을 마주친다. 새소리, 꽃향기, 아아, 천국이 따로 없다. 당신은 이보다 평화로운 곳은 본 적이 없다고 생각한다.

tba:55:room:5584:
  name: 회랑
  description: 여기는 북쪽 복도의 서쪽 끝이다. 벽에 문이 두 개 나 있는데, 하나는 북쪽으로, 또 하나는 서쪽으로 통한다.

tba:55:room:5585:
  name: 경비실
  description:
  - 당신은 이불과 장롱만 줄지어 놓인 텅 빈 방에 서 있다. 경비병들은 퇴근 후 이곳에서 잠을 자는데, 특별한 허락 없이는 궁전 경내를 벗어날 수 없기 때문이다.
  - 출구는 남쪽뿐이다.

tba:55:room:5586:
  name: 경비실
  description: >-
    여기는 궁전 경비병들의 숙소이다. 궁전 다른 곳과 비교하면 매우 허름하여, 여기서는 이불과 장롱만 보인다. 벽에는 술탄의 경비병에 자랑스러운 이름을 남긴 유명한 기사들의 초상이
    걸려 있다.

tba:55:room:5587:
  name: 하렘
  description: >-
    여기는 술탄이 궁전의 아름다운 여인들을 거느리는 방이다. 실크로 된 거의 투명할 것 같은 옷을 입은 열 명의 소녀들이 방 여기저기에 누워 있다. 방의 서쪽 끝에는 커다란 베개
    더미가 쌓여 있고, 그 위에 아름다운 젊은 처녀가 앉아 있다. 당신에게 불행한 것은, 이 방에 들어갈 수 있는 사람은 술탄뿐이라는 점이다.

tba:55:room:5588:
  name: 작은 방
  description: 이 비밀 방은 술탄이 원할 때 언제든 하렘에 직접 들어갈 수 있게 해 주는 통로이다.

tba:55:room:5589:
  name: 태좌실
  description: >-
    당신은 뉴탈로스의 위대한 술탄의 태좌실에 서 있다. 경비병들이 술탄의 곁에서 경례 자세로 서서, 사랑하는 지도자를 위해 최후의 희생에 나설 준비를 하고 있다. 보석으로 장식된
    금박 태좌는 대리석 단 위에 놓여 있다. 술탄은 함부로 대할 수 있는 사람이 아니다.

tba:55:room:5590:
  name: 보물창고
  description: >-
    당신은 어떻게든 술탄의 보물창고에 들어와 버렸다. 배경에서 울리는 경보 소리가 당신이 일종의 경보 시스템을 건드렸다는 것을 알려 준다. 최대한 많은 것을 집어 들고 문으로 도망치는
    것이 현명할 것이다.

tba:55:room:5591:
  name: 감시인의 방
  description: >-
    낡은 나무 사다리를 타고 내려가면 작은 동굴 같은 방에 들어선다. 한쪽 구석에는 오래된 잡지가 놓인 작은 벤치와 불꽃이 작게 타오르는 촛대가 놓여 있다. 북쪽 벽의 돌 틈에 문이
    하나 나 있고, 위쪽으로는 철제 격자가 열려 있다.

tba:55:room:5592:
  name: 지하 감옥의 터널
  description: 당신은 대충 다듬은 돌로 된 터널에 서 있다. 북쪽과 남쪽에는 감방이 있고, 터널은 동쪽으로 이어진다.

tba:55:room:5593:
  name: 지하 감옥의 터널
  description: 당신은 대충 다듬은 돌로 된 터널에 서 있다. 북쪽과 남쪽에는 감방이 있고, 터널은 동서로 이어진다.

tba:55:room:5594:
  name: 지하 감옥의 터널
  description: 당신은 대충 다듬은 돌로 된 터널에 서 있다. 북쪽과 남쪽에는 감방이 있고, 터널은 동서로 이어진다.

tba:55:room:5595:
  name: 지하 감옥의 터널
  description: 당신은 북쪽과 남쪽에 감방이 있는 거칠게 다듬은 돌 터널에 서 있다. 터널은 서쪽으로 이어지며, 동쪽 돌벽에 작은 균열이 하나 있는 것을 발견한다.

tba:55:room:5596:
  name: 비밀 감방
  description: >-
    이 방은 감방이라기보다는 더 보금자리 같다. 바닥 여기저기에 출처를 알 수 없는 뼈가 널려 있고, 그 위에 작은 짚 조각들이 흩어져 있다. 한 구석에는 튀어 붙은 피와 회색 머리카락
    뭉치가 엉켜 있다. 떠나려 몸을 돌리던 순간, 어둠 속에서 작은 붉은 눈 한 쌍이 당신을 응시하고 있는 것을 발견한다.

tba:55:room:5597:
  name: 감방
  description: 당신은 출구가 하나뿐인 차갑고 좁은 방 안에 있다.

tba:55:room:5598:
  name: 감방
  description: 당신은 출구가 하나뿐인 차갑고 좁은 방 안에 있다.

tba:55:room:5599:
  name: 감방
  description: 당신은 출구가 하나뿐인 차갑고 좁은 방 안에 있다.
