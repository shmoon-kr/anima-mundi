tba:56:room:5667:
  name: 검은 강 위
  description: 강은 여기서 서쪽으로 산의 심장부로, 동쪽으로는 다시 구릉지대로 흐른다.

tba:56:room:5668:
  name: 검은 강 위
  description: 강이 통로를 조용히 흐르는 가운데, 당신 앞의 모습이 거의 보이지 않는다.

tba:56:room:5669:
  name: 검은 강 위
  description: 강은 서쪽으로, 산의 심장부를 향해 느리게 흐른다. 북쪽 통로 벽에는 작은 균열이 있어, 그곳을 통해 물 밖으로 올라갈 수 있을지도 모른다.

tba:56:room:5670:
  name: 검은 강 위
  description: 여기서 강은 동서로 이어지며, 물 수위보다 훨씬 높은 어두운 절벽의 남쪽을 따라 흐른다.

tba:56:room:5671:
  name: 검은 강 위
  description: 강은 산 속으로 더 깊이 들어갈수록 좁아지는 통로 구간의 남쪽으로 흐른다.

tba:56:room:5672:
  name: 작은 절벽 위
  description: >-
    당신은 물 밖으로 기어 올라와 이 좁은 절벽에 올라, 산 속으로 더 깊이 이어지는지 확인해 본다. 불행히도 이 절벽은 잠시 쉬어가기에는 너비가 충분하지만, 지하 강으로 다시 합류하는
    것 외에는 다른 출구가 보이지 않는다.

tba:56:room:5681:
  name: 평원 위
  description: >-
    당신은 사방으로 펼쳐진 넓은 초원 위에 서 있다. 남쪽에는 뉴탈로스의 위엄 있는 북부 성문이 솟아 있다. 동쪽과 서쪽으로는 풀밭이 계속 이어지고, 북쪽 멀리에는 나무 줄기가 보인다.

tba:56:room:5682:
  name: 평원 위
  description: 당신은 넓은 풀밭 위에 서 있다. 북쪽의 숲은 가까워졌지만 여전히 상당한 거리가 있다. 남쪽으로는 뉴탈로스 방향으로 이어지는 작은 흙길이 땅에 새겨져 있다.

tba:56:room:5683:
  name: 숲의 가장자리
  description: 당신은 거대한 숲의 가장자리에 서 있다. 나무 줄기는 동쪽과 서쪽으로 시야가 닿는 한계까지 이어진다. 남쪽으로는 넓은 풀밭이 펼쳐져 있다.

tba:56:room:5684:
  name: 이슈타르 강
  description: >-
    이곳에서는 강이 더 넓어지고 물이 탁해진다. 동쪽에서 짠 물 냄새가 당신에게까지 전해진다. 용의 바다가 멀지 않은 것 같다. 동쪽으로는 도시의 희미한 윤곽이 보이고, 북쪽으로는
    넓은 초원이 펼쳐져 있다.

tba:56:room:5685:
  name: 하구
  description: >-
    여기가 바로 강이 용의 바다로 흘러드는 곳이다. 물살이 거세게 밀려들어가며 모래를 많이 휘어올렸고, 강물이 합류하는 부분은 파란 바다에 얼룩이 진 것처럼 보인다. 서쪽을 바라보면
    끝이 보이지 않을 정도로 물만 가득하다. 북쪽에는 조금만 노력하면 닿을 수 있을 것 같은 작은 선착장이 보인다. 강은 서쪽으로 뻗어 뉴탈로스 쪽으로 이어진다.

tba:56:room:5686:
  name: 용의 바다
  description: 당신은 용의 바다의 맑고 푸른 바다 위에 있다. 시야가 닿는 한계까지 모든 방향으로 물이 펼쳐져 있다. 멀리 북쪽 어딘가에 작은 선착장이 하나 보이는 것 같다.

tba:56:room:5687:
  name: 용의 바다
  description: 용의 바다가 여기 해안선을 따라 밀려들어온다. 짙은 푸른 물결이 밀려와 해변을 때리고 있다. 북쪽을 보면 파도 속으로 뻗어 나온 작은 선착장이 보인다.

tba:56:room:5688:
  name: 용의 바다
  description: 당신은 용의 바다의 맑고 푸른 바다 위에 있다. 시야가 닿는 한계까지 모든 방향으로 물이 펼쳐져 있다. 멀리 서쪽 어딘가에 작은 선착장이 하나 보이는 것 같다.

tba:56:room:5689:
  name: 용의 바다
  description: 당신은 용의 바다의 맑고 푸른 바다 위에 있다. 시야가 닿는 한계까지 모든 방향으로 물이 펼쳐져 있다. 멀리 서쪽 어딘가에 작은 선착장이 하나 있는 것 같다.

tba:56:room:5690:
  name: 길 위
  description: >-
    뉴탈로스의 시민들은 도시가 제공하는 서비스에 대해 큰 자부심을 느낀다. 그중 하나는 모든 도로를 정비하기 위해 많은 노력을 기울이는 건설 작업반이다. 뉴탈로스의 세금이 왕국 내
    다른 도시보다 높지만, 대부분의 돈은 시민들의 복지를 위해 사용된다.

tba:56:room:5691:
  name: 길 위
  description: >-
    당신은 아름다운 경치가 펼쳐지는, 왕래가 잦은 도로를 따라 걷고 있다. 북쪽으로는 수킬로미터에 걸쳐 이어지는 높은 소나무들이 벽을 이루고 있다. 도로와 나무 사이에는 넓은 풀밭
    평원이 펼쳐져 있다. 이쪽 남쪽, 강 너머에는 동쪽 대사막이 있다. 도로는 동쪽과 서쪽으로 이어진다.

tba:56:room:5692:
  name: 길 위
  description: 이제 동쪽으로는 미지의 땅까지 펼쳐진 용의 바다가 보인다. 길은 동쪽과 서쪽으로 이어진다. 남쪽에서는 이슈타르 강을 따라 화물을 운반하는 배들의 소리가 들린다.

tba:56:room:5693:
  name: 도로 위
  description: 이곳은 육로이다. 상인들은 이곳까지 상품을 가져와 배에 싣고 수출한다. 서쪽으로 도보로 이동하면 뉴탈로스를 지나 동쪽 산맥을 넘고 미드가르드로 내려간다.

tba:56:room:5694:
  name: 해안 근처
  description: >-
    도로는 여기서 끝나며, 해변을 따라 내려가 선착장으로 이어지는 작은 흙길로 변한다. 북쪽과 남쪽으로는 눈앞에 펼쳐진 해안선을 볼 수 있다. 이곳 서쪽으로는 저지대가 거대한 설산으로
    솟아 오른다.

tba:56:room:5695:
  name: 선착장 위
  description: >-
    당신은 서쪽 도로의 연장선 역할을 하는 단순한 나무 선착장에 서 있다. 선착장은 꽤 오래된 것 같지만 여전히 튼튼하다. 동쪽 끝에는 배에 쉽게 오르내릴 수 있도록 작은 사다리가
    설치되어 있다.

tba:56:room:5696:
  name: 용의 바다
  description: 당신은 용의 바다의 맑은 푸른 바다 위에 있다. 시야가 닿는 한계까지 모든 방향으로 물이 펼쳐져 있다. 멀리 서쪽 어딘가에 작은 선착장이 보이는 것 같다.

tba:56:room:5697:
  name: 용의 바다
  description: 바다가 사방으로 펼쳐져 잔잔하게 출렁인다. 멀리 지평선 너머로 섬 하나가 보인다. 서쪽으로는 본토가 보인다.

tba:56:room:5698:
  name: 부두 아래
  description: >-
    당신은 부두 아래를 헤엄치고 있다. 구조물을 지탱하는 네 개의 나무 기둥이 보인다. 탁한 물이 시야를 흐리게 하여 서쪽을 바라보기가 어렵지만, 그 방향으로 철제 격자가 있는 것
    같다.

tba:56:room:5699:
  name: 이키타치틀의 굴
  description: 이키타치틀이 마지막 먹이를 삼키자 피가 물속을 소용돌이친다. 당신이 식사에 끼어들자마자 거대한 전복이 빠르게 돌며 공격한다!
