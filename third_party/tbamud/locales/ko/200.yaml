tba:200:room:20000:
  name: 서부 대로 구역 설명 방

tba:200:room:20001:
  name: 서부 대로
  description: >-
    당신은 서부 대로 위에 있다. 동쪽으로는 수도의 성문이 보이고, 서쪽으로는 대로가 계속 이어진다. 자갈 깔린 오솔길 하나가 이 지루한 대로를 벗어나 북쪽으로, 조금 더 북쪽에
    있는 바위들 쪽으로 뻗어 있다.

tba:200:room:20002:
  name: 서부 대로
  description: >-
    당신은 서부 대로를 따라 계속 걷는다. 동쪽으로는 수도의 성문이 보인다. 대로는 서쪽에서 성문 쪽으로 뻗어 있다. 북쪽의 소나무와 작은 묘목으로 이루어진 성긴 숲은 평온해 보인다.

tba:200:room:20003:
  name: 서부 대로
  description: >-
    당신은 서부 대로를 따라 걷다가 남쪽으로 갈라져 나가는 작은 오솔길을 발견한다. 대로는 동쪽과 서쪽으로 계속 이어진다. 북쪽의 숲은 조금 성기어져 들어갈 수 있을 것 같다.

tba:200:room:20004:
  name: 서부 대로
  description: >-
    당신은 서부 대로를 따라 계속 나아간다. 길은 동쪽으로는 수도로 되돌아가고, 서쪽으로는 황야 깊숙이 이어진다. 남쪽으로는 평원이, 북쪽으로는 울창한 숲이 펼쳐져 있다.

tba:200:room:20005:
  name: 서부 대로
  description: 서부 대로를 따라 걷다 보니, 길이 동쪽뿐 아니라 서쪽으로도 계속 이어진다. 북쪽의 숲은 평온하고 발길을 끄는 듯하지만, 너무 빽빽해 들어가기 어려울 것 같다.

tba:200:room:20006:
  name: 서부 대로
  description: 서부 대로 옆에 서 있으니, 북서쪽의 숲이 옅어지고 나무 사이로 큰 목조 건물이 보인다. 돌로 만든 굴뚝에서 연기가 피어오르고 있다.

tba:200:room:20007:
  name: 서부 대로
  description: >-
    서부 대로는 큰 목조 건물 앞을 지나간다. 건물은 방치되어 지붕널이 바닥에 널려 있고, 언제 무너질지 모를 듯한 현관이 있다. 페인트가 벗겨진 간판이 녹슨 경첩에 매달려 짜증스럽게
    삐걱거린다.
  extras:
  - text: 사이리스의 모피 교역소

tba:200:room:20008:
  name: 서부 대로
  description: 서부 대로를 따라가다 보니 대로가 서쪽과 동쪽으로 이어져 있다. 북동쪽으로는 숲 안쪽으로 조금 들어간 곳에 나무 건물이 보인다.

tba:200:room:20009:
  name: 서부 대로
  description: 서부 대로를 따라 걷다 보니, 길이 이어지는 동쪽과 서쪽, 그리고 숲이 트이며 황량한 평원이 펼쳐지는 남쪽을 빼면 사방이 나무로 둘러싸여 있다.

tba:200:room:20010:
  name: 서부 대로
  description: 서부 대로를 계속 따라가다 보니 남쪽으로 갈라지는 길이 보이고, 대로는 동쪽과 서쪽으로 이어진다. 그 길은 평원을 가로질러 남쪽으로 뻗어 있다.

tba:200:room:20011:
  name: 서부 대로
  description: 걸어가다 보니 북서쪽으로 나무가 듬성듬성해져 숲으로 들어갈 수 있다. 남쪽의 평원은 황량해 보인다. 대로는 서쪽과 동쪽으로 이어진다.

tba:200:room:20012:
  name: 서부 대로
  description: >-
    대로는 북쪽으로 갈라져 작은 흙길로 이어진다. 이 길은 숲 안으로 곧장 뻗어 나갔다가, 나무 사이를 조금 더 지나면 굽어지는 지점에서 사라진다. 더 많이 다닌 서부 대로는 동서
    방향으로 계속 이어진다.

tba:200:room:20013:
  name: 서부 대로
  description: >-
    대로는 단단하게 다져진 흙길이라 이동이 매우 쉽다. 남쪽 평원 너머에서 따뜻한 바람이 불어와, 연기가 살짝 섞인 냄새를 실어 온다. 문명이 가까운 모양이다. 북쪽으로는 울창한
    숲이 시야를 가린다.

tba:200:room:20014:
  name: 서부 대로
  description: >-
    서부 대로를 따라가다 보니 멀리 남서쪽에 마을이 보인다. 북쪽으로는 빽빽한 소나무 숲이 짙은 그늘에 잠겨 있고, 남쪽으로는 언덕 몇 개가 드문드문 솟은 탁 트인 평원이 펼쳐져
    있다. 대로는 서쪽과 동쪽으로 계속 이어진다.

tba:200:room:20015:
  name: 서부 대로
  description: >-
    서부 대로를 걷다 보니 남쪽으로 이어지는 작은 오솔길이 보인다. 이 길은 사람들이 많이 다닌 듯하고, 남쪽에서 불어오는 바람에 연기 냄새가 실려 온다. 대로는 서쪽과 동쪽으로
    계속 이어진다.

tba:200:room:20016:
  name: 서부 대로
  description: 서부 대로를 따라 나아가다 보니, 멀리 남동쪽에 마을이 보인다. 대로는 동쪽과 서쪽으로 이어진다. 서쪽에서는 물이 세차게 흐르는 소리가 들린다.

tba:200:room:20017:
  name: 서부 대로
  description: >-
    서부 대로는 무너진 다리 앞에서 갑자기 끊긴다. 거센 강물이 다리 아래를 흐르며 다리 잔해를 천천히 쓸어 가고 있다. 잔해와 모래가 사방에 흩어져 있다. 강물이 넘쳐 다리를 쓸어
    간 것이 틀림없다.

tba:200:room:20018:
  name: 흙길
  description: >-
    당신은 숲을 가로지르는 작은 흙길을 따라 나아간다. 꽤 많이 다닌 흔적이 보인다. 이 길은 북쪽으로도, 그리고 서부 대로를 볼 수 있는 남쪽으로도 이어지는 듯하다. 울창한 숲이
    흙길 양옆으로 계속 이어진다.

tba:200:room:20019:
  name: 흙길
  description: >-
    작은 흙길을 따라가다 보니 양옆의 높은 나무들 때문에 멀리까지 볼 수 없다. 작은 동물 몇 마리가 발치 근처를 이리저리 뛰어다닌다. 길은 북쪽과 남쪽으로 이어진다.

tba:200:room:20020:
  name: 흙길
  description: >-
    북쪽으로 갈수록 흙길이 더 거칠어진다. 그쪽 방향으로 사람이 드나드는 흔적이 적어 보인다. 짙은 침엽수림이 점차 옅어지며 다양한 활엽수들로 바뀌어 가고 있다. 이 숲의 이쪽은
    어린 단풍나무들이 우세해 보인다.

tba:200:room:20021:
  name: 흙길
  description: >-
    흙길을 따라가다 보니 나무들이 길 쪽으로 더 가까이 자라나 당신을 둘러싸고 있다. 양옆으로 짙은 덤불이 자라기 시작했고, 길은 관리가 되지 않는 듯하다. 주변 숲이 천천히 이
    길을 삼켜가고 있다.

tba:200:room:20022:
  name: 흙길
  description: >-
    야생동물 소리가 숲을 가득 채운다. 새와 다람쥐, 그리고 모습을 드러내지 않는 다른 동물들이 보일 듯 말 듯한 곳에 머물러 있다. 여행자에게 익숙하지 않은지 몹시 경계하는 눈치다.
    북쪽으로 갈수록 나무가 점점 듬성듬성해진다.

tba:200:room:20023:
  name: 흙길
  description: 흙길은 무성한 덤불과 어린 나무 사이에서 거의 사라져 버렸다. 길은 주변의 무성한 덤불과 거의 구별되지 않는다. 숲의 냄새가 매우 강하다.

tba:200:room:20024:
  name: 흙길
  description: 흙길이 넓어지며 숲과 덤불을 밀어내는 듯하다. 길은 굵은 나무와 덤불의 기둥 사이로 북쪽과 남쪽으로 이어진다.

tba:200:room:20025:
  name: 흙길
  description: >-
    쓰러진 나무 몇 그루가 북쪽 길을 막고 있다. 마치 길을 막으려는 듯 베어 넘어진 모양이다. 신선한 소나무 냄새가 나니 최근에 베어졌을 것이다. 북쪽 덤불과 나무 사이로 희미하게
    문과 성벽 같은 것이 보인다.

tba:200:room:20026:
  name: 흙길
  description: 작은 흙길을 따라 나아가면 북쪽으로는 서부 대로를, 남쪽으로는 이어지는 흙길을 볼 수 있다. 남쪽으로 갈수록 도로 주변의 숲은 줄고 평원으로 변한다.

tba:200:room:20027:
  name: 흙길
  description: >-
    흙길을 따라가다 보니 길이 서쪽과 북쪽으로 이어진다. 길 양옆에는 키가 큰 야생 풀과 잡초, 그 밖의 작은 덤불이 자라 있다. 들판의 풀은 허리 높이까지 자라 있어 몸을 숨기기에는
    제격이다. 풀이 바람에 살랑살랑 흔들린다.

tba:200:room:20028:
  name: 흙길
  description: >-
    흙길을 걷다 보니 작은 동물 몇 마리가 이리저리 뛰어다니는 것을 볼 수 있다. 길은 남쪽과 동쪽으로 이어진다. 여기서 길은 급하게 꺾여 동남쪽의 거대한 바위 더리를 돌아간다.
    바위 더리 한가운데에는 돌벽의 잔해가 남아 있다. 한때 땅주인들 사이의 경계를 표시하는 데 쓰였을 것이다. 하지만 이제 이 평원에서 농사를 짓는 사람은 없는 듯하다.

tba:200:room:20029:
  name: 흙길
  description: >-
    당신이 걷고 있는 흙길은 남쪽과 북쪽으로 이어진다. 평원은 풀이 무성하게 자라 있어 경작해야 할 것인데, 특히 수도에 이렇게 가까운 곳이라 더욱 그러하다. 하지만 대신 텅 비어
    버려진 모습이다. 먼 서쪽에서 피어오르는 연기 한 줄기 외에는 여행이나 문명의 흔적을 거의 찾아볼 수 없다.

tba:200:room:20030:
  name: 흙길
  description: >-
    길을 계속 따라가다 보니 길은 북쪽으로도, 남쪽으로도 이어져 있다. 풀이 무성한 평원이 바람에 나긋이 흔들린다. 가끔 당신이 다가가면 어떤 짐승이 놀라 달아나는지 풀이 바스락거린다.

tba:200:room:20031:
  name: 흙길
  description: >-
    길을 따라 나아가다 보니 여기저기서 풀과 나뭇잎이 길 위로 자라 덮고 있는 것이 보인다. 이 길은 자주 쓰이지 않는 것 같다는 생각이 든다. 길은 북쪽과 남쪽으로 이어진다.

tba:200:room:20032:
  name: 흙길
  description: >-
    더 깊이 들어갈수록 길 여기저기에 작은 꽃들이 피어 있는 것이 보인다. 길은 북쪽과 남쪽으로 이어진다. 북쪽으로는 바람에 흔들리는 풀밭이 펼쳐져 멀리 숲까지 이어진다. 남쪽으로는
    평원이 끝나고 성긴 숲이 시작된다.

tba:200:room:20033:
  name: 흙길
  description: >-
    길을 따라가다 보니 길이 동쪽과 북쪽으로 이어진다. 길은 남쪽의 크고 가파른 언덕을 휘감아 돈다. 언덕은 어딘가 인공적으로 보이며, 이 주변 풍경과 어울리지 않는다.

tba:200:room:20034:
  name: 흙길
  description: >-
    흙길을 따라 나아간다. 길은 서쪽과 남쪽으로 이어지는 것 같다. 풀과 이끼로 덮인 가파른 언덕 옆에 서 있다. 언덕이 당신 위로 너무 가파르게 솟아 올라, 올라갈 수 있을지 의문이다.

tba:200:room:20035:
  name: 흙길
  description: >-
    작은 흙길을 따라가다 보니 길이 북쪽과 남쪽으로 이어진다. 바로 서쪽에는 큰 언덕이 위압적으로 솟아 있다. 이 주변에 있는 완만한 언덕들이 모두 작은데, 참 이상하다.

tba:200:room:20036:
  name: 흙길
  description: 이곳은 덤불이 조금 더 무성하지만 그래도 지나갈 만하다. 길가의 작은 덤불 몇 군데에 조그만 동물들이 숨어 있는 듯하다. 길은 북쪽과 남쪽으로 이어진다.

tba:200:room:20037:
  name: 흙길
  description: >-
    흙길을 따라가다 보니 길이 북쪽과 남쪽으로 이어진다. 덤불 사이로 작은 나무들이 자라고 있으며, 남쪽으로 갈수록 더욱 빽빽해 보인다. 북쪽으로는 길이 평원으로 열려 있다.

tba:200:room:20038:
  name: 흙길
  description: >-
    당신은 흙길을 따라 걷는다. 길이 북쪽으로 이어지는 것을 알 수 있다. 길은 서쪽으로 꺾여 울창한 숲속으로 들어간다. 이 지역에는 야생동물이 없는 것 같아, 숲은 이상할 정도로
    고요하다.

tba:200:room:20039:
  name: 좁은 오솔길
  description: >-
    당신은 서부 대로에서 갈라져 나온, 사람들이 많이 다닌 길을 따라 걷고 있다. 멀리 남서쪽 어딘가에서 작은 마을의 굴뚝에서 피어오르는 듯한 가느다란 연기 줄기가 몇 가닥 보이고,
    북쪽으로는 분주한 서부 대로가 보인다.

tba:200:room:20040:
  name: 사이리스의 교역소
  description: >-
    건물은 먼지로 뒤덮여 있고, 모든 것이 동물 기름으로 미끈거린다. 가죽을 무두질하고 말리면서 나는 끔찍한 악취가 코를 찌른다. 벽과 서까래에는 모피와 여러 종류의 옷이 걸려 있다.
    계산대 뒤의 남자가 씩 웃는다.

tba:200:mob:20000:
  short: 길 잃은 모험가
  long: 누더기 옷을 걸친 지저분한 여자가 어슬렁거리며 지나간다.
  description: >-
    그녀는 한때 좋은 시절도 있었겠지만 지금은 영 말이 아닌 모습이다. 며칠 동안 씻지도 먹지도 못한 것 같다. 그녀가 보이기 한참 전부터, 그리고 지나간 뒤에도 한참 동안 냄새가
    난다. 그녀는 정처 없이 절뚝거리며 걷는다.

tba:200:mob:20001:
  short: 토끼
  long: 귀여운 털북숭이 토끼가 여기서 깡충깡충 뛰어다닌다.
  description: 커다란 털이 풍성한 꼬리를 가진, 크고 하얗고 털이 많은 토끼.

tba:200:mob:20002:
  short: 새끼 사슴
  long: 작은 새끼 사슴 한 마리가 여기 서 있다.
  description: 귀엽고 작은 새끼 사슴이다. 완전히 길을 잃은 듯하다. 아마 어미를 잃어버렸나 보다.

tba:200:mob:20003:
  short: 새끼 곰
  long: 새끼 곰이 불쑥 들어온 당신을 경계하며 바라본다.
  description: 작고 검은 새끼 곰이다. 어미가 근처에 없기를 바라는 게 좋을 것이다.

tba:200:mob:20004:
  short: 선교사
  long: 떠돌이 선교사가 설교를 들어줄 사람을 찾고 있다.
  description: 선교사는 다소 초췌해 보이며, 꽤 오랫동안 떠돌아다닌 티가 난다. 따뜻한 식사 한 끼면 기운을 좀 차릴 수 있을 것 같다.

tba:200:mob:20005:
  short: 나무꾼
  long: 머리가 희끗희끗한 노인이 당당하게 쿵쿵거리며 지나간다.
  description: 이 남자는 인생의 대부분을 황야에서 살아왔다. 자기의 영역에서는 그를 놀라게 하거나 위협할 것이 거의 없다.

tba:200:mob:20006:
  short: 화가 난 검은 곰
  long: 당신이 다가가자 거대한 검은 곰이 덤불을 요란하게 헤치며 뛰쳐나온다.
  description: >-
    이 거대한 짐승을 덮은 두꺼운 검은 털가죽은, 잡아서 모피 상인을 찾아가기만 하면 좋은 값을 받을 수 있다. 안타깝게도 곰은 쉽게 잡히는 짐승이 아니다. 궁지에 몰리거나 새끼를
    지킬 때면 사나워지는 것으로도 알려져 있다.

tba:200:mob:20007:
  short: 사이리스, 모피 상인
  long: 머리부터 발끝까지 털가죽을 두른 노인이 그 가죽들을 자랑하듯 내보이며 흥정을 시작한다.
  description: >-
    이 노인은 이가 다 빠진 입으로 히죽 웃으며 당신을 바라보더니 곧바로 흥정을 걸어온다. 그는 이 땅에서 가장 좋은 모피를 판다고 맹세하며, 다른 어디에서도 이보다 싼 값에 살
    수는 없을 거라고 장담한다.

tba:200:mob:20008:
  short: 덫사냥꾼 탈바스
  long: 낡은 낚싯대를 들고 놓아 둔 덫(들)을 돌보는 노인이 지나간다.
  description: 황야에서 하루 종일 고생한 티가 역력하다. 교역소로 가져다 팔 수 있는 사냥감을 놓아 둔 덫(들)에서 찾고 있다.

tba:200:mob:20009:
  short: 붉은 여우
  long: 붉은 여우가 당신과 안전한 거리를 유지하려 하며 가볍게 뛰어간다.
  description: >-
    꼬리 끝이 하얀 적갈색의 교활한 작은 짐승이다. 여우는 꾀/교활함과 지능으로 유명하다. 평소에는 온순하고 경계심이 강하지만, 먹이가 부족해지면 근처 농장을 습격하기도 한다.

tba:200:mob:20010:
  short: 미치광이 자론
  long: 광기 어린 눈빛의 노인이 눈을 가늘게 뜨고 당신을 올려다보더니 횡설수설 떠들어 대기 시작한다.
  description: >-
    이 남자에 대한 이야기를 전에 들어 본 적이 있다. 자론은 한때 잘 알려진 시민이었다. 하지만 무언가 끔찍한 일을 목격한 뒤로 미쳐 버렸다. 그는 이제 황야를 떠돌며 도저히 찾을
    수 없는 무언가를 찾고 있다. 당신은 갑자기 그가 알몸이며, 온몸에 흙, 흙바닥과 더러움으로만 덮여 있다는 사실을 깨닫는다.

tba:200:mob:20011:
  short: 흠뻑 젖은 선장
  long: 흠뻑 젖은 선장이 여기에서 몸을 말리고 있다.
  description: >-
    한때 강을 따라 내려가던 바지선의 선장이었다. 그의 배는 바위에 걸려 부서진 듯하고, 그는 간신히 헤엄쳐 목숨을 건졌다. 그렇게 강물을 이겨 냈다면 그는 틀림없이 힘이 무척 세고
    헤엄도 아주 잘 칠 것이다.

tba:200:obj:20000:
  short: 강
  long: 범람한 강에서 넘쳐 흐른 물이 당신의 발치에서 멈춰 있다.
  extras:
  - text: 강기슭을 따라 잔해가 어지럽게 마구 뒤엉켜 있는 것으로 보아, 얼마 전 사나운 급류가 휩쓸고 지나간 것이 틀림없다.

tba:200:obj:20001:
  short: 다리
  long: 무너진 다리에서 나온 날카로운 파편들이 젖은 땅 위에 널려 있다.
  extras:
  - text: >-
      또다시 문화 유산이 대자연의 파괴적인 힘 앞에 쓰러졌다. 가장 밝은 낮부터 가장 어두운 밤까지, 수백 년 동안 온갖 풍파를 견뎌 온 다리가 마침내 굴복하여 이제는 부서진 조각들만
      남았다. 땔감으로 쓰기에도 겨우 될까 말까 하다.

tba:200:obj:20002:
  short: 쓰러진 소나무
  long: 쓰러진 소나무 통나무들이 돌아갈 길을 가로막고 있다.
  extras:
  - text: 쓰러진 거대한 소나무 통나무들 때문에 지나가기가 어렵다. 밑동은 나무꾼이나 비버가 베어 낸 것처럼 보인다. 이 일대에 비버는 많지 않을 텐데...

tba:200:obj:20003:
  short: 통황동 십자가
  long: 반짝이는 황동 십자가가 여기 놓여 있다.
  extras:
  - text: 이 황동 십자가는 손바닥에 딱 들어맞는다.

tba:200:obj:20004:
  short: 무거운 흰색 로브 한 벌
  long: 매우 두꺼운 양모 소재로 만든 하얀 로브가 여기 흠뻑 젖은 진흙 속에 놓여 있다.
  extras:
  - text: 이 멋진 흰색 로브는 거친 천으로 만들어졌다. 만든 사람이 매우 서둘러 대충 지은 것처럼 보인다.

tba:200:obj:20005:
  short: 작은 표지판
  long: 짧고 썩은 장대에 달린 채 땅에 박혀 있다. 작은 표지판이 여기 있다.
  extras:
  - text: 표지판은 썩어 부서져 가고 있다. 한때 쓰여 있던 글자를 더 이상 읽을 수 없다.

tba:200:obj:20006:
  short: 나무꾼의 도끼
  long: 급조한 도끼가 여기 놓여 있다. 당신보다 더 험한 삶을 살아온 것처럼 보인다!
  extras:
  - text: 도끼는 투박하지만 잘 만들어졌다. 나무를 베는 것만큼이나 손쉽게 팔다리 하나쯤은 잘라낼 수 있을 것 같다.

tba:200:obj:20007:
  short: 토끼 발
  long: 잘린 토끼 발이 여기 놓여 있다. 더 이상 뛸 수 없는 채로.
  extras:
  - text: 토끼 발은 지닌 사람에게 행운을 가져다준다고 알려져 있다. 하지만 어쩌면 그것도 그저 흔한 미신일지도 모른다.

tba:200:obj:20008:
  short: 악취가 나는 헝겊 조각들
  long: 찢어진 천 조각들이 여기 놓여 있는데, 땀 냄새가 심하게 난다.
  extras:
  - text: 이 헝겊들은 아무리 빨아도 빠지지 않을 것 같은 악취를 풍긴다.

tba:200:obj:20009:
  short: 찢어진 천 조각
  long: 찢어진 천 조각이 여기 놓여 있다. 허리띠로 쓸 수 있지 않을까?
  extras:
  - text: 이 낡고 마모된 천 조각은 원래 허리띠로 쓰이도록 만들어졌던 것 같다.

tba:200:obj:20010:
  short: 망가진 샌들 한 켤레
  long: 낡은 가죽 샌들 한 쌍이 여기 버려져 있다.
  extras:
  - text: 가죽 끈은 끊어졌다가 다시 꿰매졌고, 또다시 끊어졌다. 착용할 수는 있어 보이지만 겨우 그럴 정도다.

tba:200:obj:20011:
  short: 찢어진 바지
  long: 이미 찢어질 대로 찢어진 바지가 여기 버려져 있다.
  extras:
  - text: 이 낡은 바지는 색이 바랬고, 구멍 난 곳 대부분에 천을 덧대어 놓았다.

tba:200:obj:20012:
  short: 토끼 귀 한 쌍
  long: 피투성이 토끼 귀 한 쌍이 여기 땅에서 삐죽 나와 있다.
  extras:
  - text: >-
      토끼 머릿가죽이 여기 놓여 있다. 누군가 이 불쌍한 짐승에게 머릿가죽 벗기는 솜씨를 연습한 모양이다. 토끼 털을 잘라 투구 비슷하게 만들어 놓은 것처럼 보이기도 한다.

tba:200:obj:20013:
  short: 갈색 털 조각
  long: 작은 갈색 털 조각 하나가 여기 떨어져 있다. 가릴 정도도 겨우다.
  extras:
  - text: 이 작은 털 조각으로 손목 보호대 같은 것이 만들어졌다. 크기가 너무 작아 제대로 가리는 곳이 거의 없다.

tba:200:obj:20014:
  short: 새끼 사슴 털
  long: 가죽이 벗겨진 새끼 사슴의 사체가 여기서 썩어 가고 있다.
  extras:
  - text: 새끼 사슴의 가죽을 벗겨 임시변통으로 팔 보호대를 만들었다.

tba:200:obj:20015:
  short: 두꺼운 검은 털가죽 코트
  long: 고급스러운 두꺼운 검은 털가죽 코트가 여기 놓여 있으며, 흙이 뒤덮여 있다.
  extras:
  - text: 곰의 가죽으로 만든 두꺼운 검은 털가죽 코트다. 매우 무겁고 부피가 크지만, 상당한 보호력을 제공한다.

tba:200:obj:20016:
  short: 녹슨 강철 덫
  long: 낡고 녹슨 강철 덫이 바닥에 놓여 있다. 보기만 해도 위험해 보인다.
  extras:
  - text: 이 쇠 발덫은 녹이 슬어 거의 완전히 닫힌 채 굳어 있다. 쇠 집게 양쪽의 용수철은 낡고 닳아 있다.

tba:200:obj:20017:
  short: 범포 하버사크
  long: 범포 잡낭이 여기 놓여 있다.
  extras:
  - text: 이 주머니는 작지만, 소지품 몇 가지를 보관하는 데는 훌륭할 것이다.

tba:200:obj:20018:
  short: 날을 세운 나무 단검
  long: 커다란 나무 조각 하나가 긴 풀에 기대어 있다.
  extras:
  - text: 처음에는 그저 나무 조각 하나일 뿐이지만, 자세히 살펴보면 그것이 무기임을 깨닫게 된다.

tba:200:obj:20019:
  short: 끈으로 동여맨 장갑
  long: 가죽 조각을 꿰매어 붙인 것이 여기 놓여 있다. 아마 임시로 만든 장갑인 듯하다.
  extras:
  - text: 이 장갑은 잘 만들어졌으며 매우 튼튼하다.

tba:200:obj:20020:
  short: 붉은 여우의 털가죽
  long: 사냥꾼들이 탐낼 만한 멋진 털가죽이 아무도 거들떠보지 않은 채 여기 놓여 있다.
  extras:
  - text: 이 선명한 붉은 털은 붉은 여우의 것이 틀림없다. 매끄럽고 상태가 아주 좋다.

tba:200:obj:20021:
  short: 말린 고기 한 조각
  long: 고기 한 덩이가 여기 흙바닥에 놓여 있다. 무슨 고기인지 알 수 없고, 그다지 맛있어 보이지도 않는다.
  extras:
  - text: 이 고기는 햇볕에 말린 뒤 훈제하여 보존 기간을 늘린 것이다.

tba:200:obj:20022:
  short: 광택 도구 세트
  long: 울트라 샤인 한 통이 여기 놓여 있다.
  extras:
  - text: 그냥 쓰기만 하면 거의 무엇이든 반짝반짝 윤이 나게 해 줄 광택 도구 세트다.

tba:200:obj:20023:
  short: 팽팽하게 편 가죽 방패
  long: 나무 틀에 가죽을 팽팽하게 씌운 것으로, 방패인 듯하다.
  extras:
  - text: 어린나무를 둥글게 구부려 테를 만들고 그 위에 가죽을 씌워 팽팽하게 당겨 놓았다. 그럭저럭 방패 대용으로 쓸 수 있을 것 같다.

tba:200:obj:20024:
  short: 노끈 반지
  long: 노끈 한 가닥을 땋아 만든 예쁘고 작은 고리다.
  extras:
  - text: 노끈은 아마마로 만들어져 보이지만, 확신하기는 어렵다. 손가락에 걸 수 있을 만큼 큰 루프 모양의 매듭으로 엮어 놓았다.
