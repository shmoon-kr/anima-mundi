tba:40:room:4059:
  name: 터널
  description:
  - 당신은 모리아 산의 심장부 깊숙한 곳에 있는 터널 안에 서 있다. 터널은 동쪽으로 약간 내려가는 듯하며, 북쪽 벽을 따라 작은 물줄기가 흐르고 있다.
  - 터널은 동쪽으로 이어지며 땅속으로 더 깊이 파고들고, 서쪽으로는 약간 올라가며 공기가 꽤 습하다.

tba:40:room:4060:
