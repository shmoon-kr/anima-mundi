  exits:
    down:
      look: 바닥의 작은 구멍은 아래에 무엇이 있는지 그 비밀을 드러내려 하지 않는다.
  extras:
  - text: 바닥의 작은 구멍은 아래에 무엇이 있는지 그 비밀을 드러내려 하지 않는다.

tba:40:room:4075:
  name: 나무 숲
  description: >-
    이 나무 숲에 서 있으니 으스스한 기분이 든다. 동쪽으로는 평원이 보이고, 북쪽으로는 기이한 그림자가 끊임없이 형태를 바꾸며 마치 당신을 안으로 들어오라고 부르는 것 같다.
  exits:
    north:
      look: 당신 앞에 기이한 그림자가 형성되어 있다.

tba:40:room:4076:
  name: 산길 위
  description: >-
    당신은 동쪽으로 조금 떨어진 또 다른 산 그늘 속에 숨겨진 작은 골짜기 쪽으로 굽이굽이 내려가는 산길을 걷고 있다. 이 길은 꽤 험난해 보이며, 작은 골짜기로 내려가더니 곧바로
    반대편 산의 경사면을 따라 다시 올라가는 모양새다. 조금 더 가까운 관점에서 골짜기를 바라보니, 예상했던 것보다 훨씬 작아 보일 정도인데 길이가 약 9미터 남짓에 불과하다. 이렇게
    높은 산 위에서는 거리가 얼마나 속이기가 쉬운지, 정말 놀랍지 않은가?

tba:40:room:4077:
  name: 숨겨진 골짜기
  description: >-
    이 골짜기는 산비탈을 내려온 노력이 헛수고였다는 듯이 텅 비어 있다. 물론, 방금 눈치챈 동쪽 산비탈에 조심스레 숨겨진 오솔길이 하나 있다. 그 길은 당신에게 하늘의 대부분을
    가리고 있는 동쪽 산 위로 이어진다.

tba:40:room:4078:
  name: 숨겨진 골짜기
  description: >-
    이 작은 골짜기는 동쪽의 높은 산 그림자 속에 숨겨져 있다. 동쪽으로 이어지는 오솔길은 눈앞에서 사라지는 듯하지만, 금세 다시 찾을 수 있다. 서쪽으로도 산 위로 오르는 길이
    하나 뻗어 있다.

tba:40:mob:4000:
  short: 뱀
  long: 크고 무서운 뱀이 당신 발밑에서 당신을 향해 시끄럽게 울고 있다.
  description: >-
    이 두꺼운 몸통의 뱀은 약 150센티미터 정도 길이이다. 검은색 V자 무늬가 있는 회색이다. 이 독사들은 방해받거나 괴롭힘을 당하지 않는 한 일반적으로 온순하다. 독사를 만났을
    때 가장 안전한 반응은 물러나는 것이다. 혼자 두면 공격하지 않을 것이다.

tba:40:mob:4001:
  short: 초록 뱀
  long: 작은 초록 뱀이 여기 있으며, 너무 우호적이지 않아 보인다...
  description: 무해해 보인다. 가느다란 무늬 뱀인 것 같다. 약 60센티미터 길이이며, 당신이 접근하자 기어가는 것을 멈추고 도망치려 한다.

tba:40:mob:4002:
