    보인다.

tba:40:room:4073:
  name: 터널의 끝
  description: >-
    터널은 여기서 갑자기 끝난다. 정말 기이하다. 유일한 출구는 서쪽으로, 터널이 산을 관통해 되돌아가는 곳이다. 이 통로의 끝에는 흥미로운 것이 전혀 없다. 이상하다.

tba:40:room:4074:
