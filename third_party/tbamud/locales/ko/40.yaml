# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:40, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:40:room:4000:
  name: 언덕
  description: >-
    당신은 북쪽으로 이어지는 길 위에 서 있다. 작은 언덕들이 당신을 둘러싸고 있다. 북쪽에서 악의 힘이 당신에게 다가오는 것을 느낀다. 북동쪽 멀리, 거대한 산맥의 시작 부분이
    보인다.

tba:40:room:4001:
  name: 언덕
  description: >-
    당신은 북쪽으로 이어지는 좁은 길 위에 서 있다. 어둡고 위협적인 언덕들이 거의 모든 방향에서 당신을 둘러싸고 있다. 북쪽 꽤 먼 거리에서, 기이하게도 고립된 산의 거대한 그림자가
    보인다.

tba:40:room:4002:
  name: 길의 끝
  description: >-
    여기서 길이 끝난다. 북쪽에는 단 하나의 산이 있고, 당신 주변에는 몇몇 위협적인 언덕이 있다. 작은 오솔길이 바위 사이를 지나 언덕 위를 따라 북쪽에 있는 어두운 동굴로 이어진다.
    북동쪽 멀리, 거대한 산맥으로 보이는 것의 남쪽 끝이 보인다.

tba:40:room:4010:
  name: 동굴
  description: >-
    당신은 작은 동굴 안에 서 있다. 가장 넓은 지점에서 약 4.5미터, 길이는 약 12미터 정도이다. 남쪽에서 신선한 바람이 느껴져, 입구가 그 방향으로 위치해 있을 것으로 추측된다.
    북쪽으로는 작은 터널이 산속으로 이어져 있다.

tba:40:room:4011:
  name: 터널
  description: >-
    당신은 좁은 터널 안으로 몸을 밀어 넣는다. 축축한 벽이 도우미가 되어 통로를 미끄러지듯 통과할 수 있게 해준다. 북쪽으로 갈수록 곰팡이 낀 이끼 냄새가 점점 진해지지만, 남쪽에서는
    신선한 공기가 은은한 바람을 타고 스쳐 지나간다.

tba:40:room:4012:
  name: 터널
  description: 당신은 이 좁은 터널의 굽은 지점에 서 있다. 터널은 북쪽으로 나아가면 어떤 동굴로 이어지는 듯하고, 동쪽으로는 산을 관통해 계속 이어진다.

tba:40:room:4013:
  name: 터널
  description: 이 터널의 먼지 쌓인 바닥 한가운데 서서 보니, 이곳은 자주 통행하는 통로가 아님을 알 수 있다. 동서 방향으로 이어져 있는 것으로 보인다.

tba:40:room:4014:
  name: 터널
  description: >-
    당신은 이 터널 안의 작은 갈림길에 서 있다. 주 터널은 남쪽에서 서쪽으로 휘어지는 듯하지만, 북쪽에는 동굴로 들어가는 입구가 있다. 그 입구 자체는 인공적으로 보이며, 터널이나
    동굴보다 훨씬 최근에 만들어진 것처럼 보인다.

tba:40:room:4015:
  name: 터널
  description: >-
    당신은 이 좁은 터널을 기어 올라간다. 벽에는 응축수가 맺혀 축축하고, 머리 위 바위의 무게가 거의 폐쇄공포증을 느끼게 할 정도다. 터널은 여기서 서쪽에서 북쪽으로 거칠게 꺾여
    있다.

tba:40:room:4016:
  name: 큰 동굴
  description: 당신은 꽤 큰 동굴 안에 있다. 동쪽과 서쪽 끝은 거의 완전히 어둠에 잠겨 있다. 남쪽 벽을 뚫고 작은 터널이 나 있으며, 그곳 역시 그림자로 가득 차 있다.

tba:40:room:4017:
  name: 큰 동굴
  description: >-
    당신은 동굴을 따라 서쪽 끝까지 이동해 보았지만, 여기서 나갈 다른 출구는 없는 것 같다. 벽은 꽤 매끄럽고, 물이 흐르면서 자연스럽게 바위를 깎아 만든 것처럼 보인다.

tba:40:room:4018:
  name: 동굴
  description: >-
    당신은 동굴의 남쪽 끝에 서 있다. 동굴은 남쪽으로 뻗어 터널로 변해간다. 동굴은 북쪽으로 더 깊은 어둠 속으로 이어진다. 구석에 커다란 뼈 더미가 쌓여 있는 것을 발견한다.
  extras:
  - text: 조심하는 것이 좋겠다 - 뼈 중 일부는 인간의 것이다!

tba:40:room:4019:
  name: 터널
  description: 당신은 북남 방향으로 뻗어 있는 꽤 넓은 통로 한가운데 서 있다. 벽은 매우 매끄럽다. 마치 강이 땅을 파고 지나간 것처럼.

tba:40:room:4020:
  name: 구멍
  description: 당신은 메인 터널에서 벗어나 작은 벽면 안쪽 공간에 서 있다. 바닥에는 꽤 넓은 구멍이 뚫려 있다. 다른 출구는 북쪽뿐이다.

tba:40:room:4021:
  name: 구멍
  description: >-
    터널 끝자락에 서서 보니, 벽의 북서쪽 모서리 근처 바닥에 큰 구멍이 있다. 터널 자체는 동쪽으로 이어진다. 여기 공기는 매우 습해서, 옷이 땀으로 끈적해지고 있는 것 같다.

tba:40:room:4022:
  name: 습한 터널
  description: >-
    당신은 습한 터널 한가운데 서 있다. 공기 중 습기가 너무 짙어서, 옷으로 스며드는 것이 거의 느껴질 정도다. 터널은 북쪽과 서쪽으로 이어진다. 동쪽에는 큰 동굴이 열려 있다.

tba:40:room:4023:
  name: 큰 동굴
  description: >-
    당신은 큰 동굴의 서쪽 부분에 서 있다. 동쪽으로는 터널이 보인다. 터널 입구 근처의 공기는 습기가 차 있어 마치 비를 맞고 서 있는 듯한 느낌을 준다. 동굴 벽면은 어둠과 그림자로
    거의 완전히 뒤덮여 있으며, 동굴의 남쪽 끝도 마찬가지다.

tba:40:room:4024:
  name: 습한 터널
  description:
  - >-
    당신이 지금 있는 터널은 매우 습하고, 공기는 습기로 가득 차 거의 멈춰 있는 듯하다. 벽면에서는 거의 끊임없이 물이 떨어지고 있으며, 바닥에는 고인 작은 물웅덩이들이 가득하다.
  - 터널은 남쪽으로 이어지며, 서쪽으로는 이곳보다 공기가 더 습하다는 것을 느낄 수 있다.

tba:40:room:4025:
  name: 동굴
  description: 당신은 상당히 큰 동굴의 북쪽 끝에 서 있다. 동쪽 동굴 벽면에는 여러 터널이 교차하는 곳으로 이어지는 듯한 입구가 보인다.

tba:40:room:4026:
  name: 수많은 터널
  description: >-
    당신은 수많은 터널이 교차하는 한가운데 서 있다. 북쪽 터널에서는 꿉꿉한 냄새가 풍겨 나오고, 서쪽 터널은 거의 즉시 동굴로 이어지는 듯하다. 남쪽과 동쪽 터널은
    어둠 속에 완전히 잠겨 있다.

tba:40:room:4027:
  name: 터널
  description: >-
    당신은 터널의 구부러진 모퉁이에 서 있다. 터널은 서쪽과 북쪽으로 꺾여 있다. 남쪽에 있는 그림자 속에 작은 틈이 숨겨져 있는 것을 발견하고, 북쪽 어딘가에서 바람이 불어오는
    것이 느껴진다.

tba:40:room:4028:
  name: 악취가 나는 터널
  description: 당신은 북쪽과 남쪽으로 이어지는 꽤 작은 터널 안에 있다. 북쪽 어딘가에 희미한 빛이 보인다. 잠시 멈춰 서자, 북쪽에서 이상한 냄새가 나는 것을 알아차린다.

tba:40:room:4029:
  name: 동굴
  description: 당신은 신선한 공기가 가득한 동굴 안에 있다. 북쪽에서 바람이 불어오는 것을 느낀다. 남쪽으로 보면 작은 터널이 산속으로 이어져 있다.

tba:40:room:4030:
  name: 빛이 드는 동굴
  description: >-
    당신은 빛이 들어오는 동굴 안에 있다. 머리 위에는 큰 구멍이 있어 하늘을 볼 수 있다. 남쪽에 있는 작은 터널은 유일한 출구이다. 이상한 냄새의 원인을 알아차린다. 당신 주변에는
    여러 몬스터의 시신이 널려 있다.
  extras:
  - text: >-
      동굴 바닥에 널려 있는 시신들을 살펴보니, 모두 거대한 생물에게 찢겨 산산조각이 난 것처럼 보인다. 더 놀랍지 않은 점은, 시신 모두 역겨운 냄새를 풍기고 있다는 것이다.

tba:40:room:4031:
  name: 계곡
  description: >-
    당신은 언덕으로 둘러싸인 작은 계곡 안에 서 있다. 남쪽에는 산이 있고, 그 산에는 동굴이 하나 있다. 북쪽으로는 언덕으로 들어갈 수 있다. 동쪽에는 가파른 언덕 위로 이어지는
    좁은 길이 하나 있다.
  exits:
    east:
      look: 동쪽 언덕으로 이어지는 좁은 길이 보인다.

tba:40:room:4032:
  name: 산기슭
  description: 당신은 모리아 산 북쪽 산기슭을 관통하는 구불구불한 길 위에 서 있다. 이 길은 북쪽으로 계속 이어진다.

tba:40:room:4033:
  name: 산기슭의 갈림길
  description: 당신은 작은 길이 여기서 갈라지는 지점에 서 있다. 이 길은 북쪽과 남쪽으로 이어지며, 거친 오솔길이 동쪽 산으로 이어진다.

tba:40:room:4034:
  name: 산기슭의 풀밭
  description: >-
    여기의 풀은 유독 높게 자라 있다. 누군가 또는 무언가 큰 것이 풀을 밟아 누른 자국이 여러 곳에 보인다. 이 지역에는 매우 큰 바위들이 여기저기 흩어져 있다. 북쪽으로 가면
    산기슭의 끝자락으로, 서쪽으로 가면 산기슭 안쪽으로, 남쪽으로 가면 작은 길의 갈림길로 갈 수 있다.

tba:40:room:4035:
  name: 구릉지 끝자락
  description: 당신은 구릉지의 북쪽 끝자락, 북쪽에 펼쳐진 평야와 만나는 지점에 서 있다. 남쪽으로 구릉지 안으로 되돌아갈 수도 있고, 북쪽으로 평야로 나아갈 수도 있다.

tba:40:room:4036:
  name: 평야
  description: 당신은 평야 위에 있다. 길은 남쪽으로 이어진다. 주위를 둘러보니, 서쪽 나무 군락지로 향하는 거의 보이지 않는 작은 오솔길이 하나 보인다.

tba:40:room:4037:
  name: 구릉지 관통 길
  description: >-
    당신은 동서 방향으로 구릉지를 관통하는 길 위에 서 있다. 서쪽 어느 정도 떨어진 곳에 작은 길 갈림목이 보이고, 동쪽으로는 산맥의 일부가 땅에서 솟아나 하늘을 가려 길의 끝이
    보이는 것 같다.

tba:40:room:4038:
  name: 산기슭
  description: >-
    당신은 모리아 산에서 시작해 세계의 끝인 북쪽까지 이어지는 산맥의 큰 산 밑에 서 있다. 서쪽 구릉지를 관통하는 작은 길이 하나 나 있으며, 꽤 멀리 떨어진 곳에 평야가 보인다.
    동쪽으로는 산기슭을 따라 올라가는 좁고 닳은 오솔길이 하나 보인다.

tba:40:room:4039:
  name: 산길
  description: 당신은 좁지만 잘 닦인 산길 한가운데 서 있다. 이 길은 산 정상 쪽으로 휘어 올라가기도 하고, 서쪽으로 산 아래 구릉지로 내려가기도 한다.

tba:40:room:4040:
  name: 산 정상
  description: >-
    당신은 사실상 이 산의 꼭대기에 서 있다. 지상에서 볼 때 분명 더 높아 보였지 않나? 당신이 서 있는 평탄한 고지대는 약 30미터 정도 넓으며, 북쪽 가장자리에 작은 구멍이
    있어 작은 동굴로 이어지는 듯하다. 작은 산길이 동쪽 산자락에 숨겨져 있던 계곡 쪽으로 내려간다.

tba:40:room:4041:
  name: 사자의 굴
  description: 구멍을 따라 동굴 입구까지 내려가 좁은 통로를 기어 들어가자, 거대한 육식 동물의 거처로 보이는 곳에 도착했다!

tba:40:room:4042:
  name: 평탄한 구릉지
  description: >-
    당신은 구릉지를 계속 이동하며 서쪽 멀리, 큰 언덕 측면에 꽤 큰 동굴 입구가 보임을 알아차린다. 그 언덕은 나머지 구릉지보다 상당히 부자연스럽게 솟아 있다. 동쪽으로는 아무것도
    없는 곳에서 시작되는 듯 보이는 길이 이어진다.

tba:40:room:4043:
  name: 동굴 입구
  description: >-
    당신은 바깥에서 보았을 때보다 훨씬 더 큰 터널 안에 서 있다. 천장은 적어도 약 6미터 위이고, 터널의 너비는 적어도 약 4.5미터에 이른다. 동쪽에서 신선한 바람이 불어오는
    것이 느껴지고, 서쪽으로는 어둠 속으로 이어져 보인다.

tba:40:room:4044:
  name: 언더지언트 동굴
  description: >-
    당신은 상당히 큰 동굴 안에 있다. 천장은 적어도 약 7.5미터 위, 어쩌면 그보다 더 위에 있다. 벽은 너무 멀리 떨어져 있어 방 안의 그림자가 벽을 거의 완전히 가리고 있다.
    그러나 이 동굴의 웅장함 속에서도 당신의 시선을 가장 강하게 사로잡는 것은 모래바닥 한가운데 서 있는 거대한 테이블이다. 당신은 허리를 굽히지 않고도 그 아래를 걸을 수 있을
    만큼 높이가 있다. 동굴의 동쪽 벽에서 큰 터널이 나간다.

tba:40:room:4045:
  name: 가파른 산길
  description: 이 길은 가파른 언덕을 따라 올라가다가, 당신을 둘러싼 산들 사이로 지나가기 시작하면서 평탄해진다. 이 길은 동쪽의 언덕을 지나고, 서쪽으로는 계곡으로 내려간다.
  exits:
    east:
      look: 바위투성이의 길이 계속된다.
    west:
      look: 가파른 산길 아래로 계곡이 펼쳐져 있다.

tba:40:room:4046:
  name: 산과 산 사이
  description: 산과 산 사이의 길은 당신이 계속 걸을수록 끝이 없는 것처럼 보인다. 이 길은 동쪽과 서쪽 모두로 이어진다.
  exits:
    east:
      look: 길이 동쪽으로 계속된다.
    west:
      look: 길이 서쪽으로 계속된다.

tba:40:room:4047:
  name: 산기슭
  description: 긴 여정 끝에 당신은 다시 산기슭에 서 있다. 서쪽으로 조금만 가면 북서쪽으로 이어지는 좁은 길 한가운데가 보인다.
  exits:
    east:
      look: 이쪽으로 가면 좁은 길로 향할 수 있다.
    west:
      look: 산맥을 관통해 되돌아가는 길은 끝이 없어 보인다.

tba:40:room:4048:
  name: 산기슭
  description: >-
    산기슭을 잠시 걸으면 서쪽으로 산맥 사이를 지나는 길이 나온다. 그 길은 매우 길어 보이고 아마도 꽤 지칠 것이다. 서쪽으로 조금만 가면 북서쪽으로 이어지는 좁은 길 한가운데가
    보인다.
  exits:
    east:
      look: 이쪽으로 가면 좁은 길로 향할 수 있다.
    west:
      look: 산맥을 관통해 이어지는 길은 끝이 없어 보인다.

tba:40:room:4049:
  name: 산기슭
  description: 당신은 거의 직선으로 서쪽으로 뻗어 있다가 서서히 북서쪽으로 굽이치는 길로 바뀌는 지점에 서 있다.
  exits:
    north:
      look: 북서쪽으로 이어지는 작은 길이 있다.
    west:
      look: 서쪽 산맥으로 향하는 길이 있다.

tba:40:room:4050:
  name: 터널
  description: >-
    당신은 터널의 굽은 지점에 서 있다. 동쪽 방향이던 터널이 남쪽 방향으로 꺾여 있다. 벽은 차갑고 습기가 차 있는 듯하다. 북쪽 벽의 통로 천장 근처에 초록색 이끼가 자라는 것을
    볼 수 있다.

tba:40:room:4051:
  name: 터널
  description: >-
    이 터널 구간에 서 보니, 터널이 갑자기 좁아지는 것은 물론 바닥이 이전보다 훨씬 매끄럽지 않다. 사실 동쪽을 바라보면 바닥이 약 150센티미터 정도 계단처럼 삐죽삐죽하게 내려간다.
    하지만 서쪽 길은 꽤 매끄러운 것 같다.

tba:40:room:4052:
  name: 터널
  description: 터널을 따라 계속 나아가니 바닥이 다시 매끄러워지기 시작한다. 주위를 둘러보니 남쪽 벽 근처에서 작은 샘물이 버블버블 솟아오르는 것을 발견한다.

tba:40:room:4053:
  name: 터널
  description: >-
    터널을 따라 계속 나아가다 보니 직각으로 꺾이는 곳에 도착한다. 여기서부터는 북쪽과 동쪽으로 길이 이어진다. 북쪽 길은 지하의 어둠을 뚫고 계속되는 더 긴 터널처럼 보인다. 동쪽
    길은 이 깊이에서 보통 볼 수 있는 것과 달리 신선한 변화가 있는데, 터널이 꽤 크고 밝은 동굴로 넓어지는 것 같다.

tba:40:room:4054:
  name: 빛나는 동굴
  description: >-
    당신이 서 있는 이 동굴은 기이하게 깜빡이는 빛으로 비추어진다. 그 빛은 아마 동굴 중앙쯤, 남쪽으로 조금 떨어진 곳에서 타오르는 거대한 불꽃에서 나오는 것 같다. 깜빡이는 빛은
    벽면에 정말 이상하고 거의 무서울 정도로 기괴한 그림자를 만들어내며, 여기서 동쪽과 서쪽으로 이어지는 두 개의 터널을 거의 가려버린다.

tba:40:room:4055:
