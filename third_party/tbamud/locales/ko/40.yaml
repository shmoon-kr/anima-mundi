    당신은 또 다른 작고 습한 터널 속에 서 있다. 천장이 머리 위를 아주 낮게 덮고 있고, 통로는 어둠 속으로 꼬여 나간다. 여기서 나갈 수 있는 출구는 서쪽과 북쪽뿐인 것 같다.

tba:40:room:4068:
  name: 큰 동굴
  description: >-
    당신은 아마도 지금까지 들어가 본 가장 큰 동굴 속에 있다. 동굴은 동쪽과 남쪽 어둠 속으로 뻗어 있다. 동굴은 당신의 숨소리가 만들어내는 울림으로 가득 차 있다. 종유석과 석순이
    각각 천장에서 아래로 매달리고 동굴 바닥에서 위로 자라나 있다.

tba:40:room:4069:
