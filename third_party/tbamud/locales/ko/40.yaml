  long: 못생긴 코볼드가 여기 있으며, 저녁 식사를 찾고 있다.
  description: 못생겨 보인다.

tba:40:mob:4004:
  short: 오르크
  long: 오르크가 돌아다니며 죽일 대상을 찾고 있다.
  description: 그의 눈에서 악의가 느껴진다...

tba:40:mob:4005:
  short: 오르크
  long: 크고 사나워 보이는 오르크가 여기 있다.
  description: 그의 모습은 끔찍하다.

tba:40:mob:4050:
  short: 전사
  long: 키가 큰 전사가 여기 있다. 당신이 본 적 있는 누구보다도 흉터가 많다.
  description: 그는 강하지만 무식한 싸움꾼으로 보인다.

tba:40:mob:4051:
  short: 전사
  long: 키가 큰 전사가 여기 있다.
  description: 그는 무기를 다루는 법을 잘 아는 것 같다.

tba:40:mob:4052:
  short: 호브고블린
  long: 작은 호브고블린이 여기 서 있다.
  description: 호브고블린은 꽤 길을 잃은 것처럼 보인다.

tba:40:mob:4053:
  short: 뱀
  long: 갈색 뱀이 당신을 바라보고 있다.
  description: 뱀은 꽤 사나워 보인다. 길이는 약 120센티미터 정도다. 무늬는 다양하지만 등 부분은 칙칙한 갈색이다. 뱀은 제자리를 지키며 당신을 향해 쉿쉿 소리를 낸다.

tba:40:mob:4054:
  short: 지네
  long: 흰 지네가 여기 있다.
  description: 지네는 당신을 거의 알아채지 못하는 것 같다.

tba:40:mob:4055:
  short: 호브고블린
  long: 큰 호브고블린이 여기 있다.
  description: 호브고블린은 꽤 위험해 보인다.

tba:40:mob:4056:
  short: 오르크
  long: 오르크가 여기 있다. 무언가(혹은 누군가?)를 먹기 위해 찾고 있는 듯하다.
  description: 글쎄, 그는 친근해 보이지 않는다.

tba:40:mob:4057:
  short: 산사자
  long: 산사자가 여기 있다. 당신을 향해 사납게 으르렁거린다.
  description: 사자는 거대한 발톱과 큰 이빨을 드러내며 매우 악랄해 보인다.

tba:40:mob:4058:
  short: 언덕 거인
  long: 언덕 거인이 여기 있다. 바위를 이리저리 던지고 있다.
  description: 그 언덕 거인은 약 270센티미터 정도 되는 키로 보인다. 그의 행동으로 보아 당신이 금세 그가 매우 지능이 높지 않다는 결론에 도달하게 된다.

tba:40:obj:4000:
  short: 노랑과 초록색 반지
  long: 반지가 여기 있다. 노랑색과 초록색 장식이 되어 있다. 매우 오래된 것으로 보인다.
  extras:
  - text: 무겁게 느껴진다.

tba:40:obj:4001:
  short: 고블린의 시체
  long: 반쯤 부패한 고블린의 시체가 여기 있으며, 악취를 풍기고 있다.

tba:40:obj:4002:
  short: 동전 몇 닢
  long: 작은 무더기의 동전이 바닥에 놓여 있다.

tba:40:obj:4050:
  short: 보라색 물약
  long: 보라색 물약이 여기 있다.
  extras:
  - text: 꽤나 이상해 보인다!

tba:40:obj:4051:
  short: 금속 투구
  long: 금속 투구가 여기 있다.
  extras:
  - text: 어떤 마법적인 기운이 느껴진다!.

tba:40:obj:4052:
  short: 버섯
  long: 작은 버섯이 여기 있다.
  extras:
  - text: 이렇게 말해두겠다 - 나는 절대 먹지 않을 거다!!

tba:40:obj:4053:
  short: 도적용 단검
  long: 아름답게 만들어진 단검이 여기 놓여 있다.
  extras:
  - text: 회색빛 합금으로 만들어진 중형 크기의 아름답게 다듬어진 단검이다. 칼날은 양날이며 매우 얇다...  이것은 좋은 도적용 무기로 보인다.
