    웅덩이에 물을 공급하고 있지만, 웅덩이의 수위는 변하지 않는 것 같다.
  - 터널 양쪽을 바라보면, 서쪽으로는 터널이 올라가고, 동쪽으로는 희미하게 깜빡이는 빛이 터널이 동굴로 이어지는 것을 보여준다.

tba:40:room:4061:
