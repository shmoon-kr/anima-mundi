# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:54, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:54:room:5400:
  name: 춤추는 악마 여관 입구
  description: >-
    당신은 춤추는 악마 여관의 입구 현관에 서 있다. 크롬 도금된 나선형 계단이 접수처로 올라간다. 남쪽에서는 흥겹게 마시며 즐기는 소리가 들리고, 서쪽에서는 뉴탈로스의 분주한 활동
    소리가 들린다.
  exits:
    south:
      look: 사람들이 춤추고 마시는 모습이 보인다.
    west:
      look: 술탄의 길로 사람들이 지나가는 모습이 보인다.
    up:
      look: 나선형 계단이 접수처로 이어진다.

tba:54:room:5401:
  name: 접수처
  description: >-
    당신은 뉴탈로스의 접수처에 서 있다. 거대한 마호가니 데스크가 있고, 소파 두 개와 잡지로 덮인 커피 테이블이 있다. 발밑의 푹신한 카펫은 당신이 익숙한 거친 길들과는 사뭇 다른
    기분이다. 크롬 계단이 아래로 내려가 춤추는 악마 여관의 술집과, 뉴탈로스에서의 당신의 향후 모험으로 이어진다.
  exits:
    down:
      look: 계단이 악마 여관으로 내려간다.

tba:54:room:5402:
  name: 춤추는 악마 여관
  description: >-
    거대한 원형 습바가 악마 여관의 동쪽 끝 대부분을 차지하고 있다. 늙은 마법사가 바 뒤의 거울에 기대어 앉아, 정교한 텔레키네시로 여러 잔의 음료를 동시에 부어주고 있다. 현지
    밴드인 로케츠가 무대에서 평소처럼 공연을 하고 있다. 벽을 따라 놓인 대형 부스에는 사람들이 가득 차서 마시며 즐거운 시간을 보내고 있다. 당신도 여기서 파티를 즐기고 싶어진다.
    눈에 띄는 출구는 북쪽뿐이다.
  exits:
    north:
      look: 악마 여관의 입구가 보인다.
  extras:
  - text: 바는 약간 어색해 보이며, 바텐더의 강력한 마법이 바를 회전하게 하는 것이라 짐작할 수밖에 없다.

tba:54:room:5403:
  name: 메디나
  description: >-
    당신은 뉴탈로스의 넓은 개방 공간 중 하나인 메디나에 서 있다. 사람들이 일상적인 업무를 보며 이리저리 오가고 있다. 남쪽으로 시민들의 공동 광장이 열려 있고, 메디나는 북쪽으로
    이어진다.
  exits:
    north:
      look: 메디나가 보인다.
    south:
      look: 공동 광장이 보인다.

tba:54:room:5404:
  name: 메디나
  description: >-
    당신은 시장 광장과 공동 광장을 잇는 넓게 트인 도로를 따라 걷고 있다. 구걸꾼, 거지, 그리고 그런 무리들이 마음을 활짝 연 몇 명을 만나기를 바라며 이리저리 돌아다닌다. 남쪽으로는
    메디나가 이어지고, 북쪽으로는 시장 광장이 펼쳐져 있다.
  exits:
    north:
      look: 시장 광장이 보인다.
    south:
      look: 메디나가 보인다.

tba:54:room:5405:
  name: 남쪽 시장 광장
  description: >-
    넓은 시장 광장이 시야를 가득 채운다. 뉴탈로스 시장에서만 볼 수 있는 낯선 모습과 소리가 당신의 감각을 강타한다. 여기서 무슨 일이 일어나고 있는지 이해할 수 있는 유일한 희망은
    이리저리 돌아다니는 것이다. 시장 광장은 북쪽, 서쪽, 동쪽으로 이어지고, 메디나는 남쪽으로 뻗어 나간다.

tba:54:room:5406:
  name: 시장 광장 중앙
  description: 당신은 뉴탈로스의 유명한 시장 광장 중앙에 서 있다. 광장 한가운데에는 크고 기이한 모양의 동상이 서 있다. 광장은 모든 방향으로 뻗어 있다.
  extras:
  - text: >-
      당신 앞에 위대한 비호더의 동상이 있다. 여러 개의 눈과 악독한... 악독한... 음... 눈... 을 가진 위대한 짐승이다. 위대한 비호더의 상태는 매우 양호하다.

tba:54:room:5407:
  name: 동남쪽 시장 광장
  description: >-
    시장의 이 구석에서는 이 땅에서 가장 큰 전사들이 당신보다 훨씬 크게 느껴진다. 근처에 무기점과 방어구점이 있다는 것을 알아차리면, 그들이 왜 여기 모이는지 쉽게 이해할 수 있다.
    아마도 이 상점들이 무엇을 제공하는지 구경하러 들러볼 수도 있겠다.

tba:54:room:5408:
  name: 남서쪽 시장 광장
  description:
  - >-
    시장의 이 구역은 비교적 조용해 보인다. 다만 상인들이 당신을 자기 가게로 끌어들이려 높은 목소리로 수다를 떨고 있을 뿐이다. 남쪽에는 빵 노점장이, 서쪽에는 잡화점 입구가 보인다.
  - 시장의 뻗어 나간 모습은 여기서 동쪽과 북쪽으로 이어진다.
  exits:
    south:
      look: 식료품 가게가 보인다.
    west:
      look: 잡화점이 보인다.

tba:54:room:5409:
  name: 서쪽 시장 광장
  description:
  - >-
    광장의 이 구역은 나머지 부분보다 좀 더 차분해 보인다. 대부분의 외지 모험가들이 시장의 남쪽 끝에서 어슬렁거리는 반면, 마을 사람들은 북쪽 끝에서 장사를 하는 듯하다.
  - 서쪽 큰길이 여기서 시작되어 성문으로 향하고, 시장의 광활한 모습은 나머지 방향으로 펼쳐져 있다.

tba:54:room:5410:
  name: 공동 광장
  description: >-
    사람들이 서로 이야기하며 지나가거나, 이 풀밭에서 지친 몸을 쉬고 있다. 남쪽을 통해 도시를 지나가는 강에서 나오는 희미한 소리가 들린다. 이슈타르 대로는 여기서 동서 방향으로
    뻗어 있고, 메디나는 북쪽에 있다. 남쪽에는 이슈타르 강 다리과 남쪽 성문이 있다.
  exits:
    north:
      look: 메디나가 보인다.
    south:
      look: 강 위 다리가 보인다.

tba:54:room:5411:
  name: 뉴탈로스 남쪽 성문 밖
  description:
  - >-
    당신은 눈앞에 펼쳐진 동쪽 대사막을 본다. 당신은 대자, 옛 탈로스의 유실된 도시, 그리고 사막 아래에 누워 있는 친절한 황동 용에 관한 많은 이야기를 들어 왔다.
  - 남쪽에는 사막이, 뉴탈로스 도시는 북쪽에 있다.

tba:54:room:5412:
  name: 남쪽 다리
  description: 다리를 건너면 이슈타르 강의 거센 물결이 보인다. 남쪽으로는 뉴탈로스의 남쪽 문이 보이고, 북쪽으로는 공동 광장이 펼쳐져 있다.

tba:54:room:5413:
  name: 뉴탈로스 남쪽 문 안쪽
  description: >-
    거대한 석조 탑 두 기가 당신을 맞이하며, 화려하게 제작된 경첩에 매달린 거대한 철제 문이 열려 있다. 문에는 뉴탈로스의 문장이 새겨져 있다. 이 도시를 만든 자들은 방어 시설이나
    자택을 재건하는 데 아낌없이 돈을 썼다. 북쪽에는 이슈타르 강 다리가, 남쪽에는 사막이 있다.

tba:54:room:5414:
  name: 북서쪽 시장 광장
  description: >-
    시장의 이 구석에는 뉴탈로스에서 가장 문명화된 사람들이 모인다. 북쪽에는 상인 아킴의 겸손한 상점이 있는데, 그의 직조품은 이 도시에서 최고로 꼽힌다. 이곳 서쪽에는 뉴탈로스
    제1 왕립 은행의 입구가 있다.

tba:54:room:5415:
  name: 북쪽 시장 광장
  description: 당신은 이 도시에서 가장 붐비는 곳 중 하나에 서 있다. 북쪽에는 뉴탈로스의 궁전과 카스바가 있으며, 이곳의 동쪽, 서쪽, 남쪽에는 활기찬 시장이 번성하고
    있다.

tba:54:room:5416:
  name: 북동쪽 시장 광장
  description: >-
    혼란. 대혼란. 광기. 이 시장의 구석에 시선을 던지자 머릿속에 몇 가지 더한 단어가 떠오른다. 채소 가게는 꽤 조용해 보이니 소음이 정육점에서 나오는 거라 짐작할 수밖에 없다.
    이 가게에 들어갈 용기를 내기까지 꽤 오래 생각해야 했다. 시장은 남쪽과 서쪽으로 이어진다.

tba:54:room:5417:
  name: 동쪽 시장 광장
  description: >-
    당신은 사막의 보석인 뉴탈로스의 시장에 서 있다. 시장은 이 도시의 중심이며, 모든 중요한 거래와 상거래가 여기서 이루어진다. 시장은 동쪽을 제외한 모든 방향으로 펼쳐져 있으며,
    여기서는 큰길이 동쪽 성문으로 이어진다.

tba:54:room:5418:
  name: 술탄의 길
  description: 이 자갈길은 마을을 가로지르는 여정을 돕는다. 북쪽으로 가면 술탄의 궁전과 춤추는 악마 여관을 지나게 되고, 남쪽으로 가면 시장 광장에 닿는다.

tba:54:room:5419:
  name: 술탄의 길
  description:
  - >-
    이 길의 이 부분은 궁전의 견고한 벽과 춤추는 악마 여관 사이를 지나간다. 동쪽으로는 작은 창문을 통해 여관 안을 들여다보니 많은 사람들이 춤추고 술을 마시는 것이 보인다. 다른
    용무를 마친 후 여관을 방문할 계획이다.
  - 이 길은 여기서부터 북쪽과 남쪽으로 이어진다.

tba:54:room:5420:
  name: 술탄의 길
  description: >-
    궁전과 춤추는 악마 여관 사이의 이 길은 말과 수레, 그리고 가죽 부츠의 발걸음으로 인해 닳아 보인다. 서쪽에서 어떤 공작이나 공작부인이 궁전에 도착했음을 알리는 나팔 소리가
    희미하게 들려온다. 동쪽의 악마 여관 홀에서는 안전한 쉼터가 당신을 기다리고 있으며, 술탄의 길은 북쪽과 남쪽으로 이어진다.

tba:54:room:5421:
  name: 술탄의 길
  description: >-
    광장 북쪽의 큰길이 여기까지 이어지며, 궁전과 악마 여관의 벽에 둘러싸여 있다. 북쪽에는 경비병이 철저히 지키는 문이 보이고, 남쪽에서는 희미한 상거래 소리가 들린다.

tba:54:room:5422:
  name: 뉴탈로스 북문 내부
  description:
  - >-
    두 개의 거대한 석조 탑이 당신을 맞이하며, 그 사이로 뉴탈로스의 문장이 새겨진 화려하게 제작된 경첩에 달된 거대한 철문이 열려 있다. 이 도시를 만든 자들은 자국의 방어 시설을
    재건하는 데 아낌없이 비용을 들였다.
  - 술탄의 길은 남쪽으로 뻗어 있고, 카스바는 동서로 펼쳐져 있다. 북쪽으로는 황야가 이어진다.

tba:54:room:5423:
  name: 뉴탈로스 서문 내부
  description:
  - >-
    벽에 박혀 있는 두 개의 거대한 석조 탑이 당신을 우뚝 내려다본다. 뉴탈로스의 문장이 새겨진 거대한 철문은 네 개의 화려하게 제작된 경첩에 쉽게 열리고 닫힌다. 이 도시를 만든
    자들이 자국을 보호하는 데 아낌없이 비용을 들였음이 분명하다.
  - 큰길은 동쪽의 시장으로 이어지고, 서쪽에서는 황야가 당신을 부른다. 남쪽에는 전사 길드의 입구가 있다.

tba:54:room:5424:
  name: 서쪽 큰길
  description: 이곳은 도시를 관통하는 주요 도로이다. 남쪽에서는 수리 공방의 망치 소리가 들리고, 북쪽에는 신전 광장으로 알려진 풀밭이 있다. 큰길은 동쪽과 서쪽으로 이어진다.

tba:54:room:5425:
  name: 서쪽 큰길
  description: >-
    현장 책임자가 여기 서서 구멍 난 도로를 수리하는 두 명의 건설 노동자를 감독하고 있다. 이 도로에서는 시장 상점 뒤로 이어지는 북쪽과 남쪽의 골목으로 갈라진다. 큰길은 여기서
    동쪽과 서쪽으로 계속 이어진다.

tba:54:room:5426:
  name: 서쪽 큰길
  description: >-
    당신은 은행과 잡화점 사이의 거리를 산책하고 있다. 서쪽에서는 도로 작업반의 소리가 들리고, 동쪽에서는 상거래가 이루어지는 소리가 들린다. 공기에는 금과 부의 냄새가 가득하다.
    상점 벽에는 포스터가 붙어 있다.
  extras:
  - text: '포스터에는 붉은 옷을 입은 부유해 보이는 남자가 당신에게 웃고 있다. 캡션에는 이렇게 적혀 있다: 술탄이 당신에게 세금을 내라고 상기시킨다!'

tba:54:room:5427:
  name: 동쪽 큰길
  description: 동쪽 큰길 이곳에서는 갓 도살한 고기의 냄새가 나고, 방어구점에서 새 금속을 두드리는 소리가 들린다. 서쪽에는 광장이, 동쪽에는 교차로가 있다.

tba:54:room:5428:
  name: 동쪽 큰길
  description: >-
    당신은 동쪽 큰길에 서 있다. 북쪽으로는 길드맨 로의 시작 부분이 보인다. 남쪽으로는 어두운 골목이 있다. 길은 동쪽으로도 이어진다. 교차점에 걸린 철사 위에 작은 표지판이 하나
    매달려 있다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다:'
    - 노숙 금지!
    - (뉴탈로스의 술탄 명령에 의함)

tba:54:room:5429:
  name: 동쪽 큰길
  description:
  - >-
    당신이 용병 길드 옆을 지나갈 때, 차가운 기운이 몰려와 몸이 통제할 수 없이 떨린다. 이 '유용한' 사람들의 집 입구 근처에서 수상한 인물들이 어슬렁거리는 것이 보인다. 호기심이
    이기겠지만, 안에 무슨 일이 벌어지고 있을지 궁금해진다. 북쪽으로는 약재 상점의 열린 문이 보인다. 그곳에서는 많은 마법 물약을 살 수 있다.
  - 큰길이 여기서 동서로 이어진다.

tba:54:room:5430:
  name: 동쪽 큰길
  description: >-
