# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:54, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:54:room:5400:
  name: 춤추는 악마 여관 입구
  description: >-
    당신은 춤추는 악마 여관의 입구 현관에 서 있다. 크롬 도금된 나선형 계단이 접수처로 올라간다. 남쪽에서는 흥겹게 마시며 즐기는 소리가 들리고, 서쪽에서는 뉴탈로스의 분주한 활동
    소리가 들린다.
  exits:
    south:
      look: 사람들이 춤추고 마시는 모습이 보인다.
    west:
      look: 술탄의 길로 사람들이 지나가는 모습이 보인다.
    up:
      look: 나선형 계단이 접수처로 이어진다.

tba:54:room:5401:
  name: 접수처
  description: >-
    당신은 뉴탈로스의 접수처에 서 있다. 거대한 마호가니 데스크가 있고, 소파 두 개와 잡지로 덮인 커피 테이블이 있다. 발밑의 푹신한 카펫은 당신이 익숙한 거친 길들과는 사뭇 다른
    기분이다. 크롬 계단이 아래로 내려가 춤추는 악마 여관의 술집과, 뉴탈로스에서의 당신의 향후 모험으로 이어진다.
  exits:
    down:
      look: 계단이 악마 여관으로 내려간다.

tba:54:room:5402:
  name: 춤추는 악마 여관
  description: >-
    거대한 원형 습바가 악마 여관의 동쪽 끝 대부분을 차지하고 있다. 늙은 마법사가 바 뒤의 거울에 기대어 앉아, 정교한 텔레키네시로 여러 잔의 음료를 동시에 부어주고 있다. 현지
    밴드인 로케츠가 무대에서 평소처럼 공연을 하고 있다. 벽을 따라 놓인 대형 부스에는 사람들이 가득 차서 마시며 즐거운 시간을 보내고 있다. 당신도 여기서 파티를 즐기고 싶어진다.
    눈에 띄는 출구는 북쪽뿐이다.
  exits:
    north:
      look: 악마 여관의 입구가 보인다.
  extras:
  - text: 바는 약간 어색해 보이며, 바텐더의 강력한 마법이 바를 회전하게 하는 것이라 짐작할 수밖에 없다.

tba:54:room:5403:
  name: 메디나
  description: >-
    당신은 뉴탈로스의 넓은 개방 공간 중 하나인 메디나에 서 있다. 사람들이 일상적인 업무를 보며 이리저리 오가고 있다. 남쪽으로 시민들의 공동 광장이 열려 있고, 메디나는 북쪽으로
    이어진다.
  exits:
    north:
      look: 메디나가 보인다.
    south:
      look: 공동 광장이 보인다.

tba:54:room:5404:
  name: 메디나
  description: >-
    당신은 시장 광장과 공동 광장을 잇는 넓게 트인 도로를 따라 걷고 있다. 구걸꾼, 거지, 그리고 그런 무리들이 마음을 활짝 연 몇 명을 만나기를 바라며 이리저리 돌아다닌다. 남쪽으로는
    메디나가 이어지고, 북쪽으로는 시장 광장이 펼쳐져 있다.
  exits:
    north:
      look: 시장 광장이 보인다.
    south:
      look: 메디나가 보인다.

tba:54:room:5405:
  name: 남쪽 시장 광장
  description: >-
    넓은 시장 광장이 시야를 가득 채운다. 뉴탈로스 시장에서만 볼 수 있는 낯선 모습과 소리가 당신의 감각을 강타한다. 여기서 무슨 일이 일어나고 있는지 이해할 수 있는 유일한 희망은
    이리저리 돌아다니는 것이다. 시장 광장은 북쪽, 서쪽, 동쪽으로 이어지고, 메디나는 남쪽으로 뻗어 나간다.

tba:54:room:5406:
  name: 시장 광장 중앙
  description: 당신은 뉴탈로스의 유명한 시장 광장 중앙에 서 있다. 광장 한가운데에는 크고 기이한 모양의 동상이 서 있다. 광장은 모든 방향으로 뻗어 있다.
  extras:
  - text: >-
      당신 앞에 위대한 비호더의 동상이 있다. 여러 개의 눈과 악독한... 악독한... 음... 눈... 을 가진 위대한 짐승이다. 위대한 비호더의 상태는 매우 양호하다.

tba:54:room:5407:
  name: 동남쪽 시장 광장
  description: >-
    시장의 이 구석에서는 이 땅에서 가장 큰 전사들이 당신보다 훨씬 크게 느껴진다. 근처에 무기점과 방어구점이 있다는 것을 알아차리면, 그들이 왜 여기 모이는지 쉽게 이해할 수 있다.
    아마도 이 상점들이 무엇을 제공하는지 구경하러 들러볼 수도 있겠다.

tba:54:room:5408:
  name: 남서쪽 시장 광장
  description:
  - >-
    시장의 이 구역은 비교적 조용해 보인다. 다만 상인들이 당신을 자기 가게로 끌어들이려 높은 목소리로 수다를 떨고 있을 뿐이다. 남쪽에는 빵 노점장이, 서쪽에는 잡화점 입구가 보인다.
  - 시장의 뻗어 나간 모습은 여기서 동쪽과 북쪽으로 이어진다.
  exits:
    south:
      look: 식료품 가게가 보인다.
    west:
      look: 잡화점이 보인다.

tba:54:room:5409:
  name: 서쪽 시장 광장
  description:
  - >-
    광장의 이 구역은 나머지 부분보다 좀 더 차분해 보인다. 대부분의 외지 모험가들이 시장의 남쪽 끝에서 어슬렁거리는 반면, 마을 사람들은 북쪽 끝에서 장사를 하는 듯하다.
  - 서쪽 큰길이 여기서 시작되어 성문으로 향하고, 시장의 광활한 모습은 나머지 방향으로 펼쳐져 있다.

tba:54:room:5410:
  name: 공동 광장
  description: >-
    사람들이 서로 이야기하며 지나가거나, 이 풀밭에서 지친 몸을 쉬고 있다. 남쪽을 통해 도시를 지나가는 강에서 나오는 희미한 소리가 들린다. 이슈타르 대로는 여기서 동서 방향으로
    뻗어 있고, 메디나는 북쪽에 있다. 남쪽에는 이슈타르 강 다리과 남쪽 성문이 있다.
  exits:
    north:
      look: 메디나가 보인다.
    south:
      look: 강 위 다리가 보인다.

tba:54:room:5411:
  name: 뉴탈로스 남쪽 성문 밖
  description:
  - >-
    당신은 눈앞에 펼쳐진 동쪽 대사막을 본다. 당신은 대자, 옛 탈로스의 유실된 도시, 그리고 사막 아래에 누워 있는 친절한 황동 용에 관한 많은 이야기를 들어 왔다.
  - 남쪽에는 사막이, 뉴탈로스 도시는 북쪽에 있다.

tba:54:room:5412:
  name: 남쪽 다리
  description: 다리를 건너면 이슈타르 강의 거센 물결이 보인다. 남쪽으로는 뉴탈로스의 남쪽 문이 보이고, 북쪽으로는 공동 광장이 펼쳐져 있다.

tba:54:room:5413:
  name: 뉴탈로스 남쪽 문 안쪽
  description: >-
    거대한 석조 탑 두 기가 당신을 맞이하며, 화려하게 제작된 경첩에 매달린 거대한 철제 문이 열려 있다. 문에는 뉴탈로스의 문장이 새겨져 있다. 이 도시를 만든 자들은 방어 시설이나
    자택을 재건하는 데 아낌없이 돈을 썼다. 북쪽에는 이슈타르 강 다리가, 남쪽에는 사막이 있다.

tba:54:room:5414:
  name: 북서쪽 시장 광장
  description: >-
    시장의 이 구석에는 뉴탈로스에서 가장 문명화된 사람들이 모인다. 북쪽에는 상인 아킴의 겸손한 상점이 있는데, 그의 직조품은 이 도시에서 최고로 꼽힌다. 이곳 서쪽에는 뉴탈로스
    제1 왕립 은행의 입구가 있다.

tba:54:room:5415:
  name: 북쪽 시장 광장
  description: 당신은 이 도시에서 가장 붐비는 곳 중 하나에 서 있다. 북쪽에는 뉴탈로스의 궁전과 카스바가 있으며, 이곳의 동쪽, 서쪽, 남쪽에는 활기찬 시장이 번성하고
    있다.

tba:54:room:5416:
  name: 북동쪽 시장 광장
  description: >-
    혼란. 대혼란. 광기. 이 시장의 구석에 시선을 던지자 머릿속에 몇 가지 더한 단어가 떠오른다. 채소 가게는 꽤 조용해 보이니 소음이 정육점에서 나오는 거라 짐작할 수밖에 없다.
    이 가게에 들어갈 용기를 내기까지 꽤 오래 생각해야 했다. 시장은 남쪽과 서쪽으로 이어진다.

tba:54:room:5417:
  name: 동쪽 시장 광장
  description: >-
    당신은 사막의 보석인 뉴탈로스의 시장에 서 있다. 시장은 이 도시의 중심이며, 모든 중요한 거래와 상거래가 여기서 이루어진다. 시장은 동쪽을 제외한 모든 방향으로 펼쳐져 있으며,
    여기서는 큰길이 동쪽 성문으로 이어진다.

tba:54:room:5418:
  name: 술탄의 길
  description: 이 자갈길은 마을을 가로지르는 여정을 돕는다. 북쪽으로 가면 술탄의 궁전과 춤추는 악마 여관을 지나게 되고, 남쪽으로 가면 시장 광장에 닿는다.

tba:54:room:5419:
  name: 술탄의 길
  description:
  - >-
    이 길의 이 부분은 궁전의 견고한 벽과 춤추는 악마 여관 사이를 지나간다. 동쪽으로는 작은 창문을 통해 여관 안을 들여다보니 많은 사람들이 춤추고 술을 마시는 것이 보인다. 다른
    용무를 마친 후 여관을 방문할 계획이다.
  - 이 길은 여기서부터 북쪽과 남쪽으로 이어진다.

tba:54:room:5420:
  name: 술탄의 길
  description: >-
    궁전과 춤추는 악마 여관 사이의 이 길은 말과 수레, 그리고 가죽 부츠의 발걸음으로 인해 닳아 보인다. 서쪽에서 어떤 공작이나 공작부인이 궁전에 도착했음을 알리는 나팔 소리가
    희미하게 들려온다. 동쪽의 악마 여관 홀에서는 안전한 쉼터가 당신을 기다리고 있으며, 술탄의 길은 북쪽과 남쪽으로 이어진다.

tba:54:room:5421:
  name: 술탄의 길
  description: >-
    광장 북쪽의 큰길이 여기까지 이어지며, 궁전과 악마 여관의 벽에 둘러싸여 있다. 북쪽에는 경비병이 철저히 지키는 문이 보이고, 남쪽에서는 희미한 상거래 소리가 들린다.

tba:54:room:5422:
  name: 뉴탈로스 북문 내부
  description:
  - >-
    두 개의 거대한 석조 탑이 당신을 맞이하며, 그 사이로 뉴탈로스의 문장이 새겨진 화려하게 제작된 경첩에 달된 거대한 철문이 열려 있다. 이 도시를 만든 자들은 자국의 방어 시설을
    재건하는 데 아낌없이 비용을 들였다.
  - 술탄의 길은 남쪽으로 뻗어 있고, 카스바는 동서로 펼쳐져 있다. 북쪽으로는 황야가 이어진다.

tba:54:room:5423:
  name: 뉴탈로스 서문 내부
  description:
  - >-
    벽에 박혀 있는 두 개의 거대한 석조 탑이 당신을 우뚝 내려다본다. 뉴탈로스의 문장이 새겨진 거대한 철문은 네 개의 화려하게 제작된 경첩에 쉽게 열리고 닫힌다. 이 도시를 만든
    자들이 자국을 보호하는 데 아낌없이 비용을 들였음이 분명하다.
  - 큰길은 동쪽의 시장으로 이어지고, 서쪽에서는 황야가 당신을 부른다. 남쪽에는 전사 길드의 입구가 있다.

tba:54:room:5424:
  name: 서쪽 큰길
  description: 이곳은 도시를 관통하는 주요 도로이다. 남쪽에서는 수리 공방의 망치 소리가 들리고, 북쪽에는 신전 광장으로 알려진 풀밭이 있다. 큰길은 동쪽과 서쪽으로 이어진다.

tba:54:room:5425:
  name: 서쪽 큰길
  description: >-
    현장 책임자가 여기 서서 구멍 난 도로를 수리하는 두 명의 건설 노동자를 감독하고 있다. 이 도로에서는 시장 상점 뒤로 이어지는 북쪽과 남쪽의 골목으로 갈라진다. 큰길은 여기서
    동쪽과 서쪽으로 계속 이어진다.

tba:54:room:5426:
  name: 서쪽 큰길
  description: >-
    당신은 은행과 잡화점 사이의 거리를 산책하고 있다. 서쪽에서는 도로 작업반의 소리가 들리고, 동쪽에서는 상거래가 이루어지는 소리가 들린다. 공기에는 금과 부의 냄새가 가득하다.
    상점 벽에는 포스터가 붙어 있다.
  extras:
  - text: '포스터에는 붉은 옷을 입은 부유해 보이는 남자가 당신에게 웃고 있다. 캡션에는 이렇게 적혀 있다: 술탄이 당신에게 세금을 내라고 상기시킨다!'

tba:54:room:5427:
  name: 동쪽 큰길
  description: 동쪽 큰길 이곳에서는 갓 도살한 고기의 냄새가 나고, 방어구점에서 새 금속을 두드리는 소리가 들린다. 서쪽에는 광장이, 동쪽에는 교차로가 있다.

tba:54:room:5428:
  name: 동쪽 큰길
  description: >-
    당신은 동쪽 큰길에 서 있다. 북쪽으로는 길드맨 로의 시작 부분이 보인다. 남쪽으로는 어두운 골목이 있다. 길은 동쪽으로도 이어진다. 교차점에 걸린 철사 위에 작은 표지판이 하나
    매달려 있다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다:'
    - 노숙 금지!
    - (뉴탈로스의 술탄 명령에 의함)

tba:54:room:5429:
  name: 동쪽 큰길
  description:
  - >-
    당신이 용병 길드 옆을 지나갈 때, 차가운 기운이 몰려와 몸이 통제할 수 없이 떨린다. 이 '유용한' 사람들의 집 입구 근처에서 수상한 인물들이 어슬렁거리는 것이 보인다. 호기심이
    이기겠지만, 안에 무슨 일이 벌어지고 있을지 궁금해진다. 북쪽으로는 약재 상점의 열린 문이 보인다. 그곳에서는 많은 마법 물약을 살 수 있다.
  - 큰길이 여기서 동서로 이어진다.

tba:54:room:5430:
  name: 동쪽 큰길
  description: >-
    뉴탈로스 동쪽을 지나는 큰길이 여기서 시작되어 서쪽 시장으로 이어진다. 동쪽으로는 주요 성문 중 하나가 보이고, 북쪽으로는 브라힘의 마법 상점이 당신의 방문을 기다리고 있다.

tba:54:room:5431:
  name: 뉴탈로스 동쪽 성문 안쪽
  description:
  - >-
    벽에 박힌 두 개의 거대한 석조 탑이 당신을 우두커니 내려다본다. 뉴탈로스의 문장이 새겨진 거대한 철제 성문은 정교하게 만들어진 네 개의 경첩 위에서 쉽게 열리고 닫힌다. 이
    도시의 건설자들이 자기의 집을 지키기 위해 비용을 아끼지 않았음이 분명하다.
  - 큰길이 서쪽 시장으로 이어지고, 동쪽에서는 황야가 부른다. 북쪽으로는 마법사 길드의 입구가 있다.

tba:54:room:5432:
  name: 카산드라의 오늘의 수확
  description: 당신의 삶에서 이 폐를 가득 채우는 냄새를 감당할 준비를 해 본 적이 없다. 아름다운 상인을 실망시키고 싶지 않아 입을 다물고 조용히 그녀의 진열물을 둘러본다.

tba:54:room:5433:
  name: 서쪽 이슈타르 대로
  description: >-
    여기는 뉴탈로스의 창고 지구이다. 거대한 상자를 들고 부두와 창고를 오가는 힘센 남자들 사이로 배들이 강을 따라 내리며 짐을 싣고 내린다. 북쪽에는 창고의 입구 중 하나가 있고,
    서쪽 이슈타르 대로는 동쪽으로 이어진다.

tba:54:room:5434:
  name: 서쪽 이슈타르 대로
  description: >-
    배에 짐을 싣고 내리는 일을 하느라 바쁜 몇몇 남자들이 당신을 거의 밀치다시피 지나간다. 북쪽에는 뉴탈로스의 거대한 창고 중 하나의 입구가 있고, 남쪽에서는 이슈타르 강이 조용히
    흐른다. 이슈타르 대로는 동서로 이어진다.

tba:54:room:5435:
  name: 서쪽 이슈타르 대로
  description:
  - >-
    자갈길은 여기가 축축하다. 물자국이 배로 내려가는 경사로 쪽으로 이어져 있다. 미끄러운 보도 위에서 중심을 잡으려다 미끄러질 뻔하자, 누군가 편리하게 설치해 둔 손잡이를 붙잡는다.
  - 북쪽에는 배조공방이 있고, 이슈타르 대로는 동서로 이어진다.

tba:54:room:5436:
  name: 서쪽 이슈타르 대로
  description: >-
    이슈타르 강에서 불어오는 서늘한 바람이 피부에 맺힌 땀을 식혀 준다. 서쪽 창고 방향에서 지시하는 소리와 때로는 욕설이 들려온다. 동쪽으로는 공동 광장이 열려 있고, 서쪽으로는
    이슈타르 대로가 이어진다.

tba:54:room:5437:
  name: 동쪽 이슈타르 대로
  description:
  - >-
    당신이 대장장이 앞에 서자, 큰 망치 두드리는 소리와 물에 식는 달궈진 철의 소리가 귀에 들어온다. 큰 눈을 가진 소년이 당신에게 달려와 시선을 마주치자 도로를 따라 도망쳐 간다.
  - 서쪽으로는 공동 광장이 보이고, 동쪽으로는 이슈타르 대로가 이어진다.

tba:54:room:5438:
  name: 동쪽 이슈타르 대로
  description: 마을 남쪽을 따라가는 넓은 도로는 여기서 동서로 이어지며, 북쪽으로는 짚 창고, 남쪽으로는 이슈타르 강으로만 둘러싸여 있다.

tba:54:room:5439:
  name: 동쪽 이슈타르 대로
  description: >-
    땅에 흩뿌려진 작은 짚 뭉치들이 당신이 마구간에 도착했음을 알려 준다. 아라비아 말과 다른 여러 품종의 좋은 말들을 대가로 구매할 수 있다. 이슈타르 대로는 동서로 이어진다.

tba:54:room:5440:
  name: 동쪽 이슈타르 대로
  description: >-
    낮에 이렇게 밝은데도 여기서 시작해 북쪽으로 이어지는 뒷골목 안쪽은 거의 보이지 않는다. 그쪽에서 시끄러운 취객들의 소리와 가끔씩 비명 지르는 고양이 소리가 들려온다. 다행히
    대로변을 동쪽이나 서쪽으로 갈 수도 있다.
  exits:
    north:
      look: 흐릿한 어둠이 보인다.

tba:54:room:5441:
  name: 동쪽 이슈타르 대로
  description: >-
    당신의 날카로운 후각이 당신에게 물고기 시장 입구에 도달했음을 알려준다. 신선한 어획물과 다양한 수산 진미로 유명하지만, 이 냄새를 얼마나 더 참을 수 있을지 의문이 든다. 이슈타르
    강이 남쪽으로 흐르고, 대로는 강을 따라 동서 방향으로 뻗어 있다.

tba:54:room:5442:
  name: 동쪽 이슈타르 대로
  description: >-
    비명을 지르는 갈매기 소리와 썩어가는 물고기 냄새가 당신의 위치를 짐작하게 한다. 이슈타르 강이 당신 남쪽에 흐르지만, 물은 결정처럼 맑아 이 악취의 원천이 될 수 없다. 북쪽을
    바라보니 쓰레기장 위에 작은 간판이 걸려 있는 것을 발견한다.

tba:54:room:5443:
  name: 보트 램프
  description: >-
    이 기울어진 돌판은 이슈타르 강으로의 왕래를 쉽게 해준다. 배들이 도크에 정박해 있고, 창고와 술집에서 돌아오는 주인들을 기다리고 있다. 이슈타르 강의 물결이 남쪽에서 당신의
    발끝을 적시고, 이슈타르 대로는 북쪽에 있다.

tba:54:room:5444:
  name: 서쪽 카스바
  description: >-
    뉴탈로스 감옥 입구 앞에 서니 공기가 무겁게 변한다. 이 건물의 안쪽을 볼 일은 절대 없기를 바란다. 북서쪽에는 나선형 계단이 올라가는 탑이 서 있다. 이 거리(아베뉴)는 여기서
    끝나며, 동쪽 방향으로만 나 있다.

tba:54:room:5445:
  name: 서쪽 카스바
  description:
  - >-
    이 방향으로 거리가 거의 끝나는 지점이다. 이 동네의 경비병 수는 거의 두 배로 늘었다. 북쪽으로는 익숙한 성벽이 황야로부터 당신을 보호한다. 남쪽을 보면 거대한 흰 기둥으로
    둘러싸인 시의회 건물 입구로 이어지는 대리석 계단이 올라가 있다.
  - 이 거리(아베뉴)는 여기서 동서 방향으로 이어진다.

tba:54:room:5446:
  name: 카스바
  description:
  - 궁전 벽이 여기서 남쪽으로 휘어지며, 그 방향으로 어두운 골목이 이어진다. 서쪽으로는 시의회 건물의 계단이 보이고, 경비병 수가 늘어난 것을 알아챌 수 있다.
  - 동쪽으로는 이 거리(아베뉴)가 이어진다.

tba:54:room:5447:
  name: 카스바
  description: >-
    시의회 건물 쪽으로 길을 따라 가며, 성벽을 따라 순찰하며 경계를 서는 경비병들을 올려다본다. 남쪽에는 궁전의 웅장한 성벽이 서 있고, 이 거리(아베뉴)는 동서 방향으로 이어진다.

tba:54:room:5448:
  name: 카스바
  description: 자갈길은 여기 북쪽 벽을 따라 이어진다. 남쪽에는 궁전의 거대한 벽이 서 있고, 대로가 동서로 뻗어 있다.

tba:54:room:5449:
  name: 카스바
  description: >-
    여기서 벌어지는 움직임은 혼란스럽기 그지없다. 어린 소년들이 엄숙한 표정으로 이리저리 뛰어다니고, 나이가 든 신사들은 도서관 쪽으로 거리를 거만하게 거닌다. 서쪽으로는 북쪽 성문의
    높은 탑들이 보이며, 대로는 동쪽으로 이어진다.

tba:54:room:5450:
  name: 카스바
  description:
  - >-
    자갈길을 따라 걷다 보면, 당신을 우뚝 솟아 바라보는 도시의 벽 덕분에 안정감을 느낀다. 금속이 돌에 긁히는 소리를 듣고 고개를 들자, 북쪽을 경계하는 크고 건장한 경비병이 보인다.
  - 동쪽에는 길드맨 로의 교차로가 있고, 서쪽으로는 걸어서 얼마 안 되는 거리에 북쪽 성문이 있다.

tba:54:room:5451:
  name: 카스바
  description: >-
    이 교차로에 도달하자 길드의 소란이 당신의 감각을 덮친다. 망치 두드리는 소리, 무두질한 가죽 냄새, 그리고 대장간에서 피어오르는 연기가 일제히 당신을 맞이한다. 대로는 여기서
    동서로 이어지고, 로는 남쪽으로 뻗어 있다.

tba:54:room:5452:
  name: 카스바
  description:
  - 당신은 도시의 단단한 석벽과 석공 길드의 벽 사이를 걷고 있다. 유모를 따라 나온 어린아이들이 도시의 안전 속에서 뛰어놀며 즐거워하고 있다.
  - 이곳에서 대로가 동서 방향으로 뻗어 있다.

tba:54:room:5453:
  name: 카스바
  description:
  - >-
    당신은 이 방향으로 대로의 끝부분에 거의 다다랐다. 도시의 북동쪽 모퉁이 방향으로 걸어가 보니, 이곳의 인구 밀도는 도시의 다른 지역보다 훨씬 낮다. 지팡이에 의지해 절뚝거리는
    몇몇 노인과 학업에 몰두한 젊은이들이 도서관으로 가는 이 길의 유일한 정기적인 통행객이다.
  - 이곳에서 대로는 동서 방향으로 이어진다.

tba:54:room:5454:
  name: 카스바
  description:
  - 대로는 여기서 끝나고 남쪽으로 꺾여 칼리 행거로 이어진다. 그 방향으로 가면 도시의 도서관과 웅장한 무도장에 도착할 수 있다.
  - 여기서 나선형 계단을 올라가면 성벽의 북동쪽 탑에 접근할 수 있다.

tba:54:room:5455:
  name: 칼리 행거
  description: >-
    이곳은 최근에 새로 추가된 도시의 작은 구역이다. 도시 도서관은 서쪽의 문을 통해 들어갈 수 있고, 카스바는 여기서 북쪽으로 조금 더 가면 시작된다. 칼리 행거와 무도장 입구는
    남쪽에 있다.

tba:54:room:5456:
  name: 칼리 행거
  description:
  - 짧은 로우(Row)는 뉴탈로스의 댄스홀 입구에서 갑자기 끝난다.
  - 홀의 입구는 서쪽에 있으며, 로우는 북쪽으로 이어진다.

tba:54:room:5457:
  name: 지하
  description: 좁은 통로는 북쪽과 남쪽으로 이어진다.

tba:54:room:5458:
  name: 골목
  description: 여기는 궁전과 시청 사이에 뻗어 있는 어두운 골목이다. 거미와 쥐를 좋아하지 않는 한, 여기엔 별다른 것이 없다.

tba:54:room:5459:
  name: 골목
  description: 골목은 여기서 끝난다.
  exits:
    down:
      look: 도로 위에 구멍을 덮고 있는 맨홀이 보인다.

tba:54:room:5460:
  name: 길드맨 거리
  description:
  - >-
    이 거리는 시장 광장 다음으로 번화한 곳이다. 뉴탈로스의 노동 계급 시민들의 모든 길드가 이 거리에 모여 있으며, 광장에서 판매되는 모든 물건이 여기서 만들어진다. 이 구간의
    서쪽에는 보이어/플레처 길드가, 동쪽에는 석공 길드가 있다.
  - 거리는 남쪽으로 이어지며, 북쪽에는 동 카스바가 있다.

tba:54:room:5461:
  name: 길드맨 거리
  description: 여기서도 길드들이 이어진다. 서쪽에는 직공 길드가, 동쪽에는 장인 길드가 있다. 길드 거리는 여기서부터 북쪽과 남쪽으로 계속된다.

tba:54:room:5462:
  name: 길드맨 거리
  description:
  - 이 구간의 거리에는 가죽공 길드 하나만 서쪽에 문을 열고 있다. 동쪽에는 대신들의 박물관으로 들어갈 수 있는 아름답게 조각된 대리석 문이 있다.
  - 길드 거리는 북쪽과 남쪽으로 이어진다.

tba:54:room:5463:
  name: 길드맨 거리
  description:
  - 길드들이 지어진 후, 도시의 사람들은 여분의 공간 일부를 이용해 그들의 수호성인을 위한 신전을 세웠다. 이 노고의 결과물이 대신들의 박물관이 되었다.
  - 당신은 동쪽의 신성한 홀로 들어갈 수 있다.

tba:54:room:5464:
  name: 길드맨 거리
  description:
  - 이 좁고 비좁은 길은 길드에 입문한 수련생들이 길드 하우스에서 시장 광장의 상점까지 상품을 실어 나르며 마모되어 있다.
  - 길드 하우스는 북쪽에, 큰길은 남쪽이다.

tba:54:room:5465:
  name: 골목
  description: 당신의 빛이 있어도 이 골목을 덮고 있는 마법의 어둠을 뚫어내지 못하는 것 같다.

tba:54:room:5466:
  name: 골목
  description: 당신의 빛이 있어도 이 골목을 덮고 있는 마법의 어둠을 뚫어내지 못하는 것 같다.

tba:54:room:5467:
  name: 골목
  description: 당신의 빛이 있어도 이 골목을 덮고 있는 마법의 어둠을 뚫어내지 못하는 것 같다.

tba:54:room:5468:
  name: 골목
  description: 당신의 빛이 있어도 이 골목을 덮고 있는 마법의 어둠을 뚫어내지 못하는 것 같다.

tba:54:room:5469:
  name: 골목
  description: 이곳은 골목 안의 작은 구석이다. 사당 벽이 북쪽과 서쪽에 있다. 동쪽으로는 꽤 많은 발자국이 보인다.
  extras:
  - text: 여기 야티가 다녀간 것 같은데... 음.

tba:54:room:5470:
  name: 골목
  description: 이곳은 작은 골목의 막다른 길이다. 바닥에 비정상적인 마모가 보인다.
  exits:
    down:
      look: 바닥에 박혀 있는 작은 철제 고리가 보인다.

tba:54:room:5471:
  name: 골목
  description: >-
    당신은 사당과 은행 사이의 작은 골목에 있다. 남쪽에서 소란스러운 소리와 도로 공사가 진행되고 있는 소리가 들린다. 바닥은 거칠고 수리가 필요하다. 도로 한가운데 작은 웅덩이가
    있다.
  extras:
  - text: 왜 웅덩이를 보고 있는 거야? 가난해서 그래?

tba:54:room:5472:
  name: 골목
  description: 당신은 수리점과 잡화점 사이의 작은 골목에 있다. 여기에는 작은 설치류와 먼지 말고는 별다른 것이 없다.

tba:54:room:5473:
  name: 골목
  description: 여기는 창고와 전사 길드 뒤쪽 골목의 작은 구석이다. 서쪽 바닥에 작은 긁힌 자국들이 보인다.

tba:54:room:5474:
  name: 골목
  description: 골목은 여기서 끝난다. 아까 눈에 띄었던 발자국도 여기서 끊긴다.
  exits:
    down:
      look: 땅에 박혀 있는 작은 원형 철판이 보인다.

tba:54:room:5475:
  name: 지하
  description: 당신은 도시 아래에 있는 작은 지하 통로 안에 있다. 위쪽에서 작은 빛이 반짝이는 것이 보이고, 통로는 남쪽으로 이어진다.

tba:54:room:5476:
  name: 지하
  description: 통로는 북쪽과 남쪽으로 이어진다.

tba:54:room:5477:
  name: 지하
  description: 터널은 여기서 북쪽, 동쪽, 서쪽으로 갈라진다.

tba:54:room:5478:
  name: 지하
  description: 골목은 여기서 다시 꺾여 남쪽과 서쪽으로 이어진다. 위에서 작은 빛이 반짝이는 것을 발견한다.

tba:54:room:5479:
  name: 지하
  description: 통로는 여기서 끝난다. 서쪽에서 낮은 주문을 외우는 소리가 들린다. 바닥에 먼지가 쓸려 나간 자국이 보이지만, 그 방향으로 문은 찾을 수 없다.

tba:54:room:5480:
  name: 지하
  description: 좁은 통로는 여기서부터 북쪽과 남쪽으로 이어진다.

tba:54:room:5481:
  name: 지하
  description: 좁은 통로는 여기서부터 북쪽과 동쪽으로 뻗어 있다. 당신 머리 위 도시에서 나는 소리가 들린다.

tba:54:room:5482:
  name: 지하
  description: 터널은 여기서부터 서쪽과 동쪽으로 이어진다. 다행히 방향 감각이 좋기를 바란다.

tba:54:room:5483:
  name: 이슈타르 강
  description: >-
    당신 머리 위 높은 성벽 꼭대기에 있는 경비병들이 당신이 물길을 통해 도시를 빠져나가려는지 내려다보고 있다. 그러려면 경비병들이 당신 앞에 있는 철제 격자를 위에서부터 열어야
    한다. 쓰레기장에서 나는 역겨운 냄새가 해안에서 아래로 내려온다.

tba:54:room:5484:
  name: 이슈타르 강
  description: >-
    강의 잔잔한 흐름이 당신을 동쪽으로 데려간다. 고개를 들면 도로를 따라 산책하는 연인들을 볼 수 있다. 서쪽에는 남쪽 다리가, 동쪽에는 원치 않는 손님을 막기 위해 도시를 지키는
    철제 격자가 보인다.

tba:54:room:5485:
  name: 이슈타르 강
  description: >-
    위쪽 다리 아래로 떠내려가며 당신의 목소리가 울려 퍼지는 소리가 들린다. 도시 건설 작업반이 최근 일반 시민들이 강에 쉽게 접근할 수 있도록 작은 사다리를 막 완성했다. 서쪽과
    동쪽으로는 도시를 따라 흐르는 강이 보인다.

tba:54:room:5486:
  name: 이슈타르 강
  description: >-
    이 강 구간은 활동으로 가득 차 보인다. 여기서 북쪽에 있는 램프 근처 부두에 정박한 배들 때문에 항해가 다소 까다로워진다. 강이 동쪽으로 흐르는 방향을 따라가면 그쪽으로 남쪽
    다리가 보인다.

tba:54:room:5487:
  name: 이슈타르 강
  description: 강은 야생에서 도시를 관통하는 거대한 철제 격자를 통해 흐른다. 위쪽의 무장한 경비병들은 시민이 출입을 필요로 할 경우 포털을 열라는 명령을 기다리고 있다.

tba:54:room:5488:
  name: 어두운 통로
  description: 당신은 손으로 만든 작은 통로에 들어온 것 같다. 서쪽 벽이 어딘가 이상해 보이지만, 아무리 살펴봐도 비밀 문은 없다. 유일한 출구는 동쪽인 것 같다.

tba:54:room:5489:
  name: 어두운 통로
  description: 작은 통로는 여기서 동서로 이어진다. 이번에는 북쪽 벽에서 또다시 특이한 점을 느끼지만, 비밀 문을 찾지는 못한다. 북쪽에서 희미하게 목소리가 들린다.

tba:54:room:5490:
  name: 어두운 통로
  description: 작은 통로는 여기서 서동으로 이어진다.
  extras:
  - text: 거대한 바위가 여기 서 있다. 그 중앙에는 누군가가 완벽한 원형의 구멍을 파 놓았다.

tba:54:room:5491:
  name: 어두운 통로
  description: >-
    작은 통로는 아무 이유 없이 여기서 끝난다. 주위를 둘러보니 흙에 반쯤 묻힌 작은 사다리를 발견한다. 사다리를 세우니 천장에 비밀 문이 있다. 통로는 여기서 서쪽으로 이어진다.
  extras:
  - text: >-
      가까이 다가가 보니 이 불은 실제로 얼어붙어 있다. 불꽃은 여전히 열을 내뿜지만, 실제로 타오르는 것은 아니다. 주위를 살펴보니 불꽃 밑부분에 숯 조각 크기 정도의 작은 구멍이
      보인다.

tba:54:room:5492:
  name: 지하
  description: 좁은 통로가 서쪽과 동쪽으로 이어진다.

tba:54:room:5493:
  name: 지하
  description: 좁은 통로가 서쪽과 동쪽으로 이어진다.

tba:54:mob:5400:
  short: 길드장
  long: 당신의 길드장이 여기 서 있다.
  description: 고대 서적을 들여다보는 노인이 여기 있다.

tba:54:mob:5401:
  short: 길드장
  long: 당신의 길드장이 여기 서 있다.
  description: 보랏빛, 길게 흘러내리는 로브에 감싸인 중년 남자가 여기 명상하고 있다.

tba:54:mob:5402:
  short: 길드장
  long: 당신의 길드장이 여기 서 있다.
  description: 검은 로브를 입은 더 작은 남자가 여기 서서 당신을 훈련시키기를 기다리고 있다.

tba:54:mob:5403:
  short: 길드장
  long: 당신의 길드장이 여기 서 있다.
  description: >-
    작은 체구의 인간이 검은 옷을 입고 구석에 앉아 있다. 당신이 들어오자 그는 칼을 집어 당신에게 던진다. 칼은 당신의 왼쪽 귀 옆 벽에 꽂힌다. 그가 하는 말은 '자, 이제 시작하자'뿐이다.

tba:54:mob:5404:
  short: 접수원
  long: 어두운 피부색의 베일을 쓴 여자가 데스크 뒤에서 당신을 맞이한다.
  description: 이 아라비아의 미녀는 분명 고위 관리의 딸이다. 베일 아래를 몰래 엿보려 하자 왼쪽 볼에 작은 달 모양의 선천적 반점이 있는 것을 알아채게 된다.

tba:54:mob:5405:
  short: 늙고 시든 남자
  long: 늙고 시든 남자가 바에 기대어 있다.
  description: 그는 정신이 없는 듯 보이지만, 다섯 잔의 음료를 동시에 따르는 동안 실수 없이 처리한다.

tba:54:mob:5407:
  short: 구걸자
  long: 구걸자가 여기 쉬고 있다.
  description: 작고 마른 남자가 따뜻한 마음을 가진 사람을 만나기를 바라며 여기 쉬고 있다.

tba:54:mob:5408:
  short: 구걸자
  long: 구걸자가 여기 쉬고 있다.
  description: 여기에는 가늘고 마른 남자가 앉아 당신의 옷을 뚫어지게 바라보고 있다.

tba:54:mob:5409:
  short: 거지
  long: 더러운 거지가 여기 더러운 곳에 앉아 있다.
  description: 이 불쌍한 영혼은 운이 나빠 보인다. 혹시 동전 하나 건네줄 수 있지 않겠나?

tba:54:mob:5410:
  short: 제빵사
  long: 제빵사가 여기 서서 홀덤을 하고 있다.
  description: 머리부터 발끝까지 밀가루로 뒤덮인 흰 앞치마를 입은 거대한 남자가 보인다.

tba:54:mob:5411:
  short: 상점 주인
  long: 상점 주인이 여기 서 있다.
  description: 반엘프가 계산대 뒤의 스툴에 앉아 있다.

tba:54:mob:5412:
  short: 은행원
  long: 은행원이 여기 서서 당신을 도울 준비를 하고 있다.
  description: 이 작은 하프링은 돈을 세는 데 능숙해 보인다.

tba:54:mob:5413:
  short: 재봉사 아킴
  long: 재봉사 아킴이 당신을 그의 가게로 맞이한다.
  description: 이 중년 남자는 당신을 비웃는 눈빛으로 훑어보며 서둘러 새로운 옷장을 제안한다.

tba:54:mob:5414:
  short: 채소 장수 베라
  long: 당신이 그녀의 노점을 둘러보며 바라보자, 채소 장수 베라가 환하게 웃는다.
  description: 키가 크고 마른 여자가 당신 앞에 서서 활짝 웃고 있다.

tba:54:mob:5415:
  short: 육류 도축공 버치
  long: 육류 도축공 버치가 피로 얼룩진 앞치마를 걸치고 여기 서 있다.
  description: 이 건장한 난쟁이는 눈빛에 광기가 서려 있으며, 그의 재치 있는 도구를 아무렇지 않게 공중으로 빙글빙글 돌리고 있다.

tba:54:mob:5416:
  short: 갑옷 장인 압둘
  long: 압둘이 여기 서서 당신을 도울 준비를 하고 있다.
  description: 압둘이 흔들림 없는 눈빛으로 당신을 응시한다. 그의 차가운 시선 아래 당신은 빠르게 시선을 돌리고 주문을 한다.

tba:54:mob:5417:
  short: 무기 장인 이고르
  long: 이고르가 여기 서서... 무언가를 하고 있다.
  description: 왼쪽 어깨에 큰 혹이 난 작은 난쟁이가 보인다.

tba:54:mob:5418:
  short: 카산드라
  long: 카산드라가 자신의 선택품 위에 자부심을 느끼며 서 있다.
  description: >-
    당신은 바람에 상한 기색이 역력한, 그러나 행복한 얼굴을 본다. 그 주름은 넓은 바다에서 보낸 많은 세월을 암시한다. 그녀는 낚시를 통해 수년간 쌓은 경험 덕분에 공기 중에 퍼진
    냄새를 견딜 수 있다.

tba:54:mob:5419:
  short: 현장감독
  long: 현장감독이 여기 서서 일꾼들에게 소리치고 있다.
  description: 걱정스러운 표정의 일하는 난쟁이가 여기 서서 계속 노트에 메모를 하고 시계를 보고 있다.

tba:54:mob:5420:
  short: 건설 노동자
  long: 건설 노동자가 여기에서 꾸준히 일하고 있다.
  description: 땀에 젖어 보이는 거대한 남자가 당신의 시선에도 아랑곳없이 일만 하고 있다.

tba:54:mob:5421:
  short: 브라흐만 동상
  long: 브라흐만 동상이 여기 서 있다.
  description: 단단한 대리석으로 만들어진 동상은 위대한 신이 마법 전투에서 시바를 물리치는 모습을 묘사하고 있다.

tba:54:mob:5422:
  short: 시바의 동상
  long: 시바의 동상이 여기 서 있다.
  description: 파괴의 대주군의 동상이 여기 서 있으며, 브라흐만이 마법 전투를 벌이고 있다.

tba:54:mob:5423:
  short: 인드라의 동상
  long: 인드라의 동상이 여기 서 있다.
  description: 이 동상은 거대한 코끼리처럼 보인다.

tba:54:mob:5424:
  short: 야마의 동상
  long: 야마의 동상이 여기 서 있다.
  description: 이것은 사신의 동상이다. 기이한 룬 문자로 뒤덮여 있다.

tba:54:mob:5425:
  short: 수리야의 동상
  long: 수리야의 동상이 여기 서 있다.
  description: 태양을 관장하는 신인 수리야의 동상은 불타오르는 기운으로 거의 빛나는 듯하다.

tba:54:mob:5426:
  short: 칼리의 동상
  long: 칼리의 동상이 여기 서 있다.
  description: 검은 어머니 칼리의 동상은 검은 대리석으로 만들어졌으며 은빛 룬으로 덮여 있다.

tba:54:mob:5427:
  short: 브리하스파티의 동상
  long: 브리하스파티의 동상이 여기 서 있다.
  description: 학자와 지혜의 신 브리하스파티의 동상은 풍화된 대리석으로 만들어졌다.

tba:54:mob:5428:
  short: 푸샨의 동상
  long: 푸샨의 동상이 여기 서 있다.
  description: 여행자의 신 푸샨의 동상은 먼지가 덮여 있고 마모되어 마치 먼지 낀 길로 길게 끌려온 것처럼 보인다.

tba:54:mob:5429:
  short: 아지즈
  long: 인간 대포 아지즈가 여기 서 있다.
  description: 크고 거친 이 남자는 검을 뽑으며 당신에게 웃어 보인다.

tba:54:mob:5430:
  short: 무스타파
  long: 인간 강도 무스타파가 여기 서 있다.
  description: 이 남자는 날씬하고 얼굴에 악의적인 미소를 짓고 있다.

tba:54:mob:5431:
  short: 파티마
  long: 엘프 소환사 파티마가 여기 서 있다.
  description: 이 엘프 여성은 어두운 피부색과 검은 머리를 하고 있다. 엘프에게서 흔히 볼 수 없는 조합이다.

tba:54:mob:5432:
  short: 카림
  long: 드워프 용병 카림이 여기 서 있다.
  description: 이 단단한 체구의 남자는 배럴만큼 두꺼운 가슴을 하고 있다.

tba:54:mob:5433:
  short: 유목 상인
  long: 유목 상인이 당신을 훑어본다.
  description: 이 건장한 남자는 미소로 당신의 시선을 받아내지만, 마음속 어딘가에서는 그를 깊이 신뢰하지 말라고 경고한다.

tba:54:mob:5434:
  short: 술탄의 경호원
  long: 경호원이 당신을 훑어본다.
  description: 거대한 반오르크가 당신을 빠르게 훑어본 뒤 제 업무로 돌아간다.

tba:54:mob:5435:
  short: 마른 아이
  long: 마른 아이가 이리저리 돌아다닌다.
  description: 작은 아이가 당신을 쳐다보는 것을 알아채고 빠르게 시선을 돌린다.

tba:54:mob:5436:
  short: 부두 노동자
  long: 힘센 부두 노동자가 상자를 옮기며 지나간다.
  description: 어딘가 둔해 보이지만, 이 거대한 체구의 남자는 배에서 내린 거대한 상자를 백합 한 상자를 옮기듯 운반한다.

tba:54:mob:5437:
  short: 세무관
  long: 작은 남자가 노트에 뭔가를 끄적이며 돌아다닌다.
  description: 도시의 세무관이 술탄의 웅장한 도시에서 살기 위한 세금을 걷기 위해 가게를 돌아다닌다.

tba:54:mob:5438:
  short: 고드
  long: 도적 고드가 여기 서 있다.
  description: 고드는 무죄인 척하며 여기저기 돌아다닌다. 그는 처참하게 실패하여 주위 사람들이 지갑을 조심스럽게 지키게 만든다.

tba:54:mob:5439:
  short: 쿨핀
  long: 기사 쿨핀이 여기 서 있다.
  description: 이 큰 체구의 남자는 당신의 접근에 놀라는 기색이 없이 당신을 의아한 눈빛으로 바라본다.

tba:54:mob:5440:
  short: 다그다
  long: 대마법사 다그다가 여기 서 있다.
  description: 이 남자는 긴 갈색 로브를 입고 있으며 꿰뚫어 보는 듯한 눈빛을 하고 있다.

tba:54:mob:5441:
  short: 커리 그린리프
  long: 커리 그린리프가 여기 서 있다.
  description: 커리는 자신의 이름을 붙여준 그 머리카락을 끊임없이 만지작거린다.

tba:54:mob:5442:
  short: 떠돌이 예언자
  long: 머리카락이 하얀 작은 체구의 남자가 돌아다니며 복음을 외친다.
  description: 이 불쌍한 인간은 전생에 전도자였을지도 모른다. 그는 구석에 서서 지나가는 행인들에게 종말을 예고하는 설교를 퍼붓는 것으로 유명하다.

tba:54:mob:5443:
  short: 골목 고양이
  long: 위험하지 않은 작은 고양이 한 마리가 먹이를 찾고 있다.
  description: 배가 고픈 작은 고양이가 보인다.

tba:54:mob:5444:
  short: 독수리
  long: 독수리 한 마리가 당신 머리 위에서 원을 그리며 날고 있다.
  description: 당신이 이 새를 올려다보니, 그것이 원하는 것은 시체뿐이라는 것이 보인다.

tba:54:mob:5445:
  short: 노인
  long: 노인 한 명이 여기 앉아 체스를 두고 있다.
  description: 그는 이기는 데 온 신경을 집중하고 있는 것 같다.

tba:54:mob:5446:
  short: 사서 루그
  long: 사서 루그가 책상 뒤에 앉아 있다.
  description: 누군가 질문을 하자 거대하고 거구의 몸이 일어난다.

tba:54:mob:5447:
  short: 먼지 악마
  long: 바람이 먼지를 날린다.
  description: 당신 앞에 보이는 것은 사실 공기 원소체의 아이다.

tba:54:mob:5448:
  short: 라미아
  long: 이상한 라미아가 다음 먹이를 기다리며 여기 서 있다.
  description: 이것은 아름다운 여성의 상반신을 가졌지만, 하반신은 네 발 달린 짐승인 생물이다. 그녀는 당신을 탐욕스럽게 바라보며 입술을 핥는다.

tba:54:mob:5449:
  short: 누더기 도르비스
  long: 누더기 도르비스가 여기 서 있다.
  description: 이 남자는 많이 쉬어야 할 것 같다.
