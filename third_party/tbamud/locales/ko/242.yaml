    사람들이 당신을 지나쳐 각자의 목적지로 서둘러 가고 있다.

tba:242:room:24212:
  name: 남서쪽 성문
  description: >-
    당신은 서쪽 성벽 옆, 남서쪽 성문 앞에 서 있다. 성문은 현재 올려져 있어 사람들이 자유롭게 드나들 수 있다. 흙먼지 이는 길이 남쪽으로 이어져 미덴니르 숲(고블린어로 '초록
    피'라는 뜻)으로 통한다. 동쪽으로는 여전히 도시가 보이지만, 남쪽으로 가면 신선한 공기와 초록빛이 기다린다.

tba:242:room:24213:
  name: 성벽길
  description: >-
    당신은 남쪽 성벽 옆을 걷고 있다. 성벽은 회반죽 같은 것으로 서로 붙여진 큰 회색 돌로 만들어져 있다. 오르기엔 너무 높다. 사람들이 당신을 지나쳐 목적지로 서두르고 있다.

