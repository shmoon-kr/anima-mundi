  description: >-
    당신은 미드가르드 컬링 클럽 커피숍 안에 있다. 동쪽 벽을 따라 둥근 나무 바가 놓여 있고, 그 뒤쪽에는 유리잔으로 덮인 테이블 여러 개와 큰 난로가 보인다. 테이블 열두 개쯤이
    손님을 기다리고 있다. 두꺼운 유리창 여러 개가 남쪽 거리를 내다볼 수 있게 되어 있다. 건물은 지진을 견디도록 지어진 것처럼 매우 단단해 보인다.

tba:242:room:24277:
  name: 관중석
  description: >-
    당신은 컬링 클럽 관중석의 가장 왼쪽 끝에 있다. 거대한 창문이 남쪽의 컬링 링크를 내려다보고 있다. 나무 의자 여러 개가 창문을 향해 줄지어 놓여 있다. 뒤쪽 벽에는 큰 게시판이
    붙어 있다. 게시판에는 포스터와 광고로 가득 차 있다. 벽 위쪽에는 난간이 설치되어 있다. 북쪽으로는 얼음판으로 이어지는 문이 나 있다.

