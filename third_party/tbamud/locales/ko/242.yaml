tba:242:room:24251:
  name: 분장실 복도
  description: >-
    당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.

tba:242:room:24252:
  name: 분장실 3
  description: >-
    당신은 3번 분장실에 있다. 방은 꽤 작으며, 북쪽 벽에는 화장대가, 동쪽 벽에는 작은 소파가 놓여 있다. 카운터 뒤 벽에는 전구로 둘러싸인 큰 거울이 걸려 있다. 문 옆에는
    다양한 옷과 무대 의상이 가득 담긴 의상 랙이 있다.

tba:242:room:24253:
  name: 좌측 통로
  description: 당신은 극장 왼쪽 통로 한가운데에 있다. 이제 무대가 바로 앞에 있고, 무대로 올라가는 계단이 몇 단 나 있다. 밝은 조명이 무대 전체를 비추어 꽤 환해 보인다.

tba:242:room:24254:
  name: 좌석
  description: 당신은 극장 객석에 있다. 좌석은 짙은 붉은색이고 감촉이 무척 부드럽다. 바로 앞에 무대가 보인다. 무대 불빛을 빼면 이곳은 완전히 깜깜하다.

tba:242:room:24255:
  name: 객석
  description: 당신은 극장 객석에 있다. 좌석은 짙은 붉은색이고 무척 푹신하다. 바로 앞에 무대가 보인다. 무대 불빛을 빼면 이곳은 완전히 캄캄하다.

tba:242:room:24256:
  name: 우측 통로
  description: >-
    당신은 극장의 오른쪽 통로 한가운데에 서 있다. 바로 앞에 무대가 있고, 무대로 올라가는 계단이 나 있다. 밝은 조명이 무대 전체를 비추어 무대가 꽤 환해 보인다.

tba:242:room:24257:
  name: 분장실 복도
  description: >-
    당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.

tba:242:room:24258:
  name: 분장실 2호
  description: >-
    당신은 2번 분장실에 있다. 3번과 4번 분장실보다 더 깔끔한 편이며, 북쪽 벽에는 화장대가, 동쪽 벽에는 크고 편안해 보이는 소파가 놓여 있다. 카운터 뒤 벽에는 전구로 둘러싸인
    큰 거울이 걸려 있다. 문 옆에는 다양한 옷과 무대 의상이 가득 담긴 의상 랙이 있다.

tba:242:room:24259:
  name: 무대 뒤
  description:
  - >-
    당신은 무대 뒤쪽에 서 있다. 벽은 검게 칠해져 있고, 이곳으로 이어지는 온갖 케이블과 밧줄이 보인다. 서쪽 무대의 대부분은 커다란 두꺼운 커튼에 가려져 있다. 여기저기 걸레,
    빗자루, 진공청소기 같은 도구 몇 개가 흩어져 있다. 북쪽 벽을 따라 의자 네 개가 줄지어 놓여 있다. 캣워크로 올라가는 검은 사다리가 보인다.
  - 무대 입구 옆에 걸린 표지판이 보인다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다:'
    - 조용히!

tba:242:room:24260:
  name: 무대 왼쪽
  description: >-
    당신은 무대 왼쪽 끝에 있다. 위에서 내리쬐는 조명에 눈이 부셔 시야가 일부 가려진다. 지금은 무대 세트가 설치되어 있지 않고, 당신 뒤로 거대한 커튼 하나만 걸려 있다. 바닥은
    단단한 나무로 되어 있어 걸을 때마다 살짝 삐걱거린다. 여기서 극장 전체가 한눈에 보인다. 커튼 사이로 난 틈을 지나 서쪽으로 가면 무대 뒤다.

tba:242:room:24261:
  name: 무대 중앙
  description: >-
    위에서 쏟아지는 조명에 눈이 부셔 앞이 잘 보이지 않는다. 현재 무대 세트는 설치되어 있지 않으며, 당신 뒤에는 거대한 커튼만이 드리워져 있다. 바닥은 단단한 나무로 되어 있어
    걸을 때마다 살짝 삐걱거리는 소리가 난다. 여기서 극장 전체가 보인다.

tba:242:room:24262:
  name: 무대 오른쪽
  description: >-
    당신은 무대 오른쪽 끝에 서 있다. 위에서 쏟아지는 조명에 눈이 조금 부시다. 지금은 세트가 하나도 설치되어 있지 않고, 당신 뒤에 거대한 커튼만 드리워져 있다. 바닥은 단단한
    나무로 되어 있어 걸을 때마다 살짝 삐걱거린다. 여기서는 극장 전체가 보인다. 커튼 사이로 난 틈을 지나 동쪽의 무대 뒤로 갈 수 있다.

tba:242:room:24263:
  name: 무대 뒤
  description:
  - >-
    당신은 무대 뒤쪽에 서 있다. 벽은 검게 칠해져 있고, 이곳으로 이어지는 온갖 케이블과 밧줄이 보인다. 서쪽 무대의 대부분은 커다란 두꺼운 커튼에 가려져 있다. 여기저기 걸레,
    빗자루, 진공청소기 같은 도구 몇 개가 흩어져 있다. 커다란 무대 의상 선반이 여기 놓여 있고, 선반의 걸이에 온갖 무대 의상이 걸려 있다. 분장실로 내려가는 문이 나 있다.
  - 무대 입구 근처에 걸린 표지판이 눈에 띈다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다:'
    - 조용히!

tba:242:room:24264:
  name: 분장실 복도
  description: >-
    당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 죽 분장실 문들이 보인다.

tba:242:room:24265:
  name: 1번 분장실
  description: >-
    당신은 1번 분장실 안에 있다. 모든 분장실 중에서도 가장 크고 좋은 곳이다. 동쪽 벽에 아름답게 조각된 나무 화장대가 놓여 있고, 그 위에는 거대한 거울이 서 있다. 문 옆에는
    푹신해 보이는 리클라이너 의자가 있고, 그 옆에는 잡지꽂이가 놓여 있다. 북쪽 벽 전체를 덮은 태피스트리 앞에 서류 캐비닛이 놓여 있다.

tba:242:room:24266:
  name: 검은 사다리
  description: >-
    당신은 캣워크로 올라가는 검은 금속 사다리 위에 있다. 사다리 가로대에는 물방울이 맺혀 미끄럽고, 손에 닿는 순간 녹 조각이 부스러져 떨어진다. 가로대는 금방이라도 내려앉을 것
    같다.

tba:242:room:24267:
  name: 캣워크
  description: >-
    당신은 사다리 꼭대기, 캣워크 위에 있다. 바닥은 강철 격자판으로 만들어졌고, 난간은 금속 막대로 설치되어 있다. 모든 것이 검게 칠해져 있다. 여기서는 무대가 아주 잘 보여,
    모든 것이 완벽하게 눈에 들어온다.

tba:242:room:24268:
  name: 캣워크
  description: >-
    당신은 극장 꼭대기의 캣워크 위에 있다. 바닥은 강철 격자로 되어 있고, 난간은 금속 막대로 만들어져 있다. 모든 것이 검게 칠해져 있다. 여기서는 무대가 한눈에 들어와 모든
    것이 완벽하게 보인다.

tba:242:room:24269:
  name: 캣워크
  description: >-
    당신은 극장 꼭대기의 캣워크 위에 있다. 바닥은 강철 격자판으로 되어 있고, 난간은 금속 막대로 만들어져 있다. 모든 것이 검게 칠해져 있다. 여기서는 무대의 모든 것이 완벽하게
    보여 전망이 아주 좋다.

tba:242:room:24270:
  name: 캣워크
  description: >-
    당신은 극장 꼭대기의 캣워크 위에 있다. 바닥은 강철 격자로 되어 있고, 난간은 금속 막대로 만들어져 있다. 모든 것이 검게 칠해져 있다. 이곳에서는 무대가 한눈에 들어와 모든
    것이 완벽하게 보인다.

tba:242:room:24271:
  name: 미드가르드 컬링 클럽 입구 홀
  description: >-
    당신은 미드가르드 컬링 클럽의 입구 홀에 있다. 회색 카펫이 복도를 따라 깔려 있다가, 위쪽 동쪽으로 올라가는 계단 앞에서 끝난다. 벽은 연한 베이지색이며, 오래되어 보이는 타일
    천장이 서서히 썩어가고 있다. 이곳은 적어도 50년은 된 것처럼 보인다.

tba:242:room:24272:
  name: 컬링 클럽 입구 계단
  description: >-
    당신은 미드가르드 컬링 클럽 입구 홀의 가장 안쪽에 있다. 회색 카펫은 여기서 끝나고, 짧은 계단이 동쪽으로 올라간다. 북쪽으로 커다란 나무 문이 나 있지만, 막혀 있다.

tba:242:room:24273:
  name: 컬링 클럽
  description: >-
    당신은 미드가르드 컬링 클럽 안에 있다. 서쪽 벽을 따라 바가 놓여 있고, 커다란 원형 테이블 여러 개가 여기저기 놓여 있다. 각 테이블에는 재와 담배 꽁초가 가득한 재떨이가
    놓여 있다. 방의 북쪽 부분을 가로지르는 난간이 있고, 그 아래 약 3미터 아래로 관중석이 있다. 관중석 앞 벽은 컬링 링크를 내려다보는 거대한 창문이다. 난간 앞, 복도로 내려가는
    계단 옆에 맥주 스티커가 붙은 작은 녹색 금고가 놓여 있다.

tba:242:room:24274:
  name: 컬링 클럽
  description: >-
    당신은 미드가르드 컬링 클럽 안에 있다. 바로 뒤쪽 테이블 위에는 60인치 TV가 놓여 있다. 커다란 원형 테이블 여러 개가 여기저기 흩어져 있고, 각 테이블에는 재떨이가 놓여
    있다. 방 북쪽을 가로지르는 난간이 여기서는 아래로 휘어져 계단으로 이어진다. 관중석 앞쪽 벽은 거대한 창문으로, 컬링 링크를 내려다볼 수 있다.

tba:242:room:24275:
  name: 컬링 클럽
  description: >-
    당신은 미드가르드 컬링 클럽 안에 있다. 커다란 원형 테이블 여러 개가 여기저기 흩어져 있다. 각 테이블에는 재와 담배 꽁초가 가득한 재떨이가 놓여 있다. 방 북쪽을 가로지르는
    난간 아래 약 3미터 지점에 관중석이 있다. 관중석 앞쪽 벽은 거대한 창문으로, 컬링 링크를 내려다볼 수 있다.

tba:242:room:24276:
