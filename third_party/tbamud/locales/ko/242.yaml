tba:242:room:24217:
  name: 동남쪽 문
  description: >-
    당신은 서쪽 성벽 옆, 동남쪽 문 앞을 걷고 있다. 문은 닫혀 있고, 오랫동안 그렇게 닫혀 있던 것 같다. 당신은 서쪽 성벽 옆, 동남쪽 문 앞을 걷고 있다. 문은 닫혀 있어
    모든 통행을 막고 있으며, 오랫동안 그렇게 닫혀 있던 것 같다.

tba:242:room:24218:
  name: 중앙 다리 위
  description: >-
    중앙 다리는 북부 미드가르드와 남부 미드가르드를 잇는 주요 연결로다. 이 다리는 철제 지지대와 콘크리트로 만들어져 매우 견고해 보인다. 아래를 내려다보면 동서로 빠르게 흐르는
    강물이 보인다. 남쪽으로는 남부 미드가르드의 높은 건물들이 스카이라인을 압도하고, 북쪽 멀리에는 미드가르드의 거대한 신전이 보인다.

tba:242:room:24219:
  name: 미드가르드 은행
  description: >-
    문을 열고 들어서니 미드가르드 은행 안이다. 천장이 높고 바닥은 반짝반짝하게 닦인 매우 큰 방이다. 커다란 창문으로 빛이 들어와 은행 전체가 환하게 빛난다. 서쪽 벽을 따라 긴
    데스크가 놓여 있고, 그 뒤에는 여러 명의 텔러가 지루한 표정으로 서 있다. 북쪽으로 매우 두꺼운 강철 문이 나 있는데, 그곳은 금고로 이어진다.

tba:242:room:24220:
  name: 쿨랜드 프레스 사무실
  description: >-
    당신은 조용한 신문사 사무실에 서 있다. 짙게 선팅된 창문들이 거리 쪽으로 줄지어 나 있어, 이곳은 꽤 어둡다. 바로 앞에 높은 책상이 놓여 있고, 그 너머로 컴퓨터가 놓인 책상들이
    많이 보인다. 기자들이 앉아 쿨랜드 프레스의 기사를 타이핑하고 있다.

tba:242:room:24221:
  name: 남쪽 부두
  description: >-
    당신은 강 남쪽의 부두에 있다. 나무로 된 부두는 강에서 꽤 높은 곳에 지어져 있어 여기서 강에 접근하는 것은 불가능하다. 여기저기 커다란 상자와 통이 흩어져 있다. 강 건너편으로
    강둑이 보인다.

tba:242:room:24222:
  name: 남쪽 부두
  description: >-
    당신은 강 남쪽의 부두에 서 있다. 나무 부두는 강에서 꽤 높은 곳에 지어져 있어 여기서 강에 접근하는 것은 불가능하다. 강 건너편을 보면 오래된 창고처럼 보이는 건물이 보인다.

tba:242:room:24223:
  name: 컴퓨터 가게
  description: >-
    컴퓨터 가게는 쿨랜드에서 유일한 곳이다. 이 가게는 매우 크고 천장이 매우 높으며 밝은 불빛이 가득하다. 약 6미터 높이의 넓은 선반이 가게 전체 길이를 따라 놓여 있고, 그
    사이로 통로가 나 있다. 온갖 종류의 컴퓨터 부품이 선반 위에 가지런히 쌓여 있다. 문 옆에 여러 개의 계산대가 놓여 있다.

tba:242:room:24224:
  name: 의류점
  description: >-
    당신은 미드가르드의 의류점에 있다. 꽤 작은 가게로 천장이 낮다. 옷걸이에 걸린 옷들이 가게를 가득 메워 거의 움직일 수 없을 정도다. 희미하게 클래식 음악이 흘러나오는 소리가
    들린다.

tba:242:room:24225:
  name: 남쪽 정원
  description: >-
    당신은 거리를 벗어나 아름다운 정원에 들어선다. 온갖 종류의 키 큰 나무들이 자라고 있고, 구불구불한 자갈길이 한가운데 놓인 벤치들로 이어진다. 길을 따라 꽃이 피어 있다. 도시
    한복판인데도 깊은 숲속에 들어온 듯한 느낌이 든다. 눈이 어둑한 빛에 익숙해지자, 굵은 나무 뒤에서 바람에 살랑살랑 흔들리는 밧줄이 눈에 들어온다.

tba:242:room:24226:
  name: 미드가르드 극장
  description: >-
    당신은 미드가르드 극장의 로비에 있다. 바닥은 짙은 남색 카펫으로 덮여 있고, 벽은 비싸 보이는 벽지로 장식되어 있다. 천장에는 정교한 샹들리에가 매달려 있다. 정문 근처에 작은
    매표소가 있다.

tba:242:room:24227:
  name: 시청
  description: >-
    당신은 미드가르드 시청 안에 있다. 거의 원형에 가까운 커다란 돔형 방으로, 꼭대기에는 하늘을 볼 수 있는 원형 천창이 있다. 벽은 모두 단단한 나무로 되어 있다. 방 중앙에는
    비서가 보통 앉는 커다란 U자형 데스크가 놓여 있다. 아름답게 조각된 계단이 시장실로 이어진다.

tba:242:room:24228:
  name: 빈 방
  description: 당신은 완전히 빈 방 안에 있다. 벽은 텅 비어 있고 바닥에는 먼지가 덮여 있다. 먼지 위에는 쥐나 바퀴벌레가 남긴 것으로 보이는 작은 발자국 몇 개가 보인다.

tba:242:room:24229:
  name: 빈 방
  description: 당신은 완전히 빈 방 안에 있다. 벽은 텅 비어 있고 바닥에는 먼지가 덮여 있다. 먼지 위에는 쥐나 바퀴벌레가 남긴 것으로 보이는 작은 발자국 몇 개가 보인다.

tba:242:room:24230:
  name: 미드가르드 공립학교
  description: >-
    당신은 쿨랜드 유일의 학교(아니, 원숭이 마을의 그 원숭이 학교는 안 센다) 로비 안에 있다. 공립학교치고는 놀라울 정도로 모든 것이 깔끔하게 정돈되어 있다. 이따금 학생이 당신
    곁을 지나가며 당신을 이상한 눈빛으로 쳐다본다.

tba:242:room:24231:
  name: 미드가르드 카페
  description: >-
    미드가르드 카페는 사람들이 점심이나 간식을 먹으러 올 수 있는 아늑한 곳이다. 남쪽 벽 전체가 창문으로 되어 있어 성벽길이 내다보인다. 방 안 여기저기 둥근 테이블이 놓여 있고,
    그중 많은 테이블 주위에는 사람들이 앉아 있다. 여러 식물과 화분에 심은 작은 관목들도 여기저기 놓여 있다.

tba:242:room:24232:
  name: 경비대 본부
  description: >-
    당신은 경비병 본부에 있다. 방은 크고 책장과 서류 캐비닛으로 가득 차 있다. 경비병들이 여기 모여 전화를 걸거나 책에 무언가를 적고 있다. 도움이 필요한 곳으로 언제든 파견될
    준비가 되어 있다.

tba:242:room:24234:
  name: 미드가르드 은행 - 금고
  description: >-
    당신은 은행 금고 안에 있다. 스테인리스 강으로 된 대여 금고가 벽면을 따라 줄줄이 늘어서 있다. 세 줄로 늘어선 아주 밝은 조명이 당신을 내리비추어 모든 것이 훤히 보인다.
    이곳에서는 숨는 것이 불가능하다.

tba:242:room:24235:
  name: 나무 꼭대기
  description: >-
    당신은 밧줄을 타고 올라 나무 꼭대기의 목재 플랫폼에 도착한다. 여기서 미드가르드를 한눈에 내려다볼 수 있다. 갑자기 하늘에서 굵은 사슬이 당신의 바로 앞에 떨어진다. 사슬은
    머리 위 구름 속으로 이어져 있다.

tba:242:room:24236:
  name: 극장 사무실
  description: >-
    당신은 극장 사무실에 있다. 지난 공연 포스터들이 벽을 가득 덮고, 바닥에는 두툼하고 어두운 색의 카펫이 깔려 있다. 방 안쪽 끝에는 아주 오래되어 보이는 나무 책상이 놓여 있고,
    그 위에는 서류와 낡은 문서들이 쌓여 있다. 독서등 하나만 켜져 있어 방 안이 꽤 어둡다.

tba:242:room:24237:
  name: 극장 복도
  description: 당신은 극장 메인 복도에 있다. 벽과 천장이 검게 칠해져 있고, 바닥도 검다. 어두운 나무 문 하나가 남쪽으로 나 있어 극장 본관으로 이어진다.

tba:242:room:24238:
  name: 간식 코너
  description: >-
    당신은 메인 극장 복도의 간식 부스에 있다. 북쪽 벽에 바가 설치되어 있고, 그 뒤에는 유리문 냉장고와 다양한 간식이 보인다. 막간에 관객들이 이곳에 와서 음식이나 음료를 사
    먹는다.

tba:242:room:24239:
  name: 극장 복도
  description: >-
    당신은 극장 중앙 복도에 있다. 벽과 천장은 검게 칠해져 있고, 바닥도 검다. 남쪽으로 난 어두운 나무 문은 극장의 공연장으로 이어진다. 계단이 아래쪽 분장실로 이어진다.

tba:242:room:24240:
  name: 분장실 복도
  description: >-
    당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽에는 어두운 벽지가 발려 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.
    나무 문 하나가 남쪽으로 나 있다.

tba:242:room:24241:
  name: 좌측 통로
  description: >-
    당신은 극장의 좌측 통로 한가운데에 있다. 저 앞에 무대가 보이며, 밝은 조명이 비추고 있다. 통로 바닥 양쪽에는 길을 안내하는 작은 불빛들이 줄지어 놓여 있다. 여기는 매우
    어둡다.

tba:242:room:24242:
  name: 좌석
  description: 당신은 극장 객석에 있다. 좌석은 짙은 붉은색이고, 무척 푹신하다. 저 멀리 정면에 무대가 보인다. 무대 조명을 빼면 이곳은 완전히 깜깜하다.

tba:242:room:24243:
  name: 좌석
  description: 당신은 극장의 좌석에 있다. 좌석은 짙은 붉은색이며, 매우 부드럽게 느껴진다. 정면 멀리 앞쪽에는 무대가 보인다. 무대 조명을 제외하면 이 일대는 완전히 어둡다.

tba:242:room:24244:
  name: 우측 통로
  description: >-
    당신은 극장 오른쪽 통로 한가운데에 있다. 앞쪽으로 무대가 보이고, 그 위로 밝은 조명이 비치고 있다. 통로 양옆 바닥을 따라 작은 불빛들이 길을 안내하듯 줄지어 있다. 이곳은
    무척 어둡다.

tba:242:room:24245:
  name: 분장실 복도
  description: >-
    당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.

tba:242:room:24246:
  name: 분장실 4호
  description: >-
    당신은 4번 분장실에 있다. 방은 꽤 작으며, 북쪽 벽에는 화장대가, 동쪽 벽에는 작은 소파가 놓여 있다. 카운터 뒤 벽에는 전구로 둘러싸인 큰 거울이 걸려 있다. 문 옆에는
    다양한 옷과 무대 의상이 가득 담긴 의상 랙이 있다.

tba:242:room:24247:
  name: 좌측 통로
  description: >-
    당신은 극장의 좌측 통로 한가운데에 있다. 정면 앞쪽에는 무대가 보이며, 밝은 조명이 비추고 있다. 통로 바닥 양쪽에는 길을 안내하는 작은 불빛들이 줄지어 놓여 있다. 여기는
    매우 어둡다.

tba:242:room:24248:
  name: 좌석
  description: 당신은 극장 객석에 있다. 좌석은 짙은 붉은색이며, 무척 푹신하다. 저 멀리 앞쪽으로 무대가 보인다. 무대 조명을 빼면 이 일대는 완전히 어둡다.

tba:242:room:24249:
  name: 좌석
  description: 당신은 극장의 좌석에 있다. 좌석은 짙은 붉은색이며, 매우 부드럽게 느껴진다. 정면 멀리 앞쪽에는 무대가 보인다. 무대 조명을 제외하면 이 일대는 완전히 어둡다.

tba:242:room:24250:
  name: 우측 통로
  description: >-
    당신은 극장의 오른쪽 통로 한가운데에 있다. 앞쪽으로 무대가 보이고, 밝은 조명이 무대를 비추고 있다. 통로 바닥 양옆에는 길을 안내하는 작은 불빛들이 줄지어 있다. 여기는 매우
