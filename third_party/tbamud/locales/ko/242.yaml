tba:242:room:24200:
  name: 성벽길
  description: >-
    당신은 서쪽 성벽 옆을 걷고 있다. 회색의 큰 바위들이 일종의 회반죽 같은 것으로 서로 단단히 붙여져 있다. 오르기에는 너무 높다. 사람들이 당신을 지나쳐 각자의 목적지로 서둘러
    가고 있다. 북쪽으로 서쪽 다리가 보인다.

tba:242:room:24201:
  name: 에메랄드 대로
  description: >-
    당신은 에메랄드 애비뉴에 있다. 길은 새것처럼 보이며, 길 양쪽에 늘어서 있는 상점과 건물들도 마찬가지다. 분명히 미드가르드의 새로운 지역이다. 사람들이 분주히 오가고, 노점상들은
    핫도그와 그보다 덜 합법적인 상품들을 팔기 위해 애쓰고 있다. 길 boyunca 가로등이 보이며, 특이한 나무도 눈에 띈다.

tba:242:room:24202:
  name: 남쪽 광장
  description: >-
    당신은 남쪽 광장 한가운데에 서 있다. 높은 건물들이 사방에 솟아 있어 햇빛을 대부분 가리고 있다. 약 6미터 높이의 남자 석상이 여기 서 있고, 그 둘레를 관목과 꽃이 원형으로
    감싸고 있다. 사방에서 미드가르드의 분주한 일상 소음이 들려온다. 북쪽에는 중앙 다리가 있으며, 미드가르드의 구시가지로 이어진다.

