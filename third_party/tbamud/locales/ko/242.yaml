tba:242:room:24207:
  name: 레이저 거리
  description: >-
    당신은 레이저 로드(Razor's Road) 위에 있다. 길은 새것인 것처럼 보이며, 길 양쪽에 늘어서 있는 상점과 건물들도 마찬가지다. 분명히 미드가르드의 새로운 지역이다.
    사람들이 분주히 오가고, 노점상들은 핫도그와 다른 좀 더 불법적인 상품들을 팔기 위해 애쓰고 있다. 길 boyunca 가로등이 보이며, 기이한 나무들도 눈에 띈다.

tba:242:room:24208:
  name: 레이저 광장
  description: >-
    레이저 광장은 미드가르드에서 가장 남쪽에 있는 광장이다. 남쪽으로는 성벽길이 있고, 북쪽으로는 미드가르드 시가지 대부분이 눈에 들어온다. 이곳에는 작은 가판대 안에 선 노점상
    몇이 있다. 싸구려 장신구부터 가죽 재킷까지 온갖 물건을 판다.

tba:242:room:24209:
  name: 레이저 거리
  description: >-
    당신은 레이저 로드(Razor's Road) 위에 있다. 길은 새것인 것처럼 보이며, 길 양쪽에 늘어서 있는 상점과 건물들도 마찬가지다. 분명히 미드가르드의 새로운 지역이다.
    사람들이 분주히 오가고, 노점상들은 핫도그와 다른 좀 더 불법적인 상품들을 팔기 위해 애쓰고 있다. 북쪽 건물의 지붕 일부가 문 바로 위에 돌출되어 있다. 이 처마는 건물에서
    약 3미터 정도 튀어나와 있고, 폭은 약 6미터다. 처마 하단 가장자리 전체에 전구가 달려 있다. 북쪽으로 이중 유리문이 나 있고, 보도 위에 간판 몇 개가 세워져 있다. 당신은
    이것이 미드가르드 극장의 입구임을 알아본다.

