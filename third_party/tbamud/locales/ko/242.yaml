  description: >-
    당신은 탈의실에 있다. 파란색 사물함이 방 전체의 길이를 따라 늘어서 있고, 그 앞에 벤치가 놓여 있다. 사물함 위에 운동 가방이 드문드문 놓여 있는 것이 눈에 띈다. 방 뒤쪽에는
    북쪽으로 이어지는 문이 있다.

tba:242:room:24291:
  name: 통로
  description: >-
    당신은 낡고 어두운 복도에 있다. 벽의 페인트가 벗겨져 있고, 천장에는 전구 하나가 매달려 있다. 바닥은 시멘트로 되어 있으며 여기저기 긁힌 자국이 가득하다. 복도는 꽤 넓다.
    이 통로는 예전에 장비와 물품을 운반하는 데 쓰였던 것 같다. 남쪽으로 거친 나무 문이 나 있다.

