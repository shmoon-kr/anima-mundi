    예전에 장비나 물자를 운반하는 데 쓰였던 것 같다. 북쪽으로 나무 문이 하나 있다.

tba:242:room:24297:
  name: 창고
  description: >-
    낡고 먼지 쌓인 창고 안에 있다. 커다란 물건 여러 개를 흰 천으로 덮어 놓았는데, 그 위에는 먼지와 거미줄이 뒤덮여 있다. 벽에 걸린 달력이 눈에 들어오는데, 30년도 더 된
    것이다. 이 곳은 분명 더 이상 쓰이지 않는 곳이다.

tba:242:room:24298:
  name: 시장실
  description: >-
    당신은 미드가르드 시장의 그리 크지 않은 사무실에 있다. 큰 책상이 광택을 내며 반짝이고 있지만 완전히 비어 있으며, 팔걸이가 있는 의자 앞에 놓여 있다. 그 의자는 너무 편안해
    보이는 나머지, 머리 쪽을 살짝 높인 침대와 비슷해 보인다. 사방으로 창문이 나 있어 도시의 멋진 경치를 감상할 수 있다.

tba:242:mob:24200:
  short: 도시 경비병
  long: 경비병이 여기 서서 당신을 뚫어지게 바라보고 있다.
  description: 경비병은 매우 강해 보인다. 나이는 30세쯤 되어 보이고, 표준 경비대 제복을 입고 있다. 그는 미드가르드 시민들을 보호하기 위해 무엇이든 할 것이다.

tba:242:mob:24201:
  short: 시장
  long: 시장이 여기 이리저리 돌아다니며 도시를 점검하고 있다.
  description: 그는 체격이 다부진 중년 남성으로, 숱이 적은 회색 머리를 하고 있다.

tba:242:mob:24202:
  short: 은행장
  long: 은행장이 여기 서서 당신의 모든 움직임을 지켜보고 있다.
  description: 이 은행을 운영하는 사람은 바로 이 사람이다. 그는 많은 돈을 벌고, 남의 돈을 세는 데 시간을 보낸다. 돈이 좋다.

tba:242:mob:24203:
  short: 극장 지배인
  long: 극장 지배인이 여기서 지루한 표정을 짓고 있다.
  description: >-
    극장 지배인이 당신을 바라본다. 그는 머리가 벗어지기 시작한 나이 지긋한 남자로, 싸구려처럼 보이는 정장을 입고 있다. 그는 당신이 오늘 밤 공연 티켓을 구매했을 거라고 생각한다.

tba:242:mob:24204:
  short: 안내원
  long: 젊어 보이는 안내원이 여기서 당신을 자리로 안내하고 있다.
  description: >-
    이 안내원은 꽤 앳되어 보인다. 관객들이 표를 가지고 있는지, 공연 중에 자리에 앉아 있는지 확인하는 것이 그의 일이다. 체구가 작아서, 누가 버티기라도 하면 어떻게 규칙을 지키게
    할지 짐작이 가지 않는다.

tba:242:mob:24205:
  short: 컴퓨터 판매원
  long: 컴퓨터 판매원이 여기 서서 새로운 기술에 대해 떠들고 있다.
  description: >-
    이 컴퓨터 판매원은 자기가 무슨 말을 하는지 전혀 모르는 게 분명하다. 그는 어떤 OEM PC의 훌륭한 기능들에 대해 당신에게 열변을 토하고 있다. 당신이 질문을 하려 하지만,
    그는 조용히 하라는 듯 손을 들어 올리고 계속 떠든다. 뭐, 어쩔 수 없지.

tba:242:mob:24206:
  short: 의류 판매원
  long: 의류 판매원이 여기 서서 당신을 응대할 준비를 하고 있다.
  description: 의류 판매원이 여기 서서 당신을 지켜보고 있다. 그는 값비싼 정장을 입고 있고, 머리는 기름을 발라 뒤로 매끈하게 넘겼다.

tba:242:mob:24207:
  short: 웨이트리스
  long: 웨이트리스 한 명이 여기서 당신에게 음식을 가져다주려고 기다리고 있다.
  description: 이 웨이트리스는 지쳐 보인다. 그녀는 정신이 딴 데 팔린 듯 창밖을 자주 내다본다. 그녀는 이 테이블 저 테이블을 서둘러 오가며 손님들에게 커피를 따라 준다.

tba:242:mob:24208:
  short: 무대 보조원
  long: 무대 보조원이 여기 서서 할 일을 기다리고 있다.
  description: 이 무대 보조원은 지루해 보인다. 그는 짙은 파란색 멜빵바지를 입고 검은색 야구 모자를 쓰고 있다. 꽤 힘차 보인다.

tba:242:mob:24209:
  short: 배우
  long: 배우가 여기 서서 대사를 연습하고 있다.
  description: 이 배우는 꽤 바빠 보인다. 그는 대사를 읽고 있으며 당신에게 큰 관심을 보이지 않는다.

tba:242:mob:24210:
  short: 여배우
  long: 여배우 한 명이 여기서 대사를 외우고 있다.
  description: 이 여배우는 꽤 바빠 보인다. 대사를 읽느라 당신에게 별로 신경을 쓰지 않고 있다.

tba:242:mob:24211:
  short: 간식 부스 직원
  long: 간식 부스 직원 한 명이 여기 있다. 당신을 응대할 준비가 되어 있다.
  description: 이 간식 부스 직원은 고마운 줄 모르는 손님들의 막말을 받아주느라 지쳤다. 곧 폭발할 것 같은 얼굴이다.

tba:242:mob:24212:
  short: 컬링 선수
  long: 컬링 선수 한 명이 여기서 슬라이딩 기술을 연습하고 있다.
  description: 이 컬링 선수는 오늘 밤 경기를 위해 연습에 몰두하고 있다. 스트레칭을 하며 기술을 다듬으려 애쓰고 있다. 그다지 무서워 보이지는 않는다.

tba:242:mob:24213:
  short: 웨이트리스
  long: 웨이트리스 한 명이 여기서 당신에게 음식을 가져다주려고 기다리고 있다.
  description: 이 웨이트리스는 지쳐 보인다. 정신이 딴 데 팔린 듯 자꾸 창밖을 내다본다. 그녀는 이 테이블 저 테이블로 바삐 오가며 손님들에게 커피를 따른다.

tba:242:obj:24200:
  short: 컵
  long: 컵이 여기 놓여 있다.
  extras:
  - text: 작고 단순한 컵이다.

tba:242:obj:24201:
  short: 컵
  long: 컵이 여기 놓여 있다.
  extras:
  - text: 작고 단순한 컵이다.

tba:242:obj:24202:
  short: 컵
  long: 컵이 여기 놓여 있다.
  extras:
  - text: 큰 단순한 컵이다.

tba:242:obj:24203:
  short: 병
  long: 에비앙 천연 샘물 한 병이 여기 있다.
  extras:
  - text: 크고 깨끗한 병이다. 옆면에 큰 라벨이 붙어 있다.
  - text: >-
      바가지를 썼다! 라벨 하단에 정말로 정말로 작은 글씨로 '에비앙 주식회사 미드가르드 지점에서 병입. 이 물은 대부분 깨끗한 미드가르드 자연 강에서 온 것입니다.'라고 적혀
      있다.

tba:242:obj:24204:
  short: 수통
  long: 여기 바닥에 수통이 놓여 있다.
  extras:
  - text: 꽤 큰 수통이다. 많은 양의 액체를 담을 수 있을 것 같다.

tba:242:obj:24205:
  short: 빨간 안내원 조끼
  long: 빨간 안내원 조끼 하나가 여기 놓여 있다.
  extras:
  - text: 이 조끼는 두꺼운 천으로 만들어졌다. 가운데로 선명한 금색 단추가 줄지어 달려 있고, 양쪽에 작은 주머니가 하나씩 있다.

tba:242:obj:24206:
  short: 작은 검은색 손전등
  long: 작은 검은색 금속 손전등 하나가 여기 놓여 있다.
  extras:
  - text: 이것은 극장의 안내원들이 사용하는 작은 손전등이다.

tba:242:obj:24207:
  short: 가죽 작업 장갑 한 켤레
  long: 두꺼운 가죽 작업 장갑 한 켤레가 여기 놓여 있다.
  extras:
  - text: 이 장갑은 꽤 새것으로 보인다. 손바닥 쪽에는 가죽 조각이 가로로 덧대어져 있고, 손등 쪽에는 두꺼운 노란색 천이 한 겹 덧대어져 있다.

tba:242:obj:24208:
  short: 데님 멜빵바지 한 벌
  long: 데님 멜빵바지 한 벌이 여기 버려져 있다.
  extras:
  - text: 이 멜빵바지는 꽤 크다. 짙은 남색이며, 가슴 위에 큰 주머니가 달려 있다.

tba:242:obj:24209:
  short: 비싼 정장 재킷
  long: 비싸 보이는 검은색 정장 재킷이 여기 놓여 있다.
  extras:
  - text: 이 재킷은 꽤 고급스러워 보인다. 당신에게 딱 맞는 것 같다.

tba:242:obj:24210:
  short: 흰색 정장 셔츠
  long: 하얀 정장 셔츠 한 벌이 여기 정갈하게 접혀 있다.
  extras:
  - text: 셔츠에는 무늬나 색이 전혀 없다. 흰색 단추가 달린 얇은 흰색 셔츠다.

tba:242:obj:24211:
  short: 검은색 정장 바지 한 벌
  long: 검은색 정장 바지 한 벌이 여기 놓여 있다.
  extras:
  - text: 이 정장 바지는 촉감이 부드럽고, 당신에게 잘 맞는 것 같다.

tba:242:obj:24212:
  short: 남성용 가죽 정장 구두 한 켤레
  long: 남성용 검은색 가죽 정장 구두 한 켤레가 여기 놓여 있다.
  extras:
  - text: 이 신발은 꽤 편해 보인다. 가죽이 부드럽고, 정교한 무늬가 찍혀 있다.

tba:242:obj:24213:
  short: 화려한 검은색 드레스
  long: 화려한 검은 드레스 한 벌이 여기 놓여 있다.
  extras:
  - text: 이 드레스는 매우 아름답다. 다소 타이트하지만, 당신에게 꽤 잘 맞는다.

tba:242:obj:24214:
  short: 정장용 하이힐 한 켤레
  long: 여성용 정장 하이힐 한 켤레가 여기 놓여 있다.
  extras:
  - text: 이 신발은 꽤 편해 보인다. 가죽이 부드럽고, 굽이 너무 높지 않다.

tba:242:obj:24215:
  short: 검은 나비넥타이
  long: 검은 나비넥타이가 여기 놓여 있어 당신이 집어 들기를 기다리고 있다.
  extras:
  - text: 이 나비넥타이는 새것이다. 정장에 잘 어울릴 것 같다.

tba:242:obj:24216:
  short: 도시 열쇠
  long: 아주 큰 도시 열쇠가 여기 놓여 있다.
  extras:
  - text: 아마도 당신이 평생 본 열쇠 중 가장 클 것이다. 광택을 낸 금으로 만들어졌으며, 미드가르드 문장 외에도 다양한 무늬가 새겨져 있다.

tba:242:obj:24217:
  short: PDA
  long: PDA(개인 디지털 어시스턴트)가 여기 놓여 있다.
  extras:
  - text: 이 PDA는 꽤 복잡해 보인다. 작은 책 크기 정도의 작은 검은색 상자다. 화면에는 여러 아이콘이 표시되어 있다.

tba:242:obj:24218:
  short: 검은 휴대폰
  long: 검은 휴대폰이 여기 있다.
  extras:
  - text: 휴대폰은 꽤 쓸모없는 물건이다. 일반 전화를 쓸 수 있는데 왜 휴대폰을 쓰겠는가? 게다가 MUD에서는 전화를 쓰지 않아도 마법으로 통신할 수 있다.

tba:242:obj:24219:
  short: 새 노트북
  long: 새 노트북이 여기 놓여 있어 도둑맞기를 기다리고 있다.
  extras:
  - text: >-
      이 노트북은 새것이다. 검은색이며, 1.6 GHz 프로세서, 512 MB의 RAM, 64 MB의 비디오 카드, 그리고 40x DVD/CD 버너를 갖추고 있다. 꽤 고급스럽다.

tba:242:obj:24220:
  short: 금화가 가득 담긴 거대한 자루
  long: 금화가 가득 담긴 거대한 자루가 여기 놓여 있다.

tba:242:obj:24221:
  short: 장검
  long: 장검이 여기 놓여 있다.

tba:242:obj:24222:
  short: 고기 조각
  long: 여기 바닥에 좀 수상해 보이는 고기 조각이 놓여 있다.
  extras:
  - text: >-
      고기가 독이 든 것처럼 보이는 것은 아니지만, 어디서 왔는지 확신이 서지 않는다. 사냥꾼이 사슴이나 토끼 고기를 그냥 버릴 리가 없는데... 대체 이 고기는 어디서 나온 걸까,
      당신은 생각한다...

tba:242:obj:24223:
  short: 극본의 첫 번째 페이지
  long: 극본의 첫 번째 페이지가 여기 놓여 있다.

tba:242:obj:24224:
  short: 극본의 두 번째 페이지
  long: 극본의 두 번째 페이지가 여기 놓여 있다.

tba:242:obj:24225:
  short: 극본의 세 번째 페이지
  long: 극본의 세 번째 페이지가 여기 놓여 있다.

tba:242:obj:24226:
  short: 대걸레
  long: 나무 손잡이가 달린 대걸레가 여기 놓여 있다.
  extras:
  - text: 아주 쓸모 있어 보이는 대걸레다. 끝에 부드러운 천이 달려 있어 바닥을 닦는 데 그만일 것 같다. 나무 자루는 꽤 굵고 단단하다. 무기로 쓰기에 안성맞춤이다.

tba:242:obj:24227:
  short: 컬링 빗자루
  long: 플라스틱 컬링 빗자루가 여기 놓여 있다.
  extras:
  - text: >-
      컬링 빗자루다. 길고 가는 플라스틱 손잡이가 달려 있고, 끝부분은 나무 블록에 붙인 폼 조각 위에 거친 천을 씌워 만들었다. 컬링 선수들은 이것으로 스톤 앞의 얼음을 쓸어낸다.

tba:242:obj:24228:
  short: 빨간 컬링 스톤
  long: 빨간 컬링 스톤이 여기 놓여 있다.
  extras:
  - text: 컬링 스톤은 회색 돌로 만들어졌으며, 빨간 손잡이와 빨간 줄무늬가 있다. 꽤 무겁게 느껴진다.

tba:242:obj:24229:
  short: 노란 컬링 스톤
  long: 노란 컬링 스톤이 여기 놓여 있다.
  extras:
  - text: 컬링 스톤은 회색 돌로 만들어졌으며, 노란 손잡이와 노란 줄무늬가 있다. 꽤 무겁게 느껴진다.

tba:242:obj:24291:
  short: 컵
  long: 커피 한 잔이 여기 놓여 있다.

tba:242:obj:24292:
  short: 맛있는 햄버거
  long: 맛있어 보이는 햄버거가 여기 놓여 있다.
  extras:
  - text: 이 햄버거는 초보자 동물원에서 만든 것이다. 아직 호일 포장에 들어 있어 따뜻하다.

tba:242:obj:24293:
  short: 푸틴 한 상자
  long: 치즈 푸틴이 든 상자가 여기 놓여 있다.
  extras:
  - text: 이 푸틴 상자는 꽤 크다. 모르는 사람을 위해 말하자면, 푸틴은 그레이비와 치즈 커드를 얹은 감자튀김으로 만들어진다.

tba:242:obj:24294:
  short: 30센티미터짜리 긴 핫도그
  long: 30센티미터짜리 핫도그가 여기 놓여 있다.
  extras:
  - text: 이 핫도그는 초보자 동물원에서 만든 것이다. 꽤 맛있어 보인다.

tba:242:obj:24295:
  short: 물병
  long: 물병 하나가 여기 놓여 있다.

tba:242:obj:24296:
  short: 감자 칩 봉지
  long: 감자 칩 봉지 하나가 여기 놓여 있다.

tba:242:obj:24297:
  short: 프레첼 상자
  long: 프레첼 상자가 여기 있다.

tba:242:obj:24298:
  short: 단단한 열쇠
  long: 단단한 열쇠 하나가 여기 놓여 있다.

tba:242:obj:24299:
  short: 은 열쇠
  long: 반짝이는 은 열쇠 하나가 여기 놓여 있다.
