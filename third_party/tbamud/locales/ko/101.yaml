tba:101:room:10100:
  name: 남쪽 길 구역 설명 방

tba:101:room:10101:
  name: 남쪽 길
  description: >-
    당신은 도시의 성문 바로 남쪽에 서 있다. 동쪽에서 따뜻한 바람이 훅 불어와 그쪽으로 사막이 멀지 않음을 알려 준다. 길은 남쪽으로 뻗어 있고, 북쪽으로는 수도로 이어진다. 동쪽과
    서쪽으로는 눈길이 닿는 데까지 농지가 펼쳐져 있다.
  extras:
  - text: 당신은 XXXX의 거대한 성문을 바라보고 있다. 도시의 성벽이 눈앞에 우뚝 서 있으며, 이 거대한 성문을 통하지 않고는 들어갈 수 있는 방법이 없다.

tba:101:room:10102:
  name: 남쪽 길
  description: >-
    당신은 헤이븐 시와 이어지는 남쪽 길을 걷고 있다. 동쪽과 서쪽으로 밭이 펼쳐져 있고, 길은 북쪽으로는 여기서 간신히 보이는 수도의 남쪽 성문까지, 남쪽으로는 농지를 가로질러
    이어진다. 동쪽에서 불어오는 따뜻한 바람이 사막을 떠올리게 한다.

tba:101:room:10103:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길을 걷고 있다. 동쪽에서 따뜻한 바람이 불어와, 그 방향으로 그리 멀지 않은 곳에 사막이 있음을 일깨워 준다. 북쪽 지평선에는 큰 도시의 성벽이 보이며, 동쪽과
    남쪽의 농작물 밭 때문에 길이 서쪽으로 꺾여 있다.

tba:101:room:10104:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길을 걷고 있다. 길은 여기서 동쪽과 남쪽으로 이어지며, 북쪽과 서쪽으로는 농지가 펼쳐져 있다. 동쪽에서 불어오는 따뜻한 바람 한 줄기가 대륙 남동부를 뒤덮은 사막을
    떠올리게 한다.

tba:101:room:10105:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 동쪽과 서쪽으로는 시야가 닿는 데까지 농지가 펼쳐져 있고, 도로는 여기서 북쪽과 남쪽으로 이어진다. 동쪽에서 따뜻한 바람이
    훅 불어온다. 사막이 생각했던 것보다 그리 멀지 않음을 일깨워 준다.

tba:101:room:10106:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 서쪽과 남쪽으로는 시야가 닿는 데까지 농지가 펼쳐져 있고, 도로는 여기서 북쪽과 동쪽으로 이어진다. 동쪽에서 따뜻한 바람이
    불어와 그 방향에 있는 사막을 떠올리게 한다. 어딘가 남쪽에서 흐르는 물소리가 희미하게 들린다.

tba:101:room:10107:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길을 걷고 있다. 북쪽과 남쪽으로 눈길이 닿는 데까지 농지가 펼쳐져 있고, 도로는 여기서 동쪽과 서쪽으로 이어진다. 어딘가 남쪽에서 흐르는 물소리가 희미하게 들린다.
    동쪽의 사막에서 따뜻한 바람이 불어온다.

tba:101:room:10108:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길을 걷고 있다. 북쪽과 동쪽으로는 시야가 닿는 데까지 농지가 펼쳐져 있고, 도로는 남쪽과 서쪽으로 이어진다. 동쪽의 사막에서 따뜻한 바람이 불어오고, 남쪽에서 흐르는
    물소리가 당신을 반긴다.

tba:101:room:10109:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 동쪽과 서쪽으로 농지가 펼쳐져 있고, 도로는 여기서 북쪽과 남쪽으로 이어진다. 남쪽에서 흐르는 물소리가 들린다.

tba:101:room:10110:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 길은 여기서 북쪽으로 뻗어 나가고, 남쪽으로는 강을 따라 서쪽으로 이어진다. 동쪽에서 불어오는 따뜻한 바람 한 줄기가 대륙
    남동부를 뒤덮은 사막을 떠올리게 한다. 여기서 강둑으로 내려가는 작은 오솔길이 눈에 띈다.

tba:101:room:10111:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길을 걷고 있다. 북쪽과 서쪽으로 눈이 닿는 데까지 밭이 펼쳐져 있고, 도로는 동쪽으로 이어진다. 남쪽에는 강을 건너는 다리가 있어, 건너편의 길과 연결되어 있다.
    동쪽에서 따뜻한 바람이 한 줄기 불어와, 그리 멀지 않은 곳에 사막이 있음을 일깨워 준다.

tba:101:room:10112:
  name: 다리
  description: >-
    당신은 남쪽 길 위의 다리 위에 있다. 도로는 여기서 북쪽과 남쪽으로 이어지고, 강은 어딘가 멀리 바다 쪽으로 서쪽으로 흐른다. 동쪽에서 따뜻한 바람이 훅 불어온다. 사막과 그
    안에 담긴 비밀을 상기시키려는 듯하다.

tba:101:room:10113:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 북쪽으로는 강을 건너 반대편 길과 이어지는 다리가 있으며, 길은 여기서 남쪽으로 이어진다. 동쪽과 서쪽으로는 초원이 눈이 닿는
    데까지 펼쳐져 있다. 동쪽에서 따뜻한 바람이 불어와, 마치 대륙 남동부를 뒤덮은 사막을 떠올리게 하려는 듯하다.

tba:101:room:10114:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 도로는 여기서 작은 바위 무더기를 돌아 북쪽과 서쪽으로 이어진다. 동쪽으로는 눈이 닿는 데까지 풀이 우거진 평원이 펼쳐져 있다.
    그리고 북쪽에서 흐르는 물소리가 당신을 반기듯 들린다.

tba:101:room:10115:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 길은 여기서 동쪽과 남쪽으로 이어진다. 북쪽과 서쪽으로는 풀이 우거진 평원이 눈이 닿는 데까지 펼쳐져 있다. 북쪽에서는 흐르는
    물소리도 들려온다.

tba:101:room:10116:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 길은 여기서 북쪽과 남쪽으로 이어지고, 동쪽에는 바위 무더기가 시야와 길을 가로막고 있다. 서쪽으로는 풀이 우거진 평원이 눈이
    닿는 데까지 펼쳐져 있다. 북쪽에서 흐르는 물소리가 희미하게 들려온다.

tba:101:room:10117:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길 위를 걷고 있다. 길은 북쪽과 남쪽으로 이어지며, 동쪽으로는 바위 무더기가 당신의 길과 시야를 가로막고 있다. 서쪽으로는 시야가 닿는 한계까지
    풀이 우거진 평원이 펼쳐져 있다.

tba:101:room:10118:
  name: 남쪽 길
  description: >-
    당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 길 위를 걷고 있다. 동쪽으로는 작은 바위 무더기가 당신의 시야와 길을 가로막고 있다. 서쪽으로는 시야가 닿는 한계까지 풀이 우거진
    평원이 펼쳐져 있다. 동쪽의 바위에서 따뜻한 바람이 훅 불어온다. 여전히 사막이 그리 멀지 않음을 일깨우려는 듯하다.

tba:101:room:10119:
  name: 남쪽 길
  description: >-
    당신은 도시와 남쪽의 헤이븐을 잇는 남쪽 길 위를 걷고 있다. 여기서 길은 북쪽과 동쪽으로 이어지며, 남쪽과 서쪽으로는 시야가 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다.
    동쪽에서 따뜻한 바람이 훅 불어온다. 사막과 그곳에 숨겨진 비밀을 상기시키려는 듯하다.

tba:101:room:10120:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 어딘가, 남쪽 길 위를 걷고 있다. 여기서 길은 동쪽과 서쪽으로 이어지며, 북쪽으로는 작은 바위 무더기가 당신의 시야와 길을 가로막고 있다. 남쪽
    멀리, 고대처럼 보이는 울창한 숲의 시작 부분이 희미하게 보인다.

tba:101:room:10121:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이 어딘가의 남쪽 길 위를 걷고 있다. 길은 남쪽으로 이어지고, 서쪽으로는 작은 바위 무더기를 따라 뻗어 있다. 여기에서 북쪽과 동쪽으로는 시야가 닿는
    한계까지 풀이 우거진 평원이 펼쳐져 있다. 동쪽 사막에서 따뜻한 바람이 훅 불어온다. 그곳이 품고 있는 비밀을 일깨우려는 듯하다.

tba:101:room:10122:
  name: 남쪽 길
  description: >-
    도시와 헤이븐 사이 어딘가의 남쪽 길을 걷고 있는데, 이따금 두 도시를 오가는 대상 행렬이 눈에 띈다. 두 도시 사이에서는 생선과 농작물이 거래된다. 길은 여기서 북쪽과 남쪽으로
    이어진다. 동쪽 어딘가에 희미하게 보이는 사막에서 따뜻한 바람이 불어오고, 서쪽으로는 비옥한 평원이 펼쳐져 있다.

tba:101:room:10123:
  name: 남쪽 길
  description: >-
    당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 길을 걷고 있다. 이 일대에서 세상의 중심으로 여겨지는 도시를 오가는 여행자들로 길이 북적거린다. 동쪽에서 따뜻한 바람이 훅 불어온다.
    멀지 않은 곳에 사막이 있음을 일깨우려는 듯하다. 동쪽과 서쪽으로는 비옥한 초원이 펼쳐져 있고, 길은 북쪽과 남쪽으로 이어진다. 바로 남쪽에 서쪽으로 갈라지는 작은 오솔길이 희미하게
    보인다.

tba:101:room:10124:
  name: 남쪽 길
  description: >-
    당신은 도시에서 헤이븐으로 이어지는 남쪽 길을 걷고 있다. 동쪽 사막에서 따뜻한 바람이 불어온다. 마치 그곳의 비밀을 일깨우려는 듯하다. 길은 여기서 북쪽과 남쪽으로 이어지고,
    작은 오솔길 하나가 서쪽으로 갈라져 나간다. 동쪽으로는 비옥한 초원이 시야를 가득 채우는데, 그 초원은 지평선에 그어진 가느다란 노란 선에서 끊긴다.

tba:101:room:10125:
  name: 작은 오솔길
  description: >-
    당신은 황야를 가로지르는 작은 오솔길 위를 걷고 있다. 북쪽과 남쪽으로 초원이 보인다. 오솔길은 동쪽으로 이어져 남북으로 뻗은 번잡한 길과 합류하며, 서쪽으로는 황야의 더 깊은
    곳으로 이어진다.

tba:101:room:10126:
  name: 작은 오솔길
  description: >-
    당신은 황야를 가로지르는 작은 오솔길 위를 걷고 있다. 북쪽과 남쪽으로 광활한 초원이 보인다. 남쪽 지평선은 멀리 보이는 울창한 숲이 차지하고 있고, 북쪽으로는 풀밖에 보이지
    않는다. 오솔길은 동쪽으로 이어지고, 서쪽으로는 남쪽으로 꺾여 이어진다.

tba:101:room:10127:
  name: 작은 오솔길
  description: >-
    당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 남쪽 저 멀리 어딘가에 울창한 숲이 보이고, 나머지 모든 방향으로는 드넓은 초원이 끝없이 펼쳐져 있다. 오솔길은 동쪽으로,
    그리고 남쪽으로 이어지며, 남쪽 길은 곧 서쪽으로 꺾인다.

tba:101:room:10128:
  name: 작은 오솔길
  description: >-
    당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 오솔길은 남쪽 지평선 근처에 울창한 숲이 솟아 있는 것을 빼면, 사방으로 끝없이 펼쳐진 광활한 초원에 둘러싸여 있다. 오솔길은
    북쪽으로 이어지다가 동쪽으로 꺾이고, 서쪽으로 이어지다가 다시 북쪽으로 꺾인다.

tba:101:room:10129:
  name: 작은 오솔길
  description: >-
    당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 남쪽 지평선 가까이에 울창한 숲이 솟아 있는 것 말고는, 사방 어디를 둘러보아도 광활한 초원이 끝없이 펼쳐져 있다. 오솔길은
    북쪽으로 가다가 서쪽으로 꺾이고, 동쪽으로 가다가 북쪽으로 꺾인다.

tba:101:room:10130:
  name: 작은 오솔길
  description: >-
    당신은 작은 오솔길 위에 있다. 길은 여기서 남쪽으로, 그리고 서쪽 오르막으로 이어진다. 서쪽으로 갈수록 오솔길이 넓어지고, 그 끝에 연기를 피워 올리는 굴뚝 같은 것들이 보인다.
    근처에 마을이 있는지도 모르겠다.

tba:101:room:10131:
  name: 언덕 꼭대기
  description: >-
    당신은 작은 언덕 꼭대기에 서 있다. 여기까지 따라온 오솔길은 동쪽으로 이어지다가 남쪽으로 꺾인다. 서쪽으로는 으스스해 보이는 마을 쪽으로 방향을 돌린다. 시선이 다시 마을로
    돌아오자 불안한 기분이 당신을 엄습한다.

tba:101:room:10132:
  name: 남쪽 길
  description: >-
    당신은 헤이븐과 도시를 잇는 남쪽 길을 걷고 있다. 동남쪽으로는 산이 시야를 가득 채우고 있으며, 서남쪽에는 큰 숲이 솟아 있다. 사막에서 불어오는 따뜻한 바람이 느껴진다. 제
    존재를 과시하며 당신을 놀리는 듯하다. 길은 북쪽으로 이어지며, 서쪽으로 나가는 작은 오솔길과, 산과 헤이븐 쪽으로 더 가까운 남쪽 길이 간신히 눈에 띈다.

tba:101:room:10133:
  name: 남쪽 길
  description: >-
    당신은 헤이븐과 도시 사이의 남쪽 길 어딘가에 있다. 동쪽 사막에서 따뜻한 바람이 불어오고, 지평선 너머로 노란 줄기가 보여 사막이 드러난다. 길은 헤이븐 방향으로 남쪽으로 이어지는데,
    울창한 숲 때문에 동쪽으로 꺾여야 하고, 북쪽으로는 도시를 향해 열린 땅을 지나간다. 남동쪽으로는 거대한 남부 산맥이 우뚝 솟아 있다.

tba:101:room:10134:
  name: 남쪽 길
  description: >-
    당신은 도시와 헤이븐 사이의 남쪽 길 어딘가에 있다. 바로 남쪽에는 울창한 숲이 우뚝 솟아 있고, 북쪽으로는 길 양편이 모두 열린 땅뿐이다. 동쪽을 보면 멀리 있는 산들에 너무
    가까이 가지 않기 위해 길이 다시 남쪽으로 꺾이는 것이 보인다. 산들은 사막 바람을 어느 정도 막아 주지만, 여기에서도 그 바람이 느껴진다. 동쪽에서 불어오는 따뜻한 바람은 그곳에
    숨겨진 신비로움을 일깨워 주는 듯하다.

tba:101:room:10135:
  name: 남쪽 길
  description: >-
    도로는 서쪽의 울창한 숲과 동쪽의 산 사이로 언덕을 파먹으며 나아가는 거대한 뱀처럼 남쪽으로 뻗어 있다. 서쪽 숲에서는 눈에 보이지 않는, 어쩌면 이름조차 알려지지 않은 짐승들의
    소리가 들려온다. 그러나 숲 안에서 기다리고 있을 모험으로 가는 길을 빽빽한 덤불과 나무가 막고 있어, 지금으로서는 들어갈 방법이 보이지 않는다. 이곳의 바람은 뜨겁고 메마른
    사막의 공기와 산 빙하에서 내려오는 살을 에는 냉기가 묘하게 뒤섞여 있다.

tba:101:room:10136:
  name: 남쪽 길
  description: >-
    길은 북쪽으로 이어지다가 서쪽으로 꺾이고, 남쪽으로는 동쪽의 산과 서쪽의 울창한 숲 사이에 놓인 산기슭 구릉지대를 지나간다. 숲에서 짐승 소리가 들려오지만, 이 근처는 숲이 너무
    빽빽해 들어갈 수 없다.

tba:101:room:10137:
  name: 남쪽 길
  description: >-
    당신은 남쪽 길 위에 있다. 이 길은 북쪽과 남쪽으로 이어지며, 서쪽의 울창한 숲과 동쪽에 우뚝 솟아 당신을 내려다보는 산 사이의 언덕을 지나간다. 동쪽 산에서 차가운 바람이
    몰아쳐 숲에서 들려오는 소리를 삼킨다. 여기서 동쪽 산 쪽으로 난 작은 오솔길이 간신히 눈에 띈다.

tba:101:mob:10100:
  short: 농부 밥
  long: 농부 밥이 잃어버린 소를 찾아 여기저기 돌아다닌다.
  description: 그는 몹시 늙고 지쳐 보인다. 평생 농장에서 고되게 일한 탓에 제 나이보다 훨씬 늙어 버렸다.

tba:101:mob:10101:
  short: 길 잃은 소
  long: 소 한 마리가 정처 없이 돌아다니며 눈에 띄는 풀을 뜯어 먹는다.
  description: 소는 크고 갈색이며, 짧은 털가죽을 가지고 있다. 농장에서 길러져 온 덕분에 매우 온순하고 친근하다. 이렇게 돌아다니는 것은 이상하다.

tba:101:mob:10102:
  short: 적갈색 족제비
  long: 적갈색 족제비가 길가를 기어간다.
  description: 족제비는 자기보다 큰 동물도 사냥감으로 삼을 수 있는 설치류다. 매우 영리하고 수완도 좋다.

tba:101:mob:10103:
  short: 송아지
  long: 갓 태어난 송아지가 어미를 찾고 있다.
  description: 송아지는 제 네 다리로 겨우 걸음을 뗄 정도다. 어미를 찾는지 비틀비틀 당신 쪽으로 다가온다.

tba:101:mob:10104:
  short: 어린 암소
  long: 어린 암소가 당신을 올려다본다.
  description: 이 어린 암소는 아직 새끼를 낳아 본 적이 없다.

tba:101:mob:10105:
  short: 어부
  long: 어부가 갓 잡은 물고기를 팔려고 도시 사이를 오간다.
  description: 그는 돈을 벌러 가는 길인지 성큼성큼 힘찬 걸음으로 지나간다.

tba:101:mob:10106:
  short: 약탈하는 산적
  long: 산적이 보이는 모든 것을 약탈한다.
  description: 산적이 얼굴 가득 함박웃음을 띠고 손을 흔들며 당신에게 인사한다. 방금 한탕 크게 챙긴 모양이다.

tba:101:mob:10107:
  short: 도둑맞은 상인
  long: 상인이 최근 입은 손해 때문에 울고 있다.
  description: >-
    성인이 울고 있는 모습을 보는 것은 부끄러운 일이지만, 그는 많은 것을 잃었다. 그는 당신에게 자신의 대상 행렬이 강도들에게 약탈당했다고 이야기한다. 그가 쌓아온 모든 부가 순식간에
    사라진 것이다.

tba:101:mob:10108:
  short: 예지력을 가진 집시
  long: 집시가 자신의 예지력을 자랑하더니, 당신의 미래에 충격을 받아 당신을 빤히 쳐다본다.
  description: 그녀는 당신의 손바닥을 움켜쥐더니 공포에 질린 얼굴로 당신의 눈을 올려다본다. 그녀가 말한다. '푼돈만 내면 댁의 앞날을 알려 주지.'

tba:101:mob:10109:
  short: 탐욕스러운 상인
  long: 탐욕스러운 상인이 최근 강도를 당해 값나가는 것이 하나도 없다.
  description: 그는 잃은 것 때문에 속이 상해 있지만, 그것을 모두 되찾을 방법을 알고 있다.

tba:101:mob:10110:
  short: 마멋
  long: 당신이 다가가자 털이 복슬복슬한 작은 갈색 마멋이 굴 쪽으로 달아난다.
  description: 털이 희끗희끗하고 땅딸막한 마멋이다. 몸이 낮게 붙어 있고 작은 개 정도 크기다.

tba:101:mob:10111:
  short: 방랑자
  long: 방랑자가 자신의 여러 임무 가운데 하나를 수행하는 중이다.
  description: 그녀는 거친 삼베 자루 하나만 걸치고, 오직 그녀만이 아는 무언가나 누군가를 찾아 왕국을 떠돈다.

tba:101:mob:10112:
  short: 버바
  long: 버바가 밀주에 살짝 취해 비틀거리며 지나간다.
  description: 그에게서 집에서 담근 밀주 냄새가 진동한다. 아마 옥수수로 빚은 술일 것이다. 전형적인 산골 촌뜨기로, 이름이 그에게 딱 어울린다.

tba:101:obj:10100:
  short: 관개용 수로
  long: 밭에 물을 대기 위해 길을 가로질러 관개 수로가 파여 있다.
  extras:
  - text: 도랑에는 얼마 전 내린 비로 깨끗한 물이 가득 차 있다. 물은 길에 놓인 작은 나무 격자 아래로 지나간다. 물은 맑고 시원해 보인다.

tba:101:obj:10101:
  short: 대상 행렬
  long: 최근의 습격으로 불타 잔해가 된 수레들이 대상 행렬을 이루고 있다.
  extras:
  - text: 여러 종류의 수레가 대상 행렬을 구성한다. 도시들 사이로 물고기와 농작물을 운반하던 것 같다. 물론 강도나 용병 무리가 약탈하기 전까지는.

tba:101:obj:10102:
  short: 연어 몇 점
  long: 갓 필렛으로 손질한 신선한 연어 몇 점이 놓여 있다.
  extras:
  - text: 연어 스테이크가 먹음직스러워 보인다. 덜 익었다는 점만 빼면.

tba:101:obj:10103:
  short: 큰 양의 농작물과 생선
  long: 큰 양의 농작물과 생선.
  extras:
  - text: 밀, 옥수수, 쌀 같은 여러 종류의 농작물이 물고기 상자 옆에 펼쳐져 있다.

tba:101:obj:10104:
  short: 분뇨로 뒤덮인 삽
  long: 소똥을 뒤집어쓴 삽 하나가 여기서 고약한 냄새를 풍기고 있다.
  extras:
  - text: 삽에서 외양간과 소 냄새가 진동한다. 이 끝부터 저 끝까지 분뇨로 뒤덮여 있다.

tba:101:obj:10105:
  short: 낡은 작업복
  long: 닳고 험하게 쓰인 작업복 한 벌이 버려져 있다.
  extras:
  - text: 농부들이 입는 작업복 한 벌이다. 가볍지만 튼튼한 천으로 만들어졌다. 험하게 입어 온 탓에 이제 버릴 때가 다 된 것 같다.

tba:101:obj:10106:
  short: 소 방울
  long: 이 방울은 소 목에 걸도록 만들어졌다.
  extras:
  - text: 황동 방울이 길이를 조절할 수 있는 가죽 끈에 달려 있다.

tba:101:obj:10107:
  short: 소 코에 거는 고리
  long: 작은 소 코뚜레가 반짝반짝 빛난다.
  extras:
  - text: 이 고리는 단단한 황동으로 만든 것으로, 소가 어미의 젖을 빨지 못하게 막는 데 쓰인다.

tba:101:obj:10108:
  short: 낚시 장대
  long: 낚시 장대에는 줄이나 바늘, 추가 하나도 걸려 있지 않아 텅 비어 보인다.
  extras:
  - text: 이 장대는 처음 보는 나무로 만들어져 대나무를 떠올리게 한다. 아주 잘 휘면서도 튼튼하다.

tba:101:obj:10109:
  short: 산적용 복면
  long: 산적의 복면이 누군가 써 주기를 기다리고 있다.
  extras:
  - text: 천으로 만든 가면을 검게 물들여 눈과 입을 위한 구멍을 뚫어 놓았다. 매우 투박하고 극도로 가렵다.

tba:101:obj:10110:
  short: 위장 바지
  long: 검정과 갈색으로 물들여 주변 환경에 자연스럽게 녹아드는 위장 바지 한 벌이다.
  extras:
  - text: 바지는 마포로 만들어졌으며, 주변 지형에 녹아들도록 짙은 검정과 갈색으로 물들여져 있다.

tba:101:obj:10111:
  short: 위장 모카신
  long: 주변에 자연스럽게 녹아드는 위장용 모카신 한 켤레가 놓여 있다.
  extras:
  - text: 이 털 모카신은 주변과 어우러지도록 갈색과 검은색으로 물들여져 있다.

tba:101:obj:10112:
  short: 위장 장갑
  long: 위장 장갑 한 켤레가 주변에 감쪽같이 녹아들어 있다.
  extras:
  - text: 장갑은 갈색, 검정, 초록색으로 물들여져 착용자가 황야에서 몸을 숨기도록 돕는다.

tba:101:obj:10113:
  short: 찢어진 소매
  long: 한때는 고급스러웠던 코트가 소매가 뜯겨 나간 채 여기 버려져 있다.
  extras:
  - text: 수 놓인 소매를 보니 이 코트는 무척 고급스러웠던 모양이다. 하지만 지금은 마구 찢기고 해져 있다.

tba:101:obj:10114:
  short: 병
  long: 싸구려 럼주 한 병이 여기 놓여 있다.
  extras:
  - text: 이런 병 안에서 위안과 보호를 찾는 이가 많다. 적어도 머리가 둔하고 가망 없는 자들은 말이다.

tba:101:obj:10115:
  short: 허리 주머니
  long: 이 멋들어진 허리 주머니는 고급 가죽으로 만들어졌다.
  extras:
  - text: 허리 주머니는 최고급품으로, 황동 잠금장치와 가죽 허리띠가 하나로 결합된 훌륭한 주머니이다.

tba:101:obj:10116:
  short: 집시 팔찌
  long: 집시의 팔찌가 밝게 반짝인다.
  extras:
  - text: 팔찌가 반짝거린다. 가짜 다이아몬드와 에메랄드가 가짜 금에 박혀 있다. 하지만 멀리서 보면 꽤 진짜처럼 보인다.
