tba:32:room:3200:
  name: 다리 아래
  description: 다리 아치 아래는 강 표면에서 약 30센티미터 위까지 해초로 덮여 있다. 물은 도시 성벽 하단의 구멍을 통해 잔잔하게 흐른다.
  extras:
  - text: 일종의 회반죽 같은 것으로 서로를 단단히 붙여 놓은 큰 회색 바위들로 지어졌다. 꽤 튼튼해 보인다.

tba:32:room:3201:
  name: 강 위
  description: 여기서 북쪽으로 가시면 빈민가 골목의 초라한 건물들이 보인다. 강은 서쪽의 다리 방향으로 흐른다. 강기슭이 너무 가파라 오를 수 없다.

tba:32:room:3202:
  name: 강 위
  description: 여기서 북쪽으로 가시면 쓰레기장이 보인다. 강은 동쪽에서 서쪽으로 흐른다. 강기슭이 너무 가파라 오를 수 없다.

tba:32:room:3203:
  name: 강 위
  description: 강둑은 바로 북쪽에 있다. 강은 동서 방향으로 흐른다.

tba:32:room:3204:
  name: 강가
  description: 당신은 북쪽 강둑에 있는 창고를 본다. 동쪽으로는 도시 성벽이 보인다. 강은 서쪽의 강둑 방향으로 흐른다.

tba:32:room:3205:
  name: 강가
  description: 강은 동쪽 도시 성벽의 구멍으로 들어온다. 성벽에 박힌 세로로 세워진 여러 개의 철제 막대가 그 구멍을 막고 있다.
  exits:
    east:
      look: 철제 막대 때문에 성벽의 구멍을 통과하기가 어렵다. 막대 너머로 보면, 강이 동쪽 산맥 아래 동굴로 이어져 있는 것을 볼 수 있다.
