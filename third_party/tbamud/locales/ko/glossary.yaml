  - {"en": "to the west you can see what almost appears to be a golden light.", "bad": "서쪽으로는 거의 황금빛으로 보이는 것이 보인다.", "good": "서쪽으로는 황금빛에 가까운 빛이 보인다.", "added_by": "review 41 2026-10-03"}
