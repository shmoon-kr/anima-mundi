  - {ko: "들어본 적 없는", en: "ever been", why: "'ever been in' is 들어가 본, not 들어본 (heard of)"}
  - {ko: "자신을 발견한다", en: "find yourself", why: "'You find yourself ...' is plain narration: 당신은 ...에 있다/서 있다"}
  - {ko: "애완 용", why: "reads as 애완용 (for pets): 누군가 기르던 용, 애완동물인 용"}

conventions:
  narration: >-
    Room, mob and object descriptions are narration in 해라체 (평서형 "~다"), addressing the player as "당신".
    Keep the tone of the original (jokes, exclamations, a bored or spooky voice).
  names: >-
    Foreign personal names and real-world names are transliterated by the 국립국어원 외래어 표기법 (Juan → 후안).
    Names of places, inns, shops and guilds that mean something in English are translated by meaning.
  classes: >-
    The four classes are 전사 (warrior; also "swordsman", "fighter"), 마법사 (mage, magic user), 성직자 (cleric; also
    "priest" when it means the class), 도적 (thief). Guilds and their bars follow the class names, so the original's mix
    of Swordsmen and fighters is 전사 everywhere.
  units: >-
    Imperial units become metric with "약" (4 feet → 약 120센티미터, a mile → 약 1.6킬로미터). Idioms are not
    measures: "missed by a mile" → 한참 빗나갔다, "by an inch" → 간발의 차로, "six feet under" → 땅속 깊이.
  keep: Numbers, punctuation and any English the glossary marks `keep` stay as they are.
  sight: >-
    "You see X." (what an exit shows) is "X이/가 보인다.", not "당신은 X을 본다.". "ever been in" is
    "들어가 본", not "들어본" (heard of).

