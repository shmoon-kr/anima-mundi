  - {"en": "he wouldn't take kindly to an attempt to get past him", "bad": "그를 지나가려는 시도를 좋게 받아들이지 않을 것 같다", "good": "그를 지나쳐 가려 하면 순순히 보고만 있지는 않을 것 같다", "added_by": "review 150 2026-10-03"}
