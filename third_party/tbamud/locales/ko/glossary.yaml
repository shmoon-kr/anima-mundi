# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean glossary for translating tbaMUD content (D19).
# Made by Claude before the local-LLM batch, for the phase-1 zones: Midgaard (30) and the Newbie Zone (186).
# The batch puts the entries that occur in a text into the prompt, and the check (D19) verifies them.
# Commands and keywords stay English and are never translated (D17); the renderer adds them in parentheses (D18).

# Pairs of a bad and a good Korean line, put in every prompt (a local model follows examples).
examples:
  - {en: "You see the main street.", bad: "당신은 큰길을 본다.", good: "큰길이 보인다."}
  - {en: "the largest cave you have ever been in", bad: "지금까지 들어본 적 없는 가장 큰 동굴", good: "지금까지 들어가 본 가장 큰 동굴"}
  - {en: "a pair of leather sleeves", bad: "가죽 팔찌 한 쌍", good: "가죽 팔 보호대 한 쌍"}
  - {en: "You find yourself standing in a cave.", bad: "당신은 동굴에 서 있는 자신을 발견한다.", good: "당신은 동굴에 서 있다."}

# Korean a review rejected, checked on every answer like Han leaks: `ko` a regex on the Korean,
# `en` (optional) a regex the English must match for it to count.
