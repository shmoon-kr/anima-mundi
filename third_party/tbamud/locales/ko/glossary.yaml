  - {"en": "You are on a north-south trail through the woods.", "bad": "당신은 숲을 관통하는 북-남 방향의 산길 위에 있다.", "good": "당신은 숲을 남북으로 가로지르는 오솔길 위에 있다.", "added_by": "review 35 2026-10-03"}
