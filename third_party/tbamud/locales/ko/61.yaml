tba:61:room:6100:
  name: 깊고 어두운 숲을 지나는 좁은 오솔길
  description: 당신은 거대한 회색 줄기 사이로 굽이치는 좁은 오솔길 위에 있다. 나무들의 우듬지가 매우 우거져 숲 바닥은 칠흑같이 어둡다. 오솔길은 동쪽과 서쪽으로 이어진다.
  exits:
    north:
      look: 그늘진 작은 길이 북쪽으로 이어진다.
    east:
      look: 좁은 오솔길이 숲의 다소 밝은 쪽으로 동쪽으로 이어진다.
    west:
      look: 좁고 먼지가 많은 오솔길이 숲을 지나 서쪽으로 이어진다.
  extras:
  - text: 이 고목들은 아마도 아주, 아주 오랜 세월 동안 여기 서 있었을 것이다. 가장 아래 가지 위로의 풍경을 한눈에 볼 수도 없다.
  - text: 거대한 줄기에 비해 어둡고 먼지가 많은 오솔길은 가냘프게 보인다. 일부 곳에서는 거대한 회색 뿌리가 오솔길 표면을 뚫고 올라와 있다.

tba:61:room:6101:
  name: 깊고 어두운 숲을 지나는 좁은 오솔길
  description: >-
