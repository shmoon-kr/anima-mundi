    south:
      look: 길이 남쪽으로, 오솔길을 벗어나 이어진다.
    west:
      look: 먼지 자욱한 좁은 오솔길이 숲을 지나 서쪽으로 이어진다.
  extras:
  - text: 이 고목들은 아마도 아주, 아주 오랜 세월 동안 여기 서 있었을 것이다. 가장 아래 가지 위로의 풍경을 한눈에 볼 수도 없다.
  - text: 주위를 둘러싼 거대한 나무 줄기에 비해 이 길은 가냘프고 불안해 보인다.
  - text: 거대한 줄기에 비해 어둡고 먼지가 많은 오솔길은 가냘프게 보인다. 일부 곳에서는 거대한 회색 뿌리가 오솔길 표면을 뚫고 올라와 있다.

