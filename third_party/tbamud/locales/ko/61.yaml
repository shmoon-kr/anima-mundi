    당신은 거대하고 오래된 나무들이 사방으로 바짝 둘러선 사이로 동서로 굽이치는 먼지 낀 오솔길 위에 있다. 소리 하나 들리지 않는다. 모든 것이 섬뜩할 만큼 고요하다.
  exits:
    east:
      look: 좁고 먼지가 낀 오솔길이 숲을 지나 동쪽으로 이어진다.
    west:
      look: 좁고 먼지가 많은 오솔길이 숲을 지나 서쪽으로 이어진다.
  extras:
  - text: 이 고목들은 아마도 아주, 아주 오랜 세월 동안 여기 서 있었을 것이다. 가장 아래 가지 위로의 풍경을 한눈에 볼 수도 없다.
  - text: 거대한 줄기에 비해 어둡고 먼지가 많은 오솔길은 가냘프게 보인다. 일부 곳에서는 거대한 회색 뿌리가 오솔길 표면을 뚫고 올라와 있다.

tba:61:room:6130:
  name: 깊고 어두운 숲을 지나는 좁은 오솔길
  description: >-
    당신은 거대하고 고대적인 나무들이 사방에 빽빽이 서 있는 사이로 서쪽으로 굽이치는 먼지 낀 오솔길 위에 있다. 나무줄기에는 끈적한 물질이 덮여 있는데, 서쪽으로 갈수록 훨씬 더
    끈적해진다! 조심하라!
  exits:
    east:
      look: 좁고 먼지가 낀 오솔길이 숲을 지나 동쪽으로 이어진다.
    west:
      look: >-
        끈적한 물질이 오솔길 바로 위, 나무들 사이로 줄기처럼 매달려 있다. 서쪽으로는 오솔길이 이 거대한 실에 풀이 묻어 있는 것으로 덮여 있는 것처럼 보인다. 서쪽에서 악의
        기운이 느껴지고, 당신의 뼈가 앞으로 나아가는 것은 좋은 생각이 아닐지도 모른다고 말하고 있다.
  extras:
  - text: 끈적한 물질이 고대적인 나무들 사이로 줄기처럼 매달려, 손이 닿지 않을 정도로 오솔길을 가로지르고 있다. 끈적한 줄기 중 하나를 기어 올라갈 수 있을지도 모른다.
  - text: 거대한 줄기에 비해 어둡고 먼지가 많은 오솔길은 가냘프게 보인다. 일부 곳에서는 거대한 회색 뿌리가 오솔길 표면을 뚫고 올라와 있다.
  - text: 그 물질은 풀이 묻은 거대한 실을 떠올리게 한다. 크기가 아니었다면 거미줄의 일부라고 확신했을 것이다.

tba:61:room:6131:
  name: 치명적인 거미줄
  description: >-
    당신은 좁은 오솔길을 따라 걸어가며, 앞으로 나아가는 동안 끈적한 줄기 아래로 몸을 숙이고 있다... > 거대하고 독이 있는 거미가 위에서 떨어진다! 거대하고 독이 있는 거미가
    위에서 떨어진다! 거대하고 독이 있는 거미가 위에서 떨어진다! > 거대하고 독이 있는 거미가 당신을 찌른다! 독을 저항한다! 거대하고 독이 있는 거미가 당신을 찌른다! 중독되었다!
    거대하고 독이 있는 거미가 당신을 찌른다! 중독되었다!

tba:61:room:6132:
  name: 나무 위
  description: >-
    당신은 끈적한 물질로 뒤덮인 거대한 나무줄기 바깥쪽에 매달려 있다. 바로 서쪽에는 당신이 매달려 있는 나무를 포함해 수많은 거대한 나무들 사이에 걸린 거대한 거미줄이 있다. 북쪽에는
    거대한 거미줄로 된 입구처럼 보이는 것이 있다.
  exits:
    north:
      look: 북쪽으로는 나무들 사이로 아주 멀리까지 뻗어 나가는 거대한 거미줄이 보인다.
    west:
      look: 서쪽으로는 거대한 거미줄이 있다. 거미줄이 부드럽게 움직이는 것 같다.
    down:
      look: 아래로는 좁은 숲속 오솔길이 보인다.
  extras:
  - text: 거미줄이 서쪽으로 뻗어 있다. 그 위를 걸을 수 있을 것 같다.

tba:61:room:6133:
  name: 거미줄 위
  description: >-
    당신은 거대한 거미줄을 제자리에 고정시키는 끈적한 거대한 실 위에 조심스럽게 균형을 잡고 서 있다. 동쪽에는 거대한 나무줄기가 있고, 서쪽에는 수많은 층의 거미줄로 만들어진 동굴
    같은 구조물의 입구가 있다.
  exits:
    east:
      look: 동쪽으로는 거대한 나무줄기가 보인다.
    west:
      look: 서쪽으로는 동굴 같은 구조물의 입구가 보인다.
  extras:
  - text: 지름이 약 6미터인 불규칙한 원형의 바닥을 덮고 있으며, 높이는 거의 3미터에 달한다. 매우 오래된 것처럼 보인다.
  - text: 거대한 거미줄이 부드럽게 움직인다.

tba:61:room:6134:
  name: 여왕 거미의 굴
  description: >-
    당신은 온통 수많은 층의 거미줄로 만들어진 것처럼 보이는 동굴 같은 구조물 안에 있다. 온도와 습도가 매우 높아 여기 맴도는 악취가 나는 공기를 숨쉬기 힘들다. 벽에는 터진 번데기들이
    뒤덮여 있다.
  exits:
    east:
      look: 이곳에 비하면 동쪽 출구는 꽤 매력적으로 보인다.
  extras:
  - text: 고치들은 안에서 무언가가 정말로 빠져나오고 싶었던 듯 터져 있다. 크기는 사람의 머리만 하다.
  - text: 끈적한 벽에 터진 번데기들이 뒤덮여 있다.

tba:61:room:6135:
  name: 깊고 어두운 숲 속의 먼지 낀 오솔길
  description: 당신은 깊고 어두운 숲을 가로지르는 먼지 낀 오솔길 위에 있다. 고대부터 자라온 회색 나무들이 사방에서 위압적으로 솟아 있다. 오솔길은 북쪽과 동쪽으로 이어진다.
  exits:
    north:
      look: 먼지 낀 오솔길이 나무들 사이를 지나 북쪽으로 이어진다.
    east:
      look: 먼지 낀 오솔길이 나무들 사이를 지나 동쪽으로 이어진다.
  extras:
  - text: 고대의 회색 거인들이 침묵 속에서 당신을 지켜보고 있는 듯하다.

tba:61:room:6136:
  name: 깊고 어두운 숲 속의 먼지 낀 오솔길
  description: >-
    당신은 깊고 어두운 숲을 가로지르는 먼지 낀 오솔길 위에 있다. 오래된 회색 나무들이 사방에 우뚝 솟아 있다. 오솔길은 남쪽과 서쪽으로 이어진다. 오솔길에서 동쪽으로 벗어나 넓고
    불규칙한 길이 나 있다.
  exits:
    east:
      look: 길 양옆에 서 있는 나무들에 긁힌 자국이 있다.
    south:
      look: 먼지 낀 오솔길이 나무 사이를 지나 남쪽으로 이어진다.
    west:
      look: 먼지 낀 오솔길이 나무 사이를 지나 서쪽으로 이어진다.
  extras:
  - text: 거대한 줄기에 비해 어둡고 먼지가 많은 오솔길은 가냘프게 보인다. 일부 곳에서는 거대한 회색 뿌리가 오솔길 표면을 뚫고 올라와 있다.
  - text: 길 양옆에 서 있는 나무들에 긁힌 자국이 있다.
  - text: 동쪽으로는 오래된 회색 거목들이 마치 거대한 발톱을 가진 무언가가 분노에 차 이를 할퀸 듯 수많은 자국으로 뒤덮여 있다.

tba:61:room:6137:
  name: 깊고 어두운 숲을 지나는 오솔길 끝
  description: >-
    당신은 깊고 어두운 숲을 가로지르는 먼지 낀 오솔길 위에 있다. 오래된 회색 나무들이 당신을 사방에서 에워싸고 있다. 작은 오솔길이 북쪽으로 이어지고, 그 외 유일한 출구는 큰길을
    따라 동쪽이다.
  exits:
    north:
      look: 좁은 오솔길이 덤불 사이로 북쪽으로 이어진다.
    east:
      look: 먼지 낀 오솔길이 나무들 사이를 지나 동쪽으로 이어진다.
  extras:
  - text: 고대의 회색 거인들이 침묵 속에서 당신을 지켜보고 있는 듯하다.

tba:61:room:6138:
  name: 좁은 오솔길 위
  description: >-
    오솔길은 하온-도르 숲 이 지역의 짙은 덤불 사이로 북쪽과 남쪽으로 이어진다. 오래된 회색 나무들이 당신을 사방에서 에워싸고 있다. 덤불이 길 위로 다소 불길하게 가까이 숙여져
    있지만, 당신은 쉽게 이를 무시한다. 남쪽으로 조금 더 가면 오솔길이 다소 넓어지는 것으로 보인다.
  exits:
    north:
      look: 좁은 오솔길이 덤불 사이로 북쪽으로 이어진다.
    south:
      look: 먼지 낀 오솔길이 나무들 사이를 지나 동쪽으로 이어진다.
  extras:
  - text: 고대의 회색 거인들이 침묵 속에서 당신을 지켜보고 있는 듯하다.

tba:61:room:6139:
  name: 좁은 오솔길 위
  description: >-
    오솔길은 하온-도르 숲 이 지역의 짙은 덤불 사이로 북쪽과 남쪽으로 이어진다. 이 구간은 놀라울 정도로 많이 다닌 흔적이 보인다. 덤불이 길 위로 다소 불길하게 가까이 숙여져
    있지만, 당신은 쉽게 이를 무시한다.
  exits:
    north:
      look: 북쪽으로 조금 더 가면 반짝이는 것이 보인다.
    south:
      look: 길이 덤불 사이로 남쪽으로 이어진다.

tba:61:room:6142:
  name: 깊고 어두운 숲 속, 동굴 밖
  description: >-
    당신은 넓고 불규칙한 길의 끝자락에 서 있다. 북쪽에는 매우 크고 불길해 보이는 동굴 입구가 있다. 여기의 나무들은 마치 거대한 발톱을 가진 무언가가 분노에 차려 뜯어놓은 듯한
    자국으로 가득하다.
  exits:
    north:
      look: 동굴 입구에서 거대한 파충류의 역겨운 냄새가 풍겨 나온다.
    west:
      look: 오솔길이 서쪽으로 굽이쳐 이어진다.
  extras:
  - text: 동굴 입구에서 거대한 파충류의 역겨운 냄새가 풍겨 나온다.
  - text: 고대 회색 거목들은 마치 거대한 발톱을 가진 무언가가 분노에 차려 뜯어놓은 듯한 자국으로 가득하다.

tba:61:room:6143:
  name: 녹색 용의 동굴
  description: 당신은 거대한 자연 동굴 안에 있다. 바닥에는 온갖 종류의 뼈가 널려 있고, 악취가 너무 심해 칼로 자를 수 있을 정도다. 유일한 출구는 남쪽이다.
  exits:
    south:
      look: 출구는 숲 밖으로 이어진다.
  extras:
  - text: 바닥에 널린 뼈 대부분은 인간의 것으로 보인다.

tba:61:room:6150:
  name: 좁은 오솔길
  description: >-
    이 오솔길은 당신이 본 다른 어떤 오솔길보다 훨씬 더 섬뜩해 보인다. 나무에 흔히 보이는 짐승의 발톱 자국과 이빨 자국이 점점 드물어지고 있다. 오솔길은 북쪽으로 이어진다.
  exits:
    north:
      look: 좁은 오솔길이 북쪽으로 이어진다.
    south:
      look: 오솔길이 숲의 주요 길과 교차한다.

tba:61:room:6151:
  name: 좁은 오솔길
  description: 이 오솔길 구간도 매우 기이하다. 짐승의 흔적이라곤 전혀 보이지 않는다. 주변 나무들의 구조 때문에 오솔길이 동쪽으로 급하게 꺾여 나간다.
  exits:
    east:
      look: 오솔길이 동쪽으로 굽어진다.
    south:
      look: 오솔길의 시작점.

tba:61:room:6152:
  name: 나무의 원형
  description: >-
    여기 있는 나무들은 중앙의 거대한 나무를 중심으로 원형을 이루고 있는 듯하다. 동쪽의 거대한 나무에 새겨진 나무 문이 보인다. 당신이 여기까지 따라온 오솔길은 나무 밑동에서 끝나는
    것 같다.
  exits:
    east:
      look: 나무 문이 아름답게 새겨져 있다.
    west:
      look: 오솔길이 굽어지는 곳.

tba:61:room:6153:
  name: 거대한 나무의 내부
  description: 당신은 이 속이 빈 나무 안으로 들어섰다. 여기서 계단이 어둠 속으로 내려가거나, 서쪽으로 나가 나무 밖으로 나갈 수 있다.
  exits:
    west:
      look: 문이 아름답게 새겨져 있다.
    down:
      look: 계단이 당신의 몸무게쯤은 너끈히 버텨 줄 것 같다.

tba:61:room:6154:
  name: 지하 복도
  description: >-
    이 복도는 분명 나무의 뿌리 중 하나가 속이 비어 만들어진 것이다. 복도는 남쪽으로 이어지며, 그곳에서는 이상한 소리가 들리는 방으로 통한다. 또는 계단을 올라갈 수도 있다.
  exits:
    south:
      look: 복도가 꽤 웅장해 보인다.
    up:
      look: 계단이 당신의 몸무게쯤은 너끈히 버텨 줄 것 같다.

tba:61:room:6155:
  name: 종교집단의 사당
  description: >-
    당신이 섬기지 않는 신을 위해 지어진 이 사당은 참으로 아름다운 곳이지만, 여기서 시간을 보내는 것이 매우 불편하게 느껴진다. 방에 들어서자 나무 제단이 거의 빛나는 것처럼 보인다.
    유일한 출구는 당신이 들어온 길이다.
  exits:
    north:
      look: 북쪽의 복도가 꽤 웅장해 보인다.

tba:61:mob:6100:
  short: 잔인한 워그
  long: 잔인한 워그가 여기 있다. 당신을 향해 화난 듯 으르렁거리고 있다.
  description: 거대한 늑대인데, 두꺼운 검은 털을 가지고 있다. 길고 하얀 송곳니에서 침이 빠르게 흘러내리고 있다. 꽤 위험해 보이고 매우 화가 난 모습이다.

tba:61:mob:6101:
  short: 포악한 워그
  long: 포악한 워그가 여기 있다. 당신을 향해 화난 듯 으르렁거리고 있다.
  description: 거대한 늑대인데, 두꺼운 검은 털을 가지고 있다. 길고 하얀 송곳니에서 침이 빠르게 흘러내리고 있다. 꽤 위험해 보이고 매우 화가 난 모습이다.

tba:61:mob:6102:
  short: 크고 회색인 늑대
  long: 커다란 회색 늑대가 굶주린 눈으로 당신을 노려보고 있다.
  description: 크고 회색인 늑대가 당신을 흥미롭게 바라보며 입술을 핥고 있다.

tba:61:mob:6103:
  short: 크고 검은 늑대
  long: 크고 검은 늑대가 여기 있다. 당신을 향해 굶주린 듯 노려보고 있다.
  description: 크고 검은 늑대가 입맛을 다시며 당신을 흥미롭게 바라보고 있다.

tba:61:mob:6110:
  short: 고대 나무
  long: 거대하고 고대적인 나무가 당신을 우뚝 바라보고 있다.
  description: >-
    그 뿌리는 극도로 크고, 상당 부분이 지상으로 드러나 있다. 뭔가 이 나무가 평범한 참나무가 아니라는 생각이 든다. 거대한 회색 줄기가 마치 깊은 한숨을 쉬듯 살짝 떨리고 있다.

tba:61:mob:6111:
  short: 고대 나무
  long: 거대하고 고대적인 나무가 당신을 우뚝 바라보고 있다.
  description: >-
    그 뿌리는 극도로 크고, 상당 부분이 지상으로 드러나 있다. 뭔가 이 나무가 평범한 참나무가 아니라는 생각이 든다. 거대한 회색 줄기에서 깊은 신음소리가 흘러나온다.

tba:61:mob:6112:
  short: 초록 용
  long: 거대한 초록 용이 여기 있으며, 가느다란 노란 눈이 분노로 빛나고 있다.
  description: >-
    이 거대한 날개 달린 뱀은 거대한 몸체의 대부분을 어두운 초록색 비늘이 덮고 있다. 무거운 날개에 난 수많은 구멍과 머리 뿔에 난 긁힘 자국은 수많은 전투를 말해 준다. 용만이
    낼 수 있는 그토록 역겨운 냄새가 난다.

tba:61:mob:6113:
  short: 거대하고 독이 있는 거미
  long: 거대하고 독이 있는 거미가 여기 있다.
  description: >-
    이 역겨운 생물체는 네 발로 기어가는 인간의 크기와 비슷하다. 여덟 개의 털이 난 다리는 거의 모든 표면에서 엄청난 속도를 내어 주며, 날카로운 독 이빨은 먹이를 마비시키거나
    죽인다.

tba:61:mob:6114:
  short: 거미 여왕
  long: 거대하고 통통한 거미 여왕이 여기 있다.
  description: >-
    이 역겨운 생물은 작은 코끼리만 하다. 여덟 개의 거대하고 털이 많은 다리를 지니고 있어, 몸이 이렇게 엄청나게 비만하지 않았다면 거의 모든 지형에서 엄청난 속도로 달렸을 것이다.
    크고 둥근 눈이 당신을 노려보고 있다.

tba:61:mob:6115:
  short: 샤르구
  long: 숲 브라우니 샤르구가 여기 있다. 당신을 향해 활짝 웃고 있다.
  description: >-
    이 작은 녀석은 키가 약 90센티미터밖에 되지 않으며, 거칠게 엉킨 갈색 머리카락과 길게 뭉친 갈색 수염을 기르고 있다. 너덜너덜한 갈색과 녹색 옷을 입고 있으며, 아주 재미있는
    시간을 보내는 것처럼 보인다.

tba:61:mob:6116:
  short: 원로 드루이드
  long: 원로 드루이드가 여기 있다. 그는 당신이 그의 집에 들어와 있는 것을 매우 불쾌해하고 있다.
  description: 그 드루이드는 꽤 늙어 보인다. 존경할 만한 인물로 여겨지지만, 동시에 그는 강력한 적수가 될 것임을 당신은 안다.

tba:61:mob:6117:
  short: 다크엘프 이샤
  long: 다크엘프 이샤가 여기 있다. 당신을 조용히 지켜보고 있다.
  description: >-
    그녀는 밤하늘처럼 어두운 피부와 달빛에 반짝이는 은빛 머리카락을 지닌, 그 누구도 부인할 수 없는 미인이다. 가느다란 몸매에는 무소매 셔츠와 은실로 이어 붙인 검은 비늘로 만든
    짧은 치마를 입고 있다. 등에는 피부만큼이나 검은 큰 후드 망토가 걸려 있으며, 넓은 은색 허리띠에는 은색 검집에 담긴 길고 가느다란 검이 차여 있다.

tba:61:obj:6101:
  short: 간판
  long: 낡고 찌그러진 간판 하나가 땅 위에 놓여 있다.

tba:61:obj:6102:
  short: 거대한 나무
  long: 거대한 나무가 서쪽 길을 가로막고 있다.
  extras:
  - text: >-
      이 거대한 나무는 아마 천 년은 되었을 것이다. 거친 껍질은 회색빛이 도는 창백한 색을 띠고 있으며, 긁힌 자국과 발톱 자국으로 뒤덮여 있다. 서쪽 면에는 지면 바로 위에
      작은 구멍이 하나 있다.
  - text: 구멍은 당신이 몸을 비집고 들어갈 수 있을 정도로 좁지 않다. 하지만 나무 속이 텅 비어 있는 것처럼 보인다.

tba:61:obj:6103:
  short: 긴 회색 가지
  long: 긴 회색 가지가 무겁게 땅 위에 놓여 있다.
  extras:
  - text: 꽤 무겁고 높은 곳에서 떨어진 것처럼 보인다. 이미 오래전부터 죽어 매우 마른 상태다. 아마 쉽게 불을 붙일 수 있을 것이다.

tba:61:obj:6104:
  short: 긴 회색 가지
  long: 긴 회색 가지가 무겁게 땅 위에 놓여 있다.
  extras:
  - text: >-
      매우 무겁고 높은 곳에서 떨어진 것처럼 보인다. 길고 곧으며 나무가 매우 단단하고 여전히 수액이 가득 차 있다. 손에 잘 맞지는 않지만, 어설프지만 매우 무거운 무기로 사용할
      수 있을 것이다.

tba:61:obj:6105:
  short: 긴 회색 가지
  long: 긴 회색 가지가 무겁게 땅 위에 놓여 있다.
  extras:
  - text: 매우 무겁고 높은 곳에서 떨어졌는지 보인다. 약간 비틀어져 있고 단단한 나무에는 여전히 수액이 가득 차 있다.

tba:61:obj:6106:
  short: 독버섯
  long: 가까이에서 큰 독버섯이 자라고 있다.
  extras:
  - text: >-
      약 2.3킬로그램은 될 것 같은 큰 갈색 송이버섯이다. 윗면에는 약한 곰팡이 냄새를 풍기는 얇은 층의 투명한 점액이 덮여 있다. 당신이 본 것 중 가장 맛있는 것은 아니다.

tba:61:obj:6107:
  short: 독버섯
  long: 가까이에서 큰 독버섯이 자라고 있다.
  extras:
  - text: >-
      약 2.3킬로그램은 될 것 같은 큰 갈색 송이버섯이다. 작은 흰색 반점이 있고 윗면에는 약한 곰팡이 냄새를 풍기는 얇은 층의 투명한 점액이 덮여 있다. 당신이 본 것 중 가장
      맛있는 것은 아니다.

tba:61:obj:6108:
  short: 금화 한 무더기
  long: 금화 한 무더기가 여기 놓여 있다.

tba:61:obj:6109:
  short: 파란 물약
  long: 파란 물약 하나가 여기 놓여 있다.
  extras:
  - text: 짙은 파란색을 띠고 페퍼민트 향이 난다.

tba:61:obj:6110:
  short: 향기로운 노란 물약
  long: 노란 물약 하나가 여기 놓여 있다.
  extras:
  - text: 짙은 노란색을 띠고 강한 향신료 냄새가 난다.

tba:61:obj:6111:
  short: 큰 둥근 방패
  long: 큰 둥근 방패 하나가 여기 놓여 있다.
  extras:
  - text: 단단한 나무로 만들어졌으며 무거운 철 밴드로 보강되어 있다.

tba:61:obj:6112:
  short: 철 왕관
  long: 철 왕관이 바닥에 놓여 있다.
  extras:
  - text: 단단한 철로 만들어진, 성인 크기의 무거운 왕관이다.

tba:61:obj:6113:
  short: 철로 만든 지팡이
  long: 철로 만든 지팡이가 바닥에 놓여 있다.
  extras:
  - text: 단단한 철로 만들어진 무거운 지팡이다.

tba:61:obj:6114:
  short: 철로 만든 고리
  long: 철로 만든 고리가 여기 놓여 있다.
  extras:
  - text: 단단한 철로 만들어진 사람 손가락 크기의 꽤 무거운 고리다. 어떤 장식도 없다.

tba:61:obj:6115:
  short: 모닝스타
  long: 모닝스타가 바닥에 놓인 채로 먼지를 쌓고 있다.

tba:61:obj:6116:
  short: 검은 용 비늘 셔츠
  long: 검은 용 비늘 셔츠가 여기 놓여 있다.
  extras:
  - text: >-
      은실로 이어 붙인 크고 검은 용 비늘로 만든 무소매 셔츠다. 안감은 용 배의 부드러운 가죽으로 만들어 매우 착용감이 좋다. 비늘 하나에 'Isha'라는 글자가 새겨져 있다.

tba:61:obj:6117:
  short: 검은 용 비늘 치마
  long: 검은 용 비늘 치마가 여기 놓여 있다.
  extras:
  - text: >-
      은실로 엮은 큰 검은 용 비늘로 만든 짧은 치마다. 안감은 용 배의 부드러운 가죽으로 만들어져 착용감이 매우 좋다. 비늘 하나에 'Isha'라는 글자가 새겨져 있다.

tba:61:obj:6118:
  short: 검은 후드 망토
  long: 밤하늘처럼 어두운 큰 후드 망토가 여기 놓여 있다.
  extras:
  - text: 큰 후드가 달린 무거운 검은 망토다. 안쪽에 은실로 'Isha'라는 글자가 쓰여 있다.

tba:61:obj:6119:
  short: 넓은 은 허리띠
  long: 넓은 은 허리띠가 여기 놓여 있다.
  extras:
  - text: 작은 은 고리를 엮어 만든 넓은 허리띠다.

tba:61:obj:6120:
  short: 길고 가느다란 검
  long: 길고 가느다란 검 하나가 땅 위에 놓여 있다.
  extras:
  - text: 은으로 만들어진 것처럼 보이는 길고 가느다란 검이다. 손잡이에 'Isha'라는 글자가 새겨져 있다.

tba:61:obj:6121:
  short: 나무 표지판
  long: 나무에 못으로 박힌 나무 표지판이 있다. 읽는 편이 나을 것이다...
  action: 서쪽에 거미 함정이 있다. 경계하라, 조심하라. - 여행하는 수도사 톨리우스
