tba:60:room:6000:
  name: 숲의 가장자리
  description: >-
    당신은 먼지가 쌓인 길의 끝, 하온-도르라는 큰 숲의 동쪽 가장자리에 서 있다. 동쪽으로는 성벽으로 둘러싸인 도시, 미드가르드로 돌아가는 길이 보이고, 서쪽으로는 숲을 관통하는
    좁은 오솔길이 이어진다.
  exits:
    east:
      look: 동쪽으로는 먼지가 쌓인 길이 미드가르드의 성벽과 거대한 서문으로 이어진다.
    west:
      look: 나무 사이로 서쪽으로 굽이치는 좁은 숲의 오솔길이 보인다.
  extras:
  - text: 대부분 아직 어린 나무들인 것을 생각하면 꽤 키가 크다. 그중 한 나무의 껍질에는 'Haon-Dor'라는 글자가 조잡하게 새겨져 있다.
  - text: 숲속 오솔길이 나무 사이를 지나 서쪽으로 구불구불 이어진다.

tba:60:room:6001:
  name: 성긴 숲을 지나는 오솔길
  description: >-
    당신은 숲을 가로지르는 오솔길 위에 있다. 북쪽으로 그림자 속으로 이어지는 작은 오솔길이 있는 듯하다. 동쪽은 숲의 가장자리이고, 서쪽으로는 오솔길이 숲 안쪽으로 더 이어진다.
  exits:
    north:
      look: 북쪽으로 나무 사이 틈을 지나 이어지는 작은 오솔길의 흔적이 보인다.
    east:
      look: 오솔길은 동쪽으로 이어져 숲 밖으로 빠져나간다.
    west:
      look: 나무 사이로 서쪽으로 굽이치는 좁은 숲의 오솔길이 보인다.
  extras:
  - text: 아주 귀엽고 작은 동물들로, 삶을 즐기고 있는 것 같다.
  - text: 여기 있는 나무들은 꽤 어리고 싱싱하다. 여러 종류의 새와 곤충, 그 밖의 작은 동물들이 깃들어 사는 것 같다.
  - text: 숲의 오솔길이 나무 사이로 동서 방향으로 굽이쳐 나간다.

tba:60:room:6002:
  name: 성긴 숲을 지나는 오솔길
  description: 당신은 숲을 동서 방향으로 굽이쳐 지나는 좁은 오솔길 위에 있다. 서쪽으로 갈수록 숲이 점차 더 짙어진다. 남쪽으로 이어지는 작은 숲길이 하나 있다.
  exits:
    east:
      look: 오솔길이 어린 나무 사이로 동쪽으로 이어진다.
    south:
      look: 작은 오솔길이 어린 나무들 사이를 지나 남쪽으로 이어진다.
    west:
      look: 울창한 숲 안쪽으로 서쪽으로 굽이쳐 나가는 좁은 숲의 오솔길이 보인다.
  extras:
  - text: 어리고 가느다란 나무들이 아름답다. 싱싱한 초록 잎사귀가 바람에 가볍게 흔들린다.
  - text: 숲의 오솔길이 나무 사이로 동서 방향으로 굽이쳐 나간다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6003:
  name: 울창한 숲을 가로지르는 오솔길
  description: 당신은 울창한 숲을 동서로 굽이쳐 가로지르는 오솔길 위에 있다. 동쪽으로는 숲이 점차 밝아지는 것 같다.
  exits:
    east:
      look: 오솔길은 동쪽으로, 어린 나무들이 자라는 숲 쪽으로 이어진다.
    west:
      look: 울창한 숲을 서쪽으로 굽이쳐 나가는 좁은 오솔길이 보인다.
  extras:
  - text: 다 자란 나무들의 우거진 우듬지 때문에 잎사귀 사이로 하늘이 아주 조금만 보인다.
  - text: 거대한 나무 줄기에 비하면 숲의 오솔길은 거의 가냘프게 느껴진다.

