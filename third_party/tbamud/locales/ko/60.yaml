tba:60:room:6017:
  name: 울창한 숲 속의 작은 오솔길
  description: 당신은 울창한 숲을 가로지르는 작은 오솔길의 굽이진 곳에 있다. 서쪽으로는 숲이 더 밝아지는 것 같다. 오솔길은 북쪽과 서쪽으로 이어진다.
  exits:
    north:
      look: 작은 길이 나무들 사이를 지나 북쪽으로 이어진다.
    west:
      look: 작은 오솔길이 나무들 사이를 지나 숲이 더 밝아진 곳으로 서쪽으로 이어진다.
  extras:
  - text: 큰 참나무 가지 하나가 동쪽에서 뻗어 나와 오솔길 위를 가로지른다.
  - text: 오래된 나무들의 우듬지가 숲을 비현실적인 어스름 빛 속에 잠기게 한다. 큰 가지 하나가 오솔길 위로, 당신 머리 위에 위압적으로 드리워져 있다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6018:
  name: 성긴 숲의 갈림길
  description: 당신은 숲을 가로지르는 작은 오솔길 위에 있다. 북쪽으로는 작은 들판으로 이어지는 길이 나 있고, 동쪽과 서쪽으로는 울창한 숲으로 이어지는 길이 있다.
  exits:
    north:
      look: 오솔길이 북쪽으로 이어져 작은 풀밭에 이른다.
    east:
      look: 오솔길이 동쪽으로 이어져 짙은 숲 속으로 들어간다.
    west:
      look: 오솔길이 서쪽으로 이어져 짙은 숲 속으로 들어간다.
  extras:
  - text: 키가 큰 나무들은 아직 어리고 가늘며, 고작 백 년쯤 되어 보이는 정도다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6019:
  name: 울창한 숲 속의 작은 오솔길
  description: 당신은 울창한 숲을 가로지르는 작은 오솔길 위에 있다. 동쪽으로는 숲이 조금 더 밝아 보인다. 오솔길은 북쪽과 동쪽으로 이어진다.
  exits:
    north:
      look: 작은 길이 나무들 사이를 지나 북쪽으로 이어진다.
    east:
      look: 작은 오솔길이 나무 사이를 지나 동쪽으로 이어지며, 숲의 더 밝은 부분에 닿는다.
  extras:
  - text: 오래된 나무들의 우듬지가 숲을 비현실적인 어스름빛에 잠기게 한다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6020:
  name: 울창한 숲 속의 작은 오솔길
  description: 당신은 울창한 숲을 가로지르는 작은 오솔길 위에 있다. 오래된 나무들의 우듬지가 숲을 비현실적인 어스름 속에 잠기게 한다. 오솔길은 남쪽과 서쪽으로 이어진다.
  exits:
    south:
      look: 작은 오솔길이 나무 사이를 지나 남쪽으로 이어진다.
    west:
      look: 작은 오솔길이 나무 사이를 지나 서쪽으로 이어진다.
  extras:
  - text: 나무들은 대부분 오래된 너도밤나무와 참나무다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6021:
  name: 울창한 숲 속의 작은 오솔길
  description: 당신은 울창한 숲을 가로지르는 작은 오솔길 위에 있다. 서쪽으로는 작은 언덕 비탈로 이어지는 어두운 동굴 입구가 보인다. 오솔길은 북쪽과 동쪽으로 이어진다.
  exits:
    north:
      look: 작은 길이 나무들 사이를 지나 북쪽으로 이어진다.
    east:
      look: 작은 오솔길이 나무 사이를 지나 동쪽으로 이어진다.
    west:
      look: 동굴은 매우 어둡다.
  extras:
  - text: 불규칙한 입구는 약 240센티미터 넓이에 약 180센티미터 높이이다. 안쪽에서 매캐한 냄새가 풍겨 나온다.
  - text: 오래된 나무들의 우듬지가 숲을 비현실적인 어스름빛에 잠기게 한다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6022:
  name: 동굴 내부
  description: 당신은 자연 동굴 안에 있다. 돌바닥을 뒤덮은 온갖 잔해에서 꽤 불쾌한 냄새가 풍겨 공기가 탁하고 숨쉬기 힘들다. 눈에 띄는 출구는 동쪽뿐이다.
  exits:
    east:
      look: 동굴 입구는 동쪽에 있다.
  extras:
  - text: 어느 정도 투명하지만, 그럼에도 꽤 눈에 띈다.
  - text: 전혀 흥미로울 것이 없다.
  - text: 주로 뜯어먹은 뼈와 찢어진 작은 털 조각들이 뒤섞여 있다.

tba:60:room:6023:
  name: 초원
  description: >-
    당신은 숲 어딘가의 풀로 덮인 들판에 있다. 키 큰 풀이 거의 허리까지 올라오고, 들판 동쪽을 둘러싼 오크나무와 산수유나무들은 거의 벽처럼 빽빽한 덤불을 이룬다. 북동쪽으로는
    작은 호수가 보인다. 작은 오솔길이 나무 사이를 지나 남쪽으로 이어지며, 들판은 북쪽과 서쪽으로 열려 있다.
  exits:
    north:
      look: 북쪽에서 불어오는 바람에 갓 죽은 짐승의 냄새와 수많은 새 울음소리가 실려 온다. 그쪽 하늘에 새들이 빙빙 맴도는 것이 보인다.
    east:
      look: 땅은 동쪽 숲 가장자리를 향해 완만하게 내려간다.
    south:
      look: 작은 오솔길이 나무들 사이를 지나 남쪽으로 이어진다.
  extras:
  - text: 썩은 고기를 먹는 새들이 북쪽 하늘을 빙빙 돌고 있다. 당신은 그들이 시체를 뜯어먹을 차례를 기다리고 있다고 짐작한다.
  - text: 나무들이 빽빽하게 들어차 서쪽으로는 빠져나갈 길이 없다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  - text: 키 큰 풀은 동물들에게 좋은 은신처가 된다.

tba:60:room:6024:
  name: 풀밭의 낮은 지대
  description: >-
    당신은 작은 호수의 남쪽, 풀밭의 낮은 지대에 있다. 물을 마시러 온 수많은 동물들이 이 풀을 밟아, 땅에는 온갖 종류의 발자국이 가득하다. 서쪽으로는 풀밭을 둘러싼 나무들이
    이룬 벽에 난 틈이 보이고, 북쪽에는 작은 호수가 있다.
  exits:
    north:
      look: 동물들의 발자국이 북쪽으로 이어져, 저기 호수 주위를 돌아간다.
    west:
      look: 남서쪽으로는 숲 가장자리에 난 틈이 보인다. 그곳을 지나면 숲속의 오솔길로 돌아갈 수 있다.
  extras:
  - text: 나무들이 빽빽하게 들어차 남쪽과 동쪽으로는 빠져나갈 길이 없다.
  - text: 풀이 짓밟혀 난 길이 북쪽의 호수로 이어진다.
  - text: 키 큰 풀은 동물들에게 좋은 은신처가 된다.

tba:60:room:6025:
  name: 풀밭 속 호숫가
  description: >-
    풀은 호수 바로 앞에서 끝나고, 그 자리는 이 일대 동물들의 발자국이 찍힌 진흙으로 덮여 있다. 가까이 다가가면 많은 동물들이 키 큰 풀숲으로, 심지어 숲속으로까지 흩어진다.
    서쪽으로는 높은 하늘에서 원을 그리며 날아다니는 새들이 보이고, 북쪽으로는 키 큰 갈대가 둘러싼 작은 호수가 보인다. 남쪽으로 풀밭이 이어지고, 동쪽으로는 숲이 길을 막고 있다.
  exits:
    north:
      look: 호수는 들어가 보고 싶을 만큼 보기 좋고, 갈대 사이로 물새 같은 것들이 떠다니는 모습이 보인다.
    south:
      look: 남쪽으로는 짐승들이 다니는 길이 아래쪽 들판의 건너편으로 이어진다.
    west:
      look: 서쪽으로 풀밭이 높아지는 쪽에서 썩은 고기 냄새가 바람을 타고 흘러내려 온다.
  extras:
  - text: 발굽 달린 동물과 그 밖의 여러 동물의 발자국이 보인다. 진흙에는 크고 작은 온갖 동물의 흔적이 남아 있어, 이 숲이 얼마나 생기로 가득한지 보여준다.
  - text: 서쪽 하늘에서 썩은 고기를 먹는 새 떼가 원을 그리며 맴돌고 있다. 시체를 뜯어 먹을 차례를 기다리는 모양이다.
  - text: 나무들이 빽빽한 덤불을 이루어 북쪽과 동쪽의 통로를 막고 있다.
  - text: 여기저기서 동물들이 물을 마시러 이곳에 온다. 호수 자체는 크지 않지만, 여기에서 북쪽으로 길게 이어진다.
  - text: 키 큰 풀은 동물들에게 좋은 은신처가 된다.

tba:60:room:6026:
  name: 풀밭의 북쪽 구역
  description: >-
    당신이 다가가자 먹이를 찾는 온갖 동물과 새들이 흩어지고, 오직 가장 대담하고 멍청한 것들만 큰 멧돼지 사체를 둘러싸고 있다. 썩은 고기를 먹는 새들이 머리 위에서 원을 그리며
    날아다니고, 작은 동물들은 키 큰 풀 사이에서 당신을 뚫어지게 바라본다. 이쪽 풀은 밟혀 누렇게 변색되었고, 사체 주변 넓은 구역은 피로 얼룩져 있다. 오솔길이 경사진 들판을
    따라 호수 쪽으로 이어지고, 남쪽으로는 숲으로 돌아가는 길이 보인다.
  exits:
    east:
      look: 동쪽, 경사진 풀밭 아래에 작은 호수가 있다. 여기서 도망친 동물 중 일부가 그리로 가서, 당신이 떠나면 다시 잔치를 벌이려고 지켜보며 기다리고 있다.
    south:
      look: 남쪽으로 풀밭이 이어지고, 거기서 숲으로 돌아가는 길이 보인다.
  extras:
  - text: >-
      여러 쌍의 눈이 당신을 노려보며 떠나라고 재촉한다. 그들은 떼를 지으면 당신을 죽일 수 있다고 판단할지도 모르니, 여기서 오래 머무는 것은 좋은 생각이 아닐 것이다.
  - text: 크고 작은 새들이 머리 위를 맴돌며 당신이 떠나기를 기다린다. 새들이 조금만 애쓰면 당신을 시체로 만들 수 있겠다고 마음먹지 않기를 바랄 뿐이다.
  - text: 나무들이 빽빽한 덤불을 이루어 북쪽과 서쪽의 통로를 막고 있다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  - text: 키 큰 풀숲은 동물들이 숨기 좋은 곳이다. 당신이 놀라 달아나게 한 동물 몇 마리가 슬금슬금 당신을 엿보고 있다.

tba:60:room:6027:
  name: 호수 위
  description: >-
    당신은 작은 호수 한가운데 있다. 호수는 북서쪽 숲을 지나 흘러드는 작은 시내에서 물을 받는다. 물은 그다지 맑지 않지만, 발아래로 물고기들이 헤엄쳐 다니는 것이 보인다. 남쪽
    물가는 탁 트여 있어 풀밭으로 안전하게 돌아갈 수 있다.
  exits:
    south:
      look: 몇몇 동물들이 기슭에 모여, 당신이 무엇을 하는지 궁금한 듯 지켜보고 있다.
  extras:
  - text: 호수 가장자리를 따라 갈대가 자라나, 이곳에 사는 작은 물새들의 은신처가 되어 준다.
  - text: 기슭은 대부분 나무로 뒤덮여 있어 배를 댈 수 없다.
  - text: 여기저기서 동물들이 물을 마시러 이곳에 온다. 호수 자체는 크지 않지만, 여기에서 북쪽으로 길게 이어진다.
  - text: 송어와, 어쩌면 메기 한두 마리가 당신 아래에서 헤엄쳐 다니며 당신이 있다는 것은 전혀 아랑곳하지 않는다.

tba:60:room:6028:
  name: 울창한 숲 속의 작은 오솔길
  description: 당신은 울창한 숲을 가로지르는 작은 오솔길 위에 있다. 오래된 나무들의 우듬지 때문에 숲은 비현실적인 어스름 속에 잠겨 있다. 오솔길은 서쪽과 남쪽으로 이어진다.
  exits:
    west:
      look: 작은 오솔길이 나무 사이를 지나 서쪽으로 이어진다.
  extras:
  - text: 나무들은 대부분 오래된 너도밤나무와 참나무다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6029:
  name: 울창한 숲 속 큰 나무 근처
  description: >-
    당신은 울창한 숲을 가로지르는 작은 오솔길의 끝자락에 있다. 오래된 나무들의 우듬지 때문에 숲은 비현실적인 어스름 속에 잠겨 있다. 이 거친 빈터는 매우 큰 참나무 한 그루가
    지배하고 있는데, 아마도 이 숲 일대에서 가장 큰 나무일 것이다. 오솔길은 북쪽으로 이어진다.
  exits:
    up:
      look: 거대한 참나무의 아래쪽 가지들이 보인다.
  extras:
  - text: 나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 위를 서성이는 저 형체가 무엇이든 그것부터 상대해야 하겠지만.
  - text: 가지들은 꽤 단단해 보인다. 이 가지를 딛고 나무에 오르기로 한다면 당신의 몸무게쯤은 너끈히 버텨 줄 것이다.
  - text: 여기서는 어렴풋이 고양이 같은 모습으로 보이지만, 나무 위에서라면 훨씬 잘 볼 수 있을 것이다. 그것이 벌써 당신을 보았는지는 확실하지 않다.
  - text: >-
      아래쪽 가지 몇 개는 팔을 쭉 뻗으면 닿을 것 같다. 꼭대기까지 오를 수도 있겠지만, 여기서 보니 당신보다 먼저 그런 생각을 한 무언가가 있는 듯하다. 가장 높은 가지 하나에서
      희미한 동물의 형체가 서성이고 있다.
  - text: 나무들은 대부분 오래된 너도밤나무와 참나무이며, 오른쪽으로 커다란 참나무 한 그루가 서 있다.
  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.

tba:60:room:6030:
  name: 거대한 참나무의 아래쪽 가지 위
  description: >-
    당신은 거대한 참나무 위, 꼭대기까지 3분의 1쯤 올라온 곳에 있다. 머리 위의 가지들이 빛을 대부분 가리지만, 앞을 볼 수 있을 만큼은 빛이 스며든다. 당신이 다가가자 작은
    동물들과 새들이 흩어지고, 주위의 나뭇잎이 온통 바스락거린다. 땅으로 쉽게 내려갈 수도 있고, 나무를 계속 올라갈 수도 있다. 굵은 가지 하나가 서쪽으로 뻗어 있어 어쩌면 세
    번째 길이 될지도 모른다.
  exits:
    west:
      look: 이 가지는 굵고 튼튼해서, 서쪽으로 가지를 따라 거의 끝까지 걸어갈 수 있을 것 같다.
    up:
      look: 머리 위의 나무에서 더 많은 굵은 가지들이 뻗어 나온다.
    down:
      look: 거친 공터가 바로 아래에 있어, 조금 기어 내려가 뛰어내리면 닿을 수 있다.
  extras:
  - text: >-
      나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 중 하나를 서성이고 있는 그 형체가 무엇이든 간에, 그걸 처리해야 하겠지만.
  - text: 가지들은 꽤 튼튼해 보인다. 가지를 딛고 나무 위를 타고 다니기로 마음먹는다 해도, 당신의 몸무게쯤은 너끈히 버텨 줄 것이다.
  - text: 여기서 보니 고양이과 동물 같다. 이곳까지 올라오며 소리를 냈는데도, 녀석은 아직 당신을 알아채지 못한 것 같다.
  - text: 머리 위의 형체는 분명 우아하고 자신감 있게 움직인다. 나무에 사는 작은 동물들을 노리는 보브캣이 틀림없다는 생각이 든다.
  - text: 이 나무와 주변 나무들에는 온갖 다람쥐와 줄다람쥐, 새들이 보금자리를 틀고 산다. 자세히 보면 빠르게 비어 가는 둥지 몇 개가 눈에 띌지도 모른다.
  - text: 잠시 둘러보니, 당신 머리 위 멀지 않은 가지에 새 둥지가 하나 있고, 서쪽으로 뻗은 굵은 가지가 갈라지는 곳에 커다란 다람쥐 둥지가 하나 있는 것이 눈에 띈다.

tba:60:room:6031:
  name: 거대한 참나무의 가지 끝
  description: >-
    튼튼한 가지가 서쪽의 작은 오솔길 위로 멀리 뻗어 나와 있어, 그곳으로 뛰어내릴 수 있을 것 같다. 당신이 다가가자 다람쥐 여러 마리가 재빨리 몸을 숨기고, 홀로 남은 당신은
    바람에 살짝 흔들린다. 북쪽으로는 나무 사이로 작은 통나무집이 보이고, 남동쪽으로는 새들이 둥글게 날아다니는 어떤 공터 같은 것이 보인다.
  exits:
    east:
      look: 지나온 동쪽으로 나무줄기가 보인다. 여기보다는 그곳이 훨씬 덜 위태롭다... 돌아가는 편이 좋겠다.
    down:
      look: 아래에는 아마 숲의 동물들이 다니는 작은 오솔길이 있다. 조금만 애쓰면 뛰어내릴 수 있을 것 같다.
  extras:
  - text: >-
      나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 중 하나를 서성이고 있는 그 형체가 무엇이든 간에, 그걸 처리해야 하겠지만.
  - text: 가지들은 꽤 단단해 보인다. 이 가지들을 딛고 나무 위를 오르내리기로 한다면 당신의 몸무게쯤은 거뜬히 버틸 것이다.
  - text: 여기서 보니 고양이과 동물 같다. 이곳까지 올라오며 소리를 냈는데도, 녀석은 아직 당신을 알아채지 못한 것 같다.
  - text: 머리 위의 형체는 분명 우아하고 자신감 있게 움직인다. 나무에 사는 작은 동물들을 노리는 보브캣이 틀림없다는 생각이 든다.
  - text: 이 나무와 주변 나무들에는 온갖 다람쥐와 줄다람쥐, 새들이 보금자리를 틀고 산다. 자세히 보면 빠르게 비어 가는 둥지 몇 개가 눈에 띌지도 모른다.
  - text: 여러 마리의 다람쥐가 당신의 손이 닿을 만한 곳에 있는 큰 둥지로 피신한 것을 알아차린다. 둥지 안을 들여다보니, 두 쌍의 눈이 당신을 응시하고 있다.

tba:60:room:6032:
  name: 큰 참나무 중턱
  description: >-
    당신은 거대한 참나무의 중간쯤에 있다. 머리 위 가지들이 빛을 많이 가리지만, 그래도 볼 수 있을 만큼은 빛이 스며든다. 몇 마리 새가 당신의 손이 닿지 않는 바깥쪽 가지 끝에
    남아 당신을 지켜보고 있다. 여기 나무에는 긁힌 자국이 있고, 당신 근처 가지에 찢어진 껍질이 흩어져 있다. 근처에 큰 숲고양이가 사는 것 같으니 조심하는 것이 좋겠다! 당신은
    나무를 조금 더 올라갈 수도 있고, 덜 흔들리는 가지로 내려갈 수도 있다.
  exits:
    up:
      look: >-
        머리 위로 나무는 더 가늘어지지만, 여전히 올라갈 수 있을 것 같다. 고양이 같은 형체가 당신 위에서 서성이며 다친 큰 새에게 다가가려 하고 있다. 사냥을 방해하기 전에
        이 고양이가 어떤 종류인지 먼저 살펴보는 것이 좋을지도 모른다... 새 대신 당신을 잡아먹을지도 모르니.
  extras:
  - text: >-
      나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 중 하나를 서성이고 있는 그 형체가 무엇이든 간에, 그걸 처리해야 하겠지만.
  - text: 가지들은 꽤 단단해 보인다. 이 가지들을 딛고 나무 위를 오르내리기로 한다면 당신의 몸무게쯤은 거뜬히 버틸 것이다.
  - text: >-
      보브캣처럼 보인다. 자기가 상처 입힌 큰 새를 잡는 데 온 정신이 팔린 듯하다. 아직 당신을 보지 못했거나, 어쩌면 당신을 너무 손쉬운 먹잇감으로 여기는 것일지도 모른다.
  - text: 갖가지 다람쥐와 줄다람쥐, 새들이 이 나무와 주변 나무들에 보금자리를 틀고 산다. 자세히 보면 빠르게 비어 가는 그들의 둥지 몇 개가 보일지도 모른다.
  - text: 바로 곁에 중간 크기의 새 둥지가 있는데, 안에 제법 탐스러운 알도 몇 개 들어 있는 것 같다!

tba:60:room:6033:
  name: 큰 참나무 높은 곳
  description: >-
    나무 꼭대기가 바람에 부드럽게 흔들린다. 이 나무에서 안전하게 오를 수 있는 곳은 여기까지인 것 같다. 이곳 가지에는 작은 싸움의 흔적이 남아 있어, 뜯겨 나간 나무껍질과 빠진
    깃털이 사방에 흩어져 있다. 주위를 둘러보니 발아래로 숲이 사방으로 펼쳐져 있다. 동쪽으로는 미드가르드가 보이고, 남쪽으로는 강이 깊은 협곡 사이로 흐른다. 이곳에서 북서쪽으로는
    또 다른 작은 마을이 보이고, 서쪽 지평선에는 큰 산이 보인다.
  exits:
    down:
      look: 아래에서는 조금 전 당신 때문에 놀랐던 많은 동물들이 저마다의 둥지와 보금자리로 돌아와 있다. 나뭇가지 사이로 저 아래 멀리 오솔길이 희미하게 보인다.
  extras:
  - text: >-
      남쪽으로 강이 대략 북동쪽에서 서쪽으로 흐르는 것이 보인다. 강은 산비탈의 어두운 구멍에서 흘러나와 미드가르드를 지나 숲으로 이어진다. 강물이 숲 바닥 아래의 무른 돌을 깎아
      깊은 협곡을 만들어 놓았기에, 숲 깊숙이 들어서고 나면 강은 금세 보이지 않게 된다.
  - text: >-
      긴 산맥이 북쪽과 북동쪽 지평선을 가로지르고 있다. 당신은 그곳에 드워프와 인간에서부터 오거와 갖가지 유인형 종족에 이르기까지 온갖 생물이 산다는 소문을 들어본 적이 있다.
      어떤 이들은 악한 다크엘프가 드워프 땅 깊은 아래쪽의 지하 세계에 살고 있다고 말한다. 모리아의 동굴도 그곳에 있으며, 온갖 악한 생물들이 서식하고 있다.
  - text: >-
      남서쪽으로는 풀이 덮인 들판과 작은 호수가 보인다. 북서쪽에는 작은 오두막과 큰 땔감 더미가 있다. 서쪽 멀리로는 나무 꼭대기들이 빽빽한 지붕을 이루어 거의 모든 햇빛과 시야를
      가리고 있다. 거대한 늑대들이 그곳에 산다고 한다. 또한 그곳에 끔찍한 거미와 드로우가 살고 있다는 소문도 들었다. 그 지역은 더 경험이 많은 모험가들에게 맡기는 것이 가장
      좋을 것이다.

