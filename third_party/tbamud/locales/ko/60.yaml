    당신은 쓰러진 큰 나무 옆의 작은 빈터 위에 서 있다. 나무의 상당 부분은 이미 부패했지만, 빈터 여기저기에 조각들이 흩어져 있다. 빈터의 북쪽과 남쪽 가장자리를 따라 길이 나
    있다.
  exits:
    north:
      look: 그늘진 길이 나무 사이로 북동쪽으로 굽이쳐 나간다.
    south:
      look: 그늘진 길이 나무들 사이를 굽이치며 동쪽으로 이어진다.
  extras:
  - text: 통나무 아래에 구멍인지 동물의 굴인지 모를 것이 보이는 것 같다. 더 가까이 살펴보니, 굴 안에서 쉬고 있는 오소리로 보이는 형체를 알아볼 수 있다.
  - text: 이만한 빈터가 생긴 걸 보면, 큰 나무가 쓰러질 때 작은 나무 몇 그루도 함께 쓰러뜨린 것이 틀림없다.
  - text: >-
      나무는 대부분 썩어 없어져, 빈터에서 자라는 수많은 작은 식물들에게 양분을 공급하고 있다. 남은 조각들은 그리 크지 않지만, 특히 한 통나무가 당신의 시선을 끌며 무언가를
      떠올리게 한다. 이 통나무 아래는 동물이 굴을 만들기에 아주 좋은 장소일 것이다...
  - text: 그늘진 길들은 아마 숲에 사는 동물들이 다니는 길일 것이다.

