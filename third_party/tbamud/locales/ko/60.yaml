  - text: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  - text: 통나무들은 짧게 잘려 있지만, 갓 베어 낸 것이라 아직 수액이 가득 차 있어 무척 무겁다.

tba:60:room:6009:
  name: 숲 속의 작은 오두막 앞
  description: 당신은 굵은 통나무로만 지은 작은 오두막 앞에 서 있다. 북쪽에 나무 문이 있고, 서쪽과 남쪽으로 나무 사이를 지나는 작은 오솔길이 나 있다.
  exits:
    north:
      look: 나무 문은 꽤 튼튼해 보이지만 자물쇠가 달린 것 같지는 않다.
    south:
      look: 작은 오솔길이 울창한 숲을 지나 남쪽으로 이어진다.
    west:
      look: 작은 오솔길이 성긴 숲을 지나 서쪽으로 이어진다.
  extras:
  - text: 나무들은 꽤 어린 편으로, 고작 백 년쯤 되어 보인다.
  - text: 이 오솔길은 아마 오두막에 사는 사람들이 쓰는 것 같다.
  - text: 단순해 보이지만 안락하며, 가느다란 나무들이 이 곳을 꽤나 목가적으로 보이게 한다. 이는 나무 통나무로 지어진 오두막이다.

