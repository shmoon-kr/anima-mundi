tba:60:room:6081:
  name: 언덕 사이 울창한 숲 속
  description: >-
    당신은 여러 언덕 사이로 빽빽하게 들어찬 나무들 틈에 서 있다. 길을 놓친 지는 이미 오래되었고, 이제는 본능에 의지해 나아가야 한다. 이곳의 땅은 몹시 거칠고 바위투성이라,
    가장 억센 식물들만이 살아남는다. 늙은 나무들의 우듬지가 언덕을 비현실적인 어스름 속에 잠기게 한다.
  exits:
    north:
      look: 나무와 언덕의 경사면만 보인다.
    east:
      look: 나무와 언덕의 경사면만 보인다.
    south:
      look: 나무와 언덕의 경사면만 보인다.
    west:
      look: 보이는 것은 나무와 그늘진 길뿐이다.
  extras:
  - text: 사방으로 언덕이 솟아 있어 주변 지형이 보이지 않는다.
  - text: 나무들은 대부분 오래된 너도밤나무와 참나무다.
  - text: 길은 아마 여기 어딘가쯤에 있을 것이다... 조금 더 주의를 기울였더라면 좋았을 텐데.

tba:60:room:6082:
  name: 언덕 사이 울창한 숲 속
  description: >-
    당신은 중간 크기의 언덕 위, 빽빽하게 들어선 나무들 사이를 서 있다. 울창한 숲이 사방으로 펼쳐져 있고, 오래된 나무들의 우듬지 때문에 언덕은 비현실적인 어스름 속에 잠겨 있다.
  exits:
    north:
      look: 나무와 언덕의 경사면만 보인다.
    east:
      look: 나무와 언덕의 경사면만 보인다.
    south:
      look: 나무와 언덕의 경사면만 보인다.
  extras:
  - text: 사방으로 언덕이 솟아 있어 주변 지형이 보이지 않는다.
  - text: 나무들은 대부분 오래된 너도밤나무와 참나무다.

tba:60:room:6090:
  name: 평원을 가로지르는 길
  description: >-
    당신은 서쪽 평원을 동서로 가로지르는, 먼지가 뽀얗게 쌓인 길 위에 있다. 가끔 숲으로 향하거나 숲에서 돌아오는 사냥꾼이나 모험가가 눈에 띈다. 동쪽에는 성벽으로 둘러싸인 도시
    미드가르드가 있고, 서쪽으로 가면 길은 큰 숲으로 들어가는 좁은 오솔길 어귀에서 끝난다.
  exits:
    east:
      look: 멀리 동쪽으로는 미드가르드를 지키는 거대한 성벽이 보인다.
    west:
      look: 서쪽으로는 먼지 날리는 길이 끝나고, 숲의 서늘한 그늘 속으로 들어가는 좁은 오솔길로 바뀐다.
  extras:
  - text: 이 길은 사람들이 많이 다니는 길이라 먼지가 꽤 많다.
  - text: 대부분 꽤 어려 보이는 것치고는 나무들의 키가 꽤 크다.
  - text: 숲의 오솔길이 나무 사이로 서쪽으로 굽이쳐 나간다.

tba:60:room:6091:
  name: 평원을 가로지르는 길
  description: >-
    당신은 서쪽 평원을 동서로 가로지르는 먼지가 쌓인 길 위에 있다. 가끔 사냥꾼이나 모험가가 숲으로 향하거나 숲에서 나오는 모습을 볼 수 있다. 동쪽에는 성벽으로 둘러싸인 도시,
    미드가르드가 있고, 서쪽으로는 길이 거대한 숲 쪽으로 이어진다.
  exits:
    east:
      look: 멀리 동쪽으로는 미드가르드의 성벽과 서문이 보인다.
    west:
      look: 서쪽으로는 거대한 숲, 하온-도르가 멀리까지 펼쳐져 있고, 북서쪽으로는 숲이 끝나고 언덕이 시작된다.
  extras:
  - text: 이 길은 왕래가 잦고 먼지가 꽤 많다.
  - text: 평원의 풀숲 사이로 작은 나무들이 자라고 있다. 서쪽의 하온-도르로 갈수록 나무들은 서서히 키가 커진다.
  - text: 거대한 숲, 하온-도르가 서쪽으로 펼쳐져 있다. 그곳에는 크고 작은 사냥감이 풍부하다... 모험도, 그리고 물론 위험도!

tba:60:room:6092:
  name: 평원을 가로지르는 길
  description: >-
    당신은 미드가르드와 하온-도르 숲 사이의 풀이 우거진 평원을 동서로 가로지르는 먼지가 쌓인 길 위에 있다. 가끔 사냥꾼이나 모험가가 숲으로 향하거나 숲에서 나오는 모습을 볼 수
    있다. 동쪽에는 성벽으로 둘러싸인 도시, 미드가르드가 있고, 서쪽으로는 길이 거대한 숲 쪽으로 이어진다.
  exits:
    east:
      look: 동쪽으로는 미드가르드의 성벽과 서문이 보인다.
    west:
      look: 서쪽으로는 길이 숲 쪽으로 이어진다.
  extras:
  - text: 이 길은 오가는 이가 많아 꽤 먼지가 많다.
  - text: 거대한 숲, 하온-도르가 서쪽으로 펼쳐져 있다. 그곳에는 크고 작은 사냥감이 풍부하다... 모험도, 그리고 물론 위험도!

tba:60:mob:6000:
  short: 나무꾼 존
  long: 나무꾼 존이 여기 있다. 베어 낼 나무를 찾고 있는 모양이다.
  description: >-
    키가 180센티미터쯤 되고 꽤 힘이 세 보이며, 두툼한 체크무늬 셔츠 아래로 근육이 불룩하다. 고된 노동에 얼굴이 거칠어졌지만, 소박한 삶을 사는 평온한 사람의 표정을 하고 있다.

tba:60:mob:6001:
  short: 토끼
  long: 작은 토끼 한 마리가 여기 덤불 사이에서 먹이를 찾고 있다.
  description: 긴 귀와 큰 발을 가진 작고 털북숭이 동물이다.

tba:60:mob:6002:
  short: 갈색 곰
  long: 화가 난 듯한 커다란 갈색 곰이 여기 있다.
  description: 곰은 갈색 털이 많고, 발톱은 아주 크며 이빨은 아주 날카로운 커다란 동물이다. 장난감 가게에서 볼 수 있는 귀여운 작은 인형과는 전혀 닮지 않았다.

tba:60:mob:6003:
  short: 사나운 토끼
  long: 사나운 토끼 한 마리가 여기 있다. 당신을 배고픈 눈으로 노려보고 있다.
  description: >-
    긴 귀와 큰 발을 가진 이 작고 털북숭이 동물은 두려운 토끼 광견병에 감염되었다. 이 끔찍한 질병은 무방비하고 순진한 토끼들을 사납고 피에 굶주린 괴물로 변하게 만든다.

tba:60:mob:6004:
  short: 다마사슴
  long: 다마사슴 한 마리가 여기에서 평화롭게 풀을 뜯고 있다.
  description: 길고 가느다란 다리를 지닌 우아한 동물로, 커다란 갈색 눈이 경계와 호기심이 섞인 기색으로 당신을 마주 보고 있다.

tba:60:mob:6005:
  short: 갈색 여우
  long: 갈색 여우 한 마리가 여기에서 덤불 사이로 토끼를 몰래 쫓고 있다.
  description: 붉은 갈색의 아름다운 털을 가진 커다란 여우로, 길고 두꺼운 털이 풍성한 꼬리를 하고 있다.

tba:60:mob:6006:
  short: 새
  long: 날개가 부러진 큰 새 한 마리가 이곳 구석에 몰려 있다.
  description: 보아하니 이 새는 오래 살지 못할 것 같다.

tba:60:mob:6007:
  short: 보브캣
  long: 중간 크기의 보브캣 한 마리가 여기에서 새를 몰래 쫓고 있다.
  description: 보브캣은 날카로운 발톱과 이를 가지고 있으며, 당신이 기회를 주면 새 대신 당신을 잡아먹을 가능성이 크다.

tba:60:mob:6008:
  short: 참새
  long: 참새 한 마리가 땅바닥 근처에서 날개를 퍼덕이고 있다.
  description: 참새는 삶을 즐기고 있는 듯하다.

tba:60:mob:6009:
  short: 울새
  long: 울새 한 마리가 먹을 벌레를 찾아 이리저리 깡충거리고 있다.
  description: 울새는 먹을 벌레나 지렁이를 찾는 데 온 신경을 쏟고 있는 듯하다.

tba:60:mob:6010:
  short: 다람쥐
  long: 다람쥐 한 마리가 둥지 속에 몸을 숨기고 있다.
  description: 둥지 밖으로 고개를 내밀고 불안한 눈빛으로 당신을 바라본다. 제발 건드리지 말아 달라고 말없이 애원하는 듯하다.

tba:60:mob:6011:
  short: 졸린 오소리
  long: 갈색 털북숭이 오소리가 여기 통나무 아래에서 몸을 말고 있다.
  description: >-
    오소리가 천천히 잠에서 깨어나 굴 속에서 당신을 올려다보고 있다. 녀석이 오래도록 이렇게 느릿느릿하지는 않으리라는 것을 당신은 안다. 녀석을 죽일까 생각하는 순간, 날카로운 발톱과
    이빨이 눈에 들어온다.

tba:60:mob:6012:
  short: 회색 다람쥐
  long: 털이 풍성한 꼬리를 한 회색 다람쥐가 여기에서 견과류를 찾고 있다.
  description: 이 행복한 생물은 바닥의 낙엽과 잔가지 사이를 뒤지며 견과를 찾느라 당신에게는 전혀 관심이 없는 듯하다.

tba:60:mob:6013:
  short: 작은 줄다람쥐
  long: 작은 적갈색 줄다람쥐가 이곳에서 나무와 나무 사이를 재빠르게 오간다.
  description: >-
    넘치는 활력 그 자체인 이 작은 설치류는 이 일대의 나무를 오르내리고 빙빙 돌며 뛰어다니면서도 도무지 지칠 줄 모르는 것 같다. 잡을 수만 있다면 손쉬운 한 끼가 될 것 같다.

tba:60:mob:6014:
  short: 커다란 검은 까마귀
  long: 큰 검은 새 한 마리가 이리저리 날아다니며 썩은 고기 조각을 쪼아 먹고 있다.
  description: 그 새는 경계하는 눈빛으로 당신을 바라보지만, 식사를 계속한다.

tba:60:mob:6015:
  short: 흉측한 독수리
  long: 피와 살점을 뒤집어쓴 흉측한 독수리가 여기서 미친 듯이 먹이를 뜯어 먹고 있다.
  description: >-
    이 흉측한 새를 바라보는 것만으로도 구역질이 날 정도다. 말라붙은 핏덩이가 부리에 엉겨 붙어 있고, 정체를 알 수 없는 내장이 발톱과 깃털에 매달려 늘어져 있다. 새는 당신을
    발견하자마자 이 끔찍한 잔치를 지키려고 달려든다!

tba:60:mob:6016:
  short: 젊은 수사슴
  long: 뿔가지가 다섯 개인 젊은 수사슴 한 마리가 호수에서 물을 마시고 있다.
  description: >-
    이 젊은 수사슴은 호숫가에서 물을 마시며 당신을 경계하는 눈초리로 바라보고 있다. 아직 뿔이 완전히 자라지 않았지만, 몇 년 후에는 분명 인상적인 크기가 될 것이다.

tba:60:mob:6017:
  short: 물고기
  long: 물고기 한 마리가 이리저리 헤엄치고 있다.
  description: 그 물고기는 한 끼 식사로 알맞은 크기로 보인다.

tba:60:mob:6018:
  short: 새끼 오리
  long: 새끼 오리 한 마리가 연못에서 헤엄치며 돌아다니고 있다.
  description: 새끼 오리는 무척 귀엽다. 무엇보다도 작은 털뭉치처럼 보인다.

tba:60:mob:6019:
  short: 오리
  long: 오리 한 마리가 즐겁게 꽥꽥거리고 있다.
  description: 오리는 꽤 통통하다. 삶을 즐기고 있는 듯하다.

tba:60:obj:6000:
  short: 벌목 도끼
  long: 무거운 벌목 도끼가 여기 놓여 있다.
  extras:
  - text: 벌목꾼들이 나무를 벨 때 쓰는 묵직한 도끼다.

tba:60:obj:6001:
  short: 체크무늬 셔츠
  long: 체크무늬 셔츠가 여기 놓여 있다.
  extras:
  - text: 무거운 천으로 만든 특대형 체크무늬 셔츠다.

tba:60:obj:6002:
  short: 낡은 가죽 부츠 한 쌍
  long: 낡은 가죽 부츠 한 쌍이 여기 놓여 있다.
  extras:
  - text: 자주 기름을 발라 방수력을 유지하도록 처리한 거친 가죽으로 만들어졌다. 낡았지만 아직 제 구실은 충분히 할 것 같다.

tba:60:obj:6003:
  short: 벽난로
  long: 동쪽 벽에 돌로 쌓은 벽난로가 있다.
  extras:
  - text: 크기가 제각각인 돌들을 차곡차곡 쌓아 올리고 회반죽으로 굳혀 만들었다. 굴뚝도 같은 방식으로 지어졌으며, 연기를 낮은 오두막 천장 밖으로 내보낸다.

tba:60:obj:6004:
  short: 갓 달린 황동 랜턴
  long: 갓 달린 황동 랜턴 하나가 여기 남겨져 있다.
  extras:
  - text: '글자가 이렇게 적혀 있다: 켜려면 ''hold lantern''을 입력하라.'
  - text: >-
      황동으로 만든 크고 튼튼하지만 다소 낡은 기름 랜턴이다. 들고 다니기 편하도록 손잡이가 달렸고, 불꽃을 보호하는 갓도 씌워져 있다. 바닥에 글자 몇 개가 긁혀 새겨져 있다.

tba:60:obj:6005:
  short: 나무 상자
  long: 나무 상자가 구석에 놓여 있다.
  extras:
  - text: 짧고 무거운 판재들을 끼워 맞춰 만든 튼튼한 상자다. 단순한 황동 자물쇠가 달려 있다.

tba:60:obj:6006:
  short: 작은 황동 열쇠
  long: 작은 황동 열쇠 하나가 여기 놓여 있다.
  extras:
  - text: 아무런 글귀나 표식도 새겨지지 않은 작고 단순한 황동 열쇠다.

tba:60:obj:6007:
  short: 금화 더미
  long: 금화가 바닥에 한 무더기로 쌓여 있다.
  extras:
  - text: 이 동전들은 금으로 된 것 같다. 분명히 값진 물건이다.

tba:60:obj:6010:
  short: 블랙베리 몇 개
  long: 가까이 있는 덤불에 블랙베리가 몇 개 열려 있다.
  extras:
  - text: 정말 맛있어 보인다.

tba:60:obj:6011:
  short: 버섯
  long: 가까이 작은 버섯 하나가 자라고 있다.
  extras:
  - text: 작고 맛있어 보인다.

tba:60:obj:6012:
  short: 큰 표지판
  long: 기둥에 달린 큰 표지판이 길가에 서 있다.
  extras:
  - text:
    - 이렇게 쓰여 있다 :-
    - Haon-Dor
    - '--------'
    - 이곳은 Haon-Dor 숲이다. 들어오는 자는 스스로 위험을 책임져라.
  - text: 세상에서 가장 흥미로운 기둥은 아니다. 그래도 표지판을 제자리에 붙들고 있으니, 여기 그대로 두는 편이 낫겠다.

tba:60:obj:6013:
  short: 나무통
  long: 나무통 하나가 여기 놓여 있다.

tba:60:obj:6014:
  short: 작은 시냇물
  long: 작은 시냇물이 길 옆 숲을 따라 졸졸 흐른다.
  extras:
  - text: 물은 맑고 상쾌해 보인다.

tba:60:obj:6015:
  short: 호수
  long: .호수

tba:60:obj:6016:
  short: 참나무 몽둥이
  long: 여기에 나뭇가지 하나가 떨어져 있다.
  extras:
  - text: 몽둥이는 꽤 단단해 보이며, 좋은 무기가 될 것 같다.

tba:60:obj:6017:
  short: 멧돼지 사체
  long: .숨겨진 멧돼지 사체.

tba:60:obj:6018:
  short: 큰 고기 덩어리
  long: 여기 바닥에 방금 잘라낸 큰 멧돼지 고기 덩어리가 놓여 있다.
  extras:
  - text: 꽤 든든해 보인다.

tba:60:obj:6019:
  short: 멧돼지 엄니 한 쌍
  long: 큰 멧돼지 엄니 한 쌍이 여기 떨어져 있다.
  extras:
  - text: 장인에게라면 값이 좀 나갈 것 같다.

tba:60:obj:6020:
  short: 속이 빈 통나무
  long: .숨겨진 속이 빈 통나무.
  extras:
  - text: 아마 물에 뜰 것 같다.

tba:60:obj:6021:
  short: 새 둥지
  long: 숨겨진 새 둥지다.

tba:60:obj:6022:
  short: 파란 울새 알
  long: 작고 푸르스름한 알 하나가 여기 놓여 있다.
  extras:
  - text: 작지만 그래도 음식이다.

tba:60:obj:6023:
  short: 토끼고기 조각
  long: 큼직한 토끼고기 한 조각이다.

tba:60:obj:6024:
  short: 사슴고기 조각
  long: 크기가 상당한 사슴고기 조각이다.
