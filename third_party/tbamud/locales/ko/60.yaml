  description: 당신은 육중한 통나무로만 지은 작은 단칸 오두막 안에 있다. 가구가 매우 적어 침대, 의자, 식탁 같은 가장 기본적인 살림살이만 놓여 있다.
  exits:
    south:
      look: 나무 문이 남쪽으로 나 있다.
  extras:
  - {}
  - text: 흔들림이 전혀 없는 무거운 식탁이다. 무언가 새겨져 있는 것 같다.
  - text: 참나무로 만들어졌으며 튼튼하고 단단해 보인다.
