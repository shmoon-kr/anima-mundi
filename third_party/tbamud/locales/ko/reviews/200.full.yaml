    wooden building can be seen set back a little ways in the forest.
  ko: 서쪽 고속도로를 따라가다 보니, 고속도로가 서쪽과 동쪽으로 이어져 있다. 북동쪽으로는 숲 안쪽으로 조금 들어간 곳에 나무 건물이 보인다.
  verdict: wrong
  note: highway를 고속도로로 옮겼고, 지명 표기도 통일되지 않았다.
  fix: 서부 대로를 따라가다 보니 대로가 서쪽과 동쪽으로 이어져 있다. 북동쪽으로는 숲 안쪽으로 조금 들어간 곳에 나무 건물이 보인다.
- id: tba:200:obj:20006
  field: extras.0.text
  en: The axe is crude, but well-made.  Looks like it could hack a limb off just as easy as it could cut wood.
  ko: 도끼는 투박하지만 잘 만들어졌다. 나무를 자르는 것만큼이나 손쉽게 팔을 베어낼 수 있을 것 같다.
  verdict: wrong
  note: limb는 팔다리(또는 나뭇가지)를 뜻하는데 '팔'로 좁혀 옮겼다.
  fix: 도끼는 투박하지만 잘 만들어졌다. 나무를 베는 것만큼이나 손쉽게 팔다리 하나쯤은 잘라낼 수 있을 것 같다.
- id: tba:200:obj:20017
  field: long
  en: A canvas harversack lays here.
  ko: 캔버스 하버사크가 여기 놓여 있다.
  verdict: wrong
  note: '''캔버스 하버사크''는 음차라서 뜻이 통하지 않는다. haversack은 어깨에 메는 잡낭이고, canvas는 범포다.'
  fix: 범포 잡낭이 여기 놓여 있다.
- id: tba:200:room:20039
  field: description
  en: You are following a well travelled branch off the Western Highway. Somewhere in the distance to the south-west you can
    make out some small streaks of smoke, as if coming from the chimneys in a small village, while to the north you see the
    busy Western Highway.
  ko: 당신은 서부 고속도로에서 갈라져 나온 잘 다져진 오솔길을 따라 걷고 있다. 멀리 남서쪽 어딘가에서 작은 마을 굴뚝에서 나오는 것 같은 연기가 희미하게 보인다. 북쪽으로는 분주한 서부 고속도로가 보인다.
  verdict: wrong
  note: '''well travelled branch''는 사람이 많이 다니는 갈림길이지 오솔길이 아니다. highway도 고속도로로 옮겼다. ''small streaks of smoke''의 ''가는 줄기'' 느낌이
    빠졌다.'
  fix: 당신은 서부 대로에서 갈라져 나온, 사람들이 많이 다닌 길을 따라 걷고 있다. 멀리 남서쪽 어딘가에서 작은 마을의 굴뚝에서 피어오르는 듯한 가느다란 연기 줄기가 몇 가닥 보이고, 북쪽으로는 분주한 서부 대로가
    보인다.
- id: tba:200:room:20040
  field: description
  en: The building is covered in dust and everything is slick from animal fat. The horrible stench from the tanning and curing
    of the hides fills your nostrils.  Pelts and various types of clothing hang from the walls and rafters. A man behind the
    counter grins
  ko: 건물에는 먼지가 뒤덮여 있고, 동물 기름으로 온통 번들거린다. 가죽을 무두질하고 말리는 과정에서 나는 끔찍한 악취가 코를 찌른다. 벽과 천장 빗장에는 가죽과 여러 종류의 옷이 걸려 있다. 계산대 뒤의 남자가
    웃으며 말한다.
  verdict: wrong
  note: rafters(서까래)를 '천장 빗장'으로 잘못 옮겼다. 'grins'는 '씩 웃는다'인데 원문에 없는 '말한다'를 덧붙였다. '건물에는 먼지가 뒤덮여 있고'도 어색하다.
  fix: 건물은 먼지로 뒤덮여 있고, 모든 것이 동물 기름으로 미끈거린다. 가죽을 무두질하고 말리면서 나는 끔찍한 악취가 코를 찌른다. 벽과 서까래에는 모피와 여러 종류의 옷이 걸려 있다. 계산대 뒤의 남자가 씩 웃는다.
- id: tba:200:mob:20003
  field: long
  en: A bear cub stares warily at your intrusion.
  ko: 곰 새끼가 당신의 침입을 경계하며 노려보고 있다.
  verdict: awkward
  note: '''곰 새끼''보다 ''새끼 곰''이 자연스럽다. ''stares warily''에 ''노려본다''는 너무 강하고, ''당신의 침입을''은 번역투다.'
  fix: 새끼 곰이 불쑥 들어온 당신을 경계하며 바라본다.
- id: tba:200:obj:20000
  field: extras.0.text
  en: From the messy and untamed way the debris are jumbled along the bank of the river, a raging torrent must have came through
    recently.
  ko: 강기슭에 어지럽게 뒤엉켜 있는 잔해들의 무질서한 모습으로 보아, 최근 거대한 폭류가 지나간 것으로 보인다.
  verdict: wrong
  note: 원문에 없는 '거대한'을 더했다. 'must have'의 확신(틀림없다)이 약해졌고, '잔해들의 무질서한 모습으로 보아'는 딱딱하다.
  fix: 강기슭을 따라 잔해가 어지럽게 마구 뒤엉켜 있는 것으로 보아, 얼마 전 사나운 급류가 휩쓸고 지나간 것이 틀림없다.
- id: tba:200:obj:20019
  field: short
  en: some bounded gloves
  ko: 바닥에 놓인 가죽 장갑
  verdict: wrong
  note: 원문에 없는 '바닥에 놓인'과 '가죽'을 더했고, bounded(묶은)의 뜻은 빠졌다. 원문의 bounded는 bound의 오타로 보이며, 정확한 뜻은 확인이 필요하다.
  fix: 끈으로 동여맨 장갑
- id: tba:200:obj:20023
  field: extras.0.text
  en: The hide has been pulled taught by a sappling that has been bent into a circle and the hide placed over it.  It looks
    like it could make do as a shield.
  ko: 가죽을 둥글게 구부린 어린 가지 위에 올려서 팽팽하게 당겨 놓았다. 방패로 쓰기에 충분해 보인다.
  verdict: wrong
  note: sapling은 가지가 아니라 어린나무다. 'could make do as'는 '그럭저럭 대용할 만하다'인데 '충분해 보인다'로 과장했다.
  fix: 어린나무를 둥글게 구부려 테를 만들고 그 위에 가죽을 씌워 팽팽하게 당겨 놓았다. 그럭저럭 방패 대용으로 쓸 수 있을 것 같다.
- id: tba:200:obj:20016
  field: short
  en: a rusty steel trap
  ko: 녹슨 강철 함정
  verdict: wrong
  note: steel trap은 짐승을 잡는 덫이다. 함정은 구덩이 따위를 뜻한다.
  fix: 녹슨 강철 덫
- id: tba:200:obj:20001
  field: extras.0.text
  en: Once again cultural monuments fall to the destructive powers of mother nature.  The bridge that has withstood the poundings
    of centuries, from the brightest of days to the darkest of nights has finally succumbed and only bits and pieces are left.  Barely
    good enough for even firewood.
  ko: 다시 한번 문화 유산이 자연의 파괴적인 힘에 무너졌다. 가장 밝은 낮부터 가장 어두운 밤까지 수세기의 무게를 견뎌온 그 다리가 마침내 무너져 내렸고, 이제 남은 것은 조각조각뿐이다. 겨우 땔감으로 쓸 정도다.
  verdict: awkward
  note: '''무너졌다…무너져 내렸고''가 반복된다. ''poundings''를 ''무게''로 옮긴 것은 부정확하다. mother nature는 ''대자연''이 자연스럽다.'
  fix: 또다시 문화 유산이 대자연의 파괴적인 힘 앞에 쓰러졌다. 가장 밝은 낮부터 가장 어두운 밤까지, 수백 년 동안 온갖 풍파를 견뎌 온 다리가 마침내 굴복하여 이제는 부서진 조각들만 남았다. 땔감으로 쓰기에도
    겨우 될까 말까 하다.
- id: tba:200:mob:20009
  field: description
  en: This sly little create is reddish brown with a white-tipped tail.  Foxes are well known for their cunning and intelligence.  Usually
    passive and wary they have been known to raid local farms when food becomes sparse.
  ko: 이 교활한 작은 동물의 털은 적갈색이며 꼬리 끝은 하얗다. 여우들은 지혜와 지능으로 유명하다. 보통 온순하고 경계심이 강하지만, 먹이가 부족해지면 근처 농장을 습격하는 것으로도 알려져 있다.
  verdict: wrong
  note: cunning은 '교활함/꾀'인데 '지혜'로 옮겨 '지혜와 지능'이 중복이 됐다. '여우들은'보다 총칭인 '여우는'이 자연스럽다.
  fix: 이 교활한 작은 동물은 적갈색 털에 꼬리 끝이 하얗다. 여우는 꾀가 많고 영리하기로 잘 알려져 있다. 보통은 얌전하고 경계심이 많지만, 먹이가 부족해지면 근처 농장을 습격하기도 한다.
- id: tba:200:obj:20010
  field: extras.0.text
  en: The leather hide straps have been broken, re-stitched, and broken again. The look wearable, but barely.
  ko: 가죽 끈은 끊어지고, 다시 꿰매어지고, 또다시 끊어졌다. 신을 수는 있지만, 간신히.
  verdict: awkward
  note: '''신을 수는 있지만, 간신히.''는 도치된 영어식 문장이다. 물건 종류가 불분명한데 ''신다''로 신발이라고 단정했다.'
  fix: 가죽 끈은 끊어졌다가 다시 꿰매졌고, 또다시 끊어졌다. 착용할 수는 있어 보이지만 겨우 그럴 정도다.
- id: tba:200:mob:20006
  field: long
  en: A huge black bear crashes through the brush as you approach.
  ko: 당신이 다가가자 거대한 검은 곰이 덤불을 헤치며 달려든다.
  verdict: wrong
  note: '''crashes through the brush''는 덤불을 요란하게 헤치고 나오는 것이다. ''달려든다''는 공격한다는 뜻을 더한다.'
  fix: 당신이 다가가자 거대한 검은 곰이 덤불을 요란하게 헤치며 뛰쳐나온다.
- id: tba:200:room:20011
  field: description
  en: As you walk along you notice that the trees have thinned out to the northwest to allow entry into the forest.  The plains
    to the south appear barren.  The highway continues onto the west and east.
  ko: 걸어가다 보니, 북서쪽으로 나무가 옅어져 숲으로 들어갈 수 있는 길이 열려 있다. 남쪽의 평원은 황량해 보인다. 고속도로는 서쪽과 동쪽으로 이어진다.
  verdict: wrong
  note: highway를 고속도로로 옮겼다. 'thinned out'은 '옅어져'보다 '듬성듬성해져'가 자연스럽다.
  fix: 걸어가다 보니 북서쪽으로 나무가 듬성듬성해져 숲으로 들어갈 수 있다. 남쪽의 평원은 황량해 보인다. 대로는 서쪽과 동쪽으로 이어진다.
- id: tba:200:room:20009
  field: name
  en: Western Highway
  ko: 서쪽 고속도로
  verdict: wrong
  note: 3번과 같다. 고속도로는 시대에 맞지 않고 지명도 통일해야 한다.
  fix: 서부 대로
- id: tba:200:mob:20008
  field: short
  en: Talbath, the trapper
  ko: 탈바스, 함정꾼
  verdict: wrong
  note: trapper는 덫으로 짐승을 잡는 덫사냥꾼이다. '함정꾼'은 오역이다. 한국어에서는 칭호가 이름 앞에 오는 게 자연스럽다.
  fix: 덫사냥꾼 탈바스
- id: tba:200:room:20026
  field: description
  en: As you venture on a small, dirt road you can see the western highway to the north and the dirt road continuing to the
    south.  The forest around the road diminishes to plains the further south you travel.
  ko: 작은 흙길을 따라 나아가면 북쪽으로는 서쪽 고속도로, 남쪽으로는 흙길이 이어지는 것이 보인다. 남쪽으로 갈수록 길 주변의 숲은 줄고 평원으로 변한다.
  verdict: wrong
  note: highway를 '고속도로'로 옮겨 판타지 세계에 맞지 않는 현대 어휘가 되었다. 지명 Western Highway는 '서부 대로'로 통일해야 한다. '줄고 평원으로 변한다'도 다소 딱딱하다.
  fix: 작은 흙길을 따라 나아가면 북쪽으로는 서부 대로가, 남쪽으로는 계속 이어지는 흙길이 보인다. 남쪽으로 내려갈수록 길 주변의 숲은 점점 줄어들어 평원으로 바뀐다.
- id: tba:200:mob:20011
  field: description
  en: Once a captain of a barge that would travel down the river.  His boat seemed to have ran afoul on some rocks and he
    barely was able to SWIM for his life. He has to have been very strong and good at swimming to have fought off the river
    like he did.
  ko: 한때 강을 따라 내려가는 바지선의 선장이었다. 그의 배는 어딘가의 바위에 걸려 거의 난파 직전까지 갔고, 그는 간신히 수영으로 목숨을 건졌다. 강물을 이겨내고 살아남을 만큼 그는 매우 강하고 수영을 잘했을 것이다.
  verdict: wrong
  note: '''ran afoul on some rocks''는 바위에 걸려 사고가 났다는 뜻이다. ''거의 난파 직전까지 갔고''는 원문에 없는 내용이며, ''seemed''의 추측 뉘앙스도 빠졌다. ''어딘가의
    바위''도 어색하다.'
  fix: 한때 강을 따라 내려가던 바지선의 선장이었다. 그의 배는 바위에 걸려 부서진 듯하고, 그는 간신히 헤엄쳐 목숨을 건졌다. 그렇게 강물을 이겨 냈다면 그는 틀림없이 힘이 무척 세고 헤엄도 아주 잘 칠 것이다.
- id: tba:200:mob:20002
  field: long
  en: A little fawn is standing here.
  ko: 작은 사슴 새끼 한 마리가 여기 서 있다.
  verdict: awkward
  note: '''작은 사슴 새끼''는 ''작은''이 사슴을 꾸미는 것처럼 읽힌다. ''새끼 사슴''이 자연스럽다.'
  fix: 작은 새끼 사슴 한 마리가 여기 서 있다.
- id: tba:200:mob:20011
  field: short
  en: the soaked captain
  ko: 젖은 선장
  verdict: awkward
  note: soaked는 '흠뻑 젖은'이다. '젖은'만으로는 정도가 약하다.
  fix: 흠뻑 젖은 선장
- id: tba:200:obj:20014
  field: short
  en: some fawn fur
  ko: 사슴 새끼의 털
  verdict: awkward
  note: '''사슴 새끼의 털''보다 ''새끼 사슴 털''이 자연스럽고 4번과도 맞는다.'
  fix: 새끼 사슴 털
