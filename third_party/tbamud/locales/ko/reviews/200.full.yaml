  field: name
  en: Western Highway
  ko: 서쪽 고속도로
  verdict: wrong
  note: highway를 '고속도로'로 옮긴 오역. 판타지 세계의 큰길이므로 '서부 대로'가 맞다.
  fix: 서부 대로
- id: tba:200:mob:20003
  field: short
  en: a bear cub
  ko: 곰 새끼
  verdict: awkward
  note: '''곰 새끼''는 욕설처럼 읽힐 수 있다. ''새끼 곰''이 자연스럽다.'
  fix: 새끼 곰
- id: tba:200:obj:20018
  field: short
  en: a sharpened wooden dagger
  ko: 갈고닦은 나무 단검
  verdict: wrong
  note: '''갈고닦은''은 기술이나 실력을 연마했다는 관용 표현이다. 칼날을 세웠다는 뜻이 아니다.'
  fix: 날을 세운 나무 단검
- id: tba:200:mob:20008
  field: description
  en: It looks like he's had a long day out in the wilderness.  He is checking his trapline for any catch that he can take
    back to the trading post and sell.
  ko: 그는 황야에서 하루 종일 고생한 것 같다. 거래소에 가져다 팔 수 있는 포획물이 있는지 함정 줄을 확인하고 있다.
  verdict: wrong
  note: trading post는 '교역소'다. '거래소'는 증권거래소를 떠올리게 한다. trapline은 덫을 줄지어 놓아 둔 사냥 경로이며, '함정 줄'은 직역 오류다. 'had a long day'를 '하루
    종일 고생한'으로 옮긴 것도 약간 과하다.
  fix: 그는 황야에서 긴 하루를 보낸 것 같다. 교역소에 가져가 팔 만한 사냥감이 걸렸는지 놓아 둔 덫들을 살피고 있다.
