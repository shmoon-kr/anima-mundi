not_ok:
- id: tba:200:obj:20003
  field: short
  en: a solid brass crucifix
  ko: 순황동 십자가
  verdict: awkward
  note: '''solid brass''는 속이 꽉 찬 황동이라는 뜻이다. 황동은 합금이라 ''순황동''이라는 말이 어색하다.'
  fix: 통황동 십자가
- id: tba:200:obj:20024
  field: short
  en: a twine ring
  ko: 실로 엮은 고리
  verdict: wrong
  note: '''ring''은 손가락에 끼는 반지인데 ''고리''로 옮겼다. ''twine''은 노끈이다.'
  fix: 노끈 반지
- id: tba:200:mob:20002
  field: short
  en: the fawn
  ko: 사슴 새끼
  verdict: awkward
  note: '''사슴 새끼''보다 ''새끼 사슴''이 자연스러운 명칭이다.'
  fix: 새끼 사슴
- id: tba:200:mob:20004
  field: description
  en: The missionary looks a bit rough and seems that he has been walking around for quite some time.  Perhaps a nice warm
    meal would help to up his spirits a bit.
  ko: 선교사는 다소 거칠어 보이며, 꽤 오랫동안 돌아다닌 티가 난다. 아마 따뜻한 식사 한 끼면 기분이 조금 나아질 것이다.
  verdict: wrong
  note: 여기서 'rough'는 지치고 초췌하다는 뜻인데 '거칠어 보이며'로 옮겨 성격이 험하다는 뜻이 되었다. 'up his spirits'도 '기운을 차리다'가 더 맞다.
  fix: 선교사는 다소 초췌해 보이며, 꽤 오랫동안 떠돌아다닌 티가 난다. 따뜻한 식사 한 끼면 기운을 좀 차릴 수 있을 것 같다.
- id: tba:200:room:20006
  field: name
  en: Western Highway
  ko: 서쪽 고속도로
  verdict: wrong
  note: '''고속도로''는 현대 자동차 도로를 가리킨다. 판타지 세계에 맞지 않고, 3번의 ''서부 대로''와도 어긋난다.'
  fix: 서부 대로
- id: tba:200:obj:20014
  field: extras.0.text
  en: The hide of a fawn has been skinned into some make shift arm guards.
  ko: 사슴 새끼의 가죽은 임시로 만든 팔 보호대로 만들어져 있다.
  verdict: awkward
  note: '''~의 가죽은 ~로 만들어져 있다''는 번역투 수동문이다. 또 ''만든 ~로 만들어져''처럼 같은 동사가 겹친다. 명칭도 ''새끼 사슴''으로 통일해야 한다.'
  fix: 새끼 사슴의 가죽을 벗겨 임시변통으로 팔 보호대를 만들었다.
- id: tba:200:room:20003
  field: name
  en: Western Highway
  ko: 서쪽 고속도로
  verdict: wrong
  note: 21번과 같다. '고속도로'는 시대에 맞지 않고 명칭도 통일되지 않았다.
  fix: 서부 대로
- id: tba:200:room:20024
  field: description
  en: The dirt path widens and seems to be pushing the forest and underbrush back. The path continues north and south between
    the columns of thick trees and brush.
  ko: 흙길이 넓어지며 숲과 덤불을 밀어내는 듯하다. 이 길은 굵은 나무와 덤불 기둥 사이로 북쪽과 남쪽으로 이어진다.
  verdict: awkward
  note: '''columns of thick trees and brush''를 ''덤불 기둥''으로 직역해 어색하다. 늘어선 나무와 덤불을 뜻한다. ''이 길은''도 번역투다.'
  fix: 흙길이 넓어지며 숲과 덤불을 밀어내는 듯하다. 길은 줄지어 선 굵은 나무와 덤불 사이로 북쪽과 남쪽으로 이어진다.
- id: tba:200:room:20023
  field: description
  en: The dirt path almost disappears in a section of thick brush and young saplings.  The path is barely distinguishable
    from the rest of the overgrowth. The smell of the forest is very strong.
  ko: 짙은 덤불과 어린 묘목이 자란 구간의 흙길은 거의 사라져 버렸다. 이 길은 나머지 무성한 잡초와 구별하기가 barely 힘들 정도다. 숲의 냄새가 매우 강하다.
  verdict: wrong
  note: 영어 'barely'가 번역되지 않고 남아 있다. 'barely distinguishable'은 '거의 구별되지 않는다'는 뜻이다.
  fix: 짙은 덤불과 어린 묘목이 자란 구간에서 흙길은 거의 사라져 버린다. 길은 주변의 무성한 덤불과 거의 구별되지 않는다. 숲 냄새가 매우 짙다.
- id: tba:200:room:20027
  field: description
  en: Moving along the dirt road you see that the road leads to the west and also to the north.  Tall fields of wild grass,
    weeds, and other small brush borderw the road.  The fields have grown to about waist height and could be used easily to
    conceal oneself within.  The grass sways gently in the breeze.
  ko: 흙길을 따라가다 보니 이 길이 서쪽과 북쪽으로 이어지는 것을 볼 수 있다. 길 양옆에는 키가 큰 풀, 잡초, 그리고 작은 덤불로 이루어진 들판이 펼쳐져 있다. 풀은 허리 높이까지 자라 있어 몸을 숨기기에도 충분하다.
    풀이 바람에 나긋이 흔들린다.
  verdict: awkward
  note: '''이어지는 것을 볼 수 있다''는 ''you see that''을 직역한 번역투다.'
  fix: 흙길을 따라가다 보니 길이 서쪽과 북쪽으로 이어진다. 길 양옆에는 키가 큰 풀, 잡초, 그리고 작은 덤불로 이루어진 들판이 펼쳐져 있다. 풀은 허리 높이까지 자라 있어 몸을 숨기기에도 충분하다. 풀이 바람에
    나긋이 흔들린다.
- id: tba:200:room:20015
  field: description
  en: As you walk along the Western Highway you notice a small path leading to the south.  It appears to be heavily travelled
    and the wind carries the smell of smoke with it from the south.  The highway continues on to the west and east.
  ko: 서쪽 고속도로를 걷다 보니 남쪽으로 이어지는 작은 오솔길이 보인다. 이 길은 많이 다닌 듯하고, 남쪽에서 불어오는 바람에 연기가 섞여 있다. 고속도로는 서쪽과 동쪽으로 계속 이어진다.
  verdict: wrong
  note: '''Western Highway''를 현대어 ''고속도로''로 옮겼다. 판타지 배경에서는 ''서부 대로''가 맞다. 또한 ''smell of smoke''의 ''냄새''가 빠졌다.'
  fix: 서부 대로를 걷다 보니 남쪽으로 이어지는 작은 오솔길이 보인다. 이 길은 사람들이 많이 다닌 듯하고, 남쪽에서 불어오는 바람에 연기 냄새가 실려 온다. 대로는 서쪽과 동쪽으로 계속 이어진다.
- id: tba:200:obj:20000
  field: long
  en: The edge of the waters spilt from the overflowed river stops at your feet.
  ko: 범람한 강에서 쏟아져 나온 물의 끝이 당신의 발밑에서 멈추어 있다.
  verdict: awkward
  note: '''물의 끝이 발밑에서 멈추어 있다''는 직역투라 부자연스럽다.'
  fix: 범람한 강에서 넘쳐 흐른 물이 당신의 발치에서 멈춰 있다.
- id: tba:200:room:20028
  field: description
  en: As you walk along the dirt road you notice a few small animals scampering to and fro.  The road continues to the south
    and east.  The sharp bend here goes around a huge pile of rocks to the southeast.  The remains of a stone wall runs through
    the middle of the pile.  Once used to mark out boundaries between land owners.  Now it seems no one is farming on these
    plains.
  ko: 흙길을 따라 걷다 보니 작은 동물 몇 마리가 이리저리 뛰어다니는 것이 보인다. 길은 남쪽과 동쪽으로 이어진다. 여기서 급하게 꺾인 길은 동남쪽으로 거대한 바위 더리를 돌아간다. 바위 더리 한가운데에는 돌담의
    잔해가 남아 있다. 예전에는 땅주인들 사이의 경계를 표시하는 데 쓰였을 것이다. 하지만 이제 이 평원에서는 아무도 농사를 짓지 않는 것 같다.
  verdict: wrong
  note: '''더리''는 ''더미''의 오타로, 없는 단어다.'
  fix: 흙길을 따라 걷다 보니 작은 동물 몇 마리가 이리저리 뛰어다니는 것이 보인다. 길은 남쪽과 동쪽으로 이어진다. 여기서 급하게 꺾인 길은 동남쪽으로 거대한 바위 더미를 돌아간다. 바위 더미 한가운데에는 돌담의
    잔해가 남아 있다. 예전에는 땅주인들 사이의 경계를 표시하는 데 쓰였을 것이다. 하지만 이제 이 평원에서는 아무도 농사를 짓지 않는 것 같다.
- id: tba:200:room:20003
  field: description
  en: As you walk along the Western Highway you notice a small path leading off to the south as well as the highway continuing
    off to the east and west.  The forest to the north seems to thin out a little allowing entrance.
  ko: 당신은 서쪽 고속도로를 따라 걷다가 남쪽으로 나가는 작은 오솔길을 발견한다. 고속도로는 동쪽과 서쪽으로 계속 이어진다. 북쪽의 숲은 조금 더 드문드문해져 들어갈 수 있을 것 같다.
  verdict: wrong
  note: '''Western Highway''를 ''서쪽 고속도로''로 잘못 옮겼다. 또한 원문에 없는 ''더''가 추가되었다.'
  fix: 당신은 서부 대로를 따라 걷다가 남쪽으로 갈라져 나가는 작은 오솔길을 발견한다. 대로는 동쪽과 서쪽으로 계속 이어진다. 북쪽의 숲은 조금 성기어져 들어갈 수 있을 것 같다.
- id: tba:200:obj:20023
  field: short
  en: a stretched hide shield
  ko: 늘어진 가죽 방패
  verdict: wrong
  note: '''stretched hide''는 틀에 팽팽하게 당겨 편 가죽을 뜻한다. ''늘어진''은 축 처졌다는 뜻이 되어 오역이다.'
  fix: 가죽을 팽팽하게 씌운 방패
- id: tba:200:obj:20004
  field: extras.0.text
  en: This fine, white robe is made of course cloth.  It looks as if the maker threw it together quite hastily.
  ko: 이 정교한 흰색 로브는 당연히 거친 천으로 만들어졌다. 만든 사람이 매우 서둘러 대충 꿰맨 것처럼 보인다.
  verdict: wrong
  note: 원문의 'course'는 'coarse'(거친)의 오타다. 이를 'of course'로 읽고 '당연히'를 추가한 것은 오역이다.
  fix: 이 멋진 흰색 로브는 거친 천으로 만들어졌다. 만든 사람이 매우 서둘러 대충 지은 것처럼 보인다.
- id: tba:200:room:20005
  field: description
  en: As you move a long the western highway you notice that it continues to the west as well as to the east.  The forest
    to the north looks peaceful and inviting, though it seems too dense to enter.
  ko: 서쪽 고속도로를 따라 걷다 보니, 이 길이 동쪽뿐 아니라 서쪽으로도 계속 이어지는 것을 알게 된다. 북쪽의 숲은 평온하고 유혹적으로 보이지만, 너무 빽빽해 들어가기 어려울 것 같다.
  verdict: wrong
  note: '''western highway''를 ''서쪽 고속도로''로 잘못 옮겼다. ''inviting''을 ''유혹적''으로 옮긴 것도 뉘앙스가 어긋난다.'
