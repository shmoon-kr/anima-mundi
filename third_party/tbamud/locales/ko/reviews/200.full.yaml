  ko: 서쪽 고속도로를 따라 걷다 보니, 동쪽과 서쪽으로 길이 이어지는 것을 제외하면 사방이 나무로 둘러싸여 있다. 남쪽으로는 숲이 트이며 황량한 평원이 나타난다.
  verdict: wrong
  note: '''고속도로''가 오역이다. 원문에서 남쪽은 ''나무가 없는 예외 방향''인데, 번역은 이를 별도 문장으로 떼어 구조가 흐려졌다.'
  fix: 서부 대로를 따라 걷다 보니, 길이 이어지는 동쪽과 서쪽, 그리고 숲이 트이며 황량한 평원이 펼쳐지는 남쪽을 빼면 사방이 나무로 둘러싸여 있다.
- id: tba:200:mob:20005
  field: long
  en: A grizzly old man stomps past with confidence.
  ko: 거친 노인이 자신감 넘치게 발소리를 내며 지나간다.
  verdict: wrong
  note: 사람을 꾸미는 grizzly는 grizzled(머리가 희끗희끗한)의 뜻이다. '거친'은 오역이다. '자신감 넘치게 발소리를 내며'도 어색하다.
  fix: 머리가 희끗희끗한 노인이 당당하게 쿵쿵거리며 지나간다.
- id: tba:200:obj:20022
  field: long
  en: A can of ultra shine is here.
  ko: 여기 울트라 샤인 용액 한 통이 놓여 있다.
  verdict: awkward
  note: '''용액''은 원문에 없는 추가어다. ''여기''를 문두에 둔 어순도 어색하다.'
  fix: 울트라 샤인 한 통이 여기 놓여 있다.
- id: tba:200:obj:20012
  field: extras.0.text
  en: A scalp of a rabbit lies here.  Looks like someone must have been practicing their scalping techniques on the poor critter.  It
    almost looks like the rabbit fur has been cut into a makeshift helm.
  ko: 토끼의 두피가 여기 놓여 있다. 누군가 불쌍한 짐승에게 두피 벗기는 기술을 연습한 것 같다. 토끼 털이 임시로 만든 투구처럼 잘려 있는 듯하다.
  verdict: awkward
  note: '''두피''보다 ''머릿가죽''이 자연스럽다. ''cut into a makeshift helm''은 털을 잘라 투구로 만들었다는 뜻이다. ''투구처럼 잘려 있다''는 의미가 흐릿하다.'
  fix: 토끼 머릿가죽이 여기 놓여 있다. 누군가 이 불쌍한 짐승에게 머릿가죽 벗기는 솜씨를 연습한 모양이다. 토끼 털을 잘라 투구 비슷하게 만들어 놓은 것처럼 보이기도 한다.
- id: tba:200:room:20017
  field: name
  en: Western Highway
  ko: 서쪽 고속도로
  verdict: wrong
  note: 8번과 같다. '고속도로'는 오역이다.
  fix: 서부 대로
- id: tba:200:obj:20021
  field: long
  en: A piece of meat rubs in the dirt here, not sure what sort and it doesn't look too tasty.
  ko: 여기 고기 조각 하나가 먼지 위에 놓여 있다. 어떤 종류인지 모르겠고, 맛나 보이진 않는다.
  verdict: wrong
  note: dirt는 '흙(바닥)'이다. '먼지'는 오역이다. '맛나 보이진'은 해라체 서술에 맞지 않는 구어체다.
  fix: 고기 한 조각이 여기 흙바닥에 뒹굴고 있다. 무슨 고기인지 알 수 없고, 그다지 맛있어 보이지도 않는다.
- id: tba:200:room:20013
  field: description
  en: The highway consists of hard packed dirt, making travel very easy.  A warm breeze blows to you from over the plains
    to the south.  It carries a slight hint of smoke with it, civilization must be near.  To the north a thick forest blocks
    your view.
  ko: 고속도로는 단단히 다져진 흙길이라 이동이 매우 수월하다. 남쪽 평원 너머에서 따뜻한 바람이 불어온다. 바람에 연기가 살짝 섞여 있어 문명이 가까운 곳임을 알 수 있다. 북쪽으로는 울창한 숲이 시야를 가리고 있다.
  verdict: wrong
  note: '''고속도로''가 오역이다. 나머지는 자연스럽다.'
  fix: 대로는 단단히 다져진 흙길이라 다니기가 매우 수월하다. 남쪽 평원 너머에서 따뜻한 바람이 불어온다. 바람에 연기 냄새가 살짝 섞여 있어 사람 사는 곳이 가까운 모양이다. 북쪽으로는 울창한 숲이 시야를 가리고
    있다.
- id: tba:200:room:20034
  field: description
  en: You make your way on the dirt road.  The road seems to continue to the west and south.  You stand alongside a steep
    hill covered in grass and moss.  The hill rises so steeply above you that you doubt it could be climbed.
  ko: 당신은 흙길을 따라 걷는다. 길은 서쪽과 남쪽으로 이어지는 것 같다. 풀과 이끼로 뒤덮인 가파른 언덕 바로 옆에 서 있다. 언덕이 당신 머리 위로 너무 가파르게 솟아 올라 올라갈 수 있을지 의문이다.
  verdict: awkward
  note: '''당신은 흙길을 따라 걷는다''처럼 주어 ''당신은''을 매번 넣으면 번역투가 된다. ''솟아 올라''는 ''솟아올라''로 붙여 써야 하며, ''의문이다''도 딱딱하다.'
  fix: 흙길을 따라 나아간다. 길은 서쪽과 남쪽으로 이어지는 듯하다. 풀과 이끼로 뒤덮인 가파른 언덕이 바로 옆에 있다. 언덕이 머리 위로 워낙 가파르게 솟아 있어 오를 수 있을지 의심스럽다.
- id: tba:200:obj:20010
  field: short
  en: a pair of broken sandals
  ko: 깨진 샌들 한 쌍
  verdict: wrong
  note: '''깨진''은 유리나 그릇처럼 단단한 물건에 쓴다. 샌들에는 ''망가진''이 맞다. 신발의 단위는 ''쌍''이 아니라 ''켤레''다.'
  fix: 망가진 샌들 한 켤레
- id: tba:200:room:20000
  field: name
  en: Western Highway Zone Description Room
  ko: 서쪽 고속도로 구역 설명 방
  verdict: wrong
  note: '''고속도로''가 오역이다. 지명을 ''서부 대로''로 통일해야 한다.'
  fix: 서부 대로 구역 설명 방
- id: tba:200:room:20017
  field: description
  en: The Western Highway ends abruptly at a collapsed bridge.  A raging river flows beneath it slowly washing the remains
    of the bridge away.  Debris and sand has been scattered everywhere.  The river must have overflown and washed the bridge
    away.
  ko: 서부 고속도로는 무너진 다리 앞에서 갑자기 끝난다. 거친 강물이 다리 아래를 흐르며 천천히 다리 잔해를 쓸어가고 있다. 파편과 모래가 여기저기 흩어져 있다. 강물이 넘쳐 다리를 쓸어간 것 같다.
  verdict: wrong
  note: '''Highway''를 현대어 ''고속도로''로 옮겨 판타지 세계관과 맞지 않는다. ''must have''의 확신도 ''것 같다''로 약해졌다.'
  fix: 서부 대로는 무너진 다리 앞에서 갑자기 끊긴다. 거센 강물이 다리 아래를 흐르며 다리 잔해를 천천히 쓸어 가고 있다. 잔해와 모래가 사방에 흩어져 있다. 강물이 넘쳐 다리를 쓸어 간 것이 틀림없다.
- id: tba:200:mob:20010
  field: long
  en: An old man with a crazy look in his eyes squints up at you and begins to rant and rave.
  ko: 미친 듯한 눈빛을 한 노인이 당신을 올려다보며 눈을 가늘게 뜨고 소리를 지르기 시작한다.
  verdict: awkward
  note: '''올려다보며 눈을 가늘게 뜨고''는 어순이 부자연스럽다. ''rant and rave''는 단순히 소리를 지르는 것이 아니라 횡설수설 떠들어 대는 것이다.'
  fix: 광기 어린 눈빛의 노인이 눈을 가늘게 뜨고 당신을 올려다보더니 횡설수설 떠들어 대기 시작한다.
- id: tba:200:mob:20005
  field: short
  en: a woodsman
  ko: 산림 노동자
  verdict: wrong
  note: '''산림 노동자''는 현대 직업명이라 세계관에 맞지 않는다. ''woodsman''은 ''나무꾼''이 적절하다.'
  fix: 나무꾼
- id: tba:200:room:20001
  field: description
  en: You are on the Western Highway east of here you can see the gates of the Capital while to the west the highway continues.  A
    gravelled path leads northward, away from this boring highway, towards some rocks a bit further north.
  ko: 당신은 서쪽 고속도로 위에 있다. 동쪽으로는 수도의 성문이 보이고, 서쪽으로는 고속도로가 이어진다. 지저분한 자갈길 하나가 이 지루한 고속도로를 떠나 북쪽, 조금 더 북쪽의 바위들 쪽으로 뻗어 있다.
  verdict: wrong
  note: 고유명사 'Western Highway'를 1번과 다르게 '서쪽 고속도로'로 옮겼고, '고속도로'는 현대어다. 'gravelled path'에 없는 '지저분한'이 덧붙었다.
  fix: 당신은 서부 대로 위에 있다. 동쪽으로는 수도의 성문이 보이고, 서쪽으로는 대로가 계속 이어진다. 자갈 깔린 오솔길 하나가 이 지루한 대로를 벗어나 북쪽으로, 조금 더 북쪽에 있는 바위들 쪽으로 뻗어 있다.
- id: tba:200:room:20038
  field: description
  en: You make your way on the dirt road.  You notice the road leads to the north. The road bends to the west into a dense
    forest.  Their seems to be an absence of wildlife in this area, the forest is strangely silent.
  ko: 당신은 흙길을 따라 걷고 있다. 길이 북쪽으로 이어지는 것을 알게 된다. 도로는 서쪽으로 꺾여 울창한 숲으로 들어간다. 이 일대에는 야생 동물이 없는 듯하며, 숲은 이상할 정도로 고요하다.
  verdict: awkward
  note: '''You notice''를 ''~것을 알게 된다''로 직역해 어색하다. ''흙길''과 ''도로''를 섞어 써서 용어도 흔들린다.'
  fix: 당신은 흙길을 따라 나아간다. 길은 북쪽으로 이어지고, 서쪽으로도 꺾여 울창한 숲으로 들어간다. 이 일대에는 야생 동물이 없는 듯하고, 숲은 이상하리만치 고요하다.
- id: tba:200:mob:20008
  field: long
  en: An old man strolls past walking his trapline.
  ko: 노인이 함정 줄을 따라 걸으며 지나간다.
  verdict: wrong
  note: '''trapline''은 덫을 놓아 둔 순회로다. ''함정 줄''은 오역이다.'
  fix: 노인이 놓아 둔 덫들을 둘러보며 지나간다.
- id: tba:200:obj:20016
  field: extras.0.text
  en: This metal foot trap is almost rusted completely shut.  The springs on each side of the metal clamps are old and worn.
  ko: 이 금속 발톱 함정은 거의 완전히 녹슬어 닫혀 있다. 금속 클램프 양쪽의 스프링은 낡고 마모되어 있다.
  verdict: wrong
  note: '''foot trap''은 짐승의 발을 무는 ''발덫''인데 ''발톱 함정''으로 오역했다. ''rusted shut''은 녹슬어 닫힌 채 굳은 상태다. ''클램프''는 현대 외래어라 세계관에 맞지 않는다.'
  fix: 이 쇠 발덫은 녹이 슬어 거의 완전히 닫힌 채 굳어 있다. 쇠 집게 양쪽의 용수철은 낡고 닳아 있다.
- id: tba:200:room:20033
  field: description
  en: Moving along the road you notice that the road continues the the east and north.  The road curves around a large steep
    hill to the south.  The hill looks somewhat unnatural, and out of place.
  ko: 길을 따라 가다 보니 길이 동쪽과 북쪽으로 이어지는 것을 알게 된다. 남쪽으로는 길은 크고 가파른 언덕을 돌아간다. 그 언덕은 어딘가 부자연스럽고, 주변 풍경과 어울리지 않는 모습이다.
  verdict: awkward
  note: '''남쪽으로는 길은''은 조사가 겹쳐 비문이다. ''~것을 알게 된다''는 ''notice''를 직역해 어색하다.'
  fix: 길을 따라 나아가니 길이 동쪽과 북쪽으로 이어진다. 길은 남쪽의 크고 가파른 언덕을 휘감아 돈다. 그 언덕은 어딘가 부자연스럽고, 주변과 어울리지 않아 보인다.
- id: tba:200:obj:20020
  field: extras.0.text
  en: This bright red fur could only have come from a red fox.  It is smooth and in excellent condition.
  ko: 이 선명한 붉은 털은 붉은 여우에서 온 것일 수밖에 없다. 매끄럽고 상태가 매우 좋다.
  verdict: awkward
  note: '''붉은 여우에서 온 것일 수밖에 없다''는 ''could only have come from''을 직역해 딱딱하다.'
  fix: 이 선명한 붉은 털은 붉은 여우의 것이 틀림없다. 매끄럽고 상태가 아주 좋다.
