- id: tba:150:mob:15012
  field: description
  en: As all members of the Guard, Peter wears the chain mail required of them as uniform.  Even though all the other guards
    seem well trained, you realize none of them would stand a chance against this man in a fight.  He stands at least two
    meters tall, but still moves with an almost feline grace.  He actually radiates strength and confidence, and you have
    to fight a sudden urge to come to attention as you see him.
  ko: 근위대원 모두처럼 피터도 제복으로 지정된 사슬 갑옷을 입고 있다. 다른 근위대원들도 모두 잘 훈련되어 보이지만, 당신도 이 남자와의 싸움에서 그 누구도 승산이 없다는 것을 깨닫는다. 그는 최소한 2미터는 되어
    보이지만, 여전히 거의 고양이 같은 우아함으로 움직인다. 그는 실제로 힘과 자신감을 뿜어내며, 그를 보자마자 갑자기 경례를 하고 싶은 충동을 억누르느라 정신이 없다.
  verdict: wrong
  note: 원문은 '근위대원 중 누구도 이 남자를 이길 수 없다'는 뜻인데 번역에 '당신도'가 덧붙어 의미가 달라졌다. 'come to attention'은 경례가 아니라 차렷 자세를 취하는 것이다. '정신이 없다'는
    원문에 없는 내용이다. 그 밖에 '근위대원 모두처럼', '실제로'는 번역투다.
  fix: 다른 근위대원들과 마찬가지로 피터도 제복으로 정해진 사슬 갑옷을 입고 있다. 다른 근위대원들도 모두 잘 훈련된 듯 보이지만, 싸움이 붙으면 그들 중 누구도 이 남자를 당해 내지 못하리라는 것을 당신은 깨닫는다.
    키가 적어도 2미터는 되는데도 그는 고양이처럼 우아한 몸놀림으로 움직인다. 그에게서는 그야말로 힘과 자신감이 뿜어져 나오고, 그를 본 당신은 갑자기 차렷 자세를 취하고 싶은 충동을 억눌러야 한다.
