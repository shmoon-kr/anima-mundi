- id: tba:150:room:15015
  field: description
  en: You are in a passage, that leads north and south. To the east there is an exit to the Great Hall.
  ko: 당신은 북쪽과 남쪽으로 이어지는 통로에 있다. 동쪽으로는 대강당으로 나가는 출구가 있다.
  verdict: wrong
  note: 성의 'Great Hall'은 연회와 의식이 열리는 중심 홀이다. 그래서 학교나 공공시설을 떠올리게 하는 '대강당'은 맞지 않는다. 또 '나가는 출구'는 같은 뜻이 겹친다.
  fix: 당신은 북쪽과 남쪽으로 이어지는 통로에 있다. 동쪽으로는 대연회장으로 통하는 출구가 있다.
