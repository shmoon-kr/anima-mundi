  field: description
  en: You are standing in a small passage, that is clearly intended mostly for the servants of the Castle.  It is only dimly
    lit and quite narrow. The passage leads west, and to the east there is a small door.
  ko: 당신은 작은 통로에 서 있다. 분명 주로 성의 하인들이 쓰도록 만든 통로다. 불빛은 어둑하고 폭도 꽤 좁다. 통로는 서쪽으로 이어지고, 동쪽에는 작은 문이 하나 있다.
  verdict: ok
