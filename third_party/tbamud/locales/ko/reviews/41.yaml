- id: tba:41:room:4107
  field: description
  en: You are standing at the elbow turn of a small passageway.  It turns quite sharply to the south and west.  To the south,
    it appears that the passage continues, but to the west you can see what almost appears to be a golden light.
  ko: 당신은 작은 통로의 굽은 구석에 서 있다. 통로는 남쪽과 서쪽으로 상당히 급하게 꺾여 있다. 남쪽으로는 통로가 계속 이어지는 것처럼 보이지만, 서쪽으로는 거의 황금빛으로 보이는 것이 보인다.
  verdict: awkward
  note: '''굽은 구석''은 elbow turn(꺾이는 모퉁이)의 표현으로 부자연스럽다. ''보이는 것이 보인다''는 같은 말이 반복된다.'
  fix: 당신은 작은 통로가 꺾이는 모퉁이에 서 있다. 통로는 남쪽과 서쪽으로 상당히 급하게 꺾여 있다. 남쪽으로는 통로가 계속 이어지는 듯하지만, 서쪽으로는 황금빛에 가까운 빛이 보인다.
