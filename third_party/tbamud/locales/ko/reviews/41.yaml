- id: tba:41:room:4101
  field: description
  en: The tunnel seems to be slightly sloped here as it continues in its east-west direction.  The tunnel walls are far apart,
    almost allowing for four people to travel abreast with ease.  The walls do not seem to be very damp, but there is a small
    rivulet running along the northern wall of the tunnel.
  ko: 터널은 동서 방향으로 이어지다가 이 지점에서 약간 경사가 있는 듯하다. 터널 벽면은 꽤 멀리 떨어져 있어 네 명이 나란히 걷기에도 무리가 없을 정도다. 벽면은 그리 축축해 보이지 않지만, 터널 북쪽 벽면을 따라
    작은 물줄기가 흐르고 있다.
  verdict: wrong
  note: '''almost allowing''의 ''거의''가 빠져 네 명이 나란히 걷는 데 무리가 없다고 단정하게 되었다. ''이어지다가''도 원문에 없는 방향 변화를 암시한다.'
  fix: 터널은 동서로 이어지며 이 지점에서 약간 경사져 있는 듯하다. 터널 벽 사이가 꽤 넓어서 네 명이 거의 나란히 걸을 수 있을 정도다. 벽면은 그리 축축해 보이지 않지만, 터널 북쪽 벽을 따라 작은 물줄기가
    흐르고 있다.
