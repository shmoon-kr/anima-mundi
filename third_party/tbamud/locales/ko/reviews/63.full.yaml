  en: You are on a 'fuzzy' tree limb.  Interesting, since the branches seem to have 'hairs' sprouting from its bark.  As you
    look closer you see millions of aphids covering each limb.
  ko: 당신은 '털이 보송보송한' 나뭇가지 위에 있다. 흥미로운 것은, 가지의 껍질에서 '털'이 자라나고 있는 것처럼 보인다는 점이다. 가까이서 살펴보니, 각 가지에 수백만 마리의 진딧물이 뒤덮여 있다.
  verdict: awkward
  note: '''각 가지에 진딧물이 뒤덮여 있다''는 문법이 어색하다.'
  fix: 당신은 '털이 보송보송한' 나뭇가지 위에 있다. 묘하게도 가지 껍질에서 '털'이 돋아난 것처럼 보인다. 가까이 들여다보니 가지마다 진딧물 수백만 마리가 빽빽이 뒤덮고 있다.
- id: tba:63:mob:6305
  field: description
  en: You notice a glazed look in her eyes.
  ko: 그녀의 눈이 흐려져 있다.
  verdict: awkward
  note: glazed look은 초점 없이 멍한 눈빛을 말한다. '흐려져'는 뿌옇게 탁하다는 뜻에 가깝다.
  fix: 그녀의 눈빛이 멍하게 풀려 있다.
- id: tba:63:obj:6302
  field: long
  en: A blue wizard's hat lies here.
  ko: 파란색 마법사의 모자가 여기 놓여 있다.
  verdict: awkward
  note: '''파란색 마법사의 모자''는 ''파란 마법사''의 모자로도 읽힌다. 파란 것은 모자다.'
  fix: 파란 마법사 모자가 여기 놓여 있다.
- id: tba:63:room:6307
  field: description
  en: Spiders, spiders, everywhere!  It is almost ant-like in efficiency with one big difference.  The spiders here are carrying
    ant-corpses, as well as cats, wolves, and humans.
  ko: 거미, 거미, 어디에나! 거의 개미처럼 효율적이다. 다만 한 가지 큰 차이가 있다. 여기의 거미들은 개미 시체뿐 아니라 고양이, 늑대, 그리고 인간까지 나르고 있다.
  verdict: awkward
  note: 뜻은 맞다. 다만 '거미, 거미, 어디에나!'와 '여기의 거미들은'이 번역투다.
  fix: 거미, 거미, 사방이 거미다! 개미에 버금갈 만큼 효율적이지만, 한 가지 큰 차이가 있다. 이곳 거미들은 개미 시체뿐 아니라 고양이, 늑대, 인간까지 나르고 있다.
- id: tba:63:mob:6305
  field: short
  en: the queen wasp
  ko: 여왕벌
  verdict: wrong
  note: wasp는 말벌이다. '여왕벌'은 queen bee로 읽힌다.
  fix: 여왕말벌
- id: tba:63:room:6350
  field: name
  en: The Ki-Rin Chamber
  ko: 기린의 방
  verdict: wrong
  note: '''기린''은 동물 기린(giraffe)으로 읽힌다. 22번의 ''키린''과도 표기가 다르다.'
  fix: 키린의 방
- id: tba:63:room:6332
  field: description
  en: This part of the web intersects through the branches of some trees.  Various leaves and other debris that the many drones
    have not picked up yet lie here.
  ko: 이 부분의 거미줄은 몇 그루 나무의 가지 사이로 뻗어 있다. 수많은 일벌들이 아직 치우지 않은 온갖 나뭇잎과 잔해가 여기 널려 있다.
  verdict: wrong
  note: 거미 존에서 drones는 일꾼 거미를 뜻한다. '일벌'은 벌로 오역한 것이다.
  fix: 이곳의 거미줄은 몇 그루 나무의 가지 사이를 가로지른다. 수많은 일꾼 거미들이 아직 치우지 않은 온갖 나뭇잎과 잔해가 여기 널려 있다.
- id: tba:63:room:6325
  field: description
  en: Another tether path just like the rest of them.  Surprisingly well-lit by the golden orbs that hang from the sides,
    you can see the paths become finer and finer in quality.
  ko: 나머지와 똑같은 또 다른 끈길이다. 양쪽에서 매달린 황금빛 구슬 덕분에 의외로 밝아, 길이 점점 더 정교해져 가는 것이 보인다.
  verdict: awkward
  note: '''끈길''은 낯선 조어다. ''양쪽에서 매달린''도 어색하다.'
  fix: 다른 길들과 다를 바 없는 또 하나의 거미줄 길이다. 양옆에 매달린 황금빛 구슬 덕분에 뜻밖에 밝아서, 길이 점점 더 정교해지는 것이 보인다.
- id: tba:63:mob:6302
  field: long
  en: Yevaud, the Usurper of Midgaard is here, grinning evilly at you.
  ko: 미드가르드의 찬탈자 예보가 여기 있으며, 악랄하게 웃으며 당신을 바라보고 있다.
  verdict: wrong
  note: Yevaud를 '예보'로 쓰면 끝소리가 빠진다. 또 '일기예보'의 예보로 읽힌다. '여기 있으며 … 있다'는 문장도 딱딱하다.
  fix: 미드가르드의 찬탈자 예보드가 여기서 당신을 보며 사악하게 히죽거리고 있다.
- id: tba:63:mob:6312
  field: description
  en: He delves deeper into you as you stare at him.  Only those free of taint will be allowed to remain here safely.
  ko: 당신이 그를 응시하는 동안, 그는 당신의 내면으로 더 깊이 파고든다. 오직 더러움에서 자유로운 자만이 이곳에 안전하게 머물 수 있을 것이다.
  verdict: awkward
  note: '''더러움에서 자유로운''은 free of taint를 직역한 번역투다.'
  fix: 당신이 그를 응시하는 동안, 그는 당신의 내면을 더 깊이 꿰뚫어 본다. 오직 티끌 하나 없이 순수한 자만이 이곳에 안전하게 머물 수 있을 것이다.
- id: tba:63:room:6323
  field: description
  en: The trees here take on a different appearance -- they are not trees anymore, but disjointed make-shift silken made shafts,
    sticky to the touch, and webby in texture.  This is another world it would appear.
  ko: 여기의 나무들은 전혀 다른 모습이다. 더 이상 나무가 아니라, 엉성하게 엮인 실크로 만든 기둥들이다. 만져보면 끈적하고, 질감은 거미줄 같다. 이곳은 분명 다른 세계다.
  verdict: wrong
  note: '''it would appear''는 추측인데 ''분명''으로 단정했다. ''실크로 만든 기둥들이다''도 다듬을 필요가 있다.'
  fix: 여기의 나무들은 전혀 다른 모습이다. 더 이상 나무가 아니라, 엉성하게 얼기설기 이어 붙인 비단실 기둥들이다. 만져보면 끈적하고, 질감은 거미줄 같다. 이곳은 아무래도 다른 세계인 듯하다.
- id: tba:63:mob:6301
  field: description
  en: He looks freshly hatched and sprightly.  His young fangs are just growing in as of late.
  ko: 갓 태어난 듯 생기 있어 보인다. 그의 어린 송곳니는 최근 막 자라나고 있다.
  verdict: awkward
  note: hatched는 '알에서 깨어난'이라는 뜻인데 '태어난'으로 옮겨 뉘앙스가 흐려졌다. '그의'는 불필요하다.
  fix: 갓 알에서 깨어난 듯 생기가 넘친다. 어린 송곳니가 이제 막 돋아나고 있다.
- id: tba:63:mob:6307
  field: long
  en: An ethereal spider strides here, traveling to different worlds.
  ko: 에테리얼 거미가 여기로 걸어 들어온다. 다른 세계로 여행하는 중이다.
  verdict: wrong
  note: '''strides here''는 여기서 걷고 있다는 뜻이다. 들어오는 동작이 아니다. ethereal은 29번처럼 ''이계의''로 통일한다.'
  fix: 이계의 거미가 여기서 성큼성큼 걸으며 여러 세계를 오가고 있다.
- id: tba:63:mob:6312
  field: long
  en: The Donjonkeeper eyes you and wonders how pure your soul is.
  ko: 돈종키퍼가 당신을 바라보며 당신의 영혼이 얼마나 순수한지 궁금해한다.
  verdict: wrong
  note: 21번은 '돈존', 여기는 '돈종'으로 표기가 다르다. '돈존키퍼'로 통일한다.
  fix: 돈존키퍼가 당신을 바라보며 당신의 영혼이 얼마나 순수한지 궁금해한다.
- id: tba:63:room:6307
  field: name
  en: On The Busy Path
  ko: 바쁜 길 위
  verdict: awkward
  note: busy path를 '바쁜 길'로 직역했다. 길은 '붐비는' 것이다.
  fix: 붐비는 길 위
- id: tba:63:room:6336
  field: name
  en: The Tenuous Strand
  ko: 허술한 실
  verdict: awkward
  note: '''허술한''은 엉성하다는 뜻이다. tenuous는 가늘고 위태롭다는 뜻이다. 23번과 맞춰 ''가닥''을 쓴다.'
  fix: 위태로운 가닥
- id: tba:63:room:6370
  field: name
  en: The Donjonkeep
  ko: 돈존케이프
  verdict: wrong
  note: '''케이프''는 망토(cape)로 읽힌다. keep은 ''킵''으로 쓰고 15번과 표기를 통일한다.'
  fix: 돈존킵
- id: tba:63:room:6305
  field: name
  en: Beneath The Busy Path
  ko: 바쁜 길 아래
  verdict: awkward
  note: 17번과 같은 직역 문제다.
  fix: 붐비는 길 아래
- id: tba:63:mob:6303
  field: description
  en: The wolf spider is hairy, very hairy.
  ko: 늑대거미는 털이 많으며, 매우 많다.
  verdict: awkward
  note: '''털이 많으며, 매우 많다''는 반복의 말맛을 살리지 못해 딱딱하다.'
  fix: 늑대거미는 털이 많다. 아주, 아주 많다.
- id: tba:63:obj:6304
  field: long
  en: A black visor sits here.
  ko: 검은 비저가 여기 놓여 있다.
  verdict: wrong
  note: visor를 '비저'로 음차했다. 투구의 얼굴 가리개는 '면갑'이다.
  fix: 검은 면갑이 여기 놓여 있다.
- id: tba:63:mob:6316
  field: long
  en: A wyrmkin with no teeth plays here.
  ko: 이빨이 없는 어린 용족이 여기 노고 있다.
  verdict: wrong
  note: 원문에 없는 '어린'이 추가되었다. '노고'는 '놀고'의 오타다.
  fix: 이빨이 없는 용족 하나가 여기서 놀고 있다.
- id: tba:63:room:6335
  field: description
  en: This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by its sticky strands.
  ko: 이곳은 이계의 거미줄의 또 다른 고리다. 온갖 생물들이 끈적한 실에 걸리거나(혹은 홀리거나) 하는 것 같다.
  verdict: awkward
  note: '''이계의 거미줄의''처럼 ''의''가 겹친다. ''걸리거나(혹은 홀리거나) 하는''도 어색하다.'
  fix: 이곳은 이계 거미줄의 또 다른 고리다. 온갖 생물이 그 끈적한 실에 걸리는(혹은 홀리는) 듯하다.
- id: tba:63:room:6323
  field: name
  en: The Web Forest
  ko: 거미숲
  verdict: wrong
  note: web은 거미줄이다. '거미숲'은 거미가 사는 숲(spider forest)으로 읽힌다.
  fix: 거미줄 숲
- id: tba:63:room:6360
  field: description
  en: Yevaud, the Usurper of Midgaard, resides here.  A voice cries out, 'BEWARE, the Usurper of Midgaard lives here!  FLEE
    while you can!' But even Yevaud has his master... or so you deduce.
  ko: 미드가르드의 찬탈자 예보드가 여기 거주한다. 목소리가 외친다. '경계하라, 미드가르드의 찬탈자가 여기 산다! 아직 탈출할 수 있을 때 도망쳐라!' 하지만 예보드에게도 주인이 있는 것 같다... 그렇게 당신은
    추측한다.
  verdict: awkward
  note: '''거주한다''는 딱딱하고, ''아직 탈출할 수 있을 때 도망쳐라''는 뜻이 겹친다. ''있는 것 같다... 그렇게 당신은 추측한다''는 추측을 두 번 말하는 직역투다.'
  fix: 미드가르드의 찬탈자 예보드가 여기 산다. 목소리가 외친다. '조심하라, 미드가르드의 찬탈자가 여기 산다! 할 수 있을 때 달아나라!' 하지만 예보드에게도 주인이 있다... 적어도 당신은 그렇게 짐작한다.
- id: tba:63:mob:6306
  field: long
  en: A drone spider walks around doing its master's bidding.
  ko: 수컷 거미가 주인을 위해 여기저기 돌아다니고 있다.
  verdict: wrong
  note: 여기서 drone은 '수컷'이 아니라 주인을 섬기는 일꾼이라는 뜻이다. 'doing its master's bidding'은 '주인을 위해'보다 '주인의 명령을 받들며'에 가깝다.
  fix: 일꾼 거미가 주인의 명령을 받들며 여기저기 돌아다닌다.
- id: tba:63:room:6326
  field: name
  en: A Road Crossing
  ko: 길의 갈림길
  verdict: wrong
  note: Crossing은 교차로이고 갈림길(split)이 아니다. '길의 갈림길'은 말도 겹친다.
  fix: 교차로
- id: tba:63:obj:6305
  field: short
  en: a thick white potion
  ko: 두꺼운 흰색 포션
  verdict: wrong
  note: 액체에 쓰인 thick은 '걸쭉한'이다. '두꺼운'은 오역이다. potion은 음차한 '포션' 대신 '물약'으로 옮긴다.
  fix: 걸쭉한 흰색 물약
- id: tba:63:room:6345
  field: name
  en: A Link In The Ethereal Web
  ko: 이계의 거미줄의 한 고리
  verdict: awkward
  note: Ethereal Web이 항목마다 '이계의 거미줄', '에테리얼 거미줄', '에테리얼 웹'으로 다르게 옮겨졌다. 용어를 통일하고, '의'가 겹치는 것도 피한다.
  fix: 에테르 거미줄의 한 고리
- id: tba:63:mob:6313
  field: description
  en: He looks like a lazy bum who sleeps half the time.
  ko: 그는 절반의 시간을 잠으로 보내는 게으른 무뢰한처럼 보인다.
  verdict: wrong
  note: bum은 부랑자나 게으름뱅이이고 '무뢰한'(불량배)이 아니다. '절반의 시간을'은 직역투다.
  fix: 그는 하루의 절반을 잠으로 보내는 게으른 부랑자처럼 보인다.
- id: tba:63:room:6373
  field: description
  en: Here you see evidence of a vagrant's abode.  The shack is to the north, if you dare enter it.  You get the sneaking
    feeling you should go back now.  The skies above you darken and roar with the laughter of thunder.
  ko: 여기서 방랑자의 거처 흔적을 볼 수 있다. 오두막은 북쪽에 있으며, 감히 들어갈 수 있다면 말이다. 지금 당장 돌아가야 한다는 찜찜한 느낌이 든다. 당신 머리 위의 하늘이 어두워지고, 천둥의 웃음소리로 울려
    퍼진다.
  verdict: awkward
  note: '''~을 볼 수 있다'', ''감히 들어갈 수 있다면 말이다'', ''천둥의 웃음소리로 울려 퍼진다''가 모두 직역투다.'
  fix: 이곳에는 방랑자가 머문 흔적이 남아 있다. 북쪽에 오두막이 있다. 들어갈 용기가 있다면 말이다. 지금 당장 돌아가야 할 것 같은 찜찜한 느낌이 든다. 머리 위 하늘이 어두워지더니 천둥이 웃음소리처럼 으르렁댄다.
- id: tba:63:room:6342
  field: description
  en: This is a big game hunter among most spiders.  Crushed jewels and weapons suggest the inhabitant must have powerful
    jaws.  Beware!
  ko: 대부분의 거미들 중에서도 큰 사냥꾼이다. 부서진 보석과 무기들이 거주자의 강력한 턱을 암시한다. 조심하라!
  verdict: wrong
  note: big game hunter는 '큰 사냥꾼'이 아니라 큰 사냥감을 노리는 사냥꾼이다. 'must have'의 확신도 빠졌다.
  fix: 거미들 가운데서도 큰 사냥감을 노리는 사냥꾼이다. 부서진 보석과 무기들로 보아 이곳에 사는 자는 강력한 턱을 지녔음이 틀림없다. 조심하라!
- id: tba:63:room:6355
  field: description
  en: This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by its sticky strands.  To
    the north you sense the heavy breathing of a fiery animal.
  ko: 이곳은 에테리얼 거미줄의 또 다른 연결고리다. 여러 종류의 생물이 끈적한 실에 걸리거나(혹은 최면에 걸리거나) 하는 것 같다. 북쪽에서는 불을 뿜는 짐승의 거친 숨소리가 느껴진다.
  verdict: wrong
  note: fiery animal을 '불을 뿜는 짐승'으로 옮기면서 원문에 없는 뜻이 더해졌다. '에테리얼'은 용어 통일이 필요하고, '걸리거나(...) 하는 것 같다'는 어색하다.
  fix: 이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물이 끈적한 실에 걸려드는(혹은 최면에 빠지는) 듯하다. 북쪽에서 불타는 짐승의 거친 숨소리가 느껴진다.
- id: tba:63:room:6367
  field: description
  en: A chair sits here for a tireless guardian who ensures that no soul escapes.  Other than that, the room is undecorated.
  ko: 여기에는 영혼이 도망치지 못하게 감시하는 피곤함 없는 수호자를 위한 의자가 놓여 있다. 그 외에는 방에 아무 장식도 없다.
  verdict: awkward
  note: tireless를 '피곤함 없는'으로 옮긴 것은 부자연스럽다. 자연스러운 표현은 '지칠 줄 모르는'이다.
  fix: 여기에는 어떤 영혼도 달아나지 못하게 지키는, 지칠 줄 모르는 수호자의 의자가 놓여 있다. 그 밖에 방에는 아무 장식도 없다.
- id: tba:63:mob:6315
  field: description
  en: She is the last bastion of good in this realm.  Her mission is to someday free the slaves of the Empress.  She has been
    trapped here for time eternal, and now the evil power of Arachnos feeds upon her intense magical energies.  She will never
    give up here fight against evil, though, and will continue her work in whatever manner presents itself.
  ko: 그녀는 이 세계에서 선의 마지막 보루이다. 그녀의 사명은 언젠가 여왕의 노예들을 해방시키는 것이다. 그녀는 영원한 시간 동안 이곳에 갇혀 있었고, 이제 아라크노스의 악한 힘은 그녀의 강력한 마법 에너지를 흡수하고
    있다. 하지만 그녀는 악에 대한 싸움을 결코 포기하지 않을 것이며, 어떤 형태로든 자신의 일을 계속해 나갈 것이다.
  verdict: wrong
  note: Empress는 '여제'이고 '여왕'(Queen)이 아니다. '영원한 시간 동안'은 직역투다. realm은 존 이름과 맞춰 '영역'으로 옮긴다.
  fix: 그녀는 이 영역에 남은 선의 마지막 보루다. 그녀의 사명은 언젠가 여제의 노예들을 해방하는 것이다. 그녀는 아득한 세월 동안 이곳에 갇혀 있었고, 이제 아라크노스의 악한 힘이 그녀의 강력한 마법 에너지를 빨아먹고
    있다. 그래도 그녀는 악에 맞선 싸움을 결코 포기하지 않을 것이며, 어떤 방식으로든 자신의 일을 이어 갈 것이다.
- id: tba:63:room:6350
  field: description
  en: A wise ki-rin was entrapped here many years ago.  It is from her that the ruler of this realm draws magical strength.
  ko: 지혜로운 기린이 수년 전에 이곳에 갇혔다. 이 세계의 통치자는 그녀로부터 마법의 힘을 끌어낸다.
  verdict: awkward
  note: many years ago는 '수년 전'보다 '오래전'이 맞다. 'It is from her'의 강조도 살린다.
  fix: 지혜로운 기린 한 마리가 오래전 이곳에 갇혔다. 이 영역의 통치자는 바로 그녀에게서 마법의 힘을 끌어낸다.
- id: tba:63:room:6371
  field: description
  en: A single spider line supports you once more.  As you look across the ether you seen a single shack up ahead with a light
    in the window. You sense a great evil coming from the north and feel inclined to go back on the ethereal web and take
    your chances there.
  ko: 단 하나의 거미줄이 다시금 당신을 지탱해 준다. 에테르 너머를 바라보니, 앞쪽에 창문에 불이 켜진 작은 오두막 하나가 보인다. 북쪽에서 큰 악이 다가오는 것을 느끼고, 에테리얼 웹으로 돌아가 그곳에서 운을 시험해
    보고 싶은 마음이 든다.
  verdict: wrong
  note: coming from the north는 악의 기운이 북쪽에서 풍겨 온다는 뜻이고 '다가온다'가 아니다. 원문에 없는 '작은'이 더해졌다. '에테리얼 웹'은 용어 통일이 필요하다.
  fix: 거미줄 한 가닥이 다시 당신을 떠받친다. 에테르 너머를 바라보니, 저 앞에 창문에 불빛이 비치는 오두막 한 채가 보인다. 북쪽에서 거대한 악의 기운이 풍겨 오는 것이 느껴져, 차라리 에테르 거미줄로 돌아가
    그곳에서 운을 시험해 보고 싶어진다.
- id: tba:63:mob:6310
  field: description
  en: The Bird Spider has very powerful jaws.
  ko: 새 거미는 매우 강력한 턱을 가지고 있다.
  verdict: wrong
  note: Bird Spider는 새를 잡아먹는 거미를 뜻하므로 '새잡이거미'다. '새 거미'는 오역이다.
  fix: 새잡이거미는 턱이 매우 강력하다.
- id: tba:63:room:6355
  field: name
  en: A Link In The Ethereal Web
  ko: 이계의 거미줄의 한 고리
  verdict: awkward
  note: 9번과 같다. Ethereal Web 용어를 통일한다.
  fix: 에테르 거미줄의 한 고리
- id: tba:63:obj:6304
  field: short
  en: a black knight's visor
  ko: 검은 기사의 비저
  verdict: wrong
  note: visor를 음차한 '비저'는 뜻이 통하지 않는다. 투구의 얼굴 가리개인 '면갑'으로 옮긴다.
  fix: 검은 기사의 면갑
- id: tba:63:room:6341
  field: description
  en: Once again the web crosses another tree limb.  To the side you see the possible entrance to another creature's lair.
  ko: 다시 한번 거미줄이 다른 나뭇가지를 가로지른다. 옆을 보니 다른 생물의 굴 입구로 보이는 곳이 보인다.
  verdict: awkward
  note: '''보이는 곳이 보인다''처럼 ''보이다''가 겹친다.'
  fix: 거미줄이 다시 한번 또 다른 나뭇가지를 가로지른다. 한쪽으로 다른 생물의 굴 입구일지도 모를 곳이 보인다.
- id: tba:63:room:6320
  field: description
  en: Strange.  No webbing here.  In fact, no sounds whatsoever. The path continues northward, where you find that you may
    have to tightrope your way across a ravine.
  ko: 이상하다. 여기에는 거미줄이 없다. 사실, 어떤 소리도 전혀 들리지 않는다. 길은 북쪽으로 이어지는데, 그곳에서 협곡을 건너기 위해 줄타기를 해야 할지도 모른다.
  verdict: awkward
  note: '''사실,''은 영어 ''In fact''를 직역한 것이라 어색하다. ''어떤 소리도 전혀''는 부정을 겹쳐 썼다. 뒷문장도 ''건너기 위해''로 늘어진다.'
  fix: 이상하다. 여기에는 거미줄이 없다. 그뿐 아니라 아무 소리도 들리지 않는다. 길은 북쪽으로 이어지는데, 그쪽에서는 줄타기하듯 협곡을 건너야 할지도 모른다.
- id: tba:63:room:6369
  field: name
  en: The Realm Of The Hopeless
  ko: 절망의 영역
  verdict: wrong
  note: '''the Hopeless''는 ''절망''이라는 감정이 아니라 ''희망을 잃은 자들''을 가리킨다.'
  fix: 절망한 자들의 영역
- id: tba:63:room:6313
  field: name
  en: The Wolf Spider Lair
  ko: 늑대 거미 소굴
  verdict: awkward
  note: 11번에서는 '늑대거미'로 붙여 썼다. 표준어도 한 단어이므로 띄어 쓰면 표기가 어긋난다.
  fix: 늑대거미 소굴
- id: tba:63:mob:6310
  field: long
  en: The bird spider snaps its powerful jaws.
  ko: 새 거미가 강력한 턱을 쩍쩍 벌리고 있다.
  verdict: wrong
  note: '''snaps its jaws''는 턱을 딱 다무는 동작인데 ''벌리고''로 옮겨 뜻이 반대가 됐다. ''bird spider''를 ''새 거미''로 옮기면 ''새로운 거미''로도 읽힌다. 새를 잡아먹는
