not_ok:
- id: tba:63:room:6392
  field: description
  en: Before you you see a large, web-like door.  Various designs of ancient runes and names of Midgaard heroes are etched
    into the webwork.  Perhaps lists of victims?  You can't tell.
  ko: 당신 앞에 거미줄로 된 거대한 문이 보인다. 고대 룬의 다양한 문양과 미드가르드 영웅들의 이름이 거미줄에 새겨져 있다. 어쩌면 희생자 목록일지도 모른다. 알 수 없다.
  verdict: awkward
  note: '''web-like''는 ''거미줄처럼 생긴''인데 ''거미줄로 된''으로 옮겨 뜻이 조금 바뀌었다. 또한 원문의 의문문(Perhaps lists of victims?)을 평서문으로 바꾸고 ''알 수 없다''로
    끊어서 어색하다.'
  fix: 당신 앞에 거미줄처럼 생긴 거대한 문이 보인다. 고대 룬의 다양한 문양과 미드가르드 영웅들의 이름이 거미줄에 새겨져 있다. 혹시 희생자 명단일까? 알 수 없는 일이다.
- id: tba:63:mob:6305
  field: long
  en: The queen wasp is here, thinking how tasty you look.
  ko: 여왕벌이 여기 있다. 당신이 얼마나 맛있는지 생각하고 있는 것 같다.
  verdict: wrong
  note: wasp는 말벌이다. '여왕벌'은 꿀벌을 떠올리게 한다. 또한 'how tasty you look'은 '맛있어 보인다'인데 '얼마나 맛있는지'로 옮겼고, 원문에 없는 '~것 같다'를 덧붙였다.
  fix: 여왕말벌이 여기 있다. 당신이 참 맛있어 보인다고 생각하고 있다.
- id: tba:63:mob:6314
  field: long
  en: Arachnos the Empress of Spiders welcomes you with an evil smile.
  ko: 거미의 여왕 아라크노스가 악의적인 미소로 당신을 맞이한다.
  verdict: wrong
  note: Empress는 '여제'다. '여왕'(queen)으로 옮기면 15번의 여왕말벌 등과 구분되지 않는다. 'evil smile'은 '사악한 미소'가 더 자연스럽다.
  fix: 거미의 여제 아라크노스가 사악한 미소로 당신을 맞이한다.
- id: tba:63:room:6372
  field: name
  en: The Single Spider Line
  ko: 단 하나의 거미줄
  verdict: awkward
  note: '''단 하나의''는 ''유일한''이라는 뜻을 강조해 어색하다. 실 한 가닥이라는 뜻이므로 ''외가닥''이 자연스럽다.'
  fix: 외가닥 거미줄
- id: tba:63:mob:6302
  field: short
  en: Yevaud
  ko: 예보
  verdict: wrong
  note: 28번에서는 '예보드'로 옮겨 표기가 일관되지 않고 끝의 d도 빠졌다. 표기는 '예보드'로 통일한다. 다만 어시스울라 르 귄 『어스시』의 용 이름이라면 국내 번역본 표기를 확인할 필요가 있다.
  fix: 예보드
- id: tba:63:room:6331
  field: description
  en: Large strands connect at this point.  The node shimmers and flickers within the ether.  You see many flying creatures
    -- insects, pegasi, and dragon wyrmkins -- navigate the dangerous passages of the web.  Exits go in many directions.
  ko: 여기서 굵은 실들이 서로 이어진다. 그 매듭은 에테르 속에서 반짝이며 흔들린다. 수많은 날아다니는 생물들—곤충, 페가수스, 그리고 용의 새끼들—이 거미줄의 위험한 통로를 오간다. 출구는 여러 방향으로 뚫려 있다.
  verdict: wrong
  note: flicker는 빛이 '깜박이다'라는 뜻인데, '흔들린다'로 잘못 옮겼다.
  fix: 여기서 굵은 실들이 서로 이어진다. 그 매듭은 에테르 속에서 반짝이며 깜박인다. 수많은 날아다니는 생물들—곤충, 페가수스, 그리고 용의 새끼들—이 거미줄의 위험한 통로를 오간다. 출구는 여러 방향으로 뚫려
    있다.
- id: tba:63:room:6301
  field: description
  en: Sticky, sticky, sticky!  The ground is cluttered with leaves, decayed remains of webbed crickets, beetle, rats, dogs,
    and even humans.  You begin to wonder about what lies ahead.  The air is damp here, and even the little light that shines
    through the canopy seems to be absorbed into the webbing.
  ko: 끈적끈적, 끈적끈적하다! 바닥은 낙엽과 거미줄에 걸린 메뚜기, 딱정벌레, 쥐, 개, 심지어 인간의 썩은 잔해로 뒤덮여 있다. 앞으로 무엇이 기다리고 있을지 궁금해진다. 여기 공기는 습하고, 지붕 사이로 스며드는
    약간의 빛조차 거미줄에 흡수되는 듯하다.
  verdict: wrong
  note: crickets는 '귀뚜라미'인데 '메뚜기'로 잘못 옮겼다. canopy는 숲 위를 덮은 나뭇잎을 뜻하는데 '지붕'으로 옮겨 건물 지붕처럼 읽힌다.
  fix: 끈적끈적, 끈적끈적하다! 바닥은 낙엽과 거미줄에 걸린 귀뚜라미, 딱정벌레, 쥐, 개, 심지어 인간의 썩은 잔해로 뒤덮여 있다. 앞으로 무엇이 기다리고 있을지 궁금해진다. 여기 공기는 습하고, 우거진 나뭇잎
    사이로 스며드는 약간의 빛조차 거미줄에 흡수되는 듯하다.
- id: tba:63:room:6304
  field: description
  en: Another webby passage, all sticky and wet.  Tiny ballooning spiders fill the air.  It seems that these young ones are
    newborns.
  ko: 또 다른 거미줄이 뒤덮인 통로로, 끈적하고 축축하다. 공중에는 작은 풍선 같은 거미들이 가득하다. 이 어린 것들은 갓 태어난 것 같다.
  verdict: wrong
  note: ballooning spiders는 거미줄을 타고 바람에 실려 떠다니는 거미인데 '풍선 같은 거미'로 오역했다. '거미줄이 뒤덮인'은 조사도 어색하다.
  fix: 또 다른 거미줄로 뒤덮인 통로로, 끈적하고 축축하다. 공중에는 바람을 타고 떠다니는 작은 거미들이 가득하다. 이 어린 것들은 갓 태어난 새끼들인 듯하다.
- id: tba:63:room:6303
  field: description
  en: Drones scuttle about in this room.  The cells on the walls are honeycomb in shape and many of the maggots and wasps
    you see have fang-marks on their bodies.  You sense some order in their markings.
  ko: 수벌들이 이 방 안을 바쁘게 기어 다닌다. 벽에 붙은 벌집은 육각형 모양을 하고 있으며, 보이는 유충과 말벌들의 몸에는 이빨 자국이 남아 있다. 그들의 무늬에 어떤 질서가 느껴진다.
  verdict: wrong
  note: cells(벌집의 방)를 '벌집'으로 옮겨 'honeycomb in shape'와 겹쳤고, 'many of'(상당수)가 빠져 모든 유충과 말벌에 자국이 있는 것처럼 되었다. markings는 무늬가 아니라
    앞서 말한 송곳니 자국이다.
  fix: 수벌들이 이 방 안을 바쁘게 기어 다닌다. 벽의 방들은 벌집처럼 육각형 모양이고, 눈에 띄는 유충과 말벌 중 상당수의 몸에는 송곳니 자국이 나 있다. 그 자국들에서 어떤 질서가 느껴진다.
- id: tba:63:room:6321
  field: description
  en: 'Stranger still.  Your feet get a real firm grip on the spiderline. You are above a deep ravine.  This line connects
    you between two trees. Below you can see a prismatic web with lots of animal bones caught in it: some bear and small deer
    bones in fact.  No human skeletons are visible (yet).'
  ko: 더욱 이상하다. 당신의 발은 거미줄에 단단히 붙잡힌다. 당신은 깊은 협곡 위에 있다. 이 줄은 두 나무 사이를 연결한다. 아래를 내려다보니, 수많은 동물 뼈가 걸려 있는 무지개빛 거미줄이 보인다. 실제로 곰과
    작은 사슴 뼈들이 보인다. 인간 해골은 아직 보이지 않는다.
  verdict: awkward
  note: '''당신의 발은 거미줄에 붙잡힌다''는 발이 묶인 것처럼 읽히는데, 원문은 발을 단단히 디딘다는 뜻이다. 문장이 직역투이고, ''무지개빛''은 ''무지갯빛''이 맞는 표기다. 원문의 ''(yet)'' 괄호
    뉘앙스도 살리는 편이 낫다.'
  fix: 더 이상한 일이다. 발이 거미줄을 아주 단단히 디딘다. 당신은 깊은 협곡 위에 있다. 이 줄은 두 나무 사이를 잇고 있다. 아래로 무지갯빛 거미줄이 보이는데, 동물 뼈가 잔뜩 걸려 있다. 사실 곰 뼈와 작은
    사슴 뼈도 있다. 인간의 해골은 (아직) 보이지 않는다.
- id: tba:63:mob:6309
  field: long
  en: A quasit blinks in and out, grinning at you.
  ko: 콰짓이 깜빡이며 나타나고 사라지며 당신에게 웃어 보인다.
  verdict: awkward
  note: '''~며 ~며''가 겹쳐 문장이 늘어진다. grinning은 ''히죽 웃다''가 자연스럽다.'
  fix: 콰짓 하나가 깜빡깜빡 나타났다 사라졌다 하며 당신을 향해 히죽 웃는다.
- id: tba:63:room:6302
  field: description
  en: You find that footing here is very good, almost too good.  The limbs are coated with cobwebs and seem unusually strong
    for tree branches.  Paths lead in four directions.  The eastward path goes down a bit.
  ko: 여기서 발걸음이 아주 잘 잡힌다. 오히려 너무 잘 잡힌다. 나뭇가지에는 거미줄이 뒤덮여 있고, 나무 가지치고는 유난히 단단해 보인다. 네 방향으로 길이 나 있다. 동쪽 길은 약간 아래로 내려간다.
  verdict: awkward
  note: '''발걸음이 잘 잡힌다''는 footing을 직역한 어색한 표현이다. ''나뭇가지에는 거미줄이 뒤덮여''는 조사가 어색하다.'
  fix: 이곳은 발 디디기가 아주 좋다. 지나치게 좋을 정도다. 나뭇가지는 거미줄로 뒤덮여 있고, 나뭇가지치고는 유난히 튼튼해 보인다. 네 방향으로 길이 나 있다. 동쪽 길은 약간 내리막이다.
- id: tba:63:mob:6309
  field: description
  en: Demoniac in nature, but more mischievous.  He twiddles his thumbs and creates a magical treasure!
  ko: 본질은 악마적이지만 더 장난기 많다. 그는 엄지손가락을 꼼지락거리며 마법적인 보물을 만들어 낸다!
  verdict: awkward
  note: '''더 장난기 많다''는 비교 대상이 불분명하다. 불필요한 ''그는''이 들어가 있고, ''마법적인 보물''은 번역투다.'
  fix: 본성은 악마 같지만 그보다는 장난기가 더 많다. 엄지손가락을 빙빙 돌리더니 마법 보물을 만들어 낸다!
- id: tba:63:room:6399
  field: description
  en: This is the lair of the Empress Spider, Arachnos.  You can see a lavishly adorned rainbow web, her lair allows her to
    move to any universe she wishes by using her magical strands to the Prime Material Plane.  Coffers upon coffers of gold,
    magical jewels and gems await.  Unfortunately Arachnos is a baggy spider too, and webs all her treasures to her beautiful
    silken body.
  ko: 여기는 거미 여왕 아라크노스의 소굴이다. 화려하게 장식된 무지개빛 거미줄이 보인다. 그녀의 소굴은 마법적인 실을 이용해 원소계(Prime Material Plane)를 통해 원하는 어떤 우주로든 이동할 수 있게
