  fix: 새잡이거미가 강력한 턱을 딱딱 부딪친다.
- id: tba:63:room:6370
  field: description
  en: No souls have ever lived in this place.  The wails of slaves and the howls of wolves are the only way you can describe
    the sounds you hear.  The walls are thin and wispy.  The only light you receive is the shimmering from the strand of the
    ethereal web you used to get here.
  ko: 이곳에 영혼이 살아본 적은 단 한 번도 없다. 당신이 듣는 소리는 노예들의 비명과 늑대들의 울음소리뿐이다. 벽은 얇고 희미하다. 당신이 받는 유일한 빛은 이곳에 오기 위해 사용한 에테리얼 웹의 실에서 반짝이는
    빛이다.
  verdict: wrong
  note: 원문은 들리는 소리를 '노예의 울부짖음과 늑대의 울음이라고밖에 표현할 수 없다'는 비유인데, 실제로 그 소리만 들린다는 뜻으로 바뀌었다. '에테리얼 웹'은 음차라 다른 항목의 표기와 맞지 않는다. '당신이
    받는 유일한 빛'은 직역투다.
  fix: 이곳에는 단 한 번도 영혼이 살았던 적이 없다. 들려오는 소리는 노예들의 울부짖음과 늑대들의 울음소리라고밖에 표현할 길이 없다. 벽은 얇고 아스라하다. 빛이라고는 이곳까지 타고 온 에테르 거미줄 가닥에서 일렁이는
    반짝임뿐이다.
- id: tba:63:mob:6318
  field: short
  en: Mahatma, the thief
  ko: 마하트마, 도적
  verdict: awkward
  note: '''이름, 직업'' 쉼표 구조를 그대로 옮겼다. 한국어에서는 직업을 앞에 두는 것이 자연스럽다.'
  fix: 도적 마하트마
- id: tba:63:mob:6303
  field: long
  en: The wolf spider is here, licking its bloody fangs.
  ko: 늑대거미가 여기 있으며, 피로 물든 송곳니를 핥고 있다.
  verdict: awkward
  note: '''여기 있으며''는 ''is here, -ing''를 직역한 것으로 딱딱하다.'
  fix: 늑대거미가 피 묻은 송곳니를 핥고 있다.
- id: tba:63:mob:6315
  field: long
  en: The Ki-Rin smiles good-naturedly to you.
  ko: 키린이 너그러운 미소를 지으며 당신을 맞이한다.
  verdict: wrong
  note: '''맞이한다''는 원문에 없는 동작이다. 원문은 당신에게 온화하게 미소 짓는다는 뜻이다. ''Ki-Rin''은 신수 기린(麒麟)이지만, 동물 기린과 헷갈릴 수 있어 ''키린''을 유지했다. 확정하려면 검토가
    필요하다.'
  fix: 키린이 당신에게 온화하게 미소 짓는다.
- id: tba:63:room:6309
  field: description
  en: As always, there is a split in the road.  One road is strewn with cricket feelers.  The other is well-kept and suitable
    for smooth travelling.  The webbing that was prevalent in earlier rooms is almost non-existant now.
  ko: 항상 그렇듯, 길이 갈라진다. 한쪽 길에는 귀뚜라미 수염이 여기저기 널려 있다. 다른 한쪽은 잘 관리되어 있어 편안하게 여행하기에 적합하다. 앞선 방들에서 흔히 볼 수 있던 거미줄은 이제 거의 찾아볼 수 없다.
  verdict: awkward
  note: 곤충의 'feelers'는 '수염'보다 '더듬이'가 정확하다. '편안하게 여행하기에 적합하다'는 번역투다.
  fix: 늘 그렇듯 길이 갈라진다. 한쪽 길에는 귀뚜라미 더듬이가 여기저기 흩어져 있다. 다른 쪽 길은 잘 다듬어져 있어 수월하게 지나갈 수 있다. 앞에서 흔히 보이던 거미줄은 이제 거의 찾아볼 수 없다.
- id: tba:63:room:6326
  field: description
  en: Another shifty little strand of webs, almost ethereal in nature.
  ko: 또 다른 기이한 작은 거미줄 가닥이 있다. 마치 실체 없는 것 같은 성질을 지니고 있다.
  verdict: wrong
  note: '''shifty''는 이 문맥에서 ''흔들리는, 일렁이는''이라는 뜻이다. ''기이한''은 오역이다. ''성질을 지니고 있다''는 직역투다.'
  fix: 또 하나의 작고 일렁이는 거미줄 가닥이다. 거의 실체가 없는 듯하다.
- id: tba:63:room:6312
  field: description
  en: It seems the inhabitant of this place does not web her victims, as evidenced by the remains before you.  The area is
    cluttered with desiccated corpses, apparently bitten but unwebbed, and drained of their life juices.
  ko: 이곳의 거주자는 희생자를 거미줄에 감싸 두르지 않는 것 같다. 당신 앞에 놓인 잔해들이 이를 증명한다. 주변은 말라붙은 시체로 가득 차 있는데, 분명히 물린 흔적이 있지만 거미줄에 감겨 있지는 않고, 생명력이
    완전히 뽑혀 나간 상태다.
  verdict: wrong
  note: '''apparently''는 ''보아하니''라는 뜻인데 ''분명히''로 옮겨 확신의 정도가 바뀌었다. ''life juices''는 ''생명력''이 아니라 ''체액''이다. ''감싸 두르지''는 같은 뜻을
    겹쳐 썼다.'
  fix: 당신 앞에 널린 잔해를 보건대, 이곳의 주인은 희생자를 거미줄로 감싸 두지 않는 모양이다. 주변에는 바싹 마른 시체가 어지럽게 널려 있는데, 보아하니 물리기만 했을 뿐 거미줄에 감기지는 않았고 체액이 모조리
    빨려 나갔다.
- id: tba:63:mob:6307
  field: description
  en: She winks in and out of reality.  It looks like it'd be difficult to hit her without a magical weapon.
  ko: 그녀는 현실과 비현실 사이를 오가고 있다. 마법 무기가 없으면 그녀를 맞추기 어려울 것 같다.
  verdict: awkward
  note: '''winks in and out''은 나타났다 사라졌다를 되풀이한다는 뜻이다. ''맞추기''는 ''맞히기''로 써야 맞다.'
  fix: 그녀는 현실 속에 나타났다 사라졌다를 되풀이한다. 마법 무기 없이는 그녀를 맞히기 어려울 것 같다.
- id: tba:63:room:6345
  field: description
  en: This is another link in the ethereal web.  Various creatures seem to get caught (or hypnotized) by its sticky strands.
  ko: 이곳은 이계의 거미줄의 또 다른 고리다. 온갖 생물들이 끈적한 실에 걸리거나(혹은 홀리거나) 하는 것 같다.
  verdict: awkward
  note: '''이계의 거미줄''은 다른 항목과 용어가 다르다. ''걸리거나(혹은 홀리거나) 하는 것 같다''는 문장이 늘어진다.'
  fix: 이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물들이 끈적한 실에 걸려드는(혹은 홀리는) 듯하다.
- id: tba:63:mob:6308
  field: description
  en: The slave does not mind you, but will fight like a warrior if attacked.  He serves the spider Empress, Arachnos, though
    whether it is by choice or because he was beguiled, you are not fully certain.
  ko: 그 노예는 당신을 신경 쓰지 않지만, 공격을 받으면 전사처럼 싸울 것이다. 거미 여왕 아라크노스를 섬기고 있지만, 그것이 자발적인 것인지 속았기 때문인지는 확신할 수 없다.
  verdict: wrong
  note: '''Empress''는 ''여왕''이 아니라 ''여제''다. ''beguiled''는 단순히 속은 것이 아니라 홀린 것이다. ''you are not fully certain''의 주어 ''당신''도 빠졌다.'
  fix: 그 노예는 당신에게 신경 쓰지 않지만, 공격을 받으면 전사처럼 싸울 것이다. 그는 거미 여제 아라크노스를 섬기는데, 스스로 원해서인지 홀려서인지 당신은 확신할 수 없다.
- id: tba:63:room:6306
  field: name
  en: On The Busy Path
  ko: 바쁜 길 위
  verdict: wrong
  note: '''busy path''는 오가는 이가 많은 길이다. ''바쁜 길''은 오역이다.'
  fix: 붐비는 길 위
- id: tba:63:mob:6310
