- id: tba:62:mob:6202
  field: long
  en: A squirrel spots you and runs around a tree!
  ko: 다람쥐가 당신을 발견하고 나무 주위를 뛰어다닌다!
  verdict: wrong
  note: '''runs around a tree''는 나무 뒤로 돌아 숨는 동작이다. ''주위를 뛰어다닌다''는 빙빙 도는 뜻이 되어 오역이다.'
  fix: 다람쥐가 당신을 발견하고 나무 뒤로 쪼르르 돌아 숨는다!
- id: tba:62:room:6248
  field: description
  en: There are bodies here... corpses.  Orcs, the lot of them, every single one of them horribly disfigured in some senseless
    way; one whose arms were removed, another who lacks anything that could sensibly be called a face. A few twitch feebly
    with the last remains of life, the rest just decompose.  The dim sense of horror budding in your head blossoms as you
    realize the pile in the corner consists of dead orc children awaiting burial.
  ko: 여기 시체들이 있다... 시체. 전부 오크이며, 하나같이 무의미한 방식으로 끔찍하게 훼손되어 있다. 팔이 잘려 나간 놈도 있고, 얼굴이라고 부를 만한 것이 하나도 없는 놈도 있다. 몇몇은 생명의 마지막 불씨로
    힘없이 꿈틀거리고, 나머지는 그저 부패해가고 있다. 당신의 머릿속에 싹트는 희미한 공포는 구석에 쌓인 것이 매장 대기 중인 죽은 오크 아이들임을 깨닫는 순간 만개한다.
  verdict: awkward
  note: 의미는 맞지만 '매장 대기 중인'이 행정 문서 같은 표현이다. '생명의 마지막 불씨로', '무의미한 방식으로'도 번역투이다. 마지막 문장은 주어인 '공포는'이 너무 길게 늘어져 읽기 어렵다.
  fix: 여기 시체들이 있다... 주검들이다. 모두 오크인데, 하나같이 이유도 없이 끔찍하게 훼손되어 있다. 팔이 잘려 나간 놈도 있고, 얼굴이라고 부를 만한 것이 아예 남지 않은 놈도 있다. 몇몇은 꺼져 가는 목숨으로
    힘없이 꿈틀거리고, 나머지는 그저 썩어 간다. 구석에 쌓인 것이 묻히기를 기다리는 죽은 오크 아이들이라는 것을 깨닫는 순간, 머릿속에 어렴풋이 싹트던 공포가 활짝 피어난다.
- id: tba:62:room:6207
  field: description
  en: The magical energy barrier runs straight north-south, unaffected by dips in the grounds, intervening rocks and trees,
    everything.  From the north, you hear a faint rushing noise above the humming of the field.  The trail you are on continues
    to the north and south, only a few feet away from the barrier it follows.
  ko: 마법 에너지 장벽은 지형의 울퉁불퉁함, 가로막는 바위와 나무, 모든 것을 무시하고 곧게 북남 방향으로 뻗어 있다. 북쪽에서 장의 윙윙거리는 소리 위로 희미한 물소리가 들린다. 당신이 걷고 있는 오솔길은 장벽을
    따라 약 1미터 남짓한 거리에서 북쪽과 남쪽으로 이어진다.
  verdict: awkward
  note: '''북남 방향''은 한국어에서 쓰지 않는 표현이고 ''남북''이 자연스럽다. field를 ''장'' 한 글자로 옮겨 뜻이 모호하다. ''지형의 울퉁불퉁함, ...모든 것을 무시하고''는 나열이 어색하다.'
  fix: 마법 에너지 장벽은 움푹 꺼진 땅도, 가로막는 바위와 나무도, 그 무엇도 아랑곳하지 않고 남북으로 곧게 뻗어 있다. 북쪽에서 역장의 윙윙거림 너머로 희미하게 세찬 물소리가 들린다. 당신이 걷고 있는 오솔길은
    장벽에서 겨우 1미터 남짓 떨어져 장벽을 따라 남북으로 이어진다.
- id: tba:62:room:6205
  field: description
  en: The energy field makes a sudden ninety-degree turn here, running to the north and west out of sight through the thickening
    woods.  The trail you are on curves to skirt the edge of the magical barrier in either direction. Curious... who or what
    is keeping this field in place, and for what purpose?
  ko: 에너지 장은 여기서 갑자기 90도로 꺾여, 점점 짙어지는 숲을 통해 북서쪽으로 시야에서 사라질 때까지 이어진다. 당신이 걷고 있는 오솔길은 마법 장벽의 가장자리를 양쪽으로 따라가며 휘어진다. 궁금하다... 누가,
    혹은 무엇이 이 장을 유지하고 있으며, 어떤 목적을 위해?
  verdict: wrong
  note: 장벽이 90도로 꺾인 모퉁이에서 한쪽은 북쪽, 한쪽은 서쪽으로 뻗는다는 뜻이다. 이를 '북서쪽으로'라는 한 방향으로 옮겨 의미가 틀렸다. '어떤 목적을 위해?'로 끝나는 문장도 어색하다.
  fix: 역장은 여기서 갑자기 90도로 꺾여, 한쪽은 북쪽으로, 한쪽은 서쪽으로 점점 짙어지는 숲을 지나 시야 밖으로 뻗어 나간다. 당신이 걷고 있는 오솔길도 따라 휘어져, 양쪽 방향 모두 마법 장벽의 가장자리를 따라
    돈다. 궁금하다... 누가, 혹은 무엇이 이 역장을 유지하고 있으며, 무슨 목적일까?
- id: tba:62:obj:6205
  field: extras.0.text
  en: It is an odd knife, with an inset of sapphire in the pommel.  It hums constantly, and your hand stings a bit when you
    touch it.
  ko: 손잡이에 사파이어가 박힌 기이한 칼이다. 끊임없이 웅웅거리며, 만지면 손이 약간 따갑다.
  verdict: wrong
  note: pommel은 손잡이 전체가 아니라 칼자루 끝의 둥근 부분이다. 따라서 '손잡이'는 오역이다.
  fix: 칼자루 끝에 사파이어가 박힌 기이한 칼이다. 끊임없이 웅웅거리며, 만지면 손이 조금 따끔거린다.
- id: tba:62:room:6239
  field: description
  en: The river flows swiftly on its course to the north. The trail you are on leads on by the water's edge to the west, and
    back into the forest to the south.  A large boulder is just to the west, blocking all travel in that direction.  Out in
    the center of the river, the 'roof' of the energy field meets the northern 'wall'.  The water passes right on through
    the magical barrier, however... the barrier is obviously porous to some materials.
  ko: 강물은 북쪽으로 빠르게 흐른다. 당신이 서 있는 오솔길은 물가 옆을 따라 서쪽으로, 그리고 남쪽으로는 다시 숲 안으로 이어진다. 서쪽 바로 옆에는 큰 바위가 있어 그 방향의 모든 통행을 막고 있다. 강 한가운데에서는
    에너지 장벽의 '지붕'이 북쪽 '벽'과 만난다. 물은 마법 장벽을 그대로 통과하지만... 장벽은 분명 어떤 물질에는 투과성이 있는 모양이다.
  verdict: awkward
  note: '''그 방향의 모든 통행을 막고 있다''와 ''투과성이 있는 모양이다''는 딱딱한 번역투이다. obviously와 ''모양이다''의 추측 어조도 서로 어긋난다.'
  fix: 강물은 북쪽으로 세차게 흘러간다. 당신이 서 있는 오솔길은 물가를 따라 서쪽으로, 그리고 남쪽으로는 다시 숲속으로 이어진다. 바로 서쪽에 큰 바위가 있어 그쪽으로는 아예 지나갈 수 없다. 강 한가운데에서 역장의
    '지붕'이 북쪽 '벽'과 맞닿는다. 그런데 물은 마법 장벽을 그대로 통과해 흐른다... 장벽이 어떤 물질은 통과시키는 것이 분명하다.
- id: tba:62:room:6241
  field: name
  en: A Rocky Trail
  ko: 바위 오솔길
  verdict: awkward
  note: '''바위 오솔길''은 바위로 만든 길처럼 읽힌다. Rocky는 ''바위투성이''가 자연스럽다.'
  fix: 바위투성이 오솔길
- id: tba:62:room:6206
  field: description
  en: The woods thicken here, and surpisingly, you see a tree completely cut in half by the magical barrier running north-south
    here.  The tree looks healthy and unaffected by the energy field passing right through its center. Odd...
  ko: 여기서는 숲이 짙어지고, 놀랍게도 북남 방향으로 뻗어 있는 마법 장벽에 의해 완전히 반으로 잘려 나간 나무를 볼 수 있다. 나무는 건강해 보이며, 중심부를 관통하는 에너지 장의 영향을 받지 않는 듯하다. 이상하다...
  verdict: awkward
  note: '''북남 방향''은 부자연스럽다. ''반으로 잘려 나간''은 나무가 쓰러진 것처럼 읽혀서, 나무가 건강하다는 뒤 문장과 어긋난다. ''...에 의해''는 번역투이다.'
  fix: 이곳은 숲이 짙어지는데, 놀랍게도 남북으로 뻗은 마법 장벽에 완전히 반으로 갈린 나무가 보인다. 나무는 건강해 보이며, 한가운데를 관통하는 역장에도 아무 영향을 받지 않은 듯하다. 이상하다...
- id: tba:62:room:6204
  field: description
  en: The energy barrier runs through the woods on its east- west course here, just north of the trail you are walking on.  A
    faint humming seems to eminate from the glowing field, pushing the normal sounds of the forest into the background.  For
    a short moment, you wonder if the field is keeping something in, or you out.  It makes you wonder...
  ko: 에너지 장벽은 당신이 걷고 있는 오솔길 바로 북쪽에서 동서 방향으로 숲을 가로지른다. 빛나는 장에서 희미한 윙윙거리는 소리가 나는 듯하여, 숲의 자연스러운 소음은 배경으로 밀려난다. 잠시 동안, 당신은 그 장이
    무언가를 가두고 있는 것인지, 아니면 당신을 가두고 있는 것인지 궁금해진다. 그것이 당신을 궁금하게 만든다...
  verdict: wrong
  note: '''or you out''은 당신을 밖으로 막아 두는 것이다. 이를 ''당신을 가두고 있는 것인지''로 옮겨 정반대 의미가 되었다. ''그것이 당신을 궁금하게 만든다''도 직역투이다.'
  fix: 에너지 장벽은 당신이 걷고 있는 오솔길 바로 북쪽에서 동서로 숲을 가로지른다. 빛나는 역장에서 희미한 윙윙거림이 흘러나오는 듯하여, 평소의 숲 소리는 저만치 뒤로 밀려난다. 잠시, 이 역장이 무언가를 안에
    가두려는 것인지, 아니면 당신을 밖으로 막으려는 것인지 궁금해진다. 생각할수록 알 수 없는 일이다...
- id: tba:62:mob:6202
  field: description
  en: It is a small, brown squirrel.  Kind of like a fuzzy high-tension spring.
  ko: 작고 갈색의 다람쥐다. 마치 솜으로 감싼 고장력 스프링 같은 모습이다.
  verdict: wrong
  note: fuzzy는 털이 보송보송하다는 뜻이다. '솜으로 감싼'은 원문에 없는 의미를 더했다. '고장력 스프링'은 기술 용어라서 문맥에 어울리지 않는다.
  fix: 작은 갈색 다람쥐다. 말하자면 털이 보송보송한, 팽팽하게 감긴 용수철 같다.
- id: tba:62:room:6255
  field: description
  en: This forking off from the mail tunnel seems odd; the walls are strangely smooth, as if they were carved out by forces
    unknown.  The end is abrupt and short, but there is a steel door inset in the wall of the west side of the tunnel.  The
    smell from the lower tunnel doesn't seem nearly as bad here... this might be a good place to rest and catch your breath.
  ko: 메일 터널에서 갈라져 나온 이 통로는 이상하다. 벽이 이상할 정도로 매끄러워, 알려지지 않은 힘에 의해 파낸 것처럼 보인다. 끝은 갑자기 짧게 끝나지만, 터널 서쪽 벽에 강철 문이 하나 내장되어 있다. 아래쪽
    터널에서 올라오는 냄새는 여기서는 거의 느껴지지 않는다... 여기는 쉬고 숨을 고르기에 좋은 장소일지도 모른다.
  verdict: wrong
  note: '''mail tunnel''은 원문 오타이고 main tunnel을 뜻하는데, ''메일 터널''로 음역했다. ''doesn''t seem nearly as bad''는 냄새가 훨씬 덜하다는 뜻이지 ''거의
    느껴지지 않는다''가 아니다. ''끝은 갑자기 짧게 끝나지만''은 어색하다.'
  fix: 본 터널에서 갈라져 나온 이 곁가지 통로는 묘하다. 벽이 이상할 정도로 매끄러워, 알 수 없는 힘이 깎아 낸 것만 같다. 통로는 짧게 뚝 끊기지만, 서쪽 벽에 강철 문이 하나 박혀 있다. 아래쪽 터널의 냄새도
    여기서는 훨씬 덜하다... 쉬면서 숨을 고르기에 좋은 곳일지도 모른다.
- id: tba:62:room:6236
  field: description
  en: The trail continues here to the east and west, with a small trail splitting off towards a large clearing to the south.  Two
    wooden poles with skulls on top warn you away from the south, and succeed in making you feel quite uncomfortable.  Strange...
  ko: 오솔길이 여기서 동서로 이어지며, 남쪽의 넓은 빈터로 향하는 작은 오솔길이 갈라져 나간다. 두 개의 나무 기둥 위에 두개골이 올려져 있어 남쪽으로의 접근을 경고하고 있는데, 그 모습은 당신을 꽤나 불편하게 만든다.
    기이한 일이군...
  verdict: awkward
  note: '''기이한 일이군...''은 해라체 서술에서 벗어난 혼잣말 어미이다.'
  fix: 오솔길이 여기서 동서로 이어지며, 남쪽의 넓은 빈터로 향하는 작은 오솔길이 갈라져 나간다. 꼭대기에 두개골을 얹은 나무 기둥 두 개가 남쪽으로 가지 말라고 경고하고 있는데, 보고 있자니 꽤나 불편해진다. 기이하다...
- id: tba:62:mob:6209
  field: description
  en: It doesn't even appear to have registered your arrival...  It is just talking to itself.  Its body is a twisted wreck
    of orc, man, beast, and what-not.
  ko: 그는 당신의 도착을 알아채지조차 못하는 것 같다. 그저 혼자 중얼거릴 뿐이다. 그의 몸은 오크, 인간, 짐승, 그리고 알 수 없는 것들의 비틀린 잔해로 뒤엉켜 있다.
  verdict: awkward
  note: 원문의 It을 '그는'으로 옮겨 사람처럼 읽힌다. '그'를 반복한 것도 번역투이다. 원문의 말줄임표도 빠졌다.
  fix: 녀석은 당신이 온 것조차 알아채지 못한 듯하다... 그저 혼자 중얼거릴 뿐이다. 그 몸은 오크와 인간, 짐승, 그 밖에 정체 모를 것들이 뒤틀려 엉킨 잔해 같다.
- id: tba:62:room:6231
  field: description
  en: The trees have been cut down around here, and many of the trunks hollowed out with sharp stones and lined with treated
    leather to make almost-waterproof tubs.  A foul smelling brown fluid, tannin evidently, fills many of these, soaking into
    various bits and pieces of animal hides.  Crude, but workable.
  ko: 이 주변에서는 나무가 베어졌고, 많은 줄기가 날카로운 돌로 파내져 처리된 가죽으로 안쪽을 덮어 거의 물이 새지 않는 통으로 만들어졌다. 악취가 나는 갈색 액체, evidently 탄닌이, 이 통들 중 많은 것을
    채우고 있으며 다양한 동물 가죽 조각에 스며들어 있다. 원시적이지만 쓸 만하다.
  verdict: wrong
  note: '''evidently''가 영어 그대로 남았다. treated leather는 ''처리된 가죽''이 아니라 ''무두질한 가죽''이다. 피동 표현이 겹쳐 문장이 딱딱하다.'
  fix: 이 주변의 나무들은 베어져 있고, 많은 줄기의 속을 날카로운 돌로 파낸 뒤 무두질한 가죽을 덧대어 물이 거의 새지 않는 통으로 만들어 두었다. 이 통들 대부분에는 악취 나는 갈색 액체가 가득 차 있는데, 보아하니
    타닌 용액인 듯하다. 갖가지 동물 가죽 조각이 그 안에 잠겨 젖어 들고 있다. 조잡하지만 쓸 만하다.
- id: tba:62:room:6200
  field: extras.0.text
  en: You can faintly see the woods continue beyond it, but it seems there's no way through.  The field rises high up into
    the air, and seems to form a ceiling above the woods, preventing a flying entrance.  You'd also bet it extends deep into
    the ground.
  ko: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고 있다. 또한 땅속 깊이까지 뻗어 있을
    것이라고 단정할 수 있다.
  verdict: awkward
  note: '''You''d also bet''은 ''틀림없을 것이다'' 정도의 추측이다. ''단정할 수 있다''는 어조가 어색하다. ''비행으로 진입하는 것을 막고''도 딱딱하다.'
  fix: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 지나갈 길은 없어 보인다. 역장은 하늘 높이 솟아 숲 위로 천장을 이루고 있어, 날아서 들어갈 수도 없다. 땅속 깊이까지 뻗어 있을 것이 틀림없다.
- id: tba:62:room:6223
  field: description
  en: The trail leads east and west here through the forest.  To the west you spot an area where a smaller path breaks off
    from the main track.  Eastwards seems to be another small clearing that seems to be well used; there are many tracks leading
    in that direction.
  ko: 오솔길은 여기서 숲을 동서로 가로지른다. 서쪽에서는 주요 길에서 작은 길이 갈라져 나가는 곳이 보인다. 동쪽으로는 또 다른 작은 빈터가 있는 듯하며, 그곳은 꽤 많이 이용되는 듯하다. 그 방향으로 이어지는 발자국이
    많다.
  verdict: awkward
  note: '''주요 길''은 딱딱한 직역이라 ''큰길''이 자연스럽다. ''~듯하며 … ~듯하다''가 반복되고, ''숲을 동서로 가로지른다''는 ''leads east and west''의 뜻과 조금 어긋난다.'
  fix: 오솔길은 여기서 숲을 지나 동서로 이어진다. 서쪽으로는 큰길에서 작은 길이 갈라져 나가는 곳이 보인다. 동쪽으로는 또 다른 작은 빈터가 있는데, 자주 드나드는 곳인 듯하다. 그쪽으로 이어진 발자국이 많다.
- id: tba:62:room:6202
  field: description
  en: This trail runs parallel to the energy barrier to your north, seemingly all the way up to the mountains to the west
    that form the boundries of this valley.  Walking along, you scare a small squirrel, which leaps through the barrier without
    a second thought!  Your hand is still repulsed by the magical field, however.
  ko: 이 오솔길은 북쪽의 에너지 장벽과 나란히, 이 계곡의 경계를 이루는 서쪽 산까지 이어지는 듯하다. 길을 따라 걷다가 작은 다람쥐를 놀라게 했는데, 그 다람쥐는 두 번 생각하지 않고 장벽을 뛰어넘었다! 하지만
    당신의 손은 여전히 마법적 에너지 장벽에 밀려난다.
  verdict: wrong
  note: '''leaps through the barrier''는 장벽을 통과하는 것인데 ''뛰어넘었다''로 옮겨 뜻이 틀렸다. ''magical field''를 ''마법적 에너지 장벽''으로 옮겨 없는 말을 더했다.
    ''두 번 생각하지 않고''는 직역투다.'
  fix: 이 오솔길은 북쪽의 에너지 장벽과 나란히 뻗어, 이 계곡의 경계를 이루는 서쪽 산까지 줄곧 이어지는 듯하다. 길을 따라 걷다가 당신이 작은 다람쥐를 놀라게 하자, 다람쥐는 아무 망설임 없이 장벽을 통과해 뛰어든다!
    하지만 당신의 손은 여전히 마법의 역장에 밀려난다.
- id: tba:62:room:6267
  field: description
  en: This is a small, dirty cage, with only a bucket for wastes, another bucket for food, and a dirty towel for a bed.  The
    whole room has a terrible stench about it.
  ko: 좁고 더러운 감방이다. 배설물을 위한 양동이 하나, 음식을 위한 양동이 하나, 그리고 이불 대신 더러운 수건 하나만 있다. 방 전체가 끔찍한 악취로 가득하다.
  verdict: wrong
  note: '''cage''를 ''감방''으로 옮겨 오역이다. 실험체를 가두는 ''우리''가 맞다. ''for a bed''는 ''이불 대신''이 아니라 ''침대 대신''이다.'
  fix: 좁고 더러운 우리다. 배설물용 양동이 하나, 음식용 양동이 하나, 그리고 침대 대신 깔린 더러운 수건 한 장뿐이다. 방 전체에 지독한 악취가 진동한다.
- id: tba:62:obj:6202
  field: long
  en: A set of shackles sit here, discarded.
  ko: 쇠사슬 한 벌이 여기 버려져 있다.
  verdict: wrong
  note: '''shackles''는 ''족쇄''다. ''쇠사슬''은 오역이다.'
  fix: 족쇄 한 벌이 버려진 채 여기 놓여 있다.
- id: tba:62:room:6267
  field: name
  en: A Cage
  ko: 장롱
  verdict: wrong
  note: '''Cage''를 ''장롱''으로 옮겨 완전한 오역이다.'
  fix: 우리
- id: tba:62:room:6251
  field: description
  en: You are standing just inside a largish cave, about a hundred feet in diameter.  A few dim make-shift lanterns burning
    animal fat illuminate the area, just enough so you can see the rotted food on the floor, and a few bodies sprawled throughout
    the whole area.  Your disgust quickly turns to horror as you see a horrible creature, half... well, half something and
    half orc dash between two stalagmites.
  ko: 당신은 지름이 약 30미터인 꽤 큰 동굴 입구 바로 안에 서 있다. 동물 지방을 태우는 몇 개의 어두운 간이 등불이 주변을 비추고 있는데, 바닥에 썩은 음식과 여기저기 널브러진 몇 구의 시체를 볼 수 있을 정도다.
    당신의 혐오감은 끔찍한 괴물을 보는 순간 공포로 바뀐다. 반은... 음, 반은 뭔가가 되고 반은 오크인 그 괴물이 두 개의 석순 사이로 휙 지나간다.
  verdict: awkward
  note: '''dim''을 ''어두운 등불''로 옮겨 어색하니 ''희미한''이 맞다. ''반은 뭔가가 되고''는 비문이다. ''입구 바로 안''에서 ''입구''는 원문에 없는 말이고, ''몇 개의'', ''몇 구의''
    같은 수량 표현이 직역투다.'
  fix: 당신은 지름이 30미터쯤 되는 꽤 큰 동굴 바로 안쪽에 서 있다. 동물 기름을 태우는 희미한 간이 등불 몇 개가 주변을 비추는데, 바닥의 썩은 음식과 여기저기 널브러진 시체 몇 구가 겨우 보일 정도다. 끔찍한
    괴물을 보는 순간 혐오감은 금세 공포로 바뀐다. 반은... 음, 반은 뭔지 모를 무언가이고 반은 오크인 괴물이 두 석순 사이로 휙 지나간다.
- id: tba:62:room:6212
  field: extras.0.text
  en: Cloven hoofs, two feet...  They walk erect whatever they are.
  ko: 갈라진 발굽, 두 발... 무엇이든 그들은 똑바로 걷는다.
  verdict: awkward
  note: '''무엇이든 그들은 똑바로 걷는다''는 ''whatever they are''의 뜻이 흐려진 직역이다. ''정체가 무엇이든''으로 풀어야 한다.'
  fix: 갈라진 발굽, 두 발... 정체가 무엇이든, 놈들은 똑바로 서서 걷는다.
- id: tba:62:room:6245
  field: description
  en: The tunnel takes a deep dip here, and opens up into a largish cave to the west.  There seems to be a few faint lights
    from inside, and you hear some heavy breathing and low grunts from that direction.  The cave entrance to the east seems
    far too far away for your comfort...
  ko: 터널은 여기서 깊게 내려가며, 서쪽으로 꽤 큰 동굴로 이어진다. 안쪽에서 희미한 불빛 몇 개가 보이며, 그 방향에서 무거운 숨소리와 낮은 신음소리가 들린다. 동쪽의 동굴 입구는 당신에게 너무 멀어 보여 안락하지
    않다...
  verdict: wrong
  note: '''grunts''는 ''신음소리''가 아니라 짐승처럼 그르렁거리는 소리다. ''too far away for your comfort''를 ''안락하지 않다''로 옮겨 어색하다.'
  fix: 터널은 여기서 깊게 꺼져 내려가며, 서쪽으로 꽤 큰 동굴이 열린다. 안쪽에서 희미한 불빛 몇 개가 보이는 듯하고, 그쪽에서 거친 숨소리와 낮게 그르렁거리는 소리가 들린다. 동쪽의 동굴 입구는 마음 놓기에는
    너무 멀리 떨어져 있는 것 같다...
- id: tba:62:room:6261
  field: name
  en: A Cage
  ko: 장롱
  verdict: wrong
  note: '''Cage''를 ''장롱''으로 옮겨 오역이다.'
  fix: 우리
- id: tba:62:room:6200
  field: description
  en: The trail ends here where the mountains begin abruptly. Looking up, you note that the climb would be rough, hazardous,
    and probably not worth the effort; the energy barrier continues up the mountain side out of sight.  The only exit is back
    to the east.
  ko: 오솔길이 여기서 산이 갑자기 솟아나는 지점에서 끝난다. 위를 올려다보니 등반은 험하고 위험하며, 아마도 그만한 노력을 들일 가치가 없을 것이다. 에너지 장벽은 시야에서 사라질 만큼 산비탈 위로 계속 이어진다.
    유일한 출구는 동쪽으로 돌아가는 길뿐이다.
  verdict: awkward
  note: '''위를 올려다보니 등반은 … 가치가 없을 것이다''는 주어와 서술이 맞지 않는다. ''오솔길이 여기서 … 지점에서 끝난다''도 ''에서''가 겹친다.'
  fix: 오솔길은 산이 갑자기 솟아오르는 이곳에서 끝난다. 위를 올려다보니 오르는 길은 험하고 위험해서, 굳이 애쓸 가치는 없어 보인다. 에너지 장벽은 산비탈을 따라 시야 밖까지 계속 이어진다. 나갈 길은 동쪽으로
    되돌아가는 길뿐이다.
- id: tba:62:room:6234
  field: description
  en: The ground is getting very rocky here, causing the trees of the woods to become more sparse.  Several bushes have found
    purchase in the soil, but not near enough to block free movement in this area.  The trail leads on up to what appears
    to be a cave in the side of the mountain to the west, and a side trail runs along the forest's edge to the north.  To
    the east, the trail runs deep into the forest out of sight.
  ko: 여기서는 땅이 매우 바위투성이라 숲속의 나무가 더욱 드물어진다. 몇몇 덤불이 흙에 뿌리를 내렸지만, 이 지역의 자유로운 이동을 막기에는 충분하지 않다. 오솔길은 서쪽 산 측면에 있는 것으로 보이는 동굴로 이어지며,
    작은 오솔길은 숲의 가장자리를 따라 북쪽으로 뻗어 있다. 동쪽으로는 오솔길이 시야에서 사라질 정도로 숲의 깊은 곳으로 이어진다.
  verdict: awkward
  note: '''이 지역의 자유로운 이동을 막기에는''은 딱딱한 번역투다. ''side trail''은 ''작은 오솔길''보다 ''샛길''이 자연스럽다.'
  fix: 이곳은 땅이 몹시 바위투성이라 숲의 나무가 점점 드문드문해진다. 흙에 뿌리를 내린 덤불이 몇 있지만, 지나다니는 데 방해가 될 만큼 빽빽하지는 않다. 오솔길은 서쪽 산비탈의 동굴처럼 보이는 곳으로 올라가고,
    샛길 하나가 숲 가장자리를 따라 북쪽으로 뻗어 있다. 동쪽으로는 오솔길이 숲 깊숙이 이어져 시야에서 사라진다.
- id: tba:62:room:6253
  field: description
  en: Many sleeping pallets are arranged near the walls, each made of heavy fur padding for comfort and warmth.  Many are
    covered with blood and other, unidentifiable substances.  Looking around, your only coherent thought is, 'Don't want to
    know... don't want to know...'
  ko: 벽 쪽에 많은 수면용 이불이 놓여 있다. 각각은 편안함과 온기를 위해 두꺼운 모피 패드로 만들어져 있다. 많은 이불에는 피와 다른, 무엇인지 식별할 수 없는 물질로 얼룩져 있다. 주위를 둘러보며 당신의 머릿속에
    떠오르는 유일한 일관된 생각은, '알고 싶지 않아... 알고 싶지 않아...'이다.
  verdict: awkward
  note: '''많은 이불에는 … 얼룩져 있다''는 조사가 맞지 않는 비문이다. ''유일한 일관된 생각''은 직역투다. ''pallets''는 ''이불''보다 ''깔개''가 정확하다.'
  fix: 벽 가까이에 잠자리용 깔개가 여럿 놓여 있다. 모두 편안하고 따뜻하도록 두꺼운 모피를 덧대어 만든 것이다. 상당수는 피와 정체를 알 수 없는 다른 물질로 얼룩져 있다. 주위를 둘러보는 당신의 머릿속에 떠오르는
    제대로 된 생각은 하나뿐이다. '알고 싶지 않아... 알고 싶지 않아...'
- id: tba:62:room:6235
  field: description
  en: The trail you are on bends around a large double- trunked tree and leads away to the north and west.  The green canopy
    of leaves overhead make this area fairly dark and ominous, and that creepy 'watched' feeling returns to hit you with full
    force.
  ko: 당신이 걷고 있는 오솔길은 큰 두 줄기 나무를 돌아 북쪽과 서쪽으로 이어진다. 머리 위를 덮은 초록색 나뭇잎 지붕 덕분에 이 지역은 꽤 어둡고 음산하며, 그 기이한 '시선'을 느끼는 감각이 다시금 온몸으로 밀려온다.
  verdict: awkward
  note: 부정적인 결과에 '덕분에'를 쓰는 것은 어색하다. ''시선'을 느끼는 감각'은 'creepy watched feeling'을 부자연스럽게 옮겼다.
  fix: 당신이 걷고 있는 오솔길은 줄기가 둘로 갈라진 큰 나무를 돌아 북쪽과 서쪽으로 이어진다. 머리 위를 덮은 푸른 잎 지붕 때문에 이곳은 꽤 어둡고 음산하며, 누군가 '지켜보는' 듯한 그 오싹한 느낌이 다시 온몸을
    덮쳐 온다.
- id: tba:62:room:6258
  field: description
  en: This tunnel opens up into a large room to the north, and to the south, leads towards a set of doors.  The light is crisp
    and bright, clearly showing the lack of tool marks on the hewn walls... magic?  The room just ahead is large, and also
