  ko: 여기 숲을 강이 흐르고 있으며, 물은 맑고 깨끗하다. 에너지 장벽은 강 한가운데까지 뻗어 나간 뒤, 서쪽으로 90도 꺾인다. 그러나 물은 마법 장벽을 통과하는 데 아무런 문제가 없어 보인다. / 강은 여기서
