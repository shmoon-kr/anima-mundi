- id: tba:62:room:6203
  field: description
  en: The northern pathway stops abruptly here, halted by some sort of glowing energy barrier running through the woods.  A
    game trail, seemingly well traveled, runs east- west along the magical barrier's length.  Very strange.
  ko: 북쪽의 오솔길이 여기서 갑자기 끊긴다. 숲을 가로지르는 어떤 종류의 빛나는 에너지 장벽에 막혀 있기 때문이다. 마법적 장벽의 길이를 따라 동서 방향으로 이어지는 사냥꾼의 오솔길이 있는데, 꽤 많이 다닌 흔적이
    보인다. 매우 이상하다.
  verdict: wrong
  note: '''game trail''은 짐승들이 다니는 길이다. ''사냥꾼의 오솔길''은 오역이다. ''어떤 종류의''와 ''길이를 따라''도 번역투다.'
  fix: 북쪽 길이 여기서 갑자기 끊긴다. 숲을 가로지르는, 빛을 내는 무슨 에너지 장벽에 가로막힌 것이다. 마법 장벽을 따라 동서로 짐승이 다니는 길이 나 있는데, 꽤 자주 다닌 흔적이 보인다. 참으로 이상한 일이다.
