  ko: 터널은 여기서 갈라지며, 한 갈래는 북쪽으로, 다른 갈래는 서쪽으로 이어진다. 또한 동쪽으로 밖으로 나갈 수 있는데, 고통받는 당신의 코에겐 매우 좋은 생각처럼 보인다. 역겨운 냄새 때문에 눈물이 나고, 당신은
