  ko: 이 터널은 북쪽으로 넓고 큰 방으로 열리며, 남쪽으로는 문이 있는 곳으로 이어진다. 빛은 맑고 밝아, 깎인 벽면에 도구의 자국이 없다는 사실이 선명하게 드러난다... 마법인가? 바로 앞의 방은 크고 또한 밝게
    비추어져 있어, 거의 임상적인 분위기를 자아낸다. 그 방 어딘가에서 끔찍하고 갈라진 목소리로 비명 소리가 들린다. 좋은 기미가 아니다.
  verdict: awkward
  note: '''넓고 큰 방으로 열리며''는 직역투다. ''목소리로 비명 소리가 들린다''는 표현이 중복되고, ''밝게 비추어져''도 어색하다.'
  fix: 이 터널은 북쪽으로 큰 방과 이어지고, 남쪽으로는 문 몇 짝이 있는 쪽으로 뻗어 있다. 빛이 또렷하고 밝아서, 깎아 낸 벽에 연장 자국이 전혀 없다는 것이 분명히 보인다... 마법일까? 바로 앞의 방은 넓고
    조명도 환해서, 거의 병원 같은 냉랭한 분위기를 풍긴다. 그 방 깊숙한 어딘가에서 무언가가 끔찍하게 갈라진 목소리로 비명을 지른다. 좋은 징조가 아니다.
- id: tba:62:room:6243
  field: description
  en: The tunnel forks here, one branch leading north, the other west.  Additionally, you can head back outside to the east,
    which seems like a very good idea to your tortured nasal passages.  Your eyes water from the stench, and you clench your
