not_ok:
- id: tba:62:room:6255
  field: exits.west.look
  en: A large steel door.  There seems to be no hinges or knob, but there is a small keyhole in the exact center of it.
  ko: 거대한 강철 문. 힌지나 손잡이가 있는 것 같지 않지만, 문 정중앙에 작은 열쇠 구멍이 하나 있다.
  verdict: awkward
  note: '''거대한 강철 문.''처럼 명사로 끊겨 해라체 서술이 아니다. ''hinge''를 ''힌지''로 음차해 판타지 문맥에 어울리지 않는다(경첩). ''large''는 ''거대한''보다 ''커다란''이 맞다.
    ''~있는 것 같지 않지만''도 어색하다.'
  fix: 커다란 강철 문이다. 경첩도 손잡이도 없어 보이지만, 문 정중앙에 작은 열쇠 구멍이 하나 있다.
- id: tba:62:room:6240
  field: description
  en: The river pours down the side of the mountains to the west, originating from a large hole in the face of one of the
    sheer rock protuberances.  The energy barrier climbs right up the mountain, and seals off any means of escape by that
    means.  The trail you are on runs by the side of the river to the east, and a path leads by the forest side to the south.
  ko: 강은 서쪽 산비탈을 따라 쏟아져 내리며, 수직으로 솟은 바위 돌출부의 거대한 구멍에서 발원한다. 에너지 장벽은 산을 따라 바로 올라와 그 방향으로의 모든 탈출로를 봉쇄한다. 당신이 서 있는 오솔길은 강 옆을
    따라 동쪽으로 이어지고, 남쪽으로는 숲 쪽으로 작은 길이 뻗어 있다.
  verdict: awkward
  note: 첫 문장에서 '쏟아져 내리며 ~에서 발원한다'의 순서가 어색하고, 'one of'(여러 돌출부 중 하나)가 빠졌다. '산을 따라 바로 올라와'는 장벽이 산 위로 뻗어 오른다는 뜻이 흐릿하다.
  fix: 서쪽 산비탈로 강물이 쏟아져 내린다. 깎아지른 바위 돌출부 가운데 하나의 표면에 뚫린 커다란 구멍에서 흘러나오는 물이다. 에너지 장벽은 산을 타고 곧장 위로 뻗어 올라가, 그쪽으로 빠져나갈 길마저 모두 막아
    버린다. 당신이 서 있는 오솔길은 강 옆을 따라 동쪽으로 이어지고, 남쪽으로는 숲 가장자리를 따라 작은 길이 나 있다.
- id: tba:62:obj:6201
  field: long
  en: A set of iron manacles lie here.
  ko: 철제 수갑이 여기 놓여 있다.
  verdict: awkward
  note: '''수갑''은 현대 경찰 장비를 떠올리게 한다. 중세 판타지의 manacles는 ''쇠고랑''이 자연스럽다.'
  fix: 쇠고랑 한 벌이 여기 놓여 있다.
- id: tba:62:room:6256
  field: description
  en: This section of man-made tunnel heads north from here, doors on either side.  A few glowing spots on the ceiling illuminate
    the area to almost a daylight level.  From the north you hear some horrible cries of pain and anguish that make you cringe
    inside and think twice about heading in that direction.
  ko: 이 인공 터널은 여기서 북쪽으로 이어지며, 양쪽에 문이 나 있다. 천장에 있는 몇 개의 빛나는 점들이 이 공간을 거의 낮과 같은 밝기로 비춘다. 북쪽에서 고통과 절규가 섞인 끔찍한 비명 소리가 들려와, 당신은
    몸서리를 치며 그쪽으로 향하는 것을 두 번쯤 생각하게 된다.
  verdict: awkward
  note: '''두 번쯤 생각하게 된다''는 ''think twice''의 직역이다. ''make you cringe inside''도 ''속으로 움찔하다''가 더 정확하다. ''빛나는 점들이''도 다소 딱딱하다.'
  fix: 인공 터널의 이 구간은 여기서 북쪽으로 이어지며, 양쪽에 문이 나 있다. 천장 몇 군데에서 빛이 새어 나와 이곳을 거의 대낮처럼 밝힌다. 북쪽에서 고통과 괴로움에 찬 끔찍한 비명이 들려와, 당신은 속으로 움찔하며
    그쪽으로 가도 될지 다시 생각하게 된다.
- id: tba:62:room:6243
  field: extras.0.text
  en: They are orcish, and you could swear they were all warning symbols.
  ko: 그것들은 오크 문자로 되어 있으며, 모두 경고 기호인 것 같다고 당신은 확신할 수 있다.
  verdict: awkward
  note: '''you could swear''를 ''확신할 수 있다''로 직역해 딱딱하다. ''그것들은''으로 시작하는 주어도 번역투다.'
  fix: 오크 문자로 되어 있는데, 하나같이 경고 표시가 틀림없어 보인다.
- id: tba:62:room:6266
  field: exits.east.look
  en: A steel cell door.
  ko: 강철 감방 문이 보인다.
  verdict: awkward
  note: 원문에 없는 '보인다'가 붙었고, 같은 원문인 13번('강철 감방 문이다.')과 번역이 다르다. 같은 원문은 같은 번역으로 통일해야 한다.
  fix: 강철 감방 문이다.
- id: tba:62:obj:6203
  field: extras.0.text
  en: It is a small, carved stone with a strange symbol carved upon it. Strange...
  ko: 기이한 문양이 새겨진 작은 조각된 돌이다. 기이한...
  verdict: awkward
  note: '''Strange...''를 ''기이한...''으로 옮겨 관형형에서 문장이 끊겼다. ''작은 조각된 돌''도 번역투다.'
  fix: 기이한 문양이 새겨진, 작게 깎아 만든 돌이다. 이상하다...
- id: tba:62:room:6211
  field: description
  en: To the west the magical energy barrier crackles and hums to itself, almost looking harmless.  Almost -- all around on
    the ground are charred corpses and bodies. Several poles with skulls on top face to the west, warning travellers on the
    forest paths away from here.  The air smells of death and decay, and the air is very still.  You feel uncomfortable.
  ko: 서쪽에서는 마법 에너지 장벽이 자글자글 소리를 내며 윙윙거린다. 거의 무해해 보인다. 거의 -- 지면 여기저기에는 그을린 시체들이 널려 있다. 머리통이 꽂힌 몇 개의 기둥이 서쪽을 향해 서 있으며, 숲의 오솔길을
    따라가는 여행객들에게 이곳을 피하라고 경고한다. 공기에는 죽음과 부패의 냄새가 배어 있고, 바람이 전혀 불지 않는다. 당신은 불안함을 느낀다.
  verdict: wrong
  note: '''skulls''를 ''머리통''으로 옮긴 것은 오역이다(해골). ''with skulls on top''의 ''꼭대기에 얹은''도 ''꽂힌''으로 바뀌었다. ''crackles''의 ''자글자글''은
    전기 장벽 소리로 어색하다(지지직). ''거의 무해해 보인다. 거의 --''의 흐름도 다듬을 필요가 있다.'
  fix: 서쪽에서는 마법 에너지 장벽이 저 혼자 지지직거리며 윙윙 울린다. 거의 무해해 보일 정도다. 거의 -- 주위 땅바닥 곳곳에 새까맣게 그을린 시체들이 널려 있다. 꼭대기에 해골을 얹은 기둥 몇 개가 서쪽을 향해
    서서, 숲길을 지나는 여행자들에게 이곳에서 멀어지라고 경고한다. 공기에는 죽음과 부패의 냄새가 배어 있고, 바람 한 점 불지 않는다. 당신은 마음이 편치 않다.
- id: tba:62:mob:6206
  field: description
  en: She is raggedy, and seems to be covered with sores.
  ko: 그녀는 옷이 너덜너덜하고 온몸에 상처가 덮인 것 같다.
  verdict: wrong
  note: '''sores''는 종기·헌데(곪은 상처)인데 ''상처''로 옮겨 뜻이 달라졌다. ''상처가 덮인''도 어색하다.'
  fix: 그녀는 누더기 차림에, 온몸이 헌데투성이인 것 같다.
- id: tba:62:room:6232
  field: description
  en: The trail is widening to the west, where the path leads all the way up to the side of the mountains that enclose this
    valley.  Many of the trees have been cut down around here, and it definitely looks as if the forest is ending. Eastwards
    the trail leads on into the thick of the forest. A small split off trail leads away to the south here.
  ko: 오솔길이 서쪽으로 넓어지며, 이 길은 이 골짜기를 둘러싼 산의 측면까지 이어진다. 이 일대에는 많은 나무가 베어졌고, 숲이 끝나가는 것이 분명해 보인다. 동쪽으로는 오솔길이 숲의 깊은 곳으로 이어진다. 여기서는
    작은 갈림길이 남쪽으로 뻗어 나간다.
  verdict: awkward
  note: '''산의 측면''은 딱딱하다(산기슭). ''많은 나무가 베어졌고''는 피동 번역투다. 첫 문장에서 ''오솔길이 ~, 이 길은 ~''으로 주어가 중복된다.'
  fix: 서쪽으로 갈수록 오솔길이 넓어지며, 이 골짜기를 둘러싼 산기슭까지 곧장 이어진다. 이 일대는 나무가 많이 베여 나갔고, 숲이 끝나 가는 것이 분명해 보인다. 동쪽으로는 오솔길이 울창한 숲속으로 이어진다. 여기서
    작은 갈림길 하나가 남쪽으로 갈라져 나간다.
- id: tba:62:mob:6207
  field: description
  en: She is too far gone to move very quickly.  You could kill her easily.
  ko: 그녀는 너무 임산 상태라 빠르게 움직일 수 없다. 당신은 그녀를 쉽게 죽일 수 있다.
  verdict: wrong
  note: '''임산 상태''는 없는 표현이다. ''too far gone''은 임신·병·부상 등 몸이 많이 진행된 상태를 뜻하는데, 원문만으로는 임신이라고 확정할 수 없다. 해당 몹의 맥락을 확인해야 한다. 우선
    중립적으로 옮겼다.'
  fix: 그녀는 몸 상태가 너무 나빠 재빨리 움직이지 못한다. 당신은 그녀를 쉽게 죽일 수 있을 것이다.
- id: tba:62:room:6229
  field: description
  en: A north-south trail leads through the woods here, with a small side trail leading off to the east.  The trees provide
    adequate cover from the sky, but through a few holes in the foliage you spot the magical barrier above you, keeping you
    from escaping by flight.  You feel slightly captured.
  ko: 남북 방향으로 뻗은 오솔길이 숲을 가로지르고, 동쪽으로 작은 오솔길이 갈라져 나간다. 나무들이 하늘에서 오는 시야를 충분히 가려 주지만, 나뭇잎 사이로 뚫린 구멍을 통해 당신을 가두고 비행으로 탈출하지 못하게
    하는 위쪽의 마법 장벽이 보인다. 당신은 약간 갇힌 듯한 느낌을 받는다.
  verdict: awkward
  note: '''하늘에서 오는 시야'', 그리고 ''당신을 가두고 비행으로 탈출하지 못하게 하는 위쪽의 마법 장벽''처럼 긴 관형절이 번역투다. ''side trail''은 샛길이 더 자연스럽다.'
  fix: 남북으로 뻗은 오솔길이 숲을 가로지르고, 동쪽으로는 작은 샛길이 갈라져 나간다. 나무들이 하늘을 넉넉히 가려 주지만, 나뭇잎 사이로 난 몇 군데 틈으로 머리 위의 마법 장벽이 보인다. 저것 때문에 날아서 빠져나갈
    수도 없다. 어딘지 갇힌 듯한 기분이 든다.
- id: tba:62:room:6260
  field: description
  en: Another table is set up will all sorts of alchemical apparatus here, vials and beakers, distillation equipment and et
    cetera.  The stuff looks expensive, but bulky and fragile; not good treasure to cart away with you at all.
  ko: 여기에도 또 다른 테이블이 놓여 있고, 온갖 연금술 기구들이 널려 있다. 시험관과 비커, 증류 장치 따위들이다. 물건들은 비싸 보이지만 부피가 크고 연약해서, 들고 다닐 만한 보석과는 거리가 멀다.
  verdict: wrong
  note: treasure를 '보석'으로 오역했다. 'fragile'은 '연약해서'가 아니라 '깨지기 쉬워서'이다. 'vials'도 시험관보다는 유리병에 가깝다.
  fix: 여기에도 테이블이 하나 놓여 있고, 온갖 연금술 기구가 널려 있다. 유리병과 비커, 증류 장치 따위다. 비싸 보이기는 하지만 부피가 크고 깨지기 쉬워서, 챙겨 갈 만한 보물로는 영 아니다.
- id: tba:62:room:6210
  field: description
  en: The energy barrier seems to push against you ineffectively as you shove your way through it.  All your hairs stick up
    on your body from the static electricity, and electric shocks sting your body from every metallic piece of equipment you
    are carrying.  You think with a final shove, you can break through to the other side...
  ko: 당신이 힘으로 장벽을 밀고 들어가려 해도 에너지 장벽은 별다른 저항을 하지 못하는 듯하다. 정전기 때문에 온몸의 머리카락이 쭈뼛 서 있고, 들고 있는 금속 장비마다 전기 충격이 몸을 찌른다. 마지막 힘을 다해
    밀면, 반대편으로 뚫고 나갈 수 있을 것 같다...
  verdict: wrong
  note: '''All your hairs ... on your body''는 몸의 털이다. ''온몸의 머리카락''은 오역이다. ''with a final shove''는 ''한 번만 더 밀면''의 뜻이다.'
  fix: 당신이 억지로 밀고 나아가자, 에너지 장벽이 당신을 밀어내려 하지만 별 소용이 없는 듯하다. 정전기 때문에 온몸의 털이 곤두서고, 지니고 있는 금속 장비마다 전기 충격이 따끔하게 몸을 찌른다. 마지막으로 한
    번만 더 세게 밀면 반대편으로 뚫고 나갈 수 있을 것 같다...
- id: tba:62:room:6208
  field: description
  en: Here the field changes color, becoming almost transparent.  Beyond, you think you can make out a few shapes, but nothing
    too terribly distinct.  From the north comes the rushing sound of water, and through the trees you believe you can see
    a river cutting through the forest.  The trail you are on leads north-south through the woods, following the energy barrier
    all along its length.
  ko: 여기 들판의 색이 변하여 거의 투명해진다. 너머로 몇 가지 형체를 어렴풋이 알아볼 수 있을 것 같지만, 너무 뚜렷하지는 않다. 북쪽에서 물이 흐르는 소리가 들려오고, 나무 사이로 숲을 가로지르는 강이 보이는
    듯하다. 당신이 서 있는 오솔길은 숲을 남북으로 가로지르며, 그 전체 길이에 걸쳐 에너지 장벽을 따라 이어진다.
  verdict: wrong
  note: 여기서 'field'는 에너지 장벽(역장)이다. '들판'은 오역이다. '그 전체 길이에 걸쳐'도 번역투다.
  fix: 여기서는 장벽의 색이 변해 거의 투명해진다. 그 너머로 몇몇 형체가 어렴풋이 보이는 것 같지만, 그리 뚜렷하지는 않다. 북쪽에서 세찬 물소리가 들려오고, 나무 사이로 숲을 가르며 흐르는 강이 보이는 듯하다.
    당신이 서 있는 오솔길은 숲을 남북으로 가로지르며 에너지 장벽을 따라 줄곧 이어진다.
- id: tba:62:room:6203
  field: extras.0.text
  en: You can faintly see the woods continue beyond it, but it seems there's no way through.  The field rises high up into
    the air, and seems to form a ceiling above the woods, preventing a flying entrance.  You'd also bet it extends deep into
    the ground.
  ko: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고 있다. 또한 땅속 깊이까지 뻗어 있을
    것이라고 단정할 수 있다.
  verdict: wrong
  note: '''You''d bet''은 ''장담할 만하다'', 곧 ''분명 그럴 것이다''라는 추측이다. ''단정할 수 있다''는 뜻이 어긋난다. ''seems to form''의 추측 뉘앙스도 빠졌다.'
  fix: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어갈 수도 없다. 땅속 깊이까지 뻗어 있을 것이
    분명하다.
- id: tba:62:room:6212
  field: description
  en: Several trails in the forest intersect here in a small clearing.  The dirt seems matted down, and you see many footprints
    in the soil.   Nearby you hear a bird's chirp abruptly cut off in a loud squawk, and then silence.  The paths seem well-traveled,
    the undergrowth matted down and the foliage hacked away to leave plenty of room or a traveller to pass in every cardinal
    direction, excepting the west path seems fairly overgrown... / You feel watched.
  ko: 숲속의 여러 오솔길이 작은 빈터에서 교차한다. 흙은 밟혀 단단해졌고, 땅에는 수많은 발자국이 찍혀 있다. 근처에서 새의 지저귐이 갑자기 큰 비명으로 끊기고, 이내 고요해진다. 오솔길은 잘 다져져 있어, 덤불은
    밟혀 평평해지고 나뭇잎은 잘려나와 여행자가 네 방면으로 통행할 수 있을 만큼 공간이 확보되어 있다. 다만 서쪽 오솔길은 꽤나 무성하게 자라난 듯하다... / 당신은 누군가에게 감시당하고 있는 기분이 든다.
  verdict: awkward
  note: '''잘려나와''는 틀린 형태이다. ''hacked away''는 ''쳐내져''로 옮겨야 한다. squawk를 ''큰 비명''으로 옮긴 것은 어색하다. ''오솔길은 잘 다져져 있어, 덤불은 밟혀''는 문장이
    꼬였다.'
  fix: 숲속의 여러 오솔길이 이곳 작은 빈터에서 만난다. 흙은 밟혀 단단히 다져졌고, 땅에는 발자국이 수없이 찍혀 있다. 가까이에서 새가 지저귀다 꽥 하고 날카롭게 울더니 소리가 뚝 끊기고, 이내 정적이 흐른다.
    길들은 자주 다닌 듯하다. 덤불은 밟혀 납작해졌고 가지는 쳐내져 있어 동서남북 어느 쪽으로든 지나다니기에 넉넉하다. 다만 서쪽 길만은 꽤 우거져 있다... / 누군가 당신을 지켜보고 있는 듯한 기분이 든다.
