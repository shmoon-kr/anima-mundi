  verdict: awkward
  note: '''고통받는 당신의 코에겐 매우 좋은 생각처럼 보인다''는 직역투다. ''painted warning signs''는 ''칠해진 표지판''보다 ''그려진 경고 표시''가 자연스럽다.'
  fix: 터널은 여기서 갈라져, 한 갈래는 북쪽으로, 다른 갈래는 서쪽으로 이어진다. 동쪽으로 되돌아 밖으로 나갈 수도 있는데, 시달릴 대로 시달린 당신의 코는 그쪽이 아주 좋은 생각이라고 아우성친다. 악취에 눈물이
    나고, 당신은 치미는 구역질을 참으려고 왼손을 꽉 움켜쥔다. / 억지로 눈을 뜨자, 북쪽 터널 주위에 그려진 경고 표시들이 눈에 들어온다.
- id: tba:62:room:6262
  field: description
  en: Some small cages sit here, containing many different types of rodents.  Leaning down to look better, you are very surprised
    as a tiny, common garden mouse growls at you and tries to rip your face off through the bars. There are some bulges on
    its back, and it doesn't seem to be in a very good mood.  It quivers some, not fully in control of its motor functions.  Poor
    thing.
  ko: 여기에는 작은 우리들이 놓여 있고, 온갖 종류의 설치류가 들어 있다. 자세히 보기 위해 몸을 숙이는데, 평범한 정원 쥐 한 마리가 당신을 향해 으르렁거리며 철창 사이로 당신의 얼굴을 뜯어먹으려 해 깜짝 놀란다.
    쥐의 등에는 혹이 몇 개 나 있고, 기분이 매우 나빠 보인다. 쥐는 덜덜 떨며 운동 기능을 온전히 통제하지 못하는 듯하다. 불쌍한 녀석이다.
  verdict: wrong
  note: '''tiny''가 빠졌다. ''rip your face off''는 ''뜯어먹다''가 아니라 ''물어뜯다''이고, ''through the bars''는 ''철창 너머로''가 맞다.'
  fix: 여기에는 작은 우리 몇 개가 놓여 있고, 온갖 종류의 설치류가 들어 있다. 더 잘 보려고 몸을 숙이는데, 정원에서 흔히 보는 조그만 생쥐 한 마리가 당신을 향해 으르렁거리며 철창 너머로 당신의 얼굴을 물어뜯으려
    해 깜짝 놀란다. 쥐의 등에는 혹이 몇 개 솟아 있고, 기분이 아주 나빠 보인다. 쥐는 몸을 조금씩 떨며, 몸놀림을 제대로 가누지 못하는 듯하다. 불쌍한 녀석이다.
- id: tba:62:room:6220
  field: description
  en: This is a winding east-west path through the thickening forest.  The grass along the path is matted down from frequent
    traffic.  The path continues to the east, and there seems to be a small clearing to the west. / A faint noise makes you
    stand stock still.  You could have sworn you heard a voice nearby.  Whatever it was, it wasn't speaking common.
  ko: 이곳은 점점 짙어지는 숲을 동서로 굽이쳐 지나가는 길이다. 길 옆의 풀은 잦은 통행으로 인해 눌려 밟혀 있다. 길은 동쪽으로 이어지고, 서쪽으로는 작은 빈터가 있는 듯하다. / 가느다란 소리가 당신의 발걸음을
    멈추게 한다. 분명 근처에서 목소리를 들은 것 같은데, 그것이 무엇이든 그것은 공용어를 사용하지 않았다.
  verdict: awkward
  note: '''그것이 무엇이든 그것은''은 대명사가 반복되는 직역투다. ''faint noise''는 ''가느다란''보다 ''희미한''이 맞다. ''stand stock still''은 ''얼어붙다''가 자연스럽다.'
  fix: 이곳은 점점 울창해지는 숲 사이를 동서로 구불구불 지나가는 길이다. 길가의 풀은 잦은 통행으로 납작하게 짓눌려 있다. 길은 동쪽으로 이어지고, 서쪽으로는 작은 빈터가 있는 듯하다. / 희미한 소리에 당신은
    그 자리에 얼어붙는다. 분명 근처에서 목소리를 들은 것 같다. 무엇이었든, 공용어로 말하고 있지는 않았다.
- id: tba:62:mob:6205
  field: description
  en: As you stare her down, she raises her hands slowly, as if to say, 'Don't kill me'.
  ko: 당신이 그녀를 노려보자, 그녀는 마치 '나를 죽이지 마라'라고 말하듯 천천히 손을 든다.
  verdict: awkward
  note: 애원하는 상황에서 '나를 죽이지 마라'는 명령조라 맞지 않는다. 존댓말 애원체가 자연스럽다.
  fix: 당신이 그녀를 노려보자, 그녀는 마치 '죽이지 마세요'라고 말하듯 천천히 두 손을 든다.
- id: tba:62:room:6264
  field: name
  en: A Cage
  ko: 장롱
  verdict: wrong
  note: cage는 '우리'다. '장롱'은 옷장이라 완전한 오역이다.
  fix: 우리
- id: tba:62:room:6261
  field: description
  en: This is a small, dirty cage, with only a bucket for wastes, another bucket for food, and a dirty towel for a bed.  The
    whole room has a terrible stench about it.
  ko: 좁고 더러운 감방이다. 배설물을 위한 양동이 하나, 음식을 위한 양동이 하나, 그리고 이불 대신 더러운 수건 하나만 있다. 방 전체가 끔찍한 악취로 가득하다.
  verdict: wrong
  note: cage를 '감방'(감옥의 방)으로 옮겼다. 원문은 '우리'다. 'for a bed'는 침대 대신이라는 뜻인데 '이불 대신'으로 바뀌었다.
  fix: 좁고 더러운 우리다. 배설물을 받는 양동이 하나, 음식을 담는 양동이 하나, 그리고 침대 대신 깔린 더러운 수건 하나뿐이다. 방 전체에 끔찍한 악취가 진동한다.
- id: tba:62:room:6263
  field: description
  en: A rack stands near the cages on the eastern wall, filled with shackles and manacles, bullwhips and worse. They all look
    well-used.  You give a shiver, and carry on.
  ko: 동쪽 벽 근처의 우리 옆에 선반이 하나 서 있다. 수갑과 족쇄, 채찍, 그리고 그보다 더 심한 도구들이 가득하다. 모두 꽤 많이 사용된 것처럼 보인다. 당신은 소름이 돋아하며 발걸음을 계속한다.
  verdict: awkward
  note: '''소름이 돋아하며''는 비문이다. ''give a shiver''는 몸을 떠는 동작이다.'
  fix: 동쪽 벽에 늘어선 우리 옆에 선반이 하나 서 있다. 족쇄와 수갑, 채찍, 그리고 그보다 더 끔찍한 도구들이 가득하다. 모두 꽤 많이 쓰인 흔적이 있다. 당신은 몸을 부르르 떨고는 발걸음을 옮긴다.
- id: tba:62:room:6211
  field: extras.0.text
  en: Demi-human, from the size.  The foreheads slop down to a blocky brow, and the braincase seems rather small.  On a hunch,
    you check one of the feet of a torched body.  Cloven, like a pig's...  Orcs.
  ko: 크기로 보아 반인종이다. 이마가 단단한 눈썹뼈로 이어져 내리막을 이루고, 두개골은 꽤 작아 보인다. 직감으로 불에 탄 시체의 발 하나를 확인해 본다. 돼지처럼 갈라져 있다... 오크다.
  verdict: wrong
  note: demi-human은 판타지 용어로 '아인종'이다. '반인종'은 쓰지 않는 말이다. blocky는 '각진'이라는 뜻인데 '단단한'으로 옮겼다. '내리막을 이루고'도 어색하다.
  fix: 크기로 보아 아인종이다. 이마는 비스듬히 기울어 각진 눈썹뼈로 이어지고, 두개골은 꽤 작아 보인다. 문득 짚이는 데가 있어 불에 탄 시체의 발 하나를 살펴본다. 돼지처럼 갈라진 발굽이다... 오크다.
- id: tba:62:room:6247
  field: description
  en: A single corpse lies here, well away from a pile of similars to the east.  There are several sharpened stakes and rocks
    sitting about conveniently.  The way the corpse is lying, the stone next to its hand... this is a suicide area!  You look
    down upon the orc and comprehend its suffering in its twisted form.  How sad.
  ko: 시체 한 구가 여기 놓여 있다. 동쪽의 비슷한 시체 더미에서 꽤 떨어진 곳이다. 날카롭게 갈아놓은 말뚝과 돌들이 여기저기 편리하게 놓여 있다. 시체가 누워 있는 자세, 손 옆에 놓인 돌... 이것은 자살 구역이다!
    당신은 그 오크를 내려다보며, 그 비틀린 형태의 고통을 이해하게 된다. 참으로 슬프다.
  verdict: awkward
  note: '''편리하게 놓여 있다''는 직역투다. ''그 비틀린 형태의 고통을 이해하게 된다''도 부자연스럽다.'
  fix: 시체 한 구가 여기 놓여 있다. 동쪽의 비슷한 시체 더미와는 꽤 떨어진 곳이다. 날카롭게 깎은 말뚝과 돌들이 손 닿기 좋게 여기저기 놓여 있다. 시체가 누운 자세, 손 옆에 놓인 돌... 이곳은 자살 장소다!
    당신은 오크를 내려다보며, 뒤틀린 그 모습에서 그가 겪은 고통을 헤아린다. 참으로 슬픈 일이다.
- id: tba:62:obj:6202
  field: extras.0.text
