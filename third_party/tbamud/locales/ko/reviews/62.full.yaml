    to be a whole lot to capture your attention here...
  ko: 숲은 바로 서쪽에 있으며, 여기서부터 숲 깊숙이로 이어지는 작은 길이 있다. 그러나 당신이 서 있는 큰길은 북쪽으로 강을 향해, 남쪽으로는 산비탈의 동굴로 이어지는 오솔길이 있는 곳 근처로 향한다. 여기서는
