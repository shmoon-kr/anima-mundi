- id: tba:62:room:6204
  field: extras.0.text
  en: You can faintly see the woods continue beyond it, but it seems there's no way through.  The field rises high up into
    the air, and seems to form a ceiling above the woods, preventing a flying entrance.  You'd also bet it extends deep into
    the ground.
  ko: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고 있다. 또한 땅속 깊이까지 뻗어 있을
    것이라고 단정할 수 있다.
  verdict: awkward
  note: '''You''d bet''은 ''분명 ~일 것이다''라는 뜻이다. ''단정할 수 있다''는 딱딱하다. ''seems to form''의 추측 어조도 빠졌다. ''field''를 ''에너지 장벽''으로 옮긴
