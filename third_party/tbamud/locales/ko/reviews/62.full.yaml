    분명하다.
- id: tba:62:room:6246
  field: description
  en: Heaps of rotting meat and cups of near-drinkable water sit here; the orc food stores.  You stand here and wonder in
    near-disbelief at how the orcs could find this stuff palatable.  They're orcs; its their nature and their stomachs you
    guess.  Oddly enough, you don't even care to catalog what they have available -- there's no chance you're going to take
    any of this...
  ko: 썩어가는 고기 더미와 거의 마실 수 있을 것 같은 물잔들이 여기 놓여 있다. 오크들의 식량 저장고다. 당신은 여기 서서, 오크들이 이런 것을 어떻게 먹을 수 있는지 거의 믿을 수 없다는 듯이 생각한다. 그들은
    오크니까, 그들의 본능과 위장 탓이라고 짐작한다. 이상하게도, 그들이 무엇을 구비해 두었는지 일일이 나열할 생각조차 들지 않는다 -- 이 중 아무것도 가져갈 생각은 없으니까...
  verdict: awkward
  note: '''거의 믿을 수 없다는 듯이 생각한다''와 ''일일이 나열할 생각''이 직역투다. ''near-drinkable''은 ''겨우 마실 만한''이 자연스럽다.'
  fix: 썩어 가는 고기 더미와 겨우 마실 만한 물이 담긴 잔들이 놓여 있다. 오크들의 식량 창고다. 오크들이 어떻게 이런 걸 먹을 수 있는지, 당신은 그저 어이가 없을 따름이다. 오크니까, 타고난 본성과 위장 탓이겠거니
    싶다. 이상하게도 무엇이 있는지 하나하나 살펴볼 마음조차 들지 않는다 -- 어차피 이 중 무엇 하나 가져갈 리 없으니까...
- id: tba:62:room:6244
  field: description
  en: The floor is slick with the humidity that boils out of the lower reaches of this cave, bringing that most awful smell
    with it.  Again, you consider saving your nose the trip west and down the tunnel, and heading back east to the cave entrance.
  ko: 이 동굴 깊은 곳에서 끓어오르는 습기가 바닥을 축축하게 적시고, 그와 함께 가장 끔찍한 냄새가 함께 올라온다. 당신은 다시 한번 생각하게 된다. 코를 위해 서쪽 터널로 내려가는 여정을 포기하고, 동쪽 동굴 입구로
    돌아가는 것이 나을지도 모른다고.
  verdict: awkward
  note: '''that most awful smell''은 앞서 나온 ''그 지독한 냄새''를 가리킨다. 최상급 ''가장 끔찍한''으로 옮긴 것은 어색하다. ''함께''가 중복되었고, ''slick''(미끄럽다)도
    흐려졌다.'
  fix: 이 동굴 깊은 곳에서 끓어오르는 습기로 바닥이 미끄럽고, 그 지독한 냄새도 함께 올라온다. 당신은 다시 한번 고민한다. 코를 생각해서 서쪽 터널 아래로 내려가는 건 그만두고, 동쪽 동굴 입구로 돌아가는 편이
    낫지 않을까.
