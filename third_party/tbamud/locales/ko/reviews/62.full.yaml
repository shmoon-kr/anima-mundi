  fix: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 장벽은 하늘 높이 솟아 숲 위로 천장을 이루는 듯하여, 날아서 들어가는 것도 막고 있다. 땅속 깊이까지 뻗어 있을 것도
    분명하다.
- id: tba:62:obj:6200
  field: extras.0.text
  en: It is a plain looking key.
  ko: 평범해 보이는 열쇠이다.
  verdict: awkward
  note: 모음 뒤의 '이다'는 딱딱하다. '열쇠다'가 자연스럽다.
  fix: 평범해 보이는 열쇠다.
- id: tba:62:room:6241
  field: description
  en: The forest is just to your west, with a side trail leading deep inside from here.  The main trail you are on, however,
