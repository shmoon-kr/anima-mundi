- id: tba:62:room:6237
  field: description
  en: The earth has been upturned many times here, and several white rocks stick up from the ground in odd positions. / Graveyard.
    / This must be where they bury their dead -- just dig a hole and throw the corpse inside, ignoring any previous occupants
    in the ground.  How uncivilized... you hope you aren't taken care of in this matter when your time comes...
  ko: 여기서는 땅이 여러 번 파헤쳐진 흔적이 있고, 흰색 바위들이 기이한 자세로 땅에서 솟아 있다. / 묘지다. / 이곳이 그들의 시체를 묻는 곳인 모양이다. 구멍을 파고 시체를 던져 넣을 뿐, 땅속에 이미 있는
    이전 거주자들을 무시하는 식이다. 얼마나 문명에서 벗어난 짓인가... 당신의 차례가 왔을 때 이렇게 처리되지는 않기를 바라지만...
  verdict: awkward
  note: 바위에 '자세'를 쓰는 것은 어색하다. '각도'나 '모양'이 맞다. '문명에서 벗어난 짓'은 직역투이므로 '야만적인'이 자연스럽다.
  fix: 이곳은 땅이 여러 번 파헤쳐졌고, 흰 바위 몇 개가 기묘한 각도로 땅에서 솟아 있다. / 묘지다. / 이곳이 그들이 죽은 자를 묻는 곳인 모양이다. 구멍을 파고 시체를 던져 넣을 뿐, 먼저 묻힌 자들은 아랑곳하지
    않는다. 얼마나 야만적인가... 당신의 때가 왔을 때 이런 식으로 처리되지 않기를 바랄 뿐이다...
- id: tba:62:room:6213
  field: description
  en: The northern trail winds through the trees, heading from a forest clearings to the south to where there appears to be
    a river's edge to the north.  This trail appears to be well-used and you spot many tracks in the earth.  Again the hairs
    on the back of your neck stand up, and you wonder if you're being spied upon.
  ko: 북쪽 오솔길은 나무들 사이로 굽이치며, 남쪽의 숲속 빈터에서 북쪽의 강가까지 이어진다. 이 오솔길은 자주 사용된 듯 보이며, 땅에는 수많은 발자국이 보인다. 다시 한번 목 뒤의 털이 쭈뼛 서고, 누군가에게 엿듣고
    있지는 않은지 궁금해진다.
  verdict: wrong
  note: '''spied upon''은 몰래 감시당하는 것이다. 이를 ''엿듣다''로 오역했고, 문장 구조도 깨졌다.'
  fix: 북쪽 오솔길은 나무들 사이로 굽이치며, 남쪽의 숲속 빈터에서 북쪽의 강가로 보이는 곳까지 이어진다. 이 오솔길은 자주 다닌 듯하고, 땅에는 수많은 발자국이 보인다. 다시 한번 목 뒤의 털이 쭈뼛 서고, 누군가
    당신을 몰래 지켜보고 있는 건 아닌지 의심스러워진다.
- id: tba:62:room:6238
  field: description
  en: The trail splits here, one fork heading north towards the rushing sounds of a river, and west where the forest seems
    to be thinning out a lot.  A sudden motion out of the corner of your eye catches your eyes, and you turn your head.  Nothing,
    there's nothing there at all. / You wonder if you're being stalked.
  ko: 오솔길이 여기서 갈라진다. 한 갈래는 강물의 요란한 소리가 들리는 북쪽으로, 다른 갈래는 숲이 많이 얇아지는 서쪽으로 이어진다. 눈의 끝자락에서 갑자기 움직임이 느껴져 고개를 돌린다. 아무것도 없다. 정말로
    아무것도 없다. / 당신은 누군가에게 쫓기고 있는 건 아닌지 궁금해진다.
  verdict: wrong
  note: '''thinning out''을 ''얇아지는''으로 오역했다. 숲에는 ''듬성해지다''가 맞다. ''stalked''는 ''쫓기다''가 아니라 ''뒤를 밟히다''이다. ''눈의 끝자락''은 ''시야 한쪽''이
    자연스럽다.'
  fix: 오솔길이 여기서 갈라진다. 한 갈래는 요란한 강물 소리가 들리는 북쪽으로, 다른 갈래는 숲이 훨씬 듬성해지는 듯한 서쪽으로 이어진다. 시야 한쪽에서 갑작스러운 움직임이 눈에 띄어 당신은 고개를 돌린다. 아무것도
    없다. 정말로 아무것도 없다. / 누군가 당신의 뒤를 밟고 있는 건 아닌지 의심스러워진다.
- id: tba:62:room:6228
  field: description
  en: This path leads from the main clearing to the west to intersect with a north-south path just to the east.  A small sapling
    on the north side of the trail has a rope tied around one of its top branches; an unused snare evidently.  You still feel
    as if you're being watched in the back of your mind, and adrenaline pumps into your brain like a lightning fuzz.
  ko: 이 오솔길은 빈터에서 서쪽으로 이어져 동쪽 근처에서 남북 방향으로 뻗은 길과 교차한다. 오솔길 북쪽의 작은 묘목 윗가지 중 하나에 밧줄이 묶여 있는데, evidently 사용하지 않은 덫이다. 당신의 마음 한구석에서는
    여전히 누군가 자신을 지켜보고 있다는 느낌이 들고, 아드레날린이 뇌로 쏟아져 들어와 번개처럼 전율친다.
  verdict: wrong
  note: '''evidently''가 영어로 남았다. ''서쪽의 큰 빈터에서 시작한다''는 방향 의미가 틀렸고 ''main''이 빠졌다. 플레이어를 ''자신''으로 지칭했다.'
  fix: 이 오솔길은 서쪽의 큰 빈터에서 시작해 바로 동쪽에서 남북으로 뻗은 길과 만난다. 오솔길 북쪽에 선 작은 묘목의 꼭대기 가지 하나에 밧줄이 묶여 있다. 쓰지 않은 덫인 게 분명하다. 마음 한구석에서는 여전히
    누군가 당신을 지켜보는 듯한 느낌이 들고, 아드레날린이 번개처럼 머릿속으로 치솟는다.
- id: tba:62:mob:6208
  field: description
  en: Its body has been twisted beyond all hope.  It is dying, and nothing will stop that.
  ko: 그의 몸은 모든 희망을 잃고 비틀려 있다. 그는 죽어가고 있으며, 그것을 막을 수 있는 것은 아무것도 없다.
  verdict: wrong
  note: '''beyond all hope''는 회복할 가망이 없다는 뜻이다. ''희망을 잃고''는 오역이다.'
  fix: 그것의 몸은 회복할 가망이 없을 만큼 뒤틀려 있다. 그것은 죽어 가고 있으며, 무엇으로도 그것을 막을 수 없다.
- id: tba:62:room:6250
  field: description
  en: Several grass sleeping pallets are here, clustered around the remains of an old fire.  The sloping of the cave's ceiling
    allow for smoke ventilation towards the surface in here you note, lucky for the orcs.  A few strings of burnt meat still
    hang over the fire, untended and uneaten.  On the floor near your feet you spy a small, twisted piece of wire... one orc's
    idea of a treasured ring, no doubt.  Kicking the trinket away, you try to push the pity out of your heart for these wretches.
  ko: 여러 개의 풀 이불이 오래된 불의 잔해 주위에 뭉쳐 있다. 동굴 천장이 기울어져 있어 연기가 지표면 쪽으로 빠져나갈 수 있음을 당신은 알아차린다. 오크들에게는 운이 좋았다. 불 위에 몇 줄기의 탄 고기가 아직
    걸려 있는데, 아무도 돌보지 않고 먹지도 않았다. 발밑 바닥에서 당신은 작고 꼬인 철사 조각을 발견한다. 분명 오크 한 놈의 소중하게 여기는 반지일 것이다. 그 장신구를 발로 차버리며, 당신은 이 불쌍한 놈들에
    대한 연민을 마음에서 밀어내려 애쓴다.
  verdict: wrong
  note: '''sleeping pallet''은 바닥에 까는 잠자리이므로 ''이불''은 오역이다. ''오크 한 놈의 소중하게 여기는 반지''는 문장이 어색하다.'
  fix: 풀로 엮은 잠자리 깔개 여러 개가 오래된 모닥불 자리 주위에 모여 있다. 동굴 천장이 비스듬히 기울어 있어 연기가 지표면 쪽으로 빠져나갈 수 있다는 것을 당신은 알아차린다. 오크들에게는 다행스러운 일이다.
    불 위에는 탄 고기 몇 줄이 아무도 돌보거나 먹지 않은 채 아직 걸려 있다. 발밑 바닥에서 당신은 작고 꼬인 철사 조각을 발견한다. 어느 오크가 소중한 반지라고 여겼던 물건이 틀림없다. 그 장신구를 발로 차버리며,
    당신은 이 가련한 것들에 대한 연민을 마음에서 밀어내려 애쓴다.
- id: tba:62:room:6265
  field: description
  en: This is the southwest corner of the lab.  There's no equipment here, merely several pairs of heavy steel shackles on
    the southern wall.  There's also some a few small bloodstains on the floor beneath the shackles.
  ko: 이곳은 실험실의 남서쪽 구석이다. 장비는 없고, 남쪽 벽에 무거운 철제 수갑 여러 쌍이 매달려 있을 뿐이다. 수갑 아래 바닥에는 작은 혈흔 몇 점이 얼룩져 있다.
  verdict: wrong
  note: 벽에 달린 'shackles'는 '족쇄'다. '수갑'은 handcuffs이므로 오역이다.
  fix: 이곳은 실험실의 남서쪽 구석이다. 장비는 없고, 남쪽 벽에 무거운 강철 족쇄 여러 벌이 달려 있을 뿐이다. 족쇄 아래 바닥에는 작은 핏자국 몇 점도 남아 있다.
- id: tba:62:room:6254
  field: description
  en: This area of the cave is one vast orc sickroom. Mutated and mangled orcs lie on the floor, seeming quiet, lifeless.  They're
    not even worth your time, you think, unless you've the mercy to put them out of their misery. / You look at the corruption
    of nature's design and wonder what forces are at work here... the barrier, the orcs...  What's going on here?
  ko: 동굴의 이 구역은 거대한 오크 병실이다. 돌연변이가 되거나 몸이 찢어진 오크들이 바닥에 누워 있으며, 조용하고 생기가 없어 보인다. 당신은 생각한다. 만약 그들의 고통을 끝내 줄 자비가 없다면, 그들에게 시간을
    들일 가치조차 없다고. / 당신은 자연의 설계가 어떻게 훼손되었는지를 바라보며, 여기서 어떤 힘이 작용하고 있는지 궁금해한다... 장벽, 오크들... 여기서 대체 무슨 일이 일어나고 있는 걸까?
  verdict: awkward
  note: '''당신은 생각한다. ...고.'' 구조가 딱딱한 직역투다. ''자연의 설계가 어떻게 훼손되었는지를 바라보며''도 부자연스럽다.'
  fix: 동굴의 이 구역은 거대한 오크 병실이다. 돌연변이가 되거나 몸이 망가진 오크들이 생기 없이 조용히 바닥에 누워 있다. 자비를 베풀어 고통을 끝내 줄 생각이 아니라면, 시간을 들일 가치도 없는 것들이라고 당신은
    생각한다. / 일그러진 자연의 섭리를 바라보며, 당신은 여기서 어떤 힘이 작용하고 있는지 궁금해진다... 장벽, 오크들... 여기서 대체 무슨 일이 일어나고 있는 걸까?
- id: tba:62:room:6217
  field: description
  en: This well-used forest trail leads south.  Among the foot-tracks in the dirt, you spot a few animal tracks as well, leading
    you to believe that these trails are used by hunters.  Why would they be enclosed in this manner, however? / There is
    a clearing to the north, and the path continues to the south.
  ko: 이 많이 다닌 숲속 오솔길은 남쪽으로 이어진다. 흙바닥에 남은 발자국 사이로 짐승들의 발자국도 몇 개 보인다. 이 오솔길은 사냥꾼들이 다니는 길인 것 같다. 그런데 왜 이런 식으로 둘러싸여 있는 걸까? / 북쪽에는
    빈터가 있고, 오솔길은 남쪽으로 계속 이어진다.
  verdict: awkward
  note: '''이 많이 다닌 숲속 오솔길은''은 관형어가 겹쳐 어색하다.'
  fix: 사람들이 자주 다닌 이 숲속 오솔길은 남쪽으로 이어진다. 흙바닥에 남은 발자국 사이로 짐승 발자국도 몇 개 보인다. 이 오솔길은 사냥꾼들이 다니는 길인 것 같다. 그런데 왜 이런 식으로 둘러싸여 있는 걸까?
    / 북쪽에는 빈터가 있고, 오솔길은 남쪽으로 계속 이어진다.
- id: tba:62:room:6224
  field: description
  en: The ground has been cleared of vegetation in this small clearing, and several large, man-made salt licks lie on the
    ground and stand on poles here.  There are many animal tracks in the earth -- the salt licks must attract wildlife for
    miles around.  You think this would be a good place to hide and wait for dinner if you were a hunter...
  ko: 이 작은 빈터의 땅은 잡초가 모두 제거되어 있고, 여러 개의 크고 인공적으로 만든 소금 핥는 돌이 땅 위에 놓여 있거나 기둥 위에 세워져 있다. 흙에는 수많은 짐승 발자국이 찍혀 있다 -- 소금 핥는 돌이 주변
    수 마일(약 1.6킬로미터) 안팎의 야생동물을 끌어들이는 모양이다. 당신이 사냥꾼이라면, 여기서 숨어 저녁 식사를 기다리기에 좋은 장소라고 생각된다...
  verdict: wrong
  note: 원문에 없는 '(약 1.6킬로미터)'를 덧붙였고, 그 환산도 '수 마일'과 맞지 않는다. 'vegetation'은 잡초만이 아니라 초목 전체다.
  fix: 이 작은 빈터는 초목이 말끔히 치워져 있고, 사람이 만든 커다란 소금 덩어리 여러 개가 땅 위에 놓여 있거나 기둥 위에 얹혀 있다. 흙에는 수많은 짐승 발자국이 찍혀 있다 -- 이 소금 덩어리들이 주변 수
    마일 안의 야생동물을 끌어들이는 모양이다. 당신이 사냥꾼이라면 이곳은 숨어서 저녁거리를 기다리기에 좋은 장소일 것 같다...
- id: tba:62:room:6230
  field: description
  en: Two trails come together here, a large northern path heading away from tracks leading to the east and west. The western
    path seems to be the most traveled, and the east hardly at all.  There seems to be less trees around here... it seems
    as if many have been cut down by some sort of crude tools.  This land clearing appears to be especially true to the east.
  ko: 두 갈래의 오솔길이 여기서 합류한다. 동서로 이어지는 길에서 벗어나 북쪽으로 뻗은 큰 길이 있다. 서쪽 길은 가장 많이 다닌 흔적이 있고, 동쪽 길은 거의 다닌 흔적이 없다. 이 주변에는 나무가 적은 것 같다...
    어떤 종류의 원시적인 도구로 많은 나무가 베어낸 것처럼 보인다. 이 땅을 개간한 흔적은 특히 동쪽에서 뚜렷하다.
  verdict: awkward
  note: '''많은 나무가 베어낸 것처럼''은 조사 오류다. ''나무가 베인'' 또는 ''나무를 베어낸''이 맞다.'
  fix: 두 갈래의 오솔길이 여기서 합류한다. 동서로 이어지는 길에서 북쪽으로 큰 길이 뻗어 나간다. 서쪽 길은 가장 많이 다닌 흔적이 있고, 동쪽 길은 거의 다닌 흔적이 없다. 이 주변에는 나무가 적은 것 같다...
    조잡한 도구로 많은 나무를 베어낸 것처럼 보인다. 땅을 개간한 흔적은 특히 동쪽에서 뚜렷하다.
- id: tba:62:mob:6210
  field: description
  en: He looks at you archly as he wonders why you have invaded his domain.  No matter...  It shouldn't be too hard for him
    to destroy you, no?
  ko: 그는 당신이 왜 그의 영역을 침범했는지 궁금해하며 당신을 비웃듯 바라본다. 어쨌든... 그를 당신을 파괴하는 것은 그리 어렵지 않을 것이다, 그렇지 않은가?
  verdict: wrong
  note: '''그를 당신을 파괴하는 것은''은 문법이 깨져 주체가 뒤섞였다. ''No matter''는 ''어쨌든''보다 ''상관없다''에 가깝다.'
  fix: 그는 당신이 왜 자신의 영역을 침범했는지 궁금해하며 당신을 거만하게 바라본다. 상관없다... 그가 당신을 없애는 것쯤은 그리 어렵지 않을 테니, 그렇지 않은가?
- id: tba:62:room:6221
  field: description
  en: In the middle of this small clearing in the forest is a fairly large rock sticking up out of the ground.  Paths lead
    away to the east, west, and south from here.  The trees above block out the sky fairly effectively, also blotting out
    the glowing energy barrier above your head.
  ko: 숲속의 이 작은 빈터 한가운데에는 땅에서 솟아 나온 꽤 큰 바위가 있다. 여기서 동쪽, 서쪽, 남쪽으로 길이 이어진다. 머리 위의 나무들이 하늘을 꽤 효과적으로 가려, 당신 머리 위에 떠 있는 빛나는 에너지
    장벽까지 가려 버린다.
  verdict: awkward
  note: '''꽤 효과적으로''는 번역투이고 ''머리 위''가 두 번 반복된다.'
  fix: 숲속의 이 작은 빈터 한가운데에는 꽤 큰 바위가 땅 위로 솟아 있다. 여기서 동쪽, 서쪽, 남쪽으로 길이 나 있다. 위로 우거진 나무들이 하늘을 거의 가리고 있어, 머리 위에서 빛나는 에너지 장벽도 잘 보이지
    않는다.
- id: tba:62:room:6219
  field: description
  en: The trail changes direction here, turning to the north and west.  A large tree to your south bears an interesting artifact;
    a rusty arrowhead embedded in the wood.  It looks as if the arrow had been  broken off at the head, the wood scratched
    at, and the arrowhead left behind. Otherwise, there doesn't seem to be much of interest in this particular section of
    the woods.
  ko: 오솔길이 여기서 방향을 바꿔 북서쪽으로 꺾인다. 남쪽에 있는 큰 나무에 흥미로운 유물이 하나 있다. 나무에 박혀 있는 녹슨 화살촉이다. 화살이 화살촉 부분에서 부러져 나가고, 나무가 긁힌 흔적이 있으며 화살촉만
    남겨진 것처럼 보인다. 그 외에는 이 숲의 이 구간에 특별히 흥미로운 것은 없어 보인다.
  verdict: wrong
  note: '''north and west''는 북쪽과 서쪽 두 방향이다. ''북서쪽''은 대각선 방향이라 출구 정보가 틀린다. ''이 숲의 이 구간''도 어색하다.'
  fix: 오솔길이 여기서 방향을 바꿔 북쪽과 서쪽으로 꺾인다. 남쪽에 선 큰 나무에 흥미로운 물건이 하나 박혀 있다. 녹슨 화살촉이다. 화살이 촉 부분에서 부러지고, 나무에는 긁힌 자국이 남았으며, 화살촉만 그대로
    남겨진 것처럼 보인다. 그 밖에는 숲의 이 구간에 딱히 눈길을 끄는 것은 없어 보인다.
- id: tba:62:room:6249
  field: description
  en: A few sleeping pallets, made of moldy straw and stinking furs are arranged around a small firepit here. A wooden cup,
    carved by a crude tool and cruder hands sits near the ashes filled with water you consider undrinkable.  Somewhere to
    the east you hear an orc child's whining cry, and a voice hushes it urgently. Beware, orcs!  Adventurers are here!  Hide
    your children!
  ko: 곰팡이가 피어 악취가 나는 짚과 가죽으로 만든 몇 개의 간이 이불이 작은 화로 주위에 놓여 있다. 거친 도구와 더 거친 손으로 새겨진 나무 컵이 재 근처에 놓여 있는데, 그 안에는 마시기 싫은 물이 들어 있다.
    동쪽 어딘가에서 오크 아이의 울음소리가 들리고, 누군가의 목소리가 급하게 그 소리를 잠재우고 있다. 조심해라, 오크들이여! 모험가들이 여기 있다! 아이들을 숨겨라!
  verdict: wrong
  note: firepit은 땅에 판 모닥불 자리이지 '화로'가 아니다. sleeping pallet은 '간이 이불'이 아니라 바닥에 까는 잠자리다. 'moldy'는 짚에, 'stinking'은 모피에 걸리는데 번역에서는
    둘이 뒤섞였다. 'undrinkable'은 '마시기 싫은'보다 '마실 수 없어 보이는'이 맞다.
  fix: 곰팡이 핀 짚과 악취 나는 모피로 만든 잠자리 몇 개가 작은 화덕 구덩이 주위에 깔려 있다. 조잡한 도구와 그보다 더 조잡한 손으로 깎은 나무 컵이 잿더미 근처에 놓여 있는데, 안에 든 물은 도저히 마실 수
    없어 보인다. 동쪽 어딘가에서 오크 아이가 칭얼대며 우는 소리가 들리고, 누군가 다급하게 아이를 달래 조용히 시킨다. 조심해라, 오크들이여! 모험가들이 왔다! 아이들을 숨겨라!
- id: tba:62:mob:6213
  field: description
  en: It might have been an orc, once.  Now it is a living terror, pushing everything out of its way to get at you.
  ko: 언젠가는 오크였을지도 모른다. 하지만 지금은 살아있는 공포 그 자체로, 당신에게 닿기 위해 모든 것을 밀어내며 앞으로 나아간다.
  verdict: awkward
  note: '''once''는 ''언젠가는''이 아니라 ''한때는''이다. ''살아있는''은 ''살아 있는''으로 띄어 써야 한다. 뒷문장도 직역투다.'
  fix: 한때는 오크였을지도 모른다. 하지만 지금은 살아 있는 공포 그 자체로, 당신에게 달려들려고 앞을 가로막는 것은 무엇이든 밀쳐 낸다.
- id: tba:62:room:6201
  field: description
  en: To the west the mountains rise high up, rocky and lifeless.  The trail you are walking on heads west to the end of the
    forest, and back east.  Each way the strange energy barrier stands just to the north, inscrutable, magical, and impenetrable.
  ko: 서쪽으로는 바위투성이이고 생기가 없는 산이 높이 솟아 있다. 당신이 걷고 있는 오솔길은 서쪽으로 숲의 끝까지 이어지다가 다시 동쪽으로 돌아간다. 어느 쪽으로 가든, 북쪽 바로 옆에는 수수께끼 같은, 마법적인,
    그리고 뚫을 수 없는 이상한 에너지 장벽이 서 있다.
  verdict: wrong
  note: '''heads west ... and back east''는 길이 서쪽과 동쪽 두 방향으로 이어진다는 뜻이다. ''이어지다가 다시 동쪽으로 돌아간다''는 길이 되돌아 나오는 것처럼 읽혀 의미가 틀린다.
    형용사를 나열한 부분도 어색하다.'
  fix: 서쪽으로는 바위투성이의 생명 없는 산들이 높이 솟아 있다. 당신이 걷고 있는 오솔길은 서쪽으로는 숲이 끝나는 곳까지, 동쪽으로는 왔던 쪽으로 이어진다. 어느 쪽이든 바로 북쪽에는 그 이상한 에너지 장벽이 서
    있다. 속을 알 수 없고, 마법으로 이루어졌으며, 뚫을 수 없는 장벽이다.
- id: tba:62:mob:6201
  field: long
  en: A small rabbit nibbles at a leaf here.
  ko: 작은 토끼가 여기 있는 잎사귀를 갉아먹고 있다.
  verdict: awkward
  note: '''here''는 토끼의 위치를 말한다. ''여기 있는 잎사귀''는 수식 대상이 틀어졌다.'
  fix: 작은 토끼 한 마리가 여기서 나뭇잎을 갉아먹고 있다.
- id: tba:62:obj:6202
  field: short
  en: a set of shackles
  ko: 쇠사슬 한 벌
  verdict: wrong
  note: shackles는 손목이나 발목에 채우는 족쇄다. '쇠사슬'(chain)은 오역이다.
  fix: 족쇄 한 벌
- id: tba:62:room:6205
  field: extras.0.text
  en: You can faintly see the woods continue beyond it, but it seems there's no way through.  The field rises high up into
    the air, and seems to form a ceiling above the woods, preventing a flying entrance.  You'd also bet it extends deep into
    the ground.
  ko: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고 있다. 또한 땅속 깊이까지 뻗어 있을
    것이라고 단정할 수 있다.
  verdict: awkward
  note: '''You''d bet''는 확신에 가까운 추측이다. ''단정할 수 있다''는 딱딱하고 어감도 맞지 않는다.'
  fix: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장처럼 덮여 있어, 날아서 들어가는 것도 막고 있다. 땅속 깊이까지도 뻗어
    있을 것이 틀림없어 보인다.
- id: tba:62:room:6266
  field: description
  en: This is a fairly roomy laboratory that extends to the north, with cages set on the east side of the room.  A metal table
    here is empty, although you can see some outlines in the dust that suggest books had laid here once.
  ko: 북쪽으로 길게 이어지는 꽤 넓은 실험실이다. 방의 동쪽 벽면에는 우리들이 놓여 있다. 여기 있는 금속 테이블은 비어 있지만, 먼지 위로 책이 놓여 있던 흔적이 희미하게 남아 있다.
  verdict: awkward
  note: '''우리들이''는 1인칭 ''우리''로 오독될 수 있다. ''벽면''은 원문에 없는 말이고, 문장 연결도 딱딱하다.'
  fix: 북쪽으로 길게 뻗은 꽤 넓은 실험실이다. 방 동쪽에는 철창 우리가 놓여 있다. 여기 있는 금속 탁자는 비어 있지만, 먼지 위에 남은 자국으로 보아 한때 책들이 놓여 있었던 것 같다.
- id: tba:62:room:6243
  field: name
  en: A Tunnel Forking
  ko: 갈림길 터널
  verdict: awkward
  note: '''갈림길 터널''은 명사를 그냥 이어 붙인 표현이라 어색하다.'
  fix: 갈라지는 터널
- id: tba:62:room:6242
  field: description
  en: You are half blinded by the differences of the outdoors illumination and the pure darkness of the cave.  A deep, cloying
    stench flows out from the cave mouth; the smells of decay, unwashed bodies, and sickness in one roiling odor.  Your stomach
    turns involuntarily, and you wonder about going back down the hill to the east, instead of going even further down the
    western tunnel.
  ko: 야외의 밝은 빛과 동굴 속의 칠흑 같은 어둠의 차이 때문에 당신의 시야가 거의 가려진다. 동굴 입구에서 썩은 냄새, 씻지 않은 몸의 냄새, 병든 냄새가 뒤섞인 역겨운 악취가 흘러나온다. 당신의 위가 본능적으로
    뒤집히고, 서쪽 터널을 더 깊이 들어가는 대신 동쪽 언덕 아래로 돌아가는 것이 나을지 고민이 된다.
  verdict: awkward
  note: '''half blinded''는 ''거의 가려진다''가 아니라 ''반쯤 먼''이다. ''involuntarily''를 ''본능적으로''로 옮긴 것과 ''고민이 된다''도 직역투다.'
  fix: 바깥의 밝은 빛과 동굴 속 칠흑 같은 어둠의 차이 때문에 눈이 반쯤 먼 것 같다. 동굴 입구에서 썩은 냄새, 씻지 않은 몸 냄새, 병자의 냄새가 한데 뒤엉킨 진하고 역한 악취가 흘러나온다. 저도 모르게 속이
    뒤집히고, 서쪽 터널로 더 깊이 들어가느니 차라리 동쪽 언덕 아래로 돌아갈까 하는 생각이 든다.
- id: tba:62:room:6215
  field: description
  en: The river flows on its course, unhampered by the energy barrier passing right down its center for as far as you can
    see in both directions.  The path you are on travels along the length of the river to the east and west in between the
    water and the forest's edge.  Once again you shiver and feel that unmistakeable sense that you are being watched.  Disturbing.
  ko: 강은 그 흐름을 계속하며, 양쪽으로 보이는 한계까지 강 중앙을 따라 에너지 장벽이 지나간다. 당신이 있는 오솔길은 물과 숲 가장자리 사이를 따라 동서 방향으로 강을 따라 이어진다. 다시 한번 당신은 소름이 돋으며,
    누군가에게 감시당하고 있다는 그 unmistakable한 느낌을 느낀다. 섬뜩하다.
  verdict: wrong
  note: 영어 단어 'unmistakable'이 번역되지 않고 남아 있다. 장벽이 물의 흐름을 막지 않는다는 'unhampered'의 의미도 빠졌다.
  fix: 강은 제 물길을 따라 흐른다. 눈이 닿는 데까지 양쪽으로 에너지 장벽이 강 한가운데를 따라 뻗어 있지만, 물의 흐름은 아무 방해도 받지 않는다. 당신이 서 있는 오솔길은 물과 숲 가장자리 사이로 강을 따라
    동서로 이어진다. 다시 한번 몸이 떨리며, 누군가 지켜보고 있다는 틀림없는 느낌이 든다. 섬뜩하다.
- id: tba:62:room:6264
  field: exits.west.look
  en: A steel cell door.
  ko: 강철 감방 문이 보인다.
  verdict: awkward
  note: 문 묘사에 원문에 없는 '보인다'가 붙었다. 25번('평범한 나무 문이다.')과 문체도 어긋난다.
  fix: 강철로 된 감방 문이다.
- id: tba:62:room:6260
  field: exits.east.look
  en: A steel cell door.
  ko: 강철 감방 문이 보인다.
  verdict: awkward
  note: 21번과 같다. '보인다'가 덧붙었다.
  fix: 강철로 된 감방 문이다.
- id: tba:62:room:6225
  field: description
  en: This trail leads east-west through the forest foliage, around the trees and up and down the slight rises.  The area
    is quiet and serene, except for the energy barrier keeping you in to the south.  For just a moment, you wonder if you're
    still being watched...
  ko: 이 오솔길은 숲의 나뭇잎 사이를 동서 방향으로 지나가며, 나무들을 돌아다니고 완만한 언덕을 오르내린다. 남쪽에 당신을 가두어 두는 에너지 장벽을 제외하면, 이 지역은 고요하고 평화롭다. 잠시 동안, 당신이 여전히
    누군가의 감시를 받고 있는 것은 아닌지 궁금해진다...
  verdict: awkward
  note: '''나무들을 돌아다니고''와 ''잠시 동안 ... 궁금해진다''가 직역투다.'
  fix: 이 오솔길은 우거진 숲 사이로 동서로 나 있으며, 나무들 사이를 굽이돌고 완만한 둔덕을 오르내린다. 남쪽에서 당신을 가두고 있는 에너지 장벽만 빼면, 이곳은 조용하고 평화롭다. 문득, 아직도 누군가 지켜보고
    있는 건 아닐까 하는 생각이 스친다...
- id: tba:62:mob:6204
  field: description
  en: He wears a crown of oak leaves to show he is a leader.  He carries a club to show he is a warrior.  You wonder how good
    he is at both.
  ko: 그는 지도자임을 보여주기 위해 참나무 잎으로 만든 왕관을 쓰고 있다. 전사임을 보여주기 위해 몽둥이를 들고 있다. 두 가지를 모두 얼마나 잘하는지 궁금해진다.
  verdict: awkward
  note: 참나무 잎으로 엮은 관에 '왕관'은 지나치다. 부족장의 잎관이므로 '관'이 자연스럽다.
  fix: 그는 지도자임을 드러내려고 참나무 잎으로 엮은 관을 쓰고 있다. 전사임을 드러내려고 몽둥이를 들고 있다. 둘 다 얼마나 잘하는지 궁금해진다.
- id: tba:62:room:6206
  field: extras.0.text
  en: You can faintly see the woods continue beyond it, but it seems there's no way through.  The field rises high up into
    the air, and seems to form a ceiling above the woods, preventing a flying entrance.  You'd also bet it extends deep into
    the ground.
  ko: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고 있다. 또한 땅속 깊이까지 뻗어 있을
    것이라고 단정할 수 있다.
  verdict: wrong
  note: '''You''d also bet''은 ''틀림없이 그럴 것 같다''는 추측인데, ''단정할 수 있다''로 옮겨 확신으로 바뀌었다. ''seems to form''의 ''~듯하다''도 빠졌다.'
  fix: 장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 지나갈 길은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어가는 것도 막고 있다. 땅속 깊이까지 뻗어 있을
    것도 틀림없어 보인다.
- id: tba:62:mob:6209
  field: long
  en: A horribly mutated orc stands here, gibbering.
  ko: 끔찍하게 돌연변이가 된 오크가 여기 서서 횡설수설하고 있다.
  verdict: awkward
  note: '''돌연변이가 된 오크''는 어색하다. ''변이된''이 더 자연스럽다.'
  fix: 끔찍하게 변이된 오크가 여기 서서 횡설수설하고 있다.
- id: tba:62:room:6259
  field: description
  en: A full fledge operating table is set up here, outfitted with a full set of restraints.  A ledge nearby has a whole array
    of sterile medical equipment on it, covered over by a clear lid.  There's a drain in the floor with gradients leading
    to it to carry away the blood.  For some reason, you don't imagine this as a voluntary operating theater...
  ko: 여기에는 완비된 수술대가 설치되어 있으며, 온갖 종류의 고정 장치가 갖춰져 있다. 근처 선반에는 멸균된 의료 장비가 일렬로 놓여 있고, 투명한 뚜껑으로 덮여 있다. 바닥에는 배수구가 있으며, 피를 흘려보내기
    위해 그쪽으로 기울어진 경사가 있다. 왠지 당신은 이것이 자발적인 수술 무대라고는 상상할 수 없다...
  verdict: wrong
  note: '''a whole array of''는 ''다양한·잔뜩''이라는 뜻인데 ''일렬로''로 오역했다. ''operating theater''는 ''수술실''인데 ''수술 무대''로 오역했다. ''full set
    of restraints''도 ''온갖 종류''가 아니라 ''결박 장치 일체''라는 뜻이다.'
  fix: 여기에는 제대로 갖춘 수술대가 놓여 있고, 결박 장치가 빠짐없이 달려 있다. 근처 선반에는 멸균된 의료 기구가 잔뜩 놓여 있고, 투명한 뚜껑으로 덮여 있다. 바닥에는 배수구가 있으며, 피가 흘러 나가도록 그쪽으로
    경사가 져 있다. 왠지 이곳이 제 발로 찾아오는 수술실 같지는 않다...
- id: tba:62:room:6226
  field: description
  en: The trail bends here, leading away to the north and east.  Far off the the distance you hear the squawk of a large bird-of-prey
    searching the skies for a meal.  The ferns around you rustle gently in the light breeze. Somehow, the threatening aura
    that pervades over the rest of the area seems absent here.  You feel almost relaxed...
  ko: 오솔길이 여기서 꺾여 북쪽과 동쪽으로 이어진다. 멀리서 큰 맹금류가 먹이를 찾아 하늘을 수색하는 비명을 듣는다. 당신 주위의 양치식물들은 가벼운 바람에 살랑살랑 흔들린다. 어째서인지, 나머지 지역을 감돌던 위협적인
    기운은 여기에는 없는 것 같다. 당신은 거의 이완된 느낌을 받는다...
  verdict: wrong
  note: 새의 'squawk'(울음소리)를 '비명'으로 오역했다. '~를 듣는다', '당신 주위의', '이완된 느낌을 받는다'는 직역투라 부자연스럽다.
  fix: 오솔길이 여기서 꺾여 북쪽과 동쪽으로 이어진다. 멀리서 큰 맹금류가 먹이를 찾아 하늘을 뒤지며 우는 소리가 들려온다. 주위의 양치식물이 산들바람에 살랑살랑 흔들린다. 어째서인지 이 일대를 감도는 위협적인 기운이
    여기에는 없는 듯하다. 마음이 거의 놓일 것만 같다...
- id: tba:62:room:6222
  field: description
  en: A smaller northern path leads away from the main east- west trail here towards a clearing.  The main path leads windingly
    around the trees to the east and west, the woods blocking out whatever may be ahead.  Again you get that strange feeling
    of being watched.
  ko: 여기서 더 작은 북쪽 길이 주요 동서 오솔길에서 벗어나 빈터 쪽으로 이어진다. 주요 길은 나무들을 돌아 동서로 굽이쳐 이어지고, 숲이 앞길에 무엇이 있는지 가려 버린다. 또다시 누군가 자신을 지켜보고 있다는
    이상한 느낌이 든다.
  verdict: awkward
  note: '''주요 길'', ''주요 동서 오솔길''은 딱딱한 번역투다. ''자신을''은 플레이어를 가리키므로 어색하며, 주어를 생략하거나 ''당신을''로 써야 한다.'
  fix: 여기서 동서로 난 큰 오솔길로부터 좁은 길이 북쪽으로 갈라져 빈터 쪽으로 이어진다. 큰길은 나무들을 돌아 동서로 굽이쳐 이어지고, 숲에 가려 앞에 무엇이 있는지 보이지 않는다. 또다시 누군가 지켜보고 있는
    듯한 이상한 느낌이 든다.
