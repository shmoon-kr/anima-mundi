- id: tba:62:room:6218
  field: description
  en: This trail leads north-south... obviously a gaming trail.  The woods, mostly deciduous trees with the accompanying ground
    foliage, crowd in to either side. A shrub to your left shows a fresh cutting wound... looks like a sharp object like a
    knife or machete did the damage. / A crackle in the leaves spins you around, to see nothing.  Something is watching you,
    you feel it. Where?
  ko: 이 오솔길은 남북 방향으로 뻗어 있다... 분명 사냥꾼들이 다니는 길이다. 대부분 낙엽수인 나무들과 함께 자라는 풀숲이 양쪽을 가득 메우고 있다. 왼쪽에 있는 관목에 신선한 베인 자국이 보인다... 칼이나 마체테
    같은 날카로운 물건으로 베인 것 같다. / 잎사귀가 바스락거리는 소리에 돌아보니 아무것도 없다. 무언가가 당신을 지켜보고 있다는 느낌이 든다. 어디에?
  verdict: wrong
  note: '''gaming trail''(game trail)은 짐승이 다니는 길이다. 사냥꾼의 길이 아니다. ''fresh cutting wound''의 ''신선한''은 어색하므로 ''갓 베인''으로 고쳤다. ''Where?''는
    ''어디서?''가 자연스럽다.'
  fix: 이 오솔길은 남북으로 뻗어 있다... 누가 봐도 짐승들이 다니는 길이다. 대부분 낙엽수인 나무들과 그 아래 자라는 덤불이 양옆으로 빽빽하게 들어차 있다. 왼쪽 관목에 갓 베인 자국이 보인다... 칼이나 마체테
    같은 날카로운 물건에 베인 것 같다. / 낙엽이 바스락거리는 소리에 휙 돌아보지만 아무것도 없다. 무언가가 당신을 지켜보고 있다. 느낌으로 안다. 어디서?
