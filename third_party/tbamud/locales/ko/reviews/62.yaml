- id: tba:62:room:6252
  field: description
  en: This must be the orc chief's area.  There's an old prize -- a stolen timeworn human armchair sitting near the south
    wall as a throne.  A mammoth sleeping pallet made of piled furs is nearby.  Next to that is the pile of orc treasure;
    a pile of well-polished coppers.  You look at the pile of worthless coins and wonder at the image of orcish raiders. /
    These orcs aren't raiders, they are victims.
  ko: 여기가 바로 오크 족장의 영역인 것 같다. 남쪽 벽 근처에 오래된 전리품으로 보이는, 낡고 마모된 인간의 안락의자가 왕좌처럼 놓여 있다. 그 옆에는 두꺼운 모피를 겹쳐 만든 거대한 수면용 이불이 있다. 그 옆에는
    오크의 보물이라고 불리는, 반짝반짝하게 닦인 구리 동전 더미가 쌓여 있다. 당신은 이 쓸모없는 동전 더미를 바라보며, 오크 약탈꾼들의 이미지에 대해 의문을 품는다. / 이 오크들은 약탈꾼이 아니다. 그들은 피해자다.
  verdict: wrong
  note: '''stolen''(훔쳐 온)이 빠졌고 ''오크의 보물이라고 불리는''은 원문에 없는 말이다. ''sleeping pallet''은 이불이 아니라 깔고 자는 잠자리다. ''must be''는 추측보다 확신에
    가깝다. ''그 옆에는''도 두 번 반복된다.'
  fix: 여기는 오크 족장의 거처임이 틀림없다. 남쪽 벽 근처에는 오래된 전리품인, 훔쳐 온 낡은 인간용 안락의자가 왕좌처럼 놓여 있다. 그 가까이에는 모피를 쌓아 만든 거대한 잠자리가 있다. 그 옆에는 오크의 보물
    더미, 곧 반들반들하게 닦인 구리 동전 더미가 있다. 당신은 쓸모없는 동전 더미를 바라보며 오크 약탈꾼이라는 이미지에 의문을 품는다. / 이 오크들은 약탈꾼이 아니라 피해자다.
