- id: tba:62:room:6216
  field: description
  en: A large out-cropping of rock blocks this path along the river to the west, and you don't spot any way around it; the
    woods are too thick to the south, the river too swift to the north, the magical barrier above you.  This is a nice area,
    however, as evidenced by the amount of traffic this path gets.  From the marks in the grass, you guess that this is a
    favored resting spot.
  ko: 서쪽, 강을 따라 이어지는 이 오솔길을 거대한 바위 덩어리가 가로막고 있다. 우회할 만한 길은 보이지 않는다. 남쪽은 숲이 너무 짙고, 북쪽은 강물이 너무 거세며, 머리 위에는 마법 장벽이 쳐져 있다. 하지만
    이 곳은 꽤 좋은 장소인 듯하다. 이 오솔길을 지나는 발자국이 그 증거다. 풀에 남은 자국으로 보아, 이곳은 사람들이 즐겨 쉬어 가는 곳인 것 같다.
  verdict: wrong
  note: '''사람들이''는 원문에 없는 주어다. 이 존의 주민은 오크일 수 있다. ''amount of traffic''을 ''발자국이 그 증거다''로 옮긴 것도 의미가 좁아졌다. ''이 곳''은 ''이곳''으로
    붙여 써야 한다.'
  fix: 서쪽으로 강을 따라 이어지는 이 길을 커다란 바위 덩어리가 가로막고 있는데, 돌아갈 길은 보이지 않는다. 남쪽은 숲이 너무 빽빽하고, 북쪽은 강물이 너무 거세며, 머리 위에는 마법 장벽이 있다. 그래도 이곳은
    꽤 괜찮은 곳이다. 이 길을 많이 오간 흔적만 봐도 알 수 있다. 풀에 남은 자국으로 보아 이곳은 즐겨 쉬어 가는 자리인 것 같다.
