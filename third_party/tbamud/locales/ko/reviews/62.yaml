- id: tba:62:mob:6212
  field: description
  en: It might've been an orc, once.  Now it is a living terror, pushing everything out of its way to get at you.
  ko: 언젠가는 오크였을지도 모른다. 하지만 지금은 살아있는 공포 그 자체로, 당신에게 닿기 위해 모든 것을 밀어내며 앞으로 나아간다.
  verdict: awkward
  note: '''언젠가는''은 미래로 읽히기 쉽다. 과거를 뜻하는 ''once''는 ''한때는''으로 옮겨야 한다. 뒷문장도 다소 늘어진다.'
  fix: 한때는 오크였을지도 모른다. 하지만 지금은 살아 있는 공포 그 자체로, 당신에게 달려들려고 길을 막는 것은 무엇이든 밀쳐 낸다.
