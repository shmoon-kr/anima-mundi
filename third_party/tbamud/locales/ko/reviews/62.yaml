- id: tba:62:room:6233
  field: description
  en: The ground is growing more rocky here.  The trees and other foliage in the forest grow sparse here, finding it hard
    to find purchase in the soil.   The forest ends just to the west, with the trail you are on leading right on up to the
    side of the mountains.  A side trail leads south here, and the trail also leads back into the thick of the forest to the
    east.
  ko: 여기서는 땅이 점점 더 바위투성이로 변한다. 숲속의 나무와 다른 식물은 뿌리를 내리기 어려워하며 드물게 자란다. 서쪽 바로 앞에서는 숲이 끝나고, 당신이 걷고 있는 오솔길은 산의 측면으로 곧장 이어진다. 여기서는
    작은 오솔길이 남쪽으로 나 있으며, 동쪽으로는 오솔길이 다시 숲의 깊은 곳으로 이어진다.
  verdict: awkward
  note: '''여기서''가 반복되고 ''side trail''을 ''작은 오솔길''로 옮겨 어색하다. ''샛길''이 적절하다. ''side of the mountains''는 ''산비탈''이 자연스럽다.'
  fix: 이곳은 땅이 점점 더 바위투성이가 된다. 숲의 나무와 다른 식물들은 흙에 뿌리를 내리기 어려운지 듬성듬성 자란다. 바로 서쪽에서 숲이 끝나고, 당신이 걷는 오솔길은 산비탈까지 곧장 이어진다. 여기서 샛길 하나가
    남쪽으로 나 있고, 오솔길은 동쪽으로 다시 울창한 숲속으로 이어진다.
