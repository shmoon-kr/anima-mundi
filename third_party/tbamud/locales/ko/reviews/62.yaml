- id: tba:62:room:6214
  field: description
  en: A beautiful river flows swiftly by, the current looking quite dangerous in fact.  Out in the center of the river you
    spot the energy barrier enclosure... no way out here. Looking up, you see a bird fly right through the barrier overhead
    and wonder as to the force field's nature.  This path leads south into the forest, and westwards along the river's edge.
  ko: 아름다운 강이 빠르게 흐르고, 물살은 사실 꽤 위험해 보인다. 강 중앙에는 에너지 장벽으로 둘러싸인 구역이 보인다... 여기서 나갈 방법은 없다. 고개를 들자, 새 한 마리가 머리 위를 날아가며 장벽을 그대로
    통과하는 것을 보고, 그 힘의 장벽이 무엇인지 궁금해진다. 이 오솔길은 남쪽으로 숲속으로 이어지고, 서쪽으로는 강가를 따라 이어진다.
  verdict: wrong
  note: '''energy barrier enclosure''는 장벽 울타리 자체가 강 한가운데를 지난다는 뜻이다. ''장벽으로 둘러싸인 구역''으로 옮기면 의미가 달라진다. ''사실''은 직역투이고, ''남쪽으로
    숲속으로''처럼 ''으로''가 겹쳐 어색하다.'
  fix: 아름다운 강이 빠르게 흘러간다. 실은 물살이 꽤 위험해 보인다. 강 한가운데에 에너지 장벽의 경계가 보인다... 이쪽으로는 빠져나갈 수 없다. 고개를 들어 보니 새 한 마리가 머리 위 장벽을 그대로 뚫고 날아가고,
    당신은 이 역장의 정체가 궁금해진다. 이 길은 남쪽으로는 숲속까지, 서쪽으로는 강가를 따라 이어진다.
