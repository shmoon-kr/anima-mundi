- id: tba:101:room:10117
  field: description
  en: You are walking on the south road between the city and Haven.  It continues to the north and south while to the east,
    your path and view are blocked by a formation of rocks.  To the west grassy plains stretch as far as you can see.
  ko: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있다. 이 도로는 북쪽과 남쪽으로 이어지며, 동쪽에는 바위 지형이 당신의 길과 시야를 가로막고 있다. 서쪽으로는 눈이 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다.
  verdict: awkward
  note: '''눈이 닿는 한계까지''는 ''as far as you can see''를 직역한 딱딱한 표현이다.'
  fix: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있다. 도로는 북쪽과 남쪽으로 이어지며, 동쪽은 바위 무더기가 길과 시야를 가로막고 있다. 서쪽으로는 눈길이 닿는 데까지 풀이 우거진 평원이 펼쳐져 있다.
- id: tba:101:room:10120
  field: description
  en: You are walking on the south road, somewhere between the city and Haven. The road continues east and west from here
    while to the north, your view and path are blocked by a small formation of rocks.  In the distance to the south you can
    barely see the beginning of a seemingly ancient dense forest.
  ko: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있다. 이 도로에서 동서로 이어지며, 북쪽으로는 작은 바위 덩어리가 시야와 길을 가로막고 있다. 남쪽 멀리로는 고대처럼 보이는 울창한 숲의 시작 부분이 희미하게
    보인다.
  verdict: wrong
  note: '''somewhere''(어딘가)가 빠졌다. ''이 도로에서 동서로 이어지며''는 주어가 없어 문장이 성립하지 않는다. 원문은 ''길은 여기서 동서로 이어진다''는 뜻이다. ''barely''는 ''겨우''가
    더 정확하다.'
  fix: 당신은 도시와 헤이븐 사이 어딘가의 남쪽 도로를 걷고 있다. 도로는 여기서 동쪽과 서쪽으로 이어지며, 북쪽은 작은 바위 무더기가 시야와 길을 가로막고 있다. 남쪽 멀리로 아주 오래되어 보이는 울창한 숲의 초입이
    겨우 보인다.
- id: tba:101:room:10101
  field: description
  en: You are just south of the gates to a city.  A gust of warm wind blows in from the east warning you that the desert isn't
    far off in that direction.  The road leads off to the south, and north into the capital.  To the east and west farmland
    stretches as far as you can see.
  ko: 당신은 도시의 성문 바로 남쪽에 서 있다. 동쪽에서 불어오는 따뜻한 바람이 그 방향으로 사막이 그리 멀지 않음을 경고한다. 길은 남쪽으로 뻗어 있고, 북쪽으로는 수도로 이어진다. 동쪽과 서쪽으로는 시야가 닿는
    한계까지 농지가 펼쳐져 있다.
  verdict: awkward
  note: 바람이 '경고한다'는 직역투이다. '시야가 닿는 한계까지'도 딱딱하다.
  fix: 당신은 도시의 성문 바로 남쪽에 서 있다. 동쪽에서 따뜻한 바람이 훅 불어와 그쪽으로 사막이 멀지 않음을 알려 준다. 길은 남쪽으로 뻗어 있고, 북쪽으로는 수도로 이어진다. 동쪽과 서쪽으로는 눈길이 닿는 데까지
    농지가 펼쳐져 있다.
