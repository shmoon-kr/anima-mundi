- id: tba:101:mob:10112
  field: description
  en: He reeks of homemade moonshine, most likely made from corn.  He is the typical hillbilly, and fits his name to a tee.
  ko: 그는 아마 옥수수로 만든 자작주의 냄새가 진동한다. 그는 전형적인 산골 촌놈이며, 그의 이름은 그에게 딱 들어맞는다.
  verdict: wrong
  note: '''moonshine''을 ''자작주''로 잘못 옮겼다. ''그는 ... 냄새가 진동한다''는 주어 호응이 틀렸고 ''그에게서''가 맞다. ''그의 이름은 그에게 딱 들어맞는다''는 반복이 많아 어색하다.'
  fix: 그에게서 아마도 옥수수로 빚었을 집에서 담근 밀주 냄새가 진동한다. 전형적인 산골 촌뜨기로, 이름이 그에게 딱 어울린다.
