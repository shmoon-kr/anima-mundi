  ko: 강이 북쪽으로 굉음을 내며 흐른다. 당신은 동쪽이나 서쪽으로만 나갈 수 있다. 동쪽으로는 북쪽 길과 강을 건너기 위한 것으로 보이는 다리가 보인다.
  verdict: wrong
  note: '''roars past you to the north''는 강이 당신의 북쪽에 있다는 뜻이다. ''북쪽으로 흐른다''는 흐름의 방향을 뜻하므로 오역이다.'
  fix: 당신의 북쪽에서 강물이 굉음을 내며 흘러간다. 당신은 동쪽이나 서쪽으로만 나갈 수 있다. 동쪽으로는 북쪽 길과 강을 건너기 위한 것으로 보이는 다리가 보인다.
- id: tba:100:room:10067
  field: description
  en: More pine, fir and cedar trees make you push limbs aside and force your way through the underbrush.  Cobwebs cling to
    your face and sticks keep seeming to try to poke you in the eye.
  ko: 더 많은 소나무, 전나무, 측백나무가 당신을 가로막아 가지를 밀어내며 덤불 사이로 몸을 밀어 넣어야 한다. 거미줄이 얼굴에 달라붙고, 가시가 계속 당신의 눈을 찌르려 든다.
  verdict: wrong
  note: cedar를 측백나무로 옮겼다(삼나무가 맞다). sticks를 '가시'로 옮겼는데 나뭇가지다. 첫 문장은 주어와 서술이 엉켜 어색하다.
  fix: 소나무와 전나무, 삼나무가 점점 더 빽빽해져, 당신은 가지를 밀어젖히며 덤불을 헤치고 나아가야 한다. 거미줄이 얼굴에 달라붙고, 잔가지들이 자꾸만 당신의 눈을 찌르려 드는 것 같다.
- id: tba:100:room:10044
  field: description
  en: You stand at the southeast corner of the pond, surrounded by swamp, except to the south and west that appear to be where
    the northern road works its way around this marsh.  The smell of decomposition is strong here.
  ko: 당신은 연못의 남동쪽 구석에 서 있다. 남쪽과 서쪽을 제외하면 사방이 늪으로 둘러싸여 있으며, 북쪽의 길이 이 습지를 우회하는 곳으로 보인다. 여기서는 부패한 냄새가 강하게 풍긴다.
  verdict: awkward
  note: '''남쪽과 서쪽이 북쪽 길이 지나는 곳''이라는 관계가 흐려져 문장의 주어가 불분명하다. 연못의 ''구석''과 ''부패한 냄새''도 부자연스럽다. 고유 지명 the northern road는 ''북쪽 길''로
    통일한다.'
  fix: 당신은 연못의 남동쪽 끝에 서 있다. 남쪽과 서쪽을 제외한 사방이 늪으로 둘러싸여 있는데, 남쪽과 서쪽은 북쪽 길이 이 습지를 돌아 지나가는 곳인 듯하다. 여기서는 썩는 냄새가 강하게 풍긴다.
- id: tba:100:mob:10010
  field: description
  en: This large scaly creature has a set of jaws on it that make you take a few steps back.  It looks extremely tough and
    you doubt many weapons could penetrate that thick hide.
  ko: 이 거대한 비늘을 가진 생물의 악력 있는 턱을 보니 몇 걸음 뒤로 물러나게 된다. 매우 단단해 보이며, 두꺼운 가죽을 뚫을 수 있는 무기가 많지 않을 것 같아 의심스럽다.
  verdict: wrong
  note: 원문에 없는 '악력 있는'을 덧붙였다. '의심스럽다'는 you doubt를 직역한 표현이라 어색하다.
  fix: 비늘로 뒤덮인 이 커다란 생물의 턱을 보니 저도 모르게 몇 걸음 물러서게 된다. 무척 단단해 보여서, 저 두꺼운 가죽을 뚫을 수 있는 무기는 거의 없을 것 같다.
- id: tba:100:obj:10004
  field: short
  en: the pond
  ko: 웅덩이
  verdict: wrong
  note: pond는 '연못'이다. '웅덩이'는 고인 물구덩이를 뜻하고, 같은 존의 '연못 곁'과도 어긋난다.
  fix: 연못
- id: tba:100:room:10094
  field: description
  en: You stand before the towering city walls of the minotaurs.  The forest has been cut back away from the walls to allow
    good visibility for defense.  The gate of the city must be to the east.
  ko: 당신은 미노타우르들의 거대한 도시 성벽 앞에 서 있다. 방어 시 시야 확보를 위해 성벽 근처의 숲은 잘려나갔다. 도시의 문은 동쪽에 있을 것이다.
  verdict: wrong
  note: minotaur를 '미노타우르'로 옮겨 다른 항목의 '미노타우로스'와 어긋난다. towering은 '거대한'보다 '높이 솟은'이 맞다. '숲은 잘려나갔다'도 어색하다.
  fix: 당신은 높이 솟은 미노타우로스들의 도시 성벽 앞에 서 있다. 방어할 때 시야를 확보하려고 성벽 주변의 숲을 베어 냈다. 도시의 성문은 동쪽에 있을 것이다.
- id: tba:100:room:10069
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: Deep Forest와 짝을 이루는 Light Forest의 light는 '나무가 성긴'이라는 뜻이다. '밝은'은 오역이다.
  fix: 성긴 숲
- id: tba:100:room:10001
  field: description
  en: You stop and stare at the decrepit bundle of sticks that must be where some recluse hermit lives.  You can't imagine
    living out here, beyond the safety of the city walls.  Thick forests block any exit to the north and you can see the city
    wall to the south.
  ko: 당신은 발걸음을 멈추고, 어떤 은둔자가 살고 있을 법한 이 썩어빠진 나뭇가지 더미를 멍하니 바라본다. 도시 성벽의 안전함 너머, 이런 곳에서 살아가는 상상이 되지 않는다. 북쪽으로는 짙은 숲이 모든 출구를 막아
    서 있고, 남쪽으로는 도시 성벽이 보인다.
  verdict: awkward
  note: decrepit을 '썩어빠진'으로 옮기면 비하하는 어감이 생긴다. '멍하니'는 원문에 없다. '안전함 너머 … 상상이 되지 않는다', '출구를 막아 서 있고'는 직역투다. must be의 확신도 약해졌다.
  fix: 당신은 걸음을 멈추고, 어느 은둔자가 사는 곳임이 틀림없는 다 쓰러져 가는 나뭇가지 더미를 바라본다. 도시 성벽의 보호를 벗어난 이런 곳에서 산다는 건 상상도 할 수 없다. 북쪽은 울창한 숲이 가로막아 나갈
    길이 없고, 남쪽으로는 도시 성벽이 보인다.
- id: tba:100:room:10014
  field: description
  en: The forest is too thick to see more than a few feet.  Trees and brush block the exits to the north and east.  You start
    to wonder if someone could be spying on you.  Someone could be standing behind any one of these huge trees and you would
    never know.
  ko: 숲이 너무 짙어 몇 미터 앞도 볼 수 없다. 나무와 덤불이 북쪽과 동쪽의 출구를 막고 있다. 누군가 당신을 엿보고 있는 것은 아닌지 걱정되기 시작한다. 이 거대한 나무 중 하나 뒤에 누군가가 서 있을 수도 있고,
    당신은 절대 알지 못할 것이다.
  verdict: awkward
  note: 의미는 맞다. 다만 '출구', '당신은 절대 알지 못할 것이다'가 직역투로 딱딱하다.
  fix: 숲이 너무 울창해서 몇 걸음 앞도 보이지 않는다. 나무와 덤불이 북쪽과 동쪽으로 가는 길을 막고 있다. 누군가 당신을 몰래 지켜보고 있는 건 아닐까 하는 생각이 들기 시작한다. 이 거대한 나무들 중 어느 뒤에
    누가 서 있어도 당신은 결코 알아차리지 못할 것이다.
- id: tba:100:room:10052
  field: description
  en: The smell here is overpowering.  The stench of stagnant water and rot makes your eyes tear.  The swamp continues to
    the south.  To the west you can see a body of water.
  ko: 여기서는 냄새가 너무 진하다. 고인 물과 썩은 냄새가 당신의 눈물을 자아낸다. 늪은 남쪽으로 이어진다. 서쪽으로는 물웅덩이가 보인다.
  verdict: wrong
  note: body of water(연못)를 '물웅덩이'로 옮겨 뜻이 작아졌다. overpowering은 '너무 진하다'로는 약하다. '눈물을 자아낸다'는 어색하다.
  fix: 이곳의 냄새는 숨이 막힐 지경이다. 고인 물과 썩은 것의 악취에 눈물이 날 정도다. 늪은 남쪽으로 이어진다. 서쪽으로는 넓은 물이 보인다.
- id: tba:100:room:10054
  field: extras.0.text
  en: It definitely is a corpse. But not human. As you look closer it seems it must have been a minotaur. You can just barely
    make out some horns and one leg floating in the muck has a hoove.
  ko: 분명히 시체다. 하지만 인간은 아니다. 더 가까이 들여다보니 미노타우로스가 아니었을까 싶다. 진흙탕에 떠 있는 뿔 일부와 발굽이 달린 한쪽 다리가 희미하게 보인다.
  verdict: awkward
  note: 뿔까지 진흙탕에 떠 있는 것처럼 읽히도록 두 요소를 한 구로 묶었다. '뿔 일부'도 부자연스럽다.
  fix: 분명히 시체다. 하지만 인간은 아니다. 더 가까이 들여다보니 미노타우로스였던 것 같다. 뿔 몇 개를 겨우 알아볼 수 있고, 진흙탕에 떠 있는 한쪽 다리에는 발굽이 달려 있다.
- id: tba:100:room:10027
  field: description
  en: The plains to the east are blocked by a large chasm. You doubt you could make your way across it.  The only way to continue
    is to the west or to the north. You can hear the sound of running water to the north.
  ko: 동쪽의 평원은 큰 협곡에 의해 막혀 있다. 당신은 그 협곡을 건너갈 수 있을지 의문이다. 계속 나아갈 수 있는 길은 서쪽이나 북쪽뿐이다. 북쪽에서 흐르는 물소리가 들린다.
  verdict: awkward
  note: '''당신은 … 의문이다''는 you doubt를 직역한 표현이다. ''협곡에 의해 막혀 있다''는 피동 직역투다.'
  fix: 동쪽의 평원은 큰 협곡에 가로막혀 있다. 그곳을 건너갈 수는 없을 것 같다. 계속 나아갈 수 있는 길은 서쪽이나 북쪽뿐이다. 북쪽에서 흐르는 물소리가 들린다.
- id: tba:100:room:10092
  field: description
  en: Although the forest seems thin in this part, you start feeling a sense of gloom and despair.  The woods seem to look
    darker by the minute.  Something is definitely wrong with this part of the woods, but you can not tell what.
  ko: 이쪽 숲은 비교적 드문드문한데, 당신은 점점 더 음울함과 절망감을 느끼기 시작한다. 숲은 한시도 안 되어 더 어둡게 보인다. 이 숲의 이 부분은 분명 뭔가 잘못되어 있지만, 그것이 무엇인지 당신은 알 수 없다.
  verdict: wrong
  note: by the minute를 '한시도 안 되어'로 옮긴 것은 오역이다('시시각각'이 맞다). '점점 더'는 원문에 없다. '이 숲의 이 부분'은 어색하다.
  fix: 이쪽 숲은 비교적 듬성듬성한데도, 당신은 음울함과 절망감을 느끼기 시작한다. 숲은 시시각각 더 어두워지는 것 같다. 숲의 이 일대에는 분명 뭔가 잘못된 것이 있지만, 그것이 무엇인지 당신은 알 수 없다.
- id: tba:100:room:10091
  field: description
  en: The northern road is just west of you.  To the north you can see the famed city of minotaurs.  The woods here are very
    dark and quiet.  Few creaturs seem to live in these parts.  A gloom seems to hang over this forest.
  ko: 북쪽 길은 바로 서쪽에 있다. 북쪽으로는 유명한 미노타우로스들의 도시가 보인다. 이곳의 숲은 매우 어둡고 고요하다. 이 일대에 사는 생물들은 거의 없는 듯하다. 이 숲에는 어둠이 내려앉아 있는 것 같다.
  verdict: awkward
  note: gloom은 이 문맥에서 '어둠'보다 '음울한 기운'에 가깝다. '어둠이 내려앉아 있는 것 같다'는 앞 문장의 '어둡고'와 겹친다.
  fix: 북쪽 길은 바로 서쪽에 있다. 북쪽으로는 유명한 미노타우로스들의 도시가 보인다. 이곳의 숲은 매우 어둡고 고요하다. 이 일대에 사는 생물은 거의 없는 듯하다. 이 숲에는 음울한 기운이 드리워져 있는 것 같다.
- id: tba:100:room:10082
  field: description
  en: The forest is thick and dismal.  The northern road is to the east while another smaller road lies to the west.  Small
    animals sit and stare at you instead of running away.  They must not be used to seeing trespassers.
  ko: 숲은 짙고 음산하다. 북쪽 가는 길은 동쪽에 있고, 더 작은 길 하나는 서쪽에 있다. 작은 동물들은 도망치지 않고 앉아 당신을 뚫어지게 쳐다본다. 무단 침입자를 보는 데 익숙하지 않은 모양이다.
  verdict: wrong
  note: 고유 지명 the northern road를 '북쪽 가는 길'로 옮겨 다른 항목의 '북쪽 길'과 어긋나고 뜻도 달라졌다.
  fix: 숲은 울창하고 음산하다. 동쪽에는 북쪽 길이 있고, 서쪽에는 그보다 작은 길이 하나 있다. 작은 동물들은 도망치지 않고 앉아 당신을 빤히 쳐다본다. 무단 침입자를 보는 데 익숙하지 않은 모양이다.
- id: tba:100:obj:10013
  field: short
  en: the ash
  ko: 재나무
  verdict: wrong
  note: ash(나무)는 '물푸레나무'다. '재나무'라는 나무는 없다.
  fix: 물푸레나무
- id: tba:100:room:10001
  field: name
  en: In Front of the Hermit's Cabin
  ko: 고독한 은둔자의 오두막 앞
  verdict: wrong
  note: 원문에 없는 '고독한'을 덧붙였다.
  fix: 은둔자의 오두막 앞
- id: tba:100:room:10003
  field: description
  en: The few animals in this part of the forest scatter as you walk by.  The forest is thickening slightly, a little less
    sunlight is making it to the forest floor.  Overhead you can hear birds chirping and squirrels chattering.  This place
    feels very peaceful.
  ko: 당신이 지나가자 이 숲의 일부에 있던 몇 마리의 짐승이 흩어진다. 숲이 조금 더 짙어지고, 숲 바닥까지 닿는 햇살이 조금 줄어든다. 머리 위에서는 새들이 지저귀고 다람쥐들이 까르르거리는 소리가 들린다. 이 곳은
    매우 평화롭게 느껴진다.
  verdict: wrong
  note: 다람쥐의 chattering을 사람 웃음소리인 '까르르거리다'로 옮겨 오역이다. 'few'의 뜻이 '몇 마리의'로 약해졌고, '이 숲의 일부에 있던'은 직역투다. '이 곳'은 '이곳'으로 붙여 써야 한다.
  fix: 당신이 지나가자 이 근방 숲에 있던 몇 안 되는 짐승들이 흩어진다. 숲이 조금씩 짙어져, 숲 바닥까지 닿는 햇살이 조금 줄어든다. 머리 위에서 새들이 지저귀고 다람쥐들이 재잘거리는 소리가 들린다. 이곳은 무척
    평화롭게 느껴진다.
- id: tba:100:room:10020
  field: description
  en: The forest is extremely dense through here.  The exits west and south are blocked by the thick brush.  To the north
    you can hear the roar of rushing water.  Animals seem to abound in this forest.  They keep distracting you.
  ko: 여기 숲은 매우 짙다. 서쪽과 남쪽 출구는 짙은 덤불에 막혀 있다. 북쪽에서는 물이 쏟아지는 소리가 들린다. 이 숲에는 동물들이 넘치는 것 같다. 자꾸만 당신의 주의를 분산시킨다.
  verdict: awkward
  note: '''roar of rushing water''의 우렁찬 느낌이 ''쏟아지는 소리''에서 빠졌다. 마지막 문장은 주어가 없고 ''주의를 분산시킨다''는 번역투다.'
  fix: 여기 숲은 무척 빽빽하다. 서쪽과 남쪽 출구는 무성한 덤불에 막혀 있다. 북쪽에서 세차게 흐르는 물소리가 우렁차게 들려온다. 이 숲에는 동물이 무척 많은 것 같다. 녀석들 때문에 자꾸만 정신이 흐트러진다.
- id: tba:100:room:10051
  field: description
  en: A small pond is just to the west.  The water looks murky and unclean.  To the north is more forest while east and south
    it looks a little swampy.  Small animals scatter as you intrude on their territory.
  ko: 작은 연못이 바로 서쪽에 있다. 물은 탁하고 더러운 것처럼 보인다. 북쪽으로는 더 많은 숲이 있고, 동쪽과 남쪽으로는 약간 늪지대처럼 보인다. 당신이 그들의 영역을 침범하자 작은 동물들이 흩어진다.
  verdict: awkward
  note: '''더 많은 숲이 있고''는 ''more forest''의 직역이다. ''그들의 영역''은 불필요한 대명사 직역이다.'
  fix: 작은 연못이 바로 서쪽에 있다. 물은 탁하고 더러워 보인다. 북쪽으로는 숲이 계속되고, 동쪽과 남쪽은 다소 늪지 같아 보인다. 당신이 영역을 침범하자 작은 동물들이 흩어진다.
- id: tba:100:mob:10002
  field: description
  en: Its cheeks are puffed out to the max and look like they are ready to explode. It must be gathering food to stash away
    for emergencies.  It's a small brown furry critter with black and white stripes running from the top of its head all the
    way down to its tail.
  ko: 볼이 최대한 부풀어 터질 것 같다. 비상시를 대비해 먹이를 저장하고 있는 것이다. 머리 꼭대기부터 꼬리 끝까지 검은색과 흰색 줄무늬가 있는 작고 갈색 털북숭이 짐승이다.
  verdict: awkward
  note: '''must be''의 추측이 ''저장하고 있는 것이다''라는 단정으로 바뀌었다. ''작고 갈색 털북숭이 짐승''은 문법이 어색하다.'
  fix: 볼이 한껏 부풀어 금방이라도 터질 것 같다. 비상시에 대비해 먹이를 모아 두려는 모양이다. 머리 꼭대기부터 꼬리까지 검고 흰 줄무늬가 길게 이어진, 작은 갈색 털북숭이 짐승이다.
- id: tba:100:room:10000
  field: name
  en: Inside a Small Cabin
  ko: 낡은 오두막 안
  verdict: wrong
  note: '''Small''을 ''낡은''으로 잘못 옮겼다.'
  fix: 작은 오두막 안
- id: tba:100:room:10087
  field: description
  en: This small road continues on through the plains or heads back to the northern road towards the minotaur city.  The confines
    of the forest seem to beckon you compared to the openness of the plains.
  ko: 이 작은 길은 평원을 가로지르거나, 미노타우로스 도시로 향하는 북쪽 도로로 되돌아간다. 평원의 탁 트인 풍경에 비해, 숲의 울창함이 당신을 부르는 듯하다.
  verdict: awkward
  note: '''continues on''의 뜻이 빠졌다. ''confines of the forest''는 ''울창함''보다 둘러싸인 아늑함에 가깝다. ''부르는''은 ''beckon''을 살려 ''손짓해 부르는''으로
    옮기는 편이 낫다.'
  fix: 이 작은 길은 평원을 가로질러 계속 이어지거나, 미노타우로스 도시로 향하는 북쪽 도로로 되돌아간다. 탁 트인 평원에 비해, 아늑하게 둘러싸인 숲이 당신을 손짓해 부르는 듯하다.
- id: tba:100:obj:10015
  field: short
  en: a fur backpack
  ko: 가죽 배낭
  verdict: wrong
  note: fur(모피, 털가죽)를 leather를 뜻하는 '가죽'으로 오역했다.
  fix: 모피 배낭
- id: tba:100:mob:10003
  field: description
  en: It looks more of a brown than red.  The fox is extremely alert with its ears coming to fine points listening for any
    sound of danger.  Its big bushy tail is a sure sign of its good health.  It saw you coming a mile away and does not seem
    very scared.
  ko: 붉은색이라기보다 갈색에 가깝다. 여우는 위험한 소리를 듣기 위해 귀 끝을 세운 채 극도로 경계하고 있다. 털이 풍성한 큰 꼬리는 건강한 상태임을 확실히 보여준다. 한참이나 멀리서 당신이 오는 것을 보았는지,
    별로 두려워하지 않는 것 같다.
  verdict: awkward
  note: '''위험한 소리를 듣기 위해''는 어색하다. 원문은 위험의 기척을 놓치지 않으려 귀를 기울인다는 뜻이다. ''건강한 상태임을 확실히 보여준다''는 번역투다.'
  fix: 붉은색이라기보다 갈색에 가깝다. 여우는 귀를 뾰족하게 세우고 위험을 알리는 작은 소리 하나도 놓치지 않으려 바짝 경계하고 있다. 털이 풍성한 큰 꼬리를 보면 건강한 것이 틀림없다. 한참 멀리서부터 당신이 오는
    것을 보고 있었는지, 별로 겁먹은 기색이 없다.
- id: tba:100:room:10086
  field: description
  en: This road is completely overgrown here.  You start to have to concentrate to keep track of where it goes.  It seems
    to be heading to the east toward the plains.  It also goes west toward the main road.
  ko: 이곳의 길은 완전히 잡초에 덮여 있다. 당신은 길이 어디로 이어지는지 파악하기 위해 집중해야 한다. 이 길은 동쪽, 평원 쪽으로 향하는 것 같다. 또한 서쪽으로는 주요 도로로 이어진다.
  verdict: awkward
  note: '''start to have to''의 뜻이 빠졌다. ''main road''를 ''주요 도로''로 옮긴 것은 딱딱하다. ''이 길은 ... 또한 ...'' 구성도 직역투다.'
  fix: 이곳의 길은 풀이 무성하게 자라 완전히 뒤덮여 있다. 길이 어디로 이어지는지 놓치지 않으려면 슬슬 정신을 바짝 차려야 한다. 길은 동쪽 평원 쪽으로 향하는 듯하다. 서쪽으로는 큰길로 이어진다.
- id: tba:100:room:10097
  field: description
  en: The walls tower above you.  Nothing seems to be moving up there, but you can not help but wonder if someone has a bow
    pointed at you from above.  You should probably move a little deeper into the woods away from the walls before you find
    out.
  ko: 성벽이 당신을 압도하듯 솟아 있다. 위쪽에서는 아무것도 움직이는 것 같지 않지만, 혹시 누군가 위에서 활을 당신에게 겨누고 있는 것은 아닌지 걱정된다. 그 사실을 확인하기 전에, 성벽에서 조금 더 숲 안쪽으로
    들어가는 것이 좋을 것이다.
  verdict: awkward
  note: '''그 사실을 확인하기 전에''는 ''before you find out''의 뉘앙스를 딱딱하게 옮겼다.'
  fix: 성벽이 당신을 압도하듯 솟아 있다. 위쪽에서는 아무것도 움직이지 않는 것 같지만, 혹시 누군가 위에서 당신에게 활을 겨누고 있는 것은 아닌지 마음이 쓰인다. 직접 알게 되기 전에, 성벽에서 떨어져 숲 안쪽으로
    조금 더 들어가는 편이 좋겠다.
- id: tba:100:room:10011
  field: description
  en: The northern road is made of hard dirt.  Packed solid from years of use from both travelers, merchants, and peddlers.  Wagon
    tracks leave small ruts in the road.  To the west is some thick woodlands, while to the east you think you can make out
    some plains in the distance.  The road continues north or south.
  ko: 북쪽 길은 단단한 흙으로 만들어져 있다. 여행객, 상인, 행상들이 수년간 이용해 온 덕분에 단단하게 다져져 있다. 수레 자국이 길 위에 작은 홈을 남겼다. 서쪽에는 짙은 숲이 있고, 동쪽으로는 멀리 평원이 보이는
    것 같다. 길은 북쪽이나 남쪽으로 이어진다.
  verdict: awkward
  note: '''흙으로 만들어져 있다''와 ''~덕분에 다져져 있다''는 번역투다. 수레 자국 문장도 부자연스럽다.'
  fix: 북쪽 길은 단단한 흙길이다. 여행자와 상인, 행상들이 수년간 오가며 단단하게 다져 놓았다. 길 위에는 수레바퀴 자국이 얕게 패어 있다. 서쪽에는 울창한 숲이 있고, 동쪽으로는 멀리 평원이 보이는 것 같다.
    길은 북쪽이나 남쪽으로 이어진다.
- id: tba:100:room:10066
  field: description
  en: Pine and fir trees are everywhere in this part of the woods.  You seem to have found some sort of trail leading north
    and south between them.  You brush past the trees thankful for the bed of pine needles that quiets your footsteps.
  ko: 숲의 이 부분은 소나무와 전나무로 가득 차 있다. 나무들 사이로 북쪽과 남쪽으로 이어지는 오솔길을 찾은 것 같다. 소나무 바늘로 덮인 바닥 덕분에 발소리가 조용히 가라앉아 고마울 따름이다.
  verdict: wrong
  note: '''You brush past the trees''가 누락되었다. ''pine needles''를 ''소나무 바늘''로 직역했는데, ''솔잎''이 맞다.'
  fix: 숲의 이쪽은 온통 소나무와 전나무다. 나무들 사이로 북쪽과 남쪽으로 이어지는 오솔길 같은 것을 찾은 듯하다. 당신은 나무들을 스치며 지나간다. 발소리를 죽여 주는 푹신한 솔잎 바닥이 고마울 따름이다.
- id: tba:100:room:10005
  field: description
  en: The forest along this part of the wall is thinnning out.  Further east it looks as if the forest disappears all together
    and turns into a grassy plain. Small innocent forest creatures abound in this healthy forest.
  ko: 이 성벽 일대의 숲은 점점 옅어지고 있다. 더 동쪽으로는 숲이 완전히 사라져 풀밭으로 변해 보인다. 이 건강한 숲에는 작고 무해한 숲의 생물들이 많다.
  verdict: awkward
  note: 숲에 '옅어지다'를 쓰는 것은 어색하다. '풀밭으로 변해 보인다'는 비문이다. 'innocent'는 '무해한'보다 '순한'이 자연스럽다.
  fix: 성벽을 따라 이어진 이 일대의 숲은 점점 성겨진다. 더 동쪽으로 가면 숲이 아예 사라지고 풀이 우거진 평원으로 바뀌는 것 같다. 이 건강한 숲에는 작고 순한 숲짐승들이 많다.
- id: tba:100:room:10039
  field: description
  en: The swamp clears up a little, tall healthy trees keep the soil under your feet firm.  The river to the south must be
    the outlet to the massive lake. You can only leave to the north or west.  It looks like swampland in both directions.
  ko: 습지가 조금씩 걷히며, 키가 크고 건강한 나무들이 발밑의 흙을 단단하게 잡아준다. 남쪽의 강은 거대한 호수의 출구일 것이다. 북쪽이나 서쪽으로만 나갈 수 있다. 두 방향 모두 습지처럼 보인다.
  verdict: wrong
  note: 호수의 'outlet'을 '출구'로 오역했다. 호수에서 흘러나가는 물줄기를 뜻한다. '습지가 걷히다'도 어색하다.
  fix: 늪이 조금 잦아들고, 키 크고 튼튼한 나무들 덕분에 발밑의 땅이 단단하다. 남쪽의 강은 거대한 호수에서 흘러나가는 물줄기임이 틀림없다. 북쪽이나 서쪽으로만 나갈 수 있다. 두 방향 모두 늪지대처럼 보인다.
- id: tba:100:mob:10007
  field: description
  en: This merchant looks like he has been travelling for some time between cities. He is definitely gifted at the art of
    selling useless junk that no one really needs.  He looks experienced and you wonder how many times he's had to defend
    himself being out in the wilderness like this.
  ko: 이 상인은 도시를 오가며 꽤 오랫동안 여행해 온 것처럼 보인다. 그는 아무도 필요로 하지 않는 쓸모없는 잡화를 파는 데 분명 재능이 있다. 그는 경험이 많아 보이며, 이런 황야에서 자신을 방어해야 했던 횟수가
    얼마나 될지 궁금해진다.
  verdict: awkward
  note: '''그는''이 반복된다. ''junk''를 ''잡화''로 옮겨 뉘앙스가 약하다. 문장 구성도 직역투다.'
  fix: 이 상인은 꽤 오랫동안 도시와 도시 사이를 떠돌아 온 것 같다. 아무도 딱히 필요로 하지 않는 쓸모없는 잡동사니를 파는 재주는 확실히 타고났다. 노련해 보이는 그를 보니, 이런 황야를 떠돌며 몇 번이나 스스로를
    지켜야 했을지 궁금해진다.
- id: tba:100:room:10073
  field: description
  en: The northern road turns to the east or south from here.  You notice another smaller road leading off to the north.  It
    looks like it has been rarely used. Which way to go?  How about the one less travelled?
  ko: 북쪽 길은 여기서 동쪽이나 남쪽으로 꺾인다. 북쪽으로 나가는 또 다른 작은 길이 눈에 들어온다. 거의 사용되지 않는 것처럼 보인다. 어느 쪽으로 갈 것인가? 덜 다닌 길을 가보는 것은 어떨까?
  verdict: awkward
  note: 길에 '사용되지 않는'과 '나가는'을 쓰는 것은 어색하다. 'smaller'의 비교 뉘앙스도 빠졌다.
  fix: 북쪽 길은 여기서 동쪽이나 남쪽으로 꺾인다. 북쪽으로 뻗어 나간 좀 더 작은 길이 하나 눈에 띈다. 사람이 거의 다니지 않은 듯하다. 어느 쪽으로 갈까? 사람들이 덜 다닌 길은 어떨까?
- id: tba:100:room:10074
  field: description
  en: The northern road continues east and west from here.  To the east it must eventually turn back north to the city of
    minotaurs.  To the west it heads back to the city.  North and south you see more forest.
  ko: 북쪽 길은 여기서 동서로 이어진다. 동쪽으로는 결국 미노타우르스의 도시로 북쪽으로 돌아갈 것이다. 서쪽으로는 도시로 되돌아간다. 북쪽과 남쪽으로는 더 많은 숲이 보인다.
  verdict: awkward
  note: '''결국 미노타우르스의 도시로 북쪽으로 돌아갈 것이다''는 ''-로''가 겹쳐 어색하고, ''more forest''를 ''더 많은 숲이 보인다''로 직역했다. 표준 표기는 ''미노타우로스''다.'
  fix: 북쪽 길은 여기서 동서로 이어진다. 동쪽으로 가면 언젠가는 다시 북쪽으로 꺾여 미노타우로스의 도시에 닿을 것이다. 서쪽으로는 도시로 되돌아간다. 북쪽과 남쪽으로는 숲이 계속 이어진다.
- id: tba:100:room:10033
  field: description
  en: The river drops off into an impressive waterfall that flows into a small lake to the east.  Across the canyon you see
    fields of grass.  A small rickety rope bridge crosses the river to the north.  It looks like it might be able to hold
    one person at a time.
  ko: 강물이 떨어지며 웅장한 폭포를 이루고, 동쪽의 작은 호수로 흘러들고 있다. 협곡 건너편에는 풀밭이 펼쳐져 있다. 북쪽으로는 강을 건너는 작고 삐걱거리는 밧줄 다리가 있다. 한 명씩만 건너도 버틸 수 있을지 모르겠다.
  verdict: wrong
  note: 원문은 '한 번에 한 사람은 버틸 수 있을 것 같다'는 뜻이다. '한 명씩만 건너도 버틸 수 있을지 모르겠다'는 의심 쪽으로 뜻을 바꿨다.
  fix: 강물이 떨어지며 웅장한 폭포를 이루고, 동쪽의 작은 호수로 흘러든다. 협곡 건너편에는 풀밭이 펼쳐져 있다. 북쪽으로는 작고 삐걱거리는 밧줄 다리가 강을 가로지른다. 한 번에 한 사람 정도는 버틸 수 있을 것
    같다.
- id: tba:100:room:10081
  field: description
  en: The road here is starting to fade back into the land.  Few traces actually remain that allow you to determine which
    way it goes.  It looks like it continues to the west and to the south.
  ko: 여기서는 길이 다시 땅속으로 사라지기 시작한다. 어디로 이어지는지 가늠할 수 있는 흔적은 거의 남아 있지 않다. 서쪽과 남쪽으로 이어지는 것 같다.
  verdict: awkward
  note: '''fade back into the land''는 길이 주변 땅과 구분되지 않게 된다는 뜻이다. ''땅속으로 사라지기''는 직역이라 어색하다.'
  fix: 여기서는 길이 다시 주변 땅에 묻혀 희미해지기 시작한다. 어디로 이어지는지 가늠할 수 있는 흔적은 거의 남아 있지 않다. 서쪽과 남쪽으로 이어지는 것 같다.
- id: tba:100:obj:10013
  field: long
  en: A tall, straight ash tree stretches towards the sky.
  ko: 키가 크고 곧은 재나무 한 그루가 하늘을 향해 뻗어 있다.
  verdict: wrong
  note: ash tree는 '물푸레나무'다. '재나무'는 오역이다.
  fix: 키가 크고 곧은 물푸레나무 한 그루가 하늘을 향해 뻗어 있다.
- id: tba:100:obj:10000
  field: short
  en: a dirty bunk
  ko: 더러운 이불
  verdict: wrong
  note: bunk는 좁은 침상(간이침대)이다. '이불'이 아니다.
  fix: 더러운 침상
- id: tba:100:room:10054
  field: description
  en: You walk towards the large crater and the ground underneath you starts to fall away.  Luckily, you jump back before
    falling into this natural trap.  You look down into the sink hole and think you can see a corpse.
  ko: 당신은 큰 분화구 쪽으로 걸어갔고, 발밑의 땅이 무너지기 시작했다. 다행히도 당신은 이 자연의 함정에 빠지기 전에 뒤로 점프했다. 당신은 싱크홀 아래를 내려다보며 시체 하나가 보이는 것 같다고 생각한다.
  verdict: awkward
  note: 과거형과 현재형이 섞여 있다. 서술은 현재형으로 통일해야 한다. '점프했다'는 구어 외래어라 어색하다. 화산 이미지가 강한 '분화구'보다 '구덩이'가 맞다. '당신은'도 반복된다.
  fix: 당신이 커다란 구덩이 쪽으로 다가가자 발밑의 땅이 꺼지기 시작한다. 다행히 이 자연의 함정에 빠지기 전에 재빨리 뒤로 물러선다. 꺼진 구멍 아래를 내려다보니 시체 하나가 보이는 것 같다.
- id: tba:100:room:10053
  field: description
  en: Someone had the common sense to put a bridge here so you would not have to walk in the muddy swamp.  It feels good to
    be on dry ground for a change.  The bridge leads north or south.
  ko: 누군가는 상식을 발휘하여 당신이 진흙투성이 늪을 걸어야 하는 상황을 피할 수 있도록 여기에 다리를 놓아두었다. 가끔은 마른 땅을 밟는 것이 기분 좋다. 이 다리는 북쪽이나 남쪽으로 이어진다.
  verdict: wrong
  note: '''for a change''는 ''오랜만에''라는 뜻이다. ''가끔은''은 오역이다. ''누군가는 상식을 발휘하여''도 딱딱한 직역이다.'
  fix: 누군가 생각이 있었는지 여기에 다리를 놓아 두어, 진흙투성이 늪을 걷지 않아도 된다. 오랜만에 마른 땅을 밟으니 기분이 좋다. 다리는 북쪽이나 남쪽으로 이어진다.
- id: tba:100:room:10064
  field: description
  en: You find yourself in dense woodland.  Hardwood trees tower above you while small pine and fir trees hug the ground,
    reducing visibility.  The northern road is just south and east of here.
  ko: 당신은 짙은 숲 한가운데에 서 있다. 단단한 나무들이 당신보다 훨씬 높이 솟아 있고, 작은 소나무와 전나무가 땅을 덮으며 시야를 가린다. 북쪽 길은 여기에서 남동쪽으로 조금 떨어진 곳에 있다.
  verdict: wrong
  note: hardwood trees는 '활엽수'다. '단단한 나무'는 오역이다. 'just south and east'는 바로 남쪽과 동쪽을 말한다. '남동쪽으로 조금 떨어진 곳'은 방향과 거리를 바꿨다.
  fix: 당신은 울창한 숲 한가운데에 서 있다. 활엽수들이 머리 위로 높이 솟아 있고, 작은 소나무와 전나무가 땅에 바짝 붙어 자라 시야를 가린다. 북쪽 길은 여기서 바로 남쪽과 동쪽에 있다.
- id: tba:100:room:10004
  field: description
  en: You are standing at the beginning of the road to the city of the Minotaurs, Dun Maura.  Many rumors abound of these
    savage beasts but few leave the city walls to explore.  To the north you see a thick forest.  To the east and west are
    small paths along the city wall.
  ko: 당신은 미노타우르스의 도시, 던 모라로 가는 길의 시작점에 서 있다. 이 야만적인 괴수들에 관한 수많은 소문이 떠돌지만, 도시 성벽을 벗어나 탐험하는 자는 거의 없다. 북쪽으로는 짙은 숲이 보인다. 동쪽과 서쪽으로는
    도시 성벽을 따라 작은 길이 나 있다.
  verdict: awkward
  note: 뜻은 맞다. 다만 고유명사 표기가 25번('둔모라')과 다르다. '미노타우르스'도 표준 표기인 '미노타우로스'로 바꿔야 한다.
  fix: 당신은 미노타우로스의 도시, 던 마우라로 가는 길의 시작점에 서 있다. 이 야만적인 괴수들에 관한 소문은 무성하지만, 도시 성벽을 벗어나 탐험하는 자는 거의 없다. 북쪽으로는 짙은 숲이 보인다. 동쪽과 서쪽으로는
    도시 성벽을 따라 작은 길이 나 있다.
- id: tba:100:room:10017
  field: description
  en: You stand in the middle of the northern road.  It is almost completely deserted.  You can see a few people off in the
    distance to the south, close to the city.  To the north you can make out what looks like a body of water in the distance.  The
    forest is to the west and there are some plains in the distance to the east.
  ko: 당신은 북쪽 길 한가운데 서 있다. 길은 거의 완전히 한산하다. 남쪽 멀리, 도시 근처에 몇몇 사람들이 보인다. 북쪽으로는 멀리 물이 고여 있는 곳이 보인다. 서쪽에는 숲이 있고, 동쪽 멀리에는 평원이 펼쳐져
    있다.
  verdict: awkward
  note: '''거의 완전히 한산하다''는 직역이라 어색하다. ''what looks like a body of water''의 ''~처럼 보이는'' 뉘앙스가 ''물이 고여 있는 곳''에서 흐려졌다.'
  fix: 당신은 북쪽 길 한가운데 서 있다. 길에는 인적이 거의 없다. 남쪽 멀리, 도시 가까이에 사람 몇이 보인다. 북쪽 멀리로는 호수 같은 넓은 물이 어렴풋이 보인다. 서쪽에는 숲이 있고, 동쪽 멀리에는 평원이
    펼쳐져 있다.
- id: tba:100:room:10079
  field: description
  en: The plains stretch out for miles.  You actually miss the confines of the woods compared to this open vulnerability.  To
    the north you can see a small road.  You occasionally notice the sway of the grass on the plains as something, or someone,
    moves stealthily through.
  ko: 평원이 수킬로미터나 펼쳐져 있다. 이렇게 넓게 벌어진 취약한 공간에 비하면, 오히려 숲의 울타리가 그리워진다. 북쪽으로는 작은 길이 보인다. 가끔 평원의 풀이 흔들리는 것을 보게 되는데, 무언가, 혹은 누군가가
    은밀하게 지나가는 것이다.
  verdict: awkward
  note: '''넓게 벌어진 취약한 공간'', ''숲의 울타리''는 직역투다. 마지막 문장도 늘어진다.'
  fix: 평원이 몇 킬로미터나 펼쳐져 있다. 이렇게 사방이 트여 무방비한 곳에 서 있으니 오히려 답답하던 숲이 그리워진다. 북쪽으로는 작은 길이 보인다. 이따금 무언가, 혹은 누군가가 몰래 지나가는지 평원의 풀이 흔들린다.
- id: tba:100:room:10030
  field: description
  en: A large stone bridge crosses the river just to the north.  It is made of stone and must have taken years to build.  The
    river empties into a massive lake just to the east.  The northern road continues across the bridge.
  ko: 거대한 돌다리가 바로 북쪽에서 강을 가로지른다. 돌로 만들어졌으며, 수년에 걸쳐 지었을 것이다. 강은 바로 동쪽에서 거대한 호수로 흘러든다. 북쪽 길은 다리를 건너 이어진다.
  verdict: awkward
  note: '''돌로 만들어졌으며, 수년에 걸쳐 지었을 것이다''는 피동 직역이라 딱딱하다.'
  fix: 거대한 돌다리가 바로 북쪽에서 강을 가로지른다. 돌로 쌓은 이 다리는 짓는 데만 수년은 걸렸을 것이다. 강은 바로 동쪽에서 거대한 호수로 흘러든다. 북쪽 길은 다리를 건너 이어진다.
- id: tba:100:mob:10013
  field: description
  en: This cute little critter looks like a house pet.  Except for those sharp claws and teeth that it must just be learning
    how to use.  It's tempting to go ahead and pet the cute little fella.
  ko: 귀여운 이 작은 짐승은 집짐승처럼 보인다. 다만, 아직 어떻게 써야 할지 배우고 있는 듯 보이는 날카로운 발톱과 이빨만 빼면 말이다. 이 귀여운 녀석을 쓰다듬어 주고 싶은 유혹이 든다.
  verdict: wrong
  note: house pet은 '애완동물'이다. '집짐승'은 가축이라는 뜻이라 오역이다. 'go ahead and'의 '그냥 해 버리고 싶은' 뉘앙스도 살리는 편이 낫다.
  fix: 이 귀여운 작은 짐승은 애완동물처럼 보인다. 다만 이제 막 쓰는 법을 배우고 있는 듯한 날카로운 발톱과 이빨만 빼면 말이다. 이 귀여운 녀석을 그냥 쓰다듬어 보고 싶은 마음이 든다.
- id: tba:100:room:10046
  field: description
  en: You are afraid you might lose your way in this dismal marsh.  Your feet are starting to sink almost all the way up to
    your knees now.  You wonder about the possibilities of quicksand, and all those stories you hear about people disappearing
    in these swamps.
  ko: 당신은 이 음침한 습지에서 길을 잃을까 두려워한다. 이제 발이 거의 무릎까지 가라앉기 시작한다. 유실층의 가능성과, 이런 늪에서 사람들이 사라진다는 그 모든 이야기들을 떠올려 본다.
  verdict: wrong
  note: quicksand는 '유사(流沙)'다. '유실층'은 오역이다. '당신은 ~ 두려워한다'는 플레이어 감정을 관찰하듯 서술해 어색하다.
  fix: 당신은 이 음침한 습지에서 길을 잃을까 두렵다. 이제 발이 거의 무릎까지 빠지기 시작한다. 혹시 유사가 있는 건 아닐까, 이런 늪에서 사람들이 사라졌다는 온갖 이야기가 떠오른다.
- id: tba:100:room:10094
  field: name
  en: Beside the City Walls of Dun Maura
  ko: 둔모라의 성벽 옆
  verdict: awkward
  note: Dun Maura 표기가 18번('던 모라')과 다르다. 하나로 통일해야 한다.
  fix: 던 마우라의 성벽 옆
- id: tba:100:room:10068
  field: description
  en: You make it to a small clearing where the trees no longer crowd you.  The forest continues in all directions.  To the
