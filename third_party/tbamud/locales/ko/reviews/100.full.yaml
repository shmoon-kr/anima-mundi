  fix: 당신은 숲속을 터벅터벅 걸어간다. 숲 바닥에 걸리적거리는 것이 없어 걷기 좋다. 제법 빠르게, 실제로 어딘가에 다가가고 있다는 느낌이 든다. 서쪽과 북쪽으로는 숲이 빽빽해져, 나갈 길은 남쪽과 동쪽뿐이다.
- id: tba:100:mob:10008
  field: description
  en: This peddler has a bunch of useless junk that he hopes to be able to sell at a profit to the suckers in the city.  He
    looks very untrustworthy.  You hold your purse a little tighter as you walk by.
  ko: 이 노점상은 도시의 바보들에게 이윤을 남기고 팔 수 있기를 바라며 쓸모없는 잡동사니를 한가득 들고 있다. 그는 매우 믿을 수 없어 보인다. 당신이 지나가자 지갑을 조금 더 단단히 쥐게 된다.
  verdict: wrong
  note: peddler는 돌아다니며 파는 '행상인'이지 '노점상'이 아니다. suckers는 '바보들'보다 '호구들'에 가깝다. 마지막 문장은 주어가 어긋나서, 지갑을 쥐는 사람이 당신인지 불분명하다.
  fix: 이 행상인은 도시의 호구들에게 이문을 남기고 팔 수 있기를 바라며 쓸모없는 잡동사니를 잔뜩 지니고 있다. 그는 전혀 믿음직해 보이지 않는다. 당신은 그 곁을 지나가며 지갑을 조금 더 꽉 쥔다.
- id: tba:100:room:10025
  field: description
  en: You start to walk around the edge of the lake.  You hear the sound of rushing water to the north.  The lake seems very
    serene, you're tempted to take a quick dip in the water, but who knows what could be watching you.
  ko: 당신은 호숫가를 따라 걷기 시작한다. 북쪽에서 물이 빠르게 흐르는 소리가 들린다. 호수는 매우 고요해 보인다. 물에 잠깐 담그고 싶은 유혹이 들지만, 누가 당신을 지켜보고 있을지 누가 알겠는가.
  verdict: awkward
  note: '''물에 잠깐 담그고 싶은''에는 목적어 ''몸을''이 빠졌다. ''what could be watching''은 사람이 아닌 것도 포함하므로 ''누가''보다 ''무엇이''가 맞다.'
  fix: 당신은 호숫가를 따라 걷기 시작한다. 북쪽에서 물이 세차게 흐르는 소리가 들린다. 호수가 무척 고요해 보여 잠깐 물에 몸을 담그고 싶어지지만, 무엇이 당신을 지켜보고 있을지 누가 알겠는가.
- id: tba:100:room:10000
  field: extras.2.text
  en: As you examine the bunk closer you notice some of the rags may not be as shabby as you originally thought. No one would
    miss them, would they?
  ko: 이층 침대를 더 자세히 살펴보니, 일부 헝겊은 처음 생각했던 것만큼 낡지 않은 것 같다. 누가 그걸 보고 그리워하겠는가?
  verdict: wrong
  note: '''No one would miss them''은 ''없어져도 아무도 모를 것''이라는 뜻이다. ''그리워하겠는가''는 오역이다. 은둔자의 오두막에 있는 bunk는 ''이층 침대''가 아니라 ''침상''이다.'
  fix: 침상을 더 자세히 살펴보니, 헝겊 가운데 몇 개는 처음 생각했던 것만큼 낡지는 않은 것 같다. 좀 가져간다고 아무도 모르지 않을까?
- id: tba:100:room:10099
  field: name
  en: Beside the City Walls of Dun Maura
  ko: 둔모라의 성벽 옆
  verdict: awkward
  note: 6번과 같다. Dun Maura 표기를 '던 모라'로 통일해야 한다.
  fix: 던 모라의 성벽 옆
- id: tba:100:mob:10016
  field: short
  en: the huntress
  ko: 사냥꾼
  verdict: wrong
  note: huntress는 여성 사냥꾼이다. '사냥꾼'으로만 옮기면 성별 정보가 빠진다.
  fix: 여사냥꾼
- id: tba:100:room:10000
  field: description
  en: As you step into the shabby cabin, the smell makes you gag.  A slight haze makes your eyes sting.  Whoever lives here
    has no regard for cleanliness. Piles of rags lie everywhere.
  ko: 당신이 허름한 오두막으로 들어서자 코를 찌르는 냄새에 구역질이 난다. 희미한 연기가 눈이 따갑게 만든다. 여기서 사는 사람은 청결 따위는 아랑곳하지 않는 모양이다. 여기저기 헝겊더미가 쌓여 있다.
  verdict: awkward
  note: '''연기가 눈이 따갑게 만든다''는 조사가 틀렸다. ''여기서 사는 사람''도 어색하다.'
  fix: 당신이 허름한 오두막으로 들어서자 코를 찌르는 냄새에 구역질이 난다. 옅은 연기에 눈이 따갑다. 이곳에 사는 이는 청결 따위는 아랑곳하지 않는 모양이다. 여기저기 헝겊 더미가 쌓여 있다.
- id: tba:100:mob:10000
  field: long
  en: A hermit is standing here, oblivious to you and the rest of the world.
  ko: 당신과 나머지 세상을 모른 채 여기 서 있는 수도승이 있다.
  verdict: wrong
  note: hermit는 '은둔자'다. '수도승'은 오역이다. oblivious는 '모른 채'보다 '아랑곳하지 않고'가 자연스럽다.
  fix: 은둔자 하나가 당신에게도, 세상 일에도 아랑곳하지 않은 채 여기 서 있다.
- id: tba:100:mob:10014
  field: short
  en: the lynx
  ko: 린क्स
  verdict: wrong
  note: 데바나가리 문자가 섞여 깨졌다. lynx는 '스라소니'다.
  fix: 스라소니
- id: tba:100:obj:10000
  field: long
  en: A flee-infested bunk filled with rags sits in one corner.
  ko: 한 구석에 이가 들끓는 이불과 헝겊이 가득 쌓여 있다.
  verdict: wrong
  note: bunk(침상)를 '이불'로 잘못 옮겼다. flea는 '벼룩'이지 '이'가 아니다. 침상에 헝겊이 가득하다는 구조도 무너졌다.
  fix: 한쪽 구석에 벼룩이 들끓는 침상이 놓여 있고, 그 위에 헝겊이 가득하다.
- id: tba:100:room:10084
  field: description
  en: The trees open up into small fields.  To the east you can see a small road. The road also seems to curve to the south.  West
    is the main road to Dun Maura or back to the safety of the city.
  ko: 나무들이 열리며 작은 들판이 드러난다. 동쪽으로는 작은 길이 보인다. 이 길은 남쪽으로 휘어지는 듯하다. 서쪽으로는 던 모라로 향하는 주요 도로, 혹은 도시의 안전으로 돌아가는 길이 있다.
  verdict: awkward
  note: '''나무들이 열리며''는 ''open up''의 직역이다. ''도시의 안전으로 돌아가는 길''도 어색하다. main road는 ''주요 도로''보다 ''큰길''이 자연스럽다.'
  fix: 숲이 트이며 작은 들판이 나타난다. 동쪽으로는 작은 길이 보인다. 그 길은 남쪽으로도 굽어지는 듯하다. 서쪽으로는 던 모라로 가는 큰길이 있고, 그 길로 안전한 도시로 돌아갈 수도 있다.
- id: tba:100:mob:10016
  field: long
  en: The huntress tracks her prey with skill and determination.
  ko: 사냥꾼은 숙련된 기술과 결연한 의지로 사냥감을 추적한다.
  verdict: wrong
  note: huntress의 성별이 빠졌다(18번과 같은 문제). her prey도 '자신의 사냥감'으로 옮기는 것이 정확하다.
  fix: 여사냥꾼은 숙련된 솜씨와 굳은 의지로 자신의 사냥감을 추적한다.
- id: tba:100:room:10000
  field: extras.1.text
  en: The stove looks like it hasn't been used for a few years. In the bottom you see a thick pile of ashes. You notice something
    sparkling in the ashes.
  ko: 난방용 화로는 몇 년간 사용하지 않은 것처럼 보인다. 바닥에는 두꺼운 재더미가 쌓여 있다. 재 속에서 반짝이는 무언가를 발견한다.
  verdict: awkward
  note: 원문에 없는 '난방용'이 추가되었다. '화로'보다 '난로'가 stove에 맞다. '바닥에는'은 '난로 안 바닥'이라는 뜻이 드러나지 않는다.
  fix: 난로는 몇 년 동안 쓰지 않은 것처럼 보인다. 난로 바닥에는 재가 두껍게 쌓여 있다. 재 속에서 무언가 반짝이는 것이 눈에 띈다.
- id: tba:100:room:10042
  field: description
  en: The northern road continues here, north to Dun Maura or east back toward the city.  You wonder about the fabled Dun
    Maura, city of the minotaurs.  Many stories abound about it, but you doubt half of them are true.  To the south you could
    enter the dense forest.
  ko: 북쪽 길은 여기서 북쪽으로 던 모라(Dun Maura)로, 또는 동쪽으로 도시 쪽으로 이어진다. 당신을 미노타우르스의 도시로 불리는 전설의 던 모라에 대해 궁금해진다. 그곳에 관한 이야기가 많지만, 절반은 믿을
    수 없다고 생각한다. 남쪽으로는 울창한 숲으로 들어갈 수 있다.
  verdict: wrong
  note: '''doubt half of them are true''는 ''절반이라도 사실일지 의심스럽다''는 뜻이다. ''절반은 믿을 수 없다''는 의미가 다르다. ''당신을''은 조사 오류다. ''(Dun Maura)''처럼
    영어를 덧붙였다. ''미노타우르스''와 ''북쪽 길''은 다른 항목의 표기와 어긋난다.'
  fix: 북쪽 도로는 여기서 북쪽으로는 던 모라로, 동쪽으로는 도시 쪽으로 이어진다. 당신은 미노타우로스의 도시라는 전설 속의 던 모라가 궁금해진다. 그곳에 관한 이야기는 무수하지만, 그 절반이라도 사실일지 의심스럽다.
    남쪽으로는 울창한 숲으로 들어갈 수 있다.
- id: tba:100:room:10012
  field: description
  en: As you walk off the beaten path into the beginning of some plains you notice the trees here are shorter and spaced further
    apart.  To the east you see that the forest fades away into plains.  You can explore in any direction.
  ko: 당신이 잘 닦인 길을 벗어나 초원의 시작 지대로 들어서자, 이곳의 나무들은 더 낮고 간격이 넓게 서 있음을 알게 된다. 동쪽을 보면 숲이 서서히 사라지며 초원으로 이어진다. 어느 방향으로든 탐험할 수 있다.
  verdict: awkward
  note: plains를 '초원'으로 옮겨 다른 항목의 '평원'과 어긋난다. '당신이 ~하자 ~임을 알게 된다'는 notice를 직역한 딱딱한 구문이다.
  fix: 잘 닦인 길을 벗어나 평원이 시작되는 곳으로 들어서니, 이곳의 나무들은 더 낮고 서로 더 멀찍이 떨어져 있다. 동쪽으로는 숲이 차츰 옅어지다가 평원으로 바뀐다. 어느 방향으로든 탐험할 수 있다.
- id: tba:100:room:10078
  field: description
  en: A small road lies just to the west and the plains are to the east.  North and south is even more forest.  It seems no
    one ever comes this deep into the woods.  All the animals seem to be staring at you.
  ko: 바로 서쪽에는 작은 길이 있고, 동쪽에는 평원이 펼쳐져 있다. 북쪽과 남쪽으로는 더 깊은 숲이 이어진다. 아무도 이렇게 숲속 깊은 곳까지 오는 것 같지 않다. 모든 동물들이 당신을 뚫어지게 쳐다보는 것 같다.
  verdict: wrong
  note: '''even more forest''는 ''숲이 더 이어진다''는 뜻이다. ''더 깊은 숲''은 원문에 없는 의미를 더한 것이다.'
  fix: 바로 서쪽에는 작은 길이 있고, 동쪽에는 평원이 펼쳐져 있다. 북쪽과 남쪽으로도 숲이 계속 이어진다. 이렇게 깊은 숲속까지 들어오는 이는 아무도 없는 듯하다. 모든 동물들이 당신을 뚫어지게 쳐다보는 것 같다.
- id: tba:100:room:10070
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: Light Forest는 나무가 듬성듬성한 숲을 뜻한다. '밝은 숲'은 오역이다.
  fix: 성긴 숲
- id: tba:100:room:10075
  field: description
  en: The road stretches to the east and west.  Thick forest are to the north and south.  The road seems a little less traveled
    through this part.  You notice fewer ruts in the road from wagons and even fewer people.
  ko: 길은 동서로 뻗어 있다. 북쪽과 남쪽에는 짙은 숲이 있다. 이 구간은 조금 덜 다닌 것 같다. 수레가 지나간 자국이 적고, 사람도 훨씬 적게 보인다.
  verdict: awkward
  note: '''이 구간은 조금 덜 다닌 것 같다''는 주어와 서술어가 어색하다. ''사람도 훨씬 적게 보인다''도 직역투다.'
  fix: 길은 동서로 뻗어 있다. 북쪽과 남쪽으로는 숲이 빽빽하다. 이 구간은 오가는 이가 조금 적은 듯하다. 수레바퀴 자국도 드물고, 사람은 더더욱 드물다.
- id: tba:100:obj:10016
  field: extras.0.text
  en: This large slab of meat has been recently cooked and, though dry, looks rather tasty.
  ko: 이 큰 고기 덩어리는 최근에 구워졌으며, 건조하긴 하지만 꽤 맛있어 보인다.
  verdict: awkward
  note: 음식에 쓰인 '건조하다'는 어색하다. '퍽퍽하다'가 자연스럽다. '최근에 구워졌으며'는 피동 직역투다.
  fix: 이 커다란 고기 덩어리는 구운 지 얼마 되지 않았고, 좀 퍽퍽하긴 해도 꽤 맛있어 보인다.
- id: tba:100:room:10047
  field: description
  en: The thought of taking a wrong step and sinking to your death makes you slow down a little.  To the west you think you
    can see some drier land.  You thank the gods above.
  ko: 잘못 한 발을 내디뎌 죽음으로 가라앉는다는 생각에 발걸음이 조금 느려진다. 서쪽으로는 좀 더 마른 땅이 보이는 것 같다. 하늘의 신들에게 감사한다.
  verdict: awkward
  note: '''잘못 한 발을 내디뎌''는 어순이 어색하다. ''죽음으로 가라앉는다''는 직역투다. 마지막 문장은 주어를 살리는 편이 자연스럽다.'
  fix: 발을 한 번 잘못 디뎌 그대로 가라앉아 죽을지도 모른다는 생각에 걸음이 조금 느려진다. 서쪽으로 좀 더 마른 땅이 보이는 것 같다. 당신은 하늘의 신들께 감사한다.
- id: tba:100:room:10089
  field: description
  en: Thick forest surrounds you.  It feels suffocating and you wonder if you may be getting a little claustrophobic.  To
    the south you can make out the northern road.  North you can just barely see some sort of wall.  Definitely not nature's
    work.
  ko: 두꺼운 숲이 당신을 둘러싸고 있다. 숨이 막힐 것 같고, 조금씩 폐쇄공포증에 시달리고 있는 건 아닌지 걱정된다. 남쪽으로는 북쪽 길이 희미하게 보인다. 북쪽으로는 간신히 어떤 종류의 벽이 보인다. 분명 자연이
    만든 것이 아니다.
  verdict: wrong
  note: thick forest를 '두꺼운 숲'으로 옮긴 것은 오역이다. '빽빽한/울창한 숲'이 맞다. '어떤 종류의 벽'은 직역투이고, 'northern road'는 26번과 맞춰 '북쪽 도로'로 쓰는 편이 좋다.
  fix: 울창한 숲이 당신을 에워싸고 있다. 숨이 막힐 듯해서, 혹시 폐소공포증이 도지는 건 아닌가 싶다. 남쪽으로 북쪽 도로가 어렴풋이 보인다. 북쪽으로는 벽 같은 것이 간신히 보인다. 분명 자연이 만든 것은 아니다.
- id: tba:100:room:10092
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: 4번과 같은 오역이다. Light Forest는 '성긴 숲'이다.
  fix: 성긴 숲
- id: tba:100:room:10039
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: 4번과 같은 오역이다. Light Forest는 '성긴 숲'이다.
  fix: 성긴 숲
- id: tba:100:obj:10003
  field: extras.0.text
  en: The lake is perfectly calm, no movement of any kind in the lake makes the surface look like glass. The water looks clean
    and drinkable.
  ko: 호수는 완벽하게 고요하며, 호수 안에는 어떤 움직임도 없어 수면이 유리처럼 보인다. 물은 깨끗하고 마실 수 있어 보인다.
  verdict: awkward
  note: '''호수''가 반복되고 ''완벽하게 고요하며''가 딱딱하다. ''마실 수 있어 보인다''도 직역투다.'
  fix: 호수는 더없이 잔잔하다. 물결 하나 일지 않아 수면이 마치 유리 같다. 물은 깨끗해서 마셔도 될 것 같다.
- id: tba:100:mob:10006
  field: long
  en: A large buck with a full rack of antlers stares back at you.
  ko: 뿔가지가 풍성한 큰 수사슴 한 마리가 당신을 마주 노려본다.
  verdict: wrong
  note: '''stares back''은 마주 쳐다본다는 뜻이다. ''노려본다''는 원문에 없는 적의를 더한다. ''뿔가지가 풍성한''도 어색하다.'
  fix: 가지를 활짝 뻗은 뿔을 단 커다란 수사슴 한 마리가 당신을 빤히 마주 본다.
- id: tba:100:mob:10015
  field: description
  en: Clad in hides from his latest kills, this veteran of the wilderness stalks his prey silently, waiting for the opportunity
    to strike.
  ko: 최근 사냥한 짐승의 가죽을 걸친 이 광야의 베테랑은 소리 없이 먹이를 추적하며, 일격을 가할 기회를 기다리고 있다.
  verdict: awkward
  note: '''광야의 베테랑''은 외래어 직역이라 어색하다. 사냥하는 쪽이 노리는 prey는 ''먹이''보다 ''사냥감''이 자연스럽다.'
  fix: 최근에 잡은 짐승들의 가죽을 걸친, 황야에서 잔뼈가 굵은 이 자는 소리 없이 사냥감을 뒤쫓으며 덮칠 기회를 노리고 있다.
- id: tba:100:room:10021
  field: description
  en: The thick forest to the north and south is untraversable.  Your only choice is to continue east or west between the
    massive trees.  The safety and easy travel of the northern road is just to your east.
  ko: 북쪽과 남쪽의 짙은 숲은 통과할 수 없다. 거대한 나무들 사이로 동쪽이나 서쪽으로 계속 나아가는 것만이 당신의 선택지다. 북쪽 도로의 안전하고 편한 여행은 바로 당신의 동쪽에 있다.
  verdict: awkward
  note: '''~만이 당신의 선택지다''와 ''북쪽 도로의 안전하고 편한 여행은 바로 당신의 동쪽에 있다''는 영어 구조를 그대로 옮긴 직역투다.'
  fix: 북쪽과 남쪽은 숲이 너무 빽빽해 지나갈 수 없다. 거대한 나무들 사이로 동쪽이나 서쪽으로 계속 나아가는 수밖에 없다. 바로 동쪽에 안전하고 다니기 편한 북쪽 도로가 있다.
- id: tba:100:room:10037
  field: description
  en: The ground here is definitely getting swampy.  Your feet start to stick in the soft soil.  The fog blowing off the lake
    is getting thicker.  The silence is almost scary.  You wonder what kind of creatures live in a swamp?
  ko: 여기 땅은 확실히 습지처럼 변하고 있다. 발이 부드러운 흙에 달라붙기 시작한다. 호수에서 불어오는 안개가 점점 짙어진다. 고요함이 거의 무서울 정도다. 습지에 어떤 종류의 생물들이 살고 있을까?
  verdict: awkward
  note: '''어떤 종류의 생물들''은 직역투다. swamp는 5번과 맞춰 ''늪''으로 통일하는 편이 좋다.'
  fix: 이곳 땅은 확실히 질척해지고 있다. 발이 무른 흙에 들러붙기 시작한다. 호수에서 밀려오는 안개가 점점 짙어진다. 고요함이 거의 무서울 정도다. 늪에는 대체 어떤 생물들이 살고 있을까 궁금해진다.
- id: tba:100:mob:10009
  field: short
  en: the possum
  ko: 수달
  verdict: wrong
  note: possum은 주머니쥐다. 수달(otter)은 다른 동물이다.
  fix: 주머니쥐
- id: tba:100:room:10048
  field: description
  en: The swamp is starting to firm up underneath you.  To the north you see a large crater in the ground.  You wonder who
    the unfortunate soul was to be walking across that when it gave out.  To the south and west the swamp looks even worse.  East
    you see the beginning of some plains.
  ko: 당신 발밑의 늪이 서서히 단단해지기 시작한다. 북쪽으로는 지면에 큰 분화구가 보인다. 그 지반이 무너졌을 때 그 위를 걷던 불운한 영혼이 누구였을지 궁금해진다. 남쪽과 서쪽으로는 늪이 더 처참해 보인다. 동쪽으로는
    평원의 시작 부분이 보인다.
  verdict: wrong
  note: crater는 땅이 꺼져 생긴 구덩이를 뜻한다. 분화구는 화산을 떠올리게 하므로 맥락에 맞지 않는다. '처참해 보인다'는 늪 묘사로 어색하고, '그 지반이 … 그 위를'은 문장이 무겁다.
  fix: 당신 발밑의 늪이 점점 단단해지기 시작한다. 북쪽으로는 땅이 크게 꺼진 구덩이가 보인다. 땅이 꺼질 때 그 위를 걷고 있던 불운한 이는 누구였을까. 남쪽과 서쪽으로는 늪이 더 험해 보인다. 동쪽으로는 평원이
    시작되는 곳이 보인다.
- id: tba:100:room:10028
  field: description
  en: A massive river roars past you.  It's a good twenty strides wide.  No way to cross without a bridge.  To the west the
    thick forest looks impenetrable.  You think you can see a road to the east.
  ko: 거대한 강이 당신 곁을 굉음을 내며 흐른다. 폭이 약 30미터나 된다. 다리가 없으면 건널 방법이 없다. 서쪽으로는 짙은 숲이 마치 뚫을 수 없을 듯하다. 동쪽으로는 길이 보이는 것 같다.
  verdict: wrong
  note: '''twenty strides''를 30미터로 바꿔 단위와 수치가 달라졌다. 판타지 배경에서 미터는 어울리지 않는다. ''곁을 굉음을 내며''는 ''을''이 겹쳐 어색하고, ''마치 뚫을 수 없을 듯하다''는
    추측 표현이 중복된다.'
  fix: 거대한 강이 굉음을 내며 당신 곁을 흘러간다. 폭이 족히 스무 걸음은 된다. 다리 없이는 건널 방법이 없다. 서쪽으로는 울창한 숲이 도저히 뚫고 들어갈 수 없을 것처럼 보인다. 동쪽으로 길이 보이는 것 같다.
- id: tba:100:mob:10014
  field: description
  en: This small and stocky feline has definitely adapted to these forests.  Its ears have small tufts of hair sticking out
    of the ends.  It is about two or three times the size of any cat you've ever seen.  It walks with agility and purpose.
  ko: 작고 단단한 체구의 이 고양이과 동물은 분명 이 숲에 적응했다. 귀 끝에서 작은 털 뭉치가 삐죽 나와 있다. 당신이 지금까지 본 고양이보다 두세 배는 크다. 민첩하고 목적 있는 걸음걸이를 보인다.
  verdict: awkward
  note: '''목적 있는 걸음걸이를 보인다''는 직역투다.'
  fix: 작고 단단한 체구의 이 고양이과 동물은 분명 이 숲에 적응했다. 귀 끝에서 작은 털 뭉치가 삐죽 나와 있다. 당신이 지금까지 본 어떤 고양이보다도 두세 배는 크다. 뚜렷한 목적이 있는 듯 민첩하게 걷는다.
- id: tba:100:room:10036
  field: description
  en: Just to the south a massive stone bridge crosses the river.  The land to the east looks like the beginning of a swamp.  A
    heavy fog from the lake billows slowly across the road.
  ko: 바로 남쪽으로는 거대한 돌다리가 강을 건너고 있다. 동쪽 땅은 습지의 시작처럼 보인다. 호수에서 피어오른 짙은 안개가 도로를 따라 느릿느릿 밀려온다.
  verdict: wrong
  note: across(가로질러)를 '따라'로 옮겨 의미가 바뀌었다. swamp는 다른 항목처럼 '늪'으로 통일해야 한다. road도 '도로'보다 '길'이 일관된다.
  fix: 바로 남쪽에는 거대한 돌다리가 강 위로 놓여 있다. 동쪽 땅은 늪이 시작되는 곳처럼 보인다. 호수에서 피어오른 짙은 안개가 길을 가로질러 느릿느릿 밀려든다.
- id: tba:100:obj:10014
  field: extras.0.text
  en: The brass hood can be opened and closed allowing for dimming the light without actually extinguishing it.  The globe
    is filthy, but clear enough to let out a fair amount of light.
  ko: 황동 뚜껑을 열고 닫을 수 있어, 완전히 끄지 않고도 불빛을 조절할 수 있다. 유리 부분은 꼬질이이지만, 여전히 상당한 양의 빛을 통과시킬 만큼 맑다.
  verdict: wrong
  note: '''꼬질이이지만''은 잘못된 말이다. filthy는 ''더럽다''로 옮겨야 한다. ''유리 부분''은 globe를 모호하게 옮겼고, dimming(어둡게 줄이기)의 뜻도 흐려졌다.'
  fix: 황동 덮개를 여닫을 수 있어, 불을 완전히 끄지 않고도 불빛을 어둡게 줄일 수 있다. 유리구는 더럽지만, 빛이 꽤 새어 나올 만큼은 맑다.
- id: tba:100:obj:10010
  field: extras.0.text
  en: This impressive tree is thicker than you are tall.  Many animals have homes way up in the top of the tree. Certain parts
    look hollow and are probably the dens of squirrels and raccoons.
  ko: 이 장엄한 나무는 당신 키보다 굵다. 나무 꼭대기 높은 곳에 많은 동물들이 둥지를 틀고 있다. 일부는 속이 비어 있는 것처럼 보이며, 아마도 다람쥐와 너구리의 굴일 것이다.
  verdict: wrong
  note: raccoon을 22번에서는 '라쿤'으로 옮겼는데 여기서는 '너구리'로 옮겼다. 너구리는 다른 동물이므로 '라쿤'으로 통일해야 한다.
  fix: 이 장엄한 나무는 당신 키보다 굵다. 나무 꼭대기 높은 곳에 많은 동물들이 둥지를 틀고 있다. 일부는 속이 비어 있는 것처럼 보이며, 아마도 다람쥐와 라쿤의 굴일 것이다.
- id: tba:100:obj:10001
  field: long
  en: An old stove is slowly rusting away to nothing here.
  ko: 낡은 난로가 여기 서서 서서히 녹슬어 사라져 가고 있다.
  verdict: awkward
  note: 원문에 없는 '서서'가 들어가 '서서 서서히'로 겹쳐 읽힌다.
  fix: 낡은 난로 하나가 이곳에서 서서히 녹슬어 사라져 가고 있다.
- id: tba:100:room:10080
  field: description
  en: The road is completely overgrown here and you can't tell which way it was meant to go.  It looks like it might continue
    to the east, or you can enter the forest to the south.
  ko: 여기서는 길이 완전히 잡초에 덮여 있어 원래 어디로 이어졌는지 알 수 없다. 동쪽으로 이어지는 것 같기도 하고, 남쪽으로는 숲속으로 들어갈 수 있다.
  verdict: awkward
  note: '''~것 같기도 하고, ~수 있다''는 대구가 맞지 않는다.'
  fix: 여기서는 길이 완전히 잡초에 덮여 있어 원래 어디로 이어졌는지 알 수 없다. 동쪽으로 이어지는 것 같기도 하다. 아니면 남쪽 숲으로 들어갈 수도 있다.
- id: tba:100:room:10078
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: Light Forest는 나무가 듬성한 숲이라는 뜻이다. 빛이 밝다는 뜻이 아니다.
  fix: 성긴 숲
- id: tba:100:obj:10012
  field: long
  en: A gigantic elm reaches towards the sky.
  ko: 거대한 느티나무가 하늘을 향해 뻗어 있다.
  verdict: wrong
  note: elm은 느릅나무다. 느티나무(zelkova)는 다른 나무다.
  fix: 거대한 느릅나무가 하늘을 향해 뻗어 있다.
- id: tba:100:obj:10004
  field: extras.0.text
  en: The pond is a deep brown color and smells funny. You think twice about trying to take a drink from it.
  ko: 웅덩이는 짙은 갈색을 띠고 이상한 냄새가 난다. 여기서 물을 마셔 볼까 하다가 두 번쯤 생각하게 된다.
  verdict: awkward
  note: '''두 번쯤 생각하게 된다''는 think twice를 직역한 것이다. 망설인다는 뜻으로 옮겨야 한다.'
  fix: 웅덩이는 짙은 갈색을 띠고 이상한 냄새가 난다. 이 물을 마셔도 될지 망설여진다.
- id: tba:100:room:10090
  field: description
  en: At last you have almost made it to the end of the great northern road. Just to the north you can see the city of the
    minotaurs.  A great wall surrounds the entire city.  You wonder about heading back south to safety.
  ko: 드디어 위대한 북쪽 길의 끝자락에 거의 도달했다. 바로 북쪽으로는 미노타우로스들의 도시가 보인다. 거대한 성벽이 도시 전체를 둘러싸고 있다. 안전을 위해 남쪽으로 되돌아가는 것이 나을지 고민된다.
  verdict: awkward
  note: great road의 great는 '큰'이라는 뜻이다. '위대한'은 어색하다.
  fix: 드디어 북쪽 대로의 끝자락에 거의 다다랐다. 바로 북쪽으로는 미노타우로스들의 도시가 보인다. 거대한 성벽이 도시 전체를 둘러싸고 있다. 안전한 남쪽으로 되돌아갈까 하는 생각이 든다.
- id: tba:100:room:10008
  field: description
  en: The forest is so dense you can hardly see more than ten feet without a tree blocking your vision.  It would be very
    easy for someone, or something, to sneak up on you here.  You can continue north or east through the forest.
  ko: 숲이 너무 짙어 나무가 시야를 가리지 않는 한 약 3미터 이상은 거의 보이지 않는다. 누군가, 혹은 무언가가 여기서 당신에게 몰래 접근하기가 매우 쉽다. 당신은 숲을 통해 북쪽이나 동쪽으로 계속 나아갈 수 있다.
  verdict: wrong
  note: ten feet를 3미터로 환산해 판타지 배경에 맞지 않는 단위가 들어갔다. '나무가 시야를 가리지 않는 한'은 원문의 뜻을 흐린다. '당신은 숲을 통해 ~할 수 있다'는 번역투다.
  fix: 숲이 너무 빽빽해서 나무에 가리지 않고 볼 수 있는 거리가 고작 열 자 남짓이다. 누군가, 혹은 무언가가 이곳에서 당신에게 몰래 다가오기란 아주 쉬울 것이다. 숲을 지나 북쪽이나 동쪽으로 계속 갈 수 있다.
- id: tba:100:room:10061
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: '''Light Forest''는 나무가 듬성듬성한 숲이라는 뜻이다. ''밝은 숲''은 직역 오류다.'
  fix: 성긴 숲
- id: tba:100:obj:10005
  field: long
  en: A fast moving river flows by you with a roar.
  ko: 빠르게 흐르는 강이 소리를 내며 당신 곁을 지나간다.
  verdict: wrong
  note: '''with a roar''의 굉음이 ''소리를 내며''로 약해졌다.'
  fix: 빠르게 흐르는 강이 굉음을 내며 당신 곁을 지나간다.
- id: tba:100:mob:10005
  field: long
  en: A graceful doe flicks her white tail at you.
  ko: 우아한 암사슴 한 마리가 당신을 향해 하얀 꼬리를 흔들며 경계한다.
  verdict: wrong
  note: 원문에 없는 '경계한다'가 추가되었다. 원문은 꼬리를 홱 흔드는 동작만 묘사한다.
  fix: 우아한 암사슴 한 마리가 당신을 향해 하얀 꼬리를 홱 흔든다.
- id: tba:100:mob:10004
  field: description
  en: Although the coyote looks a little too skinny, it is definitely still in very good shape.  This scavenger has learned
    to live off the land and has become a common nuisance to the farmers in the area.  Entire packs have been known to take
    down a stray cow.
  ko: 코요테는 조금 마른 것처럼 보이지만, 분명 매우 좋은 컨디션이다. 이 잡식동물은 자연에서 살아남는 법을 익혀 이 지역의 농부들에게 흔한 골칫거리가 되었다. 무리 전체가 방목 중인 소 한 마리를 잡아 버리는 일도
    드물지 않다.
  verdict: wrong
  note: '''scavenger''를 ''잡식동물''로 오역했다. ''stray cow''를 ''방목 중인 소''로 오역했다. ''have been known to''를 ''드물지 않다''로 옮겨 빈도가 과장되었다.
    ''컨디션''은 어색한 외래어다.'
  fix: 코요테는 조금 지나치게 말라 보이지만, 몸 상태는 분명 아주 좋다. 이 청소동물은 땅에서 나는 것으로 먹고사는 법을 익혀, 이 지역 농부들에게 흔한 골칫거리가 되었다. 무리 전체가 달려들어 무리에서 떨어진
    소 한 마리를 쓰러뜨린 일도 있다고 알려져 있다.
- id: tba:100:room:10013
  field: name
  en: The Beginning of the Plains
  ko: 초원의 시작
  verdict: awkward
  note: 다른 방에서 'plains'를 '평원'으로 옮겼으므로 '초원' 대신 '평원'으로 통일해야 한다.
