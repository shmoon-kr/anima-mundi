  ko: 길은 작은 연못을 돌아 서쪽으로 꺾이거나, 남쪽으로 도시로 돌아간다. 바로 북쪽의 연못은 연못이라기보다는 늪에 가깝다. 병들고 죽어가는 나무들이 여기저기 흩어져 있다. 이 지역이 최근에 홍수를 겪은 것처럼 보인다.
