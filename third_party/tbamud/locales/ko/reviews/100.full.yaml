  fix: 던 모라의 성벽 옆
- id: tba:100:room:10098
  field: description
  en: The wall of the city of minotaurs blocks you from going any further north. The gates to the city must be west from here.  The
    forest south looks very gloomy.  To the east is more of the city wall that heads out into the plains.
  ko: 미노타우로스 도시의 성벽이 북쪽으로 더 나아갈 길을 막고 있다. 도시의 성문은 여기서 서쪽 어딘가에 있을 것이다. 남쪽의 숲은 매우 음산해 보인다. 동쪽으로는 평야로 뻗어 나가는 성벽의 일부가 보인다.
  verdict: awkward
  note: '''성벽의 일부가 보인다''는 ''more of the city wall''을 딱딱하게 직역한 것이다. 앞에서 ''평원''으로 옮긴 plains를 여기서는 ''평야''로 옮겨 용어가 엇갈린다.'
  fix: 미노타우로스 도시의 성벽이 북쪽으로 더 나아갈 길을 막고 있다. 도시의 성문은 여기서 서쪽 어딘가에 있을 것이다. 남쪽의 숲은 매우 음산해 보인다. 동쪽으로는 성벽이 평원 쪽으로 계속 뻗어 나간다.
