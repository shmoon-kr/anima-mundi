  ko: 당신은 미노타우로스 도시의 성문 앞에 서 있다. 불행히도 성문은 닫혀 있으며, 꽤 오랜 시간 동안 이 상태였던 것처럼 보인다. 동쪽과 서쪽으로 성벽을 따라 탐색하거나, 남쪽으로 돌아가 집으로 향할 수 있다.
