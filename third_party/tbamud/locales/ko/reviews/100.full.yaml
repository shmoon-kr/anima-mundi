  fix: 성긴 숲
- id: tba:100:room:10062
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: wrong
  note: 8번과 같은 오역이다. Light Forest는 '성긴 숲'이다.
  fix: 성긴 숲
- id: tba:100:room:10061
  field: description
  en: The forest is slowly turning into plains here.  To the east you see huge fields of grass, perfectly level land that
    you can see for miles.  South of you is a large natural crater of some sort.  It looks as if the ground had recently just
    given way.
  ko: 숲은 여기서 서서히 평원으로 변하고 있다. 동쪽으로는 끝없이 펼쳐진 거대한 풀밭이 보인다. 수평선까지 이어질 만큼 평평한 땅이다. 남쪽으로는 어떤 종류의 거대한 자연 크레이터가 있다. 땅이 최근에 무너진 것처럼
