  verdict: awkward
  note: '''Then again''을 ''하지만 다시 생각해보면''으로 옮겨 장황하고 딱딱하다.'
  fix: 여기 숲은 밝고 경쾌하다. 당신은 모든 걱정을 잊고 아름다운 경치를 즐긴다. 여기서는 걱정할 것이 없다. 그저 무해한 작은 숲속 동물들뿐이다. 그런데 어쩌면 이 동물들 가운데 몇몇은 그리 무해하지 않을지도
    모른다.
- id: tba:100:room:10010
  field: name
  en: Off the Northern Road
  ko: 북쪽 길에서 벗어난 곳
  verdict: awkward
  note: 의미는 맞다. 다만 같은 고유 지명 'the Northern Road'가 2·13번에서는 '북쪽 도로'로 옮겨져 있어 표기를 통일해야 한다.
  fix: 북쪽 도로에서 벗어난 곳
- id: tba:100:room:10085
  field: description
  en: The road turns to the east or south from here.  You think to the west you can see the northern road.  You look for any
    signs of life, but find nothing. It seems you are deep into the wilderness where few dare go.
  ko: 이곳에서 길은 동쪽이나 남쪽으로 꺾인다. 서쪽으로는 북쪽 도로가 보이는 것 같다. 당신은 생명의 흔적을 찾아보지만 아무것도 발견하지 못한다. 당신은 아무도 감히 들어가지 않는 광활한 야원의 한가운데에 있는 듯하다.
  verdict: wrong
  note: '''야원''은 없는 말이고, wilderness는 ''황야''다. 원문에 없는 ''광활한''이 추가되었다. ''few dare go''(감히 가는 이가 드문)를 ''아무도 감히 들어가지 않는''으로 옮겨
    의미가 과장되었다. ''당신은''도 두 번 반복된다.'
  fix: 이곳에서 길은 동쪽이나 남쪽으로 꺾인다. 서쪽으로는 북쪽 도로가 보이는 것 같다. 당신은 생명의 흔적을 찾아보지만 아무것도 발견하지 못한다. 감히 들어서는 이가 드문 황야 깊숙이 들어온 듯하다.
- id: tba:100:room:10093
  field: description
  en: Barren plains stretch east and south from here.  Just to the north you see the walls of a city.  West you can enter
    a dark forest.  A wind blows from the east, bringing with it an unseasonal chill.
  ko: 여기서 동쪽과 남쪽으로 척박한 평원이 펼쳐져 있다. 바로 북쪽으로는 도시의 성벽이 보인다. 서쪽으로는 어두운 숲으로 들어갈 수 있다. 동쪽에서 불어오는 바람이 때 아닌 서늘함을 가져온다.
  verdict: awkward
  note: chill은 '서늘함'보다 '한기'가 맞다. '서늘함을 가져온다'는 직역투라 어색하다.
  fix: 여기서 동쪽과 남쪽으로 척박한 평원이 펼쳐져 있다. 바로 북쪽으로는 도시의 성벽이 보인다. 서쪽으로는 어두운 숲으로 들어갈 수 있다. 동쪽에서 바람이 불어와 철 이른 한기를 몰고 온다.
- id: tba:100:room:10040
  field: description
  en: You walk out onto a small natural jetty sticking out into the middle of the swamp.  Fetid water surrounds you, leaving
    the only way out to the north. Something causes ripples in the water, but is gone before you can tell what it was.
  ko: 당신은 늪 한가운데로 뻗어 나온 작은 자연 암반 위에 서 있다. 썩은 물이 당신을 에워싸고 있어, 북쪽이 유일한 탈출구다. 물에 무언가가 파문을 일으키지만, 그것이 무엇이었는지 알아볼 새도 없이 사라져 버린다.
  verdict: wrong
  note: jetty(물로 튀어나온 둑)를 '암반'으로 잘못 옮겼다. 'walk out onto'(걸어 나간다)가 '서 있다'로 바뀌었다. '탈출구'는 과한 표현이다.
  fix: 당신은 늪 한가운데로 튀어나온, 자연적으로 생긴 작은 둑 위로 걸어 나간다. 썩은 물이 사방을 에워싸고 있어 나갈 길은 북쪽뿐이다. 무언가가 물에 파문을 일으키지만, 그것이 무엇이었는지 알아볼 새도 없이 사라져
    버린다.
- id: tba:100:room:10095
  field: name
  en: Beside the City Walls of Dun Maura
  ko: 둔모라의 성벽 옆
  verdict: awkward
