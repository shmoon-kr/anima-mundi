  ko: 평원이 시야가 닿는 한계까지 북쪽과 동쪽으로 펼쳐져 있다. 남쪽에서는 물이 흐르는 소리가 들린다. 서쪽으로는 을씨년스러운 늪지대가 보인다. 그 평원에서 길을 잃었다는 이야기를 들은 탓에, 당신은 문명권에서 더
