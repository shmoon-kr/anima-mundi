  ko: 이 늪을 질척질척 건너가며 당신은 혐오스럽게 찡그린다. 오늘은 더 이상 좋은 날이 아닌 것 같다. 습지는 음산하고 냄새가 난다. 북쪽 길은 서쪽에 있다. 북쪽이나 동쪽으로는 마른 숲이 이어진다.
  verdict: awkward
  note: '''혐오스럽게 찡그린다''는 직역투다.'
  fix: 이 늪을 질척질척 건너가며 당신은 역겨워 얼굴을 찌푸린다. 오늘은 더 이상 좋은 날이 아닌 것 같다. 습지는 음산하고 냄새가 난다. 북쪽 길은 서쪽에 있다. 북쪽이나 동쪽으로는 마른 숲이 이어진다.
- id: tba:100:obj:10014
  field: long
  en: A brass lantern is extinguished here.
  ko: 여기서 황동 랜턴 하나가 꺼져 있다.
  verdict: awkward
  note: '''여기서 ~하나가 꺼져 있다''는 ''X is ... here'' 구문을 직역한 것이다. 놓여 있는 물건을 묘사하는 문장으로 바꿔야 자연스럽다.'
  fix: 꺼진 황동 랜턴 하나가 여기 놓여 있다.
- id: tba:100:room:10029
  field: description
  en: The river roars past you to the north.  You can only leave east or west.  To the east you can see the northern road
