  ko: 당신은 나무들이 더 이상 당신을 짓누르지 않는 작은 빈터에 도착한다. 숲은 모든 방향으로 이어진다. 북쪽을 보면 북쪽 도로가 희미하게 보인다. 남쪽은 더 많은 늪으로 이어지는 듯하다.
  verdict: wrong
  note: '''you think you can see''의 불확실성이 빠졌다. ''northern road''를 ''북쪽 도로''로 옮겨 다른 항목의 ''북쪽 길''과 어긋난다. ''짓누르지'', ''더 많은 늪''도
    직역투다.'
  fix: 당신은 나무들이 더 이상 빽빽이 에워싸지 않는 작은 빈터에 이른다. 숲은 사방으로 이어진다. 북쪽으로 북쪽 길이 보이는 것 같다. 남쪽은 늪이 계속되는 듯하다.
- id: tba:100:room:10070
  field: description
  en: The forest is light and cheery here.  You forget about all your worries and enjoy the fine scenery.  Nothing to worry
    about here.  Just a bunch of harmless little forest animals.  Then again, maybe some of these animals are not so harmless.
  ko: 여기 숲은 밝고 경쾌하다. 당신은 모든 걱정을 잊고 아름다운 경치를 즐긴다. 여기서는 걱정할 것이 없다. 그저 무해한 작은 숲속 동물들뿐이다. 하지만 다시 생각해보면, 이 동물들 중 일부는 그렇게 무해하지 않을지도
