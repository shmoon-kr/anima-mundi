not_ok:
- id: tba:100:room:10062
  field: description
  en: The trees here are all tall hardwoods, spread far apart so you can see for some distance.  To the east the trees grow
    even more sparse and finally give way to the plains.  West will take you back into the thick forest.
  ko: 여기의 나무들은 모두 키가 큰 활엽수이며, 서로 멀리 떨어져 있어 꽤 먼 곳까지 시야가 트인다. 동쪽으로 갈수록 나무는 더 드물어지고, 마침내 평원으로 이어진다. 서쪽으로 가면 다시 짙은 숲속으로 들어간다.
  verdict: awkward
  note: 뜻은 맞지만 '여기의 나무들은'이 어색하다. '이곳의 나무는'이 자연스럽다.
  fix: 이곳의 나무는 모두 키 큰 활엽수인데, 서로 멀찍이 떨어져 있어 꽤 먼 곳까지 시야가 트인다. 동쪽으로 갈수록 나무는 더 드물어지고, 마침내 평원으로 이어진다. 서쪽으로 가면 다시 짙은 숲속으로 들어간다.
- id: tba:100:obj:10015
  field: extras.0.text
  en: This backpack is made from deer hide and is extremely durable.  It can be worn about the body.
  ko: 이 배낭은 사슴 가죽으로 만들어져 매우 튼튼하다. 몸에 걸어서 사용할 수 있다.
  verdict: awkward
  note: '''몸에 걸어서 사용할 수 있다''는 직역투다. 배낭이므로 ''몸에 둘러멜 수 있다''가 자연스럽다.'
  fix: 이 배낭은 사슴 가죽으로 만들어져 매우 튼튼하다. 몸에 둘러멜 수 있다.
- id: tba:100:room:10009
  field: description
  en: The forest seems so peaceful and quiet, a little too quiet.  Where have all the animals gone?  Tall trees are blocking
    a lot of the sunlight here.  It looks even thicker to the west.  The forest continues in all directions.
  ko: 숲은 평화롭고 조용해 보인다. 오히려 너무 조용하다. 동물들은 모두 어디로 간 것일까? 높은 나무들이 이곳의 햇빛을 많이 가리고 있다. 서쪽은 더 짙어 보인다. 숲은 모든 방향으로 이어진다.
  verdict: awkward
  note: '''이곳의 햇빛을 많이 가리고''와 ''서쪽은 더 짙어 보인다''가 어색하다. 서쪽에서 짙은 것이 숲이라는 주어가 빠져 있다.'
  fix: 숲은 무척 평화롭고 조용하다. 아니, 조금 지나치게 조용하다. 동물들은 다 어디로 갔을까? 키 큰 나무들이 햇빛을 상당히 가리고 있다. 서쪽으로는 숲이 더 짙어 보인다. 숲은 사방으로 이어진다.
- id: tba:100:mob:10000
  field: description
  en: This recluse has been living outside of the city for too long.  He is disheveled and in desperate need of a bath and
    clean clothes.  He must be strong and determined to survive out here on his own.
  ko: 이 은둔자는 도시 밖에서 너무 오래 살았다. 그는 지저분하고 목욕과 깨끗한 옷이 절실히 필요하다. 혼자 여기서 살아남으려면 강하고 결단력이 있어야 했을 것이다.
  verdict: awkward
  note: '''그는 지저분하고 목욕과 깨끗한 옷이 절실히 필요하다''는 번역투다. ''must be''는 현재의 추측이므로 ''~했을 것이다''보다 ''~임이 틀림없다''가 맞다.'
  fix: 이 은둔자는 너무 오랫동안 도시 밖에서 살아왔다. 몰골이 엉망이라 목욕을 하고 깨끗한 옷으로 갈아입는 일이 시급해 보인다. 이런 곳에서 혼자 살아남았으니 강인하고 의지가 굳은 사람임이 틀림없다.
- id: tba:100:room:10016
  field: description
  en: The northern road is just to your east now.  It seems to curve around to the north.  The trees here are spaced several
    feet apart and you can see the movement of wildlife in the distance.
  ko: 북쪽 길은 이제 바로 동쪽에 있다. 길은 북쪽으로 휘어지는 듯하다. 여기의 나무들은 약 1미터 이상 간격을 두고 서 있으며, 멀리서 야생동물이 움직이는 것이 보인다.
  verdict: awkward
  note: '''여기의 나무들은''이 어색하다. ''several feet''를 ''약 1미터 이상''으로 옮겨 딱딱하다. ''몇 걸음씩''이 자연스럽다.'
  fix: 북쪽 길이 이제 바로 동쪽에 있다. 길은 북쪽으로 휘어 도는 듯하다. 이곳의 나무들은 몇 걸음씩 간격을 두고 서 있어, 멀리서 야생동물이 움직이는 모습이 보인다.
- id: tba:100:room:10060
  field: description
  en: Just to the south you see a bridge that crosses some of the swamp.  Forest surrounds you on all other sides.  This part
    of the forest seems peaceful. Birds chirping and small animals chattering.
  ko: 남쪽으로 가면 습지를 건너는 다리가 보인다. 그 외 모든 방향으로는 숲이 당신을 둘러싸고 있다. 이 숲의 이 부분은 평온해 보인다. 새들이 지저귀고 작은 동물들이 웅성거린다.
  verdict: wrong
  note: '''Just to the south you see''는 지금 바로 남쪽에 다리가 보인다는 뜻이다. ''남쪽으로 가면 보인다''는 의미가 바뀐다. ''some of the swamp''의 ''일부''가 빠졌다.
    ''이 숲의 이 부분은''은 어색하다. 작은 동물의 ''chattering''을 ''웅성거린다''로 옮긴 것도 오역이다.'
  fix: 바로 남쪽에 습지 일부를 가로지르는 다리가 보인다. 나머지 사방은 숲으로 둘러싸여 있다. 숲의 이쪽은 평온해 보인다. 새들이 지저귀고 작은 동물들이 재잘거린다.
- id: tba:100:obj:10000
  field: extras.0.text
  en: As you examine the bunk closer you notice some of the rags may not be as shabby as you originally thought. No one would
    miss them, would they?
  ko: 이층 침대를 더 자세히 살펴보니, 일부 헝겊은 처음 생각했던 것만큼 낡지 않은 것 같다. 누가 그걸 보고 그리워하겠는가?
  verdict: wrong
  note: '''No one would miss them''은 없어져도 아무도 모른다는 뜻이다. ''그리워하겠는가''는 오역이다. ''bunk''는 이층 침대로 단정할 수 없으니 ''침상''이 맞다.'
  fix: 침상을 더 자세히 살펴보니, 헝겊 몇 장은 처음 생각했던 것만큼 낡지 않은 것 같다. 없어져도 아무도 모르지 않을까?
- id: tba:100:room:10056
  field: description
  en: The northern road turns sharply east here.  You must be getting closer to the city of Dun Maura.  The road to the south
    leads back to the safety of the city.  North is more dense forest.  To the west a fresh path has been hacked through the
    woods.
  ko: 북쪽 길은 여기서 갑자기 동쪽으로 꺾인다. 던 모라(Dun Maura) 성에 점점 가까워지는 것 같다. 남쪽 길은 성의 안전한 곳으로 되돌아간다. 북쪽은 울창한 숲이다. 서쪽으로는 숲을 뚫어 만든 새 길이 보인다.
  verdict: wrong
  note: '''city''를 ''성''으로 옮긴 것은 오역이다. 원문에 없는 ''(Dun Maura)''가 덧붙었고, 4번과 표기가 다르다. ''sharply''는 ''갑자기''가 아니라 ''급히''다. ''more
    dense''의 비교 의미가 빠졌다. ''성의 안전한 곳으로 되돌아간다''는 어색하다.'
  fix: 북쪽 길은 여기서 급히 동쪽으로 꺾인다. 둔모라 시에 점점 가까워지고 있는 것 같다. 남쪽 길을 따라가면 안전한 도시로 돌아갈 수 있다. 북쪽으로는 숲이 더 울창하다. 서쪽으로는 숲을 베어 내고 새로 낸 길이
    나 있다.
- id: tba:100:room:10035
  field: description
  en: As you walk on the northern road, just north of the river, you feel as if you are being watched.  Someone could easily
    hide in these woods.  The road continues north or turns east towards a bridge.
  ko: 강 북쪽의 북쪽 길을 걷고 있는데, 누군가 지켜보고 있는 듯한 기분이 든다. 이 숲속이라면 누군가 쉽게 숨을 수 있을 것이다. 길은 북쪽으로 계속 이어지거나, 다리를 향해 동쪽으로 꺾인다.
  verdict: awkward
  note: '''강 북쪽의 북쪽 길''은 북쪽이 겹쳐 어색하다.'
  fix: 강 바로 북쪽에서 북쪽 길을 걷고 있자니, 누군가 지켜보는 듯한 기분이 든다. 이런 숲속이라면 누구든 쉽게 숨을 수 있겠다. 길은 북쪽으로 계속 이어지거나, 다리를 향해 동쪽으로 꺾인다.
- id: tba:100:room:10050
  field: description
  en: The northern road hugs the edge of the pond to the east.  The forest to the west looks too thick to bother leaving the
    easy travelling of this road.  The road continues north and south.
  ko: 북쪽 길은 동쪽 연못 가장자리를 따라 이어진다. 서쪽 숲은 너무 짙어 이 길의 편한 여행길을 포기하고 싶지 않다. 이 길은 북쪽과 남쪽으로 계속 이어진다.
  verdict: awkward
  note: '''이 길의 편한 여행길을 포기하고 싶지 않다''는 비문에 가깝다. ''hugs''는 ''끼고 이어진다''가 자연스럽다.'
  fix: 북쪽 길은 동쪽의 연못 가장자리를 끼고 이어진다. 서쪽 숲은 너무 울창해서, 굳이 편한 이 길을 벗어날 마음이 들지 않는다. 길은 북쪽과 남쪽으로 이어진다.
- id: tba:100:room:10084
  field: name
  en: Light Forest
  ko: 밝은 숲
  verdict: awkward
  note: '''light forest''는 나무가 듬성한 숲을 뜻한다. ''밝은 숲''은 뜻이 모호하고, ''Deep Forest(깊은 숲)''와 짝을 이루지도 못한다.'
  fix: 성긴 숲
- id: tba:100:room:10032
  field: description
  en: As you walk along the edge of the river you begin to wonder why there are no signs of civilization around.  You would
    think this would be a great place to live off the land.  You can continue along the river east or west.
  ko: 강가를 따라 걷다 보니 주변에 문명의 흔적이 전혀 없는 이유가 궁금해진다. 이 정도면 땅에서 살아가기에 아주 좋은 곳일 텐데. 강을 따라 동쪽이나 서쪽으로 계속 나아갈 수 있다.
  verdict: awkward
  note: '''live off the land''를 ''땅에서 살아가기''로 직역했다. 이 표현은 자연에서 먹을 것을 얻으며 산다는 뜻이다.'
  fix: 강가를 따라 걷다 보니 주변에 문명의 흔적이 전혀 없는 이유가 궁금해진다. 자연에서 나는 것만으로 살아가기에 더없이 좋은 곳일 텐데. 강을 따라 동쪽이나 서쪽으로 계속 나아갈 수 있다.
- id: tba:100:obj:10004
  field: long
  en: A murky pond is stagnating here.
  ko: 어두컴컴한 웅덩이가 여기 고여 있다.
  verdict: wrong
  note: murky는 '탁한'이지 '어두컴컴한'이 아니다. pond는 '웅덩이'가 아니라 '연못'이다. stagnating의 '썩어 가는' 뉘앙스도 빠졌다.
  fix: 물이 고여 썩어 가는 탁한 연못이 여기 있다.
- id: tba:100:room:10023
  field: description
  en: The northern road leads right up to the edge of a vast lake.  The water looks clean and refreshing.  A blanket of fog
    obscures what is on the other side. The road goes continues east to west to go around the lake.
  ko: 북쪽 도로는 광활한 호수의 가장자리 바로까지 이어진다. 물은 맑고 상쾌해 보인다. 안개 한 겹이 건너편을 가리고 있다. 도로는 호수를 돌아 동서로 계속 이어진다.
  verdict: awkward
  note: 방 이름은 '북쪽 길'인데 본문은 '북쪽 도로'라서 용어가 다르다. '가장자리 바로까지'와 '안개 한 겹'은 직역투다.
  fix: 북쪽 길은 광활한 호수 가장자리까지 곧장 이어진다. 물은 맑고 상쾌해 보인다. 자욱한 안개가 건너편을 가리고 있다. 길은 호수를 돌아 동서로 계속 이어진다.
- id: tba:100:room:10002
  field: description
  en: As you walk by the city wall, you notice the forest is getting thicker.  A slight gloom hangs over this part of the
    woods.  You start to walk a little faster.  Further to the west you can see a small clearing with something that looks
    like a shack.
  ko: 도시 성벽을 따라 걷다 보니 숲이 점점 짙어지는 것을 느낀다. 이 숲의 일부에는 희미한 음산함이 감돈다. 당신은 걸음을 조금 더 빨리 내딛기 시작한다. 서쪽으로 더 가면 무언가 오두막처럼 보이는 것이 있는 작은
    빈터가 보인다.
  verdict: awkward
  note: '''이 숲의 일부에는'', ''걸음을 조금 더 빨리 내딛기 시작한다'', ''무언가 오두막처럼 보이는 것이 있는''이 모두 직역투다.'
  fix: 성벽을 따라 걷다 보니 숲이 점점 울창해진다. 숲의 이 일대에는 어렴풋한 음산함이 감돈다. 당신은 저도 모르게 걸음을 재촉한다. 서쪽으로 더 가면 오두막처럼 보이는 무언가가 있는 작은 빈터가 보인다.
- id: tba:100:room:10010
  field: description
  en: Just west off the northern road, the forest is very peaceful and quiet.  The sounds of nature soothe you into a feeling
    of false security.  You wonder at the tall trees and abundant wildlife.
  ko: 북쪽 길에서 바로 서쪽으로 벗어나면, 숲은 매우 평화롭고 조용하다. 자연의 소리가 당신을 가짜 안도감으로 몰아넣는다. 당신은 높은 나무들과 풍부한 야생동물을 바라보며 감탄한다.
  verdict: awkward
  note: '''가짜 안도감으로 몰아넣는다''는 ''false sense of security''를 어색하게 직역한 것이다.'
  fix: 북쪽 길에서 서쪽으로 조금 벗어난 이곳의 숲은 매우 평화롭고 조용하다. 자연의 소리에 당신은 저도 모르게 거짓된 안도감에 젖어 든다. 당신은 높이 솟은 나무들과 풍부한 야생동물에 감탄한다.
- id: tba:100:room:10007
  field: description
  en: Because of the tall grass, you almost stumble right into a massive crevice to the east.  It looks impossible to cross.  You
    have no choice but to head back west.  These plains give you an eerie feeling anyways.
  ko: 키 큰 풀 때문에 당신은 거의 동쪽의 거대한 균열에 발을 걸칠 뻔했다. 건너갈 수 없어 보인다. 당신은 서쪽으로 되돌아갈 수밖에 없다. 어쨌든 이 들판은 당신에게 섬뜩한 느낌을 준다.
  verdict: wrong
  note: '''stumble right into''는 균열에 빠질 뻔했다는 뜻이다. ''발을 걸칠 뻔했다''는 의미가 다르다. 또 plains를 ''들판''으로 옮겨 다른 방의 ''평원''과 맞지 않는다.'
  fix: 키 큰 풀 때문에 당신은 하마터면 동쪽의 거대한 균열 속으로 곧장 빠질 뻔했다. 건너갈 수 없어 보인다. 당신은 서쪽으로 되돌아갈 수밖에 없다. 어차피 이 평원은 당신에게 섬뜩한 느낌을 준다.
- id: tba:100:room:10077
  field: description
  en: The road turns to the north or west from here.  Forest lies to the south and the start of the plains is to the east.  This
    road is covered with grass and even a few small trees.  It looks like no one has travelled it for years.
  ko: 길이 여기서 북쪽이나 서쪽으로 꺾인다. 남쪽에는 숲이 있고, 동쪽에는 평원의 시작 부분이 보인다. 길은 풀로 덮여 있고 작은 나무 몇 그루도 자라고 있다. 수년 동안 아무도 이 길을 여행하지 않은 것처럼 보인다.
  verdict: awkward
  note: '''평원의 시작 부분이 보인다''와 ''이 길을 여행하지 않은''이 부자연스럽다.'
  fix: 길이 여기서 북쪽이나 서쪽으로 꺾인다. 남쪽에는 숲이 있고, 동쪽에서는 평원이 시작된다. 길은 풀로 덮여 있고 작은 나무 몇 그루까지 자라 있다. 수년 동안 아무도 이 길을 지나다니지 않은 것처럼 보인다.
- id: tba:100:room:10013
  field: description
  en: As you finally reach the edge of the plains you are disappointed by a large chasm that blocks any further travel east.  You
    wonder at what could have caused this natural barrier.  You are blocked from continuing north or east.
  ko: 드디어 초원의 가장자리에 이르렀을 때, 동쪽을 더 이상 나아갈 수 없게 막고 있는 깊은 협곡을 보고 실망한다. 이 자연적인 장벽을 만든 것이 무엇인지 궁금해진다. 북쪽과 동쪽으로는 더 이상 갈 수 없다.
  verdict: awkward
  note: plains를 '초원'으로 옮겨 용어가 통일되지 않았다. '동쪽을 더 이상 나아갈 수 없게'는 조사가 어색하다.
  fix: 드디어 평원의 가장자리에 이르렀지만, 큰 협곡이 가로막고 있어 동쪽으로는 더 나아갈 수 없다는 사실에 실망한다. 무엇이 이런 자연의 장벽을 만들었는지 궁금해진다. 북쪽과 동쪽으로는 더 이상 갈 수 없다.
- id: tba:100:mob:10003
  field: long
  en: A red fox sneaks slowly away from you, trying to go unnoticed.
  ko: 붉은 여우 한 마리가 당신을 모르게 하려 하며 천천히 멀어지고 있다.
  verdict: awkward
  note: '''당신을 모르게 하려 하며''는 비문이다. ''trying to go unnoticed''는 ''눈에 띄지 않으려 애쓰며''로 옮겨야 한다.'
  fix: 붉은 여우 한 마리가 눈에 띄지 않으려 애쓰며 당신에게서 슬금슬금 멀어진다.
- id: tba:100:room:10099
  field: description
  en: The plains go for miles to the south and east.  The city walls of Dun Maura are directly north of you.  Also to the
    west you can see a light forest and what looks like the northern road in the distance.
  ko: 평야가 남쪽과 동쪽으로 수 킬로미터나 펼쳐져 있다. 둔모라의 성벽은 바로 북쪽에 있다. 서쪽으로는 희미한 숲과 멀리서 북쪽 도로로 보이는 것이 보인다.
  verdict: wrong
  note: light forest를 '희미한 숲'으로 오역했다. plains는 '평야', the northern road는 '북쪽 도로'로 옮겨 용어가 통일되지 않았다. '보이는 것이 보인다'는 중복이다.
  fix: 평원이 남쪽과 동쪽으로 수 킬로미터나 펼쳐져 있다. 둔모라의 성벽은 바로 북쪽에 있다. 서쪽으로는 성긴 숲이 있고, 멀리 북쪽 길인 듯한 것도 보인다.
- id: tba:100:mob:10014
  field: long
  en: A lynx hisses at you as you walk by.
  ko: 당신이 지나가자 린क्स 한 마리가 으르렁거린다.
  verdict: wrong
  note: '''린क्स''에 데바나가리 문자가 섞였다. lynx는 ''스라소니''다. hiss는 ''으르렁거리다''가 아니라 ''쉭쉭거리다''다.'
  fix: 당신이 지나가자 스라소니 한 마리가 쉭쉭거린다.
- id: tba:100:room:10058
  field: description
  en: You frown in disgust as you slosh your way through this bog.  It just does not seem like a good day anymore.  The swamp
