  ko: 암사슴은 당신을 주의 깊게 바라본다. 다른 사슴들에게 당신의 존재를 경고하는 듯, 꼬리 밑의 하얀 부분이 번쩍인다. 그녀는 당신을 매우 두려워하고 있어 언제든 도망칠 수 있다.
