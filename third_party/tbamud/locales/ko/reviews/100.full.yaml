  fix: 숲은 여기서 서서히 평원으로 바뀐다. 동쪽으로는 드넓은 풀밭이 보인다. 몇 마일 앞까지 내다보일 만큼 완벽하게 평평한 땅이다. 남쪽에는 자연적으로 생긴 듯한 커다란 구덩이가 있다. 얼마 전에 땅이 꺼져 내린
    것처럼 보인다.
- id: tba:100:room:10026
  field: description
  en: You tromp your way through the forest.  The forest floor is clear and makes for good travelling.  You feel like you
    are making good time and actually getting somewhere.  The forest thickens to the west and north, leaving the only exits
    to the south and east.
  ko: 당신은 숲을 헤쳐 나간다. 숲 바닥은 깨끗하여 이동하기 좋다. 당신은 좋은 속도로 이동하고 있고 실제로 어딘가로 나아가고 있다는 느낌을 받는다. 서쪽과 북쪽으로 갈수록 숲이 짙어지며, 유일한 출구는 남쪽과 동쪽에만
