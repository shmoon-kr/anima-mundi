  ko: 등과 꼬리에 흰 줄무늬가 있는 익숙한 검은색 고양이과 동물을 보자 당신의 발걸음이 멈춘다. 이 동물은 누구도 두려워하지 않는다. 그도 그럴 것이, 이 녀석을 공격했다가 스컹크 냄새를 맡을 바보는 없으니까.
