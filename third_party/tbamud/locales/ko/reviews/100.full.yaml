    어색하다.'
  fix: 북쪽 길은 여기서 북쪽과 남쪽으로 이어진다. 이쯤이면 던 모라에 거의 다 왔을 것이다. 끝도 없이 걸어온 것만 같다. 길에 오가는 사람도 줄어든 것 같다. 그것이 좋은 징조인지 나쁜 징조인지 확신이 서지 않는다.
