  en: The forest finally gives way to the plains here.  Although the plains are perfectly level, allowing you to see for miles,
    one could easily get lost out there once they lost sight of the forest.
  ko: 숲은 여기서 마침내 평원으로 이어진다. 평원은 완벽하게 평평하여 수평선까지 시야가 트이지만, 숲에서 시야가 사라지면 그곳에서 길을 잃기 쉽다.
  verdict: wrong
  note: '''once they lost sight of the forest''는 숲이 시야에서 사라지면이라는 뜻이다. ''숲에서 시야가 사라지면''은 뜻이 다르다. ''see for miles''를 ''수평선까지''로
    바꾼 것도 과장이다.'
  fix: 숲은 여기서 마침내 평원으로 이어진다. 평원은 완벽하게 평평해서 몇 킬로미터 앞까지 내다볼 수 있지만, 일단 숲이 시야에서 사라지면 그곳에서 길을 잃기 쉽다.
- id: tba:100:obj:10012
  field: extras.0.text
  en: This must be one of the biggest trees you've ever seen. The base must be a good three paces in width and you can't even
    make out the top of the tree because of all the branches.
  ko: 당신이 본 나무 중에서도 가장 큰 나무 중 하나일 것이다. 밑동은 약 4.5미터나 될 정도로 넓고, 가지가 너무 많아 나무 꼭대기는 아예 보이지도 않는다.
  verdict: wrong
  note: '''three paces''를 ''4.5미터''로 임의 환산했다. 판타지 세계에서 미터법으로 바꾸면 원문에 없는 수치가 더해진다. ''세 걸음''으로 두어야 한다.'
  fix: 당신이 지금껏 본 나무 중에서도 손꼽히게 큰 나무임이 틀림없다. 밑동의 너비는 족히 세 걸음은 되어 보이고, 가지가 워낙 무성해서 나무 꼭대기는 아예 보이지도 않는다.
- id: tba:100:room:10057
  field: description
  en: The northern road curves yet again to the north.  You wonder why they could not just make a straight road.  Then you
    realize the swamp probably made it impossible.  The pond is to the south and it looks like a swamp to the east.
  ko: 북쪽 길은 또다시 북쪽으로 굽어진다. 왜 그냥 직선으로 만들지 않았는지 궁금하다. 그러다 보니 아마도 습지가 직선 도로를 불가능하게 만들었을 것이다. 남쪽에는 연못이 있고, 동쪽은 습지처럼 보인다.
  verdict: wrong
  note: '''Then you realize''(그러다 깨닫는다)가 빠지고 ''그러다 보니 … 것이다''로 문장이 비문이 되었다. ''You wonder''의 주체도 흐려졌다. ''swamp''를 ''습지''로 옮겨
    24번 ''늪''과 통일되지 않았다.'
  fix: 북쪽 길은 또다시 북쪽으로 굽어진다. 당신은 왜 그냥 곧은 길을 내지 않았는지 궁금해진다. 그러다 아마 늪 때문에 그럴 수 없었으리라는 것을 깨닫는다. 남쪽에는 연못이 있고, 동쪽은 늪처럼 보인다.
- id: tba:100:room:10045
  field: description
  en: You stand in the middle of the swamp, carefully testing every step as you step into the muck.  It seems to be getting
    deeper here.  Your feet sink above the ankles once in a while.  Wildlife seems scarce.  You wonder why anything would
    live here.
  ko: 당신은 늪 한가운데 서서, 진흙에 발을 디딜 때마다 신중하게 발걸음을 확인한다. 이곳에서는 점점 더 깊어지는 것 같다. 가끔 발이 발목 위로 가라앉기도 한다. 야생 동물은 드문 것 같다. 왜 이런 곳에 무엇이든
    살 수 있는지 궁금해진다.
  verdict: wrong
  note: '''why anything would live here''는 ''무엇이 굳이 이런 곳에 살려고 하겠느냐''는 뜻이다. ''살 수 있는지''(능력)로 바뀌어 의미가 어긋났고, ''무엇이든''은 직역투다.
    ''이곳에서는 점점 더 깊어지는 것 같다''는 무엇이 깊어지는지 주어가 없어 어색하다. ''발이 발목 위로 가라앉기도 한다''와 ''야생 동물은 드문 것 같다''도 번역투다.'
  fix: 당신은 늪 한가운데 서서, 진흙 속으로 발을 디딜 때마다 조심스럽게 발밑을 살핀다. 여기서부터는 늪이 점점 깊어지는 듯하다. 이따금 발이 발목 위까지 푹 빠진다. 야생 동물은 드물어 보인다. 대체 무엇이 이런
    곳에 살려고 할까 싶다.
- id: tba:100:room:10072
  field: description
  en: The forest is thick with huge elms and maples.  Just to the north you can make out a small road of some sort.  It definitely
    is not the northern road which you believe is due east of where you are.
  ko: 숲은 거대한 느티나무와 단풍나무로 빽빽하다. 바로 북쪽으로는 어떤 종류의 작은 길이 희미하게 보인다. 분명히 당신이 있는 곳에서 동쪽 방향으로 뻗어 있을 것으로 믿는 북쪽 길이 아니다.
  verdict: wrong
  note: elm은 느릅나무다. 느티나무(zelkova)는 다른 나무다. 'due east of where you are'는 북쪽 길이 '정동쪽에 있다'는 뜻인데, '동쪽 방향으로 뻗어 있을'로 바뀌어 의미가 달라졌다.
    마지막 문장은 관형절이 길게 얽혀 읽기 어렵다. '어떤 종류의 작은 길'은 직역투다.
  fix: 숲에는 거대한 느릅나무와 단풍나무가 빽빽하다. 바로 북쪽으로 작은 길 같은 것이 어렴풋이 보인다. 그 길은 분명 북쪽 길이 아니다. 북쪽 길은 이곳에서 정동쪽에 있을 것이다.
