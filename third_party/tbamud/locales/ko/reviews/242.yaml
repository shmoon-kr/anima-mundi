- id: tba:242:room:24296
  field: description
  en: You're in an old dark passageway. The paint is peeling off the walls, and a single light bulb hangs from the ceiling.
    The floor is cement, and has scuff marks all over it. The passage is quite wide. It seems as though this hall used to
    be used for hauling equipment and goods. A wooden door leads north.
  ko: 낡고 어두운 통로에 있다. 벽의 페인트가 벗겨져 있고, 천장에는 전구 하나가 매달려 있다. 바닥은 시멘트로 되어 있으며 여기저기 긁힌 자국이 가득하다. 통로는 꽤 넓다. 이 복도는 예전에 장비나 물자를 운반하는
    데 쓰였던 것 같다. 북쪽으로 나무 문이 하나 있다.
  verdict: ok
  note: ''
