- id: tba:242:room:24242
  field: description
  en: You're in the seats of the theater. They're a dark red color, and they feel very soft. You can see the stage, far in
    front of you. Except for the lights of the stage, this area is totally dark.
  ko: 당신은 극장의 좌석에 있다. 좌석은 짙은 붉은색이며, 매우 부드럽게 느껴진다. 정면 멀리 앞쪽에는 무대가 보인다. 무대 조명을 제외하면 이 일대는 완전히 어둡다.
  verdict: awkward
  note: '''정면 멀리 앞쪽에는''은 뜻이 겹치고, ''부드럽게 느껴진다''는 번역투다. ''좌석에 있다''보다 ''객석에 있다''가 자연스럽다.'
  fix: 당신은 극장 객석에 있다. 좌석은 짙은 붉은색이고, 무척 푹신하다. 저 멀리 정면에 무대가 보인다. 무대 조명을 빼면 이곳은 완전히 깜깜하다.
