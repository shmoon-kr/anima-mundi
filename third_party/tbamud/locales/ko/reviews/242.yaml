- id: tba:242:room:24284
  field: description
  en: You're standing on the very middle of sheet 2. The ice is slippery, and it's fairly cold in here. You can hear the light
    humming of a machine somewhere. Bright lights shine down on you from above, illuminating this area quite well.
  ko: 당신은 시트 2의 정중앙에 서 있다. 얼음은 미끄럽고, 여기는 꽤 춥다. 어딘가에서 기계의 부드러운 윙윙거리는 소리가 들린다. 위에서 밝은 빛이 쏟아져 내려 이 지역을 꽤 잘 비추고 있다.
  verdict: wrong
  note: '''light humming''의 light는 ''희미한''이라는 뜻인데 ''부드러운''으로 오역했다. ''this area''를 ''이 지역''으로 옮긴 것도 방 묘사에는 어색하다.'
  fix: 당신은 시트 2의 정중앙에 서 있다. 얼음은 미끄럽고, 이곳은 꽤 춥다. 어딘가에서 기계가 희미하게 윙윙거리는 소리가 들린다. 위에서 밝은 조명이 내리쬐어 이곳을 환히 비추고 있다.
