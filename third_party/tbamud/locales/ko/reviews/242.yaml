  note: '''has been left here''를 ''남겨져 있다''로 옮긴 수동 번역투다. 바닥 물건 묘사는 ''놓여 있다''가 자연스럽다.'
  fix: 화려한 검은 드레스 한 벌이 여기 놓여 있다.
