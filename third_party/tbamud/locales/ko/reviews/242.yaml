  ko: 드레스룸 3
  verdict: wrong
  note: 극장의 dressing room은 '분장실'이다. '드레스룸'은 한국어에서 옷방이나 붙박이 옷장을 뜻한다.
  fix: 분장실 3
- id: tba:242:obj:24203
  field: extras.1.text
  en: You've been ripped off!  It says here at the bottom of the label, in really really small letters, 'Bottled in the Midgaard
    branch of Evian Inc.  This water is from the natural, mostly clean River of Midgaard.  '
  ko: 당신은 속은 것이다! 라벨 하단에 정말로 정말로 작은 글씨로 이렇게 적혀 있다. '에비앙 주식회사 미드가르드 지사에서 병입함. 이 물은 미드가르드의 자연적이고 대부분 깨끗한 강에서 온 것입니다.'
  verdict: awkward
  note: '''You''ve been ripped off!''는 ''바가지를 썼다!''가 자연스럽다. ''정말로 정말로''는 반복이 어색하다. ''River of Midgaard''는 고유명사인 ''미드가르드 강''으로
    옮기는 편이 낫다.'
  fix: 바가지를 썼다! 라벨 맨 아래에 아주아주 작은 글씨로 이렇게 적혀 있다. '에비앙 주식회사 미드가르드 지사에서 병입. 이 물은 천연의, 대체로 깨끗한 미드가르드 강에서 왔습니다.'
