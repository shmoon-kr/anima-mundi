- id: tba:242:room:24208
  field: description
  en: Razor's Square is the southernmost square in Midgaard. South of you is wall road, while to the north you can see most
    of the city of Midgaard. You can see some street vendors here, standing inside small kiosks. You can see everything from
    cheap jewelry to leather jackets for sale.
  ko: 레이저 광장은 미드가르드에서 가장 남쪽에 있는 광장이다. 남쪽으로는 성벽길이 이어지고, 북쪽으로는 미드가르드 도시의 대부분이 보인다. 여기저기 작은 부스 안에 서 있는 길거리 상인들을 볼 수 있다. 값싼 장신구부터
    가죽 재킷까지 온갖 물건이 팔리고 있다.
  verdict: awkward
  note: '''여기저기''는 원문에 없는 말이다. ''볼 수 있다''를 반복해 번역투가 됐다. kiosk는 ''가판대''가 더 자연스럽다.'
  fix: 레이저 광장은 미드가르드에서 가장 남쪽에 있는 광장이다. 남쪽으로는 성벽길이 있고, 북쪽으로는 미드가르드 시가지 대부분이 눈에 들어온다. 이곳에는 작은 가판대 안에 선 노점상 몇이 있다. 싸구려 장신구부터
    가죽 재킷까지 온갖 물건을 판다.
- id: tba:242:room:24253
  field: description
  en: You're in the middle of the left aisle of the theater. The stage is now directly in front of you, with some stairs leading
    up to it. Bright lights shine all across it, making it look quite bright.
  ko: 당신은 극장의 왼쪽 복도 한가운데에 서 있다. 무대가 바로 앞에 있으며, 무대로 올라가는 계단이 몇 개 있다. 밝은 불빛이 무대 전체를 비추어 꽤 환해 보인다.
  verdict: wrong
  note: 극장 aisle은 좌석 사이 '통로'다. '복도'는 오역이다. '서 있다'는 원문에 없고, 'now'(이제)가 빠졌다.
  fix: 당신은 극장 왼쪽 통로 한가운데에 있다. 이제 무대가 바로 앞에 있고, 무대로 올라가는 계단이 몇 단 나 있다. 밝은 조명이 무대 전체를 비추어 꽤 환해 보인다.
- id: tba:242:room:24204
  field: description
  en: You are on Emerald Avenue. The road looks brand new, as do the shops and buildings that line the road. This is obviously
    the newer part of Midgaard. People are bustling about, while street vendors are trying hard to sell hotdogs and other
    less legal merchandise. Streetlights can be seen along the road, and you also notice the odd tree. You can see the southern
    docks to the north.
  ko: 당신은 에메랄드 거리 위에 있다. 길은 새것처럼 보이며, 길 양쪽에 늘어서 있는 상점과 건물들도 마찬가지다. 분명히 미드가르드의 신축 지역이다. 사람들이 분주히 오가고 있으며, 길거리 상인들은 핫도그와 다른
    좀 더 불법적인 상품들을 팔기 위해 애쓰고 있다. 길 boyunca 가로등이 설치되어 있는 것을 볼 수 있고, 기이한 나무들도 눈에 띈다. 북쪽으로는 남쪽 부두가 보인다.
  verdict: wrong
  note: 튀르키예어 'boyunca'가 섞여 있다. 'the odd tree'는 '드문드문 있는 나무'라는 뜻인데 '기이한 나무'로 오역했다. 'less legal merchandise'는 '덜 합법적인 물건'이라는
    반어 표현인데 '좀 더 불법적인'으로 직역했다. '거리 위에 있다'도 어색하다.
  fix: 당신은 에메랄드 거리에 있다. 길은 갓 닦은 듯 새것이고, 길가에 늘어선 상점과 건물들도 마찬가지다. 누가 봐도 미드가르드의 새로 생긴 구역이다. 사람들이 분주히 오가고, 노점상들은 핫도그와 그다지 합법적이지
    않은 물건들을 팔려고 애쓴다. 길을 따라 가로등이 서 있고, 드문드문 나무도 눈에 띈다. 북쪽으로 남쪽 부두가 보인다.
