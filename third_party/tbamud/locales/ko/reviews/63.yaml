- id: tba:63:room:6311
  field: description
  en: You feel that you can rest here safely.  There is evidence of webbing here, but it is of a finer quality.
  ko: 여기서는 안전하게 쉴 수 있을 것 같다. 거미줄의 흔적이 있지만, 더 고품질인 것 같다.
  verdict: awkward
  note: '''더 고품질인 것 같다''는 상품 설명 같은 번역투다. ''of a finer quality''는 거미줄이 더 곱고 정교하다는 뜻이다.'
  fix: 여기서는 안전하게 쉴 수 있을 것 같다. 거미줄의 흔적이 있지만, 이곳의 것은 더 곱고 정교하다.
- id: tba:63:room:6327
  field: description
  en: This strand is weightier, more sturdy.  It shimmers as you step on it.  You are definitely not in the Midgaardian realms
    anymore.  Just where you are you can't tell.  It feels like you're moving through ether.  You can still get back down
    to more surer lands.
  ko: 이 가닥은 더 무겁고 단단하다. 당신이 밟자 반짝인다. 분명 더 이상 미드가르드의 영역에 있지 않다. 정확히 어디에 있는지 알 수 없다. 에테르를 통과하며 이동하는 것 같다. 그래도 더 단단한 땅으로 내려갈
    수는 있다.
  verdict: ok
  note: 의미가 정확하고 문장도 자연스럽다.
- id: tba:63:mob:6311
  field: description
  en: A dishevelled veteran warrior in disguise is what he is, but he means well.
  ko: 그는 위장한 거친 외모의 베테랑 전사지만, 마음은 선하다.
  verdict: wrong
  note: dishevelled는 '거친 외모'가 아니라 행색이 흐트러지고 꾀죄죄하다는 뜻이다. '베테랑'은 외래어라 세계관에 맞지 않는다. 'means well'은 '나쁜 뜻은 없다'에 가깝다.
  fix: 그는 변장한 꾀죄죄한 차림의 노련한 전사지만, 나쁜 뜻은 없다.
- id: tba:63:room:6328
  field: name
  en: The Entrance Of The Ethereal Web
  ko: 에테리얼 거미줄의 입구
  verdict: awkward
  note: '''에테리얼''은 형용사를 그대로 음차한 표현이라 어색하다. 2번의 ''에테르''와도 맞지 않는다.'
  fix: 에테르 거미줄의 입구
- id: tba:63:room:6334
  field: description
  en: This cloud is rather thick in consistency.  You suddenly realize this is not a typical cloud, but it might be the nest
    of an aerial creature.
  ko: 이 구름은 질감이 꽤 단단하다. 문득 이것이 일반적인 구름이 아니라, 공중 생물들의 둥지일지도 모른다는 생각이 든다.
  verdict: wrong
  note: '''thick in consistency''는 짙고 빽빽하다는 뜻이지 ''단단하다''가 아니다. 원문은 단수 ''an aerial creature''인데 ''생물들''로 복수가 덧붙었다.'
  fix: 이 구름은 꽤 짙고 빽빽하다. 문득 이것이 평범한 구름이 아니라, 하늘을 나는 어떤 생물의 둥지일지도 모른다는 생각이 든다.
