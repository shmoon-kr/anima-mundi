  ko: 수호자
  verdict: ok
  note: 정확하다.
- id: tba:63:room:6335
  field: name
  en: A Link In The Ethereal Web
  ko: 이계의 거미줄의 한 고리
  verdict: wrong
  note: Ethereal을 '이계의'(다른 세계)로 옮겨 뜻이 달라졌다. 4번의 '에테리얼'과 같은 고유 지명인데 표기도 서로 다르다. '~의 ~의'도 겹친다.
  fix: 에테르 거미줄의 한 고리
- id: tba:63:mob:6304
  field: long
  en: The orc is stuck in the web and he can't get out.
  ko: 오르크가 거미줄에 걸려 빠져나오지 못하고 있다.
  verdict: awkward
  note: orc는 한국어 판타지에서 '오크'로 표기하는 것이 표준이다.
  fix: 오크가 거미줄에 걸려 빠져나오지 못하고 있다.
- id: tba:63:room:6324
  field: description
  en: You have entered the slave pit.  A voice blares in the distance, 'Get back to work, maggots!'  Rails upon rails of mined
    gold and silver clutter the trail beneath you.
  ko: 당신은 노예 구덩이에 들어섰다. 멀리서 목소리가 크게 울려 퍼진다. '일하러 돌아가, 이 벌레들아!' 당신 발밑의 오솔길에는 채굴된 금과 은이 레일 위에 레일로 쌓여 있다.
  verdict: awkward
  note: '''일하러 돌아가''는 직역투라 감독관의 호통으로 들리지 않는다. maggots는 ''구더기''가 더 정확하다. ''레일 위에 레일로 쌓여''는 ''rails upon rails''를 그대로 옮긴 어색한
    표현이다. 원문 자체가 모호해 ''rails''의 정확한 뜻은 확실하지 않다.'
  fix: 당신은 노예 구덩이에 들어섰다. 멀리서 고함이 울려 퍼진다. '일이나 해라, 이 구더기 같은 놈들아!' 발밑의 길에는 채굴된 금과 은이 실린 레일이 겹겹이 어지럽게 깔려 있다.
