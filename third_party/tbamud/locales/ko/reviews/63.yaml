- id: tba:63:room:6380
  field: description
  en: The room is dark and filled with shadows.  A trap has been carefully crafted to catch unwary travellers.  There seems
    to be no way out.  A few looted corpses are piled in one corner.
  ko: 방은 어둡고 그림자로 가득 차 있다. 경계심이 부족한 여행자를 잡기 위해 정교하게 만들어진 함정이 있다. 나갈 길이 전혀 없어 보인다. 한 구석에는 약탈당한 시체 몇 구가 쌓여 있다.
  verdict: awkward
  note: '''경계심이 부족한 여행자''는 딱딱하다. ''unwary''는 ''방심한''이 자연스럽다. ''그림자로 가득 차 있다''도 ''가득하다''로 줄이는 편이 낫다.'
  fix: 방은 어둡고 그림자로 가득하다. 방심한 여행자를 잡으려고 공들여 만든 함정이 놓여 있다. 나갈 길이 전혀 없어 보인다. 한 구석에는 약탈당한 시체 몇 구가 쌓여 있다.
