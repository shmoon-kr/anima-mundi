  fix: 문을 열고 들어서니 미드가르드 은행 안이다. 천장이 높고 바닥은 반들반들하게 윤이 나는 아주 넓은 방이다. 커다란 창문으로 햇빛이 들어와 은행 안이 환하다. 서쪽 벽 전체에 걸쳐 긴 창구가 놓여 있고, 그
