  note: '''줄지어''가 두 번 반복된다. ''all along the hallway''에는 ''양쪽''이라는 뜻이 없다.'
  fix: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.
- id: tba:242:room:24219
  field: description
  en: You enter the doors and you find yourself in the bank of Midgaard. It's a very large room, with high ceilings and a
