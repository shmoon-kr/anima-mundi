  ko: 당신은 사다리 꼭대기, 카트워크 위에 있다. 바닥은 강철 격자판으로 만들어졌고, 난간은 금속 막대로 설치되어 있다. 모든 것이 검게 칠해져 있다. 여기서 무대를 아주 잘 볼 수 있으며, 모든 것이 완벽하게 보인다.
  verdict: wrong
  note: catwalk의 표기는 '캣워크'다. '카트워크'는 잘못된 음역이다.
  fix: 당신은 사다리 꼭대기, 캣워크 위에 있다. 바닥은 강철 격자판으로 만들어졌고, 난간은 금속 막대로 설치되어 있다. 모든 것이 검게 칠해져 있다. 여기서는 무대가 아주 잘 보여, 모든 것이 완벽하게 눈에 들어온다.
- id: tba:242:obj:24212
  field: extras.0.text
  en: These shoes look quite comfortable.  The leather is soft, and has an elaborate pattern printed on it.
  ko: 이 신발은 꽤 편해 보인다. 가죽이 부드럽고, 정교한 무늬가 인쇄되어 있다.
  verdict: awkward
  note: 가죽에는 무늬가 '인쇄되다'보다 '찍히다'가 자연스럽다.
  fix: 이 신발은 꽤 편해 보인다. 가죽이 부드럽고, 정교한 무늬가 찍혀 있다.
- id: tba:242:room:24291
  field: description
  en: You're in an old dark passageway. The paint is peeling off the walls, and a single light bulb hangs from the ceiling.
    The floor is cement, and has scuff marks all over it. The passage is quite wide. It seems as though this hall used to
    be used for hauling equipment and goods. A rough wooden door here leads south.
  ko: 당신은 낡고 어두운 복도에 있다. 벽의 페인트가 벗겨져 있고, 천장에는 전구 하나가 매달려 있다. 바닥은 시멘트로 되어 있으며 여기저기 긁힌 자국이 가득하다. 복도는 꽤 넓다. 이 통로가 예전에 장비와 물품을
    운반하는 데 사용되었던 것 같다. 여기 있는 거친 나무 문은 남쪽으로 이어진다.
  verdict: awkward
  note: '''여기 있는 거친 나무 문은 남쪽으로 이어진다''는 직역투다.'
  fix: 당신은 낡고 어두운 복도에 있다. 벽의 페인트가 벗겨져 있고, 천장에는 전구 하나가 매달려 있다. 바닥은 시멘트로 되어 있으며 여기저기 긁힌 자국이 가득하다. 복도는 꽤 넓다. 이 통로는 예전에 장비와 물품을
    운반하는 데 쓰였던 것 같다. 남쪽으로 거친 나무 문이 나 있다.
- id: tba:242:room:24230
  field: description
  en: You're inside the main lobby of Cooland's only school (no, we're not counting that monkey school in Ape Village). Everything
    looks neat and tidy, which is surprising for a public school. You notice the odd student walking past you, giving you
    funny looks.
  ko: 당신은 쿨랜드 유일의 학교(아니, 원숭이 마을의 그 원숭이 학교는 안 센다) 로비 안에 있다. 공립학교치고는 놀라울 정도로 모든 것이 깔끔하게 정돈되어 있다. 당신을 지나가는 기이한 학생 몇 명이 당신을 이상한
    눈빛으로 바라보고 있다.
  verdict: wrong
  note: '''the odd student''는 ''이따금 지나가는 학생''인데 ''기이한 학생''으로 오역했다.'
  fix: 당신은 쿨랜드 유일의 학교(아니, 원숭이 마을의 그 원숭이 학교는 안 센다) 로비 안에 있다. 공립학교치고는 놀라울 정도로 모든 것이 깔끔하게 정돈되어 있다. 이따금 학생이 당신 곁을 지나가며 당신을 이상한
    눈빛으로 쳐다본다.
- id: tba:242:mob:24204
  field: long
  en: A young looking usher is here, showing you to your seat.
  ko: 젊어 보이는 안내원이 여기 있다. 당신을 좌석으로 안내하고 있다.
  verdict: awkward
  note: 두 문장으로 끊어 딱딱하다.
  fix: 젊어 보이는 안내원이 여기서 당신을 자리로 안내하고 있다.
- id: tba:242:room:24290
  field: description
  en: You're in a locker room. Blue lockers run the entire length of the room, and benches sit in front of them. You notice
    the odd gym bag sitting on top of the lockers. At the back of the room you notice a door, leading north.
  ko: 당신은 탈의실에 있다. 파란색 사물함이 방 전체의 길이를 따라 늘어서 있고, 그 앞에 벤치가 놓여 있다. 사물함 위에 놓인 낯선 짐가방이 눈에 띈다. 방 뒤쪽에는 북쪽으로 이어지는 문이 있다.
  verdict: wrong
  note: '''the odd gym bag''은 ''드문드문 놓인 운동 가방''인데 ''낯선 짐가방''으로 오역했다.'
  fix: 당신은 탈의실에 있다. 파란색 사물함이 방 전체의 길이를 따라 늘어서 있고, 그 앞에 벤치가 놓여 있다. 사물함 위에 운동 가방이 드문드문 놓여 있는 것이 눈에 띈다. 방 뒤쪽에는 북쪽으로 이어지는 문이 있다.
- id: tba:242:obj:24219
  field: short
  en: a brand new laptop
  ko: 새로운 노트북
  verdict: awkward
  note: '''새로운''은 ''신선한, 참신한''의 뉘앙스다. brand new는 ''새''나 ''갓 산''이다.'
  fix: 새 노트북
- id: tba:242:mob:24213
  field: long
  en: A waitress is here, ready to bring you some food.
  ko: 웨이트리스가 여기 서서 당신에게 음식을 가져다줄 준비를 하고 있다.
  verdict: awkward
  note: 12번과 같다. 원문에 없는 '서서'가 들어갔고 직역투다.
  fix: 웨이트리스 한 명이 여기서 당신에게 음식을 가져다주려고 기다리고 있다.
- id: tba:242:obj:24226
  field: long
  en: A wooden handled mop has been left here.
  ko: 나무 손잡이가 달린 걸레가 여기 놓여 있다.
  verdict: wrong
  note: mop은 자루가 달린 청소 도구라서 대걸레다. 걸레는 손으로 쓰는 천(rag)을 뜻한다.
  fix: 나무 손잡이가 달린 대걸레가 여기 놓여 있다.
- id: tba:242:mob:24208
  field: description
  en: This stagehand looks bored.  He's wearing a pair of dark blue overalls, and he's got on a black baseball cap.  He looks
    pretty strong.
  ko: 이 무대 보조원은 지루해 보인다. 그는 짙은 남색 작업복을 입고 검은색 야구 모자를 쓰고 있다. 꽤 힘차 보인다.
  verdict: wrong
  note: strong은 체력이 좋다는 뜻이므로 '힘이 세 보인다'가 맞다. '힘차다'는 기운차다, 활기차다는 뜻이라 의미가 다르다.
  fix: 이 무대 보조원은 지루해 보인다. 그는 짙은 남색 작업복을 입고 검은색 야구 모자를 쓰고 있다. 꽤 힘이 세 보인다.
- id: tba:242:room:24245
  field: description
  en: You're in the dressing room hallway, in the basement of the theater. It's fairly narrow, with dark wallpaper covering
    the walls. A row of lights hangs from the ceiling. Dressing room doors can been seen all along the hallway.
  ko: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 줄지어 조명이 매달려 있다. 복도 양쪽에는 분장실 문이 줄지어 보인다.
  verdict: wrong
  note: '''all along the hallway''는 복도를 따라 죽 이어진다는 뜻이다. ''양쪽''은 원문에 없는 내용이다. ''천장에는 줄지어 조명이 매달려 있다''는 어순도 어색하다.'
  fix: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.
