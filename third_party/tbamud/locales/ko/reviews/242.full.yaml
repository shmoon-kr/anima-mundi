  note: catwalk를 '카트워크'로 잘못 옮겼다(→ 캣워크). 'leading up here'는 케이블이 위로 뻗어 올라간다는 뜻인데, '여기로 올라오는'으로 방향이 뒤집혔다. 'large'가 빠졌다. mop은
    자루 달린 '대걸레'다.
  fix: 당신은 무대 뒤에 서 있다. 벽은 검게 칠해져 있고, 위로 뻗어 올라가는 온갖 케이블과 밧줄이 보인다. 서쪽의 무대는 크고 두꺼운 커튼에 대부분 가려져 있다. 여기저기 대걸레, 빗자루, 진공청소기 같은 도구
    몇 개가 흩어져 있다. 북쪽 벽을 따라 의자 네 개가 일렬로 놓여 있다. 캣워크로 올라가는 검은 사다리가 보인다. / 무대 입구 옆에 표지판이 걸려 있다.
- id: tba:242:room:24246
  field: description
  en: You're in dressing room number four. It's fairly small, with a makeup counter along the northern wall, and a small couch
    along the eastern wall. A large mirror, completely surrounded by lightbulbs, sits against the wall behind the counter.
    A costume rack sits beside the door, packed with different clothing and costumes.
  ko: 당신은 4호 분장실에 있다. 방은 꽤 작으며, 북쪽 벽에는 화장대가, 동쪽 벽에는 작은 소파가 놓여 있다. 화장대 뒤 벽에는 전구로 둘러싸인 거울이 걸려 있다. 문 옆에는 의류 랙이 서 있고, 다양한 의상과
    분장복이 빼곡히 걸려 있다.
  verdict: wrong
  note: '''large''(큰)와 ''completely''(빙 둘러)가 빠졌다. ''clothing and costumes''는 ''옷과 무대 의상''인데, ''분장복''은 오역이다.'
  fix: 당신은 4호 분장실에 있다. 방은 꽤 작으며, 북쪽 벽을 따라 화장대가, 동쪽 벽을 따라 작은 소파가 놓여 있다. 화장대 뒤 벽에는 전구로 빙 둘러싸인 큰 거울이 걸려 있다. 문 옆에는 의상 걸이가 서 있고,
    갖가지 옷과 무대 의상이 빼곡히 걸려 있다.
- id: tba:242:mob:24203
  field: long
  en: The theater manager is here, looking bored.
  ko: 극장 매니저가 여기 있다. 지루해 보인다.
  verdict: awkward
  note: 문장을 둘로 끊어 딱딱하다. 극장의 manager는 '지배인'이 자연스럽다.
  fix: 극장 지배인이 여기서 지루한 표정을 짓고 있다.
- id: tba:242:room:24282
  field: description
  en: You're standing at the northern end of sheet 1. The ice is slippery, and it's fairly cold in here. You can hear the
