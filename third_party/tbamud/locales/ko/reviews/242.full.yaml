  ko: 당신은 강 남쪽의 선착장에 있다. 나무로 된 선착장은 강에서 꽤 높은 곳에 지어져 있어, 여기서 강에 접근하는 것은 불가능하다. 여기저기 크고 작은 상자와 배럴이 흩어져 있다. 강 건너편으로 오래된 창고처럼
