  ko: 당신은 레이저 길 위에 있다. 길은 새것처럼 보이며, 길 양옆에 늘어서 있는 상점과 건물들도 마찬가지다. 분명히 미드가르드의 신축 지역이다. 사람들이 분주히 오가고, 길거리 상인들은 핫도그와 다른 좀 더 불법적인
