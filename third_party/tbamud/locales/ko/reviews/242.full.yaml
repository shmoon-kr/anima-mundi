not_ok:
- id: tba:242:room:24284
  field: description
  en: You're standing on the very middle of sheet 2. The ice is slippery, and it's fairly cold in here. You can hear the light
    humming of a machine somewhere. Bright lights shine down on you from above, illuminating this area quite well.
  ko: 당신은 시트 2의 정중앙에 서 있다. 얼음은 미끄럽고, 이곳은 꽤 춥다. 어딘가에서 기계가 희미하게 윙윙거리는 소리가 들린다. 위에서 밝은 조명이 내리쬐어 이곳을 환히 비추고 있다.
  verdict: awkward
  note: 다른 항목(1번 시트)과 달리 '시트 2'로 표기해 방 이름 표기가 일관되지 않다. 컬링 시트는 'N번 시트'로 통일하는 것이 자연스럽다.
  fix: 당신은 2번 시트의 정중앙에 서 있다. 얼음은 미끄럽고, 이곳은 꽤 춥다. 어딘가에서 기계가 희미하게 윙윙거리는 소리가 들린다. 위에서 밝은 조명이 내리쬐어 이곳을 환히 비추고 있다.
- id: tba:242:mob:24200
  field: short
  en: the cityguard
  ko: 경비병
  verdict: wrong
  note: '''city''가 빠졌다. cityguard는 도시 경비병으로 옮겨야 다른 경비병과 구별된다.'
  fix: 도시 경비병
- id: tba:242:room:24286
  field: name
  en: Sheet 3
  ko: 시트 3
  verdict: awkward
  note: '''1번 시트''와 표기가 어긋난다. ''N번 시트''로 통일한다.'
  fix: 3번 시트
- id: tba:242:room:24221
  field: description
  en: You're on the docks on the southern side of the river. The wooden docks have been built fairly high off the river, making
    it impossible to access the river from here. Several large crates and barrels are scattered around here. Across the river,
    you can see the levee.
  ko: 당신은 강 남쪽의 선착장에 있다. 나무로 된 선착장은 강에서 꽤 높은 곳에 지어져 있어, 여기서 강에 접근하는 것은 불가능하다. 여기저기 크고 작은 상자와 배럴이 흩어져 있다. 강 건너편으로 강둑이 보인다.
  verdict: wrong
  note: '''Several large crates''를 ''크고 작은 상자''로 옮겨 원문에 없는 ''작은''이 추가되고 ''몇 개(several)''가 빠졌다. barrel은 ''배럴''보다 ''통''이 자연스럽다.
    또 docks를 다른 방(14번)에서는 ''부두''로 옮겼으므로 통일해야 한다.'
  fix: 당신은 강 남쪽의 부두에 있다. 나무로 된 부두는 강에서 꽤 높은 곳에 지어져 있어, 여기서 강으로 내려갈 수는 없다. 여기저기 커다란 상자와 통 몇 개가 흩어져 있다. 강 건너편으로 강둑이 보인다.
- id: tba:242:mob:24204
  field: description
  en: This usher looks quite young.  His job is to make sure people have their tickets, and that they sit down during the
    play.  Due to his small size, you can't imagine how he'd enforce these rules if somebody resisted.
  ko: 이 안내원은 꽤 젊어 보인다. 그의 일은 사람들이 티켓을 소지하고 있는지, 그리고 공연 중에는 자리에 앉아 있는지 확인하는 것이다. 그의 작은 체구를 보면, 누군가가 저항할 경우 이 규칙을 어떻게 집행할지 상상하기
    어렵다.
  verdict: awkward
  note: 의미는 맞지만 '그의 일은', '그의 작은 체구를 보면'처럼 영어 소유대명사를 그대로 옮긴 번역투이고, '규칙을 집행할지'도 딱딱하다.
  fix: 이 안내원은 꽤 앳되어 보인다. 관객들이 표를 가지고 있는지, 공연 중에 자리에 앉아 있는지 확인하는 것이 그의 일이다. 체구가 작아서, 누가 버티기라도 하면 어떻게 규칙을 지키게 할지 짐작이 가지 않는다.
- id: tba:242:room:24220
  field: description
  en: You find yourself in a quiet newspaper office. A row of darkly tinted windows look out onto the street, making this
    place fairly dark. A high desk stands directly in front of you, and from behind it you can see many desks with computers
    on them. Journalists are seated, typing up stories for the Cooland Press.
  ko: 당신은 조용한 신문사 사무실에 서 있다. 어둡게 칠해진 창문들이 일렬로 길게 이어져 거리를 내려다보고 있어, 이 곳은 꽤 어둡다. 바로 앞에 높은 책상이 놓여 있고, 그 뒤로는 컴퓨터가 놓여 있는 많은 책자들이
    보인다. 기자들이 앉아 쿨랜드 프레스의 기사를 타이핑하고 있다.
  verdict: wrong
  note: '''desks''를 ''책자들''로 잘못 썼다(책상들). ''darkly tinted windows''는 칠한 것이 아니라 짙게 선팅된 창이다. ''look out onto''는 ''내려다보다''보다 ''거리
    쪽으로 나 있다''가 맞고, ''이 곳''은 ''이곳''으로 붙여 쓴다.'
  fix: 당신은 조용한 신문사 사무실에 서 있다. 짙게 선팅된 창문들이 거리 쪽으로 줄지어 나 있어, 이곳은 꽤 어둡다. 바로 앞에 높은 책상이 놓여 있고, 그 너머로 컴퓨터가 놓인 책상들이 많이 보인다. 기자들이
    앉아 쿨랜드 프레스의 기사를 타이핑하고 있다.
- id: tba:242:room:24291
  field: name
  en: Passageway
  ko: 복도
  verdict: awkward
  note: 5번 방 설명에서는 passageway를 '통로'로 옮겼는데 방 이름은 '복도'로 해 어긋난다. '복도'는 corridor(24번)에 쓰고 passageway는 '통로'로 통일한다.
  fix: 통로
- id: tba:242:obj:24294
  field: short
  en: a foot-long hotdog
  ko: 약 30센티미터 핫도그
  verdict: awkward
  note: '''약 30센티미터 핫도그''는 ''약''이 붙어 수치 설명처럼 읽히고 수식이 어색하다. 길이를 나타내는 이름으로 자연스럽게 바꿔야 한다.'
  fix: 30센티미터짜리 긴 핫도그
- id: tba:242:room:24218
  field: description
  en: The central bridge is the main connection between northern and southern Midgaard. The bridge is constructed from iron
    support beams and concrete. It looks very solid. From below, you can see the swiftly flowing river, leading east and west.
    The tall buildings of southern Midgaard dominate the southern skyline, while you can see the huge temple of Midgaard off
    in the north.
  ko: 중앙 다리는 북부 미드가르드와 남부 미드가르드를 잇는 주요 연결로다. 이 다리는 철제 지지대와 콘크리트로 만들어져 매우 견고해 보인다. 아래를 내려다보면 동서로 빠르게 흐르는 강물을 볼 수 있다. 남쪽 하늘선에는
    남부 미드가르드의 높은 건물들이 우뚝 솟아 있고, 북쪽 멀리에는 미드가르드 신전의 거대한 모습이 보인다.
  verdict: awkward
  note: '''하늘선''은 skyline의 직역으로 한국어에서 쓰지 않는 말이다. ''dominate''의 뉘앙스도 ''스카이라인을 압도한다'' 쪽이 자연스럽다.'
  fix: 중앙 다리는 북부 미드가르드와 남부 미드가르드를 잇는 주요 연결로다. 이 다리는 철제 지지대와 콘크리트로 만들어져 매우 견고해 보인다. 아래를 내려다보면 동서로 빠르게 흐르는 강물이 보인다. 남쪽으로는 남부
    미드가르드의 높은 건물들이 스카이라인을 압도하고, 북쪽 멀리에는 미드가르드의 거대한 신전이 보인다.
- id: tba:242:room:24207
  field: name
  en: Razor's Road
  ko: 레이저스 로드
  verdict: awkward
  note: '''로드''를 음차해서 Emerald Avenue→에메랄드 대로와 일관성이 깨진다. 거리 이름의 보통명사 부분은 번역해야 한다.'
  fix: 레이저 거리
- id: tba:242:room:24257
  field: description
  en: You're in the dressing room hallway, in the basement of the theater. It's fairly narrow, with dark wallpaper covering
    the walls. A row of lights hangs from the ceiling. Dressing room doors can been seen all along the hallway.
  ko: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 줄지어 조명이 매달려 있다. 복도 양쪽에는 분장실 문이 줄지어 보인다.
  verdict: wrong
  note: 원문 'all along the hallway'에는 '양쪽'이라는 정보가 없는데 덧붙였다. '줄지어'도 두 문장에서 반복되어 어색하다.
  fix: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 조명이 한 줄로 매달려 있다. 복도를 따라 분장실 문들이 죽 늘어서 있다.
- id: tba:242:obj:24293
  field: extras.0.text
  en: This box of poutine is quite large.  For those who don't know, poutine is composed of french fries covered with gravy
    and cheese curds.
  ko: 이 푸틴 상자는 꽤 크다. 모르는 사람을 위해 말하자면, 푸틴은 그레이비와 치즈 커드를 올린 감자튀김으로 만들어진다.
  verdict: awkward
  note: '''~을 올린 감자튀김으로 만들어진다''는 구성 설명이 중복되어 부자연스럽다.'
  fix: 이 푸틴 상자는 꽤 크다. 모르는 사람을 위해 말하자면, 푸틴은 감자튀김에 그레이비와 치즈 커드를 얹은 음식이다.
- id: tba:242:room:24255
  field: description
  en: You're in the seats of the theater. They're a dark red color, and they feel very soft. You can see the stage, just in
    front of you. Except for the lights of the stage, this area is totally dark.
