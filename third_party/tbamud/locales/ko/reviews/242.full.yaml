  fix: 당신은 1번 시트의 북쪽 끝에 서 있다. 얼음은 미끄럽고, 이곳은 꽤 춥다. 어딘가에서 기계가 나지막이 윙윙거리는 소리가 들린다. 위에서 밝은 불빛이 쏟아져 이곳을 환히 비추고 있다.
