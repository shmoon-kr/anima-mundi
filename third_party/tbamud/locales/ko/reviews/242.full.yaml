  ko: 당신은 시트 1의 북쪽 끝에 서 있다. 얼음은 미끄럽고, 여기는 꽤 춥다. 어딘가에서 기계의 부드러운 윙윙거리는 소리가 들린다. 위에서 밝은 빛이 쏟아져 내려 이 지역을 꽤 잘 비추고 있다.
  verdict: awkward
