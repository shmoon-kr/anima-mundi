    wall, and behind it stand several tellers, looking bored. An immensely thick steel door leads north, to the vault.
  ko: 문을 지나 들어가니 미드가르드 은행 안에 있다. 천장이 높고 바닥이 반짝이는 광택이 도는 매우 넓은 방이다. 큰 창문으로 빛이 들어와 은행 전체가 밝게 빛난다. 서쪽 벽을 따라 긴 데스크가 놓여 있고, 그 뒤에는
    몇 명의 텔러가 지루한 표정으로 서 있다. 북쪽으로는 금고로 이어지는 매우 두꺼운 강철 문이 있다.
  verdict: awkward
  note: '''문을 지나 들어가니 ~안에 있다''는 주어가 어색하다. ''텔러'', ''데스크''는 부자연스러운 외래어다. ''spans the entire western wall''의 ''전체''가 약해졌고, ''반짝이는
