- id: tba:242:room:24280
  field: description
  en: You're standing at the southern end of sheet 1. The ice is slippery, and it's fairly cold in here. You can hear the
    light humming of a machine somewhere. Bright lights shine down on you from above, illuminating this area quite well.
  ko: 당신은 1번 시트의 남쪽 끝에 서 있다. 얼음은 미끄럽고, 여기는 꽤 차갑다. 어딘가에서 기계가 내는 낮은 윙윙거리는 소리가 들린다. 위에서 밝은 불빛이 쏟아져 이 지역을 충분히 밝게 비추고 있다.
  verdict: awkward
  note: 공기가 찬 것은 '차갑다'보다 '춥다'가 자연스럽다. 'light humming'은 소리가 약하다는 뜻인데, '낮은'은 음높이로 읽힌다. '이 지역을 충분히 밝게'는 번역투다.
  fix: 당신은 1번 시트의 남쪽 끝에 서 있다. 얼음은 미끄럽고, 이곳은 꽤 춥다. 어딘가에서 기계가 나지막이 윙윙거리는 소리가 들린다. 위에서 밝은 불빛이 쏟아져 이곳을 환히 비추고 있다.
- id: tba:242:room:24259
  field: description
  en: You're standing backstage. The walls have been painted black, and you can see all sorts of cables and ropes leading
    up here. A large thick curtain hides most of the stage to the west. A few tools are scattered about here, things like
    mops, brooms, and a vacuum cleaner. A row of four chairs sits along the northern wall. You see a black ladder leading
    up to the catwalk. / You see a sign hanging beside the stage entrance.
  ko: 당신은 무대 뒤에 서 있다. 벽은 검게 칠해져 있고, 여기로 올라오는 온갖 케이블과 로프가 보인다. 서쪽 무대의 대부분은 두꺼운 커튼에 가려져 있다. 여기저기 걸레, 빗자루, 진공청소기 같은 도구 몇 개가 흩어져
    있다. 북쪽 벽을 따라 의자 네 개가 일렬로 놓여 있다. 카트워크로 올라가는 검은 사다리가 보인다. / 무대 입구 옆에 걸린 표지판이 보인다.
