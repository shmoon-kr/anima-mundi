- id: tba:242:room:24289
  field: description
  en: You're in the curling club washrooms. Surprisingly enough, this place is quite clean. Several toilets are here, along
    with some urinals with motion detectors. No more touching filthy handles!
  ko: 당신은 컬링 클럽의 화장실에 있다. 놀랍게도 이 곳은 꽤나 깨끗하다. 여러 개의 변기가 있고, 동작 감지기가 달린 소변기도 몇 개 있다. 더 이상 꼬질이 손잡이를 만질 필요가 없다!
  verdict: wrong
  note: '''꼬질이''는 표준어가 아니고 문법에도 맞지 않는다. filthy는 ''더러운''이다. ''이 곳''은 ''이곳''으로 붙여 쓴다.'
  fix: 당신은 컬링 클럽의 화장실에 있다. 놀랍게도 이곳은 꽤 깨끗하다. 변기가 여러 개 있고, 동작 감지기가 달린 소변기도 몇 개 있다. 이제 더러운 손잡이를 만질 필요가 없다!
- id: tba:242:room:24225
  field: description
  en: You leave the street and enter a beautiful garden. Tall trees of all kinds are growing here, and a winding gravel path
    leads to a set of benches in the middle. You can see flowers growing along the path. Even though you're in the middle
    of the city, you feel as though you're in a deep forest. As your eyes adjust to the lower light, you notice a rope softly
    swaying in the wind, behind a thick tree.
  ko: 당신은 거리를 벗어나 아름다운 정원에 들어선다. 온갖 종류의 높은 나무들이 여기 자라고 있으며, 굽이치는 자갈길이 중앙에 놓인 벤치로 이어진다. 길 옆으로 꽃이 피어 있는 것을 볼 수 있다. 도시 한복판에 있음에도
    불구하고 깊은 숲속에 있는 듯한 느낌이 든다. 눈이 어두움에 적응하자, 굵은 나무 뒤에서 바람에 부드럽게 흔들리는 밧줄이 보인다.
  verdict: awkward
  note: '''~것을 볼 수 있다'', ''~에도 불구하고'', ''어두움에 적응하자''는 번역투다. ''lower light''는 ''어둑한 빛''이 자연스럽다.'
  fix: 당신은 거리를 벗어나 아름다운 정원에 들어선다. 온갖 종류의 키 큰 나무들이 자라고 있고, 구불구불한 자갈길이 한가운데 놓인 벤치들로 이어진다. 길을 따라 꽃이 피어 있다. 도시 한복판인데도 깊은 숲속에 들어온
    듯한 느낌이 든다. 눈이 어둑한 빛에 익숙해지자, 굵은 나무 뒤에서 바람에 살랑살랑 흔들리는 밧줄이 눈에 들어온다.
- id: tba:242:obj:24226
  field: extras.0.text
  en: This looks like a very useful mop.  It has a soft cloth end, which looks like it would be great at washing a floor.  The
    wooden handle is quite thick and hard.  It would make an idea weapon.
  ko: 꽤 유용해 보이는 걸레다. 부드러운 천 끝이 달려 있어 바닥을 닦는 데 아주 좋을 것 같다. 나무 손잡이는 꽤 두껍고 단단하다. 훌륭한 무기가 될 만하다.
  verdict: wrong
  note: 자루 달린 mop은 '대걸레'다. '걸레'는 손걸레로 읽힌다. 'very useful'을 '꽤'로 약하게 옮겼다. 원문의 'idea weapon'은 'ideal weapon'의 오타로, '이상적인 무기'라는
    뜻이다.
  fix: 아주 쓸모 있어 보이는 대걸레다. 끝에 부드러운 천이 달려 있어 바닥을 닦는 데 그만일 것 같다. 나무 자루는 꽤 굵고 단단하다. 무기로 쓰기에 안성맞춤이다.
- id: tba:242:room:24270
  field: description
  en: You're at the top of the theater, on the catwalks. The floor is built out of steel grating, and a railing has been built
    out of metal bars. Everything has been painted black. From here, you have a great view of the stage, as you can see everything
    perfectly.
  ko: 당신은 극장 꼭대기, 카트워크 위에 있다. 바닥은 강철 격자판으로 만들어졌고, 난간은 금속 막대로 설치되어 있다. 모든 것이 검게 칠해져 있다. 여기서 무대를 아주 잘 볼 수 있으며, 모든 것이 완벽하게 보인다.
  verdict: wrong
  note: catwalk를 '카트워크'로 잘못 옮겼다(→ 캣워크).
  fix: 당신은 극장 꼭대기의 캣워크 위에 있다. 바닥은 강철 격자로 되어 있고, 난간은 금속 막대로 만들어져 있다. 모든 것이 검게 칠해져 있다. 이곳에서는 무대가 한눈에 들어와 모든 것이 완벽하게 보인다.
- id: tba:242:obj:24219
  field: long
  en: A brand new laptop is here, waiting to be stolen.
  ko: 새로운 노트북이 여기 놓여 있어 도둑맞기를 기다리고 있다.
  verdict: awkward
  note: brand new는 '새로운'보다 '새'·'갓 산'이 자연스럽다. '놓여 있어 ~기다리고 있다'는 연결이 어색하다.
  fix: 갓 산 새 노트북이 여기서 도둑맞기만을 기다리고 있다.
- id: tba:242:room:24260
  field: description
  en: You're on stage, at the left end. Lights shine down from above, partially blinding you. No sets are currently assembled,
    only a massive curtain hangs behind you. The floor is of solid wood, and makes a slight creaking sound as you walk. You
    can see the entire theater from here. An opening in the curtain leads west, backstage.
  ko: 당신은 무대 왼쪽 끝에 있다. 위에서 내려오는 조명이 눈부셔 시야가 가려진다. 현재 무대 세트는 설치되어 있지 않고, 당신 뒤에는 거대한 커튼 하나만 걸려 있다. 바닥은 단단한 나무로 되어 있어 걸을 때마다
    살짝 삐걱거리는 소리가 난다. 여기서 극장 전체가 한눈에 보인다. 커튼에 난 구멍을 통해 서쪽으로, 무대 뒤로 갈 수 있다.
  verdict: wrong
  note: '''partially''(일부)가 빠졌다. ''opening in the curtain''은 커튼 사이의 트인 곳인데 ''구멍''으로 옮겨 뜻이 달라졌다.'
  fix: 당신은 무대 왼쪽 끝에 있다. 위에서 내리쬐는 조명에 눈이 부셔 시야가 일부 가려진다. 지금은 무대 세트가 설치되어 있지 않고, 당신 뒤로 거대한 커튼 하나만 걸려 있다. 바닥은 단단한 나무로 되어 있어 걸을
    때마다 살짝 삐걱거린다. 여기서 극장 전체가 한눈에 보인다. 커튼 사이로 난 틈을 지나 서쪽으로 가면 무대 뒤다.
- id: tba:242:room:24234
  field: description
  en: You find yourself inside the bank vault. Row upon row of stainless steel safety deposit boxes cover the walls. Three
    rows of extremely bright lights shine down on you, making everything completely visible. It would be impossible to hide
    in here.
  ko: 당신은 은행 금고 안에 있다. 스테인리스 강으로 된 안전 보관함이 벽면을 가득 덮고 있다. 세 줄로 나란히 설치된 매우 밝은 조명이 아래를 비추어 모든 것이 선명하게 보인다. 이곳에서 숨을 곳은 어디에도 없다.
  verdict: wrong
  note: '''Row upon row''(줄줄이 늘어선)가 빠졌다. ''shine down on you''의 ''당신을''도 생략되었다.'
  fix: 당신은 은행 금고 안에 있다. 스테인리스 강으로 된 대여 금고가 벽면을 따라 줄줄이 늘어서 있다. 세 줄로 늘어선 아주 밝은 조명이 당신을 내리비추어 모든 것이 훤히 보인다. 이곳에서는 숨는 것이 불가능하다.
- id: tba:242:room:24298
  field: description
  en: You are in the not very big office of the Mayor of Midgaard.  A large and polished but completely empty desk is standing
    in front of an armchair that looks so comfortable that it most of all resembles a bed with the head end raised slightly.
    Windows look in all directions, giving a great view of the city.
