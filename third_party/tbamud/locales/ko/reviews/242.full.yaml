    the walls. A row of lights hangs from the ceiling. Dressing room doors can been seen all along the hallway.
  ko: 당신은 극장 지하의 분장실 복도에 있다. 복도는 꽤 좁고, 벽은 어두운 벽지로 덮여 있다. 천장에는 줄지어 조명이 매달려 있다. 복도 양쪽에는 분장실 문이 줄지어 보인다.
