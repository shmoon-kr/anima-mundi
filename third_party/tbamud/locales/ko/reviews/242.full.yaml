  fix: 당신은 에메랄드 애비뉴에 있다. 길은 새것처럼 보이며, 길 양옆에 늘어선 상점과 건물들도 마찬가지다. 분명히 미드가르드의 신시가지다. 사람들이 분주히 오가고, 노점상들은 핫도그와 그다지 합법적이지 않은 물건들을
    팔려고 애쓰고 있다. 길을 따라 가로등이 서 있고, 드문드문 나무도 눈에 띈다.
- id: tba:242:room:24271
  field: description
  en: You're in the entrance hall of the Midgaard Curling Club. A gray carpet runs down the hallway, where it ends at a set
    of stairs leading up and to the east. The walls are a pale beige color, and an ancient looking tile ceiling is slowly
    rotting away. This place looks like it's at least fifty years old.
  ko: 당신은 미드가르드 컬링 클럽의 입구 홀에 있다. 회색 카펫이 복도를 따라 깔려 있고, 계단이 있는 곳에서 끝난다. 계단은 위로, 그리고 동쪽으로 이어진다. 벽은 연한 베이지색이며, 오래된 타일 천장이 서서히
    썩어가고 있다. 이 곳은 적어도 50년은 된 것처럼 보인다.
  verdict: awkward
  note: '''이 곳''은 ''이곳''으로 붙여 쓴다. 계단 묘사를 두 문장으로 나눠 늘어진다.'
  fix: 당신은 미드가르드 컬링 클럽의 입구 홀에 있다. 회색 카펫이 복도를 따라 깔려 있다가, 위쪽 동쪽으로 올라가는 계단 앞에서 끝난다. 벽은 연한 베이지색이며, 오래되어 보이는 타일 천장이 서서히 썩어가고 있다.
    이곳은 적어도 50년은 된 것처럼 보인다.
