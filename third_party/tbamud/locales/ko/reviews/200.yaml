- id: tba:200:room:20022
  field: description
  en: The sounds of wildlife fill the woods.  Birds, squirrels, and other unseen animals stay just out of sight.  They seem
    unused to travellers and are very wary.  The trees continue to thin to the north.
  ko: 야생동물들의 소리가 숲을 가득 채운다. 새와 다람쥐, 그리고 다른 보이지 않는 동물들은 시야에서 살짝 벗어나 있다. 그들은 여행객에 익숙하지 않은 듯 매우 경계하고 있다. 북쪽으로 갈수록 나무들은 계속 옅어진다.
  verdict: awkward
  note: '''보이지 않는 동물들은 시야에서 벗어나 있다''는 같은 말을 되풀이한다. 나무가 thin한다는 표현을 ''옅어진다''로 옮긴 것도 어색하다. 이때는 ''듬성듬성해진다''가 자연스럽다.'
  fix: 야생동물 소리가 숲을 가득 채운다. 새와 다람쥐, 그리고 모습을 드러내지 않는 다른 동물들이 보일 듯 말 듯한 곳에 머물러 있다. 여행자에게 익숙하지 않은지 몹시 경계하는 눈치다. 북쪽으로 갈수록 나무가 점점
    듬성듬성해진다.
