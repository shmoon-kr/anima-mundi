- id: tba:200:room:20004
  field: description
  en: You continue your way along the western highway.  It stretches east, back to the Capital and west deeper into the wilderness,
    plains to the south and thick forest to the north.
  ko: 당신은 서쪽 고속도로를 따라 계속 나아간다. 이 도로는 동쪽으로는 수도까지, 서쪽으로는 황야 깊숙한 곳까지 이어지며, 남쪽으로는 평원이, 북쪽으로는 울창한 숲이 펼쳐져 있다.
  verdict: wrong
  note: highway를 '고속도로'로 오역했다. 'back to the Capital'의 '되돌아가는' 뉘앙스도 빠졌다. 문장이 너무 길어서 나누는 편이 자연스럽다.
  fix: 당신은 서부 대로를 따라 계속 나아간다. 길은 동쪽으로는 수도로 되돌아가고, 서쪽으로는 황야 깊숙이 이어진다. 남쪽으로는 평원이, 북쪽으로는 울창한 숲이 펼쳐져 있다.
- id: tba:200:mob:20007
  field: description
  en: This old man looks at you with a toothless grin and begins to haggle with you immediately.  He swears that he sells
    the finest furs in the realm and you could never find a better bargain anywhere else.
  ko: 이 노인은 이가 빠진 웃음을 지으며 당신을 바라보더니 곧바로 흥정을 시작한다. 그는 이 땅에서 가장 좋은 털을 판다고 맹세하며, 다른 어디에서도 이보다 더 좋은 bargains을 찾을 수 없다고 주장한다.
  verdict: wrong
  note: '''bargains''를 번역하지 않고 영어 그대로 남겼다. 상품으로서의 furs는 ''털''보다 ''모피''가 맞다.'
  fix: 이 노인은 이가 다 빠진 입으로 히죽 웃으며 당신을 바라보더니 곧바로 흥정을 걸어온다. 그는 이 땅에서 가장 좋은 모피를 판다고 맹세하며, 다른 어디에서도 이보다 싼 값에 살 수는 없을 거라고 장담한다.
- id: tba:200:room:20021
  field: description
  en: As you move along the dirt road you notice the trees have grown in closer to the path, hanging around you.  Thick underbrush
    has begun to form to the sides and the road looks unkept.  It is slowly being consumed by the forest around it.
  ko: 흙길을 따라 걷다 보니 나무들이 길 쪽으로 더 가까이 자라나 당신을 둘러싸고 있다. 양쪽으로 짙은 덤불이 형성되기 시작했고, 길은 관리가 되지 않는 모습이다. 주변 숲이 이 길을 서서히 삼켜가고 있다.
  verdict: awkward
  note: 의미는 맞지만 '덤불이 형성되기 시작했고', '관리가 되지 않는 모습이다'가 딱딱하다. hanging around you는 가지가 드리운 모습을 뜻한다.
  fix: 흙길을 따라 걷다 보니 나무들이 길 가까이까지 자라 들어와 당신 주위로 가지를 드리우고 있다. 길 양옆으로는 덤불이 무성해지기 시작했고, 길은 돌보는 이 없이 방치된 모습이다. 주변 숲이 길을 서서히 집어삼키고
    있다.
