  fix: 주변에 자연스럽게 녹아드는 위장용 모카신 한 켤레가 놓여 있다.
- id: tba:101:room:10111
  field: description
  en: You are walking on the south road.  To the north and west, fields stretch as far as your eyes can see while the road
    continues to the east.  To the south, a bridge crosses the river, connecting with the road on the other side.  A gust
    of warm wind from the east reminds you of the desert not too far off.
  ko: 당신은 남쪽 도로를 걷고 있다. 북쪽과 서쪽으로는 눈이 닿는 한계까지 밭이 펼쳐져 있고, 도로는 동쪽으로 이어진다. 남쪽으로는 다리가 강을 건너 반대편 도로와 연결되어 있다. 동쪽에서 부는 따뜻한 바람의 한
    줄기가 멀지 않은 곳에 있는 사막을 떠올리게 한다.
  verdict: awkward
  note: '''눈이 닿는 한계까지''와 ''바람의 한 줄기가''가 직역투다.'
  fix: 당신은 남쪽 도로를 걷고 있다. 북쪽과 서쪽으로는 눈이 닿는 데까지 밭이 펼쳐져 있고, 도로는 동쪽으로 이어진다. 남쪽으로는 다리가 강을 건너 반대편 도로와 이어져 있다. 동쪽에서 따뜻한 바람이 한 줄기 불어와
    멀지 않은 곳에 있는 사막을 떠올리게 한다.
- id: tba:101:room:10135
  field: description
  en: The road leads off to the south like a giant snake eating its way through the hills in between a dense forest to the
    west and the mountains to the east. Sounds from unseen, and probably even unknown, animals can be heard from the forest
    to the west but at this point you see no way of entering the dense shrubs and woods preventing entrance to the adventures
    which are likely to be within. The wind here is a strange blend of hot dry desert air and biting cold from the mountain
    glaciers.
  ko: 도로는 거대한 뱀처럼 남쪽으로 뻗어, 서쪽의 울창한 숲과 동쪽의 산 사이의 언덕을 파고들며 이어진다. 서쪽 숲에서는 보이지 않고, 아마도 알려지지 않은 동물들의 소리가 들린다. 하지만 이 지점에서는, 아마도
    그 안에 모험이 숨겨져 있을 것으로 보이는 울창한 덤불과 나무로 진입을 막고 있어 숲으로 들어갈 방법이 보이지 않는다. 이곳의 바람은 뜨겁고 건조한 사막의 공기, 그리고 산악 빙하에서 불어오는 매서운 추위가 섞인
    이상한 조합이다.
  verdict: awkward
  note: '''보이지 않고, 아마도 알려지지 않은''이 어색하다. 숲 진입을 막는 부분은 수식 관계가 꼬여 읽기 어렵다. ''이상한 조합이다''도 직역투다.'
  fix: 도로는 서쪽의 울창한 숲과 동쪽의 산 사이로 언덕을 파먹으며 나아가는 거대한 뱀처럼 남쪽으로 뻗어 있다. 서쪽 숲에서는 눈에 보이지 않는, 어쩌면 이름조차 알려지지 않은 짐승들의 소리가 들려온다. 그러나 숲
    안에서 기다리고 있을 모험으로 가는 길을 빽빽한 덤불과 나무가 막고 있어, 지금으로서는 들어갈 방법이 보이지 않는다. 이곳의 바람은 뜨겁고 메마른 사막의 공기와 산 빙하에서 내려오는 살을 에는 냉기가 묘하게 뒤섞여
    있다.
- id: tba:101:room:10133
  field: description
  en: You are on the south road, somewhere between Haven and the city.  A warm wind blows in from the desert in the east where
    you see a yellow streak on the horizon revealing the desert to you.  The road continues south toward Haven, where a dense
    forest forces it to make a turn eastward, and north, through the open land towards the city.  The great southern mountain
    range towers before you in the southeast.
  ko: 당신은 헤이븐과 도시 사이의 어딘가, 남쪽 도로 위에 있다. 동쪽의 사막에서 따뜻한 바람이 불어오며, 지평선 위의 노란 줄기가 사막을 드러낸다. 도로는 헤이븐으로 향하는 남쪽과, 도시로 향하는 북쪽의 열린 땅을
    지나 이어진다. 남쪽에서는 울창한 숲이 도로를 동쪽으로 꺾이게 하고 있다. 동남쪽으로는 거대한 남부 산맥이 우뚝 솟아 있다.
  verdict: awkward
  note: 도로가 이어지는 방향을 설명하는 문장 구조가 꼬여 원문의 흐름(남쪽으로 가다 숲에 막혀 동쪽으로 꺾이고, 북쪽은 트인 땅을 지나 도시로)이 흐려졌다. '열린 땅'은 직역이다.
  fix: 당신은 헤이븐과 도시 사이 어딘가의 남쪽 도로 위에 있다. 동쪽 사막에서 따뜻한 바람이 불어오고, 그쪽 지평선에 노란 띠가 보여 사막이 있음을 알려 준다. 도로는 남쪽으로 헤이븐을 향해 이어지다가 울창한 숲에
    막혀 동쪽으로 꺾이고, 북쪽으로는 탁 트인 땅을 지나 도시로 이어진다. 동남쪽에는 거대한 남부 산맥이 당신 앞에 우뚝 솟아 있다.
- id: tba:101:room:10128
  field: description
  en: You are walking on a small trail through the wilderness.  The trail is surrounded by vast grasslands as far as you can
    see in all directions, except to the south where a dense forest rises near the horizon.  The trail leads off to the north
    where it makes a turn eastward and to the west where it makes a turn to the north again.
  ko: 당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 오솔길은 사방으로 끝없이 펼쳐진 광활한 초원으로 둘러싸여 있으며, 남쪽 지평선 근처에 울창한 숲이 솟아 있는 것을 제외하면 그렇다. 오솔길은 북쪽으로 이어지다가
    동쪽으로 꺾이고, 서쪽으로 이어지다가 다시 북쪽으로 꺾인다.
  verdict: awkward
  note: '''~를 제외하면 그렇다''로 문장을 뒤에 덧붙여 직역투가 되었다.'
  fix: 당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 오솔길은 남쪽 지평선 근처에 울창한 숲이 솟아 있는 것을 빼면, 사방으로 끝없이 펼쳐진 광활한 초원에 둘러싸여 있다. 오솔길은 북쪽으로 이어지다가 동쪽으로
    꺾이고, 서쪽으로 이어지다가 다시 북쪽으로 꺾인다.
- id: tba:101:room:10108
  field: description
  en: You are walking on the south road.  Farmland dominates the view to the north and east from here while the road continues
    south and west.  A warm wind is coming from the desert to the east and the sound of running water greets you from the
    south.
  ko: 당신은 남쪽 도로를 걷고 있다. 여기서 북쪽과 동쪽으로는 농경지가 시야를 가득 채우며, 도로는 남쪽과 서쪽으로 이어진다. 동쪽 사막에서 온 따뜻한 바람이 불어오고, 남쪽에서 흐르는 물소리가 당신을 반긴다.
  verdict: awkward
  note: '''사막에서 온 따뜻한 바람이 불어오고''에서 ''온''과 ''불어오고''가 중복된다.'
  fix: 당신은 남쪽 도로를 걷고 있다. 여기서 북쪽과 동쪽으로는 농경지가 시야를 가득 채우고, 도로는 남쪽과 서쪽으로 이어진다. 동쪽 사막에서 따뜻한 바람이 불어오고, 남쪽에서는 흐르는 물소리가 당신을 반긴다.
- id: tba:101:mob:10111
  field: long
  en: The wanderer is out on one her missions.
  ko: 방랑자는 자신의 미션 중 하나를 수행하러 나갔다.
  verdict: awkward
  note: '''미션''은 판타지 문체에 맞지 않는다. 방 안에 있는 몹을 묘사하는 문장인데 ''나갔다''라고 하면 자리에 없는 것처럼 읽힌다.'
  fix: 방랑자가 자신의 여러 임무 가운데 하나를 수행하는 중이다.
- id: tba:101:mob:10103
  field: description
  en: The calf can barely walk on its own four feet.  It stumbles awkwardly towards you, looking for its mother.
  ko: 송아지는 네 다리로 서서 걷기조차 간신히 할 뿐이다. 어미를 찾으며 당신 쪽으로 어정쩡하게 넘어질 듯 걸어온다.
  verdict: awkward
  note: '''서서 걷기조차 간신히 할 뿐이다''가 부자연스럽다.'
  fix: 송아지는 제 네 다리로 겨우 걸음을 뗄 정도다. 어미를 찾는지 비틀비틀 당신 쪽으로 다가온다.
- id: tba:101:room:10112
  field: description
  en: You are on a bridge on the south road.  The road leads off to the north and south while the river flows west toward
    the ocean somewhere in the distance.  A gust of warm wind blows in from the east as if to remind you of the desert and
    the secrets it holds.
  ko: 당신은 남쪽 길 위의 다리 위에 있다. 길은 북쪽과 남쪽으로 이어지며, 강은 어딘가 먼 곳의 바다를 향해 서쪽으로 흐른다. 동쪽에서 따뜻한 바람이 불어와 사막과 그곳에 숨겨진 비밀을 떠올리게 한다.
  verdict: awkward
  note: '''길 위의 다리 위에''에서 ''위''가 겹친다. ''as if to remind you''의 ''마치 ~듯'' 뉘앙스가 빠졌다. 다른 방에서는 ''남쪽 도로''로 옮겼는데 여기만 ''남쪽 길''이다.'
  fix: 당신은 남쪽 도로에 놓인 다리 위에 있다. 길은 북쪽과 남쪽으로 이어지고, 강은 저 멀리 어딘가의 바다를 향해 서쪽으로 흐른다. 동쪽에서 따뜻한 바람이 한 줄기 불어오는데, 마치 사막과 그곳에 숨겨진 비밀을
    일깨우려는 듯하다.
- id: tba:101:obj:10114
  field: long
  en: A bottle of cheap rum lies here.
  ko: 저렴한 럼주 병 하나가 여기 놓여 있다.
  verdict: awkward
  note: '''저렴한''은 광고 문구 같은 말투다. 하찮은 술이라는 뉘앙스는 ''싸구려''가 살린다. ''럼주 병 하나''보다 ''럼주 한 병''이 자연스럽다.'
  fix: 싸구려 럼주 한 병이 여기 놓여 있다.
- id: tba:101:obj:10114
  field: extras.0.text
  en: Many find solace and protection within bottles such as these.  At least those that are dim witted and hopeless.
  ko: 이런 병 안에서 위안과 보호를 찾는 이가 많다. 적어도 멍청하고 절망적인 이들은 그렇다.
  verdict: awkward
  note: '''절망적인''은 주로 상황을 묘사하는 말이라 사람에게 쓰면 어색하다. 여기서 hopeless는 ''가망 없는, 구제불능의''라는 뜻이다.'
  fix: 이런 병 안에서 위안과 보호를 찾는 이가 많다. 적어도 머리가 둔하고 가망 없는 자들은 말이다.
- id: tba:101:room:10121
  field: description
  en: You are walking on the south road somewhere between the city and Haven.  The road continues to the south, and to the
    west along a small formation of rocks. North and east of here, grassy plains stretch as far as you can see.  A gust of
    warm wind blows in from the desert in the east as if to remind you of the secrets it holds.
  ko: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있다. 도로는 남쪽으로 이어지고, 서쪽으로는 작은 바위 덩어리를 따라 뻗어 있다. 이곳의 북쪽과 동쪽으로는 시야가 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다.
    동쪽 사막에서 따뜻한 바람이 불어와, 그곳이 품고 있는 비밀을 상기시키듯 느껴진다.
  verdict: awkward
  note: '''somewhere between''의 ''어딘가''가 빠졌다. ''시야가 닿는 한계까지''와 ''상기시키듯 느껴진다''는 딱딱하다. ''south road''는 제목과 맞춰 ''남쪽 길''로 통일해야
