- id: tba:101:obj:10113
  field: extras.0.text
  en: The coat must have been very fine by the look of these embroidered sleeves, but now it's been ravaged and torn.
  ko: 이 수 놓인 팔 보호대의 모습으로 보아 코트는 매우 고급스러웠을 것이다. 하지만 지금은 엉망으로 찢겨 있다.
  verdict: wrong
  note: sleeves는 코트의 '소매'다. '팔 보호대'는 오역이다.
  fix: 수 놓인 소매를 보니 이 코트는 무척 고급스러웠던 모양이다. 하지만 지금은 마구 찢기고 해져 있다.
- id: tba:101:obj:10111
  field: extras.0.text
  en: These fur moccasins have been dyed brown and black to blend in with their surroundings.
  ko: 이 털 무카신은 주변 환경에 녹아들도록 갈색과 검정으로 물들여져 있다.
  verdict: wrong
  note: moccasins의 표준 표기는 '모카신'이다.
  fix: 이 털 모카신은 주변과 어우러지도록 갈색과 검은색으로 물들여져 있다.
- id: tba:101:obj:10107
  field: short
  en: a nose ring for a cow
  ko: 소 코 고리
  verdict: awkward
  note: '''소 코 고리''는 명사만 나열해 딱딱하다.'
  fix: 소 코에 거는 고리
- id: tba:101:obj:10111
  field: long
  en: A pair of camouflage moccasins blend into their surroundings.
  ko: 주변 환경에 자연스럽게 녹아드는 위장 무카신 한 켤레이다.
