  fix: 줄도 바늘도 봉돌도 없는 낚싯대가 허전해 보인다.
- id: tba:101:obj:10100
  field: long
  en: An irrigation ditch has been dug across the road to water the fields.
  ko: 밭에 물을 주기 위해 길 위에 관개용 수로가 파여 있다.
