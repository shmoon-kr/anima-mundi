not_ok:
- id: tba:101:mob:10100
  field: description
  en: He looks very old and tired.  A lifetime's worth of hard work on the farm has aged him beyond his years.
  ko: 그는 몹시 늙고 지쳐 보인다. 농장에서 평생 해 온 고된 노동 탓에 제 나이보다 훨씬 늙어 보인다.
  verdict: awkward
  note: '''늙고''와 ''늙어 보인다''가 반복된다. ''aged him beyond his years''는 ''제 나이보다 늙어 버렸다''로 결과를 말하는 편이 자연스럽다.'
  fix: 그는 몹시 늙고 지쳐 보인다. 평생 농장에서 고되게 일한 탓에 제 나이보다 훨씬 늙어 버렸다.
- id: tba:101:obj:10104
  field: long
  en: A shovel covered in cow manure smells here.
  ko: 소 분뇨로 뒤덮인 삽에서 냄새가 풍긴다.
  verdict: awkward
  note: 방에 놓인 물건 묘사인데 'here'가 빠졌다. '냄새가 풍긴다'보다 '고약한 냄새를 풍기고 있다'가 상황에 맞다.
  fix: 소똥을 뒤집어쓴 삽 하나가 여기서 고약한 냄새를 풍기고 있다.
- id: tba:101:mob:10112
  field: description
  en: He reeks of homemade moonshine, most likely made from corn.  He is the typical hillbilly, and fits his name to a tee.
  ko: 그에게서 아마도 옥수수로 빚었을 집에서 담근 밀주 냄새가 진동한다. 전형적인 산골 촌뜨기로, 이름이 그에게 딱 어울린다.
  verdict: awkward
  note: '''아마도 옥수수로 빚었을 집에서 담근 밀주''처럼 수식어가 겹쳐 읽기 어렵다. 문장을 나누는 편이 낫다.'
  fix: 그에게서 집에서 담근 밀주 냄새가 진동한다. 아마 옥수수로 빚은 술일 것이다. 전형적인 산골 촌뜨기로, 이름이 그에게 딱 어울린다.
- id: tba:101:mob:10101
  field: description
  en: The cow is large and brown, with a short fur coat.  It is extremely docile and friendly, having been domesticated to
    life on a farm.  Strange for it to be out roaming around.
  ko: 소는 크고 갈색이며, 짧은 털을 가지고 있다. 농장에서 길들여져 살았기 때문에 매우 순하고 친근하다. 이렇게 밖에서 돌아다니는 것은 이상하다.
  verdict: awkward
  note: '''짧은 털을 가지고 있다''는 번역투다. ''Strange for it to be out roaming around''도 ''~하는 것은 이상하다''로 옮기니 딱딱하다.'
  fix: 크고 갈색인 소로, 털이 짧다. 농장 생활에 길들여져 몹시 순하고 사람을 잘 따른다. 이렇게 밖을 돌아다니고 있다니 이상한 일이다.
- id: tba:101:room:10122
  field: description
  en: As you walk on the south road somewhere between the city and Haven, you see the occasional caravan traveling between
    the cities.  Fish and crops are traded between the two cities.  The road continues north and south here.  A gust of warm
    wind comes in from the desert which can barely be seen somewhere to the east while fertile plains stretch to the west.
  ko: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있는데, 도시들 사이를 오가는 가끔 보이는 상단 행렬을 볼 수 있다. 두 도시 사이에서는 생선과 곡물이 거래된다. 이 도로는 여기서 북쪽과 남쪽으로 이어진다. 동쪽
    어딘가에 희미하게 보이는 사막에서 따뜻한 바람이 불어오고, 서쪽으로는 비옥한 평원이 펼쳐져 있다.
  verdict: awkward
  note: '''오가는 가끔 보이는 상단 행렬을 볼 수 있다''는 수식어가 겹치고, ''볼 수 있다''는 번역투다. ''생선과 곡물이 거래된다''도 피동이라 딱딱하다.'
  fix: 당신은 도시와 헤이븐 사이 어딘가의 남쪽 도로를 걷고 있고, 이따금 두 도시를 오가는 상단이 눈에 띈다. 두 도시는 생선과 곡물을 사고판다. 도로는 여기서 북쪽과 남쪽으로 이어진다. 동쪽 어딘가에 희미하게
    보이는 사막에서 따뜻한 바람이 불어오고, 서쪽으로는 비옥한 평원이 펼쳐져 있다.
- id: tba:101:room:10114
  field: description
  en: You are walking on the south road between the city and Haven.  The road continues north and west from here around a
    small formation of rocks.  To the east, grassy plains stretch as far as you can see.  And you can hear the sound of running
    water greeting you from the north.
  ko: 당신은 도시와 헤이븐 사이의 남쪽 길을 걷고 있다. 길은 여기서 작은 바위 지형을 돌아 북쪽과 서쪽으로 이어진다. 동쪽으로는 시야가 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다. 그리고 북쪽에서 흐르는 물소리가
    당신을 맞이하는 듯하다.
  verdict: awkward
  note: 다른 방 본문은 '남쪽 도로'인데 여기만 '남쪽 길'이라 통일이 안 된다. '시야가 닿는 한계까지'는 어색하고, '그리고'로 문장을 시작하는 것도 번역투다.
  fix: 당신은 도시와 헤이븐 사이의 남쪽 도로를 걷고 있다. 도로는 여기서 작은 바위 무더기를 돌아 북쪽과 서쪽으로 이어진다. 동쪽으로는 눈길이 닿는 데까지 풀이 우거진 평원이 펼쳐져 있다. 북쪽에서는 흐르는 물소리가
    당신을 반기듯 들려온다.
- id: tba:101:room:10134
  field: description
  en: You are on the south road somewhere in between the city and Haven.  A dense forest towers before you just south of here
    while to the north there is nothing but open land on both sides of the road.  To the east you see the road turn south
    again as to avoid getting too close to the mountains not far off in the distance.  The mountains provide some cover for
    the desert winds but you can just feel them here, warm winds blowing in from the east as if to remind you of the mysteries
    hidden there.
  ko: 당신은 도시와 헤이븐 사이의 어딘가, 남쪽 도로 위에 있다. 바로 남쪽에는 울창한 숲이 우뚝 솟아 있고, 북쪽으로는 도로 양편이 모두 열린 땅이다. 동쪽을 보면, 멀리 보이는 산에 너무 가까이 가지 않기 위해
    도로가 다시 남쪽으로 꺾이는 것이 보인다. 산은 사막 바람을 어느 정도 막아주지만, 이곳에서도 그 바람이 느껴진다. 마치 그곳에 숨겨진 신비를 상기시키듯, 동쪽에서 불어오는 따뜻한 바람이 불어온다.
  verdict: awkward
  note: '''불어오는 따뜻한 바람이 불어온다''가 중복이다. ''nothing but open land''는 ''트인 땅뿐이다''가 맞다.'
  fix: 당신은 도시와 헤이븐 사이 어딘가의 남쪽 도로 위에 있다. 바로 남쪽에는 울창한 숲이 우뚝 솟아 있고, 북쪽으로는 도로 양편에 트인 땅뿐이다. 동쪽을 보면, 멀지 않은 곳의 산에 너무 가까워지지 않으려는 듯
    도로가 다시 남쪽으로 꺾인다. 산이 사막 바람을 얼마간 막아 주지만, 이곳에서도 그 바람이 느껴진다. 동쪽에서 따뜻한 바람이 불어와, 그곳에 숨겨진 신비를 일깨우는 듯하다.
- id: tba:101:room:10132
  field: description
  en: You are walking on the south road connecting Haven and the city.  The mountains are dominating your view to the southeast
    while a large forest rises to the southwest.  You feel the warm wind from the desert, almost taunting you with its presence.  The
    road continues to the north where you can just barely make out a small trail leading west and to the south, closer to
    the mountains and Haven.
  ko: 당신은 헤이븐과 도시를 잇는 남쪽 도로를 걷고 있다. 동남쪽으로는 산이 시야를 가득 채우고 있으며, 서남쪽으로는 큰 숲이 솟아 있다. 사막에서 불어오는 따뜻한 바람이 느껴진다. 마치 존재를 조롱하듯. 도로는
    북쪽으로 이어지며, 희미하게 서쪽으로 나가는 작은 오솔길과, 산과 헤이븐에 더 가까운 남쪽 방향이 보인다.
  verdict: wrong
  note: '''마치 존재를 조롱하듯.''은 불완전한 문장이고 의미도 틀렸다. 원문은 바람이 자기 존재를 드러내며 당신을 놀리는 듯하다는 뜻이다. 마지막 문장도 오역이다. 원문은 도로가 북쪽(서쪽으로 갈라지는 오솔길이
    보이는 쪽)과 남쪽(산과 헤이븐 쪽)으로 이어진다는 뜻인데, 번역은 ''남쪽 방향이 보인다''로 엉켜 있다.'
  fix: 당신은 헤이븐과 도시를 잇는 남쪽 도로를 걷고 있다. 동남쪽으로는 산이 시야를 가득 채우고, 서남쪽으로는 큰 숲이 솟아 있다. 사막에서 불어오는 따뜻한 바람이 제 존재를 과시하며 당신을 놀리는 듯하다. 도로는
    북쪽과, 산과 헤이븐에 더 가까운 남쪽으로 이어진다. 북쪽으로는 서쪽으로 갈라지는 작은 오솔길이 어렴풋이 보인다.
- id: tba:101:room:10119
  field: description
  en: You are walking on the south road connecting the city with Haven in the south.  The road leads off to the north and
    east here while to the south and west, grassy plains stretch as far as you can see.  A gust of warm wind comes in from
    the east, as if to remind you of the desert and the secrets it holds.
  ko: 당신은 도시와 남쪽의 헤이븐을 잇는 남쪽 도로를 걷고 있다. 이 도로는 여기서 북쪽과 동쪽으로 이어지며, 남쪽과 서쪽으로는 눈이 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다. 동쪽에서 따뜻한 바람이 불어오는데,
    당신이 사막과 그 안에 담긴 비밀을 잊지 말라는 듯하다.
  verdict: awkward
  note: '''눈이 닿는 한계까지''가 어색하다. ''당신이 사막과 ... 잊지 말라는 듯하다''는 주어 호응이 맞지 않는다.'
  fix: 당신은 도시와 남쪽의 헤이븐을 잇는 남쪽 도로를 걷고 있다. 도로는 여기서 북쪽과 동쪽으로 이어지며, 남쪽과 서쪽으로는 눈길이 닿는 데까지 풀이 우거진 평원이 펼쳐져 있다. 동쪽에서 따뜻한 바람이 불어와,
    사막과 그 안에 숨은 비밀을 잊지 말라고 일러 주는 듯하다.
- id: tba:101:room:10118
  field: description
  en: You are walking on the south road connecting the city to the north with Haven to the south.  To the east, your view
    and path are blocked by a small formation of rocks.  To the west, grassy plains stretch as far as you can see.  A gust
    of warm wind blows down from the rocks to the east, as if to remind you that you are still relatively close to the desert.
  ko: 당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 도로를 걷고 있다. 동쪽에는 작은 바위 지형이 시야와 통행을 가로막고 있다. 서쪽으로는 눈이 닿는 한계까지 풀이 우거진 평원이 펼쳐져 있다. 동쪽 바위에서 따뜻한
    바람이 불어내려 오는데, 당신이 아직 사막에서 비교적 가까운 곳에 있음을 상기시키려는 듯하다.
  verdict: awkward
  note: '''눈이 닿는 한계까지''는 직역투이고, ''불어내려 오는데''는 띄어쓰기가 틀렸다.'
  fix: 당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 도로를 걷고 있다. 동쪽에는 작은 바위 지형이 시야와 길을 가로막고 있다. 서쪽으로는 눈이 닿는 데까지 풀이 우거진 평원이 펼쳐져 있다. 동쪽 바위에서 따뜻한
    바람이 한 줄기 불어 내려오는데, 당신이 아직 사막에서 그리 멀지 않은 곳에 있음을 일깨우려는 듯하다.
- id: tba:101:obj:10101
  field: extras.0.text
  en: Several different wagons make up the caravan.  They appear to have been carrying fish and crops between the cities.  Right
    up until a group of bandits or mercenaries ransacked it, that is.
  ko: 여러 종류의 수레가 상단을 이루고 있다. 도시 간에 생선과 곡물을 운반하던 것들인 듯하다. 물론 강도나 용병 무리가 약탈하기 전까지는.
  verdict: awkward
  note: crops는 곡물보다 넓은 '농작물'이 맞다. 'Right up until ..., that is.'를 '물론'으로 시작하는 문장 조각으로 옮겨 어색하다.
  fix: 여러 종류의 수레가 상단을 이루고 있다. 도시들 사이에 생선과 농작물을 실어 나르던 것들인 듯하다. 적어도 강도나 용병 무리가 약탈하기 전까지는 그랬을 것이다.
- id: tba:101:mob:10104
  field: long
  en: A heifer looks up at you.
  ko: 소가 당신을 올려다본다.
  verdict: wrong
  note: heifer는 새끼를 낳지 않은 어린 암소다. '소'로 옮기면 의미가 빠진다.
  fix: 어린 암소가 당신을 올려다본다.
- id: tba:101:obj:10107
  field: extras.0.text
  en: The ring is made from solid brass, and is meant to prevent a cow from drinking from its mother's teats.
  ko: 고리는 단단한 황동으로 만들어졌으며, 소가 어미의 유두에서 젖을 빨지 못하도록 막는 데 쓰인다.
  verdict: awkward
  note: '''유두에서 젖을 빨지''가 딱딱하다. ''이 고리는''처럼 지시어를 넣는 편이 자연스럽다.'
  fix: 이 고리는 단단한 황동으로 만든 것으로, 소가 어미의 젖을 빨지 못하게 막는 데 쓰인다.
- id: tba:101:mob:10105
  field: description
  en: He walks past with a long purposeful stride on his way to making some money.
  ko: 돈을 벌러 가는 길이라, 그는 목적 있는 긴 걸음으로 당신을 지나쳐 간다.
  verdict: awkward
  note: 원문에 없는 '당신을'이 추가되었다. '~길이라' 하는 인과 구조와 '목적 있는 긴 걸음'도 부자연스럽다.
  fix: 그는 돈을 벌러 가는 길인지 성큼성큼 힘찬 걸음으로 지나간다.
- id: tba:101:obj:10108
  field: long
  en: A fishing pole looks bare without a line, hook, or sinkers.
  ko: 낚싯대에는 줄이나 낚시 바늘, 추가 없어 텅 비어 보인다.
  verdict: awkward
