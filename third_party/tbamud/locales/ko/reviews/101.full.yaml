- id: tba:101:room:10123
  field: description
  en: You are walking along the south road connecting the city to the north with Haven to the south.  The road is bustling
    with activity as travelers are going to and from the city which is considered to be the center of the world around these
    parts.  A gust of warm wind blows in from the east, as if to remind you of the desert not too far off.  You see fertile
    grasslands to the east and west while the road itself continues to the north and south.  Just south of here you can barely
    make out a small path leading off to the west.
  ko: 당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 도로를 걷고 있다. 이 지역 일대에서 세계의 중심지로 여겨지는 도시로 오가는 여행객들로 도로가 북적거린다. 동쪽에서 따뜻한 바람이 불어와, 그리 멀지 않은 사막을
    상기시키듯 느껴진다. 동쪽과 서쪽으로는 비옥한 초원이 보이며, 도로 자체는 북쪽과 남쪽으로 이어진다. 바로 남쪽으로는 서쪽으로 이어지는 작은 오솔길이 희미하게 보인다.
  verdict: awkward
  note: '''상기시키듯 느껴진다''는 어색하다. 방 이름은 ''남쪽 길''인데 본문은 ''남쪽 도로''라서 용어가 맞지 않는다. 문장도 전반적으로 번역투다.'
  fix: 당신은 북쪽의 도시와 남쪽의 헤이븐을 잇는 남쪽 길을 걷고 있다. 이 일대에서 세상의 중심으로 여겨지는 도시를 오가는 여행자들로 길이 북적거린다. 동쪽에서 따뜻한 바람이 훅 불어온다. 멀지 않은 곳에 사막이
    있음을 일깨우려는 듯하다. 동쪽과 서쪽으로는 비옥한 초원이 펼쳐져 있고, 길은 북쪽과 남쪽으로 이어진다. 바로 남쪽에 서쪽으로 갈라지는 작은 오솔길이 희미하게 보인다.
- id: tba:101:room:10124
  field: description
  en: You are walking on the south road leading from the city to Haven.  A gust of warm wind blows in from the desert in the
    east, as if to remind you of its secrets.  The road continues north and south here while a small trail leads off to the
    west.  Your view to the east is dominated by fertile grasslands which are broken by a fine yellow line in the horizon.
  ko: 당신은 도시에서 헤이븐으로 이어지는 남쪽 길 위를 걷고 있다. 동쪽 사막에서 따뜻한 바람이 불어와, 마치 그곳의 비밀을 상기시키려는 듯하다. 이 길은 여기서 북쪽과 남쪽으로 이어지며, 작은 오솔길 하나가 서쪽으로
    나 있다. 동쪽 시야는 비옥한 초원으로 가득 차 있고, 지평선에는 선명한 노란색 선이 끊어진다.
  verdict: wrong
  note: '''fine''은 ''가느다란''이라는 뜻인데 ''선명한''으로 옮겼다. 또 원문에서 끊기는 것은 초원인데, 번역에서는 노란 선이 끊기는 것으로 의미가 뒤바뀌었다. ''상기시키려는''도 딱딱하다.'
  fix: 당신은 도시에서 헤이븐으로 이어지는 남쪽 길을 걷고 있다. 동쪽 사막에서 따뜻한 바람이 불어온다. 마치 그곳의 비밀을 일깨우려는 듯하다. 길은 여기서 북쪽과 남쪽으로 이어지고, 작은 오솔길 하나가 서쪽으로
    갈라져 나간다. 동쪽으로는 비옥한 초원이 시야를 가득 채우는데, 그 초원은 지평선에 그어진 가느다란 노란 선에서 끊긴다.
- id: tba:101:room:10130
  field: description
  en: You are on a small trail which continues south and uphill to the west from here.  To the west you can see the trail
    getting wider as it continues toward what seems to be smoking chimneys.  Maybe there is a village near here.
  ko: 당신은 여기서 남쪽으로 이어지고 서쪽으로는 언덕을 따라 올라가는 작은 오솔길 위에 있다. 서쪽을 보면, 연기가 피어오르는 굴뚝으로 보이는 곳으로 이어지면서 오솔길이 넓어지는 것이 보인다. 아마도 근처에 마을이
    있는 모양이다.
  verdict: awkward
  note: 관형절이 길게 겹쳐 읽기 어렵다. '굴뚝으로 보이는 곳으로 이어지면서 넓어지는 것이 보인다'는 번역투다.
  fix: 당신은 작은 오솔길 위에 있다. 길은 여기서 남쪽으로, 그리고 서쪽 오르막으로 이어진다. 서쪽으로 갈수록 오솔길이 넓어지고, 그 끝에 연기를 피워 올리는 굴뚝 같은 것들이 보인다. 근처에 마을이 있는지도 모르겠다.
