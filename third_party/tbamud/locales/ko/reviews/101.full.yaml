- id: tba:101:room:10129
  field: description
  en: You are walking on a small trail through the wilderness.  The trail is surrounded by vast grasslands as far as you can
    see in all directions, except to the south where a dense forest rise near the horizon.  The trail leads off to the north
    where it makes a turn to the west, and to the east where it makes a turn north.
  ko: 당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 오솔길은 사방으로 끝없이 펼쳐진 광활한 초원으로 둘러싸여 있으며, 남쪽 지평선 근처에 울창한 숲이 솟아 있는 것을 제외하면 그렇다. 오솔길은 북쪽으로 이어지다가
    서쪽으로 꺾이고, 동쪽으로 이어지다가 북쪽으로 꺾인다.
  verdict: awkward
  note: '''~를 제외하면 그렇다''는 except 구문을 직역한 번역투다.'
  fix: 당신은 황야를 가로지르는 작은 오솔길을 걷고 있다. 남쪽 지평선 가까이에 울창한 숲이 솟아 있는 것 말고는, 사방 어디를 둘러보아도 광활한 초원이 끝없이 펼쳐져 있다. 오솔길은 북쪽으로 가다가 서쪽으로 꺾이고,
    동쪽으로 가다가 북쪽으로 꺾인다.
- id: tba:101:mob:10110
  field: description
  en: It is a grizzled thickset marmot, built low to the ground and about the size of a small dog.
  ko: 이것은 털이 거칠고 몸집이 통통한 마모트다. 몸이 땅에 가깝게 붙어 있고 작은 개 크기 정도다.
  verdict: wrong
  note: grizzled는 '털이 희끗희끗한'이라는 뜻인데 '털이 거친'으로 잘못 옮겼다. 생물을 '이것은'으로 시작하는 것도 딱딱하다.
  fix: 털이 희끗희끗하고 땅딸막한 마모트다. 몸이 땅에 낮게 붙어 있고, 크기는 작은 개만 하다.
