  note: '''북쪽으로 이어지는 길은 거기서''는 영어 어순을 그대로 따라 어색하다. 숲에는 ''짙어''보다 ''빽빽해''가 자연스럽다. foothills는 ''산기슭 구릉지대''가 더 정확하다.'
  fix: 길은 북쪽으로 이어지다가 서쪽으로 꺾이고, 남쪽으로는 동쪽의 산과 서쪽의 울창한 숲 사이에 놓인 산기슭 구릉지대를 지나간다. 숲에서 짐승 소리가 들려오지만, 이 근처는 숲이 너무 빽빽해 들어갈 수 없다.
