not_ok:
- id: tba:60:room:6091
  field: exits.west.look
  en: You see the large forest, Haon-Dor, stretching out far to the west, and to the northwest you the forest gives way to
    hills.
  ko: 서쪽으로는 거대한 숲, 하온-도르가 멀리까지 펼쳐져 있고, 서북쪽으로는 숲이 끝나고 언덕이 시작된다.
  verdict: awkward
  note: 의미는 맞다. 다만 northwest는 표준 방위어인 '북서쪽'으로 옮겨야 한다. '서북쪽'은 다른 존과 방위 표기가 어긋날 수 있다.
  fix: 서쪽으로는 거대한 숲, 하온-도르가 멀리까지 펼쳐져 있고, 북서쪽으로는 숲이 끝나고 언덕이 시작된다.
- id: tba:60:room:6017
  field: exits.west.look
  en: The small path leads west through the trees to a lighter part of the forest.
  ko: 좁은 오솔길이 나무 사이를 지나 서쪽으로 숲이 밝아지는 곳으로 이어진다.
  verdict: awkward
  note: '''서쪽으로 ~곳으로 이어진다''처럼 ''으로''가 겹쳐 문장이 어색하다.'
  fix: 좁은 오솔길이 나무 사이를 지나 서쪽, 숲이 한결 밝아지는 곳으로 이어진다.
- id: tba:60:room:6009
  field: extras.2.text
  en: It looks simple but comfortable and the slender trees make the whole place seem pretty idyllic.  It is a cabin built
    from wooden logs.
  ko: 소박하지만 아늑해 보이고, 가느다란 나무들이 이 일대를 꽤나 평화롭고 이상적인 곳처럼 만들어 준다. 원목으로 지은 오두막이다.
  verdict: awkward
  note: idyllic을 '평화롭고 이상적인'으로 옮긴 것은 직역투이고, 원문에 없는 '이상적'이라는 뜻이 더해졌다. '목가적인'이 맞다. 또 wooden logs는 '통나무'로 옮겨야 하며, '원목'은 가공 전의
    목재를 뜻한다.
  fix: 소박하지만 아늑해 보이고, 가느다란 나무들 덕분에 이 일대가 꽤나 목가적으로 느껴진다. 통나무로 지은 오두막이다.
- id: tba:60:room:6081
  field: exits.west.look
  en: All you see are trees and a shadowy path.
  ko: 나무와 어두운 그림자 속의 길만 보인다.
  verdict: awkward
  note: '''어두운 그림자 속의 길''은 장황하다. shadowy path는 ''어둑한 오솔길''로 충분하다.'
  fix: 나무와 어둑한 오솔길만 보인다.
- id: tba:60:room:6076
  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
