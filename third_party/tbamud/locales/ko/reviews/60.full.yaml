  fix: 보아하니 이 새는 오래 살지 못할 것 같다.
- id: tba:60:room:6075
  field: extras.0.text
  en: You think you see the beginnings of a small trail to the east, winding through the younger part of the forest.
  ko: 동쪽으로는 숲의 젊은 구역 사이로 굽이치는 작은 오솔길이 시작되는 것 같다고 생각한다.
  verdict: awkward
  note: '''~것 같다고 생각한다''는 번역투다. ''숲의 젊은 구역''도 부자연스럽다.'
  fix: 동쪽으로, 숲에서 어린 나무들이 자라는 쪽을 굽이쳐 지나는 작은 오솔길이 시작되는 것이 보이는 듯하다.
- id: tba:60:room:6071
  field: exits.south.look
  en: The path winds its way through the trees to an split in the path.
  ko: 오솔길이 나무들 사이로 구불구불 이어지며, 오솔길이 갈라지는 곳으로 이어진다.
  verdict: awkward
  note: '''오솔길''과 ''이어진다''가 한 문장에서 두 번씩 반복된다.'
  fix: 오솔길은 나무들 사이로 구불구불 이어지다가 갈림길에 닿는다.
- id: tba:60:room:6078
  field: extras.0.text
  en: The terrian is very hilly and rough to the north and west.  You have heard that there is a halfling village somewhere
    in the hills.
  ko: 북쪽과 서쪽 지형은 매우 울퉁불퉁하다. 언덕 어딘가에 하플링 마을이 있다는 소문을 들은 적이 있다.
  verdict: wrong
