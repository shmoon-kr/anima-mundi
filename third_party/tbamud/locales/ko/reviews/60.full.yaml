- id: tba:60:room:6031
  field: extras.2.text
  en: From here it looks feline.  You still don't think it has noticed you, despite the noise you made while climbing up here.
  ko: 여기서 보면 고양이과 동물의 모습으로 보인다. 여기까지 올라오면서 내는 소음에도 불구하고, 아직 당신을 알아채지 못했다고 생각한다.
  verdict: awkward
  note: '''생각한다''의 주어가 빠져서 고양이가 생각하는 것처럼 읽힌다. 이미 낸 소음이므로 ''내는''은 ''낸''이 맞다. ''모습으로 보인다''는 중복 표현이다.'
  fix: 여기서 보니 고양이과 동물 같다. 여기까지 올라오면서 소리를 냈는데도, 녀석은 아직 당신을 알아채지 못한 것 같다.
- id: tba:60:room:6032
  field: exits.up.look
  en: Above you the tree narrows farther, but it still looks like you could climb up there.  A feline shape is pacing about
    above you, trying to get to a large wounded bird.  Perhaps you should try to see what sort of cat this is before you interrupt
    its hunt... it might eat you instead of the bird.
  ko: 머리 위로 나무는 더 가늘어지지만, 여전히 올라갈 수 있을 것처럼 보인다. 고양이 모양의 실루엣이 당신 위를 서성이며, 큰 새 한 마리를 다치게 한 것을 향해 접근하려 하고 있다. 당신이 그 사냥을 방해하기
    전에 이 고양이가 어떤 종류인지 확인해 보는 것이 좋을지도 모른다... 새 대신 당신을 잡아먹을지도 모르니.
  verdict: wrong
  note: '''a large wounded bird''는 다친 큰 새라는 뜻이다. ''큰 새 한 마리를 다치게 한 것''은 고양이가 새를 다치게 했다는 의미를 덧붙인 오역이다. ''고양이 모양의 실루엣''도 중복
    표현이다.'
  fix: 머리 위로 나무는 더 가늘어지지만, 여전히 올라갈 수 있을 것 같다. 고양이 같은 형체가 당신 위에서 서성이며 다친 큰 새에게 다가가려 하고 있다. 사냥을 방해하기 전에 이 고양이가 어떤 종류인지 먼저 살펴보는
    것이 좋을지도 모른다... 새 대신 당신을 잡아먹을지도 모르니.
- id: tba:60:room:6008
  field: description
  en: You are in a clearing in the forest.  Lots of fresh stumps of varying sizes protrude from the ground and heavy logs
    are stacked neatly in a big pile supported by stakes set into the ground.  Paths lead north, east and west.
  ko: 당신은 숲 속의 빈터에 서 있다. 크기가 제각각인 신선한 나무 그루터기들이 여기저기서 솟아 있고, 땅에 박힌 말뚝으로 지지된 큰 더미에 무거운 원목들이 가지런히 쌓여 있다. 북쪽, 동쪽, 서쪽으로 오솔길이 나
    있다.
  verdict: wrong
  note: '''fresh stumps''는 갓 베어 낸 그루터기다. ''신선한''은 오역이다.'
  fix: 당신은 숲 속의 빈터에 서 있다. 크기가 제각각인, 갓 베어 낸 그루터기들이 여기저기 땅 위로 솟아 있고, 땅에 박은 말뚝으로 받친 큰 더미에 무거운 통나무들이 가지런히 쌓여 있다. 북쪽, 동쪽, 서쪽으로
    오솔길이 나 있다.
