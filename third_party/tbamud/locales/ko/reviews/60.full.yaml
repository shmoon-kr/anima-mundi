- id: tba:60:room:6031
  field: extras.3.text
  en: The shape above you moves with definite grace and confidence.  You think that it must be a Bobcat, stalking smaller
    tree-dwelling animals.
  ko: 머리 위의 형체는 확실히 우아하고 자신감 있게 움직인다. 아마도 작은 나무에 사는 동물들을 사냥하는 야생고양이일 것이다.
  verdict: wrong
  note: Bobcat을 '야생고양이'로 옮겼는데, 북미 스라소니류인 '스라소니'로 옮겨야 한다. 또 'smaller tree-dwelling animals'를 '작은 나무에 사는 동물'로 옮겨 나무가 작다는 뜻으로
    읽힌다.
  fix: 머리 위의 형체는 분명한 우아함과 자신감을 지닌 채 움직인다. 나무 위에 사는 작은 동물들을 노리는 스라소니가 틀림없을 것이다.
