- id: tba:60:room:6021
  field: extras.1.text
  en: The crowns of the old trees leave the forest in an unreal twilight illumination.
  ko: 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다.
  verdict: awkward
  note: 초현실적은 예술 사조 느낌이 강하고, 황혼은 해질녘을 뜻해 twilight illumination(어스름한 빛)과 어긋난다.
  fix: 오래된 나무들의 우듬지 탓에 숲은 비현실적인 어스름 속에 잠겨 있다.
