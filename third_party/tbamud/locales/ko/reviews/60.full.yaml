  fix: 이 그늘진 오솔길은 아마 숲에 사는 작은 동물들이 다니는 길일 것이다.
- id: tba:60:room:6092
  field: extras.0.text
  en: The road is well used, and quite dusty.
  ko: 이 길은 많이 다녔는지 꽤 먼지가 많다.
  verdict: awkward
