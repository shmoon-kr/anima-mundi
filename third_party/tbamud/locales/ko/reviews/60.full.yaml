- id: tba:60:room:6030
  field: extras.2.text
  en: From here it looks feline.  You still don't think it has noticed you, despite the noise you made while climbing up here.
  ko: 여기서 보면 고양이과 동물의 모습으로 보인다. 여기까지 올라오면서 내는 소음에도 불구하고, 아직 당신을 알아채지 못했다고 생각한다.
  verdict: awkward
