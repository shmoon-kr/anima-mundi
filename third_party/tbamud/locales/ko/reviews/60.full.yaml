- id: tba:60:room:6060
  field: extras.1.text
  en: The shaded path is probably used by the small animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 작은 동물들이 사용하는 것이다.
  verdict: awkward
