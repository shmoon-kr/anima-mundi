  ko: 당신은 울창한 숲을 관통하는 좁은 오솔길 위에 있다. 오래된 나무들의 수관이 숲 바닥을 초현실적인 황혼의 빛으로 물들인다. 오솔길이 북쪽, 동쪽, 남쪽으로 이어진다.
  verdict: awkward
  note: '''수관''은 식물학 용어라 서술에 어색하고, ''초현실적인''보다 ''비현실적인''이 unreal에 맞다. 원문은 우듬지가 빛을 가려 바닥이 어스름에 잠긴다는 뜻이다.'
  fix: 당신은 울창한 숲을 지나는 작은 오솔길 위에 있다. 오래된 나무들의 우듬지가 빛을 가려 숲 바닥은 비현실적인 어스름에 잠겨 있다. 오솔길이 북쪽, 동쪽, 남쪽으로 이어진다.
- id: tba:60:room:6077
  field: extras.0.text
  en: Hills rise up all around you, blocking your view of the terrain.
  ko: 모든 방향에서 언덕이 솟아 올라 지형을 가리고 있다.
  verdict: awkward
  note: '''지형을 가리고''는 어색하다. 가리는 것은 지형이 아니라 시야다. ''솟아올라''는 붙여 쓴다.'
  fix: 사방으로 언덕이 솟아 있어 주변 지형이 보이지 않는다.
- id: tba:60:room:6029
  field: extras.3.text
  en: It has some lower branches that you think you could reach if you stretched. You might even be able to climb all the
    top, though from here it looks like something else had that idea before you.  There is a faint animal shape pacing on
    one of the highest branches.
  ko: 아래쪽 가지 중 일부는 팔을 뻗으면 닿을 것 같다. 나무 꼭대기까지 오를 수도 있을 것 같다. 다만 여기서 보면 당신보다 먼저 그 생각을 한 것 같은 다른 무언가가 있다. 가장 높은 가지 중 하나를 희미한 동물
    형체가 서성이고 있다.
  verdict: awkward
  note: '''당신보다 먼저 그 생각을 한 것 같은 다른 무언가가 있다''는 관형절이 길어 부자연스럽다. 앞 문장과 ''다만''으로 이어지는 흐름도 끊긴다.'
  fix: 아래쪽 가지 몇 개는 팔을 쭉 뻗으면 닿을 것 같다. 꼭대기까지 오를 수도 있겠지만, 여기서 보니 당신보다 먼저 그런 생각을 한 무언가가 있는 듯하다. 가장 높은 가지 하나에서 희미한 동물의 형체가 서성이고
    있다.
- id: tba:60:room:6074
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6007
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6005
  field: exits.north.look
  en: The small path leads north through the trees.
  ko: 작은 길이 나무 사이로 북쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 북쪽으로''처럼 ''~로''가 겹쳐 어색하다.'
  fix: 작은 길이 나무 사이를 지나 북쪽으로 이어진다.
- id: tba:60:room:6005
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: 길에 '사용하다'는 어색하다. 동물이 '다니는' 길이 자연스럽다.
  fix: 이 좁은 길로는 아마 숲에 사는 동물들이 다니는 것 같다.
- id: tba:60:room:6022
  field: description
  en: You are in a natural cave.  Various sorts of debris cover the stone floor, emitting a rather unpleasant smell that makes
    the air thick and hard to breathe.  The only obvious exit is east.
  ko: 당신은 자연 동굴 안에 있다. 돌바닥에는 온갖 종류의 잔해가 덮여 있어 꽤 불쾌한 냄새를 풍기며, 공기가 무겁고 숨쉬기 힘들다. 눈에 띄는 출구는 동쪽뿐이다.
  verdict: awkward
  note: '''잔해가 덮여 있어 … 냄새를 풍기며''에서 주어 호응이 어긋나고 문장이 늘어진다.'
  fix: 당신은 자연 동굴 안에 있다. 돌바닥을 뒤덮은 온갖 잔해에서 꽤 불쾌한 냄새가 풍겨 공기가 탁하고 숨쉬기 힘들다. 눈에 띄는 출구는 동쪽뿐이다.
- id: tba:60:room:6007
  field: description
  en: You are on a small path leading through the dense forest.  The crowns of the old trees leave the forest in an unreal
    twilight illumination.  The forest gradually lightens to the east.  Paths lead east, west and south.
  ko: 당신은 짙은 숲을 관통하는 작은 길 위에 있다. 오래된 나무들의 그루터기가 숲을 초현실적인 황혼의 빛으로 물들인다. 동쪽으로 갈수록 숲이 점차 밝아진다. 동쪽, 서쪽, 남쪽으로 길이 이어진다.
  verdict: wrong
  note: crowns(나무 꼭대기)를 그루터기(밑동)로 오역했다. 정반대 부위다.
  fix: 당신은 짙은 숲을 지나는 작은 길 위에 있다. 오래된 나무들의 우듬지가 빛을 가려 숲은 비현실적인 어스름에 잠겨 있다. 동쪽으로 갈수록 숲이 점차 밝아진다. 동쪽, 서쪽, 남쪽으로 길이 이어진다.
- id: tba:60:room:6027
  field: exits.south.look
  en: Some animals have gathered on the bank to watch you, curious about what you are doing.
  ko: 몇몇 동물들이 당신이 무엇을 하는지 궁금해하며 당신을 지켜보려고 둑에 모여 있다.
  verdict: wrong
  note: bank(물가)를 둑으로 옮겼다. 둑은 사람이 쌓은 제방이다. 자연 물가는 기슭이다.
  fix: 몇몇 동물들이 기슭에 모여, 당신이 무엇을 하는지 궁금한 듯 지켜보고 있다.
- id: tba:60:mob:6001
  field: description
  en: It is a small, furry creature with long ears and big feet.
  ko: 긴 귀와 큰 발을 가진 작고 털이 부드러운 생물이다.
  verdict: awkward
  note: furry는 털이 복슬복슬하다는 뜻이다. '부드러운'은 원문에 없는 촉감을 더한다.
  fix: 긴 귀와 큰 발을 가진, 털이 복슬복슬한 작은 생물이다.
- id: tba:60:room:6074
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: 길에 '사용하다'는 어색하다. 동물이 '다니는' 길이 자연스럽다.
  fix: 이 좁은 길로는 아마 숲에 사는 동물들이 다니는 것 같다.
- id: tba:60:room:6027
  field: extras.1.text
  en: Trees cover the bank on most sides, preventing you from docking there.
  ko: 나무들이 대부분의 쪽에서 둑을 덮고 있어, 그곳에 정박하는 것을 막고 있다.
  verdict: wrong
  note: bank를 둑으로 오역했다. '대부분의 쪽에서', '정박하는 것을 막고 있다'도 직역투다. docking은 배를 댄다는 뜻이다.
  fix: 기슭은 대부분 나무로 뒤덮여 있어 배를 댈 수 없다.
