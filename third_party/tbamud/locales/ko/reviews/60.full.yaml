  field: extras.4.text
  en: The trees are mostly old beeches and oaks, with one large oak off to your right.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무이며, 오른쪽으로 거대한 참나무 한 그루가 서 있다.
  verdict: wrong
  note: '''beech''를 산벚나무로 잘못 옮겼다. 너도밤나무가 맞다.'
