- id: tba:60:mob:6000
  field: long
  en: John the Lumberjack is here, looking for some trees to chop down.
  ko: 목수 존이 여기 있다. 베어 갈 나무를 찾고 있는 모양이다.
  verdict: wrong
  note: lumberjack은 나무꾼이다. 목수(carpenter)가 아니다. '베어 갈'에는 원문에 없는 '가져간다'는 뜻이 더해졌다.
  fix: 나무꾼 존이 여기 있다. 베어 낼 나무를 찾고 있는 모양이다.
- id: tba:60:room:6062
  field: name
  en: A Shaded Path Through The Dense Forest
  ko: 조밀한 숲을 지나는 그늘진 오솔길
  verdict: awkward
  note: '''조밀한 숲''은 부자연스럽다. 다른 방과 같이 ''짙은 숲''으로 통일한다.'
  fix: 짙은 숲을 지나는 그늘진 오솔길
- id: tba:60:room:6064
  field: extras.1.text
  en: The shadowy path is probably used by the animals living in the forest.
  ko: 어두운 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: 주어 '오솔길은'과 서술어 '이용하고 있을 것이다'가 호응하지 않는다. shadowy는 방 제목과 맞춰 '그늘진'이 낫다.
  fix: 이 그늘진 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6025
  field: exits.south.look
  en: To the south an animal trail leads of towards a the other side of the lower field.
  ko: 남쪽으로 동물 오솔길이 이어져, 낮은 풀밭의 반대편으로 향한다.
  verdict: awkward
  note: '''동물 오솔길''은 직역투다. ''짐승들이 다니는 길''이 자연스럽다. lower field도 ''아래쪽 들판''이 낫다.'
  fix: 남쪽으로는 짐승들이 다니는 길이 아래쪽 들판의 건너편으로 이어진다.
- id: tba:60:room:6024
  field: extras.2.text
  en: The tall grass makes a nice hiding place for animals.
  ko: 높은 풀은 동물들에게 좋은 은신처가 된다.
  verdict: awkward
  note: 풀에는 '높은'이 아니라 '키 큰'을 쓴다.
  fix: 키 큰 풀숲은 동물들에게 좋은 은신처가 된다.
- id: tba:60:room:6005
  field: description
  en: You are on a small path leading through the dense forest.  The crowns of the old trees leave the forest in an unreal
    twilight illumination.  The path continues north and south.
  ko: 당신은 짙은 숲을 관통하는 작은 길 위에 있다. 오래된 나무들의 그루터기가 숲을 초현실적인 황혼의 빛으로 물들인다. 이 길은 북쪽과 남쪽으로 이어진다.
  verdict: wrong
  note: crowns는 나무 꼭대기의 수관(우듬지)이다. 그루터기(stump)는 오역이다. 우거진 수관이 빛을 가려 숲이 어스름해진다는 뜻이다.
  fix: 당신은 짙은 숲을 관통하는 작은 길 위에 있다. 오래된 나무들의 우거진 우듬지에 가려 숲은 비현실적인 어스름에 잠겨 있다. 이 길은 북쪽과 남쪽으로 이어진다.
- id: tba:60:room:6000
  field: extras.0.text
  en: The trees are quite tall considering most of them appear to be quite young. On one of the trees, crude letters forming
    the word 'Haon-Dor' have been carved into the bark.
  ko: 대부분 아직 어린 나무들이라 생각하면 꽤 키가 크다. 그중 한 나무의 껍질에는 'Haon-Dor'라는 글자를 형상화한 거친 글자가 새겨져 있다.
  verdict: awkward
  note: '''글자를 형상화한 거친 글자''는 같은 말이 겹치고 어색하다. 고유명사 ''Haon-Dor''를 음역할지는 용어집 확인이 필요하다.'
  fix: 대부분 아직 어린 나무들인 것을 생각하면 꽤 키가 크다. 그중 한 나무의 껍질에는 'Haon-Dor'라는 글자가 조잡하게 새겨져 있다.
- id: tba:60:room:6070
  field: extras.1.text
  en: The path is long behind you now...  You aren't sure which direction it lies in anymore.
  ko: 오솔길은 이제 당신을 한참 뒤로 남겨 두고 있다... 어느 방향으로 이어지는지 더 이상 확신이 서지 않는다.
  verdict: wrong
  note: '''오솔길이 당신을 뒤로 남겨 두고 있다''는 뜻이 뒤집혔다. 원문은 오솔길이 당신 뒤로 한참 멀어졌다는 뜻이다.'
  fix: 오솔길은 이미 한참 뒤에 있다... 이제는 그 길이 어느 쪽인지조차 확신이 서지 않는다.
- id: tba:60:room:6023
  field: extras.0.text
  en: Many carrion birds are circling to the north, you presume they are waiting for their turn to feast on a corpse.
  ko: 많은 시체 새들이 북쪽에서 원을 그리며 날고 있다. 당신은 그들이 시체를 먹기 위해 차례를 기다리고 있다고 짐작한다.
  verdict: wrong
  note: carrion birds를 '시체 새'로 옮긴 것은 오역에 가깝다. '썩은 고기를 먹는 새'로 옮겨야 한다. '많은 ~들이'도 번역투다.
  fix: 썩은 고기를 먹는 새들이 북쪽 하늘을 빙빙 돌고 있다. 당신은 그들이 시체를 뜯어먹을 차례를 기다리고 있다고 짐작한다.
- id: tba:60:room:6008
  field: extras.4.text
  en: Even though the logs have been chopped to shorter pieces, they are quite heavy as they are fresh and still filled with
    sap.
  ko: 원목들이 더 짧은 길이로 잘려 나왔지만, 아직 수액이 가득 차 있어 무척 무겁다.
  verdict: wrong
  note: '''fresh''(갓 베어 낸)가 빠졌다. ''잘려 나왔지만''도 부자연스럽고, ''logs''는 ''원목''보다 ''통나무''가 자연스럽다.'
  fix: 통나무들은 짧게 잘려 있지만, 갓 베어 낸 것이라 아직 수액이 가득 차 있어 무척 무겁다.
- id: tba:60:room:6072
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 '너도밤나무'다. '산벚나무'는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:mob:6012
  field: long
  en: A gray squirrel with a bushy tail is foraging for nuts here.
  ko: 부서진 꼬리를 가진 회색 다람쥐가 여기에서 견과류를 찾느라 분주하다.
  verdict: wrong
  note: '''bushy tail''은 털이 풍성한 꼬리다. ''부서진 꼬리''는 오역이다. ''가진''도 번역투다.'
  fix: 꼬리털이 풍성한 회색 다람쥐가 여기서 견과류를 찾느라 분주하다.
- id: tba:60:mob:6015
  field: long
  en: A grotesque vulture covered in blood and gore is here feeding madly.
  ko: 피와 살점투성이인 괴상한 하리수가 여기에서 미친 듯이 먹이를 먹고 있다.
  verdict: wrong
  note: vulture는 '독수리'다. '하리수'는 완전한 오역이다. 'grotesque'는 '흉측한'이 더 맞다.
  fix: 피와 살점을 뒤집어쓴 흉측한 독수리가 여기서 미친 듯이 먹이를 뜯어 먹고 있다.
- id: tba:60:room:6010
  field: extras.3.text
  en: It is definitely not the most comfortable bed you have seen in your life.
  ko: 당신이 평생 본 침대 중 가장 편안한 침대는 분명 아니다.
  verdict: awkward
  note: '''침대''가 반복되어 어색하다.'
  fix: 당신이 평생 본 침대 중에 가장 편안한 것은 분명 아니다.
- id: tba:60:room:6029
  field: extras.0.text
  en: You could probably see most of the forest, and perhaps even the city from the top of the tree...  Of course, you'd have
    to deal with whatever that shape is pacing on one of the upper limbs.
  ko: 나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 중 하나를 서성이고 있는 그 형체가 무엇이든 간에, 그걸 처리해야 하겠지만.
  verdict: awkward
  note: '''가지 중 하나를 서성이고 있는''이 부자연스럽다. ''처리하다''보다 ''상대하다''가 맥락에 맞다.'
  fix: 나무 꼭대기에서라면 숲의 대부분, 어쩌면 도시까지도 볼 수 있을 것 같다... 물론, 위쪽 가지 위를 서성이는 저 형체가 무엇이든 그것부터 상대해야 하겠지만.
- id: tba:60:room:6060
  field: description
  en: You are on a small shaded path leading through the trees.  The forest gradually lightens to the east.  The path continues
    to the north, and to the south you see the main trail.
  ko: 당신은 나무 사이로 이어지는 작은 그늘진 오솔길 위에 있다. 숲은 동쪽으로 갈수록 점차 밝아진다. 오솔길은 북쪽으로 이어지고, 남쪽으로는 큰길이 보인다.
  verdict: wrong
  note: '''main trail''은 숲속의 주된 오솔길이다. ''큰길''은 넓은 도로로 읽히므로 오역이다. ''작은 그늘진''은 어순이 어색하다.'
  fix: 당신은 나무 사이로 이어지는 그늘진 작은 오솔길 위에 있다. 숲은 동쪽으로 갈수록 점차 밝아진다. 오솔길은 북쪽으로 이어지고, 남쪽으로는 중심 오솔길이 보인다.
- id: tba:60:room:6026
  field: extras.1.text
  en: Many birds of varying size circle overhead, waiting for you to leave.  You hope they don't decide that you could be
    a corpse with just a little effort.
  ko: 크기가 다양한 많은 새들이 머리 위를 맴돌며 당신이 떠나기를 기다린다. 당신이 조금만 노력하면 시체가 될 수 있다고 판단하지 않기를 바란다.
  verdict: wrong
  note: '''조금만 노력하면''의 주어가 새들인데, 번역문에서는 당신이 노력하는 것처럼 읽힌다. ''크기가 다양한 많은 새들''도 번역투다.'
  fix: 크고 작은 새들이 머리 위를 맴돌며 당신이 떠나기를 기다린다. 새들이 조금만 애쓰면 당신을 시체로 만들 수 있겠다고 마음먹지 않기를 바랄 뿐이다.
- id: tba:60:room:6001
  field: extras.1.text
  en: The trees here are quite young and fresh.  They seem to accommodate many kinds of birds, insects and other small animals.
  ko: 여기 있는 나무들은 꽤 어리고 싱싱하다. 다양한 종류의 새, 곤충 및 기타 작은 동물들이 서식하기에 적합한 환경인 것 같다.
  verdict: awkward
  note: '''및 기타'', ''서식하기에 적합한 환경''은 문서체라서 서술문에 어울리지 않는다.'
  fix: 여기 있는 나무들은 꽤 어리고 싱싱하다. 여러 종류의 새와 곤충, 그 밖의 작은 동물들이 깃들어 사는 것 같다.
- id: tba:60:room:6019
  field: extras.0.text
  en: The crowns of the old trees leave the forest in an unreal twilight illumination.
  ko: 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다.
  verdict: awkward
  note: '''수관''은 전문 용어라 딱딱하다. 원문은 숲이 어스름 속에 남겨진다는 뜻이므로 ''물들인다''보다 ''잠겨 있다''가 자연스럽다.'
  fix: 오래된 나무들의 우듬지에 가려 숲은 비현실적인 어스름에 잠겨 있다.
- id: tba:60:room:6008
  field: extras.3.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: 길에는 '사용하다'보다 '다니다'가 자연스럽다.
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길인 것 같다.
- id: tba:60:room:6013
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 '너도밤나무'다. '산벚나무'는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6027
  field: extras.0.text
  en: Reeds grow up around the edges of the lake, providing cover for the small water fowl that live here.
  ko: 갈대가 호수 가장자리를 따라 자라나, 여기 사는 작은 수조류들에게 은신처를 제공한다.
  verdict: awkward
  note: '''수조류''는 딱딱한 한자어다. ''물새''가 자연스럽다. ''은신처를 제공한다''도 번역투다.'
  fix: 호수 가장자리를 따라 갈대가 자라나, 이곳에 사는 작은 물새들의 은신처가 되어 준다.
- id: tba:60:room:6016
  field: exits.south.look
  en: The small path leads south through the trees.
  ko: 작은 길이 나무 사이로 남쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 남쪽으로''처럼 ''~으로''가 겹쳐 어색하다.'
  fix: 작은 길이 나무 사이를 지나 남쪽으로 이어진다.
- id: tba:60:room:6030
  field: extras.1.text
  en: They look quite sturdy, certainly capable of holding your weight should you decide to climb around in the tree using
    them.
  ko: 가지들은 꽤 단단해 보인다. 이들을 이용해 나무 위를 기어오르기로 마음먹는다면 당신의 체중을 견뎌낼 수 있을 정도로 단단하다.
  verdict: awkward
  note: '''단단''이 반복되고, ''이들을 이용해''가 번역투다. ''certainly''의 확신하는 뉘앙스도 약하다.'
  fix: 가지들은 꽤 튼튼해 보인다. 가지를 딛고 나무 위를 타고 다니기로 마음먹는다 해도, 당신의 몸무게쯤은 너끈히 버텨 줄 것이다.
- id: tba:60:room:6018
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: '''아마도 ~ 같다''로 추측 표현이 겹치고, 길을 ''사용하다''는 표현이 딱딱하다. 길에는 ''다니다''가 자연스럽다.'
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6029
  field: extras.2.text
  en: From here it looks vaguely feline, though you could get a much better view from in the tree.  You are not sure if it
    has seen you yet.
  ko: 여기서 보면 희미하게 고양이과 동물의 모습으로 보인다. 나무 위에서는 훨씬 더 선명하게 볼 수 있을 것이다. 아직 당신을 발견하지 못했는지 확신할 수 없다.
  verdict: awkward
  note: vaguely는 '어렴풋이'의 뜻이며, '희미하게'는 빛이나 소리에 쓰는 말이다. 마지막 문장은 주어가 빠지고 부정형이 들어가 원문('그것이 이미 당신을 보았는지 모른다')과 어긋나게 읽힌다.
  fix: 여기서는 어렴풋이 고양이 같은 모습으로 보이지만, 나무 위에서라면 훨씬 잘 볼 수 있을 것이다. 그것이 벌써 당신을 보았는지는 확실하지 않다.
- id: tba:60:obj:6004
  field: extras.0.text
  en: 'The letters say: Use ''hold lantern'' to activate.'
  ko: '글자가 이렇게 적혀 있다: ''hold lantern''을 사용하여 활성화한다.'
  verdict: awkward
  note: 사용 안내문인데 '사용하여 활성화한다'는 기계 번역투이고 서술문으로 끝난다. 명령을 안내하는 형태로 써야 한다.
  fix: '글자가 이렇게 적혀 있다: 켜려면 ''hold lantern''을 입력하라.'
- id: tba:60:room:6090
  field: extras.1.text
  en: The trees are quite tall considering most of them appear to be quite young.
  ko: 대부분의 나무가 아직 어리다고 보이지만, 키가 꽤 크다.
  verdict: awkward
  note: '''어리다고 보이지만''은 어색하다. considering은 ''~인 것치고는''으로 옮기는 편이 자연스럽다.'
  fix: 대부분 꽤 어려 보이는 것치고는 나무들의 키가 꽤 크다.
- id: tba:60:room:6032
  field: name
  en: Midway To The Top Of The Large Oak
  ko: 큰 참나무 꼭대기 중간쯤
  verdict: wrong
  note: Midway to the top은 '꼭대기까지 가는 중간', 즉 나무의 중턱이라는 뜻이다. '꼭대기 중간쯤'은 꼭대기 부분의 가운데로 읽혀 뜻이 달라진다.
  fix: 큰 참나무 중턱
- id: tba:60:room:6020
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다. 산벚나무는 잘못된 번역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6027
  field: extras.3.text
  en: Trout and perhaps a catfish or two swim about below you, totally ignoring your presence.
  ko: 송어와 아마도 두어 마리의 붕어가 당신 아래로 헤엄치며, 당신의 존재를 완전히 무시하고 있다.
  verdict: wrong
  note: catfish는 메기다. 붕어로 옮긴 것은 오역이다. '아마도 두어 마리의'라는 어순도 부자연스럽다.
  fix: 송어와, 어쩌면 메기 한두 마리가 당신 아래에서 헤엄쳐 다니며 당신이 있다는 것은 전혀 아랑곳하지 않는다.
- id: tba:60:room:6081
  field: extras.0.text
  en: Hills rise up all around you, blocking your view of the terrain.
  ko: 모든 방향에서 언덕이 솟아 올라 지형을 가리고 있다.
  verdict: awkward
