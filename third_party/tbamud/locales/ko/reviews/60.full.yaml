  ko: 당신은 작은 공터에 서 있으며, 옆에는 큰 쓰러진 나무가 있다. 나무의 상당 부분은 이미 썩어 없어졌지만, 일부 조각들이 공터 여기저기에 흩어져 있다. 공터의 북쪽과 남쪽에는 길이 경계를 이루고 있다.
  verdict: awkward
  note: '''큰 쓰러진 나무''는 어순이 어색하다. ''길이 경계를 이루고 있다''는 직역투다.'
