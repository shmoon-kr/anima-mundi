- id: tba:60:room:6002
  field: extras.0.text
  en: The young, slender trees look beautiful, their fresh, green leaves moving lightly in the wind.
  ko: 어리고 가느다란 나무들이 아름답게 보이며, 싱싱한 초록 잎사귀가 바람에 가볍게 흔들린다.
