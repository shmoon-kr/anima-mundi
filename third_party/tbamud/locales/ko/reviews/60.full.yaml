  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: '''beech''를 산벚나무로 잘못 옮겼다. 너도밤나무가 맞다.'
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6031
  field: exits.down.look
  en: Below you is a small path, probably used by the forest animals.  You think that you could jump down with a little effort.
  ko: 아래에는 작은 오솔길이 있다. 아마도 숲의 동물들이 사용하는 길일 것이다. 조금만 노력하면 점프해 내릴 수 있을 것 같다.
  verdict: awkward
  note: '''점프해 내릴 수''는 어색한 직역이다. 자연스러운 표현은 ''뛰어내리다''이다. ''사용하는 길''보다 ''다니는 길''이 더 자연스럽다.'
  fix: 아래에는 작은 오솔길이 있다. 아마 숲의 동물들이 다니는 길일 것이다. 조금만 애쓰면 뛰어내릴 수 있을 것 같다.
- id: tba:60:room:6076
  field: extras.0.text
  en: Hills rise up all around you, blocking your view of the terrain.
  ko: 모든 방향에서 언덕이 솟아 올라 지형을 가리고 있다.
  verdict: awkward
  note: '''blocking your view of the terrain''은 시야를 가린다는 뜻이다. ''지형을 가리고 있다''는 어색하다. ''모든 방향에서''보다 ''사방으로''가 자연스럽다.'
  fix: 사방으로 언덕이 솟아 있어 주변 지형이 보이지 않는다.
- id: tba:60:room:6025
  field: extras.1.text
  en: Many carrion birds are circling to the west, you presume they are waiting for their turn to feast on a corpse.
  ko: 많은 시체 먹는 새들이 서쪽에서 원을 그리며 날고 있는데, 당신은 그들이 시체를 먹기 위해 차례를 기다리고 있다고 짐작한다.
  verdict: awkward
  note: '''많은 시체 먹는 새들''은 수식 구조가 어색하다. ''당신은 그들이 ~라고 짐작한다''도 번역투다. 추측은 ''~인 모양이다''로 처리하는 것이 자연스럽다.'
  fix: 서쪽 하늘에서 썩은 고기를 먹는 새 떼가 원을 그리며 맴돌고 있다. 시체를 뜯어 먹을 차례를 기다리는 모양이다.
- id: tba:60:room:6067
  field: extras.0.text
  en: Under a log you think you see some sort of hole, or animal's den.  Looking closer, you can make out the form of what
    you believe to be a Badger resting inside of the den.
  ko: 나무토막 아래로 어떤 구멍이나 동물의 굴 같은 것이 보이는 것 같다. 더 가까이 살펴보니, 그 굴 안에서 쉬고 있는 것으로 보이는 다람쥐의 형체를 알아볼 수 있다.
  verdict: wrong
  note: Badger는 다람쥐가 아니라 오소리다. log는 '나무토막'보다 '통나무'가 맞다.
  fix: 통나무 아래에 구멍인지 동물의 굴인지 모를 것이 보이는 것 같다. 더 가까이 살펴보니, 굴 안에서 쉬고 있는 오소리로 보이는 형체를 알아볼 수 있다.
- id: tba:60:room:6069
  field: extras.1.text
  en: The shadowy path is probably used by the animals living in the forest.
  ko: 어두운 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: '''이용하고 있을 것이다''는 어색하다. shadowy path는 ''그늘진 오솔길''이 맥락에 더 맞다.'
  fix: 그늘진 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6075
  field: description
  en: You are on a small shaded path leading between the trees.  The forest gradually becomes more dense to the west, and
    to the northwest the terrain is quite hilly.  The path continues north and south.  To the east you see a trail winding
    through the younger section of the forest.
  ko: 당신은 나무들 사이로 이어지는 작은 그늘진 길 위에 있다. 서쪽으로 갈수록 숲이 점점 더 짙어지고, 북서쪽으로는 지형이 꽤 울퉁불퉁하다. 길은 북쪽과 남쪽으로 이어진다. 동쪽으로는 숲의 젊은 구역 사이로 굽이치는
    오솔길이 보인다.
  verdict: wrong
  note: hilly는 '울퉁불퉁하다'가 아니라 언덕이 많다는 뜻이다. 'younger section of the forest'를 '숲의 젊은 구역'으로 옮긴 것은 직역투다.
  fix: 당신은 나무들 사이로 난 그늘진 작은 길 위에 있다. 서쪽으로 갈수록 숲이 점점 더 짙어지고, 북서쪽으로는 언덕이 많은 지형이 펼쳐진다. 길은 북쪽과 남쪽으로 이어진다. 동쪽으로는 어린 나무들이 자라는 숲
    사이로 굽이치는 오솔길이 보인다.
- id: tba:60:room:6077
  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 산벚나무가 아니라 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6025
  field: description
  en: The grass stops shortly before the lake, replaced by mud covered in tracks from the local animals.  When you come close
    many animals scatter into the tall grass and some even into the forest.  To the west you see birds circling in the high
    in the air, and to the north you see a small lake, surrounded by tall reeds.  The field continues to the south, and the
    forest blocks passage to the east.
  ko: 풀은 호수 바로 앞에서 끝나고, 그 자리는 이 일대 동물들의 발자국이 찍힌 진흙으로 덮여 있다. 가까이 다가가면 많은 동물들이 높은 풀숲으로, 심지어 숲속으로까지 흩어진다. 서쪽으로는 높은 공중에서 원을 그리며
    날아다니는 새들이 보이고, 북쪽으로는 높은 갈대가 둘러싼 작은 호수가 보인다. 남쪽으로 풀밭이 이어지고, 동쪽으로는 숲이 통행을 막고 있다.
  verdict: awkward
  note: tall grass와 tall reeds의 tall은 높이가 아니라 키를 뜻한다. 따라서 '높은 풀숲'과 '높은 갈대'보다 '키 큰'이 자연스럽다.
  fix: 풀은 호수 바로 앞에서 끝나고, 그 자리는 이 일대 동물들의 발자국이 찍힌 진흙으로 덮여 있다. 가까이 다가가면 많은 동물들이 키 큰 풀숲으로, 심지어 숲속으로까지 흩어진다. 서쪽으로는 높은 하늘에서 원을
    그리며 날아다니는 새들이 보이고, 북쪽으로는 키 큰 갈대가 둘러싼 작은 호수가 보인다. 남쪽으로 풀밭이 이어지고, 동쪽으로는 숲이 길을 막고 있다.
- id: tba:60:room:6061
  field: extras.0.text
  en: The crowns of the old trees leave the forest in an unreal twilight illumination.  A large branch looms above you, over
    the path.
  ko: 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다. 큰 가지 하나가 오솔길 위, 당신 머리 위에서 위압적으로 드리워져 있다.
  verdict: awkward
  note: '''수관''은 전문 용어라 서술문에서 딱딱하다. ''우듬지''가 낫다. ''초현실적인 황혼의 빛''보다 ''비현실적인 어스름''이 자연스럽다.'
  fix: 오래된 나무들의 우듬지가 숲을 비현실적인 어스름 속에 잠기게 한다. 큰 가지 하나가 오솔길 위, 당신 머리 위로 위압적으로 드리워져 있다.
- id: tba:60:room:6080
  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 산벚나무가 아니라 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:obj:6020
  field: extras.0.text
  en: It looks like it would probably float.
  ko: 물 위에 떠 있을 것 같다.
  verdict: wrong
  note: 원문은 '물에 뜰 것 같다'는 성질에 대한 추측이다. '물 위에 떠 있을 것 같다'는 현재 상태로 오역한 것이다.
  fix: 아마 물에 뜰 것 같다.
- id: tba:60:room:6031
  field: description
  en: This sturdy branch hangs far out over a path to the west, which you might be able to jump down to.  Several squirrels
    scamper into hiding as you approach, leaving you alone and swaying slightly with the wind.  To your north you can see
    a small log cabin through the trees, and to the southeast there seems to be some sort of clearing, with many birds circling
    above it.
  ko: 이 단단한 가지는 서쪽의 오솔길 위로 멀리 뻗어 나와 있다. 그곳으로 점프해 내릴 수 있을지도 모른다. 당신이 접근하자 여러 마리의 다람쥐가 숨는 곳으로 달려가 당신만 남기고, 바람에 살짝 흔들리며 혼자 있게
    된다. 북쪽으로는 나무 사이로 작은 나무집이 보이고, 동남쪽으로는 어떤 공터가 있는 것 같다. 그 위로는 수많은 새들이 원을 그리며 날고 있다.
  verdict: wrong
  note: log cabin은 '나무집'이 아니라 '통나무집'이다. 다람쥐 문장은 주어가 뒤엉켜 다람쥐가 혼자 흔들리는 것처럼 읽힌다. southeast는 관례상 '남동쪽'으로 쓴다.
  fix: 이 튼튼한 가지는 서쪽 오솔길 위로 멀리 뻗어 있어, 그곳으로 뛰어내릴 수 있을지도 모른다. 당신이 다가가자 다람쥐 여러 마리가 재빨리 몸을 숨기고, 홀로 남은 당신은 바람에 살짝 흔들린다. 북쪽으로는 나무
    사이로 작은 통나무집이 보이고, 남동쪽으로는 공터 같은 것이 있는 듯하다. 그 위로는 수많은 새들이 원을 그리며 날고 있다.
- id: tba:60:obj:6003
  field: extras.0.text
  en: It is fashioned from stones of various sizes that have been stacked on top of each other and fastened with mortar.  Its
    chimney is constructed likewise and leads the smoke out through the low cabin ceiling.
  ko: 크기가 제각각인 돌들을 쌓아 올려 시멘트로 고정하여 만들었다. 굴뚝도 같은 방식으로 만들어져 연기가 낮은 오두막 천장을 통해 빠져나간다.
  verdict: wrong
  note: mortar는 시멘트가 아니라 회반죽(모르타르)이다. 시멘트는 판타지 배경에도 어울리지 않는다.
  fix: 크기가 제각각인 돌들을 차곡차곡 쌓아 올리고 회반죽으로 굳혀 만들었다. 굴뚝도 같은 방식으로 지어졌으며, 연기를 낮은 오두막 천장 밖으로 내보낸다.
- id: tba:60:room:6073
  field: extras.2.text
  en: The shadowy path is probably used by the animals living in the forest.
  ko: 어두운 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: 9번과 같은 문제다. '이용하고 있을 것이다'가 어색하다.
  fix: 그늘진 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6006
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다. 산벚나무는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:mob:6015
  field: short
  en: the grotesque vulture
  ko: 괴상한 하리수
  verdict: wrong
  note: vulture는 독수리(대머리수리)다. '하리수'는 뜻이 없는 오역이다. grotesque는 '흉측한'이 더 맞다.
  fix: 흉측한 독수리
- id: tba:60:mob:6005
  field: short
  en: the brown fox
  ko: 여우
  verdict: wrong
  note: brown(갈색)이 빠졌다.
  fix: 갈색 여우
- id: tba:60:room:6065
  field: extras.0.text
  en: The trees are mostly young oaks and tall beeches.
  ko: 나무들은 대부분 어린 참나무와 키 큰 자작나무다.
  verdict: wrong
  note: beech를 자작나무(birch)로 옮겼다. 너도밤나무가 맞다.
  fix: 나무들은 대부분 어린 참나무와 키 큰 너도밤나무다.
- id: tba:60:mob:6013
  field: description
  en: The absolute zenith of hyperactivity, this small rodent seems to never tire of running up, down, and around the trees
    in this area.  If you could ever catch it, you imagine it would make an easy meal.
  ko: 과잉 활동성의 절정을 보여주는 이 작은 설치류는 이 지역의 나무를 오르락내리락 여기저기 뛰어다니면서도 결코 지치지 않는 것 같다. 만약 당신이 이 녀석을 잡을 수 있다면, 쉽게 한 끼가 될 것이라 상상한다.
  verdict: awkward
  note: '''과잉 활동성의 절정''은 번역투다. ''만약 ~다면, ~라 상상한다''도 딱딱하다.'
  fix: 넘치는 활력 그 자체인 이 작은 설치류는 이 일대의 나무를 오르내리고 빙빙 돌며 뛰어다니면서도 도무지 지칠 줄 모르는 것 같다. 잡을 수만 있다면 손쉬운 한 끼가 될 것 같다.
- id: tba:60:mob:6004
  field: long
  en: A fallow deer is grazing peacefully here.
  ko: 노루 한 마리가 여기에서 평화롭게 풀을 뜯고 있다.
  verdict: wrong
  note: fallow deer는 다마사슴이다. 노루는 roe deer다.
  fix: 다마사슴 한 마리가 여기에서 평화롭게 풀을 뜯고 있다.
- id: tba:60:obj:6018
  field: extras.0.text
  en: It looks quite filling.
  ko: 꽤 배를 채울 수 있을 것 같다.
  verdict: awkward
  note: '''꽤 배를 채울 수 있을 것 같다''는 어색하다. ''든든해 보인다''가 자연스럽다.'
  fix: 꽤 든든해 보인다.
- id: tba:60:room:6026
  field: extras.3.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: '''아마도 ~사용하는 것 같다''는 추측이 겹쳐 쓰였다. ''사용하다''도 길에는 어색하다.'
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6063
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: 1번과 같다. beech는 너도밤나무다.
