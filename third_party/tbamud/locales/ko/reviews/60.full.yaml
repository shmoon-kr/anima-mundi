  fix: 북쪽과 서쪽은 언덕이 많고 지형이 매우 험하다. 언덕 어딘가에 하플링 마을이 있다는 소문을 들은 적이 있다.
- id: tba:60:mob:6005
  field: description
  en: It is a large fox with beautiful, red-brown fur and a long, thick bushy tail.
  ko: 크기가 큰 여우로, 아름다운 붉은 갈색 털과 길고 두꺼운 부시한 꼬리를 가지고 있다.
  verdict: wrong
