  en: The duckling is adorable, it looks most of all like a tiny furball.
  ko: 병아리는 매우 귀엽다. 작은 털뭉치처럼 보인다.
  verdict: wrong
  note: duckling은 '새끼 오리'다. '병아리'는 닭의 새끼라 오역이다. 'most of all'의 뉘앙스도 빠졌다.
  fix: 새끼 오리는 무척 귀엽다. 무엇보다도 작은 털뭉치처럼 보인다.
- id: tba:60:obj:6012
  field: extras.0.text
  en: It says :- / Haon-Dor / -------- / This is the Forest of Haon-Dor.  Enter at your own risk.
  ko: 그것에는 이렇게 쓰여 있다 :- / Haon-Dor / -------- / 이곳은 Haon-Dor 숲이다. 위험을 감수하고 들어오라.
  verdict: awkward
  note: '''그것에는''은 번역투다. ''Enter at your own risk''는 경고문 어투로 옮기는 편이 자연스럽다.'
  fix: 이렇게 쓰여 있다 :- / Haon-Dor / -------- / 이곳은 Haon-Dor 숲이다. 들어오는 자는 스스로 위험을 책임져라.
- id: tba:60:obj:6004
