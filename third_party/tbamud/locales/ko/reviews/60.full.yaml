- id: tba:60:room:6008
  field: extras.1.text
  en: There are more stumps than logs and some of the stumps are partly covered in moss.
  ko: 원목보다 그루터기가 더 많고, 그루터기 중 일부는 이끼가 덮여 있다.
  verdict: wrong
  note: 여기서 logs는 쓰러진 '통나무'다. '원목'은 오역이다. '이끼가 덮여 있다'는 조사도 어색하다.
  fix: 쓰러진 통나무보다 그루터기가 더 많고, 그루터기 일부는 군데군데 이끼에 덮여 있다.
- id: tba:60:room:6079
  field: description
  en: You are standing among tightly packed trees between several hills.  You lost track of the path long ago, and now must
    rely on your instincts to guide you.  The ground is very rough and rocky here, and only the most hardy plants survive.  The
    crowns of the old trees leave the hills in an unreal twilight illumination.
  ko: 당신은 여러 언덕 사이, 빽빽하게 들어선 나무들 사이에 서 있다. 지은 지 오래된 길을 잃은 지 이미 오래되었고, 이제 본능에 의지해 길을 찾아야 한다. 여기 지면은 매우 거칠고 바위투성이이며, 가장 강한 식물들만
    살아남아 있다. 오래된 나무들의 수관이 언덕을 초현실적인 황혼의 빛으로 물들인다.
  verdict: wrong
  note: 원문에 없는 '지은 지 오래된'이 들어갔다. 'lost track of the path'는 길을 놓쳤다는 뜻이다. 'hardy'는 '강한'보다 '억센'이 맞다. 'crowns'를 '수관'으로 옮겨 딱딱하고,
    'unreal'을 '초현실적인'으로 옮긴 것도 어색하다.
  fix: 당신은 여러 언덕 사이, 빽빽하게 들어선 나무들 사이에 서 있다. 길을 놓친 지는 이미 오래되었고, 이제 본능에 의지해 나아가야 한다. 이곳 땅은 매우 거칠고 바위투성이라, 가장 억센 식물들만 살아남는다.
    오래된 나무들의 우듬지가 언덕을 비현실적인 어스름빛에 잠기게 한다.
- id: tba:60:room:6082
  field: description
  en: You are standing among tightly packed trees on a medium sized hill. The dense forest spreads out all around you, and
    the crowns of the old trees leave the hills in an unreal twilight illumination.
  ko: 당신은 중간 크기의 언덕 위, 빽빽하게 들어선 나무들 사이를 서 있다. 짙은 숲이 사방으로 펼쳐져 있고, 오래된 나무들의 가지가 얽혀 언덕을 초현실적인 황혼의 빛으로 물들인다.
  verdict: wrong
  note: '''사이를 서 있다''는 조사 오류다. 원문에 없는 ''가지가 얽혀''가 덧붙었고, ''crowns''를 ''가지''로 옮겼다.'
  fix: 당신은 중간 크기의 언덕 위, 빽빽하게 들어선 나무들 사이에 서 있다. 짙은 숲이 사방으로 펼쳐져 있고, 오래된 나무들의 우듬지가 언덕을 비현실적인 어스름빛에 잠기게 한다.
- id: tba:60:room:6010
  field: description
  en: You are inside a small one-room cabin made entirely from heavy logs. It is very sparsely furnished, containing only
    the most basic housekeeping equipment, such as a bed, a chair and a table.
  ko: 당신은 무거운 원목으로 온전히 지어진 작은 한 칸짜리 오두막 안에 있다. 가구가 매우 적어 침대, 의자, 식탁 같은 가장 기본적인 생활용품만 놓여 있다.
  verdict: awkward
  note: '''무거운 원목으로 온전히 지어진''이 부자연스럽다. ''entirely from heavy logs''는 ''육중한 통나무로만 지은''이 자연스럽다.'
  fix: 당신은 육중한 통나무로만 지은 작은 단칸 오두막 안에 있다. 가구가 매우 적어 침대, 의자, 식탁 같은 가장 기본적인 살림살이만 놓여 있다.
