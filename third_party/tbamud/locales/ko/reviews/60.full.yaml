  en: It is a large and robust but somewhat battered oil lantern made from brass, and it is equipped with a handle to make
    it handy and a hood to protect its flame.  Some letters have been scratched on its bottom.
  ko: 황동으로 만든 크고 튼튼하지만 다소 마모된 기름 랜턴이다. 휴대하기 편하도록 손잡이가 달렸고, 불꽃을 보호하기 위한 투구도 있다. 바닥에 몇 글자가 긁혀 있다.
