- id: tba:60:room:6020
  field: description
  en: You are on a small path leading through the dense forest.  The crowns of the old trees leave the forest in an unreal
    twilight illumination.  The path continues south and west.
  ko: 당신은 울창한 숲을 관통하는 좁은 오솔길 위에 있다. 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다. 오솔길이 남쪽과 서쪽으로 이어진다.
  verdict: awkward
  note: '''수관''은 전문 용어라 서술에 딱딱하고, ''unreal''은 ''초현실적''보다 ''비현실적''이 맞다. ''황혼의 빛으로 물들인다''도 다소 부자연스럽다.'
  fix: 당신은 울창한 숲을 가로지르는 작은 오솔길 위에 있다. 오래된 나무들의 우듬지가 숲을 비현실적인 어스름 속에 잠기게 한다. 오솔길은 남쪽과 서쪽으로 이어진다.
- id: tba:60:room:6066
  field: extras.1.text
  en: The shaded path is probably used by the small animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 작은 동물들이 사용하는 것이다.
  verdict: awkward
  note: 7번과 같다. 추측 표현의 어미가 어색하다.
  fix: 그늘진 오솔길은 아마 숲에 사는 작은 동물들이 다니는 길일 것이다.
- id: tba:60:room:6003
  field: exits.east.look
  en: The trail continues eastwards to the younger part of the forest.
  ko: 오솔길이 숲의 어린 나무가 자라는 지역으로 동쪽으로 이어진다.
  verdict: awkward
  note: '''~지역으로 동쪽으로''처럼 ''으로''가 겹쳐 어색하다.'
  fix: 오솔길은 동쪽으로, 어린 나무들이 자라는 숲 쪽으로 이어진다.
- id: tba:60:room:6014
  field: exits.north.look
  en: The path leads north to a lighter part of the forest.
  ko: 오솔길이 북쪽으로 이어지며 숲이 더 밝은 곳으로 나간다.
  verdict: awkward
  note: '''숲이 더 밝은 곳으로 나간다''는 주어와 서술어가 맞지 않아 부자연스럽다.'
  fix: 오솔길은 북쪽으로, 숲이 좀 더 밝은 곳을 향해 이어진다.
- id: tba:60:room:6066
  field: description
  en: You are at a fork in the small shaded path winding through the trees.  The forest gradually becomes more dense to the
    west.  The path branches to the north and south here, and also continues to the east.
  ko: 당신은 나무 사이로 굽이치는 작은 그늘진 길의 갈림길에 서 있다. 서쪽으로 갈수록 숲이 점점 더 짙어진다. 이 곳에서 길은 북쪽과 남쪽으로 갈라지며, 동쪽으로도 이어진다.
  verdict: awkward
  note: '''이 곳''은 ''이곳''으로 붙여 써야 하며, ''작은 그늘진 길''보다 ''그늘진 작은 길''이 자연스럽다.'
  fix: 당신은 나무 사이로 굽이치는 그늘진 작은 길의 갈림길에 서 있다. 서쪽으로 갈수록 숲이 점점 더 짙어진다. 이곳에서 길은 북쪽과 남쪽으로 갈라지고, 동쪽으로도 이어진다.
- id: tba:60:mob:6011
  field: long
  en: A furry brown badger is curled up under a log here.
  ko: 갈색 털이 풍성한 고라니 한 마리가 여기 통나무 아래에서 몸을 말고 있다.
  verdict: wrong
  note: badger는 오소리이지 고라니(사슴과)가 아니다.
  fix: 털이 북슬북슬한 갈색 오소리 한 마리가 여기 통나무 아래에서 몸을 웅크리고 있다.
- id: tba:60:obj:6022
  field: short
  en: a blue robin's egg
  ko: 파란 멧비둘기 알
  verdict: wrong
  note: robin은 울새이지 멧비둘기가 아니다.
  fix: 파란 울새 알
- id: tba:60:room:6070
  field: exits.north.look
  en: The trees seem to part, exposing a trail into the shade.
  ko: 나무들이 갈라지며, 그늘 속으로 이어지는 오솔길이 드러난다.
  verdict: wrong
  note: 1번과 같다. 'seem to'가 빠졌다.
  fix: 나무들이 갈라지는 듯하더니, 그늘 속으로 이어지는 오솔길이 드러난다.
- id: tba:60:room:6003
  field: extras.1.text
  en: The forest trail seems almost fragile compared to the massive trunks.
  ko: 거대한 나무 줄기에 비해 숲의 오솔길은 거의 취약해 보인다.
  verdict: awkward
  note: '''취약하다''는 체계나 구조의 약점을 말할 때 주로 쓴다. 길의 모습에는 ''연약하다''나 ''가냘프다''가 자연스럽다.'
  fix: 거대한 나무 줄기에 비하면 숲의 오솔길은 연약해 보이기까지 한다.
- id: tba:60:room:6033
  field: exits.down.look
  en: Below you many of the animals you frightened earlier have returned to their various nests and homes.  You can see a
    small hint of the path far below you through the branches.
  ko: 당신 아래로, 조금 전 당신에게 놀란 많은 동물들이 각자의 둥지와 집으로 돌아와 있다. 가지 사이로 당신 아래 멀리 있는 오솔길의 흔적이 희미하게 보인다.
  verdict: awkward
  note: '''당신''이 세 번 반복되어 번역투로 읽힌다. 한국어에서는 생략하는 편이 자연스럽다. ''각자의 둥지와 집''도 딱딱하다.'
  fix: 아래에서는 조금 전 당신 때문에 놀랐던 많은 동물들이 저마다의 둥지와 보금자리로 돌아와 있다. 나뭇가지 사이로 저 아래 멀리 오솔길이 희미하게 보인다.
- id: tba:60:room:6061
  field: description
  en: You are at a turn on a small shadowed path leading through the forest.  The forest seems to become lighter to the west.  The
    path continues north and west.
  ko: 당신은 숲을 지나는 작은 그림자진 오솔길의 굽은 지점에 있다. 숲은 서쪽으로 갈수록 밝아지는 것 같다. 오솔길은 북쪽과 서쪽으로 이어진다.
  verdict: awkward
  note: '''그림자진''은 어색하므로 ''그늘진''으로 고쳤다. ''오솔길의 굽은 지점''도 딱딱하다.'
  fix: 당신은 숲을 지나는 그늘진 작은 오솔길이 꺾이는 곳에 있다. 서쪽으로 갈수록 숲이 밝아지는 듯하다. 오솔길은 북쪽과 서쪽으로 이어진다.
- id: tba:60:room:6062
  field: description
  en: You are on a small shaded path leading through the dense forest.  The crowns of the old trees leave the forest floor
    in an unreal twililght illumination.  To the north you see a small clearing.  Paths lead east and west.
  ko: 당신은 조밀한 숲을 관통하는 작은 그늘진 오솔길 위에 있다. 오래된 나무들의 수관이 숲 바닥을 초현실적인 황혼의 빛으로 비추고 있다. 북쪽으로는 작은 공터가 보인다. 오솔길이 동쪽과 서쪽으로 이어진다.
  verdict: wrong
  note: 원문은 나무의 수관이 빛을 가려 숲 바닥이 어스름 속에 남는다는 뜻이다. 번역은 수관이 바닥을 비춘다고 해서 의미가 반대가 되었다. '조밀한 숲'과 '관통하는'도 딱딱하다.
  fix: 당신은 울창한 숲을 지나는 그늘진 작은 오솔길 위에 있다. 오래된 나무들의 우듬지에 가려 숲 바닥은 비현실적인 어스름에 잠겨 있다. 북쪽으로는 작은 공터가 보인다. 오솔길이 동쪽과 서쪽으로 이어진다.
- id: tba:60:room:6022
  field: extras.2.text
  en: It consists mostly of gnawed bones mixed with small pieces of torn fur.
  ko: 주로 뜯어먹은 뼈와 찢어진 털 조각이 섞여 있다.
  verdict: awkward
  note: 원문은 '대부분이 뼈이고 털 조각이 섞여 있다'는 구조다. 번역은 뼈와 털이 서로 섞여 있다는 식으로 흐려졌다.
  fix: 대부분 갉아 먹힌 뼈이고, 찢긴 털가죽 조각이 섞여 있다.
- id: tba:60:mob:6019
  field: long
  en: A duck is here, quacking happily.
  ko: 오리가 여기 있다. 행복하게 꽥꽥 울고 있다.
  verdict: awkward
  note: 두 문장으로 끊으면 번역투가 된다. 한 문장으로 합치는 편이 자연스럽다.
  fix: 오리 한 마리가 즐겁게 꽥꽥거리고 있다.
- id: tba:60:room:6064
  field: name
  en: A Shadowy Path Through The Dense Forest
  ko: 조밀한 숲을 지나는 어두운 오솔길
  verdict: awkward
  note: '''조밀한 숲''은 딱딱하므로 ''울창한 숲''으로 고쳤다.'
  fix: 울창한 숲을 지나는 어둑한 오솔길
- id: tba:60:mob:6018
