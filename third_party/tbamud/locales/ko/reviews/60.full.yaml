- id: tba:60:room:6063
  field: description
  en: You are on a small shaded path through the dense forest.  The crowns of the old trees leave the forest in an unreal
    twilight illumination.  The path continues north and east.
  ko: 당신은 조밀한 숲을 지나는 작은 그늘진 오솔길 위에 있다. 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 비추고 있다. 오솔길이 북쪽과 동쪽으로 이어진다.
  verdict: wrong
  note: 원문은 우듬지가 빛을 가려 숲이 어스름에 잠긴다는 뜻이다. '수관이 숲을 빛으로 비춘다'는 의미가 반대다. '수관'은 전문용어라 어색하고, '조밀한 숲'도 '울창한 숲'이 자연스럽다.
  fix: 당신은 울창한 숲을 지나는 그늘진 작은 오솔길 위에 있다. 오래된 나무들의 우듬지가 빛을 가려, 숲은 비현실적인 어스름에 잠겨 있다. 오솔길은 북쪽과 동쪽으로 이어진다.
