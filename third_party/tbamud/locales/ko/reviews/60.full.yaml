  en: Not the most interesting pole in the world.  Better leave it here, though, as it holds the sign in place.
  ko: 세상에서 가장 흥미로운 기둥은 아니다. 하지만 표지판을 제자리에 고정하고 있으니, 여기 두고 가느니라.
  verdict: awkward
