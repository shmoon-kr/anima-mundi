  fix: 나무꾼 존
- id: tba:60:room:6014
  field: exits.west.look
  en: The small path leads west through the trees.
  ko: 작은 길이 나무 사이로 서쪽으로 이어진다.
  verdict: awkward
  note: '''나무 사이로 서쪽으로''처럼 ''~로''가 겹쳐 부자연스럽다.'
  fix: 작은 길이 나무 사이를 지나 서쪽으로 이어진다.
- id: tba:60:room:6031
  field: exits.east.look
  en: Back to the east you see the tree trunk.  It is much less precarious there compared to here... perhaps you should go
    back.
  ko: 동쪽으로 돌아가면 나무 줄기가 보인다. 여기보다는 훨씬 덜 위험해 보인다... 아마 돌아가는 것이 좋겠다.
  verdict: wrong
  note: '''Back to the east''는 지나온 동쪽을 가리킨다. ''동쪽으로 돌아가면''으로 옮기면 조건문이 되어 뜻이 달라진다. ''여기보다''와 대비되는 ''그곳''도 빠졌다.'
  fix: 지나온 동쪽으로 나무줄기가 보인다. 여기보다는 그곳이 훨씬 덜 위태롭다... 돌아가는 편이 좋겠다.
- id: tba:60:room:6033
  field: extras.2.text
  en: Off to the southwest you can see a grass covered field, and a small lake; nortwest of you is a small cabin and a large
    pile of wood.  Far to west the treetops form a tight canopy, blocking out almost all sunlight and your view. It is said
    that large wolves live there.  You've also heard rumors of horrible spiders and drow living there.  You'd be best off
    leaving that area to more experienced adventurers.
  ko: 남서쪽으로는 풀이 덮인 들판과 작은 호수가 보인다. 당신의 북서쪽에는 작은 오두막과 큰 땔감 더미가 있다. 서쪽 멀리로는 나무 꼭대기들이 빽빽한 지붕을 이루어 거의 모든 햇빛과 시야를 가리고 있다. 거대한 늑대들이
    그곳에 산다고 한다. 또한 그곳에 끔찍한 거미와 드워가 살고 있다는 소문도 들었다. 그 지역은 더 경험이 많은 모험가들에게 맡기는 것이 가장 좋을 것이다.
  verdict: wrong
  note: drow를 '드워'로 음차했다. '드로우'가 맞다. '당신의 북서쪽에는'도 다소 직역투다.
  fix: 남서쪽으로는 풀이 덮인 들판과 작은 호수가 보인다. 북서쪽에는 작은 오두막과 큰 땔감 더미가 있다. 서쪽 멀리로는 나무 꼭대기들이 빽빽한 지붕을 이루어 거의 모든 햇빛과 시야를 가리고 있다. 거대한 늑대들이
    그곳에 산다고 한다. 또한 그곳에 끔찍한 거미와 드로우가 살고 있다는 소문도 들었다. 그 지역은 더 경험이 많은 모험가들에게 맡기는 것이 가장 좋을 것이다.
- id: tba:60:room:6002
  field: exits.south.look
  en: The small path leads south through the young trees.
  ko: 작은 길이 어린 나무 사이로 남쪽으로 이어진다.
  verdict: awkward
  note: '''나무 사이로 남쪽으로''처럼 ''~로''가 겹친다.'
  fix: 작은 길이 어린 나무 사이를 지나 남쪽으로 이어진다.
- id: tba:60:room:6026
  field: exits.east.look
  en: A small lake lies down the sloping field to the east.  Some of the animals that fled from here have gone there, and
    are watching, waiting for you to leave so they can resume their feasting.
  ko: 동쪽, 경사진 풀밭 아래에 작은 호수가 있다. 여기서 도망친 동물 중 일부가 거기로 가서, 당신이 떠나기를 기다리며 지켜보고 있다. 그러면 그들은 다시 잔치를 이어갈 수 있을 테니까.
  verdict: awkward
  note: 목적절 'so they can resume'을 '그러면 ~테니까'라는 별도 문장으로 떼어 내어 어색하다.
  fix: 동쪽, 경사진 풀밭 아래에 작은 호수가 있다. 여기서 도망친 동물 중 일부가 그리로 가서, 당신이 떠나면 다시 잔치를 벌이려고 지켜보며 기다리고 있다.
- id: tba:60:room:6023
  field: description
  en: You are in a grass covered field somewhere in the forest.  The tall grass nearly reaches your waist, and the surrounding
    oaks and beeches form an almost wall-like thicket on the east side of the field.  To the northeast you can see a small
    lake.  A small path leads south through the trees, and the field opens up to the north and west.
  ko: 당신은 숲 어딘가에 있는 풀이 덮인 들판에 있다. 높은 풀은 거의 허리까지 올라오고, 주변에 있는 참나무와 산벚나무가 들판 동쪽에서 거의 벽처럼 빽빽한 덤불을 이루고 있다. 북동쪽으로는 작은 호수가 보인다.
    작은 오솔길이 나무 사이로 남쪽으로 이어지고, 들판은 북쪽과 서쪽으로 열려 있다.
  verdict: wrong
  note: beeches를 '산벚나무'로 옮겼다. '너도밤나무'가 맞다.
  fix: 당신은 숲 어딘가에 있는 풀이 덮인 들판에 있다. 높은 풀은 거의 허리까지 올라오고, 주변에 있는 참나무와 너도밤나무가 들판 동쪽에서 거의 벽처럼 빽빽한 덤불을 이루고 있다. 북동쪽으로는 작은 호수가 보인다.
    작은 오솔길이 나무 사이로 남쪽으로 이어지고, 들판은 북쪽과 서쪽으로 열려 있다.
- id: tba:60:mob:6000
  field: description
  en: He is six feet tall and looks quite strong, muscles bulging under his heavy, checkered shirt.  His features are worn
    with hard work and his expression is one of a peaceful man leading a simple life.
  ko: 키가 약 180센티미터로 상당히 건장해 보인다. 무겁고 체크무늬가 들어간 셔츠 아래로 근육이 부풀어 있다. 얼굴은 힘든 노동으로 인해 거칠어졌으며, 단순한 삶을 살아가는 평온한 사람의 표정이다.
  verdict: awkward
  note: '''무겁고 체크무늬가 들어간 셔츠''는 형용사를 기계적으로 나열한 직역투다. ''~인해 거칠어졌으며'' 같은 표현도 딱딱하다.'
  fix: 키가 180센티미터쯤 되고 꽤 힘이 세 보이며, 두툼한 체크무늬 셔츠 아래로 근육이 불룩하다. 고된 노동에 얼굴이 거칠어졌지만, 소박한 삶을 사는 평온한 사람의 표정을 하고 있다.
- id: tba:60:room:6007
  field: exits.east.look
  en: You can barely make out a clearing to the east.
  ko: 동쪽으로는 희미하게 벌판이 보인다.
  verdict: wrong
  note: clearing은 숲속에 나무가 없이 트인 '빈터'다. '벌판'은 넓은 평야를 뜻하므로 오역이다.
  fix: 동쪽으로 숲속 빈터가 희미하게 보인다.
- id: tba:60:room:6070
  field: exits.south.look
  en: The trees seem to part, exposing a trail into the shade.
  ko: 나무들이 갈라지며, 그늘 속으로 이어지는 오솔길이 드러난다.
  verdict: wrong
  note: '''seem to''(~듯하다)가 빠져 단정적인 서술이 되었다.'
  fix: 나무들이 갈라지는 듯하더니, 그늘 속으로 이어지는 오솔길이 드러난다.
- id: tba:60:room:6062
  field: extras.1.text
  en: The shaded path is probably used by the small animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 작은 동물들이 사용하는 것이다.
  verdict: awkward
  note: '''아마도 ~사용하는 것이다''는 추측과 단정이 섞여 어색하다. 추측은 ''~일 것이다''로 맺는 것이 자연스럽다.'
  fix: 그늘진 오솔길은 아마 숲에 사는 작은 동물들이 다니는 길일 것이다.
