  ko: 잠시 바라본 후, 당신 바로 위쪽 가지에 새 둥지가 하나 있고, 서쪽으로 뻗어 나온 굵은 가지의 굽은 부분에 큰 다람쥐의 둥지가 하나 있음을 알아차린다.
  verdict: awkward
  note: '''not far above you''는 ''멀지 않은 위''인데 ''바로 위쪽''으로 옮겨 거리감이 달라졌다. ''잠시 바라본 후 … 알아차린다''는 번역투이다.'
  fix: 잠시 둘러보니, 당신 머리 위 멀지 않은 가지에 새 둥지가 하나 있고, 서쪽으로 뻗은 굵은 가지가 갈라지는 곳에 커다란 다람쥐 둥지가 하나 있는 것이 눈에 띈다.
- id: tba:60:room:6090
  field: exits.west.look
  en: To the west the dusty trail ends, and becomes a narrow trail into the cool shadows of the forest.
  ko: 서쪽으로는 먼지 낀 오솔길이 끝나고, 숲의 서늘한 그늘 속으로 이어지는 좁은 오솔길로 변한다.
  verdict: awkward
  note: '''먼지 낀''은 물건 표면에 쓰는 말이라 길에는 어색하다. ''오솔길''이 두 번 반복되어 문장이 늘어진다.'
  fix: 서쪽으로는 먼지 날리는 길이 끝나고, 숲의 서늘한 그늘 속으로 들어가는 좁은 오솔길로 바뀐다.
- id: tba:60:room:6080
  field: description
  en: You are standing among tightly packed trees between several hills.  You lost track of the path long ago, and now must
    rely on your instincts to guide you.  The ground is very rough and rocky here, and only the most hardy plants survive.  The
    crowns of the old trees leave the hills in an unreal twilight illumination.
  ko: 당신은 여러 언덕 사이, 빽빽하게 들어선 나무들 사이에 서 있다. 지은 지 오래된 길을 잃은 지 이미 오래되었고, 이제 본능에 의지해 길을 찾아야 한다. 여기 지면은 매우 거칠고 바위투성이이며, 가장 강한 식물들만
    살아남아 있다. 오래된 나무들의 수관이 언덕을 초현실적인 황혼의 빛으로 물들인다.
  verdict: wrong
  note: 원문에 없는 '지은 지 오래된'이 들어갔다. 'long ago'를 길에 대한 수식으로 잘못 옮겼다. 'hardy'는 '강한'보다 '억센'이 자연스럽다.
  fix: 당신은 여러 언덕 사이, 빽빽하게 들어선 나무들 사이에 서 있다. 길을 놓친 지 이미 오래이고, 이제는 본능에 의지해 나아가야 한다. 이곳의 땅은 매우 거칠고 바위투성이라, 가장 억센 식물들만 살아남는다.
    오래된 나무들의 우듬지가 언덕을 비현실적인 어스름 속에 잠기게 한다.
- id: tba:60:obj:6022
  field: long
  en: A small bluish egg has been left here.
  ko: 작고 푸른빛을 띠는 알이 여기 남겨져 있다.
  verdict: awkward
  note: '''남겨져 있다''는 ''has been left''를 직역한 피동 번역투이다.'
  fix: 작고 푸르스름한 알 하나가 여기 놓여 있다.
- id: tba:60:mob:6003
  field: description
  en: This small, furry creature with long ears and big feet has been attacked by the dreaded rabbit rabies, a horrible disease
    that turns helpless and innocent rabbits into ferocious and bloodthirsty monsters.
  ko: 긴 귀와 큰 발을 가진 이 작고 털이 부드러운 생물은 두려운 토끼 광견병에 감염되었다. 이 끔찍한 질병은 무방비하고 순진한 토끼를 사납고 피에 굶주린 괴물로 변하게 만든다.
  verdict: awkward
  note: '''furry''에 원문에 없는 ''부드러운''이 더해졌다. ''dreaded''를 옮긴 ''두려운''은 병을 꾸미는 말로 어색하다.'
  fix: 긴 귀와 큰 발을 가진 이 작고 털북숭이인 생물은 무시무시한 토끼 광견병에 걸렸다. 이 끔찍한 병은 무력하고 순진한 토끼를 사납고 피에 굶주린 괴물로 바꾸어 놓는다.
- id: tba:60:room:6062
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: '''beech''는 너도밤나무이다. 산벚나무로 잘못 옮겼다.'
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6031
  field: extras.4.text
  en: A variety of squirrels, chipmunks, and birds make their homes in this and the surrounding trees.  If you look closely
    you may be able to see some of their rapidly emptying nests.
  ko: 다양한 다람쥐, 칩먼크, 새들이 이 나무와 주변 나무들에 집을 만든다. 자세히 보면 빠르게 비어가는 그들의 둥지 중 일부가 보일지도 모른다.
  verdict: awkward
  note: '''칩먼크''는 음차여서 낯설다. 우리말로는 줄다람쥐이다. ''집을 만든다''는 ''make their homes''의 직역이다.'
  fix: 갖가지 다람쥐와 줄다람쥐, 새들이 이 나무와 주변 나무들에 보금자리를 틀고 산다. 자세히 보면 빠르게 비어 가는 그들의 둥지 몇 개가 보일지도 모른다.
- id: tba:60:mob:6008
  field: description
