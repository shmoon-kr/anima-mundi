  ko: 작은 길이 나무 사이로 서쪽으로 이어진다.
  verdict: awkward
  note: '''~로''가 겹친다. 3번과 같은 문제다.'
  fix: 작은 길이 나무들 사이를 지나 서쪽으로 이어진다.
- id: tba:60:mob:6011
  field: description
  en: The badger is slowly awakening and peering up at you from its burrow.  You know that it won't be moving this slow for
    long.  Its sharp claws and teeth catch your attention when you consider killing it.
  ko: 고라니는 천천히 깨어나며 굴 안에서 당신을 올려다보고 있다. 이 정도 속도로 움직이지는 않을 것이란 걸 당신은 안다. 죽이려는 생각이 들 때, 그 날카로운 발톱과 이빨이 당신의 시선을 끈다.
  verdict: wrong
  note: badger(오소리)를 '고라니'로 오역했다. 'won't be moving this slow for long'의 '오래'가 빠져 뜻이 '이 속도로 움직이지 않을 것'으로 바뀌었다.
  fix: 오소리가 천천히 잠에서 깨어나 굴 속에서 당신을 올려다보고 있다. 녀석이 오래도록 이렇게 느릿느릿하지는 않으리라는 것을 당신은 안다. 녀석을 죽일까 생각하는 순간, 날카로운 발톱과 이빨이 눈에 들어온다.
- id: tba:60:mob:6011
  field: short
  en: the sleepy badger
  ko: 졸린 고라니
  verdict: wrong
  note: badger를 '고라니'로 오역했다.
  fix: 졸린 오소리
- id: tba:60:room:6023
  field: extras.3.text
  en: The tall grass makes a nice hiding place for animals.
  ko: 높은 풀은 동물들에게 좋은 은신처가 된다.
  verdict: awkward
  note: 풀에는 '높은'보다 '키 큰'이 자연스럽다.
  fix: 키 큰 풀은 동물들에게 좋은 은신처가 된다.
- id: tba:60:room:6075
  field: extras.3.text
  en: The shaded path is probably used by the animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: '''오솔길은 … 이용하고 있을 것이다''는 주어와 서술어가 맞지 않는 직역투다.'
  fix: 그늘진 이 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6016
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: '''좁은 길은 … 사용하는 것 같다''는 주술 호응이 어색하다.'
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:mob:6002
  field: description
  en: The bear is a big, brown, furry animal with very large claws and very sharp teeth.  It doesn't resemble those cute little
    dolls from toy shops at all.
  ko: 곰은 크고 갈색이며, 털이 무성한 동물이다. 매우 큰 발톱과 매우 날카로운 이빨을 가지고 있다. 장난감 가게에서 볼 수 있는 귀여운 작은 인형과는 전혀 닮지 않았다.
  verdict: awkward
  note: '''매우 … 매우 … 가지고 있다''는 영어 have 직역투이고, 문장이 뚝뚝 끊긴다.'
  fix: 곰은 털이 무성한 커다란 갈색 짐승으로, 발톱은 아주 크고 이빨은 아주 날카롭다. 장난감 가게에서 파는 귀엽고 작은 인형과는 조금도 닮지 않았다.
- id: tba:60:room:6029
  field: description
  en: You are at the end of a small path leading through the dense forest.  The crowns of the old trees leave the forest in
    an unreal twilight illumination. This rough clearing is dominated by a very large oak tree, probably the largest in this
    part of the forest.  The path leads back to the north.
  ko: 당신은 짙은 숲을 관통하는 좁은 오솔길의 끝자락에 서 있다. 오래된 나무들의 수관이 숲 전체를 초현실적인 황혼의 빛으로 물들여 놓았다. 이 거친 공터는 이 숲 일대에서 아마도 가장 클 거대한 참나무 한 그루가
    지배하고 있다. 오솔길은 북쪽으로 되돌아간다.
  verdict: awkward
  note: '''수관''은 전문용어라 묘사문에 어색하다. unreal은 ''초현실적인''보다 ''비현실적인''이 가깝다. ''공터는 … 참나무가 지배하고 있다''는 dominated 직역투다.'
  fix: 당신은 울창한 숲을 지나는 좁은 오솔길의 끝에 서 있다. 오래된 나무들의 우듬지에 가려 숲은 비현실적인 어스름에 잠겨 있다. 거칠게 트인 이 공터에는 아주 커다란 참나무 한 그루가 우뚝 서 있는데, 아마 이
    숲 일대에서 가장 큰 나무일 것이다. 오솔길은 북쪽으로 되돌아간다.
- id: tba:60:room:6078
  field: extras.2.text
  en: The shaded path is probably used by the animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: 9번과 같은 문제로, 주술 호응이 어색한 직역투다.
  fix: 그늘진 이 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6033
  field: description
  en: The tree top gently sways in the wind, and you think you are as high as you can safely go in the tree.  The limbs here
    show evidence of a small battle, with ripped bark and loose feathers scattered everywhere.  Looking around, you can see
    the forest stretching out below you in all directions.  To the east you see Midgaard, and to the south the river runs
    through a deep chasm.  North and west of here you can see another small village, and on the western horizon you see a
    large mountain.
  ko: 나무 꼭대기는 바람에 부드럽게 흔들리고 있으며, 당신은 이 나무에서 안전하게 올라갈 수 있는 가장 높은 곳에 있는 것 같다. 여기 가지들은 작은 전투의 흔적을 보여 주며, 찢어진 껍질과 느슨한 깃털이 여기저기
    흩어져 있다. 주위를 둘러보니, 모든 방향으로 숲이 당신 아래로 펼쳐져 있다. 동쪽으로는 미드가르드가 보이고, 남쪽으로는 강이 깊은 협곡을 따라 흐르고 있다. 여기 북쪽과 서쪽으로는 또 다른 작은 마을이 보이고,
    서쪽 지평선에는 큰 산이 보인다.
  verdict: wrong
  note: loose feathers는 '빠진(흩어진) 깃털'인데 '느슨한 깃털'로 오역했다. '흔적을 보여 주며', '찢어진 껍질'도 직역투다.
  fix: 나무 꼭대기가 바람에 부드럽게 흔들린다. 이 나무에서 안전하게 오를 수 있는 곳은 여기까지인 것 같다. 이곳 가지에는 작은 싸움의 흔적이 남아 있어, 뜯겨 나간 나무껍질과 빠진 깃털이 사방에 흩어져 있다.
    주위를 둘러보니 발아래로 숲이 사방으로 펼쳐져 있다. 동쪽으로는 미드가르드가 보이고, 남쪽으로는 강이 깊은 협곡 사이로 흐른다. 이곳에서 북서쪽으로는 또 다른 작은 마을이 보이고, 서쪽 지평선에는 큰 산이 보인다.
- id: tba:60:room:6006
  field: exits.east.look
  en: The small path leads east through the trees.
  ko: 작은 길이 나무 사이로 동쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 동쪽으로''처럼 ''-으로''가 겹쳐 어색하다.'
  fix: 작은 길이 나무 사이를 지나 동쪽으로 이어진다.
- id: tba:60:room:6066
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다. '산벚나무'는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6001
  field: extras.0.text
  en: Very cute little creatures, they seem to enjoy life.
  ko: 매우 귀여운 작은 생물들이, 그들은 삶을 즐기는 것 같다.
  verdict: awkward
  note: '''생물들이, 그들은''은 문법이 깨진 문장이다.'
  fix: 아주 귀엽고 작은 동물들로, 삶을 즐기고 있는 것 같다.
- id: tba:60:room:6033
  field: extras.0.text
  en: To the south you see a river flowing roughly from the northeast to the west. It emerges from a dark opening in the side
    of a mountain and flows through Midgaard, and on into the forest.  It has eroded a deep chasm in the soft stone under
    the forest floor, and is not visible for long after it enters the forest proper.
  ko: 남쪽으로는 강이 대략 북동쪽에서 서쪽으로 흐르는 것이 보인다. 그것은 산 측면의 어두운 구멍에서 흘러나와 미드가르드를 지나 숲 안으로 흘러들어간다. 그것은 숲 바닥 아래 부드러운 돌을 깎아 깊은 협곡을 만들었고,
    숲 안으로 들어간 후에는 오래 보이지 않는다.
  verdict: awkward
  note: 대명사 '그것은'이 반복되는 번역투다. '숲 안으로 들어간 후에는 오래 보이지 않는다'는 의미가 모호하다.
  fix: 남쪽으로 강이 대략 북동쪽에서 서쪽으로 흐르는 것이 보인다. 강은 산비탈의 어두운 구멍에서 흘러나와 미드가르드를 지나 숲으로 이어진다. 강물이 숲 바닥 아래의 무른 돌을 깎아 깊은 협곡을 만들어 놓았기에,
    숲 깊숙이 들어서고 나면 강은 금세 보이지 않게 된다.
- id: tba:60:room:6025
  field: exits.west.look
  en: The smell of carrion drifts down to you from higher on the field to the west.
  ko: 서쪽, 풀밭의 높은 곳에서부터 시체 냄새가 당신에게 흘러들어온다.
  verdict: awkward
  note: carrion은 '썩은 고기'에 가깝다. drifts down의 '내려옴'이 빠졌고 '당신에게 흘러들어온다'는 부자연스럽다.
  fix: 서쪽으로 풀밭이 높아지는 쪽에서 썩은 고기 냄새가 바람을 타고 흘러내려 온다.
- id: tba:60:room:6012
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: 22번과 같다. beech는 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:obj:6003
  field: long
  en: A fireplace made from stone is set against the east wall.
  ko: 돌로 만든 벽난로가 동쪽 벽에 놓여 있다.
  verdict: awkward
  note: 벽난로는 붙박이 시설이므로 '놓여 있다'가 어색하다.
  fix: 동쪽 벽에 돌로 쌓은 벽난로가 있다.
- id: tba:60:room:6009
  field: description
  en: You are outside a small cabin built entirely from heavy logs.  There is a wooden door to the north and small paths lead
    west and south through the trees.
  ko: 당신은 무거운 원목으로 온전히 지어진 작은 오두막 앞에 서 있다. 북쪽에 나무 문이 있고, 서쪽과 남쪽으로 나무 사이를 지나는 작은 오솔길이 나 있다.
  verdict: awkward
  note: '''무거운 원목으로 온전히 지어진''은 부자연스럽다. heavy logs는 ''굵은 통나무'', entirely는 ''-로만''이 자연스럽다.'
  fix: 당신은 굵은 통나무로만 지은 작은 오두막 앞에 서 있다. 북쪽에 나무 문이 있고, 서쪽과 남쪽으로 나무 사이를 지나는 작은 오솔길이 나 있다.
- id: tba:60:obj:6019
  field: extras.0.text
  en: They look like they might be worth something to a craftsman.
  ko: 장인에게는 꽤 값어치가 있을 것 같다.
  verdict: wrong
  note: '''worth something''은 ''어느 정도 값이 나간다''는 뜻인데 ''꽤''를 붙여 정도를 부풀렸다.'
  fix: 장인에게라면 값이 좀 나갈 것 같다.
- id: tba:60:room:6022
  field: extras.1.text
  en: Quite uninteresting.
  ko: 꽤나 지루하다.
  verdict: awkward
  note: 사물 묘사의 'uninteresting'은 '별 볼일 없다'는 뜻이다. '지루하다'는 시간이나 활동에 어울리는 말이라 어색하다.
  fix: 전혀 흥미로울 것이 없다.
- id: tba:60:room:6004
  field: exits.south.look
  en: The small path leads south through the trees.
  ko: 작은 길이 나무 사이로 남쪽으로 이어진다.
  verdict: awkward
  note: '''~사이로 남쪽으로''처럼 ''로''가 겹쳐 읽기에 거슬린다.'
  fix: 작은 길이 나무 사이를 지나 남쪽으로 이어진다.
- id: tba:60:obj:6002
  field: extras.0.text
  en: They are fashioned from rough leather that has been oiled frequently to make it stay waterproof.  They look worn but
    quite functional.
  ko: 자주 기름을 발라 방수력을 유지하도록 처리한 거친 가죽으로 만들어졌다. 낡아 보이지만 꽤 쓸모 있어 보인다.
  verdict: awkward
  note: '''보이지만 … 보인다''로 ''보이다''가 반복된다. ''functional''은 ''제 구실을 한다''가 더 자연스럽다.'
  fix: 자주 기름을 발라 방수력을 유지하도록 처리한 거친 가죽으로 만들어졌다. 낡았지만 아직 제 구실은 충분히 할 것 같다.
- id: tba:60:room:6027
  field: description
  en: You are in the middle of a small lake, fed from a small stream coming through the forest from the northwest.  The water
    is not that clear, but you can see fish swimming around below you.  The bank is clear to the south, providing a safe place
    to get back to the field.
  ko: 당신은 작은 호수 한가운데 있다. 북서쪽에서 숲을 통해 흘러들어오는 작은 시내가 호수를 이룬다. 물은 그렇게 맑지 않지만, 당신 아래로 헤엄치는 물고기들이 보인다. 남쪽에는 둑이 깨끗하게 드러나 있어, 풀밭으로
    안전하게 돌아갈 수 있는 곳이 된다.
  verdict: wrong
  note: 호수의 'bank'를 '둑'(인공 제방)으로 옮겼다. 'clear'는 '탁 트였다'는 뜻인데 '깨끗하게 드러나'로 잘못 옮겼다. 'fed from'을 '호수를 이룬다'로 옮겨 뜻이 달라졌다. 마지막 문장의
    '~곳이 된다'도 어색하다.
  fix: 당신은 작은 호수 한가운데 있다. 호수는 북서쪽 숲을 지나 흘러드는 작은 시내에서 물을 받는다. 물은 그다지 맑지 않지만, 발아래로 물고기들이 헤엄쳐 다니는 것이 보인다. 남쪽 물가는 탁 트여 있어 풀밭으로
    안전하게 돌아갈 수 있다.
- id: tba:60:room:6000
  field: extras.1.text
  en: The forest trail winds westwards through the trees.
  ko: 숲의 오솔길이 나무 사이로 서쪽으로 굽이쳐 나간다.
  verdict: awkward
  note: '''사이로 서쪽으로''처럼 ''로''가 겹친다. ''굽이쳐 나간다''는 물살에 어울리는 표현이다.'
  fix: 숲속 오솔길이 나무 사이를 지나 서쪽으로 구불구불 이어진다.
- id: tba:60:room:6021
  field: extras.0.text
  en: The irregular opening is eight feet wide and six feet tall.  An acrid smell emanates from within.
  ko: 불규칙한 입구는 약 240센티미터 넓이에 약 180센티미터 높이이다. 안쪽에서 시큼한 냄새가 풍겨 나온다.
  verdict: wrong
  note: '''wide''를 면적을 뜻하는 ''넓이''로 옮겼다(너비·폭이 맞다). ''acrid''(코를 찌르는, 매캐한)를 ''시큼한''으로 잘못 옮겼다.'
  fix: 불규칙하게 뚫린 입구는 너비가 약 2.4미터, 높이가 약 1.8미터다. 안쪽에서 코를 찌르는 매캐한 냄새가 풍겨 나온다.
- id: tba:60:room:6082
  field: exits.east.look
  en: All you see are trees and hillsides.
  ko: 나무와 언덕의 경사면만 보인다.
  verdict: awkward
  note: '''언덕의 경사면''은 딱딱하다. ''All you see''는 ''~뿐이다''로 살리는 편이 자연스럽다.'
  fix: 보이는 것은 나무와 언덕 비탈뿐이다.
- id: tba:60:room:6020
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: '''아마도''와 ''것 같다''가 겹친다. 동물이 길을 ''사용한다''는 표현도 번역투다.'
  fix: 이 좁은 길은 아마 숲에 사는 짐승들이 다니는 길일 것이다.
- id: tba:60:room:6023
  field: exits.north.look
  en: Wind blowing in from the north carries with it the smell of a newly killed animal, as well as the noise of many birds,
    which you can see circling there.
  ko: 북쪽에서 불어오는 바람은 방금 죽은 동물의 냄새와 함께 많은 새들의 소리를 실어 나른다. 당신은 그곳에서 원을 그리며 날고 있는 새들을 볼 수 있다.
  verdict: awkward
  note: '''당신은 … 볼 수 있다''는 영어 직역 투다. 바람이 소리를 ''실어 나른다''도 딱딱하다.'
  fix: 북쪽에서 불어오는 바람에 갓 죽은 짐승의 냄새와 수많은 새 울음소리가 실려 온다. 그쪽 하늘에 새들이 빙빙 맴도는 것이 보인다.
- id: tba:60:mob:6017
  field: long
  en: A fish is swimming about here.
  ko: 여기 물고기가 헤엄치고 있다.
  verdict: awkward
  note: '''swimming about''(이리저리)의 뉘앙스가 빠졌다. ''여기 물고기가''도 어색하다.'
  fix: 물고기 한 마리가 이리저리 헤엄치고 있다.
- id: tba:60:room:6002
  field: extras.1.text
  en: The forest trail winds east-west through the trees.
  ko: 숲의 오솔길이 나무 사이로 동서 방향으로 굽이쳐 나간다.
  verdict: awkward
  note: '''사이로 동서 방향으로''처럼 ''로''가 겹친다. ''굽이쳐 나간다''도 어색하다.'
  fix: 숲속 오솔길이 나무 사이를 지나 동서로 구불구불 이어진다.
- id: tba:60:room:6081
  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: '''beech''는 너도밤나무다. 산벚나무(wild cherry)는 오역이다.'
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6073
  field: description
  en: You are on a small shadowy path leading through the dense forest.  To the north the terrain becomes quite hilly and
    rough.  The crowns of the old trees leave the forest in an unreal twilight illumination.  The path continues north and
    south.
  ko: 당신은 짙은 숲을 관통하는 작은 어두운 오솔길 위에 있다. 북쪽으로는 지형이 꽤 울퉁불퉁하고 험해진다. 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다. 오솔길이 북쪽과 남쪽으로 이어진다.
  verdict: awkward
  note: '''작은 어두운''처럼 관형어가 나열되어 있다. ''hilly''는 ''언덕이 많다''인데 ''울퉁불퉁''으로 옮겼다. ''수관''은 전문 용어라 서사에 맞지 않는다. ''unreal''은 ''초현실적''보다
    ''비현실적''이 가깝다.'
  fix: 당신은 짙은 숲을 가로지르는 그늘진 작은 오솔길 위에 있다. 북쪽으로 갈수록 언덕이 많아지고 지형이 꽤 험해진다. 늙은 나무들의 우듬지 때문에 숲은 비현실적인 어스름에 잠겨 있다. 오솔길은 북쪽과 남쪽으로
    이어진다.
- id: tba:60:obj:6004
  field: long
  en: A hooded brass lantern has been left here.
  ko: 투구가 달린 황동 랜턴이 여기 남겨져 있다.
  verdict: wrong
  note: '''hooded lantern''은 빛을 가리는 갓(덮개)이 달린 랜턴이다. ''투구''는 오역이다.'
  fix: 갓 달린 황동 랜턴 하나가 여기 남겨져 있다.
- id: tba:60:room:6020
  field: exits.west.look
  en: The small path leads west through the trees.
  ko: 작은 길이 나무 사이로 서쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 서쪽으로''처럼 ''로''가 겹친다.'
  fix: 작은 길이 나무 사이를 지나 서쪽으로 이어진다.
- id: tba:60:mob:6010
  field: description
  en: It peers out of its nest at you anxiously, seeming to plead silently with you to leave it alone.
  ko: 다람쥐는 둥지 밖으로 고개를 내밀어 당신을 불안한 눈빛으로 바라보고 있다. 당신에게 조용히 혼자 두어 달라고 애원하는 것처럼 보인다.
  verdict: wrong
  note: 원문에 없는 주어 '다람쥐는'을 덧붙였다. 또한 'leave it alone'을 '혼자 두어 달라고'로 직역해 어색하고, 'peers out'의 진행형 '바라보고 있다'도 장황하다.
  fix: 둥지 밖으로 고개를 내밀고 불안한 눈빛으로 당신을 바라본다. 제발 건드리지 말아 달라고 말없이 애원하는 듯하다.
- id: tba:60:mob:6006
  field: long
  en: A large bird with a broken wing has been cornered here.
  ko: 날개가 부러진 큰 새 한 마리가 여기에서 구석으로 몰려 있다.
  verdict: awkward
  note: '''여기에서 구석으로 몰려 있다''는 직역투라 부자연스럽다.'
  fix: 날개가 부러진 큰 새 한 마리가 이곳 구석에 몰려 있다.
- id: tba:60:room:6007
  field: exits.west.look
  en: The small path leads west through the trees.
  ko: 작은 길이 나무 사이로 서쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 서쪽으로''처럼 ''~로''가 겹친다. ''path''는 다른 항목처럼 ''오솔길''로 통일하는 것이 좋다.'
  fix: 작은 오솔길이 나무 사이를 지나 서쪽으로 이어진다.
- id: tba:60:room:6077
  field: exits.south.look
  en: All you see are trees and hillsides.
  ko: 나무와 언덕의 경사면만 보인다.
  verdict: awkward
  note: '''언덕의 경사면''은 딱딱하다. ''All you see are''의 강조(''~뿐'')도 살리지 못했다.'
  fix: 보이는 것이라고는 나무와 언덕 비탈뿐이다.
- id: tba:60:mob:6016
  field: short
  en: the young buck
  ko: 젊은 사슴
  verdict: wrong
  note: '''buck''은 수컷 사슴이다. ''사슴''으로만 옮겨 성별 정보가 빠졌다.'
  fix: 젊은 수사슴
- id: tba:60:room:6068
  field: extras.1.text
  en: The shaded path is probably used by the animals living in the forest.
  ko: 그늘진 오솔길은 아마도 숲에 사는 동물들이 이용하고 있을 것이다.
  verdict: awkward
  note: '''이용하고 있을 것이다''는 번역투다. 동물이 다니는 길이라는 뜻을 자연스럽게 풀어야 한다.'
  fix: 그늘진 이 오솔길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:obj:6000
  field: extras.0.text
  en: It is a heavy axe of the kind lumberjacks use to chop down trees.
  ko: 벌목꾼들이 나무를 베는 데 사용하는 종류의 무거운 도끼다.
  verdict: awkward
  note: '''사용하는 종류의''는 ''of the kind''를 직역한 표현이다.'
  fix: 벌목꾼들이 나무를 벨 때 쓰는 묵직한 도끼다.
- id: tba:60:room:6090
  field: description
  en: You are on a dust covered east-west road through the western plains.  An occasional hunter or adventurer can be seen,
    heading to or from the forest. To the east is the walled city, Midgaard, and to the west the road ends at the head of
    a narrow trail into a large forest.
  ko: 당신은 서쪽 평원을 동서로 가로지르는 먼지가 쌓인 길 위에 있다. 가끔 사냥꾼이나 모험가가 숲으로 향하거나 숲에서 나오는 모습을 볼 수 있다. 동쪽에는 성벽으로 둘러싸인 도시, 미드가르드가 있고, 서쪽으로는
    길이 좁아져 거대한 숲 안으로 이어지는 오솔길의 입구에서 끝난다.
  verdict: wrong
  note: '''길이 좁아져''는 원문에 없는 내용이다. 원문은 길이 좁은 오솔길 어귀에서 끝난다는 뜻이다. 문장 구조도 꼬여 있다.'
  fix: 당신은 서쪽 평원을 동서로 가로지르는, 먼지가 뽀얗게 쌓인 길 위에 있다. 가끔 숲으로 향하거나 숲에서 돌아오는 사냥꾼이나 모험가가 눈에 띈다. 동쪽에는 성벽으로 둘러싸인 도시 미드가르드가 있고, 서쪽으로
    가면 길은 큰 숲으로 들어가는 좁은 오솔길 어귀에서 끝난다.
- id: tba:60:room:6012
  field: exits.south.look
  en: The small path leads south through the trees.
  ko: 작은 길이 나무 사이로 남쪽으로 이어진다.
  verdict: awkward
  note: 5번과 같다. '~로'가 겹치고 용어가 통일되지 않았다.
  fix: 작은 오솔길이 나무 사이를 지나 남쪽으로 이어진다.
- id: tba:60:mob:6004
  field: description
  en: She is a graceful creature on long, slender legs, and with large, brown eyes looking back at you with an air of watchful
    interest.
  ko: 긴 가느다란 다리를 가진 우아한 동물로, 큰 갈색 눈으로 당신을 경계하면서도 호기심을 담아 바라보고 있다.
  verdict: awkward
  note: '''긴 가느다란 다리''는 형용사를 나열해 비문에 가깝다. ''길고 가느다란''으로 고쳐야 한다. ''looking back''의 ''마주 보다''라는 뉘앙스도 살리는 것이 좋다.'
  fix: 길고 가느다란 다리를 지닌 우아한 동물로, 커다란 갈색 눈이 경계와 호기심이 섞인 기색으로 당신을 마주 보고 있다.
- id: tba:60:room:6091
  field: extras.0.text
  en: The road is well used, and quite dusty.
  ko: 이 길은 많이 다녔는지 꽤 먼지가 많다.
  verdict: awkward
  note: '''많이 다녔는지''는 원문에 없는 추측과 인과를 덧붙인다. 원문은 두 사실을 나열할 뿐이다.'
  fix: 이 길은 왕래가 잦고 먼지가 꽤 많다.
- id: tba:60:room:6008
  field: exits.east.look
  en: The small path leads east through the trees.
  ko: 작은 길이 나무 사이로 동쪽으로 이어진다.
  verdict: awkward
  note: 5번과 같다.
  fix: 작은 오솔길이 나무 사이를 지나 동쪽으로 이어진다.
- id: tba:60:room:6013
  field: exits.east.look
  en: The small path leads east through the trees.
  ko: 작은 길이 나무 사이로 동쪽으로 이어진다.
  verdict: awkward
  note: 5번과 같다.
  fix: 작은 오솔길이 나무 사이를 지나 동쪽으로 이어진다.
- id: tba:60:room:6079
  field: exits.west.look
  en: All you see are trees and hillsides.
  ko: 나무와 언덕의 경사면만 보인다.
  verdict: awkward
  note: 6번과 같다.
  fix: 보이는 것이라고는 나무와 언덕 비탈뿐이다.
- id: tba:60:mob:6014
  field: short
  en: the large black crow
  ko: 큰 까마귀
  verdict: wrong
  note: '''black''이 빠졌다.'
  fix: 커다란 검은 까마귀
- id: tba:60:room:6023
  field: exits.east.look
  en: The ground slopes gently downward to the eastern tree line.
  ko: 땅은 동쪽 나무 줄기 쪽으로 완만하게 내려간다.
  verdict: wrong
  note: '''tree line''을 ''나무 줄기''로 오역했다. 숲이 시작되는 경계, 즉 숲 가장자리를 뜻한다.'
  fix: 땅은 동쪽 숲 가장자리를 향해 완만하게 내려간다.
- id: tba:60:room:6017
  field: extras.1.text
  en: The crowns of the old trees leave the forest in an unreal twilight illumination.  A large branch looms above you, over
    the path.
  ko: 오래된 나무들의 수관이 숲을 초현실적인 황혼의 빛으로 물들인다. 큰 가지 하나가 오솔길 위, 당신 머리 위에서 위압적으로 드리워져 있다.
  verdict: awkward
  note: '''수관''은 전문 용어라 서사에 어울리지 않는다. ''unreal''은 ''초현실적''보다 ''비현실적''이 맞고, ''twilight''은 ''어스름''이 더 자연스럽다.'
  fix: 오래된 나무들의 우듬지가 숲을 비현실적인 어스름 빛 속에 잠기게 한다. 큰 가지 하나가 오솔길 위로, 당신 머리 위에 위압적으로 드리워져 있다.
- id: tba:60:room:6023
  field: exits.south.look
  en: The small path leads south in between the trees.
  ko: 작은 오솔길이 나무 사이로 남쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 남쪽으로''처럼 ''~로''가 겹친다.'
  fix: 작은 오솔길이 나무들 사이를 지나 남쪽으로 이어진다.
- id: tba:60:room:6021
  field: extras.2.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: '''아마도 ~것 같다''는 추측 표현이 겹치고, 동물에게 ''사용하는''은 딱딱하다. ''다니는 길''이 자연스럽다.'
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6024
  field: extras.0.text
  en: The trees form a close thicket, blocking any exit to the south and east.
  ko: 나무들이 빽빽한 덤불을 이루어 남쪽과 동쪽의 통로를 막고 있다.
  verdict: awkward
  note: 나무들이 '덤불'을 이룬다는 표현이 어색하다. 덤불은 관목이나 풀이 엉킨 것이다. '통로를 막고 있다'도 출구가 없다는 뜻을 살리기에 다소 딱딱하다.
  fix: 나무들이 빽빽하게 들어차 남쪽과 동쪽으로는 빠져나갈 길이 없다.
- id: tba:60:obj:6006
  field: extras.0.text
  en: It is a small, simple brass key with no inscriptions or marks of any kind.
  ko: 아무런 문양이나 표식도 없는 작고 단순한 황동 열쇠다.
  verdict: wrong
  note: inscriptions는 새긴 글귀이지 '문양'(무늬)이 아니다.
  fix: 아무런 글귀나 표식도 새겨지지 않은 작고 단순한 황동 열쇠다.
- id: tba:60:room:6014
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: 2번과 같다. 추측 표현이 겹치고 '사용하는'이 딱딱하다.
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6032
  field: extras.1.text
  en: They look quite sturdy, certainly capable of holding your weight should you decide to climb around in the tree using
    them.
  ko: 가지들은 꽤 단단해 보인다. 이들을 이용해 나무 위를 기어오르기로 마음먹는다면 당신의 체중을 견뎌낼 수 있을 정도로 단단하다.
  verdict: awkward
  note: '''단단''이 두 번 반복되고 ''이들을 이용해''는 번역투다. climb around는 나무 위를 오르내리며 돌아다닌다는 뜻이다.'
  fix: 가지들은 꽤 단단해 보인다. 이 가지들을 딛고 나무 위를 오르내리기로 한다면 당신의 몸무게쯤은 거뜬히 버틸 것이다.
- id: tba:60:room:6021
  field: exits.east.look
  en: The small path leads east through the trees.
  ko: 작은 길이 나무 사이로 동쪽으로 이어진다.
  verdict: awkward
  note: '''사이로 동쪽으로''처럼 ''~로''가 연달아 나와 어색하다.'
  fix: 작은 길이 나무 사이를 지나 동쪽으로 이어진다.
- id: tba:60:mob:6016
  field: long
  en: A young 5-point buck is drinking from the lake here.
  ko: 여기 호수에서 물을 마시고 있는 5갈래 뿔의 젊은 수사슴이 있다.
  verdict: awkward
  note: '''여기 ~있다'' 구조가 직역투다. ''5갈래 뿔''보다 ''뿔가지가 다섯인''이 자연스럽다.'
  fix: 뿔가지가 다섯 개인 젊은 수사슴 한 마리가 호수에서 물을 마시고 있다.
- id: tba:60:mob:6015
  field: description
  en: It sickens you to even look at this foul bird.  Bits of dried gore stick to its beak, and unidentifiable organs hang
    from its talons and feathers.  It sees you and attacks, protecting its horrible feast!
  ko: 이 더러운 새를 바라보는 것만으로도 구역질이 날 정도다. 말라붙은 피가 부리에 달라붙어 있고, 식별할 수 없는 장기가 발톱과 깃털 사이로 늘어져 있다. 당신을 발견하자마자, 이 끔찍한 잔치를 지키기 위해 공격한다!
  verdict: awkward
  note: '''식별할 수 없는 장기''는 딱딱하다. ''정체를 알 수 없는 내장''이 자연스럽다. foul은 ''더러운''보다 ''흉측한''이 어울린다.'
  fix: 이 흉측한 새를 바라보는 것만으로도 구역질이 날 정도다. 말라붙은 핏덩이가 부리에 엉겨 붙어 있고, 정체를 알 수 없는 내장이 발톱과 깃털에 매달려 늘어져 있다. 새는 당신을 발견하자마자 이 끔찍한 잔치를
    지키려고 달려든다!
- id: tba:60:room:6024
  field: description
  en: You are in a lower part of the grassy field, south of a small lake.  The grass here has been trampled by the many animals
    coming here for water, leaving the ground covered in tracks of different types.  To the west you see a break in the wall
    of trees surrounding the field, and to the north is a small lake.
  ko: 당신은 작은 호수의 남쪽에 있는 풀밭의 낮은 지대에 서 있다. 여기 풀은 물을 마시러 온 수많은 동물들에게 짓밟혀, 땅은 온갖 종류의 발자국으로 뒤덮여 있다. 서쪽으로는 풀밭을 둘러싼 나무벽에 난 틈이 보이고,
    북쪽에는 작은 호수가 있다.
  verdict: awkward
  note: '''나무벽''은 나무로 만든 벽으로 읽힐 수 있다. ''여기 풀은''도 ''이곳의 풀은''이 자연스럽다.'
  fix: 당신은 작은 호수 남쪽, 풀밭의 낮은 지대에 서 있다. 이곳의 풀은 물을 마시러 온 수많은 동물들에게 짓밟혀, 땅은 온갖 종류의 발자국으로 뒤덮여 있다. 서쪽으로는 풀밭을 둘러싼 나무들의 벽이 끊긴 틈이 보이고,
    북쪽에는 작은 호수가 있다.
- id: tba:60:room:6025
  field: extras.4.text
  en: The tall grass makes a nice hiding place for animals.
  ko: 높은 풀은 동물들에게 좋은 은신처가 된다.
  verdict: awkward
  note: 풀에는 '높은'이 아니라 '키 큰'을 쓴다.
  fix: 키 큰 풀은 동물들에게 좋은 은신처가 된다.
- id: tba:60:room:6028
  field: extras.1.text
  en: The narrow path is probably used by the animals living in the forest.
  ko: 이 좁은 길은 아마도 숲에 사는 동물들이 사용하는 것 같다.
  verdict: awkward
  note: 2번과 같다.
  fix: 이 좁은 길은 아마 숲에 사는 동물들이 다니는 길일 것이다.
- id: tba:60:room:6032
  field: extras.2.text
  en: It looks like a Bobcat, and it seems quite intent on getting to a large bird that it has wounded.  It has not seen you
    yet, or perhaps just thinks you are too easy a meal.
  ko: 그것은 보브캣처럼 보이며, 다친 큰 새를 잡으려는 데 매우 집착하고 있다. 아직 당신을 보지 못했거나, 아마도 당신을 너무 쉬운 먹잇감이라고 생각할 뿐일 것이다.
  verdict: wrong
  note: '''that it has wounded''(자기가 상처 입힌)가 ''다친''으로 바뀌어 보브캣이 새를 다치게 했다는 정보가 빠졌다. ''seems''의 추측도 ''집착하고 있다''로 단정되었고, ''그것은''으로
    시작하는 문장은 딱딱하다.'
  fix: 보브캣처럼 보인다. 자기가 상처 입힌 큰 새를 잡는 데 온 정신이 팔린 듯하다. 아직 당신을 보지 못했거나, 어쩌면 당신을 너무 손쉬운 먹잇감으로 여기는 것일지도 모른다.
- id: tba:60:room:6031
  field: extras.1.text
  en: The limbs look quite sturdy, certainly capable of holding your weight should you decide to climb around in the tree
    using them.
  ko: 가지들은 꽤 단단해 보인다. 이들을 이용해 나무 위를 기어오르기로 마음먹는다면 당신의 체중을 견뎌낼 수 있을 정도로 단단하다.
  verdict: awkward
  note: 8번과 같다.
  fix: 가지들은 꽤 단단해 보인다. 이 가지들을 딛고 나무 위를 오르내리기로 한다면 당신의 몸무게쯤은 거뜬히 버틸 것이다.
- id: tba:60:mob:6010
  field: long
  en: A squirrel is here seeking refuge in its nest.
  ko: 다람쥐 한 마리가 둥지 안에서 피난처를 찾고 있다.
  verdict: awkward
  note: '''피난처를 찾고 있다''는 seeking refuge를 그대로 옮긴 직역이다. 둥지에 숨어 있다는 뜻이다.'
  fix: 다람쥐 한 마리가 둥지 속에 몸을 숨기고 있다.
- id: tba:60:room:6023
  field: extras.1.text
  en: The trees form a close thicket, blocking any exit to the west.
  ko: 나무들이 빽빽한 덤불을 이루어 서쪽 출구를 막고 있다.
  verdict: awkward
  note: 3번과 같다. 나무가 '덤불'을 이룬다는 표현이 어색하다.
  fix: 나무들이 빽빽하게 들어차 서쪽으로는 빠져나갈 길이 없다.
- id: tba:60:room:6065
  field: exits.south.look
  en: Through the trees to the south you can almost see the main trail leading back to Midgaard.
  ko: 남쪽 나무 사이로 미드가르드로 돌아가는 주요 오솔길이 거의 보인다.
  verdict: awkward
  note: main trail은 '주요 오솔길'이 아니라 '큰길'이다. 'almost see'는 '어렴풋이 보인다'가 자연스럽다.
  fix: 남쪽 나무들 사이로 미드가르드로 돌아가는 큰길이 어렴풋이 보인다.
- id: tba:60:room:6004
  field: extras.1.text
  en: The forest trail seems almost fragile compared to the massive trunks.
  ko: 거대한 나무 줄기에 비해 숲의 오솔길은 거의 취약해 보인다.
  verdict: wrong
  note: fragile을 '취약한'(공격·위험에 약한)으로 옮긴 것은 오역이다. 여기서는 가냘프고 연약하다는 뜻이다.
  fix: 거대한 나무줄기들에 비하면 숲속 오솔길은 연약해 보일 지경이다.
- id: tba:60:room:6068
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다. '산벚나무'(wild cherry)는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6015
  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다. 산벚나무는 다른 수종이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:obj:6007
  field: long
  en: Some gold coins lie piled up in a heap on the floor.
  ko: 금화 몇 닢이 바닥에 한 무더기로 쌓여 있다.
  verdict: awkward
  note: 몇 닢은 적은 수를 뜻해 한 무더기와 어울리지 않는다.
  fix: 금화가 바닥에 한 무더기로 쌓여 있다.
- id: tba:60:room:6029
  field: extras.1.text
  en: They look quite sturdy, certainly capable of holding your weight should you decide to climb up the tree using them.
  ko: 가지들은 꽤 단단해 보인다. 이들을 이용해 나무를 오르기로 마음먹는다면 당신의 체중을 견뎌낼 수 있을 정도로 단단하다.
  verdict: awkward
  note: 단단을 두 번 반복하고, 이들을 이용해는 번역투다.
  fix: 가지들은 꽤 단단해 보인다. 이 가지를 딛고 나무에 오르기로 한다면 당신의 몸무게쯤은 너끈히 버텨 줄 것이다.
- id: tba:60:room:6075
  field: extras.1.text
  en: To the northwest the ground becomes more hilly.  You have heard that a halfling village is somewhere in the hills.
  ko: 북서쪽으로 갈수록 지면이 더 울퉁불퉁해진다. 언덕 어딘가에 하프링 마을이 있다는 말을 들은 적이 있다.
  verdict: wrong
  note: hilly는 언덕이 많다는 뜻이다. 울퉁불퉁은 표면이 고르지 않다는 뜻이라 의미가 다르다.
  fix: 북서쪽으로 갈수록 땅에 언덕이 많아진다. 언덕 어딘가에 하프링 마을이 있다는 말을 들은 적이 있다.
- id: tba:60:room:6001
  field: exits.east.look
  en: The trail continues eastwards out of the forest.
  ko: 오솔길이 숲 밖으로 동쪽으로 이어진다.
  verdict: awkward
  note: ~으로 ~으로가 겹쳐 어색하다.
  fix: 오솔길은 동쪽으로 이어져 숲 밖으로 빠져나간다.
- id: tba:60:mob:6012
  field: description
  en: This happy creature seems to pay you no heed as it goes about its search for nuts among the leaves and twigs on the
    ground here.
  ko: 이 행복한 생물은 여기 바닥의 낙엽과 나뭇가지 사이에서 견과류를 찾는 데 정성을 쏟느라 당신을 전혀 신경 쓰지 않는 것 같다.
  verdict: awkward
  note: 정성을 쏟느라는 원문에 없는 뉘앙스이고, 여기 바닥의는 직역투다.
  fix: 이 행복한 생물은 바닥의 낙엽과 잔가지 사이를 뒤지며 견과를 찾느라 당신에게는 전혀 관심이 없는 듯하다.
- id: tba:60:room:6079
  field: extras.1.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 너도밤나무다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6078
  field: description
  en: You are at the end of a small shaded path leading between the trees.  The forest is quite thick here, and the ground
    is very rough and hilly, halting your progress.  The path lies to the south.
  ko: 당신은 나무 사이로 이어지는 작은 그늘진 오솔길의 끝자락에 서 있다. 이쪽 숲은 꽤 짙고, 지면은 매우 거칠고 울퉁불퉁하여 당신의 발걸음을 늦추고 있다. 오솔길은 남쪽으로 이어진다.
  verdict: wrong
  note: halting은 더 나아갈 수 없게 막는다는 뜻인데 늦추다로 약해졌다. hilly를 울퉁불퉁으로 옮겼다. 작은 그늘진의 어순도 어색하다.
  fix: 당신은 나무 사이로 이어지는 그늘진 작은 오솔길의 끝에 서 있다. 이쪽 숲은 꽤 빽빽하고, 땅은 몹시 거칠고 언덕이 많아 더는 나아갈 수 없다. 오솔길은 남쪽으로 나 있다.
- id: tba:60:room:6004
  field: description
  en: You are on a trail winding east and west through the dense forest.  To the west, the trees are so huge and their crowns
    so dense that forest remains in total darkness.  A small path leads south through the trees.
  ko: 당신은 짙은 숲을 동서로 굽이치는 오솔길 위에 있다. 서쪽으로는 나무들이 너무 크고 그루터기가 너무 짙어 숲이 완전한 어둠 속에 잠겨 있다. 남쪽으로 나무 사이로 작은 길이 이어진다.
  verdict: wrong
  note: crowns(나무 윗부분)를 그루터기(밑동)로 오역했다. 남쪽으로 나무 사이로도 ~으로가 겹친다.
  fix: 당신은 짙은 숲을 동서로 굽이치는 오솔길 위에 있다. 서쪽으로는 나무들이 워낙 거대하고 우듬지가 빽빽해 숲이 완전한 어둠에 잠겨 있다. 나무 사이로 작은 길이 남쪽으로 이어진다.
- id: tba:60:obj:6011
  field: extras.0.text
  en: It looks to be a tasty little thing.
  ko: 맛있어 보이는 작은 버섯이다.
  verdict: wrong
  note: 원문에 없는 버섯을 덧붙였다. 물건 종류는 이름에서 드러나므로 설명문에 추가하지 않는다.
  fix: 작고 맛있어 보인다.
- id: tba:60:room:6004
  field: extras.0.text
  en: The crowns of the old trees almost cut out all light.
  ko: 오래된 나무들의 그루터기가 거의 모든 빛을 가린다.
  verdict: wrong
  note: crowns를 그루터기로 오역했다.
  fix: 오래된 나무들의 우듬지가 빛을 거의 다 가린다.
- id: tba:60:mob:6004
  field: short
  en: the fallow deer
  ko: 노루
  verdict: wrong
  note: fallow deer는 다마사슴이다. 노루는 roe deer다.
  fix: 다마사슴
- id: tba:60:room:6001
  field: name
  en: A Trail Through The Light Forest
  ko: 밝은 숲을 지나는 오솔길
  verdict: awkward
  note: Dense Forest와 대비되는 Light Forest는 나무가 듬성듬성한 숲일 가능성이 크다. 다만 밝기를 뜻할 수도 있어 확실하지 않으며 확인이 필요하다.
  fix: 성긴 숲을 지나는 오솔길
