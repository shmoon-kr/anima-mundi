  field: extras.0.text
  en: The trees are mostly old beeches and oaks.
  ko: 나무들은 대부분 오래된 산벚나무와 참나무다.
  verdict: wrong
  note: beech는 '너도밤나무'다. '산벚나무'는 오역이다.
  fix: 나무들은 대부분 오래된 너도밤나무와 참나무다.
- id: tba:60:room:6033
  field: extras.1.text
  en: A long mountain range stretches across the horizon to the north and northeast.  You have heard rumors of many different
    sorts of creatures living there, varying from Dwarves and Humans to Ogres and various humanoid creatures. Some say that
    evil Dark Elves dwell in the underworld deep below the lands of the Dwarves.  The caves of Moria also are found there,
    populated by all sorts of evil creatures.
  ko: 긴 산맥이 북쪽과 북동쪽 지평선을 가로지르고 있다. 당신은 그곳에 사는 다양한 종족들에 대한 소문을 들어본 적이 있다. 드워프와 인간부터 오크와 다양한 유인형 종족까지 다양하다. 어떤 이들은 악한 다크엘프가
    드워프 땅 깊은 아래쪽의 지하 세계에 살고 있다고 말한다. 모리아의 동굴도 그곳에 있으며, 온갖 악한 생물들이 서식하고 있다.
  verdict: wrong
  note: Ogres를 '오크'로 옮겼다. '오거'가 맞다. 'varying from ~ to ~' 구문도 '~부터 ~까지 다양하다'를 따로 떼어 내어 어색하다.
  fix: 긴 산맥이 북쪽과 북동쪽 지평선을 가로지르고 있다. 당신은 그곳에 드워프와 인간에서부터 오거와 갖가지 유인형 종족에 이르기까지 온갖 생물이 산다는 소문을 들어본 적이 있다. 어떤 이들은 악한 다크엘프가 드워프
    땅 깊은 아래쪽의 지하 세계에 살고 있다고 말한다. 모리아의 동굴도 그곳에 있으며, 온갖 악한 생물들이 서식하고 있다.
