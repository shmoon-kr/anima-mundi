- id: tba:35:room:3511
  field: description
  en: You are on a north-south trail through the woods.  To the west, impassable mountains glare at you, and the thick woods
    and undergrowth prevent any movement westward.
  ko: 당신은 숲을 관통하는 북-남 방향의 산길 위에 있다. 서쪽으로는 넘을 수 없는 산들이 당신을 노려보고 있으며, 빽빽한 숲과 덤불이 서쪽 방향의 이동을 막고 있다.
  verdict: wrong
  note: '''trail through the woods''를 산길(mountain path)로 옮겨 원문에 없는 산의 의미가 더해졌다. 또 ''북-남 방향의''는 딱딱하다. 제안: ''당신은 숲을 남북으로 가로지르는
    오솔길 위에 있다. 서쪽으로는 넘을 수 없는 산들이 당신을 노려보고 있고, 빽빽한 숲과 덤불 때문에 서쪽으로는 나아갈 수 없다.'''
