- id: tba:100:room:10065
  field: description
  en: You walk along the northern road.  The well-made path makes travel easy. The road continues north and south.  To the
    east and west is thick forest.  You think you can see an intersection of roads to the north.
  ko: 당신은 북쪽 길을 따라 걷고 있다. 잘 닦인 길이 이동하기 편하게 해 준다. 길은 북쪽과 남쪽으로 이어진다. 동쪽과 서쪽에는 짙은 숲이 펼쳐져 있다. 북쪽으로 길의 교차로가 보이는 것 같다.
  verdict: awkward
  note: '''잘 닦인 길이 이동하기 편하게 해 준다''는 무생물 주어를 그대로 옮긴 번역투이다. ''길의 교차로''도 어색하므로 ''갈림길''이 낫다.'
  fix: 당신은 북쪽 길을 따라 걷고 있다. 길이 잘 닦여 있어 걷기가 수월하다. 길은 북쪽과 남쪽으로 이어진다. 동쪽과 서쪽에는 짙은 숲이 펼쳐져 있다. 북쪽에 갈림길이 보이는 듯하다.
