- id: tba:100:mob:10009
  field: description
  en: This odd creature has eyes that look to be made for seeing in the dark. It's about 2 feet long including a hairless
    tail.  It looks stupid and slow.
  ko: 이 기이한 동물은 어둠 속에서 볼 수 있도록 만들어진 듯한 눈을 가지고 있다. 털이 없는 꼬리를 포함해 약 60센티미터 정도 된다. 멍청하고 느릿해 보인다.
  verdict: awkward
  note: '''~한 눈을 가지고 있다''는 have를 직역한 번역투이다. 의미는 맞다.'
  fix: 이 기이한 동물의 눈은 어둠 속에서 보기 알맞게 생긴 듯하다. 털 없는 꼬리까지 합쳐 길이가 60센티미터쯤 된다. 멍청하고 굼떠 보인다.
- id: tba:100:obj:10007
  field: extras.0.text
  en: These pants are filthy. They look like they have not been washed in years. Besides the filth and smell they are in relatively
    good shape.
  ko: 이 바지는 꼬질이다. 수년째 세탁하지 않은 것처럼 보인다. 더러움과 냄새를 제외하면 비교적 상태가 좋다.
  verdict: wrong
  note: '''꼬질이다''는 없는 말이다. ''상태가 좋다''보다는 ''멀쩡하다''가 바지에 더 자연스럽다.'
  fix: 이 바지는 몹시 더럽다. 몇 년째 빨지 않은 것 같다. 때와 냄새만 빼면 그런대로 멀쩡하다.
- id: tba:100:room:10031
  field: description
  en: As you walk along the edge of the lake you come to its outlet.  A small river blocks the way north.  Though small, the
    rivers current looks fast and strong. You doubt you could wade across without being swept downstream.
  ko: 호숫가를 따라 걷다 보니 물이 빠져나가는 출구에 도착한다. 작은 강이 북쪽 길을 가로막고 있다. 비록 작지만, 강물의 흐름은 빠르고 강해 보인다. 당신은 물살에 떠내려가지 않고는 헤엄쳐 건너기 어려울 것이라
    생각한다.
  verdict: wrong
  note: wade across는 '걸어서 건너다'인데 '헤엄쳐'로 오역했다. '물이 빠져나가는 출구'는 어색하고, 'the way north'는 '북쪽 길'이 아니라 '북쪽으로 가는 길'이다.
  fix: 호숫가를 따라 걷다 보니 호수 물이 흘러 나가는 어귀에 이른다. 작은 강이 북쪽으로 가는 길을 가로막고 있다. 작긴 해도 물살이 빠르고 거세 보인다. 걸어서 건너려 했다가는 하류로 떠내려갈 것만 같다.
- id: tba:100:room:10095
  field: description
  en: The walls of the city look to be made from huge blocks of granite-like rock. You couldn't imagine any human being able
    to lift such things.  The walls are definite eye sores, but they serve their purpose well.
  ko: 도시의 성벽은 거대한 화강암 같은 돌덩이로 만들어져 보인다. 그런 것을 들어 올릴 수 있는 인간은 상상조차 되지 않는다. 성벽은 분명 눈살을 찌푸리게 하지만, 그 역할을 훌륭히 수행하고 있다.
  verdict: awkward
  note: '''만들어져 보인다''는 비문에 가깝다. ''인간은 상상조차 되지 않는다''는 주술 호응이 맞지 않는다. eye sore는 ''흉물스럽다''가 더 정확하다.'
  fix: 도시의 성벽은 화강암 같은 거대한 돌덩이로 쌓은 듯하다. 그런 돌을 들어 올릴 수 있는 인간이 있으리라고는 상상하기 어렵다. 성벽은 분명 흉물스럽지만, 제 역할만큼은 훌륭히 해내고 있다.
