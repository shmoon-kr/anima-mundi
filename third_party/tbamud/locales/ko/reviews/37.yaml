- id: tba:37:room:3707
  field: extras.1.text
  en: The hole is about 3 feet high, and must've been dug out by big rats.  It's full of marks of teeth.
  ko: 구멍은 약 90센티미터 높이며, 큰 쥐들이 파낸 것이 틀림없다. 이빨 자국으로 가득 차 있다.
  verdict: awkward
  note: 의미는 맞지만 '약 90센티미터 높이며'는 번역투이다. '높이가 ~쯤 되며'가 자연스럽다. 마지막 문장은 주어 없이 '이빨 자국으로 가득 차 있다'라고 해서 무엇이 가득 찼는지 흐릿하다.
  fix: 구멍은 높이가 90센티미터쯤 되는데, 큰 쥐들이 파낸 것이 틀림없다. 구멍 안은 온통 이빨 자국투성이다.
