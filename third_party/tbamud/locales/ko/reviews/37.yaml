- id: tba:37:mob:3709
  field: description
  en: Having spent it's entire life in this cave, the fish has never used its eyes. Your torch' presence has made it blind.
  ko: 이 동굴에서 평생 살았던 탓에 이 물고기는 눈을 한 번도 사용하지 않았다. 당신의 횃불이 그 눈을 멀게 만들었다.
  verdict: awkward
  note: 뜻은 맞지만 '살았던 탓에', '사용하지 않았다'가 어색하다. '당신의 횃불이 그 눈을 멀게 만들었다'는 사역형을 그대로 옮긴 번역투이다.
  fix: 평생을 이 동굴에서 살아온 탓에 이 물고기는 눈을 한 번도 써 본 적이 없다. 당신의 횃불 빛에 그만 눈이 멀어 버렸다.
