- id: tba:37:room:3710
  field: description
  en: The pipe bends here, going south and west.  West you see a drainhole and around your ankles you feel the water flowing
    towards it.  The fungus on the walls are luminous, so you have every chance to study the dirty ceiling, the green slime,
    and the big rats.  From the west you hear the sounds of big creatures eating - or is it many small?
  ko: 파이프가 여기서 남쪽과 서쪽으로 굽어진다. 서쪽에는 배수구가 보이며, 발목 주변으로 물이 그쪽으로 흐르는 것을 느낄 수 있다. 벽에 자라는 곰팡이가 발광하므로 더러운 천장, 초록색 점액, 그리고 큰 쥐들을 자세히
    살펴볼 수 있다. 서쪽에서 큰 생물들이 먹는 소리가 들린다 - 아니면 작은 생물들이 많이?
  verdict: awkward
  note: 다른 항목에서는 pipe를 '배관'으로 옮겼는데 여기서만 '파이프'라고 해서 용어가 어긋난다. '~것을 느낄 수 있다', '발광하므로'는 딱딱한 표현이다. 마지막 문장의 '- 아니면 작은 생물들이 많이?'는
    문장이 끊긴 채 대시를 그대로 옮긴 번역투이다.
  fix: 배관이 여기서 남쪽과 서쪽으로 꺾인다. 서쪽에 배수구가 보이고, 발목께로 물이 그쪽을 향해 흘러가는 것이 느껴진다. 벽에 핀 곰팡이가 빛을 내고 있어서 더러운 천장과 초록색 점액, 큰 쥐들을 마음껏 살펴볼
    수 있다. 서쪽에서 커다란 생물들이 무언가를 먹는 소리가 들린다. 아니, 작은 것들이 여럿인 걸까?
