tba:150:room:15021:
  name: 하인 복도
  description: 당신은 동쪽으로 더 이어지는 복도에 서 있다. 북쪽과 서쪽에는 문이 있다. 이 복도는 주로 하인들이 사용하며, 성의 다른 부분들만큼 아름다움이 부족하다.
  exits:
    north:
      look: 거기에 문이 있다!
    east:
      look: 복도는 동쪽으로 조금 더 가면 끝나는 듯하다.
    west:
      look: 서쪽의 문은 나무로 만들어져 있다.

tba:150:room:15022:
  name: 하인 복도의 끝
  description: 복도는 여기서 서쪽으로만 이어지지만, 북쪽에는 문이 있다.
  exits:
    north:
      look: 문은 집사용 방으로 이어진다.
    west:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15023:
  name: 훈련장
  description: >-
    여기는 성 경비대원들의 훈련장이다. 매우 넓으며, 모든 벽에 무기들이 선반에 세워져 있다. 대부분의 무기는 훈련용으로만 사용될 것 같은 둔탁한 날을 가지고 있지만, 실제 전투에
    유용할 수도 있는 것들도 몇 있다. 북쪽에는 문이 있다.
  exits:
    north:
      look: 문은 크고 무겁다.
    east:
      look: 작은 통로가 보인다.

tba:150:room:15024:
  name: 작은 통로
  description: 당신은 북쪽과 남쪽으로 이어지는 작은 통로에 서 있다. 서쪽으로도 출구가 있는데, 그곳에서 신음소리와 환호성, 그리고 무거운 타격음이 들린다.
  exits:
    north:
      look: 통로는 북쪽으로 이어져 계단으로 나간다.
    south:
      look: 통로가 계속 이어지는 모습이 보인다.
    west:
      look: 훈련실이 보인다.

tba:150:room:15025:
  name: 계단실
  description: >-
    당신은 성의 2층으로 이어지는 웅장한 계단 아래에 서 있다. 계단은 대리석으로 만들어졌으며, 기둥에는 나무 모양이 조각되어 있고, 그 줄기를 오르내리는 작은 동물들의 형상이 새겨져
    있다.
  exits:
    south:
      look: 통로가 보인다.
    up:
      look: 계단은 2층으로 이어진다.
  extras:
  - text: 대리석으로 만들어졌으며, 성의 나머지 부분과 마찬가지로 아름다움을 위해, 그리고 뛰어난 기술로 주로 만들어졌다.
  - text: 정말 아름답다. 여기저기 다람쥐와 작은 새들이 보인다.

tba:150:room:15026:
  name: 하인 숙소
  description: 당신은 많은 하인들이 머무는 것 같은 넓은 방에 서 있다. 방 안에는 편안한 모습의 침대들이 가득하다. 또한 하인들의 짐일 가능성이 큰 큰 상자가 하나 있다.
  exits:
    south:
      look: 문은 나무로 만들어졌다.
  extras:
  - text: 이곳이 그저 하인들의 공간이라는 점을 고려하면, 침대들은 모두 꽤 편안해 보인다.

tba:150:room:15027:
  name: 집사 숙소
  description: >-
    당신은 이것이 집사의 방임을 단번에 알아챈다. 하인 구역에 위치해 있으면서도 넓고 편안하며, 사실 거의 호화롭기까지 하니까. 방 안에는 큰 침대와 서랍장이 하나 있다. 유일한
    출구는 남쪽의 문이다.
  exits:
    south:
      look: 복도가 보인다.
  extras:
  - text: 정말 매우 편안해 보인다.

tba:150:room:15028:
  name: 경비대 막사
  description: >-
    당신은 온통 이층침대로 가득한 매우 넓은 방에 서 있다. 여기가 퇴근한 경비대원들이 대부분 시간을 보내는 곳임이 분명하다. 술을 마시고 도박을 하거나, 아마도 대부분은 잠을 자고
    있을 것이다.
  exits:
    south:
      look: 문은 크고 무겁다.
  extras:
  - text: 조금 단단해 보이지만, 그 위에 잘 수 있을 것 같다.

tba:150:room:15029:
  name: 계단
  description: >-
    당신은 아래로 내려가는 계단 옆에 서 있다. 아래를 내려다보니, 성에 들어온 이래 처음으로 미적으로 꾸며진 것이 아니라는 것을 알아차린다. 대신 더 기능적이고 감옥 같은 분위기가
    난다.
  exits:
    south:
      look: 작은 통로가 보인다.
    down:
      look: 아래로 내려가는 계단은 어둠 속으로 이어진다.
  extras:
  - text: 화강암으로 된 것 같으며, 당신이 온 곳보다 더 어둑한 곳으로 이어져 내려간다.

tba:150:room:15030:
  name: 복도 구부러진 곳
  description: 당신은 복도가 동쪽에서 북쪽으로 꺾이는 곳에 서 있다.
  exits:
    north:
      look: 복도가 이어지는 것이 보인다.
    east:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15031:
  name: 복도
  description: 당신은 긴 복도에 서 있다. 옛 시절과 옛 영웅들을 묘사한 태피스트리로 장식되어 있다. 동쪽과 서쪽으로 이어진다.
  exits:
    east:
      look: 복도가 이어지는 것이 보인다.
    west:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15032:
  name: 복도
  description: 당신은 긴 복도에 서 있다. 옛 시절과 옛 영웅들을 묘사한 태피스트리로 장식되어 있다. 동쪽과 서쪽으로 이어진다.
  exits:
    east:
      look: 복도가 이어지는 것이 보인다.
    west:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15033:
  name: 복도
  description: 당신은 오래된 시대와 영웅들을 묘사한 태피스트리로 장식된 긴 복도에 서 있다. 복도는 서쪽으로 이어지며, 북쪽으로는 호화로운 게스트 윙이 보인다.
  exits:
