tba:150:room:15050:
  name: 아늑한 방
  description: >-
    당신은 넓고 아늑한 거실로 들어왔다. 벽난로에 불이 타오르고 있고, 작은 테이블 주위에 몇 개의 편안한 의자가 놓여 있다. 서쪽에는 문이 있고, 동쪽으로도 나가는 통로가 있다.
  exits:
    east:
      look: 큰 침실이 보인다.
    west:
      look: 문은 크며, 오크로 만들어졌다.
  extras:
  - text: 불은 장작으로 피워졌으며, 꽤 오래 더 타는 것 같다.
  - text: 테이블은 마호가니로 만들어졌으며, 아늑한 방식으로 우아하다(!  )
  - text: 의자들은 벽난로 주위에 배치되어 있다.

tba:150:room:15051:
  name: 웰마르 왕의 침실
  description: >-
    여기는 멋진 전망을 가진 넓은 방이다. 방 한쪽에는 큰 4단 침대가 서 있다. 방 전체를 따라 거대한 책장이 놓여 있으며, 온갖 종류의 책으로 가득 차 있다. 책 제목에는 '미드가르드
    및 주변 지역의 역사에 관한 논문', '마법 - 입문자를 위한 소개' 등이 포함되어 있다. 서쪽으로 나가는 통로가 있다.
  exits:
    west:
      look: 서쪽에는 크고 아늑한 방이 있다.
  extras:
  - text: 대부분의 책이 낡아 보인다. 마치 꼼꼼히 연구한 것처럼 말이다. 왕은 분명 자기 자신을 교육하는 데 관심이 있는 것 같다.
  - text: 잠을 자기에는 꽤 괜찮아 보이지만, 왕의 침상이기 때문에 감히 자지 못할 것이다!
  - text: 지루한 지식으로 가득한 건조한 책이다.
  - text: 입문자? 이 책은 당신이 마법에 대해 아는 것의 대부분을 뛰어넘는다. 하지만 마법 지식에도 수준이 있는 것 같다.

tba:150:room:15052:
  name: 탑 위쪽
  description: >-
    긴 등반 끝에 마침내 탑 꼭대기에 도착했다. 이 방은 작고, 유일한 빛의 원천은 방 한가운데 어지럽게 물건이 놓인 테이블 위를 깜빡이는 촛불이다. 눈에 띄는 출구는 계단으로 내려가는
    길뿐이다.
  exits:
    down:
      look: 계단은 탑 아래로 내려간다.
  extras:
  - text: 책상 위에는 온갖 물건들이 놓여 있는데, 모두 매우 기이해 보인다.
  - text: 작고, 지루할 뿐이다...  아주 평범한 촛불이다.

tba:150:room:15053:
  name: 탑 꼭대기
  description: >-
    당신은 탑 꼭대기에 도착했다. 이 탑은 꽤 지루해 보이며, 순수하게 방어와 경비를 위해 지어진 것 같다. 창문은 궁수용의 좁은 틈으로, 바깥쪽은 매우 좁고 안쪽은 넓게 되어 있어
    넓은 사격 각도를 확보할 수 있다. 명백한 출구는 계단을 다시 내려가는 것뿐이다.
  exits:
    down:
      look: 계단은 2층으로 내려간다.
  extras:
  - text: 창밖을 내다보니 시골 풍경이 눈에 들어온다.

tba:150:room:15054:
  name: 탑 꼭대기
  description: >-
    여기는 모든 탑 중 가장 높은 곳이며, 분명 망루 용도로 사용되고 있다. 사방으로 경치가 훌륭하다. 당신을 둘러싸고 풍요로운 시골 풍경이 지평선까지 펼쳐져 있다. 북쪽과 동쪽으로는
    광활한 산맥이 보이며, 서쪽 멀리에는 아름다운 호수가 있다. 조금 더 가까운 곳, 미드가르드 마을은 왕의 길 끝자락에 자리 잡고 있다. 볼 수 있는 유일한 출구는 다시 아래로
    내려가는 계단이다.
  exits:
    north:
      look: >-
        북쪽으로는 높은 백산(White Mountains)의 가장 높은 봉우리들이 솟아 있다. 산봉우리는 평원 위에 높이 떠 있는 흰 구름 속에 사라져 버린다. 그 높고 먼 산들의
        모습은 당신에게 그들을 오르고, 그 높은 곳에서 세상을 보고 싶은 욕구를 불러일으킨다.
    east:
      look: >-
        동쪽으로는 이 대륙을 지배하는 산맥인 백산(White Mountains)의 한 지맥이 보인다. 북쪽의 산들만큼 높지는 않지만, 그 산들의 모습은 당신에게 경외감을 불러일으킨다.
    south:
      look: 남쪽으로는 끝없이 이어지는 구릉지가 당신의 시야 끝까지 펼쳐져 있다.
    west:
      look: 서쪽을 바라보니, 미드가르드 전체를 관통하여 그 너머의 큰 호수 쪽으로 흐르는 강이 보인다. 더 멀리서, 바다일 수밖에 없는 은빛 무언가가 희미하게 보인다.
    down:
      look: 2층으로 내려가는 계단이 보인다.

tba:150:room:15055:
  name: 계단 아래쪽
  description:
  - >-
    계단은 성의 습한 구역으로 내려간다. 당신 주변 어딘가에서 물이 뚝뚝 떨어지는 소리가 들린다. 이 계단이 붙어 있는 방은 벽에 꽂힌 횃불 하나만이 깜빡이며 비추고 있다.
  - 계단은 위로 올라가며 동쪽의 꽤 작은 방으로 이어진다.
  exits:
    east:
      look: 동쪽으로 작은 방이 열려 있다.
    up:
      look: 계단은 이 습하고 어두운 곳에서 위로 올라간다.

tba:150:room:15056:
  name: 경비실
  description:
  - >-
    당신은 누군가가 이곳에서 하루 종일을 보내고 싶어 하는 이유를 설명할 수 없다. 당신에게 유일하게 그럴듯하게 보이는 설명은, 남쪽 문 너머의 감방 중 하나에 중요한 죄수가 갇혀
    있을 수밖에 없다는 것이다.
  - 방의 장식은 간소하여, 테이블과 의자, 그리고 카드 한 묶음뿐이다. 서쪽 벽에 계단이 만들어져 있고, 위쪽으로 이어진다.
  exits:
    south:
      look: 작은 나무 문 꼭대기의 구멍을 통해, 여러 감방을 지나가는 좁은 복도가 보인다.
    west:
      look: 방의 서쪽 벽에 만들어진 작은 계단이 위쪽으로 이어진다.
  extras:
  - text: 테이블 위에 카드 한 묶음이 작은 더미로 놓여 있다. 하지만 바닥에는 카드 한 장이 떨어져 있다.
  - text: 바닥에 있는 카드는 스페이드 에이스인 것 같다... 정말 불길한 카드다. 이 발견으로 인해 어떤 불운이 닥칠지 누가 알겠는가?

tba:150:room:15057:
  name: 감옥
  description:
  - >-
    이 작은 통로는 약 9미터 길이며, 양쪽 벽에 달린 횃불 덕분에 밝다. 횃불은 제거되지 않도록 작은 금속 철창 우리 안에 잠겨 있다. 그러나 횃불의 가장 기이한 점은 타는 방식이다.
    불꽃이 전혀 깜박이지 않고, 연기도 전혀 나지 않는 것처럼 보인다. 아마도 영원히 타도록 마법이 걸린 것이리라...
  - >-
    이 통로에는 세 개의 감방이 있다. 북쪽 끝 근처 통로 양쪽에 하나씩 있고, 남쪽 끝에는 고립된 감방 하나가 있다. 이 감방 문 위 아치문의 키스톤에는 작은 금속 명판이 붙어
    있다.
  exits:
    north:
      look: 작은 나무 문이 감옥 밖으로 나가는 길을 막고 있다.
    east:
      look: 동쪽 벽에 감방 문이 설치되어 있다.
    south:
      look: 남쪽의 감방 문은 이중으로 자물쇠가 걸려 있으며, 문 위 아치형 문틀의 키스톤 부분에 명판이 놓여 있다.
    west:
      look: 서쪽 벽에 감방 문이 하나 나 있다.
  extras:
  - text: '키스톤의 명판에는 네 개의 단순한 단어가 새겨져 있다: 에르간, 타운스브리지의 살인자'

tba:150:room:15058:
  name: 감방
  description: 이 감방은 엉망진창이다. 서쪽 벽에는 무언가가 돌을 뚫고 감방 안으로 들어온 작은 구멍이 있다. 동쪽 벽에는 감방 문이 있다.
  exits:
    east:
      look: 동쪽의 감방 문은 감옥 복도로 돌아간다.
  extras:
  - text: 구멍이 너무 작아 기어갈 수 없다.

tba:150:room:15059:
  name: 에르간의 감방
  description: >-
    이 큰 감방은 거의 주거 공간과 같아서, 한 구석에는 이불이 깔린 간이 침대가 있고, 다른 구석에는 벽에서 나온 작은 테이블이 있다. 바닥 중앙에는 온기를 유지하기 위한 카펫까지
    깔려 있다. 이곳에 갇힌 죄수는 꽤 잘 대우받는 것 같고, 한 마을 전체를 학살한 살인자에게는 거의 지나칠 정도로 잘 대우받고 있다...
  exits:
    north:
      look: 북쪽의 감방 문은 감옥 복도로 돌아간다.

tba:150:room:15060:
  name: 감방
  description: 이 작은 감방은 습하고 어둡다. 꽤 오랜 시간 동안 아무도, 아무것도 여기에서 살지 않은 것처럼 보인다. 서쪽 벽에 작은 감방 문이 하나 있다.
  exits:
    west:
      look: 서쪽의 감방 문은 감옥 복도로 돌아간다.

tba:150:room:15061:
  name: 잡초가 무성한 오솔길
  description:
  - >-
    왕의 길에서 벗어나자, 거의 완전히 버려져서 여기 숲의 식물들에 의해 뒤덮여 버린 희미한 작은 오솔길 위에 서 있다. 사방에서 숲의 소리가 들리고, 인류가 이 길을 지나다니지
    않은 지 오래되었음을 깨닫자 평온한 기분이 밀려온다.
  - 희미한 오솔길은 북쪽과 남쪽으로 이어지는 듯하다.
  exits:
    north:
      look: 북쪽에서 왕의 길 위를 오가는 소리가 들린다.
    south:
      look: 오솔길은 남쪽으로 이어진다.

tba:150:room:15062:
  name: 잡초가 무성한 오솔길
  description:
  - >-
    무성한 덤불을 헤치고 나아가자, 당신은 숲 한가운데에 서 있다. 사방에서 숲의 소리가 들리고, 인류가 꽤 오랫동안 이 길을 지나가지 않았다는 사실을 깨닫자 평온한 기분이 당신을
    감싼다.
  - 당신이 서 있는 희미한 오솔길은 거의 사용되지 않아 이곳 숲의 식물에 거의 완전히 덮여 버린 것으로 보인다.
  - 희미한 오솔길은 북쪽과 동쪽으로 이어지는 것으로 보인다.
  exits:
    north:
      look: 오솔길은 북쪽으로 이어진다.
    east:
      look: 오솔길은 동쪽으로 이어지는 것으로 보인다.

tba:150:room:15063:
  name: 잡초가 무성한 오솔길
  description:
  - >-
    무성한 덤불을 헤치고 나아가자, 당신은 숲 한가운데에 서 있다. 사방에서 숲의 소리가 들리고, 인류가 꽤 오랫동안 이 길을 지나가지 않았다는 사실을 깨닫자 평온한 기분이 당신을
    감싼다.
  - 당신이 서 있는 희미한 오솔길은 거의 사용되지 않아 이곳 숲의 식물에 거의 완전히 덮여 버린 것으로 보인다.
  - >-
    희미한 오솔길은 서쪽과 남쪽으로 이어지는 것으로 보인다. 남쪽으로는 기이하고 섬뜩한 정적이 공기에 감돌아, 북쪽과 동쪽에서 들리는 모든 소리를 거의 차단하고 있는 듯하다.
  exits:
    south:
      look: 남쪽으로 가면서 덤불이 열리고, 남쪽에 작은 마을이 있는 것으로 보인다. 매우 조용하다. 거의 지나치게 조용하다.
    west:
      look: 잡초가 무성한 오솔길은 북서쪽으로 이어진다.

tba:150:room:15064:
  name: 흙길
  description: >-
    북쪽의 숲을 벗어나자, 흙길과 작은 마을의 시작점으로 보이는 곳에 서 있게 된다. 처음 이 곳을 보자마자, 이 정착지에 뭔가 이상한 점이 있다는 것을 깨닫는다... 여기서는 바람이
    부는 소리 외에는 아무런 소리가 들리지 않는다. 사람들이 일상적인 일상을 보내며 떠드는 소리를 기대했지만, 마을은 고요하다. 마을 주변으로 움직임도 보이지 않는다. 마치 북쪽의
    숲처럼 고요하고 조용하다. 여기 길가에는 작은 표지판이 놓여 있다.
  exits:
    north:
      look: 북쪽의 짙은 덤불로 이어지는 오솔길이 있다.
    south:
      look: 흙길은 마을을 지나 남쪽으로 이어진다.
    west:
      look: 길의 서쪽에서 조금 떨어진 곳에 집 한 채가 서 있고, 그 문은 살짝 열려 있다.

tba:150:room:15065:
  name: 작은 갈림길
  description:
  - >-
    흙길을 따라 계속 나아가다 보니, 큰길에서 작은 오솔길이 갈라져 서쪽으로 이어지는 곳에 서 있다. 마을 주변의 숲이 마치 마을이 퍼지면 안 되는 비밀을 숨기고 있는 것처럼 당신
    쪽으로 파고드는 듯하다.
  - 길의 동쪽에는 또 다른 집이 서 있다.
  exits:
    north:
      look: 흙길은 북쪽으로 이어진다.
    east:
      look: 동쪽의 집에서 비명 소리가 들린다.
    south:
      look: 흙길은 남쪽으로 이어지며, 그곳에서 끔찍한 냄새가 공기 중에 퍼져 나온다.
    west:
      look: 작고 어두운 오솔길이 서쪽 숲속으로 이어진다.

tba:150:room:15066:
  name: 흙길
  description:
  - >-
    이 구간의 흙길은 고요하지만, 공기 중에 끔찍한 악취가 난다. 썩어가는 시체와 원시 하수구를 떠올리게 한다. 숲은 여전히 당신을 밀착해 둘러싸고 있으며, 서쪽의 초가집을 거의
    완전히 감싼다. 동쪽에는 소각된 껍데기 같은 건물이 있고, 그 앞에는 검고 탄 사슬에 작은 표지판이 걸려 있다.
  - 흙길은 북쪽과 남쪽으로 이어진다.
  exits:
    north:
      look: 작은 흙길은 북쪽으로 이어진다.
    east:
      look: 동쪽의 건물은 과거에 어떤 모습이었던 것일까 짐작할 수 있는 껍데기일 뿐이다. 벽은 과거 어딘가에서 불에 노출되었던 것처럼 검게 그을려 있다...
    south:
      look: 남쪽에서 오는 악취는 이제 거의 견딜 수 없을 정도이다... 그 원인은 여기서 멀지 않은 것 같다.
    west:
      look: 길의 서쪽에 작은 고요한 오두막이 서 있고, 이 작은 마을에 닥친 것으로 보이는 훼손과 파괴에는 영향을 받지 않은 듯하다.

tba:150:room:15067:
  name: 큰 웅덩이
  description:
  - >-
    흙길은 여기에서 큰 웅덩이의 가장자리에 이르고, 이제 끔찍한 냄새가 어디서 왔는지를 깨닫게 된다. 이 웅덩이는 마을 주민들의 집단 무덤으로 보인다. 뼈와 시체가 여기저기 흩어져
    있다. 많은 시체들은 거의 10년 전의 타운스브리지 살인 사건에서 온 것이라기에는 너무 최근처럼 보이지만, 마을은 거의 그 정도 동안 비어 있는 것처럼 보인다.
  - 흙길은 참혹한 현장을 떠나 북쪽으로 이어진다.
  exits:
    north:
      look: 구덩이의 북쪽 가장자리 근처에서 작고 좁은 오솔길이 뻗어 나간다.

tba:150:room:15068:
  name: 집
  description:
  - >-
    이 집은 폐허가 되어 있다. 가구가 방 안 여기저기 흩어져 있고, 마치 토네이도가 방 한가운데에 내려앉은 것 같다. 이 방에서 일어난 파괴의 정도는 믿기 어려울 정도다. 하지만
    가장 기이한 점은, 거미줄도 없고 아무것도 먼지가 묻어 있지 않아 모든 것이 아주 최근에 일어난 것처럼 보인다는 것이다.
  - 동쪽 문구멍을 통해 흙길이 보인다.
  exits:
    east:
      look: 동쪽 문구멍을 통해 흙길이 보인다.

tba:150:room:15069:
  name: 집
  description:
  - >-
    이 어두운 방은 바깥 빛에 겨우 비추어진다. 하지만 보이는 것만으로도 소름이 돋는다. 모든 곳에서 거미줄이 드리워져 있고, 당신이 지나가자 두꺼운 먼지 층이 올라온다. 어딘가에서
    이상한 울음소리가 들린다. 이 집의 가구는 오래되었고, 이 땅에서 꽤 오랫동안 보기 힘든 종류다. 상태가 더 좋았다면 골동품으로 팔 수도 있었을 것이다.
  - 서쪽 문구멍을 통해 길의 초라한 빛이 비친다.
  exits:
    west:
      look: 서쪽 문구멍을 통해 흙길이 보인다.

tba:150:room:15070:
  name: 작은 오두막
  description:
  - >-
    이 오두막은 꽤 오래전과 똑같은 모습으로 방치되어 있는 것처럼 보인다. 마치 거주자들이 어느 날 떠난 뒤 아직 돌아오지 않은 것 같다. 이상하게도 가구는 먼지가 없고, 테이블
    위의 음식은 여전히 신선해 보인다. 이 집은 정말 기이하다. 아마도 가능한 한 빨리 떠나는 것이 당신에게 최선일 것이다.
  - 동쪽 열린 문구멍을 통해 길이 다시 이어진다.
  exits:
    east:
      look: 동쪽 문구멍을 통해 흙길이 보인다.

tba:150:room:15071:
  name: 불탄 가게
  description:
  - >-
    이 작은 건물 안으로 들어서자, 검게 그을린 벽들이 꽤 오랫동안 방치된 불로 인해 그런 것임을 알게 된다. 한때 이 건물을 덮고 있었을 지붕은 거의 남아 있지 않으며, 북쪽과
    동쪽 벽은 다른 두 벽 높이의 절반 정도로 타 버렸다. 바닥 여기저기에 탄 물건들이 있고, 북쪽 벽 잔해 근처에 있는 카운터의 잔해는 이곳이 한때 가게였음을 시사한다.
  - 검게 그을린 벽 너머로 서쪽에 길이 있다.
  exits:
    west:
      look: 서쪽에 흙길이 보인다.

tba:150:room:15072:
  name: 어두운 길
  description:
  - >-
    당신은 맑은 공기를 뒤로하고 어두운 길과 그 주위 불길해 보이는 숲 안으로 들어간다. 경외감과 거의 공포에 가까운 무언가가 당신을 엄습한다. 주위의 숲은 완전히 고요하다. 나뭇잎이
    사각거리는 소리나 가지가 부러지는 소리조차 그 정적을 깨지 못한다. 당신이 마지막으로 알아차리는 것은, 당신을 둘러싼 어둠이 마치 의도적으로 만들어낸 것처럼 보이며, 이런 종류의
    식생에는 자연스럽지 않다는 것이다.
  - 길은 서쪽으로 이어지고, 동쪽으로는 빛이 보인다.
  exits:
    east:
      look: 길은 작은 갈림길과 흙길이 만나는 곳으로 이어진다.
    west:
      look: 길은 어둠 속으로 이어진다.

tba:150:room:15073:
  name: 어두운 길
  description:
  - >-
    이 좁은 길은 비정상적인 어둠 속에서 가지가 머리 위로 덮친 나무들 사이로 뻗어 있다. 마치 나무들이 당신의 존재를 느끼기 싫어하는 것처럼, 당신을 향해 몰려오는 듯하다. 숲은
    거의 완전히 고요하고, 당신은 이것이 왜 그런지 스스로에게 조용히 자문해 본다.
  - 길은 동쪽과 서쪽으로 이어지는 것으로 보인다.
  exits:
    east:
      look: 길은 어둠 속으로 이어진다.
    west:
      look: 서쪽에서 오는 빛은 꽤 강해 보이지만, 여기서 볼 수 있을 만큼의 밝기는 아니며, 빛의 원천도 볼 수 없다.

tba:150:room:15074:
  name: 돌의 원
  description:
  - >-
    당신은 일곱 개의 거대한 돌기둥 모양의 돌로 이루어진 원의 가장자리에 서 있다. 각 돌은 당신의 머리 위로 솟아 있으며, 당신의 키의 최소 두 배는 되어 보인다. 돌들은 어두운
    검은 물질로 만들어져 있으며, 거의 검은색에 가깝다.
  - >-
    돌 원의 중앙에는 바닥에 검은색 원형 거울 같은 원반이 놓여 있다. 표면은 매우 반사력이 강하며, 마치 물결치는 것처럼 보인다. 원을 둘러싼 나무들은 당신의 머리 위로 훨씬 높이
    솟아 하늘을 가리고 있다.
  - 각 돌에서 이상한 빛이 발산되는 것 같으며, 거의 초록색에 가깝다. 이 빛은 위쪽 하늘이 가려져 있음에도 당신이 볼 수 있을 만큼 충분한 밝기를 제공한다.
  exits:
    east:
      look: 좁은 길이 어둠 속으로 이어져 나간다.
    up:
      look: 돌 원 주위의 나무들이 하늘을 완전히 가리고 있어 위쪽 하늘을 볼 수 없다.
  extras:
  - text: 각 돌은 최소 약 4.5미터, 어쩌면 더 높으며, 어두운 물질에서 초록빛 오라가 발산되어 당신이 볼 수 있을 만큼 충분한 밝기를 제공한다.

tba:150:mob:15000:
  short: 그위디온
  long: 그위디온 왕실 근위대원이 여기 근무 중이다.
  description: 근위대의 모든 구성원처럼, 그위디온은 제복으로 요구되는 체인 메일을 착용하고 있다. 그는 매우 잘 훈련된 것으로 보이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15001:
  short: 웰마르 왕
  long: 지혜로운 웰마르 왕이 여기 왕좌에 앉아 있다.
  description: >-
    중년의 나이에 수염이 하얗게 변기 시작했지만, 웰마르 왕은 여전히 거구의 체격을 지니고 있어 공격을 쉽게 받아들이지 않을 것이다. 그럼에도 불구하고, 당신은 그가 온 나라에서
    사랑받고 있으며, 지혜롭고 공정한 통치자라는 명성을 가지고 있다는 것을 알고 있다.

tba:150:mob:15002:
  short: 끔찍한 유령
  long: 두려움을 주는 비명을 듣고, 끔찍한 유령이 다가오는 것을 본다.
  description: 유령은 거의 투명하며, 정말로 무섭게 보인다!

tba:150:mob:15003:
  short: 짐
  long: 왕실 근위대 짐이 여기 근무 중이다.
  description: 근위대원 모두처럼, 짐은 제복으로 규정된 체인 메일을 착용하고 있다. 그는 매우 잘 훈련된 것으로 보이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15004:
  short: 브라이언
  long: 왕실 근위대 브라이언이 여기 대장에게 훈련을 받고 있다.
  description: 모든 근위대원이 그렇듯, 브라이언도 제복으로 정해진 체인 메일을 입고 있다. 그는 매우 잘 훈련된 듯하며, 노련한 전사처럼 움직인다.

tba:150:mob:15005:
  short: 미크
  long: 왕실 경비대 미크가 여기 있다. 마스터와 함께 훈련 중이다.
  description: 경비대원 모두처럼, 미크도 제복으로 지정된 체인 메일을 입고 있다. 그는 매우 숙련된 모습이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15006:
  short: 매트
  long: 왕실 경비대 매트가 여기 있다. 근무 중이다.
  description: 경비대원 모두처럼, 매트도 제복으로 지정된 체인 메일을 입고 있다. 그는 매우 숙련된 모습이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15007:
  short: 요헴
  long: 왕실 경비대 요헴이 여기 앉아 있다. 휴무 중이다.
  description: >-
    모든 근위대원이 그렇듯, 요헴도 제복으로 정해진 체인 메일을 입고 있다. 그는 매우 잘 훈련된 듯하며, 여러 차례 전투를 겪고도 다음 전투를 갈망하는 전사처럼 움직인다!

tba:150:mob:15008:
  short: 앤
  long: 왕실 경비대 앤이 여기 있다. 근무 중이다.
  description: >-
    경비대원 모두처럼, 앤도 제복으로 지정된 체인 메일을 입고 있다. 그녀는 매우 숙련된 모습이며, 한두 번의 전투를 겪은 전사처럼 움직인다. 그리고 다음 전투를 갈망하고 있다!

tba:150:mob:15009:
  short: 앤드류
  long: 앤드류 왕실 근위대가 여기 근무 중이다.
  description: >-
    근위대원 모두처럼 앤드류도 제복으로 지정된 사슬 갑옷을 입고 있다. 그는 매우 잘 훈련된 모습이며, 한두 번의 전투를 겪어본 전사가처럼 움직인다. 그리고 다음 전투를 갈망하는
    눈치다!

tba:150:mob:15010:
  short: 베르трам
  long: 베르трам 왕실 근위대가 여기 근무 중이다.
  description: >-
    근위대원 모두처럼 베르траm도 제복으로 지정된 사슬 갑옷을 입고 있다. 그는 매우 잘 훈련된 모습이며, 자신의 흉터를 자랑스럽게 드러내고 있다. 이 남자는 꽤 단단해 보인다...

tba:150:mob:15011:
  short: 자네트
  long: 근위대 자네트가 근무 중입니다.
  description: >-
    모든 근위대원이 그렇듯, 자네트도 제복으로 요구되는 체인 메일을 입고 있다. 그녀는 매우 잘 훈련된 모습이며, 자신의 흉터를 자랑스럽게 드러내고 있다. 원한다면 이 소녀는 꽤
    무서운 상대가 될 수 있을 것이다...

tba:150:mob:15012:
  short: 피터, 왕실 근위대 대장
  long: 왕실 근위대 대장 피터가 순찰을 돌며 점검하고 있다.
  description: >-
    다른 근위대원들과 마찬가지로 피터도 제복으로 정해진 사슬 갑옷을 입고 있다. 다른 근위대원들이 모두 잘 훈련된 것처럼 보이지만, 당신은 이 남자와 싸운다면 그 누구도 승산이 없다는
    사실을 깨닫는다. 그는 최소 2미터는 되어 보이는 키임에도 불구하고, 거의 고양이처럼 우아하게 움직인다. 그는 실제로 힘과 자신감을 뿜어내고 있어, 그를 보는 순간 차렷 자세를
    취하고 싶은 충동에 억지로 저항해야만 한다.

tba:150:mob:15013:
  short: 훈련장 사범
  long: 훈련장 사범이 여기 서서 감독하고 있다.
  description: 나이는 들었지만 경험이 풍부하여, 훈련장 사범은 인간이 발명한 거의 모든 종류의 무기를 다루는 데 능숙하다.

tba:150:mob:15014:
  short: 왕실 전령
  long: 왕실 전령이 여기 서 있다.
  description: 젊고 체격이 좋은 이 남자의 주된 역할은 왕실 공고를 발표하는 것이다.

tba:150:mob:15015:
  short: 살인자 에르간
  long: 한 구석에 축 처져 있는 에르간, 즉 타운즈브릿지의 살인자가 보인다.
  description: >-
    거의 10년 전, 이 남자가 작은 마을인 타운즈브릿지의 주민들을 모두 학살했다는 소식이 하루의 뉴스가 되었던 때가 떠오른다. 그는 수감되었고, 여기 있다 - 분명히 위대했던 전사였을
    그 사람의 그림자일 뿐이지만, 여전히 경계해야 할 존재이다.

tba:150:mob:15016:
  short: 집사 제임스
  long: 집사 제임스가 여기 서 있으며, 거만해 보인다.
  description: '전형적인 완벽한 집사이다: 중년, 약간 대머리이며 인상 깊은 배를 가지고 있다.'

tba:150:mob:15017:
  short: 청소부
  long: 여기에는 청소부가 있는데, 눈에 띄지 않으려고 애쓰고 있다.
  description: 비천한 직업을 가졌음에도, 그녀는 그 일을 좋아하는 것 같다.

tba:150:mob:15018:
  short: 바퀴벌레
  long: 큰 바퀴벌레 한 마리가 벽을 기어 다닌다.
  description: 정말 매우 크다. 그리고 바퀴벌레는 죽이기 어렵다고들 한다...

tba:150:mob:15019:
  short: 점성술사
  long: 점성술사가 여기 앉아 책을 연구하고 있다.
  description: 그는 흰 머리에 긴 수염을 기른 노인이다. 그를 보니 별이 운명을 결정한다는 소문과, 점성술이 미래를 볼 수 있다는 말이 거의 사실처럼 느껴진다.

tba:150:mob:15020:
  short: 왕의 구조대원 팀
  long: 왕의 구조대원 팀이 여기 서 있다.
  description: 이 남자는 쌍둥이 형제인 톰과 똑같이 생겼다. 필요하면 왕을 위해 목숨을 바칠 준비가 완전히 되어 있다는 데 의심의 여지가 없어 보인다.

tba:150:mob:15021:
  short: 왕의 수비수 톰
  long: 왕의 수비수 톰이 여기 서 있다.
  description: 이 남자는 쌍둥이 형제 팀과 똑같이 생겼다. 필요하면 왕을 위해 목숨을 바칠 준비가 완전히 되어 있는 것 같다는 의심의 여지가 없다.

tba:150:mob:15022:
  short: 주방장
  long: 주방장이 여기 있다. 다른 요리사들에게 명령을 외치고 있다.
  description: 자기 음식 맛을 보는 데 좀 지나치게 열중했던 것 같다. 다시 말해, 좀 뚱뚱하다.

tba:150:mob:15023:
  short: 요리사
  long: 여기 요리사가 하나 있다. 냄비로 분주히 일하고 있다.
  description: 주방장의 지시를 따르기를 간절히 바라는 하급 요리사다.

tba:150:mob:15024:
  short: 데이비드
  long: 크고 사나워 보이는 남자 데이비드가 여기 서 있다. 문을 지키고 있다.
  description: 그는 정말 덩치가 크다. 그를 지나쳐 가려 하면 순순히 보고만 있지는 않을 것 같다.

tba:150:mob:15025:
  short: 딕
  long: 크고 사나워 보이는 남자 딕이 문을 지키고 서 있다.
  description: 정말 크다. 그를 지나가려는 시도를 좋게 받아들이지 않을 것 같은 느낌이 든다.

tba:150:mob:15026:
  short: 제리
  long: 근위대원 제리가 휴무 중이어서 주사위 놀이를 하고 있다.
  description: 근위대원 모두처럼 제리는 제복으로 지정된 사슬갑옷을 입고 있다. 그는 매우 잘 훈련된 것처럼 보이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15027:
  short: 마이클
  long: 근위대원 마이클이 휴무 중이어서 주사위 놀이를 하고 있다.
  description: 근위대원 모두처럼 마이클은 제복으로 지정된 사슬갑옷을 입고 있다. 그는 매우 잘 훈련된 것처럼 보이며, 경험 많은 전사처럼 움직인다.

tba:150:mob:15028:
  short: 한스
  long: 근위대원 한스가 근무 중 여기 있다.
  description: >-
    근위대원 모두처럼 한스는 제복으로 지정된 사슬갑옷을 입고 있다. 그는 매우 잘 훈련된 것처럼 보이며, 한두 번의 전투를 겪은 전사처럼 움직인다. 그리고 다음 전투를 갈망하는 눈치다!

tba:150:mob:15029:
  short: 보리스
  long: 왕실 근위대원 보리스가 근무 중으로 여기 있다.
  description: >-
    근위대원 모두처럼 보리스도 제복으로 요구되는 체인 메일을 착용하고 있다. 그는 매우 잘 훈련된 것처럼 보이며, 자신의 흉터를 자랑스럽게 드러내고 있다. 이 남자는 꽤 거칠어 보인다...

tba:150:mob:15030:
  short: 좀비
  long: 좀비가 여기 시체들을 밟고 지나가며 꽤 조용히 기어오고 있다.
  description: 이 좀비가 한때 복수의 욕망에 의해 언데드로 되살아난 타운스브리지 마을 주민 중 하나일 가능성이 충분히 있다.

tba:150:mob:15031:
  short: 해골
  long: 해골이 시체들을 기어오르며 여기에서 시끄러운 소리를 내며 움직이고 있다.
  description: 이 해골이 한때 복수의 욕망에 의해 언데드로 되살아난 타운스브리지 마을 주민 중 하나일 가능성이 충분히 있다.

tba:150:mob:15032:
  short: 핏 피엔드
  long: 불길에 둘러싸인 거대한 악마가 어두운 웅덩이에서 솟아오른다.
  description: >-
    이것은 심연의 깊은 곳에서 온 악마적 존재로, 끔찍한 모습이다. 그것은 피처럼 붉은 눈으로 당신을 내려다보며, 거대한 흰 송곳니와 칼날처럼 날카로운 발톱을 드러낸다.

tba:150:obj:15000:
  short: 사포폭스의 보편적 무
  long: 당신은 여기서 사포폭스의 보편적 무를 알아채기조차 어렵다.
  extras:
  - text: '그냥 이렇게 적혀 있다: '' (void *) '' 별로 깨달음을 주지는 않지 않나?'
  - text: >-
      확신은 없지만, 당신이 한 번도 본 적 없는 것과 닮지 않았기 때문에 그것이 무엇인지 알 수 없는 것 같지는 않다. 당신은 약간의 혼란을 느끼지만, 그것에 새겨진 작은 글귀를
      발견한다.

tba:150:obj:15001:
  short: 금
  long: 여기에 금이 많이 있다.

tba:150:obj:15002:
  short: 황금 지팡이
  long: 황금 왕실 지팡이가 바닥에 놓여 있다.

tba:150:obj:15003:
  short: 황금 왕관
  long: 화려하게 보석으로 장식된 황금 왕관이 여기 남겨져 있다.

tba:150:obj:15004:
  short: 황금 사과
  long: 여기에 황금 사과가 하나 있다.

tba:150:obj:15005:
  short: 큰 망원경
  long: 하늘을 향해 세워진 큰 망원경이 여기 있다.
  extras:
  - text:
    - '작은 표지판에 이렇게 적혀 있다:'
    - 시베리아산.

tba:150:obj:15006:
  short: 훈련용 검
  long: 날이 둔한 훈련용 검이 벽에 기대어 놓여 있다.

tba:150:obj:15007:
  short: 거대한 열쇠
  long: 여기 바닥에 무거워 보이는 거대한 열쇠가 놓여 있다.

tba:150:obj:15008:
  short: Verminator
  long: 이상해 보이는 검이 여기 바닥에 놓여 있다.
  extras:
  - text: 이 이상한 검은 검은 금속으로 만들어진 것으로 보이며, 칼날 주위에 섬뜩한 초록빛이 감돌고 있다.

tba:150:obj:15009:
  short: 집사님의 열쇠
  long: 집사님의 열쇠가 여기 있다.

tba:150:obj:15010:
  short: 작은 열쇠
  long: 작은 열쇠가 여기 놓여 있다.

tba:150:obj:15011:
  short: 큰 나무 상자
  long: 큰 나무 상자가 구석에 놓여 있다.
  extras:
  - text: 자기 자존심을 아는 도적이라면 누구나 열 수 있을 정도로 작은 자물쇠가 달려 있다.

tba:150:obj:15012:
  short: 큰 유리병
  long: 큰 유리병 하나가 여기 놓여 있다.
  extras:
  - text: 보기만 해도 역겨운 갈색 액체가 들어 있다.

tba:150:obj:15013:
  short: 왕실 기치
  long: 왕실 기치가 여기 땅에 단단히 꽂혀 있다.
  extras:
  - text: 기치에는 웰마르 왕가의 문장인, 두 다리로 선 사슴이 그려져 있다.
  - text: 크기가 크고 매우 무겁다. 그 위에는 웰마르 왕의 깃발이 자부심을 담아 펄럭이고 있다.

tba:150:obj:15014:
  short: 열쇠
  long: 열쇠 하나가 바닥에 놓여 있다.
  extras:
  - text: 정교하게 새겨진 글자 'W'가 새겨져 있다.

tba:150:obj:15015:
  short: 경호원의 사슬 갑옷
  long: 사슬 갑옷이 바닥에 놓여 있다.

tba:150:obj:15016:
  short: 큰 양손 검
  long: 여기에 큰 양손 검이 놓여 있다.

tba:150:obj:15017:
  short: 감옥 열쇠
  long: 열쇠 하나가 바닥에 놓여 있다.
  extras:
  - text: 이것은 성의 감옥에 쓰이는 열쇠로 보인다.

tba:150:obj:15018:
  short: 시체
  long: 여기 건물 바닥 한가운데에 시체가 놓여 있다.

tba:150:obj:15019:
  short: 맛있어 보이는 랍스터
  long: 맛있어 보이는 랍스터가 여기 놓여 있어 당신의 식욕을 자극한다.

tba:150:obj:15020:
  short: 러시아 캐비어
  long: 여기에 맛있어 보이는 러시아 캐비어가 있어 당신의 침샘을 자극한다.

tba:150:obj:15021:
  short: 서쪽에서 오는 빛
  long: 서쪽에서 이상한 빛이 흘러나온다.
  extras:
  - text: 서쪽에서 오는 빛은 꽤 강해 보이지만, 여기서 볼 수 있을 만큼의 밝기는 아니며, 빛의 원천도 볼 수 없다.

tba:150:obj:15022:
  short: 동쪽에서 오는 신음소리
  long: 동쪽의 집에서 섬뜩한 신음소리가 흘러나온다.
