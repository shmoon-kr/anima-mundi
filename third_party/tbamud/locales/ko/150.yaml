  exits:
    north:
      look: 문이 손님 방으로 이어지는 것 같다.
    east:
      look: 장식된 문 너머로 손님용 스위트룸이 보인다.
    south:
      look: 복도가 보인다.

tba:150:room:15039:
  name: 손님용 스위트룸
  description: >-
    여기는 가장 존경받는 손님들만 머무는 곳일 것이다. 상상할 수 없을 정도로 사치스럽기 때문이다. 이것은 스위트룸의 거실일 뿐이지만, 거대하고 취향에 맞게 꾸며져 있다. 모든 가구는
    아름답지만 편안함을 위해 만들어졌다. 북쪽에는 침실로 나가는 출구가 있고, 서쪽에는 문이 있다.
  exits:
    north:
      look: 침실이 보인다.
    west:
      look: 문 너머로 손님 동쪽의 입구가 보인다.

tba:150:room:15040:
  name: 복도
