    west:
      look: 복도가 보인다.

tba:150:room:15047:
  name: 무도회장
  description: 당신은 거대한 무도회장에 서 있다. 이 방은 정말로 넓으며, 동쪽 끝에는 오케스트라를 위한 무대가 마련되어 있다.
  exits:
    east:
      look: 동쪽으로는 탑으로 들어갈 수 있다.
    south:
      look: 남쪽으로는 무대가 보인다.
    west:
      look: 무도회장이 보인다.

tba:150:room:15048:
  name: 탑 안
  description: 당신은 성의 세 개 주요 감시탑 중 북동쪽 탑 안에 서 있다. 서쪽으로는 볼룸으로 들어갈 수 있고, 탑 위로 올라가는 계단이 있다.
  exits:
    west:
