      look: 복도가 이어지는 것이 보인다.
    east:
      look: 작은 방이 보인다.
    south:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15036:
  name: 보물창고 앞
  description: 당신은 거대한 철문 앞에 서 있다. 문은 매우 크고, 확실히 견고해 보인다. 문 옆에는 표지판이 붙어 있다.
  exits:
    east:
      look: 거대한 강철문이 보인다.
    west:
      look: 복도가 보인다.
  extras:
  - text:
    - 보물창고
    - 권한 있는 인원만 출입 가능 - 그 외의 모든 사람은 출입 금지. 무단 침입 시 엄중하게 처벌함!!

tba:150:room:15037:
  name: 대보물창고
  description: >-
    이 방에 들어서자 여기 쌓여 있는 부에 놀라움을 금치 못한다. 금보다는 그림, 태피스트리, 정교한 조각품과 조형물이 방대한 방 전체에 걸쳐 전시되어 있다. 그러나 당신은 깨닫는다.
    이 중 대부분은 어디서든 팔 수 있을 만큼 잘 알려진 것들이며, 도적이라는 낙인을 찍고 왕실 경비대에 의해 즉각적인 사형을 당하게 될 것이다.
  exits:
    west:
      look: 거대한 강철문이 보인다.
  extras:
  - text: 성 내부의 장식을 정기적으로 교체할 수 있도록 임시로 여기 보관하는 것 같다.

tba:150:room:15038:
