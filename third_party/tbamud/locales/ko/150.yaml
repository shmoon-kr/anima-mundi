      여신과 타로콘이라는 강력하고 악한 마법사와 같은 위대한 적들과 악당들도 함께 그려져 있다.

tba:150:room:15014:
  name: 통로
  description: 당신은 북쪽과 남쪽으로 이어지는 통로에 서 있다. 남쪽으로는 탑 중 하나 쪽으로 이어진다.
  exits:
    north:
      look: 작은 통로가 계속 이어져 보인다.

tba:150:room:15015:
  name: 통로
  description: 당신은 북쪽과 남쪽으로 이어지는 통로에 있다. 동쪽으로는 대연회장으로 통하는 출구가 있다.
  exits:
    north:
      look: 통로가 계속 이어지는 것이 보인다.
    east:
      look: 왕의 대연회장이 보인다.
    south:
      look: 통로가 계속 이어지는 것이 보인다.

tba:150:room:15016:
  name: 대연회장
  description: >-
    당신은 대연회장의 북서쪽 끝에 서 있다. 이곳은 정말로 광활하다. 지붕이 머리 위를 이렇게 높이 덮고 있어, 바깥 구름보다 더 멀게 느껴진다. 지붕은 진정한 대가라고 할 수 있는
    누군가가 아름답게 채색해 놓았다. 홀은 매우 넓어, 수백 명이 연회에 참석해도 쉽게 앉을 수 있을 정도이다. 동쪽으로는 웰마르 왕의 위대한 왕좌가 보이고, 서쪽으로는 통로로 나가는
    출구가 있다.
  exits:
    east:
      look: 왕좌가 있는 대연회장 부분이 보인다.
    south:
      look: 왕의 대연회장이 보인다.
    west:
      look: 통로가 보인다.
  extras:
  - text: >-
      천장의 그림에는 위대한 영웅들과 신들이 그려져 있다. 신 중의 한 명은 배가 꽤 나오고 털이 엄청나게 많으며, 거대한 수염을 기르고 있다. 그들 사이에는 요클롤이라는 악한
      여신과 타로콘이라는 강력한 악한 마법사와 같은 위대한 적들과 악당들도 함께 그려져 있다.

tba:150:room:15017:
  name: 대연회장의 왕좌 곁
  description: >-
    당신은 왕의 거대한 상아 왕좌 옆에 서 있다. 이 왕좌는 대강당 자체보다도 더 큰 걸작품이다. 정교하고 아름답게 조각되어 있으며, 마치 하나의 상아 덩어리에서 깎아낸 것처럼 보인다.
    하지만 그 크기의 조각을 얻기 위해 죽어야 했던 동물을 생각하면 등골이 오싹하다. 대강당은 동쪽, 서쪽, 남쪽으로 이어진다.
  exits:
    east:
      look: 왕의 대연회장이 보인다.
    south:
      look: 왕의 대연회장이 보인다.
    west:
      look: 왕의 대연회장이 보인다.
  extras:
  - text: >-
      천장의 그림에는 위대한 영웅들과 신들이 그려져 있다. 신 중의 한 명은 배가 꽤 나오고 털이 엄청나게 많으며, 거대한 수염을 기르고 있다. 그들 사이에는 요클롤이라는 악한
      여신과 타로콘이라는 강력한 악한 마법사와 같은 위대한 적들과 악당들도 함께 그려져 있다.
  - text: 크기가 크고 매우 아름답다. 조각은 주로 동물과 마법 생물이다.

