  extras:
  - text: 계단은 화강암으로 만들어졌으며, 견고해 보인다.

tba:150:room:15049:
  name: 대 계단
  description: 당신은 위아래로 이어지는 웅장한 계단 위에 서 있다. 동쪽에는 큰 오크 문이 있고, 남쪽으로 복도가 이어진다.
  exits:
    east:
