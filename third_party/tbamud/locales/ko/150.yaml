tba:150:room:15034:
  name: 남동쪽 탑 안
  description: 탑의 이 부분은 특별히 흥미롭지 않지만, 더 위로 이어진다...
  exits:
    up:
      look: 탑 꼭대기의 방은 어딘가 어둡게 보인다.
    down:
      look: 탑 바닥의 계단이 보인다.

tba:150:room:15035:
  name: 복도
  description: 당신은 오래된 시대와 영웅들을 묘사한 태피스트리로 장식된 긴 복도에 서 있다. 복도는 북쪽과 남쪽으로 이어진다. 여기에는 동쪽으로도 나가는 출구가 있다.
  exits:
