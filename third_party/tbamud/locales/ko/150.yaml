  exits:
    north:
      look: 복도가 이어지는 것이 보인다.
    south:
      look: 복도가 이어지는 것이 보인다.

tba:150:room:15041:
  name: 무도회장
  description: 당신은 거대한 무도회장에 서 있다. 이 방은 정말로 넓으며, 동쪽 끝에는 오케스트라를 위한 무대가 마련되어 있다.
  exits:
    north:
      look: 무도회장이 보인다.
    east:
      look: 동쪽으로는 무대가 보인다.

tba:150:room:15042:
  name: 무대 앞
  description: 당신 앞에는 무대가 보인다. 약 40명의 연주자가 동시에 연주할 수 있을 만큼 넓다. 무도회장은 서쪽과 북쪽으로 이어진다.
  exits:
    north:
      look: 무도회장이 보인다.
    west:
      look: 무도회장이 보인다.

tba:150:room:15043:
  name: 손님 방
  description: >-
    당신은 넓은 방에 서 있다. 충분히 편안하지만, 성의 다른 곳에서 볼 수 있는 극도의 사치가 부족하므로 가장 위대한 손님들을 위한 곳은 아니라는 것을 알 수 있다.
  exits:
    south:
      look: 문 너머로 손님 동쪽의 입구가 보인다.

tba:150:room:15044:
  name: 침실
  description: >-
    이 방은 북쪽 벽에 기대어 놓은 거대한 4개의 기둥이 달린 침대가 차지하고 있다. 방은 넓고 아늑하며, 침대는 당신이 그 위에 누워 잠들도록 거의 간절히 권유하는 듯하다.
  exits:
    south:
      look: 스위트의 거실이 보인다.
  extras:
  - text: 크고, 편안하며, 베개가 있다... 그 안에 누워 자도록 당신을 초대한다.

tba:150:room:15045:
  name: 복도
  description: 당신은 오래된 시대와 옛 영웅들을 묘사한 타피스트리로 장식된 긴 복도에 서 있다. 복도는 북쪽과 남쪽으로 이어진다. 동쪽에는 큰 방으로 이어지는 출구가 있다.
  exits:
    north:
      look: 복도가 이어지는 것이 보인다.
    east:
