tba:150:room:15000:
  name: 왕의 길
  description:
  - >-
    당신은 본격적인 왕의 길이 시작되는 곳에 서 있다. 이 길은 여러 마리의 말이 나란히 달려도 넉넉할 만큼 넓다. 길을 이루는 돌들은 어찌나 솜씨 좋게 놓였는지, 길이 완벽하게
    매끄럽고 곧게 뻗어 보인다.
  - 이 지점에서 길을 둘러싼 덤불 사이로 남쪽으로 난 작은 오솔길이 눈에 띈다. 지나가던 여행자가 당신에게 반갑게 손을 흔든다.
  exits:
    east:
      look: 왕의 길이 동쪽의 웅장한 성을 향해 똑바로 이어진다.
    south:
      look: 잡목 사이로 남쪽으로 이어지는 작은 오솔길이 보인다.
    west:
      look: 왕의 길은 서쪽으로 조금 좁아져 작은 길로 이어진다.
  extras:
  - text: 당신이 인사를 하자 여행자는 신나게 웃으며 '안녕'이라고 외치지만, 계속 길을 이어간다. 여행자의 컨디션은 매우 좋다.

tba:150:room:15001:
  name: 왕의 길
  description: 당신은 거대한 왕의 길 한가운데에 서 있다. 이 길은 매우 잘 만들어져 있으며, 동서 방향으로 똑바로 뻗어 있다.
  exits:
    east:
      look: 왕의 길이 동쪽으로 똑바로 이어진다.
    west:
      look: 왕의 길이 서쪽의 큰 도시를 향해 이어지는 것이 보인다.

tba:150:room:15002:
  name: 왕의 길
  description: 당신은 동서로 이어지는 왕의 길 위에 서 있다. 건설자들의 솜씨가 뛰어나, 길의 굽거나 불규칙한 부분을 알아차리기 어렵다.
  exits:
    east:
      look: 멀리 동쪽의 성이 보인다.
    west:
      look: 왕의 길이 서쪽으로 똑바로 이어진다.

tba:150:room:15003:
  name: 성 밖의 왕의 길
  description: >-
    당신은 왕의 길 위에 서 있다. 눈앞에는 거대한 성이 있는데, 분명 방어력보다는 아름다움을 중시하여 지은 것이 분명하다. 그렇다고 방어가 전혀 없는 것은 아니다. 성은 깊은 해자로
    둘러싸여 있고, 창문은 궁수들이 쏘기 위한 좁은 틈새뿐이다. 북쪽으로는 해자를 건너는 현무교가 있다.
  exits:
    north:
      look: 현무교가 보인다.
    west:
      look: 왕의 길이 서쪽으로 똑바로 이어진다.

tba:150:room:15004:
  name: 들게 위
  description: 당신은 성으로 이어지는 들게 위에 도착했다. 눈앞에는 거대한 이중 문이 있다. 매우 견고해 보인다. 해자에서 물결이 일고 있다.
  exits:
    north:
      look: 문에는 거대하지만 정교하게 조각된 경첩이 달려 있다. 성 자체와 마찬가지로, 이 문은 단순한 견고함뿐 아니라 아름다움을 위해 설계된 것으로 보인다.
    south:
      look: 왕의 길이 보인다.
  extras:
  - text: 잘 보이지는 않지만, 수면 아래에서 무언가가 그 물결을 만들어내는 것 같다.

tba:150:room:15005:
  name: 주방
  description: >-
    당신은 주방에 있다. 많은 부엌 일꾼들이 수석 요리사의 지시를 따르느라 바쁘게 뛰어다니고 있으며, 당신의 식욕을 자극하는 훌륭한 냄새가 난다. 방 안 곳곳에는 다양한 종류의 조리
    도구들이 쌓여 있는 선반들이 있다. 북쪽과 동쪽에는 각각 작은 통로로 이어지는 출구가 있다.
  exits:
    north:
      look: 조명이 어두운 작은 통로가 보인다.
    east:
      look: 조명이 어두운 작은 통로가 보인다.

tba:150:room:15006:
  name: 작은 통로
  description: >-
    당신은 작은 통로에 서 있다. 분명 주로 성의 하인들이 쓰도록 만든 통로다. 불빛은 어둑하고 폭도 꽤 좁다. 통로는 서쪽으로 이어지고, 동쪽에는 작은 문이 하나 있다.
  exits:
    east:
      look: 작고 평범한 문이다.
    west:
      look: 냄새나는 고기 굽는 냄새와 함께 냄비들이 부딪히는 소리가 들린다.

tba:150:room:15007:
  name: 입구 홀
  description: 당신은 성의 웅장한 입구 홀에 서 있다. 북쪽으로는 대연회장으로 나가는 출구가 있다. 동쪽으로도 출구가 있으며, 서쪽에는 작은 문이 하나 있다.
  exits:
    north:
      look: 왕의 대연회장이 보인다.
    east:
      look: 동쪽에는 작은 경비병 대기실인 것 같다.
    south:
      look: 남쪽에는 들게로 이어지는 문이 있다.
    west:
      look: 작고 평범한 문이다.

tba:150:room:15008:
  name: 경비실
  description: 당신은 작은 방 안에 있다. 분명 현재 근무하지 않는 경비병들을 위해 마련된 곳인 게 분명하다. 출구는 하나뿐이며, 입구 홀로 돌아가는 길이다.
  exits:
    west:
      look: 성 입구가 보인다.

tba:150:room:15009:
  name: 탑 아래
  description: >-
    당신은 성의 세 기둥 중 하나 아래에 있다. 여기에는 경비병이 없으며, 이 구역은 거의 사용되지 않는다는 느낌이 든다. 탑 위로 올라가는 계단이 있고, 북쪽으로 나가는 출구도
    있다.
  exits:
    north:
      look: 조명이 어두운 작은 통로가 보인다.
    up:
      look: 계단은 오래되었지만 잘 관리되어 있다. 탑 위로 이어진다.
  extras:
  - text: 계단은 오래되었지만 잘 관리되어 있다. 탑 위로 이어진다.

tba:150:room:15010:
  name: 작은 통로
  description: 당신은 작은 통로에 서 있다. 이곳은 주로 성의 하인들을 위해 마련된 곳으로 보인다. 통로는 북쪽과 남쪽으로 이어진다.
  exits:
    north:
      look: 조명이 어두운 작은 통로가 보인다.
    south:
      look: 냄새나는 고기 굽는 냄새와 냄시들이 부딪히는 소리가 들린다.

tba:150:room:15011:
  name: 대연회장
  description: >-
    당신은 대연회장의 남서쪽 끝에 서 있다. 이곳은 참으로 광활하다. 천장이 머리 위를 아주 높이 덮고 있어, 바깥 구름보다 더 멀게 느껴진다. 천장은 진정한 대가라고 할 수 있는
    누군가가 아름답게 채색해 놓았다. 홀은 매우 넓어 수백 명이 연회에 참석해도 쉽게 앉을 수 있을 정도이다.
  exits:
    north:
      look: 왕의 대연회장이 보인다.
    east:
      look: 왕의 대연회장이 보인다.
  extras:
  - text: >-
      천장의 그림에는 위대한 영웅들과 신들이 그려져 있다. 신 중의 한 명은 배가 꽤 나오고 털이 엄청나게 많으며, 거대한 수염을 기르고 있다. 그들 사이에는 요클롤이라는 악한
      여신과 타로콘이라는 강력한 악한 마법사와 같은 위대한 적들과 악당들도 함께 그려져 있다.

tba:150:room:15012:
  name: 대연회장
  description: >-
    당신은 대연회장의 남쪽 끝에 서 있다. 이곳은 참으로 광활하다. 천장이 머리 위를 아주 높이 덮고 있어, 바깥 구름보다 더 멀게 느껴진다. 천장은 진정한 대가라고 할 수 있는
