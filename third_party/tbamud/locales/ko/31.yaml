      look: 자갈길이 북쪽으로 이어진다.
    south:
      look: 성당 문은 어두운 나무로 만들어져 있다.

tba:31:room:3155:
  name: 성당 내부
  description: >-
    당신은 작고 어두운 성당 안에 있다. 작은 창문의 짙은 갈색 유리는 빛이 거의 들어오지 못하게 한다. 여기저기 마모된 나무 벤치가 몇 줄 놓여 있고, 바닥 중앙에는 오래된 제단이
    놓여 있다.
  exits:
    north:
      look: 성당 문은 어두운 나무로 만들어져 있다.
  extras:
  - text: 창문은 어둡도록 만들어졌어야 할 것이다. 적어도 완전히 깨끗하다.
  - text: >-
      제단이 매우 오래 보인다... 제대 주변 바닥을 살펴보니 방의 다른 부분보다 먼지가 덜 쌓여 있다... 누군가 정기적으로 이곳을 청소하는 모양이다... 아마 파크 카페의 그
      노인일 것이다. 그는 그런 타입으로 보였다...
  - text: 벤치는 편안한 종류가 아니다.

tba:31:mob:3100:
  short: 여종
  long: 여종이 당신의 주문을 기다리고 있다.
  description: 그녀는 금발에 짙은 파란 눈을 가진 매우 아름다운 사람이다. 여기 더 자주 오게 될 좋은 이유가 있겠구나, 당신은 속으로 생각한다.

tba:31:mob:3101:
  short: 묘지기
  long: 묘지기가 여기 앉아 뜨거운 차를 마시고 있다.
  description: 묘지기는 또 다른 무덤 파기 작업을 마치고 휴식을 취하는 것처럼 보인다.

tba:31:mob:3102:
  short: 경비대장
  long: 경비대장이 매우 화가 난 표정을 짓고 있다.
  description: 매우 화가 난 경비대장이다.

tba:31:mob:3103:
  short: 화가 난 경비병
  long: 경비병 한 명이 여기 서서 매우 화가 난 표정을 짓고 있다.
  description: 크고 강하며 화가 난 경비병이다.

tba:31:mob:3104:
  short: 비서
  long: 비서가 책상 앞에 앉아 타자기로 열심히 타이핑하고 있다.
  description: 그녀는 매우 바빠 보인다. 비서가 말한다. '죄송하지만 오늘 시장은 매우 바쁘다.' 비서가 말한다. '그동안 자리에 앉아 쉬시라.'

tba:31:mob:3105:
  short: 시장
  long: 시장이 거대한 의자에 앉아 큰 소리로 코를 골고 있다.
  description: 그는 체격이 단단한 중년 남성으로, 가느다란 회색 머리를 하고 있다.

tba:31:mob:3106:
  short: 마을 방송원
  long: 마을 방송원이 여기 있다. 그는 조용히 울고 있다.
  description: 그는 자신의 일을 매우 잘한다 - 완전히 눈물에 젖어 있다.

tba:31:mob:3120:
  short: 백조
  long: 백조 한 마리가 연못을 헤엄치고 있다.
  description: 흰 백조는 매우 우아하다.

tba:31:mob:3121:
  short: 병아리
  long: 병아리가 연못을 헤엄치고 있다.
  description: 병아리는 매우 귀엽다. 작은 털뭉치처럼 보인다.

tba:31:mob:3122:
  short: 참새
  long: 참새가 땅 위에서 날개를 퍼덕이고 있다.
  description: 참새는 인생을 즐기는 것처럼 보인다.

tba:31:mob:3123:
  short: 오리
  long: 오리가 여기 있다. 행복하게 꽥꽥 울고 있다.
  description: 오리는 꽤 살집이 있다. 인생을 즐기는 것처럼 보인다.

tba:31:obj:3100:
  short: 컵
  long: 컵이 여기 놓여 있다.
  extras:
  - text: 작고 단순한 컵이다.

tba:31:obj:3101:
  short: 컵
  long: 여기에 컵이 놓여 있다.
  extras:
  - text: 작고 단순한 컵이다.

tba:31:obj:3102:
  short: 컵
  long: 여기에 컵이 놓여 있다.
  extras:
  - text: 크고 단순한 컵이다.

tba:31:obj:3103:
  short: 병
  long: 에비앙 자연 온천수 병이 여기에 있다.
  extras:
  - text: >-
      당신은 속은 것이다! 라벨 하단에 정말로 정말로 작은 글씨로 이렇게 적혀 있다. '에비앙 주식회사 미드가르드 지사에서 병입함. 이 물은 미드가르드의 자연적이고 대부분 깨끗한
      강에서 온 것입니다.'
  - text: 크고 깨끗한 병이다. 옆면에 큰 라벨이 붙어 있다.

tba:31:obj:3104:
  short: 수통
  long: 여기 바닥에 수통이 놓여 있다.
  extras:
  - text: 꽤 큰 수통이다. 많은 양의 액체를 담을 수 있을 것 같다.

tba:31:obj:3105:
  short: 쇠 열쇠
  long: 여기에 쇠 열쇠가 하나 놓여 있다.
  extras:
  - text: 그 쇠 열쇠는 특별할 게 없다. 사실 꽤나 지루한 열쇠다.

tba:31:obj:3106:
  short: 녹슨 열쇠
  long: 여기에 녹슨 열쇠가 하나 놓여 있다.
  extras:
  - text: 열쇠는 꽤 큰 녹슨 열쇠다. 그 위에 많은 더러움이 묻어 있는 것을 당신이 알아채게 된다.

tba:31:obj:3107:
  short: 나무 열쇠
  long: 여기에 나무 열쇠가 하나 놓여 있다.
  extras:
  - text: 나무 열쇠는 특별할 게 없다. 사실 당신이 평생 본 열쇠 중 가장 지루한 열쇠에 가깝다.

tba:31:obj:3108:
  short: 황동 열쇠
  long: 여기에 황동 열쇠가 하나 놓여 있다.
  extras:
  - text: 황동 열쇠는 작고, 매우 복잡한 자물쇠에 맞는 것처럼 보인다.

tba:31:obj:3109:
  short: 책상
  long: 서쪽 벽에 책상이 놓여 있다.
  extras:
  - text: 책상은 매우 허름해 보이며, 왼쪽에 서랍이 하나 있다.
  - text: 당신은 서랍에 있는 열쇠 구멍을 발견한다.

tba:31:obj:3110:
  short: 금고
  long: 방의 어두운 구석에 금고가 놓여 있다.
  extras:
  - text: 금고는 매우 무겁고 열쇠 구멍이 있다.

tba:31:obj:3111:
  short: 벤치
  long: 하얀 페인트가 칠해진 나무 벤치가 여기 서 있다.
  extras:
  - text: 꽤 무겁지만 매우 편안한 벤치다. 앞면이 강을 향하도록 놓여 있어 앉아 강과 건너편의 집들을 바라볼 수 있다.

tba:31:obj:3112:
  short: 도시 열쇠
  long: 아주 큰 도시 열쇠가 여기 놓여 있다.
  extras:
  - text: 아마도 당신이 평생 본 열쇠 중 가장 클 것이다. 광택을 낸 금으로 만들어졌으며, 미드가르드 문장 외에도 다양한 무늬가 새겨져 있다.

tba:31:obj:3113:
  short: 분수
  long: 작은 흰색 분수가 여기 서서 기분 좋게 물소리를 내고 있다.
  extras:
  - text: 매우 아름답다. 고품질의 흰색 대리석으로 만들어졌다.

tba:31:obj:3114:
  short: 작은 금화 더미
  long: 작은 금화 더미가 여기 놓여 있다.

tba:31:obj:3115:
  short: 금
  long: 여기에 금이 많이 있다.

tba:31:obj:3116:
  short: 촛대
  long: 주석 촛대가 여기 서 있다.
  extras:
  - text: 주석으로 만든 다소 오래된 모습의 3갈래 촛대이다. 그 촛대는 누르스름한 흰색을 띠고 있다.

tba:31:obj:3117:
  short: 느티나무
  long: 여기에는 오래된 느티나무가 자라고 있다.
  extras:
  - text: 느티나무의 신선한 어린 잎들이 바람에 나긋이 흔들린다.
