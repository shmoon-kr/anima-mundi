tba:31:room:3100:
  name: 중앙로의 북서쪽 끝
  description: >-
    당신은 중앙로에 서 있다. 서쪽 바로 옆에 도시 성벽이 있다. 동쪽으로는 작은 산책로가 이어지고, 북쪽 바로 근처에 다리가 있다. 중앙로는 도시 성벽을 따라 남쪽으로 계속된다.
  exits:
    north:
      look: 다리가 보인다.
    east:
      look: 산책로가 보인다.
    south:
      look: 산책로가 멀리 남쪽으로 이어진다.

tba:31:room:3101:
  name: 산책로
  description: 북쪽 바로 근처에서 강이 서쪽으로 잔잔하게 흐른다. 산책로는 더 동쪽으로 이어지며, 서쪽에는 도시 성벽이 보인다. 파크 로드는 여기서 남쪽으로 뻗어 나간다.
  exits:
    east:
      look: 산책로가 이어진다.
    south:
      look: 파크 로드가 남쪽으로 이어진다.
    west:
      look: 중앙로가 보인다.

tba:31:room:3102:
  name: 산책로
  description: >-
    북쪽 바로 근처에서 강이 서쪽으로 잔잔하게 흐른다. 산책로는 동서 양쪽으로 이어진다. 남쪽에는 공원의 입구가 보이며, 입구 바로 서쪽에는 작은 건물이 있는 것 같다.
  exits:
    east:
      look: 산책로가 보인다.
    south:
      look: 공원 입구가 보인다.
    west:
      look: 산책로가 보인다.

tba:31:room:3103:
  name: 산책로
  description: 북쪽 바로 근처에서 강이 서쪽으로 잔잔하게 흐른다. 산책로는 동서 양쪽으로 이어진다. 남쪽으로 작은 길이 뻗어 있다. 강을 건너다 보면 강둑이 보인다.
  exits:
    east:
      look: 중앙로가 보인다.
    south:
