    west:
      look: 산책로가 보인다.

tba:31:room:3104:
  name: 중앙로의 북동쪽 끝
  description: >-
    당신은 중앙로에 서 있다. 동쪽 바로 옆에 도시 성벽이 있고, 서쪽으로는 작은 산책로가 이어진다. 강 너머를 바라보니 창고처럼 생긴 건물이 보인다. 중앙로는 도시 성벽을 따라
