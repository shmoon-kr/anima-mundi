      look: 대기실은 서쪽에 있다.
  extras:
  - text: 이 책상은 분명 매우 오래되었다. 그럼에도 불구하고 한 번도 사용된 적이 없는 것처럼 보인다.
  - text: 이 의자는 정말 걸작이다. 침대처럼 편안하게 앉을 수 있는 의자. 모든 강당에 이런 것들이 갖춰져야 한다. 다만 학생들까지 앉을 공간이 없으니 아쉬울 뿐이다.

