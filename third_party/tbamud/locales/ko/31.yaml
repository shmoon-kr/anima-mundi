  description: >-
    당신은 미드가르드의 작은 공원 안쪽 바로 앞에 서 있다. 북쪽에는 산책로가 있고, 남쪽으로는 공원 안으로 이어지는 작은 길이 있다. 동쪽에는 유명한 공원 카페가 있다.
  exits:
