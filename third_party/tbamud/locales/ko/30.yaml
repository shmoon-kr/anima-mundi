# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:30, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:30:room:3000:
  name: 열람실
  description: >-
    당신은 작은 방 안에 있다. 방은 대부분 비어 있으며, 몇 개의 나무 책상과 벤치만 놓여 있다. 동쪽에서는 미드가르드 신전의 분주한 소리가 들린다. 이 평화로운 방의 고요함과
    대비되는 소리다.
  exits:
    east:
      look: 미드가르드 신전이 보인다.
  extras:
  - text: '길드: 20-23'

tba:30:room:3001:
  name: 미드가르드 신전
  description:
  - >-
    당신은 미드가르드 신전의 신전 홀 남쪽 끝에 있다. 신전은 거대한 대리석 블록으로 지어졌으며, 영원해 보이는 외관을 갖추고 있다. 대부분의 벽에는 신, 거인, 농민을 그린 고대
    벽화가 덮고 있다.
  - >-
    넓은 계단이 웅장한 신전 문을 통해 내려가며, 신전이 세워진 거대한 언덕을 따라 내려가 아래 신전 광장에서 끝난다. 서쪽에는 열람실이 보인다. 기부실은 동쪽의 작은 벽 안쪽에
    있다.
  exits:
    north:
      look: 신전 홀 북쪽 끝에는 동상과 거대한 제단이 있다.
    east:
      look: 동쪽에는 "미드가르드 기부실"이라고 적힌 삐걱거리는 나무 표지판이 걸린 작은 벽 안쪽이 보인다.
    south:
      look: 아래 신전 광장으로 이어지는 거대한 돌계단을 내려다본다.
    west:
      look: 열람실이 보인다.
    down:
      look: 신전 광장이 보인다.
  extras:
  - text: 벽화들은 스타일과 품질 면에서 다양하다. 하지만 모두 동일한 초현실적인 질감을 지니고 있어, 그 깊이와 디테일에 빠져들게 만드는 마음을 끄는 힘이 있다.

tba:30:room:3002:
  name: 성직자 길드 내실
  description: >-
    여기는 내실이다. 위대한 토르의 그림이 서쪽 벽에 놓인 제단 바로 위 벽에 걸려 있다. 바닥 중앙의 우물은 어둠 속으로 이어진다. 깊은 곳에서 역한 냄새가 풍겨온다.
  exits:
    east:
      look: 당신의 최애 장소인 점술의 주점이 보인다.
    down:
      look: 너무 어두워서 아래가 보이지 않는다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3003:
  name: 점술의 주점
  description: 이 주점은 이 땅에서 가장 훌륭한 주점 중 하나다. 회원 전용이라 다행이다. 방 안 곳곳에 고급스러운 가구가 놓여 있다. 벽에는 작은 표지판이 걸려 있다.
  exits:
    south:
      look: 입구가 보인다.
    west:
      look: 내실이 보인다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다: 웨이터가 제공하는 무료 안내:'
    - Buy - 웨이터에게 마실 수 있는 것을 하나 산다.
    - List - 웨이터가 모든 음료와
    - 특선 메뉴를 보여주고 각각의 가격을 알려준다.

tba:30:room:3004:
  name: 성직자 길드의 입구
  description: 입구 홀은 작고 소박한 방으로, 성직자의 진정한 본성을 반영한다. 출구는 동쪽으로 신전 광장으로 이어진다. 북쪽 벽에는 꿀꿀멧돼지 바로 가는 작은 입구가 있다.
  exits:
    north:
      look: 정말 스타일리시한 가구로 화려하게 꾸며진 바를 보게 된다.
    east:
      look: 신전 광장을 보게 된다.

tba:30:room:3005:
  name: 신전 광장
  description: >-
    당신은 신전 광장에 서 있다. 거대한 대리석 계단이 신전 문으로 이어진다. 서쪽에는 성직자 길드의 입구가, 동쪽에는 오래된 꿀꿀멧돼지 여관이 있다. 바로 남쪽으로는 미드가르드의
    중심인 시장 광장이 보인다.
  exits:
    north:
      look: 신전을 보게 된다.
    east:
      look: 오래된 꿀꿀멧돼지 여관을 보게 된다.
    south:
      look: 시장 광장을 보게 된다.
    west:
      look: 성직자 길드의 입구를 보게 된다.

tba:30:room:3006:
  name: 꿀꿀멧돼지 여관의 입구 홀
  description: >-
    당신은 꿀꿀멧돼지 여관의 입구 홀에 서 있다. 홀은 단순하고 실용적인 가구로 현명하게 꾸며져 있다. 북쪽의 우체국에서 먼지와 오래된 종이의 무거운 냄새가 스며든다. 작은 계단이
    접수처로 올라가고, 바는 동쪽에 있다.
  exits:
    north:
      look: 미드가르드 우체국을 보게 된다.
    east:
      look: 깜짝! 바를 보게 된다.
    west:
      look: 신전 광장을 보게 된다.
    up:
      look: 접수처를 보게 된다.

tba:30:room:3007:
  name: 꿀꿀멧돼지
  description: >-
    당신은 바에 서 있다. 바는 북쪽 벽에 설치되어 있으며, 오래된 고문자, 조각과 상징들이 그 상단을 덮고 있다. 서쪽 벽에는 벽난로가 내장되어 있고, 동남쪽 창문으로는 신전 광장이
    보인다. 이 곳은 당신에게 집 같은 느낌을 준다. 큰 글씨로 된 작은 간판이 바에 붙어 있다.
  exits:
    west:
      look: 입구 홀로 나가는 출구를 보게 된다.
  extras:
  - text:
    - '간판에는 이렇게 적혀 있다: 꿀꿀멧돼지 여관이 제공하는 무료 안내.'
    - Buy - 바텐더에게 마실 수 있는 것을 사다.
    - List - 바텐더가 모든 종류의 음료와
    - 특선 메뉴를 보여주고 각각의 가격을 알려준다.
  - text: 아주 이해하기는 어렵지만, 맥주, 맥주에 대한 시, 그리고 작은 맥주잔처럼 보인다고 생각한다.

tba:30:room:3008:
  name: 접수처
  description: 당신은 접수처에 서 있다. 계단은 입구 홀로 내려간다. 북쪽 출구는 냉동 보관소로 이어진다. 카운터 위에 작은 표지판이 놓여 있다.
  exits:
    north:
      look: 냉동 보관소가 보인다.
    down:
      look: 입구 홀이 보인다.
  extras:
  - text:
    - '방은 비싸지만 좋다! 당신은 다음을 할 수 있다:'
    - Offer - 방에 대한 제안을 받는다 - 시간은 현실의 일수로 계산된다.
    - Rent - 방을 임대한다 (물품을 보관하고 게임을 종료함),
    - 최소 요금은 하루치이다.
    - 내 방식대로 하거나, 나가라
    - 임대료를 내라!
    - 당신을 내쫓기 전에 두 번 생각하지 않을 것이다.

tba:30:room:3009:
  name: 빵집
  description: >-
    당신은 작은 빵집 안에 서 있다.  댄시와 정교한 빵의 달콤한 향이 방을 가득 채우고 있다.  빵과 댄시는 선반 위에 정갈하게 정렬되어 있으며, 최상의 품질인 것 같다.  계산대
    위에는 작은 표지판이 놓여 있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text: >-
      당신은 이것이 정말 맛있는 페이스트리임을 본다.  분명 덴마크의 덴인(Dane)이 만든 것이리라(그곳은 확실히 스웨덴의 수도가 아니지!  ).  스칸디나비아, 잉글랜드, 북독일,
      북프랑스, 러시아, 그린란드, 아이슬란드, 에스토니아 등의 전임 통치자.  Etc.  그 크고 건강한 chokoladeboller의 모습은 당신의 침을 흘리게 하고 영혼을
      노래하게 만든다.
  - text:
    - '상점에서 제공하는 무료 안내:'
    - Buy  - 빵이나 페이스트리를 몇 개 사 준다.
    - List - 제빵사가 친절하게 당신의 빵집에서
    - 빵의 가격과 종류를 알려준다.

tba:30:room:3010:
  name: 잡화점
  description: 당신은 잡화점 안에 있다. 계산대 뒤 선반에는 온갖 물건이 쌓여 있어, 당신의 손이 닿지 않는 안전한 곳에 놓여 있다. 벽에는 작은 쪽지가 걸려 있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text:
    - >-
      쪽지에는 이렇게 적혀 있다: List - 가게에 있는 다양한 물건을 보여준다. Buy - 물건을 산다. Value - 가게 주인이 당신의 물건을 얼마에 사줄지 (무료로) 알려준다.
    - Sell - 물건을 판다.

tba:30:room:3011:
  name: 무기점
  description: >-
    방 안에는 가공된 금속과 각종 담금질 기름 냄새가 가득하다. 천장을 포함해 방 안의 모든 공간에는 온갖 장비와 무기가 빼곡히 쌓여 있다. 계산대 위에는 작은 메모가 하나 붙어
    있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text:
    - '메모에는 이렇게 적혀 있다: List - 상점에 있는 각종 물품을 보여준다. Buy - 물품을 구매한다. Value - 주인이 당신의 물품에 얼마를'
    - 줄지 (무료로) 알려준다. Sell - 물품을 판매한다.

tba:30:room:3012:
  name: 큰길
  description: >-
    당신은 미드가르드의 큰길 끝자락에 서 있다. 남쪽으로는 마법사 길드의 입구가 보인다. 길은 동쪽의 시장 광장으로 이어진다. 북쪽에는 마법 상점이 있고, 서쪽에는 성문이 있다.
  exits:
    north:
      look: 마법 상점이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 마법사 길드의 입구가 보인다.
    west:
      look: 성문이 보인다.

tba:30:room:3013:
  name: 큰길
  description: 당신은 미드가르드 시내를 관통하는 큰길 위에 있다. 남쪽으로는 방어구점의 입구가 있고, 북쪽에는 빵집이 있다. 동쪽으로는 시장 광장이 보인다.
  exits:
    north:
      look: 빵집이 보인다.
    east:
      look: 시장 광장이 보인다.
    south:
      look: 방어구점이 보인다.
    west:
      look: 큰길이 보인다.

tba:30:room:3014:
  name: 시장 광장
  description: >-
    당신은 미드가르드의 유명한 시장 광장 위에 서 있다. 광장 한가운데에는 크고 기이한 모양의 동상이 서 있다. 길은 사방으로 뻗어 있으며, 북쪽은 신전 광장, 남쪽은 공동 광장으로
    이어진다. 동쪽과 서쪽으로는 큰길이 뻗어 있다.
  exits:
    north:
      look: 신전 광장이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 공동 광장이 보인다.
    west:
      look: 큰길이 보인다.
  extras:
  - text: 보이는 것은 미드가르드 궁전을 감싸고 있는 미드가르드 웜이다.

tba:30:room:3015:
  name: 큰길
  description: >-
    당신은 시내를 가로지르는 큰길 위에 있다. 북쪽에는 잡화점이 있고, 큰길은 동쪽으로 이어진다. 서쪽으로는 시장 광장의 모습과 소리가 들리며, 남쪽에는 애완동물 가게로 들어가는
    작은 문이 있다.
  exits:
    north:
      look: 잡화점이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 애완동물 가게가 보인다.
    west:
      look: 시장 광장이 보인다.

tba:30:room:3016:
  name: 큰길
  description: 북쪽에는 무기점이, 남쪽에는 전사 길드가 있다. 동쪽으로는 마을을 벗어나고, 서쪽으로는 시장 광장으로 이어진다.
  exits:
    north:
      look: 무기점이 보인다.
    east:
      look: 도시의 성문이 보인다.
    south:
      look: 전사 길드가 보인다.
    west:
      look: 시장 광장으로 이어지는 큰길이 보인다.

tba:30:room:3017:
  name: 마법사 길드 입구
  description: 이 길드의 입구 홀은 작고 조명이 어두운 방이다.
  exits:
    north:
      look: 큰길이 보인다.
    south:
      look: 당신의 최애 장소인 마법사의 주점이 보인다.

tba:30:room:3018:
  name: 마법사의 주점
  description: 이 주점은 이 땅에서 가장 기이한 곳 중 하나다. 신비로운 이미지들이 공중에 떠다니고, 방 안 곳곳에 고급 가구들의 환영이 나타난다.
  exits:
    north:
      look: 로비가 보인다.
    east:
      look: 연구실이 보인다.

tba:30:room:3019:
  name: 마법사 연구실
  description: >-
    여기는 마법 실험 연구실이다. 검은 연기로 얼룩진 돌들이 수많은 거대한 오크 나무 테이블 위에 아치형으로 걸쳐 있고, 대부분은 기이한 모양의 파이프와 플라스크로 어지럽게 쌓여
    있다. 바닥에는 지워진 반쪽짜리 오각성과 더 기이한 기호들이 덮여 있으며, 어두운 구석의 칠판은 일부만 닦여져 고통스러워 보이는 글자들이 희미하게 보인다.
  exits:
    west:
      look: 주점이 보인다.

tba:30:room:3020:
  name: 방어구점
  description: 방어구점에는 벽과 창문에 다양한 갑옷이 진열되어 있다. 투구, 방패, 그리고 갑옷 세트가 판매 중이다. 북쪽은 큰길이다. 벽에는 작은 메모가 붙어 있다.
  exits:
    north:
      look: 당신은 큰길을 본다.

tba:30:room:3021:
  name: 전사 길드 입구 홀
  description: 전사 길드의 입구 홀이다. 여기서 말실수를 하지 않도록(또는 옳은 말을 하지 않도록) 조심해야 하는 곳이다. 동쪽은 주점이고, 북쪽은 큰길이다.
  exits:
    north:
      look: 당신은 큰길을 본다.
    east:
      look: 당신은 전사의 주점을 본다. 그곳에서 많은 소음이 들려온다.

tba:30:room:3022:
  name: 전사의 주점
  description: 전사들의 주점이다. 한때 아름답게 가구가 갖춰져 있었으나, 지금은 가구가 조각조각 나뉘어 당신 주위에 널려 있다. 남쪽은 시합·연습장이고, 서쪽은 입구 홀이다.
  exits:
    south:
      look: 당신은 시합·연습장을 본다.
    west:
      look: 당신은 전사 길드의 입구 홀을 본다.

tba:30:room:3023:
  name: 시합·연습장
  description: 이곳은 전사들의 연습장이다. 북쪽은 주점이다. 우물 하나가 어둠 속으로 이어져 있다.
  exits:
    north:
      look: 당신은 주점을 본다.
    down:
      look: 너무 어둡기 때문에 아래에 무엇이 있는지 볼 수 없다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3024:
  name: 빈민가 골목의 동쪽 끝
  description: 당신은 빈민가 골목에 있다. 남쪽에는 꾀죄죄 여관이 있고, 동쪽으로는 공동 광장이 보인다. 골목은 더 서쪽으로 이어진다.
  exits:
    east:
      look: 당신은 공동 광장을 본다.
    south:
      look: 당신은 여관을 본다.
    west:
      look: 당신은 빈민가 골목을 본다.

tba:30:room:3025:
  name: 공동 광장
  description: >-
    공동 광장. 사람들이 당신을 지나가며 서로 이야기를 나누고 있다. 서쪽에는 빈민가 골목이 있고, 동쪽에는 어두운 골목이 있다. 북쪽으로는 이 광장이 시장 광장과 연결되어 있다.
    남쪽에서 역한 냄새가 나는 것을 알아차린다.
  exits:
    north:
      look: 당신은 시장 광장을 본다.
    east:
      look: 당신은 어두운 골목을 본다.
    south:
      look: 당신은 쓰레기 매립지를 본다.
    west:
      look: 당신은 빈민가 골목을 본다.

tba:30:room:3026:
  name: 어두운 골목
  description: 어두운 골목. 서쪽에는 공동 광장이 있고, 남쪽에는 도적 길드가 있다. 골목은 동쪽으로 이어진다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    south:
      look: 당신은 도적 길드의 입구를 본다.
    west:
      look: 당신은 공동 광장을 본다.
  extras:
  - text: 여기는 도적 길드다. 건강이나 돈이 아깝다면 들어가지 마라.

tba:30:room:3027:
  name: 도적 길드의 입구 홀
  description: 도적과 암살자 길드의 입구 홀. 조심하지 않으면 생명과 돈을 모두 잃을 수 있는 곳이다. 북쪽에는 어두운 골목이 있고, 동쪽에는 도적의 주점이 있다.
  exits:
    north:
      look: 당신은 골목을 본다.
    east:
      look: 당신은 모든 것이 사라지는 도적의 주점을 본다.

tba:30:room:3028:
  name: 도적의 주점
  description:
  - 도적들의 주점이다. 한때 이 곳은 아름답게 꾸며져 있었지만, 지금은 거의 텅 비어 보인다. 남쪽에는 마당이, 서쪽에는 입구 홀이 있다.
  - (아마도 가구가 도둑맞은 것 같지 않나?)
  exits:
    south:
      look: 비밀 마당이 보인다.
    west:
      look: 도적 길드의 입구 홀이 보인다.
  extras:
  - text: 가구를 바라보고 있는데, 당신이 앉아 있는 의자가 사라진다.

tba:30:room:3029:
  name: 비밀 마당
  description: 도적과 암살자들의 비밀 훈련 마당이다. 북쪽에는 주점이 있다. 우물 하나가 어둠 속으로 내려간다.
  exits:
    north:
      look: 주점이 보인다.
    down:
      look: 너무 어두워서 아래에 있는 것을 볼 수 없다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3030:
  name: 쓰레기장
  description: 도시 사람들이 쓰레기를 버리는 쓰레기장이다. 쓰레기 사이로 큰 배관 교차점이 보이며, 하수구 시스템의 입구인 것 같다. 북쪽에는 공동 광장이 보인다.
  exits:
    north:
      look: 공동 광장이 보인다.
    down:
      look: 하수구가 보인다.

tba:30:room:3031:
  name: 애완동물 가게
  description: 애완동물 가게는 크기가 제각각인 동물들이 들어 있는 우리로 가득한, 작고 붐비는 가게이다. 벽에 간판이 하나 붙어 있다.
  exits:
    north:
      look: 큰길이 보인다.
  extras:
  - text: >-
      간판에는 이렇게 적혀 있다: 'List'를 사용하여 구매 가능한 애완동물을 확인하세요. 'Buy <pet>'을 사용하여 애완동물을 구매하세요. 애완동물을 돌보는 방법: 'order
      <pet> <instructions>'을 사용하여 애완동물에게 지시를 내릴 수 있습니다. 애완동물을 학대하면 더 이상 당신을 주인으로 인정하지 않습니다. 여러 마리의 애완동물을
      키우고 있다면 'order followers <instructions>'을 사용할 수 있습니다. 구매한 애완동물의 이름을 'buy <pet> <name>'으로 지을 수 있습니다.
      - 가게 주인 드림

tba:30:room:3032:
  name: 애완동물 상점 창고
  description: >-
    방 두 개와 애완동물 몇 마리를 만드세요. 방은 반드시 연속된 번호여야 합니다. 첫 번째 방이 315라면 두 번째 방은 316이어야 합니다. 두 번째 방은 창고로 불립니다. 창고에
    필요한 것은 애완동물로 만들려는 모든 몬스터를 각각 하나씩 로딩하는 것입니다. 이 방에는 출구가 있을 수 없으며, 평범한 플레이어는 절대 이 방을 사용하지 않습니다. 애완동물
    상점 주인은 필수 사항은 아니지만, 있는 것이 좋습니다. 이 모든 작업이 끝나면 코더에게 애완동물 상점 구현을 요청하세요. 코드가 변경되고 MUD가 재부팅되기 전까지는 작동하지
    않습니다. 애완동물의 비용은 레벨의 300배입니다.

tba:30:room:3033:
  name: 마법 상점
  description: 카운터 뒤에는 다양한 물건들이 선반에 가지런히 놓여 있는데, 아마 대부분은 마법 물품일 것입니다.
  exits:
    south:
      look: 큰길이 보입니다.

tba:30:room:3040:
  name: 미드가르드 서문 안쪽
  description: >-
    당신은 성벽에 세워진 두 개의 작은 탑 옆에 서 있습니다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있습니다. 큰길이 동쪽으로, 성벽길이 남쪽으로 이어집니다.
  exits:
    east:
      look: 큰길이 보입니다.
    south:
      look: 성벽 안쪽을 따라가는 길이 보입니다. 이 길은 성벽길이라고 불립니다.
    west:
      look: 도시 문이 서쪽에 있습니다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것 같습니다.
  - text: 단단한 나무로 만들어진 매우 큰 이중 문입니다. 더 튼튼하도록 큰 철 밴드로 보강되어 있습니다. 문 중 하나에는 매우 큰 자물쇠가 달려 있습니다.
  - text: 두 탑 모두 성벽과 마찬가지로 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다.
  - text: 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다. 너무 높아 오를 수 없습니다.

tba:30:room:3041:
  name: 미드가르드 동문 안쪽
  description: >-
    당신은 성벽에 세워진 두 개의 작은 탑 옆에 서 있습니다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있습니다. 큰길이 서쪽으로 이어집니다. 남쪽으로는 물 상점이 보입니다.
  exits:
    east:
      look: 도시 문이 보입니다.
    south:
      look: 물 상점이 보입니다.
    west:
      look: 큰길이 보입니다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것 같습니다.
  - text: 단단한 나무로 만들어진 매우 큰 이중 문입니다. 더 튼튼하도록 큰 철 밴드로 보강되어 있습니다. 문 중 하나에는 매우 큰 자물쇠가 달려 있습니다.
  - text: 두 탑 모두 성벽과 마찬가지로 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다.
  - text: 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다. 너무 높아 오를 수 없습니다.

tba:30:room:3042:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆을 걷고 있다. 길은 더 남쪽으로 이어지고, 성문은 바로 북쪽에 있다.
  exits:
    north:
      look: 당신은 성문을 본다.
    south:
      look: 길은 더 남쪽으로 이어진다.
  extras:
  - text: 이것은 서로 시멘트 같은 것으로 단단히 결합된 거대한 회색 바위들로 만들어졌다. 오르기에는 너무 높다.

tba:30:room:3043:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆을 걷고 있다. 성벽길은 더 북쪽과 남쪽으로 이어진다. 동쪽으로 작은 빈민가 골목이 이어진다. 여기 성벽에 어떤 글자들이 쓰여 있다.
  exits:
    north:
      look: 길은 더 북쪽으로 이어진다.
    east:
      look: 빈민가 골목이 동쪽으로 이어진다.
    south:
      look: 길은 더 남쪽으로 이어진다.
  extras:
  - text: '''수호자를 감시하는 자는 누구인가?'''
  - text: 이것은 서로 시멘트 같은 것으로 단단히 결합된 거대한 회색 바위들로 만들어졌다. 오르기에는 너무 높다.

tba:30:room:3044:
  name: 빈민가 골목
  description: 당신은 더 동쪽으로 이어지는 빈민가 골목에 있다. 서쪽에는 성벽이 보인다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    west:
      look: 골목은 서쪽으로 이어진다.

tba:30:room:3045:
  name: 강둑의 어두운 골목
  description: 당신은 동서로 이어지는 골목에 서 있다. 남쪽에는 강둑이 보인다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    south:
      look: 당신은 강둑을 본다.
    west:
      look: 골목은 서쪽으로 이어진다.

tba:30:room:3046:
  name: 골목의 동쪽 끝
  description: 당신은 골목의 동쪽 끝에 서 있다. 바로 동쪽에는 성벽이 있어 더 이상 나아갈 수 없다. 바로 남쪽에는 작은 창고가 있다.
  exits:
    south:
      look: 창고가 보인다.
    west:
      look: 골목이 보인다.

tba:30:room:3047:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆의 길 위에 서 있다. 이 길은 북쪽으로 이어진다. 남쪽에는 강을 건너는 다리가 있다.
  exits:
    north:
      look: 길이 보인다.
    south:
      look: 다리가 보인다.
  extras:
  - text: 이것은 서로 시멘트로 단단히 붙여진 거대한 회색 바위들로 만들어져 있다. 오를 수 없을 정도로 높다.

tba:30:room:3048:
  name: 꾀죄죄 여관
  description: 당신은 낡은 꾀죄죄 여관 안에 있다. 이 곳은 수십 년 동안 청소된 적이 없어 역한 냄새가 당신을 어지럽게 만든다.
  exits:
    north:
      look: 골목이 보인다.

tba:30:room:3049:
  name: 강둑
  description: 당신은 강둑에 있다. 남쪽을 보면 강이 서쪽으로 잔잔하게 흐르는 것이 보인다. 강가 지대가 매우 낮아 강에 들어갈 수 있다.
  exits:
    north:
      look: 골목이 보인다.
    south:
      look: 서쪽으로 흐르는 강이 보인다.

tba:30:room:3050:
  name: 버려진 창고
  description: 당신은 창고 안에 있다. 방 안에는 배에서 가져온 듯한 다양한 오래된 물건들이 장식되어 있다.
  exits:
    north:
      look: 골목을 볼 수 있다.

tba:30:room:3051:
  name: 다리 위
  description: >-
    당신은 강을 가로지르는 돌다리 위에 서 있다. 이 다리는 서쪽 성벽에서 뻗어 나와 있으며, 다리 아래 약 3미터 아래 성벽의 구멍 사이로 강물이 서쪽으로 흐르고 있다.
  exits:
    north:
      look: 도로를 볼 수 있다.
    south:
      look: 중앙로를 볼 수 있다.
  extras:
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 성벽과 똑같다.
  - text: 당신의 발밑 어딘가에 있기 때문에 여기서 제대로 볼 수 없다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3052:
  name: 미드가르드 서문 바깥
  description: 당신은 성벽에 세워진 두 개의 작은 탑 옆에 있다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있다. 서쪽으로는 큰 숲의 가장자리를 볼 수 있다.
  exits:
    east:
      look: 도시 문은 동쪽에 있다.
    west:
      look: 숲 가장자리는 서쪽에 있다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것처럼 보인다.
  - text: 이것은 단단한 나무로 만들어진 매우 큰 이중 문이다. 더 견고하도록 큰 철 밴드로 보강되어 있다. 문 중 하나에는 매우 큰 자물쇠가 달려 있다.
  - text: 두 탑 모두 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 도시 성벽과 똑같다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3053:
  name: 미드가르드 동문 바깥
  description: 당신은 성벽에 세워진 두 개의 작은 탑 옆에 있다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있다. 동쪽으로는 평원이 멀리까지 펼쳐져 있다.
  exits:
    east:
      look: 평원을 볼 수 있다.
    west:
      look: 도시 문을 볼 수 있다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것처럼 보인다.
  - text: 이것은 단단한 나무로 만들어진 매우 큰 이중 문이다. 더 견고하도록 큰 철 밴드로 보강되어 있다. 문 중 하나에는 매우 큰 자물쇠가 달려 있다.
  - text: 두 탑 모두 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 도시 성벽과 똑같다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3054:
  name: 신전 제단 옆
  description: >-
    당신은 미드가르드 신전의 북쪽 끝에 있는 신전 제단 옆에 서 있다. 하얀색으로 광택을 낸 대리석으로 만들어진 거대한 제단이 신전의 이 부분을 지배하고 있다. 제단 뒤에는 신들의
    왕 오딘의 약 3미터 높이의 좌상 동상이 우뚝 서 있다. 북쪽으로, 신전 뒤쪽으로 나가 시골로 이어지는 계단이 있다.
  exits:
    north:
      look: 당신은 광활한 미드가르드 시골을 볼 수 있다.
    south:
      look: 당신은 신전의 남쪽 끝을 볼 수 있다.
  extras:
  - text: 제단은 약 3미터가 넘는 길이지만, 하나의 하얀 원석 대리석 덩어리로 만들어진 것처럼 보인다.
  - text: >-
      동상은 왕좌에 앉아 있는 한쪽 눈이 없는 오딘을 묘사하고 있다. 그는 긴 회색 머리와 수염을 기르고 있으며, 표정은 엄하다. 왕좌 꼭대기, 그의 어깨 바로 위에는 두 마리의
      까마귀인 후긴과 무닌이 앉아 있고, 그의 발밑에는 그의 늑대인 게레와 프레케가 있다.

tba:30:room:3058:
  name: 옛날식 물 가게
  description: 당신은 작은 목조 가게 중앙에 서 있다. 가게 벽에는 물 항아리가 들어 있는 선반이 줄지어 놓여 있다. 구멍이 뚫린 큰 배럴 몇 개가 구석에 쌓여 있다.
  exits:
    north:
      look: 당신은 동문을 볼 수 있다.

tba:30:room:3059:
  name: 신전 제단 뒤
  description: 당신은 남쪽에 있는 신전 제단에서 벗어나는 흙길 위에 있다. 북쪽으로, 길은 드래곤헬름 산맥이 멀리 북쪽에 있는 미드가르드의 울창한 시골을 관통하여 계속된다.
  exits:
    north:
      look: 당신은 울창하고 초록빛이 도는 미드가르드 시골을 볼 수 있다.
    south:
      look: 당신은 신전 제단을 볼 수 있다.

tba:30:room:3060:
  name: 미드가르드 대평원
  description:
  - >-
    당신은 울창하고 초록빛이 도며 신선한 미드가르드 시골을 관통하는 넓은 흙길을 걷고 있다. 북쪽, 동쪽, 서쪽으로는 지평선까지 볼 수 있으며, 북쪽에는 북쪽, 동쪽, 서쪽으로 지평선까지
    볼 수 있고, 남쪽에는 북적이는 미드가르드 도시가 있다. 당신 주위에는 건강한 초록빛 풀과 가끔 보이는 큰 참나무가 있다. 햇살이 당신의 얼굴에 기분 좋게 느껴지고, 상쾌한 바람이
    당신의 머리카락을 스쳐 간다. 새들이 조용히 지저귀고, 꽃과 갓 깎은 풀 냄새가 희미하게 코를 간질인다. 당신은 모든 방향에서 느껴지는 힘 있는 아름다움에 둘러싸여 풀밭에 누워
    영원히 여기 머물고 싶다는 느낌을 받는다.
  - 당신이 걷고 있는 길은 북쪽으로 평원을 관통하여 계속되고, 남쪽으로 미드가르드로 돌아간다.
  exits:
    north:
      look: 당신은 대평원을 관통하는 길의 더 많은 부분을 볼 수 있다.
    south:
      look: 당신은 미드가르드로 돌아가는 길을 볼 수 있다.

tba:30:room:3061:
  name: 미드가르드 대평원
  description:
  - >-
    당신은 미드가르드의 풍요롭고 푸르며 신선한 시골을 가로지르는 넓은 흙길을 걷고 있다. 북쪽, 동쪽, 서쪽으로는 지평선까지 한눈에 보인다. 북쪽으로는 드래곤헬름 산맥이, 남쪽으로는
    번화한 미드가르드 도시가 보인다. 당신 주위에는 건강한 초록빛 풀과 가끔 보이는 큰 참나무가 있다. 햇살이 당신의 얼굴에 기분 좋게 느껴지고, 상쾌한 바람이 당신의 머리카락을
    스쳐 지나간다. 새들이 조용히 지저귀고, 꽃과 갓 깎은 풀 냄새가 희미하게 코를 간질인다. 당신은 풀밭에 누워서 영원히 여기 머물고 싶은 마음이 든다. 모든 방향에서 느껴지는
    힘 있는 아름다움에 둘러싸여 있으니 말이다.
  - 길의 동쪽에는 기이한 구조물이 있다. 작은 흙길이 메인 길에서 갈라져 서쪽으로 이어진다.
  exits:
    north:
      look: 북쪽으로 이어지는 길은 당신을 점점 더 드래곤헬름 산맥에 가깝게 데려간다.
    east:
      look: 동쪽, 트레일 가장자리에 기이한 구조물이 있다.
    south:
      look: 당신은 대평원의 더 많은 부분을 본다.
    west:
      look: 서쪽으로, 녹슨 문으로 이어지는 기이한 길이 있다.

tba:30:room:3062:
  name: 우체국
  description: >-
    당신은 미드가르드의 중앙 우체국 안에 있다. 모서리에는 잡다한 우편물 더미가 그대로 방치되어 거미줄을 치고 있다. 호기심 많은 세관 요원들이 뜯어놓은 큰 상자들이 서쪽 벽에 쌓여
    있고, 그 뒤에는 수많은 '수배' 포스터가 숨겨져 있다. 벽에는 간판이 붙어 있다.
  exits:
    south:
      look: 당신은 꿀꿀멧돼지 여관과 술집의 입구를 본다.
  extras:
  - {}
  - text: >-
      여러 크기의 봉투들이 방 안 여기저기에 거대한 더미로 쌓여 있다. 자세히 보니, 당신이 일주일 전에 보낸 편지가 더미 아래쪽에서 아무도 모르게 약간 쥐에게 갉아먹힌 채 놓여
      있다.
  - text: 여기서는 모든 것을 다루는 것 같다. 심지어 우체국장 자신까지도.
  - text: >-
      당신이 아는 것처럼, 미드가르드 우편 서비스를 통해 밀수품을 보내는 것은 불법이다. 세관 요원들은 이를 좋은 구실로 삼아 술, 희귀한 향신료, 그리고 그들이 유용하거나 이득이
      될 수 있다고 생각하는 거의 모든 것을 압수한다.
  - text: >-
      서쪽 벽의 상자 뒤로, 여러 유명한 살인자와 도적의 얼굴이 희미하게 보인다. 그중 일부는 꽤 익숙해 보인다. 방금 전 접수처에서 본 그 사람처럼... 하지만 다시 말하지만,
      상자 때문에 꽤 보기 어렵다.

tba:30:room:3063:
  name: 미드가르드 기부실
  description: >-
    당신은 메인 사당 바로 옆에 있는 작고 꾸미지 않은 방 안에 있다. 사람들이 물품이 나타날 때까지 기다리며 가끔 앉는 작은 나무 벤치가 두 개 있다. 사당은 서쪽에 있다.
  exits:
    west:
      look: 번화한 사당은 서쪽에 있다.

tba:30:room:3064:
  name: 냉동 보관소
  description: 당신은 불가능할 정도로 하얗고 살균된 방 안에 서 있다. 벽을 따라 원통형의 신장 크기의 용기들이 줄지어 놓여 있다. 접수처는 남쪽에 있다.
  exits:
    south:
      look: 접수처는 남쪽에 있다.

tba:30:room:3065:
  name: 미드가르드 대평원
  description:
  - >-
    당신은 미드가르드의 풍요롭고 푸르며 신선한 시골을 관통하는 넓은 흙길을 걷고 있다. 북쪽, 동쪽, 서쪽으로 지평선까지 시야가 트여 있고, 북적이는 도시 미드가르드는 남쪽에 위치해
    있다. 당신 주위에는 건강한 초록빛 풀과 간혹 보이는 큰 참나무가 가득하다. 햇살이 당신의 얼굴에 기분 좋게 느껴지고, 상쾌한 바람이 머리카락을 스쳐 간다. 새들이 조용히 지저귀고,
    꽃과 갓 깎은 풀 냄새가 희미하게 코끝을 간질인다. 모든 방향에서 펼쳐지는 강렬한 아름다움에 둘러싸여, 풀밭에 누워서 영원히 여기 머물고 싶은 마음이 든다.
  - 북쪽 길은 거대한 플롯 디바이스에 의해 막혀 있으며, 우회할 방법이 보이지 않는다.
  exits:
    north:
      look: 불행히도 북쪽 길은 거대한 플롯 디바이스에 의해 막혀 있고, 우회할 방법이 없어 보인다.
    south:
      look: 길은 길의 동쪽 측면에 있는 기이한 구조물을 지나 남쪽으로 평원을 따라 이어진다.
  extras:
  - text: 플롯 디바이스란 당신의 이해를 초월한 이유로 특정 방향을 막는 것에 불과하다.

tba:30:room:3066:
  name: 흙길
  description:
  - >-
    당신은 미드가르드의 풍요롭고 푸르며 신선한 시골을 관통하는 좁은 흙길을 걷고 있다. 북쪽과 동쪽으로 지평선까지 시야가 트여 있고, 북적이는 도시 미드가르드는 남쪽에 위치해 있다.
    당신 주위에는 건강한 초록빛 풀과 간혹 보이는 큰 참나무가 가득하다. 햇살이 당신의 얼굴에 기분 좋게 느껴지고, 상쾌한 바람이 머리카락을 스쳐 간다. 새들이 조용히 지저귀고,
    꽃과 갓 깎은 풀 냄새가 희미하게 코끝을 간질인다. 모든 방향에서 펼쳐지는 강렬한 아름다움에 둘러싸여, 풀밭에 누워서 영원히 여기 머물고 싶은 마음이 든다.
  - 바로 서쪽에는 돌 아치 안에 거대한 녹슨 문이 놓여 있다.
  exits:
    east:
      look: 길은 바로 동쪽에서 더 넓은 길과 합류한다.
    west:
      look: 바로 서쪽에 거대한 녹슨 문이 있다.

tba:30:mob:3000:
  short: 마법 상점 주인
  long: 마법 상점 주인이 계산대 뒤를 돌아다니며 혼자 중얼거리고 있다.
  description: >-
    마법 상점 주인은 늙고 치매 기질이 있어 보이지만, 매우 강력한 마법사인 것처럼 보인다. 그는 정교한 옷차림을 하고 있으며, 많은 수의 고급 반지와 팔찌를 착용하고 있다.

tba:30:mob:3001:
  short: 제빵사
  long: 제빵사가 한 손으로 얼굴의 밀가루를 닦으며 당신을 담담하게 바라본다.
  description: 뚱뚱하고 인상이 좋은 제빵사. 하지만 그의 몸에 많은 흉터가 있다는 것을 볼 수 있다.

tba:30:mob:3002:
  short: 식료품 상인
  long: 식료품 상인이 카운터에 서 있으며, 그의 얼굴에는 약간 인내심이 부족해 보이는 표정이 서려 있다.
  description: 키가 큰 식료품 상인이 어깨에 약 90킬로그램짜리 밀가루 자루 두 개를 메고 다닌다.

tba:30:mob:3003:
  short: 무기 대장장이
  long: 무기 대장장이가 여기 서 있다.
  description: 그는 아직 배울 것이 많은 젊은 무기 대장장이이지만, 당신이 만든 최신 살상 및 파괴 도구를 팔고 싶어 안달이 난 모습이다.

tba:30:mob:3004:
  short: 갑옷 대장장이
  long: 갑옷 대장장이가 여기 서서 그의 새(그리고 이전에 소유한) 갑옷을 전시하고 있다.
  description: 나이 든 매우 건장한 갑옷 대장장이이다. 그는 당신보다 훨씬 더 많은 갑옷을 만들어 왔다.

tba:30:mob:3005:
  short: 접수원
  long: 접수원이 여기 카운터 뒤에 서서 당신에게 미소 짓고 있다.
  description: 당신은 그녀의 얼굴에서 피곤한 기색을 알아차린다. 그녀는 태도가 나쁜 mud 플레이어들의 잡음에 견딜 만큼 충분히 잘 대우받지 못하는 것처럼 보인다.

tba:30:mob:3006:
  short: 스톨라 선장
  long: 은퇴한 선장이 여기 서서 배를 팔고 있다.
  description: 이 선장은 당신이 죽인 완두콩보다 더 많은 상어를 먹었다.

tba:30:mob:3007:
  short: 선원
  long: 선원이 여기 서서 당신을 도울 준비를 하고 있다.
  description: 그는 강하고 건강한 선원처럼 보인다.

tba:30:mob:3008:
  short: 후안 아저씨
  long: 후안 아저씨는 주문을 받을 준비를 하고 여기 있다.
  description: 그는 영주권이 있는지 없는지 모호해 보인다.

tba:30:mob:3009:
  short: 물 관리인 월리
  long: 물 관리인 월리가 계산대 뒤에 서 있다.
  description: >-
    월리는 약간 통통해 보이지만 매우 강해 보인다. 그의 손에는 미드가르드 천연 샘물이 담긴 잔을 들고 있다. 당신을 알아본 그는 자랑스러운 최신 물 컬렉션을 자랑스럽게 보여준다.

tba:30:mob:3010:
  short: 우체국장
  long: 우체국장이 서서 당신의 우편물을 도와줄 준비를 하고 있다.
  description: >-
    우체국장은 행복한 노인처럼 보이지만, 약간 둔해 보인다. 그는 MMS(미드가르드 우편 서비스)의 평판이 느리다고 생각하는 사람들이 많다는 것에 대해 걱정한다. 아마도 그의 제복에서
    거미줄을 털어내면 더 좋은 인상을 줄 수 있을 것이다.

tba:30:mob:3011:
  short: 떠돌이 행상인
  long: 이 행상인은 터무니없이 비싼 가격의 기구들과 장난감으로 가득 차 있다.
  description: >-
    좋은 사업 감각, 매력적인 성격, 그리고 아름다운 외모의 조합으로 인해 그녀는 무지한 구매자들에게 쓸모없는 제품을 판매하는 데 성공했다. 그녀는 드물게만 유용한 것을 판다.

tba:30:mob:3012:
  short: 착한 영혼
  long: 매우 친절하고 배려가 깊은 영혼이 도움이 필요한 사람들을 위해 여기 있다.
  description: >-
    그녀는 당신에게 어머니를 즉시 떠올리게 한다. 끊임없이 모든 사람과 모든 것에 대해 걱정한다. 그녀는 항상 어려운 시기를 겪고 조금의 도움이 필요한 사람들을 돕기 위해 곁에 있다.

tba:30:mob:3013:
  short: 초보자 가이드
  long: >-
    초보자 가이드가 도움을 주기 위해 여기 있다. "{bright_red}가이드에게 도움 요청{/bright_red}{yellow}"을 입력하면 도움을 받을 수 있다.{/yellow}
  description: 이 젊은 여성은 도움이 필요한 사람들을 돕는 것이 유일한 목적이다. 그녀는 당신을 미드가르드 곳곳으로 데려다니며 현지 명소의 도보 투어를 제공한다.

tba:30:mob:3020:
  short: 마법사 길드장
  long: 당신의 길드장이 주문을 시전하기 위해 주문서를 연구하고 있다.
  description: >-
    당신의 길드장은 늙고 피곤해 보이지만, 그녀가 지닌 방대한 지식은 분명하게 느껴진다. 그녀는 정교한 마법 의상을 입고 있으며, 푸르게 반짝이는 오라에 둘러싸여 있는 것을 눈치챌
    수 있다.

tba:30:mob:3021:
  short: 성직자 길드장
  long: 당신의 길드장이 여기서 당신의 신에게 기도하고 있다.
  description: >-
    이 길드장이 당신의 신과 진정으로 가까우리라는 데 의심의 여지가 없다. 그는 평온하고 사랑에 가득 찬 표정을 짓고 있다. 그가 하얀 오라에 둘러싸여 있는 것을 눈치챌 수 있다.

tba:30:mob:3022:
  short: 도적 길드장
  long: 거지가 여기 앉아 있는데, 그녀가 길드장일 수 있을까?
  description: 당신의 길드장이 움직일 때마다 그것을 알아차리지 못한다는 사실을 깨닫는다. 진정한 도적의 방식이다. 그녀는 가난한 옷을 입고 있어 거지와 같은 외모를 하고
    있다.

tba:30:mob:3023:
  short: 전사 길드장
  long: 당신의 길드장이 여기 서서 도끼를 갈고 있다.
  description: >-
    이것이 당신의 스승이다. 크고 강하며 근육이 부풀어 있다. 그의 몸에 난 여러 흉터는 당신이 태어나기 전에 무기를 사용했음을 증명한다. 그의 얼굴에는 평온한 표정이 서려 있다.

tba:30:mob:3024:
  short: 주술사
  long: 주술사가 입구를 지키고 있다.
  description: >-
    그는 전투 마법에 특화된 숙련된 마법사이다. 마법사 길드를 지키기 위해 여기 있으며, 공격 마법과 방어 마법 모두에 대한 뛰어난 지식으로 인해 치명적인 상대가 된다.

tba:30:mob:3025:
  short: 성전 기사
  long: 성전 기사가 입구를 지키고 있다.
  description: >-
    그는 신앙의 군사 조직에 소속된 특수 훈련을 받은 전사다. 그의 임무는 신도들을 박해와 이단자의 공격으로부터 보호하는 것이며, 그의 종교적 헌신과 뛰어난 실력이 결합되어 그를
    치명적인 상대가 만든다.

tba:30:mob:3026:
  short: 암살자
  long: 암살자가 입구를 지키고 있다.
  description: >-
    그는 다양한 무기를 사용하여 타인을 가장 효과적으로 살해하는 데 특화된 도적이다. 무기를 어떻게, 어디에 사용해야 하는지에 대한 뛰어난 지식과 놀라운 은밀함이 결합되어 그를 치명적인
    적수로 만든다.

tba:30:mob:3040:
  short: 바텐더
  long: 바텐더가 당신을 차분하게 바라보며, 능숙하게 음료를 섞고 있다.
  description: 피곤해 보이는 바텐더로, 자기 바에서 시비를 일으키는 것을 싫어한다.

tba:30:mob:3041:
  short: 웨이터
  long: 웨이터가 여기저기 돌아다니고 있다.
  description: 피곤해 보이는 웨이터.

tba:30:mob:3042:
  short: 웨이터
  long: 이제 조용하고 평화로운 삶을 살아가는 웨이터가 여기 서 있다.
  description: 당신은 그의 얼굴을 즉시 알아본다. 분명 젊은 시절에는 유명한 주술사였을 것이다.

tba:30:mob:3043:
  short: 웨이터
  long: 신과 교감을 이룬 듯한 웨이터가 여기 서 있다.
  description: 이 웨이터를 보면 무릎을 꿇고 당신의 신을 숭배해야 할 것 같은 기분이 든다. 아니야.

tba:30:mob:3044:
  short: 웨이터
  long: 손님들이 돈을 어디에 보관하는지 다 아는 웨이터가 여기 서 있다.
  description: 흠... 그가 가지고 노는 그 동전은 어디서 났을까.

tba:30:mob:3045:
  short: 웨이터
  long: 웨이터가 여기 있다.
  description: 이 남자는 아직 꽤 많은 양의 화염술을 마시고도 당신을 쉽게 죽일 수 있을 것 같다.

tba:30:mob:3046:
  short: 꼬질이
  long: 꼬질이 여기 서 있으며 당신에게 특별한 음료를 대접할 준비가 되어 있다.
  description: 꼬질이는 정말, 음, 더럽다. 그는 손님들을 만족시키기를 좋아하지만, 그를 건드리면 화를 낼 것이다.

tba:30:mob:3059:
  short: 치안관
  long: 치안관이 여기 서 있으며, 문제가 생기는 즉시 개입할 준비가 되어 있다.
  description: 그는 매우 강하고 현명해 보인다. 아무에게도 복종하지 않는 것 같다.

tba:30:mob:3060:
  short: 경비병
  long: 경비병이 여기 서 있다.
  description: 크고, 강하고, 친절하며, 신뢰할 수 있는 경비병이다.

tba:30:mob:3061:
  short: 청소부
  long: 청소부가 여기저기 돌아다니며 청소하고 있다.
  description: 정말 힘든 일이겠다.

tba:30:mob:3062:
  short: 사나운 똥개
  long: 사나운 똥개가 여기 쓰레기 더미 사이를 헤집으며 먹이를 찾고 있다.
  description: 똥개는 악취가 나고 이 사이로 썩은 고기 조각이 매달려 있는 작은 개다.

tba:30:mob:3063:
  short: 용병
  long: 용병이 여기 일을 기다리고 있다.
  description: 꽤나 사나워 보이고, 돈이라면 뭐든 할 것 같다는 생각이 든다.

tba:30:mob:3064:
  short: 술주정뱅이
  long: 노래를 부르며 행복한 술주정뱅이다.
  description: 너무나 행복해 보이고, 돈도 너무 많이 지니고 있는 술주정뱅이다.

tba:30:mob:3065:
  short: 거지
  long: 거지가 여기 있다. 동전 몇 닢을 구걸하고 있다.
  description: 그 거지는 삶에 지쳐 보이는 모습이다.

tba:30:mob:3066:
  short: 개똥 운나사
  long: 개똥 운나사가 여기 있다. 뒤로 걷고 있다.
  description: 개똥 운나사는 어떤 개에 의해 거꾸로 된 작은 신이다.

tba:30:mob:3067:
  short: 경비병
  long: 경비병이 여기 있다. 문을 지키고 있다.
  description: 크고, 강하고, 친절하며, 신뢰할 수 있는 경비병이다.

tba:30:mob:3068:
  short: 초록 젤리 덩어리
  long: 녹슨 초록 젤리 덩어리가 여기 있으며, 부스러기를 빨아들이고 있다.
  description: 끔찍해 보이는 것; 거대하고, 초록빛이며, 젤리 덩어리처럼 보인다.

tba:30:mob:3089:
  short: 애완동물 가게 소년
  long: 애완동물 가게 소년이 여기 서 있으며, 손에 무언가 털이 있는 것을 꼭 안고 있다.
  description: 당신이 그를 바라보자, 그는 손을 벌려 쥐를 드러낸다!

tba:30:mob:3090:
  short: 고양이 새끼
  long: 작고 충성스러운 고양이 새끼가 여기 있다.
  description: 고양이 새끼는 귀엽고 작으며, 사나운 전사처럼 보인다.

tba:30:mob:3091:
  short: 강아지
  long: 작고 충성스러운 강아지가 여기 있다.
  description: 강아지는 귀엽고 작으며, 사나운 전사처럼 보인다.

tba:30:mob:3092:
  short: 비글
  long: 작고 민첩하며 충성스러운 비글이 여기 있다.
  description: 비글은 사납고 용감한 전사처럼 보인다.

tba:30:mob:3093:
  short: 로트바일러
  long: 크고 충성스러운 로트바일러가 여기 있다.
  description: 로트바일러는 강하고 사나운 전사처럼 보인다.

tba:30:mob:3094:
  short: 늑대
  long: 크고 훈련된 늑대가 여기 있다.
  description: 늑대는 강하고 두려움이 없는 전사처럼 보인다.

tba:30:mob:3095:
  short: 냉동 기술자
  long: 냉동 기술자가 액체 질소 용기를 가지고 놀며 여기 있다.
  description: 당신은 그녀의 얼굴에 피곤한 기색을 알아본다. 그녀는 태도가 있는 mud 플레이어들의 시비질을 감당할 만큼 충분한 보수를 받지 못하는 것처럼 보인다.

tba:30:obj:3000:
  short: 양조용 배럴
  long: 맥주 배럴이 여기 버려져 있다.

tba:30:obj:3001:
  short: 병
  long: 맥주 병이 여기 버려져 있다.

tba:30:obj:3002:
  short: 병
  long: 어두운 색의 에일 병이 여기 버려져 있다.

tba:30:obj:3003:
  short: 병
  long: 파이어브레스 병이 여기 버려져 있다.

tba:30:obj:3004:
  short: 병
  long: 어두운 병 하나가 여기 남겨져 있다.

tba:30:obj:3005:
  short: 무광 금속 열쇠
  long: 무광 금속으로 만들어진 열쇠 하나가 여기 바닥에 놓여 있다.

tba:30:obj:3006:
  short: 순간 이동 장치
  long: '"순간 이동 장치"라고 적힌 기이한 기기가 여기 남겨져 있다.'

tba:30:obj:3009:
  short: 여행용 빵
  long: 여행용 빵이 여기 놓여 있다.
  extras:
  - text: 여행용 빵은 엘프들이 여행할 때 먹는 전통적인 음식으로, 그들은 이를 lembas라고 부른다. 지친 여행자에게 큰 활력을 불어넣어 준다고 전해진다.

tba:30:obj:3010:
  short: 빵
  long: 여기에 빵 한 덩이가 놓여 있다.

tba:30:obj:3011:
  short: 데니시 페이스트리
  long: 맛있어 보이는 데니시 페이스트리가 여기에 놓여 있다.

tba:30:obj:3012:
  short: 멕시코 타코
  long: 맛있어 보이는 멕시코 타코가 여기에 떨어졌다.

tba:30:obj:3013:
  short: 매운 부리또
  long: 매콤해 보이는 부리또가 여기에 놓여 있다.

tba:30:obj:3014:
  short: 치즈 나초
  long: 여기 나초가 놓여 있다.
  extras:
  - text: 위에는 치즈가 뿌려져 있다. 후안 아저씨의 특선 메뉴인 것 같다.

tba:30:obj:3015:
  short: 고기 조각
  long: 여기 바닥에 좀 수상해 보이는 고기 조각이 놓여 있다.
  extras:
  - text: >-
      고기가 독이 든 것처럼 보이는 것은 아니지만, 어디서 왔는지 확신이 서지 않는다. 사냥꾼이 사슴이나 토끼 고기를 그냥 버릴 리가 없는데... 대체 이 고기는 어디서 나온 걸까,
      당신은 생각한다...

tba:30:obj:3020:
  short: 단검
  long: 길고 가느다란 날을 가진 단검이 여기 있다.

tba:30:obj:3021:
  short: 소검
  long: 소검이 여기 놓여 있다.
  extras:
  - text: '''이 검이 좋은 동반자가 되길.''이라고 적혀 있다.'
  - text: 소검에는 어떤 글귀가 새겨져 있는 것 같다.

tba:30:obj:3022:
  short: 긴 검
  long: 긴 검이 여기 놓여 있다.

tba:30:obj:3023:
  short: 나무 몽둥이
  long: 단순해 보이는 나무 몽둥이가 여기 있다.

tba:30:obj:3024:
  short: 전쟁 망치
  long: 중형 전쟁 망치가 여기 있다.

tba:30:obj:3025:
  short: 플레일
  long: 큰 플레일이 여기 있다.

tba:30:obj:3030:
  short: 횃불
  long: 크고 긴 횃불이다.

tba:30:obj:3031:
  short: 등
  long: 황동으로 만든 등이 여기 있다.

tba:30:obj:3032:
  short: 가방
  long: 작은 가방이 여기 있다.

tba:30:obj:3033:
  short: 상자
  long: 작은 상자가 여기 있다.
