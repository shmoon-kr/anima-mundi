# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:30, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:30:room:3000:
  name: 열람실
  description: >-
    당신은 작은 방 안에 있다. 방은 대부분 비어 있으며, 몇 개의 나무 책상과 벤치만 놓여 있다. 동쪽에서는 미드가르드 신전의 분주한 소리가 들린다. 이 평화로운 방의 고요함과
    대비되는 소리다.
  exits:
    east:
      look: 미드가르드 신전이 보인다.
  extras:
  - text: '길드: 20-23'

tba:30:room:3001:
  name: 미드가르드 신전
  description:
  - >-
    당신은 미드가르드 신전의 신전 홀 남쪽 끝에 있다. 신전은 거대한 대리석 블록으로 지어졌으며, 영원해 보이는 외관을 갖추고 있다. 대부분의 벽에는 신, 거인, 농민을 그린 고대
    벽화가 덮고 있다.
  - >-
    넓은 계단이 웅장한 신전 문을 통해 내려가며, 신전이 세워진 거대한 언덕을 따라 내려가 아래 신전 광장에서 끝난다. 서쪽에는 열람실이 보인다. 기부실은 동쪽의 작은 벽 안쪽에
    있다.
  exits:
    north:
      look: 신전 홀 북쪽 끝에는 동상과 거대한 제단이 있다.
    east:
      look: 동쪽에는 "미드가르드 기부실"이라고 적힌 삐걱거리는 나무 표지판이 걸린 작은 벽 안쪽이 보인다.
    south:
      look: 아래 신전 광장으로 이어지는 거대한 돌계단을 내려다본다.
    west:
      look: 열람실이 보인다.
    down:
      look: 신전 광장이 보인다.
  extras:
  - text: 벽화들은 스타일과 품질 면에서 다양하다. 하지만 모두 동일한 초현실적인 질감을 지니고 있어, 그 깊이와 디테일에 빠져들게 만드는 마음을 끄는 힘이 있다.

tba:30:room:3002:
  name: 성직자 길드 내실
  description: >-
    여기는 내실이다. 위대한 토르의 그림이 서쪽 벽에 놓인 제단 바로 위 벽에 걸려 있다. 바닥 중앙의 우물은 어둠 속으로 이어진다. 깊은 곳에서 역한 냄새가 풍겨온다.
  exits:
    east:
      look: 당신의 최애 장소인 점술의 주점이 보인다.
    down:
      look: 너무 어두워서 아래가 보이지 않는다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3003:
  name: 점술의 주점
  description: 이 주점은 이 땅에서 가장 훌륭한 주점 중 하나다. 회원 전용이라 다행이다. 방 안 곳곳에 고급스러운 가구가 놓여 있다. 벽에는 작은 표지판이 걸려 있다.
  exits:
    south:
      look: 입구가 보인다.
    west:
      look: 내실이 보인다.
  extras:
  - text:
    - '표지판에는 이렇게 적혀 있다: 웨이터가 제공하는 무료 안내:'
    - Buy - 웨이터에게 마실 수 있는 것을 하나 산다.
    - List - 웨이터가 모든 음료와
    - 특선 메뉴를 보여주고 각각의 가격을 알려준다.

tba:30:room:3004:
  name: 성직자 길드의 입구
  description: 입구 홀은 작고 소박한 방으로, 성직자의 진정한 본성을 반영한다. 출구는 동쪽으로 신전 광장으로 이어진다. 북쪽 벽에는 꿀꿀멧돼지 바로 가는 작은 입구가 있다.
  exits:
    north:
      look: 정말 스타일리시한 가구로 화려하게 꾸며진 바를 보게 된다.
    east:
      look: 신전 광장을 보게 된다.

tba:30:room:3005:
  name: 신전 광장
  description: >-
    당신은 신전 광장에 서 있다. 거대한 대리석 계단이 신전 문으로 이어진다. 서쪽에는 성직자 길드의 입구가, 동쪽에는 오래된 꿀꿀멧돼지 여관이 있다. 바로 남쪽으로는 미드가르드의
    중심인 시장 광장이 보인다.
  exits:
    north:
      look: 신전을 보게 된다.
    east:
      look: 오래된 꿀꿀멧돼지 여관을 보게 된다.
    south:
      look: 시장 광장을 보게 된다.
    west:
      look: 성직자 길드의 입구를 보게 된다.

tba:30:room:3006:
  name: 꿀꿀멧돼지 여관의 입구 홀
  description: >-
    당신은 꿀꿀멧돼지 여관의 입구 홀에 서 있다. 홀은 단순하고 실용적인 가구로 현명하게 꾸며져 있다. 북쪽의 우체국에서 먼지와 오래된 종이의 무거운 냄새가 스며든다. 작은 계단이
    접수처로 올라가고, 바는 동쪽에 있다.
  exits:
    north:
      look: 미드가르드 우체국을 보게 된다.
    east:
      look: 깜짝! 바를 보게 된다.
    west:
      look: 신전 광장을 보게 된다.
    up:
      look: 접수처를 보게 된다.

tba:30:room:3007:
  name: 꿀꿀멧돼지
  description: >-
    당신은 바에 서 있다. 바는 북쪽 벽에 설치되어 있으며, 오래된 고문자, 조각과 상징들이 그 상단을 덮고 있다. 서쪽 벽에는 벽난로가 내장되어 있고, 동남쪽 창문으로는 신전 광장이
    보인다. 이 곳은 당신에게 집 같은 느낌을 준다. 큰 글씨로 된 작은 간판이 바에 붙어 있다.
  exits:
    west:
      look: 입구 홀로 나가는 출구를 보게 된다.
  extras:
  - text:
    - '간판에는 이렇게 적혀 있다: 꿀꿀멧돼지 여관이 제공하는 무료 안내.'
    - Buy - 바텐더에게 마실 수 있는 것을 사다.
    - List - 바텐더가 모든 종류의 음료와
    - 특선 메뉴를 보여주고 각각의 가격을 알려준다.
  - text: 아주 이해하기는 어렵지만, 맥주, 맥주에 대한 시, 그리고 작은 맥주잔처럼 보인다고 생각한다.

tba:30:room:3008:
  name: 접수처
  description: 당신은 접수처에 서 있다. 계단은 입구 홀로 내려간다. 북쪽 출구는 냉동 보관소로 이어진다. 카운터 위에 작은 표지판이 놓여 있다.
  exits:
    north:
      look: 냉동 보관소가 보인다.
    down:
      look: 입구 홀이 보인다.
  extras:
  - text:
    - '방은 비싸지만 좋다! 당신은 다음을 할 수 있다:'
    - Offer - 방에 대한 제안을 받는다 - 시간은 현실의 일수로 계산된다.
    - Rent - 방을 임대한다 (물품을 보관하고 게임을 종료함),
    - 최소 요금은 하루치이다.
    - 내 방식대로 하거나, 나가라
    - 임대료를 내라!
    - 당신을 내쫓기 전에 두 번 생각하지 않을 것이다.

tba:30:room:3009:
  name: 빵집
  description: >-
    당신은 작은 빵집 안에 서 있다.  댄시와 정교한 빵의 달콤한 향이 방을 가득 채우고 있다.  빵과 댄시는 선반 위에 정갈하게 정렬되어 있으며, 최상의 품질인 것 같다.  계산대
    위에는 작은 표지판이 놓여 있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text: >-
      당신은 이것이 정말 맛있는 페이스트리임을 본다.  분명 덴마크의 덴인(Dane)이 만든 것이리라(그곳은 확실히 스웨덴의 수도가 아니지!  ).  스칸디나비아, 잉글랜드, 북독일,
      북프랑스, 러시아, 그린란드, 아이슬란드, 에스토니아 등의 전임 통치자.  Etc.  그 크고 건강한 chokoladeboller의 모습은 당신의 침을 흘리게 하고 영혼을
      노래하게 만든다.
  - text:
    - '상점에서 제공하는 무료 안내:'
    - Buy  - 빵이나 페이스트리를 몇 개 사 준다.
    - List - 제빵사가 친절하게 당신의 빵집에서
    - 빵의 가격과 종류를 알려준다.

tba:30:room:3010:
  name: 잡화점
  description: 당신은 잡화점 안에 있다. 계산대 뒤 선반에는 온갖 물건이 쌓여 있어, 당신의 손이 닿지 않는 안전한 곳에 놓여 있다. 벽에는 작은 쪽지가 걸려 있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text:
    - >-
      쪽지에는 이렇게 적혀 있다: List - 가게에 있는 다양한 물건을 보여준다. Buy - 물건을 산다. Value - 가게 주인이 당신의 물건을 얼마에 사줄지 (무료로) 알려준다.
    - Sell - 물건을 판다.

tba:30:room:3011:
  name: 무기점
  description: >-
    방 안에는 가공된 금속과 각종 담금질 기름 냄새가 가득하다. 천장을 포함해 방 안의 모든 공간에는 온갖 장비와 무기가 빼곡히 쌓여 있다. 계산대 위에는 작은 메모가 하나 붙어
    있다.
  exits:
    south:
      look: 당신은 큰길을 본다.
  extras:
  - text:
    - '메모에는 이렇게 적혀 있다: List - 상점에 있는 각종 물품을 보여준다. Buy - 물품을 구매한다. Value - 주인이 당신의 물품에 얼마를'
    - 줄지 (무료로) 알려준다. Sell - 물품을 판매한다.

tba:30:room:3012:
  name: 큰길
  description: >-
    당신은 미드가르드의 큰길 끝자락에 서 있다. 남쪽으로는 마법사 길드의 입구가 보인다. 길은 동쪽의 시장 광장으로 이어진다. 북쪽에는 마법 상점이 있고, 서쪽에는 성문이 있다.
  exits:
    north:
      look: 마법 상점이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 마법사 길드의 입구가 보인다.
    west:
      look: 성문이 보인다.

tba:30:room:3013:
  name: 큰길
  description: 당신은 미드가르드 시내를 관통하는 큰길 위에 있다. 남쪽으로는 방어구점의 입구가 있고, 북쪽에는 빵집이 있다. 동쪽으로는 시장 광장이 보인다.
  exits:
    north:
      look: 빵집이 보인다.
    east:
      look: 시장 광장이 보인다.
    south:
      look: 방어구점이 보인다.
    west:
      look: 큰길이 보인다.

tba:30:room:3014:
  name: 시장 광장
  description: >-
    당신은 미드가르드의 유명한 시장 광장 위에 서 있다. 광장 한가운데에는 크고 기이한 모양의 동상이 서 있다. 길은 사방으로 뻗어 있으며, 북쪽은 신전 광장, 남쪽은 공동 광장으로
    이어진다. 동쪽과 서쪽으로는 큰길이 뻗어 있다.
  exits:
    north:
      look: 신전 광장이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 공동 광장이 보인다.
    west:
      look: 큰길이 보인다.
  extras:
  - text: 보이는 것은 미드가르드 궁전을 감싸고 있는 미드가르드 웜이다.

tba:30:room:3015:
  name: 큰길
  description: >-
    당신은 시내를 가로지르는 큰길 위에 있다. 북쪽에는 잡화점이 있고, 큰길은 동쪽으로 이어진다. 서쪽으로는 시장 광장의 모습과 소리가 들리며, 남쪽에는 애완동물 가게로 들어가는
    작은 문이 있다.
  exits:
    north:
      look: 잡화점이 보인다.
    east:
      look: 큰길이 보인다.
    south:
      look: 애완동물 가게가 보인다.
    west:
      look: 시장 광장이 보인다.

tba:30:room:3016:
  name: 큰길
  description: 북쪽에는 무기점이, 남쪽에는 전사 길드가 있다. 동쪽으로는 마을을 벗어나고, 서쪽으로는 시장 광장으로 이어진다.
  exits:
    north:
      look: 무기점이 보인다.
    east:
      look: 도시의 성문이 보인다.
    south:
      look: 전사 길드가 보인다.
    west:
      look: 시장 광장으로 이어지는 큰길이 보인다.

tba:30:room:3017:
  name: 마법사 길드 입구
  description: 이 길드의 입구 홀은 작고 조명이 어두운 방이다.
  exits:
    north:
      look: 큰길이 보인다.
    south:
      look: 당신의 최애 장소인 마법사의 주점이 보인다.

tba:30:room:3018:
  name: 마법사의 주점
  description: 이 주점은 이 땅에서 가장 기이한 곳 중 하나다. 신비로운 이미지들이 공중에 떠다니고, 방 안 곳곳에 고급 가구들의 환영이 나타난다.
  exits:
    north:
      look: 로비가 보인다.
    east:
      look: 연구실이 보인다.

tba:30:room:3019:
  name: 마법사 연구실
  description: >-
    여기는 마법 실험 연구실이다. 검은 연기로 얼룩진 돌들이 수많은 거대한 오크 나무 테이블 위에 아치형으로 걸쳐 있고, 대부분은 기이한 모양의 파이프와 플라스크로 어지럽게 쌓여
    있다. 바닥에는 지워진 반쪽짜리 오각성과 더 기이한 기호들이 덮여 있으며, 어두운 구석의 칠판은 일부만 닦여져 고통스러워 보이는 글자들이 희미하게 보인다.
  exits:
    west:
      look: 주점이 보인다.

tba:30:room:3020:
  name: 방어구점
  description: 방어구점에는 벽과 창문에 다양한 갑옷이 진열되어 있다. 투구, 방패, 그리고 갑옷 세트가 판매 중이다. 북쪽은 큰길이다. 벽에는 작은 메모가 붙어 있다.
  exits:
    north:
      look: 당신은 큰길을 본다.

tba:30:room:3021:
  name: 전사 길드 입구 홀
  description: 전사 길드의 입구 홀이다. 여기서 말실수를 하지 않도록(또는 옳은 말을 하지 않도록) 조심해야 하는 곳이다. 동쪽은 주점이고, 북쪽은 큰길이다.
  exits:
    north:
      look: 당신은 큰길을 본다.
    east:
      look: 당신은 전사의 주점을 본다. 그곳에서 많은 소음이 들려온다.

tba:30:room:3022:
  name: 전사의 주점
  description: 전사들의 주점이다. 한때 아름답게 가구가 갖춰져 있었으나, 지금은 가구가 조각조각 나뉘어 당신 주위에 널려 있다. 남쪽은 시합·연습장이고, 서쪽은 입구 홀이다.
  exits:
    south:
      look: 당신은 시합·연습장을 본다.
    west:
      look: 당신은 전사 길드의 입구 홀을 본다.

tba:30:room:3023:
  name: 시합·연습장
  description: 이곳은 전사들의 연습장이다. 북쪽은 주점이다. 우물 하나가 어둠 속으로 이어져 있다.
  exits:
    north:
      look: 당신은 주점을 본다.
    down:
      look: 너무 어둡기 때문에 아래에 무엇이 있는지 볼 수 없다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3024:
  name: 빈민가 골목의 동쪽 끝
  description: 당신은 빈민가 골목에 있다. 남쪽에는 꾀죄죄 여관이 있고, 동쪽으로는 공동 광장이 보인다. 골목은 더 서쪽으로 이어진다.
  exits:
    east:
      look: 당신은 공동 광장을 본다.
    south:
      look: 당신은 여관을 본다.
    west:
      look: 당신은 빈민가 골목을 본다.

tba:30:room:3025:
  name: 공동 광장
  description: >-
    공동 광장. 사람들이 당신을 지나가며 서로 이야기를 나누고 있다. 서쪽에는 빈민가 골목이 있고, 동쪽에는 어두운 골목이 있다. 북쪽으로는 이 광장이 시장 광장과 연결되어 있다.
    남쪽에서 역한 냄새가 나는 것을 알아차린다.
  exits:
    north:
      look: 당신은 시장 광장을 본다.
    east:
      look: 당신은 어두운 골목을 본다.
    south:
      look: 당신은 쓰레기 매립지를 본다.
    west:
      look: 당신은 빈민가 골목을 본다.

tba:30:room:3026:
  name: 어두운 골목
  description: 어두운 골목. 서쪽에는 공동 광장이 있고, 남쪽에는 도적 길드가 있다. 골목은 동쪽으로 이어진다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    south:
      look: 당신은 도적 길드의 입구를 본다.
    west:
      look: 당신은 공동 광장을 본다.
  extras:
  - text: 여기는 도적 길드다. 건강이나 돈이 아깝다면 들어가지 마라.

tba:30:room:3027:
  name: 도적 길드의 입구 홀
  description: 도적과 암살자 길드의 입구 홀. 조심하지 않으면 생명과 돈을 모두 잃을 수 있는 곳이다. 북쪽에는 어두운 골목이 있고, 동쪽에는 도적의 주점이 있다.
  exits:
    north:
      look: 당신은 골목을 본다.
    east:
      look: 당신은 모든 것이 사라지는 도적의 주점을 본다.

tba:30:room:3028:
  name: 도적의 주점
  description:
  - 도적들의 주점이다. 한때 이 곳은 아름답게 꾸며져 있었지만, 지금은 거의 텅 비어 보인다. 남쪽에는 마당이, 서쪽에는 입구 홀이 있다.
  - (아마도 가구가 도둑맞은 것 같지 않나?)
  exits:
    south:
      look: 비밀 마당이 보인다.
    west:
      look: 도적 길드의 입구 홀이 보인다.
  extras:
  - text: 가구를 바라보고 있는데, 당신이 앉아 있는 의자가 사라진다.

tba:30:room:3029:
  name: 비밀 마당
  description: 도적과 암살자들의 비밀 훈련 마당이다. 북쪽에는 주점이 있다. 우물 하나가 어둠 속으로 내려간다.
  exits:
    north:
      look: 주점이 보인다.
    down:
      look: 너무 어두워서 아래에 있는 것을 볼 수 없다. 다시 올라오기는 불가능해 보인다.

tba:30:room:3030:
  name: 쓰레기장
  description: 도시 사람들이 쓰레기를 버리는 쓰레기장이다. 쓰레기 사이로 큰 배관 교차점이 보이며, 하수구 시스템의 입구인 것 같다. 북쪽에는 공동 광장이 보인다.
  exits:
    north:
      look: 공동 광장이 보인다.
    down:
      look: 하수구가 보인다.

tba:30:room:3031:
  name: 애완동물 가게
  description: 애완동물 가게는 크기가 제각각인 동물들이 들어 있는 우리로 가득한, 작고 붐비는 가게이다. 벽에 간판이 하나 붙어 있다.
  exits:
    north:
      look: 큰길이 보인다.
  extras:
  - text: >-
      간판에는 이렇게 적혀 있다: 'List'를 사용하여 구매 가능한 애완동물을 확인하세요. 'Buy <pet>'을 사용하여 애완동물을 구매하세요. 애완동물을 돌보는 방법: 'order
      <pet> <instructions>'을 사용하여 애완동물에게 지시를 내릴 수 있습니다. 애완동물을 학대하면 더 이상 당신을 주인으로 인정하지 않습니다. 여러 마리의 애완동물을
      키우고 있다면 'order followers <instructions>'을 사용할 수 있습니다. 구매한 애완동물의 이름을 'buy <pet> <name>'으로 지을 수 있습니다.
      - 가게 주인 드림

tba:30:room:3032:
  name: 애완동물 상점 창고
  description: >-
    방 두 개와 애완동물 몇 마리를 만드세요. 방은 반드시 연속된 번호여야 합니다. 첫 번째 방이 315라면 두 번째 방은 316이어야 합니다. 두 번째 방은 창고로 불립니다. 창고에
    필요한 것은 애완동물로 만들려는 모든 몬스터를 각각 하나씩 로딩하는 것입니다. 이 방에는 출구가 있을 수 없으며, 평범한 플레이어는 절대 이 방을 사용하지 않습니다. 애완동물
    상점 주인은 필수 사항은 아니지만, 있는 것이 좋습니다. 이 모든 작업이 끝나면 코더에게 애완동물 상점 구현을 요청하세요. 코드가 변경되고 MUD가 재부팅되기 전까지는 작동하지
    않습니다. 애완동물의 비용은 레벨의 300배입니다.

tba:30:room:3033:
  name: 마법 상점
  description: 카운터 뒤에는 다양한 물건들이 선반에 가지런히 놓여 있는데, 아마 대부분은 마법 물품일 것입니다.
  exits:
    south:
      look: 큰길이 보입니다.

tba:30:room:3040:
  name: 미드가르드 서문 안쪽
  description: >-
    당신은 성벽에 세워진 두 개의 작은 탑 옆에 서 있습니다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있습니다. 큰길이 동쪽으로, 성벽길이 남쪽으로 이어집니다.
  exits:
    east:
      look: 큰길이 보입니다.
    south:
      look: 성벽 안쪽을 따라가는 길이 보입니다. 이 길은 성벽길이라고 불립니다.
    west:
      look: 도시 문이 서쪽에 있습니다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것 같습니다.
  - text: 단단한 나무로 만들어진 매우 큰 이중 문입니다. 더 튼튼하도록 큰 철 밴드로 보강되어 있습니다. 문 중 하나에는 매우 큰 자물쇠가 달려 있습니다.
  - text: 두 탑 모두 성벽과 마찬가지로 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다.
  - text: 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다. 너무 높아 오를 수 없습니다.

tba:30:room:3041:
  name: 미드가르드 동문 안쪽
  description: >-
    당신은 성벽에 세워진 두 개의 작은 탑 옆에 서 있습니다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있습니다. 큰길이 서쪽으로 이어집니다. 남쪽으로는 물 상점이 보입니다.
  exits:
    east:
      look: 도시 문이 보입니다.
    south:
      look: 물 상점이 보입니다.
    west:
      look: 큰길이 보입니다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것 같습니다.
  - text: 단단한 나무로 만들어진 매우 큰 이중 문입니다. 더 튼튼하도록 큰 철 밴드로 보강되어 있습니다. 문 중 하나에는 매우 큰 자물쇠가 달려 있습니다.
  - text: 두 탑 모두 성벽과 마찬가지로 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다.
  - text: 서로 붙여진 큰 회색 바위와 어떤 종류의 모르타르로 만들어졌습니다. 너무 높아 오를 수 없습니다.

tba:30:room:3042:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆을 걷고 있다. 길은 더 남쪽으로 이어지고, 성문은 바로 북쪽에 있다.
  exits:
    north:
      look: 당신은 성문을 본다.
    south:
      look: 길은 더 남쪽으로 이어진다.
  extras:
  - text: 이것은 서로 시멘트 같은 것으로 단단히 결합된 거대한 회색 바위들로 만들어졌다. 오르기에는 너무 높다.

tba:30:room:3043:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆을 걷고 있다. 성벽길은 더 북쪽과 남쪽으로 이어진다. 동쪽으로 작은 빈민가 골목이 이어진다. 여기 성벽에 어떤 글자들이 쓰여 있다.
  exits:
    north:
      look: 길은 더 북쪽으로 이어진다.
    east:
      look: 빈민가 골목이 동쪽으로 이어진다.
    south:
      look: 길은 더 남쪽으로 이어진다.
  extras:
  - text: '''수호자를 감시하는 자는 누구인가?'''
  - text: 이것은 서로 시멘트 같은 것으로 단단히 결합된 거대한 회색 바위들로 만들어졌다. 오르기에는 너무 높다.

tba:30:room:3044:
  name: 빈민가 골목
  description: 당신은 더 동쪽으로 이어지는 빈민가 골목에 있다. 서쪽에는 성벽이 보인다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    west:
      look: 골목은 서쪽으로 이어진다.

tba:30:room:3045:
  name: 강둑의 어두운 골목
  description: 당신은 동서로 이어지는 골목에 서 있다. 남쪽에는 강둑이 보인다.
  exits:
    east:
      look: 골목은 동쪽으로 이어진다.
    south:
      look: 당신은 강둑을 본다.
    west:
      look: 골목은 서쪽으로 이어진다.

tba:30:room:3046:
  name: 골목의 동쪽 끝
  description: 당신은 골목의 동쪽 끝에 서 있다. 바로 동쪽에는 성벽이 있어 더 이상 나아갈 수 없다. 바로 남쪽에는 작은 창고가 있다.
  exits:
    south:
      look: 창고가 보인다.
    west:
      look: 골목이 보인다.

tba:30:room:3047:
  name: 성벽길
  description: 당신은 서쪽 성벽 옆의 길 위에 서 있다. 이 길은 북쪽으로 이어진다. 남쪽에는 강을 건너는 다리가 있다.
  exits:
    north:
      look: 길이 보인다.
    south:
      look: 다리가 보인다.
  extras:
  - text: 이것은 서로 시멘트로 단단히 붙여진 거대한 회색 바위들로 만들어져 있다. 오를 수 없을 정도로 높다.

tba:30:room:3048:
  name: 꾀죄죄 여관
  description: 당신은 낡은 꾀죄죄 여관 안에 있다. 이 곳은 수십 년 동안 청소된 적이 없어 역한 냄새가 당신을 어지럽게 만든다.
  exits:
    north:
      look: 골목이 보인다.

tba:30:room:3049:
  name: 강둑
  description: 당신은 강둑에 있다. 남쪽을 보면 강이 서쪽으로 잔잔하게 흐르는 것이 보인다. 강가 지대가 매우 낮아 강에 들어갈 수 있다.
  exits:
    north:
      look: 골목이 보인다.
    south:
      look: 서쪽으로 흐르는 강이 보인다.

tba:30:room:3050:
  name: 버려진 창고
  description: 당신은 창고 안에 있다. 방 안에는 배에서 가져온 듯한 다양한 오래된 물건들이 장식되어 있다.
  exits:
    north:
      look: 골목을 볼 수 있다.

tba:30:room:3051:
  name: 다리 위
  description: >-
    당신은 강을 가로지르는 돌다리 위에 서 있다. 이 다리는 서쪽 성벽에서 뻗어 나와 있으며, 다리 아래 약 3미터 아래 성벽의 구멍 사이로 강물이 서쪽으로 흐르고 있다.
  exits:
    north:
      look: 도로를 볼 수 있다.
    south:
      look: 중앙로를 볼 수 있다.
  extras:
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 성벽과 똑같다.
  - text: 당신의 발밑 어딘가에 있기 때문에 여기서 제대로 볼 수 없다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3052:
  name: 미드가르드 서문 바깥
  description: 당신은 성벽에 세워진 두 개의 작은 탑 옆에 있다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있다. 서쪽으로는 큰 숲의 가장자리를 볼 수 있다.
  exits:
    east:
      look: 도시 문은 동쪽에 있다.
    west:
      look: 숲 가장자리는 서쪽에 있다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것처럼 보인다.
  - text: 이것은 단단한 나무로 만들어진 매우 큰 이중 문이다. 더 견고하도록 큰 철 밴드로 보강되어 있다. 문 중 하나에는 매우 큰 자물쇠가 달려 있다.
  - text: 두 탑 모두 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 도시 성벽과 똑같다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3053:
  name: 미드가르드 동문 바깥
  description: 당신은 성벽에 세워진 두 개의 작은 탑 옆에 있다. 두 탑은 무거운 나무 문 위에 걸린 보행교로 연결되어 있다. 동쪽으로는 평원이 멀리까지 펼쳐져 있다.
  exits:
    east:
      look: 평원을 볼 수 있다.
    west:
      look: 도시 문을 볼 수 있다.
  extras:
  - text: 너무 높아 닿을 수 없지만, 한 탑에서 다른 탑으로 쉽게 걸어갈 수 있을 것처럼 보인다.
  - text: 이것은 단단한 나무로 만들어진 매우 큰 이중 문이다. 더 견고하도록 큰 철 밴드로 보강되어 있다. 문 중 하나에는 매우 큰 자물쇠가 달려 있다.
  - text: 두 탑 모두 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있으며, 도시 성벽과 똑같다.
  - text: 이것은 서로 어떤 종류의 모르타르로 고정된 큰 회색 바위들로 만들어져 있다. 너무 높아 오를 수 없다.

tba:30:room:3054:
  name: 신전 제단 옆
  description: >-
    당신은 미드가르드 신전의 북쪽 끝에 있는 신전 제단 옆에 서 있다. 하얀색으로 광택을 낸 대리석으로 만들어진 거대한 제단이 신전의 이 부분을 지배하고 있다. 제단 뒤에는 신들의
    왕 오딘의 약 3미터 높이의 좌상 동상이 우뚝 서 있다. 북쪽으로, 신전 뒤쪽으로 나가 시골로 이어지는 계단이 있다.
  exits:
    north:
      look: 당신은 광활한 미드가르드 시골을 볼 수 있다.
    south:
      look: 당신은 신전의 남쪽 끝을 볼 수 있다.
  extras:
  - text: 제단은 약 3미터가 넘는 길이지만, 하나의 하얀 원석 대리석 덩어리로 만들어진 것처럼 보인다.
  - text: >-
      동상은 왕좌에 앉아 있는 한쪽 눈이 없는 오딘을 묘사하고 있다. 그는 긴 회색 머리와 수염을 기르고 있으며, 표정은 엄하다. 왕좌 꼭대기, 그의 어깨 바로 위에는 두 마리의
      까마귀인 후긴과 무닌이 앉아 있고, 그의 발밑에는 그의 늑대인 게레와 프레케가 있다.

tba:30:room:3058:
  name: 옛날식 물 가게
  description: 당신은 작은 목조 가게 중앙에 서 있다. 가게 벽에는 물 항아리가 들어 있는 선반이 줄지어 놓여 있다. 구멍이 뚫린 큰 배럴 몇 개가 구석에 쌓여 있다.
  exits:
    north:
      look: 당신은 동문을 볼 수 있다.

tba:30:room:3059:
  name: 신전 제단 뒤
  description: 당신은 남쪽에 있는 신전 제단에서 벗어나는 흙길 위에 있다. 북쪽으로, 길은 드래곤헬름 산맥이 멀리 북쪽에 있는 미드가르드의 울창한 시골을 관통하여 계속된다.
  exits:
    north:
      look: 당신은 울창하고 초록빛이 도는 미드가르드 시골을 볼 수 있다.
    south:
      look: 당신은 신전 제단을 볼 수 있다.

tba:30:room:3060:
  name: 미드가르드 대평원
  description:
  - >-
    당신은 울창하고 초록빛이 도며 신선한 미드가르드 시골을 관통하는 넓은 흙길을 걷고 있다. 북쪽, 동쪽, 서쪽으로는 지평선까지 볼 수 있으며, 북쪽에는 북쪽, 동쪽, 서쪽으로 지평선까지
    볼 수 있고, 남쪽에는 북적이는 미드가르드 도시가 있다. 당신 주위에는 건강한 초록빛 풀과 가끔 보이는 큰 참나무가 있다. 햇살이 당신의 얼굴에 기분 좋게 느껴지고, 상쾌한 바람이
    당신의 머리카락을 스쳐 간다. 새들이 조용히 지저귀고, 꽃과 갓 깎은 풀 냄새가 희미하게 코를 간질인다. 당신은 모든 방향에서 느껴지는 힘 있는 아름다움에 둘러싸여 풀밭에 누워
    영원히 여기 머물고 싶다는 느낌을 받는다.
  - 당신이 걷고 있는 길은 북쪽으로 평원을 관통하여 계속되고, 남쪽으로 미드가르드로 돌아간다.
  exits:
    north:
      look: 당신은 대평원을 관통하는 길의 더 많은 부분을 볼 수 있다.
    south:
      look: 당신은 미드가르드로 돌아가는 길을 볼 수 있다.
