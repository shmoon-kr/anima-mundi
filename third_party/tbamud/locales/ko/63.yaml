# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:63, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:63:room:6300:
  name: 아라크노스 구역 설명 방
  description: 당신은 아직 완성되지 않은 방 안에 있다.

tba:63:room:6301:
  name: 거미줄로 뒤덮인 입구
  description: >-
    끈적끈적, 끈적끈적하다! 바닥은 낙엽과 거미줄에 걸린 귀뚜라미, 딱정벌레, 쥐, 개, 심지어 인간의 썩은 잔해로 뒤덮여 있다. 앞으로 무엇이 기다리고 있을지 궁금해진다. 여기
    공기는 습하고, 우거진 나뭇잎 사이로 스며드는 약간의 빛조차 거미줄에 흡수되는 듯하다.

tba:63:room:6302:
  name: 거미줄이 드리운 통로
  description: >-
    이곳은 발 디디기가 아주 좋다. 지나치게 좋을 정도다. 나뭇가지는 거미줄로 뒤덮여 있고, 나뭇가지치고는 유난히 튼튼해 보인다. 네 방향으로 길이 나 있다. 동쪽 길은 약간 내리막이다.

tba:63:room:6303:
  name: 말벌 둥지
  description: >-
    수벌들이 이 방 안을 바쁘게 기어 다닌다. 벽의 방들은 벌집처럼 육각형 모양이고, 눈에 띄는 유충과 말벌 중 상당수의 몸에는 송곳니 자국이 나 있다. 그 자국들에서 어떤 질서가
    느껴진다.

tba:63:room:6304:
  name: 거미줄이 드리운 통로
  description: 또 다른 거미줄로 뒤덮인 통로로, 끈적하고 축축하다. 공중에는 바람을 타고 떠다니는 작은 거미들이 가득하다. 이 어린 것들은 갓 태어난 새끼들인 듯하다.

tba:63:room:6305:
  name: 붐비는 길 아래
  description: 위에서 기어다니는 거미류의 소리가 들린다. 발소리의 리듬으로 보아 그들의 움직임에는 원시적인 질서가 있는 듯하다. 위쪽이 더 밝아 보인다.

tba:63:room:6306:
  name: 붐비는 길 위
  description: >-
    거미, 거미, 사방이 거미다! 개미에 버금갈 만큼 효율적이지만 한 가지 큰 차이가 있다. 이곳의 거미들은 개미 시체뿐 아니라 쥐, 늑대, 그리고 인간까지 나르고 있다.

tba:63:room:6307:
  name: 붐비는 길 위
  description: >-
    거미, 거미, 사방이 거미다! 개미에 버금갈 만큼 효율적이지만, 한 가지 큰 차이가 있다. 이곳 거미들은 개미 시체뿐 아니라 고양이, 늑대, 인간까지 나르고 있다.

tba:63:room:6308:
  name: 붐비는 길 위
  description: >-
    거미, 거미, 어디에나 거미! 마치 개미처럼 효율적이다. 다만 한 가지 큰 차이가 있다. 여기의 거미들은 개미 시체뿐 아니라 고양이, 개, 그리고 인간의 시체를 나르고 있다.

tba:63:room:6309:
  name: 갈림길
  description: >-
    늘 그렇듯 길이 갈라진다. 한쪽 길에는 귀뚜라미 더듬이가 여기저기 흩어져 있다. 다른 쪽 길은 잘 다듬어져 있어 수월하게 지나갈 수 있다. 앞에서 흔히 보이던 거미줄은 이제 거의
    찾아볼 수 없다.

tba:63:room:6310:
  name: 털이 보송보송한 나뭇가지
  description: >-
    당신은 '털이 보송보송한' 나뭇가지 위에 있다. 묘하게도 가지 껍질에서 '털'이 돋아난 것처럼 보인다. 가까이 들여다보니 가지마다 진딧물 수백만 마리가 빽빽이 뒤덮고 있다.

tba:63:room:6311:
  name: 나무줄기
  description: 여기서는 안전하게 쉴 수 있을 것 같다. 거미줄의 흔적이 있지만, 이곳의 것은 더 곱고 정교하다.

tba:63:room:6312:
  name: 나무 소굴 입구
  description: >-
    당신 앞에 널린 잔해를 보건대, 이곳의 주인은 희생자를 거미줄로 감싸 두지 않는 모양이다. 주변에는 바싹 마른 시체가 어지럽게 널려 있는데, 보아하니 물리기만 했을 뿐 거미줄에
    감기지는 않았고 체액이 모조리 빨려 나갔다.

tba:63:room:6313:
  name: 늑대거미 소굴
  description: 거미의 굴이 으레 그렇듯 매우 어둡다. 출구 하나를 제외하면 가재도구가 거의 없다. 늑대거미는 시체를 여기 두지 않고, 기분이 들면 밖으로 내던져 버린다.

tba:63:room:6320:
  name: 거미줄 없는 길
  description: 이상하다. 여기에는 거미줄이 없다. 그뿐 아니라 아무 소리도 들리지 않는다. 길은 북쪽으로 이어지는데, 그쪽에서는 줄타기하듯 협곡을 건너야 할지도 모른다.

tba:63:room:6321:
  name: 협곡 위
  description: >-
    더 이상한 일이다. 발이 거미줄을 아주 단단히 디딘다. 당신은 깊은 협곡 위에 있다. 이 줄은 두 나무 사이를 잇고 있다. 아래로 무지갯빛 거미줄이 보이는데, 동물 뼈가 잔뜩
    걸려 있다. 사실 곰 뼈와 작은 사슴 뼈도 있다. 인간의 해골은 (아직) 보이지 않는다.

tba:63:room:6322:
  name: 무지개 거미줄
  description: 여기가 바로 무지개 거미줄이다. 실 한 올, 매듭 하나하나가 날카롭고 강렬한 색채와 대비를 이루고 있다. 여기 사는 존재는 빛을 다루는 데도 능통한 듯하다.

tba:63:room:6323:
  name: 거미줄 숲
  description: >-
    여기의 나무들은 전혀 다른 모습이다. 더 이상 나무가 아니라, 엉성하게 얼기설기 이어 붙인 비단실 기둥들이다. 만져보면 끈적하고, 질감은 거미줄 같다. 이곳은 아무래도 다른 세계인
    듯하다.

tba:63:room:6324:
  name: 노예 구덩이
  description: >-
    당신은 노예 구덩이에 들어섰다. 멀리서 고함이 울려 퍼진다. '일이나 해라, 이 구더기 같은 놈들아!' 발밑의 길에는 채굴된 금과 은이 실린 레일이 겹겹이 어지럽게 깔려 있다.

tba:63:room:6325:
  name: 밧줄 길
  description: 다른 길들과 다를 바 없는 또 하나의 거미줄 길이다. 양옆에 매달린 황금빛 구슬 덕분에 뜻밖에 밝아서, 길이 점점 더 정교해지는 것이 보인다.

tba:63:room:6326:
  name: 교차로
  description: 또 다른 기이한 작은 거미줄 가닥이 있다. 본질적으로 에테르에 가깝다.

tba:63:room:6327:
  name: 안내 가닥
  description: >-
    이 가닥은 더 무겁고 단단하다. 당신이 밟자 반짝인다. 분명 더 이상 미드가르드의 영역에 있지 않다. 정확히 어디에 있는지 알 수 없다. 에테르를 통과하며 이동하는 것 같다.
    그래도 더 단단한 땅으로 내려갈 수는 있다.

tba:63:room:6328:
  name: 에테르 거미줄의 입구
  description: 당신은 에테르 거미줄의 입구에 서 있다. 가닥들이 깜빡이며 사라졌다가 다시 나타나고, 각 가닥은 검정색에서 초록색, 파란색까지 다른 색을 드러낸다.

tba:63:room:6330:
  name: 어린 용족의 요람
  description: >-
    일종의 놀이터로, 말벌 유충과 다른 해충 새끼들이 여기저기 널려 있다. 인간들도 여기서 장난감처럼 놀림을 당했고, 나중에 먹혔을 것 같다. 이 장소를 만든 존재가 용 고기를 좋아하며,
    이 방을 번식지로 사용한다는 느낌이 든다.

tba:63:room:6331:
  name: 거미줄의 밑동
  description: >-
    여기서 굵은 실들이 서로 이어진다. 그 매듭은 에테르 속에서 반짝이며 깜박인다. 수많은 날아다니는 생물들—곤충, 페가수스, 그리고 용의 새끼들—이 거미줄의 위험한 통로를 오간다.
    출구는 여러 방향으로 뚫려 있다.

tba:63:room:6332:
  name: 나무 사이를 지나
  description: 이곳의 거미줄은 몇 그루 나무의 가지 사이를 가로지른다. 수많은 일꾼 거미들이 아직 치우지 않은 온갖 나뭇잎과 잔해가 여기 널려 있다.

tba:63:room:6333:
  name: 구름 위
  description: 이 에테르 거미줄에서는 미드가르드 전역이 한눈에 보인다. 날아다니려는 큰 용들은 대부분 끈적한 거미줄 가닥을 피해 멀리 돌아가는 듯하다.

tba:63:room:6334:
  name: 구름 위
  description: 이 구름은 꽤 짙고 빽빽하다. 문득 이것이 평범한 구름이 아니라, 하늘을 나는 어떤 생물의 둥지일지도 모른다는 생각이 든다.

tba:63:room:6335:
  name: 에테르 거미줄의 한 고리
  description: 이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물들이 끈적한 실에 걸려드는(혹은 홀리는) 듯하다.

tba:63:room:6336:
  name: 위태로운 가닥
  description: 하늘 쪽으로 조금 솟아 있어 바람이 매우 강하지만, 그래도 돌아다니기에는 충분히 안전하다.

tba:63:room:6340:
  name: 원로 용족의 방
  description: 더 성숙한 용족이 여기 사는 것 같다. 신비한 지식을 담은 책들이 여기저기 어지럽게 쌓여 있고, 갑옷과 무기 조각들도 널려 있다.

tba:63:room:6341:
  name: 또 다른 나뭇가지
  description: 거미줄이 다시 한번 또 다른 나뭇가지를 가로지른다. 한쪽으로 다른 생물의 굴 입구일지도 모를 곳이 보인다.

tba:63:room:6342:
  name: 새잡이거미의 굴
  description: 거미들 가운데서도 큰 사냥감을 노리는 사냥꾼이다. 부서진 보석과 무기들로 보아 이곳에 사는 자는 강력한 턱을 지녔음이 틀림없다. 조심하라!

tba:63:room:6345:
  name: 에테르 거미줄의 한 고리
  description: 이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물들이 끈적한 실에 걸려드는(혹은 홀리는) 듯하다.

tba:63:room:6346:
  name: 조용한 나무 꼭대기
  description: 조용한 나무 꼭대기이다. 아래를 내려다보면 미드가르드로 돌아갈 수 있을지도 모르는 익숙한 길이 보인다.

tba:63:room:6347:
  name: 거미줄 위
  description: >-
    RRRRRRRRRRROOOOOOOOOOOOOAAAAAAAAAAAAAARR!  당신은 강력한 짐승의 포효 소리를 듣는다.  용이라고 생각한다.  당신은 발끝으로 살금살금 이 거미줄
    구간을 걸어가며 잔뜩 겁에 질린다.

tba:63:room:6350:
  name: 키린의 방
  description: 지혜로운 키린이 오래전에 이곳에 갇혔다.  이 세계의 통치자는 그녀로부터 마법적 힘을 얻는다.

tba:63:room:6355:
  name: 에테르 거미줄의 한 고리
  description: 이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물이 끈적한 실에 걸려드는(혹은 최면에 빠지는) 듯하다. 북쪽에서 불타는 짐승의 거친 숨소리가 느껴진다.

tba:63:room:6360:
  name: 예보드의 소굴
  description: >-
    미드가르드의 찬탈자 예보드가 여기 산다. 목소리가 외친다. '조심하라, 미드가르드의 찬탈자가 여기 산다! 할 수 있을 때 달아나라!' 하지만 예보드에게도 주인이 있다... 적어도
    당신은 그렇게 짐작한다.

tba:63:room:6365:
  name: 에테르 거미줄의 한 고리
  description: >-
    이곳은 에테르 거미줄의 또 다른 고리다. 온갖 생물이 그 끈적한 실에 걸리는(혹은 홀리는) 듯하다. 북쪽으로는 외가닥 거미줄이 이어지고, 남쪽으로는 섬뜩한 형체들이 어른거린다.
    아라크노스의 소굴로 들어가는 음산한 입구는 아래쪽에 있다.

tba:63:room:6366:
  name: 돈존킵의 입구
  description: >-
    거미줄 끝에 이어진 어두운 길이다. 앞쪽에 횃불이 밝혀진 방이 있고, 원한을 풀지 못한 모험가들의 영혼이 모여들어 이를 간다. 수많은 울부짖음과 비명이 복도마다 메아리친다. 앞으로는
    뚜렷한 길 하나가 나 있다.

tba:63:room:6367:
  name: 수호자의 방
  description: 여기에는 어떤 영혼도 달아나지 못하게 지키는, 지칠 줄 모르는 수호자의 의자가 놓여 있다. 그 밖에 방에는 아무 장식도 없다.
  extras:
  - text: 평범한 의자. 많이 사용된 흔적이 보이며, 거미줄로 바닥에 붙어 있다.

tba:63:room:6368:
  name: 절망의 영역
  description: >-
    여기에는 자신이 아직 살아 있다고 믿는 미혹된 영혼이 수없이 많다. 그들은 정당한 이유 없이 자신을 죽인 자들을 찾아다니며, 산 자의 자유로운 영혼을 찾아 그 안에 깃들어 다시
    한번 모험을 떠나 보려 한다.

tba:63:room:6369:
  name: 절망한 자들의 영역
  description: >-
    이곳에는 자신이 아직 살아 있다고 믿는 미혹된 영혼이 수없이 많다. 그들은 정당한 이유 없이 자신을 죽인 자들을 찾아 헤매고, 살아 있는 존재의 자유로운 영혼을 찾아 그 안에
    깃들어 다시 한번 모험을 떠나 보려 한다.

tba:63:room:6370:
  name: 돈존킵
  description: >-
    이곳에는 단 한 번도 영혼이 살았던 적이 없다. 들려오는 소리는 노예들의 울부짖음과 늑대들의 울음소리라고밖에 표현할 길이 없다. 벽은 얇고 아스라하다. 빛이라고는 이곳까지 타고
    온 에테르 거미줄 가닥에서 일렁이는 반짝임뿐이다.

tba:63:room:6371:
  name: 외가닥 거미줄
  description: >-
    외가닥 거미줄이 다시 한번 당신을 지탱해 준다.  에테르 너머를 바라보니 앞쪽에 창문에서 불이 켜진 작은 오두막 하나가 보인다.  당신은 북쪽에서 오는 큰 악을 감지하고, 에테르
    거미줄로 돌아가 그곳에서 운을 시험해 보려는 마음이 든다.

tba:63:room:6372:
  name: 외가닥 거미줄
  description: 외가닥 거미줄이 다시 한번 당신을 지탱해 준다.  오두막이 점점 더 선명하게 보이기 시작하고, 당신은 이제 돌아가고 싶은 마음이 더욱 강해진다.

tba:63:room:6373:
  name: 은둔자의 구석
  description: >-
    이곳에는 방랑자가 머문 흔적이 남아 있다. 북쪽에 오두막이 있다. 들어갈 용기가 있다면 말이다. 지금 당장 돌아가야 할 것 같은 찜찜한 느낌이 든다. 머리 위 하늘이 어두워지더니
    천둥이 웃음소리처럼 으르렁댄다.

tba:63:room:6380:
  name: 마하트마의 탈출 불가 함정
  description: >-
    방은 어둡고 그림자로 가득하다. 방심한 여행자를 잡으려고 공들여 만든 함정이 놓여 있다. 나갈 길이 전혀 없어 보인다. 한 구석에는 약탈당한 시체 몇 구가 쌓여 있다.

tba:63:room:6390:
  name: 아라크노스의 소굴 입구
  description: 모든 실은 필연적으로 이곳으로 이어진다. 거미줄의 중심이자 아라크노스의 소굴로 통하는 입구다.

tba:63:room:6391:
  name: 끈적한 방
  description: >-
    기대감(아니면 두려움인가?)에 무릎이 떨리고 있지만 아직은 물러설 수 있다. 이 거미줄 가닥 위로는 하늘이 맑다. 놀랍게도 끈적이지 않는다. 이 가닥은 다른 가닥들과 달리 진동하지
    않는다. 바람을 타고 떠다니는 거미 몇 마리가 지나가며 '죽을 거야, 타 죽을 거야. 잘 가라!' 하고 낄낄댄다.

tba:63:room:6392:
  name: 거대한 문
  description: >-
    당신 앞에 거미줄처럼 생긴 커다란 문이 있다. 그 거미줄 무늬에는 고대 룬의 다양한 문양과 미드가르드 영웅들의 이름이 새겨져 있다. 혹시 희생자 명단일까? 알 수 없는 일이다.

tba:63:room:6399:
  name: 아라크노스의 소굴
  description: >-
    여기는 거미 여제 아라크노스의 소굴이다. 화려하게 장식된 무지갯빛 거미줄이 보인다. 그녀는 마법의 실을 주물질계(Prime Material Plane)로 이어, 이 소굴에서 원하는
    어느 우주로든 옮겨 갈 수 있다. 금과 마법 보석, 온갖 보석이 담긴 궤짝들이 겹겹이 쌓여 있다. 안타깝게도 아라크노스는 몸이 불룩한 거미이기도 해서, 보물을 모조리 거미줄로
    엮어 아름다운 비단결 같은 제 몸에 붙여 두었다.

tba:63:mob:6301:
  short: 어린 거미
  long: 어린 거미가 거미줄을 타고 바람에 날려 당신 곁을 지나간다.
  description: 갓 알에서 깨어난 듯 생기가 넘친다. 어린 송곳니가 이제 막 돋아나고 있다.

tba:63:mob:6302:
  short: 예보드
  long: 미드가르드의 찬탈자 예보드가 여기서 당신을 보며 사악하게 히죽거리고 있다.
  description: 늙고 비늘이 덮여 있지만, 여전히 상당한 위력을 지니고 있다.

tba:63:mob:6303:
  short: 늑대거미
  long: 늑대거미가 피 묻은 송곳니를 핥고 있다.
  description: 늑대거미는 털이 많다. 아주, 아주 많다.

tba:63:mob:6304:
  short: 오크
  long: 오크가 거미줄에 걸려 빠져나오지 못하고 있다.
  description: 그의 눈에서 악의가 느껴지지만, 생명력이 거의 소진된 듯 보인다. 거미줄에 갇힌 채로 당신을 노려볼 뿐이다.

tba:63:mob:6305:
  short: 여왕말벌
  long: 여왕말벌이 여기 있다. 당신이 참 맛있어 보인다고 생각하고 있다.
  description: 그녀의 눈빛이 멍하게 풀려 있다.

tba:63:mob:6306:
  short: 수컷 거미
  long: 일꾼 거미가 주인의 명령을 받들며 여기저기 돌아다닌다.
  description: 평범한 일꾼 거미다.

tba:63:mob:6307:
  short: 에테르 거미
  long: 이계의 거미가 여기서 성큼성큼 걸으며 여러 세계를 오가고 있다.
  description: 그녀는 현실 속에 나타났다 사라졌다를 되풀이한다. 마법 무기 없이는 그녀를 맞히기 어려울 것 같다.

tba:63:mob:6308:
  short: 노예
  long: 아라크노스의 인간 노예가 여기에서 쉬지 않고 일하고 있다.
  description: >-
    그 노예는 당신을 개의치 않지만, 공격받으면 전사처럼 싸울 것이다. 그는 거미 여제 아라크노스를 섬기고 있지만, 그것이 자발적인 것인지 아니면 홀린 것인지 당신은 확신할 수 없다.

tba:63:mob:6309:
  short: 콰짓
  long: 콰짓 하나가 깜빡깜빡 나타났다 사라졌다 하며 당신을 향해 히죽 웃는다.
  description: 본성은 악마 같지만 그보다는 장난기가 더 많다. 엄지손가락을 빙빙 돌리더니 마법 보물을 만들어 낸다!

tba:63:mob:6310:
  short: 새잡이거미
  long: 새잡이거미가 강력한 턱을 딱딱 부딪친다.
  description: 새잡이거미는 턱이 매우 강력하다.

tba:63:mob:6311:
  short: 은둔자
  long: 은둔자가 여기 앉아 경고한다. '너무 늦기 전에 돌아가라!'
  description: 그는 위장한 행색이 흐트러진 베테랑 전사이다. 하지만 그는 좋은 의도를 가지고 있다.

tba:63:mob:6312:
  short: 지하 감옥지기
  long: 지하 감옥지기가 당신을 바라보며 당신의 영혼이 얼마나 순수한지 궁금해한다.
  description: 당신이 그를 응시하는 동안, 그는 당신의 내면을 더 깊이 꿰뚫어 본다. 오직 티끌 하나 없이 순수한 자만이 이곳에 안전하게 머물 수 있을 것이다.

tba:63:mob:6313:
  short: 수호자
  long: 수호자는 아무리 봐도 제 할 일을 하고 있지 않다.
  description: 그는 하루의 절반을 잠으로 보내는 게으른 부랑자처럼 보인다.

tba:63:mob:6314:
  short: 아라크노스
  long: 거미의 여제 아라크노스가 사악한 미소로 당신을 맞이한다.
  description: >-
    화려한 드레스를 입은 무척 매혹적인 거미다. 그녀는 당신을 자신의 수많은 노예 가운데 하나로 삼으려 유혹한다. 보통 거미와 달리 독니가 없지만, 당신도 곧 깨닫듯 그녀에게는 그런
    것이 필요 없다.

tba:63:mob:6315:
  short: 키린
  long: 키린이 당신에게 온화하게 미소 짓는다.
  description: >-
    그녀는 이 영역에 남은 선의 마지막 보루다. 그녀의 사명은 언젠가 여제의 노예들을 해방하는 것이다. 그녀는 아득한 세월 동안 이곳에 갇혀 있었고, 이제 아라크노스의 악한 힘이
    그녀의 강력한 마법 에너지를 빨아먹고 있다. 그래도 그녀는 악에 맞선 싸움을 결코 포기하지 않을 것이며, 어떤 방식으로든 자신의 일을 이어 갈 것이다.

tba:63:mob:6316:
  short: 어린 용족
  long: 이빨이 없는 용족 하나가 여기서 놀고 있다.
  description: 꽤 작은 용인데, 이 녀석을 죽인다는 생각에 왠지 슬프기까지 하다.

tba:63:mob:6317:
  short: 원로 용족
  long: 좀 자란 용족이 호기심 어린 눈빛으로 당신을 바라보고 있다.
  description: 중간 크기의 용이다 -- 아직 혼자서 아무것도 사냥해 본 적이 없는 것 같은데, 처음이라는 건 다 있는 법이니...

tba:63:mob:6318:
  short: 도적 마하트마
  long: 바보 같은 도적 마하트마가 여기 있다. 온갖 것을 다 훔치고 있다.
  description: 이 전문 도적은 경계심이 없는 여행자를 잡기 위해 함정을 설치해 놓았다.

tba:63:obj:6300:
  short: 검은 열쇠
  long: 그다지 화려하지 않은 검은 열쇠 하나가 여기 놓여 있다.

tba:63:obj:6301:
  short: 아주 날카로운 칼
  long: 아주 날카로운 칼이 여기 놓여 있다.
  extras:
  - text: 아주 날카로운 칼이다. 공기마저 둘로 가를 수 있을 정도다!

tba:63:obj:6302:
  short: 마법사의 모자
  long: 파란 마법사 모자가 여기 놓여 있다.
  extras:
  - text: 파란 천으로 만든 모자다. 매우 편안해 보인다.

tba:63:obj:6303:
  short: 교황의 머리 장식
  long: 종교적 상징이 새겨진 흰색 원뿔형 머리 장식이 여기 놓여 있다.
  extras:
  - text: 권력 있는 세속 인사들이 쓰는 뻣뻣한 머리 장식이다.

tba:63:obj:6304:
  short: 검은 기사의 면갑
  long: 검은 면갑이 여기 놓여 있다.
  extras:
  - text: 머리를 보호하는 면갑으로, 전사에게 알맞다.

tba:63:obj:6305:
  short: 걸쭉한 흰색 물약
  long: 걸쭉한 흰색 물약이 여기 놓여 있다.
  extras:
  - text: 액체 거미줄처럼 보이고 약 냄새가 나는, 역겹고 걸쭉한 흰색 찌꺼기다.
