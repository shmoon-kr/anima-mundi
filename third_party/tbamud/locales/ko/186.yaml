# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:186, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:186:room:18600:
  name: 초보자 지역의 입구
  description: 아아... 초보자 지역의 입구! 당신이 찾고 있던 바로 그 장소다. 준비가 끝났다면 북쪽으로 들어갈 수 있다.
  exits:
    north:
      look: 초보자 지역의 시작 부분이 보인다.
    west:
      look: 그쪽으로 돌아가면 도로로 이어진다... 벌써 겁을 먹었나?

tba:186:room:18601:
  name: 통로의 시작
  description:
  - 당신은 긴 복도에 들어섰다. 여기저기 돌아다니는 생물들의 소리가 들리지만, 소리가 정확히 어디에서 나는지 알 수 없다.
  - 출구는 복도를 따라 동쪽으로, 그리고 입구로 돌아가는 남쪽으로 이어진다.
  exits:
    east:
      look: 그쪽으로 더 이어지는 복도... 정말 흥미롭군!
    south:
      look: 초보자 지역의 입구... 지루하군.

tba:186:room:18602:
  name: 더러운 복도
  description: >-
    복도를 계속 걸어간다. 여기는 별다른 차이가 없지만, 남쪽 문 뒤에서, 그리고 동쪽에서 소리가 나는 것이 분명하다. 벽이 좀 끈적하고 곰팡이가 슬어 있다... 이거, 이 곳을
    청소할 사람을 구하지도 않는 건가? 초보자들은 어떻게 생각할까? 뭐, 동쪽이나 서쪽으로 복도를 계속 따라갈 수 있다.
  exits:
    east:
      look: 그쪽으로 더 이어지는 복도... 정말 흥미롭군!
    south:
      look: 남쪽에 작은 방이 있다... 안에서 무언가 움직이는 소리가 들린다.
    west:
      look: 그쪽으로 더 이어지는 복도... 정말 흥미롭군!

tba:186:room:18603:
  name: 분기점
  description: 자... 두 통로가 만나는 교차점에 도달했다. 북쪽과 동쪽으로는 통로가 밝아지고, 어두운 복도는 남쪽으로 계속 이어진다.
  exits:
    north:
      look: 그쪽으로 더 밝은 복도가 이어진다.
    east:
      look: 그쪽으로 더 밝은 복도가 이어진다.
    south:
      look: 그쪽으로 더 이어지는 복도... 정말 흥미롭군!
    west:
      look: 그쪽으로 더 이어지는 복도... 정말 흥미롭군!

tba:186:room:18604:
  name: 좁은 통로
  description: 좁은 통로는 단조롭고 장식도 없지만 여전히 깨끗하다. 남쪽 끝에서 갑자기 작은 오크 문으로 막혀 있으며, 그 뒤에서 움직임이 들린다...
  exits:
    north:
      look: 넓은 돔형 방.
    south:
      look: 작고 어지러운 방.

tba:186:room:18605:
  name: 어두운 구덩이
  description: >-
    으악... 어둡고 습하며 더러운 구덩이다. 더 나쁜 것은, 구석에서 당신을 바라보고 있는 그 어둡고 습하며 더러운 것이 무엇인지 하는 점이다. 으으... 조금 더 안전한 곳으로
    올라가는 것이 나을지도 모르겠다. 아니면 구석의 그 것과 맞붙을 수 있다고 생각한다면.
  exits:
    up:
      look: 위로 올라가는 사다리를 본다.

tba:186:room:18606:
  name: 작은 방
  description: >-
    흠... 흥미로운 작은 방이다. 아, 그리고 당신을 바라보고 있는 흥미로운 작은 생물도 있다. 당신의 침입에 약간 놀란 표정이다. 북쪽이나 동쪽의 문으로 나갈 수도 있고, 남아
    그 생물을 조금 더 괴롭힐 수도 있다. 여기 아래에는 어떤 종류의 우물도 있는 것 같지만, 꽤 단단한 격자로 덮여 있다.
  exits:
    north:
      look: 거기에도 복도가 더 이어진다... 얼마나 흥미진진한지!
    east:
      look: 거기에도 복도가 더 이어진다... 얼마나 흥미진진한지!
    down:
      look: 사다리가 어둠 속으로 내려간다.

tba:186:room:18607:
  name: 복도의 나머지
  description: 오, 기뻐라! 이 귀찮은 통로가 더 이어진다. 서쪽의 그 문 너머로 더 흥미로운 것이 있을까? 아니면 북쪽이나 남쪽의 복도를 계속 탐색할 수도 있다.
  exits:
    north:
      look: 거기에도 복도가 더 이어진다... 얼마나 흥미진진한지!
    south:
      look: 거기에도 복도가 더 이어진다... 얼마나 흥미진진한지!

tba:186:room:18608:
  name: 대평원 옆의 열린 들판
  description: >-
    드디어 당신은 열린 들판에 도착했다... 다시 신선한 공기를 마실 수 있으니 얼마나 좋은가! 동쪽의 그 습하고 냄새나는 곳으로 돌아갈 수도 있고, 북쪽의 출구를 통해 거대한 들판으로
    이어지는 길을 갈 수도 있다.
  exits:
    north:
      look: 북쪽으로 들판을 가로지르는 길이 보인다.
    east:
      look: 그 젠장할 복도의 끝이 동쪽에 있다.

tba:186:room:18609:
  name: 통로의 끝
  description: 아아... 드디어 복도의 끝이다... 서쪽으로 나가 개방된 공기를 마실 수도 있고, 동쪽으로 돌아가서 아무것도 놓치지 않았는지 확인할 수도 있다.
  exits:
    east:
      look: 거기에는 복도가 더 이어져 있다... 얼마나 흥미진진한가!
    west:
      look: 미드가르드 대평원 근처의 열린 들판이 보인다.

tba:186:room:18610:
  name: 더 밝은 복도
  description: 복도는 동서 방향으로 계속 이어진다... 그리고 서쪽으로 갈수록 밝아지는 것 같다.
  exits:
    east:
      look: 동쪽에는 통로의 구석이 있다.
    west:
      look: 거기에는 복도가 더 이어져 있다... 얼마나 흥미진진한가!

tba:186:room:18611:
  name: 또 다른 구석
  description: >-
    통로의 또 다른 구석이다. 이 곳의 나머지 부분만큼이나, 아니 어쩌면 더 지저분하다. 하지만 동쪽에는 문이 하나 있다... 어디로 이어질지 궁금하다. 아, 그리고 복도는 서쪽과
    북쪽으로 계속 이어진다.
  exits:
    north:
      look: 거기에는 복도가 더 이어져 있다... 얼마나 흥미진진한가!
    east:
      look: 당신은 동쪽의 어수선한 작은 방을 들여다본다.
    west:
      look: 거기에는 복도가 더 이어져 있다... 얼마나 흥미진진한가!

tba:186:room:18612:
  name: 연금술사의 방
  description: >-
    이 방 여기저기에 병과 플라스크가 널려 있지만, 전부 쓸모없는 쓰레기처럼 보인다. 여기서 작업해 온 연금술사가 자신의 예술에 정말로 능숙한 것 같다. 벽에도 수많은 공식과 주문이
    적혀 있다... 종이를 사지 못한 걸까? 북쪽으로 문이 있고, 구석에는 아래로 내려가는 어두운 계단이 있다. 그 옆에는 아마도 읽어야 할 것 같은 큰 표지판이 있다...
  exits:
    north:
      look: 반짝이는 깔끔한 복도!
    west:
      look: 서쪽에는 통로의 구석이 있다.
    down:
      look: 아래로 이어지는 그림자진 계단.
  extras:
  - text: '계단 옆의 표지판에는 이렇게 적혀 있다: 레벨 7 미만이고 혼자이거나, 레벨 4 미만이라면 꺼져! 그렇지 않으면 죽어도 나한테 탓하지 마라...'

tba:186:room:18620:
  name: 통로의 굽은 곳
  description: 이 구석은 다른 곳들과 비슷하다... 다만 남쪽에서 이상한 빛이 나는 것을 볼 수 있다. 출구일지도... 모르겠다.
  exits:
    east:
      look: 통로가 동쪽으로 꽤 멀리 이어진다.
    south:
      look: 그 방향에서 이상한 붉은 빛이 난다.

tba:186:room:18621:
  name: 통로의 T자형 갈림길
  description: 긴 동서 방향의 통로와 남쪽으로 이어지는 복도가 만나는 갈림길이다. 하지만 여기서는 공기가 조금 더 맑은 것 같다. 출구에 가까워지는 느낌이다.

tba:186:room:18622:
  name: 또 다른 구석
  description: >-
    통로가 여기서 북쪽에서 서쪽으로 꺾인다. 벽에는 여전히 처음부터 보아 온 그 역겨운 녹색 곰팡이가 뒤덮여 있고, 당신 주위에서 생물들이 움직이는 소리가 들린다...

tba:186:room:18623:
  name: 복도 구석
  description: >-
    주변에서 생물들이 기어다니는 소리가 들린다... 전혀 편안하지 않은 소리다. 가구라곤 할 것도 없이, 벽은 평범한 회색 벽돌이며 그 위에 녹색 곰팡이(혹은 그런 것)가 자라고
    있다.

tba:186:room:18624:
  name: 또 다른 굴곡
  description: 흠... 통로가 여기서 남쪽으로 꺾인다. 조금만 부주의하면 방향을 잃기 쉽다는 걸 깨닫기 시작한다. 여기서 너무 오래 머무는 건 별로 좋아하지 않을 것 같다...

tba:186:room:18625:
  name: 넓은 방
  description: 통로가 넓은 타원형 방으로 이어진다. 하지만 여기에는 정말로 흥미로운 것이 별로 없다.

tba:186:room:18626:
  name: 긴 동서 방향 통로
  description: >-
    이곳은 동서로 이어지는 길고 좁은 통로다. 벽은 습기가 차 있고 곰팡이와 균류로 뒤덮여 있다. 이 곳은 매우 불건강한 공기가 감돌아 있고, 당신은 여기서 빨리 빠져나가고 싶어지기
    시작한다...

tba:186:room:18627:
  name: 복도 교차로
  description: 여기서 좁은 동서 방향 통로가 북쪽과 남쪽의 더 넓은 통로와 교차한다. 공기는 습하고 부패와 잔해의 냄새가 난다. 정말로 좋은 곳이 아니다...

tba:186:room:18628:
  name: 모퉁이 방
  description: 이 방은 통로가 교차하는 곳보다 조금 더 넓다. 하지만 북쪽 통로에서 약간의 바람이 스며드는 것을 당신은 느낄 수 있다. 다만 냄새는 완전히 나쁘다...

tba:186:room:18629:
  name: 붉은 방
  description: >-
    여기서 붉은 빛이 바닥의 둥근 포털에서 나오는 것을 깨닫는 데 잠시 걸린다. 마치 누군가가 이 방 바닥에 들판을 가로지르는 흙길 그림을 그린 것처럼 보인다. 이상하게도, 그것은
    너무 사실적이어서 그림에서 나오는 들판의 바람을 느낄 수 있다.
  extras:
  - text: 그 안으로 내려갈 수 있을 것 같다... 하지만 당신이 어디에 도착할지, 혹은 돌아올 수 있을지 확신할 수 없다.

tba:186:room:18630:
  name: 분기 통로
  description: 북남 방향 통로가 여기서 동쪽으로 갈라진다. 그쪽에서도 이상한 붉은 빛이 나고, 약한 바람이 불어온다.
  exits:
    west:
      look: 그 방향에서 매우 이상한 붉은 빛이 뿜어져 나온다.

tba:186:room:18631:
  name: 통로
  description: >-
    으악... 이 곳은 정말 역겹다. 벽에서 최대한 멀리 떨어지려 하지만, 통로가 너무 좁아 계속 벽에 부딪힌다. 벽을 뒤덮은 균류가 당신을 붙잡으려 하고 있다는 확신이 거의 든다.

tba:186:room:18632:
  name: 입구
  description: >-
    여기 위는 어둡고, 습하고, 역겹고, 춥다. 게다가 당신 주변에서 온갖 생물들의 소리가 들린다... 그리고 어째서인지 그 소리는 우호적이지 않다. 여기서 어느 정도 경계를 하는
    것이 현명할 것이다... 여기서 무엇을 마주하게 될지 알 수 없으니까.

tba:186:room:18633:
  name: 또 다른 구석
  description: 음... 뭐라고 말해야 할까. 더 많은 균류, 더 많은 기이한 소리, 그리고 북쪽에서 부는 약간의 바람. 임대 계약을 하고 싶지 않을 것 같지...

tba:186:room:18634:
  name: 통로 교차점
  description: >-
    추운, 냄새나는, 그리고 초록색 균류로 뒤덮인 곳... 마치 지난주에 남긴 음식처럼. 게다가 당신은 그것들과 아무런 관련이 없고, 지금 당장 여기서 벗어나고만 싶다.

tba:186:room:18635:
  name: 통로의 굽은 곳
  description: >-
    이곳은 정말 구역질이 날 정도로 역겹다... 분명 무언가(혹은 누군가) 여기서 죽은 냄새가 난다. 당신이 다음이 아니기를 바라지만, 사방에서 들려오는 소리를 들어보면 무언가는
    그 생각에 동의하지 않는 것 같다.

tba:186:room:18636:
  name: 남쪽으로 나가는 갈림길
  description: >-
    동서로 뻗은 통로가 여기서 남쪽으로 갈라진다. 당신 주위에는 죽음의 냄새가 가득하다. 사실 벽에 자란 곰팡이와 균류는 아주 잘 자라고 있지만, 그 외에는... 글쎄... 여기서
    사는 다른 것들에 대해 생각하기 싫다.

tba:186:room:18637:
  name: 또 다른 구석
  description: 통로가 여기서 꺾여 북쪽으로 이어진다. 그 앞쪽 어딘가에 무언가를 감지하지만, 그것이 무엇인지 확신할 수 없다. 이 시점에서 그것이 무엇인지 알고 싶지도 않다.

tba:186:room:18638:
  name: 넓은 방
  description: >-
    이 방에 들어서는 순간 거의 넘어질 뻔했다... 양쪽 벽이 갑자기 사라진 듯한 느낌이 당신을 조금 불안하게 만든다. 갑자기 사방이 취약해진다. 당신의 빛이 닿지 않는 동쪽까지
    방이 뻗어 있어 이 방이 얼마나 큰지조차 알 수 없다...
  exits:
    east:
      look: 방은 어둠 속으로 이어진다...

tba:186:room:18639:
  name: 넓은 방
  description: >-
    당신이 들어오자 동쪽 벽에서 빛이 반짝인다. 벽에 낙서처럼 적힌 글자와 투박한 그림이 보인다. 서쪽으로는 방이 당신의 빛이 닿지 않는 곳까지 이어지며, 어두운 그림자가 당신을
    불안하게 만든다... 거기에 무엇이든 숨어 있을 수 있다. 당신 주위에 벽이 없어 얼마나 취약한 상태인지 뼈저리게 느껴진다.
  exits:
    west:
      look: 방이 당신이 볼 수 있는 한계(그 이상)까지 이어진다...
  extras:
  - text: 글자는 '미노타우로스를 조심하라...'라고 적혀 있는 것으로 보인다.
  - text: 소 머리를 한 남자의 투박한 그림이 있고, 그 옆에 글씨가 적혀 있다.

tba:186:room:18640:
  name: 조각상이 있는 방
  description: >-
    여기서 통로는 작은 방으로 이어진다. 동쪽과 남쪽으로 나가는 출구가 있으며, 북쪽에는 훌륭하고 크며(취향에 맞게 잘 만들어진) 조각상이 하나 놓여 있는 것을 발견한다.
  exits:
    east:
      look: 계단 한 쌍으로 끝나는 긴 복도.
    south:
      look: 복도가 남쪽으로 이어지며, 그곳은 약간 밝아 보인다.
  extras:
  - text: 가까이서 살펴보니 조각상에 작은 명판이 붙어 있다. 또한 얼굴이 매우 익숙해 보인다.
  - text: '그것은 이렇게 적혀 있다: 메이너드, 하클린의 죽음의 광대'

tba:186:room:18641:
  name: 복도
  description: >-
    당신이 복도를 계속 걸어 내려가자, 이 통로 전체의 벽을 따라 깃발, 그림, 그리고 다른 정교한 장식들이 걸려 있는 것을 발견한다. 당신이 들어왔던 초라한 통로와는 매우 다르다.
  exits:
    east:
      look: 복도가 웅장한 대리석 계단에서 끝난다.
    west:
      look: 통로가 작은 방으로 이어진다.

tba:186:room:18642:
  name: 북쪽 계단
  description: >-
    여기서 복도가 높은 돔 지붕을 가진 넓은 방으로 열린다. 이제 당신이 밀폐된 통로를 벗어나자, 계단이 위로 올라가며 그 지역의 전망을 내려다보는 개방형 발코니로 이어지는 것을
    볼 수 있다. 남쪽으로 방이 계속되며, 당신 앞에 있는 것과 일치하는 또 다른 계단이 보인다.
  exits:
    south:
      look: 또 다른 계단과 서쪽과 남쪽으로 나가는 두 개의 통로를 본다.
    west:
      look: 밝은 통로의 입구.
    up:
      look: 개방형 발코니.
  extras:
  - text: 그것들은 매끄럽고 아름다운 대리석으로 만들어져 있다.

tba:186:room:18643:
  name: 발코니
  description: >-
    여기서 밖을 내다보며 주위를 관찰할 수 있다. 방의 돔 주위를 반원 형태로 지어진 이 발코니는 거의 모든 방향으로 밖을 볼 수 있게 해준다. 북쪽 끝으로 걸어 나가 보면, 미드가르드
    북쪽의 대평원이 북쪽으로 뻗어 드래곤헬름 산맥까지 이어지는 것을 볼 수 있다.
  exits:
    south:
      look: 발코니의 남쪽 끝.
    down:
      look: 계단을 내려가면 거대한 돔형 방으로 이어진다.
  extras:
  - text: 매끄럽고 아름다운 대리석으로 만들어져 있다.

tba:186:room:18644:
  name: 밝은 복도
  description: >-
    와! 남쪽의 칙칙한 통로와 비교하면 얼마나 큰 변화인가. 이 방을 이렇게 잘 관리하는 사람은 아마도 초보자를 정말 좋아할 것이다. 벽과 바닥은 깨끗하고, 세련되게 장식되어 있다.
    바닥에 흥미로운 문양이 있는 것도 눈에 띈다.
  exits:
    north:
      look: 조각상이 있는 작은 방.
    south:
      look: 통로가 교차하는 곳.
  extras:
  - text: 하리퀸 길드의 문장인 것 같다.

tba:186:room:18645:
  name: 발코니
  description: >-
    여기서 밖을 내다보며 주위를 관찰할 수 있다. 방의 돔 주위를 반원 형태로 지어진 이 발코니는 거의 모든 방향으로 밖을 볼 수 있게 해준다. 남쪽 끝으로 걸어 나가 보면, 남서쪽으로
    멀리 미드가르드라는 거대한 도시가 보인다.
  exits:
    north:
      look: 발코니의 북쪽 끝.
    down:
      look: 남쪽 계단을 다시 내려가는 곳.
  extras:
  - text: 매끄럽고 아름다운 대리석으로 만들어져 있다.

tba:186:room:18646:
  name: 밝은 복도
  description: >-
    와! 서쪽의 칙칙한 통로와 비교하면 얼마나 큰 변화인가. 이 방을 이렇게 잘 관리하는 사람은 아마도 초보자를 정말 좋아할 것이다. 벽과 바닥은 깨끗하고, 세련되게 장식되어 있다.
    바닥에 흥미로운 문양이 있는 것도 눈에 띈다.
  exits:
    east:
      look: 통로가 거대한 대리석 계단이 있는 돔형 방으로 열린다.
    west:
      look: 어두운 통로가 교차하는 곳.
  extras:
  - text: 하리퀸 길드의 문장인 것 같다.

tba:186:room:18647:
  name: 남쪽 계단
  description: >-
    여기서 복도가 넓은 방으로 열려 있으며, 높은 돔형 천장이 있다. 이제 밀폐된 통로를 벗어나 보니, 계단이 위로 올라가며 그 지역의 전망을 내려다보는 개방형 발코니로 이어지는
    것을 볼 수 있다. 북쪽으로는 방이 계속되며, 당신 앞에 있는 것과 일치하는 또 다른 계단이 보인다.
  exits:
    north:
      look: 북쪽에는 또 다른 계단이 있으며, 서쪽으로는 통로가 있다.
    south:
      look: 남쪽으로는 좁은 통로가 있으며, 끝에는 나무 문이 있다.
    west:
      look: 밝은 복도를 따라 내려가는 길.
    up:
      look: 개방형 발코니.
  extras:
  - text: 그것들은 매끄럽고 아름다운 대리석으로 만들어져 있다.

tba:186:mob:18601:
  short: 구덩이 짐승
  long: 크고 추한 구덩이 짐승이 여기 서서 당신을 주시하고 있다.
  description: 으악... 정말 역겨운 생물이다. 검고 초록색이며 끈적끈적하고, 어디에나 침을 흘리고 있다... 또한 사납게 보인다.

tba:186:mob:18602:
  short: 초보자 괴물
  long: 초보자 괴물이 여기 서서 혼란스러운 표정을 짓고 있다. 죽여라! 죽여라!
  description: >-
    얼굴이 참 기이한 작은 짐승이다. 무해해 보이지만, 절대 알 수 없는 법이다. 키는 약 120센티미터 정도이지만, 꽤 근육질로 보인다... 혹시 도움이 필요할지 물어볼까? 아니야...
    죽여라.

tba:186:mob:18603:
  short: 아기 용
  long: 누군가 기르던 아기 용이 탈출해서 여기저기 냄새를 맡고 있다.
  description: >-
    아이고... 얼마나 귀여운지! 작은 아기 용이다. 길이가 약 90센티미터 정도인데, 정말 안아 죽이고 싶어진다... 아니, 솔직히 말하면 정말 죽이고 싶다. 하지만 기억해라,
    작은 용도 큰 문제가 될 수 있다.

tba:186:mob:18604:
  short: 초보자 경비병
  long: 초보자 경비병은 용이 어디로 갔는지 궁금해하며 여기 있다.
  description: >-
    경비병은 연금술사의 애완동물인 용을 돌보는 일도 맡고 있었지만, 그 일을 잘하고 있는 것 같지는 않다. 그는 당신을 바라보며 말한다. '그 용 본 적 있어? 주인이 나를 찾지
    못하면 내 목을 벨 거야.'

tba:186:mob:18605:
  short: 초보자 연금술사
  long: 초보자 연금술사는 무언가를 만들려고 여기 있다.
  description: 그는 이상하게 생긴, 털이 많은 작은 남자다. 그는 무언가 한 통을 섞느라 정말 바빠 보인다.

tba:186:mob:18606:
  short: 징그러운 벌레
  long: 징그러운 작은 기어다니는 것이 당신의 발밑 바닥을 기어다닌다.
  description: 역겨워! 이 곳을 청소해 준다면 이런 징그러운, 작은, 여섯 다리의 갈색 벌레 같은 해충을 끌어들이지 않았을 텐데.

tba:186:mob:18607:
  short: 좀비가 된 초보자
  long: 매우 야윈 초보자... 좀비처럼 보인다!
  description: 이 남자는 여기 너무 오래 방치되어 있었다... 이제 사람보다는 좀비에 가깝다. 당신은 그를 불쌍하게 느낄 수도 있지만, 그는 공격을 위해 다가오고 있다!

tba:186:mob:18608:
  short: 콰짓
  long: 재미있는 작은 임프 같은 것(아마도 콰짓일지도?)이 여기저기 기웃거리고 있다.
  description: 작고 초록색이며, 대략 사람 모양을 한 생물로 긴 뾰족한 꼬리가 있다. 제대로 살펴볼 틈도 없이 그늘 속으로 다시 달려 들어가 버리기 때문에 단정하기는 어렵다.

tba:186:mob:18609:
  short: 거대한 미노타우로스
  long: 위대한 미노타우로스가 당신이 어떤 맛일지 궁금해하고 있다.
  description: >-
    소 머리를 한 거대한 남자다. 소만큼 강해 보이지만, 그다지 똑똑해 보이지는 않는다. 사실, 곰곰이 생각해 보면... 당신이 지금까지 본 어떤 소보다 훨씬 더 악랄해 보인다...
    그리고 그가 이쪽으로 다가오고 있다!

tba:186:mob:18610:
  short: 어둠의 망령
  long: 어둠의 망령이 그늘 속에 숨어 있다.
  description: 오래전에 세상을 떠난 모험가의 영혼... 그는 여기 숨어 자신의 길을 가로막는 자에게 죽음을 가져올 기회를 기다리고 있다.

tba:186:mob:18611:
  short: 짜증 나는 초보자
  long: 초보자가 여기 와서 당신을 죽도록 짜증나게 하고 있다.
  description: >-
    정말 짜증나는 놈이다! 입을 다물 줄을 모르고, 모든 것에 대해 가장 짜증나는 말을 계속 해대고 있다. 차갑게 담금질된 강철로 그의 입을 막아줘야겠다. 무하하하하하하하하하하하하!

tba:186:mob:18612:
  short: 어리바리한 초보자
  long: 어리바리한 초보자가 여기 있다. 매우 혼란스러운 표정이다.
  description: >-
    정말 바보 같군! 도움말 파일에 답이 있는 질문을 전부 물어볼 테고, 아마도 2, 3번은 더 물어볼 것이다. 이 녀석은 도무지 이해를 못 하는 것 같으니, 차라리 그 고통에서
    벗어나게 해주는 게 낫겠다.

tba:186:mob:18613:
  short: 수다스러운 초보자
  long: 수다스러운 초보자가 여기 있다. 말이 정말 많다.
  description: >-
    글쎄, 적어도 이 여자는 꽤 괜찮아 보인다. 말이 많지만, 친근하고 흥미로운 타입이다. 당신이 볼 수 있는 다른 몇몇과 달리, 자신이 하는 일을 꽤 잘 아는 것 같다.

tba:186:mob:18614:
  short: 길 잃은 초보자
  long: 길 잃은 초보자가 여기 있다. 목적지도 없이 방황하고 있다.
  description: >-
    음... 꽤 오래 돌아다닌 것 같은데, 이번에는 집으로부터 조금 너무 멀리 떠돌아다닌 모양이다. 자신이 어디에 있는지 정확히 모르는 것 같은데, 혹시 그를 도와줄 마음이 있는가?

tba:186:mob:18615:
  short: 똑똑한 초보자
  long: 똑똑한 초보자가 여기 있다. 그는 꽤 자신 있어 보인다.
  description: 여기 모든 것을 잘 파악하고 있는 남자가 있다. 장비도 꽤 좋다. 도움말 파일을 읽어본 모양이지?

tba:186:obj:18601:
  short: 반짝이는 초보자의 검
  long: 반짝이는 초보자의 검이 여기 놓여 주인을 기다리고 있다.

tba:186:obj:18602:
  short: 밝은 초록색 초보자의 조끼
  long: 밝은 초록색 초보자의 조끼가 여기 놓여 안을 몸을 찾고 있다.

tba:186:obj:18603:
  short: 밝은 초보자의 투구
  long: 밝은 초보자의 투구가 헐렁한 머리가 지나가기를 바라고 있다.

tba:186:obj:18604:
  short: 어두운 초보자의 망토
  long: 어두운 초보자의 망토가 여기 놓여 당신을 질식시키기를 바라고 있다.

tba:186:obj:18605:
  short: 초보자의 인장 반지
  long: 초보자의 인장 반지가 여기 먼지 위에 놓여 있다.

tba:186:obj:18606:
  short: 반짝이는 초보자의 단검
  long: 반짝이는 초보자의 단검이 여기 놓여 있으며 찌를 등을 찾고 있다.

tba:186:obj:18607:
  short: 애완 용 목걸이
  long: 누군가의 애완 용이 탈출하여 목걸이를 여기 두고 갔다.

tba:186:obj:18608:
  short: 작은 열쇠
  long: 초보자 문장이 새겨진 열쇠가 여기 있다.

tba:186:obj:18609:
  short: 밝게 빛나는 항아리
  long: 빛나는 액체가 담긴 항아리가 당신의 하루를 환하게 밝히고 싶어 한다.

tba:186:obj:18610:
  short: 미노타우로스의 뿔
  long: 위대한 미노타우로스의 뿔이 여기 놓여 있다.

tba:186:obj:18611:
  short: 악취가 나는 미노타우로스의 가죽
  long: 위대한 미노타우로스의 가죽이 여기 놓여 있다.

tba:186:obj:18612:
  short: 시크한 초보자의 레깅스
  long: 잘 생긴 레깅스 한 쌍이 여기 놓여 있다.

tba:186:obj:18613:
  short: 멋진 초보자 팔 보호대
  long: 쓸 만한 팔 보호대 한 벌이 여기 있다.

tba:186:obj:18614:
  short: 빛나는 초보자의 몽둥이
  long: 정교하게 만들어진 초보자의 몽둥이가 진정한 주인을 기다리고 있다.
