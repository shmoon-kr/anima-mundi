tba:62:room:6200:
  name: 숲속
  description: >-
    오솔길이 여기서 산이 갑자기 솟아나는 지점에서 끝난다. 위를 올려다보니 등반은 험하고 위험하며, 아마도 그만한 노력을 들일 가치가 없을 것이다. 에너지 장벽은 시야에서 사라질
    만큼 산비탈 위로 계속 이어진다. 유일한 출구는 동쪽으로 돌아가는 길뿐이다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6201:
  name: 숲속
  description: >-
    서쪽으로는 바위투성이이고 생기가 없는 산이 높이 솟아 있다. 당신이 걷고 있는 오솔길은 서쪽으로 숲의 끝까지 이어지다가 다시 동쪽으로 돌아간다. 어느 쪽으로 가든, 북쪽 바로
    옆에는 수수께끼 같은, 마법적인, 그리고 뚫을 수 없는 이상한 에너지 장벽이 서 있다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6202:
  name: 숲속
  description: >-
    이 오솔길은 북쪽의 에너지 장벽과 나란히, 이 계곡의 경계를 이루는 서쪽 산까지 이어지는 듯하다. 길을 따라 걷다가 작은 다람쥐를 놀라게 했는데, 그 다람쥐는 두 번 생각하지
    않고 장벽을 뛰어넘었다! 하지만 당신의 손은 여전히 마법적 에너지 장벽에 밀려난다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6203:
  name: 숲속
  description: >-
    북쪽의 오솔길이 여기서 갑자기 끊긴다. 숲을 가로지르는 어떤 종류의 빛나는 에너지 장벽에 막혀 있기 때문이다. 마법적 장벽의 길이를 따라 동서 방향으로 이어지는 사냥꾼의 오솔길이
    있는데, 꽤 많이 다닌 흔적이 보인다. 매우 이상하다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6204:
  name: 숲속
  description: >-
    에너지 장벽은 당신이 걷고 있는 오솔길 바로 북쪽에서 동서 방향으로 숲을 가로지른다. 빛나는 장에서 희미한 윙윙거리는 소리가 나는 듯하여, 숲의 자연스러운 소음은 배경으로 밀려난다.
    잠시 동안, 당신은 그 장이 무언가를 가두고 있는 것인지, 아니면 당신을 가두고 있는 것인지 궁금해진다. 그것이 당신을 궁금하게 만든다...
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6205:
  name: 숲속
  description: >-
    에너지 장은 여기서 갑자기 90도로 꺾여, 점점 짙어지는 숲을 통해 북서쪽으로 시야에서 사라질 때까지 이어진다. 당신이 걷고 있는 오솔길은 마법 장벽의 가장자리를 양쪽으로 따라가며
    휘어진다. 궁금하다... 누가, 혹은 무엇이 이 장을 유지하고 있으며, 어떤 목적을 위해?
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6206:
  name: 숲속
  description: >-
    여기서는 숲이 짙어지고, 놀랍게도 북남 방향으로 뻗어 있는 마법 장벽에 의해 완전히 반으로 잘려 나간 나무를 볼 수 있다. 나무는 건강해 보이며, 중심부를 관통하는 에너지 장의
    영향을 받지 않는 듯하다. 이상하다...
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6207:
  name: 숲속
  description: >-
    마법 에너지 장벽은 지형의 울퉁불퉁함, 가로막는 바위와 나무, 모든 것을 무시하고 곧게 북남 방향으로 뻗어 있다. 북쪽에서 장의 윙윙거리는 소리 위로 희미한 물소리가 들린다.
    당신이 걷고 있는 오솔길은 장벽을 따라 약 1미터 남짓한 거리에서 북쪽과 남쪽으로 이어진다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6208:
  name: 숲속
  description: >-
    여기 들판의 색이 변하여 거의 투명해진다. 너머로 몇 가지 형체를 어렴풋이 알아볼 수 있을 것 같지만, 너무 뚜렷하지는 않다. 북쪽에서 물이 흐르는 소리가 들려오고, 나무 사이로
    숲을 가로지르는 강이 보이는 듯하다. 당신이 서 있는 오솔길은 숲을 남북으로 가로지르며, 그 전체 길이에 걸쳐 에너지 장벽을 따라 이어진다.
  extras:
  - text: >-
      너머로 빈터가 보인다. 장벽이 뒤쪽 지역을 완전히 가리지는 못하는 모양이다. 그 지긋지긋한 것이 당신을 먼저 죽이지 않는다면, 힘으로 밀고 들어갈 수 있을지도 모른다.

tba:62:room:6209:
  name: 강가
  description:
  - >-
    여기 숲을 강이 흐르고 있으며, 물은 맑고 깨끗하다. 에너지 장벽은 강 한가운데까지 뻗어 나간 뒤, 서쪽으로 90도 꺾인다. 그러나 물은 마법 장벽을 통과하는 데 아무런 문제가
    없어 보인다.
  - 강은 여기서 건너기에는 너무 넓고 물살이 빠르다. 남쪽으로 돌아가는 것이 유일한 길인 것 같다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법이 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이루며 비행으로 진입하는 것을 막고
      있다. 또한 땅속 깊이까지 뻗어 있을 것이라고 단정할 수 있다.

tba:62:room:6210:
  name: 그냥 지나가는 중...
  description: >-
    당신이 힘으로 장벽을 밀고 들어가려 해도 에너지 장벽은 별다른 저항을 하지 못하는 듯하다. 정전기 때문에 온몸의 머리카락이 쭈뼛 서 있고, 들고 있는 금속 장비마다 전기 충격이
    몸을 찌른다. 마지막 힘을 다해 밀면, 반대편으로 뚫고 나갈 수 있을 것 같다...

tba:62:room:6211:
  name: 장벽 곁
  description: >-
    서쪽에서는 마법 에너지 장벽이 자글자글 소리를 내며 윙윙거린다. 거의 무해해 보인다. 거의 -- 지면 여기저기에는 그을린 시체들이 널려 있다. 머리통이 꽂힌 몇 개의 기둥이 서쪽을
    향해 서 있으며, 숲의 오솔길을 따라가는 여행객들에게 이곳을 피하라고 경고한다. 공기에는 죽음과 부패의 냄새가 배어 있고, 바람이 전혀 불지 않는다. 당신은 불안함을 느낀다.
  extras:
  - text: >-
      크기로 보아 반인종이다. 이마가 단단한 눈썹뼈로 이어져 내리막을 이루고, 두개골은 꽤 작아 보인다. 직감으로 불에 탄 시체의 발 하나를 확인해 본다. 돼지처럼 갈라져 있다...
      오크다.

tba:62:room:6212:
  name: 숲속의 빈터
  description:
  - >-
    숲속의 여러 오솔길이 작은 빈터에서 교차한다. 흙은 밟혀 단단해졌고, 땅에는 수많은 발자국이 찍혀 있다. 근처에서 새의 지저귐이 갑자기 큰 비명으로 끊기고, 이내 고요해진다.
    오솔길은 잘 다져져 있어, 덤불은 밟혀 평평해지고 나뭇잎은 잘려나와 여행자가 네 방면으로 통행할 수 있을 만큼 공간이 확보되어 있다. 다만 서쪽 오솔길은 꽤나 무성하게 자라난
    듯하다...
  - 당신은 누군가에게 감시당하고 있는 기분이 든다.
  extras:
  - text: 갈라진 발굽, 두 발... 무엇이든 그들은 똑바로 걷는다.

tba:62:room:6213:
  name: 숲속의 오솔길
  description: >-
    북쪽 오솔길은 나무들 사이로 굽이치며, 남쪽의 숲속 빈터에서 북쪽의 강가까지 이어진다. 이 오솔길은 자주 사용된 듯 보이며, 땅에는 수많은 발자국이 보인다. 다시 한번 목 뒤의
    털이 쭈뼛 서고, 누군가에게 엿듣고 있지는 않은지 궁금해진다.

tba:62:room:6214:
  name: 강가
  description: >-
    아름다운 강이 빠르게 흘러간다. 실은 물살이 꽤 위험해 보인다. 강 한가운데에 에너지 장벽의 경계가 보인다... 이쪽으로는 빠져나갈 수 없다. 고개를 들어 보니 새 한 마리가
    머리 위 장벽을 그대로 뚫고 날아가고, 당신은 이 역장의 정체가 궁금해진다. 이 길은 남쪽으로는 숲속까지, 서쪽으로는 강가를 따라 이어진다.

tba:62:room:6215:
  name: 강가
  description: >-
    강은 그 흐름을 계속하며, 양쪽으로 보이는 한계까지 강 중앙을 따라 에너지 장벽이 지나간다. 당신이 있는 오솔길은 물과 숲 가장자리 사이를 따라 동서 방향으로 강을 따라 이어진다.
    다시 한번 당신은 소름이 돋으며, 누군가에게 감시당하고 있다는 그 unmistakable한 느낌을 느낀다. 섬뜩하다.

tba:62:room:6216:
  name: 강가
  description: >-
    서쪽으로 강을 따라 이어지는 이 길을 커다란 바위 덩어리가 가로막고 있는데, 돌아갈 길은 보이지 않는다. 남쪽은 숲이 너무 빽빽하고, 북쪽은 강물이 너무 거세며, 머리 위에는
    마법 장벽이 있다. 그래도 이곳은 꽤 괜찮은 곳이다. 이 길을 많이 오간 흔적만 봐도 알 수 있다. 풀에 남은 자국으로 보아 이곳은 즐겨 쉬어 가는 자리인 것 같다.

tba:62:room:6217:
  name: 숲속의 오솔길
  description:
  - >-
    이 많이 다닌 숲속 오솔길은 남쪽으로 이어진다. 흙바닥에 남은 발자국 사이로 짐승들의 발자국도 몇 개 보인다. 이 오솔길은 사냥꾼들이 다니는 길인 것 같다. 그런데 왜 이런 식으로
    둘러싸여 있는 걸까?
  - 북쪽에는 빈터가 있고, 오솔길은 남쪽으로 계속 이어진다.

tba:62:room:6218:
  name: 숲속의 오솔길
  description:
  - >-
    이 오솔길은 남북으로 뻗어 있다... 누가 봐도 짐승들이 다니는 길이다. 대부분 낙엽수인 나무들과 그 아래 자라는 덤불이 양옆으로 빽빽하게 들어차 있다. 왼쪽 관목에 갓 베인
    자국이 보인다... 칼이나 마체테 같은 날카로운 물건에 베인 것 같다.
  - 낙엽이 바스락거리는 소리에 휙 돌아보지만 아무것도 없다. 무언가가 당신을 지켜보고 있다. 느낌으로 안다. 어디서?

tba:62:room:6219:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 방향을 바꿔 북서쪽으로 꺾인다. 남쪽에 있는 큰 나무에 흥미로운 유물이 하나 있다. 나무에 박혀 있는 녹슨 화살촉이다. 화살이 화살촉 부분에서 부러져 나가고,
    나무가 긁힌 흔적이 있으며 화살촉만 남겨진 것처럼 보인다. 그 외에는 이 숲의 이 구간에 특별히 흥미로운 것은 없어 보인다.

tba:62:room:6220:
  name: 숲속의 오솔길
  description:
  - >-
    이곳은 점점 짙어지는 숲을 동서로 굽이쳐 지나가는 길이다. 길 옆의 풀은 잦은 통행으로 인해 눌려 밟혀 있다. 길은 동쪽으로 이어지고, 서쪽으로는 작은 빈터가 있는 듯하다.
  - 가느다란 소리가 당신의 발걸음을 멈추게 한다. 분명 근처에서 목소리를 들은 것 같은데, 그것이 무엇이든 그것은 공용어를 사용하지 않았다.

tba:62:room:6221:
  name: 작은 빈터
  description: >-
    숲속의 이 작은 빈터 한가운데에는 땅에서 솟아 나온 꽤 큰 바위가 있다. 여기서 동쪽, 서쪽, 남쪽으로 길이 이어진다. 머리 위의 나무들이 하늘을 꽤 효과적으로 가려, 당신 머리
    위에 떠 있는 빛나는 에너지 장벽까지 가려 버린다.
  extras:
  - text: 말라붙은 피가 묻어 있다.

tba:62:room:6222:
  name: 숲속의 오솔길
  description: >-
    여기서 더 작은 북쪽 길이 주요 동서 오솔길에서 벗어나 빈터 쪽으로 이어진다. 주요 길은 나무들을 돌아 동서로 굽이쳐 이어지고, 숲이 앞길에 무엇이 있는지 가려 버린다. 또다시
    누군가 자신을 지켜보고 있다는 이상한 느낌이 든다.

tba:62:room:6223:
  name: 숲속의 오솔길
  description: >-
    오솔길은 여기서 숲을 동서로 가로지른다. 서쪽에서는 주요 길에서 작은 길이 갈라져 나가는 곳이 보인다. 동쪽으로는 또 다른 작은 빈터가 있는 듯하며, 그곳은 꽤 많이 이용되는
    듯하다. 그 방향으로 이어지는 발자국이 많다.

tba:62:room:6224:
  name: 막다른 길
  description: >-
    이 작은 빈터의 땅은 잡초가 모두 제거되어 있고, 여러 개의 크고 인공적으로 만든 소금 핥는 돌이 땅 위에 놓여 있거나 기둥 위에 세워져 있다. 흙에는 수많은 짐승 발자국이 찍혀
    있다 -- 소금 핥는 돌이 주변 수 마일(약 1.6킬로미터) 안팎의 야생동물을 끌어들이는 모양이다. 당신이 사냥꾼이라면, 여기서 숨어 저녁 식사를 기다리기에 좋은 장소라고 생각된다...

tba:62:room:6225:
  name: 숲속의 오솔길
  description: >-
    이 오솔길은 숲의 나뭇잎 사이를 동서 방향으로 지나가며, 나무들을 돌아다니고 완만한 언덕을 오르내린다. 남쪽에 당신을 가두어 두는 에너지 장벽을 제외하면, 이 지역은 고요하고
    평화롭다. 잠시 동안, 당신이 여전히 누군가의 감시를 받고 있는 것은 아닌지 궁금해진다...

tba:62:room:6226:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 꺾여 북쪽과 동쪽으로 이어진다. 멀리서 큰 맹금류가 먹이를 찾아 하늘을 수색하는 비명을 듣는다. 당신 주위의 양치식물들은 가벼운 바람에 살랑살랑 흔들린다. 어째서인지,
    나머지 지역을 감돌던 위협적인 기운은 여기에는 없는 것 같다. 당신은 거의 이완된 느낌을 받는다...

tba:62:room:6227:
  name: 숲속의 오솔길
  description: >-
    숲속 오솔길이 여기서 꺾여 동쪽과 북쪽으로 갈 수 있다. 동쪽으로는 작은 빈터가 보이며, 북쪽으로는 이 오솔길이 숲을 관통하는 훨씬 더 큰 길과 합쳐지는 것 같다. 땅에는 뼈와
    마른 가죽으로 만들어진 깨진 칼 손잡이의 절반이 놓여 있는데, 이제는 쓸모없다. 주인이 지금 당신을 보고 있는 것은 아닌지 궁금해진다 -- 분명 무언가가 보고 있다.

tba:62:room:6228:
  name: 숲속의 오솔길
  description: >-
    이 오솔길은 빈터에서 서쪽으로 이어져 동쪽 근처에서 남북 방향으로 뻗은 길과 교차한다. 오솔길 북쪽의 작은 묘목 윗가지 중 하나에 밧줄이 묶여 있는데, evidently 사용하지
    않은 덫이다. 당신의 마음 한구석에서는 여전히 누군가 자신을 지켜보고 있다는 느낌이 들고, 아드레날린이 뇌로 쏟아져 들어와 번개처럼 전율친다.

tba:62:room:6229:
  name: 숲속의 오솔길
  description: >-
    남북 방향으로 뻗은 오솔길이 숲을 가로지르고, 동쪽으로 작은 오솔길이 갈라져 나간다. 나무들이 하늘에서 오는 시야를 충분히 가려 주지만, 나뭇잎 사이로 뚫린 구멍을 통해 당신을
    가두고 비행으로 탈출하지 못하게 하는 위쪽의 마법 장벽이 보인다. 당신은 약간 갇힌 듯한 느낌을 받는다.

tba:62:room:6230:
  name: 숲속의 오솔길
  description: >-
    두 갈래의 오솔길이 여기서 합류한다. 동서로 이어지는 길에서 벗어나 북쪽으로 뻗은 큰 길이 있다. 서쪽 길은 가장 많이 다닌 흔적이 있고, 동쪽 길은 거의 다닌 흔적이 없다.
    이 주변에는 나무가 적은 것 같다... 어떤 종류의 원시적인 도구로 많은 나무가 베어낸 것처럼 보인다. 이 땅을 개간한 흔적은 특히 동쪽에서 뚜렷하다.

tba:62:room:6231:
  name: 빈터
  description: >-
    이 주변에서는 나무가 베어졌고, 많은 줄기가 날카로운 돌로 파내져 처리된 가죽으로 안쪽을 덮어 거의 물이 새지 않는 통으로 만들어졌다. 악취가 나는 갈색 액체, evidently
    탄닌이, 이 통들 중 많은 것을 채우고 있으며 다양한 동물 가죽 조각에 스며들어 있다. 원시적이지만 쓸 만하다.

tba:62:room:6232:
  name: 숲속의 오솔길
  description: >-
    오솔길이 서쪽으로 넓어지며, 이 길은 이 골짜기를 둘러싼 산의 측면까지 이어진다. 이 일대에는 많은 나무가 베어졌고, 숲이 끝나가는 것이 분명해 보인다. 동쪽으로는 오솔길이 숲의
    깊은 곳으로 이어진다. 여기서는 작은 갈림길이 남쪽으로 뻗어 나간다.

tba:62:room:6233:
  name: 숲속의 오솔길
  description: >-
    이곳은 땅이 점점 더 바위투성이가 된다. 숲의 나무와 다른 식물들은 흙에 뿌리를 내리기 어려운지 듬성듬성 자란다. 바로 서쪽에서 숲이 끝나고, 당신이 걷는 오솔길은 산비탈까지
    곧장 이어진다. 여기서 샛길 하나가 남쪽으로 나 있고, 오솔길은 동쪽으로 다시 울창한 숲속으로 이어진다.

tba:62:room:6234:
  name: 바위 오솔길
  description: >-
    여기서는 땅이 매우 바위투성이라 숲속의 나무가 더욱 드물어진다. 몇몇 덤불이 흙에 뿌리를 내렸지만, 이 지역의 자유로운 이동을 막기에는 충분하지 않다. 오솔길은 서쪽 산 측면에
    있는 것으로 보이는 동굴로 이어지며, 작은 오솔길은 숲의 가장자리를 따라 북쪽으로 뻗어 있다. 동쪽으로는 오솔길이 시야에서 사라질 정도로 숲의 깊은 곳으로 이어진다.

tba:62:room:6235:
  name: 숲속의 오솔길
  description: >-
    당신이 걷고 있는 오솔길은 큰 두 줄기 나무를 돌아 북쪽과 서쪽으로 이어진다. 머리 위를 덮은 초록색 나뭇잎 지붕 덕분에 이 지역은 꽤 어둡고 음산하며, 그 기이한 '시선'을
    느끼는 감각이 다시금 온몸으로 밀려온다.

tba:62:room:6236:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 동서로 이어지며, 남쪽의 넓은 빈터로 향하는 작은 오솔길이 갈라져 나간다. 두 개의 나무 기둥 위에 두개골이 올려져 있어 남쪽으로의 접근을 경고하고 있는데, 그
    모습은 당신을 꽤나 불편하게 만든다. 기이한 일이군...

tba:62:room:6237:
  name: 넓은 빈터
  description:
  - 여기서는 땅이 여러 번 파헤쳐진 흔적이 있고, 흰색 바위들이 기이한 자세로 땅에서 솟아 있다.
  - 묘지다.
  - >-
    이곳이 그들의 시체를 묻는 곳인 모양이다. 구멍을 파고 시체를 던져 넣을 뿐, 땅속에 이미 있는 이전 거주자들을 무시하는 식이다. 얼마나 문명에서 벗어난 짓인가... 당신의 차례가
    왔을 때 이렇게 처리되지는 않기를 바라지만...

tba:62:room:6238:
  name: 숲속의 오솔길
  description:
  - >-
    오솔길이 여기서 갈라진다. 한 갈래는 강물의 요란한 소리가 들리는 북쪽으로, 다른 갈래는 숲이 많이 얇아지는 서쪽으로 이어진다. 눈의 끝자락에서 갑자기 움직임이 느껴져 고개를
    돌린다. 아무것도 없다. 정말로 아무것도 없다.
  - 당신은 누군가에게 쫓기고 있는 건 아닌지 궁금해진다.

tba:62:room:6239:
  name: 강가
  description: >-
    강물은 북쪽으로 빠르게 흐른다. 당신이 서 있는 오솔길은 물가 옆을 따라 서쪽으로, 그리고 남쪽으로는 다시 숲 안으로 이어진다. 서쪽 바로 옆에는 큰 바위가 있어 그 방향의 모든
    통행을 막고 있다. 강 한가운데에서는 에너지 장벽의 '지붕'이 북쪽 '벽'과 만난다. 물은 마법 장벽을 그대로 통과하지만... 장벽은 분명 어떤 물질에는 투과성이 있는 모양이다.

tba:62:room:6240:
  name: 강가
  description: >-
    강은 서쪽 산비탈을 따라 쏟아져 내리며, 수직으로 솟은 바위 돌출부의 거대한 구멍에서 발원한다. 에너지 장벽은 산을 따라 바로 올라와 그 방향으로의 모든 탈출로를 봉쇄한다. 당신이
    서 있는 오솔길은 강 옆을 따라 동쪽으로 이어지고, 남쪽으로는 숲 쪽으로 작은 길이 뻗어 있다.

tba:62:room:6241:
  name: 바위 오솔길
  description: >-
    숲은 바로 서쪽에 있으며, 여기서부터 숲 깊숙이로 이어지는 작은 길이 있다. 그러나 당신이 서 있는 큰길은 북쪽으로 강을 향해, 남쪽으로는 산비탈의 동굴로 이어지는 오솔길이 있는
    곳 근처로 향한다. 여기서는 시선을 사로잡을 만한 것이 별로 없어 보인다...

tba:62:room:6242:
  name: 동굴 입구
  description: >-
    야외의 밝은 빛과 동굴 속의 칠흑 같은 어둠의 차이 때문에 당신의 시야가 거의 가려진다. 동굴 입구에서 썩은 냄새, 씻지 않은 몸의 냄새, 병든 냄새가 뒤섞인 역겨운 악취가 흘러나온다.
    당신의 위가 본능적으로 뒤집히고, 서쪽 터널을 더 깊이 들어가는 대신 동쪽 언덕 아래로 돌아가는 것이 나을지 고민이 된다.

tba:62:room:6243:
  name: 갈림길 터널
  description:
  - >-
    터널은 여기서 갈라지며, 한 갈래는 북쪽으로, 다른 갈래는 서쪽으로 이어진다. 또한 동쪽으로 밖으로 나갈 수 있는데, 고통받는 당신의 코에겐 매우 좋은 생각처럼 보인다. 역겨운
    냄새 때문에 눈물이 나고, 당신은 구역질을 참기 위해 왼손을 꽉 쥐고 있다.
  - 눈을 억지로 뜨자, 북쪽 터널 주위에 칠해진 경고 표지판이 보인다.
  extras:
  - text: 그것들은 오크 문자로 되어 있으며, 모두 경고 기호인 것 같다고 당신은 확신할 수 있다.

tba:62:room:6244:
  name: 터널
  description: >-
    이 동굴 깊은 곳에서 끓어오르는 습기가 바닥을 축축하게 적시고, 그와 함께 가장 끔찍한 냄새가 함께 올라온다. 당신은 다시 한번 생각하게 된다. 코를 위해 서쪽 터널로 내려가는
    여정을 포기하고, 동쪽 동굴 입구로 돌아가는 것이 나을지도 모른다고.

tba:62:room:6245:
  name: 터널
  description: >-
    터널은 여기서 깊게 내려가며, 서쪽으로 꽤 큰 동굴로 이어진다. 안쪽에서 희미한 불빛 몇 개가 보이며, 그 방향에서 무거운 숨소리와 낮은 신음소리가 들린다. 동쪽의 동굴 입구는
    당신에게 너무 멀어 보여 안락하지 않다...

tba:62:room:6246:
  name: 동굴
  description: >-
    썩어가는 고기 더미와 거의 마실 수 있을 것 같은 물잔들이 여기 놓여 있다. 오크들의 식량 저장고다. 당신은 여기 서서, 오크들이 이런 것을 어떻게 먹을 수 있는지 거의 믿을
    수 없다는 듯이 생각한다. 그들은 오크니까, 그들의 본능과 위장 탓이라고 짐작한다. 이상하게도, 그들이 무엇을 구비해 두었는지 일일이 나열할 생각조차 들지 않는다 -- 이 중
    아무것도 가져갈 생각은 없으니까...

tba:62:room:6247:
  name: 동굴
  description: >-
    시체 한 구가 여기 놓여 있다. 동쪽의 비슷한 시체 더미에서 꽤 떨어진 곳이다. 날카롭게 갈아놓은 말뚝과 돌들이 여기저기 편리하게 놓여 있다. 시체가 누워 있는 자세, 손 옆에
    놓인 돌... 이것은 자살 구역이다! 당신은 그 오크를 내려다보며, 그 비틀린 형태의 고통을 이해하게 된다. 참으로 슬프다.

tba:62:room:6248:
  name: 동굴
  description: >-
    여기 시체들이 있다... 시체. 전부 오크이며, 하나같이 무의미한 방식으로 끔찍하게 훼손되어 있다. 팔이 잘려 나간 놈도 있고, 얼굴이라고 부를 만한 것이 하나도 없는 놈도 있다.
    몇몇은 생명의 마지막 불씨로 힘없이 꿈틀거리고, 나머지는 그저 부패해가고 있다. 당신의 머릿속에 싹트는 희미한 공포는 구석에 쌓인 것이 매장 대기 중인 죽은 오크 아이들임을 깨닫는
    순간 만개한다.

tba:62:room:6249:
  name: 동굴
  description: >-
    곰팡이가 피어 악취가 나는 짚과 가죽으로 만든 몇 개의 간이 이불이 작은 화로 주위에 놓여 있다. 거친 도구와 더 거친 손으로 새겨진 나무 컵이 재 근처에 놓여 있는데, 그 안에는
    마시기 싫은 물이 들어 있다. 동쪽 어딘가에서 오크 아이의 울음소리가 들리고, 누군가의 목소리가 급하게 그 소리를 잠재우고 있다. 조심해라, 오크들이여! 모험가들이 여기 있다!
    아이들을 숨겨라!

tba:62:room:6250:
  name: 동굴
  description: >-
    여러 개의 풀 이불이 오래된 불의 잔해 주위에 뭉쳐 있다. 동굴 천장이 기울어져 있어 연기가 지표면 쪽으로 빠져나갈 수 있음을 당신은 알아차린다. 오크들에게는 운이 좋았다. 불
    위에 몇 줄기의 탄 고기가 아직 걸려 있는데, 아무도 돌보지 않고 먹지도 않았다. 발밑 바닥에서 당신은 작고 꼬인 철사 조각을 발견한다. 분명 오크 한 놈의 소중하게 여기는 반지일
    것이다. 그 장신구를 발로 차버리며, 당신은 이 불쌍한 놈들에 대한 연민을 마음에서 밀어내려 애쓴다.

tba:62:room:6251:
  name: 동굴
  description: >-
    당신은 지름이 약 30미터인 꽤 큰 동굴 입구 바로 안에 서 있다. 동물 지방을 태우는 몇 개의 어두운 간이 등불이 주변을 비추고 있는데, 바닥에 썩은 음식과 여기저기 널브러진
    몇 구의 시체를 볼 수 있을 정도다. 당신의 혐오감은 끔찍한 괴물을 보는 순간 공포로 바뀐다. 반은... 음, 반은 뭔가가 되고 반은 오크인 그 괴물이 두 개의 석순 사이로 휙
    지나간다.

tba:62:room:6252:
  name: 동굴
  description:
  - >-
    여기는 오크 족장의 거처임이 틀림없다. 남쪽 벽 근처에는 오래된 전리품인, 훔쳐 온 낡은 인간용 안락의자가 왕좌처럼 놓여 있다. 그 가까이에는 모피를 쌓아 만든 거대한 잠자리가
    있다. 그 옆에는 오크의 보물 더미, 곧 반들반들하게 닦인 구리 동전 더미가 있다. 당신은 쓸모없는 동전 더미를 바라보며 오크 약탈꾼이라는 이미지에 의문을 품는다.
  - 이 오크들은 약탈꾼이 아니라 피해자다.

tba:62:room:6253:
  name: 동굴
  description: >-
    벽 쪽에 많은 수면용 이불이 놓여 있다. 각각은 편안함과 온기를 위해 두꺼운 모피 패드로 만들어져 있다. 많은 이불에는 피와 다른, 무엇인지 식별할 수 없는 물질로 얼룩져 있다.
    주위를 둘러보며 당신의 머릿속에 떠오르는 유일한 일관된 생각은, '알고 싶지 않아... 알고 싶지 않아...'이다.

tba:62:room:6254:
  name: 동굴
  description:
  - >-
    동굴의 이 구역은 거대한 오크 병실이다. 돌연변이가 되거나 몸이 찢어진 오크들이 바닥에 누워 있으며, 조용하고 생기가 없어 보인다. 당신은 생각한다. 만약 그들의 고통을 끝내
    줄 자비가 없다면, 그들에게 시간을 들일 가치조차 없다고.
  - >-
    당신은 자연의 설계가 어떻게 훼손되었는지를 바라보며, 여기서 어떤 힘이 작용하고 있는지 궁금해한다... 장벽, 오크들... 여기서 대체 무슨 일이 일어나고 있는 걸까?

tba:62:room:6255:
  name: 터널
  description: >-
    메일 터널에서 갈라져 나온 이 통로는 이상하다. 벽이 이상할 정도로 매끄러워, 알려지지 않은 힘에 의해 파낸 것처럼 보인다. 끝은 갑자기 짧게 끝나지만, 터널 서쪽 벽에 강철
    문이 하나 내장되어 있다. 아래쪽 터널에서 올라오는 냄새는 여기서는 거의 느껴지지 않는다... 여기는 쉬고 숨을 고르기에 좋은 장소일지도 모른다.
  exits:
    west:
      look: 거대한 강철 문. 힌지나 손잡이가 있는 것 같지 않지만, 문 정중앙에 작은 열쇠 구멍이 하나 있다.

tba:62:room:6256:
  name: 터널
  description: >-
    이 인공 터널은 여기서 북쪽으로 이어지며, 양쪽에 문이 나 있다. 천장에 있는 몇 개의 빛나는 점들이 이 공간을 거의 낮과 같은 밝기로 비춘다. 북쪽에서 고통과 절규가 섞인 끔찍한
    비명 소리가 들려와, 당신은 몸서리를 치며 그쪽으로 향하는 것을 두 번쯤 생각하게 된다.
  exits:
    west:
      look: 평범한 나무 문이다.

tba:62:room:6257:
  name: 침실
  description: >-
    여기는 확실히 취향이 있는 사람을 위해 꾸며진 침실이다. 참나무 한 통을 깎아 만든 서랍장이 놓여 있다. 사실 여기 있는 대부분의 가구에는 그런 '자연스러운 느낌'이 배어 있다.
    침대에는 부드러운 깃털 이불이 깔려 있고, 곁에는 화려한 디자인의 테이블 램프가 있다. 꽤 좋은 곳이다.
  exits:
    east:
      look: 평범한 나무 문이다.

tba:62:room:6258:
  name: 터널
  description: >-
    이 터널은 북쪽으로 넓고 큰 방으로 열리며, 남쪽으로는 문이 있는 곳으로 이어진다. 빛은 맑고 밝아, 깎인 벽면에 도구의 자국이 없다는 사실이 선명하게 드러난다... 마법인가?
    바로 앞의 방은 크고 또한 밝게 비추어져 있어, 거의 임상적인 분위기를 자아낸다. 그 방 어딘가에서 끔찍하고 갈라진 목소리로 비명 소리가 들린다. 좋은 기미가 아니다.

tba:62:room:6259:
  name: 실험실
  description: >-
    여기에는 완비된 수술대가 설치되어 있으며, 온갖 종류의 고정 장치가 갖춰져 있다. 근처 선반에는 멸균된 의료 장비가 일렬로 놓여 있고, 투명한 뚜껑으로 덮여 있다. 바닥에는 배수구가
    있으며, 피를 흘려보내기 위해 그쪽으로 기울어진 경사가 있다. 왠지 당신은 이것이 자발적인 수술 무대라고는 상상할 수 없다...

tba:62:room:6260:
  name: 실험실
  description: >-
    여기에도 또 다른 테이블이 놓여 있고, 온갖 연금술 기구들이 널려 있다. 시험관과 비커, 증류 장치 따위들이다. 물건들은 비싸 보이지만 부피가 크고 연약해서, 들고 다닐 만한
    보석과는 거리가 멀다.
  exits:
    east:
      look: 강철 감방 문이 보인다.

tba:62:room:6261:
  name: 장롱
  description: 좁고 더러운 감방이다. 배설물을 위한 양동이 하나, 음식을 위한 양동이 하나, 그리고 이불 대신 더러운 수건 하나만 있다. 방 전체가 끔찍한 악취로 가득하다.
  exits:
    west:
      look: 강철 감방 문이다.

tba:62:room:6262:
  name: 실험실
  description: >-
    여기에는 작은 우리들이 놓여 있고, 온갖 종류의 설치류가 들어 있다. 자세히 보기 위해 몸을 숙이는데, 평범한 정원 쥐 한 마리가 당신을 향해 으르렁거리며 철창 사이로 당신의
    얼굴을 뜯어먹으려 해 깜짝 놀란다. 쥐의 등에는 혹이 몇 개 나 있고, 기분이 매우 나빠 보인다. 쥐는 덜덜 떨며 운동 기능을 온전히 통제하지 못하는 듯하다. 불쌍한 녀석이다.

tba:62:room:6263:
  name: 실험실
  description: >-
    동쪽 벽 근처의 우리 옆에 선반이 하나 서 있다. 수갑과 족쇄, 채찍, 그리고 그보다 더 심한 도구들이 가득하다. 모두 꽤 많이 사용된 것처럼 보인다. 당신은 소름이 돋아하며
    발걸음을 계속한다.
  exits:
    east:
      look: 강철 감방 문이 보인다.

tba:62:room:6264:
  name: 장롱
  description: 좁고 더러운 감방이다. 배설물을 위한 양동이 하나, 음식을 위한 양동이 하나, 그리고 이불 대신 더러운 수건 하나만 있다. 방 전체가 끔찍한 악취로 가득하다.
  exits:
    west:
      look: 강철 감방 문이 보인다.

tba:62:room:6265:
  name: 실험실
  description: 이곳은 실험실의 남서쪽 구석이다. 장비는 없고, 남쪽 벽에 무거운 철제 수갑 여러 쌍이 매달려 있을 뿐이다. 수갑 아래 바닥에는 작은 혈흔 몇 점이 얼룩져
    있다.

tba:62:room:6266:
  name: 실험실
  description: >-
    북쪽으로 길게 이어지는 꽤 넓은 실험실이다. 방의 동쪽 벽면에는 우리들이 놓여 있다. 여기 있는 금속 테이블은 비어 있지만, 먼지 위로 책이 놓여 있던 흔적이 희미하게 남아 있다.
  exits:
    east:
      look: 강철 감방 문이 보인다.

tba:62:room:6267:
  name: 장롱
  description: 좁고 더러운 감방이다. 배설물을 위한 양동이 하나, 음식을 위한 양동이 하나, 그리고 이불 대신 더러운 수건 하나만 있다. 방 전체가 끔찍한 악취로 가득하다.
  exits:
    west:
      look: 강철 감방 문이 보인다.

tba:62:mob:6200:
  short: 사슴
  long: 사슴이 눈가에 두려움을 머금고 당신을 바라본다.
  description: 정말 잘생긴 사슴이다!

tba:62:mob:6201:
  short: 토끼
  long: 작은 토끼가 여기 있는 잎사귀를 갉아먹고 있다.
  description: 귀가 큰, 털북숭이 작은 설치류다.

tba:62:mob:6202:
  short: 다람쥐
  long: 다람쥐가 당신을 발견하고 나무 주위를 뛰어다닌다!
  description: 작고 갈색의 다람쥐다. 마치 솜으로 감싼 고장력 스프링 같은 모습이다.

tba:62:mob:6203:
  short: 오크 사냥꾼
  long: 오크 사냥꾼이 증오 어린 눈으로 당신을 노려본다.
  description: 분노에 차 있고, 절박해 보이며, 아마도 조금은 아픈 것 같다. 그의 초록색 피부는 확실히 얼룩덜룩하고, 약간 절뚝거리는 듯하다...

tba:62:mob:6204:
  short: 오크 족장
  long: 오크 족장이 당신을 향해 으르렁거린다!
  description: 그는 지도자임을 보여주기 위해 참나무 잎으로 만든 왕관을 쓰고 있다. 전사임을 보여주기 위해 몽둥이를 들고 있다. 두 가지를 모두 얼마나 잘하는지 궁금해진다.

tba:62:mob:6205:
  short: 오크 여성
  long: 당신을 두려워하는 오크 여성이 여기 서 있다.
  description: 당신이 그녀를 노려보자, 그녀는 마치 '나를 죽이지 마라'라고 말하듯 천천히 손을 든다.

tba:62:mob:6206:
  short: 오크 아이
  long: 오크 아이가 어머니를 찾아 발을 동동 구른다.
  description: 그녀는 옷이 너덜너덜하고 온몸에 상처가 덮인 것 같다.

tba:62:mob:6207:
  short: 오크 여성
  long: 임신한 오크 여성이 당신을 피해 도망치려 일어나려 한다.
  description: 그녀는 너무 임산 상태라 빠르게 움직일 수 없다. 당신은 그녀를 쉽게 죽일 수 있다.

tba:62:mob:6208:
  short: 돌연변이 오크
  long: 돌연변이 오크가 여기 누워 있다. 거의 죽어가고 있다.
  description: 그의 몸은 모든 희망을 잃고 비틀려 있다. 그는 죽어가고 있으며, 그것을 막을 수 있는 것은 아무것도 없다.

tba:62:mob:6209:
  short: 돌연변이 오크
  long: 끔찍하게 돌연변이가 된 오크가 여기 서서 횡설수설하고 있다.
  description: >-
    그는 당신의 도착을 알아채지조차 못하는 것 같다. 그저 혼자 중얼거릴 뿐이다. 그의 몸은 오크, 인간, 짐승, 그리고 알 수 없는 것들의 비틀린 잔해로 뒤엉켜 있다.

tba:62:mob:6210:
  short: 엘스타르
  long: 엘프 마법사가 여기 있다. 그는 화가 난 것처럼 보인다.
  description: 그는 당신이 왜 그의 영역을 침범했는지 궁금해하며 당신을 비웃듯 바라본다. 어쨌든... 그를 당신을 파괴하는 것은 그리 어렵지 않을 것이다, 그렇지 않은가?

tba:62:mob:6211:
  short: 엘프 아이
  long: 엘프 아이가 강에 낚싯대를 던지고 있다.
  description: 그는 젊고 순진해 보인다. 당신은 그가 왜 여기에 있는지 궁금해진다.

tba:62:mob:6212:
  short: 돌연변이 괴물
  long: 돌연변이... 괴물이 당신에게 돌진해 온다!
  description: 한때는 오크였을지도 모른다. 하지만 지금은 살아 있는 공포 그 자체로, 당신에게 달려들려고 길을 막는 것은 무엇이든 밀쳐 낸다.

tba:62:mob:6213:
  short: 돌연변이 괴물
  long: 돌연변이... 괴물이 당신을 잡으려 하지만, 공격 범위로 들어올 수 없다!
  description: 언젠가는 오크였을지도 모른다. 하지만 지금은 살아있는 공포 그 자체로, 당신에게 닿기 위해 모든 것을 밀어내며 앞으로 나아간다.

tba:62:obj:6200:
  short: 열쇠
  long: 열쇠가 여기 놓여 있다.
  extras:
  - text: 평범해 보이는 열쇠이다.

tba:62:obj:6201:
  short: 수갑
  long: 철제 수갑이 여기 놓여 있다.
  extras:
  - text: 손에 채우도록 만들어진 큰 강철 수갑이다.

tba:62:obj:6202:
  short: 쇠사슬 한 벌
  long: 쇠사슬 한 벌이 여기 버려져 있다.
  extras:
  - text: 발목에 채우도록 만든 큰 철 수갑이다.

tba:62:obj:6203:
  short: 룬스톤
  long: 글귀가 새겨진 작은 돌 하나가 여기 놓여 있다.
  extras:
  - text: 기이한 문양이 새겨진 작은 조각된 돌이다. 기이한...

tba:62:obj:6204:
  short: 나무 몽둥이
  long: 거친 나무 몽둥이가 여기 놓여 있다.
  extras:
  - text: 크고 투박한 나무 몽둥이다.

tba:62:obj:6205:
  short: 스타크블레이드
  long: 영원한 에너지로 웅웅거리는 칼이 여기 놓여 있다.
  extras:
  - text: 손잡이에 사파이어가 박힌 기이한 칼이다. 끊임없이 웅웅거리며, 만지면 손이 약간 따갑다.
