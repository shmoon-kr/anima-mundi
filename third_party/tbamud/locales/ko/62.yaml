# tbaMUD-derived (third_party/tbamud/NOTICE.md). Korean overlay for zone tba:62, made by
# tools/translate_ko.py (local LLM, glossary.yaml). Same IDs and shape as the base files, only translated
# strings; commands and keywords stay English (D17). Missing entries fall back to English.
tba:62:room:6200:
  name: 숲속
  description: >-
    오솔길은 산이 갑자기 솟아오르는 이곳에서 끝난다. 위를 올려다보니 오르는 길은 험하고 위험해서, 굳이 애쓸 가치는 없어 보인다. 에너지 장벽은 산비탈을 따라 시야 밖까지 계속
    이어진다. 나갈 길은 동쪽으로 되돌아가는 길뿐이다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 지나갈 길은 없어 보인다. 역장은 하늘 높이 솟아 숲 위로 천장을 이루고 있어, 날아서 들어갈 수도 없다. 땅속 깊이까지
      뻗어 있을 것이 틀림없다.

tba:62:room:6201:
  name: 숲속
  description: >-
    서쪽으로는 바위투성이의 생명 없는 산들이 높이 솟아 있다. 당신이 걷고 있는 오솔길은 서쪽으로는 숲이 끝나는 곳까지, 동쪽으로는 왔던 쪽으로 이어진다. 어느 쪽이든 바로 북쪽에는
    그 이상한 에너지 장벽이 서 있다. 속을 알 수 없고, 마법으로 이루어졌으며, 뚫을 수 없는 장벽이다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어갈 수도 없다.
      땅속 깊이까지 뻗어 있을 것이 분명하다.

tba:62:room:6202:
  name: 숲속
  description: >-
    이 오솔길은 북쪽의 에너지 장벽과 나란히 뻗어, 이 계곡의 경계를 이루는 서쪽 산까지 줄곧 이어지는 듯하다. 길을 따라 걷다가 당신이 작은 다람쥐를 놀라게 하자, 다람쥐는 아무
    망설임 없이 장벽을 통과해 뛰어든다! 하지만 당신의 손은 여전히 마법의 역장에 밀려난다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어갈 수도 없다.
      땅속 깊이까지 뻗어 있을 것이 분명하다.

tba:62:room:6203:
  name: 숲속
  description: >-
    북쪽 길이 여기서 갑자기 끊긴다. 숲을 가로지르는, 빛을 내는 무슨 에너지 장벽에 가로막힌 것이다. 마법 장벽을 따라 동서로 짐승이 다니는 길이 나 있는데, 꽤 자주 다닌 흔적이
    보인다. 참으로 이상한 일이다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어갈 수도 없다.
      땅속 깊이까지 뻗어 있을 것이 분명하다.

tba:62:room:6204:
  name: 숲속
  description: >-
    에너지 장벽은 당신이 걷고 있는 오솔길 바로 북쪽에서 동서로 숲을 가로지른다. 빛나는 역장에서 희미한 윙윙거림이 흘러나오는 듯하여, 평소의 숲 소리는 저만치 뒤로 밀려난다. 잠시,
    이 역장이 무언가를 안에 가두려는 것인지, 아니면 당신을 밖으로 막으려는 것인지 궁금해진다. 생각할수록 알 수 없는 일이다...
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 장벽은 하늘 높이 솟아 숲 위로 천장을 이루는 듯하여, 날아서 들어가는 것도 막고 있다.
      땅속 깊이까지 뻗어 있을 것도 분명하다.

tba:62:room:6205:
  name: 숲속
  description: >-
    역장은 여기서 갑자기 90도로 꺾여, 한쪽은 북쪽으로, 한쪽은 서쪽으로 점점 짙어지는 숲을 지나 시야 밖으로 뻗어 나간다. 당신이 걷고 있는 오솔길도 따라 휘어져, 양쪽 방향
    모두 마법 장벽의 가장자리를 따라 돈다. 궁금하다... 누가, 혹은 무엇이 이 역장을 유지하고 있으며, 무슨 목적일까?
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장처럼 덮여 있어, 날아서 들어가는 것도
      막고 있다. 땅속 깊이까지도 뻗어 있을 것이 틀림없어 보인다.

tba:62:room:6206:
  name: 숲속
  description: >-
    이곳은 숲이 짙어지는데, 놀랍게도 남북으로 뻗은 마법 장벽에 완전히 반으로 갈린 나무가 보인다. 나무는 건강해 보이며, 한가운데를 관통하는 역장에도 아무 영향을 받지 않은 듯하다.
    이상하다...
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 지나갈 길은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어가는 것도 막고
      있다. 땅속 깊이까지 뻗어 있을 것도 틀림없어 보인다.

tba:62:room:6207:
  name: 숲속
  description: >-
    마법 에너지 장벽은 움푹 꺼진 땅도, 가로막는 바위와 나무도, 그 무엇도 아랑곳하지 않고 남북으로 곧게 뻗어 있다. 북쪽에서 역장의 윙윙거림 너머로 희미하게 세찬 물소리가 들린다.
    당신이 걷고 있는 오솔길은 장벽에서 겨우 1미터 남짓 떨어져 장벽을 따라 남북으로 이어진다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 통과할 방법은 없어 보인다. 에너지 장벽은 공중으로 높이 솟아 숲 위에 천장을 이룬 듯하여, 날아서 들어갈 수도 없다.
      땅속 깊이까지 뻗어 있을 것이 분명하다.

tba:62:room:6208:
  name: 숲속
  description: >-
    여기서는 장벽의 색이 변해 거의 투명해진다. 그 너머로 몇몇 형체가 어렴풋이 보이는 것 같지만, 그리 뚜렷하지는 않다. 북쪽에서 세찬 물소리가 들려오고, 나무 사이로 숲을 가르며
    흐르는 강이 보이는 듯하다. 당신이 서 있는 오솔길은 숲을 남북으로 가로지르며 에너지 장벽을 따라 줄곧 이어진다.
  extras:
  - text: >-
      너머로 빈터가 보인다. 장벽이 뒤쪽 지역을 완전히 가리지는 못하는 모양이다. 그 지긋지긋한 것이 당신을 먼저 죽이지 않는다면, 힘으로 밀고 들어갈 수 있을지도 모른다.

tba:62:room:6209:
  name: 강가
  description:
  - >-
    이곳에서는 숲 사이로 강이 흐르고, 물은 맑고 깨끗하다. 에너지 장벽이 강 한가운데까지 뻗어 나와, 거기서 서쪽으로 90도 꺾인다. 하지만 물은 마법의 역장을 통과하는 데 아무런
    문제가 없어 보인다.
  - 이곳의 강은 너무 넓고 물살이 너무 빨라 건너기 어렵다. 남쪽으로 돌아가는 것만이 유일한 길인 것 같다.
  extras:
  - text: >-
      장벽 너머로 숲이 계속 이어지는 것이 희미하게 보이지만, 지나갈 길은 없어 보인다. 역장은 하늘 높이 솟아 숲 위로 천장을 이루고 있어, 날아서 들어갈 수도 없다. 땅속 깊이까지
      뻗어 있을 것이 틀림없다.

tba:62:room:6210:
  name: 그냥 지나가는 중...
  description: >-
    당신이 억지로 밀고 나아가자, 에너지 장벽이 당신을 밀어내려 하지만 별 소용이 없는 듯하다. 정전기 때문에 온몸의 털이 곤두서고, 지니고 있는 금속 장비마다 전기 충격이 따끔하게
    몸을 찌른다. 마지막으로 한 번만 더 세게 밀면 반대편으로 뚫고 나갈 수 있을 것 같다...

tba:62:room:6211:
  name: 장벽 곁
  description: >-
    서쪽에서는 마법 에너지 장벽이 저 혼자 지지직거리며 윙윙 울린다. 거의 무해해 보일 정도다. 거의 -- 주위 땅바닥 곳곳에 새까맣게 그을린 시체들이 널려 있다. 꼭대기에 해골을
    얹은 기둥 몇 개가 서쪽을 향해 서서, 숲길을 지나는 여행자들에게 이곳에서 멀어지라고 경고한다. 공기에는 죽음과 부패의 냄새가 배어 있고, 바람 한 점 불지 않는다. 당신은 마음이
    편치 않다.
  extras:
  - text: >-
      크기로 보아 아인종이다. 이마는 비스듬히 기울어 각진 눈썹뼈로 이어지고, 두개골은 꽤 작아 보인다. 문득 짚이는 데가 있어 불에 탄 시체의 발 하나를 살펴본다. 돼지처럼 갈라진
      발굽이다... 오크다.

tba:62:room:6212:
  name: 숲속의 빈터
  description:
  - >-
    숲속의 여러 오솔길이 이곳 작은 빈터에서 만난다. 흙은 밟혀 단단히 다져졌고, 땅에는 발자국이 수없이 찍혀 있다. 가까이에서 새가 지저귀다 꽥 하고 날카롭게 울더니 소리가 뚝
    끊기고, 이내 정적이 흐른다. 길들은 자주 다닌 듯하다. 덤불은 밟혀 납작해졌고 가지는 쳐내져 있어 동서남북 어느 쪽으로든 지나다니기에 넉넉하다. 다만 서쪽 길만은 꽤 우거져
    있다...
  - 누군가 당신을 지켜보고 있는 듯한 기분이 든다.
  extras:
  - text: 갈라진 발굽, 두 발... 정체가 무엇이든, 놈들은 똑바로 서서 걷는다.

tba:62:room:6213:
  name: 숲속의 오솔길
  description: >-
    북쪽 오솔길이 나무들 사이를 굽이쳐 남쪽의 빈터에서 북쪽의 강가까지 이어진다. 이 오솔길은 자주 쓰인 듯 땅에 수많은 발자국이 보인다. 다시 한번 뒷목의 털이 쭈뼛 서고, 누군가
    몰래 감시하고 있는 건 아닌지 궁금해진다.

tba:62:room:6214:
  name: 강가
  description: >-
    아름다운 강이 빠르게 흐르고, 실은 물살이 꽤 위험해 보인다. 강 한가운데에 에너지 장벽이 보인다... 여기서 나갈 길은 없다. 고개를 들어 보니 새 한 마리가 머리 위의 장벽을
    그대로 통과하며 날아가고, 그 힘의 장벽이 대체 무엇인지 궁금해진다. 이 길은 남쪽으로는 숲속까지 이어지고, 서쪽으로는 강가를 따라 이어진다.

tba:62:room:6215:
  name: 강가
  description: >-
    강은 제 물길을 따라 흐른다. 눈이 닿는 데까지 양쪽으로 에너지 장벽이 강 한가운데를 따라 뻗어 있지만, 물의 흐름은 아무 방해도 받지 않는다. 당신이 서 있는 오솔길은 물과
    숲 가장자리 사이로 강을 따라 동서로 이어진다. 다시 한번 몸이 떨리며, 누군가 지켜보고 있다는 틀림없는 느낌이 든다. 섬뜩하다.

tba:62:room:6216:
  name: 강가
  description: >-
    서쪽으로 강을 따라 이어지는 이 길을 커다란 바위 덩어리가 가로막고 있는데, 돌아갈 길은 보이지 않는다. 남쪽은 숲이 너무 빽빽하고, 북쪽은 강물이 너무 거세며, 머리 위에는
    마법 장벽이 있다. 그래도 이곳은 꽤 괜찮은 곳이다. 이 길을 많이 오간 흔적만 봐도 알 수 있다. 풀에 남은 자국으로 보아 이곳은 즐겨 쉬어 가는 자리인 것 같다.

tba:62:room:6217:
  name: 숲속의 오솔길
  description:
  - >-
    사람들이 자주 다닌 이 숲속 오솔길은 남쪽으로 이어진다. 흙바닥에 남은 발자국 사이로 짐승 발자국도 몇 개 보인다. 이 오솔길은 사냥꾼들이 다니는 길인 것 같다. 그런데 왜 이런
    식으로 둘러싸여 있는 걸까?
  - 북쪽에는 빈터가 있고, 오솔길은 남쪽으로 계속 이어진다.

tba:62:room:6218:
  name: 숲속의 오솔길
  description:
  - >-
    이 오솔길은 남북으로 뻗어 있다... 누가 봐도 짐승들이 다니는 길이다. 대부분 낙엽수인 나무들과 그 아래 자라는 덤불이 양옆으로 빽빽하게 들어차 있다. 왼쪽 관목에 갓 베인
    자국이 보인다... 칼이나 마체테 같은 날카로운 물건에 베인 것 같다.
  - 낙엽이 바스락거리는 소리에 휙 돌아보지만 아무것도 없다. 무언가가 당신을 지켜보고 있다. 느낌으로 안다. 어디서?

tba:62:room:6219:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 방향을 바꿔 북쪽과 서쪽으로 꺾인다. 남쪽에 선 큰 나무에 흥미로운 물건이 하나 박혀 있다. 녹슨 화살촉이다. 화살이 촉 부분에서 부러지고, 나무에는 긁힌 자국이
    남았으며, 화살촉만 그대로 남겨진 것처럼 보인다. 그 밖에는 숲의 이 구간에 딱히 눈길을 끄는 것은 없어 보인다.

tba:62:room:6220:
  name: 숲속의 오솔길
  description:
  - >-
    이곳은 점점 울창해지는 숲 사이를 동서로 구불구불 지나가는 길이다. 길가의 풀은 잦은 통행으로 납작하게 짓눌려 있다. 길은 동쪽으로 이어지고, 서쪽으로는 작은 빈터가 있는 듯하다.
  - 희미한 소리에 당신은 그 자리에 얼어붙는다. 분명 근처에서 목소리를 들은 것 같다. 무엇이었든, 공용어로 말하고 있지는 않았다.

tba:62:room:6221:
  name: 작은 빈터
  description: >-
    숲속의 이 작은 빈터 한가운데에는 꽤 큰 바위가 땅 위로 솟아 있다. 여기서 동쪽, 서쪽, 남쪽으로 길이 나 있다. 위로 우거진 나무들이 하늘을 거의 가리고 있어, 머리 위에서
    빛나는 에너지 장벽도 잘 보이지 않는다.
  extras:
  - text: 말라붙은 피가 묻어 있다.

tba:62:room:6222:
  name: 숲속의 오솔길
  description: >-
    여기서 동서로 난 큰 오솔길로부터 좁은 길이 북쪽으로 갈라져 빈터 쪽으로 이어진다. 큰길은 나무들을 돌아 동서로 굽이쳐 이어지고, 숲에 가려 앞에 무엇이 있는지 보이지 않는다.
    또다시 누군가 지켜보고 있는 듯한 이상한 느낌이 든다.

tba:62:room:6223:
  name: 숲속의 오솔길
  description: >-
    오솔길은 여기서 숲을 지나 동서로 이어진다. 서쪽으로는 큰길에서 작은 길이 갈라져 나가는 곳이 보인다. 동쪽으로는 또 다른 작은 빈터가 있는데, 자주 드나드는 곳인 듯하다. 그쪽으로
    이어진 발자국이 많다.

tba:62:room:6224:
  name: 막다른 길
  description: >-
    이 작은 빈터는 초목이 말끔히 치워져 있고, 사람이 만든 커다란 소금 덩어리 여러 개가 땅 위에 놓여 있거나 기둥 위에 얹혀 있다. 흙에는 수많은 짐승 발자국이 찍혀 있다 --
    이 소금 덩어리들이 주변 수 마일 안의 야생동물을 끌어들이는 모양이다. 당신이 사냥꾼이라면 이곳은 숨어서 저녁거리를 기다리기에 좋은 장소일 것 같다...

tba:62:room:6225:
  name: 숲속의 오솔길
  description: >-
    이 오솔길은 우거진 숲 사이로 동서로 나 있으며, 나무들 사이를 굽이돌고 완만한 둔덕을 오르내린다. 남쪽에서 당신을 가두고 있는 에너지 장벽만 빼면, 이곳은 조용하고 평화롭다.
    문득, 아직도 누군가 지켜보고 있는 건 아닐까 하는 생각이 스친다...

tba:62:room:6226:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 꺾여 북쪽과 동쪽으로 이어진다. 멀리서 큰 맹금류가 먹이를 찾아 하늘을 뒤지며 우는 소리가 들려온다. 주위의 양치식물이 산들바람에 살랑살랑 흔들린다. 어째서인지
    이 일대를 감도는 위협적인 기운이 여기에는 없는 듯하다. 마음이 거의 놓일 것만 같다...

tba:62:room:6227:
  name: 숲속의 오솔길
  description: >-
    숲속 오솔길이 여기서 꺾여 동쪽과 북쪽으로 갈 수 있다. 동쪽으로는 작은 빈터가 보이며, 북쪽으로는 이 오솔길이 숲을 관통하는 훨씬 더 큰 길과 합쳐지는 것 같다. 땅에는 뼈와
    마른 가죽으로 만들어진 깨진 칼 손잡이의 절반이 놓여 있는데, 이제는 쓸모없다. 주인이 지금 당신을 보고 있는 것은 아닌지 궁금해진다 -- 분명 무언가가 보고 있다.

tba:62:room:6228:
  name: 숲속의 오솔길
  description: >-
    이 길은 빈터에서 서쪽으로 나가 동쪽 근처의 남북 방향 길과 교차한다. 오솔길 북쪽의 작은 묘목 한 그루의 윗가지에 밧줄이 묶여 있는데, 분명 아직 쓰이지 않은 올무다. 여전히
    어딘가에서 지켜보고 있다는 느낌이 마음 한구석에 남아 있고, 아드레날린이 뇌로 번개처럼 밀려든다.

tba:62:room:6229:
  name: 숲속의 오솔길
  description: >-
    남북으로 뻗은 오솔길이 숲을 가로지르고, 동쪽으로는 작은 샛길이 갈라져 나간다. 나무들이 하늘을 넉넉히 가려 주지만, 나뭇잎 사이로 난 몇 군데 틈으로 머리 위의 마법 장벽이
    보인다. 저것 때문에 날아서 빠져나갈 수도 없다. 어딘지 갇힌 듯한 기분이 든다.

tba:62:room:6230:
  name: 숲속의 오솔길
  description: >-
    두 갈래의 오솔길이 여기서 합류한다. 동서로 이어지는 길에서 북쪽으로 큰 길이 뻗어 나간다. 서쪽 길은 가장 많이 다닌 흔적이 있고, 동쪽 길은 거의 다닌 흔적이 없다. 이 주변에는
    나무가 적은 것 같다... 조잡한 도구로 많은 나무를 베어낸 것처럼 보인다. 땅을 개간한 흔적은 특히 동쪽에서 뚜렷하다.

tba:62:room:6231:
  name: 빈터
  description: >-
    이 일대의 나무들은 베어졌고, 상당수의 줄기는 날카로운 돌로 파내어 무두질한 가죽으로 안감을 입혀 거의 방수되는 통으로 만들어졌다. 보아하니 탄닌 용액인 듯 악취가 나는 갈색
    액체가 이 통들 대부분을 채우고 있으며, 각종 동물 가죽 조각들이 그 안에 적셔져 있다. 투박하지만, 쓸 만하다.

tba:62:room:6232:
  name: 숲속의 오솔길
  description: >-
    서쪽으로 갈수록 오솔길이 넓어지며, 이 골짜기를 둘러싼 산기슭까지 곧장 이어진다. 이 일대는 나무가 많이 베여 나갔고, 숲이 끝나 가는 것이 분명해 보인다. 동쪽으로는 오솔길이
    울창한 숲속으로 이어진다. 여기서 작은 갈림길 하나가 남쪽으로 갈라져 나간다.

tba:62:room:6233:
  name: 숲속의 오솔길
  description: >-
    이곳은 땅이 점점 더 바위투성이가 된다. 숲의 나무와 다른 식물들은 흙에 뿌리를 내리기 어려운지 듬성듬성 자란다. 바로 서쪽에서 숲이 끝나고, 당신이 걷는 오솔길은 산비탈까지
    곧장 이어진다. 여기서 샛길 하나가 남쪽으로 나 있고, 오솔길은 동쪽으로 다시 울창한 숲속으로 이어진다.

tba:62:room:6234:
  name: 바위투성이 오솔길
  description: >-
    이곳은 땅이 몹시 바위투성이라 숲의 나무가 점점 드문드문해진다. 흙에 뿌리를 내린 덤불이 몇 있지만, 지나다니는 데 방해가 될 만큼 빽빽하지는 않다. 오솔길은 서쪽 산비탈의 동굴처럼
    보이는 곳으로 올라가고, 샛길 하나가 숲 가장자리를 따라 북쪽으로 뻗어 있다. 동쪽으로는 오솔길이 숲 깊숙이 이어져 시야에서 사라진다.

tba:62:room:6235:
  name: 숲속의 오솔길
  description: >-
    당신이 걷고 있는 오솔길은 줄기가 둘로 갈라진 큰 나무를 돌아 북쪽과 서쪽으로 이어진다. 머리 위를 덮은 푸른 잎 지붕 때문에 이곳은 꽤 어둡고 음산하며, 누군가 '지켜보는'
    듯한 그 오싹한 느낌이 다시 온몸을 덮쳐 온다.

tba:62:room:6236:
  name: 숲속의 오솔길
  description: >-
    오솔길이 여기서 동서로 이어지며, 남쪽의 넓은 빈터로 향하는 작은 오솔길이 갈라져 나간다. 꼭대기에 두개골을 얹은 나무 기둥 두 개가 남쪽으로 가지 말라고 경고하고 있는데, 보고
    있자니 꽤나 불편해진다. 기이하다...

tba:62:room:6237:
  name: 넓은 빈터
  description:
  - 이곳은 땅이 여러 번 파헤쳐졌고, 흰 바위 몇 개가 기묘한 각도로 땅에서 솟아 있다.
  - 묘지다.
  - >-
    이곳이 그들이 죽은 자를 묻는 곳인 모양이다. 구멍을 파고 시체를 던져 넣을 뿐, 먼저 묻힌 자들은 아랑곳하지 않는다. 얼마나 야만적인가... 당신의 때가 왔을 때 이런 식으로
    처리되지 않기를 바랄 뿐이다...

tba:62:room:6238:
  name: 숲속의 오솔길
  description:
  - >-
    오솔길이 여기서 갈라진다. 한 갈래는 강물의 소리가 요란하게 들려오는 북쪽을 향하고, 다른 갈래는 숲이 많이 옅어지는 듯 보이는 서쪽을 향한다. 눈가에서 갑자기 움직임이 느껴져
    고개를 돌리지만, 아무것도 없다. 정말로 아무것도 없다.
  - 당신은 자신이 미행당하고 있는 건 아닌지 궁금해진다.

tba:62:room:6239:
  name: 강가
  description: >-
    강물은 북쪽으로 세차게 흘러간다. 당신이 서 있는 오솔길은 물가를 따라 서쪽으로, 그리고 남쪽으로는 다시 숲속으로 이어진다. 바로 서쪽에 큰 바위가 있어 그쪽으로는 아예 지나갈
    수 없다. 강 한가운데에서 역장의 '지붕'이 북쪽 '벽'과 맞닿는다. 그런데 물은 마법 장벽을 그대로 통과해 흐른다... 장벽이 어떤 물질은 통과시키는 것이 분명하다.

tba:62:room:6240:
  name: 강가
  description: >-
    서쪽 산비탈로 강물이 쏟아져 내린다. 깎아지른 바위 돌출부 가운데 하나의 표면에 뚫린 커다란 구멍에서 흘러나오는 물이다. 에너지 장벽은 산을 타고 곧장 위로 뻗어 올라가, 그쪽으로
    빠져나갈 길마저 모두 막아 버린다. 당신이 서 있는 오솔길은 강 옆을 따라 동쪽으로 이어지고, 남쪽으로는 숲 가장자리를 따라 작은 길이 나 있다.

tba:62:room:6241:
  name: 바위투성이 오솔길
  description: >-
    숲은 바로 서쪽에 있고, 여기서 숲 깊숙이 들어가는 샛길이 나 있다. 그러나 당신이 서 있는 큰길은 북쪽으로는 강을 향하고, 남쪽으로는 산비탈의 동굴로 올라가는 오솔길 근처까지
    이어진다. 여기서는 눈길을 끌 만한 것이 별로 없어 보인다...

tba:62:room:6242:
  name: 동굴 입구
  description: >-
    바깥의 밝은 빛과 동굴 속 칠흑 같은 어둠의 차이 때문에 눈이 반쯤 먼 것 같다. 동굴 입구에서 썩은 냄새, 씻지 않은 몸 냄새, 병자의 냄새가 한데 뒤엉킨 진하고 역한 악취가
    흘러나온다. 저도 모르게 속이 뒤집히고, 서쪽 터널로 더 깊이 들어가느니 차라리 동쪽 언덕 아래로 돌아갈까 하는 생각이 든다.

tba:62:room:6243:
  name: 갈라지는 터널
  description:
  - >-
    터널은 여기서 갈라져, 한 갈래는 북쪽으로, 다른 갈래는 서쪽으로 이어진다. 동쪽으로 되돌아 밖으로 나갈 수도 있는데, 시달릴 대로 시달린 당신의 코는 그쪽이 아주 좋은 생각이라고
    아우성친다. 악취에 눈물이 나고, 당신은 치미는 구역질을 참으려고 왼손을 꽉 움켜쥔다.
  - 억지로 눈을 뜨자, 북쪽 터널 주위에 그려진 경고 표시들이 눈에 들어온다.
  extras:
  - text: 오크 문자로 되어 있는데, 하나같이 경고 표시가 틀림없어 보인다.

tba:62:room:6244:
  name: 터널
  description: >-
    이 동굴 깊은 곳에서 끓어오르는 습기로 바닥이 미끄럽고, 그 지독한 냄새도 함께 올라온다. 당신은 다시 한번 고민한다. 코를 생각해서 서쪽 터널 아래로 내려가는 건 그만두고,
    동쪽 동굴 입구로 돌아가는 편이 낫지 않을까.

tba:62:room:6245:
  name: 터널
  description: >-
    터널은 여기서 깊게 꺼져 내려가며, 서쪽으로 꽤 큰 동굴이 열린다. 안쪽에서 희미한 불빛 몇 개가 보이는 듯하고, 그쪽에서 거친 숨소리와 낮게 그르렁거리는 소리가 들린다. 동쪽의
    동굴 입구는 마음 놓기에는 너무 멀리 떨어져 있는 것 같다...

tba:62:room:6246:
  name: 동굴
  description: >-
    썩어 가는 고기 더미와 겨우 마실 만한 물이 담긴 잔들이 놓여 있다. 오크들의 식량 창고다. 오크들이 어떻게 이런 걸 먹을 수 있는지, 당신은 그저 어이가 없을 따름이다. 오크니까,
    타고난 본성과 위장 탓이겠거니 싶다. 이상하게도 무엇이 있는지 하나하나 살펴볼 마음조차 들지 않는다 -- 어차피 이 중 무엇 하나 가져갈 리 없으니까...

tba:62:room:6247:
  name: 동굴
  description: >-
    시체 한 구가 여기 놓여 있다. 동쪽의 비슷한 시체 더미와는 꽤 떨어진 곳이다. 날카롭게 깎은 말뚝과 돌들이 손 닿기 좋게 여기저기 놓여 있다. 시체가 누운 자세, 손 옆에 놓인
    돌... 이곳은 자살 장소다! 당신은 오크를 내려다보며, 뒤틀린 그 모습에서 그가 겪은 고통을 헤아린다. 참으로 슬픈 일이다.

tba:62:room:6248:
  name: 동굴
  description: >-
    여기 시체들이 있다... 주검들이다. 모두 오크인데, 하나같이 이유도 없이 끔찍하게 훼손되어 있다. 팔이 잘려 나간 놈도 있고, 얼굴이라고 부를 만한 것이 아예 남지 않은 놈도
    있다. 몇몇은 꺼져 가는 목숨으로 힘없이 꿈틀거리고, 나머지는 그저 썩어 간다. 구석에 쌓인 것이 묻히기를 기다리는 죽은 오크 아이들이라는 것을 깨닫는 순간, 머릿속에 어렴풋이
    싹트던 공포가 활짝 피어난다.

tba:62:room:6249:
  name: 동굴
  description: >-
    곰팡이 핀 짚과 악취 나는 모피로 만든 잠자리 몇 개가 작은 화덕 구덩이 주위에 깔려 있다. 조잡한 도구와 그보다 더 조잡한 손으로 깎은 나무 컵이 잿더미 근처에 놓여 있는데,
    안에 든 물은 도저히 마실 수 없어 보인다. 동쪽 어딘가에서 오크 아이가 칭얼대며 우는 소리가 들리고, 누군가 다급하게 아이를 달래 조용히 시킨다. 조심해라, 오크들이여! 모험가들이
    왔다! 아이들을 숨겨라!

tba:62:room:6250:
  name: 동굴
  description: >-
    풀로 엮은 잠자리 깔개 여러 개가 오래된 모닥불 자리 주위에 모여 있다. 동굴 천장이 비스듬히 기울어 있어 연기가 지표면 쪽으로 빠져나갈 수 있다는 것을 당신은 알아차린다. 오크들에게는
    다행스러운 일이다. 불 위에는 탄 고기 몇 줄이 아무도 돌보거나 먹지 않은 채 아직 걸려 있다. 발밑 바닥에서 당신은 작고 꼬인 철사 조각을 발견한다. 어느 오크가 소중한 반지라고
    여겼던 물건이 틀림없다. 그 장신구를 발로 차버리며, 당신은 이 가련한 것들에 대한 연민을 마음에서 밀어내려 애쓴다.

tba:62:room:6251:
  name: 동굴
  description: >-
    당신은 지름이 30미터쯤 되는 꽤 큰 동굴 바로 안쪽에 서 있다. 동물 기름을 태우는 희미한 간이 등불 몇 개가 주변을 비추는데, 바닥의 썩은 음식과 여기저기 널브러진 시체 몇
    구가 겨우 보일 정도다. 끔찍한 괴물을 보는 순간 혐오감은 금세 공포로 바뀐다. 반은... 음, 반은 뭔지 모를 무언가이고 반은 오크인 괴물이 두 석순 사이로 휙 지나간다.

tba:62:room:6252:
  name: 동굴
  description:
  - >-
    여기는 오크 족장의 거처임이 틀림없다. 남쪽 벽 근처에는 오래된 전리품인, 훔쳐 온 낡은 인간용 안락의자가 왕좌처럼 놓여 있다. 그 가까이에는 모피를 쌓아 만든 거대한 잠자리가
    있다. 그 옆에는 오크의 보물 더미, 곧 반들반들하게 닦인 구리 동전 더미가 있다. 당신은 쓸모없는 동전 더미를 바라보며 오크 약탈꾼이라는 이미지에 의문을 품는다.
  - 이 오크들은 약탈꾼이 아니라 피해자다.

tba:62:room:6253:
  name: 동굴
  description: >-
    벽 가까이에 잠자리용 깔개가 여럿 놓여 있다. 모두 편안하고 따뜻하도록 두꺼운 모피를 덧대어 만든 것이다. 상당수는 피와 정체를 알 수 없는 다른 물질로 얼룩져 있다. 주위를
    둘러보는 당신의 머릿속에 떠오르는 제대로 된 생각은 하나뿐이다. '알고 싶지 않아... 알고 싶지 않아...'

tba:62:room:6254:
  name: 동굴
  description:
  - >-
    동굴의 이 구역은 거대한 오크 병실이다. 돌연변이가 되거나 몸이 망가진 오크들이 생기 없이 조용히 바닥에 누워 있다. 자비를 베풀어 고통을 끝내 줄 생각이 아니라면, 시간을 들일
    가치도 없는 것들이라고 당신은 생각한다.
  - 일그러진 자연의 섭리를 바라보며, 당신은 여기서 어떤 힘이 작용하고 있는지 궁금해진다... 장벽, 오크들... 여기서 대체 무슨 일이 일어나고 있는 걸까?

tba:62:room:6255:
  name: 터널
  description: >-
    본 터널에서 갈라져 나온 이 곁가지 통로는 묘하다. 벽이 이상할 정도로 매끄러워, 알 수 없는 힘이 깎아 낸 것만 같다. 통로는 짧게 뚝 끊기지만, 서쪽 벽에 강철 문이 하나
    박혀 있다. 아래쪽 터널의 냄새도 여기서는 훨씬 덜하다... 쉬면서 숨을 고르기에 좋은 곳일지도 모른다.
  exits:
    west:
      look: 커다란 강철 문이다. 경첩도 손잡이도 없어 보이지만, 문 정중앙에 작은 열쇠 구멍이 하나 있다.

tba:62:room:6256:
  name: 터널
  description: >-
    인공 터널의 이 구간은 여기서 북쪽으로 이어지며, 양쪽에 문이 나 있다. 천장 몇 군데에서 빛이 새어 나와 이곳을 거의 대낮처럼 밝힌다. 북쪽에서 고통과 괴로움에 찬 끔찍한 비명이
    들려와, 당신은 속으로 움찔하며 그쪽으로 가도 될지 다시 생각하게 된다.
  exits:
    west:
      look: 평범한 나무 문이다.

tba:62:room:6257:
  name: 침실
  description: >-
    여기는 확실히 취향이 있는 사람을 위해 꾸며진 침실이다. 참나무 한 통을 깎아 만든 서랍장이 놓여 있다. 사실 여기 있는 대부분의 가구에는 그런 '자연스러운 느낌'이 배어 있다.
    침대에는 부드러운 깃털 이불이 깔려 있고, 곁에는 화려한 디자인의 테이블 램프가 있다. 꽤 좋은 곳이다.
  exits:
    east:
      look: 평범한 나무 문이다.

tba:62:room:6258:
  name: 터널
  description: >-
    이 터널은 북쪽으로 큰 방과 이어지고, 남쪽으로는 문 몇 짝이 있는 쪽으로 뻗어 있다. 빛이 또렷하고 밝아서, 깎아 낸 벽에 연장 자국이 전혀 없다는 것이 분명히 보인다...
    마법일까? 바로 앞의 방은 넓고 조명도 환해서, 거의 병원 같은 냉랭한 분위기를 풍긴다. 그 방 깊숙한 어딘가에서 무언가가 끔찍하게 갈라진 목소리로 비명을 지른다. 좋은 징조가
    아니다.

tba:62:room:6259:
  name: 실험실
  description: >-
    여기에는 완비된 수술대가 설치되어 있으며, 온갖 종류의 고정 장치가 갖춰져 있다. 근처 선반에는 온갖 멸균 의료 기구가 잔뜩 놓여 있고, 투명한 뚜껑으로 덮여 있다. 바닥에는
    배수구가 있고, 피를 흘려보내기 위해 그쪽으로 경사가 지어져 있다. 무슨 이유인지는 모르겠지만, 당신은 이것이 자발적인 수술실이라고는 상상할 수 없다...

tba:62:room:6260:
  name: 실험실
  description: >-
    여기에도 테이블이 하나 놓여 있고, 온갖 연금술 기구가 널려 있다. 유리병과 비커, 증류 장치 따위다. 비싸 보이기는 하지만 부피가 크고 깨지기 쉬워서, 챙겨 갈 만한 보물로는
    영 아니다.
  exits:
    east:
      look: 강철로 된 감방 문이다.

tba:62:room:6261:
  name: 우리
  description: 좁고 더러운 우리다. 배설물을 받는 양동이 하나, 음식을 담는 양동이 하나, 그리고 침대 대신 깔린 더러운 수건 하나뿐이다. 방 전체에 끔찍한 악취가 진동한다.
  exits:
    west:
      look: 강철 감방 문이다.

tba:62:room:6262:
  name: 실험실
  description: >-
    여기에는 작은 철창 우리들이 놓여 있고, 온갖 종류의 설치류가 들어 있다. 자세히 보려고 몸을 숙이자, 아주 작고 흔한 정원 쥐가 당신을 향해 으르렁거리며 철창을 통해 당신의
    얼굴을 뜯어먹으려 하는 것에 매우 놀란다. 그 등에는 혹이 몇 개 나 있고, 기분이 아주 좋은 것 같지 않다. 몸이 덜덜 떨리고, 운동 기능을 완전히 통제하지 못하는 듯하다.
    불쌍한 녀석.

tba:62:room:6263:
  name: 실험실
  description: >-
    동쪽 벽의 철창 우리 근처에 고문대가 서 있다. 족쇄와 쇠고랑, 채찍, 그리고 그보다 더 끔찍한 도구들이 가득하다. 모두 꽤 많이 사용된 흔적이 보인다. 당신은 몸을 부르르 떨고는
    발걸음을 옮긴다.
  exits:
    east:
      look: 강철로 된 감방 문이다.

tba:62:room:6264:
  name: 우리
  description: 좁고 더러운 우리다. 배설물을 받는 양동이 하나, 음식을 담는 양동이 하나, 그리고 침대 대신 깔린 더러운 수건 하나뿐이다. 방 전체에 끔찍한 악취가 진동한다.
  exits:
    west:
      look: 강철로 된 감방 문이다.

tba:62:room:6265:
  name: 실험실
  description: 이곳은 실험실의 남서쪽 구석이다. 장비는 없고, 남쪽 벽에 무거운 강철 족쇄 여러 벌이 달려 있을 뿐이다. 족쇄 아래 바닥에는 작은 핏자국 몇 점도 남아 있다.

tba:62:room:6266:
  name: 실험실
  description: >-
    북쪽으로 길게 뻗은 꽤 넓은 실험실이다. 방 동쪽에는 철창 우리가 놓여 있다. 여기 있는 금속 탁자는 비어 있지만, 먼지 위에 남은 자국으로 보아 한때 책들이 놓여 있었던 것
    같다.
  exits:
    east:
      look: 강철 감방 문이다.

tba:62:room:6267:
  name: 우리
  description: 좁고 더러운 우리다. 배설물용 양동이 하나, 음식용 양동이 하나, 그리고 침대 대신 깔린 더러운 수건 한 장뿐이다. 방 전체에 지독한 악취가 진동한다.
  exits:
    west:
      look: 강철로 된 감방 문이다.

tba:62:mob:6200:
  short: 사슴
  long: 사슴이 눈가에 두려움을 머금고 당신을 바라본다.
  description: 정말 잘생긴 사슴이다!

tba:62:mob:6201:
  short: 토끼
  long: 작은 토끼 한 마리가 여기서 나뭇잎을 갉아먹고 있다.
  description: 큰 귀를 가진 작고 털북숭이 설치류다.

tba:62:mob:6202:
  short: 다람쥐
  long: 다람쥐가 당신을 발견하고 나무 뒤로 쪼르르 돌아 숨는다!
  description: 작은 갈색 다람쥐다. 말하자면 털이 보송보송한, 팽팽하게 감긴 용수철 같다.

tba:62:mob:6203:
  short: 오크 사냥꾼
  long: 오크 사냥꾼이 증오 어린 눈으로 당신을 노려본다.
  description: 분노에 차 있고, 절박해 보이며, 아마도 조금은 아픈 것 같다. 그의 초록색 피부는 확실히 얼룩덜룩하고, 약간 절뚝거리는 듯하다...

tba:62:mob:6204:
  short: 오크 족장
  long: 오크 족장이 당신을 향해 으르렁거린다!
  description: 그는 지도자임을 드러내려고 참나무 잎으로 엮은 관을 쓰고 있다. 전사임을 드러내려고 몽둥이를 들고 있다. 둘 다 얼마나 잘하는지 궁금해진다.

tba:62:mob:6205:
  short: 오크 여성
  long: 당신을 두려워하는 오크 여성이 여기 서 있다.
  description: 당신이 그녀를 노려보자, 그녀는 마치 '죽이지 마세요'라고 말하듯 천천히 두 손을 든다.

tba:62:mob:6206:
  short: 오크 아이
  long: 오크 아이가 어머니를 찾아 발을 동동 구른다.
  description: 그녀는 누더기 차림에, 온몸이 헌데투성이인 것 같다.

tba:62:mob:6207:
  short: 오크 여성
  long: 임신한 오크 여성이 당신을 피해 도망치려 일어나려 한다.
  description: 그녀는 몸 상태가 너무 나빠 재빨리 움직이지 못한다. 당신은 그녀를 쉽게 죽일 수 있을 것이다.

tba:62:mob:6208:
  short: 돌연변이 오크
  long: 돌연변이 오크가 여기 누워 있다. 거의 죽어가고 있다.
  description: 그것의 몸은 회복할 가망이 없을 만큼 뒤틀려 있다. 그것은 죽어 가고 있으며, 무엇으로도 그것을 막을 수 없다.

tba:62:mob:6209:
  short: 돌연변이 오크
  long: 끔찍하게 변이된 오크가 여기 서서 횡설수설하고 있다.
  description: 녀석은 당신이 온 것조차 알아채지 못한 듯하다... 그저 혼자 중얼거릴 뿐이다. 그 몸은 오크와 인간, 짐승, 그 밖에 정체 모를 것들이 뒤틀려 엉킨 잔해
    같다.

tba:62:mob:6210:
  short: 엘스타르
  long: 엘프 마법사가 여기 있다. 그는 화가 난 것처럼 보인다.
  description: 그는 당신이 왜 자신의 영역을 침범했는지 궁금해하며 당신을 거만하게 바라본다. 상관없다... 그가 당신을 없애는 것쯤은 그리 어렵지 않을 테니, 그렇지 않은가?

tba:62:mob:6211:
  short: 엘프 아이
  long: 엘프 아이가 강에 낚싯대를 드리우고 있다.
  description: 그는 젊고 순진해 보인다. 당신은 그가 왜 여기에 있는지 궁금해진다.

tba:62:mob:6212:
  short: 돌연변이 괴물
  long: 돌연변이... 괴물이 당신에게 돌진해 온다!
  description: 한때는 오크였을지도 모른다. 하지만 지금은 살아 있는 공포 그 자체로, 당신에게 달려들려고 길을 막는 것은 무엇이든 밀쳐 낸다.

tba:62:mob:6213:
  short: 돌연변이 괴물
  long: 돌연변이... 괴물이 당신을 잡으려 하지만, 공격 범위로 들어올 수 없다!
  description: 한때는 오크였을지도 모른다. 하지만 지금은 살아 있는 공포 그 자체로, 당신에게 달려들려고 앞을 가로막는 것은 무엇이든 밀쳐 낸다.

tba:62:obj:6200:
  short: 열쇠
  long: 열쇠가 여기 놓여 있다.
  extras:
  - text: 평범해 보이는 열쇠다.

tba:62:obj:6201:
  short: 쇠고랑 한 벌
  long: 쇠고랑 한 벌이 여기 놓여 있다.
  extras:
  - text: 손에 채우도록 만들어진 큰 강철 수갑이다.

tba:62:obj:6202:
  short: 족쇄 한 벌
  long: 족쇄 한 벌이 버려진 채 여기 놓여 있다.
  extras:
  - text: 발목에 채우도록 만든 큰 쇠 족쇄다.

tba:62:obj:6203:
  short: 룬스톤
  long: 글귀가 새겨진 작은 돌 하나가 여기 놓여 있다.
  extras:
  - text: 기이한 문양이 새겨진, 작게 깎아 만든 돌이다. 이상하다...

tba:62:obj:6204:
  short: 나무 몽둥이
  long: 거친 나무 몽둥이가 여기 놓여 있다.
  extras:
  - text: 커다란 나무 몽둥이다.

tba:62:obj:6205:
  short: 스타크블레이드
  long: 영원한 에너지로 웅웅거리는 칼이 여기 놓여 있다.
  extras:
  - text: 칼자루 끝에 사파이어가 박힌 기이한 칼이다. 끊임없이 웅웅거리며, 만지면 손이 조금 따끔거린다.
